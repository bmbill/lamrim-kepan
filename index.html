ll,"af":"66a","st":1666,"et":null,"消文":[{"文":"共下士包含兩樣：一是道前基礎，二是有了基礎之後開始修習，修習又分下、中、上的次第。"},{"文":"翻開本論頭上的科判，從第一頁的造者根源清淨、法本身的清淨，回憶一下。"}],"延伸":[],"逐字稿":[{"t":"66A 27:46","b":[["s","這個下面我們繼續下去，繼續下去。那麼第六卷、第六卷，第六卷是屬於中士道、中士道。在我們沒有說中士道之前，我們重新把前面那個共下士溫習一下。這個共下士包含了兩樣東西，這個共下士包含了兩樣東西：第一個是道前基礎，就是修道的時候，需要一個基礎；然後有了這個基礎以後，然後開始修習。修習的時候，又把這個道分成功幾個次第：下、中、上，下、中、上。現在我們不妨回過頭來，翻開本論頭上那個科判，頭上那個科判。那個科判當中，我們從最第一頁看起。第一頁看起，這個關於第一個，造者的根源清淨，我們回憶一下；法本身的清淨，回憶一下。"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/001.mp3"},{"文":"把學到的內容安進總綱，«信心恭敬»增強，煩惱淨化。","口譯":"本段大意：學到現在，回頭把內容和最初的總綱對比，會發現總綱裡原來有這樣殊勝的內涵；由此信心增強、恭敬心增加、煩惱淨化，三者輾轉互為因果。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"66B 00:07","頁":null,"af":"66b","st":7,"et":84,"消文":[],"延伸":[{"題":"信心恭敬","組":[{"題":"內容安進總綱，才見殊勝","說":[{"類":"立","文":"把現在學到的內容安進當初的總綱，你會發現：原來前面所說的裡邊，還有這樣殊勝的內容。"}]},{"題":"信心、恭敬、淨化，輾轉互為因果","說":[{"類":"因","文":"信心、恭敬心增強，這個力量幫助你淨化煩惱；煩惱淨化了，信心增強，恭敬心也自然提高。"}]}],"說":[{"類":"立","文":"把現在學到的內容安進當初的總綱，你會發現：原來前面所說的裡邊，還有這樣殊勝的內容。"},{"類":"因","文":"信心、恭敬心增強，這個力量幫助你淨化煩惱；煩惱淨化了，信心增強，恭敬心也自然提高。"}],"複習":true,"af":"66b","st":7}],"逐字稿":[{"t":"66B 00:07","b":[["s","然後呢根據前面所說的道理，想一下，我們學到現在為止，所講的內容，前後這樣地一觀察、對比的話，我想我們大家會生起一個認識。什麼認識？當時前面告訴我們這個總綱，現在把這個內容安進去的時候，你那時候發現：啊！原來當初前面所說這個裡邊的這個內涵，還有這樣殊勝的內容啊！那個時候你有了這樣的認識，你就信心增強，恭敬心增加，煩惱淨化，而這三個東西是輾轉互為因果的，輾轉互為因果的。你信心、恭敬心增強的話，這個力量增加是幫助你淨化煩惱；你煩惱淨化的話，你那個信心增強，恭敬心也自然提高。"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/002.mp3"},{"文":"先曉得«大綱»，照著次第走上去，是唯一正確的直路。","口譯":"本段大意：一開頭不認識大綱，隨便碰到一個法門就跑進去，雖然究竟也能到，卻走遠路、吃冤枉苦頭；先知大綱再依次第走，才是正確的直路。圓滿的綱要必有次第，了解最高最圓滿的，會策動你從最下的入門修起。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"66B 01:24","頁":null,"af":"66b","st":84,"et":224,"消文":[],"延伸":[{"題":"大綱","組":[{"題":"不識大綱，走遠路吃冤枉苦","說":[{"類":"破","文":"一開頭不認識這個大綱，隨便碰到一個跑進去，就究竟意義說一定得到，但走的是遠路，不曉得吃多少冤枉苦頭。"},{"類":"立","文":"先曉得大綱，照著次第走上去，這是唯一正確的直路，而且是最好、最圓滿的。"}]},{"題":"圓滿綱要，必有次第","說":[{"類":"立","文":"圓滿的綱要走上去，有它必然的次第；了解最高、最圓滿的，會策動你去修行。"},{"類":"因","文":"最下面的入門路，會增強你向上努力的淨信之心、淨除障礙、增強能力，彼此有必然的關係。"},{"類":"下手","文":"每講到一個地方，一定要把全面的綱要在腦筋裡提起來。"}]}],"說":[{"類":"破","文":"一開頭不認識這個大綱，隨便碰到一個跑進去，就究竟意義說一定得到，但走的是遠路，不曉得吃多少冤枉苦頭。"},{"類":"立","文":"先曉得大綱，照著次第走上去，這是唯一正確的直路，而且是最好、最圓滿的。"},{"類":"立","文":"圓滿的綱要走上去，有它必然的次第；了解最高、最圓滿的，會策動你去修行。"},{"類":"因","文":"最下面的入門路，會增強你向上努力的淨信之心、淨除障礙、增強能力，彼此有必然的關係。"},{"類":"下手","文":"每講到一個地方，一定要把全面的綱要在腦筋裡提起來。"}],"複習":true,"af":"66b","st":84}],"逐字稿":[{"t":"66B 01:24","b":[["s","那麼為什麼我們要說那個大綱？大家還記得吧？就是假定你說一開頭你不認識這個大綱，你隨便碰到一個跑進去的話，這個時候吃了一個大虧。就究竟的意義來說，你只要碰到，一定得到，但是走的路卻是遠路，不曉得多遠啊！不曉得吃多少冤枉苦頭！所以你一開頭先曉得這個大綱，照著這個次第走上去的話，那不曉得占多少便宜，這是唯一的正確的直路！而且是最好的、最圓滿的，這個彼此之間，有這樣的一個重要的關鍵在。所以我們每講到一個地方，你們一定要把這個全面的這個綱要，那個時候擺在腦筋裡提起來，提起來。"]]},{"t":"66B 02:21","b":[["s","除了有它這樣一個特色以外，還有因為它這個圓滿的綱要之所以圓滿的話，走上去還有它必然的次第。當你這樣提的時候，一步一步走上去的時候，自然而然說，啊！你現在開始慢慢地走上去了，因為你了解了最高、最圓滿的，所以它會策動你去修行。當你要修行的時候，一定要找到入門的時候，那個入門就是最起碼的。而開始你走這個最下面路的時候，會增強你要向上努力的這個淨信之心，淨除你的障礙，然後呢增強你的能力，這個彼此之間，有這樣子的一個必然的關係，彼此間就有這樣必然的關係。所以我們一開頭，一定要把這個圓滿的綱要，有這樣的認識作為先。然後呢次第把這個內容一步一步地來說明，然後呢了解了，步步踏實地就做下去，這個是主要的概念。"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/003.mp3"},{"文":"講要怎麼講，聽要怎麼聽，«如何說聞»兩種殊勝相應正法。","口譯":"本段大意：有了殊勝的造者與殊勝的法，還要講聞的條件才能相應。佛經中佛總說「諦聽諦聽，善思念之」，聽者如理聽、佛如理講，一座之中便有無數人得果。若不認識這點，圓滿的正法碰到身上，只換一塊糖，甚至換得鐵丸烊銅。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"66B 03:44","頁":null,"af":"66b","st":224,"et":433,"消文":[],"延伸":[{"題":"如何說聞","組":[{"題":"諦聽諦聽，善思念之","說":[{"類":"例","文":"大小乘經中，佛一定說「諦聽！諦聽！善思念之」；大家認真聽，佛如理講，一座當中動不動就是人天百萬計得果。"},{"類":"回扣","文":"為什麼？在「如何說聞兩種殊勝相應正法」當中說得清清楚楚。"}]},{"題":"圓滿正法，莫換一塊糖","說":[{"類":"喻","文":"這麼究竟圓滿的法碰到你身上，換一點糖吃，已經可惜；弄得不好，換來的是鐵丸、烊銅。"},{"類":"破","文":"聽了又不在乎，乃至於輕慢毀謗，那是下地獄。"}]},{"題":"作弟子應有的態度","說":[{"類":"下手","文":"已經認識而還沒有如實行持，先從那個地方努力；還沒有認識的，這一點必定要把握住。"},{"類":"立","文":"原則上策勵我們：現在修學的人，作弟子應有的態度，這一點太重要。"}]}],"說":[{"類":"例","文":"大小乘經中，佛一定說「諦聽！諦聽！善思念之」；大家認真聽，佛如理講，一座當中動不動就是人天百萬計得果。"},{"類":"回扣","文":"為什麼？在「如何說聞兩種殊勝相應正法」當中說得清清楚楚。"},{"類":"喻","文":"這麼究竟圓滿的法碰到你身上，換一點糖吃，已經可惜；弄得不好，換來的是鐵丸、烊銅。"},{"類":"破","文":"聽了又不在乎，乃至於輕慢毀謗，那是下地獄。"},{"類":"下手","文":"已經認識而還沒有如實行持，先從那個地方努力；還沒有認識的，這一點必定要把握住。"},{"類":"立","文":"原則上策勵我們：現在修學的人，作弟子應有的態度，這一點太重要。"}],"複習":true,"af":"66b","st":258}],"逐字稿":[{"t":"66B 03:44","b":[["s","那麼現在我們重新溫習一下說，這個兩樣東西有了以後，我們然後有了這樣殊勝的聖者來指導我們，而又把最好的法告訴我們，我們怎麼樣能夠跟它相應呢？哦，它還要條件，喔，說啊，講要怎麼講，聽要怎麼聽，講完、聽完了，要怎麼樣，那個時候才能夠跟這個殊勝的法相應，這個道理都講過了。"]]},{"t":"66B 04:18","b":[["s","這個裡邊重新提一個公案，來對我們策勵一下。所以這個公案，實際上是非常多、非常多，但是所有這些公案當中，這個特質是共同的。什麼公案？佛經。你看哪！不管是大乘經、小乘經，那麼或者是佛無問自說的，或者是有人啟發的，極大部分都是有人啟發的。在這種狀態，佛一定說：「諦聽！諦聽！善思念之。」就這麼兩句話，簡單的幾個字。而這裡的幾個字，有特別的意義。他完了以後，大家認真地聽，佛就如理地去講。講完了以後，欸！多少人，大乘的，多少人得無生法忍，乃至於發大菩提心，乃至於什麼，小乘的是證羅漢果，然後，往往動不動就是人天百萬計的。就在一座當中喔！佛講一座法，聽者聽一座，就馬上證得這麼大的果喔！這個為什麼原因？在這個「如何說聞兩種殊勝相應正法」當中，說得清清楚楚。"]]},{"t":"66B 05:52","b":[["s","所以諸位，如果已經認識了，而還沒有如實行持，先從那個地方努力去。如果還沒有認識的話，這一點認識非常重要！如果你不認識的話，那始終非常可惜，這麼究竟圓滿的法，碰到你身上，換一點糖吃。換糖吃，多多少少還甜了你嘴巴喔，還換它一塊糖哦！我們弄得不好的，換得來是鐵丸、烊銅喔！這是千真萬確的。這麼圓滿的正法，你聽了又不在乎，乃至於你要輕慢心毀謗它，對不起，你這下地獄哦！這麼好的東西，換糖已經是可惜了，何況是把你送到地獄去。所以關於這個部分，如果還沒有正確認識的人，這個第一點我們必定要把握住。所以怎麼樣去聽這個法，怎麼樣講這個法；老師是怎麼樣，弟子是怎麼樣。當然，原則上面在策勵我們說，我們現在修學的人，作弟子應有的態度，這一點太重要了，這一點太重要了！"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/004.mp3"},{"文":"把«弟子之相»做對了，這個就是弘法。","口譯":"本段大意：有同修向老和尚懺悔，承認以前自以為有理的事其實錯了。我們無始無明，所想的道理沒有一個不是歪理；人家告訴你聽不進，就是不懂講聞之理、弟子之相不圓滿。自己都不懂就去講，如同跌在地上去救人；先把弟子做對，法在身上具體相應，就是真正的弘法。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"66B 07:13","頁":null,"af":"66b","st":433,"et":565,"消文":[],"延伸":[{"題":"弟子之相","組":[{"題":"自以為有理，其實是歪理","說":[{"類":"例","文":"一位同修跑到老和尚前懺悔：「我以前錯了！」他做了不合法的事，還以為很有道理。"},{"類":"立","文":"我們無始為無明所執，每個人平常想的道理，沒有一個例外都是歪理；人家告訴你聽不進，就是不懂如何講聞，弟子之相沒有圓滿。"}]},{"題":"自己跌在地上，怎救別人","說":[{"類":"喻","文":"自己跌在地上半死不活要去救別人；不懂醫卻開藥給人吃，那是活生生把人害死。"},{"類":"破","文":"目前不要輕易隨便開口講弘法。"}]},{"題":"法在身上相應，就是弘法","說":[{"類":"立","文":"把弟子做對了，這個就是弘法：法在你身上如實相應，變成具體的表現，那就把佛法真正弘揚了。"},{"類":"因","文":"這樣去做，你得到功德，法就在世間安住。"}]}],"說":[{"類":"例","文":"一位同修跑到老和尚前懺悔：「我以前錯了！」他做了不合法的事，還以為很有道理。"},{"類":"立","文":"我們無始為無明所執，每個人平常想的道理，沒有一個例外都是歪理；人家告訴你聽不進，就是不懂如何講聞，弟子之相沒有圓滿。"},{"類":"喻","文":"自己跌在地上半死不活要去救別人；不懂醫卻開藥給人吃，那是活生生把人害死。"},{"類":"破","文":"目前不要輕易隨便開口講弘法。"},{"類":"立","文":"把弟子做對了，這個就是弘法：法在你身上如實相應，變成具體的表現，那就把佛法真正弘揚了。"},{"類":"因","文":"這樣去做，你得到功德，法就在世間安住。"}],"複習":true,"af":"66b","st":433}],"逐字稿":[{"t":"66B 07:13","b":[["s","說到這裡，這個前兩天有一位同修，我非常歡喜。他跑到老和尚前面去懺悔，說：「啊，我以前錯了！」他做了一件不合法的事情，他還以為很有道理啦！說了很多道理。他現在學了那個教法，這是我們應該有的。要不然我們雖然在這個地方，我們懂得了一點點；他不是沒道理，他還是有他的道理，但是個歪理。他倒不是故意歪理，就是說我們無始以來為我們的無明所執，我們每一個人平常想的道理，沒有一個人例外的都是歪理。因為我們沒有得到完整的教法，總覺得我的對啊！就是這樣。人家來好好地告訴你，你聽不進，說了一大堆。這個就是不懂得如何講聞的道理，弟子之相沒有圓滿。"]]},{"t":"66B 08:05","b":[["s","乃至於弟子之相都沒有圓滿，自己道理都不懂，要跑得去跟人家講。唉呀，天哪！你自己都不懂，你怎麼個講呀！前面告訴我們，我們要求皈依的人，他自己一定要解決了。你現在自己跌在地上，半死不活，你要去救別人，你怎麼個救法！那是跌在地上救別人的話，還是這樣啊；現在我們照著作一個醫生，要去把那個藥開給別人吃的話，那不是活生生把人家害死嗎？所以這個地方是說，雖然重要的是告訴我們弟子是何等的行相，同樣也告訴我們，我們目前不要輕易地隨便開口講弘法。而是我們把我們的弟子做對了，這個就是弘法。為什麼？因為這個法在你身上面如實相應！它本來是一個道理，現在變成功你身上，變成功實體地、具體地表現了，那不是把那個佛法真正地弘揚了嗎？你只要能夠這樣去做的話，你得到功德，法就世間安住，這個是我們必須要的。啊！那麼有了這個，那個下面才正式開始啊！說現在可以了，現在可以來教了。"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/005.mp3"},{"文":"修學佛法，外緣«善知識»，內因如何與他相應。","口譯":"本段大意：修學佛法分內因、外緣兩部分，缺一不可。外緣是善知識，內因是自己如何與善知識相應。前面講依止善知識：善知識的行相、學者的行相、如何依止、依止的勝利與不依止的過患，這幾條綱要要認真把握；越學越能認識綱要的內涵，一提就能把握重點而相應。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"66B 09:25","頁":null,"af":"66b","st":565,"et":648,"消文":[],"延伸":[{"題":"善知識","組":[{"題":"外緣善知識，內因自相應","說":[{"類":"立","文":"修學佛法一個內因、一個外緣，兩樣必不可少：外緣是善知識，內緣是自己跟善知識如何相應。"},{"類":"回扣","文":"道的根本是依止善知識：善知識的行相、學者的行相、如何依止、依止的勝利、不依止的過患。"}]},{"題":"把握綱要，提起即相應","說":[{"類":"下手","文":"這幾條要很認真地把握住綱要。"},{"類":"因","文":"越了解得多，對綱要內涵認識越正確；隨便一提就把握住重點，就能夠相應。"}]}],"說":[{"類":"立","文":"修學佛法一個內因、一個外緣，兩樣必不可少：外緣是善知識，內緣是自己跟善知識如何相應。"},{"類":"回扣","文":"道的根本是依止善知識：善知識的行相、學者的行相、如何依止、依止的勝利、不依止的過患。"},{"類":"下手","文":"這幾條要很認真地把握住綱要。"},{"類":"因","文":"越了解得多，對綱要內涵認識越正確；隨便一提就把握住重點，就能夠相應。"}],"複習":true,"af":"66b","st":565}],"逐字稿":[{"t":"66B 09:25","b":[["s","這可以教了以後，那麼這個真正修學佛法，又分成功兩部分。我們修學佛法，一個自己的內因，一個是外緣，這個兩樣東西是必不可少。外緣是什麼？善知識！然後呢自己的內緣，就是跟善知識如何相應。前面只是告訴我們，說道的根本是依止善知識；依止已，然後告訴我們親近。當初在依止善知識那個時候裡邊說，已經說得很清楚，善知識的行相、學的行相，應該怎麼樣依止他，依止的勝利，不依止的過患等等。這個六條，實際上我們還是要很認真地把握住，把握住那個綱要。然後那個綱要把握住了以後，那個內涵啊，再下面學的都是這樣。你慢慢、慢慢地越了解得多，你對這個綱要的內涵，越能夠認識得正確；認識了正確，到你隨便這個一提的話，那你就把握住這個重點；你能夠把握住重點的話，你就能夠相應。"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/006.mp3"},{"文":"依師意樂，«如孝子心»：不以自心，一切觀察法身父親。","口譯":"本段大意：依師軌理先說依止的意樂，引《華嚴經》，其中如孝子心：不以自己的心為主，一切時處觀察法身父親。學完業果再回頭看，就知道必須有這種心：我們起心動念無非見思煩惱，懂一點也是九牛一毛。世間醫學、科學尚且常被推翻，我們聽一點、看一點就執為全部，豈不顛倒；所以要隨時提醒「我是愚癡」，揣摩善知識的意思照著做。佛具救護的願與能力，救不起來是因自己我執、法執這道藩籬。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"66B 10:48","頁":null,"af":"66b","st":648,"et":977,"消文":[],"延伸":[{"題":"如孝子心","組":[{"題":"孝順法身父母，與佛相應","說":[{"類":"立","文":"如孝子心，不是以自己的心說我要怎麼樣，而是一切時處觀察法身父親。"},{"類":"因","文":"世間父母長養一生尚且要孝順，得世間圓滿福德；孝順法身父母，就能得到與法身相應的圓滿——佛。"}]},{"題":"起心動念無非見思煩惱","說":[{"類":"回扣","文":"學完業果再回頭看，就清楚真正要修學佛法，必然要有這個心理。"},{"類":"立","文":"我們在無明當中起心動念無非見、思煩惱；懂一點點就算對了也是九牛一毛，何況十之八九都錯。"}]},{"題":"世間專家尚錯，何況我們","說":[{"類":"例","文":"一個醫生說這病不能吃油，另一個醫生說要拼命吃油；物質不滅、質能不能互換，現在又推翻了。"},{"類":"破","文":"我們隨便看點報紙、聽人家耳邊風就執著是這樣，只有一句話：愚癡。"},{"類":"下手","文":"學到這裡隨時提醒自己：「我是愚癡啊！」千萬不要說我這個對。"}]},{"題":"揣摩善知識，拆掉我執藩籬","說":[{"類":"下手","文":"唯一的辦法是揣摩善知識要告訴我們什麼，然後照著做；世間遷就別人不是好事，佛法卻是唯一的辦法。"},{"類":"因","文":"佛唯一的願望是救我們，又具足救我們的知識與力量；救不起來的是我們自己的內支障礙。"},{"類":"喻","文":"太陽光再亮，關在屋子裡、瞎子都看不見；我執瞎子、法執瞎子，道理講半天也進不來。"}]}],"說":[{"類":"立","文":"如孝子心，不是以自己的心說我要怎麼樣，而是一切時處觀察法身父親。"},{"類":"因","文":"世間父母長養一生尚且要孝順，得世間圓滿福德；孝順法身父母，就能得到與法身相應的圓滿——佛。"},{"類":"回扣","文":"學完業果再回頭看，就清楚真正要修學佛法，必然要有這個心理。"},{"類":"立","文":"我們在無明當中起心動念無非見、思煩惱；懂一點點就算對了也是九牛一毛，何況十之八九都錯。"},{"類":"例","文":"一個醫生說這病不能吃油，另一個醫生說要拼命吃油；物質不滅、質能不能互換，現在又推翻了。"},{"類":"破","文":"我們隨便看點報紙、聽人家耳邊風就執著是這樣，只有一句話：愚癡。"},{"類":"下手","文":"學到這裡隨時提醒自己：「我是愚癡啊！」千萬不要說我這個對。"},{"類":"下手","文":"唯一的辦法是揣摩善知識要告訴我們什麼，然後照著做；世間遷就別人不是好事，佛法卻是唯一的辦法。"},{"類":"因","文":"佛唯一的願望是救我們，又具足救我們的知識與力量；救不起來的是我們自己的內支障礙。"},{"類":"喻","文":"太陽光再亮，關在屋子裡、瞎子都看不見；我執瞎子、法執瞎子，道理講半天也進不來。"}],"複習":true,"af":"66b","st":648}],"逐字稿":[{"t":"66B 10:48","b":[["s","那麼在這個地方我隨便一提，當初他告訴我們依這個師軌理當中，先說依止老師的意樂，換句話說，你依止老師應該有什麼樣的心情，他是以《華嚴經》上面。我們其中隨便說兩樣東西：第一個如孝子心，第二個如金剛心。什麼是以孝子心啊？那就是啊不是以自己的心，說我要怎麼樣，一切時處要觀察自己的父親。現在呢這個誰是父親啊？法身父親。世間父母長養一生尚且要這樣孝順，你能夠孝順，你得到世間最圓滿的福德；現在呢這個法身的父母，你能夠孝順，你就能夠得到跟法身相應圓滿的。法身相應圓滿的什麼？佛嘛！那麼等到學完了這個業果的道理以後，那個時候你再回過頭去一看的話，啊！就非常清楚、非常明白，我們如果真正要修學佛法，是必然要有這個心理。因為我們在無明當中，你起心動念，無非是見、思煩惱。儘管你懂得了一點點，對不起，這一點點就算對了，都是九牛一毛，何況十之八九都錯的。"]]},{"t":"66B 12:29","b":[["s","所以我們平常引很多例子，不但是引佛經的例子，乃至於引世間的例子。昨天晚上引這個例子，今天不妨重說一遍，大家記得吧？喏！現在的科學這麼發達，大家認為這是天經地義的事情，欸，居然說出來的道理恰恰相反。一個醫生說：「你這個病不能吃油啊！」一個醫生恰恰相反的，他說：「現在你要拼命吃油！」昨天晚上那個周醫師還在，他是最佳醫生，他在這兒證明，他直點頭，不曉得你們看見了沒有？如果你們不相信，你們可以專門問他。我講的，那我是外行人，那醫生，因為這是發生在我親身身上。現在一個專業人員，對世間這麼淺近東西尚且如此，現在我們才隨便聽見一點點，看到那一點點，隨便幾本書，我們就覺得以為這個就代表了全部了，你豈不是顛倒嗎？"]]},{"t":"66B 13:30","b":[["s","然後科學上面其他的以前說：啊！這物質不滅定理，然後呢質能不能互換。現在又完全推翻掉了，恰恰相反，恰恰錯誤。世間科學上面，它經過這麼百千人，然後有這麼精密的方式觀察出來的東西，尚且錯誤百出。我們現在拾人牙慧，隨便看一點報紙，聽人家耳邊風，然後執著著就是這樣 ─啊！愚癡，只有一句話。所以在這個地方我們真正重要的，學到這裡應該隨時提醒自己：「我是愚癡啊！」千萬不要說：我這個對。學到這裡我們應該提醒自己：這個不對的。那麼關於「我」這個對不對的真正的內涵，一直要講到共中士，那個時候開始提到，上士的時候是圓滿地告訴我們，圓滿地告訴我們；在共下，已經有一點點的樣子了，已經有一點樣子了。"]]},{"t":"66B 14:41","b":[["s","所以我們懂得了這個道理，那個時候才會曉得，你現在唯一的辦法，是要去揣摩善知識，他要告訴我們些什麼，然後你照著他去做。世間的人這樣地去揣摩，遷就別人不是好事，佛法卻是唯一的辦法。為什麼？因為佛跟世間所以不同，你所以要依止佛，他具足的條件，大家記得，這四個條件，對不對？說，他唯一的願望─救你們。他具有的能力，圓滿具足救我們的知識，以及救我們的力量。所以救不起來的，就是我們自己的內支障礙。所以如果說你照著「我」去想的話，對不起，你這個藩籬擺在那裡，高高地就把那豎在那裡，他什麼東西進不來。所以經上的譬喻說，太陽光儘管亮啊，你關在屋子裡看不見，瞎子看不見。現在什麼瞎子？就是我執瞎子、法執瞎子。講「我」這個道理，啊！講了個半天的道理，對不起，那法、再有法沒有用。這是我們現在了解。你了解了這個，自然而然，所謂如孝子心這個概念，就非常清楚明白地呈現得出來。"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/007.mp3"},{"文":"曉得我錯，一心«恭敬三寶»，功德就生起來。","口譯":"本段大意：照這樣學，就算還沒學到，已經知道自己錯了，「我」的現行就破除；一心恭敬善知識，功德生起。身口意相應地禮拜三寶，福德多到如從拜處下至金剛際的微塵數轉輪聖王位。要貪就要做真正的貪——貪成佛，這是大善法欲；不要只貪眼前小好處。了解這些，孝子心之外，金剛心也跟著來，任何情況都不能破壞。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"66B 16:17","頁":null,"af":"66b","st":977,"et":1133,"消文":[],"延伸":[{"題":"恭敬三寶","組":[{"題":"曉得我錯，我的現行就破","說":[{"類":"立","文":"還沒學到它，可是已經曉得我這個錯的，這個「我」的現行就破除掉了；一心恭敬尊重善知識，功德就生起來。"},{"類":"回扣","文":"身口意相應拜一拜，從拜處下至金剛際磨成粉，一粒粉一個轉輪聖王位的福德。"}]},{"題":"要貪就貪成佛","說":[{"類":"破","文":"眼前一點點小好處就貪得要命，真沒出息。"},{"類":"立","文":"你問我貪不貪？要，貪什麼？佛！這是大善法欲。"}]},{"題":"孝子心之外，金剛心也來","說":[{"類":"立","文":"了解了這樣，不但有孝子心，金剛心也跟著來：不管他怎麼說，我心卻是不動。"}]}],"說":[{"類":"立","文":"還沒學到它，可是已經曉得我這個錯的，這個「我」的現行就破除掉了；一心恭敬尊重善知識，功德就生起來。"},{"類":"回扣","文":"身口意相應拜一拜，從拜處下至金剛際磨成粉，一粒粉一個轉輪聖王位的福德。"},{"類":"破","文":"眼前一點點小好處就貪得要命，真沒出息。"},{"類":"立","文":"你問我貪不貪？要，貪什麼？佛！這是大善法欲。"},{"類":"立","文":"了解了這樣，不但有孝子心，金剛心也跟著來：不管他怎麼說，我心卻是不動。"}],"複習":true,"af":"66b","st":977}],"逐字稿":[{"t":"66B 16:17","b":[["s","然後以這種情況，你如果去學的話，自然你能夠有多少努力，就得到多少功德。因為就是你還沒學到它，可是你已經自己曉得我這個錯的。當你曉得我這個錯的時候，這個「我」的現行就破除掉了。當你曉得我的錯的，前面一定有它推動你的原因，我們了解了；你一心恭敬尊重這個善知識，那個功德就生起來了。然後你尊重禮敬三寶的這個功德，昨天我們剛講過，如果你身口意相應這種拜一拜，哇！就從你拜的地方一直下至金剛際，把那塊土挖出來磨成功粉，一粒粉一個單元，這麼多粉，就有這麼多的轉輪聖王位的殊勝的福德。我們還不懂道理喔！你只要能夠這樣做到，哇！"]]},{"t":"66B 17:19","b":[["s","所以我們常常說：就怕你不貪，但是呢，欸，你要貪哪，就要做一個真正的貪，不要做一個什麼？沒出息的。現在我們真正的都是沒出息的人，眼前一點點小好處，就貪得要命，這真沒出息，真太沒出息了！你問我貪不貪？要，貪什麼？佛！這個是我要貪的。所以我是大善法欲，因為佛是這樣做的，所以我這樣去努力的！世間的一般人，稍微像樣一點，他們都是這樣，他們有他們無比的遠大的目標在。世間，他一開口，心裡想的總歸是這樣，眼前小的根本不在乎。我們這些人真是太差，就那個眼前這一點點小小的上面，然後呢損失是不曉得多多少少。"]]},{"t":"66B 18:17","b":[["s","那在這種情況之下，我們就體會到：啊，原來是這樣的！你自然就很清楚、很明白，善巧地利用我們現有的這種狀態。你只要善巧引導它，就可以得到這麼好處。喔！所以因為你了解了這樣子，不但有孝子心，而且金剛心也跟著來了。這一直是唯一的嘛！不管任何情況之下，不能破壞你。對不起，不管他怎麼說，我心卻是不動。關於這種概念，你自然一樣一樣都清楚了。這詳細的情況，我不在那裡多講。"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/008.mp3"},{"文":"共下士已經說過，把重點«溫習»起來，作為行持次第。","口譯":"本段大意：共下士到此說完，趁禮拜天好好溫習，把下士幾個重點把握住作行持次第：前者是後者必經的階梯。目前最重要是知見；知見契入，行持毫不困難。講中士之前要把下士基礎一條條溫習補足，否則中士爬不上去。善知識是外支，與他相應是內支；也要認清惡知識行相，尤其不要不知不覺自己做了惡知識。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"66B 18:53","頁":null,"af":"66b","st":1133,"et":1287,"消文":[],"延伸":[{"題":"溫習","組":[{"題":"前者是後者必經的階梯","說":[{"類":"下手","文":"趁禮拜天好好溫習，把下士幾個重點把握住，作為行持次第。"},{"類":"立","文":"前者都是後者必須經過的階梯，知見上是這樣，行持上也是這樣。"}]},{"題":"知見契入，行持不難","說":[{"類":"立","文":"目前重視的就是知見；知見相應契入了，行持時毫不困難。"},{"類":"喻","文":"這件衣服再好，沒有圓滿之前就在三惡道受無邊苦，划不來；就算還不能解脫，也有四天王天這樣轉的好處。"}]},{"題":"莫不知不覺做了惡知識","說":[{"類":"回扣","文":"善知識是外支，跟他相應是自己內支的條件。"},{"類":"破","文":"我們不但不能親近惡知識，尤其不要不知不覺當中自己做了惡知識，結果害了自己。"}]}],"說":[{"類":"下手","文":"趁禮拜天好好溫習，把下士幾個重點把握住，作為行持次第。"},{"類":"立","文":"前者都是後者必須經過的階梯，知見上是這樣，行持上也是這樣。"},{"類":"立","文":"目前重視的就是知見；知見相應契入了，行持時毫不困難。"},{"類":"喻","文":"這件衣服再好，沒有圓滿之前就在三惡道受無邊苦，划不來；就算還不能解脫，也有四天王天這樣轉的好處。"},{"類":"回扣","文":"善知識是外支，跟他相應是自己內支的條件。"},{"類":"破","文":"我們不但不能親近惡知識，尤其不要不知不覺當中自己做了惡知識，結果害了自己。"}],"複習":true,"af":"66b","st":1133}],"逐字稿":[{"t":"66B 18:53","b":[["s","這是現在到這地方為止，已經啊，關於共下士那個已經說過了。所以在這裡，明天正好是禮拜天，你們不妨趁那個機會，好好地溫習一下，好好地溫習一下。把這個下士上面幾個重點把握住，作為我們的行持次第，它這個前者都是後者必須要的經過的階梯，這樣地一步一步上升。知見上面是這樣，行持上面這樣。目前現在重視的就是知見，你有了這個認識，下面講下去的時候，啊！你會慢慢地、慢慢地這樣契入，這是目前最重要的事情。當你知見相應契入了，行持的時候毫不困難，毫不困難。要不然的話，這件衣服儘管這麼好，你一被，雖然究竟你還是圓滿，可是在沒有圓滿之前，你就在三惡道當中受無邊的苦，這件事情划不來。反過來，你就算沒辦法圓滿的話，一下還不能得到解脫，卻有這麼大的好處，四天王天這樣地轉、轉，那是何等地好啊！下面的，下一堂課再來說。"]]},{"t":"66B 20:21","b":[["s","講中士之前，我們把下士那個基礎，重新一條一條地溫習一下，溫習一下，不了解的馬上把它補足。你有了這個正確的認識，然後你那個中士，學到哪裡你就通達到哪裡。要不然你跑到那個地方，唉呀，覺得好辛苦，爬不上去。這個圓滿的教法，到那個情況是很大的損失，很大的損失。那麼前面有幾點特別重要：善知識，這個是外支，因為這個是修行必然需要的，必然需要的；你要曉得怎麼跟他相應，跟他相應的就是自己內支的條件，這個概念。那麼說到善知識，反面是惡知識什麼行相，這個我們要很清楚的。我們自己不但不能親近惡知識，尤其是我們不要不知不覺當中，我們自己做了惡知識。我們往往並不曉得，結果我們的行為害了我們自己，這一點也是應該特別注意！"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/009.mp3"},{"文":"正式修行時，前面說的«破除修行邪執»太重要。","口譯":"本段大意：下面要開始講修行。除了正修軌理，前面講的破除修行邪執特別重要；目前教法所以亂、所以沒結果，極大部分陷在這裡：自己覺得在修，實際走錯了路，一生善行都成過失，因果輾轉下去非常可怕。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"66B 21:27","頁":null,"af":"66b","st":1287,"et":1338,"消文":[],"延伸":[{"題":"破除修行邪執","組":[{"題":"自覺在修，其實走錯","說":[{"類":"回扣","文":"除了正修的軌理以外，前面說的破除修行邪執，這一點太重要。"},{"類":"破","文":"目前教法所以亂、所以沒有結果，極大部分陷在這裡：自己還覺得在修，實際上已經走錯了路，一生善行都成過失。"}]}],"說":[{"類":"回扣","文":"除了正修的軌理以外，前面說的破除修行邪執，這一點太重要。"},{"類":"破","文":"目前教法所以亂、所以沒有結果，極大部分陷在這裡：自己還覺得在修，實際上已經走錯了路，一生善行都成過失。"}],"複習":true,"af":"66b","st":1287}],"逐字稿":[{"t":"66B 21:27","b":[["s","那麼然後呢，下面就要開始正式講修行。修行的時候，除了那個正修的軌理以外，前面說的那個破除修行的邪執，這一點太重要，這一點太重要！所以當我們溫習也好，或者你們沒有聽過，在聽的時候，那個概念一定要弄清楚。我們目前教法所以亂，所以沒有結果的話，極大部分都陷在這個裡面，自己還覺得在修，但是呢實際上他已經走錯，走了錯路，走了錯路了，所以結果一生善行都成過失。眼前這個一生的過失，這個因果輾轉下去的話，不曉得什麼時候回來，那個結果都是非常可怕，非常可怕！"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/010.mp3"},{"文":"從暇滿、念死、皈依、業果一步一步上來，正知見轉過來就«咬緊牙關»。","口譯":"本段大意：有了基礎，從暇滿難得、念死，因怕死而求皈依，知道真正皈依處，再學如何淨除、如何增上，才知這件衣服的珍貴。事情並不難，難在正知見沒轉過來，還沒做就先打退堂鼓；心裡先準備好咬緊牙關，難關來時就認得付出就是法財。不認識這點，就像背對敵人打仗，必敗無疑。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"66B 22:18","頁":null,"af":"66b","st":1338,"et":1511,"消文":[{"文":"從暇滿難得、念死，因怕死才找皈依，找到皈依才曉得真正皈依處；然後如何淨除、如何增上，那時才曉得這件衣服的珍貴。"}],"延伸":[{"題":"咬緊牙關","組":[{"題":"正知見沒轉，先打退堂鼓","說":[{"類":"破","文":"還沒做之前，心裡已經畏畏縮縮打了退堂鼓：「哎呀，我不行啊！」那事情一定不成功。"},{"類":"例","文":"同修當中有人剛開始邋邋遢遢，最近慢慢很有向上，非常明顯。"}]},{"題":"付出就是賺法財","說":[{"類":"立","文":"心裡先有「我一定咬緊牙關要成就」的心情，難關來時認得：向上爬一定要付出，你做的就是你得到的功德，賺的法財。"},{"類":"喻","文":"背對敵人打仗，百分之一百地死；矇上眼睛跟人打，只有挨拳的份。"},{"類":"回扣","文":"前面這些道理，無非都是幫助我們淨除這些障礙。"}]}],"說":[{"類":"破","文":"還沒做之前，心裡已經畏畏縮縮打了退堂鼓：「哎呀，我不行啊！」那事情一定不成功。"},{"類":"例","文":"同修當中有人剛開始邋邋遢遢，最近慢慢很有向上，非常明顯。"},{"類":"立","文":"心裡先有「我一定咬緊牙關要成就」的心情，難關來時認得：向上爬一定要付出，你做的就是你得到的功德，賺的法財。"},{"類":"喻","文":"背對敵人打仗，百分之一百地死；矇上眼睛跟人打，只有挨拳的份。"},{"類":"回扣","文":"前面這些道理，無非都是幫助我們淨除這些障礙。"}],"複習":true,"af":"66b","st":1383}],"逐字稿":[{"t":"66B 22:18","b":[["s","你有了這個基礎，然後這樣地一步一步，從暇滿人身的難得以及念死，因為怕死，所以才找皈依，找到了皈依以後，所以才曉得真正皈依之處是何在。然後呢，如何去皈依法，如何去學習，把以前沒有了解之前怎麼淨除，了解以後如何增上，以及我們在這種情況去修學，必須要具足的什麼條件。那時候你才會知道：啊！這件衣服的珍貴呀！現在被上了這件衣服，要處處好好地努力啊！"]]},{"t":"66B 23:03","b":[["s","這個說起來，說來這個事情真的的確並不難哪！可最重要的什麼呢？就是你這個心理上面正知見沒轉過來。所以你還沒做的之前，心裡面已經是畏畏縮縮打了退堂鼓，「哎呀，我不行啊！」那個事情是一定不成功。你真正地能夠挺起來的話，事情無有不成功者。眼前我們同修當中，我就看見好幾個，剛開始我總覺得這個人邋邋遢遢，欸！不，最近看見他慢慢、慢慢地很有向上的這個，這個非常明顯，那個是最典型的例子。"]]},{"t":"66B 23:40","b":[["s","實際上我們可以找到各式各樣的，不要說佛法，就世間的這種情況，世間的這種情況，你心裡面先有了這個 ─我一定咬緊牙關，要這樣子成就的心情。那個時候心理上已經準備了，當難關來的時候，你認得很清楚：對啊！我是要向上，向上爬一定要付出力量，付出力量，你做的就是你所得到的功德，就是你賺的法財，你正要忙這個嘛！這個心情就那麼簡單，像打仗一樣。否則你不認識這個的話，你還沒打，唉呀，覺得辛苦，然後你背過頭來。你打仗，背了跟人家敵人打，什麼結果？只有一條路，百分之一百地死，就這麼一件事情！不是很清楚嗎？所以我們現在要戰勝三界煩惱，跟那個煩惱的敵人打，居然背了這個煩惱而打，你怎麼個打法？不要說敵人，那隨便任何一個人，你矇上了眼睛，然後跟敵人打，你豈不是只有挨他拳的份嗎？所以這心理很重要，你千萬不要：「唉呀，我這個不行啊，我那個不行啊！」萬萬不可以。所以我們不行，的確還是有它的很多原因在，那麼前面告訴我們這些道理，無非都是幫助我們淨除這些障礙，淨除這些障礙。"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/011.mp3"},{"文":"老比丘«至誠恭敬»這個法而努力，證了四果。","口譯":"本段大意：重提講過的公案：一位人人取笑的老比丘，至誠恭敬法而努力，被年輕比丘拿皮球在頭上敲四下，就證了四果。比一比我們年輕力壯卻懶懶癱癱、能偷懶就偷懶，心情完全不一樣。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"66B 25:11","頁":null,"af":"66b","st":1511,"et":1570,"消文":[],"延伸":[{"題":"至誠恭敬","組":[{"題":"老比丘被敲四下證四果","說":[{"類":"例","文":"老比丘人人都笑他，他至誠恭敬這個法而努力；年輕人拿皮球在他頭上敲四下，他證了四果。"},{"類":"破","文":"我們年輕力壯，卻懶懶癱癱、馬馬虎虎，能偷懶就偷懶，這個心情完全不一樣。"}]}],"說":[{"類":"例","文":"老比丘人人都笑他，他至誠恭敬這個法而努力；年輕人拿皮球在他頭上敲四下，他證了四果。"},{"類":"破","文":"我們年輕力壯，卻懶懶癱癱、馬馬虎虎，能偷懶就偷懶，這個心情完全不一樣。"}],"複習":true,"af":"66b","st":1511}],"逐字稿":[{"t":"66B 25:11","b":[["s","前面已經說過的兩個因緣，我這地方重提一下。有一個老比丘證四果的因緣，我是在這裡講過的，對不對？那麼已經講過了，你們已經聽過了曉得，那個老比丘，人人都笑他，欸！結果他自己覺得，啊！至誠恭敬這個法而努力。跟我們現在的心情怎麼樣呢？你比較一下就曉得了。我們現在有沒有這個心情？我們是不是懶懶癱癱、馬馬虎虎，唉呀，能偷懶就偷懶，這個心情完全不一樣。我們是年輕力壯，儘管有為的時候你是這樣；他已經老成這個樣的，他只是有這樣的一個心，還不是碰到佛喔，就碰見這個年輕人跟他開開玩笑喔！拿了一個皮球在他頭上敲四下，他證了個四果了。嗯，這樣！這是千真萬確的佛經當中的公案，這個不曉得在《雜寶藏經》裡、《賢愚因緣經》，這個倒我忘記掉了，你們自己去翻。"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/012.mp3"},{"文":"《出家功德經》近百歲老人，«讀誦坐禪行福»一樣都做不成，«一念精進»，沒多久證了果。","口譯":"本段大意：近百歲老人被家人嫌棄而求出家，舍利弗以不能讀誦、坐禪、行福三事拒之，諸弟子皆拒；他在祇桓精舍門口哭泣念佛，佛現身允其出家，交目犍連。受年少比丘作弄，他恭敬頂禮袈裟後投河，目犍連救起帶他觀察：美女屍上之蟲是執著身體所變；油鍋自煮的女子是盜食供僧之花報；大山是他宿生為摩羯陀魚的骨頭——宿世國王醉酒誤殺而引業墮魚，聞船人念三寶閉口，一念善根脫魚身。他聽了拼命用功，沒多久證果，在年少比丘前現神變。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"66B 26:10","頁":null,"af":"66b","st":1570,"et":null,"消文":[],"延伸":[{"題":"讀誦坐禪行福","組":[{"題":"出家三事，自我檢查","說":[{"類":"例","文":"舍利弗說：出家要做三件事：讀誦、坐禪、行福；近百歲老人一樣都做不成，不行。"},{"類":"下手","文":"我們出了家，檢查一下：讀誦了沒有？坐禪了沒有？忙公家的事情了沒有？"},{"類":"破","文":"有病的人都在認真地忙，年輕力壯的小伙子躲在房間睡大覺。"}]},{"題":"唯佛知機","說":[{"類":"例","文":"老人在祇桓精舍門口哭，苦惱地一心念佛，佛現光明允他出家：「真正了解事情的只有佛，羅漢不可能了解你的情形，你有善根。」"}]}],"說":[{"類":"例","文":"舍利弗說：出家要做三件事：讀誦、坐禪、行福；近百歲老人一樣都做不成，不行。"},{"類":"下手","文":"我們出了家，檢查一下：讀誦了沒有？坐禪了沒有？忙公家的事情了沒有？"},{"類":"破","文":"有病的人都在認真地忙，年輕力壯的小伙子躲在房間睡大覺。"},{"類":"例","文":"老人在祇桓精舍門口哭，苦惱地一心念佛，佛現光明允他出家：「真正了解事情的只有佛，羅漢不可能了解你的情形，你有善根。」"}],"複習":true,"af":"66b","st":1624},{"題":"一念精進","組":[{"題":"執身變蟲・盜食花報","說":[{"類":"例","文":"美女死屍嘴裡爬出蟲：生前對身體非常執著愛好，死後變蟲，蟲命完了墮地獄。"},{"類":"下手","文":"不必為營養而忙，忙了以後你也投條蟲；出家人連做條蟲的機會都沒有。"},{"類":"例","文":"傭人煮供僧食物先偷吃好的，又騙主人，現受油鍋自煮的花報，將來下地獄。"}]},{"題":"大山是宿生骨・一念善根","說":[{"類":"例","文":"國王醉酒誤殺罪人，引業墮畜生、滿業善好，投為摩羯陀魚；張口吞船時聽船上人念皈依三寶，閉口，一念善根脫魚身。大山就是他宿生的身。"}]},{"題":"衰老之身，一念精進成功","說":[{"類":"立","文":"他一想到這件事情拼命用功，這樣一個衰的老頭子，沒有多久證了果。"},{"類":"破","文":"隨便輕視袈裟都不可以，何況證果聖者；年少比丘一看大為驚訝：「他一念精進馬上成功！」"}]}],"說":[{"類":"例","文":"美女死屍嘴裡爬出蟲：生前對身體非常執著愛好，死後變蟲，蟲命完了墮地獄。"},{"類":"下手","文":"不必為營養而忙，忙了以後你也投條蟲；出家人連做條蟲的機會都沒有。"},{"類":"例","文":"傭人煮供僧食物先偷吃好的，又騙主人，現受油鍋自煮的花報，將來下地獄。"},{"類":"例","文":"國王醉酒誤殺罪人，引業墮畜生、滿業善好，投為摩羯陀魚；張口吞船時聽船上人念皈依三寶，閉口，一念善根脫魚身。大山就是他宿生的身。"},{"類":"立","文":"他一想到這件事情拼命用功，這樣一個衰的老頭子，沒有多久證了果。"},{"類":"破","文":"隨便輕視袈裟都不可以，何況證果聖者；年少比丘一看大為驚訝：「他一念精進馬上成功！」"}],"複習":true,"af":"67a","st":106}],"逐字稿":[{"t":"66B 26:10","b":[["s","那麼另外還有一個公案，我今天在這裡跟你們說一下，也是《出家功德經》的一個。有一個人，他年紀老了。年紀老了以後，反正年紀老的人是樣樣不對。在家裡邊，雖然他是一個滿有錢的人，當年年輕力壯的，人人奉承你，等到你年紀大了以後，人人討厭你，唉喲，說這個人在家裡面，只有消耗糧食，還要侍候他，這樣。他想來想去，一點意思都沒有，那麼就出家去了。他就出去了以後，家裡說：「好哇，出家去呀！你為什麼還不出家！」一天到晚就望他出家。我們現在年輕人要出家，哎喲！父母哭哭啼啼，誰都不願意你，這個道理就這樣。結果他覺得越想越沒道理，好，就出家啦！跑到寺院裡面去。"]]},{"t":"66B 27:04","b":[["s","那時候佛又不在，那麼就找那個佛的弟子。通常佛的弟子當中最精采的，當然舍利弗尊者，所以他就去找舍利弗尊者。舍利弗尊者一看說：「你這個人，年紀老了。」那個經上說快百歲了，近百歲的一個老頭子，我們可以想像。不要說近百歲，我今年只有剛剛五十九歲，虛年齡說六十歲，已經這個不行、那個不行，到了七十、八十，那更不曉得什麼樣子啊！他快百歲的一個老人，你可以想像得到。舍利弗尊者一看說：「不行！你不能出家，出家要做三件事情：讀誦、坐禪、行福。」那佛世的時候就是這樣喔！"]]},{"t":"66B 27:48","b":[["s","實際上呢這三件事情，我們不妨現在檢查一下：我們出了家了，請問：你讀誦了沒有？是不是你真正努力地從戒、律、經，經律論三方面努力，你有沒有？再不然，你坐禪，你有沒有？再不然，你行事，忙公家的事情，你有沒有？我特別說一下喲！是，我們在座的有幾位，不但一樣事情，三樣同時具足，啊，我真讚歎！乃至於有病的人都在那裡這麼認真地忙，就是我們年輕力壯的小伙子，躲在房間那個睡大覺啊！"]]},{"t":"66B 28:28","b":[["s","可是這個舍利弗尊者一看說：「對不起，你出了家要做三件事情，現在三件事情你一樣都做不成，不行、不行！」唉呀，他沒辦法，他去求別的，那求別的說：「欸，你來之前，你有沒有找過別人？」「我找過。」「找誰？」「找舍利弗尊者。」「舍利弗尊者怎麼講？」「舍利弗尊者告訴我這麼說 ……。」「那對不起，舍利弗尊者是佛的大弟子，他的智慧第一，他是這麼說的話，啊，那我沒辦法。」啊！這樣。然後他找遍了那個佛的弟子，統統拒絕。唉呀，他就在這個祇桓精舍門口哭啊！說心裡面 ‥「家裡面，家裡面人不要；要跑到去出家，出家也不要。」那只好苦苦惱惱地一心念佛。欸，他的善根到了，那個佛感應了，那就來了，現出光明來。啊！看見佛，他歡喜得啊，然後像大山崩投在佛前面。"]]},{"t":"67A 00:04","b":[["s","佛就問他：「你幹什麼在那兒哭哭啼啼呀？」他就告訴他這個因緣，「那好、好！你來出家。」就這樣，那麼就出了家了。出了家以後，任何人有他的緣的，他一看那個緣，他跟目犍連尊者有緣，他就告訴他說：「儘管舍利弗尊者，那些人都說 ……可是你要曉得，真正對事情的了解只有佛，佛無量阿僧祇劫所積累的功德，那些沒有一個羅漢具足，所以他們不可能了解你的情形，你有善根的。」「跟誰呀？」「跟目犍連尊者。」那麼叫他交給目犍連尊者，目犍連尊者就帶著他了。"]]},{"t":"67A 00:45","b":[["s","目犍連尊者一想：唉，這個老頭子他什麼事情都不能做，但是世尊說的，那一定沒有問題，好啦！好啦！那你跟，那就跟著吧！那麼他剃度了以後，然後他就跟著大家一起。跟著大家一起，雖然跟著大家一起，他畢竟是一個老頭子啊！什麼事都做不來，所以有個年少這個比丘啊，大家都好作弄他。哎呀！他自己覺得：我這個在家裡面已經苦惱，覺得出家可以解除苦惱，結果出了家又更苦惱。唉呀！他越想越苦惱，結果跑到恆河邊上面，算了！算了！我這一生命就送掉了。他就把衣服脫下來，對它恭敬頂禮，他說：「我絕不棄捨三寶！但是呢我這一生已經沒有希望修學了，所以我至心恭敬地祈求三寶加持我，然後讓我轉世，年輕就出家。」然後呢他對那件衣服脫下來掛在樹上，拜完了，噗通！跳到河裡面，他跳到河裡面自殺。"]]},{"t":"67A 01:46","b":[["s","那個時候，那目犍連尊者，就因為剃了這個老比丘，這個老年人，他就觀察說：唉呀，我這個老徒弟現在在幹什麼？一看哪，他跳到恆河裡面去了！目連尊者的神通，那就把他救出來。救出來了以後，就問他說：「你幹什麼啊？」「我如此這般啊！」「噢，沒關係，你跟著我吧！」跟著他，然後呢跟著他就帶他去，說：「既然這樣子，我帶你去散散心吧！」好，然後呢散心。"]]},{"t":"67A 02:18","b":[["s","結果跑出去的時候，喲，第一個就看見一個死屍，一個死屍。那個死屍長得非常漂亮的一個死屍，可是那個死屍身上有一條蟲，那個從她那個嘴巴裡面爬出來，從那個鼻子裡面鑽進去，然後鑽進去眼睛裡爬出來，在那個地方轉。看見了那麼美的人死掉了，啊！直覺得很可怕。然後呢，這個裡面一條蟲在那地方，看得真是噁心，他就問了，說：「師父，這個什麼？」「你現在不要問，等一下告訴你。」再跑！嗯，再跑，跑得去啊，他前面又看見一個人，說有一個女的，在那個地方幹什麼？在那個地方煮一鍋大的油鍋啊，在「嘩！」滾，滾完了，自己她「蹦！」跳下去！跳下去把那個自己滾熟了以後，然後呢撈出來自己吃。唉呀！這個痛苦不堪，死了以後然後再活。哎呀，他看了是毛骨悚然，「這、這怎麼一回事情啊？」「等一下告訴你，你再看！」就這樣。"]]},{"t":"67A 03:21","b":[["s","那麼這麼一看、一看，就看到了第五個，看見了一個大山。哎呀，那個山是大得不得了地大！大極了！一個大山，就這樣。那麼到那個大山上面，他又看見了，反正是看見了各式各樣的那些恐怖的事情。那麼完了以後，他又問，他說：「怎麼這個地方，怎麼有這麼一個大山呀？」他就說：「那個大山呀，那個大山就是你前生死下來的骨頭。」「什麼？我前生死下來的骨頭！」那好了，我把前面的前後的因緣都告訴你吧！剛才你第一個看見那個死屍，是怎麼一回事情呢？喏，就是那個某個國家的那個長者，那個長者夫婦兩個都非常地好，那麼這個長者的夫人長得非常美！那麼他們到海裡面去求寶，不幸到了海裡邊哪，遇見一陣那個黑風，那個船翻掉了，翻掉了嘛就人死掉了。那個大海是不容死屍，那個海法，所以把那個死屍漂流到岸上。那麼這個女的本身，她長得非常美，所以生前對她這個身體非常執著、非常愛好，所以她死了以後，因為她那個身體的愛好、執著，所以變成個蟲。"]]},{"t":"67A 04:45","b":[["s","哦！他看一下，嗨，人真一點意思都沒有，原來這樣結果。眼前是變蟲，因為她前生對這個身體的執著所以變蟲，這個蟲命完了以後墮地獄，然後呢受無邊的苦。唉！他聽見了是汗毛直豎，原來對這個身體，這樣好的身體都不能執著，那何況是我這個老的一百多，近百歲，啊，一無是處！他心裡是越想越害怕。所以我們現在想到這地方，不必為營養而忙，這營養忙了以後，你也投條蟲。她是個在家人喔！如果說是個出家人的話，你做條蟲的機會都沒有，這是千真萬確的事實喔！"]]},{"t":"67A 05:32","b":[["s","那她第二個幹什麼？第二個是某長者家一個傭人，那個長者是一個非常信佛的佛教徒。那麼那一次是供僧，供僧的時候，就叫那個傭人煮那個供僧的東西。然後呢她每次煮的時候，總是先把好的東西，先把它吃那麼一下，吃過了，然後完了以後，再供養其他的僧眾。結果因為吃了很好的東西，哇！長得非常好。那個主人說：「欸，你長得這麼好，你吃了什麼好東西啦？你是不是認認真真地去供養那些聖者？」「我是呀！我供養。因為主人你做得非常好，他們都吃不完，剩下來給我吃，我吃了這個好東西，所以這樣。」她騙了他的主人。她因為生前騙了，所以現在就第一個先受這個，這個是花報，等到這個花報盡了，將來就下地獄，要受無量無邊劫的苦，然後出來。這麼一個、一個這樣地說。"]]},{"t":"67A 06:42","b":[["s","啊！說到最後，他說：「那麼這個大山是怎麼一回事情？」哦！這樣：前生那個地方有一個大國國王，那個國王是依法治國。他有一次那個國王吃醉了酒了，那麼有一個人犯了罪，犯了罪跑得去問那個國王，那個國王說：「既然犯了罪，依法治。」然後呢就把這個人殺掉。殺掉了以後，他後來酒醒了，酒醒了以後，他就想起：「欸，剛才有個人犯了罪，那個罪人現在哪裡呀？」「殺掉了。」「怎麼殺掉了？」「國王，你剛才不是說，犯了罪就依法治。」後來一想，這個人罪不致死，唉呀，他就很懊悔，懊悔已經來不及了。他是很正規的，可是因為他這樣地犯了這個罪，但他平常因為做了很多善事，所以他那個引業墮為畜生，但是他那個滿業，卻是做了這麼好事。所以完了以後，投一個大身眾生 ─摩羯陀魚，這個摩羯陀魚是大得不得了。平常我們說鯨魚、鯨魚，實際上比鯨魚還要不曉得大多少倍。"]]},{"t":"67A 07:53","b":[["s","那麼後來那個摩羯陀魚，還有種種苦報，這不談。嗯，牠平常的時候常常這個一張開口，就這樣，這個我也簡略一點地講。有一天這個摩羯陀魚牠睡覺，一睡睡了一百年，那麼牠醒過來了。醒過來了以後，覺得嘴巴渴，就張開嘴巴來喝一口水。他那個摩羯陀魚一張開嘴的話，那個海水就像這個瀑布一樣，呱啦啦直瀉下去，所以海上的所有的這種東西，統統一起灌到牠的肚子裡。那個時候正有一船的人在那個船上，就順這個海水，就「叭！」下去。那下去了，大家曉得：哎呀！那是摩羯陀魚。那個船上的人這可是皈依三寶的，皈依三寶的。一看見那個情況，說這一下沒命了，大家拼命念：皈依三寶、皈依佛、皈依法、皈依僧，大家拼命地念。這個摩羯陀魚宿生有善根的，牠一聽見這個，「欸！這個三寶相應的，不可以！不可以！」牠馬上把那個嘴巴就閉起來。閉起來了以後，結果因為這樣的因緣，牠一念這樣的善根，牠就脫了這個魚身，這樣，然後呢又投生到人間。然後這個魚身那就是喏、喏、喏，現在你那個大山，就是你那個宿生的身。那麼現在你就是因為宿生一念的善根，現在就這樣。「啊，原來這樣啊！」他一想到這件事情，那是不得了，拼命用功。結果以這樣的一個衰的老頭子，沒有多久，證了果了，證了果了。"]]},{"t":"67A 09:42","b":[["s","證了果以後，那目犍連尊者就帶他回去，帶他回去的 ……他神通自在。他是證了果了，但是那些年少的比丘不知道，又看見這個老傢伙又回來了，又跟他開玩笑。他證了果，他根本不在乎，根本不在乎。別人還跟他開玩笑，那世尊可曉得的，反正你隨便輕視，輕視這個袈裟都不可以，何況是個證了果的聖者！那就叫那個老者，就給他說：「你現在出去作了些什呀？」他就給：「世尊哪！我的和尚告訴我這些呀 ……如此啊！」「是，你的生分已盡，所作已辦哪！」然後給他說法，他現神變。啊！這些年輕人一看哪，大為驚訝！所以大家就：「啊！你看，我們平常都笑他，這麼一個老的、老朽的，什麼事情都做不成功，他一念精進馬上成功。」這樣！"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/013.mp3"},{"文":"心裡振作，«立志»一定要做成功，最下的人也證果。","口譯":"本段大意：佛世鴦掘摩羅殺人、優波離與除糞人出身下賤、近百歲老人、唸不全「掃帚」的周利槃陀伽，都出家證果；原因就在心裡振作、立志一定做成。如福特等成功的人，也是咬緊牙關立志。我們已得最圓滿的德相之身，有最好的環境與教法，只要發最殊勝的意樂，佛果決定可辦。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67A 10:38","頁":null,"af":"67a","st":638,"et":779,"消文":[],"延伸":[{"題":"立志","組":[{"題":"最下的人都能證果","說":[{"類":"例","文":"鴦掘摩羅殺人、優波離與除糞人下賤、近百歲老人、周利槃陀伽唸「掃帚」二字都唸不全，都證了果。"},{"類":"立","文":"原因簡單極了：心裡邊振作起來——我一定要做成功這一件事情！"}]},{"題":"圓滿身加殊勝意樂，佛果可辦","說":[{"類":"例","文":"福特等成功的人，主要是一心信念，咬緊牙關立那個志。"},{"類":"回扣","文":"我們以最圓滿的德相之身，裡邊發最殊勝的意樂，佛果決定可辦。"}]}],"說":[{"類":"例","文":"鴦掘摩羅殺人、優波離與除糞人下賤、近百歲老人、周利槃陀伽唸「掃帚」二字都唸不全，都證了果。"},{"類":"立","文":"原因簡單極了：心裡邊振作起來——我一定要做成功這一件事情！"},{"類":"例","文":"福特等成功的人，主要是一心信念，咬緊牙關立那個志。"},{"類":"回扣","文":"我們以最圓滿的德相之身，裡邊發最殊勝的意樂，佛果決定可辦。"}],"複習":true,"af":"67a","st":638}],"逐字稿":[{"t":"67A 10:38","b":[["s","所以佛世的時候有各式各樣的，指鬘 ─那個殺人的一個人，欸，結果他也證了果了，鴦掘摩羅。然後優婆離尊者是一個下賤的人，他出了家也證了果了。還有一個我忘記掉了，是專門的除糞人，那是最下賤的人，他也出了家了。乃至於這麼個老頭子也出了家了，也證了果了。乃至於周利槃陀伽，周利槃陀伽，世尊叫他唸兩個字「掃帚」，他唸了個掃，帚字忘記掉了。掃、掃、掃，掃什麼呀？不知道。掃帚，帚、帚、帚什麼？掃字忘記掉了。說唸這麼兩個字唸了幾天，他也證了果了。我們現在總不至於這樣吧，總不至於這樣吧？注意啊！這一個是值得我們警惕的，原因在哪裡？簡單極了，就是你的心裡邊，就是你的心裡邊，你心裡邊振作起來，這第一個 ─我一定要做成功這一件事情，我一定要做成功這一件事情！"]]},{"t":"67A 11:43","b":[["s","所以我以前曾經跟你們引用過幾個典型的故事，譬如福特成功的公案，乃至於近代很多這種有名人物成功的公案，他主要的是什麼呢？就是這心裡邊一心的信念：是，我一定要咬緊牙關，一定要立那個志！我們現在這裡有最好的環境，你只要這個立志，最後有最好的幫助，最好的教法，那成佛都不難哪！這個是我們要了解的。所以到前面，最後的結論，告訴我們一個事實：我們以最圓滿的這個德相之身 ─現在我們都得到了，儘管後面的幾位還沒有，但是我曉得你們幾位都正在做準備，步步走上去，步步走上去；然後呢要裡邊發最殊勝的意樂，到那個時候佛果是決定可辦，佛果是決定可辦。說到這個地方，然後呢因為下面剛講中士，中、上士這兩個，這個地方我也講一個故事，來比喻一下。"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/014.mp3"},{"文":"«神足»第一敵不過智慧；羅漢與佛完全不能比。","口譯":"本段大意：為帶出中、上士，講兩個公案。其一，目犍連奉佛命召舍利弗，舍利弗把帶子繫在閻浮樹、須彌山、佛座，目犍連拉不動，回來時舍利弗已先到；說明佛法特質在智慧，神足敵不過智慧。其二，目犍連欲測佛的梵音有多遠，到光明王佛國，被當地菩薩看成缽緣小蟲，現神通降伏其慢，卻回不來，一心皈命釋迦佛才回到佛前；說明二乘與佛雖同名應供，完全不能比。學完中士、上士就會明白其原因。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67A 12:59","頁":null,"af":"67a","st":779,"et":1448,"消文":[],"延伸":[{"題":"神足","組":[{"題":"佛法特質在智慧","說":[{"類":"例","文":"舍利弗把帶子繫在閻浮提樹、須彌山，最後繫在世尊座上，目犍連盡神力拉不動；回到佛前，舍利弗已坐在那裡。"},{"類":"立","文":"儘管你神足第一，敵不過智慧，說明佛法的特質在智慧。"}]},{"題":"羅漢測佛智，絕無可能","說":[{"類":"例","文":"目犍連要測佛的梵音有多遠，到光明王佛國，被菩薩看成缽邊小蟲；現神通降伏菩薩慢心，卻回不去，一心皈命「南無本師釋迦牟尼佛」，才回到佛前。"},{"類":"立","文":"二乘跟佛儘管同樣得應供果的名字，兩者完全不能比。"},{"類":"下手","文":"教法還沒說明之前，先把這故事擺在心裡，學完中士、上士就清楚原因何在。"}]},{"題":"圓滿身、圓滿意樂、圓滿果","說":[{"類":"回扣","文":"既然得到這樣圓滿的身，只要發這樣圓滿的意樂，一定得到圓滿的果；這是最省事、最方便、最好的路。"}]}],"說":[{"類":"例","文":"舍利弗把帶子繫在閻浮提樹、須彌山，最後繫在世尊座上，目犍連盡神力拉不動；回到佛前，舍利弗已坐在那裡。"},{"類":"立","文":"儘管你神足第一，敵不過智慧，說明佛法的特質在智慧。"},{"類":"例","文":"目犍連要測佛的梵音有多遠，到光明王佛國，被菩薩看成缽邊小蟲；現神通降伏菩薩慢心，卻回不去，一心皈命「南無本師釋迦牟尼佛」，才回到佛前。"},{"類":"立","文":"二乘跟佛儘管同樣得應供果的名字，兩者完全不能比。"},{"類":"下手","文":"教法還沒說明之前，先把這故事擺在心裡，學完中士、上士就清楚原因何在。"},{"類":"回扣","文":"既然得到這樣圓滿的身，只要發這樣圓滿的意樂，一定得到圓滿的果；這是最省事、最方便、最好的路。"}],"複習":true,"af":"67a","st":779}],"逐字稿":[{"t":"67A 12:59","b":[["s","剛才不是講目犍連尊者嗎？他是佛弟子當中神足第一的，神足第一的，神通第一的一個人，最了不起的。有一天，是白月十五，誦戒布薩的時候，佛在這個阿耨達池，那個龍王那裡，那個阿耨達池龍王在布薩的時候就來看，一看哪，說：「欸，舍利弗尊者怎麼不在？」那麼他就問，說一看舍利弗尊者不在，他佛陀就跟目犍連尊者說：「某人哪，你去把舍利弗尊者叫來，把舍利弗叫來，我們要布薩了。」當然目犍連遵者，他因為神通第一嘛，他就去找，一看哪，那個舍利弗尊者還在給孤獨園，跑得去跟他說。他說：「這個，欸，師兄啊，佛布薩，佛讓我來叫你去。」「好、好、好，那你等一下，我這個 ……。」那一個帶子，解下來那個帶子 ……他要他等一下，他說不能等啊！不能等，要拉著他。那個時候有一根帶子擺地上，「你要拉，你先拉拉那根帶子看。」然後目犍連尊者，他是神通第一哦，要拉那個帶子，盡其神力是不能拉動。"]]},{"t":"67A 14:30","b":[["s","那個舍利弗尊者，把那個帶子的那一頭，拴在這個閻浮提樹上面。因為目犍連尊者神力第一，所以他拉那個帶子，大地都在那兒跟著動，這個帶子一動都不動。啊！怎麼、怎麼、怎麼這麼這樣不行呀？那麼第二次，他想 ……這個舍利弗尊者一看不對，那被他那個大力拉動了不對，他不要綁在那個樹上面。他就把那個帶子的那一頭，繫在那個須彌山上面；他還在拉，結果須彌山也搖起來了！這個目犍連尊者神力是這麼大。但是儘管他神力大，這個帶子還是拉不動。不過舍利弗尊者一看，不對、不對，它帶子雖然沒有拉動，須彌山被他拉倒了，那可不是開玩笑的。他就把那個帶子那一頭，拴在世尊那個座位上面，他再去拉，一動都不動。唉，他心裡是一點辦法都沒有，他說：「好了、好了，反正我已經盡了我的責任，世尊告訴我來叫你，你不去，你管你的，我可去了。」所以他說完了，他就走了。"]]},{"t":"67A 15:35","b":[["s","他神通第一喔，當然他是神通，一下就到佛。結果他跑到佛那裡一看哪，舍利弗尊者坐得好好地坐在這個佛的前面。咦？奇怪了，他就報告世尊：「世尊，是不是我的神通退失了？你說我的神通第一。」「對啊！你神通第一。」「是不是我退失了？」「你沒退失。」「那沒退失，為什麼我跑得去叫舍利弗尊者，先拉那個帶子，拉了個半天不動，最後回來的時候，明明我先回來，結果他等到我回來，他坐得好好地坐在那裡。」「不是，不是，那不管啦！好啦，回來啦，我們就布薩吧！」那布薩。結果很多弟子，本來大家覺得目犍連尊者的神通第一，結果大家都看見了這件事情，大家心裡想：唉，這個傢伙也不過如此！這樣，大家就輕視他。"]]},{"t":"67A 16:26","b":[["s","所以布薩完了以後回來，佛曉得，這個聖者隨便起個輕視心不可以，他就說，說：「我的弟子當中，目犍連尊者的神足第一，你表演一點給他們看看。」「好。」怎麼表演？他就一動，一個腳站在須彌山的頂上面，然後另外一個腳站在那個梵天上面。然後呢，他把那個站穩了以後，一腳踢那個須彌山，那個須彌山一踢，那個整個的大地就「匡！」天翻地覆。喔！大家真是佩服得五體投地，服服貼貼，發現：啊！的的確確沒有一個人有這個本事。這個公案是同樣地講，同樣的佛怎麼樣，還沒有講，同樣地講兩個羅漢。可是羅漢當中，妙了！舍利弗尊者智慧第一，目犍連尊者神足第一；儘管你神足第一，敵不過智慧。說明什麼？佛法的特質在智慧，佛法的特質在智慧。那麼舍利弗尊者，儘管大家是說羅漢，他智慧第一，你這個神通拿他一點辦法都沒有，怎麼比，比不過，這第一個。第二個呢，我們跟佛來較量一下，下面是有一個公案。"]]},{"t":"67A 17:55","b":[["s","有一次，佛那麼講法，他曉得佛，他有好幾個公案。佛的所謂梵音聲相，這佛的這個聲音沒有近遠的，在任何情況之下，任何地點、任何人聽起來就這麼美妙悅耳，與他的根器相應，就這麼恰如其分。你一聽那個聲音啊，就全部被它貫注去了；一思惟它的內容啊，你馬上得到好處；照它的道理去做，馬上證得了聖果了，這樣地好。所以他就想：它那個佛的聲音到底能夠多遠？他就找。結果盡他的神力一直找，怎麼找，那個聲音始終就像耳邊，始終就像這個樣子。結果走到有一個國土，那個國土名字我忘記掉了，那個佛叫作光明王佛，找到那個地方，找到那個地方它還是如此。"]]},{"t":"67A 18:50","b":[["s","那個光明王佛的那個佛身非常長大，他那個長大多少？哦，是佛身高四千里，那麼那個菩薩身高是兩千里，我們現在的人身不到一丈，不到一丈。我剛才算了一下，他那個比起來，大概多少倍？一里的話，我們以前的華里是多少？一千，一百五十丈，對不對？好像是這樣。換句話說拿我們現在的比起來的話，是六十萬倍，哇！不得了。你不要說六十萬倍，這一萬倍；你不要說一萬倍，十倍，十倍一比的話，一百倍。現在一萬倍，六十萬倍，那你怎麼能比呢？所以這個目犍連尊者，那個比起那個地方的菩薩，小得那真是不能再小的，我們還找不到這麼小的小蟲。"]]},{"t":"67A 19:47","b":[["s","那個菩薩那個時候正在吃飯，吃飯當中，目犍連尊者也不曉得那個是缽，他自己當然很小，他就站在那個缽的邊上面去遊行。那個菩薩正在吃飯，說：欸，怎麼一個黑點？這菩薩一看，原來一個小小的小小有情，他也不曉得這個什麼人，他就那兒看，嗯，什麼？今天那個缽的邊上，來了個小蟲。那個佛可曉得的，欸，說：「某人你注意喔！這個不是喔！這個是什麼？這個是某方（這個好像東方吧），釋迦牟尼佛座下上首弟子，神足第一的目犍連尊者。你千萬不要傷了他，你不要把他看成小蟲哦！」「哦？有這樣的事情嗎？」他心裡，嗯，他想這個釋迦牟尼佛，這個大概一定是 ……他那個弟子是神足第一，是這麼樣！他心裡就起了一個念頭。佛就告訴他：「哦，你們千萬不要起輕慢心！」所以他為了讓那些弟子們不輕慢，他就告訴他說：「某人哪，目犍連哪，你使一個神通給他們看看！」說：「是！世尊。」"]]},{"t":"67A 20:55","b":[["s","然後他馬上一現，現一個無量無邊的虛空身，然後呢在虛空當中現一個大的獅子寶座，然後呢這個寶座上面有各種瓔珞，無比地莊嚴，然後呢瓔珞上面有各式各樣的蓮花，每一個蓮座上有釋迦世尊的化身在說法。啊！那個神蹟，就以他們這個地方，是從來沒有看見過。哎呀！大家無比地讚歎啊！讚歎得不得了。那個時候，菩薩的這個慢心統統降伏。那光明王佛說：「好、好，可以了，可以了。」他就恢復了。不過，他就告訴他：「欸，你為什麼到這裡來呀？」他說：「我要想找那個佛的聲音，找了半天找不到。」「這個佛的聲音，豈是你可以找的，佛的梵聲音相，它跟法界相應，沒近遠，在任何情況之下你永遠去找，永遠就是這個樣，這是我告訴你。」這一下子目犍連尊者也服服貼貼的了。「唉！我真是起了妄心，佛一直告訴我們，這個羅漢不管在任何情況之下，你要測佛的智的話，你絕無可能，絕無可能。我怎麼今天會起這個妄想！好了，好了，回去吧！」就這樣，他要回去了。"]]},{"t":"67A 22:08","b":[["s","結果他也沒辦法回去，唉呀，怎麼也沒辦法回去，他那個神力可不可到的。這一下他就慌起來了，求那個佛陀。光明王佛說：「就是以你的這個神力，不要說你現在沒有氣力，你就是有氣力的話，你都沒辦法回得去，要經過幾劫啊！」「那我怎麼來的時候，就那麼隨便聽一下就來了；怎麼回去的時候，怎麼回不去？」「那不是你的力量，是佛的力量！」「那怎麼辦啊？」他苦惱得要命。「很簡單，你一心皈投佛。」「對啊！我以前不信佛，這個絕不可以！」所以到那個時候，他就一心皈命，才心裡面一念是「南無本師釋迦牟尼佛」，欸，好好地回到了佛跟前。"]]},{"t":"67A 22:55","b":[["s","這個裡邊有很多特別的意義，我不說。說明了一下，二乘跟佛之間，儘管證得同樣的果，佛同樣也得到這應供果的名字；羅漢也是應供果的名字，這兩者之間是完全不能比、完全不能比，完全不能比，完全不能比。這個概念我們必定要清楚明白。眼前這教法還沒說明之前，我們心裡邊先把這一種故事擺在心裡，等到你學完了中士，學完了上士，那個時候你就很清楚、很明白的，原因何在。現在我們不妨心裡面想：啊！沒錯，對，現在既然我們得到這樣圓滿的身，然後呢只要發這樣圓滿的意樂，一定得到圓滿的果。實際上呢這個還是最省事、最方便、最好的路，現在走下去。看卷六，一百五十二頁。"]]}],"口譯音":"口譯音檔/xiashi-zongfuxi/015.mp3"}],"音檔範圍":"66A 27:46～67A 24:08"},"xiqiu-jietuo-01":{"id":"xiqiu-jietuo-01","標題":"希求解脫(一)","根":"明求解脫之心","科判焦點":"庚一 明求解脫之心","課本範圍":"P152 L1 ~ P153 LL1","堂數":85,"日期":"2026/10/20","分圖":[{"名":"非以此便生喜足","原文":[0,11]},{"名":"修諸有過患為要","原文":[12,19]},{"名":"明求解脫・發此方便","原文":[20,32]}],"跨科判":null,"週":108,"班級":"24秋007","序":null,"音檔":{"67a":{"local":"音檔/gl1/067A.mp3","remote":"https://lamrim.xyz/player/media/gl1/067A.mp3"},"67b":{"local":"音檔/gl1/067B.mp3","remote":"https://lamrim.xyz/player/media/gl1/067B.mp3"},"68a":{"local":"音檔/gl1/068A.mp3","remote":"https://lamrim.xyz/player/media/gl1/068A.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=67a&st1=1448&af2=67b&af3=68a&et3=345","段":[{"文":"敬禮勝尊具大悲者足。","口譯":"恭敬頂禮殊勝尊貴、具足大悲的世尊雙足。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67A 24:08","頁":152,"af":"67a","st":1448,"et":1468,"消文":[{"文":"每一處開始的時候，一定是皈敬世尊，這個道理一開始說過了。"}],"延伸":[],"逐字稿":[{"t":"67A 24:08","b":[["q","敬禮勝尊具大悲者足。"],["s","它每一個地方開始的時候，一定是皈敬世尊，皈敬世尊，這個道理一開始說過了。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/001.mp3"},{"文":"如是隨念當死及思死後墮惡趣之道理，能令其心厭捨現世，於後善趣發生希求。","口譯":"像這樣，隨念自己必定會死，以及思惟死後墮入惡趣的道理，能讓內心厭捨現世，而對後世的善趣生起希求。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67A 24:28","頁":152,"af":"67a","st":1468,"et":1504,"消文":[{"文":"這就是前面下士道所說的皈依之因。"},{"文":"這個認識一定是依靠善知識指明世間的真相，自己如理觀察思惟的結果。"}],"延伸":[],"逐字稿":[{"t":"67A 24:28","b":[["q","如是隨念當死及思死後墮惡趣之道理，能令其心厭捨現世，於後善趣發生希求。"],["s","這就是前面下士道當中所說的皈依之因。因為內心當中有了這個認識，當然這個認識一定是依靠善知識，指明世間的真相，你如理觀察思惟的結果。所以到那個時候，就要求皈依。說："]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/002.mp3"},{"文":"次由共同皈依及由定解黑白業果，勵力斷惡修善，則能獲得善趣妙位。","口譯":"接下來，靠著和下士共通的皈依，再加上對善惡業果有了確定的了解，努力斷除惡行、修習善行，就能得到生在人天善道的好果報。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67A 25:04","頁":152,"af":"67a","st":1504,"et":1531,"消文":[{"文":"由這樣的因而皈依，皈依了，了解正確佛法的根本，如法行持、斷惡修善，所以增上生。"}],"延伸":[],"逐字稿":[{"t":"67A 25:04","b":[["q","次由共同皈依及由定解黑白業果，勵力斷惡修善，則能獲得善趣妙位。"],["s","由於這樣的因，所以你皈依，由於這樣皈依了，最後達到了解正確的佛法的根本，如法行持、斷惡修善，所以增上生。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/003.mp3"},{"文":"«然非以此便生喜足»，","口譯":"然而並不是到此就心生滿足，","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67A 25:31","頁":152,"af":"67a","st":1531,"et":1699,"消文":[{"文":"你不要把這個作為滿足。"}],"延伸":[{"題":"然非以此便生喜足","組":[{"題":"自以為懂，便聽不進","說":[{"類":"例","文":"師父說自己以前的毛病：懂得一點，就覺得懂得不得了，人家告訴的都聽不進。"},{"類":"破","文":"現在很多同學也是這樣，懂了一點就覺得樣樣都懂，其他都聽不進。"}]},{"題":"凡夫榜樣不足為足","說":[{"類":"因","文":"我們看見的是五濁惡世的凡夫世界，稍微好一點就拿來當榜樣，做到了也只是如此。"},{"類":"因","文":"前面說過，證得羅漢果都還不夠。"}]},{"題":"認得己錯，才爬得上去","說":[{"類":"立","文":"發現自己錯了，那是有智慧的人，有了這個就爬得上去。"},{"類":"破","文":"自己覺得很懂，最多只是世智聰辯，是八難中人。"}]},{"題":"共下士量的行相","說":[{"類":"例","文":"到齋堂吃飯，如曠野食子肉想，越吃越難受，可以飽了趕快放下，那才是生起。"},{"類":"破","文":"越吃越起勁，連共下士都沒有；居然還喜樂，那完全錯了。"}]}],"說":[{"類":"例","文":"師父說自己以前的毛病：懂得一點，就覺得懂得不得了，人家告訴的都聽不進。"},{"類":"破","文":"現在很多同學也是這樣，懂了一點就覺得樣樣都懂，其他都聽不進。"},{"類":"因","文":"我們看見的是五濁惡世的凡夫世界，稍微好一點就拿來當榜樣，做到了也只是如此。"},{"類":"因","文":"前面說過，證得羅漢果都還不夠。"},{"類":"立","文":"發現自己錯了，那是有智慧的人，有了這個就爬得上去。"},{"類":"破","文":"自己覺得很懂，最多只是世智聰辯，是八難中人。"},{"類":"例","文":"到齋堂吃飯，如曠野食子肉想，越吃越難受，可以飽了趕快放下，那才是生起。"},{"類":"破","文":"越吃越起勁，連共下士都沒有；居然還喜樂，那完全錯了。"}],"af":"67a","st":1531}],"逐字稿":[{"t":"67A 25:31","b":[["q","然非以此便生喜足，"],["s","你不要把這個作為滿足。這個話講一下，這個話講一下。我們現在有沒有得到這個？對不起，很難說，以我來說，我自己曉得還沒有，所以我自己一點都不敢馬虎。我以前我有一個毛病，懂得了一點，哎呀，自己覺得懂得不得了，人家告訴我的就聽不進，我總覺得很懂。現在我看很多同學當中也是這個樣子，唉呀，他懂得了，他總覺得樣樣都懂了，然後呢其他也聽不進了，這個好遺憾、好可惜！世間也是如此，出世也是如此。"]]},{"t":"67A 26:24","b":[["s","或者你看見，看見的不是壞喔，的的確確地，它的的確確是好。可是不幸的我們看見的什麼？我們看見的是五濁惡世的凡夫世界，在這個凡夫世界稍微好一點，然後你就覺得以這個榜樣的話，就算你做到了也只是如此欸！對不對？前面告訴我們，你證得了這個聖者的羅漢果都不行欸，這個是我們要了解的。所以我這個地方特別提一下，如果我們自己覺得「我很對！」你錯了，你錯了！前面告訴我們，你真正相應的話，如果你發現你自己錯了，那你是有智慧的人，你有了這個你就可以爬得上去。反過來說，你自己覺得你很懂啦，那對不起，你只是一個世智聰辯最多，而且這是八難中人，這是我們千萬要注意的！"]]},{"t":"67A 27:25","b":[["s","所以現在前面已經提醒我們，這地方更告訴我們：千萬不可以覺得夠了！所謂這夠了已經生起什麼？已經生起共下士之量。所以大家注意，你們自己檢查檢查，是不是你已經生起共下士之量哦？我們共下士之量生起什麼現象？一看見眼前現在，一跑到齋堂裡，「唉呀，這個東西可怕，但是我不能不吃它！」所以你每吃一口，佛經上面告訴我們，如曠野食子肉想。你越吃是越難受，吃得可以飽了，唉呀，趕快放下來，那個才是生起哦！如果你吃的時候越吃越起勁的話，對不起，連它共下士都沒有。如果在這種情況，居然喜樂的話，那完全錯了！進一步，"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/004.mp3"},{"文":"是令發起共下士之意樂及發共中士之意樂，厭捨生死一切事已，依此因緣而發大菩提心引入上士，","口譯":"而是要讓我們先發起和下士、中士共通的那種心：對生死裡的一切都厭倦捨棄之後，再以這個為基礎，發起大菩提心，把我們帶進上士道。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67A 28:19","頁":152,"af":"67a","st":1699,"et":1753,"消文":[{"文":"先在這個基礎上做，這個基礎跟下士一樣，叫共下士。"},{"文":"再上一步是共中士，內容是「厭捨生死一切」：後世生了天也不要。"},{"文":"依這個「發大菩提心引入上士」，這個才是。"}],"延伸":[],"逐字稿":[{"t":"67A 28:19","b":[["q","是令發起共下士之意樂及發共中士之意樂，厭捨生死一切事已，依此因緣而發大菩提心引入上士，"],["s","為什麼不能把這個就覺得滿足呀？哦！是說這個地方讓你作為基礎，先從這個基礎上面做這件事情。這個基礎部分是跟下士一樣的，這個叫共下士。然後更進一步，再上面一步 ─中士，這個是因為共中士一樣的，它共中士的內容是「厭捨生死一切」，不但是求後世，後世生了天你也不要。那麼依這個「發大菩提心引入上士」，這個才是。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/005.mp3"},{"文":"故於此中，須修中士之意樂。","口譯":"所以在這裡，必須修習中士的意樂。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67A 29:13","頁":152,"af":"67a","st":1753,"et":null,"消文":[{"文":"已經有了下士的量，進一步就要上去。"},{"類":"喻","文":"念完了小學，正好念中學；不要說：「我小學了，現在樣樣都懂了。」"}],"延伸":[],"逐字稿":[{"t":"67A 29:13","b":[["q","故於此中，須修中士之意樂。"],["s","現在我們已經有了下士的量了，進一步就要上去。欸，念完了小學，要學中學了，不要說：「哎喲，我小學了，我現在樣樣都懂了。」要是說：「欸，我現在小學了，念完正好念中學了。」這樣那就對了！"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/006.mp3"},{"文":"所謂雖得人天勝位，然仍未能出於行苦，若即於此執為樂性，實為顛倒。","口譯":"也就是說，雖然得到了人天的殊勝果位，仍然沒有出離行苦；如果就把它執著為快樂，實在是顛倒。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 00:08","頁":152,"af":"67b","st":8,"et":30,"消文":[{"文":"雖然得到了人天的好處，但行苦還沒出，最後還在輪迴當中；把這個當快樂，就是顛倒。"}],"延伸":[],"逐字稿":[{"t":"67B 00:08","b":[["q","所謂雖得人天勝位，然仍未能出於行苦，若即於此執為樂性，實為顛倒。"],["s","為什麼？雖然說你得到了人天的好處，但是行苦還沒出，最後還在輪迴當中哦！假定你把這個以為快樂的話，那你是顛倒了。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/007.mp3"},{"文":"故於真實全無安樂，其後定當墮諸惡趣邊際惡故，譬如有一無間定當墮於懸險，現於險崖暫為休息。","口譯":"所以真實來說完全沒有安樂，因為之後必定會墮入惡趣，結局終究是惡的。就好比有一個人，馬上就一定要墜下懸崖，現在只是在險崖上暫時休息而已。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 00:30","頁":152,"af":"67b","st":30,"et":65,"消文":[{"文":"共下士做到了，對真實究竟的意義來說，一點快樂都沒有，最後一定要墮落。"},{"文":"就像在懸崖上暫時休息，一動馬上就跌下去，粉身碎骨。"}],"延伸":[],"逐字稿":[{"t":"67B 00:30","b":[["q","故於真實全無安樂，其後定當墮諸惡趣邊際惡故，譬如有一無間定當墮於懸險，現於險崖暫為休息。"],["s","所以雖然共下士做到了，但是對於這個真實的究竟意義來說，一點快樂都沒有，最後一定要墮落的。就像我們現在，在這個懸崖當中暫時休息一下一樣，一動馬上就跌下去，粉身骨碎啊！"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/008.mp3"},{"文":"《入行論》云：「數數來善趣，數受諸安樂，死後墮惡趣，常受極大苦。」","口譯":"《入行論》說：「一再地來到善趣，一再地享受種種安樂，死後卻墮入惡趣，長久承受極大的痛苦。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 01:05","頁":152,"af":"67b","st":65,"et":73,"消文":[{"文":"師父只說「這很明白」，沒有另外解。"}],"延伸":[],"逐字稿":[{"t":"67B 01:05","b":[["q","《入行論》云：「數數來善趣，數受諸安樂，死後墮惡趣，常受極大苦。」"],["s","這很明白。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/009.mp3"},{"文":"《弟子書》中亦云：「諸常轉入生死輪，而於暫憩思為樂，彼定無主漸百返，漂流等非等諸趣。」","口譯":"《弟子書》中也說：「那些常常轉入生死輪迴的人，把暫時的歇息想成快樂，他們必定身不由己，漸漸百返（無數次）漂流在或上或下（等非等）的各趣之中。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 01:13","頁":152,"af":"67b","st":73,"et":133,"消文":[{"文":"永遠在生死輪迴中轉，目前只是暫時得到一點人天好的位子，因愚癡顛倒把它看成快樂。"},{"文":"看不清楚就是無明，無明當然作不了主。"},{"文":"「百」不是一百趟，是泛指永遠在六道輪轉；「等非等」是或上或下。"}],"延伸":[],"逐字稿":[{"t":"67B 01:13","b":[["q","《弟子書》中亦云：「諸常轉入生死輪，而於暫憩思為樂，彼定無主漸百返，漂流等非等諸趣。」"],["s","現在我們普通人是怎麼樣？永遠在生死輪迴當中轉，而目前只是暫時得到一點點，這個三有當中的人天好的位子。把這個內容看不清楚，因為愚癡顛倒而把它看成快樂的。那個是沒有正確的認識，他自己作不了主。為什麼？看不清楚，無明，無明嘛當然作不了主。於是漸漸又轉百返，於永遠 ─這個「百」不是一百趟，百是泛，泛指，永遠在六道當中輪轉。「等非等」，或者上、或者下，這個意思。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/010.mp3"},{"文":"故於善趣亦當厭患，猶如惡趣。","口譯":"所以對於善趣也應當厭患，就像厭患惡趣一樣。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 02:13","頁":152,"af":"67b","st":133,"et":144,"消文":[{"文":"我們對好的應該產生厭惡，這個是非常重要的。"}],"延伸":[],"逐字稿":[{"t":"67B 02:13","b":[["q","故於善趣亦當厭患，猶如惡趣。"],["s","所以我們真正的，對好的應該產生厭惡，這個是非常重要的。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/011.mp3"},{"文":"《四百論》云：「諸智畏善趣，等同奈洛迦，不畏三有者，此中遍皆無。」","口譯":"《四百論》說：「有智慧的人畏懼善趣，就如同畏懼奈洛迦（地獄）；不畏懼三有的，在智者之中完全沒有。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 02:24","頁":152,"af":"67b","st":144,"et":188,"消文":[{"文":"真正的智者對善趣看得像地獄一樣，不怕的，在這個圈子裡絕對沒有。"},{"文":"就算生天、做國王、做天王，看起來像地獄一樣恐怖，這個才是。"}],"延伸":[],"逐字稿":[{"t":"67B 02:24","b":[["q","《四百論》云：「諸智畏善趣，等同奈洛迦，不畏三有者，此中徧皆無。」"],["s","這個論上面告訴我們，真正的智者，對這個善趣看得像地獄一樣，不怕這個的，在我們這個圈子裡是絕對沒有的。注意哦！所以現在我們要了解，你一旦真正的出家，這個才是我們的目標。在這個圈子裡邊，不要說眼前，就把你生天，生到天上面去，就把你做到一個國王，就把你做到天王，你看起來像地獄一樣地恐怖，這個才是哦！"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/012.mp3"},{"文":"《攝功德寶》中亦云：「諸具«貪生死»意恆流轉。」","口譯":"《攝功德寶》中也說：「凡是心意貪著生死的人，就會恆常流轉。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 03:08","頁":152,"af":"67b","st":188,"et":278,"消文":[{"文":"貪著生死的心意狀態，永遠在生死中流轉，這是要認識、真正產生厭離的。"}],"延伸":[{"題":"貪生死","組":[{"題":"法愛不遣，便上不去","說":[{"類":"立","文":"任何一樣好東西都要了解：真正修行時，法愛如果不遣，就上不去。"},{"類":"例","文":"加行位到了頂位會「頂墮」：修了法歡喜，有這一念歡喜的執著，就爬不上去。"}]},{"題":"先認識，再對治","說":[{"類":"破","文":"我們差得十萬八千里，心裡還這麼放不下。"},{"類":"下手","文":"現在真正要的是正知見，先認識，然後慢慢努力去對治。"}]}],"說":[{"類":"立","文":"任何一樣好東西都要了解：真正修行時，法愛如果不遣，就上不去。"},{"類":"例","文":"加行位到了頂位會「頂墮」：修了法歡喜，有這一念歡喜的執著，就爬不上去。"},{"類":"破","文":"我們差得十萬八千里，心裡還這麼放不下。"},{"類":"下手","文":"現在真正要的是正知見，先認識，然後慢慢努力去對治。"}],"af":"67b","st":188}],"逐字稿":[{"t":"67B 03:08","b":[["q","《攝功德寶》中亦云：「諸具貪生死意恆流轉。」"],["s","我們現在這個狀態是什麼？這個貪著生死的這個，這一個心意狀態什麼呢？永遠在生死當中流轉，這是我們應該認識，真正產生厭離的。所以任何一樣好東西，你要了解，真正修行的時候，法愛如果說不遣的話，你上不去。所以在這個五道十地當中，資糧、加行，這個加行再上面去，所謂加行是煖、頂、忍、世第一地。世第一地最後的後心，那就是見道。這個到了這個頂端以後叫「頂墮」，停在那裡上不去了。它頂墮是什麼？就是他修了法以後他也歡喜，唉呀，覺得好，他有這樣的一念的歡喜的執著，就爬不上去。看看哪！那些人都是已經我們說起來是已經真實相似見道，說大徹大悟的祖師很多是這種人，他有了這一念，上不去。我們現在差得十萬八千里，這個心裡面還這麼個放不下，這個我們要認識的。不是要去做到，我處處地方提醒，我們真正要認識的現在 ─正知見，見的就是見這個，然後呢慢慢地努力去對治它。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/013.mp3"},{"文":"《弟子書》中亦云：「如如於諸趣中«起樂想»，如是如是癡闇極重厚，","口譯":"《弟子書》中也說：「越是對諸趣生起快樂的想法，愚癡的黑暗就越是深重厚密；","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 04:38","頁":152,"af":"67b","st":278,"et":437,"消文":[{"文":"對六道輪迴「起樂想」，覺得是快樂的，這個愚癡非常重。"}],"延伸":[{"題":"起樂想","組":[{"題":"樣樣看不開","說":[{"類":"破","文":"這個放不下、那個放不下：利看不開，名也看不開，錢看不開，身體也看不開。"}]},{"題":"打了板爬不起來","說":[{"類":"例","文":"師父自述：打了板還趴在床上爬不起來；阿闍黎說「叭！你坐起來！」腳放下地，趕快穿衣服。"},{"類":"破","文":"「冷得要命，再擺在棉被裡，反正打頭板」，那你就害了。"}]},{"題":"快樂都是陷阱","說":[{"類":"立","文":"從任何一件事情，不要看成快樂的，這種快樂都是陷阱；這個念頭最重要。"}]},{"題":"說己過，為策勵弟子","說":[{"類":"因","文":"常說自己的過錯，是要你們不要害怕：受尊重的老師也滿身錯誤，認得錯在改。"},{"類":"破","文":"不是認得了道理看別人不是、跟別人講道理。"},{"類":"下手","文":"看見自己錯在哪裡，努力策勵：「我爬不起來，我偏要爬起來！」"}]}],"說":[{"類":"破","文":"這個放不下、那個放不下：利看不開，名也看不開，錢看不開，身體也看不開。"},{"類":"例","文":"師父自述：打了板還趴在床上爬不起來；阿闍黎說「叭！你坐起來！」腳放下地，趕快穿衣服。"},{"類":"破","文":"「冷得要命，再擺在棉被裡，反正打頭板」，那你就害了。"},{"類":"立","文":"從任何一件事情，不要看成快樂的，這種快樂都是陷阱；這個念頭最重要。"},{"類":"因","文":"常說自己的過錯，是要你們不要害怕：受尊重的老師也滿身錯誤，認得錯在改。"},{"類":"破","文":"不是認得了道理看別人不是、跟別人講道理。"},{"類":"下手","文":"看見自己錯在哪裡，努力策勵：「我爬不起來，我偏要爬起來！」"}],"af":"67b","st":278}],"逐字稿":[{"t":"67B 04:38","b":[["q","《弟子書》中亦云：「如如於諸趣中起樂想，如是如是癡闇極重厚，"],["s","嗯，就像這個樣，你對這個六道輪迴當中，如果說你「起樂想」，感覺得這是快樂的話，對不起，那你這個愚癡非常重。所以我們眼前看看真可憐哪！這個也放不下、那個也放不下，這個也看不開、這個也看不開。利固然看不開，名也看不開，錢固然看不開，身體也看不開。乃至於我常常覺得，打了板了還趴這個床上爬不起來，唉，實在是，實在是，我自己深深一直為這感覺 ……儘管跟你們說，策勵你們，問我自己做到了沒有？我老實說我沒做到。我只是經常提醒：打了板了，趕快起來！有時候頭昏了半天。我總記得，當年我這個阿闍黎告訴我的話：「叭！你坐起來！」然後坐起來，然後呢腳放下地，哎喲，冷得要命！好，趕快穿衣服。千萬不要說：「哎喲，冷得要命，再擺在棉被裡面，反正打頭板。」那你就害了。"]]},{"t":"67B 05:56","b":[["s","這個注意哦！就是你處處地方，這正知見最重要，這是我隨便一提。你從任何一件事情，不要看成快樂的，這種快樂的都是什麼？陷阱，陷阱！這是我們必定應該認識的一件事情。你有了這一個念頭，現在真正重要的就是，注意哦！這個念頭最重要。"]]},{"t":"67B 06:20","b":[["s","所以眼前我常常告訴你們我自己的過錯，這有個原因的，就是你們不要害怕！就算是現在你們覺得，很尊重的這樣的一個老師，他自己都有錯誤，不但有錯，滿身錯誤。可是真正重要的是什麼呢？我自己認得了錯誤在改。因為改，所以今天你們覺得能夠尊重他，尚且如此，何況是佛呢！所以你們只要 ……這個才是你們該學的地方。所以注意！真正重要的，不是認得了道理看別人不是，跟別人講道理。你必定要把這個道理，看見自己錯在哪裡，然後努力策勵自己：「我總歸要努力！對不起，我爬不起來，我偏要爬起來！」就是這個。所以告訴我們，你如果對這個地方起點樂想，錯了！反過來，"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/014.mp3"},{"文":"如如於諸趣中«起苦想»，如是如是癡闇極微薄。","口譯":"越是對諸趣生起痛苦的想法，愚癡的黑暗就越是微弱稀薄。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 07:17","頁":152,"af":"67b","st":437,"et":503,"消文":[{"文":"對快樂的事情能「起苦想」，愚癡慢慢減輕，這個東西叫智慧。"}],"延伸":[{"題":"起苦想","組":[{"題":"聰明用在觀照自己","說":[{"類":"立","文":"很多人腦筋很好，把腦筋用在這上頭就對了：這樣思惟，然後觀照自己。"}]},{"題":"對治見煩惱","說":[{"類":"例","文":"要跟人辯論時想：錯了，原來不是我有道理，是見煩惱重，話到嘴邊馬上吞下去。"}]},{"題":"對治思煩惱的習性","說":[{"類":"例","文":"冷得受不了又想縮進被窩：「不對，我寧願咬緊牙關多冷一下，一定要起來！」"}]}],"說":[{"類":"立","文":"很多人腦筋很好，把腦筋用在這上頭就對了：這樣思惟，然後觀照自己。"},{"類":"例","文":"要跟人辯論時想：錯了，原來不是我有道理，是見煩惱重，話到嘴邊馬上吞下去。"},{"類":"例","文":"冷得受不了又想縮進被窩：「不對，我寧願咬緊牙關多冷一下，一定要起來！」"}],"af":"67b","st":437}],"逐字稿":[{"t":"67B 07:17","b":[["q","如如於諸趣中起苦想，如是如是癡闇極微薄。"],["s","對一些那快樂的事情，你能夠「起苦想」，那麼你那個時候愚癡慢慢地減輕了，這個東西叫智慧。現在有很多人腦筋的確很好，然後你把那個腦筋用在這個上頭，那就對了。哦！應該這樣地思惟，然後呢觀照自己。你能夠觀照了以後，到那時候，你往往要跟人家辯論的時候想：欸，錯了、錯了！原來不是我有道理，是我是什麼？見煩惱重。那個時候，你話到嘴邊馬上吞下去。這個時候你的這個智慧慢慢地就增長了，愚癡就減少了，這個對見煩惱而言。同時呢對思煩惱這個習性來說，也是一樣，你平常的時候覺得：唉呀，冷得受不了，你剛才說的，又想縮到被窩裡。「欸，不對、不對，這個東西不行！我寧願在那裡咬緊牙關，然後多冷一下，然後策勵自己再穿衣服，一定要起來！」就這樣。說這個是平常我們應該知道的。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/015.mp3"},{"文":"如如修習«淨相»極增長，如是如是貪燄極熾然。","口譯":"越是修習清淨美好之相而讓它極為增長，貪欲的火焰就越是熾盛；","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 08:23","頁":153,"af":"67b","st":503,"et":560,"消文":[{"文":"對美好的東西覺得它好，貪心就增長。"}],"延伸":[{"題":"淨相","組":[{"題":"貪心越貪越厲害","說":[{"類":"立","文":"貪非常可怕，越貪越厲害，大家都有這個經驗；貪心永不能圓滿。"}]},{"題":"依眾靠眾的好處","說":[{"類":"立","文":"在大眾面前總覺得不好意思，靠著大家，多多少少少造一點罪。"},{"類":"破","文":"等到一個人的時候，你就害了。"},{"類":"下手","文":"凡是歡喜的東西，不要看見它是清淨美好的。"}]}],"說":[{"類":"立","文":"貪非常可怕，越貪越厲害，大家都有這個經驗；貪心永不能圓滿。"},{"類":"立","文":"在大眾面前總覺得不好意思，靠著大家，多多少少少造一點罪。"},{"類":"破","文":"等到一個人的時候，你就害了。"},{"類":"下手","文":"凡是歡喜的東西，不要看見它是清淨美好的。"}],"af":"67b","st":503}],"逐字稿":[{"t":"67B 08:23","b":[["q","如如修習淨相極增長，如是如是貪燄極熾然。"],["s","下面就是告訴我們，眼前對美好的東西，你把這個美好的，覺得它好的話，害了！這個東西貪心，貪心增長，貪這個東西非常可怕，是越貪是越厲害的。這我想我們大家都有這個經驗，你這麼越貪是越厲害的。所以這個「依眾靠眾」還有個好處，儘管我們現在理路或者清楚，或者不清楚，習性或者厲害，可是在大眾面前總覺得不大好意思，所以靠著大家多多少少，少造一點罪。等到你一個人的時候，你就害了，這貪心永不能圓滿。所以凡是我們歡喜的東西的話，不要看見它是清淨美好的。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/016.mp3"},{"文":"如如修習不淨極增長，如是如是貪燄極殄息。」","口譯":"越是修習不淨之相而讓它極為增長，貪欲的火焰就越是止息。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 09:20","頁":153,"af":"67b","st":560,"et":597,"消文":[{"類":"喻","文":"要看見這東西好可怕，是大騙子，給你一點小甜頭，把你送到地獄去。"},{"文":"初心修的人對貪心有不淨觀等特別的對治，以後講；這裡先了解原則。"}],"延伸":[],"逐字稿":[{"t":"67B 09:20","b":[["q","如如修習不淨極增長，如是如是貪燄極殄息。」"],["s","你要看見這個東西好可怕的，是大騙子，這個大騙子給你一點小小的甜頭，把你送到地獄裡面去，那時候你想到的話，你心裡面就對它起恐怖。當然真正的平常我們初心修的人，對貪心譬如說用不淨觀什麼等等，有它特別的對治，這個以後講，眼前這裡我們要了解這個原則。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/017.mp3"},{"文":"此說從無始來，執著三有盛事為樂，增益串習諸淨妙相。","口譯":"這是說：從無始以來，我們把三界裡那些興盛圓滿的事當成快樂，緊抓不放，又一再在心裡誇大它們，把它們想得很美好、很乾淨，習慣成自然。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 09:57","頁":153,"af":"67b","st":597,"et":627,"消文":[{"文":"無始以來虛妄顛倒，把三有中的好事看成快樂，一向把妄想以為正確，這個要認得它。"}],"延伸":[],"逐字稿":[{"t":"67B 09:57","b":[["q","此說從無始來，執著三有盛事為樂，增益串習諸淨妙相。"],["s","上面告訴我們，因為我們無始以來，我們虛妄顛倒的關係，把這個三有當中這種好事情，把它看成快樂。一向習慣，一向把這個妄想以為正確的，所以總把它看得這是好的，這個我們要認得它。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/018.mp3"},{"文":"能治此者，若修«苦性及不淨相»彼等便息，","口譯":"能對治這個的，是修習苦性與不淨相，那些（執樂、執淨）便會止息；","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 10:27","頁":153,"af":"67b","st":627,"et":756,"消文":[{"文":"最佳的對治是修苦性，原來這是苦的；還有修不淨觀。"}],"延伸":[{"題":"苦性及不淨相","組":[{"題":"觀受是苦，觀身不淨","說":[{"類":"立","文":"正修時修「觀受是苦、觀身不淨」，這是最難對治的兩樣東西。"},{"類":"因","文":"正確的方法，後面講煩惱的時候再提起。"}]},{"題":"事前認識，臨境對治","說":[{"類":"破","文":"煩惱真正轉的時候，誰都拿它沒辦法。"},{"類":"下手","文":"必須事前認識、思惟觀察，境界現起時有力的對治才生得起來。"},{"類":"立","文":"那時你歡喜：「今天我居然打了一個勝仗！」那個快樂才是真正的快樂。"}]},{"題":"吃得起勁，真的快樂嗎","說":[{"類":"例","文":"吃得很起勁，吃完肚子脹脹的，站也不是睡也不是，昏昏沈沈，到時候又要來了。"},{"類":"回扣","文":"如法地修學，這個就靜息了。"}]}],"說":[{"類":"立","文":"正修時修「觀受是苦、觀身不淨」，這是最難對治的兩樣東西。"},{"類":"因","文":"正確的方法，後面講煩惱的時候再提起。"},{"類":"破","文":"煩惱真正轉的時候，誰都拿它沒辦法。"},{"類":"下手","文":"必須事前認識、思惟觀察，境界現起時有力的對治才生得起來。"},{"類":"立","文":"那時你歡喜：「今天我居然打了一個勝仗！」那個快樂才是真正的快樂。"},{"類":"例","文":"吃得很起勁，吃完肚子脹脹的，站也不是睡也不是，昏昏沈沈，到時候又要來了。"},{"類":"回扣","文":"如法地修學，這個就靜息了。"}],"af":"67b","st":627}],"逐字稿":[{"t":"67B 10:27","b":[["q","能治此者，若修苦性及不淨相彼等便息，"],["s","它最佳的對治，什麼呢？修苦性，修苦性，說原來這是苦的；還有呢不淨，修不淨觀。實際上這個裡邊，正修的時候修什麼？「觀受是苦、觀身不淨」，這是我們最難對治的兩樣東西，最難對治的東西。但是它有正確的方法，正確的方法，下面將來告訴我們煩惱的時候，那時候我再提起。當你這個一個念頭生起來的時候，你那時候才了解了，原來你又在被煩惱轉。然後呢轉了以後，真正煩惱轉的時候，的的確確我們誰都拿它一點辦法都沒有，這個是可怕極了。所以你必須事前認識，然後呢思惟觀察，到境界現起的時候，這一個正法相應的這一種現行現起的時候，那個時候你有力的對治生起了。那時候你歡喜，「啊，今天我居然打了一個勝仗！」那個快樂真正的快樂。"]]},{"t":"67B 11:44","b":[["s","你平常吃的東西，當你吃的時候吃得很起勁，你真的快樂嗎？那大家不妨心平氣和想想看。我們大家都有這個毛病 ─貪心，唉呀，好東西，事前是越多越好；吃完了以後，哈，肚子吃得脹脹的，睡在那裡，站也不是、睡也不是，就這樣。當時真的快樂嗎？吃的時候並不覺得快樂耶，我想大家都有這個感覺。你是一個勁兒就在那個地方做那件事情，吃完了以後昏昏沈沈，然後到那個時候又要來了，快樂在哪裡啊？欸，但是奇怪，它就偏偏到那個時候就讓你去這樣做，這個就是這個真正的行相。這個煩惱止息的道理，慢慢地好好地學。那麼你能夠如法地修學的話，這個就靜息了。反過來，"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/019.mp3"},{"文":"若不修習便增癡貪，轉諸有輪，故修諸有過患為要。","口譯":"如果不修習，便會增長愚癡與貪欲，在三有之輪中流轉。所以修習三有的過患是最重要的。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 12:36","頁":153,"af":"67b","st":756,"et":844,"消文":[{"文":"不如法修對治，癡跟貪一直增長；貪裡一定有癡，得不到瞋也跟著來，三樣輾轉相應。"},{"文":"由此造業、輪迴三有跳不出來；要跳出來，就要修三有一切盛事的過患。"},{"文":"了解了才步步深入解脫，這進入第二個步驟，叫中士。"}],"延伸":[],"逐字稿":[{"t":"67B 12:36","b":[["q","若不修習便增癡貪，轉諸有輪，故修諸有過患為要。"],["s","所以如果說你不如法地去修行，修習這個對治法的話，那麼那個時候一直增長的癡跟貪，貪裡邊一定有癡。然後呢貪的最後的結果，得不到的話，瞋也跟著來，這個三樣東西就這樣的輾轉地相應。由於這個造業，然後輪迴三有，你沒辦法跳出來。既然前面你怕、厭惡，唯一的辦法就是這裡。所以現在曉得，啊，你真正要跳出來，要做些什麼呀？它說從這個上頭，從業感果的必然性，是了解我們真正要修的，是要修三有一切盛事的過患。然後從這個了解了以後，才步步深入能夠解脫，那個才是說進入更深一層，第二個步驟叫作中士。所以現在我們看看，那麼修中士這一個內容說些什麼呢？"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/020.mp3"},{"文":"中士道次修心分四：一正修意樂，二彼生起之量，三除遣於此邪執分別，四決擇能趣解脫道性。初中分二：一明求解脫之心，二發此之方便。今初","口譯":"中士道的修心次第分四部分：第一，正式修這種心；第二，這種心要生起到什麼程度才算數；第三，破除對它的錯誤想法；第四，弄清楚通往解脫的道路是什麼。第一部分又分兩點：一、說明什麼是希求解脫的心；二、生起這種心的方法。下面先講第一點。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 14:04","頁":153,"af":"67b","st":844,"et":905,"消文":[{"文":"正修意樂：正修的內容是什麼，心裡應該有什麼認識、怎麼做。"},{"文":"決擇能趣解脫道性：要修解脫，解脫道是怎麼一回事。"},{"文":"初中分二：求解脫的心是什麼，以及怎麼樣發生這樣的心。"}],"延伸":[],"逐字稿":[{"t":"67B 14:04","b":[["q","中士道次修心分四：一正修意樂，二彼生起之量，三除遣於此邪執分別，四決擇能趣解脫道性。初中分二：一明求解脫之心，二發此之方便。　今初"],["s","「中士道次修心分四」，第一個「正修意樂」，喏，正修的這個內容是什麼，我們心裡應該些什麼認識，怎麼樣的做法。「彼生起之量」，第二個。「三除遣於此邪執分別」，這個是一樣的。第四「決擇能趣解脫道性」，既然你要求解脫，最後了解了，說第四個那個地方，就現在告訴我們了，我們哪，你要修解脫嗎？對了，解脫道是什麼一回事情，解脫道是怎麼一回事情。現在次第來講：「初中分二」，就是正修意樂。「明求解脫之心」，求解脫的心是什麼？第二怎麼樣發生這樣的求解脫的心，所以「發此之方便」。今初。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/021.mp3"},{"文":"言解脫者，謂脫諸縛。此復業及煩惱，謂於生死是能繫縛，","口譯":"所謂解脫，就是脫離種種束縛。這束縛就是業與煩惱，它們是把我們繫縛在生死中的「能繫縛」。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 15:05","頁":153,"af":"67b","st":905,"et":932,"消文":[{"文":"解脫就是把綁住的解開來；綁住你的是業跟煩惱，把我們綁在生死當中。"}],"延伸":[],"逐字稿":[{"t":"67B 15:05","b":[["q","言解脫者，謂脫諸縛。此復業及煩惱，謂於生死是能繫縛，"],["s","所謂「解脫」，什麼樣呢？簡單，就是把綁住的把它解開來，這麼簡單法。那麼什麼東西綁住你啊？業跟煩惱，就是業跟煩惱把我們綁在生死當中，就是這麼簡單。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/022.mp3"},{"文":"即由此二增上力故。若依界判，欲界等三。以趣分別，謂天趣等或五或六。依生處門，謂胎等四，即於其中結蘊相續，是繫縛之體性。","口譯":"就是由這兩者的增上力：若依界來分，有欲界等三界；依趣來分，有天趣等五趣或六趣；依出生的方式來分，有胎生等四生。就在這當中結生五蘊、相續不斷，這就是（所）繫縛的體性。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 15:32","頁":153,"af":"67b","st":932,"et":1075,"消文":[{"文":"業跟煩惱輾轉增加，把你綁住；綁的範圍分三界：欲界、色界、無色界。"},{"文":"分趣是六趣或五趣，把修羅判作天趣就是五趣。"},{"文":"生處門是胎、卵、濕、化四生。"},{"文":"前面的蘊滅、後面的蘊生，是「結蘊相續」，這個相續體就是被綁住的。"},{"類":"喻","文":"就像繩子綑著你：繩子是業跟煩惱，你就是這個五蘊。"}],"延伸":[],"逐字稿":[{"t":"67B 15:32","b":[["q","即由此二增上力故。若依界判，欲界等三。以趣分別，謂天趣等或五或六。依生處門，謂胎等四，即於其中結蘊相續，是繫縛之體性。"],["s","說，是的，現在綁住你的就是業跟煩惱，由於這兩樣東西的輾轉增加，結果呢把你綁住了。那綁在哪裡呀？綁的地方，如果拿這個「界」，拿那個地方，拿那個範圍來區的話，三界：欲界、色界、無色界。然後在這個三界當中，如果分「趣」，就是我們分成功六趣，或者就是這個六個類型，那麼或者是六等，或者是五等。如果把修羅判作天趣的話，就是五等，有的把修羅叫作非天，這個沒關係。還有一種呢，「生處門」，就是在三界當中你怎麼去出生的，那麼分成功四：胎、卵、濕、化，就是這樣，不外乎這個。"]]},{"t":"67B 16:48","b":[["s","就是不管是三界，不管是六趣，不管是四生，總之前後業感緣起，前面的蘊滅，後面的蘊生，是「結蘊相續」。在這個裡邊繼續不斷地這個五蘊身，繼續不斷地向前推衍，說結生相續。那個蘊、五蘊，不是有一樣真實的東西。而這個五類東西，到那個時候舊的壞了，新的又生起來了，這一個東西，生新起來的繼續不斷向前面推衍下去，這個相續體，這個就是被綁住的這個。而業跟煩惱，綁住那個蘊體，就是這麼；就像那個繩子綑著你，就這麼簡單。這個繩子是業跟煩惱，現在這個你呢，就是這個蘊，五蘊。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/023.mp3"},{"文":"故從此脫，即名解脫，","口譯":"所以從這當中脫離，就叫做解脫；","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 17:55","頁":153,"af":"67b","st":1075,"et":1082,"消文":[{"文":"從這個地方解脫開來，就是。"}],"延伸":[],"逐字稿":[{"t":"67B 17:55","b":[["q","故從此脫，即名解脫，"],["s","就是這樣，從這個地方解脫開來，就是！"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/024.mp3"},{"文":"欲求得此，即是希求解脫之心。","口譯":"一心想得到這種解脫，這樣的心，就是我們說的「求解脫的心」。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 18:02","頁":153,"af":"67b","st":1082,"et":1094,"消文":[{"文":"「不要被它綁住，我一定要想辦法跳出來」，就是這個。"}],"延伸":[],"逐字稿":[{"t":"67B 18:02","b":[["q","欲求得此，即是希求解脫之心。"],["s","你現在呢要想從這個地方，說唉呀，不要被它綁住，我一定要想辦法跳出來，就是這個，就是這樣！"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/025.mp3"},{"文":"又此解脫，非為惑業諸行生已息滅，以諸生法，於第二時定不安住，不待修習能治等緣，則不須勵力，一切解脫便成過失，","口譯":"再者，這個解脫，並不是指惑、業等諸行生起之後自然息滅；因為一切有生之法，到了第二剎那一定不會安住，若這樣就算解脫，那就不必依靠修習對治等因緣、不須努力，一切都會自然解脫，這就成了過失。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 18:14","頁":153,"af":"67b","st":1094,"et":1199,"消文":[{"文":"業跟煩惱的諸行前滅後生，生滅不停，生完自己就會消滅。"},{"文":"如果不修習對治，它就繼續不斷地生滅相續下去；必定要修習對治，斷了這個相續。"}],"延伸":[],"逐字稿":[{"t":"67B 18:14","b":[["q","又此解脫，非為惑業諸行生已息滅，以諸生法，於第二時定不安住，不待修習能治等緣，則不須勵力，一切解脫便成過失，"],["s","前面我們不是說業跟煩惱是能綁的東西，然後呢結蘊相續，就是我們生死的流轉的這個所綁的東西。那麼業跟煩惱的，說這個裡邊這樣，說這個業跟煩惱的諸行，它這個前面滅，後面的生。生完了以後它又滅，滅完了以後又生，生滅不停的。所以它生完了以後，它自己就會消滅。「以諸生法，於第二時定不安住」，它那個結蘊的事情，本身就是永遠生滅，永遠生滅。「不待修習」，假定說你不要去修習，說「不待修習能治等緣，則不須勵力，一切解脫便成過失」，就是說，那結蘊的體本身是什麼東西？找不到。它是怎麼一個？生滅繼續相續，換句話它一直相續的，一直相續下去的。這種情況之下，你必定要修習對治，斷了這個相續，那就對了。否則的話，如果你不修習對治的話，是呀，如果你不修習的話，對不起，它本身啊，它繼續不斷地就生滅、生滅、生滅。所以，"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/026.mp3"},{"文":"故若未生對治，當於未來結生相續。","口譯":"所以如果沒有生起對治，未來還會結生相續。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 19:59","頁":153,"af":"67b","st":1199,"et":1207,"消文":[{"文":"沒有修這個對治，它永遠接下去。"}],"延伸":[],"逐字稿":[{"t":"67B 19:59","b":[["q","故若未生對治，當於未來結生相續。"],["s","所以你沒有修這個對治的話，它永遠接下去。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/027.mp3"},{"文":"由其發起對治力故，結生相續即便止息。","口譯":"由於發起了對治力，結生相續就會止息。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 20:07","頁":153,"af":"67b","st":1207,"et":1555,"消文":[{"文":"針對結生相續修習，它就停止，繫縛也就沒有了。"},{"文":"求解脫一定要有正確的方法；方法的內容留在下一次講。"}],"延伸":[],"逐字稿":[{"t":"67B 20:07","b":[["q","由其發起對治力故，結生相續即便止息。"],["s","你一定要修習，針對著這個生死流轉的結生相續，那麼它那個東西就停止了；那個停止了以後，那個繫縛也就沒有了。所以這個地方特別告訴我們，我們要求解脫心，那麼要求什麼解脫心呢？就要對這個結生相續，要找到如法如理的對治，對治了這個東西以後，那麼這個解脫才能夠具體地成就。了解了，所以說，哦，要求解脫，要一定要有解脫的方法，正確的方法，簡單的一句話就是這個。至於這個方法的內容呢，我想留在下面一次再講，今天這一堂就講到這個地方。"]]},{"t":"67B 21:09","b":[["s","今天，《菩提道次第廣論》一百五十三頁，卷六，共中士，中士道。那麼這個中士，由於前面那個基礎上來，我們進一步了解說，雖然人天當中保持了善趣，是善道，但是畢竟最後還要墮落。由於這個原因，所以想到畢竟墮落還是苦，這樣不行，進一步還要更求進一步的解決。那麼那個從這個基礎上面，又向上一步，這個叫中士。那麼次第呢分四部分：正修意樂，哪一個是正式的，就是我們說中士要修的。換句話說我們的心裡的內容，我們應該有的認識，以及心裡這個狀態是什麼樣。那麼怎麼樣才能夠發生這樣的一個狀態，他告訴我們的，用什麼方法才行。這了解了以後，有一種錯誤的概念要去掉。對正確的了解了，錯誤的去掉了，最後告訴我們，那麼現在修什麼樣的道，能夠達到你這個目的。這個分這個四科，這個次第層層推進，圓成我們的目標。"]]},{"t":"67B 23:16","b":[["s","那麼前面已經說過，所謂求解脫的心是指什麼樣的心？那麼這個心怎麼樣才能夠發起？平常說我們大家都希望，沒有一個人例外的，要想從痛苦當中脫出來，要想從痛苦當中脫出來。沒有一個人例外的，可是找不到，原因呢就是自己的愚癡，自己的愚癡。因為愚癡、不了解，所以不曉得從哪裡去找。現在我們很幸運地曉得，哦，要去找一定從那個方面，這個就歸結到從三寶。那麼更從那個地方了解了，單單前面這個不夠，更進一步到這裡。"]]},{"t":"67B 24:15","b":[["s","那麼說現在呢，雖然我們進一步要求解脫，但是這個解脫的心，是曉得解脫，怎麼樣才能夠使得這樣的這個內心，跟它相應的如理如量地生起來？雖然我們大家都會這樣覺得：唉呀，這要求解脫啊！雖然你要求解脫，但是想完了以後，那下面就沒有一個力量來推動你，沒有一個力量來推動你，這樣。因為沒有推動的力量，所以當你想的時候儘管想，想完了以後，仍舊陷在自己一向的這一種習性當中，這種習性就是無明相應的見思煩惱。那種見思煩惱，儘管你拿來閱讀佛經，有的讀了半天增長各式各樣的知見，增長各式各樣的知見。結果呢它本來是要指導我們，憑這個去跳出輪迴的，淨化這個知見的；結果你弄了個半天，知見增長了一大堆。知見增長了，慢心也跟著增長，結果是煩惱是越弄越多。所以在這地方我們要很善巧地，找到這個正靜息的方便。那麼現在他下面告訴我們："]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/028.mp3"},{"文":"第二«發此之方便»者。","口譯":"第二、發起此（希求解脫）心的方便。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 25:55","頁":153,"af":"67b","st":1555,"et":1568,"消文":[{"文":"怎麼樣能夠啟發這樣一個如理如量的認識。"}],"延伸":[{"題":"發此之方便","組":[{"題":"中士四科，層層推進","說":[{"類":"因","文":"下一堂開頭複習：正修意樂、生起之量、除遣邪執、決擇解脫道性，次第層層推進。"}]},{"題":"求脫苦而不得其門","說":[{"類":"因","文":"沒有一個人不想從痛苦中脫出來，可是找不到，原因是自己的愚癡。"},{"類":"立","文":"我們很幸運曉得要從三寶去找，更從這裡進一步。"}]},{"題":"沒有推動之力","說":[{"類":"破","文":"想求解脫，想完了沒有一個力量推動你，仍舊陷在無明相應的見思煩惱習性中。"},{"類":"破","文":"讀經增長一大堆知見，慢心也跟著增長，煩惱越弄越多。"},{"類":"回扣","文":"所以要很善巧地找到正靜息的方便，下面就告訴我們。"}]}],"說":[{"類":"因","文":"下一堂開頭複習：正修意樂、生起之量、除遣邪執、決擇解脫道性，次第層層推進。"},{"類":"因","文":"沒有一個人不想從痛苦中脫出來，可是找不到，原因是自己的愚癡。"},{"類":"立","文":"我們很幸運曉得要從三寶去找，更從這裡進一步。"},{"類":"破","文":"想求解脫，想完了沒有一個力量推動你，仍舊陷在無明相應的見思煩惱習性中。"},{"類":"破","文":"讀經增長一大堆知見，慢心也跟著增長，煩惱越弄越多。"},{"類":"回扣","文":"所以要很善巧地找到正靜息的方便，下面就告訴我們。"}],"複習":true,"af":"67b","st":1269}],"逐字稿":[{"t":"67B 25:55","b":[["q","第二發此之方便者。"],["s","怎麼樣能夠啟發這樣一個如理如量的認識。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/029.mp3"},{"文":"譬如欲得止息渴苦，由於渴逼，見非愛相。","口譯":"譬如想要止息口渴之苦，是因為被渴所逼迫，看見了它不可愛的樣子。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 26:08","頁":153,"af":"67b","st":1568,"et":1633,"消文":[{"文":"嘴巴渴得痛苦不堪，就一心一意要去找水喝。"},{"類":"喻","文":"小病叫你看醫生也懶得看；病痛苦難受了，叫你不看也做不到。"},{"文":"感到它可怕、痛苦，由這個力量逼迫，才會一心去求從痛苦中透脫。"}],"延伸":[],"逐字稿":[{"t":"67B 26:08","b":[["q","譬如欲得止息渴苦，由於渴逼，見非愛相。"],["s","那麼先舉一個譬喻。譬如說我們嘴巴渴了以後，覺得痛苦不堪，那麼你一心一意要想去找水喝。為什麼？因為你覺得嘴巴渴的時候，那是痛苦難受。這個譬喻我們可以更加深一點說，你生了病，假如那個小病沒有關係的話，叫你去看醫生你也懶得看。但是那個病痛苦難受的話，叫你不看醫生也做不到。同樣的道理，一定是對於這件事情感到它的非可愛，就是應該這麼反面的，更強烈說可怕、痛苦的這種狀態，由於這個力量逼迫，所以你一心就去求怎麼解脫痛苦，怎麼從痛苦當中透脫出來。所以"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/030.mp3"},{"文":"如是欲得，諸取蘊苦寂滅解脫，亦由觀見，取蘊苦性«所有過患»。","口譯":"同樣地，想要得到諸取蘊之苦寂滅的解脫，也要靠觀見取蘊（身心五蘊）是苦性的種種過患。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 27:13","頁":153,"af":"67b","st":1633,"et":1724,"消文":[{"文":"取蘊就是我們身心的五蘊，它的特質是苦，以及苦的種種過失患害；真實見到了，才會一心求跳出來。"}],"延伸":[{"題":"所有過患","組":[{"題":"不見過患，求脫是空話","說":[{"類":"立","文":"見到了才會找解脫道、努力去修；這是道的根本。"},{"類":"破","文":"沒有這個力量，推動你的力量都沒有，嘴巴上都是空話。"}]},{"題":"處處把握原則","說":[{"類":"例","文":"為什麼要持戒？同樣要把握得住這個原則。"},{"類":"破","文":"否則弄弄弄就弄錯掉了。"}]}],"說":[{"類":"立","文":"見到了才會找解脫道、努力去修；這是道的根本。"},{"類":"破","文":"沒有這個力量，推動你的力量都沒有，嘴巴上都是空話。"},{"類":"例","文":"為什麼要持戒？同樣要把握得住這個原則。"},{"類":"破","文":"否則弄弄弄就弄錯掉了。"}],"af":"67b","st":1633}],"逐字稿":[{"t":"67B 27:13","b":[["q","如是欲得，諸取蘊苦寂滅解脫，亦由觀見，取蘊苦性所有過患。"],["s","同樣的，現在我們要想從這個苦蘊當中得到解脫，解決這個苦，也必須見到這個取蘊 這個取蘊就是我們身心的五蘊 它那個特質是苦的，以及它這個苦的種種的過失、患害。當你真實地見到了，那個時候你才一心一意才會求它跳出來。你要見不到這個的話，那根本不可能，所以說這個是道的根本在這裡。因為你要從這個地方求解脫，有找到了解脫的這個道，進而去找，找到了解脫之道，那時候你才會努力去修。你沒有這個力量的話，推動你的力量都沒有啊，所以嘴巴上面都是空話，原因在此。我們每一個地方必定要把握得住！乃至於現在你說，你為什麼要持戒？同樣的道理，你必定要把握得住這個原則，這個是最重要的。否則的話，你弄弄弄就弄錯掉了，弄弄弄就弄錯掉了。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/031.mp3"},{"文":"故若未修三有過患，於彼發起欲捨之心，則於苦滅不起欲得。","口譯":"所以如果沒有修習三有的過患，對它生起想要捨離的心，那麼對於苦的寂滅，就不會生起想要得到的心。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"67B 28:44","頁":153,"af":"67b","st":1724,"et":null,"消文":[{"文":"第一件事先要認識苦蘊所在的三有的種種禍患、不理想。"},{"文":"見到了就產生厭惡捨離，為了跳出來，才會去求解除痛苦的方法。"}],"延伸":[],"逐字稿":[{"t":"67B 28:44","b":[["q","故若未修三有過患，於彼發起欲捨之心，則於苦滅不起欲得。"],["s","所以第一件事情，我們先一定要認識苦蘊所在的三有，這個三有的種種禍患，種種的不理想。當你見到了不理想、禍患的話，你就一心一意產生厭惡捨離，一心一意從這個地方跳出來。為了要跳出來，你就想怎麼樣才把這個痛苦能夠解除，你才會去求解除的這個方法。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/032.mp3"},{"文":"《四百論》云：「誰於此無厭，彼豈敬寂靜，如«貪著自家»，難出此三有。」","口譯":"《四百論》說：「誰對此（三有）沒有厭離，他怎麼會敬重寂靜（涅槃）？就如同貪戀自己的家一樣，難以出離這三有。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68A 00:15","頁":153,"af":"68a","st":15,"et":345,"消文":[{"文":"不生厭離心，怎麼可能求寂滅；見到三有這麼好，貪著難捨，怎麼可能跳出來。"}],"延伸":[{"題":"貪著自家","組":[{"題":"不知為何而學，空轉一生","說":[{"類":"破","文":"說要修行、受戒、出家、認真去學，根本沒把握住為什麼來學，知見學問一大堆，始終在空轉。"}]},{"題":"先把握根本因","說":[{"類":"立","文":"先把根本因指出來；根本因有了，在上面著力，慢慢增長圓滿就行了。"},{"類":"破","文":"否則忙了半天，圓滿的是染污之因，越做越遠。"}]},{"題":"三世怨","說":[{"類":"例","文":"修福德沒把握根本因，將來福報很大；做學問，這一世很聰明；持戒相，轉世聲望官位很高。"}]},{"題":"根本把握，修哪門都對","說":[{"類":"例","文":"念佛如救頭燃，那句佛號就念得非常堅固；持戒曉得目的，就很努力；做學問也是。"},{"類":"破","文":"否則處處諍論，我對你錯。"}]},{"題":"兩種偏差","說":[{"類":"破","文":"一種忙著要解脫、不管方法，關起門修了半天，在煩惱中轉不知道。"},{"類":"破","文":"一種先作學問，不曉得目的，比較各宗各派，諍論不曉得引起多少。"},{"類":"回扣","文":"所以這裡特別告訴我們：希求解脫的方法，根本何在。"}]}],"說":[{"類":"破","文":"說要修行、受戒、出家、認真去學，根本沒把握住為什麼來學，知見學問一大堆，始終在空轉。"},{"類":"立","文":"先把根本因指出來；根本因有了，在上面著力，慢慢增長圓滿就行了。"},{"類":"破","文":"否則忙了半天，圓滿的是染污之因，越做越遠。"},{"類":"例","文":"修福德沒把握根本因，將來福報很大；做學問，這一世很聰明；持戒相，轉世聲望官位很高。"},{"類":"例","文":"念佛如救頭燃，那句佛號就念得非常堅固；持戒曉得目的，就很努力；做學問也是。"},{"類":"破","文":"否則處處諍論，我對你錯。"},{"類":"破","文":"一種忙著要解脫、不管方法，關起門修了半天，在煩惱中轉不知道。"},{"類":"破","文":"一種先作學問，不曉得目的，比較各宗各派，諍論不曉得引起多少。"},{"類":"回扣","文":"所以這裡特別告訴我們：希求解脫的方法，根本何在。"}],"af":"68a","st":15}],"逐字稿":[{"t":"68A 00:15","b":[["q","《四百論》云：「誰於此無厭，彼豈敬寂靜，如貪著自家，難出此三有。」"],["s","任何一個人，對於這一個事情，如果不產生厭離心的話，他怎麼可能求寂滅這個厭離的方法呢？不可能的。反過來，他因為不了解這個三有的過患，而他見到三有這麼個好，所以他貪著難捨。既然貪著難捨，怎麼可能讓他從這個地方跳出來，怎麼可能從這個地方跳出來？所以啊現在有很多人哪，哎呀，要修行，說是要修行，喔唷，乃至於說受戒，乃至於出家，乃至於認真地去學；學了半天，他根本就沒把握住 ─你為什麼要跑得來學？他把握不住。所以到後來，知見一大堆，學問做了一大堆，有很多這樣。結果呢他始終在那個地方空轉，那是非常可惜，那是非常可惜！"]]},{"t":"68A 01:34","b":[["s","所以在這個地方，他首先把那個根本因指出來，換句話說，那個根本因有了，然後你在這個上面著力的話，把那個根本因慢慢增長圓滿，也就行了。否則的話，你忙了半天，忙了半天你所圓滿了什麼？染污之因，越做越遠，越做越遠哪，這一點是我們在這個地方首先應該認識。有了這個認識，然後你步步深入，所有的這些事情，都是幫忙我們解脫生死的。如果你這一個不認識，然後你跑進去的話，你那個知見都是不相應的，都是不相應的，這樣。那麼這種知見到後來呢，如果說你修的功德，那三世怨，到那個時候你很有錢；如果說你做學問，三世怨，你很有學問，就是這樣。"]]},{"t":"68A 02:35","b":[["s","所以現在有很多很有學問的人，很有財勢的人，乃至於很有地位的人，那種人他不能進入佛法的原因是什麼？就是有一類他修福德，啊，也在佛門當中布施、弄啊，修廟乃至於，但是根本因在哪裡，沒有把握得住。開始他是對的，沒有把握得住，所以他將來得到福報很大。有一類他那個時候，然後呢做學問做得很多，哎呀，經哪、律啊、論，然後深入思惟、觀察，乃至於講說，但是同樣地，根本因沒有把握得住，這一世很聰明，乃至於念書念得很好。有一類，持戒的戒相上面啊，做得非常地如宜，但是雖然如此，他真正的自淨其意，他的根本，為什麼要持這個戒的目的把握不住，這一轉世的時候，他聲望 ─說官位很高，那這個都是這樣來的。"]]},{"t":"68A 03:54","b":[["s","所以現在在這個地方，不管我們將來學什麼，你這一個根本因一定要把握得住，把握得住以後，然後不管你修哪一個都對。譬如說我們現在淨土念佛，是正因為如此，所以你那時候如救頭燃，「唉呀，別的我管不到啦，我只有一心一意依靠阿彌陀佛啊！」那時候你那句佛號就念得非常堅固。如果你持戒的話，你曉得得非常清楚，原來這戒的目的是在這個地方，自然而然你把握得住了，你就很努力。做學問也是如此。否則的話，我們處處地方產生諍論，說我這個對、你這個錯，然後呢大家又要忙這個、忙這個。在佛世的時候，這個典型的例子就是這樣。佛就告訴他這樣，喔，他聽見了，全部精神貫注在他自己的問題上，要解決這個問題。如果他解決了，解決了以後他煩惱解脫了，那個時候你再做就好了。"]]},{"t":"68A 05:00","b":[["s","那我們現在，不，有一種人比較差的，哎呀，忙著要去解脫，不管這些。結果呢，方法得不到，儘管你關起門來修行，修了半天，在煩惱當中轉，不知道。那麼反過來有一類人是先要了解，然後去作學問，作了學問作了半天，他不曉得作學問的目的是什麼，然後比較各宗、各派、各家、各門，這個對、這個不對，學問一大堆，諍論不曉得引起多少，也跑到外頭去，這個我們必須要認識的。所以現在這個地方特別告訴我們，喏，希求解脫的方法，根本何在！那看下去，說："]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/033.mp3"}],"投影片":[{"img":"投影片/xiqiu-jietuo-01/001.webp","n":1},{"img":"投影片/xiqiu-jietuo-01/002.webp","n":2,"
