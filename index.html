苦諦──生死的過患，二、思惟集諦──流轉的次第。第一又分二：一、顯示四諦中先說苦諦的意趣，二、正修苦諦。以下說第一。","四家合註":null,"時":"68A 06:36","頁":154,"af":"68a","st":396,"et":486,"消文":[{"文":"先認識、觀察、思惟：生死的特質是苦，確確實實是苦。"},{"文":"再問：為什麼會在生死當中流轉？"},{"文":"先說明四諦為什麼先講苦諦，然後正講苦諦。"},{"文":"平常覺得「告訴我們就好」，找不到必須這樣說的理由；實際上有絕大的原因。"}],"延伸":[],"逐字稿":[{"t":"68A 06:36","b":[["q","一初中分二：思惟苦諦生死過患，"],["s","第一個先要了解、認識、觀察、思惟，這個生死的特質是什麼？苦，是苦。確確實實這一個是苦的。第二個呢，"]]},{"t":"68A 06:55","b":[["q","二思惟集諦流轉次第。"],["s","那麼為什麼會在生死當中流轉呢？為什麼呢？這樣。這個兩部分，又一一各別分開來講。"]]},{"t":"68A 07:11","b":[["q","初中分二：一顯示四諦先說苦諦之意趣，二正修苦諦。　今初"],["s","先說明四諦，說苦集滅道，為什麼先要講苦諦的原因，然後正講苦諦，現在說下去。要平常在我們一般狀態學的時候，我們就說：「經上面嘛告訴我們苦集滅道，你就告訴我們算囉！他為什麼要講，哦，『先說苦諦』啊、為什麼啊，這個次第為什麼要這講啊？」這樣。平常我們說：「啊！你趕快告訴我，告訴我們曉得嘛就好啦！」好像那個道理表面上面，我們找不到必須要說的理由，通常我們這種狀態。實際上呢，這個有他的絕大的原因在，絕大的原因在，現在我們把這個文看下去。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/002.mp3"},{"文":"集諦為因，苦諦是彼之果，故集是先，果應是後。","口譯":"集諦是因，苦諦是它的果，所以集應在先，果應在後。","四家合註":null,"時":"68A 08:06","頁":154,"af":"68a","st":486,"et":533,"消文":[{"文":"流轉生死的因是集，感得的果是苦。"},{"文":"照先後次第，應該集在先、苦在後。"}],"延伸":[],"逐字稿":[{"t":"68A 08:06","b":[["q","集諦為因，苦諦是彼之果，故集是先，果應是後。"],["s","集就是因。由於造了這個因，聚集了這個因，那麼感得的這個因的果。流轉生死的因是集，然後呢感得流轉生死的果是苦，所以照這個先後的次第，應該是集在先而苦在後。結果呢，世尊卻先講苦，後講集，所以說：為什麼原因世尊不順那個次第？"]]}],"口譯音":"口譯音檔/siwei-kudi-01/003.mp3"},{"文":"何故世尊不順彼義之次第而作是說，諸苾芻此是苦聖諦，此是集聖諦耶？","口譯":"為什麼世尊不依照這個義理的次第，卻這樣說：「諸比丘，這是苦聖諦，這是集聖諦」呢？","四家合註":null,"時":"68A 08:53","頁":154,"af":"68a","st":533,"et":559,"消文":[{"文":"世尊正講時先說「這是苦」，再說「這是集」，次第恰恰相反，什麼原因？"}],"延伸":[],"逐字稿":[{"t":"68A 08:53","b":[["q","何故世尊不順彼義之次第而作是說，諸苾芻此是苦聖諦，此是集聖諦耶？"],["s","世尊正講的時候先告訴我們：這個是苦啊，你應該知道，這是集啊！他那個次第卻先講苦然後講集，恰恰相反，什麼原因呢？下面就說："]]}],"口譯音":"口譯音檔/siwei-kudi-01/004.mp3"},{"文":"大師於此違因果次第而宣說者，以«有至大修持扼要»，故無過失。","口譯":"大師在這裡違反因果次第來宣說，是因為其中有極重大的修持扼要，所以沒有過失。","四家合註":null,"時":"68A 09:19","頁":154,"af":"68a","st":559,"et":750,"消文":[{"文":"佛把因果次第顛倒來說，有特別的原因：修行的綱要在這裡。"},{"文":"學了要去修，修的次第就是這樣，所以沒有任何過錯。"}],"延伸":[{"題":"修持扼要","組":[{"題":"缺少推動修行的力量","說":[{"類":"立","文":"我們不能修行，是缺少推動修行的力量：曉得要修，就是提不起來。"},{"類":"例","文":"故事中看見地獄、天堂的情況這麼嚴重，不管年輕年老都拼命了。"}]},{"題":"身病求醫，心苦求脫","說":[{"類":"喻","文":"生了病，該做的事都不願做，急著找醫生；病只是小小的苦。"},{"類":"立","文":"心理上也感受到苦切的力量，就坐立不安，一心求解脫。"},{"類":"回扣","文":"所以先說苦諦，這是修行的次第，這是正確的。"}]}],"說":[{"類":"立","文":"我們不能修行，是缺少推動修行的力量：曉得要修，就是提不起來。"},{"類":"例","文":"故事中看見地獄、天堂的情況這麼嚴重，不管年輕年老都拼命了。"},{"類":"喻","文":"生了病，該做的事都不願做，急著找醫生；病只是小小的苦。"},{"類":"立","文":"心理上也感受到苦切的力量，就坐立不安，一心求解脫。"},{"類":"回扣","文":"所以先說苦諦，這是修行的次第，這是正確的。"}],"af":"68a","st":559}],"逐字稿":[{"t":"68A 09:19","b":[["q","大師於此違因果次第而宣說者，以有至大修持扼要，故無過失。"],["s","第一個告訴我們，說佛對於這一件事情，把那個因果次第顛倒違反而說，他有他的特別的原因的。什麼原因？修行的綱要在這裡。你為什麼要學？你要學了去修行，結果你要修行的，那個次第就是這樣的，所以沒有任何過錯，沒有任何過錯。反過來說，他就是絕對正確地要這樣講，世尊之所以為世尊，原因就在這個地方。關於這一點，對於我們有一個非常重要的啟示。我們平常所以不能修行的原因，就是缺少了推動我們修行的力量，曉得這個要修行，要好，但是就提不起來。那麼我們以前聽過那個各式各樣的故事，那個故事都是這樣的：哎呀，他去了，出了家也不行。結果跑到地獄裡一看，跑到天堂上一看，哎呀！那個時候不管他年輕也好、年老也好，大家都拼命了。為什麼？啊！原來看見這個情況是這麼個嚴重。"]]},{"t":"68A 10:50","b":[["s","那麼同樣地，對我們也是一樣。我們雖然沒有這個福德因緣，感得佛菩薩帶我們到天堂地獄去看看，但是我們眼前都遭受到了。哦，一生了病，哎唷，生了病趕快去找醫生啊，這個事情，要該做的事情都不願意。你就急著、忙著，病是件小小的苦，你就拼命去找醫生。所以現在這個地方也指出來，說喏、喏、喏，這一個東西本身哪，是在大病、大苦當中啊！那麼他指出來了以後，如果說你能夠如理照他指出來的方法，一步一步地深入，那個時候你內心上面就產生一種狀態，什麼？覺得這個痛苦的逼迫性，就在這裡啊！那是無法忍受，你就拼命要去求解脫了。所以他為什麼要先說的次第。"]]},{"t":"68A 11:56","b":[["s","從剛才這個說的譬喻當中，我們也可感受得到，假定我們在生理上面遭到了病，我們會求醫。現在呢，照著這個方法，在心理上面，如果你也感受得到苦切的這種力量的話，你那時候就會坐立不安。坐立不安幹什麼？一心求解脫。你能夠這樣去，哪有不解脫的道理？所以這個是修行的次第，這個是正確的，這是正確的。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/005.mp3"},{"文":"此復云何，謂諸所化，若於生死自先未發無倒希求解脫之心，«根本斷絕»，彼於解脫云何能導。","口譯":"這是怎麼說呢？就是說：所化的眾生，如果對於生死，自己先沒有生起無顛倒的希求解脫之心，根本就斷絕了，那要怎麼引導他趣向解脫呢？","四家合註":null,"時":"68A 12:30","頁":154,"af":"68a","st":750,"et":1069,"消文":[{"文":"所化：世尊要化度的眾生。"},{"文":"對生死的本質不了解，貪著難捨，根本不想求解脫。"},{"文":"修是修解脫，根本不想解脫還教他修，那不是顛倒嗎？所以根本已經斷絕。"},{"類":"例","文":"彼於解脫云何能導：教他不要貪著，他覺得「這是我要的」，聽了生煩惱，越弄越遠。"}],"延伸":[{"題":"根本斷絕","組":[{"題":"先問來此的目的","說":[{"類":"下手","文":"不要說我在修行，先問問：你跑到這裡來，目的幹什麼？要很清楚。"}]},{"題":"宿生善根引入佛門","說":[{"類":"立","文":"今天有機會接觸佛法，都是宿生有善根。"},{"類":"因","文":"異熟、等流、士用：裡邊的因碰見外面的緣，看見出家就歡喜。"}]},{"題":"求解脫的根本因未立","說":[{"類":"因","文":"經過生死流轉迷糊掉了，又與世間染污、無始無明習氣相應。"},{"類":"例","文":"一心嚮往出家、求善知識、念佛，推動的因卻根本沒找到。"},{"類":"立","文":"作主的是無始生死的染心，求解脫的根本還沒建立，這叫根本斷絕。"}]},{"題":"以正知見破染污現行","說":[{"類":"下手","文":"先要有正確知見的認識，經過懺悔，把世俗染污的現行破壞、克服。"},{"類":"回扣","文":"大師外支已成，真正的問題都在自己的障礙當中。"}]}],"說":[{"類":"下手","文":"不要說我在修行，先問問：你跑到這裡來，目的幹什麼？要很清楚。"},{"類":"立","文":"今天有機會接觸佛法，都是宿生有善根。"},{"類":"因","文":"異熟、等流、士用：裡邊的因碰見外面的緣，看見出家就歡喜。"},{"類":"因","文":"經過生死流轉迷糊掉了，又與世間染污、無始無明習氣相應。"},{"類":"例","文":"一心嚮往出家、求善知識、念佛，推動的因卻根本沒找到。"},{"類":"立","文":"作主的是無始生死的染心，求解脫的根本還沒建立，這叫根本斷絕。"},{"類":"下手","文":"先要有正確知見的認識，經過懺悔，把世俗染污的現行破壞、克服。"},{"類":"回扣","文":"大師外支已成，真正的問題都在自己的障礙當中。"}],"af":"68a","st":750}],"逐字稿":[{"t":"68A 12:30","b":[["q","此復云何，謂諸所化，若於生死自先未發無倒希求解脫之心，根本斷絕，彼於解脫云何能導。"],["s","那就是這樣。對於所化的，就世尊要化度的那些眾生，他假定對於這個生死的本質並不了解，貪著難捨，根本不想求解脫，根本不想求解脫，那個時候你教他修，修什麼啊？修是修解脫，現在我根本不想修解脫，你修，那不是顛倒嗎？所以這根本已經斷絕了。諸位啊，這個地方好好地想一想，不要說我在那兒修行，我跑到那兒修行，你先問問：你跑到這裡來目的幹什麼啊？要很清楚、很明白。有一點我們必定要了解的，所有在座的各位，乃至於儘管不出家，今天跟佛法有機會接觸，都是宿生有善根。從前面我們講的業果的道理當中，曉得這個異熟同時有個等流，然後呢還有士用。士用就是外面的客觀的環境，異熟就是我們現在的這個身心的果報，然後呢等流就是心理，心生起的狀態。這個是宿生的善根所集，所以這一世，裡邊的因碰見外面的緣，你看見了出家你就歡喜，就會走上去。"]]},{"t":"68A 14:25","b":[["s","但是他為什麼要這樣走的這個根本的因，經過了這樣的生死的流轉以後，迷糊掉了。再加上出世了以後，前面所接觸的，都是世間染污，而這個染污呢，又是跟我們無始以來所種的這個無明習氣相應。所以以前一直都引發這個東西，所以在非常強有力的，世俗的這種貪染的現行當中，那個時候，對於求解脫這個心一點都沒有。當你接觸了以後，雖然啟發了好樂之心，跑到佛門當中來，但是那個根本本身有沒有？還沒有。這是所以一定第一件事情，要有正確的知見上的認識，經過懺悔，把前面跟世俗染污的這個現行，要把它破壞，還要把它克服。那個時候，他內心當中，引發出來這個認識，那個時候，你會心裡說：啊，要求解脫！"]]},{"t":"68A 15:47","b":[["s","我自己的經驗，以及我遇見很多同修，他就是一心一意，啊！對於出家的嚮往，然後呢要求善知識。儘管出家，儘管求善知識，但是呢，根本因真正找到的非常少。他也想去念佛，覺得念佛好，但是呢他這個推動的因始終不強；實際上與其說始終不強，這個推動的因根本都沒找到，就是這種狀態。就是宿生的這個善業，加上這一生的一個雜染，你糊裡糊塗有這種力量在這個裡頭的，但是呢他抉擇不出來。所謂抉擇不出來的話就是，不是以這個力量為主的，不是以這個力量主的。那麼是哪一個力量主的呢？就是 ─喏，無始生死的染心。現在我們雖然來了以後，對不起，眼睛所看，耳朵所聽，都是世俗上的那種，哎呀，知見上面、習性上面，種種的這些事情。所以說這個，他真正求解脫的根本，對不起，還沒有建立起來，這地方叫「根本斷絕」。"]]},{"t":"68A 17:06","b":[["s","「彼於解脫云何能導」，到那個時候你就引導教他解脫，你怎麼引導他呢？你教他說：「哎呀，不要貪著啊！」他覺得：「這是我要的東西，你教我這個不做、那個不做！」他儘管坐在那裡，心裡聽起來真是生煩惱。啊，你教他這樣做，他就覺得：「哎呀，最好我多睡一會兒覺，最好多做那個 ……。」教他這個不行、那個不行，那是越弄越遠哪，越弄越遠哪！這是我們要正確了解。所以說大師外支已成，真正的問題都在自己這個障礙當中，自己那個障礙當中啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-01/006.mp3"},{"文":"以諸所化無明闇覆，於諸苦性生死圓滿，執為安樂，«顛倒所誑»。","口譯":"因為所化的眾生被無明黑暗所覆蓋，對於本性是苦的生死圓滿（三有盛事），執著為安樂，被顛倒所欺誑。","四家合註":null,"時":"68A 17:49","頁":154,"af":"68a","st":1069,"et":1235,"消文":[{"文":"被無明癡闇覆障著，看不見事實的真相。"},{"文":"生死輪迴種種都是苦，被它現出的虛誑相所騙，覺得是安樂。"},{"文":"儘管宿生善根讓他跑來，他還是不行，根本原因在這裡。"}],"延伸":[{"題":"顛倒所誑","組":[{"題":"了解此理，一門深入","說":[{"類":"立","文":"正確了解這個，拿到哪一個法門都一心深入，就不起是非諍論。"},{"類":"例","文":"正法時「解脫堅固」，聽見「掃帚」兩個字，就把心裡的煩惱掃乾淨。"}]},{"題":"世智聰辯不相應","說":[{"類":"破","文":"聽了這麼多法，這也不對、那也不對，辨別一大堆，叫世智聰辯。"},{"類":"立","文":"真實淨化了，聰辯是絕端重要的工具。"},{"類":"回扣","文":"差就差在是否為顛倒所誑、無明所覆；第一件事要轉為正知見。"}]}],"說":[{"類":"立","文":"正確了解這個，拿到哪一個法門都一心深入，就不起是非諍論。"},{"類":"例","文":"正法時「解脫堅固」，聽見「掃帚」兩個字，就把心裡的煩惱掃乾淨。"},{"類":"破","文":"聽了這麼多法，這也不對、那也不對，辨別一大堆，叫世智聰辯。"},{"類":"立","文":"真實淨化了，聰辯是絕端重要的工具。"},{"類":"回扣","文":"差就差在是否為顛倒所誑、無明所覆；第一件事要轉為正知見。"}],"af":"68a","st":1142}],"逐字稿":[{"t":"68A 17:49","b":[["q","以諸所化無明闇覆，於諸苦性生死圓滿，執為安樂，顛倒所誑。"],["s","而這一個所化度之機 ─就是我們，這一個狀態當中，仍舊被這個無明癡闇覆障著，看不見事實的真相，看不見事實的真相。明明在生死輪迴當中，種種的這一種事情都是苦的，都是苦的。他把這一個苦的這個特質，現出來這個，在生死輪迴當中虛誑這些相，他被它所騙，覺得這是安樂的，這是安樂的。所以說「執為安樂，顛倒所誑。」你要教他這地方不要這樣，他還覺得：嗯，這個正是我所需要的，你教我不要，那怎麼可能？儘管他宿生的善根，讓他跑到這地方來，他還是不行，這根本原因在這裡。"]]},{"t":"68A 19:02","b":[["s","所以真正修學佛法，第一點你務必要了解這個。當你正確地了解這個，不管你拿到了哪一個法門，你就一心一意地從這個法門當中去深入，就不會大家起是非諍論。所以正法的時候叫作「解脫堅固」，他聽見了一個法，啊！他全部的精神貫注在這裡，乃至於聽見了「掃帚」兩個字，他掃掃、掃掃，然後呢把心裡的煩惱掃乾淨了。現在我們聽見了這麼多的法，哎呀，他偏偏還是說：「唉，這個也不對，那個也不對！」辨別得一大堆，啊，那個時候實在不相應啊！所以這種情況之下，叫作什麼？不幸地，這種叫世智聰辯，這個是我在這個地方，我們特別應該了解的。反過來，如果說你能夠真實地淨化了，這個對我們是絕端重要的一個工具，絕端重要的一個工具。差就差在什麼？喏，一點點 ─是不是為顛倒所誑？是不是為無明所覆？所以第一件事，要把這個不正確的認識轉變為正知見。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/007.mp3"},{"文":"如《四百論》云：「此大苦海中，悉無諸邊岸，愚人沉此中，云何不生畏。」","口譯":"如《四百論》說：「這個大苦海中，完全沒有邊際與岸，愚人沈溺在其中，怎麼不生起怖畏呢？」","四家合註":null,"時":"68A 20:35","頁":154,"af":"68a","st":1235,"et":1264,"消文":[{"文":"生死輪迴的大苦海，沒有邊、沒有底。"},{"文":"愚癡的人在裡邊一點都不怕，何等愚癡。"}],"延伸":[],"逐字稿":[{"t":"68A 20:35","b":[["q","如《四百論》云：「此大苦海中，悉無諸邊岸，愚人沉此中，云何不生畏。」"],["s","這一個生死輪迴的大苦海，既沒有邊、又沒有底啊，愚癡的人在這個裡邊哪，一點都不怕。哎呀，怎麼不怕，這個人是何等地愚癡呀！所以"]]}],"口譯音":"口譯音檔/siwei-kudi-01/008.mp3"},{"文":"先須為說«此實是苦»，非有安樂，","口譯":"所以先必須為他說明：這實在是苦，並沒有安樂，","四家合註":null,"時":"68A 21:04","頁":154,"af":"68a","st":1264,"et":1372,"消文":[{"文":"先必定要告訴他：這是苦，不是安樂。"}],"延伸":[{"題":"此實是苦","組":[{"題":"戒的根本由此建立","說":[{"類":"立","文":"先有苦集滅道的次第，修道時第一步才是持戒，戒的根本從這上面建立。"},{"類":"破","文":"這個把握不住，請問你持的戒持些什麼？為什麼跑到這裡來？"}]},{"題":"觀身不淨，觀受是苦","說":[{"類":"立","文":"三十七道品第一的四念處，也是講這個。"},{"類":"喻","文":"身體不淨，像大便一樣臭，你一看見就厭惡。"},{"類":"立","文":"種種快樂告訴你是苦，必然如此，沒有一處不是。"}]}],"說":[{"類":"立","文":"先有苦集滅道的次第，修道時第一步才是持戒，戒的根本從這上面建立。"},{"類":"破","文":"這個把握不住，請問你持的戒持些什麼？為什麼跑到這裡來？"},{"類":"立","文":"三十七道品第一的四念處，也是講這個。"},{"類":"喻","文":"身體不淨，像大便一樣臭，你一看見就厭惡。"},{"類":"立","文":"種種快樂告訴你是苦，必然如此，沒有一處不是。"}],"af":"68a","st":1264}],"逐字稿":[{"t":"68A 21:04","b":[["q","先須為說此實是苦，非有安樂，"],["s","所以先必定要告訴他：這個是苦啊，這不是安樂啊！佛拿這個告訴我們。那麼這個時候，我們應該第一個了解是了解這一點，所以不管我們現在學什麼，這是真正重要的，真正重要的啊！就是說，雖然說出家，大家說：「哎呀，出家五年哪，先要依止阿闍黎，知道開、遮、持、犯。」要曉得為什麼立這個戒，為什麼守那個戒，這你必定要知道。佛一定說苦、集、滅、道，因為你有這個次第，然後你去修道，修道的時候第一步才是持戒。所以這個戒的根本，還在從這個上面建立起來，必然我們要知道的。如果你這個把握不住的，請問你持的戒，你持些什麼？你為什麼跑到這裡來？這不是很明白的一個事情。"]]},{"t":"68A 22:08","b":[["s","所以三十七道品當中，第一個四念處，也是講這個。「觀身不淨、觀受是苦」，這第一個。平常我們最難放得下的就是這個身體，就難放得下的就是眼前的種種的貪著。所以告訴你：這個身體，不像你想像真實啊！不淨，像大便一樣地臭，你會愛護嗎？啊，你一看見你就厭惡！然後你種種的快樂，說告訴你這是苦啊！是必然如此的，沒有一個地方不是如此的，這是我們應該了解的。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/009.mp3"},{"文":"說多苦相令起厭離，是故於初先說苦諦。","口譯":"從多方面說明苦的行相，令他生起厭離，所以最初先說苦諦。","四家合註":null,"時":"68A 22:52","頁":154,"af":"68a","st":1372,"et":1415,"消文":[{"文":"多方面、種種善巧說明，目的只有一個：引起厭離心。"},{"文":"苦諦正確認識了，下面都有了，這是根本；沒有的話，都在走遠路。"}],"延伸":[],"逐字稿":[{"t":"68A 22:52","b":[["q","說多苦相令起厭離，是故於初先說苦諦。"],["s","不但一方面，多方面的、種種方面地善巧說明，目的一個 ─引起厭離心，所以先說苦諦。現在我們真正修行沒有別的，也必定要從這個上面，你把苦諦如果正確地認識，下面都有了，這是根本。如果這個沒有的話，那對不起，下面都在這兒走遠路，都在走遠路啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-01/010.mp3"},{"文":"此後自見墮於苦海，則於苦海欲求脫離，便見其苦必須滅除。","口譯":"這之後，他自己看見墮在苦海中，就會想從苦海中脫離，便看到這個苦必須要滅除。","四家合註":null,"時":"68A 23:35","頁":154,"af":"68a","st":1415,"et":1432,"消文":[{"文":"了解了苦，就要求解脫，生起滅苦之心。"}],"延伸":[],"逐字稿":[{"t":"68A 23:35","b":[["q","此後自見墮於苦海，則於苦海欲求脫離，便見其苦必須滅除。"],["s","因為你了解了這個苦，所以你要求解脫，所以這個時候，你要求滅苦之心。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/011.mp3"},{"文":"此復了知，未止其因苦終不滅，便念其因復為何等，由此始能了知集諦，是故«集諦於苦後說»。","口譯":"接著又了解：不止息苦的因，苦終究不會滅，便想苦的因又是什麼，由此才能了知集諦，所以集諦在苦諦之後說。","四家合註":null,"時":"68A 23:52","頁":154,"af":"68a","st":1432,"et":1584,"消文":[{"文":"苦是果，要消除果，必定要從因地上解決。"},{"文":"進一步找苦的因，就是集諦。"},{"文":"找到集諦就努力克服這個因，滅、道二諦跟著來，戒定慧三學自然如法修持。"}],"延伸":[{"題":"集諦於苦後說","組":[{"題":"學問再大也無用","說":[{"類":"破","文":"講戒頭頭是道，四分、五分、十誦律樣樣弄通，做大學問家，流轉生死一點用場都沒有。"}]},{"題":"把握根本，一句佛號亦足","說":[{"類":"例","文":"周利槃陀伽只懂得兩個字，都可以解決這個問題。"},{"類":"立","文":"只有一句阿彌陀佛，照樣可以了脫生死。"},{"類":"回扣","文":"這個根本第一要把握住，所以集諦在後說。"}]}],"說":[{"類":"破","文":"講戒頭頭是道，四分、五分、十誦律樣樣弄通，做大學問家，流轉生死一點用場都沒有。"},{"類":"例","文":"周利槃陀伽只懂得兩個字，都可以解決這個問題。"},{"類":"立","文":"只有一句阿彌陀佛，照樣可以了脫生死。"},{"類":"回扣","文":"這個根本第一要把握住，所以集諦在後說。"}],"af":"68a","st":1518}],"逐字稿":[{"t":"68A 23:52","b":[["q","此復了知，未止其因苦終不滅，便念其因復為何等，由此始能了知集諦，是故集諦於苦後說。"],["s","喏，這個來了！哦，因為你要想除掉那個苦，除掉那個苦，那麼這個苦怎麼來的呢？你了解這個苦是果，真正要把那個果消除掉了，必定要從因地上面解決。那麼這個現在的苦果的因在哪裡呢？那個時候你進一步找那個苦的因，這個集諦。所以由於苦的認識，然後呢策發我們求解脫的心，從苦當中解脫出來。因為要求這個心，所以一發了這個心，所以找：苦從哪裡來的呀？那個時候，你就會努力去找，那麼然後去找。當你這個時候你找到了集諦的話，你就努力會克服這個因，那個時候，它滅、道二諦就跟著來了。由於這樣，所以戒定慧的三學自然你如法修持。"]]},{"t":"68A 25:18","b":[["s","否則的話，儘管你說講戒，講得這麼頭頭是道，哎呀，不要說單單我們中國的四分律，五分律、十誦律，你樣樣弄通，你做個大學問家，說不定你戴各式各樣的博士的方帽，一點用場都沒有！流轉生死當中，弄得不好還說不定還要墮落，這個是我們必定要知道的，必定要知道的。反之，你就算這些東西，不要說每一個部都通，像周利槃陀伽一樣，只懂得兩個字，你都可以解決這個問題。現在有更巧妙的方法，他周利槃陀伽還要證了羅漢果了，現在也不要，羅漢果都不要，你就想到什麼都不知道，我只有一句阿彌陀佛了，欸，你照樣可以了脫生死，這個是我們必定要了解的。這個根本，現在第一要把握得住啊！所以他是為什麼集諦在後說。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/012.mp3"},{"文":"次知生死眾苦，皆由有漏業生，其業復由煩惱發起，煩惱根本是為我執，便知集諦。","口譯":"接著了知生死的眾苦，都是由有漏業所生，業又是由煩惱所發起，煩惱的根本是我執，這樣便了知了集諦。","四家合註":null,"時":"68A 26:24","頁":154,"af":"68a","st":1584,"et":1615,"消文":[{"文":"一步一步追根究底：生死的苦是有漏業，業是煩惱所起，煩惱的根本是我執。"},{"文":"這時就了解了集諦真正的行相。"}],"延伸":[],"逐字稿":[{"t":"68A 26:24","b":[["q","次知生死眾苦，皆由有漏業生，其業復由煩惱發起，煩惱根本是為我執，便知集諦。"],["s","一步一步地，從這個上頭追根究底地找到：哎呀，生死的苦是有漏的業，業又是煩惱所起，那麼煩惱的根本是我執，那個時候你把集諦的真正的行相了解了。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/013.mp3"},{"文":"若見我執亦能止滅，«誓願»現證滅苦之滅，故於集後宣說滅諦。","口譯":"如果看見我執也能夠止滅，就會誓願現證滅除苦的滅，所以在集諦之後宣說滅諦。","四家合註":null,"時":"68A 26:55","頁":154,"af":"68a","st":1615,"et":1694,"消文":[{"文":"我執不是天生的，是虛妄顛倒的，可以淨化、消滅。"},{"文":"原來一切痛苦的根本在這裡，一定要想辦法去掉它。"}],"延伸":[{"題":"誓願","組":[{"題":"誓是必定要達到的願","說":[{"類":"立","文":"不但願，「誓」是必定要達到的願。"},{"類":"破","文":"浮浮泛泛「我也想啊」，想了半天還坐在這裡。"}]},{"題":"打起全部精神修行","說":[{"類":"立","文":"修行不是有氣無力，是打起全部精神，心裡是這樣的狀態。"},{"類":"例","文":"那些大祖師們就是這個樣子。"},{"類":"回扣","文":"所以集諦後面宣說滅諦。"}]}],"說":[{"類":"立","文":"不但願，「誓」是必定要達到的願。"},{"類":"破","文":"浮浮泛泛「我也想啊」，想了半天還坐在這裡。"},{"類":"立","文":"修行不是有氣無力，是打起全部精神，心裡是這樣的狀態。"},{"類":"例","文":"那些大祖師們就是這個樣子。"},{"類":"回扣","文":"所以集諦後面宣說滅諦。"}],"af":"68a","st":1615}],"逐字稿":[{"t":"68A 26:55","b":[["q","若見我執亦能止滅，誓願現證滅苦之滅，故於集後宣說滅諦。"],["s","你了解了這個，緊跟著見到：噢！原來這個我執這個東西，不是天生的，而卻是虛妄顛倒的，這個東西，你可以把它淨化、消滅。所以那個時候你想：啊，原來一切痛苦的根本在這裡啊！那那個時候你一定要想辦法，去把它去掉它，所以是「誓願」，不但願，「誓」是什麼？就是你必定要達到的這個願。不是我們浮浮泛泛：哎呀，我也想啊！雖然你也想，你還是弄得想了半天，坐在這個地方。他那個誓不是 ─我一定要做到它！你站起來全部精神去幹，當然，這個是指我們的心裡的這種狀態。所以這個修行不是什麼浮浮泛泛、有氣無力，不是的！修行是打起全部精神來，就這樣，心裡是這樣狀態。因為有這種心理，所以做任何事情的時候，那必然如此。你看那些大祖師們，他就是這樣，就是這個樣。所以那個時候，他集諦後面宣說滅諦。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/014.mp3"},{"文":"若爾開示苦諦之後，即於解脫發生希求，苦諦之後應說滅諦。","口譯":"（問：）如果這樣，開示苦諦之後，就已經對解脫生起希求，那麼苦諦之後應該接著說滅諦才對。","四家合註":null,"時":"68A 28:14","頁":154,"af":"68a","st":1694,"et":1709,"消文":[{"文":"照這樣說，說了苦諦就要求解脫，應該講滅諦，為什麼又說集諦？"}],"延伸":[],"逐字稿":[{"t":"68A 28:14","b":[["q","若爾開示苦諦之後，即於解脫發生希求，苦諦之後應說滅諦。"],["s","照你這樣說的話，那麼說了苦諦以後應該 ……你要求解脫嘛，就講滅諦啊，為什麼又說集諦呢？"]]}],"口譯音":"口譯音檔/siwei-kudi-01/015.mp3"},{"文":"答云，無過，爾時雖有欲解脫心，欣得寂滅眾苦之滅，然猶未明眾苦之因，未見其因定能遮止，故於解脫，不能定執為所應得，定當證滅。","口譯":"答：沒有過失。那時雖然有想解脫的心，欣求得到寂滅眾苦的滅，但還不明白眾苦的因，沒看到那個因一定能被遮止，所以對於解脫，還不能確定地執持為自己所應得、一定能證得的滅。","四家合註":null,"時":"68A 28:29","頁":154,"af":"68a","st":1709,"et":null,"消文":[{"文":"答：沒有錯。"},{"文":"滅就是息滅一切痛苦；那時雖想求解脫，但不了解苦的因。"},{"文":"不曉得這個因是不是一定能去掉，就不能確定做不做得到，所以不先講滅。"}],"延伸":[],"逐字稿":[{"t":"68A 28:29","b":[["q","答云，無過，"],["s","他說：沒有錯的。為什麼呀？"]]},{"t":"68A 28:33","b":[["q","爾時雖有欲解脫心，欣得寂滅眾苦之滅，然猶未明眾苦之因，未見其因定能遮止，故於解脫，不能定執為所應得，定當證滅。"],["s","是的，那個時候，雖然你要想求解脫，希望把一切的苦得到靜息 ─所以這滅就是息滅一切的痛苦 ─但是你並不了解那個苦的因，不曉得這個因是不是一定能夠遮止，換句話說，一定能夠去掉。所以這個時候你不能確定，是不是能夠做得到，是不是能夠達到你息滅一切痛苦的這一個狀態，所以說這個時候不先講滅。"]]},{"t":"68A 29:36","b":[["q","如是若執定當證滅，定當解脫，便念何為趣解脫道，趣向道諦，是故道諦最後宣說。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/016.mp3"},{"文":"如是若執定當證滅，定當解脫，便念何為趣解脫道，趣向道諦，«是故道諦最後宣說»。","口譯":"像這樣，若確定一定能證得滅、一定能解脫，便會想：什麼是趣向解脫的道？於是趣向道諦，所以道諦最後宣說。","四家合註":null,"時":"68B 00:03","頁":155,"af":"68b","st":3,"et":106,"消文":[{"文":"找到苦的因原來可以止息，就一心要止息。"},{"文":"止息有一定的方法，叫作「道」。"},{"文":"修道時才講戒定慧三學，不是世間五花八門、理工醫農那一套。"}],"延伸":[{"題":"道諦最後宣說","組":[{"題":"依次第學，學到哪受用到哪","說":[{"類":"立","文":"照這個次第來，心就跟它相應，步步深入，學到哪裡受用到哪裡。"},{"類":"破","文":"否則一直在煩惱中轉；修一點善法也被雜染所染，永遠流轉生死。"}]}],"說":[{"類":"立","文":"照這個次第來，心就跟它相應，步步深入，學到哪裡受用到哪裡。"},{"類":"破","文":"否則一直在煩惱中轉；修一點善法也被雜染所染，永遠流轉生死。"}],"af":"68b","st":56}],"逐字稿":[{"t":"68B 00:03","b":[["q","如是若執定當證滅，定當解脫，便念何為趣解脫道，趣向道諦，是故道諦最後宣說。"],["s","現在照著次第，說首先了解了苦，那麼由於苦了找到了苦的因，而找到苦的因在這地方，原來可以止息的，那個時候你就想：啊！那我一心也要止息。但是你要止息怎麼做法呢？原來有它止息的一定的方法，那個叫作「道」。由於這樣地追求到道，那麼講道，就修道的時候，那個時候才講戒定慧三學。而不是世間的五花八門，而不是世間的小學、中學、大學，而不是世間的所謂理工醫農、士農工商，這套東西就完全用不上。有它這樣的必然的次第。"]]},{"t":"68B 00:56","b":[["s","所以你照著這個次第來的話，自然你的心裡面就跟它相應，然後就步步深入，你學到哪裡受用到哪裡。要不然你學到哪裡，自己一直在煩惱當中轉，所以這個都是雜染之法。儘管你修一點善法，是難免為雜染所染，所以始終啊 ……。現在我們就是這個狀態，因為你修了一點法，所以它有一點跟法相應的這個善報，但是這個東西雜染的，始終這個善，唉呀，跟著很多煩惱、痛苦，而結果永遠流轉生死，它基本原因就在這裡。所以在這裡，我們一定第一個要把握得住。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/017.mp3"},{"文":"如是亦如《相續本母》云：「如病應知斷病因，當得樂住應依藥，苦因彼滅如是道，«應知應斷應證修»。」","口譯":"這也如《相續本母》所說：「如同生病，應知病、應斷病因，要得到安樂住應依藥；苦、苦因、苦滅以及道也是這樣，應知、應斷、應證、應修。」","四家合註":null,"時":"68B 01:46","頁":155,"af":"68b","st":106,"et":250,"消文":[{"文":"生了病，要感受病苦，要曉得病因、斷除病因，再找藥、依藥。"},{"文":"苦而找到苦因是集諦，見到因可以消滅是滅諦，如何滅是道諦。"},{"文":"苦應知，集應斷，滅應證，道應修。"}],"延伸":[{"題":"應知應斷應證修","組":[{"題":"三轉四諦十二法輪","說":[{"類":"立","文":"苦應知，集應斷，滅應證，道應修，就是世尊三轉四諦十二法輪。"}]},{"題":"大小乘不離四諦","說":[{"類":"立","文":"所有大小乘的基本內容就是這個，佛法離開四諦就沒有了。"},{"類":"立","文":"只管自己是小乘，了解透徹是緣覺，推廣到一切有情是佛菩薩。"}]}],"說":[{"類":"立","文":"苦應知，集應斷，滅應證，道應修，就是世尊三轉四諦十二法輪。"},{"類":"立","文":"所有大小乘的基本內容就是這個，佛法離開四諦就沒有了。"},{"類":"立","文":"只管自己是小乘，了解透徹是緣覺，推廣到一切有情是佛菩薩。"}],"af":"68b","st":189}],"逐字稿":[{"t":"68B 01:46","b":[["q","如是亦如《相續本母》云：「如病應知斷病因，當得樂住應依藥，苦因彼滅如是道，應知應斷應證修。」"],["s","現在就比喻，就像生了病，那麼要感受到這個病的痛苦，那麼要曉得你這個病原因從哪裡啊？要曉得斷除病的因，那麼要求這個斷病，那麼那個時候要找藥，那個時候才依這個藥。這個同樣地，所以這個苦，由於苦而跟著找到苦的因 ─集諦；然後呢是從因上面，見到這個因可以消滅 ─滅諦；然後呢，如何滅是道諦。這個是我們真正「此苦汝應知」啊，然後呢應斷、應修，這個。這個是集，是你應斷哪！然後呢這個是滅，你應證哪！要想證那個滅諦，該怎麼辦呢？要修這個道啊！"]]},{"t":"68B 03:09","b":[["s","所以世尊三轉四諦十二法輪，就是這個樣。第一：這個苦，你應該知道啊！為什麼苦？有它的原因，這個原因你應該斷。然後呢斷了就證得這個滅諦，這個才是你真正需要的。要想證得滅諦怎麼辦呢？修這個道，就這樣。這個就是世尊所以說這個次第，所有的大小乘基本的內容，就是這個！就這個，沒有、再也沒有別的了！佛法離開了四諦就沒有了，只是把四諦的層次深廣不同 ─只管你自己，那就是小乘；如果說你把這個道理，深刻一點地了解透徹一點是緣覺；推廣到一切有情，就是佛菩薩，如此！"]]}],"口譯音":"口譯音檔/siwei-kudi-01/018.mp3"},{"文":"如是四諦，大小乘中皆數宣說，是為善逝總攝生死流轉，生死還滅諸扼要處。","口譯":"像這樣的四諦，大乘小乘中都一再宣說，這是善逝總攝生死流轉、生死還滅的種種扼要之處。","四家合註":null,"時":"68B 04:10","頁":155,"af":"68b","st":250,"et":300,"消文":[{"文":"「數」是到處，整個大小乘佛法所說的就是這個。"},{"文":"生死流轉還滅的最綱要都在這裡，一切經典都依這個綱要深細說明。"}],"延伸":[],"逐字稿":[{"t":"68B 04:10","b":[["q","如是四諦，大小乘中皆數宣說，是為善逝總攝生死流轉，生死還滅諸扼要處。"],["s","所以說，這個四諦，大乘小乘當中都要數數 ─這個「數」是到處，整個的大小乘佛法所說的，就是這個。所以佛把生死流轉還滅的最綱要，都在這個地方，所有的一切經典都是根據這個綱要，深細地來說明。有很多呢把整個的四個都說，有很多呢偏重於某一方面，乃至於越深越細。佛經沒有一個例外，都是這樣。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/019.mp3"},{"文":"故修解脫極為切要，亦是修行大嗢柁南，故須如是次第引導學者。","口譯":"所以對修解脫而言極為切要，也是修行的大嗢柁南（總綱要），所以必須依這樣的次第引導學者。","四家合註":null,"時":"68B 05:00","頁":155,"af":"68b","st":300,"et":401,"消文":[{"文":"對真正修解脫的，這是最最重要的。"},{"文":"嗢柁南是綱宗扼要，通常譯為偈；四聖諦也叫四法嗢柁南。"},{"文":"整個修行的綱要就是這個，所以用這個次第引導；本論的美也在這裡。"}],"延伸":[],"逐字稿":[{"t":"68B 05:00","b":[["q","故修解脫極為切要，亦是修行大嗢柁南，故須如是次第引導學者。"],["s","所以，對於真正修解脫的，這個是最最重要的，這個真的最重要的。也是修行的 ─「嗢柁南」這個地方是指綱要，綱宗扼要。通常嗢陀南我們可以翻成功一個「偈」，偈子，所以前面說完了，那個偈子總結起來。換句話說，整個修行的綱要，就是這個！整個修行的綱要，就是這個。平常我們除了這個嗢柁南說這個偈子以外，就是四聖諦也叫四法嗢柁南，哪個四法？那就是苦、集、滅、道，就是這樣。乃至於三法印，它也叫三個 ─哦，不是，不是苦、集、滅、道，這個「諸行無常」，這個「諸法無我」 ……就是四法印，就是這個四法印，換句話說那是綱要，整個佛法的。所以這個修行的整個的綱要，所以用這個次第引導。也可以說完整的佛法就是這樣，所以本論的美也在這個地方。那麼下面呢，再把這個話說一下，這個是策勵我們的。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/020.mp3"},{"文":"若未真實思惟苦諦，厭捨生死，則求解脫亦唯虛言，«隨其所作悉成集諦»。","口譯":"如果沒有真實思惟苦諦而厭捨生死，那麼求解脫也只是空話，所做的一切都成為集諦。","四家合註":null,"時":"68B 06:41","頁":155,"af":"68b","st":401,"et":658,"消文":[{"文":"對苦諦沒有正確認識，或認識了沒有如理思惟、生起相應的量，內心還在世間雜染中現行。"},{"文":"那時貪著生死，不是厭捨生死，求解脫都是空話。"},{"文":"不管做什麼還是集諦，集諦就是流轉生死。"}],"延伸":[{"題":"隨其所作悉成集諦","組":[{"題":"忘失菩提心，是名魔業","說":[{"類":"立","文":"更深一層說：「忘失菩提心，修諸善法，是名魔業。」也就是這個。"},{"類":"因","文":"修學的根本目的一旦忘失，做什麼都是集諦，把你拖在生死當中。"}]},{"題":"道理要在內心找到相應","說":[{"類":"立","文":"用功不只是追求學問、文字，要在內心找到相應的意義，策發對生死的恐怖厭患。"},{"類":"破","文":"一類人只在文字上推敲。"},{"類":"破","文":"一類人覺得這裡生活滿好，吃好睡好，講起來頭頭是道，總不相應。"}]},{"題":"思惟以破現法雜染","說":[{"類":"下手","文":"不但知道，還要去思惟，把跟現法雜染相應的現行破壞，如法的心就生起來。"},{"類":"回扣","文":"若未真實思惟苦諦，就不能厭捨生死，做什麼都是集諦。"}]}],"說":[{"類":"立","文":"更深一層說：「忘失菩提心，修諸善法，是名魔業。」也就是這個。"},{"類":"因","文":"修學的根本目的一旦忘失，做什麼都是集諦，把你拖在生死當中。"},{"類":"立","文":"用功不只是追求學問、文字，要在內心找到相應的意義，策發對生死的恐怖厭患。"},{"類":"破","文":"一類人只在文字上推敲。"},{"類":"破","文":"一類人覺得這裡生活滿好，吃好睡好，講起來頭頭是道，總不相應。"},{"類":"下手","文":"不但知道，還要去思惟，把跟現法雜染相應的現行破壞，如法的心就生起來。"},{"類":"回扣","文":"若未真實思惟苦諦，就不能厭捨生死，做什麼都是集諦。"}],"af":"68b","st":401}],"逐字稿":[{"t":"68B 06:41","b":[["q","若未真實思惟苦諦，厭捨生死，則求解脫亦唯虛言，隨其所作悉成集諦。"],["s","所以假定你對苦諦沒有正確的認識，以及認識雖然認識了，沒有如理思惟，生起相應的量，那個時候我們的內心還是在現法，世間的一切上面這種雜染當中現行。那個時候貪著生死，不是厭捨生死，這個時候，所謂求解脫都是空話，都是虛話。在家人固然談不到，出家啦，更在這個地方浪費自己啊！更是浪費自己啊！所以它「隨其所作」，不管你做什麼，你還是集諦，集諦是什麼？流轉生死。在小乘這樣說 ─不是，不是說小乘，在基本上面這樣說。如果我們更深一層、更圓滿一點說的話，另外一句話說：「忘失菩提心，修諸善法，是名魔業。」也就是這個。你修學的根本目的何在？這個菩提心。這個地方就是什麼？求解脫這個心。如果你一旦忘失掉了，那你做什麼事情都是集諦，集諦是什麼？魔是什麼？就是專門把你拖在生死當中的。所以現在這個地方呢，不管我們做什麼學問，這個一定要了解的。"]]},{"t":"68B 08:34","b":[["s","最近在座大部分同學，我看了非常歡喜，非常讚歎，為什麼？大家很用功。但是注意哦！這個用功不僅僅是追求一點學問，也不是追求文字，說：啊，現在了解了！你必定要把了解的道理，要在內心上面找到相應的意義；換句話說，這個道理所指的是什麼。那個時候策發我們對眼前生死的恐怖厭患，由於這個而推動我們努力如理去追求。否則的話呢，你一定會在這個文字上面推敲，文字上面推敲，這是一類。另外一類呢，儘管在這裡，哎呀！覺得這個地方的生活真是滿好，也不要跑得去忙，反正早晨稍微早一點起來，上一個殿，到那個時候吃起來，哎唷，人家樣樣送得來的。啊，那是講究口味，真是！吃完了以後一個大覺睡得個好，什麼都不要做。那個時候，講起來，喔唷，等下還要頭頭是道，意見很多，總不相應啊！總不相應，原因在這個地方，這一點是我們必定要知道的啊！"]]},{"t":"68B 10:00","b":[["s","所以這句話，好好地再讓我們自己提醒我們一下：「若未真實思惟苦諦」，你沒有真實地思惟的話，就不能「厭捨生死」。不但知道，知道了還要去思惟，這個情況就是，把跟現法雜染相應的現行破壞了，那個時候如法的心生起來，那一定會對於我們眼前那個會產生厭惡。那個時候你一心求解脫，那個時候對了，你做的事情都為求解脫而忙。否則的話，你心裡面不管做些什麼、想些什麼，都是集諦。進一步："]]}],"口譯音":"口譯音檔/siwei-kudi-01/021.mp3"},{"文":"若未思集，善知惑業生死根本，«猶如射箭未見鵠的»，是即斷截正道扼要，遂於非脫三有之道妄執為是，勞而無果。","口譯":"如果沒有思惟集諦，善巧了知惑與業是生死的根本，就好像射箭沒看見箭靶，這就斷截了正道的扼要，於是把不能脫離三有的道錯執為是，徒勞而沒有結果。","四家合註":null,"時":"68B 10:58","頁":155,"af":"68b","st":658,"et":867,"消文":[{"文":"苦的根本是惑、業兩樣：無明與行，是生死的根本。"},{"文":"善知：不是講時懂、講完糊塗，也不是寫成論文只在書本上。"},{"文":"斷截正道扼要：道路本身已經斷掉了。"},{"文":"妄執為是、勞而無果：以為在修道，其實修錯了，忙了半天沒有果。"}],"延伸":[{"題":"猶如射箭未見鵠的","組":[{"題":"無的放矢","說":[{"類":"喻","文":"射箭沒看見靶子，無的放矢，你射些什麼？"}]},{"題":"自問為何而修","說":[{"類":"例","文":"拜佛、念經、早晚課、研究學問、寫文章、學戒、學定，你為什麼？"},{"類":"破","文":"學定為了身體好，看人持戒覺得好看，完全不相應。"},{"類":"下手","文":"最好自己問問自己：為什麼要做？"},{"類":"回扣","文":"「勞而無果」，論上都給了最佳指導。"}]}],"說":[{"類":"喻","文":"射箭沒看見靶子，無的放矢，你射些什麼？"},{"類":"例","文":"拜佛、念經、早晚課、研究學問、寫文章、學戒、學定，你為什麼？"},{"類":"破","文":"學定為了身體好，看人持戒覺得好看，完全不相應。"},{"類":"下手","文":"最好自己問問自己：為什麼要做？"},{"類":"回扣","文":"「勞而無果」，論上都給了最佳指導。"}],"af":"68b","st":725}],"逐字稿":[{"t":"68B 10:58","b":[["q","若未思集，善知惑業生死根本，猶如射箭未見鵠的，是即斷截正道扼要，遂於非脫三有之道妄執為是，勞而無果。"],["s","更進一步，那麼說你現在了解了這個苦的特質，所以進一步要脫苦。那麼苦的根本在哪裡呢？原來是兩個東西：惑、業，就是無明、行兩樣東西，那個是生死的根本。假定你這個生死的根本不知道，或者雖然知道了又不善巧，說並不是馬馬虎虎知道，講的時候懂，等到講完了，自己腦筋裡糊塗一片，這個沒有用。或者你雖然能夠講給別人聽，講完了這個道理所指的，指的什麼？在書本上面。「我的論文得到了一個大博士！」但是它所指的內心的心理行相是什麼？兩回事情，那個沒有用。"]]},{"t":"68B 12:05","b":[["s","這個像什麼？射箭一樣，你射箭的靶子在哪裡你沒看見。請問你射箭，靶子沒看見，你無的放矢，人家說。什麼叫「無的放矢」？你沒目的，那個射箭，你射些什麼啊？就是這樣。我們現在修道，你修些什麼啊？這個就很清楚了。你拜佛，你為什麼要拜佛？你念經，你為什麼要念經？你作早課、作晚課，然後你研究學問，然後你寫文章，然後你學戒律，然後你學定，你為什麼啊？現在有很多人，「哎呀，我要學學定。」你為什麼學定？說實在他也不知道！覺得學定滿好，啊！修了定身體好的，學了什麼的 ……那完全不相應，這完全不相應啊！然後學戒，「喔唷，人家這個戒，你看這樣！」是，它對我們有引發的功效，這是我們宿生善根相應，但是他為什麼要這樣做？這個都是射箭哪，他沒有找到那目的啊！"]]},{"t":"68B 13:17","b":[["s","所以那個時候，正道的扼要切斷掉了，換句話說，你這個道路本身已經斷掉了。這個時候你忙的是什麼？「遂於非脫三有之道妄執為是，勞而無果。」那時候你修的道也不對，你修錯了，你忙了個半天，你以為在修道呀，但是，因為你修道的目的像射箭一樣，射箭要射到那個紅心、那個靶子，你這個靶子也沒有看見，你射了個半天，沒有果啊！修道的目的是要解脫生死的根本，生死的根本在哪裡你不知道，你修了半天。所以現在很多人哪，喔唷，天天去拜佛，忙著去拜佛，有很多人天天要念多少佛，有很多人讀多少經，還要寫論文，還要記這個、又要記那個，你為什麼要做呀？最好自己問問自己。這個地方都給了我們最佳指導啊！「勞而無果」，告訴我們。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/022.mp3"},{"文":"若未能知應斷之苦集，則亦不明靜苦之解脫，故欲求解脫，«亦唯增上慢»耳。","口譯":"如果不能了知應斷的苦與集，也就不明白息滅苦的解脫，所以想求解脫，也只是增上慢而已。","四家合註":null,"時":"68B 14:27","頁":155,"af":"68b","st":867,"et":1051,"消文":[{"文":"應斷的苦、集沒有把握清楚，下面都沒有用。"},{"文":"從苦、集追根究底，才找到脫苦集的方法，就是解脫之道。"},{"文":"不了解之前，所謂修行最多只是增上慢；慢已經不好，還要增上。"}],"延伸":[{"題":"亦唯增上慢","組":[{"題":"看不見值得學習的","說":[{"類":"破","文":"這也瞧不起、那也瞧不起，看不到一個值得學習的。"}]},{"題":"懂了則處處感激","說":[{"類":"例","文":"聽見「阿彌陀佛」四個字已經夠了，牢牢抱著，感激得不得了。"},{"類":"立","文":"解脫的煩惱越多，功德越多，越感激人家，沒有是非之心。"}]},{"題":"弄清次第，所作皆淨","說":[{"類":"下手","文":"先把為什麼這樣建立的次第弄清楚，照著做，每一步會推動你上去。"},{"類":"立","文":"一心擺在這裡，造的業都是淨業，不是集諦所攝。"},{"類":"回扣","文":"先說苦諦的理由在此；下面接著「正修苦」。"}]}],"說":[{"類":"破","文":"這也瞧不起、那也瞧不起，看不到一個值得學習的。"},{"類":"例","文":"聽見「阿彌陀佛」四個字已經夠了，牢牢抱著，感激得不得了。"},{"類":"立","文":"解脫的煩惱越多，功德越多，越感激人家，沒有是非之心。"},{"類":"下手","文":"先把為什麼這樣建立的次第弄清楚，照著做，每一步會推動你上去。"},{"類":"立","文":"一心擺在這裡，造的業都是淨業，不是集諦所攝。"},{"類":"回扣","文":"先說苦諦的理由在此；下面接著「正修苦」。"}],"af":"68b","st":867}],"逐字稿":[{"t":"68B 14:27","b":[["q","若未能知應斷之苦集，則亦不明靜苦之解脫，故欲求解脫，亦唯增上慢耳。"],["s","所以如果一開始的時候，「應斷的苦集」兩樣東西，你沒有把握得清楚的話，對不起，下面都沒有用，「則亦不明靜苦之解脫」啊！這個必定是從苦、集兩樣東西上面，追根究底才找到正脫苦集的這個方法，然後這個就是解脫之道。所以不了解之前，我們所謂的修行，最多也只是「增上慢」哪！增上慢，慢已經不好還要增上。這是為什麼我們現在修學佛法很容易：唉，這個也瞧不起，那個也瞧不起，看不見、看不到一個可以值得學習的。假定真正懂了以後，聽見「阿彌陀佛」四個字已經夠了，牢牢地抱著它，自己拼命都來不及，不管任何人，「阿彌陀佛，他提供了這個四個字讓我念佛，我感激得不得了啊！」他是與非，你管他幹什麼？這不是很簡單的道理！當然你更進一步的話，你更進一步解脫的煩惱越多，增長的功德是越多。所以自然而然，你越會感激人家都來不及，你哪裡有一點對這種是非之心。"]]},{"t":"68B 16:20","b":[["s","所以在這個地方先告訴我們，說：哦，佛原來一定有這樣的重要的關鍵問題啊！所以說這個地方先說苦諦的理由在此，在這地方我們現在可以了解了。所以大家不要忙著說，哎呀，你要去修行啊！你一定要把它為什麼這樣建立的次第，你弄得很清楚，了解了然後照著去做，那個時候你很清楚、很明白，每一步一點不錯，它會推動你上去。因為這個力量，所以找到了你修行的方法的話，你一心一意全部擺在這個地方去做，不管你做什麼，那個不是集諦所攝，你造的任何業都是淨業。既然你造的業都是淨業，哪有不透脫生死輪迴的道理。由於這樣的次第認識了，下面就告訴我們「正修苦」，那個時候正式地修行那個苦諦了。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/023.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-01/001.webp","n":1},{"img":"投影片/siwei-kudi-01/002.webp","n":2},{"img":"投影片/siwei-kudi-01/003.webp","n":3},{"img":"投影片/siwei-kudi-01/004.webp","n":4},{"img":"投影片/siwei-kudi-01/005.webp","n":5},{"img":"投影片/siwei-kudi-01/006.webp","n":6},{"img":"投影片/siwei-kudi-01/007.webp","n":7},{"img":"投影片/siwei-kudi-01/008.webp","n":8},{"img":"投影片/siwei-kudi-01/009.webp","n":9},{"img":"投影片/siwei-kudi-01/010.webp","n":10},{"img":"投影片/siwei-kudi-01/011.webp","n":11},{"img":"投影片/siwei-kudi-01/012.webp","n":12},{"img":"投影片/siwei-kudi-01/013.webp","n":13},{"img":"投影片/siwei-kudi-01/014.webp","n":14},{"img":"投影片/siwei-kudi-01/015.webp","n":15},{"img":"投影片/siwei-kudi-01/016.webp","n":16},{"img":"投影片/siwei-kudi-01/017.webp","n":17},{"img":"投影片/siwei-kudi-01/018.webp","n":18},{"img":"投影片/siwei-kudi-01/019.webp","n":19},{"img":"投影片/siwei-kudi-01/020.webp","n":20},{"img":"投影片/siwei-kudi-01/021.webp","n":21},{"img":"投影片/siwei-kudi-01/022.webp","n":22},{"img":"投影片/siwei-kudi-01/023.webp","n":23},{"img":"投影片/siwei-kudi-01/024.webp","n":25},{"img":"投影片/siwei-kudi-01/025.webp","n":26},{"img":"投影片/siwei-kudi-01/026.webp","n":29},{"img":"投影片/siwei-kudi-01/027.webp","n":30},{"img":"投影片/siwei-kudi-01/028.webp","n":31},{"img":"投影片/siwei-kudi-01/029.webp","n":32},{"img":"投影片/siwei-kudi-01/030.webp","n":33},{"img":"投影片/siwei-kudi-01/031.webp","n":34},{"img":"投影片/siwei-kudi-01/032.webp","n":35},{"img":"投影片/siwei-kudi-01/033.webp","n":36},{"img":"投影片/siwei-kudi-01/034.webp","n":37},{"img":"投影片/siwei-kudi-01/035.webp","n":38},{"img":"投影片/siwei-kudi-01/036.webp","n":39},{"img":"投影片/siwei-kudi-01/037.webp","n":42},{"img":"投影片/siwei-kudi-01/038.webp","n":43}],"投影片PDF":"投影片/siwei-kudi-01/slides.pdf","音檔範圍":"68A 05:45～68B 17:31"},"siwei-kudi-02":{"id":"siwei-kudi-02","標題":"思惟苦諦(2)","根":"思惟八苦","科判焦點":"丑一 思惟八苦","課本範圍":"P155 L8 ~ P157 L7","堂數":110,"日期":"2026/11/10","分圖":[{"名":"標八苦・修法總則","原文":[0,9]},{"名":"引經證成・止觀","原文":[10,16]},{"名":"生苦五相","原文":[17,24]}],"音檔":{"68b":{"local":"音檔/gl1/068B.mp3","remote":"https://lamrim.xyz/player/media/gl1/068B.mp3"},"69a":{"local":"音檔/gl1/069A.mp3","remote":"https://lamrim.xyz/player/media/gl1/069A.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=68b&st1=1051&af2=69a&et2=1601","段":[{"文":"第二正修苦分二：一思惟生死總苦，二思惟別苦。初中分三：一思惟八苦，二思惟六苦，三思惟三苦。今初","口譯":"第二、正修苦諦分二：一、思惟生死總苦，二、思惟別苦。第一又分三：一、思惟八苦，二、思惟六苦，三、思惟三苦。以下說第一。","四家合註":null,"時":"68B 17:31","頁":155,"af":"68b","st":1051,"et":1088,"消文":[{"文":"先把苦的總相說明一下，第二個別地說。"},{"文":"總相當中，平常常聽見說「八苦交煎」，一個一個來看。"}],"延伸":[],"逐字稿":[{"t":"68B 17:31","b":[["q","第二正修苦分二：一思惟生死總苦，二思惟別苦。"],["s","把這個苦的總相，說明一下。第二呢？個別地說。"]]},{"t":"68B 17:52","b":[["q","初中分三：一思惟八苦，二思惟六苦，三思惟三苦。　今初"],["s","那麼先說那個總相，總相當中平常我們常常聽見說「八苦交煎」，乃至於下面的，我們一個一個來看。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/001.mp3"},{"文":"如《親友書》云：「仁和應厭於生死，欲乏死病及老等，無量眾苦出生處。」應如是修。","口譯":"如《親友書》說：「仁和（龍樹菩薩對收信國王的敬稱），應當厭離生死，它是欲求匱乏、死、病以及老等無量眾苦出生的地方。」應當這樣修。","四家合註":null,"時":"68B 18:08","頁":155,"af":"68b","st":1088,"et":1143,"消文":[{"文":"對三有生死輪迴的內涵，應該認識而生起厭惡。"},{"文":"這裡快樂一點都沒有，想要的都得不到；死、病、老，各式痛苦都從這裡來。"},{"文":"應如是修：這是我們應該認識、應該這樣去修的。"}],"延伸":[],"逐字稿":[{"t":"68B 18:08","b":[["q","如《親友書》云：「仁和應厭於生死，欲乏死病及老等，無量眾苦出生處。」應如是修。"],["s","所以菩薩呀！這個你應該了解，去生起厭患的啊！對於這個三有生死輪迴這個內涵，你應該認識而生起的厭惡。要曉得這個裡邊快樂是一點都沒有，你要想的東西都得不到，恰恰相反的是什麼？死、病、老，各式各樣的痛苦都從這個地方來的，這是我們應該認識，應該這樣去修的。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/002.mp3"},{"文":"此中修習厭生死者，謂思惟彼是眾苦根源。苦者，謂已顯說欲乏等四，等字攝四，共為八種。此八種苦，是薄伽梵於多經中，明苦諦時«數所宣說»。","口譯":"這裡所說修習厭離生死，就是思惟生死是眾苦的根源。所說的苦，是已明白說出的欲乏等四種，「等」字又攝四種，共為八種。這八種苦，是薄伽梵在許多經中，說明苦諦時一再宣說的。","四家合註":null,"時":"68B 19:03","頁":155,"af":"68b","st":1143,"et":1232,"消文":[{"文":"欲乏：欲樂缺乏，沒有好的，沒有好的就是壞的。"},{"文":"等字包含生老病死，共分八個項目。"},{"文":"這八項，世尊在很多經典中不斷地告訴我們。"}],"延伸":[{"題":"數所宣說","組":[{"題":"多方策勵，觸動內心","說":[{"類":"因","文":"為什麼不斷地講？用多方面的策勵，總有一點觸動你的心。"}]},{"題":"於相應處把握努力","說":[{"類":"下手","文":"那裡看到跟你相應了，就拼命在那裡把握住、去努力。"},{"類":"破","文":"稍微看一看就說沒勁；只在外面轉，暇滿人身就浪費掉了。"}]}],"說":[{"類":"因","文":"為什麼不斷地講？用多方面的策勵，總有一點觸動你的心。"},{"類":"下手","文":"那裡看到跟你相應了，就拼命在那裡把握住、去努力。"},{"類":"破","文":"稍微看一看就說沒勁；只在外面轉，暇滿人身就浪費掉了。"}],"af":"68b","st":1143}],"逐字稿":[{"t":"68B 19:03","b":[["q","此中修習厭生死者，謂思惟彼是眾苦根源。苦者，謂已顯說欲乏等四，等字攝四，共為八種。此八種苦，是薄伽梵於多經中，明苦諦時數所宣說。"],["s","前面告訴我們苦啊，就是說明了什麼？「欲乏」，就是欲樂缺乏，沒有好的，沒有好的那就是壞的嘛！「等」，這個等字包涵了下面，生老病死。那麼現在共分八個項目。這八個項目，世尊在很多經典當中，不斷、不斷地告訴我們。他為什麼要不斷、不斷告訴我們哪？用多方面的策勵，總有一點一下觸動你的心，然後你從這地方拼命進入、努力，就行了，就行了。現在我們也是這樣，所以不要說稍微看一看，哎呀，看了沒有勁，你要努力去看。那裡看到了跟你相應了，那你就拼命在這地方把握住，去努力，那個時候就有機會，就有機會。否則只是在這外面轉，好可惜啊，就把這個暇滿的人身就浪費掉了啦！"]]}],"口譯音":"口譯音檔/siwei-kudi-02/003.mp3"},{"文":"修共中士一切所緣法類，如共下時所說共法，此亦應取。","口譯":"修共中士的一切所緣法類時，如共下士時所說的共同之法，在這裡也應取用。","四家合註":null,"時":"68B 20:32","頁":155,"af":"68b","st":1232,"et":1266,"消文":[{"文":"開始修中士了；中士跟下士是次第相關地向上進步。"},{"文":"共下士的法這裡還要取來修，等到堅固了再走上去。"}],"延伸":[],"逐字稿":[{"t":"68B 20:32","b":[["q","修共中士一切所緣法類，如共下時所說共法，此亦應取。"],["s","那麼，現在我們這個地方開始修中士了。說這個中士跟前面的下士，是次第相關地向上進步。所以前面共下士的，這個地方還是應該取來修習，等到這個堅固了，然後呢走上去。所以："]]}],"口譯音":"口譯音檔/siwei-kudi-02/004.mp3"},{"文":"諸不共之修事，若有慧力，如下所寫皆當善修。","口譯":"各種不共的修事，如果有慧力，對以下所寫的都應善加修習。","四家合註":null,"時":"68B 21:06","頁":155,"af":"68b","st":1266,"et":1311,"消文":[{"文":"不共指中士道：目的在上的是共，只求下的則對下不共。"},{"文":"前面基礎修好了，有慧力就照下面所說的修。"},{"文":"換句話說：力量不夠，暫時不必忙，先把基礎弄好。"}],"延伸":[],"逐字稿":[{"t":"68B 21:06","b":[["q","諸不共之修事，若有慧力，如下所寫皆當善修。"],["s","那麼，不共呢？就是指中士道，這個中士道對這個下士來說，不共的。有很多人他的目的在上，那麼是共同的；有很多人目的只求下，所以對下是不共的。所以假定他把前面那個基礎修好了，進一步修上面這個，那麼那個時候，如果有慧力的時候，那麼照著下面的所做。換句話說這個地方告訴我們什麼？如果你的力量不夠，暫時不必忙，先把基礎弄好。所以說："]]}],"口譯音":"口譯音檔/siwei-kudi-02/005.mp3"},{"文":"若慧劣弱，可暫捨置所引教文，","口譯":"如果慧力薄弱，可以暫時放下所引的經論文句，","四家合註":null,"時":"68B 21:51","頁":156,"af":"68b","st":1311,"et":1326,"消文":[{"文":"力量不夠的話，暫時不要先忙下面深入的。"}],"延伸":[],"逐字稿":[{"t":"68B 21:51","b":[["q","若慧劣弱，可暫捨置所引教文，"],["s","如果你的力量不夠的話，暫時不要先忙，忙下面深入的。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/006.mp3"},{"文":"唯當修習«應時義體»。","口譯":"只修習合於當下的義理要點（應時義體）。","四家合註":null,"時":"68B 22:06","頁":156,"af":"68b","st":1326,"et":1550,"消文":[{"文":"修習跟我們相應的、合宜的，步步踏實地深入。"}],"延伸":[{"題":"應時義體","組":[{"題":"同行依論轉心的行相","說":[{"類":"例","文":"愛講道理的同修說：「我已經錯了，我感到真高興！」轉過來得到功德。"}]},{"題":"先認清自己的程度","說":[{"類":"立","文":"進佛門一定要了解兩件事：目的何在，習氣是什麼。"},{"類":"因","文":"宿生習氣使我們進佛門，來了幹什麼卻弄不清楚；六祖聞一句即相應，畢竟少數。"}]},{"題":"先把握根本因","說":[{"類":"破","文":"弄不清楚時，千萬不要說：哪裡有大法去求。"},{"類":"立","文":"先把握根本因，進一步才是圓滿因。"},{"類":"喻","文":"做生意先要了解賺不賺錢；虧本生意拼命做，越做越虧本。"}]},{"題":"慧以對治煩惱為特質","說":[{"類":"立","文":"慧的特質是對治煩惱：認識了才能對治，才能解脫生死。"},{"類":"破","文":"否則拋棄世間跑到這裡來，不顛倒了嗎？"},{"類":"回扣","文":"慧力比較差的話，應該修習應時義體。"}]}],"說":[{"類":"例","文":"愛講道理的同修說：「我已經錯了，我感到真高興！」轉過來得到功德。"},{"類":"立","文":"進佛門一定要了解兩件事：目的何在，習氣是什麼。"},{"類":"因","文":"宿生習氣使我們進佛門，來了幹什麼卻弄不清楚；六祖聞一句即相應，畢竟少數。"},{"類":"破","文":"弄不清楚時，千萬不要說：哪裡有大法去求。"},{"類":"立","文":"先把握根本因，進一步才是圓滿因。"},{"類":"喻","文":"做生意先要了解賺不賺錢；虧本生意拼命做，越做越虧本。"},{"類":"立","文":"慧的特質是對治煩惱：認識了才能對治，才能解脫生死。"},{"類":"破","文":"否則拋棄世間跑到這裡來，不顛倒了嗎？"},{"類":"回扣","文":"慧力比較差的話，應該修習應時義體。"}],"af":"68b","st":1326}],"逐字稿":[{"t":"68B 22:06","b":[["q","唯當修習應時義體。"],["s","就是應該修習跟我們相應的、合宜的這個。我們總要步步踏實，這樣深入，這個是它最重要的！那麼照著這個次第上來，就步步地。所以我剛才說，我們懺悔有人見效，然後呢，讀了文有人見效，最近有好幾位同學。以前哪就有一位同修，他常常歡喜講道理，最近他認識了，他常常說：「哎呀，我已經錯了，我感到真高興！」我實在讚歎，我實在感謝！因為什麼呢？我們大家共同研究，他轉過來了，他得到功德，然後呢我也沾了他的光，我一天當中為了他歡喜，啊，我覺得真歡喜啊！"]]},{"t":"68B 23:06","b":[["s","這個法，所以我這個地方特別說明：你們一定要了解，一定要了解什麼？兩件事情。哪兩件事情？這個目的何在，還有習氣是什麼。我們因為宿生的習氣所使，因為宿生的習氣所使，所以自然而然又跑到佛門當中來。但是剛才說過了，雖然來是來了，來了目的幹什麼？一下的的確確弄不清楚的，這個倒是千真萬確的事實。極少數的大根性的人，他很快相應，譬如六祖大師，哦，他聽見了人家唸一句《金剛經》，行了，就這樣。可是這種人畢竟少數。我們大部分人哪，是，你看見這個廟很歡喜，你只是歡喜而已，這已經很難得了，你肯出家已經更不容易了。但是呢，畢竟我們在這個習氣當中。"]]},{"t":"68B 24:07","b":[["s","所以現在眼前進來的第一件事情，你一定要把這個，如果說弄不清楚的話，千萬不要說：哎呀，哪裡有大法去求啊，哪一個什麼好啊！不是的。說主要的它的根本在什麼地方把握住，根本因，進一步是圓滿因；根本因，然後是圓滿因。就像你賺錢一樣，你先要了解你做這個生意賺錢、不賺錢，賺錢的，然後再談那個生意做下去。所以你弄不清楚，明明這個虧本生意，你拼命地做，越做啊是越虧本哪！這是我們要了解的。所以實際上，他前面告訴我們，說：如果說自己的慧的力量比較差的話，那麼應該修習應時體義。慧的特質是什麼？慧的特質是對治煩惱。你必定要認識這個東西，你才談得到對它對治，對治了煩惱，才能夠解脫生死，這個才是我們進入佛門當中修行的特質。否則的話，你把世間的事情拋棄掉了，跑到這地方來，你不顛倒了嗎？你忙這些事情幹什麼？這是我們應該了解的。所以繼續。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/007.mp3"},{"文":"此等雖是思擇而修，然除應修諸所緣外，餘善不善無記等上，«悉不應散»。","口譯":"這些雖然是思擇而修（觀察修），但是除了應修的各個所緣之外，對其餘的善、不善、無記等上，都不應散亂。","四家合註":null,"時":"68B 25:50","頁":156,"af":"68b","st":1550,"et":1719,"消文":[{"文":"思擇：為何不講聞？前面是善知識指導聽聞，現在如所聽聞的正理來思惟。"},{"文":"應修諸所緣：上課要聽，早晚課隨文作觀念誦。"},{"文":"除此以外一切時，善、不善、無記上都不應散亂。"}],"延伸":[{"題":"悉不應散","組":[{"題":"不散方能對治不善","說":[{"類":"因","文":"不善、無記怎麼也不散亂？不善的更不能散亂！不散亂才曉得是不善而對治。"},{"類":"破","文":"不善現起時一散亂，修了半天是白忙，抵銷掉了。"}]},{"題":"一切時處不放鬆","說":[{"類":"立","文":"正修時一時一刻不放鬆，出去散步聊天也不會走歪路。"},{"類":"喻","文":"坐了沒味道出去散心，涼亭一坐三個鐘頭還嫌不夠；看書難得十分二十分。"},{"類":"立","文":"別小看這裡，我們的毛病、關鍵都在這上頭。"}]}],"說":[{"類":"因","文":"不善、無記怎麼也不散亂？不善的更不能散亂！不散亂才曉得是不善而對治。"},{"類":"破","文":"不善現起時一散亂，修了半天是白忙，抵銷掉了。"},{"類":"立","文":"正修時一時一刻不放鬆，出去散步聊天也不會走歪路。"},{"類":"喻","文":"坐了沒味道出去散心，涼亭一坐三個鐘頭還嫌不夠；看書難得十分二十分。"},{"類":"立","文":"別小看這裡，我們的毛病、關鍵都在這上頭。"}],"af":"68b","st":1550}],"逐字稿":[{"t":"68B 25:50","b":[["q","此等雖是思擇而修，然除應修諸所緣外，餘善不善無記等上，悉不應散。"],["s","了解了這一點，那麼我們緊跟著下去。說這些，是的，修這些都要什麼，「思擇」。他為什麼不講聞呢？因為前面告訴我們，什麼？這是善知識指導正確的內容，讓我們學習聽聞；從這裡我們現在開始的是，如所聽聞的正理而來思惟啊！所以說「雖是思擇而修」。但是除了我們「應修諸所緣外」 ─這個很重要哦！就是說，我們現在上課的時候要聽，作早晚課的時候要隨文作觀念誦，然後呢，除此以外，「餘善不善無記等上，悉不應散」。在除了這個時間以外，一切時間上頭，不管是善的、不善的、無記等上，都不應該散亂。你說：欸，善的嘛不要散亂，不善的、無記上面怎麼不散亂哪？善的固然是不要散亂，不善的是更不能散亂哪！因為你不散亂，所以你曉得：哎喲，不善的。曉得了不善的，然後你對治。如果不善的現起，你一散亂，你修了個半天，是白忙啊，然後呢抵銷掉了。懂不懂這個道理？"]]},{"t":"68B 27:39","b":[["s","所以你正式修的時候，一時一刻都不能放鬆，這個你必定要自己把握得住，那樣的話你才會認真地去修習。就算到那時候你出去散一下步，就算是聊一下天，你也不會走歪路。要不然的話，啊，你就算用功在這兒坐了一下，坐了就沒味道，然後跑出去想散散心，看見幾個人坐在涼亭裡，「哎呀，找到機會了！」然後就坐下來，啊！高高興興。在那裡看書，難得看它十分、二十分；這一坐啊，坐三個鐘頭，還嫌不夠，為什麼原因？就是這個。所以他這個地方你別小看哪，好像沒有深刻的道理，實際上真正的我們毛病、關鍵都在這個上頭啊！這是我們應該了解的！這是我們必定應該了解的。所以說："]]}],"口譯音":"口譯音檔/siwei-kudi-02/008.mp3"},{"文":"當於所緣遮心掉等，亦莫令隨昏睡沈沒增上而轉，","口譯":"應當在所緣上遮止內心的掉舉等，也不要讓心隨著昏睡、沈沒的增上力而轉，","四家合註":null,"時":"68B 28:39","頁":156,"af":"68b","st":1719,"et":1766,"消文":[{"文":"能識的心緣所緣，不如法的話要遮止它。"},{"文":"掉：跟散亂、貪相應的；等：包括其他不相應的。"},{"文":"向上揚是掉舉，掉完向下沈是昏沈，都是輪迴因。"}],"延伸":[],"逐字稿":[{"t":"68B 28:39","b":[["q","當於所緣遮心掉等，"],["s","所以我們在任何一切時候，我們這個心 ─在識心當中，一定有一個能識的心，去識所識的對象、所緣的。這個對這個所緣的，如果不如法的話，要遮止它。「掉等」，「等」字包括了不相應的，「掉」就是跟散亂、貪相應的這種。"]]},{"t":"68B 29:10","b":[["q","亦莫令隨昏睡沈沒增上而轉，"],["s","向上揚的時候嘛，掉舉，然後呢掉完了以後，向下沈的時候是昏沈，那個都是輪迴因。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/009.mp3"},{"文":"當令其識極為明淨，漸次修習。","口譯":"應當讓心識極為明了清淨，漸次修習。","四家合註":null,"時":"68B 29:26","頁":156,"af":"68b","st":1766,"et":null,"消文":[{"文":"一切時處心要明跟淨：跟善淨之法相應，而且很明。"},{"文":"稍微一點輕昏狀態，已經不對了。"},{"文":"依這個目標，慢慢地一步一步深入相應。"}],"延伸":[],"逐字稿":[{"t":"68B 29:26","b":[["q","當令其識極為明淨，漸次修習。"],["s","一切時處，要使我們的心情兩個現象：明跟淨。淨是清淨的，一定是跟善淨之法，而且這個善淨之法很明。"]]},{"t":"69A 00:05","b":[["s","有的時候稍微一點輕昏狀態，已經不對了，一定要明淨。這個是目標，然後呢，我們慢慢、慢慢地根據了這個認識的目標，慢慢、慢慢地修習，想辦法一步一步地深入相應。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/010.mp3"},{"文":"《入行論》云：「雖長夜修行，念誦苦行等，若心散亂修，佛說無義利。」此說一切«散亂善行»，其果微少。","口譯":"《入行論》說：「雖然長時修行，念誦、苦行等等，如果以散亂心來修，佛說沒有義利。」這是說一切散亂的善行，它的果報很微少。","四家合註":null,"時":"69A 00:24","頁":156,"af":"69a","st":24,"et":154,"消文":[{"文":"長時修行、念誦、苦行，心散亂就沒有多大利益。"},{"文":"要怎麼辦？照前面說的，令其識明淨。"},{"文":"散亂善行，得到的果非常少。"}],"延伸":[{"題":"散亂善行","組":[{"題":"身具德相，心要明淨","說":[{"類":"立","文":"回想前面：修行要靠人身，還要最圓滿的德相，具足戒乃至菩薩戒。"},{"類":"立","文":"心裡也要明跟淨，身心相應，才真正應得上佛說的戒。"}]},{"題":"以自淨其意為戒中心","說":[{"類":"立","文":"戒總括三句：以「自淨其意」為中心，形之身口「諸惡莫作，眾善奉行」。"},{"類":"立","文":"然後進入定慧，這是必定不能動的道理。"}]}],"說":[{"類":"立","文":"回想前面：修行要靠人身，還要最圓滿的德相，具足戒乃至菩薩戒。"},{"類":"立","文":"心裡也要明跟淨，身心相應，才真正應得上佛說的戒。"},{"類":"立","文":"戒總括三句：以「自淨其意」為中心，形之身口「諸惡莫作，眾善奉行」。"},{"類":"立","文":"然後進入定慧，這是必定不能動的道理。"}],"af":"69a","st":70}],"逐字稿":[{"t":"69A 00:24","b":[["q","《入行論》云：「雖長夜修行，念誦苦行等，若心散亂修，佛說無義利。」此說一切散亂善行，其果微少。"],["s","喏！引論上面告訴我們。雖然你長時候地修行，念誦、苦行等等，這個各方面的，但是你的心如果散亂的話，這樣也沒有多大的利益。要怎麼辦呢？就是照前面說的，令其識明淨，這樣的。「此說一切散亂善行，其果微少」，他得到的果非常少、非常少。"]]},{"t":"69A 01:10","b":[["s","說到這裡我們也同時可以回想一下，所以前面說，我們修行雖然是要靠人身，就是得到了人身還要最圓滿的德相。所以外面的身一定要選這樣的，說六道當中只有人道，人道當中還要這樣的圓滿的德相。不是一般的在家，不是受五戒、八關齋戒，乃至於沙彌，要具足戒，而且在具足戒上面，還要受菩薩戒等等。然後呢，心裡邊是要什麼狀態？也要身心一一相應，明跟淨，那個時候才真正應得上佛告訴我們的戒。佛講的戒，總括起來就這麼三句 ─以「自淨其意」作為它的中心，然後呢，由於這個心體上面，形之於身口是「諸惡莫作，眾善奉行」！然後進入定慧，這個是必定不能動的一個道理。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/011.mp3"},{"文":"又《修信大乘經》云：「善男子由此異門，說諸菩薩，隨其所有信解大乘，大乘出生，當知一切，皆是由其不散亂心，正思法義之所出生。」","口譯":"又《修信大乘經》說：「善男子，由這個異門（角度）來說，諸菩薩所有對大乘的信解，以及大乘的出生，應當知道一切都是由不散亂心正確思惟法與義所出生的。」","四家合註":"大小二乘世出世間一切功德，皆止觀之果。如《解深密經》云：「慈氏，若諸聲聞、若諸菩薩、若諸如來所有世間及出世間一切善法，應知皆是此奢摩他、毘缽舍那所得之果。」<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span>第二分二：一、疑彼；二、答之。初者：<\/span>若謂止觀，豈非已得修所成者相續功德，今說彼一切功德皆止觀之果，云何應理？<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span>第二分二：一、正答；二、將彼結合經教。初者：<\/span>答：如下所說真實止觀，實是已得修所成者相續之德，則大小乘一切功德，非盡彼二之果，然於善所緣心一境性以上諸三摩地，悉皆攝為奢摩他品，及凡簡擇如所有性、盡所有性義諸妙善慧，悉皆攝為毘缽舍那品。故密意說三乘所有一切功德皆止觀之果，無相違過。<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span>第二、結合教典者：<\/span>又於此義，《修信大乘經》亦密意說云：「善男子，由此異門，說諸菩薩盡其所有大乘信解，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span>謂即意樂圓滿，及<\/span>大乘出生，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span>謂即加行圓滿，<\/span>應知皆是無散亂心正思法、義之所出生。」無散亂心，謂奢摩他品心一境性；正思法、義，謂毘缽舍那品妙觀察慧。<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span>第三、以理亦能成立成辦大小二乘一切功德勝利者：<\/span>故大小乘一切功德，皆以觀慧思擇而修，及於所緣心一境性二所成辦，非唯止修或唯觀修一分而成。","時":"69A 02:34","頁":156,"af":"69a","st":154,"et":225,"消文":[{"文":"前面是論，這裡是經。異門：各方面不同的種種門。"},{"文":"信解大乘：由認識啟發信心，增長見解，如法行持。"},{"文":"大乘功德從開始到圓滿，都從不散亂心正思法義出生。"}],"延伸":[],"逐字稿":[{"t":"69A 02:34","b":[["q","又《修信大乘經》云：「善男子由此異門，說諸菩薩，隨其所有信解大乘，大乘出生，當知一切，皆是由其不散亂心，正思法義之所出生。」"],["s","前面是論，那個地方是經，也告訴我們，由於上面所說的這個道理，各式、各方面，「異門」是各方面不同的種種門當中說。修、修大乘的，「信解大乘」就是初步的信，由如何認識，啟發信心，然後呢，深入增長見解，如法行持。一切大乘的功德，從開始到圓滿出生，都從這個地方，什麼？「不散亂心」，那個不散亂心幹什麼？用這個心「正思法義」。是，前面所說的，我們現在的一切時處，不管是善、不善、無記等上，不要令它餘散，都安住在這個上頭。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/012.mp3"},{"文":"此中不散亂心者，謂除善所緣，不向餘散，«法及義»者謂文及義。","口譯":"這裡所說的不散亂心，是指除了善所緣之外，心不向其他地方散亂；法和義，是指文和義。","四家合註":null,"時":"69A 03:45","頁":156,"af":"69a","st":225,"et":293,"消文":[{"文":"「那麼就是這個」：師父併在上一句講，沒有另外解。"}],"延伸":[{"題":"法及義","組":[{"題":"未治煩惱，學法無用","說":[{"類":"破","文":"來了還滿好，心裡面卻煩煩惱惱。"},{"類":"立","文":"佛法真正的中心就是對治煩惱。"},{"類":"破","文":"不能對治煩惱，就是跟著佛身邊也沒有用。"}]},{"題":"淨除煩惱為唯一目的","說":[{"類":"立","文":"我們所學的只有一個目的：淨除煩惱，這是根本。"},{"類":"回扣","文":"不散亂、正思法義，法的特質就是指這個。"}]}],"說":[{"類":"破","文":"來了還滿好，心裡面卻煩煩惱惱。"},{"類":"立","文":"佛法真正的中心就是對治煩惱。"},{"類":"破","文":"不能對治煩惱，就是跟著佛身邊也沒有用。"},{"類":"立","文":"我們所學的只有一個目的：淨除煩惱，這是根本。"},{"類":"回扣","文":"不散亂、正思法義，法的特質就是指這個。"}],"af":"69a","st":225}],"逐字稿":[{"t":"69A 03:45","b":[["q","此中不散亂心者，謂除善所緣，不向餘散，法及義者謂文及義。"],["s","那麼就是這個。這個道理，我們只要自己內心上面，一觀察就很容易了解。現在很多人來了，大家覺得：哎呀，來是來了還滿好，心裡面就是煩煩惱惱啊！那時候你要清楚喔！修學佛法沒有別的，佛法的真正的中心就是對治煩惱，就是對治煩惱。如果說你不能對治煩惱的話，在任何地方，就是跟著佛身邊也沒有用！就是跟著佛身邊也沒有用，這是我們千真萬確必定要認識的。我們所有學的東西，只有一個目的，什麼？淨除煩惱，如此，因為這是根本嘛！所以不散亂，正思法義，法的特質指的是什麼？就是指這個，這是我們應該了解的。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/013.mp3"},{"文":"正思惟者，謂以觀慧觀察思擇，由此顯示隨修一切功德之法，皆須此二。","口譯":"正思惟，是指用觀慧來觀察思擇。由此顯示：隨修任何功德之法，都必須具備這兩者。","四家合註":null,"時":"69A 04:53","頁":156,"af":"69a","st":293,"et":339,"消文":[{"文":"正思惟：如法地、一點不錯地思惟。"},{"文":"觀慧觀察思擇：以智慧觀察、抉擇，不是糊里糊塗的。"},{"文":"一切功德，都由不散亂的心正思惟而來。"}],"延伸":[],"逐字稿":[{"t":"69A 04:53","b":[["q","正思惟者，謂以觀慧觀察思擇，由此顯示隨修一切功德之法，皆須此二。"],["s","那麼然後呢，你照著他的「正思惟」，如法地、一點不錯地思惟。那麼這個思惟什麼？就是以觀察的慧，就是我們的心裡面觀察、抉擇。這不是糊裡糊塗的喔！這個慧就是智慧，去觀察、去思惟、去抉擇。從這個地方說，一切的功德都這樣來的，都這樣才來的，以不散亂的心去正思惟，然後深入。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/014.mp3"},{"文":"故說引發三乘一切功德，皆須二事，一除善所緣心不餘散，專一而住真奢摩他«或其隨順»。二善觀察善所緣境，如所有性盡所有性，毘缽舍那或其隨順。","口譯":"所以說引發三乘的一切功德，都需要兩件事：一、心除了善所緣之外不向其他地方散亂，專一安住的真實奢摩他（止），或與它隨順的；二、善加觀察善所緣境的如所有性、盡所有性，即毘缽舍那（觀），或與它隨順的。","四家合註":null,"時":"69A 05:39","頁":156,"af":"69a","st":339,"et":549,"消文":[{"文":"三乘功德主要只有兩樣：一是止，善所緣心不餘散，安住其上。"},{"文":"或其隨順：未證奢摩他前，隨於此法、順於此法，先集聚資糧。"},{"文":"二是觀。如所有性：一切法的真如、本性、空性。"},{"文":"盡所有性：一切法現出來的相，五蘊、六入、十八界。"},{"文":"真實內涵，到毘缽舍那時再詳細講。"}],"延伸":[{"題":"或其隨順","組":[{"題":"戒是定的基礎","說":[{"類":"立","文":"戒是定的基礎，這才是學戒真正的目的。"},{"類":"破","文":"講戒這裡怎麼說、那裡怎麼說，到處生是非，完全弄錯戒的特質。"},{"類":"喻","文":"十八部如金碗裂開，不管哪一塊都是金。"}]},{"題":"集聚定資糧以趣慧","說":[{"類":"回扣","文":"其隨順，就是集聚定的資糧，我們目前做的這些；定是為了慧。"},{"類":"下手","文":"做任何事始終記得這個中心目標，慢慢地越跑越近。"}]}],"說":[{"類":"立","文":"戒是定的基礎，這才是學戒真正的目的。"},{"類":"破","文":"講戒這裡怎麼說、那裡怎麼說，到處生是非，完全弄錯戒的特質。"},{"類":"喻","文":"十八部如金碗裂開，不管哪一塊都是金。"},{"類":"回扣","文":"其隨順，就是集聚定的資糧，我們目前做的這些；定是為了慧。"},{"類":"下手","文":"做任何事始終記得這個中心目標，慢慢地越跑越近。"}],"af":"69a","st":339}],"逐字稿":[{"t":"69A 05:39","b":[["q","故說引發三乘一切功德，皆須二事，一除善所緣心不餘散，專一而住真奢摩他或其隨順。二善觀察善所緣境，如所有性盡所有性，毘缽舍那或其隨順。"],["s","那麼，這個裡邊整個的三乘的功德，主要的只有二樣：一個就是止，所謂「善所緣心不餘散」，安住在這個上頭。「或其隨順」，什麼叫隨順呢？就是你沒有證得奢摩他之前，隨於這個法，順於這個法。就像我們現在，把這個心總是種種地先集聚資糧，準備努力。所以戒是什麼？定的基礎，這才是我們學戒的真正目的，學戒真正的目的。這是我們必定要了解的。"]]},{"t":"69A 06:39","b":[["s","現在我看見有一些人那真是，說起來也可以說很可憐。哎喲！他講這個戒啊，這裡怎麼說，那裡怎麼說，結果弄了這個戒，到處在那裡生是非。他不曉得戒的真正的特質是幹什麼的，完全弄錯掉了。所以說，佛說得清清楚楚，十八部，哪一部 ……隨不同的根性 ─金啊、碗啊，碗裂開來了，不管哪一塊都是金啊！真正重要的，你要派這個用場。現在你弄錯了，這個是我們要了解的，所以這個目的在這裡。那所以「其隨順」，就是你要集聚定的資糧，那麼我們目前做的這些。而定是為什麼？目的還是為了慧，所以進一步是「善觀察善所緣境，如所有性盡所有性，毘缽舍那或其隨順。」那麼，這個盡所有性、如所有性，前面也簡單地說，真實的內涵等到毘缽舍那的時候，再詳細講說它。"]]},{"t":"69A 07:53","b":[["s","這「如所有性」就是換句話說，一切法的真如，簡單地說。換句話說，我們就說：喏！這個一切法的真相，或者說它的本性，或者說空性，就是這個。「盡所有性」呢，說一切法現出來的相，那就是這些啦，或者是五蘊啦、什麼六入啦、十八界啦，換句話說這個法在圈子裡面就是這個，它就是它整個的邊際。那進一步來說，就是那一個空性所現出來的行相、法相，或者緣起，或者是俗諦，種種所牽涉的，你歸納起來，那不外乎說五蘊，乃至於到十八界等等，這一些。那麼這個呢，就是屬於毘缽舍那，所謂觀。我們現在這個也就是隨順，那一步一步我們這麼上去，這個才是我們的中心，我們的目標。做任何一件事情，修學佛法，我們始終記得這個。你如果記得這個的話，做什麼事情，慢慢地、慢慢地，越跑越近，越跑越近，越跑越上，這一點特別重要。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/015.mp3"},{"文":"如是亦如《解深密經》云：「慈氏，若諸聲聞，或諸菩薩，或諸如來，所有世間及出世間一切善法，當知皆是此奢摩他，毘缽舍那所得之果。」","口譯":"這也如《解深密經》說：「慈氏，不論是聲聞、菩薩或如來，所有世間及出世間的一切善法，應當知道都是這奢摩他、毘缽舍那所得的果。」","四家合註":"大小二乘世出世間一切功德，皆止觀之果。如《解深密經》云：「慈氏，若諸聲聞、若諸菩薩、若諸如來所有世間及出世間一切善法，應知皆是此奢摩他、毘缽舍那所得之果。」<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span>第二分二：一、疑彼；二、答之。初者：<\/span>若謂止觀，豈非已得修所成者相續功德，今說彼一切功德皆止觀之果，云何應理？<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span>第二分二：一、正答；二、將彼結合經教。初者：<\/span>答：如下所說真實止觀，實是已得修所成者相續之德，則大小乘一切功德，非盡彼二之果，然於善所緣心一境性以上諸三摩地，悉皆攝為奢摩他品，及凡簡擇如所有性、盡所有性義諸妙善慧，悉皆攝為毘缽舍那品。故密意說三乘所有一切功德皆止觀之果，無相違過。<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span>第二、結合教典者：<\/span>又於此義，《修信大乘經》亦密意說云：「善男子，由此異門，說諸菩薩盡其所有大乘信解，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span>謂即意樂圓滿，及<\/span>大乘出生，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span>謂即加行圓滿，<\/span>應知皆是無散亂心正思法、義之所出生。」無散亂心，謂奢摩他品心一境性；正思法、義，謂毘缽舍那品妙觀察慧。<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span>第三、以理亦能成立成辦大小二乘一切功德勝利者：<\/span>故大小乘一切功德，皆以觀慧思擇而修，及於所緣心一境性二所成辦，非唯止修或唯觀修一分而成。","時":"69A 09:09","頁":156,"af":"69a","st":549,"et":577,"消文":[{"文":"聲聞、菩薩、佛，世出世間一切善法，都是這兩樣所得的果。"}],"延伸":[],"逐字稿":[{"t":"69A 09:09","b":[["q","如是亦如《解深密經》云：「慈氏，若諸聲聞，或諸菩薩，或諸如來，所有世間及出世間一切善法，當知皆是此奢摩他，毘缽舍那所得之果。」"],["s","喏，經上面，不管聲聞、菩薩、佛，不管世間、出世間一切善法，都是這兩樣東西所得的果，所得的果。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/016.mp3"},{"文":"此中若無真實止觀及«隨順»二，則三乘一切功德，非定皆是止觀之果。","口譯":"這裡如果沒有包括真實的止觀及隨順止觀這兩類，那麼三乘的一切功德，就不一定都是止觀的果了。","四家合註":null,"時":"69A 09:37","頁":156,"af":"69a","st":577,"et":1131,"消文":[{"文":"隨順：止觀的眷屬、類屬。"},{"文":"這是反顯：實際上三乘所有功德都是止觀的果。"},{"文":"正修八苦之前，又把次第重新提一下。"}],"延伸":[{"題":"隨順","組":[{"題":"佛一再提醒重視基礎","說":[{"類":"因","文":"平常提不上去，就是忽視了這一點；佛見到我們的毛病都在這上頭，所以一再提醒。"},{"類":"喻","文":"看書急著找中心，像造一百層樓，下面基礎不要。"}]},{"題":"莫好高騖遠，莫退屈","說":[{"類":"破","文":"好高騖遠；或說「我就是不行」癱著爬不起來，「只要念念佛」卻昏沈瞌睡：過猶不及。"},{"類":"下手","文":"觀察壞的策勵自己；太緊了就觀察好的，慶幸放寬。慢慢調，急不來。"}]},{"題":"同行討論的重要","說":[{"類":"例","文":"同修用功太緊，聽輕鬆的音樂放鬆心情。"},{"類":"喻","文":"電視廣告當時討厭，日後派上用場；靡靡之音的種子落在心裡，遇緣又生起。"},{"類":"立","文":"自己覺得想對了，這裡大有問題，這才是要觀察、討論的。"}]},{"題":"因地做對，果自然現","說":[{"類":"立","文":"不要怕摸不進去；因地做對了，果自然現起。"},{"類":"回扣","文":"有了這個策勵、這個認識，正修了：那麼怎麼修？說八苦當中。"}]}],"說":[{"類":"因","文":"平常提不上去，就是忽視了這一點；佛見到我們的毛病都在這上頭，所以一再提醒。"},{"類":"喻","文":"看書急著找中心，像造一百層樓，下面基礎不要。"},{"類":"破","文":"好高騖遠；或說「我就是不行」癱著爬不起來，「只要念念佛」卻昏沈瞌睡：過猶不及。"},{"類":"下手","文":"觀察壞的策勵自己；太緊了就觀察好的，慶幸放寬。慢慢調，急不來。"},{"類":"例","文":"同修用功太緊，聽輕鬆的音樂放鬆心情。"},{"類":"喻","文":"電視廣告當時討厭，日後派上用場；靡靡之音的種子落在心裡，遇緣又生起。"},{"類":"立","文":"自己覺得想對了，這裡大有問題，這才是要觀察、討論的。"},{"類":"立","文":"不要怕摸不進去；因地做對了，果自然現起。"},{"類":"回扣","文":"有了這個策勵、這個認識，正修了：那麼怎麼修？說八苦當中。"}],"af":"69a","st":652}],"逐字稿":[{"t":"69A 09:37","b":[["q","此中若無真實止觀及隨順二，則三乘一切功德，非定皆是止觀之果。"],["s","假定沒有真實的這個止觀及其隨順，隨順就是說它的眷屬、類屬，那麼就三乘的功德，不一定。實際上呢，三乘的所有的功德都是止觀的果。所以換句話說，這是反顯。總之一句話：不管三乘哪一乘，它真正重要的目的都在這個上頭。那是在正修那個八苦之前，先又提一下。說現在我們要修了，那麼這個次第，從下面怎麼上來，乃至於修的時候，又重新提。前面是告訴我們：修的時候正修時怎麼修；然後呢修完了以後，迴向怎麼迴向；迴向完了再下面一座，還沒有修的中間應該如何。又講四種資糧，然後又講把錯誤的很多錯誤的概念又提出，一步一步說得這麼清楚。乃至於到現在正式修了，他又隨時提醒我們，隨時提醒我們。"]]},{"t":"69A 10:52","b":[["s","這個地方有一個重點，這我們平常真正提不上去的，就是忽視掉了這一點，就是忽視掉了這一點，所以這個地方一再提醒。為什麼佛要一再提醒？佛陀的一切智人，就正見到我們平常的毛病都在這上頭。平常我們看書總是這樣，趕快要找到那個問題的中心在哪裡，欸，結果你往往前面這個東西不要的。像造房子一樣，「哎呀！我希望造的房子，造的一百層樓。」你趕快把一百層樓建起來，下面基礎不要的。至於像這個地方，他佛陀處處地方告訴我們，說下面這個你必須要修，你有了力量啊向上去。"]]},{"t":"69A 11:41","b":[["s","現在我們每有一類人，哎呀！好高騖遠，總翹求高的。反過來有一類人，「唉呀，我就是不行，我就是不行！」癱在這裡就爬不起來，就這樣。說：「我只要念念佛。」念佛本來不錯呀，你真的如果念佛的話，是非常好呀！結果呢，他心裡面就因為這麼弱，他說的時候，「我只要念念佛。」實際上行的時候，他念了佛沒有？沒有念欸！在那裡昏沈、瞌睡，一生空過，所以說過猶不及啊！我們目前大部分犯的毛病就是這個。大的來說這樣，細的來說呢，我們心理狀態平常也是這樣，一下猛利的時候，就衝過頭；一下塌下來的時候，唉！又提不起，就這樣。"]]},{"t":"69A 12:36","b":[["s","所以這一點地方，所以從這地方我們要注意，這個不是說一下叫我們改過來。所以這個後面就告訴我們，我們做任何事情，就是這樣：它開頭的時候，哇！起伏很大；然後呢你曉得了，慢慢、慢慢、慢慢、慢慢、慢慢，它必然地調得這樣子相。只要你自己感覺到，慢慢地，欸，在對了；然後呢，你緣著你做的這個方式，這樣進，還是急不來的喔！這就是真實的進步，真實的進步必然如此的，這我們要了解，這我們要了解。然後到了這個時候的話，你隨時觀察壞的方面，策勵自己。然後呢，策勵自己覺得很緊了，然後呢觀察好的方面呢，慶幸，啊，又放寬了，高興。就這樣地不斷地在調，它慢慢地一步一步、一步一步。"]]},{"t":"69A 13:24","b":[["s","這個地方我順便提起以前的事情來，所以平常思惟觀察固然是絕端地重要，還有呢，同學之間的共同的真正的討論，也非常重要。諸位啊！你們千萬不要把這個工夫，用在聊天上頭啊！這裡有幾位同修，經常願意跑得來跟我談談，我真歡喜，真歡喜啊！他往往有的時候他有一個小問題，我不妨舉出來。"]]},{"t":"69A 13:55","b":[["s","那有一個同修就說：嗯，有的時候，覺得用功用得心裡很緊。那是一個的確非常好的一個同修，他然後用功用得很緊，所以這個心裡就，哎喲，非常緊張，覺得：哎呀，這個死啊！又是：一旦生命失去了 ……那些都是好現象。然後呢，越弄越緊、越弄越緊，到那時候睡也睡不著，到那時候，書啊，看起書來 ……這樣。那怎麼辦？他就想一個鬆弛的辦法，欸，最後有的時候找到了一個鬆弛的辦法，找到鬆弛的辦法。那麼那位同修是個在家的同修，所以他就 ……因為在家人哪，以前譬如說有的時候聽聽什麼，外面偶然這個很輕鬆的這種音樂等等，欸，這個是滿好啊，這樣。對呀！然後呢，放輕鬆了以後再來。他說：「我的的確確地說，我並沒有染著這個音樂，可是那個時候，卻是放鬆了我的這個心情。」在他想起來很好。"]]},{"t":"69A 15:02","b":[["s","原則上面，我也非常讚歎他，可是那個時候就顯出那個討論的非常重要來，非常重要來了。所以我那時候舉了一個比喻，我當時也沒有談。「是，非常好，可是我舉一個例子給你聽聽。」他說：「好。」「你看電視看過沒有？」「看過。」「然後正在一個重要的節目，你聽得、看得很起勁的時候，忽然之間來一個廣告。你就覺得這個廣告真討厭，怎麼來這個東西，趕快、趕快過去。是，廣告商也未嘗不知道這樣，但是他就把那個廣告插進去，你曉得他為什麼？欸，妙了，你那個時候固然一心一意，正因為一心一意全部吸引在裡頭，那個廣告商讓你討厭；等到完了以後，你不在這個節目當中現行，有一天你想到要用的時候，你就想到：哎呀！當年討厭那個東西，就是你現在要的，它就派上用場了。」「嗯，對呀！」"]]},{"t":"69A 16:03","b":[["s","「現在你想想看，那個時候沒錯，你現在覺得很緊的時候，讓你調一下，是的，你覺得現在的心裡並沒有什麼。可是調的這個，那種世間的這種靡靡之音的種子，落在心裡面。假定說你證得果的聖人，不怕！佛根本不在乎。你是個凡夫，你還有無比地染污的種子，還有很多無比地染污的外緣。當另外一個時候，你的心不在正念上頭的時候，然後呢，你心裡本來就在這個世間的染緣當中，它又生起來了，因為有這個種子，裡邊有這個種子，外面有這個緣，你就跟著它去了。」他想了半天，「哎呀！沒有錯。」「就像你雖然當時是討厭這個廣告，但是對不起，這個廣告就派上用場了，對嗎？」「是啊！」"]]},{"t":"69A 17:01","b":[["s","所以有的時候我們平常我們自己覺得想對了，對不起，這裡有問題的哦！這個才是我們真正應該觀察、討論啊！所以平常不要說：「啊！我懂了，現在我就是對啊！」對不起，這裡大有問題，佛法不是那麼簡單。那麼佛有沒有？佛有，有種種善巧方便，這個地方我們不深入，我隨舉一例。結果這位同學聽了好歡喜啊！我剛才告訴你的，馬上有感應的，就是他只要處處深入，他隨時觸發到，隨時就來了。啊！他今天早晨懺悔完了以後，一句話，哎呀！他哭了個半天，然後又歡喜了半天。我就報告老法師，老法師好高興！「哈！善根發！」這千真萬確的，凡是真正有過經驗的，他這個次第必然是如此。"]]},{"t":"69A 17:53","b":[["s","所以我就特別提醒你們：你們不要怕，眼前好像顯得，唉呀，怎麼也摸不進去。你不要忙，只要因，這個因地當中你做對了，你只要再摸，你不要問它摸得進摸不進，這個因地在對了，你正在進去嘛，很簡單嘛！到那個時候，到某個時候，它這個果自然必然現起來的。這是所有過來佛菩薩，都是這樣的經驗，他也告訴我們。那眼前就是像我們普通這麼看看，大家推起來，你看看、我看看，我跟你都差不多。的確差不多啊，但是他在因地上面如法走，馬上見效。所以像這樣完整的次第，你只要肯做，立刻見效。現在呢，我們有了這個策勵，有了這個認識，那個時候正修了，原來在這裡呀！那麼怎麼修？說八苦當中，"]]}],"口譯音":"口譯音檔/siwei-kudi-02/017.mp3"},{"文":"如是八苦之中，初思惟生苦分五。","口譯":"這樣，八苦之中，第一思惟生苦，分為五種。","四家合註":null,"時":"69A 18:51","頁":156,"af":"69a","st":1131,"et":1159,"消文":[{"文":"八苦：生、老、病、死、愛別離、求不得、怨憎會、五陰熾盛。"},{"文":"一樣一樣分開研究；生苦分五個項目。"}],"延伸":[],"逐字稿":[{"t":"69A 18:51","b":[["q","如是八苦之中，"],["s","思惟生苦。那個八苦平常我們曉得的：生、老、病、死、愛別離、求不得、怨憎會、五陰熾盛，八樣東西。一樣一樣分開來，研究下去。"]]},{"t":"69A 19:16","b":[["q","初思惟生苦分五。"],["s","分五個項目。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/018.mp3"},{"文":"眾苦所隨故生為苦者，謂諸有情那洛迦中，及諸一向唯苦餓鬼，並諸胎生卵生，如是四類，於初生時，便有無量猛利苦受，隨逐而生。","口譯":"一、眾苦所隨故生是苦：就是那洛迦（地獄）中的有情，以及一向唯苦的餓鬼，還有胎生、卵生，這四類在剛出生時，就有無量猛利的苦受隨逐而生。","四家合註":null,"時":"69A 19:19","頁":156,"af":"69a","st":1159,"et":1212,"消文":[{"文":"一切的苦都隨著生，生一來，苦就跟著來了。"},{"文":"那洛迦、餓鬼、胎生、卵生四類，一有這個身體，無量猛苦跟著來。"}],"延伸":[],"逐字稿":[{"t":"69A 19:19","b":[["q","眾苦所隨故生為苦者，謂諸有情那洛迦中，及諸一向唯苦餓鬼，並諸胎生卵生，如是四類，於初生時，便有無量猛利苦受，隨逐而生。"],["s","第一個，「生」這個苦，它這個東西啊，一切的苦都隨著這個生，生一來，苦就跟著來了。那洛迦當然不談，一跑下去，唉呀，那不得了！餓鬼。除了這個以外，就是其他的胎生、卵生，一切四類，只要一生，一有了這個身體以後，無量的猛苦跟著來了，無量的苦都跟著來，只要「生」有，苦都跟著來了。第二個呢，"]]}],"口譯音":"口譯音檔/siwei-kudi-02/019.mp3"},{"文":"粗重所隨故生為苦者，謂三界一切諸行，為煩惱品粗重所隨，無堪能性，不自在轉。","口譯":"二、粗重所隨故生是苦：就是三界的一切諸行，都被煩惱品類的粗重所隨逐，沒有堪能性（能力），不能自在而轉。","四家合註":null,"時":"69A 20:12","頁":157,"af":"69a","st":1212,"et":1260,"消文":[{"文":"粗重就是煩惱的異名；一旦生了，煩惱也跟著來。"},{"文":"三界一切行：乃至色界、無色界，都在行苦當中。"},{"文":"無堪能性：沒有力量，想不受輪迴的圈套，做不到，不得自在。"}],"延伸":[],"逐字稿":[{"t":"69A 20:12","b":[["q","粗重所隨故生為苦者，"],["s","什麼是「粗重」呢？粗重就是煩惱的異名。"]]},{"t":"69A 20:20","b":[["q","謂三界一切諸行，為煩惱品粗重所隨，無堪能性，不自在轉。"],["s","這一旦生了以後，生起來了以後，煩惱也跟著來了。「三界一切行」，不但是地獄，那當然不談，惡道不談，乃至於天上面，色界也好，無色界也好，行苦當中。這個「行」本身就是「煩惱品」。「無堪能性」，什麼叫無堪能性？你沒有力量，你想不受這個苦的輪迴的圈套，做不到，你不得自在的。這第二個。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/020.mp3"},{"文":"三界有情諸行生起，皆為煩惱品類粗重隨逐。總之由有生住增長，煩惱種子隨逐流轉，故無堪能安住善事，亦不如欲自在而轉。","口譯":"三界有情的諸行生起，都被煩惱品類的粗重隨逐。總之，由於有生、住、增長，煩惱種子就隨逐流轉，所以沒有堪能力安住於善事，也不能隨自己的意願自在而轉。","四家合註":null,"時":"69A 21:00","頁":157,"af":"69a","st":1260,"et":1347,"消文":[{"文":"由生住增長，煩惱的現行、種子跟著流轉。"},{"文":"所以沒辦法安住在善所緣的事上。"},{"文":"不如欲自在而轉：希望要快樂，它偏偏不聽你招呼。"},{"類":"例","文":"好吃的吃飽了肚子脹，還要上大號、洗、買、弄；最快樂的吃就這麼多。"}],"延伸":[],"逐字稿":[{"t":"69A 21:00","b":[["q","三界有情諸行生起，皆為煩惱品類粗重隨逐。總之由有生住增長，煩惱種子隨逐流轉，故無堪能安住善事，亦不如欲自在而轉。"],["s","這個就是粗重煩惱的特質。因為三界的一切有情在行當中，行當中，那麼行的話呢，煩惱品粗重跟著來、跟著來。所以總之一句話：由於生、住、增長，生了下面緊跟著就什麼？喏，這樣來了，就是那個煩惱的現行，現行種子，跟著在這地方流轉，你沒辦法安住在善所緣的事，沒辦法。「亦不如欲自在而轉」，你希望的事情，對不起，做不到。你希望要快樂，它就偏偏不聽你招呼。就是眼前小小的快樂，好吃的東西吃飽了，等一下唉呀！肚子脹脹地難受，等一下還要上大號去、還要去洗、還要去忙、還要去買、還要去弄。那吃，這最快樂的事情，就這麼多，其他的不談了。所以這個生啊，是會有這樣的不理想啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-02/021.mp3"},{"文":"眾苦所依故生為苦者，謂於三界既受生已，由此因緣，便能增長老病死等，無邊眾苦。","口譯":"三、眾苦所依故生是苦：就是在三界中受生之後，由這個因緣，便會增長老、病、死等無邊的眾苦。","四家合註":null,"時":"69A 22:27","頁":157,"af":"69a","st":1347,"et":1383,"消文":[{"文":"生是一切苦的依處；受生了，老病死無邊眾苦都依此而來。"}],"延伸":[],"逐字稿":[{"t":"69A 22:27","b":[["q","眾苦所依故生為苦者，謂於三界既受生已，由此因緣，便能增長老病死等，無邊眾苦。"],["s","第三個，這個生是一切苦的依處，這個一切的苦都依這個上面，所以「眾苦所依」。第一個是眾苦所跟著來，還有呢煩惱跟著來，煩惱。現在呢，一切的苦是依於這個生，這三界之內一旦受生了，下面的都依這個，無邊眾苦。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/022.mp3"},{"文":"煩惱所依故生為苦者，謂於生死既受生已，便於貪境瞋境癡境發生三毒，由此能令身心苦惱不靜，不安樂住，謂諸煩惱，由種種門逼惱身心。","口譯":"四、煩惱所依故生是苦：就是在生死中受生之後，便對貪境、瞋境、癡境生起三毒，由此令身心苦惱不靜、不能安樂而住；也就是種種煩惱從各種門路逼惱身心。","四家合註":null,"時":"69A 23:03","頁":157,"af":"69a","st":1383,"et":1451,"消文":[{"文":"前面講苦果，這裡講苦因煩惱。"},{"文":"前面是生理的老病死，這裡是心理的。"},{"文":"好的貪、不好的瞋、其他的癡；三毒令身心逼惱，不靜不安樂。"}],"延伸":[],"逐字稿":[{"t":"69A 23:03","b":[["q","煩惱所依故生為苦者，謂於生死既受生已，便於貪境瞋境癡境發生三毒，由此能令身心苦惱不靜，不安樂住，謂諸煩惱，由種種門逼惱身心。"],["s","那麼這個是煩惱。這個幾樣東西，一個是苦的果，一個是苦的因。因當中又分成業因跟那個 ……業因當中是惑、業等等。現在這個地方所講的就是苦因煩惱，「煩惱所依」。一旦生起來了以後，這個煩惱都增長了，這煩惱是心理現象。上面說這個是指生理的，病啊、老啊、死啊，這個地方是心理的。因為你生了以後，對於好的嘛是貪，不好的嘛是瞋，其他的是癡，「發生三毒」。因為這個三毒令身心逼惱，「不靜」，不安樂。啊！這個是第四點，這個是第四點。最後"]]}],"口譯音":"口譯音檔/siwei-kudi-02/023.mp3"},{"文":"不隨所欲離別法性故生苦者，謂一切生最後邊際咸不出死，此非所愛，此復能令唯受眾苦。","口譯":"五、不隨所欲離別法性故生是苦：就是一切的生，最後的終點都不出於死，這不是所愛樂的，而且又只會令人承受眾苦。","四家合註":null,"時":"69A 24:11","頁":157,"af":"69a","st":1451,"et":1491,"消文":[{"文":"不隨所欲：道地的不自在，你希望的總歸不聽你招呼。"},{"文":"離別法性：沒有人想死，偏偏最後要死；生的本質法爾如是。"},{"文":"「謂一切生…」：師父只說「就這樣」，沒有另外解。"}],"延伸":[],"逐字稿":[{"t":"69A 24:11","b":[["q","不隨所欲離別法性故生苦者，"],["s","就這樣。最後生苦是什麼？「不隨所欲」，就是道地的不自在，你沒辦法自己把握住自己的，你希望的，它總歸不聽你招呼，到最後呢 ─別離。沒有一個人想別離，換句話說，沒有人想死的，它偏偏到最後你要死，這「別離法性」。它「生」這個特質的本質，法爾如是，這叫作苦。"]]},{"t":"69A 24:43","b":[["q","謂一切生最後邊際咸不出死，此非所愛，此復能令唯受眾苦。"],["s","就這樣。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/024.mp3"},{"文":"«故應思惟»如是生時，眾苦俱生，粗重俱生，生復能引衰老病等煩惱死亡，此亦能令受苦道理。","口譯":"所以應當思惟：像這樣出生的時候，眾苦一起生起，粗重一起生起，生又能引來衰老、病等、煩惱與死亡，這也就是生能令人受苦的道理。","四家合註":null,"時":"69A 24:51","頁":157,"af":"69a","st":1491,"et":1601,"消文":[{"文":"一共五樣：從生上面去想，分五個項目。"}],"延伸":[{"題":"故應思惟","組":[{"題":"多方思惟，增長功德","說":[{"類":"立","文":"越能深入多方面去思惟，增長的功德越大。"}]},{"題":"於可愛境思其過患","說":[{"類":"破","文":"眼前都顛倒了：把可愛、快樂的看成淨相增長。"},{"類":"下手","文":"對眼前可愛的東西，要想到它可怕、不可愛的那一面。"}]},{"題":"講戒不思惟則無用","說":[{"類":"破","文":"講了半天戒，境界現前了不相干，就是沒有認真思惟。"},{"類":"回扣","文":"這個地方，宗大師現在提醒我們這一點。"}]}],"說":[{"類":"立","文":"越能深入多方面去思惟，增長的功德越大。"},{"類":"破","文":"眼前都顛倒了：把可愛、快樂的看成淨相增長。"},{"類":"下手","文":"對眼前可愛的東西，要想到它可怕、不可愛的那一面。"},{"類":"破","文":"講了半天戒，境界現前了不相干，就是沒有認真思惟。"},{"類":"回扣","文":"這個地方，宗大師現在提醒我們這一點。"}],"af":"69a","st":1504}],"逐字稿":[{"t":"69A 24:51","b":[["q","故應思惟如是生時，眾苦俱生，粗重俱生，生復能引衰老病等煩惱死亡，"],["s","一共五樣。"]]},{"t":"69A 25:04","b":[["q","此亦能令受苦道理。"],["s","所以從第一個，從生上面去想，又分這個五個項目，分五個項目。你越能夠深入多方面去思惟，那麼增長的功德是越大，增長的功德越大。我們眼前都顛倒了。前面一開始告訴我們，我們把眼前很多事情覺得淨相增長。「淨相」是什麼？好的，看快樂的、安樂的。我們無始的煩惱在這裡，唯一的方法就是對治。所以對眼前很多可愛的東西，千萬注意啊！要想到它的可怕，不可愛的那一面。你如果不修習這個的話，說什麼都沒有用。講戒，就在這個上面，所以講了半天的戒，然後呢到這個境界現起，為什麼一點用場都沒有啊？就是你沒有認真思惟。所以有一些人，哎呀！講戒啊，又講這個、講這個，境界現前，了不相干。我心裡面實在覺得可憐，也只能說這樣，只能說可憐、愚癡啊！然後呢，他還自作聰明，這是我覺得愚癡是莫勝於此！我想這是我的善知識，阿彌陀佛！我可千萬不要犯這個毛病。這個，這個地方他現在提醒我們這一點。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/025.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-02/001.webp","n":1},{"img":"投影片/siwei-kudi-02/002.webp","n":2},{"img":"投影片/siwei-kudi-02/003.webp","n":3},{"img":"投影片/siwei-kudi-02/004.webp","n":4},{"img":"投影片/siwei-kudi-02/005.webp","n":5},{"img":"投影片/siwei-kudi-02/006.webp","n":6},{"img":"投影片/siwei-kudi-02/007.webp","n":7},{"img":"投影片/siwei-kudi-02/008.webp","n":8},{"img":"投影片/siwei-kudi-02/009.webp","n":9},{"img":"投影片/siwei-kudi-02/010.webp","n":10},{"img":"投影片/siwei-kudi-02/011.webp","n":11},{"img":"投影片/siwei-kudi-02/012.webp","n":12},{"img":"投影片/siwei-kudi-02/013.webp","n":13},{"img":"投影片/siwei-kudi-02/014.webp","n":14},{"img":"投影片/siwei-kudi-02/015.webp","n":15},{"img":"投影片/siwei-kudi-02/016.webp","n":16},{"img":"投影片/siwei-kudi-02/017.webp","n":17},{"img":"投影片/siwei-kudi-02/018.webp","n":18},{"img":"投影片/siwei-kudi-02/019.webp","n":19},{"img":"投影片/siwei-kudi-02/020.webp","n":20},{"img":"投影片/siwei-kudi-02/021.webp","n":21},{"img":"投影片/siwei-kudi-02/022.webp","n":24},{"img":"投影片/siwei-kudi-02/023.webp","n":25},{"img":"投影片/siwei-kudi-02/024.webp","n":26},{"img":"投影片/siwei-kudi-02/025.webp","n":27},{"img":"投影片/siwei-kudi-02/026.webp","n":28},{"img":"投影片/siwei-kudi-02/027.webp","n":29},{"img":"投影片/siwei-kudi-02/028.webp","n":30},{"img":"投影片/siwei-kudi-02/029.webp","n":31},{"img":"投影片/siwei-kudi-02/030.webp","n":32},{"img":"投影片/siwei-kudi-02/031.webp","n":33},{"img":"投影片/siwei-kudi-02/032.webp","n":34},{"img":"投影片/siwei-kudi-02/033.webp","n":35},{"img":"投影片/siwei-kudi-02/034.webp","n":36},{"img":"投影片/siwei-kudi-02/035.webp","n":37},{"img":"投影片/siwei-kudi-02/036.webp","n":38},{"img":"投影片/siwei-kudi-02/037.webp","n":41},{"img":"投影片/siwei-kudi-02/038.webp","n":42}],"投影片PDF":"投影片/siwei-kudi-02/slides.pdf","音檔範圍":"68B 17:31～69A 26:41"},"siwei-kudi-03":{"id":"siwei-kudi-03","標題":"思惟苦諦(3)","根":"思惟八苦","科判焦點":"丑一 思惟八苦","課本範圍":"P157 L8 ~ P160 完","堂數":111,"日期":"2026/11/17","分圖":[{"名":"生苦・住胎出胎","原文":[0,9]},{"名":"老苦","原文":[10,18]},{"名":"病苦・死苦","原文":[19,29]}],"音檔":{"69a":{"local":"音檔/gl1/069A.mp3","remote":"https://lamrim.xyz/player/media/gl1/069A.mp3"},"69b":{"local":"音檔/gl1/069B.mp3","remote":"https://lamrim.xyz/player/media/gl1/069B.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=69a&st1=1601&af2=69b&et2=1612","段":[{"文":"特住胎時受何苦者。","口譯":"特別是住在母胎時，受的是什麼樣的苦呢？","四家合註":null,"時":"69A 26:41","頁":157,"af":"69a","st":1601,"et":1638,"消文":[{"文":"前面講的是出生以後；這裡特別講還沒出生、住胎時的苦。"},{"文":"出生前的苦我們感受不到，所以提出來讓我們想；一想就覺得可怕，更策發我們。"}],"延伸":[],"逐字稿":[{"t":"69A 26:41","b":[["q","特住胎時受何苦者。"],["s","那個是指出生以後。然後呢這個地方是特別告訴我們：喏，這個出生這件事情，還沒有生起來，特別要了解一點。為什麼這個地方要講一講呢？因為我們感受，這是出生以後的事情，在沒有出生我們感受不到，實際上這個裡邊的的確確，所以提出來讓我們想。那我們一想到，唉呀！覺得可怕不已，更策發我們。下面："]]}],"口譯音":"口譯音檔/siwei-kudi-03/001.mp3"},{"文":"如《弟子書》云：「極猛臭穢極逼切，最狹黑闇遍蔽覆，«住胎猶入那洛迦»，身屈備受極重苦。」","口譯":"如《弟子書》說：「極為猛烈的臭穢、極為逼迫，最狹窄、黑暗，處處被覆蓋，住胎就像進入那洛迦（地獄），身體蜷屈，備受極重的痛苦。」","四家合註":null,"時":"69A 27:18","頁":157,"af":"69a","st":1638,"et":1752,"消文":[{"文":"又臭、又髒、又逼迫、又黑暗、又窄，真像住在地獄裡邊，備受痛苦。"}],"延伸":[{"題":"住胎猶入那洛迦","組":[{"題":"胎中苦相千真萬確","說":[{"類":"例","文":"母親吃飽了，像壓在山底下；肚子餓了，又像吊在空中；吃熱的燙得受不了，冷的又凍得受不了。"},{"類":"立","文":"這是千真萬確的事實，只是我們不知道；多多思惟，對生死就的確一無可取。"}]},{"題":"思惟能力用在該想處","說":[{"類":"立","文":"人最可貴的就是有思惟能力。"},{"類":"破","文":"偏偏把思惟能力用在胡思亂想、莫名其妙的事情上頭，好可惜。"},{"類":"立","文":"該想的地方多去想，自利利他，一切好處都在這裡。"},{"類":"下手","文":"牢牢記住：我來這裡目的幹什麼？宗旨幹什麼？觀念把握住，就很容易進去。"}]}],"說":[{"類":"例","文":"母親吃飽了，像壓在山底下；肚子餓了，又像吊在空中；吃熱的燙得受不了，冷的又凍得受不了。"},{"類":"立","文":"這是千真萬確的事實，只是我們不知道；多多思惟，對生死就的確一無可取。"},{"類":"立","文":"人最可貴的就是有思惟能力。"},{"類":"破","文":"偏偏把思惟能力用在胡思亂想、莫名其妙的事情上頭，好可惜。"},{"類":"立","文":"該想的地方多去想，自利利他，一切好處都在這裡。"},{"類":"下手","文":"牢牢記住：我來這裡目的幹什麼？宗旨幹什麼？觀念把握住，就很容易進去。"}],"af":"69a","st":1638}],"逐字稿":[{"t":"69A 27:18","b":[["q","如《弟子書》云：「極猛臭穢極逼切，最狹黑闇遍蔽覆，住胎猶入那洛迦，身屈備受極重苦。」此諸文義，"],["s","那麼這個是論上面告訴我們：唉！這個地方啊，又臭、又髒、又逼迫、又黑暗、又窄，這個真像住在這個地獄裡邊一樣，備受痛苦。所以經上告訴我們，這個住胎的時候，如果這個母親吃飽了，像壓在山底下一樣。哎呀！等一下肚子餓了，你就像吊在空中一樣，因為前面壓著嘛，忽然之間又這樣子。然後吃的熱的話，又燙得個受不了。等一下冷的話，你又凍得個受不了，這麼個嚴重法呀！這是千真萬確的事實，只是我們現在都不知道。所以我們多多思惟的話，那對於這個生死，的確是一無可取。"]]},{"t":"69A 28:24","b":[["s","所以這個地方，我們千萬不要浪費，人最可貴的，什麼？就是我們有思惟能力。現在我們偏偏把那思惟能力，像胡思亂想。啊，這個東西好可惜啊！所以有的時候，我們平常談了一些問題，有的人意見特別多，我心裡常常希望告訴他：你這個腦筋好，你不要用在莫名其妙的事情上頭啊！這是才是真正該想的地方啊！該想的地方多去想想的話，自利利他，一切好處都在這個地方，都在這個地方。所以我們一定要把握住，所以我黑板上面特別想，說我要牢牢記住，我來這裡目的幹什麼？宗旨幹什麼？這個觀念把握住了，你就很容易進去了。下面經。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/002.mp3"},{"文":"如《入胎經》云：「無量不淨，周遍充滿，多千蟲類之所依處，具足最極臭穢二門，具足非一骨鏁穴孔，復有便利清腦腦膜髓等不淨，生藏之下熟藏之上，面向脊骨背對腹皮，於月月中，出諸血相以之資養，母食食時，以二齒鬘細嚼吞下，其所吞食，下以口穢津涎浸爛，上為腦膜之所纏裹，猶如變吐。","口譯":"這些文句的意思，如《入胎經》所說：「（母胎中）充滿無量的不淨，是成千種蟲類依住的地方，具有極為臭穢的二門（大小便道），具有許多骨鏁（骨節）的孔穴，又有大小便、清腦、腦膜、骨髓等不淨。胎兒在生藏（胃）之下、熟藏（腸）之上，臉朝向母親的脊骨，背對著腹皮，每個月靠母親的經血來資養。母親吃東西時，用上下兩排牙齒細細嚼碎吞下，吞下的食物，下面被口中污穢的唾液浸爛，上面被腦膜所纏裹，就像嘔吐出來的東西。","四家合註":null,"時":"69A 29:12","頁":157,"af":"69a","st":1752,"et":null,"消文":[{"文":"師父只唸經文，沒有另外解，併在下一段一起說。"}],"延伸":[],"逐字稿":[{"t":"69A 29:12","b":[["q","如《入胎經》云：「無量不淨，周徧充滿，多千蟲類之所依處，具足最極臭穢二門，具足非一骨穴孔，復有便利清腦腦膜髓等不淨，生藏之下熟藏之上，面向脊骨背對腹皮，於月月中，出諸血相以之資養，母食食時，以二齒鬘細嚼吞下，其所吞食，下以口穢津涎浸爛，上為腦膜之所纏裹，猶如變吐。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/003.mp3"},{"文":"所有食味，從母腹中入自臍孔，而為資長，漸成羯羅藍、頞部陀、閉尸、健南，手足微動，體相漸現。手足面等胎衣纏裹，猶如糞穢，生臭變臭猛暴黑闇，«不淨坑中»上下遊轉，以諸苦酸粗鹹辣淡，猶如火炭。食味所觸，猶如蒼蠅，以不淨汁而為資養。如墜不淨，臭穢熾然，淤泥之中命根非堅。\n又母身內所有火力，煎炙遍炙極遍煎炙，燒熱遍熱極遍燒熱，燒燃遍燃極遍燒燃，受諸猛利粗惡難忍，非所悅意極大苦受。如如其母轉動，遍動極遍轉動，如是如是如被五縛，亦如投擲煻煨坑中，受諸猛利粗惡難忍，非所悅意，難以為喻，極大苦受。」","口譯":"所有食物的滋味，從母腹中進入胎兒的臍孔，作為資養，漸漸成為羯羅藍、頞部陀、閉尸、健南（入胎初期的各階段），手腳開始微動，身形漸漸顯現。手腳臉面被胎衣纏裹，就像糞穢一樣；在生臭、變臭、猛暴黑暗的不淨坑中上下遊轉，各種苦、酸、粗、鹹、辣、淡的食味，觸到時就像火炭；又像蒼蠅一樣，以不淨的汁液作為資養。就像墜入不淨之中，臭穢熾盛，在淤泥之中，命根並不堅固。又母親體內所有的火力，煎炙、遍炙、極遍煎炙，燒熱、遍熱、極遍燒熱，燒燃、遍燃、極遍燒燃，承受種種猛利、粗惡、難忍、不悅意的極大苦受。隨著母親轉動、遍動、極遍轉動，胎兒就像被五種繩索綑縛，又像被丟進熱灰坑中，承受種種猛利、粗惡、難忍、不悅意、難以比喻的極大苦受。」","四家合註":null,"時":"69B 00:02","頁":157,"af":"69b","st":2,"et":215,"消文":[{"文":"前面是經上的，不仔細解釋。"}],"延伸":[{"題":"不淨坑中","組":[{"題":"先懂道理，再作思惟","說":[{"類":"下手","文":"真正用功時，先把道理弄懂，弄懂了就想。"}]},{"題":"以糞坑為喻","說":[{"類":"喻","文":"小時候的糞坑，一跑去蒼蠅飛起來，臭氣沖天，蛆在裡邊；我們在母胎當中就是這個樣。"},{"類":"例","文":"老師說：現在人顛倒，處處裝飾得美，連太平間都沒有一點喪事的氣氛。"},{"類":"立","文":"實際上比蛆還苦：蛆只是臭，我們又臭又髒，又壓又冷、又寒又熱。"}]},{"題":"想出最苦，推動出離","說":[{"類":"破","文":"有善業的在母胎中很安樂，但這裡不要去想善業。"},{"類":"因","文":"不如法修苦，將來生了天下來還是這個，還要墮落地獄。"},{"類":"立","文":"把最苦的想出來，被苦的力量推動，拼命去跳出來，這是它的目的。"},{"類":"回扣","文":"所以下面的解釋，也只把它唸一遍。"}]}],"說":[{"類":"下手","文":"真正用功時，先把道理弄懂，弄懂了就想。"},{"類":"喻","文":"小時候的糞坑，一跑去蒼蠅飛起來，臭氣沖天，蛆在裡邊；我們在母胎當中就是這個樣。"},{"類":"例","文":"老師說：現在人顛倒，處處裝飾得美，連太平間都沒有一點喪事的氣氛。"},{"類":"立","文":"實際上比蛆還苦：蛆只是臭，我們又臭又髒，又壓又冷、又寒又熱。"},{"類":"破","文":"有善業的在母胎中很安樂，但這裡不要去想善業。"},{"類":"因","文":"不如法修苦，將來生了天下來還是這個，還要墮落地獄。"},{"類":"立","文":"把最苦的想出來，被苦的力量推動，拼命去跳出來，這是它的目的。"},{"類":"回扣","文":"所以下面的解釋，也只把它唸一遍。"}],"af":"69b","st":2}],"逐字稿":[{"t":"69B 00:02","b":[["q","所有食味，從母腹中入自臍孔，而為資長，漸成羯羅藍，頞部陀，閉尸健南，手足微動，體相漸現。手足面等胎衣纏裹，猶如糞穢，生臭變臭猛暴黑闇，不淨坑中上下遊轉，以諸苦酸粗鹹辣淡，猶如火炭。食味所觸，猶如蒼蠅，以不淨汁而為資養。如墜不淨，臭穢熾然，淤泥之中命根非堅。又母身內所有火力，煎炙遍炙極遍煎炙，燒熱遍熱極遍燒熱，燒然遍然極遍燒然，受諸猛利粗惡難忍，非所悅意極大苦受。如如其母轉動，遍動極遍轉動，如是如是如被五縛，亦如投擲煻煨坑中，受諸猛利粗惡難忍，非所悅意，難以為喻，極大苦受。」"],["s","前面是經上的，不仔細解釋。我們真正修行的話就要學這個，自己真正要用功的時候，你就這樣先把那個道理你去弄懂，弄懂了就想。如果你想不出來，簡單極了，簡單極了！哦，現在都不大簡單，我們小的時候比較好；現在的那些衛生設備，說起來叫衛生，說起來好！這樣。所以以前我曾經遇見一個老師，那個老師就告訴我們：「現在人真顛倒，邪見增長，我們那時候，處處都是修行。它現在裝飾得，每一個地方裝飾得真美，乃至於那太平間，人死了以後，哎呀！裝飾得、還要畫得就像那個 ……。一切的進去的時候，沒有一點點喪事的氣氛讓你，只是因為你的親人的感受。」我現在想想越想越對，我們小的時候，哪裡有現在的衛生設備，這沒有的 ─坑！你一坑一跑得去，跑得老遠那個蒼蠅飛起來，那個臭氣啊！這樣，然後你看那個蛆在裡邊 ……。我們在母胎當中就這個樣，說實在的就這個樣！"]]},{"t":"69B 02:34","b":[["s","啊！所以你一定要用這種方法，實際上呢比牠還要苦。欸，牠這個蛆，在這個糞坑裡只是臭一點，它不會逼、不會炙。我們在這個地方不但又臭又髒，而且又壓又冷、又寒又熱，沒有一個不具足，這樣。不過，但是並不一定完全如此喔，有很多如果生，他的善業的話，他在這個地方母胎當中是很安樂的。但是這個地方我們不要去想善業，就是說，如果說你不如法地去修苦的話，將來你總有一天，生了天下來的還是這個；這個還是最好的，你還要墮落地獄當中去。所以這個地方的特質，你要把最苦的想出來；想了以後，然後呢，被苦的力量推動你拼命去跳出來，這是他的目的，這個我們要重點要了解的。所以他下面是解釋，解釋我也只把它唸一遍。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/004.mp3"},{"文":"如是其母，若受飲食太多太少及食太膩太乾太冷太熱，鹹淡苦酸及太甘辛，若行欲行，若太急走，若跳若倒，若住火前，或蹲居坐，亦說於胎起大痛苦。生藏上壓熟藏下刺，如被五縛插之尖摽。","口譯":"像這樣，母親如果飲食太多、太少，吃得太膩、太乾、太冷、太熱，太鹹、太淡、太苦、太酸、太甜、太辣，或行房事，或走得太急，或跳、或跌倒，或靠近火前，或蹲著坐著，經中也說都會讓胎兒生起大痛苦。上面被生藏壓著，下面被熟藏刺著，就像被五種繩索綑縛、又被尖樁穿刺一樣。","四家合註":null,"時":"69B 03:35","頁":158,"af":"69b","st":215,"et":259,"消文":[{"文":"母親的飲食、起居、行動，都會讓胎兒生起大痛苦；師父唸過，沒有另外解。"},{"類":"喻","文":"上面是壓，下面是刺，就像「如坐針氈」，上面還有一個泰山壓頂，實在一無是處。"}],"延伸":[],"逐字稿":[{"t":"69B 03:35","b":[["q","如是其母，若受飲食太多太少及食太膩太乾太冷太熱，鹹淡苦酸及太甘辛，若行欲行，若太急走，若跳若倒，若住火前，或蹲居坐，亦說於胎起大痛苦。生藏上壓熟藏下刺，"],["s","啊！上面是壓，下面是刺，你就像坐在那個，坐在那個我們常常說「如坐針氈」，就這個樣。坐在針氈，只是我自己坐在上面，上面還有一個泰山壓頂，唉！實在是一無是處。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/005.mp3"},{"文":"從胎產時及產出時，所有眾苦，亦如《弟子書》云：「此漸«如硬壓油具»，壓迫其次方得生，然未爾時即捨命，唯是受苦業力強。住不淨中顛倒身，濕爛裹胎極臭穢，猛逼切痛如潰瘡，猶如變吐宿念捨。」","口譯":"從胎中產出時以及產出之後的所有眾苦，也如《弟子書》所說：「這時就像用堅硬的壓油器具，漸漸壓迫，之後才得出生；沒有當下就死去，只是因為受苦的業力強大。住在不淨之中，身體顛倒，被濕爛的胎衣包裹，極為臭穢，猛烈逼迫的切痛就像潰爛的瘡，就像嘔吐物一樣，宿世的憶念也都捨失了。」","四家合註":null,"時":"69B 04:19","頁":158,"af":"69b","st":259,"et":363,"消文":[{"文":"住胎是這樣，出來的時候也是一樣。"}],"延伸":[{"題":"如硬壓油具","組":[{"題":"以搾油為喻","說":[{"類":"喻","文":"以前的搾油：先燒得熱極，壓扁烤熱，放在籠裡用大鐵鎚壓，搾油工人的手臂這麼粗。"}]},{"題":"出生之苦如受鎚壓","說":[{"類":"喻","文":"大鐵鎚輕輕放下壓在腳指頭上，就痛得哇哇叫。"},{"類":"立","文":"出生的時候就是這麼個苦法，處處地方告訴我們。"}]}],"說":[{"類":"喻","文":"以前的搾油：先燒得熱極，壓扁烤熱，放在籠裡用大鐵鎚壓，搾油工人的手臂這麼粗。"},{"類":"喻","文":"大鐵鎚輕輕放下壓在腳指頭上，就痛得哇哇叫。"},{"類":"立","文":"出生的時候就是這麼個苦法，處處地方告訴我們。"}],"af":"69b","st":274}],"逐字稿":[{"t":"69B 04:19","b":[["q","如被五縛插之尖摽。從胎產時及產出時，所有眾苦，亦如《弟子書》云："],["s","那住胎是這樣，出來的時候也是一樣。出來的時候怎麼樣？"]]},{"t":"69B 04:34","b":[["q","「此漸如硬壓油具，壓迫其次方得生，然未爾時即捨命，唯是受苦業力強。住不淨中顛倒身，濕爛裹胎極臭穢，猛逼切痛如潰瘡，猶如變吐宿念捨。」"],["s","那個出來的時候，就像什麼？像壓油一樣。不曉得你們看見沒有？有沒有看見搾油？現在的搾油現在用化學提煉，那我們不談。我們以前看見那個搾油，啊！那個搾油真是啊，先把那個油擺在那個鍋子裡面燒，烤得熱得不得了，先把它壓扁，壓平了以後烤熱，烤了以後然後呢，放在一個籠裡邊，然後呢用那個大鐵鎚去壓，那個不得了的力量！現在我看見人家鍛鋼筋，以前的老法的鍛鋼筋拿了個大鐵鎚，「叭！」一鎚下去，把那鋼筋弄斷了。他那個搾油的人，那個工人也是一樣，那個手都是這麼粗，就是這樣。然後呢，打那個大鐵鎚，那我們被出生的時候就是用這種方法。要現在那個鐵鎚，不要說碰到一下，你輕輕地那個鐵鎚放下來，壓在你腳指頭上的話，壓得你哇哇叫，現在那出生的時候這麼個苦法！這個是處處地方告訴我們哪！"]]}],"口譯音":"口譯音檔/siwei-kudi-03/006.mp3"},{"文":"此諸文義，如《入胎經》云：「次彼漸生一切肢節，從其糞廁腐爛滴墜，不淨暴惡生臭變臭，黑闇可怖，糞尿熏粘，臭氣垢穢，血水常流，瘡門之中，由其先業異熟生風，吹足向上令頭向下，兩手縮屈被二骨輪，逼迫遍迫周遍逼迫，由諸粗猛難忍非悅，最大苦受令其身分悉皆青瘀，猶如初瘡，難可觸著，身一切根悉皆楚痛，極穢胎垢遍粘其身，由乾渴故，令其唇喉及以心臟悉皆枯燥，住此迫迮難忍苦處。此由因緣增上，宿業異熟生風吹促至極艱辛，始得產出。生已無間，«被外風觸如割塗灰»，手衣觸時如利劍割，當受粗猛難忍非悅極大苦受。」","口譯":"這些文句的意思，如《入胎經》所說：「接著漸漸長出一切肢節，在糞廁般腐爛滴墜、不淨暴惡、生臭變臭、黑暗可怖、糞尿熏粘、臭氣垢穢、血水常流的瘡門之中，由先業異熟所生的風，吹得腳向上、頭向下，兩手縮屈，被兩塊骨盤夾住，逼迫、遍迫、周遍逼迫，由於種種粗猛難忍不悅意的最大苦受，使身體全部青瘀，就像剛生的瘡，難以觸碰，身上一切根都楚痛，極穢的胎垢黏滿全身，由於乾渴，嘴唇、喉嚨以及心臟都枯燥，住在這狹迫難忍的苦處。這是由因緣增上、宿業異熟所生的風吹促，極為艱辛才得產出。生下之後，一被外面的風觸到，就像割傷後再塗上灰；被手或衣服觸到時，就像利劍切割，承受粗猛難忍不悅意的極大苦受。」","四家合註":null,"時":"69B 06:03","頁":157,"af":"69b","st":363,"et":521,"消文":[{"文":"上面是解釋，繼續唸下去。"}],"延伸":[{"題":"被外風觸如割塗灰","組":[{"題":"嬰兒初生如觸傷口","說":[{"類":"立","文":"在母胎中非常嫩，一出來碰到外面，痛苦極了。"},{"類":"喻","文":"燙傷、碰掉表皮時，風吹上去都痛得不得了，一點鹽水更無法忍受。"},{"類":"立","文":"嬰兒一落地哇啦哇啦哭就是這個原因：心有絕端的恐懼，身有絕大的痛苦。"}]},{"題":"佛不講則不知","說":[{"類":"立","文":"這是我們無法感受的，如果佛不講，我們根本不知道。"}]}],"說":[{"類":"立","文":"在母胎中非常嫩，一出來碰到外面，痛苦極了。"},{"類":"喻","文":"燙傷、碰掉表皮時，風吹上去都痛得不得了，一點鹽水更無法忍受。"},{"類":"立","文":"嬰兒一落地哇啦哇啦哭就是這個原因：心有絕端的恐懼，身有絕大的痛苦。"},{"類":"立","文":"這是我們無法感受的，如果佛不講，我們根本不知道。"}],"af":"69b","st":369}],"逐字稿":[{"t":"69B 06:03","b":[["q","此諸文義，如《入胎經》云："],["s","上面是解釋，還是繼續地唸下去。"]]},{"t":"69B 06:09","b":[["q","「次彼漸生一切肢節，從其糞廁腐爛滴墜，不淨暴惡生臭變臭，黑闇可怖，糞尿熏粘，臭氣垢穢，血水常流，瘡門之中，由其先業異熟生風，吹足向上令頭向下，兩手縮屈被二骨輪，逼迫遍迫周遍逼迫，由諸粗猛難忍非悅，最大苦受令其身分悉皆青瘀，猶如初瘡，難可觸著，身一切根悉皆楚痛，極穢胎垢遍粘其身，由乾渴故，令其唇喉及以心臟悉皆枯燥，住此迫迮難忍苦處。此由因緣增上，宿業異熟生風吹促至極艱辛，始得產出。生已無間，被外風觸如割塗灰，手衣觸時如利劍割，當受粗猛難忍非悅極大苦受。」"],["s","唉！這個出生的時候，住胎的時候這麼痛苦，出生的時候又這麼個難受！所以這個經上告訴我們出生的時候，本來在母胎當中，這個非常嫩、非常嫩，然後一旦出來碰見外面那個，觸的時候，那個痛苦，痛苦極了，痛苦極了！這東西我們不太容易 ……其實真的說起來，我們還是可以很容易地 ……。當你有的時候，身或者燙傷了，或者特別的因緣碰傷了，外面那個表皮碰掉了，那個肉在的時候，啊！那個外面的不要說碰到一點什麼東西，那個風吹上去也痛得不得了，對不對？一點的水，如果一點鹽水，或者什麼的話，你簡直無法忍受地痛苦。那我們出生的時候，這個感受就是這樣。所以這個嬰兒一下地哇啦哇啦哭，就是這個原因。哇！他那時候痛苦極了，心裡嘛有絕端的恐懼，身上嘛有絕大的痛苦。喏、喏、喏！這個是我們無法感受的，如果佛不講的話，我們還根本不知道，就是這個樣。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/007.mp3"},{"文":"又說如牛剝皮，被蟲所食，及如癩人遍身潰爛，加諸鞭撻極受楚切。又產已無間，取懷抱等及寒熱觸，亦當受諸粗猛難忍，非悅意苦。","口譯":"經中又說，就像剝了皮的牛被蟲啃食，又像全身潰爛的癩病人再加上鞭打，極受楚痛。又出生之後，被人抱起來等等，以及寒熱的觸碰，也都要承受種種粗猛難忍、不悅意的痛苦。","四家合註":null,"時":"69B 08:41","頁":159,"af":"69b","st":521,"et":558,"消文":[{"文":"大人歡喜把他抱起來，碰到任何地方都痛。"},{"文":"小孩一生下來就哭，就是這個原因：每一樣都難以忍受。"}],"延伸":[],"逐字稿":[{"t":"69B 08:41","b":[["q","又說如牛剝皮，被蟲所食，及如癩人遍身潰爛，加諸鞭撻極受楚切。又產已無間，取懷抱等及寒熱觸，亦當受諸粗猛難忍，非悅意苦。"],["s","然後呢，大人看見很歡喜把他抱起來，抱的時候，他碰到任何一個地方，碰到的無非是 ……所以那個小孩子一生下來，哭啊！就是這樣，就是這個原因，他痛苦嘛！每一樣東西都是難以忍受的，都不是好的。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/008.mp3"},{"文":"八苦之中，特於此初及於最後，須慇重修。","口譯":"八苦之中，特別是這第一個（生苦）以及最後一個（死苦），必須慇重修習。","四家合註":null,"時":"69B 09:18","頁":159,"af":"69b","st":558,"et":575,"消文":[{"文":"生苦跟死苦實際上最苦，偏偏這兩個我們還感覺不到；不是佛講，實在不知道。"}],"延伸":[],"逐字稿":[{"t":"69B 09:18","b":[["q","八苦之中，特於此初及於最後，須慇重修。"],["s","這個實際上這兩個最苦，生苦跟死苦，就偏偏這兩個東西我們還感覺不到。所以不是佛講，我們實在不知道啊！實在不知道啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-03/009.mp3"},{"文":"故如前說，當以觀慧«數數觀察»，而善修習。","口譯":"所以要如前面所說，用觀慧一再觀察，好好修習。","四家合註":null,"時":"69B 09:35","頁":159,"af":"69b","st":575,"et":688,"消文":[{"文":"要用前面告訴我們的觀察慧，觀察生、老。"}],"延伸":[{"題":"數數觀察","組":[{"題":"懈怠時翻看策勵","說":[{"類":"立","文":"現在的重點是讓我們認識知見，先把道的次第綱要認識。"},{"類":"下手","文":"事先先看完；萬一覺得要懈怠、提不起來時，就翻翻它。"},{"類":"破","文":"一懈怠，那就停在這個地方。"}]},{"題":"出離之外無第二條路","說":[{"類":"破","文":"有人說「弄弄不行」，要退轉回去。"},{"類":"立","文":"假如退轉能安樂，我第一個退轉；正因為清楚明白，沒有第二條路好走。"},{"類":"因","文":"現在這點小苦受不了要退轉，後面無邊的大苦就受得了嗎？"},{"類":"破","文":"為什麼要退轉？就是糊塗。"}]},{"題":"如病尋藥，正對治","說":[{"類":"喻","文":"生這種病的時候，馬上跑來找這個藥，這是我們的正對治。"}]}],"說":[{"類":"立","文":"現在的重點是讓我們認識知見，先把道的次第綱要認識。"},{"類":"下手","文":"事先先看完；萬一覺得要懈怠、提不起來時，就翻翻它。"},{"類":"破","文":"一懈怠，那就停在這個地方。"},{"類":"破","文":"有人說「弄弄不行」，要退轉回去。"},{"類":"立","文":"假如退轉能安樂，我第一個退轉；正因為清楚明白，沒有第二條路好走。"},{"類":"因","文":"現在這點小苦受不了要退轉，後面無邊的大苦就受得了嗎？"},{"類":"破","文":"為什麼要退轉？就是糊塗。"},{"類":"喻","文":"生這種病的時候，馬上跑來找這個藥，這是我們的正對治。"}],"af":"69b","st":575}],"逐字稿":[{"t":"69B 09:35","b":[["q","故如前說，當以觀慧數數觀察，而善修習。"],["s","所以我們必定要把前面告訴我們的觀察慧，這個生，然後呢老 ─生、老。這個前面我雖然略略地唸過，所以唸過的，因為現在的重點讓我們認識這個知見，那麼然後呢你們正修的時候，現在我們先把那個道的次第的綱要認識，這個是這個重要。平常在我們平常如果你要懈怠了，或者什麼，提不起來的時候，那個時候自己認真先去看它。當然不是等到提不起來，就是事先你先看完，看完了萬一你覺得要懈怠的時候，然後翻翻它。哎喲！就想到：一懈怠，那對不起，那就停在這個地方。"]]},{"t":"69B 10:22","b":[["s","所以這個世間你了解了，沒有第二條路好走的。往往有人說，唉呀，弄弄不行，要退轉去了。假如退轉去安樂的話，我第一個退轉，我絕對不願意跑得來受這個罪。因為我現在了解得清楚、明白，沒有第二條路好走的。現在你雖然苦，你拼命努力有跳出苦的機會，你現在這一點小苦都受不了，退轉，後面是無邊的大苦等在這裡。現在這麼小苦你受不了要退轉，你那個無邊的大苦就受得了了嗎？那這是個最重要的概念。為什麼我們要退轉呢？就是糊塗！所以這些都是真正幫忙我們的。所以說，在這裡雖然不講，對你們修行這個是最重要的，最重要的！現在我們繼續下去，反正每一個地方，我們曉得它的功效在什麼地方。如果生這種病的時候，馬上跑得來找這個藥，這個藥是對我們的正對治。那麼生曉得了，老："]]}],"口譯音":"口譯音檔/siwei-kudi-03/010.mp3"},{"文":"思惟老苦分五。\n«盛色衰退»者，謂腰曲如弓，頭白如艾，額如砧板，皺紋充滿，由如是等，衰其容貌令成非愛。","口譯":"思惟老苦，分為五種。一、盛色衰退：就是腰彎得像弓，頭髮白得像艾草，額頭像砧板，布滿皺紋；由於這些，容貌衰敗，變得不可愛。","四家合註":null,"時":"69B 11:28","頁":159,"af":"69b","st":688,"et":785,"消文":[{"文":"老了腰站不直，像弓；頭髮都白了。"},{"文":"額如砧板：平常皮膚細嫩，老了就像砧板上布滿刀痕；皺紋充滿，容貌變得不可愛。"}],"延伸":[{"題":"盛色衰退","組":[{"題":"未老先衰，趕快努力","說":[{"類":"例","文":"我現在已經深深感覺到了：坐一下就腰痠背痛。"},{"類":"破","文":"這裡很多人未老先衰，尤其是心理上面，更重要。"},{"類":"立","文":"真可憐哪，趕快好好努力。"}]},{"題":"愛惜容貌者更應思惟","說":[{"類":"下手","文":"尤其女性特別注意；凡是歡喜容貌的，這一點對你特別有價值。"},{"類":"破","文":"不要說：「唉呀，這個修道很苦啊！」"},{"類":"立","文":"想到這裡，這是唯一的一條路，沒有退路好想。"}]}],"說":[{"類":"例","文":"我現在已經深深感覺到了：坐一下就腰痠背痛。"},{"類":"破","文":"這裡很多人未老先衰，尤其是心理上面，更重要。"},{"類":"立","文":"真可憐哪，趕快好好努力。"},{"類":"下手","文":"尤其女性特別注意；凡是歡喜容貌的，這一點對你特別有價值。"},{"類":"破","文":"不要說：「唉呀，這個修道很苦啊！」"},{"類":"立","文":"想到這裡，這是唯一的一條路，沒有退路好想。"}],"af":"69b","st":691}],"逐字稿":[{"t":"69B 11:28","b":[["q","思惟老苦分五。"],["s","第一個，"]]},{"t":"69B 11:31","b":[["q","盛色衰退者，謂腰曲如弓，頭白如艾，額如砧板，皺紋充滿，由如是等，衰其容貌令成非愛。"],["s","第一個老了，老了以後平常你站起來，站得很挺，到那個時候腰也站不起來了，像弓。唉！我現在已經深深感覺到了，曉得要坐得好好的，坐了一下，啊！這腰痠背痛那沒辦法，就這樣，就下來了。其實，其實你們沒有老，我們在這裡很多人未老先衰啊已經，真可憐哪，趕快好好努力啊！尤其是心理上面，有一些人，這個是更重要啊，更重要啊！然後呢「頭白如艾」，到那個時候看看那個頭髮都白了，這樣。「面額如砧板」，砧板什麼樣子？平常我們那個皮膚非常細嫩，那個砧板的樣子，那個刀痕切得都是，到我們老了，這個面就是這樣。尤其是女性這個地方特別注意，不要說：「唉呀，這個修道很苦啊！」你想到這裡，也是唯一的一條路，這是唯一的一條路，回去沒退路好想的。「皺紋充滿」，這個「容貌令非可愛」，並不一定是女性，凡是你歡喜這個的話，那這一點對你特別有價值。第二："]]}],"口譯音":"口譯音檔/siwei-kudi-03/011.mp3"},{"文":"氣力衰退者，謂於坐時，如袋斷索，起如拔樹，語言遲鈍，行步緩慢等。","口譯":"二、氣力衰退：就是坐下時，像袋子斷了繩索（一下子垮下）；起身時像拔樹一樣費力；說話遲鈍，走路緩慢等。","四家合註":null,"時":"69B 13:05","頁":159,"af":"69b","st":785,"et":839,"消文":[{"文":"坐下來如斷袋索：袋子一放「噗通」一下，老人跑到凳子上「卡嗒」一下坐下來。"},{"文":"站起來千難萬難；生病的時候就是這個狀態。"},{"文":"講話遲鈍，行步遲緩。"}],"延伸":[],"逐字稿":[{"t":"69B 13:05","b":[["q","氣力衰退者，謂於坐時，如袋斷索，起如拔樹，語言遲鈍，行步緩慢等。諸根衰退者，謂眼等不能明見色等，重忘念等，減念力等。"],["s","第二個氣力衰了，坐下來的時候如斷袋索。什麼叫斷袋索啊？那個袋啊這樣，它平常的時候那個綁住的，然後呢，袋一放「噗通！」一下，人老了就是這樣的，跑到那個凳子上就「卡嗒！」一下坐下來了。唉！站呢實在站不動。平常我們坐好好的，站起來啊，站不起來，唉！站起來是千難萬難。現在你們不大會感覺得到的，但是生病的時候就是這個狀態，哎呀，這個站起來那個腳裡面實在是沒有氣力啊！講話的時候遲鈍，行步的時候遲緩。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/012.mp3"},{"文":"諸根衰退者，謂眼等不能明見色等，重忘念等，«減念力等»。","口譯":"三、諸根衰退：就是眼等根不能清楚看見色等境，常常忘失，念力減退等。","四家合註":null,"時":"69B 13:59","頁":159,"af":"69b","st":839,"et":899,"消文":[{"文":"前面講氣力，這裡講裡邊的根衰退。"},{"文":"近視了、遠視了，遠也看不見，近也看不見。"},{"文":"很多事情回頭就忘，要記也記不住。"}],"延伸":[{"題":"減念力等","組":[{"題":"莫待老來才修","說":[{"類":"破","文":"現在大家都說：「等到慢慢地到那個時候再去修。」"},{"類":"立","文":"老的時候就是這個樣，你還能修嗎？"}]},{"題":"年輕莫忙不相干事","說":[{"類":"破","文":"年輕力壯，都浪費在不必要的上頭。"},{"類":"破","文":"在家人情有可原；出了家還忙不相干的事，等到老了死路一條，真可惜。"}]}],"說":[{"類":"破","文":"現在大家都說：「等到慢慢地到那個時候再去修。」"},{"類":"立","文":"老的時候就是這個樣，你還能修嗎？"},{"類":"破","文":"年輕力壯，都浪費在不必要的上頭。"},{"類":"破","文":"在家人情有可原；出了家還忙不相干的事，等到老了死路一條，真可惜。"}],"af":"69b","st":839}],"逐字稿":[{"t":"69B 13:59","b":[["s","然後呢「諸根衰退」，這個是特別講身根，氣力沒有了，講裡邊的根衰退了。「眼」是「不能明見」，「重忘念等」，念力衰退等，就是這樣。到了那個時候，近視了、遠視了，遠也看不見，近也看不見，唉，真是！就這樣，就這樣。然後呢，很多事情回頭就忘記掉了，要記也記不住。尤其現在大家都是：「哎呀！等到慢慢地到那個時候再去修。」老的時候你就是這個樣，你還能修嗎？年輕力壯把那個，都浪費在不必要的上頭。在家人還情有可原，他本來不知道；出了家還忙這些不相干的事情，真可惜啊！然後忙那個不相干的事情，等到老了以後，那死路一條，這個情況啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-03/013.mp3"},{"文":"受用境界衰退者，謂受飲食等，極難消化，又無堪能受諸欲塵。","口譯":"四、受用境界衰退：就是吃喝等極難消化，又沒有能力享受種種欲塵。","四家合註":null,"時":"69B 14:59","頁":159,"af":"69b","st":899,"et":921,"消文":[{"文":"前面是裡邊的，這是外面的受用境界。"},{"文":"以前覺得很好的，現在難消化、沒辦法堪忍；很想，偏偏不行。"}],"延伸":[],"逐字稿":[{"t":"69B 14:59","b":[["q","受用境界衰退者，謂受飲食等，極難消化，又無堪能受諸欲塵。"],["s","這是裡邊的。外面的境界呢，對受用的，以前一直覺得很好，對不起，你難消化，你沒辦法堪忍。哎呀！你很想，那偏偏不行。然後，"]]}],"口譯音":"口譯音檔/siwei-kudi-03/014.mp3"},{"文":"壽量衰退苦者，謂壽多滅盡，速趣於死，應當數數思惟此等。","口譯":"五、壽量衰退苦：就是壽命大多已經耗盡，很快就趨向死亡。應當一再思惟這些。","四家合註":null,"時":"69B 15:21","頁":159,"af":"69b","st":921,"et":937,"消文":[{"文":"這五樣東西，要不斷地、好好地去思惟。"}],"延伸":[],"逐字稿":[{"t":"69B 15:21","b":[["q","壽量衰退苦者，謂壽多滅盡，速趣於死，應當數數思惟此等。"],["s","這個五樣東西不斷地、好好地去思惟啊！下面引經上面告訴我們。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/015.mp3"},{"文":"《廣大遊戲經》中亦云：「由老令老壞少壯，猶如大樹被雷擊，由老令耄朽屋畏，能仁快說老出離。","口譯":"《廣大遊戲經》中也說：「由於老，使人衰老、破壞少壯，就像大樹被雷擊；由於老，使人老耄，像朽壞的房屋令人畏懼。能仁啊，請快說出離老的方法！","四家合註":null,"時":"69B 15:37","頁":159,"af":"69b","st":937,"et":983,"消文":[{"文":"「老」這個特質，使每個人慢慢趨向老，把盛年少壯慢慢破壞掉。"},{"文":"就像長得好好的樹，被雷擊得支離破碎。"},{"文":"了解了，趕快趁現在能作的時候，跳出這個痛苦。"}],"延伸":[],"逐字稿":[{"t":"69B 15:37","b":[["q","《廣大遊戲經》中亦云：「由老令老壞少壯，"],["s","這個「老」，這個法，「老」這個這一個特質，使得我們每一個人慢慢地趨向於老，把你的盛年少壯那個慢慢、慢慢地破壞掉了。"]]},{"t":"69B 15:53","b":[["q","猶如大樹被雷擊，"],["s","就像一棵長得好好的樹，被這個雷擊得支離破碎。"]]},{"t":"69B 16:01","b":[["q","由老令耄朽屋畏，能仁快說老出離。"],["s","這個老是這樣啊！所以世尊告訴我們這個老相。所以你了解了，趕快趁現在能作的時候，趕快跳出，跳出這個痛苦啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-03/016.mp3"},{"文":"諸男女眾由老枯，如猛風摧娑羅林，老奪精進及勇勢，譬如士夫陷淤泥。老令妙色成醜陋，老奪威德奪勢力，老奪安樂作毀訾，老奪光澤而令死。」","口譯":"男男女女都因老而枯槁，就像猛風摧折娑羅樹林；老奪走精進與勇勢，就像人陷在淤泥中。老使美好的容色變得醜陋，老奪走威德、奪走勢力，老奪走安樂、招來毀謗，老奪走光澤而令人死亡。」","四家合註":null,"時":"69B 16:23","頁":159,"af":"69b","st":983,"et":1036,"消文":[{"文":"不管若男若女，被老所枯，像猛風吹過很脆的娑羅林，摧枯拉朽。"},{"文":"現在想作的精進、勇猛，到那時一點都沒有了，像陷在淤泥裡，進退兩難。"},{"文":"老奪妙色、威德、安樂、光澤：這麼個嚴重法。"}],"延伸":[],"逐字稿":[{"t":"69B 16:23","b":[["q","諸男女眾由老枯，如猛風摧娑羅林，老奪精進及勇勢，譬如士夫陷淤泥。"],["s","一切的不管是若男若女，就被這個老所枯，這個枯像什麼？像大風吹那個娑羅林，這個娑羅林樹很脆的，被猛風吹過去，摧枯拉朽一下統統破壞掉了。我們現在這個要想作的精進、勇猛的心情，到那個時候一點都沒有了。到那個時候就像什麼？陷在那個淤泥裡邊，真是進退兩難哪！"]]},{"t":"69B 17:06","b":[["q","老令妙色成醜陋，老奪威德奪勢力，老奪安樂作毀訾，老奪光澤而令死。"],["s","這麼個嚴重法。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/017.mp3"},{"文":"慬哦瓦云：「死苦雖重，而時短促，此老最重。」","口譯":"慬哦瓦說：「死苦雖然重，但時間短促，這個老苦才是最重的。」","四家合註":null,"時":"69B 17:16","頁":159,"af":"69b","st":1036,"et":1052,"消文":[{"文":"死苦雖然厲害，但很短；真的說起來，這個老最嚴重。"}],"延伸":[],"逐字稿":[{"t":"69B 17:16","b":[["q","慬哦瓦云：「死苦雖重，而時短促，此老最重。」"],["s","死苦雖然厲害，但是它很短呀！真的說起來這個老最嚴重。下面那個祖師講的話，這是千真萬確的。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/018.mp3"},{"文":"迦瑪瓦云：「老漸漸至，故稍可忍，«若一時頓至»，實無能忍之方便。」","口譯":"迦瑪瓦說：「老是漸漸來的，所以還稍微可以忍受；如果一下子全部來到，實在沒有任何能忍受的方法。」","四家合註":null,"時":"69B 17:32","頁":159,"af":"69b","st":1052,"et":1252,"消文":[{"文":"幸好老是慢慢來的，通常四十以後漸漸開始，到七十、八十。"},{"文":"如果幾十年的老相一口氣來，沒有一個人受得了。"}],"延伸":[{"題":"若一時頓至","組":[{"題":"一時頓至無人能忍","說":[{"類":"喻","文":"平常忽然生了病倒下，痛苦難受到想到簡直不想活了。"},{"類":"例","文":"師父自述：坐下來「卡嗒」一下，站起來像拔樹；清楚的名字講到口邊就記不起來，眼前的人也想不起。"},{"類":"立","文":"念力衰退會到這種程度，你們無法想像。"}]},{"題":"趁年輕力壯精進","說":[{"類":"破","文":"我們居然安之若素，還說慢慢地來。"},{"類":"立","文":"現在只有年輕力壯的時候。"},{"類":"破","文":"年輕同修躲在後面，猜反正輪不到我，偷懶，是最大的損失。"},{"類":"例","文":"看見年輕同修精進，真讚歎；我老了，只能賺一點隨喜功德。"}]},{"題":"見人善惡皆成策勵","說":[{"類":"例","文":"一早起來看見對面同修的燈光，最大的歡喜，讚歎隨喜。"},{"類":"例","文":"看見鐘鼓敲完還在拖拉的人，以前心裡覺得這人怎麼樣，現在覺得真可惜：我可不要這樣，他策勵我。"},{"類":"下手","文":"不要為人家而生煩惱：一方面增長自己，一方面珍惜自己。"},{"類":"回扣","文":"處處把前面的道理多思惟；多思惟了，就開始可以努力了。"}]}],"說":[{"類":"喻","文":"平常忽然生了病倒下，痛苦難受到想到簡直不想活了。"},{"類":"例","文":"師父自述：坐下來「卡嗒」一下，站起來像拔樹；清楚的名字講到口邊就記不起來，眼前的人也想不起。"},{"類":"立","文":"念力衰退會到這種程度，你們無法想像。"},{"類":"破","文":"我們居然安之若素，還說慢慢地來。"},{"類":"立","文":"現在只有年輕力壯的時候。"},{"類":"破","文":"年輕同修躲在後面，猜反正輪不到我，偷懶，是最大的損失。"},{"類":"例","文":"看見年輕同修精進，真讚歎；我老了，只能賺一點隨喜功德。"},{"類":"例","文":"一早起來看見對面同修的燈光，最大的歡喜，讚歎隨喜。"},{"類":"例","文":"看見鐘鼓敲完還在拖拉的人，以前心裡覺得這人怎麼樣，現在覺得真可惜：我可不要這樣，他策勵我。"},{"類":"下手","文":"不要為人家而生煩惱：一方面增長自己，一方面珍惜自己。"},{"類":"回扣","文":"處處把前面的道理多思惟；多思惟了，就開始可以努力了。"}],"af":"69b","st":1052}],"逐字稿":[{"t":"69B 17:32","b":[["q","迦瑪瓦云：「老漸漸至，故稍可忍，若一時頓至，實無能忍之方便。」"],["s","幸好這個老是慢慢地來的，通常一個人四十以後漸漸開始就來了，來了。到七十、到八十，這幾十年當中，如果這個老的形象，幾十年當中一口氣來的話，沒有一個人能受得了，沒有一個人能受得了，這是千真萬確的。平常我們忽然間生了個病，你其實簡單得很咧，忽然間生了病倒在那個地方的話，唉呀！你這個痛苦之難受，就是這樣。我們往往生到那個病的話，想到簡直是不想活了，為什麼？他受不了嘛！所以假定這個老一口氣來的話，沒有一個人受得了。"]]},{"t":"69B 18:17","b":[["s","不想則已，有的時候，我現在已經有這個感覺，有的時候真是！千真萬確的，不管是你哪一方面，剛才前面所說的每一樣東西，我倒不大在乎我的頭髮白，也不在乎我的面孔上的皮膚像砧板一樣。可是的的確確坐下來的時候，叫我慢慢吞吞，我就坐在那裡「卡嗒！」就坐下來；站起來的就像拔樹一樣，站了個半天，實在好辛苦。然後呢跟你們講，有的時候是清楚明白得不得了的事情，咦？講到口邊就是那個名字就記不起來，想了個半天不曉得，想不起來。而且眼前的人喔，就這麼眼前的人，這是念力是衰退會到這種程度啊！你們無法想像的，會是這樣的一個嚴重法。"]]},{"t":"69B 19:12","b":[["s","所以它如果一口氣來的話，你真是沒有一個人能受得了，可是我們現在還居然安之若素，居然還說還是慢慢地來，怎麼能慢哪？現在只有唯一的年輕力壯的時候。所以我現在看見你們在座的一些年輕同修，居然躲在後面，猜猜反正輪不到我，偷懶哪，是最大的損失啊！反過來說，我看見那些年輕的同修，我真讚歎、真高興，我現在老了沒辦法了，我只有賺一點什麼？隨喜功德。"]]},{"t":"69B 19:46","b":[["s","所以我一早起來，欸！看見對面那個同修他真好，他的燈光總是 ……。我一早起來最大的歡喜，就是看見那個燈光。哎呀，讚歎啊！我說我雖然是老了，這個人還在修年輕啊！而我成就讚到年輕的功德。另外呢，另一個人在那兒，我在那裡已經起來了洗了個半天，他還在那邊拖囉沓拉在那個地方，鐘已經敲完了，敲鼓了，他還在那兒，還在剛剛洗臉。以前我心裡面總覺得這個人怎麼樣，現在我也學會了，唉！我覺得這個人真可惜啊！我可不要這樣啊，他可策勵我啊！欸，好啊！真好啊！我但願你們也能如此。所以你不要為人家而驚，不要為人家而生煩惱。總之，一方面對你自己增長，一方面珍惜你自己呀！處處地方要把前面告訴我們這個道理，你多思惟；你多思惟了，你就開始可以努力了。現在我們下面看苦："]]}],"口譯音":"口譯音檔/siwei-kudi-03/019.mp3"},{"文":"思惟病苦分五。\n身性變壞者，謂身肉銷瘦，皮膚乾枯等。","口譯":"思惟病苦，分為五種。一、身性變壞：就是身肉消瘦、皮膚乾枯等。","四家合註":null,"時":"69B 20:52","頁":160,"af":"69b","st":1252,"et":1274,"消文":[{"文":"病苦大家容易體會得到，唸一下，自己去體會。"}],"延伸":[],"逐字稿":[{"t":"69B 20:52","b":[["q","思惟病苦分五。"],["s","苦也分五個，把它唸一下。我想這個苦大家都容易體會得到，所以唸一下你們自己去體會它。第一個："]]},{"t":"69B 21:05","b":[["q","身性變壞者，謂身肉銷瘦，皮膚乾枯等。增長憂苦多住憂苦者，"],["s","這第二個："]]}],"口譯音":"口譯音檔/siwei-kudi-03/020.mp3"},{"文":"增長憂苦多住憂苦者，謂身中水等諸界，分不平均增減錯亂，身生逼惱，心起憂痛而度晝夜。","口譯":"二、增長憂苦、多住憂苦：就是身中水等諸界（四大）的比例不平均、增減錯亂，身體生起逼惱，心中生起憂痛，這樣度過日夜。","四家合註":null,"時":"69B 21:14","頁":160,"af":"69b","st":1274,"et":1285,"消文":[{"文":"「這是第二個」：師父只唸過，沒有另外解。"}],"延伸":[],"逐字稿":[{"t":"69B 21:14","b":[["q","謂身中水等諸界，分不平均增減錯亂，身生逼惱，心起憂痛而度晝夜。"],["s","這是第二個。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/021.mp3"},{"文":"不能受用悅意境界者，謂若有云，諸可意境於病有損，雖欲享受而不自在，如是諸威儀道，亦多不能隨欲。","口譯":"三、不能受用悅意境界：就是如果有人說，這些合意的境界對病有害，雖然想享受也不能自在；種種威儀（行住坐臥）也大多不能隨心所欲。","四家合註":null,"時":"69B 21:25","頁":160,"af":"69b","st":1285,"et":1292,"消文":[{"文":"平常眼睛看、吃、玩都可以，那時候都不行了。"}],"延伸":[],"逐字稿":[{"t":"69B 21:25","b":[["q","不能受用悅意境界者，"],["s","平常的時候，你要眼睛也好，吃也好、玩也好，那個時候都不行了。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/022.mp3"},{"文":"諸非可意境界受用，雖非所欲須強受用者，謂諸非悅飲食藥等，須強飲用。如是火炙及刀割等諸粗苦事，皆須習近。","口譯":"四、對不合意的境界，雖然不想要也必須勉強受用：就是不喜歡的飲食、藥物等，必須勉強吃下。像火炙、刀割等種種粗重痛苦的事，都必須去接受。","四家合註":null,"時":"69B 21:32","頁":160,"af":"69b","st":1292,"et":1330,"消文":[{"文":"前面是說你歡喜的，對不起，不行；你不歡喜的，偏偏要。"}],"延伸":[],"逐字稿":[{"t":"69B 21:32","b":[["q","謂若有云，諸可意境於病有損，雖欲享受而不自在，如是諸威儀道，亦多不能隨欲。諸非可意境界受用，雖非所欲須強受用者，謂諸非悅飲食藥等，須強飲用。如是火炙及刀割等諸粗苦事，皆須習近。"],["s","前面是說你歡喜的，對不起，不行。你不歡喜的偏偏要，就這樣。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/023.mp3"},{"文":"速離命根者，謂見病難治，便生痛苦，當於此等審細思惟。","口譯":"五、速離命根：就是看到病難以治好，便生起痛苦。應當對這些仔細思惟。","四家合註":null,"時":"69B 22:10","頁":160,"af":"69b","st":1330,"et":1342,"消文":[{"文":"「同樣的」：師父只唸過，沒有另外解。"}],"延伸":[],"逐字稿":[{"t":"69B 22:10","b":[["q","速離命根者，謂見病難治，便生痛苦，當於此等審細思惟。"],["s","同樣的。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/024.mp3"},{"文":"《廣大遊戲經》云：「多百種病及病苦，如人逐鹿逼眾生，當觀老病壞眾生，惟願速說苦出離。","口譯":"《廣大遊戲經》說：「數百種病和病苦，就像獵人追鹿般逼迫眾生。當看到老與病毀壞眾生，唯願您快說出離苦的方法。","四家合註":null,"時":"69B 22:22","頁":160,"af":"69b","st":1342,"et":1369,"消文":[{"文":"就像打獵的人趕鹿，病來害我們也是這樣。"},{"文":"趕快從佛告訴我們的這個苦，想辦法跳出來。"}],"延伸":[],"逐字稿":[{"t":"69B 22:22","b":[["q","《廣大遊戲經》云：「多百種病及病苦，如人逐鹿逼眾生，"],["s","就像人，打獵的人趕那個鹿一樣，這個病，這個病來害我們也是這個。"]]},{"t":"69B 22:37","b":[["q","當觀老病壞眾生，惟願速說苦出離。"],["s","趕快啊！要從佛那個地方，告訴我們這個苦，從這個地方想辦法跳出來啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-03/025.mp3"},{"文":"譬如冬季大風雪，草木林藥奪光榮，如是病奪眾生榮，衰損諸根及色力。令盡財穀及大藏，病常輕蔑諸眾生，作諸損惱瞋諸愛，周遍炎熱如空日。」","口譯":"就像冬天的大風雪，奪去草木、樹林、藥草的光彩，病也同樣奪去眾生的光彩，衰損諸根與色力。它令財物、穀糧以及大寶藏耗盡，病常常輕蔑眾生，造成種種損惱、讓所愛的人也生瞋，就像空中的烈日，周遍炎熱。」","四家合註":null,"時":"69B 22:49","頁":160,"af":"69b","st":1369,"et":1425,"消文":[{"文":"文字不必解釋，自己仔細觀察；這些自己都體會得到。"},{"文":"體會得到的就體會；體會不到的，信得過佛，努力去思惟、觀察。"},{"文":"目前最切要的一件事，就是把這個概念提起來。"}],"延伸":[],"逐字稿":[{"t":"69B 22:49","b":[["q","譬如冬季大風雪，草木林藥奪光榮，如是病奪眾生榮，衰損諸根及色力。"],["s","一樣啊！"]]},{"t":"69B 23:03","b":[["q","令盡財穀及大藏，病常輕蔑諸眾生，作諸損惱瞋諸愛，周遍炎熱如空日。」"],["s","這個文字也不必解釋，這個文字自己仔細地觀察，反正像這種東西自己都體會得到的，很容易。體會得到的，體會；體會不到的，信得過佛，努力去思惟、觀察。現在目前這個時候最切要的一件事情，我們一定要把這個概念提起來。最後，生、老、病、死當中，「死」："]]}],"口譯音":"口譯音檔/siwei-kudi-03/026.mp3"},{"文":"思惟死苦分五。謂捨離圓滿可愛財位，捨離圓滿可愛親族，捨離圓滿可愛朋翼，捨離圓滿可愛身體，死時當受猛利憂苦，«乃至意未厭此諸苦»，當數思惟。","口譯":"思惟死苦，分為五種：就是捨離圓滿可愛的財位、捨離圓滿可愛的親族、捨離圓滿可愛的朋友、捨離圓滿可愛的身體，以及死時要承受猛利的憂苦。在內心還沒有厭離這些苦之前，應當一再思惟。","四家合註":null,"時":"69B 23:45","頁":160,"af":"69b","st":1425,"et":1475,"消文":[{"文":"死苦分五：捨離財位、親族、朋翼、身體，以及死時的猛利憂苦。"}],"延伸":[{"題":"乃至意未厭此諸苦","組":[{"題":"未厭之前數數思惟","說":[{"類":"立","文":"心念對這個真相不認識，因為不認識而不厭離，乃至於貪著。"},{"類":"下手","文":"在這種狀態要不斷地思惟；現在不忙別的，真正要忙的是這個。"}]},{"題":"不把佛法當學問","說":[{"類":"破","文":"在這裡求學問，不要把它看成學問看，它的目的在這裡。"},{"類":"立","文":"能在這個上面用功，那就是你的大學問。"},{"類":"破","文":"否則認識得再多，也沒有用。"}]}],"說":[{"類":"立","文":"心念對這個真相不認識，因為不認識而不厭離，乃至於貪著。"},{"類":"下手","文":"在這種狀態要不斷地思惟；現在不忙別的，真正要忙的是這個。"},{"類":"破","文":"在這裡求學問，不要把它看成學問看，它的目的在這裡。"},{"類":"立","文":"能在這個上面用功，那就是你的大學問。"},{"類":"破","文":"否則認識得再多，也沒有用。"}],"af":"69b","st":1425}],"逐字稿":[{"t":"69B 23:45","b":[["q","思惟死苦分五。謂捨離圓滿可愛財位，捨離圓滿可愛親族，捨離圓滿可愛朋翼，捨離圓滿可愛身體，死時當受猛利憂苦，乃至意未厭此諸苦，當數思惟。"],["s","只要我們的心念當中，對前面這個真相不認識，因為不認識而不厭離，乃至於貪著。在這種狀態，要不斷地思惟，現在我們不忙別的，真正要忙的是要忙這個啊，這個要注意啊！我們現在這裡要求學問，不要把它看成學問看，它是目的在這裡。你能夠在這個上面，那就是你的大學問，否則你認識得再多是沒有用啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-03/027.mp3"},{"文":"前四為苦之理者，謂見當離此四圓滿而發憂苦。","口譯":"前四種之所以是苦，是因為看到將要離開這四種圓滿而生起憂苦。","四家合註":null,"時":"69B 24:35","頁":160,"af":"69b","st":1475,"et":1485,"消文":[{"文":"就是財位、親屬等等。"}],"延伸":[],"逐字稿":[{"t":"69B 24:35","b":[["q","前四為苦之理者，謂見當離此四圓滿而發憂苦。"],["s","這個就是說財位、親屬等等。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/028.mp3"},{"文":"《廣大遊戲經》亦云：「若死若沒死沒時，永離親愛諸眾生，不還非可重會遇，如樹落葉同逝水。死令王者無自在，死劫猶如水漂木，獨去無伴無二人，自業具果無自在。","口譯":"《廣大遊戲經》也說：「死亡、沒落的時候，永遠離開所親愛的眾生，一去不回、不能再相會，就像樹上的落葉、流逝的河水。死使國王也不得自在，死把人劫走就像水漂走木頭，獨自離去、沒有伴侶、沒有第二個人，只有自己的業帶著果報，不得自在。","四家合註":null,"時":"69B 24:45","頁":160,"af":"69b","st":1485,"et":1512,"消文":[{"文":"這是自己的業力所感得的，沒有辦法可想。"}],"延伸":[],"逐字稿":[{"t":"69B 24:45","b":[["q","《廣大遊戲經》亦云：「若死若沒死沒時，永離親愛諸眾生，不還非可重會遇，如樹落葉同逝水。死令王者無自在，死劫猶如水漂木，獨去無伴無二人，自業具果無自在。"],["s","這個是自己的業力所感得的，你沒有辦法可想的。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/029.mp3"},{"文":"死擒多百諸含靈，如海鯨吞諸眾生，猶龍金翅象遇獅，同草木聚遭猛火。」","口譯":"死亡擒住成百的有情，就像海中大鯨吞食眾生，像龍遇到金翅鳥、象遇到獅子，像草木堆遇到猛火。」","四家合註":null,"時":"69B 25:12","頁":160,"af":"69b","st":1512,"et":1612,"消文":[{"文":"死來的時候，不管在任何狀態當中，就這麼一條路。"},{"文":"八苦已講了生、老、病、死，每一個分五個項目；多去思惟、觀察，會產生強烈的感受：人生無非都是痛苦。"},{"文":"下面另外四苦，是眼前處處感受得到的；最後一個（五取蘊苦）才是根本、最重要的。"}],"延伸":[],"逐字稿":[{"t":"69B 25:12","b":[["q","死擒多百諸含靈，如海鯨吞諸眾生，猶龍金翅象遇獅，同草木聚遭猛火。」"],["s","這個死來的時候，就是這樣的一個狀態，不管在任何狀態當中，一旦死來了，好，就這麼一條路，就這麼一條路。這個是生老病死，這個四樣，今天這個地方說一下。"]]},{"t":"69B 25:43","b":[["s","請翻到《菩提道次第廣論》一六一，一百六十一頁。那個八苦已經講了生、老、病、死，每一個裡邊分五個項目，每一個裡邊分五個項目。這個是多去思惟、觀察，那麼那個時候，會產生強烈的一種感受，說人生無非都是痛苦。那麼下面另外四個，那就是眼前我們處處地方，感受這個三種，最後一個實際上呢，這就是根本，最重要的。現在一個一個地我們討論下去，看文："]]}],"口譯音":"口譯音檔/siwei-kudi-03/030.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-03/001.webp","n":1},{"img":"投影片/siwei-kudi-03/002.webp","n":2},{"img":"投影片/siwei-kudi-03/003.webp","n":3},{"img":"投影片/siwei-kudi-03/004.webp","n":4},{"img":"投影片/siwei-kudi-03/005.webp","n":5},{"img":"投影片/siwei-kudi-03/006.webp","n":6},{"img":"投影片/siwei-kudi-03/007.webp","n":7},{"img":"投影片/siwei-kudi-03/008.webp","n":8},{"img":"投影片/siwei-kudi-03/009.webp","n":9},{"img":"投影片/siwei-kudi-03/010.webp","n":10},{"img":"投影片/siwei-kudi-03/011.webp","n":11},{"img":"投影片/siwei-kudi-03/012.webp","n":12},{ // ───────── 播放（本機音檔優先，沒有才連線上 mp3；不開別的網頁） ─────────

// 連續播放：接著播下一段，畫面跟著選到那一段

const LOOP_GAP=5;

}
function cancelLoopWait(){if(P.waiting){P.waiting=false;clearTimeout(P.waitT)}}
function playPrevSeg(){
  const L=S.lesson;if(P.lid!==L.id||P.seg==null||P.seg<=0)return false;
  const i=P.seg-1,s=L.段[i];P.seg=i;P.switching=true;setTimeout(()=>P.switching=false,800);

function mediaMeta(title,album){

  try{navigator.mediaSession.metadata=new MediaMetadata({...base,artwork:[{src:new URL("icons/icon-192.png",location.href).href,sizes:"192x192",type:"image/png"},{src:new URL("icons/icon-512.png",location.href).href,sizes:"512x512",type:"image/png"}]})}
  catch(e){try{navigator.mediaSession.metadata=new MediaMetadata(base)}catch(_){}}   // 單機開檔時圖示網址不合法，就不帶圖
}
// 鎖定畫面的按鈕要控制「正在播的那一個」：師父音檔或口譯朗讀

  const ms=navigator.mediaSession,act=()=>{const k=$("#kyaud");return k&&!k.paused||(k&&K.playing)?"ky":"main"};
  const h=(name,fn)=>{try{ms.setActionHandler(name,fn)}catch(e){}};
  h("play",()=>{(act()==="ky"?$("#kyaud"):$("#aud")).play().catch(()=>{})});
  h("pause",()=>{$("#aud").pause();const k=$("#kyaud");if(k)k.pause()});
  h("nexttrack",()=>{if(act()==="ky")kyNext();else playNextSeg()});

}
function playNextSeg(){

  const i=P.seg+1;if(i>=L.段.length){toast("這堂課的音檔播完了");return false}
  const s=L.段[i];P.seg=i;P.switching=true;setTimeout(()=>P.switching=false,800);
  selectSeg(i);if(isMobile()&&$("#main").dataset.m==="outline")$("#oc"+i)?.scrollIntoView({behavior:"smooth",block:"start"});

function bindPlayer(){
