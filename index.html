"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第三、<\/span><span>異熟因，<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">分為八種；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">分為三種。初中<\/span><span>分八：初者：<\/span>謂於有情不加傷害，及正依止不<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-ba\">由加行門而<\/span>害意樂。","合註白話":{"id":"17395","頁":480,"白話":"第三科、異熟的因，分為二科：一、分為八項；二、以三種區分。第一科分為八項：第一項：不損害有情，以及依止不藉由行為損害的心念。另外又說道：「妥善釋放即將被殺害的眾生，同樣也去利益生命，並且停止傷害生靈，由此就會獲得長壽。服侍病患，以及提供醫生、藥物，不以土塊、棍棒等傷害有情，藉此就能沒有疾病。」第二項：布施油燈等光明及新衣。又說道：「藉由不生氣以及施予飾品，能感得形貌端好；說不嫉妒的果報，是會擁有善緣。」這是由於今生對他人的任何正法及世間的圓滿都不生嫉妒，而且修持歡喜，因此在後世時，其他所有人無論受享任何正法及世間的受用，都會說：「不能少了他。」所有受用都會獲得一份，這就是善緣。第三項：消滅我慢而對於上師等行禮拜等，以及像僕人一般恭敬他人。第四項：施捨衣食給乞討衣物、飲食等的人，或者雖然不來乞討，也提供幫助；以及施捨給缺乏資財的受苦者與功德田。第五項：串習斷捨四種不善的言語。第六項：發願自己未來能成就各種功德，並且實踐其因——供養三寶、供養父母、聲聞、緣覺、親教師、軌範師與上師。第七項：喜好男性的功德，不喜歡女性的身軀，視之為過失；對於貪求女性身體者，止息他們的貪求；使男根將要被截斷者得以免難。第八項：上師說：《如來祕密經》提到在佛塔上粉刷白灰是有力之因，這只是一例，一切有關於佛陀的各種供養也都是如此。其他人根本無法做到的，就由自己來做；對於與自己合作才能做到的，則予以幫助；以及提供飲食。要滋養衰弱的身體，有透過內心踴躍歡喜、使之發起踴躍歡喜，以及藉由飲食而做到的。","注釋":["異熟因：即前頁460「異熟因緣」一科。","又云：引文出自《七功德譚》。《七功德譚》，書翰部論典，共19偈，世親菩薩著，尚無漢譯。此書以極優美的頌文，總攝經典當中教導有情獲取長壽、無病、形好、自在、高貴、財富、智慧七種善趣功德的正確方法。引文見《丹珠爾》對勘本冊96，頁457。","磈杖：指土塊和木棍等。磈，音若「魁」，上聲，本指險怪的山石，此處通「塊」，指土塊。","鮮淨衣物：藏文直譯為新衣。","又云：引文出自《七功德譚》。見《丹珠爾》對勘本冊96，頁458。","妙同分：一般多譯作善緣。","成辦：法尊法師原譯作「攝持」，係依玄奘大師譯《瑜伽師地論》文譯出，今據藏文改譯。","《如來祕密經》中說：《如來祕密經》，寶積部經典，全名《佛說如來不思議祕密大乘經》，共10卷，25品。漢譯本有西晉竺法護譯《大寶積經·密迹金剛力士會》7卷；宋法護譯《佛說如來不思議祕密大乘經》20卷，共二種。此經因緣為寂慧菩薩祈請金剛手菩薩為大眾宣說如來祕密之法，金剛手菩薩起初默然而住，後經世尊教敕而開示了菩薩身語意三密的內容。相應段落參見西晉竺法護譯《大寶積經·密迹金剛力士會》云：「菩薩有十大法，逮如是象無極大力。何謂為十？一曰寧棄身命勤受正法；二曰未曾自大謙恪下意禮敬眾生；三曰見於剛強難化眾生立之忍辱；四曰見飢饉人以好美饍而充施之；五曰覩諸恐懼勸慰安之；六曰若有眾生得於重疾療以良藥；七曰若有羸劣人所輕慢，敬念戀之令無忽易者；八曰以淨泥水塗如來廟補其虧缺；九曰見孤苦人貧匱困厄常負重檐，使去其難極重之殃；十曰若有無護無所歸依常將濟之，所語如言而不變失。是為十事法。」宋法護譯《佛說如來不思議祕密大乘經·阿闍世王問答品》云：「菩薩若修十法，獲斯勝力。何等為十？一者、菩薩寧捨身命，終不棄捨無上正法；二者、於一切眾生作謙下想，不增慢心；三者、於彼劣弱眾生起愍念心，不生損害；四者、見饑渴眾生施妙飲食；五者、見怖畏眾生施其無畏；六者、見疾病眾生施藥救療；七者、見貧乏眾生惠令滿足；八者、見佛塔廟形像塗飾圓淨；九者、出歡喜言安慰眾生；十者、見彼負重疲困苦惱眾生為除重擔。菩薩若具如是十法，即能獲得如是最勝之力。」見《大正藏》冊11，頁76、312；《甘珠爾》對勘本冊39，頁511。"],"已校":true},"覺燈日光":null,"時":"60A 07:35","頁":141,"af":"60a","st":455,"et":463,"消文":[{"文":"這是第一個。"}],"延伸":[{"題":"不害意樂","組":[{"題":"懂了道理要淨化自心","說":[{"類":"破","文":"學佛的人懂得了很多道理以後，不拿這個道理來淨化自己的心識。"},{"類":"立","文":"見煩惱特別強的人好歡喜跟人家講道理，總歸他有道理；思煩惱特別強的人貪瞋癡重，碰見境界習性很重。"}]},{"題":"意樂是根本","說":[{"類":"立","文":"這個地方特別講的意樂，這一點很重要；佛法真正重要的，在這一個上面要注意。"},{"類":"回扣","文":"這是根本的，也可以說是消極的一面：不傷害。"}]}],"說":[{"類":"破","文":"學佛的人懂得了很多道理以後，不拿這個道理來淨化自己的心識。"},{"類":"立","文":"見煩惱特別強的人好歡喜跟人家講道理，總歸他有道理；思煩惱特別強的人貪瞋癡重，碰見境界習性很重。"},{"類":"立","文":"這個地方特別講的意樂，這一點很重要；佛法真正重要的，在這一個上面要注意。"},{"類":"回扣","文":"這是根本的，也可以說是消極的一面：不傷害。"}],"af":"60a","st":534}],"逐字稿":[{"t":"60A 07:35","b":[["q","謂於有情，不加傷害，及正依止不害意樂。"],["s","這是第一個。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/001.mp3"},{"文":"又云：「善放將殺生，如是利其命，遮止害眾生，則當得長壽。承事諸病人，«善施諸醫藥»，不以磈杖等，害眾生無病。」","口譯":"又說：「善於放生，救護將被殺的眾生，這樣利益牠們的生命，遮止傷害眾生，就能得到長壽。承事照顧種種病人，好好地布施醫藥，不用土塊、棍杖等傷害眾生，就能沒有疾病。」","四家合註":"又云：「善放將殺生，如是利其命，遮止害眾生，則當得長壽。承事諸病人，善施諸醫藥，不以磈杖等，害眾生無病。」","合註白話":{"same":0},"覺燈日光":null,"時":"60A 07:43","頁":141,"af":"60a","st":463,"et":1099,"消文":[{"文":"分兩方面：一個是應該遮止的，不傷害眾生；第二個是應該努力的。"},{"文":"傷害不僅僅是殺；不損惱別人這個意樂很難做到，往往不知不覺只想到自己就傷害了別人，處處要推己及人。"},{"文":"「善放將殺生」更進一步，有人將要被殺要去救他，利益他的命，還要遮止害眾生，這樣得長壽。"},{"類":"回扣","文":"「承事諸病人」：佛在世時說「看病福田，第一福田」，《梵網經》也講，戒律上也告訴我們。"},{"文":"「不以磈杖等，害眾生無病」：處處這樣幫助別人，不但壽長而且少病少惱。"}],"延伸":[{"題":"善施諸醫藥","組":[{"題":"醫藥兼治身病心病","說":[{"類":"立","文":"醫藥分兩方面，生理的、心理的；真正好的醫生不單看你的身病，還要看心病。"},{"類":"例","文":"美國的家庭醫生先跟你談談天再開藥，往往開的只是維他命、阿斯匹靈，吃下去感冒就好了。"},{"類":"例","文":"師父朝山時感冒，藥劑師給「一大兩小」，睡一覺就好；後來才知道是維他命B、C，平常吃卻不好。"},{"類":"立","文":"佛法真正講的身心是分不開的。"}]},{"題":"心力強盛能轉身","說":[{"類":"破","文":"世間哲學講心物二元、完全對立，實際上是互相影響的，中心在那個心念。"},{"類":"例","文":"一位德國大科學家當眾喝下一杯霍亂菌，一點事情都沒有，因為心力強盛。"},{"類":"例","文":"催眠用在無痛生產；頭痛時被一件事吸引，精神貫注就忘了痛，忙完又痛起來，這經驗人人有。"}]},{"題":"莫為世間無明所騙","說":[{"類":"破","文":"學佛的人說「我是學醫的」，完全忽視這個，不知道在學什麼佛。"},{"類":"立","文":"你能幫助人家身病，你身少病；能幫助人家心理健全，你心力堅強，如此因、如此果，一點都不錯。"}]}],"說":[{"類":"立","文":"醫藥分兩方面，生理的、心理的；真正好的醫生不單看你的身病，還要看心病。"},{"類":"例","文":"美國的家庭醫生先跟你談談天再開藥，往往開的只是維他命、阿斯匹靈，吃下去感冒就好了。"},{"類":"例","文":"師父朝山時感冒，藥劑師給「一大兩小」，睡一覺就好；後來才知道是維他命B、C，平常吃卻不好。"},{"類":"立","文":"佛法真正講的身心是分不開的。"},{"類":"破","文":"世間哲學講心物二元、完全對立，實際上是互相影響的，中心在那個心念。"},{"類":"例","文":"一位德國大科學家當眾喝下一杯霍亂菌，一點事情都沒有，因為心力強盛。"},{"類":"例","文":"催眠用在無痛生產；頭痛時被一件事吸引，精神貫注就忘了痛，忙完又痛起來，這經驗人人有。"},{"類":"破","文":"學佛的人說「我是學醫的」，完全忽視這個，不知道在學什麼佛。"},{"類":"立","文":"你能幫助人家身病，你身少病；能幫助人家心理健全，你心力堅強，如此因、如此果，一點都不錯。"}],"af":"60a","st":643}],"逐字稿":[{"t":"60A 07:43","b":[["q","又云：「善放將殺生，如是利其命，遮止害眾生，則當得長壽。承事諸病人，善施諸醫藥，不以磈杖等，害眾生無病。」"],["s","分兩方面，一個是應該遮止的，第二個是應該努力的。應該遮止的 ─不傷害眾生。不傷害眾生最主要的什麼？就是內心當中「不害意樂」，心裡面不要傷害別人。這個傷害不僅僅是殺哦，就是我們在很多情況之下，儘管我們現在說不殺了，但是不損惱別人這個意樂，這個很難做到，這個很難做到。而且這個不損惱別人，往往是不知不覺當中，不知不覺當中，你倒不一定是有意損惱別人，你只是為了只想到自己傷害了別人。所以說，我們如果從根本上面去要想了解的話，處處地方要推己及人，要推己及人。"]]},{"t":"60A 08:54","b":[["s","現在有很多人，這個世間的人我們不談，本來世間的量則是只求自己的利益，這個我們先不去談它。我們現在修學佛法的人，懂得了很多道理以後，他不拿這個道理來淨化他自己的心識，說：哎呀！我這個人見煩惱特別強，或者思煩惱特別強。見煩惱特別強的人，他好歡喜跟人家講道理的，喔唷，他總歸他有道理，他不曉得他是見煩惱；思煩惱特別強的人，貪瞋癡特別重，他道理他倒不一定是講，但是碰見這種情況，這個習性很重。所以這個地方特別講的這個意樂，這一點很重要。我們了解的佛法，真正重要的，在這一個上面要注意！那麼這個是也可以說根本的，也可以說消極的，也可以說「自挺自足」（編者按：此四字尚待指正）。"]]},{"t":"60A 09:54","b":[["s","下面呢，「善放將殺生」，更進一步，有很多人將要被殺，我們要去救他，然後呢利益他的命，還要「遮止害眾生」，這樣的話得到長壽，這個是對於一般的有情。對於我們共同的眾同分當中，人道當中呢，「承事諸病人」，對病人要承事。所以佛在世的時候特別說「看病福田，第一福田」，然後呢《梵網經》上面還在講。佛在世的時候，就有這個典型的公案，典型的公案。這是為什麼我在這個地方特別常常提醒大家的，戒律上面也告訴我們，戒律上也告訴我們。"]]},{"t":"60A 10:43","b":[["s","那麼還有呢「善施諸醫藥」，好好地把那個醫藥給人家。這個醫藥分兩方面，生理的、心理的。真正好的醫生，他不單單是看你的身病哦，還要看心病，還要看心病。所以，現在的西方很有意思，西方目前那個專科醫師很多，大家都說專科。可是現在有一個諍論，有很多全科醫生，他樣樣來。要我們想像當中，這個全科醫生不行欸！咦，全科醫生有它很大的道理在，因為很多人的病，他這個除了身病以外，他心病很重要，心病很重要！尤其是美國，它這個盛行那個保險制度，那個保險制度那個醫生，常常叫「家庭醫生」，就是這樣，家庭醫生。也就是換句話說，你一家……你的病人，你看了病反正找他，他從小就曉得你，你這個人怎麼樣的，這樣。"]]},{"t":"60A 11:49","b":[["s","那因為我在那兒住了一些時候，去看的時候，他往往先跟你隨便談談天哪什麼，然後給你開點藥。以後我才曉得，往往開那個藥，跟你那個病了不相干，就是這樣。哎喲！你覺得心裡很苦惱或者什麼樣，他然後給你。原來這個裡面什麼東西？維他命幾粒，什麼阿斯匹靈幾粒。現在阿斯匹靈曉得不能吃了，不開了，欸，你吃下去有一點效果的，等一下，好，感冒就好了。"]]},{"t":"60A 12:18","b":[["s","那我自己還親身遇見過這樣一件事情，有一次我感冒，感冒了以後，有一個，正好我們出去，一起去到一個地方去朝山，朝山的同行當中有一個，這個是藥劑師，他隨身帶著。他就講，什麼？這個怎麼唸的，我忘記掉了，什麼「一大兩小，多吃開水，多睡覺。」下面幾句話，就是這樣，那個治感冒是百發百中的藥。那時我感冒得啊，哎呀，那天鼻涕什麼流，這樣，他就給我吃，吃幾個。然後他們那天出去去了，我就沒去，我在那裡吃完了以後，然後睡了一覺蒙頭，果然沒錯，到了晚上就好了。哎呀，我說我以前感冒從來沒有這麼快好過，很相信。以後等到完了以後，回來到了那個地方，有一次偶然談，他說「一大兩小」是什麼東西呀？小的是維他命Ｂ，大的是維他命Ｃ，我聽了大為驚訝！什麼？我說我天天吃這個東西，但是平常吃這個東西，感冒就是不好。他那一天就告訴你呀，然後你心裡面想。的的確確是這樣，千真萬確，千真萬確！所以現在很多學佛的人，居然心理上面說這個 ……我們要曉得，佛法真正講的身心是分不開的，身心是分不開的。"]]},{"t":"60A 13:42","b":[["s","我說到這裡，我還給你講一個，這是一個非常有名的實驗。實驗的這個人，一個德國的大科學家，在戰前 ……現在我們動不動講美國，我們曉得戰前最好的是歐洲，德國尤其是厲害，是一個德國人。那麼他接受了這個東方文化以後，他覺得，曉得那個心理的重要。實際上佛法講的身心是分不開的，現在我們這個世間上的這個哲學往往講心物好像二元，不是，這個不是！不過西方人，很多人總覺得這兩樣東西完全對立的，實際上不是，這是互相影響的。那麼這個主要的中心在什麼地方呢？主要的中心就是那個心念。我們往往那個心念，由於這個等流的心識，你看見了對象以後，已經跟著外境轉，引發那個種子，到那個時候它現起來。將來講到業的時候，它每一個地方會分得很仔細。"]]},{"t":"60A 14:48","b":[["s","那麼這個醫生，他了解這個情況以後，所以，他自己用他的那套方法，當然採用東方人「定」的心情。他那個意志力非常強，那麼有一次，那個實驗還在上海做的，吃那個虎列拉菌。虎列拉菌是什麼？霍亂、吐瀉，這個你們曉得的，非常厲害啊！隨便碰到一點點你吃下去，是馬上出毛病。他經過人家的實驗室裡邊培養出來的，吃一杯！啊，那個一杯可以殺死百萬個人，大家分開來吃，吃下去的話非死不可，他就當眾表演喝下去，一點事情都沒有。表演了兩次，第二次還拉了一次肚子。人家問他：「你為什麼拉了一次肚子？」他自己也說明，他自己 ……你真正的心力強盛，他很了解這件事情。我們現在好像聽起來這個很神奇吧！我完全講科學給你們聽，不要講佛法。"]]},{"t":"60A 15:46","b":[["s","現在的科學上面催眠術，你們大家了解的，對不對？聽說過沒有？這個催眠尤其特別用在生小孩子，它生小孩的時候，有一種叫無痛的這個生產的方法。它就是事先他用催眠，使得這個產婦，精神跟隨著這個催眠師集中在一個地方去，她的心志完全跑到那個地方去了。然後呢那個地方暗示她，放鬆了身體，欸，一點都不痛。可惜的是我們都沒有這個經驗，我們也不可能有這個經驗。但是除了這個以外它用在其他的地方，已經產生了各式各樣的神奇不可思議的功效。所以我們可以說日常生活當中隨時可以檢查得到的，譬如說我們自己有的時候，你碰見什麼一點小小的頭痛或者什麼，在那兒很難受。欸，忽然之間有一樣東西，非常有力地吸引你，你全部精神貫注在那裡，等到你貫注在那裡，等一下你忘記掉了。忙完了半天，一回來的時候，唉呀，又塌掉了。我想這個經驗我們人人有吧！說明什麼，說明什麼？就是這個。"]]},{"t":"60A 17:05","b":[["s","所以大家注意哦！大家注意哦！不要我們為這個世間這種無明所騙，世間的人那沒辦法，現在學佛的人哪，居然有人告訴我：「我是學醫的！」他完全忽視掉這個，我也只好不談，然後你有理，你還有沒有道理？你有，說完了讓他走路。這種人學佛啊，我覺得真可憐，他不知道在學什麼佛！所以我這個地方談到這裡，隨便一提，隨便一提，這一點是我們務必要知道的。所以這個地方叫「善施諸醫藥」，你是這樣的。還有呢，「不以磈杖等，害眾生無病」，你能夠處處地方這樣地幫助別人的話，那麼那個時候，你就可以得到這個，不但壽長而且少病少惱。如果說你能夠幫助人家身病，你身少病；你能夠幫助人家心理健全，你心力堅強，如此因、如此果，就一點都不錯。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/002.mp3"},{"文":"第二者謂能惠施燈等光明，鮮淨衣物，又云：「由依止無瞋，«施莊嚴妙色»，說無嫉妬果，當感妙同分。」","口譯":"第二種（感得形色圓滿的因）是：能布施燈等光明，以及鮮明潔淨的衣物。又說：「由於依止無瞋，布施莊嚴美妙的色相，（佛）說無嫉妒的果報，能感得美好的眾同分。」","四家合註":"<span>第二者：<\/span>謂能惠施燈等光明、鮮淨衣物。又云：「由依止無瞋，施莊嚴<span>感<\/span>妙色，說無嫉妬果，當感妙同分。」<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-yu\">此生於他任何正法、世間圓滿，皆不嫉妒，修習歡喜，則後世時，餘一切人任凡受何正法、世間受用，皆謂「不可無彼」。遂得一切應得之分，是即妙同分。<\/span>","合註白話":{"same":0},"覺燈日光":null,"時":"60A 18:19","頁":141,"af":"60a","st":1099,"et":1322,"消文":[{"文":"第二是形色、顯色圓滿。「惠施燈明」，光明樣樣都照出來，不但供佛，暗的地方也處處這樣。"},{"文":"鮮淨的衣服、好的東西，就是形、顯二色。"},{"文":"瞋是內心當中最惡劣的東西，所以要依止無瞋。"}],"延伸":[{"題":"施莊嚴妙色","組":[{"題":"打掃常住，隨喜同得功德","說":[{"類":"例","文":"師父休息時看見一位身體向來不好的同修，休息時間拿掃帚在掃地，真讚歎。"},{"類":"立","文":"他得到功德是他的，我在那兒隨喜，我也得到功德。"},{"類":"回扣","文":"真正懂得如法修行，這個出家生活之美啊！"}]},{"題":"正知見下處處增長功德","說":[{"類":"立","文":"萬一他偷懶，我想：這個人真可憐、愚癡，我要好好努力將來幫助他，還是增長功德。"},{"類":"破","文":"不懂的話覺得「哼！這個傢伙算什麼」，他在長功德，你這一念非墮落不可。"},{"類":"破","文":"不反省自己不如還嫉妒人家，處處說不如意；只要問自己起心動念就明白了。"}]},{"題":"莫說雜務與修行無關","說":[{"類":"立","文":"把寺院弄得乾乾淨淨，人家一看「這個地方真好」，你就得到這個功德。"},{"類":"破","文":"常住派一點工作還畏畏縮縮，說「好像跟修行沒有關係」。"},{"類":"因","文":"已經登地的菩薩尚且要無量無邊的東西去供養，我們凡夫不聚一點資糧，修行修在哪裡？"}]}],"說":[{"類":"例","文":"師父休息時看見一位身體向來不好的同修，休息時間拿掃帚在掃地，真讚歎。"},{"類":"立","文":"他得到功德是他的，我在那兒隨喜，我也得到功德。"},{"類":"回扣","文":"真正懂得如法修行，這個出家生活之美啊！"},{"類":"立","文":"萬一他偷懶，我想：這個人真可憐、愚癡，我要好好努力將來幫助他，還是增長功德。"},{"類":"破","文":"不懂的話覺得「哼！這個傢伙算什麼」，他在長功德，你這一念非墮落不可。"},{"類":"破","文":"不反省自己不如還嫉妒人家，處處說不如意；只要問自己起心動念就明白了。"},{"類":"立","文":"把寺院弄得乾乾淨淨，人家一看「這個地方真好」，你就得到這個功德。"},{"類":"破","文":"常住派一點工作還畏畏縮縮，說「好像跟修行沒有關係」。"},{"類":"因","文":"已經登地的菩薩尚且要無量無邊的東西去供養，我們凡夫不聚一點資糧，修行修在哪裡？"}],"af":"60a","st":1099}],"逐字稿":[{"t":"60A 18:19","b":[["q","第二者謂能惠施燈等光明，鮮淨衣物，又云：「由依止無瞋，施莊嚴妙色，說無嫉妬果，當感妙同分。」"],["s","第二是什麼？就是形色、顯色圓滿。為什麼呀？喏！「惠施燈明等」。這個光明，啊！樣樣都照出來了。所以不但是供佛，而且在暗的地方，你處處地方能夠這樣，這是一個。還有鮮淨的衣服，好的東西，那個就是形、顯二色。「又云：由依止無瞋」，這個瞋是內心當中的最惡劣的東西，所以這一點「施莊嚴妙色，及無嫉妬果」。這個莊嚴妙色你怎麼個布施法？莊嚴妙色怎麼布施法？外面的布施，譬如說我們現在在這個常住，我們把那個大殿固然打掃得清清楚楚，弄得樣樣好，地道的前面，處處地方。譬如我昨天來說，我正在那兒休息，我看見平常身體向來不好的一個同修，居然跑在那裡，休息的時間不休息，拿了一個掃帚在那裡掃地。哎呀！我看了真讚歎哪！後來我還在說，他固然是得到了功德，我還因為他而得到了功德；他得到的功德他的，我在那兒隨喜，我也得到功德。所以我覺得你們真正懂得了這個如法修行的話，這個出家生活之美啊！"]]},{"t":"60A 20:06","b":[["s","反過來，你說：「萬一這個人偷懶怎麼辦？」我還是可以得到功德。如果他偷懶，我覺得：「唉呀！這個人真可憐，不知道，愚癡啊！我要好好努力啊，我要將來幫助他。」我還是可以增長功德，對不對？這個很明白呀！所以你們要懂得，真正修學佛法最重要的正知見。反過來，你不懂的話，他那兒掃地，你會覺得：「哼！這個傢伙，他算什麼？他算他的勤勞啊？」對不起，他在那兒長功德，你這一念非墮落不可！這不是很簡單嗎？就算他做給你看，他做給他是他啊，你還是在那兒隨喜，這是我們要了解的。我們這個地方不能反省自己不如，還要嫉妒人家，這是我們為什麼在末法的時候這樣，還處處地方說這個不如意，那個不如意，說這個。你不要怪人家不如意，那你因地當中，你只要自己問你自己你起心動念，很明白、很清楚，就了解了這個道理，這樣。"]]},{"t":"60A 21:08","b":[["s","這個地方都是什麼？「施莊嚴妙色」，你能夠把那個寺院弄得乾乾淨淨，人家一看說：「啊！這個地方真好啊！」欸，對了，你就得到了這個功德，你就得到了這個功德。所以就有這樣大的好處啊！你不要說，等到還要常住派你一點工作，你還畏畏縮縮跑到那裡去，「嗨喲，這個事情又無關緊要的，好像跟修行沒有關係呀！」前面說得很清楚，已經登地的菩薩，尚且要無量無邊的東西去供養，現在我們個凡夫什麼都不要，你還不聚一點資糧，不聚一點功德，請問你修行修在哪裡呀？所以這個地方來告訴我們施莊嚴妙色，然後呢還要不要嫉妒，那個時候「感妙同分」，欸，你就得到了！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/003.mp3"},{"文":"第三者謂摧伏慢心，","口譯":"第三種（感得族姓圓滿的因）是：摧伏我慢之心，","四家合註":"<span>第三者：<\/span>謂摧伏慢心，","合註白話":{"same":0},"覺燈日光":null,"時":"60A 22:02","頁":141,"af":"60a","st":1322,"et":1355,"消文":[{"文":"這是「族姓」，出身為什麼高貴呢？他處處謙下尊重別人，所以一出生人家就尊重你。"},{"文":"現在處處自己覺得憍慢、瞧不起別人，到那時候也是這樣。"}],"延伸":[],"逐字稿":[{"t":"60A 22:02","b":[["q","第三者謂摧伏慢心，"],["s","還有這個是「族姓」，就換句話是出身，他為什麼出身就高貴呢？他處處地方謙下尊重別人。因為你謙下尊重別人，所以，你這個善因，你一出生人家就會尊重你。你現在處處地方自己覺得憍慢，瞧不起別人，對不起，你到那個時候也是這樣，你也是這個樣。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/004.mp3"},{"文":"於尊長等，勤禮拜等，«於他恭敬»，猶如僕使。","口譯":"對長輩等殷勤地禮拜，恭敬別人，就像僕人對待主人一樣。","四家合註":"於尊長等勤禮拜等，於他恭敬，猶如僕使。","合註白話":{"same":0},"覺燈日光":null,"時":"60A 22:35","頁":141,"af":"60a","st":1355,"et":1481,"消文":[{"文":"尊長是重福田：在家是自己的父母等，出家是三寶、師長、佛等等。"}],"延伸":[{"題":"於他恭敬","組":[{"題":"見此衣服即生恭敬","說":[{"類":"立","文":"乃至只要穿了這身衣服，不管他行持如何，這是三世清淨幢相，你恭敬總不錯。"},{"類":"因","文":"你恭敬，他不一定得到好處，可是你有幾分恭敬，就得到多少好處。"}]},{"題":"處處增長，煩惱找不到","說":[{"類":"立","文":"真正了解了，要找一點煩惱怎麼找也找不到，處處在增長功德，眼前心裡處處歡喜。"},{"類":"破","文":"很多人信了佛、乃至出了家還煩煩惱惱，真可憐。"},{"類":"下手","文":"趕快努力來學，學會了眼前固然快樂，將來生生增上。"}]},{"題":"病中種樂因，越想越開心","說":[{"類":"例","文":"師父說自己常常不大舒服，可是心裡越想越開心。"},{"類":"立","文":"以前的果報還它；現在種的因可是快樂的因，痛由它去。"},{"類":"回扣","文":"生病都開心，不生病更開心，道理都在這上頭，這是族姓。"}]}],"說":[{"類":"立","文":"乃至只要穿了這身衣服，不管他行持如何，這是三世清淨幢相，你恭敬總不錯。"},{"類":"因","文":"你恭敬，他不一定得到好處，可是你有幾分恭敬，就得到多少好處。"},{"類":"立","文":"真正了解了，要找一點煩惱怎麼找也找不到，處處在增長功德，眼前心裡處處歡喜。"},{"類":"破","文":"很多人信了佛、乃至出了家還煩煩惱惱，真可憐。"},{"類":"下手","文":"趕快努力來學，學會了眼前固然快樂，將來生生增上。"},{"類":"例","文":"師父說自己常常不大舒服，可是心裡越想越開心。"},{"類":"立","文":"以前的果報還它；現在種的因可是快樂的因，痛由它去。"},{"類":"回扣","文":"生病都開心，不生病更開心，道理都在這上頭，這是族姓。"}],"af":"60a","st":1355}],"逐字稿":[{"t":"60A 22:35","b":[["q","於尊長等，勤禮拜等，於他恭敬，猶如僕使。"],["s","對於尊長等等，是勤禮拜，於他恭敬，猶如僕使。要曉得這個尊長是重福田，重福田，在家是自己的父母等等，出家是三寶、師長、佛等等，乃至於他只要穿了這身衣服。所以我們注意哦！穿了這種衣服，一穿這種衣服，不管他自己裡邊的行持如何，你一看見這件衣服，哎喲！這個是三世清淨幢相，你對他恭敬總不錯，得到的好處，總是你的。你恭敬，他不一定得到好處欸，可是阿彌陀佛啊！你恭敬他，你有幾分恭敬，就得到多少好處啊！這個是我們要了解的。如果你真正了解了以後，我想我們心裡面，你要找一點煩惱，你怎麼樣找也找不到。你怎麼可能有煩惱呢？你在什麼地方都在增長你的功德，這個功德還是以後的異熟，眼前心裡是處處歡喜。所以現在很多人說信了佛還要煩煩惱惱，唉呀，我覺得真可憐，乃至出了家還煩煩惱惱！這個時候你趕快努力來學，你只要學會了以後，那快樂啊！眼前固然快樂，是將來生生增上。"]]},{"t":"60A 23:59","b":[["s","所以儘管現在我這樣的話，常常不大舒服，可是我心裡實在是很開心，是越想越開心。我想我以前沒有學，所以現在老生病，現在曉得了好高興啊！以前的果報，那沒辦法嘛，還它啊！可是我既然感到這個痛苦，我現在了解了，我現在種的因可是快樂的因啊！越想越高興。痛由它去，那沒辦法好的事情嘛！我以前不知道，現在知道了，你看多開心啊！你生病都開心，那你不生病的時候，當然更開心。這個道理都在這個上頭，那麼這個是族姓。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/005.mp3"},{"文":"第四者謂於乞求衣食等物，«悉皆施惠»，設未來乞亦行利益。又於苦惱及«功德田»，乏資具所，應往供施。","口譯":"第四種（感得自在圓滿的因）是：對於來乞求衣食等物的人，全都惠施；即使沒有來乞求，也要利益他。又對於受苦惱者以及功德田，凡缺乏資具的，應當前往供養布施。","四家合註":"<span>第四者：<\/span>謂於乞求衣食等物，悉皆施惠，設未來乞亦行利益。又於苦惱及功德田乏資具所，應往供施。","合註白話":{"same":0},"覺燈日光":null,"時":"60A 24:41","頁":141,"af":"60a","st":1481,"et":null,"消文":[{"文":"第四就是布施，有人來向你乞討，你去惠施他。"}],"延伸":[{"題":"悉皆施惠","組":[{"題":"施與不施，看衡量準則","說":[{"類":"破","文":"世間說：他有能力不做，你給他是培養社會寄生蟲、增長他好吃懶做，所以不要布施。"},{"類":"立","文":"這兩個答案都對，反過來兩個都錯；做任何事都有衡量的準則，看你那時衡量的準則是什麼。"}]},{"題":"動機為利他，送不送都對","說":[{"類":"立","文":"把握住對象、意樂、加行、圓滿；為結善緣，他來要是成就你的布施，他是你的恩田，自他都圓滿，絕對正確。"},{"類":"回扣","文":"業是思、思已業，思心所相應而起身口，心的動機很重要。"},{"類":"破","文":"拿自己的心情、以世間的量則去想，不管找多少藉口，就是另外一回事。"}]},{"題":"布施第一，捨頭不問","說":[{"類":"立","文":"正式開始修行的次第，一定是先布施第一。"},{"類":"例","文":"佛在因地，人家來討頭，他高興得不得了，絕對沒想人家要了頭幹什麼。"}]},{"題":"三施體諒老病","說":[{"類":"立","文":"布施分財施、法施、無畏施；心情怯弱的人需要幫忙，也應該幫忙。"},{"類":"例","文":"師父以前覺得老人踢踢遢遢，現在體會到老年的苦，不能用年輕人的想法去想。"},{"類":"下手","文":"需要財就布施財物，需要精神安慰就布施無畏，知見不了解就法布施。"}]}],"說":[{"類":"破","文":"世間說：他有能力不做，你給他是培養社會寄生蟲、增長他好吃懶做，所以不要布施。"},{"類":"立","文":"這兩個答案都對，反過來兩個都錯；做任何事都有衡量的準則，看你那時衡量的準則是什麼。"},{"類":"立","文":"把握住對象、意樂、加行、圓滿；為結善緣，他來要是成就你的布施，他是你的恩田，自他都圓滿，絕對正確。"},{"類":"回扣","文":"業是思、思已業，思心所相應而起身口，心的動機很重要。"},{"類":"破","文":"拿自己的心情、以世間的量則去想，不管找多少藉口，就是另外一回事。"},{"類":"立","文":"正式開始修行的次第，一定是先布施第一。"},{"類":"例","文":"佛在因地，人家來討頭，他高興得不得了，絕對沒想人家要了頭幹什麼。"},{"類":"立","文":"布施分財施、法施、無畏施；心情怯弱的人需要幫忙，也應該幫忙。"},{"類":"例","文":"師父以前覺得老人踢踢遢遢，現在體會到老年的苦，不能用年輕人的想法去想。"},{"類":"下手","文":"需要財就布施財物，需要精神安慰就布施無畏，知見不了解就法布施。"}],"af":"60a","st":1481},{"題":"功德田","組":[{"題":"善體親意，委曲婉轉","說":[{"類":"立","文":"苦惱是世間一般人，缺財、缺法、缺依靠；功德田是三寶、修行人，恩德也可以併在這裡。"},{"類":"立","文":"世間講孝道，不是說能養，要能夠善體親意。"},{"類":"破","文":"對功德田、尊長，不是「我賺了錢給他幾個」，處處要委曲婉轉。"}]},{"題":"如孝子心，依彼心想","說":[{"類":"回扣","文":"事善知識引《華嚴》九心，第一是如孝子心。"},{"類":"立","文":"不以自己覺得怎麼想，而以父母心裡怎麼想。"}]},{"題":"邪見增上，每況愈下","說":[{"類":"破","文":"現在的年輕人念了書，說父母老朽、落伍、什麼都不懂，好像就他懂。"},{"類":"立","文":"世間邪見增上，道理越講越多，樣樣東西卻每況愈下。"}]}],"說":[{"類":"立","文":"苦惱是世間一般人，缺財、缺法、缺依靠；功德田是三寶、修行人，恩德也可以併在這裡。"},{"類":"立","文":"世間講孝道，不是說能養，要能夠善體親意。"},{"類":"破","文":"對功德田、尊長，不是「我賺了錢給他幾個」，處處要委曲婉轉。"},{"類":"回扣","文":"事善知識引《華嚴》九心，第一是如孝子心。"},{"類":"立","文":"不以自己覺得怎麼想，而以父母心裡怎麼想。"},{"類":"破","文":"現在的年輕人念了書，說父母老朽、落伍、什麼都不懂，好像就他懂。"},{"類":"立","文":"世間邪見增上，道理越講越多，樣樣東西卻每況愈下。"}],"af":"60b","st":58}],"逐字稿":[{"t":"60A 24:41","b":[["q","第四者謂於乞求衣食等物，悉皆施惠，設未來乞亦行利益。又於苦惱及功德田，乏資具所，應往供施。"],["s","第四，那麼就是布施，如果有人來向你乞討的話呢，你去惠施他，去惠施他。現在有的人說：「唔，你布施給他 ……」世間上面常常這樣說：「這種人他好好的，他自己有能力不去做，你給了他以後，他不是培養一個社會上面的寄生蟲嗎？你讓他增長他的好吃懶做嗎？所以不要布施！」你說這個話有沒有道理？嗯，很有道理啊！對啊，你吃的送了他，他以後 ─好了、好了不做事情，他專門這樣了。那你到底怎麼辦啊？這上面我告訴你，這兩個答案都對，反過來，兩個答案都錯。你真正懂得了佛法，你怎麼做就怎麼對，而且絕對不會是含含糊糊的。剛才說兩個答案都對，你不是說：「這個對了，這個一定錯，這個對了，那個一定錯，怎麼會兩個都對呢？」不！你要曉得做任何一件事情，它一定有一個衡量這一件事情的準則。你那個時候看你衡量的準則是什麼，這個我們要了解的。"]]},{"t":"60A 26:17","b":[["s","所以佛法上面告訴我們，我們必定要把握住這幾個：做的事，就是對象；什麼意樂，你的心是什麼心；然後呢根據這個心，你怎麼加行；怎麼圓滿。如果說你看見了這個情況之後，於是你心裡面想到的，說你現在修學佛法，什麼？要幫別人，幫助別人最主要的是幹什麼？結個善緣哪！先結善緣，然後呢慢慢地可以。他今天想來跟你要，很好啊！結個善緣，以後來幫助他，第一個。第二個，他來要，成就你的布施，圓滿你的布施的這個功德，他是你的恩田，你將來所以能夠成就，都是靠他。然後呢你將來有了布施，然後你有這個功德，到那個時候你也修學了佛法，了解了，然後你幫助他去，對吧？結果這麼一來的話，你自己也圓滿，他也圓滿，其他的你不考慮，那個時候絕對正確！"]]},{"t":"60A 27:18","b":[["s","是另外一個情況呢？也許你另外一種情況，那個時候，你的起心動念，著眼不在那個布施上面，也許你在另外一個概念上面 ─世間的量則。那個時候你想，他這個人，假定說你用另外一種方式策勵他去的話，也可以讓他至少能夠有一個什麼的好處。那個時候，你不布施，對！總之你的心的動機很重要哦！所以記得吧？這個業一共有四個條件，第一個，業來決定一切，第二個，業的增長廣大，記得不記得？然後這個業是什麼，思、思已業，對不對？思心所相應，然後呢相應的身口所起的。當你心裡面想著，你為了利益他，你為了利益他，送他也對，不送他也對；反過來，你拿你的心情去想，以世間的量則去想的話，那就另外一回事情，不管你找多少的藉口。這個概念非常清楚，所以你把握住這一點的話，儘管別人也許跟你要諍論這個問題，你自己心裡面了解得清清楚楚，你做起來絕對沒錯，這是我在這個地方告訴你的。"]]},{"t":"60A 28:42","b":[["s","那麼在我們正式開始修行的次第，一定是先布施第一，這樣。所以這個佛在因地當中不要說錢、樣樣東西布施啊，人家來給他討頭，他絕對不會說他要不要他的頭，「欸，他來要我的頭，我生生世世就要求布施，他現在來要求，滿足我的布施，當然送給他呀！」他高興得不得了！他絕對沒有想到人家要不要，要了這個頭要幹什麼的，他沒想到。這是我們要了解的這個特質啊！"]]},{"t":"60A 29:19","b":[["s","所以我們現在從這個地方要去看，這個布施分多方面的，財施、法施、無畏施。是！有的時候，有的人心情比較怯弱一點，那個時候需要你幫忙的時候，我們也應該幫忙他，應該幫忙他。"]]},{"t":"60B 00:03","b":[["s","那麼尤其在這一點，我要特別地鼓勵幾位年輕的同學們。年輕人不曉得老年的苦，也許是因為我現在體會到了，以前我總是覺得拿我的衡量，總覺得這些年紀老的人踢踢遢遢的。我現在發現不是！到那時候他就是處處地方不如，他的確有他 ……還有病的時候，那個時候不能用你的想法去想，這個我們要注意！所以我們修學佛法的時候，這一個概念很重要，很重要！人家到這種情況之下，我們應該他需要什麼儘量幫忙他，需要財 ─外物，布施財物；他需要精神上面的安慰，布施無畏；知見方面的不了解，那麼法布施，總歸處處地方幫忙他。"]]},{"t":"60B 00:58","b":[["s","「又於苦惱及功德田」缺乏的時候，「苦惱」的話，那就是屬於世間的一般人。不管他是缺的哪一樣 ─缺的財，缺的法是無知，以及精神上面的沒得依靠，你給他的無畏；所謂「功德田」的話，就是三寶之數，修行人等等。這個功德田，把恩德也併在這個裡頭可以說，他有所缺乏的時候，那麼去供養、去布施，這樣。所以這個世間人尚且這麼說啦，這個孝，世間講孝道，實際上這就是我們最好的恩田。他不是說你能夠養啊，不是說你能夠養啊！要什麼？要能夠善體親意。現代的人能夠養父母已經了不起了，古來的人不是這樣，佛法比它更高一層。所以我們真正地對於功德田，對於尊長什麼等等的話，不是說：「啊！我賺了錢給他幾個。」或者什麼，絕對不是這個意思，你處處地方要委曲婉轉的。"]]},{"t":"60B 02:12","b":[["s","記得不記得，我們事善知識引用《華嚴》當中的九心，第一個心是什麼？大家還記得不記得？如孝子心，一點都沒錯。如孝子心什麼？他講他的心欸！他處處地方，不是以他自己的心裡邊覺得「我覺得怎麼想的」，而是以父母的心裡面怎麼想的，這一點對現代的人尤其重要。為什麼對現代的人尤其重要？因為現代的科學特別發達的時代，這個前後差得很多、很多。我當年自己也是這樣想，現在看見年輕人哪，啊，又變本加厲！我當年總覺得父母啊，他們那個時代不一樣，那麼不懂了。現在呢，更是如此了！不要說等到二十幾歲、三十幾歲念了很多書，還在小學裡乃至中學裡邊，對自己的父母說：「這些老朽了，這個落伍了，他根本什麼都不懂！」好像就是他懂。所以這個世間哪，邪見增上，每況愈下，講道理是越講越多，但是呢世間的樣樣東西是每況愈下，道理就在這裡。所以這個是第四樣東西，我們要了解的。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/006.mp3"},{"文":"第五者謂修«遠離語四不善»。","口譯":"第五種（感得信言圓滿的因）是：修習遠離語業的四種不善。","四家合註":"<span>第五者：<\/span>謂修遠離語四不善。","合註白話":{"same":0},"覺燈日光":null,"時":"60B 03:29","頁":141,"af":"60b","st":209,"et":491,"消文":[{"文":"第五為什麼信言會圓滿？因地當中能遠離四種不善、修四種善法，講話人家能信受你。"}],"延伸":[{"題":"遠離語四不善","組":[{"題":"信言圓滿，由宿生語業","說":[{"類":"破","文":"平常一開口，要嘛說閒話綺語，說了半天毫無意思；講一點道理人家不聽，就起諍論。"},{"類":"因","文":"宿生做錯了，這一生錯上加錯，還總覺得自己有道理，可憐、愚癡在他不知道。"}]},{"題":"認得概念所指","說":[{"類":"回扣","文":"為什麼昨天特別提到等流，必定要從這裡認識起。"},{"類":"立","文":"單單那個概念一點用場都沒有，要認得概念所指的是什麼，才有修行的機會。"}]},{"題":"懂得越多，吵得越多","說":[{"類":"破","文":"說了很多道理，拿照妖鏡去照別人，自己傷害也傷害佛法。"},{"類":"破","文":"懂得道理越多，跟人家吵架的機會越多，把佛無始集聚的資糧吵壞了。"},{"類":"下手","文":"古人說碰見事情，談得好就談，不能談就忍。"}]},{"題":"開口像吵架的習性","說":[{"類":"例","文":"師父剛出家住蘭若，法師常說「你們這些人，一開口就像吵架」，過了多少年才感覺到。"},{"類":"立","文":"心理狀態不一樣，開口的心情也不一樣；不比較，比較不出來。"},{"類":"喻","文":"有人一開口三字經就先出來，自己不曉得在說些什麼，這就是習性。"}]}],"說":[{"類":"破","文":"平常一開口，要嘛說閒話綺語，說了半天毫無意思；講一點道理人家不聽，就起諍論。"},{"類":"因","文":"宿生做錯了，這一生錯上加錯，還總覺得自己有道理，可憐、愚癡在他不知道。"},{"類":"回扣","文":"為什麼昨天特別提到等流，必定要從這裡認識起。"},{"類":"立","文":"單單那個概念一點用場都沒有，要認得概念所指的是什麼，才有修行的機會。"},{"類":"破","文":"說了很多道理，拿照妖鏡去照別人，自己傷害也傷害佛法。"},{"類":"破","文":"懂得道理越多，跟人家吵架的機會越多，把佛無始集聚的資糧吵壞了。"},{"類":"下手","文":"古人說碰見事情，談得好就談，不能談就忍。"},{"類":"例","文":"師父剛出家住蘭若，法師常說「你們這些人，一開口就像吵架」，過了多少年才感覺到。"},{"類":"立","文":"心理狀態不一樣，開口的心情也不一樣；不比較，比較不出來。"},{"類":"喻","文":"有人一開口三字經就先出來，自己不曉得在說些什麼，這就是習性。"}],"af":"60b","st":209}],"逐字稿":[{"t":"60B 03:29","b":[["q","第五者謂修遠離語四不善。"],["s","那麼這個第五項。那麼現在呢這是講再下面所謂第五，這個第五為什麼信言會圓滿呢？他因地當中能夠遠離四種不善，修四種的善法，修四種的善法。那個時候自然而然哪，你講話人家能夠信受你、信受你，這樣。否則的話，這個我們講話的的確確現在常見的現象，平常我們一開口，是好的固然不錯，但是大部分人往往，要嘛說閒話，綺語，說了半天毫無意思，造這個因；要不然講一點道理的話，人家不聽了，起諍論，然後你有道理，我有道理，吵了個半天。這個都是什麼原因？宿生既做錯了，這一生尤其是錯上加錯，大家還不能反省啊！還不能反省啊，還總覺得我有道理，那個心裡面哪，他不是說他明知故犯，他真正地可憐的地方，愚癡的地方，他不知道，他總覺得自己有道理。所以大家注意，為什麼我昨天特別提到這個等流，你們必定要從這個地方認識起。這不僅僅是個概念，單單那個概念，一點用場都沒有。你必定要把這個概念哪，認得它概念所指的是什麼，那個時候你才有修行的機會。"]]},{"t":"60B 05:34","b":[["s","說到這裡，為什麼現在在這個地方佛學院，有很多我將來我會認真地淘汰，不相應的就是不必去聽。要不然說了很多道理以後，然後拿那個照妖鏡去照別人的話，自己既傷害也傷害佛法，沒有用場，完全沒有用場。你懂得了道理越多，然後跟人家吵架的機會越多。你自己害了是小事情，然後呢把大家也拖下地獄去，佛無始以來集聚的資糧，就被我們這樣地吵吵壞掉了，不值得的，這個要了解，這樣。所以碰見這種情況，為什麼古人告訴我們碰見什麼事情，談得好就談，不能談 ─忍，原因很簡單，就是說這個裡面總有很多原因在，你不必跟人家論的原因就是這樣。所以這個地方告訴我們，所以你開口人家能夠信奉的原因，就是你宿生信言圓滿。那是因為你要嘛不開口，開口的時候，絕不講無義的綺語，絕不離間別人，事實就是事實，乃至於說話的時候總是不會粗言，總是非常地柔軟，非常地柔軟。"]]},{"t":"60B 06:59","b":[["s","那我說到這個地方，我倒想起那個時候剛出家，剛出家，我們住在蘭若，我這個法師常常說我：「你們這些人，一開口就像吵架。」我總覺得我好像從來沒有跟人家吵架嘛！我一直出了家以後，的的確確我自己覺得，從來沒有跟人家吵架。但是過了多少年以後，我在那個時候才感覺到。那個時候心裡面，心理狀態也不一樣，開口的時候，自己也感覺得到，那個心情跟那個不一樣；你不比較，比較不出來。那麼以前這個什麼狀態呢？以前因為一向就是那種心理很粗猛的這種現象不覺得，自己雖然平平常常，可是開起口來那個話，總是比較起來不大像柔軟。就像我們現在，譬如說有很多這種社會上面某一個階級的人，他一開口三字經就先出來了，一開口三字經就出來了。他這個三字經，他自己不曉得他在說些什麼欸，那會這樣的，就是這個習性。那麼這個地方我們提一下，這個第五。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/007.mp3"},{"文":"第六者謂發宏願，於自身中攝持當來種種功德，供養三寶，供養父母，聲聞獨覺，親教軌範，«及諸尊長»。","口譯":"第六種（得到大名望的原因）是：發大願，希望將來自己具足種種功德；供養三寶、父母、聲聞、獨覺、親教師、軌範師和各位長輩。","四家合註":"<span>第六者：<\/span>謂發宏願於自身中成辦當來種種功德，<span>而行<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-ba\">其因<\/span>供養三寶，供養父母、聲聞、獨覺、親教、軌範，及諸尊長。","合註白話":{"same":0},"覺燈日光":null,"時":"60B 08:11","頁":141,"af":"60b","st":491,"et":864,"消文":[{"文":"這是得到「大勢名稱」的，要兩個條件，第一個要發宏願。"},{"文":"什麼才是宏願？無上菩提之願。菩提心到現在還沒講到，乃至厭離心是什麼都不知道，法門都還沒摸到，先曉得方向在哪裡。"},{"文":"供養三寶是出世的，父母是世間的，聲聞獨覺是證果的，親教軌範尊長是跟你親近的。"},{"文":"這都是大功德田、大恩德田，隨便一點點的損或益，得到的禍害跟功德不得了地大。"}],"延伸":[{"題":"及諸尊長","組":[{"題":"孝婦回家，瘟神退走","說":[{"類":"例","文":"《德育古鑑》：夫家起瘟疫，新婦不聽娘家勸阻趕回去；家人聽見鬼說孝婦回來了、天上派人來了，趕快逃，一家都好了。"},{"類":"立","文":"世間人才發這一個心，有這樣的量，就馬上感得這樣的果報。"}]},{"題":"表面孝順，心裡嘀咕","說":[{"類":"例","文":"姓韓的人本可得功名，表面孝順父母尊長，心裡還在嘀咕，文昌帝君早把功名削掉。"},{"類":"例","文":"《俞淨意公遇竈神記》：日游使者跟了三年，發現他起心動念都是埋怨瞋恨，一點好功德都沒做。"},{"類":"破","文":"逃禍都來不及，還求功德，哪裡求起？"}]},{"題":"因地從起心動念種起","說":[{"類":"立","文":"異熟的八個因，因地就在我們起心動念那個地方種起，非常重要。"},{"類":"回扣","文":"佛說的戒經，最重要的是第三句「自淨其意」。"}]}],"說":[{"類":"例","文":"《德育古鑑》：夫家起瘟疫，新婦不聽娘家勸阻趕回去；家人聽見鬼說孝婦回來了、天上派人來了，趕快逃，一家都好了。"},{"類":"立","文":"世間人才發這一個心，有這樣的量，就馬上感得這樣的果報。"},{"類":"例","文":"姓韓的人本可得功名，表面孝順父母尊長，心裡還在嘀咕，文昌帝君早把功名削掉。"},{"類":"例","文":"《俞淨意公遇竈神記》：日游使者跟了三年，發現他起心動念都是埋怨瞋恨，一點好功德都沒做。"},{"類":"破","文":"逃禍都來不及，還求功德，哪裡求起？"},{"類":"立","文":"異熟的八個因，因地就在我們起心動念那個地方種起，非常重要。"},{"類":"回扣","文":"佛說的戒經，最重要的是第三句「自淨其意」。"}],"af":"60b","st":583}],"逐字稿":[{"t":"60B 08:11","b":[["q","第六者謂發宏願，於自身中攝持當來種種功德，供養三寶，供養父母，聲聞獨覺，親教軌範，及諸尊長。"],["s","這個是得到「大勢名稱」的。這個大勢名稱要兩個條件，第一個要「發宏願」。我為什麼要這樣作，要這樣作。這個願不是普通的願哦！這個願叫「宏願」，什麼才是宏願？無上菩提之願。現在我們只要把這四個字擺在心上面，真正的菩提願到現在為止我們還沒講到，我們也不大正確地認識。現在不要說菩提願，乃至於厭離心是什麼都不知道，在這種情況之下，那佛法門都沒摸到。不過呢，我們現在先曉得方向在哪裡，根據著這個，然後呢做種種的功德。做種種功德當中，特別是供養三寶，這個是出世的；父母這是世間的；然後呢三寶當中，特別是聲聞、獨覺這種證果的；跟你親近的，那是親教、軌範尊長，這個都是大功德田、大恩德田，你在這個裡面，隨便一點點的損或者益，就得到的禍害跟功德是不得了地大，不得了地大！"]]},{"t":"60B 09:43","b":[["s","我最近看這個《德育古鑑》上面，有這麼一段公案。有一個地方瘟疫，有一個地方是瘟疫，那個瘟疫來的時候是非常可怕，不要說現在啊，現在的科學這麼昌明，一旦這個流行病來的時候，你簡直一點辦法都沒有。那古代那好可怕，我想你們大概沒看見過，我小的時候就看見過。那個時候霍亂來的時候，那往往說，剛開始只是一家人家，然後呢，哎呀，那個棺材店裡拼命做都來不及，到後來，哪有來得及買棺材的，整個的一個村莊上面死的只剩下幾個人咧！有這種情形，這麼個厲害法，那就是霍亂的時候。儘管那個時候科學不發達，可是那個時候也曉得的，一有霍亂，平常的時候婚喪喜慶等等，這個民間很重視，大家去要祭悼，一碰見這種情況，誰都不敢去。只是喪葬那些人，欸，他們那些人還妙咧，他們也不怕，他們還照去不誤。這麼個可怕法！所以古代人也曉得，一碰見這種情況誰都不敢去的。"]]},{"t":"60B 10:57","b":[["s","那麼有一次有一個地方，有一家人家也正在瘟疫流行。那麼流行之前有一個媳婦，那時候剛剛嫁到那個夫家，嫁到那個夫家了以後，她有一次偶然正好還她娘家去。她回去了以後，她那個夫家那個地方就起了瘟疫了。喔！一下傳開來那非常快，然後她就急著要回家去。她媽媽就說：「欸，你回去幹什麼？」她媽媽、她哥哥，大家都勸她：「這種病，一下的話，你家統統死光了。你這有幸而出來了以後，你呀趕快就留在這裡。」然後這個女的怎麼說？「不！我今天既然到了他家，那就是他家的人。正需要你的時候，你不去，這個可以嗎？做人是這樣做的嗎？」她當然話不這樣說啦，她的意思就是這樣，然後就回去了，然後就不計一切地回去了。擺明了擺出去的，就是張開眼睛往水裡跳的事情，她就回去了。"]]},{"t":"60B 11:59","b":[["s","回去的時候，欸，妙咧！那一家人家的家裡正在那個病的時候，忽然之間哪，她不曉得是她先生還是她公公，聽見有幾個鬼講，哎喲！說這個孝婦回來了，回來了，那個天上面派了人來了，他們趕快逃。就是這樣。欸，結果他一家人就好了，自己也不曉得是怎麼一回事情，就是這樣。所以後來就這個公案登出來，甚至真正反正是瘟疫什麼等等，的的確確有這種瘟神，有這種瘟神，那是那個地方的共業，他那個時候就來了，那時候就來了。所以你想，世間她才發這一個心，有這樣的量，就馬上感得這樣的果報。所以這一點我說到這個地方，隨便地一提供養這個尊長的功德。"]]},{"t":"60B 12:53","b":[["s","所以為什麼，反過來，那天我們記得吧？說有一個人，他姓韓的，他本來可以得到功名，結果因為他自己對他的父母，對他的尊長，儘管他表面上面還是很孝順，我們連他表面都做不到，他心裡面還在嘀咕。他心裡一嘀咕，那個文昌帝君說：「表面上面做得很好，他心裡一直嘀咕，他那個功名早就削掉了。」然後你們不妨再看看《俞淨意公遇竈神記》，他自己還覺得：「哎喲！我這麼修行，做這麼多好的事情。」這竈神怎麼講？「上帝派那個日游使者，跟著你跟了三年，因為你抱怨，所以上帝派一個日游使者（就是白天檢查的），跟了你三年，發現你一點的好功德都沒有做。你起心動念一直都是這種埋怨，都是瞋恨，所以你這個禍，你逃禍都來不及，你還求功德，你哪裡求起？」這個在世間人喏！"]]},{"t":"60B 13:54","b":[["s","所以我們修道人就要從這個地方好好地認識去，好好地認識去。你曉得了這個，那個異熟的八個因，曉得這個因地從哪裡種起，就在我們起心動念那個地方種起，那是非常重要的，非常重要的！所以，佛說的這個戒經，最重要的是第三句 ─自淨其意呀！也是這樣講啊！所以說，這個是第六個。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/008.mp3"},{"文":"第七者謂樂丈夫所有功德，厭婦女身，深見過患。","口譯":"第七種（感得丈夫身的因）是：喜樂丈夫身所有的功德，厭離婦女身，深見它的過患。","四家合註":"<span>第七者：<\/span>謂樂丈夫所有功德，厭婦女身，深見過患；","合註白話":{"same":0},"覺燈日光":null,"時":"60B 14:24","頁":141,"af":"60b","st":864,"et":887,"消文":[{"文":"怎麼能得到丈夫身？第一個樂丈夫身，對女身深深見到它的禍害。"}],"延伸":[],"逐字稿":[{"t":"60B 14:24","b":[["q","第七者謂樂丈夫所有功德，厭婦女身，深見過患。"],["s","這個，他怎麼樣能夠得到丈夫身呢？他第一個樂丈夫身，對於這個女身深深地見到它的禍害。還有一個呢？"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/009.mp3"},{"文":"樂女身者，遮止欲樂，將失男根，令得脫免。","口譯":"對於喜樂女身的人，遮止他的欲樂；對於將要失去男根的人，令他得以脫免。","四家合註":"樂女身者，遮止欲樂；將失男根，令得脫免。","合註白話":{"same":0},"覺燈日光":null,"時":"60B 14:47","頁":141,"af":"60b","st":887,"et":978,"消文":[{"文":"歡喜女性有兩種：一種是對自己的愛著，喜歡胭脂花粉、修飾，男性也如此。"},{"文":"整潔是世間的量則還是要的，只是不要刻意去弄。"},{"文":"男性好樂女性，一定會失男根；能自己遮止、防止別人，就能脫免，得丈夫之身。"},{"類":"回扣","文":"最重要的就是思、思已業，起心動念，然後身口相應。"}],"延伸":[],"逐字稿":[{"t":"60B 14:47","b":[["q","樂女身者，遮止欲樂，將失男根，令得脫免。"],["s","有很多人他歡喜女性，這個歡喜女性有兩種，或者自己對自己的這個愛著，這個女性通常歡喜胭脂、花粉，修飾、修飾弄弄，其實這個不僅是女性哦，男性也是如此。但是這個也並不是叫我們頭髮嘛長得這個樣，鬍子嘛留得這麼長，不是這個意思。我們整齊還是要的，整潔是世間的量則，只是你不要刻意地去弄的這個，這個不要。那麼這個除了自身以外，還有別的；譬如男性，男性好樂、歡喜女性的話，這個也是一定要會失男根的。碰見這種情況，你能夠自己遮止，防止別人遮止，那麼那種情況之下，你能夠脫免，就能夠得到丈夫之身，丈夫之身。關於這個在後面談到這個業的另外一部分的時候，他也有說明。總是處處地方，最重要的就是思、思已業，你的起心動念。然後你的起心動念以後，然後你的身口相應的，最主要的始終就是這個心念。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/010.mp3"},{"文":"第八者謂他不能作，«自當代作»，若共能辦，則當伴助，惠施飲食。","口譯":"第八種（感得具大力的因）是：他人不能做的事，自己代他去做；如果共同能辦，就去作伴幫助；並且惠施飲食。","四家合註":"<span>第八者：<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-yu\">師云：《如來祕密經》中說，於塔粉刷白灰，是具力因。然此但一例耳，以依於佛之一切供養支分皆是也。<\/span>謂他不能作，自當代作；若共能辦，則當伴助；惠施飲食。<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-yu\">滋養衰損之身，有以令心踴躍而發勇喜者，有以飲食調養者。<\/span>","合註白話":{"same":0},"覺燈日光":null,"時":"60B 16:18","頁":141,"af":"60b","st":978,"et":1205,"消文":[{"文":"第八怎麼才有具大力量？他不能做你就代他做，或共他做、幫忙他，惠施種種。"}],"延伸":[{"題":"自當代作","組":[{"題":"求助者成就我的功德","說":[{"類":"立","文":"人家求助於你，應該求之不得：好啊！他來成就我的布施功德、我的具足大力。"},{"類":"破","文":"照自己心意想「他這個人故意這樣」，種種理由，不但不幫還叫別人不去幫忙。"}]},{"題":"窮人壞人同成就我成佛","說":[{"類":"立","文":"你要成佛所以恭敬三寶，為什麼不對窮人恭敬？"},{"類":"因","文":"沒有窮人成就你的布施功德，沒有壞人成就你的持戒、忍辱功德，你能成佛嗎？"}]},{"題":"學佛還是學文字諍辯","說":[{"類":"破","文":"學會了文字跟人家諍辯、博一個頭銜、去大吹牛，那不要管。"},{"類":"立","文":"如果你想成佛，情況就完全是另外一回事。"}]},{"題":"修改無始習性","說":[{"類":"立","文":"把文字的內涵認得，有了正確認識，身體力行、改過，這叫修，修改無始以來的習性。"},{"類":"回扣","文":"「他世現行猶如夢」：習性不知不覺，到下一世現行像夢一樣，各人歡喜什麼也不曉得為什麼。"}]}],"說":[{"類":"立","文":"人家求助於你，應該求之不得：好啊！他來成就我的布施功德、我的具足大力。"},{"類":"破","文":"照自己心意想「他這個人故意這樣」，種種理由，不但不幫還叫別人不去幫忙。"},{"類":"立","文":"你要成佛所以恭敬三寶，為什麼不對窮人恭敬？"},{"類":"因","文":"沒有窮人成就你的布施功德，沒有壞人成就你的持戒、忍辱功德，你能成佛嗎？"},{"類":"破","文":"學會了文字跟人家諍辯、博一個頭銜、去大吹牛，那不要管。"},{"類":"立","文":"如果你想成佛，情況就完全是另外一回事。"},{"類":"立","文":"把文字的內涵認得，有了正確認識，身體力行、改過，這叫修，修改無始以來的習性。"},{"類":"回扣","文":"「他世現行猶如夢」：習性不知不覺，到下一世現行像夢一樣，各人歡喜什麼也不曉得為什麼。"}],"af":"60b","st":978}],"逐字稿":[{"t":"60B 16:18","b":[["q","第八者謂他不能作，自當代作，若共能辦，則當伴助，惠施飲食。"],["s","第八的話呢，怎麼才有具大力量呢？他如果不能做，你就代他做；或者自己共他做，或者幫忙他；惠施種種。所以遇到這種情況，現在這種情況，有的時候人家求助於你，你應該怎麼？求之不得，「好啊！他來成就我的布施功德，他來成就我的具足大力。」我們往往這樣的，人家來求助你，總照著我心裡的心意想，就是說：「他這個人故意這樣，他這個人就是怎麼樣，就是怎麼樣 ……。」你說種種理由呀，不但自己不幫忙，還要叫別人不去幫忙。唉呀！這個事實在是我覺得好可惜、好遺憾的一件事情。這個地方我們了解了，說你要想得到這一個異熟的果報，就要以這樣的異熟的因啊，這樣。"]]},{"t":"60B 17:24","b":[["s","所以佛陀特別給我們說明，說你不是要成佛嗎？對！因為你要成佛，所以你對佛、三寶恭敬嗎？對！因為既然你要成佛而對三寶恭敬的話，請問：為什麼不對那些窮人恭敬呢？這個話驟然我們聽起來不懂，對那些窮人、對那些壞人你為什麼要恭敬他？請問：沒有窮人成就你的布施功德，沒有那些壞人成就你的持戒、忍辱功德，你能成佛嗎？不能！不能！既然你要成佛了去恭敬佛，他同樣成就你成佛的因緣，你能不恭敬他嗎？這個道理很簡單嘛！"]]},{"t":"60B 18:15","b":[["s","所以說穿了問題很簡單，你是跑得來要學佛，還是你跑得來學會了那些文字跟人家去諍辯哪？假定你學會了文字諍辯，你要想去博一個博士頭銜，朝著去大張旗鼓賺大錢，那不要管。你反正懂得了一點文字，跑得去跟人家大吹牛，可以！如果你想成佛的話，那個情況就完全另外一回事情。分別得清楚嗎？"]]},{"t":"60B 18:46","b":[["s","我所以很強調用這種語調來說明的，只有一個目的，就是策勵我們自己的內心，曉得我們真正進入的關鍵所在哪裡 ─是把文字的內涵要認得，然後呢有了這個正確的認識，身體力行，改過，這個就叫作修嘛，修改自己一向無始以來的習性。這個習性是不知不覺的，前面很多次告訴我們「他世現行猶如夢」，你有了這個習性呢，到了下一世現行的像夢當中一樣。我們想想看是不是？我們每一個人就有我們個人歡喜，欸，他就歡喜那樣，他就歡喜這樣，我們也不曉得為什麼。就像做夢當中我們不曉得為什麼，夢醒了又曉得，原來這是夢啊！為什麼？喏，就是你宿生的這樣的，這個哪裡？就這兩個字。這下面這個，等一下再講，或者先讓你們想一想，總是慢慢地、慢慢地，談到的時候再去說它，那麼這個八個因。下面這個很有意思哦！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/011.mp3"},{"文":"如是八因，若具«三緣»，能感最勝諸異熟果。","口譯":"這樣的八種因，如果具足三種緣，就能感得最殊勝的種種異熟果。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二者：<\/span>如是八因，若具三緣，能感最勝諸異熟果。於其三緣，","合註白話":{"id":"17495","頁":483,"白話":"第二科：這八種因如果具備了三種因，那些異熟果將會更加超勝。三種因當中的心清淨，觀待於自身的有兩種：將修行那些因的善業迴向至無上菩提，是指不期望異熟果；發自內心修行那些因，是指強而有力。觀待於他人的有兩種：看見上中下三種同法者時，斷除嫉妒、競爭、輕蔑而修隨喜；如果無法如此，也應該每日多次將之設想為所應做的事。加行清淨當中觀待於自身的部分，是長久、持續不斷，以及強而有力；觀待於他人的部分，是沒有正確受持者，便讚美他使之受持，已經受持者，為了使之歡喜而加以讚美，以及令其延續不斷、不要放棄。田清淨，是指心與加行這二者就能帶來眾多美好的果報，因此宛如田地。使前八者成為超勝的這三種因，是心清淨與加行清淨二者；至於田清淨，是由於前者本身就如同田地，所以《菩薩地》中這麼宣說，除此之外其實別無所指。以上這些是《菩薩地》中所說的內容，以《釋論》作補充而宣說。","注釋":["三緣：藏文直譯為「三因」，法尊法師係依玄奘大師譯《瑜伽師地論》文譯出，下文同。","亦應日日多次觀為所應行事：法尊法師原譯作「亦應日日多次觀擇所應行事」。「觀擇所應行事」似指對於所應做事進行觀察，而藏文原意為「把這些暫時還做不到的善行，看成應該要做到的事」。善慧摩尼大師也提到，此句指每日都應數次預先設想「應該要做成這樣的善行」，故改譯。參見《洛桑諾布文集》冊2，頁512。","殷重：藏文直譯為「勢力猛利」。","《菩薩地》說：相應段落參見唐玄奘大師譯《瑜伽師地論·本地分》云：「云何異熟？謂略有八：一者、壽量具足；二者、形色具足；三者、族姓具足；四者、自在具足；五者、信言具足；六者、大勢具足；七者、人性具足；八者、大力具足。若諸菩薩長壽久住，是名菩薩壽量具足。形色端嚴眾所樂見顏容殊妙，是名菩薩形色具足。生豪貴家，是名菩薩族姓具足。得大財位有大朋翼具大僚屬，是名菩薩自在具足。眾所信奉斷訟取則，不行諂誑偽斗秤等，所受寄物終不差違，於諸有情言無虛妄，以是緣故凡有所說無不信受，是名菩薩信言具足。有大名稱流聞世間，所謂具足勇健精進剛毅敏捷。審悉善戒，種種伎藝工巧業處展轉妙解出過餘人，由此因緣世所珍敬，為諸大眾供養恭敬尊重讚歎，是名菩薩大勢具足。具丈夫分成就男根，是名菩薩人性具足。為性少疾或全無病有大堪能，是名菩薩大力具足。云何異熟因？謂諸菩薩於諸眾生不加傷害，遠離一切傷害意樂，是名菩薩壽量具足因。惠施光明鮮淨衣物，是名菩薩形色具足因。於諸眾生捨離憍慢，是名菩薩族姓具足因。於資生具有所匱乏遊行乞匃諸眾生所，隨欲惠施，是名菩薩自在具足因。所言誠諦亦不好習乖離麁獷不相應語，是名菩薩信言具足因。攝持當來種種功德，於自身中發弘誓願，供養三寶及諸尊長，是名菩薩大勢具足因。樂丈夫體厭婦女身深見過患，由二因緣施他人性：一者、女人樂女身者，勸令厭離解脫女身；二者、丈夫將失男根，方便護攝令不失壞，及說正法令得男身，是名菩薩人性具足因。於諸眾生以身供事，隨其所作如法事業皆往營助，如己力能以其正法不以卒暴，用能增長身心勢力餅飯糜等種種飲食，施諸眾生，是名菩薩大力具足因。當知前說八種異熟，以此所說八種為因。又此諸因略由三緣而得增長，能感圓滿增上廣大異熟令起。何等三緣？一、心清淨；二、加行清淨；三、田清淨。若於無上正等菩提清淨意樂，用彼善根決定迴向，猛利意樂純厚廣大淨信修行；見同法者深生歡喜，日夜剎那於多隨法隨尋隨伺，名心清淨。即於其中長時數習，無間所作、常委所作；他於此善若未受行讚美令受，若已受行讚美令喜，即於如是所有善根安處建立，名加行清淨。當知略說能正發起如是加行，及正安住此加行果，名田清淨。」見《大正藏》冊30，頁484；《丹珠爾》對勘本冊73，頁561。","《釋》：即《瑜伽師地論·菩薩地釋》。《瑜伽師地論·菩薩地釋》，唯識部論典，又名《瑜伽師地論中菩薩地解說》，共33品，阿闍黎海雲著，尚無漢譯。阿闍黎海雲，生卒事蹟不詳。相應段落參見《丹珠爾》對勘本冊75，頁705。"],"已校":true},"覺燈日光":null,"時":"60B 20:05","頁":141,"af":"60b","st":1205,"et":1415,"消文":[{"文":"上面是八個因；一切法的生起是因緣所生，主因有了還要助緣具足。"}],"延伸":[{"題":"三緣","組":[{"題":"三輪體空與三輪不空","說":[{"類":"立","文":"《金剛經》講三輪體空，是修相應的慧，到時三輪自然空；這裡講的叫三輪不空。"},{"類":"立","文":"修道要先信解所緣的境，如法行持，才感得那樣的道、那樣的果。"}]},{"題":"不知因地，做到驢年","說":[{"類":"破","文":"不知道因地做什麼，就說空話，說三輪空是聖人境界，永遠只是想學佛。"},{"類":"例","文":"祖師說：「你這樣做法，做到驢年沒你的份！」"}]},{"題":"羨慕自己找到正路","說":[{"類":"立","文":"這三個因地上一步一步做對，果位上就達到這樣的結果；不要羨慕別人，應該羨慕自己。"},{"類":"破","文":"如果只有佛可以送果給我們，佛法就沒有因果了，這是佛法嗎？"}]}],"說":[{"類":"立","文":"《金剛經》講三輪體空，是修相應的慧，到時三輪自然空；這裡講的叫三輪不空。"},{"類":"立","文":"修道要先信解所緣的境，如法行持，才感得那樣的道、那樣的果。"},{"類":"破","文":"不知道因地做什麼，就說空話，說三輪空是聖人境界，永遠只是想學佛。"},{"類":"例","文":"祖師說：「你這樣做法，做到驢年沒你的份！」"},{"類":"立","文":"這三個因地上一步一步做對，果位上就達到這樣的結果；不要羨慕別人，應該羨慕自己。"},{"類":"破","文":"如果只有佛可以送果給我們，佛法就沒有因果了，這是佛法嗎？"}],"af":"60b","st":1239}],"逐字稿":[{"t":"60B 20:05","b":[["q","如是八因，若具三緣，能感最勝諸異熟果。"],["s","上面是八個因，一切法的成就，一切法的生起是因緣所生。因是這個，緣呢？下面。主因有了，還要助緣具足才行。哪三個助緣呢？下面，如果你能夠把這三個助緣做到了，能夠感到最勝的異熟的果報。"]]},{"t":"60B 20:39","b":[["s","在還沒有講這個三緣之前，《金剛經》上面告訴我們「三輪體空」，它要三輪空；下面這個叫「三輪不空」，這個怎麼講？三輪空是什麼？是修相應的慧，到了這個時候，三輪自然空。那麼你要修的話，請問道當中你要修什麼道？要修這個道，你「境」，前面信、解的境，應該是了解些什麼？根據你所了解的，然後如法地行持修道，才感得如此的道，對不對？一定的，所以那個時候才有這個果。請問因地當中是做些什麼？不知道！因為我們現在不知道，所以要嘛說空話，說三輪空，說了半天，大家反正不空，空的在天上。我們說起來：「我們凡夫嘛，這個是聖人境界。」這個話倒是沒錯，這是聖人境界，我們就是凡夫。但是你怎麼從凡夫到聖人境界，不曉得，所以永遠你想學佛，只是永遠哪，只是想。所以祖師會說：「你這樣做法，做到驢年沒你的份！」"]]},{"t":"60B 22:02","b":[["s","現在這個地方就告訴我們，喏，就是這三個！你能夠把這三個，因地上面一步一步做對了，果位上面就達到這樣的結果，所以這樣的次第。所以我們現在不要羨慕別人，應該羨慕自己呀，哇！說：「現在我好高興，我居然找到了這個正確的辦法，我只要這樣下去的話，到那個時候就是我的！」現在佛來送給你，對不起，我不要；你佛已經告訴我，我曉得，還是你佛告訴我的，你有這樣的因，就感得這樣的果，我現在造這個因，自然有這樣的果。如果說是只有佛可以送給我們果的話，對不起，那個佛法就沒有因果了，這是佛法嗎？所以你對這個概念認識了，自然而然曉得我們怎麼辦！"]]},{"t":"60B 22:56","b":[["s","下面就說三樣東西，哪三樣呢？第一個「心清淨」，這個地方分三樣 ─ 心、田、加行清淨。換句話這個就是三輪空當中，心就是自己，田就是對方，加行就是中間做的事情，這樣。所以我們剛開始的時候叫什麼？要用這樣東西的是清淨；等到你這個聞、思位當中清淨的話，感得修位當中的清淨的話，就是「空」相應法，就是這樣。那麼現在看看，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/012.mp3"},{"文":"心清淨中待自有二，","口譯":"心清淨之中，觀待自己方面有二：","四家合註":"心清淨中待自有二：","合註白話":{"same":11},"覺燈日光":null,"時":"60B 23:35","頁":141,"af":"60b","st":1415,"et":1422,"消文":[{"文":"三樣東西：心、田、加行清淨，就是三輪：心是自己，田是對方，加行是中間做的事情。"},{"文":"聞思位當中清淨，感得修位當中的清淨，就是空相應法。"},{"文":"心清淨又從自、他兩方面來說。"}],"延伸":[],"逐字稿":[{"t":"60B 23:35","b":[["q","心清淨中待自有二，"],["s","心清淨當中，「待自有二」，這個心又從自、他兩方面來說。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/013.mp3"},{"文":"謂修彼因所有眾善，將用迴向無上菩提«不希異熟»。","口譯":"就是把修習那些因的所有善根，都用來迴向無上菩提，而不希求異熟果報。","四家合註":"謂修彼因所有眾善，將用迴向無上菩提，不希異熟；","合註白話":{"same":11},"覺燈日光":null,"時":"60B 23:42","頁":141,"af":"60b","st":1422,"et":1707,"消文":[{"文":"做了好事，不管要不要，一定有善果；我做是為了求無上菩提，絕對不希望異熟果。"}],"延伸":[{"題":"不希異熟","組":[{"題":"做好事急著給人看","說":[{"類":"破","文":"做一點小小的事，總希望別人知道，不知不覺要做給別人看。"},{"類":"破","文":"人家希望異熟還是希望後世，我們連後世都等不及，眼前就要讓人看見。"}]},{"題":"迴向菩提有它的量則","說":[{"類":"立","文":"心裡很清楚我為什麼做；將來的果報都不要，眼前的果報更是虛假，兩腳一伸有什麼？"},{"類":"下手","文":"不管別人看不看見、讚不讚歎、埋怨，自己努力做；看看自己的心就明白。"}]},{"題":"做給自己看","說":[{"類":"例","文":"師父的老師說：「我做這一件事，可是做給我自己看的哦！」"},{"類":"例","文":"奔公甲撒一把灰，大成就者說是全西藏最好的供養：他起心動念要做給人看，馬上淨化。"},{"類":"回扣","文":"自淨其意。"}]},{"題":"三輪空高而可攀","說":[{"類":"立","文":"首先認得自己內心的心相淨否，攀緣心自然拿掉，再求無上菩提。"},{"類":"立","文":"平常唸《金剛經》覺得三輪空高不可攀；現在了解次第步驟，雖然高，可以步步上升。"}]}],"說":[{"類":"破","文":"做一點小小的事，總希望別人知道，不知不覺要做給別人看。"},{"類":"破","文":"人家希望異熟還是希望後世，我們連後世都等不及，眼前就要讓人看見。"},{"類":"立","文":"心裡很清楚我為什麼做；將來的果報都不要，眼前的果報更是虛假，兩腳一伸有什麼？"},{"類":"下手","文":"不管別人看不看見、讚不讚歎、埋怨，自己努力做；看看自己的心就明白。"},{"類":"例","文":"師父的老師說：「我做這一件事，可是做給我自己看的哦！」"},{"類":"例","文":"奔公甲撒一把灰，大成就者說是全西藏最好的供養：他起心動念要做給人看，馬上淨化。"},{"類":"回扣","文":"自淨其意。"},{"類":"立","文":"首先認得自己內心的心相淨否，攀緣心自然拿掉，再求無上菩提。"},{"類":"立","文":"平常唸《金剛經》覺得三輪空高不可攀；現在了解次第步驟，雖然高，可以步步上升。"}],"af":"60b","st":1422}],"逐字稿":[{"t":"60B 23:42","b":[["q","謂修彼因所有眾善，將用迴向無上菩提不希異熟。"],["s","現在我們要做各式各樣的好事，然後呢你做了好事以後，不管你要不要，一定有它的善果的。那麼，那個時候我做的時候，我說我不是為了別的，是為什麼？為了要求無上菩提，絕對不希望異熟果，絕對不希望異熟果，這一點我們要了解。那麼加深這個印象起見，我要提一件事情。我們往往做一點小小的事情，做了以後，總希望別人知道，啊！然後讓人家知道。或者做了以後，這個心裡面你不知不覺當中要做給別人看。人家希望異熟，還不希望現世，還希望以後咧！現在我們連它希望後世都等不及，就眼前馬上讓人家看見：你看，我在那兒做那件好事情。"]]},{"t":"60B 24:49","b":[["s","所以你不要小看說迴向菩提，這真正的內心迴向菩提，這是有它一定的量則在，這樣。所以你做任何事情，你心裡很清楚，我為什麼做，我是為了這個。將來的果報都不要，眼前的果報更是虛假的，兩腳一伸有什麼？所以不管別人看見不看見，不管別人讚歎不讚歎，人家埋怨我，他是他的，我自己努力做。所以這個迴向菩提兩個字，不要把它文字看，看看自己的心裡就很清楚、很明白。「不希異熟」啊！那個時候才談得到不希異熟。這是第一個，就是自己心裡很清楚，你做任何事情，說：是！"]]},{"t":"60B 25:34","b":[["s","所以，關於這一點，為什麼我對我的老師這麼讚歎，為什麼我現在才懂得他這一句話：「我做這一件事，可是做給我自己看的哦！」那我現在懂了：對啊！做給我自己看的，沒有錯，做的不是做給別人看的。到了這個時候，我才了解為什麼上一次講那個故事，說在全西藏供養三寶，最好的是奔公甲這一把灰。你們還記得吧！他拿出這一把灰來，往那個供桌上面撒了一把，結果一個大成就者說：「喏，全西藏最好供養的，就是奔公甲這一把灰！」要我們現在跑到灶裡面，拿了一把灰，在佛臺上面撒著，這個最好的供養嗎？這不是顛倒嗎？為什麼？他就了解，欸，他心裡面起心動念不對，他要做給別人看，馬上：不對！淨化 ─自淨其意呀！這個我們要了解，這樣。"]]},{"t":"60B 26:32","b":[["s","所以，你真正地對這一點了解了以後的話，那個攀緣心自己就很容易拿掉。最主要的還是什麼呢？還是你首先現在要認得你自己的內心的心相，淨否？這麼簡單！淨了，進一步，然後呢再求無上菩提。這是第一個，心清淨。因為你處處求無上菩提，無上菩提特質是什麼？空相應嘛，很簡單！所以你因地上面，心心念念積這樣的因，當因積夠的時候，果出現自然就是它，對不對？"]]},{"t":"60B 27:16","b":[["s","噢！現在我們了解了，我們平常唸《金剛經》，說三輪空覺得高不可攀，真是高不可攀，它就是高，你就是一點辦法都沒有。現在呢它雖然高，卻我就可以步步上升，很快就可以達到。所以佛就告訴我們，你只要這樣去做，不久你就成佛啊，一點都沒有錯。為什麼？你了解次第步驟。要不然的話，高，可是對不起，不可攀！沒有你的份。我們講也是空口說白話，然後我們還去弘法，弘了半天，始終是高不可攀，好遺憾！不要說遺憾，很可惜，應該這麼說。這個種子種下去，將來一定還是要成熟的，所以從種子那一方面，我們還是無比地讚歎。現在我們看第二個，說：啊，好高興呀！現在高，而且可攀！第二"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/014.mp3"},{"文":"由純厚意，修行諸因勢力猛利。","口譯":"用非常純正懇切的心去修這些原因，力量就會很強。","四家合註":"由純厚意修行諸因，勢力猛利。","合註白話":{"same":11},"覺燈日光":null,"時":"60B 28:27","頁":141,"af":"60b","st":1707,"et":1744,"消文":[{"文":"意是純而厚：一點不夾雜，淨的純；勢是猛利，做的時候猛利。"},{"文":"這完全是自己那一方面的，心清淨。"}],"延伸":[],"逐字稿":[{"t":"60B 28:27","b":[["q","由純厚意，修行諸因勢力猛利。"],["s","然後呢修的時候，意是純而厚，勢是猛利。純厚是指什麼？一點不夾雜，淨─ 淨的純，淨的純這個叫純厚。然後呢不但質是淨的純，而且做的時候 ─勢猛利，這個完全是自己那一方面的，心清淨。還有呢觀待他，什麼是觀待他呢？你萬一做事情的時候，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/015.mp3"},{"文":"待他有二，謂見同法者，上中下座，遠離嫉妬，比較輕毀，«勤修隨喜»。","口譯":"觀待他人方面有二：就是看見同法的人，無論上座、中座、下座，都遠離嫉妒、比較和輕視毀謗，殷勤修習隨喜。","四家合註":"待他有二：謂見同法者上中下座，遠離嫉妬、比較、輕毀，勤修隨喜；","合註白話":{"same":11},"覺燈日光":null,"時":"60B 29:04","頁":141,"af":"60b","st":1744,"et":null,"消文":[{"文":"別人做，同法的不管比你高、同樣、比你低，遠離嫉妬，也不比較。"},{"類":"破","文":"他做好了，我們說「他有什麼了不起」，你就害了。"}],"延伸":[{"題":"勤修隨喜","組":[{"題":"隨喜美不可言","說":[{"類":"立","文":"隨喜這個事情美不可言，任何情況下都可以隨喜。"},{"類":"例","文":"吃飯想到在家造染污業、今天來到出世間；睡覺想到為明天精進好好休息，都隨喜。"},{"類":"立","文":"隨喜自、隨喜他。"}]},{"題":"團體和睦，功德增長","說":[{"類":"立","文":"這樣團體也和睦，功德也增長，將來感得的果報自然美。"},{"類":"破","文":"不要怨環境惡劣，要怨自己宿生造了惡因。"}]},{"題":"不理想處也歡喜","說":[{"類":"立","文":"他做他的我做我的，還完前欠，下一世我上天堂再來救他，想到這裡好高興。"},{"類":"立","文":"他做好你也不嫉妒，他做壞你也不嘀咕，眼前歡喜，將來果報圓滿。"},{"類":"回扣","文":"這就是觀待於他。"}]}],"說":[{"類":"立","文":"隨喜這個事情美不可言，任何情況下都可以隨喜。"},{"類":"例","文":"吃飯想到在家造染污業、今天來到出世間；睡覺想到為明天精進好好休息，都隨喜。"},{"類":"立","文":"隨喜自、隨喜他。"},{"類":"立","文":"這樣團體也和睦，功德也增長，將來感得的果報自然美。"},{"類":"破","文":"不要怨環境惡劣，要怨自己宿生造了惡因。"},{"類":"立","文":"他做他的我做我的，還完前欠，下一世我上天堂再來救他，想到這裡好高興。"},{"類":"立","文":"他做好你也不嫉妒，他做壞你也不嘀咕，眼前歡喜，將來果報圓滿。"},{"類":"回扣","文":"這就是觀待於他。"}],"af":"61a","st":10}],"逐字稿":[{"t":"60B 29:04","b":[["q","待他有二，謂見同法者，上中下座，遠離嫉妬，比較輕毀，勤修隨喜。"],["s","哎呀，美啊！對他呢？有的時候這個不是你來做嘛，別人做，然後呢同法的，不管他上面比你高、同樣的、以及下面比你低，你看見他做了以後，「遠離嫉妬」，不嫉妬也不比較。他做好了，我們說：「他有什麼了不起！」對不起，你這個你就害了。他做對了，哎呀！讚歎哪，歡喜啊，隨喜啊！就勤修隨喜。"]]},{"t":"61A 00:10","b":[["s","隨喜這個事情是美不可言哪！你在任何情況之下，你都可以隨喜。吃飯，你也可以隨喜，睡覺你也可以隨喜，你看看別人坐得端端正正，「啊，好啊！」你讚歎。然後你看看你自己，「以前我在家裡面的時候吃了這個飯，造那個染污之業，今天跑到這個地方來，是出世間。」你又隨喜，所以隨喜自、隨喜他。平常睡覺兩腳一伸，躺在那裡像豬一樣地，不曉得睡到 ……「今天我在這裡忙了一天，為了明天的精進，好好地休息，啊，高興啊！」睡在那裡也隨喜，就這樣。然後你任何一個地方，就像剛才那個，這個為什麼？因為你看見別人了，這樣。"]]},{"t":"61A 00:56","b":[["s","所以在這種地方，自然而然你能夠這樣，是團體也和睦，你功德也增長；然後因為這樣的關係，將來你因地當中這樣，你感得的這個果報自然美。我們現在不要怨說：「唉呀，現在這個環境這麼惡劣啊！」要怨自己：「唉，宿生我以前一直又造那種惡因啊！」同樣反過來，你現在看見這麼個不理想的環境，你就歡喜！「那有什麼關係，他做他的，我做我的。做完了，這一世我把我的這個前面欠的還掉了以後，下一世，我們各走各的，我上我的天堂，然後等到我上完了天堂，再來救他，那個時候正好啊！」你想到這裡好高興喔，絕對不會抱怨，這個就是這個「觀待於他」耶！所以這種情況之下，他做好，你也不嫉妒；他做壞，你也不嘀咕，很清楚、很明白啊！而你自己呢，一直在高興，功德是一直在增長，眼前歡喜，將來果報是圓滿，天下哪有比這個更好的事情。其次，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/016.mp3"},{"文":"設若不能如此而行，亦應日日，多次觀擇所應行事。","口譯":"如果不能這樣去做，也應當每天多次觀察抉擇自己所應當做的事。","四家合註":"設若不能如此而行，亦應日日多次觀為所應行事。","合註白話":{"same":11},"覺燈日光":null,"時":"61A 02:14","頁":141,"af":"61a","st":134,"et":186,"消文":[{"文":"做不到怎麼辦？時時刻刻觀察自己應該做些什麼。"},{"類":"回扣","文":"四種資糧當中，密護根門下面告訴我們怎麼應行。"},{"文":"懂得了照去做，萬一不懂得就觀察一下，看懂了去做，起心動念都相應，這是心清淨。"}],"延伸":[],"逐字稿":[{"t":"61A 02:14","b":[["q","設若不能如此而行，亦應日日，多次觀擇所應行事。"],["s","假定這個做不到，怎麼辦呢？喏！我們時時刻刻在觀察自己，應該做些什麼。前面記得四種資糧吧？四種資糧當中，密護根門下面是告訴我們怎麼樣應行，做我們所有的行為該怎麼做。因為你懂得了，照去做，萬一不懂得，那麼觀察一下，然後你看懂了去做，自然而然起心動念都相應，那個「心清淨」。第一個你內心清淨了，第二個呢，加行清淨 ─三輪當中的第二輪，怎麼個清淨法呀？說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/017.mp3"},{"文":"加行清淨中，觀待自者，謂於長時無間殷重，","口譯":"在做法清淨這方面，就自己來說，是要長時間、不間斷、恭敬認真地去做；","四家合註":"加行清淨中，觀待自者，謂於長時、無間、殷重；","合註白話":{"same":11},"覺燈日光":null,"時":"61A 03:06","頁":141,"af":"61a","st":186,"et":227,"消文":[{"文":"加行清淨是三輪中的第二輪。"},{"文":"對時來說：不間斷，而且長久，越長越好；對量來說：殷重，認認真真地做。"},{"文":"同樣一件事，馬馬虎虎做和認認真真做，差別很大。"}],"延伸":[],"逐字稿":[{"t":"61A 03:06","b":[["q","加行清淨中，觀待自者，謂於長時無間殷重，"],["s","自己不管做什麼事情，時間 ─不間斷，第一個，而且長久，兩樣東西；不間斷是做的前後，「長時」，做任何一件事情是越長越好，這個對時來說。然後對量來說「殷重」，很認真地去做，很殷重地、認真地去做。你同樣地做一件事情，你可以馬馬虎虎地做，也可以認認真真地做，這個有很大的差別，很大的差別。這個就是「加行」。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/018.mp3"},{"文":"觀待他者，謂未受行讚美令受。已受行者，讚美令喜，恆無間作不棄捨作。","口譯":"觀待他人方面：對於還沒有受持奉行的人，讚美他使他受持；已經受持奉行的人，讚美他使他歡喜；恆常無間斷地做，不棄捨地做。","四家合註":"觀待他者，謂未受行讚美令受，已受行者讚美令喜，恆無間作、不棄捨作。","合註白話":{"same":11},"覺燈日光":null,"時":"61A 03:47","頁":141,"af":"61a","st":227,"et":332,"消文":[{"文":"他沒有接受正確的概念、沒照著做，讚歎稱讚使他接受、如法行持；已經行持了，讚美隨喜，也是無間，幫忙他絕不棄捨。"},{"文":"觀待他當中一定有觀待自：對方在的時候，兩個心情要同時用，這些事情不是分開的。"},{"文":"了解這個道理所指的心理行相，做起來就得心應手。"}],"延伸":[],"逐字稿":[{"t":"61A 03:47","b":[["q","觀待他者，謂未受行讚美令受。已受行者，讚美令喜，恆無間作不棄捨作。"],["s","前面是完全對自己來說，後面是對他來說，說如果說他沒有接受這個正確的概念，那麼沒有照著正確的行持去做，你讚歎、稱讚種種，使他接受，使他如法行持。已經接受，已經行持了，你讚美、隨喜，也是無間；還有呢，幫忙他絕不棄捨。"]]},{"t":"61A 04:29","b":[["s","這個裡邊雖然說「觀待自」、「觀待他」，要知道，這個觀待他當中，一定有觀待自裡頭，換句話說，所謂觀待自是什麼？就是完全是你自己的起心動念。那麼，當這件事情也牽涉到對方的時候，那個叫觀待他。所以當牽涉到對方的時候，你自己的那心情還是用得上的，對不對？所以有一種情況之下，的確沒有旁人，你自己坐在這個地方，那純粹屬於觀待你的；還有一種情況之下，他對方在的時候，那個觀待自、觀待他兩個心情要同時用，這個我們要了解的，這些事情都不是分開的。你了解這個道理所指的心理行相以後，你自然而然會認得得清清楚楚，那個時候你做起來是得心應手，那麼這個是「加行清淨」。三輪當中第三個「田清淨」，他下面說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/019.mp3"},{"文":"田清淨者，謂由彼二意樂加行，能與眾多微妙果故，«等同妙田»。","口譯":"田清淨，是說由於前面那兩種（清淨的）意樂與加行，能給予眾多微妙的果報，所以等同於美妙的福田。","四家合註":"田清淨者，謂由彼二意樂加行，能與眾多微妙果故，等同妙田。<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-ba\">令此八者成最勝之三緣，謂意樂清淨、加行清淨二者。田清淨者，以前者即猶田也，故《菩薩地》作如是說，不取餘事。<\/span>","合註白話":{"same":11},"覺燈日光":null,"時":"61A 05:32","頁":141,"af":"61a","st":332,"et":510,"消文":[{"文":"意樂是你的心，加行是你的行為，這兩樣好，感的果一定微妙，所以等於田美。"},{"類":"喻","文":"三樣當中兩個已經無限大，乘上去一定是無限大，第三個是不是都沒有關係。"}],"延伸":[{"題":"等同妙田","組":[{"題":"佛因地捨給六道眾生","說":[{"類":"例","文":"佛捨頭目腦髓，不是捨給佛，是捨給六道眾生，羅剎來要、老虎餓了也給。"},{"類":"立","文":"田不清淨，但心與加行兩樣清淨，他不是成了佛嗎？十方三世一切諸佛沒有一個例外。"}]},{"題":"三輪空的鑰匙","說":[{"類":"立","文":"要求三輪空，從這個地方求起。"},{"類":"立","文":"真正《金剛經》的鑰匙在這裡，大乘、小乘、經、律、論，開到哪裡哪一個就開。"},{"類":"回扣","文":"因、緣都具足了，果不必問。"}]}],"說":[{"類":"例","文":"佛捨頭目腦髓，不是捨給佛，是捨給六道眾生，羅剎來要、老虎餓了也給。"},{"類":"立","文":"田不清淨，但心與加行兩樣清淨，他不是成了佛嗎？十方三世一切諸佛沒有一個例外。"},{"類":"立","文":"要求三輪空，從這個地方求起。"},{"類":"立","文":"真正《金剛經》的鑰匙在這裡，大乘、小乘、經、律、論，開到哪裡哪一個就開。"},{"類":"回扣","文":"因、緣都具足了，果不必問。"}],"af":"61a","st":372}],"逐字稿":[{"t":"61A 05:32","b":[["q","田清淨者，謂由彼二意樂加行，能與眾多微妙果故，等同妙田。"],["s","你只要前面這個兩樣東西 ─「意樂」就是你的心，「加行」就是你的行為，這個兩樣東西好的話，感的果是一定微妙，所以等於這個田美一樣。現在三樣東西當中，兩個已經無限大了，第三個不管它無限大不無限大，一定無限大。只要有任何一個無限大，乘上那個無限大，一定是無限大，現在有兩個無限大了，第三個是不是都沒有關係。"]]},{"t":"61A 06:12","b":[["s","佛就是這個公案，佛啊，他的心清淨，他的加行清淨，他真正的成佛是什麼？他就是捨頭目腦髓，他捨的對象，不是捨給佛耶，這個很明白！他捨的頭目腦髓，捨給誰啊？捨給那個是六道眾生。所以那個六道眾生，田可不清淨哪，但是他的心、加行兩樣清淨了，他不是成了佛了嗎？所以理路上面已經告訴我們，實際上面公案也是如此，對不對？那這個明白的事實。而且十方三世一切諸佛沒有一個例外的，哪有一個佛捨的頭是捨給另外一個佛的？沒有耶，這個很清楚耶！然後呢羅剎來跟佛說要什麼東西，然後老虎餓了以後佛也給他，都是這個樣的。所以你看佛在因地當中，找不到清淨的田啊！只有佛在剛開始的時候是有的，到後來真正行菩薩道的時候，佛因地當中這個田，不是田清淨，而是心跟加行清淨。對不對？喏、喏、喏！現在這裡。"]]},{"t":"61A 07:31","b":[["s","所以你們要求三輪空，從這個地方求起，求到了。所以大家一直說：「哎呀，《金剛經》好啊！」我覺得這個不比《金剛經》壞喔！你們有沒有這個感覺啊？而且真正《金剛經》的鑰匙在這裡哦！不但《金剛經》、《彌陀經》、《圓覺經》，不但大乘經、小乘經，不但經，而且戒，你這個鑰匙有了，你開到哪裡，哪一個就開。開經藏，經藏開，開律藏，律藏開，開論藏，論藏開，這麼美！清楚不清楚？現在因、緣都具足了，果要不要問哪？不要問了，果不要問了，果也不必問！這是非常清楚、非常明白。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/020.mp3"},{"文":"此等是如〈菩薩地〉說，«以釋補滿»而為宣說。","口譯":"這些是依照〈菩薩地〉所說，用來解釋（引業之外的）圓滿業而宣說的。","四家合註":"此等是如《菩薩地》說，以《釋》補滿而為宣說。","合註白話":{"same":11},"覺燈日光":null,"時":"61A 08:30","頁":111,"af":"61a","st":510,"et":654,"消文":[{"文":"〈菩薩地〉講得很清楚，來解釋那個滿業的道理。"}],"延伸":[{"題":"以釋補滿","組":[{"題":"引擎好了再裝車身","說":[{"類":"立","文":"這是菩薩、祖師的悲心，修行的方法告訴我們這麼徹底、這麼圓滿。"},{"類":"喻","文":"新車先只有車頭和駕駛試引擎，引擎好了，車身一裝上去馬上成功。"},{"類":"立","文":"基本精神認識了，行相一配合：學戒，戒馬上圓滿；學定，定馬上得到。"}]},{"題":"次第已說得這麼清楚","說":[{"類":"破","文":"還問「念佛怎麼老不一心不亂」，在這裡聽過還問，是沒救藥，或者沒聽。"},{"類":"回扣","文":"正修行、破除邪執當中已說得這麼清楚，得到三昧尚且容易，何況一心不亂。"},{"類":"立","文":"了解了業的整個原則、要求的是什麼，第三步就是思已進止。"}]}],"說":[{"類":"立","文":"這是菩薩、祖師的悲心，修行的方法告訴我們這麼徹底、這麼圓滿。"},{"類":"喻","文":"新車先只有車頭和駕駛試引擎，引擎好了，車身一裝上去馬上成功。"},{"類":"立","文":"基本精神認識了，行相一配合：學戒，戒馬上圓滿；學定，定馬上得到。"},{"類":"破","文":"還問「念佛怎麼老不一心不亂」，在這裡聽過還問，是沒救藥，或者沒聽。"},{"類":"回扣","文":"正修行、破除邪執當中已說得這麼清楚，得到三昧尚且容易，何況一心不亂。"},{"類":"立","文":"了解了業的整個原則、要求的是什麼，第三步就是思已進止。"}],"af":"61a","st":510}],"逐字稿":[{"t":"61A 08:30","b":[["q","此等是如〈菩薩地〉說，以釋補滿而為宣說。"],["s","這個〈菩薩地〉上當中講得很清楚的，來解釋那個滿業的這個道理。所以我覺得這個地方，啊！那是菩薩、祖師的悲心啊，那個修行的方法，告訴我們這麼徹底、這麼圓滿哪！你這個基本精神能夠認識了，然後你在行相上面一配合的話，哇！馬上好。這個像引擎一樣，這個引擎樣樣都弄好了以後，然後你把它輪胎、殼子一加上去的話，嗨！走得個快，走得個快。你們有沒有看見馬路上，有的時候那個車子出來的時候，單單一個車子的頭，然後呢坐在這地方一個駕駛，那個車身都沒有的，它為什麼啊？先試一下，只要那個車身好的話，然後把那個 ……不，不是那個車身，就是引擎如果好的話，把那個車身裝上去，馬上成功，對不對？是不是這樣啊？那麼對嘛！現在我們就是這樣，你只要把這個東西弄好了以後，然後你的行相一安上去的話，要學戒，戒馬上圓滿；要學定，定馬上得到，前面已經告訴我們很清楚了。為什麼我們現在學定學不到的？大家還記得不記得？在正修行當中，破除邪執當中說得這麼清楚啊！"]]},{"t":"61A 10:05","b":[["s","現在還有人問我說：「唉呀！我這個念佛怎麼老不一心不亂，該怎麼辦哪？」不在這裡的，我會詳詳細細告訴他；如果在這裡的人還問出這種話來的話，唉，這個人實在是沒救藥！或者他沒聽，是可能的。所以你只要回過頭去看看，得到三昧尚且這麼容易，何況你念個一心不亂呢！每一個地方，他內容已經告訴我們這麼清楚，次第這麼明白。好！現在我們了解了，哦，業的整個的原則；然後我們了解了以後，我們要求的是什麼，這個是特別我們應該知道；然後呢這些了解了以後，第三步應該："]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/021.mp3"},{"文":"第三思已進止道理中分二：一總示，二特以四力淨修道理。","口譯":"第三，思考業果之後要怎樣去惡行善，分兩點：一、總說；二、特別講用四種力量來清淨罪業的方法。","四家合註":"第三、思已進止道理中<span style='mso-tab-count:1'> <\/span>","合註白話":{"id":"17583","頁":486,"白話":"第三科、思惟之後行止的方法，分為：一、總括地指出；二、特別以四力淨化的道理。第一科分為八科：一、生起日日夜夜都要修持之心的方法；二、修持業果，只能藉由佛語來確切地認知的道理；三、空性顯現為業果的道理；四、如果不思惟業果，光是裝懂並沒有好處；五、而這也要檢視自己心續的道理；六、如此思惟之後，就會遮止惡行的道理；七、眼前被虛假的安樂所迷亂，最終會遭受損害的道理；八、依照前輩殊勝士夫的說法才合理。其中第一科：如同《入行論》所說：「確切地認知從不善因產生痛苦之果，而且我的心續都被此所充滿。因此，用怎樣的方法才必定能從中脫離？就像毒藥進入體內一般，我日日夜夜都只應思考這個問題。」又提到：「佛陀說一切善法的根本就是對此勝解的欲求，而這個勝解、欲求的根本，則是以信心作為欲求的所依，恆久地修習思惟黑白業之異熟果的這種相信業果的信心。」了解黑白業及果報之後，不能只停留在認知，應當反覆修持，因為這是至極隱晦的內容，所以極難獲得確切的認知。關於對此難以獲得確切的認知，格西博朵瓦也曾說：「空性還能藉由道理領會；最為深邃的是業果。」","注釋":["第三思已進止道理：即前頁316「思已正行進止之理」一科。","如《入行論》云：引文如石法師譯《入菩薩行·懺悔罪業品》作：「不善生諸苦，云何得脫除，故我當一心，日夜思除苦。」見《入菩薩行》，頁17；《丹珠爾》對勘本冊61，頁961。","唯應思惟此：法尊法師原譯作「理應思惟此」，今據藏文改譯。","又云：引文出自《入行論》。如石法師譯《入菩薩行·精進品》作：「佛說一切善，根本為信樂，信樂本則為，恆思業因果。」見《入菩薩行》，頁65；《丹珠爾》對勘本冊61，頁996。","極不現事：又名極隱蔽分、極隱蔽事。一般的凡夫無法以現量、事勢比量、極成比量了解，必須藉由聖言量成立，進而引生信許比量才能通達的法，即是極隱蔽分。由於不是一般的現量或推理所能了解，所以名為極隱蔽分。","格西博朵瓦亦云：引文出自《藍色手冊》。見《藍色手冊頌釋》，頁192，然與正文略有不同。"],"已校":true},"覺燈日光":null,"時":"61A 10:54","頁":142,"af":"61a","st":654,"et":710,"消文":[{"文":"了解了業果，現在我們怎麼照著去做。"},{"文":"第一是了解了以後整個地告訴我們該怎麼辦；第二步特別是要懺悔。"},{"類":"回扣","文":"中國天台、賢首講懺悔用十門，這裡用四門，開合雖然不同，內容是徹底圓滿。"}],"延伸":[],"逐字稿":[{"t":"61A 10:54","b":[["q","第三思已進止道理中分二："],["s","了解了這個，那麼我們怎麼照著去做了，怎麼照著去做。"]]},{"t":"61A 11:03","b":[["q","一總示，"],["s","第一是。第二"]]},{"t":"61A 11:06","b":[["q","二特以四力淨修道理。"],["s","第一個呢，了解了以後，整個地告訴我們，現在進一步我們應該怎麼辦。第二步特別是要懺悔。平常我們懺悔，中國平常一般講的，不管天台、賢首，是用十個次第，十門來說，現在他用四門來說，開合雖然不同，內容是徹底圓滿，這個講下去的時候，我們會講到它。現在先看一看，「總示」，說了解了這個，現在該怎麼辦。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/022.mp3"},{"文":"今初　如《入行論》云：「苦從不善生，如何定脫此，我晝夜恆時，理應思惟此。」","口譯":"現在講第一。如《入行論》說：「苦是從不善業生起的，要如何才能決定脫離這個苦？我日日夜夜、時時刻刻，都應當思惟這件事。」","四家合註":"如《入行論》云：「<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">定解<\/span>苦<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">果<\/span>從不善<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">因出<\/span>生，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">而我相續為之充盈，行<\/span>如何<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">方便得決<\/span>定脫此？<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如毒入腹，<\/span>我晝夜恆時，唯應思惟此。」","合註白話":{"same":21},"覺燈日光":null,"時":"61A 11:50","頁":142,"af":"61a","st":710,"et":763,"消文":[{"文":"苦是從惡業生起的，怎麼樣才能從苦當中透脫出來？苦透脫出來就是快樂了。"},{"文":"我們真正要求的就是這個，所以晝夜應該思惟這個道理，這才是我們現在真正要做的。"}],"延伸":[],"逐字稿":[{"t":"61A 11:50","b":[["q","今初　如《入行論》云：「苦從不善生，如何定脫此，我晝夜恆時，理應思惟此。」"],["s","哦！現在曉得了，苦是從惡業所生起的，那麼怎麼樣要想，怎麼樣才能夠從苦當中透脫出來呢？他沒說快樂，實際上，苦透脫出來嘛就是快樂了嘛，對吧？所以簡單來說，這是一個事情包括了的全部。我們現在真正要求的什麼？要求的就是這個嘛！所以我們晝夜應該思惟這個道理，這才是我們現在真正要做的呀！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/023.mp3"},{"文":"又云：「能仁說«勝解»，«一切善品本»，又此之根本，«恆修異熟果»。」","口譯":"《入行論》又說：「能仁（佛）說：勝解是一切善品的根本；而勝解的根本，是恆常修習（業的）異熟果。」","四家合註":"又云：「能仁說<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">於彼<\/span>勝解<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">之欲求<\/span>，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">是為<\/span>一切善品本，又<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">於<\/span>此<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">勝解或欲求<\/span>之根本，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">是以信心作為欲求之依，<\/span>恆<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">時<\/span>修<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">思惟黑白業<\/span>異熟果<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">之信解業果信<\/span>。」","合註白話":{"same":21},"覺燈日光":null,"時":"61A 12:43","頁":142,"af":"61a","st":763,"et":1307,"消文":[{"文":"勝解就是殊勝的見解，對這個道理產生決定正確的認識，不管人家說什麼，絕不動搖。"},{"文":"有了勝解，所有的善法都由此而來；勝解的根本是不斷修習「這個因感得這個果」的道理。"}],"延伸":[{"題":"勝解","組":[{"題":"勝解是決定不動搖","說":[{"類":"破","文":"有人說念佛好就念佛，說參禪好又參禪，說學教好又學教，弄了半天一無是處。"},{"類":"立","文":"對這個道理產生了決定正確的認識，不管他說什麼，絕不動搖，這個叫勝解。"}]},{"題":"佛法深廣遠超科學","說":[{"類":"例","文":"科學家理論了解得透徹，又經實驗驗證，所以有堅定不移的信心。"},{"類":"立","文":"科學方法本身正確，但只在它觀察的範圍內對；超過範圍沒有觀察到，這是科學真正的缺點。"},{"類":"喻","文":"科學像大海裡丟一張網，能撈到多少？佛法像太虛空，大海、地球、太陽系擺進去只是一點點。"},{"類":"立","文":"《楞嚴經》說「空生大覺海，如海一漚發」，虛空在覺性當中只是大海一個小泡泡。"}]},{"題":"從世俗諦引導認識勝義","說":[{"類":"立","文":"佛法有勝義諦、世俗諦兩面，分不開；從世俗諦引導我們了解勝義。"},{"類":"例","文":"大家眼睛好的共同看見的是正世俗；色盲看見的跟大家不一樣，那是錯誤的。"},{"類":"回扣","文":"這裡要勝解的是業感緣起：如此業因感如此果報。"}]}],"說":[{"類":"破","文":"有人說念佛好就念佛，說參禪好又參禪，說學教好又學教，弄了半天一無是處。"},{"類":"立","文":"對這個道理產生了決定正確的認識，不管他說什麼，絕不動搖，這個叫勝解。"},{"類":"例","文":"科學家理論了解得透徹，又經實驗驗證，所以有堅定不移的信心。"},{"類":"立","文":"科學方法本身正確，但只在它觀察的範圍內對；超過範圍沒有觀察到，這是科學真正的缺點。"},{"類":"喻","文":"科學像大海裡丟一張網，能撈到多少？佛法像太虛空，大海、地球、太陽系擺進去只是一點點。"},{"類":"立","文":"《楞嚴經》說「空生大覺海，如海一漚發」，虛空在覺性當中只是大海一個小泡泡。"},{"類":"立","文":"佛法有勝義諦、世俗諦兩面，分不開；從世俗諦引導我們了解勝義。"},{"類":"例","文":"大家眼睛好的共同看見的是正世俗；色盲看見的跟大家不一樣，那是錯誤的。"},{"類":"回扣","文":"這裡要勝解的是業感緣起：如此業因感如此果報。"}],"af":"61a","st":763},{"題":"一切善品本","組":[{"題":"見到因果自然不討便宜","說":[{"類":"喻","文":"討到一塊錢的便宜，賠出一萬塊，誰願意做？付出三塊錢，將來進來三億塊，大家拼命去爭都來不及。"},{"類":"立","文":"得到勝解，看清楚好是怎麼來的，自然所有善法都從這裡來。"}]},{"題":"自他共同越來越圓滿","說":[{"類":"破","文":"有人怕大家都搶著做好事，怎麼辦？"},{"類":"立","文":"布施的話人家得到好處，你也得到好處，跟世間你得我失完全不一樣。"},{"類":"下手","文":"布施讓給你了，我隨喜；我做了，你隨喜，絕對沒有一點虧欠。"},{"類":"回扣","文":"心清淨、田清淨、加行清淨，每一個地方都告訴我們清清楚楚。"}]}],"說":[{"類":"喻","文":"討到一塊錢的便宜，賠出一萬塊，誰願意做？付出三塊錢，將來進來三億塊，大家拼命去爭都來不及。"},{"類":"立","文":"得到勝解，看清楚好是怎麼來的，自然所有善法都從這裡來。"},{"類":"破","文":"有人怕大家都搶著做好事，怎麼辦？"},{"類":"立","文":"布施的話人家得到好處，你也得到好處，跟世間你得我失完全不一樣。"},{"類":"下手","文":"布施讓給你了，我隨喜；我做了，你隨喜，絕對沒有一點虧欠。"},{"類":"回扣","文":"心清淨、田清淨、加行清淨，每一個地方都告訴我們清清楚楚。"}],"af":"61a","st":1067},{"題":"恆修異熟果","組":[{"題":"起心動念無非業果","說":[{"類":"立","文":"勝解的根本是不斷修習這個因感這個果的道理，一天到晚思惟觀察，起心動念無非如此。"},{"類":"例","文":"想了半天休息一下，休息是精進當中必須的，所以腦筋停下來也還在精進當中。"},{"類":"立","文":"一天到晚在修習，進步自然神速，一天到晚歡喜，還會有苦惱嗎？"}]},{"題":"苦惱在沒有正知見","說":[{"類":"破","文":"勝解沒得到，正知見都沒得到，就空打妄想，然後找人聊天，張三長李四短，說完了下地獄。"},{"類":"立","文":"難得得到人身，最可惜莫大於此；懂得了，就步步可以上升。"}]}],"說":[{"類":"立","文":"勝解的根本是不斷修習這個因感這個果的道理，一天到晚思惟觀察，起心動念無非如此。"},{"類":"例","文":"想了半天休息一下，休息是精進當中必須的，所以腦筋停下來也還在精進當中。"},{"類":"立","文":"一天到晚在修習，進步自然神速，一天到晚歡喜，還會有苦惱嗎？"},{"類":"破","文":"勝解沒得到，正知見都沒得到，就空打妄想，然後找人聊天，張三長李四短，說完了下地獄。"},{"類":"立","文":"難得得到人身，最可惜莫大於此；懂得了，就步步可以上升。"}],"af":"61a","st":1187}],"逐字稿":[{"t":"61A 12:43","b":[["q","又云：「能仁說勝解，一切善品本，又此之根本，恆修異熟果。」"],["s","佛就告訴我們，說「勝解」 ─什麼叫勝解啊？就是殊勝的見解，這個見解是，不是平平常常，平常我們的一種見解被人家一說，「對啊！」我本來想這樣，被人家一說，「對呀！」這樣，心裡面就動搖了。有人告訴你，這個地方好，你就到這個地方；有人告訴你，那個地方好，你就到那裡去；有人說念佛好，你就念佛；等一下告訴你參禪好，你又參禪；到那時候告訴你學教好，你又學教，那你完了！不曉得弄了半天是一無是處。什麼叫勝解呢？就是你對這個道理，產生了決定正確的認識，不管他說什麼，絕不動搖，這個叫勝解。"]]},{"t":"61A 13:36","b":[["s","這是個心理狀態，這個心理狀態對善法也有勝解，對惡法也有勝解的。世間也有很多人喔，世間也有很多人，譬如說科學家，科學家他這種見解很強的，這個有他的道理。因為他認識的那個事情，都不僅僅說人家告訴他，而且他告訴他的這個理論，他了解得很透徹，不但理論很透徹，經過實驗，驗證這個理論的確實性，所以那個時候，他堅定不移的信心。"]]},{"t":"61A 14:08","b":[["s","那我們說起來，那這樣科學對了嗎？對相對的狀態當中，對的，因為他研究的時候，所研究的範圍，是在他那個範圍之內。所以科學所觀察的那個範圍之內，對的。超過這個範圍對不對？對不起，他沒有觀察到，科學之真正缺點在這裡。所以科學那個方法本身是正確的，這個跟佛學是完全一模一樣的。佛學的真正可貴，是用的方法本質上面完全一樣，但是它的內涵卻有絕大的不一樣 ─深、廣，完全不同、完全不同。這科學就像大海裡邊，丟一顆網下去，這個大海這麼大，你丟一顆網你能夠撈到多少？佛法不是，佛法像太虛空，把那個大海 ─不要說大海，把我們的地球、我們的太陽系，擺在太虛空當中，一點點哪！這個佛法的真正的深廣的量，這是我們要了解的。所以它在這個量當中，沒有一樣東西不清楚、不明白，那何況一個大海，何況一個地球，何況太陽系，何況銀河系！"]]},{"t":"61A 15:26","b":[["s","所以《楞嚴經》上面說，「空生大覺海，如海一漚發」，我們說十方虛空，這個十方的虛空是不得了啊！現在我們抬頭天空一看，說這個銀河系，這個銀河系，啊！可是在虛空當中，你只見到一點點，小得一點點對不對？所以那個虛空多大！可是在那個大覺海當中，這個覺性當中，這個空，在這個裡邊只是大海當中一個小泡泡。喏，佛法的深廣的程度是這個樣的，這是我們要了解的。所以我們真正能夠有幸而認識了佛法以後，哇！那這個時候對它產生的勝解，絕不動搖，這樣。"]]},{"t":"61A 16:10","b":[["s","可是佛法運用的時候，是有兩個面，一個是勝義諦，這個就是它最深的那一方面，另一個是世俗諦，世俗跟勝義分不開的喔！這個到後面再講。那麼它這個世俗，眼前我們引導我們的是什麼？從世俗諦上面引導我們，讓我們了解那個勝義。那個世俗有兩個，一個叫正的這個世俗，有一個呢 ……所謂世俗共同無錯識所承認的世俗，比如說，我現在看見這個，我眼睛好的，你眼睛好的，這個大家都看見，這個共同承認的，佛法講的世俗諦是根據這個來講的。然後呢我眼睛有毛病，那什麼色盲，你看見這個黃的，我看見那個青的，你們大家看見的都是青的，我看見黃的，那個對不起！我這個就是錯誤的，這個不對的。關於這個道理，我們以後慢慢地去講，慢慢地去講。這個地方只是說明了什麼？我們真正信解認識的道理，對它產生決定不移的正確的認識，不被其他一切動搖。現在這個地方要勝解的是什麼？業感緣起，如此業因感如此果報，彼此之間種種關鍵，這是前面整個的所講的。"]]},{"t":"61A 17:47","b":[["s","你了解了這個，什麼？「一切善品本」，這個道理就很清楚、很明白了，所有的善法根本。因為你要求好嘛！然後呢因為你得到了勝解，你曉得這個好怎麼來的啊？有這樣的因嘛！你看得很清楚。所以到了那個時候，叫你討一點便宜，你絕不要討，「哎呀！不要討，討它幹什麼？我討到了一塊錢的便宜，賠出了一萬塊錢，誰願意做這個事情啊？」反過來說，人人願意去盡力，你很清楚明白，今天我盡了三分的力，或者說是付出了三塊錢的代價，將來進來三億塊錢，大家拼命去爭都來不及。現在那個商場當中稍微有一點的好處，大家打開頭了，現在這個好處是無量無邊哪，那自然人人好啊！"]]},{"t":"61A 18:44","b":[["s","不過這個地方也許有人說：「喔唷，這個樣的話，大家打開頭的話，怎麼辦哪？」你不要怕，佛法的妙是妙在這個上頭，你布施的話，人家也得到好處，你也得到好處，跟世間完全不一樣的。世間的事情，你得到了好處，人家沒有的，這樣。所以這個非常簡單，你只要照著佛法去做的話，一定是自他共同越來越圓滿。儘管說這個布施讓給你了，那我得不到了，我隨喜呀，這不是一樣嗎？反過來說，我做了，你隨喜呀！那的的確確，絕對是沒有一點點虧欠，你做也好是你不做也好。所以他說，心清淨、是田清淨、是加行清淨，而清淨當中每一個地方，告訴我們這麼清清楚楚、明明白白。清楚嗎？"]]},{"t":"61A 19:47","b":[["s","所以這個地方說，佛告訴我們勝解是一切善品本哪！那這個勝解怎麼來的？嘿！「此之根本」是「恆修異熟果」。哦，就是這個，就告訴我們不斷地去修習這個道理。異熟果是什麼？這個因感得這個果，就是這個道理。要怎麼辦呢？「恆修」。現在我們才了解了：噢，原來這個才是我們真正修行的啊！所以一天到晚思惟觀察，起心動念無非是如此，這樣。哪怕你休息了，他後面告訴我們的，休息了，你想了一下：「咳！我已經想了半天了，精進，修學佛法最重要的是精進，現在呢想過了休息一下，這個是精進當中必須要的。」所以你腦筋停下來的時候，它還在精進當中。然後停下來，緊跟著又再修行，還在精進當中。所以一天到晚在修習，所以這個進步是自然神速。到那個時候，你說你腦筋裡一天到晚這麼思惟，一天到晚歡喜，還會有苦惱嗎？當然沒有啊！"]]},{"t":"61A 21:10","b":[["s","所以我們現在所以苦惱的原因在哪裡呢？就是沒有這個。不要說勝解沒有得到，正知見都沒得到。正知見都沒得到，那你怎麼去想些什麼？空打妄想，打得無聊，然後最好找一個人聊聊天，害了。然後呢，張三長，李四短，專門說那種事情，難得得到的這個人身，說完了下地獄，唉，這是最可惜的是莫大於此啊！現在我們好高興喔，懂得了，現在就步步可以上升。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/024.mp3"},{"文":"謂既了知黑白業果，非唯了知即便止住，應數修習，以此是為«極不現事»，極難獲得決定解故。","口譯":"意思是：既然已經了知黑業、白業的果報，不是只要了知就停在那裡，而應當數數修習；因為這是極不現見的事，極難獲得決定的信解。","四家合註":"謂既了知黑白業果，非唯了知即便止住，應數修習，以此是為極不現事，極難獲得決定解故。<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">於此難得定解者，格西博朵瓦亦云：「空性猶可以理知解，極甚深者厥為業果。」<\/span>","合註白話":{"same":21},"覺燈日光":null,"時":"61A 21:47","頁":142,"af":"61a","st":1307,"et":null,"消文":[{"文":"懂得黑業白業感這樣的果，不是懂了就停在這裡，應該數數修習。"},{"類":"回扣","文":"怎麼修習法，前面修習軌理講過；聞、思各階段的次第一點都不可亂，前面沒聽的非補聽不可。"},{"文":"「極不現事」，不是眼前可以觀察得到的。"}],"延伸":[{"題":"極不現事","組":[{"題":"看不見的靠數數修習","說":[{"類":"例","文":"空氣你看不見、細菌你看不見，科學家看見了，所以你對他服服貼貼。"},{"類":"立","文":"只是看見這麼小一點點，他為什麼得到？數數修習呀！"}]},{"題":"世間成功尚有條件","說":[{"類":"例","文":"紐約念書的中國學生分秒必爭；麻省理工的學生一天一夜除了吃飯沒有一刻不用功。"},{"類":"破","文":"出了家說要做人天師範，吃過早飯在那裡睡大覺、說閒話，這個不相應。"},{"類":"立","文":"世間這麼簡單的事尚且要花這麼大努力，何況佛法的三世因果，所以要不斷數數思惟修習。"}]},{"題":"對治習性慣性的力量","說":[{"類":"立","文":"為什麼得不到決定解？以前的習性、慣性留在這裡，有一種力量。"},{"類":"下手","文":"一定要努力把慣性的力量對治、擋住，那時候可以扭得過來。"},{"類":"立","文":"前面覺得好辛苦，一旦真正淨化的時候，會有豁然開朗之感。"},{"類":"回扣","文":"所以下面馬上告訴我們懺悔。"}]},{"題":"如理是根本・思惟是圓滿","說":[{"類":"破","文":"不如理少想為妙，想的都是妄想，越想越錯，還覺得我有道理，增長的都是墮落的業。"},{"類":"立","文":"如理是根本因，不斷地思惟是圓滿因，兩樣具足，就對業果產生決定的勝解。"}]}],"說":[{"類":"例","文":"空氣你看不見、細菌你看不見，科學家看見了，所以你對他服服貼貼。"},{"類":"立","文":"只是看見這麼小一點點，他為什麼得到？數數修習呀！"},{"類":"例","文":"紐約念書的中國學生分秒必爭；麻省理工的學生一天一夜除了吃飯沒有一刻不用功。"},{"類":"破","文":"出了家說要做人天師範，吃過早飯在那裡睡大覺、說閒話，這個不相應。"},{"類":"立","文":"世間這麼簡單的事尚且要花這麼大努力，何況佛法的三世因果，所以要不斷數數思惟修習。"},{"類":"立","文":"為什麼得不到決定解？以前的習性、慣性留在這裡，有一種力量。"},{"類":"下手","文":"一定要努力把慣性的力量對治、擋住，那時候可以扭得過來。"},{"類":"立","文":"前面覺得好辛苦，一旦真正淨化的時候，會有豁然開朗之感。"},{"類":"回扣","文":"所以下面馬上告訴我們懺悔。"},{"類":"破","文":"不如理少想為妙，想的都是妄想，越想越錯，還覺得我有道理，增長的都是墮落的業。"},{"類":"立","文":"如理是根本因，不斷地思惟是圓滿因，兩樣具足，就對業果產生決定的勝解。"}],"af":"61a","st":1386}],"逐字稿":[{"t":"61A 21:47","b":[["q","謂既了知黑白業果，非唯了知即便止住，應數修習，以此是為極不現事，極難獲得決定解故。"],["s","所以這個大師這個地方特別告訴我們，說，哦！我們現在前面了解了，這個黑業白業感這樣的果啊，但是不是說你懂得了就停在這裡，應該怎麼樣？數數修習。這個地方講的修習，怎麼修習法，你們現在了解了吧！所以說凡是前面沒有補聽的人，非聽不可，要不然你還不曉得什麼修行。他前面告訴我們修行的方法，了解嗎？這是我為什麼上一堂我特別告訴你們的，你們趕快把它聽。你們不想學的人，那沒關係，反正是意思、意思，如果你們想學的，前面這個根本沒有的話，根本談佛法始終在門外，這個要注意。他告訴我們每一個地方的修習，什麼條件，什麼程度應該修的，說聞的階段如何，思的階段是如何，聞又是怎麼樣從聞得聞慧，從思得思慧，它那個次第是一點都不可亂的。"]]},{"t":"61A 23:06","b":[["s","為什麼要這樣做呀？以這個事情「極不現事」，它不是你眼前可以觀察得到的，不是眼前可以觀察得到的。其實這件事情很容易，我們不要說佛法上面的確，這科學上頭的事情，為什麼科學家會這樣值得我們的讚歎？他就是能夠把不眼前 ─眼前看不到的事情，他能夠看得見，而且說得清清楚楚。我們人人在這個地方大家透氣，空氣你看見了嗎？你看不見，欸，但是他看見了，所以讓你服服貼貼喔！你生了病，他說有細菌，你看見了嗎？你看不見，欸，但是他有，他看見了，所以那個藥給你吃進去，那個針打進去，弄好了，你就對他服服貼貼，對不對？只是看見這麼小一點點哦！他為什麼得到？數數修習呀！"]]},{"t":"61A 24:11","b":[["s","你們沒有看見那個世間真正念書的人，實際上所以啊 ……其實我們還是看見了，說現在這個地方很競爭，我們常常說：「哎呀，現在我們這個地方的競爭啊 ……！」就好像只有我們這裡的，其實你們沒有到國外去，你如果一去的話，你曉得：啊！這個紐約，那個時候我頭上那個時候，一段時候在紐約。我雖然沒念書，後來我看見了，我聽他們說，他們那個競爭的劇烈是不得了地厲害啊！"]]},{"t":"61A 24:42","b":[["s","所以有一件事情，不曉得你們聽說過，愛因斯坦，你們大家聽說過對不對？他發明了相對論以後，他自己曾經說過，世界上最厲害的人，他覺得猶太人最怕的─中國人，這個有道理的。的的確確千萬有道理的，不但人口多，而且聰明才智之士非常多。這個話，愛因斯坦我也不認識他，我也沒有看見過他，但是我在紐約那一段時候，那兒有很多信徒，有的中國人，有幾個非常用功的念書的人，他就說在學校裡面的競爭最強烈的對手，都是那些猶太人，猶太人最怕的是中國人。他說那美國大佬通常都是不大用功的，然後他告訴我，我一聽他們用功的情況，我真是嚇了一大跳，我已經覺得在我們這地方這是用功的情況。他也是個非常虔誠的信佛的佛弟子，他每兩個禮拜還要到廟裡來一趟，他廟裡來了以後，一定還拿了幾本書，弄完了以後，他自己一定跑到閣樓上去忙看著這個書的。我從來沒有看見過真正這樣分秒必爭的人，就是這樣，然後他就告訴我那地方的競爭的情況。"]]},{"t":"61A 25:57","b":[["s","以後有一次我到波士頓去，這個麻省理工學院，不曉得你們聽說過，這個世界最精采的第一流學府，在座的如果念過書的人，或者尤其是理工的大家都曉得。那一次，我去的時候，住在那個麻省理工學院的宿舍裡邊，隔壁房間裡邊有一個中國人，我難得的看見一個中國人，我倒想去打一個招呼，後來始終不敢進去。他的門開在那裡，我偶然跑過去看看他。他一個人，他們那個設備很好，那個學生一個人一個大房間，幾張桌子，他那個桌子上也攤滿了圖，他拿了筆 ……我在那兒住了個一天一夜，我就是除了吃飯以外，我沒有一個時候看見他不在那用功。他忙累了，然後呢跑出去，他們是運動，奔啊、忙啊，這樣花這麼大的精力啊！所以那個時候我想，哦，原來世間樣樣東西的成功有它的條件哪！"]]},{"t":"61A 26:56","b":[["s","各位都是作在家人過來的，你們不妨現在看看那個在家人忙得什麼程度。現在我們出了家了，說將來我們要做人天師範，然後呢，我們說起來，說：「喔唷，我們早晨一大早起來！」然後起來了吃過了早飯，在那裡睡大覺，不睡大覺在那兒說閒話。這個不相應，這個不相應啊！這是我這個地方特別說明。"]]},{"t":"61A 27:21","b":[["s","所以說世間這麼簡單的事情，你要他發明的時候，尚且要花這麼大的努力，何況是佛法的三世因果，它不是那麼容易明白地現起的，所以它要不斷地數數思惟修習。你能夠這樣的話，你一定能夠獲得決定的見解，這個你不要怕，這個都是經驗，這個都是經驗。所以，馬上下面會告訴我們就懺悔。它為什麼我們得不到呢？因為以前的習性，留在這個地方，它那個習性、慣性它有一種力量，這樣。你一定要努力去把它那個慣性的力量對治，擋住了，那個時候，你可以扭得過來。真正扭過來的時候還很有意思，你前面自己覺得好辛苦喔，不曉得什麼時候；但是你一旦真正淨化的時候，它會有豁然、豁然開朗之感，那麼這一點，我們要了解的。"]]},{"t":"61A 28:24","b":[["s","所以這幾句話，大家牢牢記在心裡面，趁現在難得這個暇滿的人身，要如理思惟，包含兩樣東西：第一個如理，第二個思惟。不如理你還是少想為妙，想的都是打的妄想，越想越錯，你還覺得我有道理，他沒道理，一天到晚在想那些念頭，你是越想越糟，你增長這個業都是可怕的墮落的業。雖然你不想的，含含糊糊，將來像墮落畜生一樣，豬、像蚌一樣，但是比下地獄還要好一點。所以這個裡邊要兩樣東西 ─如理、思惟，而如理是根本因，然後呢不斷地思惟是圓滿因，這兩樣東西，那就成了，你就可以對於這個產生決定的勝解。"]]},{"t":"61A 29:23","b":[["q","此復如《三摩地王經》云：「設月星處皆墮落，具山聚落地壞散，虛空界可變餘相，然尊不說非諦語。」"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/025.mp3"},{"文":"此復如《三摩地王經》云：「設月星處皆墮落，具山聚落地壞散，虛空界可變餘相，然尊不說非諦語。」","口譯":"這也就像《三摩地王經》說的：「就算日月星辰都掉下來，有山有村莊的大地都崩壞散掉，虛空都能變成別的樣子，佛也絕不會說不真實的話。」","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、修習業果唯如佛語定解之理者：<\/span><i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">於彼獲得定解方便，亦唯觀待於信解如來之語，其道理者，<\/span>此復如《三摩地王經》云：「設月星<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">從自<\/span>處皆墮落<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">於地<\/span>，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此<\/span>具山聚落<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">大<\/span>地<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">忽如糟粕團破裂<\/span>壞散，虛空界可變餘<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">地等實物之<\/span>相，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">容有此事否？雖不容有，<\/span>然<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">縱容有此等諸事，佛薄伽梵<\/span>尊不說非諦語<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">或不容說，此為有力假設<\/span>。」","合註白話":{"id":"17653","頁":488,"白話":"第二科、修持業果，只能依照佛語來確切地認知的道理：對此獲得確切認知的方法，也唯有仰賴於相信如來的法語。因此其中的道理，這也如同《三摩地王經》所說：「即使星月從自己的所在位置墜落於地，承載著山嶽、城市的大地就像酒糟團碎裂一般忽然崩塌，虛空界也轉變成土地等其他事物的樣貌——這些可能發生嗎？雖然不可能，但是縱然這些都成為可能，佛世尊您也絕不會說出不真實的話，不可能這麼說。這是一種有力的假設。」應當修持對如來法語的信心，因為如果對此沒有獲得不假造作的確切認知，則對任何正法都不會獲得佛陀所歡喜的確切認知。另外，對於開示業果的經典，解釋如來意旨的大師們，也都視同世尊言如其實地宣說的教言一般，不另外宣說其用意與目的，而視為言如其實的了義。","注釋":["第二修習業果唯如佛語定解之理者：即前頁472「修習業果唯依佛語定解之理」一科。","《三摩地王經》云：引文高齊那連提耶舍譯《月燈三昧經》作：「假使虛空星宿落，地海城邑悉壞滅，虛空無為性變異，如來終無不實語。」見《大正藏》冊15，頁565；《甘珠爾》冊55，頁113。","糟粕團：用酒渣作成之摶食，結構鬆軟，容易散裂。糟粕，酒之渣滓。細分之，則沉者曰糟，浮者曰粕。粕，音若「魄」。","決定信解：藏文直譯為「決定、定解」，下文亦同。","如言可取：可以如同文詞字面所說的內容執取，即是如言可取。","密意所依：字面所說的內容不是講說者真正想要表達的意涵，而是有更深的意思隱含在其中，所隱含的更深意思即是密意所依。","了義：此處指可以如言而取的意涵，即是了義。"],"已校":true},"覺燈日光":null,"時":"61B 00:03","頁":142,"af":"61b","st":3,"et":41,"消文":[{"文":"月亮、星可以墮落，像山一樣堅牢的地方可以徹底敗壞，乃至虛空可以變；但世尊絕對不說一點不實在的話。"},{"文":"任何東西可變，這個道理絕對不變，我們要信得過。"}],"延伸":[],"逐字稿":[{"t":"61B 00:03","b":[["q","此復如《三摩地王經》云：「設月星處皆墮落，具山聚落地壞散，虛空界可變餘相，然尊不說非諦語。」"],["s","經上面告訴我們：月亮、星都可以墮落，然後呢，像山一樣堅牢的地方，它可以徹底地敗壞，乃至於虛空可以變成其他的，所以這些東西都不可能變化的都可以變，但是世尊絕對不會說一點點不實在的話。這個就是告訴我們，前面這個話，那千真萬確，任何東西可變，這個道理是絕對不變，我們要信得過。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/026.mp3"},{"文":"«於如來語，應修深忍»，","口譯":"對於如來的話，應當修習深忍（深深地忍可、信受）。","四家合註":"於如來語，應修深忍，","合註白話":{"same":25},"覺燈日光":null,"時":"61B 00:41","頁":142,"af":"61b","st":41,"et":91,"消文":[{"文":"師父連唸三聲「於如來語應修深忍」。"},{"文":"61B 06:19 師父隔天開講，先補充前天講的等流；09:13「請翻到一百四十二頁」，再唸一遍「於如來語，應修深忍」（下一堂(十六)從 61B 10:54 接著播）。"}],"延伸":[{"題":"於如來語，應修深忍","組":[{"題":"信佛不如信算命","說":[{"類":"破","文":"一切諸佛的妙智，在我們的感受上不如醫卜星象的人：算命先生、醫生、科學家、普通人說的都信得過，佛講的說時代不同啦。"},{"類":"立","文":"所以把這句話連唸三聲。"}]}],"說":[{"類":"破","文":"一切諸佛的妙智，在我們的感受上不如醫卜星象的人：算命先生、醫生、科學家、普通人說的都信得過，佛講的說時代不同啦。"},{"類":"立","文":"所以把這句話連唸三聲。"}],"af":"61b","st":41},{"題":"一刀斬斷等流","組":[{"題":"念佛參禪持戒，都在斷等流","說":[{"類":"回扣","文":"前天講的等流：念佛、參禪、持戒的人都不跟你講等流不等流。"},{"類":"立","文":"教你念佛眼前一切不管，參禪什麼都不管，持戒自淨其意：前面境界來的就是異熟等流，到時候一刀斬斷。"}]},{"題":"懂了道理，用時得心應手","說":[{"類":"立","文":"道理沒講清楚，照著做也可以；道理了解清楚了，用的時候得心應手。"},{"類":"喻","文":"學會開車就去開，萬一半路拋錨，曉得什麼毛病怎麼弄就好了。"}]}],"說":[{"類":"回扣","文":"前天講的等流：念佛、參禪、持戒的人都不跟你講等流不等流。"},{"類":"立","文":"教你念佛眼前一切不管，參禪什麼都不管，持戒自淨其意：前面境界來的就是異熟等流，到時候一刀斬斷。"},{"類":"立","文":"道理沒講清楚，照著做也可以；道理了解清楚了，用的時候得心應手。"},{"類":"喻","文":"學會開車就去開，萬一半路拋錨，曉得什麼毛病怎麼弄就好了。"}],"複習":true,"af":"61b","st":379}],"逐字稿":[{"t":"61B 00:41","b":[["q","於如來語，應修深忍，"],["s","於如來語應修深忍哪！於如來語應修深忍哪！於如來語應修深忍哪！記得前面這句話嗎？我們現在對於諸佛的妙智，一切諸佛的妙智啊，在我們的感受上面，不如一個醫卜星象的人哪！哦，這個算命先生告訴你這樣的，我相信得過他；這個醫生怎麼說的，我信得過他；然後世間的科學家，信得過他；乃至於普通人告訴你，你不要這樣，我信得過他。佛講的話，說：「唉呀！現在這個時候時代不同啦，不要這個樣啦！」所以我把上面這個話，連唸三聲就是這個道理。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/027.mp3"},{"文":"若未於此獲得真實決定信解，任於何法，悉不能得，勝者所愛，決定信解。","口譯":"如果對業果沒有真正確定的信解，不管修什麼法，都得不到佛所歡喜的那種確定信解。","四家合註":"若未於此獲得真實決定信解，任於何法，悉不能得勝者所愛決定信解。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此復開示業果諸經，造釋密意諸論主，皆視如世尊所說如言可取之語，不更述餘密意所依以及所為，執為了義如言可取。<\/span>","合註白話":{"same":25},"覺燈日光":null,"時":"61B 01:31","頁":142,"af":"61b","st":91,"et":149,"消文":[{"文":"對這道理要有正確、實在的認識，這是如理；經過思惟觀察，產生決定不移動的信解。"},{"文":"得不到這個，不管說什麼法都沒有用：心沒有深忍，碰一點事就動搖。"},{"類":"例","文":"聽的時候滿好，下了課耳朵一聽見別的，不曉得跟到哪裡去了。"}],"延伸":[],"逐字稿":[{"t":"61B 01:31","b":[["q","若未於此獲得真實決定信解，任於何法，悉不能得，勝者所愛，決定信解。"],["s","假定對於這個道理，沒有得到真實的 這個最重要喔 正確而實在的認識，然後這個認識還要決定的認識。正確、實在這是如理，經過了思惟觀察的產生決定不移動的信解。你如果得不到這個的話，那麼，「任於何法」，不管你說什麼法，都沒有用。為什麼？心情沒有深忍，一碰、碰一點事情就動搖了，聽的時候滿好，下了課等一下耳朵一聽見別的，不曉得跟到哪裡去了，這個沒有用，這個我們要主要注意的！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/028.mp3"},{"文":"如有一類，說於空性，已獲決定，然於業果無決定信，不慎重者，是乃«顛倒了解空性»。","口譯":"例如有一類人，說自己對空性已經獲得決定，然而對業果卻沒有決定的信心，因此不慎重（取捨），這就是顛倒了解空性。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第三、空性現為業果之理者：<\/span>如有一類，說於空性已獲決定，然於業果無決定信，不慎重者，是乃顛倒了解空性；<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">善<\/span>解<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">非自性成立之<\/span>","合註白話":{"id":"17722","頁":490,"白話":"第三科、空性顯現為業果的道理：有人聲稱對空性獲得確切的認知，但是對業果卻沒有確切認知，而且不予重視，這是顛倒地理解空性。因為如果善加領會自性不成立的空性，就會將此空性視為雖然自性不成立，卻是在名言中，僅依靠各自的因緣而安立的緣起的內涵，進而成為對業果生起確切認知的助力。這本經中說：「萬法好似幻化、水泡、陽焰以及閃電，一切諸法就如水中的月影，雖然顯現為月亮，卻不成立為月亮一般，雖然顯現為諦實，卻不成立為諦實。」這是開示法無我。「死亡以後邁向來世的〔有情、意生、儒童等，經典中說是不同的稱呼。〕他們固然自性不可得。」這是開示補特伽羅無我。「雖然像這樣沒有自性，但是造了善惡業卻不會歸於空無，也不會與未造集的業相遇，因為會按照黑白因而分別成熟為苦樂果報。這種空與業果緣起二者相輔相成的正理之門相當奧妙而隱微，愚夫難以現前看見，只能是佛陀的現前所行境。」","注釋":["即彼經云：彼經即指《三摩地王經》。高齊那連提耶舍譯《月燈三昧經》作：「猶如泡沫及炎電，諸法亦如水中月。眾生壽命不可得，於此界沒他世生，所作之業無失壞，黑白業報亦不亡。因果相應勝法門，微細難見佛境界。」見《大正藏》冊15，頁575；《甘珠爾》冊55，頁170。","意生：心意所生或心意的自性所生，為「有情」的別稱。藏文中「意」字有心意與力量兩種意思。","儒童：有情的另一種稱呼。劫初的人愚癡無知，只是具有心識而已，所以命名為有情。之後心智漸漸開化，則命名為儒童等，表示心智開始成長。至今此詞泛指有情。","經中說為異名：相應段落參見唐玄奘大師譯《大般若波羅蜜多經．無雜法義品》云：「觀察忍者，謂諸菩薩摩訶薩作是思惟：『諸行如幻、虛妄不實、不得自在，亦如虛空無我、有情、命者、生者、養者、士夫、補特伽羅、意生、儒童、作者、受者、知者、見者皆不可得，唯是虛妄分別所起。』」見《大正藏》冊6，頁953；《甘珠爾》對勘本冊24，頁825。","現前行境：現前識的所行境界。即不是透過分別心的影像，而是以眼等現前識清晰觀見的境界。"],"已校":true},"覺燈日光":null,"時":"61B 02:29","頁":142,"af":"61b","st":149,"et":274,"消文":[{"文":"有人說見到了空性，但對業果沒有決定信，所以不認真去做，這種人了解的空性是顛倒的。"}],"延伸":[{"題":"顛倒了解空性","組":[{"題":"越見空越慎重業果","說":[{"類":"例","文":"田雞和尚說「老僧兩腳一盤，什麼都空掉了」，所以要吃田雞；人家說他樣樣都空，田雞不空。"},{"類":"破","文":"我們自己兩腳一盤空得掉嗎？腰也痠背也痛，不是昏沈就是妄想。"},{"類":"立","文":"不要說空了什麼都不管；他越空，那是越管。一切法因果緣起、沒有自性，有什麼因什麼緣，感什麼果。"},{"類":"立","文":"「佛種從緣起」，沒有「天生彌勒，自然釋迦」，所以越了解是越謹慎。"}]}],"說":[{"類":"例","文":"田雞和尚說「老僧兩腳一盤，什麼都空掉了」，所以要吃田雞；人家說他樣樣都空，田雞不空。"},{"類":"破","文":"我們自己兩腳一盤空得掉嗎？腰也痠背也痛，不是昏沈就是妄想。"},{"類":"立","文":"不要說空了什麼都不管；他越空，那是越管。一切法因果緣起、沒有自性，有什麼因什麼緣，感什麼果。"},{"類":"立","文":"「佛種從緣起」，沒有「天生彌勒，自然釋迦」，所以越了解是越謹慎。"}],"af":"61b","st":185}],"逐字稿":[{"t":"61B 02:29","b":[["q","如有一類，說於空性，已獲決定，然於業果無決定信，不慎重者，是乃顛倒了解空性。"],["s","下面舉個例子，像下面這一類人，說有的人說對於空性已獲決定的 ……他獲得決定，乃至於說：「噢喲！見到了空性了。」他見到了空性，但是對於業果卻沒有決定信，而因為對業果沒有決定信，所以不去認真地去做，「不慎重」，這種人對於了解的空性是顛倒的。"]]},{"t":"61B 03:05","b":[["s","上一次我們說過田雞和尚的公案，大家還記得對不對？他說：「老僧兩腳一盤，什麼都空掉了。」所以他要吃田雞。所以人家說他：「你樣樣都空掉了，田雞不空。」其實他只是歡喜吃田雞，如果歡喜別的，他樣樣不空耶！現在這個人兩腳一盤樣樣都空掉了，請問我們自己問問：你兩腳一盤你空得掉嗎？你兩腳一盤是胡思亂想，腰也痠，背也痛，腦筋裡不是昏沈，就是妄想。他到了這個程度，還不可以，我們連他皮毛都沒有的就不管了，請問你修學佛法，怎麼修起啊？所以他舉這個道理，是對我們是最大的警惕的。"]]},{"t":"61B 03:53","b":[["s","所以我們不要說：「啊，空了、空了！什麼都不管。」他越空，那是越管，為什麼？了解一切法的的確確是因果緣起，沒有本質的自性，既然一切都是因果緣起，你有什麼因什麼緣，感什麼果呀！所以，「佛種從緣起，是故說一乘。」都是看你的什麼因，什麼 ……沒有天生來的這樣的東西啊，沒有「天生彌勒，自然釋迦」！所以他越了解是越謹慎啊，這個道理就在這地方。所以下面說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/029.mp3"},{"文":"解空性者，謂即見為緣起之義，是於業果發生定解為助伴故。","口譯":"（因為）真正了解空性，就是見到（一切法）是緣起的意義，這對於業果生起定解，是作為助伴的緣故。","四家合註":"空性者，謂即見<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">空<\/span>為<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">雖非自性成立，然名言中唯依自因緣假立<\/span>緣起之義，是於業果發生定解為助伴故。即彼經云：「<span class=\"sjan sj-ba\">『<\/span>一切諸法<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">猶<\/span>如水<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">中之<\/span>月<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">雖顯現為月，然月不成立；諸法<\/span>等於幻泡陽燄電，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">雖現諦實，然無諦實』，此顯示法無我。『<\/span>雖諸死已往他世，<span class=\"sjan sj-ba\">〔<\/span>有情意生<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">與儒童等，經中說為異名。〕其自性<\/span>不可得。<span class=\"sjan sj-ba\">』<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此顯補特伽羅無我已，如是雖無自性，<\/span>然作諸<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">善不善<\/span>業終不失，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">或未造亦不遇，<\/span>如其黑白<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">因，如是別別<\/span>成熟<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">苦樂<\/span>果，如此<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">空與業果緣起二者，一一互為助伴之<\/span>理趣門賢妙，微細<span class=\"sjan sj-ba\">、<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">愚夫<\/span>難<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">現<\/span>見<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">唯<\/span><span>是<\/span>佛<span>之<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">現前<\/span>行境。」","合註白話":{"same":28},"覺燈日光":null,"時":"61B 04:34","頁":142,"af":"61b","st":274,"et":654,"消文":[{"文":"真正了解空性就是見到緣起：因為空，所以緣起；因為緣起，所以空。"},{"類":"例","文":"桌子是木頭、鋼鐵，有人會做，弄成功了；眼前沒有一樣東西是天生來的。"},{"文":"見空正是見緣起，見緣起正是見空，跟業果定解相輔相成，是必然結果。"},{"類":"回扣","文":"記住「此是極不現事」：要如理了解、如法思惟觀察，才產生決定勝解；有了勝解，苦自然除，樂自然得。"}],"延伸":[],"逐字稿":[{"t":"61B 04:34","b":[["q","解空性者，謂即見為緣起之義，是於業果發生定解為助伴故。"],["s","真正了解空性的什麼？欸，就是見到「緣起」，因為空，所以緣起；因為緣起，所以空。它一切都是因緣條件存在，所以它是空。你說你現在能夠找得到一樣東西天生來的嗎？沒有，這張桌子怎麼做的？喏！樹，你把它拿下來，這是木頭做的；鋼鐵，是鋼鐵做的；你想要一張桌子，有一個人會做，弄、弄、弄成功了。眼前那一樣東西不是？就是這樣。所以他見空正是見緣起，見緣起正是見空啊！所以這一個空性，是正是跟這個「業果發生定解」，產生什麼？欸，「助伴」，那互相相輔相成，這個是必然結果，這是我們要了解的。"]]},{"t":"61B 05:29","b":[["s","關於這個概念，記住啊！記住！記住什麼？「此是極不現事」，這一個道理是絕端不那麼簡單，不是眼前我們憑空所能夠了解看得到的，你一定要如理地了解，然後呢如法地思惟觀察，那個時候才產生決定的勝解。有了這個勝解，一切的善法的根本是由此而來，得到了這個根本的話，苦自然盡除，樂自然得到。今天就到這裡為止。"]]},{"t":"61B 06:19","b":[["s","我們前天講的那個等流這個事情，那有的人說念佛的好像他也不講這個，參禪的也不講這個，我為什麼寫在這個上頭呢？那就是念佛的人講講一心念佛，他也從來不跟你講什麼是等流不等流，對吧？那麼參禪的人，或者看一個趙州還有 ……噢！趙州的公案說「狗子還有佛性也無？」無！現在日本人主要的是流行這個。中國人呢？參這個「念佛是誰？」看一個誰，我們中國現在的禪是看這個，禪宗是看這個。然後呢，持戒的人呢，主要的是，身莫作，口莫作，還要自淨其意，他也不跟你講這個。乃至於普通人，拿我們常常說：「你不要去虛妄分別。」對不對？現在人家一般講的修行是不是主要的就是這幾點，是不是這樣？還有沒有其他的？只要你們提出來，但願你們提出來，我都可以解答。"]]},{"t":"61B 07:22","b":[["s","請問：現在這個地方，不管是你哪一點 ……當你平常他教你念佛的時候，他教你怎麼念哪？你眼前一切都不管，對不對？是不是這樣的，是不是這樣說？對呀！參禪的人，也是教你什麼都不管；持戒的人，說對任何境界來的時候，你要內心淨那個意，是不是這個樣？這個是說明什麼？前面境界來的是什麼？就是你前面的異熟等流跑到我這地方來。他，如果有條件，他會源源本本告訴你，現在沒有條件了，說：「現在這個時候你只有念佛啦！你不要去管啦！」你聽得進，照著這個辦法去做，儘管道理沒有講清楚，但是用的是不是這樣？就是前面那個等流，前面來的，前面這樣來的你不管，到時候一刀斬斷，我一心念佛，參禪的亦復如是。自淨其意呢，前面來的是染污的，現在這個地方你不要去管它，你要淨它的意呀！清楚嗎？"]]},{"t":"61B 08:37","b":[["s","所以你不懂的時候，有人說：「他為什麼這樣講？你為什麼這樣講？」對呀！要真正要學，要好好地善學。然後你道理了解得非常清楚了，既然了解得非常清楚，你要去用的時候，得心應手嘛，這麼好法。就像你開車子一樣，是，你只要學會了開車，你就不管去開，可是萬一到那時候車子出了毛病，對不起！半路上拋錨你就一點辦法都沒有。欸，那時候你曉得什麼毛病怎麼弄，那就好啦！所以這個簡單說明一下，加強大家的信心。"]]},{"t":"61B 09:13","b":[["s","請翻到《菩提道次第廣論》一百四十二頁，我們已經了解了一切苦樂的原因，一切苦樂都不是偶然的，絕對有它的因感果，這個必然關係都了解了。那麼經過了這樣認識了以後，下面應該怎麼辦？說「思已進止道理」，那麼這個地方呢，就先總括地，整個的綱要說一下。昨天說到空性，這個再唸一遍，說「於如來語，應修深忍」，對於佛陀告訴我們最正確的教誡，這個就是法，因為真正地解脫痛苦，以及完成一切功德 ─無上菩提，正依止是法，如法行持，然後呢，分分斷證功德都由此而來。這個概念不但要認識，而且要經過深入地思惟觀察，產生殊勝的勝解，那個時候會深深地忍可於心。那麼這個深忍是什麼狀態呢？就是你起心動念之間，它一切時處，隨時它會現起來：「嗯！這個事情是這樣的，為什麼有這個果，一定有它的因。」同樣地，你現在起一念，你就立刻曉得，這一念將來感得什麼果，這樣的一個狀態，那個時候是得到了深忍信，那個時候是信心就堅強了。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-15/030.mp3"}],"投影片":[{"img":"投影片/shenxin-yeguo-15/001.webp","n":1},{"img":"投影片/shenxin-yeguo-15/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/shenxin-yeguo-15/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/shenxin-yeguo-15/004.webp","n":4},{"img":"投影片/she
