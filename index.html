"文":"「其最後」是各別的，所以這裡不談；現在是總思的時候，只說總的六種。"}],"延伸":[{"題":"親友書釋","組":[{"題":"處處說明師承","說":[{"類":"立","文":"古人著述立說，一字之差，明明曉得這個字錯了也不改，一定要找到原因；找不到根本不會改。"}]},{"題":"學佛菩薩，不是教佛菩薩","說":[{"類":"破","文":"我們動不動亂改，不但改字，還拿我們的想法去想概念。"},{"類":"立","文":"我們是百分之一百的凡夫，如果我們的概念正確，佛菩薩一點用場都沒有；我們變成教佛菩薩了。"}]},{"題":"圓滿師承，親自驗證","說":[{"類":"立","文":"聖者的著述一定有圓滿的師承，而且不只是聽見就對，一定要自己親自驗證。"},{"類":"例","文":"阿底峽尊者、宗喀巴大師都是三事具足，說出來的量百分之百正確。"}]}],"說":[{"類":"立","文":"古人著述立說，一字之差，明明曉得這個字錯了也不改，一定要找到原因；找不到根本不會改。"},{"類":"破","文":"我們動不動亂改，不但改字，還拿我們的想法去想概念。"},{"類":"立","文":"我們是百分之一百的凡夫，如果我們的概念正確，佛菩薩一點用場都沒有；我們變成教佛菩薩了。"},{"類":"立","文":"聖者的著述一定有圓滿的師承，而且不只是聽見就對，一定要自己親自驗證。"},{"類":"例","文":"阿底峽尊者、宗喀巴大師都是三事具足，說出來的量百分之百正確。"}],"af":"70b","st":705}],"逐字稿":[{"t":"70B 11:45","b":[["q","第二思惟六苦者。《親友書釋》宣說七苦，其最後者是別過患，故於此中當思六種。"],["s","這個六苦的來源，他，換句話說這個地方，處處地方說明這個師承，這點我前面說過很多次了。我覺得古人著述立說，他一字之差，明明曉得這個字錯了，他不改，一定要找到原因。然後呢他有說明的，這個是他想當中可能什麼，找不到根本不會改。我們現在動不動就是亂改，然後呢不但一個字改，然後概念拿我們的想法去想。我們實在是生死當中，百分之一百的凡夫，如果我們這種概念正確的話，那佛菩薩是一點用場都沒有。我們不是學佛菩薩，我們變成功教佛菩薩了，這一點大家要了解啊！"]]},{"t":"70B 12:45","b":[["s","雖然這個小地方，他處處地方說明了真正的聖者，他們的著述的立說，一定有他的圓滿的師承。而且這個師承不僅僅是說聽見就對哦，他一定要自己親自驗證。像本論的根本 ─阿底峽尊者，以及根據阿底峽尊者的藍圖造本論的宗喀巴大師，他都是三事具足哦！這個都是三樣東西都具足的。換句話說，他們說出來這個量本身的話，百分之百地正確。所以這一點他有這樣的說明，這個意義在這裡。「其最後」是各別的，所以這裡不談。那麼現在我們是總思的時候，所以這個裡邊只說它的總的六種。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/001.mp3"},{"文":"其中無定過患者。謂於生死流轉之時，父母等親，於他生中轉為怨敵，諸怨敵等轉成親屬，如是父轉為子，子轉為父。母轉為妻，妻轉為母等。唯是次第展轉流轉，是故全無可憑信處。","口譯":"其中第一，沒有定準的過患：在生死裡流轉的時候，這一世的父母親人，下一世會變成仇人；仇人又會變成親人。像這樣，父親變成兒子，兒子變成父親；母親變成妻子，妻子變成母親等等。就這樣一世一世不停地轉換，所以完全沒有可以靠得住的地方。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 13:54","頁":162,"af":"70b","st":834,"et":914,"消文":[{"文":"無定：沒有一定的。本來很親愛的，到下一生變成怨敵；本來怨敵，又變成親愛的。"},{"文":"「父轉為子」是顛倒，顛倒還是親；可是有很多怨家仇敵也轉過來了。"},{"文":"我們一天到晚「你跟我好、我跟你怨」，毫無意思；短短幾十年，下一次誰曉得誰是誰。"},{"文":"這都不是我們應該忙的事情；了解了，現在世間的親愛一切無可憑信。"}],"延伸":[],"逐字稿":[{"t":"70B 13:54","b":[["q","其中無定過患者。"],["s","是第一個，說這個沒有定，看看那個內容什麼叫無定呀？"]]},{"t":"70B 14:01","b":[["q","謂於生死流轉之時，父母等親，於他生中轉為怨敵，諸怨敵等轉成親屬，如是父轉為子，子轉為父。母轉為妻，妻轉為母等。唯是次第展轉流轉，是故全無可憑信處。"],["s","嗯，就是這個，沒有一定的。這個本來很親愛的，到下一生變成怨敵，本來怨敵又變成功親愛的。上面說「父轉為子」是顛倒，這個顛倒還是親，可是有很多怨家仇敵轉過來了。那我們是不是也一天到晚，唉呀，你跟我好，我跟你怨，是毫無意思、毫無意思。短短的幾十年完了以後，到下一次誰曉得誰是誰？這個時候都不是我們應該忙的事情，不是我們應該忙的事情。我們如果了解了這個，那一無可憑。所以我們第一了解，現在世間的親愛，一切無可憑信處啊！所以這些東西，「是故全無可憑信處」。《親友書》上面怎麼說呢？"]]}],"口譯音":"口譯音檔/siwei-kudi-05/002.mp3"},{"文":"《親友書》云：「父轉為子母為妻，怨仇眾生轉為親，及其返此而死歿，故於生死全無定。」即現法中亦復展轉，互為親怨。","口譯":"《親友書》說：「父親轉為兒子，母親轉為妻子，怨仇的眾生轉為親人，以及與此相反的情形，就這樣死去，所以在生死中完全沒有定準。」即使在現生之中，也同樣輾轉互為親人與怨敵。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 15:14","頁":162,"af":"70b","st":914,"et":945,"消文":[{"文":"不但在輪迴當中轉，現在也是一樣，這個千真萬確。"},{"類":"例","文":"以前的好朋友，到那時候反面成仇；以前兩個人不好，到那時候也有好得很的。"}],"延伸":[],"逐字稿":[{"t":"70B 15:14","b":[["q","《親友書》云：「父轉為子母為妻，怨仇眾生轉為親，及其返此而死歿，故於生死全無定。」即現法中亦復展轉，互為親怨。"],["s","不但在輪迴當中轉，那現在也是一樣的，這個千真萬確。欸，以前的好朋友，到那時候反面成仇；以前說不定兩個人不好，到那個時候，大家也有的好得很欸！處處地方都是這種。經上面："]]}],"口譯音":"口譯音檔/siwei-kudi-05/003.mp3"},{"文":"如《妙臂經》云：「有時怨敵轉為親，親愛如是亦為怨，如是一類為中庸，即諸中庸復為怨。如是亦復為親愛，具慧了知終莫貪，«於親當止愛分別»，於心善法安樂住。」","口譯":"如《妙臂經》說：「有時怨敵轉為親人，親愛的人也同樣會成為怨敵；像這樣，有一類會成為中庸（不親不怨）的人，而這些中庸的人又會成為怨敵，也會再成為親愛的人。有智慧的人了知這個道理，終究不會貪著；對於親人應當止息愛著的分別，令心安樂地住於善法。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 15:45","頁":162,"af":"70b","st":945,"et":1018,"消文":[{"文":"實際上一直在轉，真正有智慧的人對這個一無可貪。"},{"文":"平常最難捨的就是這個；了解了還有什麼好貪？應該停止貪愛的心，在法上面善安住，這是基本的。"}],"延伸":[{"題":"於親當止愛分別","組":[{"題":"淨化愛染，昇華為悲","說":[{"類":"立","文":"更進一步把這個東西昇華，變成大乘的。"},{"類":"破","文":"真正要寶愛，不是像現在世間的染污，這個沒有用。"},{"類":"立","文":"進一步幫人家去解決，就變成大乘：把愛的染污部分淨化了，好的部分昇華了，就變成悲。"}]}],"說":[{"類":"立","文":"更進一步把這個東西昇華，變成大乘的。"},{"類":"破","文":"真正要寶愛，不是像現在世間的染污，這個沒有用。"},{"類":"立","文":"進一步幫人家去解決，就變成大乘：把愛的染污部分淨化了，好的部分昇華了，就變成悲。"}],"af":"70b","st":990}],"逐字稿":[{"t":"70B 15:45","b":[["q","如《妙臂經》云：「有時怨敵轉為親，親愛如是亦為怨，如是一類為中庸，即諸中庸復為怨。如是亦復為親愛，具慧了知終莫貪，於親當止愛分別，於心善法安樂住。」"],["s","就是這樣，實際上一直在轉哪！真正地這樣轉來轉去，真正有智慧的人，所以對這個是一無可貪。因為平常我們最難捨的這個事情就是這樣，你了解了，還有什麼好貪？應該停止，停止啊！那麼停止了這個貪愛的心，怎麼辦呢？在法上面善安住，這個是基本的。實際上呢，他更進一步分進昇華這個東西，把它變成功大乘的。你既然是寶愛的話，真正要寶愛，不是像現在世間的染污，這個沒有用。你要進一步地幫忙人家去解決，那就變成功大乘。所以那個大乘的心的的確確，就把那愛的染污部分淨化了，把它好的那部分昇華了，就變成功悲呀！"]]}],"口譯音":"口譯音檔/siwei-kudi-05/004.mp3"},{"文":"如是修習，破於親怨分別黨類而起貪瞋，觀生死法，任何全無安心之處，應起厭離。","口譯":"像這樣修習，破除對於親、怨分別黨類而生起的貪與瞋；觀察生死之法，任何一處都完全沒有可以安心的地方，應當生起厭離。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 16:58","頁":162,"af":"70b","st":1018,"et":1046,"消文":[{"文":"這就是第一個：觀生死流轉當中，「全無」，一點點沒有憑信的。"}],"延伸":[],"逐字稿":[{"t":"70B 16:58","b":[["q","如是修習，破於親怨分別黨類而起貪瞋，觀生死法，任何全無安心之處，應起厭離。"],["s","這一點就是第一個，我們觀生死流轉當中，啊！「全無」，一點點沒有憑信的，沒有憑信的。第二，"]]}],"口譯音":"口譯音檔/siwei-kudi-05/005.mp3"},{"文":"無飽足過患者。","口譯":"無飽足的過患。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 17:26","頁":162,"af":"70b","st":1046,"et":1100,"消文":[{"文":"生死當中最大的行相是貪；貪而遇不到或者違背的時候，那是瞋。"},{"文":"無飽足：做任何事情永遠沒有飽足，不但沒有飽足，越做越厲害。"},{"類":"喻","文":"貪心重的人，像滾雪球一樣越滾越大；不管你怎麼樣，沒辦法飽滿它。"}],"延伸":[],"逐字稿":[{"t":"70B 17:26","b":[["q","無飽足過患者。"],["s","然後呢生死當中，最大的行相就是貪，當你貪而遇不到，或者違背的時候那是瞋。這一個情況叫「無飽足」，做任何事情永遠沒有飽足的，不但沒有飽足，越做越厲害，越做越厲害！這東西真是可怕極了，真是可怕極了！我想這個我們人人有經驗，有的人很多，也就是貪心比較淺的人，不一定感覺到；貪心重的人的確，你不管怎麼樣，啊！他在任何情況之下，這個東西的可怕，像滾雪球一樣越滾越大。一看見了，唉呀，到那時候只有除了這個以外就沒有了。但是不管你怎麼樣，你沒辦法飽滿它，它這個過患就是這樣。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/006.mp3"},{"文":"如云：「一一曾飲諸乳汁，過於四海於今後，隨異生性流轉者，尚須多飲過於彼。」謂當思惟一一有情，飲母乳酪昔飲幾許，今後若不學解脫道，當飲幾何。此是略喻，更當思惟生死之中，盛事苦事，無所未經，令心厭離。","口譯":"如說：「每一位有情曾經飲過的乳汁，超過四大海；從今以後，隨著凡夫的本性繼續流轉的人，還須再飲比那更多的乳汁。」就是應當思惟：每一位有情，過去飲過多少母親的乳汁；今後如果不修學解脫道，還要飲多少。這只是略舉的譬喻，更應當思惟在生死之中，興盛的事、痛苦的事，沒有一樣沒經歷過，令心生起厭離。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 18:20","頁":162,"af":"70b","st":1100,"et":1191,"消文":[{"文":"任何一個人單單吃母親的奶，比四大海水還要多；只要還在生死輪迴，向後去吃的還遠超過這個。"},{"文":"生死當中，苦事、壞事沒有不經過的；所有經過的，永遠沒有夠的時候、停止的時候。"},{"文":"沒有停止的內容是一點點虛假的小快樂，帶來無比的痛苦；想到這裡要厭離。"}],"延伸":[],"逐字稿":[{"t":"70B 18:20","b":[["q","如云：「一一曾飲諸乳汁，過於四海於今後，隨異生性流轉者，尚須多飲過於彼。」"],["s","我們任何一個人，就是單單吃母親的奶，比四大海水還要多，不曉得多多少。而且向後去，你只要還在生死輪迴當中，你吃的還遠超過這個。"]]},{"t":"70B 18:46","b":[["q","謂當思惟一一有情，飲母乳酪昔飲幾許，今後若不學解脫道，當飲幾何。此是略喻，更當思惟生死之中，盛事苦事，無所未經，令心厭離。"],["s","那告訴我們，任何一個人，我們所飲的奶汁不曉得多少，如果說我們不求解脫的話，以後還遠超過這個。除了這個以外，還有在生死當中，不管任何一件事情，苦事、壞事沒有不經過的。而所有經過的事情，沒有一個例外，永遠就是這個行相，永遠沒有夠的時候，永遠沒停止的時候。結果呢實際上狀態，沒有停止的內容是什麼？唉！一點點小小的快樂，這個是虛假的，帶來是無比的痛苦，帶來無比的痛苦。所以想到這裡，要厭離啊，要厭離啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-05/007.mp3"},{"文":"若謂受樂令意滿足，然三有樂，任受幾多，非但無飽，後後轉復增長貪愛，由此長夜馳騁生死，經無量劫，受諸至極難忍大苦，然其安樂不及一分。","口譯":"如果認為受樂能令心意滿足，然而三有的快樂，不論受用多少，不但不會飽足，反而後後更增長貪愛；由此在長夜中奔馳於生死，經過無量劫，承受各種極其難忍的大苦，然而所得的安樂連一分都比不上。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 19:51","頁":163,"af":"70b","st":1191,"et":1254,"消文":[{"文":"假定受了快樂可以使我們滿足，那倒好；但三有當中不管受多少，永遠沒有滿足的時候，而且越來越厲害。"},{"類":"例","文":"現在貪小小的一口之食，將來烊銅熱鐵丸，實在不值得。"},{"文":"那個痛苦是無量無邊，所受的快樂是一點點。"}],"延伸":[],"逐字稿":[{"t":"70B 19:51","b":[["q","若謂受樂令意滿足，然三有樂，任受幾多，非但無飽，後後轉復增長貪愛，"],["s","假定說，你受了快樂可以使得我們滿足的話，真的能滿足那倒好呀！但是三有當中，不管哪一個，不管你受多少，你永遠沒有滿足的時候，不但沒滿足，而且越來越厲害，越來越厲害！"]]},{"t":"70B 20:18","b":[["q","由此長夜馳騁生死，經無量劫，受諸至極難忍大苦，"],["s","就因為這個，然後無量無邊劫受無邊大苦。現在我們貪小小的一口之食，將來烊銅熱鐵丸，到那時候好可怕，好可怕！唉呀，所以想到那個，實在是不值得，實在不值得啊！"]]},{"t":"70B 20:47","b":[["q","然其安樂不及一分。"],["s","那個痛苦是無量無邊，所受的快樂是一點點。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/008.mp3"},{"文":"如《親友書》云：「如諸癩人為蟲癢，為安樂故雖近火，然不能息應了知，«貪著諸欲亦如是»。」","口譯":"如《親友書》說：「就像患癩病的人被蟲咬得發癢，為了求得安樂而去靠近火，然而並不能止息痛苦；應當了知，貪著諸欲也是這樣。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 20:54","頁":163,"af":"70b","st":1254,"et":1362,"消文":[{"文":"「癩」就是痲瘋病。"}],"延伸":[{"題":"貪著諸欲亦如是","組":[{"題":"癩人近火，越烤越癢","說":[{"類":"例","文":"新莊樂生痲瘋院，聽他們敘述：寧願拿火來烤，肉都燒焦了，外面痛得要命，裡面還在癢。"},{"類":"喻","文":"自己身上癢了去抓，那真是越抓越癢；我們的貪心就是這麼嚴重法。"},{"類":"立","文":"這個東西比起地獄的猛火來，還不曉得差多少。"}]},{"題":"貪瞋心相感餓鬼苦","說":[{"類":"因","文":"平常心裡貪、瞋的心相，就是將來到地獄裡去感得餓鬼的；猛利的貪生起，永遠不得滿足。"},{"類":"例","文":"貪心的人好東西樣樣顧自己，完全顧不到人家，沒有積一點福報，所以將來吃的時候找不到東西吃。"}]},{"題":"多思惟觀察，靜息轉變","說":[{"類":"下手","文":"眼前了解了因果關係，就明白將來果性的狀態；現在多思惟、多觀察，是唯一的方法來靜息、轉變它。"}]}],"說":[{"類":"例","文":"新莊樂生痲瘋院，聽他們敘述：寧願拿火來烤，肉都燒焦了，外面痛得要命，裡面還在癢。"},{"類":"喻","文":"自己身上癢了去抓，那真是越抓越癢；我們的貪心就是這麼嚴重法。"},{"類":"立","文":"這個東西比起地獄的猛火來，還不曉得差多少。"},{"類":"因","文":"平常心裡貪、瞋的心相，就是將來到地獄裡去感得餓鬼的；猛利的貪生起，永遠不得滿足。"},{"類":"例","文":"貪心的人好東西樣樣顧自己，完全顧不到人家，沒有積一點福報，所以將來吃的時候找不到東西吃。"},{"類":"下手","文":"眼前了解了因果關係，就明白將來果性的狀態；現在多思惟、多觀察，是唯一的方法來靜息、轉變它。"}],"af":"70b","st":1260}],"逐字稿":[{"t":"70B 20:54","b":[["q","如《親友書》云：「如諸癩人為蟲癢，為安樂故雖近火，然不能息應了知，貪著諸欲亦如是。」"],["s","就像那個生癩，「癩」就是痲瘋病，啊！這個痲瘋病的可怕，不曉得你們去過沒有？這新莊有個樂生痲瘋院，我去過一次，我聽他們敘述說這個事情，當時沒有什麼感覺。有的時候自己身上癢了以後，你去抓抓，啊，那真是越抓越癢。但是比起那個痲瘋病，那個痲瘋病的痛苦，他實在是受不了，受不了到什麼程度？他寧願拿那個火來烤。對不起，烤得那個肉都燒焦了，他那個外面是痛得要命，裡面還在癢。啊！這個東西，那我們這個貪心就是這麼嚴重法，這個這麼嚴重法。可是這個東西比起地獄的猛火來，那還不曉得多少。"]]},{"t":"70B 21:46","b":[["s","所以平常我們的心裡邊，這種貪、瞋的心相，那個就是將來到地獄裡面去感得餓鬼的，所以你長劫受苦的就是這樣。眼前哪，我們到那時候，一到那時候猛利的貪生起來了，你永遠不得滿足的，就是這個心。將來為什麼會感得那餓鬼，就是這樣，你就永遠不能滿足。那麼偏偏貪心的人也就是這樣，哎喲，好東西樣樣顧自己，完全顧不到人家，所以沒有積一點福報。所以那個心裡面永遠不得滿足，偏偏又造了這個業，所以他吃的時候，對不起！又找不到東西吃，這個。所以眼前你了解了這個因果關係的話，你很明白就了解將來這果性的狀態。所以我們現在多思惟、多觀察，那唯一的方法，來靜息、轉變它。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/009.mp3"},{"文":"《弟子書》亦云：「豈有百返未經趣，豈有昔未多受樂，未得吉祥如白拂，豈有是事反增貪。豈有昔未多經苦，眾生無欲能飽滿，無有情腹未曾臥，然何生死不離貪。」應如是思。","口譯":"《弟子書》也說：「哪有哪一趣是我們沒有百次往返經歷過的？哪有過去沒有多次受過的快樂？哪有沒有得過、如白拂般的吉祥？有了這些，反而增長貪欲。哪有過去沒有多次經歷過的苦？眾生的欲望沒有能夠飽滿的時候；沒有哪一位有情的腹中，是我們不曾臥過的；然而為什麼在生死中還不離貪？」應當這樣思惟。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 22:42","頁":163,"af":"70b","st":1362,"et":1463,"消文":[{"文":"「百」不是說一百趟，是「泛百」：任何一趣都經過無量無邊，任何快樂都受過，任何好事情都有過。"},{"文":"有了以後，我們的貪心滿足了嗎？沒有，反而增長；苦也是如此，就因為不能滿足所以受苦。"},{"文":"「無有情腹未曾臥」：互為母子；找不到一個有情例外，都曾經互為母子過，還是不能滿足、不能離開。"},{"文":"應如是思：我們應該這樣去思惟、觀察。"}],"延伸":[],"逐字稿":[{"t":"70B 22:42","b":[["q","《弟子書》亦云：「豈有百返未經趣，豈有昔未多受樂，未得吉祥如白拂，豈有是事反增貪。豈有昔未多經苦，眾生無欲能飽滿，無有情腹未曾臥，然何生死不離貪。」"],["s","那這上面又告訴我們，這個「百」，並不是說一百趟，實際上是「泛百」。就是我們任何一趣當中，任何一趣，都是經過無量無邊，任何一個快樂都受過，任何一個好事情都有過。結果有了以後，對不起，我們的貪心滿足了嗎？對不起，沒有耶，反而增長。唉，還有呢苦也是如此，也是如此啊！正因為你受那個貪，所以受那個苦，就因為我們不能滿足所以受那個苦。然後呢受這個生死的輪迴當中，「無有情腹未曾臥」，這個話什麼意思？就是互為母子，世間的有情是無量無邊找不到邊際，可是又因為我們的生死是無量的，所以人家互為母子。找不到一個人，絕找不到一個有情例外的，所有的有情都曾經做過，互為母子過，這麼多！結果呢，對不起，還是不能滿足，我們也不能離開。"]]},{"t":"70B 24:18","b":[["q","應如是思。"],["s","我們應該這樣去思惟、觀察啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-05/010.mp3"},{"文":"又如《除憂經》說而思«極能厭離»，","口譯":"又照《除憂經》說的去思考，最能讓人生起厭離心。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 24:23","頁":163,"af":"70b","st":1463,"et":1577,"消文":[{"文":"照著除憂苦的經上面這樣思惟的話，你就很容易了。"}],"延伸":[{"題":"極能厭離","組":[{"題":"怕而不敢聽聞","說":[{"類":"例","文":"有人告訴我：「法師啊！聽了這個，我就不敢聽、不敢看了，看看都好怕，做也做不到。」"},{"類":"回扣","文":"以前我也這樣想，後來不。"}]},{"題":"退下來死路一條","說":[{"類":"因","文":"做不到退下來，退下來安樂嗎？假如退下來安樂，誰也不願意做，我是第一個不願意做。"},{"類":"立","文":"退下來只有一條路：死路一條，永遠受無邊的大苦。"}]},{"題":"咬緊牙關，向前衝","說":[{"類":"下手","文":"眼前雖然做不到，只要咬緊牙關慢慢地做，做到了，問題都解決。"},{"類":"立","文":"那一點做不到並沒有苦，只是心裡一點恐怖；這一點恐怖擋不住，將來大苦怎麼擋得住？想到這裡，一定向前衝。"}]},{"題":"主要的是正知見","說":[{"類":"立","文":"說來說去主要的是正知見：把事情的問題看得、認得很正確了，問題都會解決。"},{"類":"回扣","文":"照著經上面這樣去做，一定能夠產生厭離。"}]}],"說":[{"類":"例","文":"有人告訴我：「法師啊！聽了這個，我就不敢聽、不敢看了，看看都好怕，做也做不到。」"},{"類":"回扣","文":"以前我也這樣想，後來不。"},{"類":"因","文":"做不到退下來，退下來安樂嗎？假如退下來安樂，誰也不願意做，我是第一個不願意做。"},{"類":"立","文":"退下來只有一條路：死路一條，永遠受無邊的大苦。"},{"類":"下手","文":"眼前雖然做不到，只要咬緊牙關慢慢地做，做到了，問題都解決。"},{"類":"立","文":"那一點做不到並沒有苦，只是心裡一點恐怖；這一點恐怖擋不住，將來大苦怎麼擋得住？想到這裡，一定向前衝。"},{"類":"立","文":"說來說去主要的是正知見：把事情的問題看得、認得很正確了，問題都會解決。"},{"類":"回扣","文":"照著經上面這樣去做，一定能夠產生厭離。"}],"af":"70b","st":1470}],"逐字稿":[{"t":"70B 24:23","b":[["q","又如《除憂經》說而思極能厭離，"],["s","照著除憂苦的經上面這樣思惟的話，你就很容易了，很容易了。說實在，有的人讀那個經，有的人曾經告訴我：「唉呀，法師啊！聽了這個，我就不敢聽、不敢看了。」我說：「為什麼？」「唉呀，看看那個都好怕哦，就是這樣，做也做不到。」如果是你們碰到這種情況，你們怎麼說？以前我也這樣想，後來不，後來不！因為你做不到的結果你退下來，退下來安樂嗎？假如退下來安樂的話，誰也不願意做，我是第一個絕對不願意做，喔唷，做這個苦事情幹什麼！因為你退下來，是只有一條路 ─死路一條，永遠受無邊的大苦。你現在這樣做地做下去的話，欸，你眼前雖然做不到，你只要咬緊牙關慢慢地做的話，做到；做到了以後，問題都解決。這眼前雖然你心裡面覺得：啊，有一點做不到。那一點做不到，實際上並沒有苦欸，只是心裡面一點恐怖，對不對？你這一點心裡的恐怖擋不住，將來這個大苦你怎麼擋得住啊！所以你想到這裡的話，你一定向前衝。"]]},{"t":"70B 25:41","b":[["s","所以說來說去，主要的是什麼 ─正知見。你就把那事情的問題看得、認得得很正確了以後，這問題都會解決的。你如果仔細想想：啊，發現了！努力地一心只有向上。所以這一點是告訴我們：所以我們要照著這個經上面，能夠這樣去做的話，那一定能夠產生厭離，一定能夠產生厭離。現在我們繼續下去："]]}],"口譯音":"口譯音檔/siwei-kudi-05/011.mp3"},{"文":"如云：「數於地獄中，«所飲諸烊銅»，雖大海中水，非有爾許量。生諸犬豕中，所食諸不淨，其量極超過，須彌山王量。又於生死中，由離諸親友，所泣諸淚滴，非海能為器。由互相鬥諍，積所截頭首，如是高聳量，出過梵世間。為蟲極飢虛，所噉諸土糞，於大乳海中，充滿極高盛。」","口譯":"如說：「屢次在地獄中，所飲下的烊銅，即使是大海中的水，也沒有那麼多。生在狗、豬之中，所吃的各種不淨物，數量遠遠超過須彌山王。又在生死之中，因為與親友別離，所哭泣的淚滴，大海也裝不下。因為互相鬥爭，所積下被砍斷的頭，高聳的程度超過梵天世間。成為蟲時極其飢餓，所吃的泥土糞便，即使放在大乳海中，也會充滿得極高。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 26:17","頁":163,"af":"70b","st":1577,"et":null,"消文":[{"文":"在地獄當中所飲的烊銅，超過大海水。"},{"文":"犬豕當中所吃的不淨，高過須彌山：這是對貪飲食的人。"},{"文":"別離了以後流的眼淚：對親友難分別、難捨的人；想到這一點，沒有一點捨不掉的。"},{"文":"鬥爭乃至送掉性命，那個頭積起來高過梵世：對瞋心大的人。"},{"文":"墮落小蟲當中，吃大糞、土也這麼多。"}],"延伸":[{"題":"所飲諸烊銅","組":[{"題":"想到烊銅，貪心不起","說":[{"類":"立","文":"想到這一點，那個貪心實在一點都生不起來。"}]},{"題":"鋁錠一摸，手整個爛","說":[{"類":"例","文":"不要說熱鐵丸，鐵在火裡燒五分鐘，還是黑黑的看不出來，你摸它一下看。"},{"類":"例","文":"同班同學參觀高雄鋁廠，鋁錠拿出來看起來好好的，他好玩一摸，當時沒感覺，打開手整個地爛了。"}]},{"題":"受小苦，免大苦","說":[{"類":"破","文":"這種地方不要單單聽聽、結結緣，覺得滿好玩的。"},{"類":"下手","文":"真的希望感受得到，最好自己試一試：開水燒到一百度，用左手的手指伸下去；不要用做事的手指。"},{"類":"下手","文":"嘴饞又來了，就再燙一下，割開放一點鹽、你歡喜吃的醬油上去試試看。"},{"類":"立","文":"現在受一點小小的痛苦，將來可以免除極大的痛苦；方法笨一點，卻收效最快。"}]},{"題":"以自己的量去想","說":[{"類":"下手","文":"這個方法並不善巧，可是不妨以你們自己的量去想一下。"}]}],"說":[{"類":"立","文":"想到這一點，那個貪心實在一點都生不起來。"},{"類":"例","文":"不要說熱鐵丸，鐵在火裡燒五分鐘，還是黑黑的看不出來，你摸它一下看。"},{"類":"例","文":"同班同學參觀高雄鋁廠，鋁錠拿出來看起來好好的，他好玩一摸，當時沒感覺，打開手整個地爛了。"},{"類":"破","文":"這種地方不要單單聽聽、結結緣，覺得滿好玩的。"},{"類":"下手","文":"真的希望感受得到，最好自己試一試：開水燒到一百度，用左手的手指伸下去；不要用做事的手指。"},{"類":"下手","文":"嘴饞又來了，就再燙一下，割開放一點鹽、你歡喜吃的醬油上去試試看。"},{"類":"立","文":"現在受一點小小的痛苦，將來可以免除極大的痛苦；方法笨一點，卻收效最快。"},{"類":"下手","文":"這個方法並不善巧，可是不妨以你們自己的量去想一下。"}],"af":"70b","st":1620}],"逐字稿":[{"t":"70B 26:17","b":[["q","如云：「數於地獄中，所飲諸烊銅，雖大海中水，非有爾許量。生諸犬豕中，所食諸不淨，其量極超過，須彌山王量。又於生死中，由離諸親友，所泣諸淚滴，非海能為器。由互相鬥諍，積所截頭首，如是高聳量，出過梵世間。為蟲極飢虛，所噉諸土糞，於大乳海中，充滿極高盛。」"],["s","你看看，經上面告訴我們：啊！我們在地獄當中所飲的烊銅，超過大海水。唉呀！想到這一點，想到這一點哪，那個貪心實在一點都生不起來，想到這一點，那貪心實在一點生不起來！我們不要說飲大海水的烊銅，不要說熱鐵丸，你們試試看，把那個鐵燒得啊，不要說燒紅哦！把那個鐵擺在火裡面燒它五分鐘，還是黑黑的一點看不見，你們摸它一下看，你們不妨摸它一下看。我有一個同學，我們同班的，有一次我們一起去參觀高雄那個鋁廠，那個鋁錠拿出來，就是這個從原料當中拿出來以後，放在邊上，放在邊上。那時候已經完全變成鋁錠，一點看不見，像好好的。嘿！他老兄好玩地跑得去一摸，這就這樣。這一摸，旁邊人告訴他：「欸，這個不能摸的！」把那手馬上就一下打開，打開當時感覺不到。打開完了以後，發現那個手整個地爛了，整個地爛了，這個就這麼厲害哦，這樣啊！"]]},{"t":"70B 28:19","b":[["s","所以，這種地方我們不要單單，如果想真正聽聽、結結緣，那也就罷了。啊，反正覺得滿好玩的，倒真是滿好玩的。你覺得滿好玩，願意看看也有好處哦！如果你要真的希望，這個心情能夠感受得到的話，你最好自己試一試。可是不要吞下去，吞下這個受不了哦，你手上面去試一下。那個開水燒了一百度，把那手指伸下去，不要用那個手指，用那個手指，為什麼原因？因為那個手指要做事情的。或者用左手的手指，然後你弄，萬一到那時候你又來了，放那邊又燙它一下。如果你覺得燙的太不行的話，你割開來放一點鹽上去。然後呢你歡喜吃醬油嘛，你歡喜吃那些嘛，你要歡喜吃的東西，你放上去試試看。你來了幾趟以後，大概我想可以稍微對我們有一點幫助。現在受一點小小的痛苦，將來可以免除極大的痛苦哦！所以說如果自己想有心痛改的話，這個自然 ……也許這個方法太笨了一點，但是卻它收效最快。"]]},{"t":"71A 00:05","b":[["s","所以我告訴你們，你們要燙手指，不要燙這個，燙這個的原因在這個地方。這是隨便啊 ……雖然這個是並不善巧，可是卻是不妨以你們自己的量去想一下。然後呢在這個犬豕當中所吃的不淨，高過於須彌山。這個是對貪的人，對貪什麼？飲食等等。還有呢，對親友難分別的人，「又於生死中」別離，別離了以後，我們流的眼淚已經高過這樣，你想到了這一點，哎呀，難捨的這種事情，沒有一點捨不掉的，沒有一點捨不掉。還有呢如果瞋心大的話，你看看哪，是為了大家一點鬥爭 ─這個平常我們鬥爭總不至於送掉性命吧！鬥爭乃至於把命送掉，那個頭積起來高過於梵世。唉，那個是不得了啊！然後呢，我們墮落小蟲當中吃這個大糞、土，也這麼多啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-05/012.mp3"},{"文":"«如是又如»《華嚴經》云：","口譯":"同樣的，《華嚴經》也這麼說：","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 01:20","頁":163,"af":"71a","st":80,"et":126,"消文":[{"文":"他不斷地用經上面的證。"}],"延伸":[{"題":"如是又如","組":[{"題":"種種引證，觸到我心","說":[{"類":"立","文":"不斷引經，無非是用種種方式，引得越多，總有一個地方能夠觸到我們的心。"}]},{"題":"觸到了停下來加深","說":[{"類":"下手","文":"觸到的時候不要輕輕放過，想辦法加深這個相應的感觸，力量就從這個地方產生。"},{"類":"下手","文":"平常儘量多去研閱；一下觸到了，停在那個地方：「唉呀，對呀！」使心量慢慢加強堅固。"},{"類":"立","文":"這樣三番五次努力，以後就容易慢慢產生對治的效應。"}]}],"說":[{"類":"立","文":"不斷引經，無非是用種種方式，引得越多，總有一個地方能夠觸到我們的心。"},{"類":"下手","文":"觸到的時候不要輕輕放過，想辦法加深這個相應的感觸，力量就從這個地方產生。"},{"類":"下手","文":"平常儘量多去研閱；一下觸到了，停在那個地方：「唉呀，對呀！」使心量慢慢加強堅固。"},{"類":"立","文":"這樣三番五次努力，以後就容易慢慢產生對治的效應。"}],"af":"71a","st":80}],"逐字稿":[{"t":"71A 01:20","b":[["q","如是又如《華嚴經》云："],["s","他不斷地用那個經上面的證，無非是用種種方式，總是我們越多，總有一個地方能夠觸到我們的心，那個時候不要輕輕放過哦！當你觸到了這個心上面的時候，你要想辦法把你這個相應的感觸，那個時候加深它，那個力量就從這個地方產生的，那個地方產生的。所以你平常的時候儘量地多去研閱，當一下觸到了，你停在那個地方。唉呀，對呀！使得這個心量慢慢地加強堅固、加強堅固。你這樣地經過三番五次努力，以後就容易慢慢、慢慢地產生對治這種效應。那麼《華嚴》怎樣說呢？"]]}],"口譯音":"口譯音檔/siwei-kudi-05/013.mp3"},{"文":"「汝應憶念為諸欲，徒耗諸身前邊際，今求菩提具禁戒，«由禁於此摧諸欲»。汝應憶念為諸欲，徒耗諸身前邊際，未能承事恆沙佛，未從佛聞如是語。」","口譯":"「你應當憶念：為了諸欲，白白耗費了無數的身體，前際沒有邊際；如今求菩提、具足禁戒，就要藉著禁戒在此摧毀諸欲。你應當憶念：為了諸欲，白白耗費了無數的身體，前際沒有邊際；卻沒能承事如恆河沙數的佛，也沒有從佛那裡聽聞這樣的教言。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 02:06","頁":163,"af":"71a","st":126,"et":243,"消文":[{"文":"前面單單從苦那一方面，這裡正面告訴我們：為了無理的貪欲，虛耗的生命不曉得無量無邊。"},{"文":"現在為了解決這個無義的痛苦，一心努力如法行持，依戒定慧，趁這個機會把欲摧毀。"}],"延伸":[{"題":"由禁於此摧諸欲","組":[{"題":"到這裡來為什麼","說":[{"類":"立","文":"跑到這地方來，正應該努力的就在這地方，這是最重要的。"},{"類":"破","文":"跑到這裡來還嘻哈放不下，千真萬確的，脫下衣服回家去；先懺悔，等到有了力量再來。"},{"類":"下手","文":"出家人要問：「我跑到這個地方來，為什麼要做這個的！」"}]},{"題":"做不到寧可捨戒","說":[{"類":"例","文":"有一位同修，持了戒做不到就捨戒，必要時連沙彌都不要，做淨人伺候大家，必要時回家吃盡苦頭再來。"},{"類":"立","文":"這個才是有志氣！每一樣事情，我們應該了解這一點。"}]}],"說":[{"類":"立","文":"跑到這地方來，正應該努力的就在這地方，這是最重要的。"},{"類":"破","文":"跑到這裡來還嘻哈放不下，千真萬確的，脫下衣服回家去；先懺悔，等到有了力量再來。"},{"類":"下手","文":"出家人要問：「我跑到這個地方來，為什麼要做這個的！」"},{"類":"例","文":"有一位同修，持了戒做不到就捨戒，必要時連沙彌都不要，做淨人伺候大家，必要時回家吃盡苦頭再來。"},{"類":"立","文":"這個才是有志氣！每一樣事情，我們應該了解這一點。"}],"af":"71a","st":170}],"逐字稿":[{"t":"71A 02:06","b":[["q","「汝應憶念為諸欲，徒耗諸身前邊際，今求菩提具禁戒，由禁於此摧諸欲。汝應憶念為諸欲，徒耗諸身前邊際，未能承事恆沙佛，未從佛聞如是語。」"],["s","它經上面，前面是單單從苦的那一方面，這個方面又正面地告訴我們：你想想看呀，我們為了前面這種無理的貪欲，然後呢虛耗的這個生命，不曉得無量無邊哪！現在是為了解決這個無義的痛苦，然後一心努力地如法行持，然後呢依戒定慧這樣，應該努力趁這個機會，把這個欲摧毀呀！在我們這裡，的的確確正應該努力的。所以跑到這地方來，我們正應該努力的在這地方，這一點這是最重要。如果跑到這個地方來，這個地方還是嘻哈放不下，這個千真萬確的，脫下衣服回家去；先懺悔，等到有了力量再來。嘻嘻哈哈那在家人的事情，出家人做的事情是這個，說：「我跑到這個地方來，為什麼要做這個的！」嗯，那麼這樣。所以我們這裡有一位同修我非常讚歎他，他覺得：我持了戒做不到，捨戒。乃至於必要的時候，連它沙彌都不要，然後做淨人伺候你們，必要的時候回家去，然後吃盡了苦頭再來。這個才是有志氣！這個每一樣事情，應該我們要了解這一點哪！"]]}],"口譯音":"口譯音檔/siwei-kudi-05/014.mp3"},{"文":"謂盡所得三有盛事，悉皆欺誑，領受無量無義大苦。","口譯":"就是說，所得到的一切三有的興盛之事，全都是欺誑，因而領受無量的、毫無意義的大苦。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 04:03","頁":163,"af":"71a","st":243,"et":286,"消文":[{"文":"三有之間一切好事都是「欺誑」：一點點地騙了你，結果受無量無邊大苦，這大苦還是無義的。"},{"文":"修行不是快樂的事，修行是苦事，但修行是小苦而有大義；現在是大苦而又無義，這要萬萬分別清楚。"}],"延伸":[],"逐字稿":[{"t":"71A 04:03","b":[["q","謂盡所得三有盛事，悉皆欺誑，領受無量無義大苦。"],["s","不管你得到的三有之間一切好事，那個都是什麼？「欺誑」兩個字。它騙了你，一點點地騙了你，結果呢受無量無邊大苦，這個大苦還是無義的。為什麼說「無義大苦」？我們修行不是一件快樂的哦，修行是一件苦事哦！欸，但是修行 ─這個小苦而有大義！它現在呢大苦而又無義，這個我們要分別得清楚哦！欸，這個要萬萬地要分別得清楚。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/015.mp3"},{"文":"如前唐捐無量色身，皆當憶念，若後仍不策勵勤修，更當如是，思惟此理，令起厭離。","口譯":"像以前那樣白白耗費了無量的色身，都應當憶念；如果以後仍然不策勵勤修，還會再像這樣，思惟這個道理，令心生起厭離。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 04:46","頁":163,"af":"71a","st":286,"et":333,"消文":[{"文":"以前不曉得白白消耗掉了多少，應該好好地思惟。"},{"文":"以後還不努力，還是這樣；不要讓難得的暇滿人身空空浪費，何況還去非理作意，把自己送到惡道。"}],"延伸":[],"逐字稿":[{"t":"71A 04:46","b":[["q","如前唐捐無量色身，皆當憶念，"],["s","以前已經不曉得白白地消耗掉了，這個東西應該好好地思惟啊！"]]},{"t":"71A 04:57","b":[["q","若後仍不策勵勤修，更當如是，思惟此理，令起厭離。"],["s","如果以後我們還不努力的話，以後還是這樣啊，這個是我們應該如法去思惟的，不要讓我們難得的暇滿的人身空空浪費掉。空空浪費都不可以，何況還要去思惟非理作意，把自己送到惡道當中去啊！所以這一點一定要生起這個厭離心啊！那個祖師怎麼說啊？"]]}],"口譯音":"口譯音檔/siwei-kudi-05/016.mp3"},{"文":"慬哦瓦云：「覺𡁮敦巴從無始來，曾受何身，然皆未修大乘正法，猶如今日，«故須策勵»。」","口譯":"慬哦瓦說：「覺𡁮敦巴！從無始以來，曾經受過什麼樣的身體？然而都沒有像今天這樣修習大乘正法，所以必須策勵。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 05:33","頁":163,"af":"71a","st":333,"et":476,"消文":[{"文":"無始以來受各式各樣的身，沒有修正法，尤其是大乘正法；像今天這樣認真從來沒有過，所以趕快努力。"}],"延伸":[{"題":"故須策勵","組":[{"題":"一心仰望祖師","說":[{"類":"例","文":"人家勸祖師休息一下，他說：「照理應該休息，但一想到生死痛苦、暇滿人身，我就停不住了。」"},{"類":"下手","文":"真正講修行要把這個作為榜樣：把古德的傳記擺在腦筋裡面，一心仰望，我要學他。"}]},{"題":"貪著丟到東洋大海","說":[{"類":"破","文":"不要說這個人難捨、這個東西難捨，這也不行、那也不行。"},{"類":"下手","文":"腦筋裡放不下的貪著，要丟到東洋大海。"}]},{"題":"好吃趕快送掉","說":[{"類":"例","文":"居士送來很多梅乾菜，說好吃就留著，結果放到生蟲；我的話，好吃趕快送掉。"},{"類":"立","文":"祖師公案說增長貪心；我只要把肚子塞飽就好，人家弄很多好吃的，我眉頭皺皺、心裡害怕，因為貪心還是很重。"},{"類":"回扣","文":"要看祖師怎麼做，這個才是我們到這裡來的目標。"}]}],"說":[{"類":"例","文":"人家勸祖師休息一下，他說：「照理應該休息，但一想到生死痛苦、暇滿人身，我就停不住了。」"},{"類":"下手","文":"真正講修行要把這個作為榜樣：把古德的傳記擺在腦筋裡面，一心仰望，我要學他。"},{"類":"破","文":"不要說這個人難捨、這個東西難捨，這也不行、那也不行。"},{"類":"下手","文":"腦筋裡放不下的貪著，要丟到東洋大海。"},{"類":"例","文":"居士送來很多梅乾菜，說好吃就留著，結果放到生蟲；我的話，好吃趕快送掉。"},{"類":"立","文":"祖師公案說增長貪心；我只要把肚子塞飽就好，人家弄很多好吃的，我眉頭皺皺、心裡害怕，因為貪心還是很重。"},{"類":"回扣","文":"要看祖師怎麼做，這個才是我們到這裡來的目標。"}],"af":"71a","st":355}],"逐字稿":[{"t":"71A 05:33","b":[["q","慬哦瓦云：「覺𡁮敦巴從無始來，曾受何身，然皆未修大乘正法，猶如今日，故須策勵。」"],["s","啊！說從無始以來，這個受各式各樣的身，但是沒有修正法，尤其是「大乘正法」，像今天這樣認真從來沒有過，所以今天居然做了，趕快努力啊！記得那個祖師前面有一段話吧？人家看見他用功得不得了，就說：「某人哪，你這麼用功你休息一下呀！」他說：「對呀，照理應該休息一下，但是我一想到這個生死痛苦、暇滿人身，我就停不住了。」嗯，這樣，那祖師的典型的公案，我們真正講修行，要把這個作為榜樣。所以他又說，我是仰望於 ……是怎麼講？「一心仰望這個，把古德的傳記擺在腦筋裡面，一心仰望，我要學他、我要學他啊！」我們千萬把腦筋裡面放不下的這種貪著，要丟到東洋大海。不要說這個人難捨，這個東西難捨，這樣。這個也不行，那個也不行，所以這些東西千萬要捨掉啊！"]]},{"t":"71A 07:01","b":[["s","我想到了這個，最近哪，早一陣子我剛來的時候，看見我們這裡有很多這個梅乾菜，那個的確是非常好的東西。我說：「唉呀，我們這麼多，就送掉一點啊！」就有一個人說：「噢，這個東西很好吃呀！」「哦，這樣。那吃不完嘛，就送掉。」結果大家也是放那裡，最近我聽說生蟲了。你看，人家居士一番好心送到這個地方來。唉！這種地方 ……。這要我的話，好吃，好吃趕快送掉。我看見很多祖師這種公案，那增長貪心，就增長貪心啊，我只要把肚子塞飽了那個是最好。所以人家弄很多好吃東西，我看見了就眉頭皺皺，心裡就害怕，就因為我的貪心還是很重呀！這個地方要看看那個祖師，祖師怎麼做的，這個才是我們到這裡來的目標。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/017.mp3"},{"文":"又如桑樸瓦云：「此生死中須多仰覆，此於心中實覺不安。」","口譯":"又如桑樸瓦說：「在這生死之中，必須多次反覆思惟，這在心中確實會覺得不安。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 07:56","頁":164,"af":"71a","st":476,"et":518,"消文":[{"文":"「仰覆」：反覆地多多思惟；這樣心裡就不會像現在「快樂得很」，就不安了。"},{"文":"前面說思惟這個「坐起慞慌，腦漿炎熱」：坐立不安，心裡像火燒，害怕得要命，一心求脫，那就對了。"}],"延伸":[],"逐字稿":[{"t":"71A 07:56","b":[["q","又如桑樸瓦云：「此生死中須多仰覆，此於心中實覺不安。」"],["s","這個在現在生死輪迴當中，我們都要 ……什麼叫「仰覆」？反覆地多多思惟。你能夠反覆地多多思惟，你心裡面就不會像現在這樣 ─哎呀，快樂得很啊！就不安了。於是你說怎麼辦哪？啊！他前面告訴我們思惟這個東西，「坐起慞慌，腦漿炎熱」。啊，你坐立不安！唉呀，那個時候那個心裡面就是，就像火燒一樣的話，你實在是害怕得要命，一心求脫，那就對了。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/018.mp3"},{"文":"乃至未能起心如此，須勤思惟，縱起亦當«恆常修習»。","口譯":"乃至還沒能生起這樣的心以前，必須勤加思惟；縱然生起了，也應當恆常修習。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 08:38","頁":164,"af":"71a","st":518,"et":950,"消文":[{"文":"心裡還沒生起要努力，縱然生起了還要繼續不斷。"}],"延伸":[{"題":"恆常修習","組":[{"題":"每段必勸，修行即此","說":[{"類":"立","文":"每一段講完了，一定告訴我們這幾句話；我們修行的時候，沒有別的就是這個。"}]},{"題":"莫求高高大法","說":[{"類":"破","文":"不必好高騖遠：「哪一個大法，哪一個大師呀！」有人聽說大上師要來灌頂，又想辦法要去灌頂。"},{"類":"立","文":"佛早就說得清清楚楚，從那個根本上面去做就行了。"}]},{"題":"低處修時高處到","說":[{"類":"例","文":"白教真正的祖師：馬爾巴、密勒日巴、岡波巴；密勒日巴尊者千古奇人。"},{"類":"立","文":"「低處修時高處到，慢慢修時是快快到，一人修時是兩人到」：你不必忙著幫一切人，先把自己弄好。"}]},{"題":"密勒日巴蕁麻苦行","說":[{"類":"例","文":"肉乾生了蟲，他想：「牠也吃，我也吃，怎麼可以搶牠？」寧可餓肚子讓蟲吃。"},{"類":"例","文":"發誓此生不證道不為八風所動；餓了幾天想到餓死不能修行，才出去討吃的，看見蕁麻，一直吃到身上長出綠毛。"},{"類":"例","文":"我到印度一碰蕁麻，手癢了兩天；想想古人，我哭了好幾次：人家吃這個，我還要醬油、麻油一大堆。"}]},{"題":"自看如兔，所以成就","說":[{"類":"例","文":"妹妹勸他學那位很神氣、弟子很多、吃得很好的大喇嘛，他說：「獅子跳的路，兔子我不敢跳啊！」"},{"類":"立","文":"他一生這麼高的成就，就靠這個：自己曉得我條件差。"},{"類":"破","文":"我們還看得自己很高：這個不行、那個瞧不起、這也不要那也不要，所以我們不成就。"}]},{"題":"基礎要堅穩","說":[{"類":"立","文":"我們真正要思惟觀察的，不是高高大法，而是這個地方的基本。"},{"類":"回扣","文":"死念生起來了，眼前還放不下嗎？對苦了解了，還會去找那些事情嗎？這是共下士道。"},{"類":"下手","文":"不要急著忙這個忙那個，「慢慢修時是快快到」，欲速不達，基礎要堅穩。"}]}],"說":[{"類":"立","文":"每一段講完了，一定告訴我們這幾句話；我們修行的時候，沒有別的就是這個。"},{"類":"破","文":"不必好高騖遠：「哪一個大法，哪一個大師呀！」有人聽說大上師要來灌頂，又想辦法要去灌頂。"},{"類":"立","文":"佛早就說得清清楚楚，從那個根本上面去做就行了。"},{"類":"例","文":"白教真正的祖師：馬爾巴、密勒日巴、岡波巴；密勒日巴尊者千古奇人。"},{"類":"立","文":"「低處修時高處到，慢慢修時是快快到，一人修時是兩人到」：你不必忙著幫一切人，先把自己弄好。"},{"類":"例","文":"肉乾生了蟲，他想：「牠也吃，我也吃，怎麼可以搶牠？」寧可餓肚子讓蟲吃。"},{"類":"例","文":"發誓此生不證道不為八風所動；餓了幾天想到餓死不能修行，才出去討吃的，看見蕁麻，一直吃到身上長出綠毛。"},{"類":"例","文":"我到印度一碰蕁麻，手癢了兩天；想想古人，我哭了好幾次：人家吃這個，我還要醬油、麻油一大堆。"},{"類":"例","文":"妹妹勸他學那位很神氣、弟子很多、吃得很好的大喇嘛，他說：「獅子跳的路，兔子我不敢跳啊！」"},{"類":"立","文":"他一生這麼高的成就，就靠這個：自己曉得我條件差。"},{"類":"破","文":"我們還看得自己很高：這個不行、那個瞧不起、這也不要那也不要，所以我們不成就。"},{"類":"立","文":"我們真正要思惟觀察的，不是高高大法，而是這個地方的基本。"},{"類":"回扣","文":"死念生起來了，眼前還放不下嗎？對苦了解了，還會去找那些事情嗎？這是共下士道。"},{"類":"下手","文":"不要急著忙這個忙那個，「慢慢修時是快快到」，欲速不達，基礎要堅穩。"}],"af":"71a","st":530}],"逐字稿":[{"t":"71A 08:38","b":[["q","乃至未能起心如此，須勤思惟，縱起亦當恆常修習。"],["s","說乃至於這個心裡面還沒有生起，要努力，縱然生起了還要繼續不斷。每一段前面講完了，一定告訴我們這幾句話，每一段講完了，一定告訴我們這幾句話。實際上呢，我們修行的時候也就是，沒有別的就是這個。所以我們不必好高騖遠，說：「唉呀，哪一個大法，哪一個大師呀！」佛早就說得清清楚楚了，就是這個樣，你從那個根本上面去做，那就行了。尤其是最近又有人說：「哎喲，最近有一個大上師要來灌頂了。」喔唷，他又想辦法要去灌頂。我就想起來了，據說來那個大上師白教的，這個錫杜佛爺，他的確白教的錫杜佛爺，那是非常精采的，非常了不起的。大寶法王走了以後，他現在認證的工作落在他身上，也可以說那他是第二把交椅。當然白教當中坐第二把交椅有四個上座，他就這個第二把交椅當中的一人，這個倒也是事實。"]]},{"t":"71A 09:57","b":[["s","但是我們不妨說，同樣的白教的真正祖師是哪一個？馬爾巴祖師，然後呢密勒日巴尊者，然後到岡波巴大師再發展開來。而其中尤其是密勒日巴尊者，那真是千古奇人。他說了兩句名言，他怎麼講？叫「低處修時高處到，慢慢修時是快快到，一人修時是兩人到。」你修的時候你慢一點，結果你到得快；你低的地方去修的話，你可以爬到高的地方；你不必忙要幫一切人，你先把你自己弄好。這是千真萬確的事實，千真 ……他真正的成就，就在這個地方，他真正的成就就在這個地方。"]]},{"t":"71A 10:51","b":[["s","所以你們看過他的傳記的人曉得，沒有看過他傳記，我也把它說一下。他那時候修苦行，不得了！人家送給他一點東西，然後呢他是個在家人，尤其是西藏他們那個地方，就是不是像我們，一定要吃葷的 ─送他一點糌粑，送他一點點起士，還有送他一點肉乾。到後來那個肉乾上面生了蟲了，他把那個蟲拿掉，他後來想：「不對呀！牠也吃，我也吃，你怎麼可以搶牠呢？好、好、好！我餓肚子，那個蟲就讓牠吃。」結果他先頭發誓了，說：「如果這一生不證道的話，我絕不為八風所動，絕不為這個生命而跑做任何。如果這樣的話，寧願讓那個護法神把我一下弄死，下一世投胎我再來修！」結果到了眼前，眼看著沒吃東西，餓了幾天，他也不管。後來想：「對呀，我所以發那個是為修行，現在餓死了還是不能修行啊！所以這個並沒有違背我的誓願，那好、好、好，我討一點東西去吃吧！」結果他就跑出去，一跑跑出去，欸，看見了那個綠的蕁麻。"]]},{"t":"71A 12:04","b":[["s","你們不曉得那個蕁麻什麼東西，我這次到印度去才看見。哎呀，那個東西上頭滿身都是草，這個草上綠綠的，那個上面有刺，那個刺有毒的，這個毒不是中的毒哦！那時候我不知道，我就一碰，唉呀，一碰那個手整整癢了兩天，唉，癢得你簡直是不曉得怎麼好！這麼個東西！他居然拿這個東西，它那個嫩頭就把它拿下來，他也不知道怎麼弄的。他們說：「喏喏喏喏！當年密勒日巴吃這個東西。」我當時第一次聽聽也沒有什麼心裡上印象，後來我刺到了，自己去想啦，哎喲！這個東西我哭了好幾次。唉呀，想想古人這樣，我自己實在是好差呀！人家還燒了這個東西，我還嫌這個不對、那個不對。哎呀，還要醬油、麻油一大堆。他那個東西，就吃蕁麻，獵人不是跑得去找他嗎？跟他要一點東西說：「我在打獵半天，我找不到東西吃，你的東西先分我一點，然後我找到了給你。」密勒日巴尊者怎麼說？「哎，我吃的就是那個蕁麻。」「哦，那好好，你總給我一點鹽！」「鹽！有鹽就好了，我吃的就是那個蕁麻。」然後呢，跟他要了幾樣東西，他就說：「我吃的就是這個。」結果因為一直吃那個蕁麻，弄到後來，那個身上面都長出綠的毛來了。"]]},{"t":"71A 13:28","b":[["s","以後他的妹妹不是來找到他了嗎？他的妹妹找到他的時候，那時經過一個地方，一個大喇嘛，哎喲，那個大喇嘛很神氣，然後呢那個弟子很多。他的妹妹就跟他說：「唉呀，哥哥我找了你多少年找得好苦，居然最後找到你了。你在這裡幹什麼？」「修行！」「那你怎麼這麼修行呢！我看見這個修行的大喇嘛，這麼多人擁護，吃得這麼好，他同樣地修行，你為什麼不這樣修行？」密勒日巴尊者怎麼說啊？「獅子跳的路，兔子我不敢跳啊！」他這麼了不起的人，他把他看成是兔子，密勒日巴尊者真正了不起的地方！所以藏傳不管哪一系、哪一派尊重他，他一生有這麼高成就，就靠這個 ─他自己曉得我條件差。其實他條件真的差嗎？如果我們比比，我們絕對沒有一個人比得上他，乃至於百分之一、千分之一，他自己看「我是一個兔子」。哎喲，我們現在還看得自己很高咧，覺得：哎喲！這個不行、那個不行；看看那個瞧不起，那個瞧不起；這個也不要，那個也不要。那所以我們不成就的原因。"]]},{"t":"71A 14:38","b":[["s","所以在這個地方，我們要了解：這種情形我們真正要思惟觀察的，不是它高高大法，而這個地方的基本。所以說「低處修時是高處到」，你把基礎做好了。其實學到現在還是很清楚，一旦你對這個死念生起來了，你現在的眼前的難道還放不下嗎？一旦你對於苦的了解了，你還會去找那些事情嗎？這個死、這個苦什麼？共下士道啊，「阿彌陀佛」啊！所以千真萬確是低處修時，高處是無有不到的！然後呢你不要急，要忙這個、要忙那個，是「慢慢修時是快快到」，所以我們中國人說「欲速不達」，基礎要堅穩哪！繼續下去，第三個，"]]}],"口譯音":"口譯音檔/siwei-kudi-05/019.mp3"},{"文":"數數捨身過患者。如云：「一一身體諸骨聚，超過幾多須彌峰。」謂一一有情受身之骨，若不爛壞，«多於須彌»。","口譯":"數數捨身的過患：如說：「每一位有情的身體，所積聚的骨頭，超過好多座須彌山峰。」就是說，每一位有情受身所留下的骨頭，如果不爛壞，比須彌山還多。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 15:50","頁":164,"af":"71a","st":950,"et":1028,"消文":[{"文":"捨身、受身，捨下來的骨聚，不要說骨聚，燒成的灰都超過須彌山，不曉得受了多少。"}],"延伸":[{"題":"多於須彌","組":[{"題":"心硬如金剛","說":[{"類":"破","文":"弄了這麼多次，還在那個地方不停止；我們的心真像金剛，佛告訴我們這麼厲害，我們居然動都不動。"}]},{"題":"良馬見鞭影即奔","說":[{"類":"喻","文":"反過來要軟得像豆腐、軟得像棉絮，一點小小的事情就心動。"},{"類":"喻","文":"好的馬看見鞭的影子就奔了。"},{"類":"下手","文":"一點點小小的，馬上就策勵，那這一生就有希望。"}]}],"說":[{"類":"破","文":"弄了這麼多次，還在那個地方不停止；我們的心真像金剛，佛告訴我們這麼厲害，我們居然動都不動。"},{"類":"喻","文":"反過來要軟得像豆腐、軟得像棉絮，一點小小的事情就心動。"},{"類":"喻","文":"好的馬看見鞭的影子就奔了。"},{"類":"下手","文":"一點點小小的，馬上就策勵，那這一生就有希望。"}],"af":"71a","st":980}],"逐字稿":[{"t":"71A 15:50","b":[["q","數數捨身過患者。如云：「一一身體諸骨聚，超過幾多須彌峰。」謂一一有情受身之骨，若不爛壞，多於須彌。"],["s","然後我們捨身的過患。捨身、受身，我們捨下來的身、骨聚，不要說骨聚，燒成功的灰超過須彌山，唉！不曉得受了多少。那就是，想想我們實在是，弄了這麼多次，結果呢？咳！繼續還在那個地方，繼續還在那個地方，還不停止。所以前面說我們真的，我們的心真像金剛，什麼東西都動不了，佛告訴這麼厲害的，我們居然在那個地方動都不動。唉！我們要反過來，最好的我們哪，後面告訴我們的：我們軟得像豆腐，軟得像棉絮；那就差不多了。一點小小的事情，哦！心動。所以這個經上面告訴我們，真正好的良馬見鞭影 ─那個好的馬看見那個鞭的影子就奔了，我們也應該這樣，一點點的小小的馬上就策勵，那這一生就有希望。下面："]]}],"口譯音":"口譯音檔/siwei-kudi-05/020.mp3"},{"文":"數數結生過患者。如云：「雖將地丸如柏子，數母邊際未能盡。」","口譯":"數數結生的過患：如說：「即使把大地的泥土做成像柏子大小的丸子，用來計數母親，也數不盡母親的邊際。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 17:08","頁":164,"af":"71a","st":1028,"et":1059,"消文":[{"文":"生死流轉當中捨身以後結生，不斷地結生。"},{"文":"把大地做成柏子那麼大的丸子來數母親，要找到母親的邊找不到。"}],"延伸":[],"逐字稿":[{"t":"71A 17:08","b":[["q","數數結生過患者。如云：「雖將地丸如柏子，數母邊際未能盡。」"],["s","這個不斷地結生，然後生死流轉當中捨身，捨身以後呢？結生，就是生死流轉當中。如果我們把大地做成丸，丸子像柏子那麼一點點大，然後呢我們數這個母親，說我們的母親，要找到那母親的邊找不到。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/021.mp3"},{"文":"昔諸先覺解釋此義，謂一有情為母之量，此非正義。即此釋中引經文云：","口譯":"從前各位先覺解釋這個意義，說是一位有情曾經作為自己母親的次數；這不是正確的意義。就在這部釋論中引用經文說：","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 17:39","頁":164,"af":"71a","st":1059,"et":1090,"消文":[{"文":"平常我們總覺得：每一次結生有一個母親，要找那個母親找不到邊。大師告訴我們：不！意思不在這裡。"},{"文":"解釋當中引經文說。"}],"延伸":[],"逐字稿":[{"t":"71A 17:39","b":[["q","昔諸先覺解釋此義，謂一有情為母之量，此非正義。"],["s","平常我們去看這個問題，總覺得：我們因為是不斷地結生，所以每一次結生有一個母親，要找那個母親，這個找不到邊。他大師告訴我們：不！這個意思不是這裡。下面："]]},{"t":"71A 18:01","b":[["q","即此釋中引經文云："],["s","他說它下面，就是《親友書》上面的，《弟子書》還是《親友書》上面說的，解釋當中引經文說："]]}],"口譯音":"口譯音檔/siwei-kudi-05/022.mp3"},{"文":"「諸苾芻，譬如有人，從此大地執取諸丸，量如柏子，作是數云：『此是我母，此是我母之母。』而下其丸。諸苾芻，此大地泥速可窮盡，然諸人母展轉非爾。」是顯自母及彼母等母輾轉次第，此論亦說母邊際故。","口譯":"「諸位比丘，譬如有人，從這大地取泥做成許多丸子，大小如柏子，一邊數一邊說：『這是我的母親，這是我母親的母親』，每數一個就放下一顆丸子。諸位比丘，這大地的泥很快就會用盡，然而人的母親輾轉相承，卻數不盡。」這是顯示自己的母親，以及她的母親等，母親輾轉相承的次第；這部論說的也是母親的邊際。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 18:10","頁":164,"af":"71a","st":1090,"et":1185,"消文":[{"文":"凡是菩薩造論，不是憑空的，一定有憑有據根據經論，貫徹諸經義來解釋道理。"},{"文":"數：這是我的母親，這是我母親的母親……每數一個下一粒；大地做的丸很快數完，輾轉為母找不到。"},{"文":"不是說我每生結生的母親，而是我現在的母親哪來的？母親還有母親生，母親還有母親生。"},{"文":"我們想：他為什麼要說這個？好像前者對我們感受比較有影響；不是！他下面有道理的。"}],"延伸":[],"逐字稿":[{"t":"71A 18:10","b":[["q","「諸苾芻，譬如有人，從此大地執取諸丸，量如柏子，作是數云：『此是我母，此是我母之母。』而下其丸。諸苾芻，此大地泥速可窮盡，然諸人母展轉非爾。」"],["s","因為它那個經文上，在那釋論上引經上的文 ─凡是菩薩造論，他都不是憑空的，一定是有憑有據根據經論，然後呢貫徹諸經義來解釋這個道理。所以他引那個經論上面說：前面這個不是正理，那麼經怎麼說呢？就是就這一點事情來說，「諸苾芻」 ─就是告訴這比丘，佛告訴他譬如有人把那個大地那個土就做為丸，像柏樹子那樣，然後數：這是我的母親，這是我母親的母親，母親的母親的母親，母親的母親的母 ……這樣。然後「下其丸」，每數一個下一粒，說這個大地所做成功的丸，很快就數完了，但是要找到那個輾轉為母，找不到。這個什麼意思？不是說我每生結生的這個母親，就是說我現在生我是母親，母親哪來的？母親還有母親生，母親還有母親生 ……。"]]},{"t":"71A 19:27","b":[["q","是顯自母及彼母等母輾轉次第，此論亦說母邊際故。"],["s","我們在這裡想：嗯？他為什麼要說這個，這個有什麼道理？好像在我們感受上面，前者比較對我們有影響 ─不是！他下面有道理的。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/023.mp3"},{"文":"«此成厭患因之理»者，如《四百論》云：","口譯":"這能成為厭患之因的道理，如《四百論》說：","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 19:45","頁":164,"af":"71a","st":1185,"et":1238,"消文":[{"文":"每一個地方都引經據典的；在下面進一步說之前，這裡先說一點。"}],"延伸":[{"題":"此成厭患因之理","組":[{"題":"莫憑自己的想像","說":[{"類":"破","文":"我們平常都是憑想像；想像是什麼？兩個字：無明。不但無明，還執著，還偏偏自己覺得對，毛病全在這裡。"},{"類":"破","文":"不要說「這個解釋對了嘛，你何必這麼囉嗦呢」，這個心理是煩惱，是你的習氣。"}]},{"題":"經論每說必有深意","說":[{"類":"下手","文":"看看經論上面為什麼這麼說，它每說一個總有它特殊的意義在；認得這一點，我們就有希望了。"}]}],"說":[{"類":"破","文":"我們平常都是憑想像；想像是什麼？兩個字：無明。不但無明，還執著，還偏偏自己覺得對，毛病全在這裡。"},{"類":"破","文":"不要說「這個解釋對了嘛，你何必這麼囉嗦呢」，這個心理是煩惱，是你的習氣。"},{"類":"下手","文":"看看經論上面為什麼這麼說，它每說一個總有它特殊的意義在；認得這一點，我們就有希望了。"}],"af":"71a","st":1190}],"逐字稿":[{"t":"71A 19:45","b":[["q","此成厭患因之理者，如《四百論》云："],["s","他每一個地方都引經據典的，在下面進一步說之前，這裡先說一點。我們平常都是憑我們的想像的，這個地方告訴我們，不要憑我們的想像哦！我們的想像是什麼？兩個字 ─無明。而且不但無明而且還執著，還偏偏自己覺得對，毛病全在這裡。所以凡是這個經論上面處處地方它告訴我們，我們要認得這一點，我們就有希望了，有希望了。所以任何一個地方，不要說這個解釋對了嘛，你何必這麼囉嗦呢！這個心理是什麼？煩惱，就是你的習氣。看看經論上面為什麼這麼說，它每說一個，總有它的特殊的意義在。那個論上面怎麼說？"]]}],"口譯音":"口譯音檔/siwei-kudi-05/024.mp3"},{"文":"「若時雖一果，«初因非可見»，見一亦增多，爾時何不畏。」","口譯":"「當即使只是一個果，它最初的因都無法見到；見到一個果，又看到因不斷增多，那時怎能不畏懼？」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 20:38","頁":164,"af":"71a","st":1238,"et":1383,"消文":[{"文":"隨便一個結果，就是我們隨便一個一生，現在「我」存在了；找它的因，最初的因哪裡來？找不到。"},{"文":"因緣無盡；一個簡單的事情找最初因都找不到，可想而知何等複雜，何等可怕。"}],"延伸":[{"題":"初因非可見","組":[{"題":"一口之食，還不盡","說":[{"類":"例","文":"做一點小小的事情，貪也好、瞋也好，吃一口東西，找它的最初因找不到；將來要還，是還不盡的。"},{"類":"因","文":"因為最初因找不到、還不盡，所以永遠在這個地方結生，這是真正的困擾。"}]},{"題":"受施不得解脫，要還人家","說":[{"類":"破","文":"不要隨隨便便，人家送來的好東西，儘量吃、玩、用、樂，不可以呀！"},{"類":"立","文":"拿這東西自求解脫了，讓人家在福田中種福；現在不得解脫，人家白白浪費，你要還人家，怎麼還得乾淨。"}]},{"題":"當下起大警惕","說":[{"類":"下手","文":"任何一件事情，當下就策勵起我們大警惕來。"}]}],"說":[{"類":"例","文":"做一點小小的事情，貪也好、瞋也好，吃一口東西，找它的最初因找不到；將來要還，是還不盡的。"},{"類":"因","文":"因為最初因找不到、還不盡，所以永遠在這個地方結生，這是真正的困擾。"},{"類":"破","文":"不要隨隨便便，人家送來的好東西，儘量吃、玩、用、樂，不可以呀！"},{"類":"立","文":"拿這東西自求解脫了，讓人家在福田中種福；現在不得解脫，人家白白浪費，你要還人家，怎麼還得乾淨。"},{"類":"下手","文":"任何一件事情，當下就策勵起我們大警惕來。"}],"af":"71a","st":1280}],"逐字稿":[{"t":"71A 20:38","b":[["q","「若時雖一果，初因非可見，見一亦增多，爾時何不畏。」"],["s","說隨便一個結果，就是我們隨便一個一生，這個說我們現在 ─「我」存在了，那麼你找它的這個一個結果，你找它的因，找它的因，「初因」，最初的原因哪裡來？你找不到，隨便這個一果都找不到哦！啊！所以這一個因緣無盡啊！你總得想這個上面，既然一切都是因緣，你要解決這個果，必定要從因上面；結果一個簡單的事情，你找最初因找不到的話，可想而知這個事情是何等地複雜。既然這麼複雜的，是何等地可怕。那這一下就找到更可怕的理由，懂不懂？所以我們現在隨便說，唉呀，做一點小小的事情，不管你貪也好、瞋也好，你以為吃一口東西，那一口東西的吃下去的東西，找它的最初因找不到。如果你要將來把那一口東西吃下去要還的話，你要還盡是還不盡，意思就是這個說。然後呢不管你做任何一件事情，這個它根本的原因就在這個地方，因為你這個最初因找不到、還不盡，所以你永遠在這個地方結生，永遠要解決這個問題，它這個真正的困擾在這裡。所以我們任何一件事情，當下就策勵起我們大警惕來，這個懂不懂？"]]},{"t":"71A 22:11","b":[["s","這個要再說一遍，「若時雖一果」，就是說任何一個果，你要找那個果的最初的因，找不到，找不到！那個時候你怎麼不怕呀，怎麼不怕呀！所以由此我們眼前隨便、隨便一樣東西，所以為什麼我們現在不要說，哎呀，隨隨便便，好像尤其是現在出家人，反正人家送得來的，反正你儘量地好的吃，去玩哪、用哪、樂啊，啊，不可以呀！你拿這個東西自求解脫了，那的確因為你解脫了可以得到，讓人家在這個福田當中種福；現在你不得解脫的話，人家也白白地浪費，你要還人家啊！既然這個因，頭找不到的話，你還人家，你怎麼還得乾淨哪！你怎麼還得清楚啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-05/025.mp3"},{"文":"其釋亦云：「此顯由諸難可度量稠林相續，令極難行生死大野，常應厭患，隨順於此，當如理修。」如此當知。","口譯":"它的釋論也說：「這是顯示，由於難以度量的稠林般的相續，使生死大荒野極為難行；應當常常厭患，隨順於此，如理修習。」應當這樣了知。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 23:03","頁":164,"af":"71a","st":1383,"et":1444,"消文":[{"文":"生死當中的雜染這樣地複雜，這個是真難行；這個道理應該好好地修。"},{"文":"平常講業果，是最簡單的基本業因；要找到基本因輾轉推行，只有佛才能夠窮盡。"},{"文":"所以我們必定要下足第一步，趕快努力。"}],"延伸":[],"逐字稿":[{"t":"71A 23:03","b":[["q","其釋亦云：「此顯由諸難可度量稠林相續，令極難行生死大野，"],["s","喏，就是這個樣。啊！所以生死當中那個雜染，這樣地、這樣地複雜，這個是真難行啊！"]]},{"t":"71A 23:29","b":[["q","常應厭患，隨順於此，當如理修。」"],["s","所以這個道理，你應該好好地修啊！"]]},{"t":"71A 23:37","b":[["q","如此當知。"],["s","這是我們應該的。所以我們平常講的業，好像業果 ─那是它最簡單的基本業因，如果說你要找到那個基本因的輾轉地推行的時候，只有佛才能夠窮盡，只有佛才能夠窮盡。所以我們必定要下足第一步趕快努力，趕快努力啊！這個就是它的道理。再下面："]]}],"口譯音":"口譯音檔/siwei-kudi-05/026.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-05/001.webp","n":1},{"img":"投影片/siwei-kudi-05/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/siwei-kudi-05/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/siwei-kudi-05/004.webp","n":4},{"img":"投影片/siwei-kudi-05/005.webp","n":5},{"img":"投影片/siwei-kudi-05/006.webp","n":6},{"img":"投影片/siwei-kudi-05/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=70b&st1=705&et1=834","box":[0.128625,0.3002222222222222,0.1315,0.06622222222222222]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-05/008.webp","n":8},{"img":"投影片/siwei-kudi-05/009.webp","n":9},{"img":"投影片/siwei-kudi-05/010.webp","n":10},{"img":"投影片/siwei-kudi-05/011.webp","n":11},{"img":"投影片/siwei-kudi-05/012.webp","n":12,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=70b&st1=834&et1=1046","box":[0.531125,0.27244444444444443,0.119,0.059555555555555556]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833 .8076115485564305]},{"img":"投影片/siwei-kudi-05/048.webp","n":48},{"img":"投影片/siwei-kudi-05/049.webp","n":49},{"img":"投影片/siwei-kudi-05/050.webp","n":50},{"img":"投影片/siwei-kudi-05/051.webp","n":51,"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-05/052.webp","n":54,"yt":"E1qFpq1i0fY"},{"img":"投影片/siwei-kudi-05/053.webp","n":55}],"投影片PDF":"投影片/siwei-kudi-05/slides.pdf","音檔範圍":"70B 11:45～71A 24:04"},"siwei-kudi-06":{"id":"siwei-kudi-06","標題":"思惟苦諦(6)","根":"思惟六苦","科判焦點":"丑二 思惟六苦","課本範圍":"P164 LL3 ~ P167 L1","堂數":91,"日期":"2026/12/8","分圖":[{"名":"數數高下・無伴","原文":[0,5]},{"名":"六苦總攝為三","原文":[6,10]},{"名":"思惟三苦","根":"思惟三苦","原文":[11,22]}],"跨科判":[{"科判":"丑三 思惟三苦","起":11}],"週":115,"班級":"24秋007","序":null,"音檔":{"71a":{"local":"音檔/gl1/071A.mp3","remote":"https://lamrim.xyz/player/media/gl1/071A.mp3"},"71b":{"local":"音檔/gl1/071B.mp3","remote":"https://lamrim.xyz/player/media/gl1/071B.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=71a&st1=1444&af2=71b&af3=72a&et3=73","段":[{"文":"«數數高下»過患者。如云：「既成百施世應供，業增上故復墮地，既滿轉輪聖王已，復於生死為奴婢。天趣天女乳腰柔，長受安樂妙觸已，後墮地獄鐵輪中，當受粗磨割裂觸。長時安住須彌頂，安足陷下受安樂，後遊煻煨屍泥中，當念眾苦極難忍。天女隨逐受歡喜，遊戲端妙歡喜園，後當住止劍葉林，獲割耳鼻刖手足。天女殊妙如金蓮，共同游泳徐流池，後墮地獄當趣入，難忍灰水無極河。雖得天界大欲樂，及諸梵天離欲樂，後墮無間為火薪，忍受眾苦無間絕。得為日月自身光，照曜一切諸世間，後往極黑陰闇處，自手伸舒亦莫覩。」","口譯":"數數高下的過患：如說：「既已成為百施（帝釋），受世間供養，又由於業力的緣故再墮落到地上；既已成為圓滿的轉輪聖王，又在生死中成為奴婢。在天趣中，長時受用天女柔軟胸腰的安樂妙觸之後，又墮入地獄的鐵輪之中，承受粗磨割裂的觸受。長時安住在須彌山頂，踩下去柔軟下陷而受安樂，之後卻行走在熱灰與屍泥之中，應當想到這些眾苦極為難忍。在天女隨侍之下受用歡喜，遊戲於端妙的歡喜園，之後卻要住在劍葉林中，被割耳鼻、斷手足。與殊妙如金蓮的天女，一同在徐徐流動的池中游泳，之後卻墮入地獄，進入難忍的灰水無極河。即使得到天界的大欲樂，以及梵天離欲的安樂，之後墮入無間地獄成為火的薪柴，忍受眾苦，無間斷絕。得為日月，自身的光明照耀一切世間，之後卻前往極黑暗的地方，連自己伸出手來都看不見。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 24:04","頁":164,"af":"71a","st":1444,"et":1693,"消文":[{"文":"上升了又要跌下去，這是受不了；先上，上去了以後下來。"},{"文":"「既成百施世應供」：做了種種布施，受到世間好的供養，帝王等等；造了業以後又墮落。"},{"類":"例","文":"前天講的故事，一個國王還做好事，吃醉了酒殺了一個人，結果墮落了。"},{"文":"轉輪聖王是世間最高的，奴婢是最差的；本來做老闆忽然去做夥計我們就受不了，何況轉輪聖王；一下做總統，忽然做階下囚。"},{"文":"升天，天完了以後到地獄，種種地方都受這個事情。"}],"延伸":[{"題":"數數高下","組":[{"題":"認真思惟就感受得到","說":[{"類":"立","文":"這個事情我們好像不大容易感受得到；如果認真思惟一下，還是很容易感受得到的。"}]},{"題":"熱望之物忽然失去","說":[{"類":"例","文":"男女之間好得要命，忽然一方移情別戀，看見你白眼相向，那時內心的痛苦。"},{"類":"例","文":"做生意本來很得意，人家來求你；忽然欠一屁股債，到處避債、不敢見人。"}]},{"題":"天上墮地獄，更甚於此","說":[{"類":"立","文":"那只是失去了，你可沒有受地獄；他是本來在天堂上好成那樣，一下跑到地獄裡去，這樣的高下法。"}]}],"說":[{"類":"立","文":"這個事情我們好像不大容易感受得到；如果認真思惟一下，還是很容易感受得到的。"},{"類":"例","文":"男女之間好得要命，忽然一方移情別戀，看見你白眼相向，那時內心的痛苦。"},{"類":"例","文":"做生意本來很得意，人家來求你；忽然欠一屁股債，到處避債、不敢見人。"},{"類":"立","文":"那只是失去了，你可沒有受地獄；他是本來在天堂上好成那樣，一下跑到地獄裡去，這樣的高下法。"}],"af":"71a","st":1604}],"逐字稿":[{"t":"71A 24:04","b":[["q","數數高下過患者。"],["s","第五，上升了又要跌下去，這個是受不了。下去了你覺得上升，對不起，上升了還要跌下來。"]]},{"t":"71A 24:15","b":[["q","如云：「既成百施世應供，業增上故復墮地，既滿轉輪聖王已，復於生死為奴婢。天趣天女乳腰柔，長受安樂妙觸已，後墮地獄鐵輪中，當受粗磨割裂觸。長時安住須彌頂，安足陷下受安樂，後遊煻煨屍泥中，當念眾苦極難忍。天女隨逐受歡喜，遊戲端妙歡喜園，後當住止劍葉林，獲割耳鼻刖手足。天女殊妙如金蓮，共同游泳徐流池，後墮地獄當趣入，難忍灰水無極河。雖得天界大欲樂，及諸梵天離欲樂，後墮無間為火薪，忍受眾苦無間絕。得為日月自身光，照曜一切諸世間，後往極黑陰闇處，自手伸舒亦莫覩。」"],["s","這個是高下。他講高下的話，就是你先上，上去了以後下來，就這樣。「既成百施世應供」，換句話說，你做了種種的布施，然後受到世間的種種的好的供養，那帝王啊什麼等等。對不起，造了業以後你又墮落了，又墮落了。前天我們講的那個故事當中就有這個，一個國王，他還做好事哦！吃醉了酒了，殺了一個人，結果墮落了。那現在這個時候，那我們看看，那不得了！所以世間是一無可取，一旦墮落了以後，對不起！「既滿轉輪聖王已」，那個是更好，一下在生死當中做奴婢，轉輪聖王是我們世間最高的，奴婢是最差的。我們現在不要說轉輪聖王，本來做個老闆，忽然跑得去做一個夥計，我們就受不了，何況是轉輪聖王！一下做個總統，忽然之間做個階下囚。唉！然後呢升天，天完了以後到地獄，這個種種地方，它下面這個裡邊都受這個事情。"]]},{"t":"71A 26:44","b":[["s","通常像這個事情，我們好像不大容易感受得到，如果你認真思惟一下的話，我們還是很容易感受得到的。怎麼思惟呢？譬如說，你們以前曾經有過很好的，譬如說很熱望的一樣東西，很熱望的東西，忽然之間熱望的東西失去了，失去了。通常一般來說的話，男女之間，哎喲，大家好得要命，忽然之間其中的一方移情別戀，然後看見你了，跟你白眼相向。唉呀，你那個時候內心的痛苦，那個比起前面這個裡邊說的話，那還不曉得差多少 ─那它只是失去了，你可沒有受地獄唷！他不是喔，本來在天堂上面好成這個樣的，忽然之間一下跑到地獄裡面去。啊！這樣的高下法，這個是我們應該體會到的。這個世間哪！然後你做生意，本來一向做得很得意，忽然之間做個階下囚，欠了一屁股債。那本來你得意的，人家跑得來求你，忽然之間到了那個時候你又要避債，到處都不敢見人。那個比起這個上面說的話，那已經好得不曉得好多少哦！所以，數數高下的過患。下面說："]]}],"口譯音":"口譯音檔/siwei-kudi-06/001.mp3"},{"文":"磨等三鐵輪者，如其次第，謂於眾合、黑繩、燒熱三中而有。","口譯":"「磨」等三種鐵輪，依照次第，是說在眾合、黑繩、燒熱三種地獄中所有的。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 28:13","頁":165,"af":"71a","st":1693,"et":1724,"消文":[{"文":"指上面說的那幾樣：本來在天上，一下到眾合地獄、黑繩地獄，然後到燒熱，三個地獄當中去。"}],"延伸":[],"逐字稿":[{"t":"71A 28:13","b":[["q","磨等三鐵輪者，如其次第，謂於眾合、黑繩、燒熱三中而有。"],["s","就是指前面，上面他說的那個幾樣東西，那是指什麼呢？本來在天上面，然後一下到眾合地獄，到黑繩地獄，然後到燒熱，三個地獄當中去。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/002.mp3"},{"文":"天女隨逐者，謂為天女之所依附。天界欲樂者，謂忉利以上欲天所有。日月光者，是如世間共許而說，未分能依及所依處，若分別說，乃是彼二宮殿之光。此等為喻，當思一切從高墮下所有道理，«厭患三有»，以其三有一切盛事，最後邊際，衰所攝故。","口譯":"「天女隨逐」，是說被天女所依附。「天界欲樂」，是說忉利天以上的欲界天所有的欲樂。「日月光」，是依照世間共許的說法而說，沒有區分能依（日月天子）與所依處（宮殿）；如果分別來說，那是日月二宮殿的光明。這些都是比喻，應當思惟一切從高處墮下的道理，厭患三有，因為三有的一切盛事，最後的邊際都為衰敗所攝。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71A 28:44","頁":165,"af":"71a","st":1724,"et":null,"消文":[{"文":"這是解釋偈子裡說的那些，不必一一細說。"},{"文":"總之一句話：再好的東西，最後墮落；只要還在三有當中，任何好事最後一句話：墮落。"}],"延伸":[{"題":"厭患三有","組":[{"題":"難陀見地獄，天堂也不要","說":[{"類":"例","文":"難陀尊者先不肯努力，一看天堂就努力了；再到地獄一看，發現天堂受完了還要回來，拼命連天堂也不要了。"}]},{"題":"幸聞圓滿教法，趕快跳出","說":[{"類":"因","文":"我們宿生沒有積這樣的福德，不能感得這樣的大聖者來引導。"},{"類":"下手","文":"所幸還積了少分福德，聽見這個圓滿的教法，趕快如理努力，有份跳出來。"},{"類":"立","文":"一旦失去這個機會，以後連聽都聽不到；那時吞烊銅、在油鍋裡煎，才可怕。"}]}],"說":[{"類":"例","文":"難陀尊者先不肯努力，一看天堂就努力了；再到地獄一看，發現天堂受完了還要回來，拼命連天堂也不要了。"},{"類":"因","文":"我們宿生沒有積這樣的福德，不能感得這樣的大聖者來引導。"},{"類":"下手","文":"所幸還積了少分福德，聽見這個圓滿的教法，趕快如理努力，有份跳出來。"},{"類":"立","文":"一旦失去這個機會，以後連聽都聽不到；那時吞烊銅、在油鍋裡煎，才可怕。"}],"af":"71a","st":1760}],"逐字稿":[{"t":"71A 28:44","b":[["q","天女隨逐者，謂為天女之所依附。天界欲樂者，謂忉利以上欲天所有。日月光者，是如世間共許而說，未分能依及所依處，若分別說，乃是彼二宮殿之光。此等為喻，當思一切從高墮下所有道理，厭患三有，以其三有一切盛事，最後邊際，衰所攝故。"],["s","他上面就是解釋那個裡面說的那些，那這個地方我們也不必一一細說。總之一句話：你再好的東西，最後─墮落。在任何情況之下，你只要還在三有當中，三有當中任何的好事，它最後的話呢，一句話─墮落，最後一句話─墮落。所以你想到這裡，唉呀，「厭患三有」啊！所以這個難陀尊者，先不肯努力，結果一看地獄就努力了；喔唷，這樣一看天堂就努力了。結果再到地獄裡面一看哪，發現：唉呀，天堂受完了，還要回來，那是這拼命這個天堂也不要了。"]]},{"t":"71B 00:10","b":[["s","我們不幸啊，因為我們宿生沒有積這樣的福德，所以不能感得這樣的這個大聖者來引導我們。所幸的我們多多少少，還積了一點少分的福德，聽見這個圓滿的教法，我們趕快如理努力，我們有份跳出來，有份跳出來。所以想到這裡，眼前我們應該更加努力，更加努力，這樣才對呀！要不然一旦失去了這個機會，那完了，以後連聽都聽不到了。那只有一件事情，到那個時候吞烊銅，在油鍋裡煎，那才可怕呀！"]]}],"口譯音":"口譯音檔/siwei-kudi-06/003.mp3"},{"文":"此如《調伏阿笈摩》云：「«積集皆銷散»，崇高必墮落，合會終別離，有命咸歸死。」","口譯":"這就像《調伏阿笈摩》（戒律的經典）說的：「積聚起來的終究會散掉，爬得再高也一定會掉下來，聚在一起終究會分開，有生命的都會死。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 00:51","頁":165,"af":"71b","st":51,"et":150,"消文":[{"文":"不管你有多少財產，最後銷散；爬得多高，墮落；大家親親愛愛，別離；有命咸歸死。"}],"延伸":[{"題":"積集皆銷散","組":[{"題":"真正要忙的是出離","說":[{"類":"立","文":"想到這裡，這些東西都沒有意思，忙它幹什麼？真正要忙的一件事情：趕快出離。"},{"類":"回扣","文":"所以「火燒頭燃尚可暫置」。"}]},{"題":"為萬年計，一堆灰","說":[{"類":"破","文":"忙股票、存銀行，不曉得作什麼千秋大夢。"},{"類":"破","文":"積了一個月還要一年，積了一年還要一百年、一千年；沒有一個人活到一百年，卻都為萬年計。"},{"類":"立","文":"忙了半天一堆灰，然後到地獄裡受苦，真划不來。"}]},{"題":"祖師今日送盡","說":[{"類":"例","文":"有位祖師今天吃完，就把東西送給別人：「我明天有沒有都不知道，你留在那個地方，人家施主一番好心，你留在那裡幹什麼！」"},{"類":"例","文":"天天送，徒弟苦不堪言，後來徒弟也成就了；古來人的修行是這個樣。"}]}],"說":[{"類":"立","文":"想到這裡，這些東西都沒有意思，忙它幹什麼？真正要忙的一件事情：趕快出離。"},{"類":"回扣","文":"所以「火燒頭燃尚可暫置」。"},{"類":"破","文":"忙股票、存銀行，不曉得作什麼千秋大夢。"},{"類":"破","文":"積了一個月還要一年，積了一年還要一百年、一千年；沒有一個人活到一百年，卻都為萬年計。"},{"類":"立","文":"忙了半天一堆灰，然後到地獄裡受苦，真划不來。"},{"類":"例","文":"有位祖師今天吃完，就把東西送給別人：「我明天有沒有都不知道，你留在那個地方，人家施主一番好心，你留在那裡幹什麼！」"},{"類":"例","文":"天天送，徒弟苦不堪言，後來徒弟也成就了；古來人的修行是這個樣。"}],"af":"71b","st":80}],"逐字稿":[{"t":"71B 00:51","b":[["q","此如《調伏阿笈摩》云：「積集皆銷散，崇高必墮落，合會終別離，有命咸歸死。」"],["s","經上面就告訴我們，「積聚」，不管你有多少財產，最後呢「銷散」；爬得多高 墮落；大家親親愛愛 別離；「有命咸歸死」。你想到這裡，這些東西都沒有意思，忙它幹什麼啊？真正要忙的一件事情 ─趕快出離啊！所以「火燒頭燃尚可暫置」。我看現在人家要忙這個股票，喔唷，存那個銀行，不曉得做些什麼呀，不曉得作什麼千秋大夢啊！所以我看見一個祖師，他今天吃完了，把那些東西送給別人，為什麼？「我明天有沒有都不知道，你留在那個地方，人家施主一番好心，你留在那裡幹什麼！」結果他天天人家送，天天送，那個徒弟苦不堪言。欸，結果你不要看徒弟苦不堪言，那個徒弟也後來也成就了，那真正古來人的修行是這個樣。唉呀！現在我們積了一個月還要一年，積了一年還要積一百年，積了一百年還要積一千年。實在我們能吃多少啊？那人沒有一個人能活到一百年，可是我們都是為萬年計，不曉得忙些什麼！結果忙了半天一堆灰，然後到地獄裡受苦，真划不來！再下面，這個是六苦當中的最後一個。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/004.mp3"},{"文":"無伴過患者。如云：「若能了知如是過，願取三福燈光明，獨自當趣雖日月，難破無邊黑闇中。」了知過者，謂當了知如前所說，須如是死，願取福光。三種福者，謂三門善事，或施所生等三種善事。無邊黑闇者，謂無明黑闇。無伴而趣者，","口譯":"第六，沒有伴的過患。如經中說：「如果明白了這樣的過患，希望你帶上三種福德的燈光，因為你必須一個人走進那連太陽月亮都照不亮的無邊黑暗裡。」「明白過患」，是說要明白前面講的，人一定會那樣死去，所以要帶上福德的光。「三種福」，是指身、口、意三方面的善行，或是布施等三種善行。「無邊黑暗」，是指愚癡無明的黑暗。「沒有伴地走」，","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 02:30","頁":165,"af":"71b","st":150,"et":263,"消文":[{"文":"了解了上面這樣的過失，一無可貪；那時怎麼辦？不要貪著，去修行，修「三福」。"},{"文":"三門善事：身、口、意努力去做；這個是「福光明」，燈是照明的，平常我們在無明黑暗當中。"},{"文":"不在這上面努力，到「難破無邊黑闇」，沒有日月的惡道，「獨自當趣」。"},{"文":"眼前忙的東西一樣帶不走，一個人也不陪你；你營養了半天這個身體，就送你到這個地方去，不值得。"}],"延伸":[],"逐字稿":[{"t":"71B 02:30","b":[["q","無伴過患者。如云：「若能了知如是過，願取三福燈光明，獨自當趣雖日月，難破無邊黑闇中。」了知過者，謂當了知如前所說，須如是死，願取福光。三種福者，謂三門善事，或施所生等三種善事。無邊黑闇者，謂無明黑闇。無伴而趣者，（如下面等等。）"],["s","現在到這個地方，我先解釋一下。假定我們能夠了解了像上面這樣的過失的話，唉呀，這一無可貪、一無可貪哪！那時候怎麼辦哪？不要貪著，去修行，修什麼？修「三福」，三福下面說「三門善事」，就是身、口、意努力去做這個。這個是什麼？「福光明」，這個才是。燈是照明的，平常我們在無明黑暗當中，那這樣，這個才是我們應該取的，不是要在生死輪迴當中，這樣。如果說你不在這個上面努力的話，那麼對不起，那個時候你到哪裡去啊？「難破無邊黑闇」，而且這個地方是沒有日月的，這個是惡道，這個是到那時候「獨自當趣」呀！你眼前忙的東西，一樣帶不走，一個人也不陪你。你忙這個身體，營養了半天，就送你到這個地方去，不值得啊！至於說「無伴」，什麼呢？下面說，論上面告訴我們："]]}],"口譯音":"口譯音檔/siwei-kudi-06/005.mp3"},{"文":"如《入行論》云：「獨生此一身，俱生諸骨肉，壞時尚各散，何況餘親友。生時獨自生，死時還獨死，他不取苦分，«何須作障親»。」","口譯":"如《入行論》說：「獨自生出這一個身體，與身俱生的骨肉，壞滅時尚且各自離散，何況其餘的親友？出生時獨自出生，死去時也獨自死去；別人無法分擔我的苦，何必去作障礙修行的親友？」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 04:23","頁":165,"af":"71b","st":263,"et":340,"消文":[{"文":"獨生此一身；自己覺得這總是「我」吧，壞的時候這個東西也壞掉了。"},{"文":"眼前親友沒有一個人跟你，帶不走；生的時候自己生，死的時候自己死，他不能替代我們。"}],"延伸":[{"題":"何須作障親","組":[{"題":"互相幫助，莫相障礙","說":[{"類":"立","文":"何必互相障礙？在這個地方互相幫助，難得趁這個機會互相幫助，這個才是我們真正需要的。"},{"類":"立","文":"互相幫助有大利益，互相障礙毫無意思。"}]},{"題":"可靠唯法與僧","說":[{"類":"立","文":"真正可靠的：靠法、靠僧，這個才對；除此以外其他的沒有。"},{"類":"回扣","文":"「無伴」，記牢這個！"}]}],"說":[{"類":"立","文":"何必互相障礙？在這個地方互相幫助，難得趁這個機會互相幫助，這個才是我們真正需要的。"},{"類":"立","文":"互相幫助有大利益，互相障礙毫無意思。"},{"類":"立","文":"真正可靠的：靠法、靠僧，這個才對；除此以外其他的沒有。"},{"類":"回扣","文":"「無伴」，記牢這個！"}],"af":"71b","st":305}],"逐字稿":[{"t":"71B 04:23","b":[["q","如《入行論》云：「獨生此一身，俱生諸骨肉，壞時尚各散，何況餘親友。生時獨自生，死時還獨死，他不取苦分，何須作障親。」"],["s","這個身體，生─獨生此一身，這個身體生來嘛也就是。然後呢這個自己覺得：唉呀，這個總是「我」吧！對不起，壞的時候，對不起，這個東西也是壞掉了，壞掉了。眼前的親友等等沒有一個人跟你，沒有一個人，這個東西帶不走，這樣的情況。所以沒有什麼好伴，生的時候自己生，死的時候還自己死，他不能替代我們，何必互相障礙？所以我們現在在這個地方互相幫助，這是真正的，難得趁著這個機會互相幫助，這個才是我們真正需要的。互相幫助有大利益，互相障礙毫無意思。真正可靠的 ─靠法、靠僧，這個才對。除此以外其他的沒有，「無伴」，記牢這個！"]]}],"口譯音":"口譯音檔/siwei-kudi-06/006.mp3"},{"文":"如是六苦總攝為三。謂於生死中，«無保信處»。","口譯":"這六苦可以歸納成三類。第一類是：在生死裡，沒有一樣靠得住。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 05:40","頁":165,"af":"71b","st":340,"et":427,"消文":[{"文":"前面六樣東西總集起來，分三個大項目。"},{"文":"第一個，在整個生死當中，沒有可以信賴的，也沒有可以保證的。"}],"延伸":[{"題":"無保信處","組":[{"題":"先積資財再修行，完全錯了","說":[{"類":"破","文":"有人說：「我要修行了，先積幾個錢存在銀行裡，先買一點股票。」完全錯了！"},{"類":"破","文":"「我先去造一個房子，造好了在底下閉關。」不要這樣！"}]},{"題":"趕快找法照著做","說":[{"類":"下手","文":"要修行了，趕快找修行的佛法是什麼，照著去做，這個才對。"},{"類":"立","文":"佛告訴我們清清楚楚，這種東西一點都沒辦法保證你、可以信賴；修行必定要認識：這些東西不要忙。"}]},{"題":"發心莊嚴，目的仍是出離","說":[{"類":"立","文":"如果發了大心，為了別人莊嚴，這了不起；但目的還是見到生死可怕，要幫助別人、引發別人。"},{"類":"回扣","文":"這地方是根本在此：「無保信處」，生死輪迴當中沒有一樣東西可靠。"}]}],"說":[{"類":"破","文":"有人說：「我要修行了，先積幾個錢存在銀行裡，先買一點股票。」完全錯了！"},{"類":"破","文":"「我先去造一個房子，造好了在底下閉關。」不要這樣！"},{"類":"下手","文":"要修行了，趕快找修行的佛法是什麼，照著去做，這個才對。"},{"類":"立","文":"佛告訴我們清清楚楚，這種東西一點都沒辦法保證你、可以信賴；修行必定要認識：這些東西不要忙。"},{"類":"立","文":"如果發了大心，為了別人莊嚴，這了不起；但目的還是見到生死可怕，要幫助別人、引發別人。"},{"類":"回扣","文":"這地方是根本在此：「無保信處」，生死輪迴當中沒有一樣東西可靠。"}],"af":"71b","st":360}],"逐字稿":[{"t":"71B 05:40","b":[["q","如是六苦總攝為三。"],["s","把前面這個，「如是六苦」，六樣東西總集起來，分三個大項目。第一個，"]]},{"t":"71B 05:49","b":[["q","謂於生死中，無保信處。"],["s","第一個，在整個的生死當中，沒有可以信賴的，也沒有可以保證的。所以從這一點上面來，所以有人說：「唉呀，我要修行了，先啊積幾個錢存在銀行裡，然後先買一點股票。」完全錯了！「我先去造一個房子，然後造好了，在那個底下要去閉關了。」不要這樣，不要！我要去修行了，趕快找修行的佛法是什麼，然後照著去做，這個才對的。佛也告訴我們清清楚楚，這種東西一點都沒辦法保證你，一點都沒辦法可以信賴的。所以第一個，我們修行必定要認識的：這些東西不要忙。如果說你發了大心，為了別人 ─莊嚴，這個了不起！但是你這個目的幹什麼？還是見到了這個生死可怕，你要幫助別人、引發別人，目的仍舊是這個，這一點千萬注意，這千萬注意！總之這個地方這是根本在此，所以「無保信處」，在生死輪迴當中沒有一樣東西，這樣。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/007.mp3"},{"文":"受彼安樂，«終無飽期»。","口譯":"受用那些安樂，終究沒有飽足的時候。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 07:07","頁":165,"af":"71b","st":427,"et":581,"消文":[{"文":"雖然要找到快樂，在任何情況之下沒辦法飽滿；不但沒辦法飽滿，越弄越糟。"},{"類":"例","文":"眼前貪一點小便宜，然後烊銅熱鐵灌口，受盡了痛苦。"}],"延伸":[{"題":"終無飽期","組":[{"題":"等流相續，又來了","說":[{"類":"因","文":"從地獄逃出來以後，等流因果還在那裡，又來了；難得跑到人身短短幾十年，等流就這麼厲害。"},{"類":"例","文":"貪心重成餓鬼，吃到的是烊銅熱鐵；惡業完了作畜生還；還清了跑到人間，那個嘴巴又來了。"},{"類":"立","文":"眼前為什麼會現起？就是等流，宿生的習氣在。"}]},{"題":"從等流上切斷","說":[{"類":"下手","文":"你不從這個上面切斷，永遠沒機會；真正修行，大家注意，所謂等流。"}]},{"題":"懺悔要認得心隨煩惱","說":[{"類":"回扣","文":"懺悔文「從無始時來，十惡五無間，心隨煩惱故，諸罪皆懺悔」：無始以來心隨著煩惱，就在等流心識。"},{"類":"立","文":"任何境界現起，不修對治、不照這個辦法思惟觀察，老脾氣又來了，一定跟著它去；修行修的就是這個。"},{"類":"破","文":"說「我業障很重啊」，說了半天業障在哪裡自己也不知道，你懺什麼悔！"}]}],"說":[{"類":"因","文":"從地獄逃出來以後，等流因果還在那裡，又來了；難得跑到人身短短幾十年，等流就這麼厲害。"},{"類":"例","文":"貪心重成餓鬼，吃到的是烊銅熱鐵；惡業完了作畜生還；還清了跑到人間，那個嘴巴又來了。"},{"類":"立","文":"眼前為什麼會現起？就是等流，宿生的習氣在。"},{"類":"下手","文":"你不從這個上面切斷，永遠沒機會；真正修行，大家注意，所謂等流。"},{"類":"回扣","文":"懺悔文「從無始時來，十惡五無間，心隨煩惱故，諸罪皆懺悔」：無始以來心隨著煩惱，就在等流心識。"},{"類":"立","文":"任何境界現起，不修對治、不照這個辦法思惟觀察，老脾氣又來了，一定跟著它去；修行修的就是這個。"},{"類":"破","文":"說「我業障很重啊」，說了半天業障在哪裡自己也不知道，你懺什麼悔！"}],"af":"71b","st":450}],"逐字稿":[{"t":"71B 07:07","b":[["q","受彼安樂，終無飽期。"],["s","然後呢，第二個，你雖然要找到快樂，但是在任何情況之下，你沒辦法飽滿的。不但沒辦法飽滿，正因為如此，是越弄越糟、越弄越糟。現在眼前貪一點小便宜，然後烊銅熱鐵灌口，唉呀！受盡了苦痛、苦痛、痛苦。然後等到你出來的時候，欸，對不起，逃出來了以後那個等流因果還在那裡，又來啦！然後呢難得的跑到人身當中，短短的幾十年，對不起那個等流就這麼厲害。所以我前面告訴你們：你不從這個上面切斷，你永遠沒機會。眼前為什麼我們會這個現起呢？簡單嘛！就是等流，就是說明就是宿生的習氣在。眼前做了墮落，然後到那個時候，因為你呀貪心重，所以餓鬼，如果還再造一點業的話，那個吃的不是吃不到，吃得到的，吃什麼？烊銅熱鐵。啊！這麼可怕。然後等到把惡業弄完了以後，然後作畜生還。還，統統還清了又跑到人間來；跑到人間來，對不起，那個嘴巴又來了、又來了。啊！這麼個可怕法，它永遠沒有飽足的。"]]},{"t":"71B 08:31","b":[["q","所以懂得了這一點，就要曉得：哦，真正修行，大家注意哦，所謂等流。所以我們懺悔的當中，「從無始時來，十惡五無間，心隨煩惱故」，記得這句話吧？「諸罪」應該如何啊？「皆懺悔」。啊！原來我無始以來心隨著煩惱，什麼地方"],["s","隨起？就在那地方 ─等流心識。任何一個境界現起的時候，如果說你不修對治，不照這個辦法思惟觀察的話，欸，你這個老脾氣又來了，看見了又來了。那個時候是什麼？煩惱，你一定跟著它去，一定跟著它去。修行修什麼？就是這個。所以這個懺悔真正的用意，你必定要懂得；否則的話，你說我懺悔啊，哎喲，我慚愧呀，我業障很重啊！說了半天你的業障在哪裡呀？自己也不曉得，自己也根本不知道，你懺什麼悔！這一點概念我們現在清楚啦，非常好！最後第三點是："]]}],"口譯音":"口譯音檔/siwei-kudi-06/008.mp3"},{"文":"無始而轉。","口譯":"無始以來不斷流轉。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 09:41","頁":165,"af":"71b","st":581,"et":600,"消文":[{"文":"沒有保證、沒有信賴；得到好的永遠沒有飽足，反而受大苦；這狀態就永遠在那裡轉，沒頭沒腦。"}],"延伸":[],"逐字稿":[{"t":"71B 09:41","b":[["q","無始而轉。"],["s","就像前面這個東西，第一個沒有保證、沒有信賴；而且呢，得到了好的是永遠沒有飽足，反而受了大苦。這個狀態呢，就永遠在那裡轉，沒頭沒腦。唉！這麼嚴重法。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/009.mp3"},{"文":"初中有四，一於所得身不可保信者，謂身數數捨。二作諸前益不可保信者，謂無決定。三於得盛事不可保信者，謂高下變易。四於諸共住不可保信者，謂無伴而往。","口譯":"第一類（靠不住）又有四點：一、得到的身體靠不住，因為要一再捨掉身體；二、過去對別人的好靠不住，因為恩怨沒有定準；三、得到的榮華富貴靠不住，因為一下高一下低；四、身邊一起生活的人靠不住，因為死時只能一個人走。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 10:00","頁":166,"af":"71b","st":600,"et":681,"消文":[{"文":"第一個無保信，有四個。"},{"類":"例","文":"身不可保：準備營養，偏偏吃出毛病；出去找快樂出了車禍；安穩坐在屋裡房子塌下來；一點傳染病也弄死了。"},{"類":"例","文":"前益不可保：賺了錢擺銀行，銀行倒閉；強盜知道你有錢把你抓去；股票跌了虧了本。"},{"文":"得盛事不可保：做了種種很好的，一下跌下來了；共住不可保：就是無伴。"}],"延伸":[],"逐字稿":[{"t":"71B 10:00","b":[["q","初中有四，"],["s","這個第一個就是無保信，有四個。"]]},{"t":"71B 10:08","b":[["q","一於所得身不可保信者，謂身數數捨。二作諸前益不可保信者，謂無決定。"],["s","這個身體的確的確、的確地你能信任嗎？你覺得那個身體弄得好，你準備一點營養，欸，結果偏偏吃下去的出了毛病。啊！你覺得這個好，跑出去為了要找一點快樂，跑出去出了車禍了。乃至於你安安穩穩坐在這個屋子裡面，叭！房子塌下來了。你沒有什麼事情，自己也看不見，對不起，一點傳染病，你也弄死掉了。那你就這樣啊！身不可保。還有呢前面作的「諸益」，哎唷，我覺得賺了一點錢，擺在銀行裡邊，結果銀行倒閉了；欸，結果人家曉得，強盜曉得你有了錢了，把你抓得去了，種種這些問題。唉呀，你忙那個股票，「叭！」一下，股票跌掉了、虧了本了。啊，一點意思都沒有啊！所以前面作的益不可保信。"]]},{"t":"71B 11:08","b":[["q","三於得盛事不可保信者，謂高下變易。"],["s","啊！你做了種種很好的，「叭嗒！」一下，跌下來了。"]]},{"t":"71B 11:16","b":[["q","四於諸共住不可保信者，謂無伴而往。"],["s","那就是這個。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/010.mp3"},{"文":"第三者謂數數結生，展轉受生不見邊際，«如是總攝亦當思惟»。","口譯":"第三項（無始而轉），就是數數結生，輾轉受生，看不見邊際。像這樣總攝起來，也應當思惟。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 11:21","頁":166,"af":"71b","st":681,"et":767,"消文":[{"文":"第三就是「無始而轉」，不斷地在那個地方轉。"},{"文":"八苦我們常常聽見，六苦一般不大多，在這裡又多了一個思惟的苦。"}],"延伸":[{"題":"如是總攝亦當思惟","組":[{"題":"從項目中找相應感觸","說":[{"類":"立","文":"思八苦、六苦沒什麼太大關係；真正重要的是從這幾個項目當中，找到跟你相應的，忽然之間有深的感觸。"}]},{"題":"轉變錯誤概念，修行第一步","說":[{"類":"下手","文":"把當下的感觸不斷思惟觀察，讓認識的量產生強有的力量，把以前錯誤的概念轉變過來；修行第一步就是這個工作。"}]},{"題":"轉過來，一心念佛","說":[{"類":"例","文":"轉過來了，一心一意忙你要做的：念佛的，把嘴巴封起來心裡還在拼命念；生了病也不怕，正好到極樂世界去。"},{"類":"回扣","文":"所以說，低處修時，是高處到！"}]}],"說":[{"類":"立","文":"思八苦、六苦沒什麼太大關係；真正重要的是從這幾個項目當中，找到跟你相應的，忽然之間有深的感觸。"},{"類":"下手","文":"把當下的感觸不斷思惟觀察，讓認識的量產生強有的力量，把以前錯誤的概念轉變過來；修行第一步就是這個工作。"},{"類":"例","文":"轉過來了，一心一意忙你要做的：念佛的，把嘴巴封起來心裡還在拼命念；生了病也不怕，正好到極樂世界去。"},{"類":"回扣","文":"所以說，低處修時，是高處到！"}],"af":"71b","st":695}],"逐字稿":[{"t":"71B 11:21","b":[["q","第三者謂數數結生，展轉受生不見邊際，如是總攝亦當思惟。"],["s","就是這個道理。前面所謂這個第三的話，就是「無始而轉」，不斷地在那個地方去轉，這幾個道理。那麼這個是前面六苦，八苦我們常常聽見的，六苦我們一般不大多，所以在這個地方，我們又多了一個思惟的苦。其實思八苦、六苦沒什麼太大關係，真正重要的就是怎麼樣從這個幾個項目當中，能夠找到跟你相應的 ─欸，忽然之間你有深的感觸。然後呢把這個感觸，就是你當下的認識，然後呢不斷地去思惟觀察，把這個認識的量，產生強有的力量，把你以前錯誤的概念轉變過來，所以修行第一步就是這個工作。等到轉變過來了，那個時候，你一心一意地就忙你要做的事情。如果你念佛，叫你不念佛也談不到，把你嘴巴封起來，你心裡還在拼命念，生了病我也不怕，正好到極樂世界去，這樣好法呀！所以說，低處修時，是高處到！那麼下面："]]}],"口譯音":"口譯音檔/siwei-kudi-06/011.mp3"},{"文":"第三修三苦者。謂譬如極熱或瘡或癰，若於其上灑以冷水，似為安樂，於生死中所有樂受，若壞滅時，還起眾苦，«故名壞苦»。","口譯":"第三，修習三苦：譬如極熱的瘡或癰，如果在上面灑冷水，似乎覺得安樂；生死中所有的樂受，在它壞滅的時候，還會生起眾苦，所以名為壞苦。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 12:47","頁":166,"af":"71b","st":767,"et":901,"消文":[{"文":"三苦：苦苦、樂苦以及行苦；第一個是樂苦。"},{"類":"喻","文":"生的瘡燙得要命、難受得要命，上面弄一點水涼一下，就好像是安樂。"},{"文":"生死當中所受的快樂也就是這個，本身並不是快樂；瘡破的時候是絕大的痛苦，所以快樂是一無可取。"}],"延伸":[{"題":"故名壞苦","組":[{"題":"可怕的不是苦，是樂","說":[{"類":"立","文":"真正可怕的不是苦，苦的事情還用佛來講嗎？真正我們要了解的是快樂。"},{"類":"因","文":"明明是苦的，我們看不見；不但看不見，上了它的當還要受種種大苦惱。"}]},{"題":"從此不再受騙","說":[{"類":"立","文":"一定要經過佛菩薩告訴我們，從此不再受你騙。"},{"類":"下手","文":"以前做的非法的事情、積聚，趕快丟掉；捨掉以後供養三寶、迴向。"}]},{"題":"以不可靠換堅實","說":[{"類":"下手","文":"趁有暇之身，以不可靠的換得堅實的法財。"},{"類":"下手","文":"這個身體也是如此，不要貪眼前一點點樂受；現在就努力懺悔、認真修習，可以得到堅實金剛不壞之身。"}]}],"說":[{"類":"立","文":"真正可怕的不是苦，苦的事情還用佛來講嗎？真正我們要了解的是快樂。"},{"類":"因","文":"明明是苦的，我們看不見；不但看不見，上了它的當還要受種種大苦惱。"},{"類":"立","文":"一定要經過佛菩薩告訴我們，從此不再受你騙。"},{"類":"下手","文":"以前做的非法的事情、積聚，趕快丟掉；捨掉以後供養三寶、迴向。"},{"類":"下手","文":"趁有暇之身，以不可靠的換得堅實的法財。"},{"類":"下手","文":"這個身體也是如此，不要貪眼前一點點樂受；現在就努力懺悔、認真修習，可以得到堅實金剛不壞之身。"}],"af":"71b","st":845}],"逐字稿":[{"t":"71B 12:47","b":[["q","第三修三苦者。謂譬如極熱或瘡或癰，若於其上灑以冷水，似為安樂，於生死中所有樂受，若壞滅時，還起眾苦，故名壞苦。"],["s","「三苦」是什麼呢？就是苦苦、樂苦以及行苦，這麼一個一樣。第一個是樂苦，樂苦他舉一個譬喻，就像「極熱或瘡或癰」，那個生的瘡，唉呀，那個地方燙得要命啊，難受得要命啊！然後呢上面弄一點水，哎呀，涼一下，就好像是安樂。我們生死當中所受的這個所謂快樂，也就是這個，也就是這個。其實這個本身並不是快樂，壞滅的時候呢，還要這種種的痛苦。這個癰跟瘡灑一點涼水覺得安樂，然後呢這個瘡破的時候，唉呀，那是絕大的痛苦啊！所以這個兩個是壞苦，快樂是一無可取。"]]},{"t":"71B 14:05","b":[["s","真正可怕的不是苦欸！苦的事情還用佛來講嗎？真正我們要了解的是快樂。我們明明是苦的，我們看不見；不但看不見，上了它當還要種種受大苦惱，所以一定要經過佛菩薩告訴我們，那從此不再受你騙啦！所以趕快以前做的那個非法的事情，積聚那個事情趕快丟掉，趕快捨掉了以後供養三寶、迴向。那自己趁有暇之身，不可靠的可以得到堅實的法財，這個是我們要了解的道理。至於這個身體亦是如此，不要貪眼前的一點點這種壞苦，這個樂受，趕快現在就努力去懺悔，認真修習，那可以得到堅實金剛不壞之身。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/012.mp3"},{"文":"此復非唯其受，即此相應，餘心心所及為所緣諸有漏境，皆是壞苦。","口譯":"而且不只是那個受，與它相應的其餘心、心所，以及作為所緣的各種有漏境界，都是壞苦。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 15:01","頁":166,"af":"71b","st":901,"et":970,"消文":[{"文":"不但這個感受，跟它相應的其他心、心所，得到快樂的東西時心裡相應的念頭，凡是有漏境界都是壞苦。"},{"文":"為了一點享受的快樂，積聚財物、朋友、事業，種種無非從這上面牽牽連連牽出去。"},{"文":"了解了這一點，牽牽連連的事情都一刀切斷，根本都從這上頭來的。"}],"延伸":[],"逐字稿":[{"t":"71B 15:01","b":[["q","此復非唯其受，即此相應，餘心心所及為所緣諸有漏境，皆是壞苦。"],["s","通常我們講這個樂就是一種感受，要曉得不但這個感受，就是這個感受相應的其他的心、心所，譬如說你得到了一個快樂的東西，然後你心裡面跟它相應的這種念頭，都是屬於這一方面的。凡是有漏的這種境界都是壞苦，都是壞苦，這一點我們要了解。換句話，它從這個樂的感受上面，所產生的種種的境界，我們都應該知道，都應該知道。所以因為要一點享受的快樂，所以積聚了財物，所有的朋友，所有的事業，種種的無非從這個上面牽牽連連牽出去的。你了解了這一點，那牽牽連連的事情都一刀切斷，這根本都從這個上頭，都從這個上頭來的。下面："]]}],"口譯音":"口譯音檔/siwei-kudi-06/013.mp3"},{"文":"又如熱癰逼切，觸熱水等變異觸時，起極楚痛。如是當知苦受，隨纔生起，便能觸惱或身或心，故名苦苦。","口譯":"又好比身上長了發燙的膿瘡，本來就很痛，再碰到熱水之類的刺激，就痛得要命。同樣的，痛苦的感受只要一生起，就會折磨身體或內心，所以叫做「苦苦」（本身就是苦的苦）。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 16:10","頁":166,"af":"71b","st":970,"et":1019,"消文":[{"文":"苦苦還是講熱癰：身上生了大瘡，本身已經痛苦極了，碰到一下更痛，破了以後絕端地痛苦。"},{"文":"這個苦受才一生起，你就受不了，身上、心上這個就是苦。"}],"延伸":[],"逐字稿":[{"t":"71B 16:10","b":[["q","又如熱癰逼切，觸熱水等變異觸時，起極楚痛。如是當知苦受，隨纔生起，便能觸惱或身或心，故名苦苦。"],["s","這樣。那麼進一步講「苦苦」，苦苦是什麼呢？還是講這個熱的這個癰 ─癰就是身上生了個大瘡，生了個大瘡，這個非常厲害的。唉呀，這個瘡本身是痛苦極了！然後呢或者「觸惱」，本來已經痛苦了，你碰到一下，唉呀！這樣痛苦。然後破了以後更是絕端地痛苦，這個苦受本身就是這樣，這個苦受才一生起你就受不了，啊，身上、心上這個就是苦。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/014.mp3"},{"文":"«譬如腎痛»。此復如前，非唯其受。","口譯":"譬如腎痛。這也和前面一樣，不只是那個受（相應的心、心所及所緣境也都是苦苦）。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 16:59","頁":166,"af":"71b","st":1019,"et":1233,"消文":[{"文":"腎痛，就是肚子裡面痛，像結石那個痛苦。"},{"文":"同樣地，不但是受，其他相應的心、心所等等，也應該了解。"}],"延伸":[{"題":"譬如腎痛","組":[{"題":"親見結石之苦","說":[{"類":"例","文":"我一位老師有結石；洛杉磯蓮社一位朋友，平常不痛，一痛痛了一個鐘頭，在地上直滾、滿頭是汗，旁邊一點辦法都沒有，送醫院也沒用。"},{"類":"例","文":"有一次我緊急送到急診室，旁邊一個女的喊得之悽慘，醫生病根沒找到，一點辦法都沒有。"}]},{"題":"說不怕是沒看見","說":[{"類":"破","文":"我們說不怕，實在是愚癡沒看見；看見了沒有一個人不怕的。"},{"類":"例","文":"我這兩天腳底按摩，算不了什麼，痛的時候實在難受；你們最好自己試試，就曉得怕不怕。"},{"類":"喻","文":"真正看到苦的形相，就像一根繩子一放手，癱下來了，塌在地上爬都爬不起來。"}]},{"題":"趁腦筋好時忙這些","說":[{"類":"立","文":"經上說，比起地獄來，地獄如果只感得這樣，遠比天堂還要好。"},{"類":"下手","文":"不要說不怕，要多去思惟；趁現在腦筋好好的時候，該忙的是忙這些事情。"}]},{"題":"樂不受騙，苦推向上","說":[{"類":"立","文":"想到這些，會策發大厭離，拼命努力。"},{"類":"立","文":"樂受來了不再被它騙；想到痛苦，拼命推你上去，那時當然只有一條修行的路。"}]}],"說":[{"類":"例","文":"我一位老師有結石；洛杉磯蓮社一位朋友，平常不痛，一痛痛了一個鐘頭，在地上直滾、滿頭是汗，旁邊一點辦法都沒有，送醫院也沒用。"},{"類":"例","文":"有一次我緊急送到急診室，旁邊一個女的喊得之悽慘，醫生病根沒找到，一點辦法都沒有。"},{"類":"破","文":"我們說不怕，實在是愚癡沒看見；看見了沒有一個人不怕的。"},{"類":"例","文":"我這兩天腳底按摩，算不了什麼，痛的時候實在難受；你們最好自己試試，就曉得怕不怕。"},{"類":"喻","文":"真正看到苦的形相，就像一根繩子一放手，癱下來了，塌在地上爬都爬不起來。"},{"類":"立","文":"經上說，比起地獄來，地獄如果只感得這樣，遠比天堂還要好。"},{"類":"下手","文":"不要說不怕，要多去思惟；趁現在腦筋好好的時候，該忙的是忙這些事情。"},{"類":"立","文":"想到這些，會策發大厭離，拼命努力。"},{"類":"立","文":"樂受來了不再被它騙；想到痛苦，拼命推你上去，那時當然只有一條修行的路。"}],"af":"71b","st":1030}],"逐字稿":[{"t":"71B 16:59","b":[["q","譬如腎痛。此復如前，非唯其受。"],["s","那麼，這個同樣地，就是我們裡邊的腎痛，就是肚子痛。或者是通常情況之下，我們 ……不曉得你們有沒有結石那個痛苦？我曾經以前看見過一個，我一個老師，他有那個結石，到後來，唉呀，據說那個痛苦得 ……。我還有一個朋友，還有一個朋友，哎喲！我看見了，他平常的時候不痛，一旦痛起來的話，那簡直是，一個好好的人，忽然之間痛了，忽然之間痛了，那就是我洛杉磯蓮社的那個朋友。他那一天痛，痛得啊，一痛痛了一個鐘頭。那個頭上的汗，那我們旁邊是一點辦法都沒有，他太太、他女兒、他的親戚朋友，我們說：「趕快送到醫院。」他們說：「沒有用，前面已經在台灣的時候送過幾次醫院，看了醫生，一點用場都沒有。」就是硬是就是在那個地上直滾、直弄，滿頭是汗，旁邊是一點辦法都沒有！"]]},{"t":"71B 18:02","b":[["s","所以我們現在說不怕、不怕呀，我說實在是，我們愚癡沒看見，看見了沒有一個人不怕的。我這兩天腳底按摩，那個說實在是算不了什麼，可是到那個時候痛的時候，實在是難受啊！我們不要說不怕，所以我一直建議你們不要說不怕，你們最好自己試試，你們就曉得自己怕不怕。佛看得最清楚，所以你們眾生愚癡啊！如果你們像我這樣看見那個真正痛苦的話，沒有一個人例外，都像葦蘆一樣，就像什麼？就像一根繩子一樣，你一放手就 ─癱下來了。假定你們真正看到那個苦的形相的話，沒有一個人例外的，塌在地上爬都爬不起來了，這麼個嚴重法，那個痛苦的事情啊！所以他說「譬如腎痛」，這個的確我所看見的最痛的事情。"]]},{"t":"71B 18:58","b":[["s","我看見過好幾次，啊！這個痛苦的事情，有一次在醫院裡也是一樣。我有一次緊急地送到那個急診室，結果旁邊後來來了一個人，一個女的就喊，喊那個聲音之悽慘哪！那個醫生在旁邊，那個醫生就拿她一點辦法都沒有，欸，那個病根沒找到，就是沒辦法。唉！所以這個世間，後來我看看經，說這種痛苦在比起地獄裡面來啊，那地獄裡如果感得這樣，遠比天堂還要好。這種事情都是千真萬確的事實，所以我們不要說不怕，我們要多去思惟，趁現在我們的那個腦筋好好的時候，我們該忙的是忙這些事情啊！"]]},{"t":"71B 19:46","b":[["s","那麼這個同樣地不但是受，還有其他的相應的心、心所等等，我們也應該了解，應該了解。為什麼呀？當你想到這些的話，啊！你會策發大厭離，拼命努力。關於那個樂受呢，你一想到這個苦，你就不再它受騙，當快樂的事情你不再它受騙，然後呢你不被騙了，第一個。第二個你想到痛苦的時候，拼命推你上去，那個時候當然只有一條修行的路。欸，下面還有一個，但是有的時候既不快樂也不苦，怎麼辦？還有一個辦法，說"]]}],"口譯音":"口譯音檔/siwei-kudi-06/015.mp3"},{"文":"又如熱癰，俱未觸會二觸之時，有漏捨受，為諸粗重之所隨逐，故名行苦。此亦如前，非唯其受，","口譯":"又如熱癰，在還沒有接觸前面兩種觸（冷水與熱水）的時候，有漏的捨受，被各種粗重所隨逐，所以名為行苦。這也和前面一樣，不只是那個受，","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 20:33","頁":166,"af":"71b","st":1233,"et":1280,"消文":[{"文":"像那個瘡，雖然沒碰到前面兩樣東西，這是有漏的；它繼續向前，眼前暫時碰不到，這兩樣都跟著來了，所以叫行苦。"},{"文":"不管眼前受的是苦、樂或不苦不樂，最後的根結就是這個；心、心所法都是這個樣。"}],"延伸":[],"逐字稿":[{"t":"71B 20:33","b":[["q","又如熱癰，俱未觸會二觸之時，有漏捨受，為諸粗重之所隨逐，故名行苦。"],["s","同樣地，就像那個瘡一樣，那個時候雖然沒有碰到前面兩樣東西，對不起，這是有漏的，這是有漏的呀！它繼續地向前，眼前暫時碰不到，一塊兒這兩樣東西都跟著來了，所以叫「行苦」。所以總之一句話，不管眼前受的是苦、樂，或者不苦不樂，最後的根結就是這個樣啊！"]]},{"t":"71B 21:13","b":[["q","此亦如前，非唯其受，"],["s","同樣地，是它心、心所法都是這個樣啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-06/016.mp3"},{"文":"此由先業煩惱«自在而轉»，故名為苦，","口譯":"這是由先前的業與煩惱所支配而轉，所以名為苦，","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 21:20","頁":166,"af":"71b","st":1280,"et":1405,"消文":[{"文":"一切都是宿生以前的煩惱跟業兩樣東西，輾轉引生推衍；除了修有力的對治現在擋住以外，它永遠這樣。"}],"延伸":[{"題":"自在而轉","組":[{"題":"認得沒辦法，已經好了","說":[{"類":"立","文":"說到這裡，立刻可以體會等流的狀態：境界現起的時候，的的確確我們沒有辦法。"},{"類":"立","文":"當你認得沒有辦法，那已經好了，已經認得它了。"},{"類":"破","文":"真正可憐的是不認識它，總覺得：「自己好像很有道理喔！」"}]},{"題":"聽經木然，不識無明","說":[{"類":"因","文":"為什麼聽了經心裡木然沒有感受？就是根本不認識我們的真實狀態在無明當中，聽了模模糊糊。"},{"類":"立","文":"一旦聽懂了，碰到哪裡自然會有驚心動魄之感：真的這個心就是跟法不相應，就在煩惱當中。"}]},{"題":"業熟作不得主","說":[{"類":"立","文":"一切時處都在煩惱當中：前面是煩惱而來，後面又跟煩惱而去。"},{"類":"例","文":"聽經聽完覺得「滿好」，聽完了也就這麼跟著去了；聽經尚且如此，其他能作得了主嗎？"},{"類":"回扣","文":"業成熟的時候一點辦法都沒有；沒有修對治超出來之前，永遠脫不出這個狀態，「故名為苦」。"}]}],"說":[{"類":"立","文":"說到這裡，立刻可以體會等流的狀態：境界現起的時候，的的確確我們沒有辦法。"},{"類":"立","文":"當你認得沒有辦法，那已經好了，已經認得它了。"},{"類":"破","文":"真正可憐的是不認識它，總覺得：「自己好像很有道理喔！」"},{"類":"因","文":"為什麼聽了經心裡木然沒有感受？就是根本不認識我們的真實狀態在無明當中，聽了模模糊糊。"},{"類":"立","文":"一旦聽懂了，碰到哪裡自然會有驚心動魄之感：真的這個心就是跟法不相應，就在煩惱當中。"},{"類":"立","文":"一切時處都在煩惱當中：前面是煩惱而來，後面又跟煩惱而去。"},{"類":"例","文":"聽經聽完覺得「滿好」，聽完了也就這麼跟著去了；聽經尚且如此，其他能作得了主嗎？"},{"類":"回扣","文":"業成熟的時候一點辦法都沒有；沒有修對治超出來之前，永遠脫不出這個狀態，「故名為苦」。"}],"af":"71b","st":1305}],"逐字稿":[{"t":"71B 21:20","b":[["q","此由先業煩惱自在而轉，故名為苦，"],["s","為什麼呀？因為這個東西是一切都是我們宿生以前，現在、以前的煩惱跟業兩樣東西，輾轉引生推衍。既然是由這個東西輾轉引生推衍，一直有這個東西，所以除了你修有力的對治，現在擋住以外，它永遠這樣。說到這裡，我們立刻可以體會一下等流的狀態：就是當這個境界現起的時候，的的確確我們沒有辦法。當你認得沒有辦法，那已經好的，你已經曉得沒有辦法，就是已經認得它了；真正可憐的我們不認識它，我們總覺得：「啊，自己好像很有道理喔！」"]]},{"t":"71B 22:16","b":[["s","平常為什麼我們聽了這個經了以後，心裡面木然沒有感受？就是我們根本就不認識我們的真實狀態在無明當中，所以聽了模模糊糊的，這個是我們必定要了解的一個現象。等到你一旦聽懂了，你凡是碰到哪裡，你自然而然會有驚心動魄之感─唉呀，真的你這個心就是這個樣，跟法不相應！跟法不相應是什麼呢？就是在煩惱當中。所以我們現在一切時處，都在這個煩惱當中，前面是煩惱而來，後面又跟煩惱而去。儘管我們在那兒聽經，你聽經了以後，覺得：「欸，是滿好。」聽完了以後呢，它也就是這麼跟著去了。你聽經尚且是如此，還有其他的，你能作得了主嗎？所以這個業成熟的時候是一點用場都沒有，一點辦法都沒有，這是我們要了解的。所以這個苦的特質就在這裡，注定你，你沒有修對治超出來之前，永遠脫不出這個狀態。「故名為苦」。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/017.mp3"},{"文":"及為能發後煩惱種，所隨逐故，名為徧行粗重所隨。","口譯":"而且它一直被會引發日後煩惱的種子（粗重）跟著，所以說它「處處都有粗重跟著」。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 23:25","頁":166,"af":"71b","st":1405,"et":1457,"消文":[{"文":"不但眼前這樣，還會引發後面的煩惱種；「種」就是繼續不斷地增長，一直跟著你，所以叫「徧行」。"},{"文":"一切時、一切處、一切地，三界之內沒有例外：醒著、睡覺，糊塗的、聰明的都如此；念書念得好也沒有用。"}],"延伸":[],"逐字稿":[{"t":"71B 23:25","b":[["q","及為能發後煩惱種，所隨逐故，名為徧行粗重所隨。"],["s","不但眼前是這樣，而且呢它還會引發後面的「煩惱種」，「種」就是它繼續不斷地增長，一直跟著你，所以叫「徧行」。這個徧行，在任何一切時、一切處、一切地，只要三界之內，沒有一個例外。醒著也是如此，睡覺也是如此；你糊塗的是如此，你聰明的也是如此。啊呀，我念書可以念得很好，對不起，沒有用！我就不管它，不管它也沒有用！睡著了，睡著了也沒有用。它在任何情況之下，這個東西一直跟著你，只要它跟著你，哪！後面這些都會來了。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/018.mp3"},{"文":"如是若起樂受，貪欲增長。若起苦受，瞋恚增長。苦樂俱非隨粗重身，則於無常執為常等，愚癡增長。","口譯":"這樣，有快樂的感受，貪心就增長；有痛苦的感受，瞋心就增長；不苦不樂、帶著煩惱種子的這個身體，又會讓人把無常當成恆常等等，愚癡就增長。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 24:17","頁":166,"af":"71b","st":1457,"et":1519,"消文":[{"文":"快樂的，增長你的貪；苦的，瞋恚增長，你不願意。"},{"文":"不苦不樂還覺得無所謂、滿安樂而過；不僅執無常為常，下面所有的顛倒都跟著來，愚癡增長。"},{"文":"只要你不認識，乃至認識了又不對治，永遠增長三毒；懂得了還不夠，要用對治去思惟。"}],"延伸":[],"逐字稿":[{"t":"71B 24:17","b":[["q","如是若起樂受，貪欲增長。"],["s","快樂的，增長你的貪。"]]},{"t":"71B 24:23","b":[["q","若起苦受，瞋恚增長。"],["s","苦的，瞋恚增長。唉呀，你不願意啊！"]]},{"t":"71B 24:30","b":[["q","苦樂俱非隨粗重身，則於無常執為常等，愚癡增長。"],["s","假定說既不苦又不樂，你還覺得無所謂，於是你心裡面覺得：「啊！這樣滿安樂而過。」「於無常執為常等」，不僅僅是單單執無常執常哦，下面的所有的顛倒都跟著來了，「愚癡增長」。所以只要你不認識，乃至於認識了又不對治，永遠增長了三毒，就是這樣。所以這個真正的道理我們要懂得，當你真正懂得了這個以後，然後還不夠，要用對治去思惟呀！"]]}],"口譯音":"口譯音檔/siwei-kudi-06/019.mp3"},{"文":"其中貪欲能感當來於五趣中生等眾苦。瞋於現法起憂慼等，於後法中感惡趣苦。癡於前二所感二苦隨逐不捨。","口譯":"其中，貪心會帶來將來在五道中投生等種種苦；瞋心在這一生就讓人憂愁煩悶，來生還會招來惡道的苦；愚癡則讓前面貪、瞋帶來的兩種苦一直跟著不放。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 25:19","頁":166,"af":"71b","st":1519,"et":1556,"消文":[{"文":"貪：所有結生最主要的就是貪，然後眾苦。"},{"文":"瞋：不但將來苦，眼前就苦；眼前苦，將來還一定感到惡趣苦。"},{"文":"癡：因為癡，前面的貪、瞋永遠跟著它。"}],"延伸":[],"逐字稿":[{"t":"71B 25:19","b":[["q","其中貪欲能感當來於五趣中生等眾苦。瞋於現法起憂慼等，於後法中感惡趣苦。"],["s","貪，因為你貪著，所有的結生最主要的，主要的就是這個 ─貪，然後呢眾苦。瞋，不但是將來苦，眼前就苦；眼前苦，將來還要一定感到惡趣苦。"]]},{"t":"71B 25:45","b":[["q","癡於前二所感二苦隨逐不捨。"],["s","癡，因為癡，所以前面這個貪、瞋永遠跟著它。唉！從這個地方我們就應該："]]}],"口譯音":"口譯音檔/siwei-kudi-06/020.mp3"},{"文":"故於樂受，應觀為苦滅除貪欲。","口譯":"所以對快樂的感受，要看清它其實是苦，來去除貪心。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 25:56","頁":166,"af":"71b","st":1556,"et":1571,"消文":[{"文":"這是根本：快樂的事情起來了，趕快說：「大騙子！趕快不要上它當，趕快停止！」"}],"延伸":[],"逐字稿":[{"t":"71B 25:56","b":[["q","故於樂受，應觀為苦滅除貪欲。"],["s","這個是我們的根本，當快樂的事情起來了，趕快說：「啊！大騙子，你趕快不要上它當，趕快停止啊！」"]]}],"口譯音":"口譯音檔/siwei-kudi-06/021.mp3"},{"文":"於諸苦受，應作是思，«此蘊即是眾苦因緣»，","口譯":"對於各種苦受，應當這樣思惟：這個蘊就是眾苦的因緣，","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 26:11","頁":166,"af":"71b","st":1571,"et":1690,"消文":[{"文":"對苦受要曉得：這個蘊本身就是眾苦的因緣。"}],"延伸":[{"題":"此蘊即是眾苦因緣","組":[{"題":"五蘊熾盛的根本","說":[{"類":"立","文":"為什麼特別說這一點？真正最重要推動我們的是苦諦：本來這個身體、整個五蘊，就是眾苦因緣。"},{"類":"破","文":"平常常說「五蘊熾盛」，道理說了半天，根本都沒把握住。"},{"類":"立","文":"只要這個心念、這個身體存在，永遠在生死當中、痛苦當中。"}]},{"題":"火燒頭燃尚可暫置","說":[{"類":"回扣","文":"所以才會產生「火燒頭燃尚可暫置，無常盛火應速除滅」。"},{"類":"立","文":"有了這個認識以後，什麼事情都可以放得下，趕快要解決它。"}]},{"題":"生死心切","說":[{"類":"例","文":"佛世的羅漢沒有一個例外；禪宗大德「生死心切」，要找到根本，哪有一分鐘可以放下來。"}]},{"題":"戒淨禪教從此建立","說":[{"類":"立","文":"這是現在修行的根本：戒從這裡持起，佛從這裡念起，禪從這裡參起，教也是告訴你認得這個；建立起來才談得到學密。"},{"類":"下手","文":"先看看這個認得與否？不認得，停在這個地方，不必忙；做好了，下面自然有。"}]}],"說":[{"類":"立","文":"為什麼特別說這一點？真正最重要推動我們的是苦諦：本來這個身體、整個五蘊，就是眾苦因緣。"},{"類":"破","文":"平常常說「五蘊熾盛」，道理說了半天，根本都沒把握住。"},{"類":"立","文":"只要這個心念、這個身體存在，永遠在生死當中、痛苦當中。"},{"類":"回扣","文":"所以才會產生「火燒頭燃尚可暫置，無常盛火應速除滅」。"},{"類":"立","文":"有了這個認識以後，什麼事情都可以放得下，趕快要解決它。"},{"類":"例","文":"佛世的羅漢沒有一個例外；禪宗大德「生死心切」，要找到根本，哪有一分鐘可以放下來。"},{"類":"立","文":"這是現在修行的根本：戒從這裡持起，佛從這裡念起，禪從這裡參起，教也是告訴你認得這個；建立起來才談得到學密。"},{"類":"下手","文":"先看看這個認得與否？不認得，停在這個地方，不必忙；做好了，下面自然有。"}],"af":"71b","st":1580}],"逐字稿":[{"t":"71B 26:11","b":[["q","於諸苦受，應作是思，此蘊即是眾苦因緣，"],["s","那麼對於這個苦受要曉得：啊！這個蘊本身哪，就是眾苦的因緣。為什麼這地方特別說這一點？就是說它真正最重要推動我們的 ─苦諦。所以從這個苦諦上面想到：我們本來這個身體，我們整個的這個東西，就是眾苦的因緣。所以它這個，我們平常常常說「五蘊熾盛、五蘊熾盛」，說了半天，道理說了半天，根本都沒把握住。它這個五蘊熾盛的根本，就從這個地方你認得，你只要這個東西存在，只要那個心念存在，只要這個身體存在，對不起，永遠都在生死當中，永遠痛苦當中。所以你才會產生什麼？說「火燒頭燃尚可暫置，無常盛火應速除滅」。你一旦有了這個認識以後，什麼事情都可以放得下的，唉呀！不去管它，你趕快這個，要解決它！"]]},{"t":"71B 27:19","b":[["s","佛世的那些羅漢，沒有一個例外的！所以以後的大德們，你看禪宗的這個大德：啊！什麼時候死不知道，「生死心切」，要找到根本，他哪有一分鐘可以放下來！所以這是才我深深覺得我們現在修行的根本哪！你有了這個，戒從這個地方持起，佛從這個地方念起，禪從這個地方參起，教也是告訴你認得這個東西，沒有一個 ……。你把這個建立起來了，那個時候你才進一步談得到學密。所以現在我們不必談其他的，先看看這個認得與否？不認得，停在這個地方，不必忙，做好了下面自然有。所以說："]]}],"口譯音":"口譯音檔/siwei-kudi-06/022.mp3"},{"文":"苦從此生，猶如毒箭，滅除瞋恚。於諸捨受，應觀無常銷滅為性，滅除愚癡。不於三受為三毒因，此如《瑜伽師地》及〈攝決擇〉意趣而說。","口譯":"對痛苦的感受，要看清苦是從這個身心生出來的，像毒箭一樣，來去除瞋心。對不苦不樂的感受，要看清它的本質是無常、會消失的，來去除愚癡。不讓這三種感受變成貪、瞋、癡三毒的起因——這是依照《瑜伽師地論》和其中〈攝決擇分〉的意思來說的。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"71B 28:10","頁":166,"af":"71b","st":1690,"et":null,"消文":[{"文":"苦從此生，不要對他瞋惱。"},{"文":"任何一個境界現起的時候，不要引生三毒。"},{"文":"這一點停在這個地方，一段還有深刻的意義。"}],"延伸":[{"題":"八苦六苦三苦","組":[{"題":"八苦六苦三苦，角度不同","說":[{"類":"回扣","文":"昨天把三苦也講完了：苦分成八苦、六苦、三苦。"},{"類":"立","文":"苦的內涵是一樣的，站在不同的角度，就是不同的類型；是各人在三界之內所面臨的問題，總有使我們當下能感觸得到的。"}]},{"題":"由感觸深入，找到根本","說":[{"類":"下手","文":"從感觸得到，再深入觀察，徹底了解整個三界之內的真實行相。"},{"類":"立","文":"了解了真實行相，緊跟著找到它的根本何在，再從根本上去拔除，這是最主要的意趣。"}]},{"題":"枝末上轉，浪費無量劫","說":[{"類":"破","文":"很多學佛的人覺得佛法是好的、要修的；為什麼好？不知道。如何修？也不知道，遺留很多漏洞。"},{"類":"立","文":"總在枝末上轉，雖然最後也能轉到，中間浪費不曉得無量劫，受太多的苦。"},{"類":"回扣","文":"現在一步一步分析探討，最後找到了原因在這裡。"}]}],"說":[{"類":"回扣","文":"昨天把三苦也講完了：苦分成八苦、六苦、三苦。"},{"類":"立","文":"苦的內涵是一樣的，站在不同的角度，就是不同的類型；是各人在三界之內所面臨的問題，總有使我們當下能感觸得到的。"},{"類":"下手","文":"從感觸得到，再深入觀察，徹底了解整個三界之內的真實行相。"},{"類":"立","文":"了解了真實行相，緊跟著找到它的根本何在，再從根本上去拔除，這是最主要的意趣。"},{"類":"破","文":"很多學佛的人覺得佛法是好的、要修的；為什麼好？不知道。如何修？也不知道，遺留很多漏洞。"},{"類":"立","文":"總在枝末上轉，雖然最後也能轉到，中間浪費不曉得無量劫，受太多的苦。"},{"類":"回扣","文":"現在一步一步分析探討，最後找到了原因在這裡。"}],"複習":true,"af":"71b","st":1722}],"逐字稿":[{"t":"71B 28:10","b":[["q","苦從此生，猶如毒箭，滅除瞋恚。"],["s","不要對他瞋惱。"]]},{"t":"71B 28:16","b":[["q","於諸捨受，應觀無常銷滅為性，滅除愚癡。不於三受為三毒因，"],["s","當任何一個境界現起的時候，你不要引生三毒。"]]},{"t":"71B 28:27","b":[["q","此如《瑜伽師地》及〈攝決擇〉意趣而說。"],["s","他這個告訴我們這樣，這告訴我們這樣！這一點我停在這個地方，一段還有深刻的意義。"]]},{"t":"71B 28:42","b":[["s","請翻到《菩提道次第廣論》一六七，一百六十七頁，昨天我們把三苦也講完了，這個苦分成功八苦、六苦、三苦。說苦的內涵是一樣的，總之是苦，那麼他站在不同的角度來說明。實際上所謂不同的角度，就是不同的類型，這個就是我們日常生活當中各人所對，在三界之內，各人所面臨的一個問題。那麼用這個不同的類型來說的話，所以總有使我們當下能夠感觸得到；從這個感觸得到，然後呢再深入觀察，徹底了解整個三界之內的真實行相。然後呢了解了這個真實行相，緊跟著找到它的根本何在，這個就是他最主要的意趣。"]]},{"t":"72A 00:12","b":[["s","你找到了根本，然後呢再從根本上面去拔除。否則我們現在有很多學佛的人，都是這樣，覺得佛法嘛是好的，要修的，那為什麼好？嗯？不知道。如何去修？也不知道，所以遺留了很多漏洞。在這種狀態當中，總在這個枝末上面轉，雖然最後也能夠轉到，可是中間浪費是不曉得無量劫，長則是這個樣，在這個時候是受太多的苦。所以現在從前面，這樣地一步一步各方面分析探討，最後找到了！這個原因是在哪裡？在這裡。現在我們看那個文。第一行："]]}],"口譯音":"口譯音檔/siwei-kudi-06/023.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-06/001.webp","n":1},{"img":"投影片/siwei-kudi-06/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/siwei-kudi-06/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/siw
