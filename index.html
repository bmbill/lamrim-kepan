日光":[{"類":"整段","文":"說五種生苦時說到「眾苦所隨故生為苦」，人是胎生，宗喀巴大師特別針對我們人道說住胎如何受苦。在母親胎裡面就有種種痛苦。我們知道我們的身體是由父精母血這種不淨物而生，父母是由哪裡產生？由祖父母的精血而產生。祖父母是由曾祖父母的精血而產生。經過了這麼多不淨物輾轉而生的身體，有什麼值得執著的呢？如果被不淨物所生而不被煩惱給控制也就算了，偏偏又被煩惱控制，由業而生。所以不只它的性質如此不淨，就連促成它的因素，也是由對實際情形不瞭解的顛倒執著（無明）所產生，業的部分是惡業，是由傷害別人的惡業所產生。結果是什麼呢？以身體來講，我們從小到大一直很愛惜自己的身體。我們把世間種種美味送進嘴裡，然而所排出的卻是不淨物─糞便。從這個角度去看，我們的身體就是一個製造糞便的大機器。我們愛護一個人、服務一個人，最後還有點成果，如他會懂得感恩、會報恩，我們將會受到他的照顧。可是我們愛護身體，它給予我們什麼？就是更多的糞便而已。我們仔細想想，從小到大吃了多少飯？喝了多少飲料？累積起來真是不可勝數，由此所產生的排泄物，堆積起來也是不可勝數。因此，執著這個身體有什麼意義呢？","涵蓋":[0,9]}],"時":"69A 26:41","頁":157,"af":"69a","st":1601,"et":1638,"消文":[{"文":"前面講的是出生以後；這裡特別講還沒出生、住胎時的苦。"},{"文":"出生前的苦我們感受不到，所以提出來讓我們想；一想就覺得可怕，更策發我們。"}],"延伸":[],"逐字稿":[{"t":"69A 26:41","b":[["q","特住胎時受何苦者。"],["s","那個是指出生以後。然後呢這個地方是特別告訴我們：喏，這個出生這件事情，還沒有生起來，特別要了解一點。為什麼這個地方要講一講呢？因為我們感受，這是出生以後的事情，在沒有出生我們感受不到，實際上這個裡邊的的確確，所以提出來讓我們想。那我們一想到，唉呀！覺得可怕不已，更策發我們。下面："]]}],"口譯音":"口譯音檔/siwei-kudi-03/001.mp3"},{"文":"如《弟子書》云：「極猛臭穢極逼切，最狹黑闇遍蔽覆，«住胎猶入那洛迦»，身屈備受極重苦。」","口譯":"就像《弟子書》說的：「又臭又髒得讓人受不了，又擠又壓，最窄最暗，四面八方都被包住；住在胎裡就像下了地獄，身體縮成一團，受盡極重的苦。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69A 27:18","頁":157,"af":"69a","st":1638,"et":1752,"消文":[{"文":"又臭、又髒、又逼迫、又黑暗、又窄，真像住在地獄裡邊，備受痛苦。"}],"延伸":[{"題":"住胎猶入那洛迦","組":[{"題":"胎中苦相千真萬確","說":[{"類":"例","文":"母親吃飽了，像壓在山底下；肚子餓了，又像吊在空中；吃熱的燙得受不了，冷的又凍得受不了。"},{"類":"立","文":"這是千真萬確的事實，只是我們不知道；多多思惟，對生死就的確一無可取。"}]},{"題":"思惟能力用在該想處","說":[{"類":"立","文":"人最可貴的就是有思惟能力。"},{"類":"破","文":"偏偏把思惟能力用在胡思亂想、莫名其妙的事情上頭，好可惜。"},{"類":"立","文":"該想的地方多去想，自利利他，一切好處都在這裡。"},{"類":"下手","文":"牢牢記住：我來這裡目的幹什麼？宗旨幹什麼？觀念把握住，就很容易進去。"}]}],"說":[{"類":"例","文":"母親吃飽了，像壓在山底下；肚子餓了，又像吊在空中；吃熱的燙得受不了，冷的又凍得受不了。"},{"類":"立","文":"這是千真萬確的事實，只是我們不知道；多多思惟，對生死就的確一無可取。"},{"類":"立","文":"人最可貴的就是有思惟能力。"},{"類":"破","文":"偏偏把思惟能力用在胡思亂想、莫名其妙的事情上頭，好可惜。"},{"類":"立","文":"該想的地方多去想，自利利他，一切好處都在這裡。"},{"類":"下手","文":"牢牢記住：我來這裡目的幹什麼？宗旨幹什麼？觀念把握住，就很容易進去。"}],"af":"69a","st":1638}],"逐字稿":[{"t":"69A 27:18","b":[["q","如《弟子書》云：「極猛臭穢極逼切，最狹黑闇遍蔽覆，住胎猶入那洛迦，身屈備受極重苦。」此諸文義，"],["s","那麼這個是論上面告訴我們：唉！這個地方啊，又臭、又髒、又逼迫、又黑暗、又窄，這個真像住在這個地獄裡邊一樣，備受痛苦。所以經上告訴我們，這個住胎的時候，如果這個母親吃飽了，像壓在山底下一樣。哎呀！等一下肚子餓了，你就像吊在空中一樣，因為前面壓著嘛，忽然之間又這樣子。然後吃的熱的話，又燙得個受不了。等一下冷的話，你又凍得個受不了，這麼個嚴重法呀！這是千真萬確的事實，只是我們現在都不知道。所以我們多多思惟的話，那對於這個生死，的確是一無可取。"]]},{"t":"69A 28:24","b":[["s","所以這個地方，我們千萬不要浪費，人最可貴的，什麼？就是我們有思惟能力。現在我們偏偏把那思惟能力，像胡思亂想。啊，這個東西好可惜啊！所以有的時候，我們平常談了一些問題，有的人意見特別多，我心裡常常希望告訴他：你這個腦筋好，你不要用在莫名其妙的事情上頭啊！這是才是真正該想的地方啊！該想的地方多去想想的話，自利利他，一切好處都在這個地方，都在這個地方。所以我們一定要把握住，所以我黑板上面特別想，說我要牢牢記住，我來這裡目的幹什麼？宗旨幹什麼？這個觀念把握住了，你就很容易進去了。下面經。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/002.mp3"},{"文":"如《入胎經》云：「無量不淨，周遍充滿，多千蟲類之所依處，具足最極臭穢二門，具足非一骨鏁穴孔，復有便利清腦腦膜髓等不淨，生藏之下熟藏之上，面向脊骨背對腹皮，於月月中，出諸血相以之資養，母食食時，以二齒鬘細嚼吞下，其所吞食，下以口穢津涎浸爛，上為腦膜之所纏裹，猶如變吐。","口譯":"這些文句的意思，如《入胎經》所說：「（母胎中）充滿無量的不淨，是成千種蟲類依住的地方，具有極為臭穢的二門（大小便道），具有許多骨鏁（骨節）的孔穴，又有大小便、清腦、腦膜、骨髓等不淨。胎兒在生藏（胃）之下、熟藏（腸）之上，臉朝向母親的脊骨，背對著腹皮，每個月靠母親的經血來資養。母親吃東西時，用上下兩排牙齒細細嚼碎吞下，吞下的食物，下面被口中污穢的唾液浸爛，上面被腦膜所纏裹，就像嘔吐出來的東西。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69A 29:12","頁":157,"af":"69a","st":1752,"et":null,"消文":[{"文":"師父只唸經文，沒有另外解，併在下一段一起說。"}],"延伸":[],"逐字稿":[{"t":"69A 29:12","b":[["q","如《入胎經》云：「無量不淨，周徧充滿，多千蟲類之所依處，具足最極臭穢二門，具足非一骨穴孔，復有便利清腦腦膜髓等不淨，生藏之下熟藏之上，面向脊骨背對腹皮，於月月中，出諸血相以之資養，母食食時，以二齒鬘細嚼吞下，其所吞食，下以口穢津涎浸爛，上為腦膜之所纏裹，猶如變吐。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/003.mp3"},{"文":"所有食味，從母腹中入自臍孔，而為資長，漸成羯羅藍、頞部陀、閉尸、健南，手足微動，體相漸現。手足面等胎衣纏裹，猶如糞穢，生臭變臭猛暴黑闇，«不淨坑中»上下遊轉，以諸苦酸粗鹹辣淡，猶如火炭。食味所觸，猶如蒼蠅，以不淨汁而為資養。如墜不淨，臭穢熾然，淤泥之中命根非堅。\n又母身內所有火力，煎炙遍炙極遍煎炙，燒熱遍熱極遍燒熱，燒燃遍燃極遍燒燃，受諸猛利粗惡難忍，非所悅意極大苦受。如如其母轉動，遍動極遍轉動，如是如是如被五縛，亦如投擲煻煨坑中，受諸猛利粗惡難忍，非所悅意，難以為喻，極大苦受。」","口譯":"媽媽吃下的各種食物養分，從母腹進到胎兒的肚臍，養著胎兒，胎兒就一步步長成羯羅藍、頞部陀、閉尸、健南（這些是入胎初期的各個階段），手腳開始會微微動，身形慢慢出來。手腳、臉被胎衣包著，像裹在糞便裡；在又腥又臭、變質發臭、陰暗可怕的髒坑裡上下翻滾。媽媽吃進來的苦、酸、粗、鹹、辣、淡各種味道，碰到胎兒就像火炭一樣燙；胎兒又像蒼蠅一樣，靠髒汁維生。好比掉進糞坑，臭氣沖天，泡在爛泥裡，小命隨時不保。媽媽體內的熱力，不斷地煎烤、燒灼，胎兒承受劇烈、粗暴、難以忍受、極不舒服的大苦。媽媽一轉身、一動，胎兒就像全身被五條繩子綁住，又像被丟進滾燙的熱灰坑裡，受著劇烈難忍、難以形容的大苦。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 00:02","頁":157,"af":"69b","st":2,"et":215,"消文":[{"文":"前面是經上的，不仔細解釋。"}],"延伸":[{"題":"不淨坑中","組":[{"題":"先懂道理，再作思惟","說":[{"類":"下手","文":"真正用功時，先把道理弄懂，弄懂了就想。"}]},{"題":"以糞坑為喻","說":[{"類":"喻","文":"小時候的糞坑，一跑去蒼蠅飛起來，臭氣沖天，蛆在裡邊；我們在母胎當中就是這個樣。"},{"類":"例","文":"老師說：現在人顛倒，處處裝飾得美，連太平間都沒有一點喪事的氣氛。"},{"類":"立","文":"實際上比蛆還苦：蛆只是臭，我們又臭又髒，又壓又冷、又寒又熱。"}]},{"題":"想出最苦，推動出離","說":[{"類":"破","文":"有善業的在母胎中很安樂，但這裡不要去想善業。"},{"類":"因","文":"不如法修苦，將來生了天下來還是這個，還要墮落地獄。"},{"類":"立","文":"把最苦的想出來，被苦的力量推動，拼命去跳出來，這是它的目的。"},{"類":"回扣","文":"所以下面的解釋，也只把它唸一遍。"}]}],"說":[{"類":"下手","文":"真正用功時，先把道理弄懂，弄懂了就想。"},{"類":"喻","文":"小時候的糞坑，一跑去蒼蠅飛起來，臭氣沖天，蛆在裡邊；我們在母胎當中就是這個樣。"},{"類":"例","文":"老師說：現在人顛倒，處處裝飾得美，連太平間都沒有一點喪事的氣氛。"},{"類":"立","文":"實際上比蛆還苦：蛆只是臭，我們又臭又髒，又壓又冷、又寒又熱。"},{"類":"破","文":"有善業的在母胎中很安樂，但這裡不要去想善業。"},{"類":"因","文":"不如法修苦，將來生了天下來還是這個，還要墮落地獄。"},{"類":"立","文":"把最苦的想出來，被苦的力量推動，拼命去跳出來，這是它的目的。"},{"類":"回扣","文":"所以下面的解釋，也只把它唸一遍。"}],"af":"69b","st":2}],"逐字稿":[{"t":"69B 00:02","b":[["q","所有食味，從母腹中入自臍孔，而為資長，漸成羯羅藍，頞部陀，閉尸健南，手足微動，體相漸現。手足面等胎衣纏裹，猶如糞穢，生臭變臭猛暴黑闇，不淨坑中上下遊轉，以諸苦酸粗鹹辣淡，猶如火炭。食味所觸，猶如蒼蠅，以不淨汁而為資養。如墜不淨，臭穢熾然，淤泥之中命根非堅。又母身內所有火力，煎炙遍炙極遍煎炙，燒熱遍熱極遍燒熱，燒然遍然極遍燒然，受諸猛利粗惡難忍，非所悅意極大苦受。如如其母轉動，遍動極遍轉動，如是如是如被五縛，亦如投擲煻煨坑中，受諸猛利粗惡難忍，非所悅意，難以為喻，極大苦受。」"],["s","前面是經上的，不仔細解釋。我們真正修行的話就要學這個，自己真正要用功的時候，你就這樣先把那個道理你去弄懂，弄懂了就想。如果你想不出來，簡單極了，簡單極了！哦，現在都不大簡單，我們小的時候比較好；現在的那些衛生設備，說起來叫衛生，說起來好！這樣。所以以前我曾經遇見一個老師，那個老師就告訴我們：「現在人真顛倒，邪見增長，我們那時候，處處都是修行。它現在裝飾得，每一個地方裝飾得真美，乃至於那太平間，人死了以後，哎呀！裝飾得、還要畫得就像那個 ……。一切的進去的時候，沒有一點點喪事的氣氛讓你，只是因為你的親人的感受。」我現在想想越想越對，我們小的時候，哪裡有現在的衛生設備，這沒有的 ─坑！你一坑一跑得去，跑得老遠那個蒼蠅飛起來，那個臭氣啊！這樣，然後你看那個蛆在裡邊 ……。我們在母胎當中就這個樣，說實在的就這個樣！"]]},{"t":"69B 02:34","b":[["s","啊！所以你一定要用這種方法，實際上呢比牠還要苦。欸，牠這個蛆，在這個糞坑裡只是臭一點，它不會逼、不會炙。我們在這個地方不但又臭又髒，而且又壓又冷、又寒又熱，沒有一個不具足，這樣。不過，但是並不一定完全如此喔，有很多如果生，他的善業的話，他在這個地方母胎當中是很安樂的。但是這個地方我們不要去想善業，就是說，如果說你不如法地去修苦的話，將來你總有一天，生了天下來的還是這個；這個還是最好的，你還要墮落地獄當中去。所以這個地方的特質，你要把最苦的想出來；想了以後，然後呢，被苦的力量推動你拼命去跳出來，這是他的目的，這個我們要重點要了解的。所以他下面是解釋，解釋我也只把它唸一遍。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/004.mp3"},{"文":"如是其母，若受飲食太多太少及食太膩太乾太冷太熱，鹹淡苦酸及太甘辛，若行欲行，若太急走，若跳若倒，若住火前，或蹲居坐，亦說於胎起大痛苦。生藏上壓熟藏下刺，如被五縛插之尖摽。","口譯":"像這樣，母親如果飲食太多、太少，吃得太膩、太乾、太冷、太熱，太鹹、太淡、太苦、太酸、太甜、太辣，或行房事，或走得太急，或跳、或跌倒，或靠近火前，或蹲著坐著，經中也說都會讓胎兒生起大痛苦。上面被生藏壓著，下面被熟藏刺著，就像被五種繩索綑縛、又被尖樁穿刺一樣。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 03:35","頁":158,"af":"69b","st":215,"et":259,"消文":[{"文":"母親的飲食、起居、行動，都會讓胎兒生起大痛苦；師父唸過，沒有另外解。"},{"類":"喻","文":"上面是壓，下面是刺，就像「如坐針氈」，上面還有一個泰山壓頂，實在一無是處。"}],"延伸":[],"逐字稿":[{"t":"69B 03:35","b":[["q","如是其母，若受飲食太多太少及食太膩太乾太冷太熱，鹹淡苦酸及太甘辛，若行欲行，若太急走，若跳若倒，若住火前，或蹲居坐，亦說於胎起大痛苦。生藏上壓熟藏下刺，"],["s","啊！上面是壓，下面是刺，你就像坐在那個，坐在那個我們常常說「如坐針氈」，就這個樣。坐在針氈，只是我自己坐在上面，上面還有一個泰山壓頂，唉！實在是一無是處。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/005.mp3"},{"文":"從胎產時及產出時，所有眾苦，亦如《弟子書》云：「此漸«如硬壓油具»，壓迫其次方得生，然未爾時即捨命，唯是受苦業力強。住不淨中顛倒身，濕爛裹胎極臭穢，猛逼切痛如潰瘡，猶如變吐宿念捨。」","口譯":"從胎中產出時以及產出之後的所有眾苦，也如《弟子書》所說：「這時就像用堅硬的壓油器具，漸漸壓迫，之後才得出生；沒有當下就死去，只是因為受苦的業力強大。住在不淨之中，身體顛倒，被濕爛的胎衣包裹，極為臭穢，猛烈逼迫的切痛就像潰爛的瘡，就像嘔吐物一樣，宿世的憶念也都捨失了。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 04:19","頁":158,"af":"69b","st":259,"et":363,"消文":[{"文":"住胎是這樣，出來的時候也是一樣。"}],"延伸":[{"題":"如硬壓油具","組":[{"題":"以搾油為喻","說":[{"類":"喻","文":"以前的搾油：先燒得熱極，壓扁烤熱，放在籠裡用大鐵鎚壓，搾油工人的手臂這麼粗。"}]},{"題":"出生之苦如受鎚壓","說":[{"類":"喻","文":"大鐵鎚輕輕放下壓在腳指頭上，就痛得哇哇叫。"},{"類":"立","文":"出生的時候就是這麼個苦法，處處地方告訴我們。"}]}],"說":[{"類":"喻","文":"以前的搾油：先燒得熱極，壓扁烤熱，放在籠裡用大鐵鎚壓，搾油工人的手臂這麼粗。"},{"類":"喻","文":"大鐵鎚輕輕放下壓在腳指頭上，就痛得哇哇叫。"},{"類":"立","文":"出生的時候就是這麼個苦法，處處地方告訴我們。"}],"af":"69b","st":274}],"逐字稿":[{"t":"69B 04:19","b":[["q","如被五縛插之尖摽。從胎產時及產出時，所有眾苦，亦如《弟子書》云："],["s","那住胎是這樣，出來的時候也是一樣。出來的時候怎麼樣？"]]},{"t":"69B 04:34","b":[["q","「此漸如硬壓油具，壓迫其次方得生，然未爾時即捨命，唯是受苦業力強。住不淨中顛倒身，濕爛裹胎極臭穢，猛逼切痛如潰瘡，猶如變吐宿念捨。」"],["s","那個出來的時候，就像什麼？像壓油一樣。不曉得你們看見沒有？有沒有看見搾油？現在的搾油現在用化學提煉，那我們不談。我們以前看見那個搾油，啊！那個搾油真是啊，先把那個油擺在那個鍋子裡面燒，烤得熱得不得了，先把它壓扁，壓平了以後烤熱，烤了以後然後呢，放在一個籠裡邊，然後呢用那個大鐵鎚去壓，那個不得了的力量！現在我看見人家鍛鋼筋，以前的老法的鍛鋼筋拿了個大鐵鎚，「叭！」一鎚下去，把那鋼筋弄斷了。他那個搾油的人，那個工人也是一樣，那個手都是這麼粗，就是這樣。然後呢，打那個大鐵鎚，那我們被出生的時候就是用這種方法。要現在那個鐵鎚，不要說碰到一下，你輕輕地那個鐵鎚放下來，壓在你腳指頭上的話，壓得你哇哇叫，現在那出生的時候這麼個苦法！這個是處處地方告訴我們哪！"]]}],"口譯音":"口譯音檔/siwei-kudi-03/006.mp3"},{"文":"此諸文義，如《入胎經》云：「次彼漸生一切肢節，從其糞廁腐爛滴墜，不淨暴惡生臭變臭，黑闇可怖，糞尿熏粘，臭氣垢穢，血水常流，瘡門之中，由其先業異熟生風，吹足向上令頭向下，兩手縮屈被二骨輪，逼迫遍迫周遍逼迫，由諸粗猛難忍非悅，最大苦受令其身分悉皆青瘀，猶如初瘡，難可觸著，身一切根悉皆楚痛，極穢胎垢遍粘其身，由乾渴故，令其唇喉及以心臟悉皆枯燥，住此迫迮難忍苦處。此由因緣增上，宿業異熟生風吹促至極艱辛，始得產出。生已無間，«被外風觸如割塗灰»，手衣觸時如利劍割，當受粗猛難忍非悅極大苦受。」","口譯":"這些話的意思，就像《入胎經》說的：「接著胎兒慢慢長出全身的肢體，在像糞坑一樣腐爛滴汁、骯髒噁心、又腥又臭、黑暗可怕、糞尿黏糊、臭氣污穢、血水不斷流的產門裡，由過去業力所生的一股風，把胎兒吹成腳朝上、頭朝下，兩手縮著，被兩塊骨盆夾住，四面八方擠壓；在粗暴劇烈、難以忍受的大苦中，全身被擠得青一塊紫一塊，像剛破的傷口一樣碰都不能碰，全身各處都痛，又髒又臭的胎垢黏滿全身；又因為乾渴，嘴唇、喉嚨、心口都乾裂，就困在這又擠又難熬的地方。這是因為種種條件湊在一起，加上過去業力所生的風推著，非常非常辛苦才生得出來。一生下來，外面的風一吹，就像傷口上被抹了灰；被手或布碰到，就像被利刀割，承受劇烈難忍的大苦。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 06:03","頁":157,"af":"69b","st":363,"et":521,"消文":[{"文":"上面是解釋，繼續唸下去。"}],"延伸":[{"題":"被外風觸如割塗灰","組":[{"題":"嬰兒初生如觸傷口","說":[{"類":"立","文":"在母胎中非常嫩，一出來碰到外面，痛苦極了。"},{"類":"喻","文":"燙傷、碰掉表皮時，風吹上去都痛得不得了，一點鹽水更無法忍受。"},{"類":"立","文":"嬰兒一落地哇啦哇啦哭就是這個原因：心有絕端的恐懼，身有絕大的痛苦。"}]},{"題":"佛不講則不知","說":[{"類":"立","文":"這是我們無法感受的，如果佛不講，我們根本不知道。"}]}],"說":[{"類":"立","文":"在母胎中非常嫩，一出來碰到外面，痛苦極了。"},{"類":"喻","文":"燙傷、碰掉表皮時，風吹上去都痛得不得了，一點鹽水更無法忍受。"},{"類":"立","文":"嬰兒一落地哇啦哇啦哭就是這個原因：心有絕端的恐懼，身有絕大的痛苦。"},{"類":"立","文":"這是我們無法感受的，如果佛不講，我們根本不知道。"}],"af":"69b","st":369}],"逐字稿":[{"t":"69B 06:03","b":[["q","此諸文義，如《入胎經》云："],["s","上面是解釋，還是繼續地唸下去。"]]},{"t":"69B 06:09","b":[["q","「次彼漸生一切肢節，從其糞廁腐爛滴墜，不淨暴惡生臭變臭，黑闇可怖，糞尿熏粘，臭氣垢穢，血水常流，瘡門之中，由其先業異熟生風，吹足向上令頭向下，兩手縮屈被二骨輪，逼迫遍迫周遍逼迫，由諸粗猛難忍非悅，最大苦受令其身分悉皆青瘀，猶如初瘡，難可觸著，身一切根悉皆楚痛，極穢胎垢遍粘其身，由乾渴故，令其唇喉及以心臟悉皆枯燥，住此迫迮難忍苦處。此由因緣增上，宿業異熟生風吹促至極艱辛，始得產出。生已無間，被外風觸如割塗灰，手衣觸時如利劍割，當受粗猛難忍非悅極大苦受。」"],["s","唉！這個出生的時候，住胎的時候這麼痛苦，出生的時候又這麼個難受！所以這個經上告訴我們出生的時候，本來在母胎當中，這個非常嫩、非常嫩，然後一旦出來碰見外面那個，觸的時候，那個痛苦，痛苦極了，痛苦極了！這東西我們不太容易 ……其實真的說起來，我們還是可以很容易地 ……。當你有的時候，身或者燙傷了，或者特別的因緣碰傷了，外面那個表皮碰掉了，那個肉在的時候，啊！那個外面的不要說碰到一點什麼東西，那個風吹上去也痛得不得了，對不對？一點的水，如果一點鹽水，或者什麼的話，你簡直無法忍受地痛苦。那我們出生的時候，這個感受就是這樣。所以這個嬰兒一下地哇啦哇啦哭，就是這個原因。哇！他那時候痛苦極了，心裡嘛有絕端的恐懼，身上嘛有絕大的痛苦。喏、喏、喏！這個是我們無法感受的，如果佛不講的話，我們還根本不知道，就是這個樣。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/007.mp3"},{"文":"又說如牛剝皮，被蟲所食，及如癩人遍身潰爛，加諸鞭撻極受楚切。又產已無間，取懷抱等及寒熱觸，亦當受諸粗猛難忍，非悅意苦。","口譯":"經中又說，就像剝了皮的牛被蟲啃食，又像全身潰爛的癩病人再加上鞭打，極受楚痛。又出生之後，被人抱起來等等，以及寒熱的觸碰，也都要承受種種粗猛難忍、不悅意的痛苦。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 08:41","頁":159,"af":"69b","st":521,"et":558,"消文":[{"文":"大人歡喜把他抱起來，碰到任何地方都痛。"},{"文":"小孩一生下來就哭，就是這個原因：每一樣都難以忍受。"}],"延伸":[],"逐字稿":[{"t":"69B 08:41","b":[["q","又說如牛剝皮，被蟲所食，及如癩人遍身潰爛，加諸鞭撻極受楚切。又產已無間，取懷抱等及寒熱觸，亦當受諸粗猛難忍，非悅意苦。"],["s","然後呢，大人看見很歡喜把他抱起來，抱的時候，他碰到任何一個地方，碰到的無非是 ……所以那個小孩子一生下來，哭啊！就是這樣，就是這個原因，他痛苦嘛！每一樣東西都是難以忍受的，都不是好的。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/008.mp3"},{"文":"八苦之中，特於此初及於最後，須慇重修。","口譯":"八苦當中，特別是第一個生苦和最後一個死苦，一定要用心、認真地修。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"在八苦裡面，初苦及後苦最為重要，應當反復地思惟。"}],"時":"69B 09:18","頁":159,"af":"69b","st":558,"et":575,"消文":[{"文":"生苦跟死苦實際上最苦，偏偏這兩個我們還感覺不到；不是佛講，實在不知道。"}],"延伸":[],"逐字稿":[{"t":"69B 09:18","b":[["q","八苦之中，特於此初及於最後，須慇重修。"],["s","這個實際上這兩個最苦，生苦跟死苦，就偏偏這兩個東西我們還感覺不到。所以不是佛講，我們實在不知道啊！實在不知道啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-03/009.mp3"},{"文":"故如前說，當以觀慧«數數觀察»，而善修習。","口譯":"所以要如前面所說，用觀慧一再觀察，好好修習。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 09:35","頁":159,"af":"69b","st":575,"et":688,"消文":[{"文":"要用前面告訴我們的觀察慧，觀察生、老。"}],"延伸":[{"題":"數數觀察","組":[{"題":"懈怠時翻看策勵","說":[{"類":"立","文":"現在的重點是讓我們認識知見，先把道的次第綱要認識。"},{"類":"下手","文":"事先先看完；萬一覺得要懈怠、提不起來時，就翻翻它。"},{"類":"破","文":"一懈怠，那就停在這個地方。"}]},{"題":"出離之外無第二條路","說":[{"類":"破","文":"有人說「弄弄不行」，要退轉回去。"},{"類":"立","文":"假如退轉能安樂，我第一個退轉；正因為清楚明白，沒有第二條路好走。"},{"類":"因","文":"現在這點小苦受不了要退轉，後面無邊的大苦就受得了嗎？"},{"類":"破","文":"為什麼要退轉？就是糊塗。"}]},{"題":"如病尋藥，正對治","說":[{"類":"喻","文":"生這種病的時候，馬上跑來找這個藥，這是我們的正對治。"}]}],"說":[{"類":"立","文":"現在的重點是讓我們認識知見，先把道的次第綱要認識。"},{"類":"下手","文":"事先先看完；萬一覺得要懈怠、提不起來時，就翻翻它。"},{"類":"破","文":"一懈怠，那就停在這個地方。"},{"類":"破","文":"有人說「弄弄不行」，要退轉回去。"},{"類":"立","文":"假如退轉能安樂，我第一個退轉；正因為清楚明白，沒有第二條路好走。"},{"類":"因","文":"現在這點小苦受不了要退轉，後面無邊的大苦就受得了嗎？"},{"類":"破","文":"為什麼要退轉？就是糊塗。"},{"類":"喻","文":"生這種病的時候，馬上跑來找這個藥，這是我們的正對治。"}],"af":"69b","st":575}],"逐字稿":[{"t":"69B 09:35","b":[["q","故如前說，當以觀慧數數觀察，而善修習。"],["s","所以我們必定要把前面告訴我們的觀察慧，這個生，然後呢老 ─生、老。這個前面我雖然略略地唸過，所以唸過的，因為現在的重點讓我們認識這個知見，那麼然後呢你們正修的時候，現在我們先把那個道的次第的綱要認識，這個是這個重要。平常在我們平常如果你要懈怠了，或者什麼，提不起來的時候，那個時候自己認真先去看它。當然不是等到提不起來，就是事先你先看完，看完了萬一你覺得要懈怠的時候，然後翻翻它。哎喲！就想到：一懈怠，那對不起，那就停在這個地方。"]]},{"t":"69B 10:22","b":[["s","所以這個世間你了解了，沒有第二條路好走的。往往有人說，唉呀，弄弄不行，要退轉去了。假如退轉去安樂的話，我第一個退轉，我絕對不願意跑得來受這個罪。因為我現在了解得清楚、明白，沒有第二條路好走的。現在你雖然苦，你拼命努力有跳出苦的機會，你現在這一點小苦都受不了，退轉，後面是無邊的大苦等在這裡。現在這麼小苦你受不了要退轉，你那個無邊的大苦就受得了了嗎？那這是個最重要的概念。為什麼我們要退轉呢？就是糊塗！所以這些都是真正幫忙我們的。所以說，在這裡雖然不講，對你們修行這個是最重要的，最重要的！現在我們繼續下去，反正每一個地方，我們曉得它的功效在什麼地方。如果生這種病的時候，馬上跑得來找這個藥，這個藥是對我們的正對治。那麼生曉得了，老："]]}],"口譯音":"口譯音檔/siwei-kudi-03/010.mp3"},{"文":"思惟老苦分五。\n«盛色衰退»者，謂腰曲如弓，頭白如艾，額如砧板，皺紋充滿，由如是等，衰其容貌令成非愛。","口譯":"思惟老苦，分為五種。一、盛色衰退：就是腰彎得像弓，頭髮白得像艾草，額頭像砧板，布滿皺紋；由於這些，容貌衰敗，變得不可愛。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"思惟老苦分五：一是盛色衰退，二是氣力衰退，三是諸根衰退，四是受用境界衰退，五是壽量衰退。如同噶當派的大師所說：「老漸漸至，故稍可忍，若一時頓至，實無能忍之方便。」確實如此。所謂的衰老是慢慢形成的，所以我們會慢慢習慣它。如果老是突然間來臨，那真的是令人無法忍受啊！年輕時，吃什麼都能消化，身體非常健康，有不可能會生病的感覺。可是慢慢地，以前可以吃的，現在吃不下了，或能吃進去，卻沒有辦法消化。以前想做什麼就可以做什麼，現在有力不從心之感。以前記憶力很好，現在人名都記不住，連自己子女的名字都叫不出來。牙齒沒有了，頭髮也沒有了，眼睛也看不清楚了，最後連自己都唾棄自己的身體。而且別人也嘲笑我們，說「這個老頭子」、「這個老婆婆」，更糟的是，親朋好友因為不想照顧我們，私底下詛咒：「希望這個老頭子趕快走！」自己無能為力，需要他人說明，苦苦哀求別人來照顧我們時，別人卻捂著鼻子嫌我們，我們的身體已經出現了餓鬼相，簡直跟餓鬼沒有兩樣。衰老後，坐下時「砰」地一聲，如袋斷索；起坐時如拔樹根，左右搖擺；說話時，也口齒不清、語言遲鈍。有一天嘉瓦仁波切老了也是如此啊！","涵蓋":[10,18],"校":"説→說"}],"時":"69B 11:28","頁":159,"af":"69b","st":688,"et":785,"消文":[{"文":"老了腰站不直，像弓；頭髮都白了。"},{"文":"額如砧板：平常皮膚細嫩，老了就像砧板上布滿刀痕；皺紋充滿，容貌變得不可愛。"}],"延伸":[{"題":"盛色衰退","組":[{"題":"未老先衰，趕快努力","說":[{"類":"例","文":"我現在已經深深感覺到了：坐一下就腰痠背痛。"},{"類":"破","文":"這裡很多人未老先衰，尤其是心理上面，更重要。"},{"類":"立","文":"真可憐哪，趕快好好努力。"}]},{"題":"愛惜容貌者更應思惟","說":[{"類":"下手","文":"尤其女性特別注意；凡是歡喜容貌的，這一點對你特別有價值。"},{"類":"破","文":"不要說：「唉呀，這個修道很苦啊！」"},{"類":"立","文":"想到這裡，這是唯一的一條路，沒有退路好想。"}]}],"說":[{"類":"例","文":"我現在已經深深感覺到了：坐一下就腰痠背痛。"},{"類":"破","文":"這裡很多人未老先衰，尤其是心理上面，更重要。"},{"類":"立","文":"真可憐哪，趕快好好努力。"},{"類":"下手","文":"尤其女性特別注意；凡是歡喜容貌的，這一點對你特別有價值。"},{"類":"破","文":"不要說：「唉呀，這個修道很苦啊！」"},{"類":"立","文":"想到這裡，這是唯一的一條路，沒有退路好想。"}],"af":"69b","st":691}],"逐字稿":[{"t":"69B 11:28","b":[["q","思惟老苦分五。"],["s","第一個，"]]},{"t":"69B 11:31","b":[["q","盛色衰退者，謂腰曲如弓，頭白如艾，額如砧板，皺紋充滿，由如是等，衰其容貌令成非愛。"],["s","第一個老了，老了以後平常你站起來，站得很挺，到那個時候腰也站不起來了，像弓。唉！我現在已經深深感覺到了，曉得要坐得好好的，坐了一下，啊！這腰痠背痛那沒辦法，就這樣，就下來了。其實，其實你們沒有老，我們在這裡很多人未老先衰啊已經，真可憐哪，趕快好好努力啊！尤其是心理上面，有一些人，這個是更重要啊，更重要啊！然後呢「頭白如艾」，到那個時候看看那個頭髮都白了，這樣。「面額如砧板」，砧板什麼樣子？平常我們那個皮膚非常細嫩，那個砧板的樣子，那個刀痕切得都是，到我們老了，這個面就是這樣。尤其是女性這個地方特別注意，不要說：「唉呀，這個修道很苦啊！」你想到這裡，也是唯一的一條路，這是唯一的一條路，回去沒退路好想的。「皺紋充滿」，這個「容貌令非可愛」，並不一定是女性，凡是你歡喜這個的話，那這一點對你特別有價值。第二："]]}],"口譯音":"口譯音檔/siwei-kudi-03/011.mp3"},{"文":"氣力衰退者，謂於坐時，如袋斷索，起如拔樹，語言遲鈍，行步緩慢等。","口譯":"二、氣力衰退：就是坐下時，像袋子斷了繩索（一下子垮下）；起身時像拔樹一樣費力；說話遲鈍，走路緩慢等。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 13:05","頁":159,"af":"69b","st":785,"et":839,"消文":[{"文":"坐下來如斷袋索：袋子一放「噗通」一下，老人跑到凳子上「卡嗒」一下坐下來。"},{"文":"站起來千難萬難；生病的時候就是這個狀態。"},{"文":"講話遲鈍，行步遲緩。"}],"延伸":[],"逐字稿":[{"t":"69B 13:05","b":[["q","氣力衰退者，謂於坐時，如袋斷索，起如拔樹，語言遲鈍，行步緩慢等。諸根衰退者，謂眼等不能明見色等，重忘念等，減念力等。"],["s","第二個氣力衰了，坐下來的時候如斷袋索。什麼叫斷袋索啊？那個袋啊這樣，它平常的時候那個綁住的，然後呢，袋一放「噗通！」一下，人老了就是這樣的，跑到那個凳子上就「卡嗒！」一下坐下來了。唉！站呢實在站不動。平常我們坐好好的，站起來啊，站不起來，唉！站起來是千難萬難。現在你們不大會感覺得到的，但是生病的時候就是這個狀態，哎呀，這個站起來那個腳裡面實在是沒有氣力啊！講話的時候遲鈍，行步的時候遲緩。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/012.mp3"},{"文":"諸根衰退者，謂眼等不能明見色等，重忘念等，«減念力等»。","口譯":"三、諸根衰退：就是眼等根不能清楚看見色等境，常常忘失，念力減退等。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 13:59","頁":159,"af":"69b","st":839,"et":899,"消文":[{"文":"前面講氣力，這裡講裡邊的根衰退。"},{"文":"近視了、遠視了，遠也看不見，近也看不見。"},{"文":"很多事情回頭就忘，要記也記不住。"}],"延伸":[{"題":"減念力等","組":[{"題":"莫待老來才修","說":[{"類":"破","文":"現在大家都說：「等到慢慢地到那個時候再去修。」"},{"類":"立","文":"老的時候就是這個樣，你還能修嗎？"}]},{"題":"年輕莫忙不相干事","說":[{"類":"破","文":"年輕力壯，都浪費在不必要的上頭。"},{"類":"破","文":"在家人情有可原；出了家還忙不相干的事，等到老了死路一條，真可惜。"}]}],"說":[{"類":"破","文":"現在大家都說：「等到慢慢地到那個時候再去修。」"},{"類":"立","文":"老的時候就是這個樣，你還能修嗎？"},{"類":"破","文":"年輕力壯，都浪費在不必要的上頭。"},{"類":"破","文":"在家人情有可原；出了家還忙不相干的事，等到老了死路一條，真可惜。"}],"af":"69b","st":839}],"逐字稿":[{"t":"69B 13:59","b":[["s","然後呢「諸根衰退」，這個是特別講身根，氣力沒有了，講裡邊的根衰退了。「眼」是「不能明見」，「重忘念等」，念力衰退等，就是這樣。到了那個時候，近視了、遠視了，遠也看不見，近也看不見，唉，真是！就這樣，就這樣。然後呢，很多事情回頭就忘記掉了，要記也記不住。尤其現在大家都是：「哎呀！等到慢慢地到那個時候再去修。」老的時候你就是這個樣，你還能修嗎？年輕力壯把那個，都浪費在不必要的上頭。在家人還情有可原，他本來不知道；出了家還忙這些不相干的事情，真可惜啊！然後忙那個不相干的事情，等到老了以後，那死路一條，這個情況啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-03/013.mp3"},{"文":"受用境界衰退者，謂受飲食等，極難消化，又無堪能受諸欲塵。","口譯":"第四，享受的能力衰退：吃東西喝東西都很難消化，也沒有體力去享受各種感官的快樂。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 14:59","頁":159,"af":"69b","st":899,"et":921,"消文":[{"文":"前面是裡邊的，這是外面的受用境界。"},{"文":"以前覺得很好的，現在難消化、沒辦法堪忍；很想，偏偏不行。"}],"延伸":[],"逐字稿":[{"t":"69B 14:59","b":[["q","受用境界衰退者，謂受飲食等，極難消化，又無堪能受諸欲塵。"],["s","這是裡邊的。外面的境界呢，對受用的，以前一直覺得很好，對不起，你難消化，你沒辦法堪忍。哎呀！你很想，那偏偏不行。然後，"]]}],"口譯音":"口譯音檔/siwei-kudi-03/014.mp3"},{"文":"壽量衰退苦者，謂壽多滅盡，速趣於死，應當數數思惟此等。","口譯":"五、壽量衰退苦：就是壽命大多已經耗盡，很快就趨向死亡。應當一再思惟這些。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 15:21","頁":159,"af":"69b","st":921,"et":937,"消文":[{"文":"這五樣東西，要不斷地、好好地去思惟。"}],"延伸":[],"逐字稿":[{"t":"69B 15:21","b":[["q","壽量衰退苦者，謂壽多滅盡，速趣於死，應當數數思惟此等。"],["s","這個五樣東西不斷地、好好地去思惟啊！下面引經上面告訴我們。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/015.mp3"},{"文":"《廣大遊戲經》中亦云：「由老令老壞少壯，猶如大樹被雷擊，由老令耄朽屋畏，能仁快說老出離。","口譯":"《廣大遊戲經》中也說：「由於老，使人衰老、破壞少壯，就像大樹被雷擊；由於老，使人老耄，像朽壞的房屋令人畏懼。能仁啊，請快說出離老的方法！","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 15:37","頁":159,"af":"69b","st":937,"et":983,"消文":[{"文":"「老」這個特質，使每個人慢慢趨向老，把盛年少壯慢慢破壞掉。"},{"文":"就像長得好好的樹，被雷擊得支離破碎。"},{"文":"了解了，趕快趁現在能作的時候，跳出這個痛苦。"}],"延伸":[],"逐字稿":[{"t":"69B 15:37","b":[["q","《廣大遊戲經》中亦云：「由老令老壞少壯，"],["s","這個「老」，這個法，「老」這個這一個特質，使得我們每一個人慢慢地趨向於老，把你的盛年少壯那個慢慢、慢慢地破壞掉了。"]]},{"t":"69B 15:53","b":[["q","猶如大樹被雷擊，"],["s","就像一棵長得好好的樹，被這個雷擊得支離破碎。"]]},{"t":"69B 16:01","b":[["q","由老令耄朽屋畏，能仁快說老出離。"],["s","這個老是這樣啊！所以世尊告訴我們這個老相。所以你了解了，趕快趁現在能作的時候，趕快跳出，跳出這個痛苦啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-03/016.mp3"},{"文":"諸男女眾由老枯，如猛風摧娑羅林，老奪精進及勇勢，譬如士夫陷淤泥。老令妙色成醜陋，老奪威德奪勢力，老奪安樂作毀訾，老奪光澤而令死。」","口譯":"男男女女都因老而枯槁，就像猛風摧折娑羅樹林；老奪走精進與勇勢，就像人陷在淤泥中。老使美好的容色變得醜陋，老奪走威德、奪走勢力，老奪走安樂、招來毀謗，老奪走光澤而令人死亡。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 16:23","頁":159,"af":"69b","st":983,"et":1036,"消文":[{"文":"不管若男若女，被老所枯，像猛風吹過很脆的娑羅林，摧枯拉朽。"},{"文":"現在想作的精進、勇猛，到那時一點都沒有了，像陷在淤泥裡，進退兩難。"},{"文":"老奪妙色、威德、安樂、光澤：這麼個嚴重法。"}],"延伸":[],"逐字稿":[{"t":"69B 16:23","b":[["q","諸男女眾由老枯，如猛風摧娑羅林，老奪精進及勇勢，譬如士夫陷淤泥。"],["s","一切的不管是若男若女，就被這個老所枯，這個枯像什麼？像大風吹那個娑羅林，這個娑羅林樹很脆的，被猛風吹過去，摧枯拉朽一下統統破壞掉了。我們現在這個要想作的精進、勇猛的心情，到那個時候一點都沒有了。到那個時候就像什麼？陷在那個淤泥裡邊，真是進退兩難哪！"]]},{"t":"69B 17:06","b":[["q","老令妙色成醜陋，老奪威德奪勢力，老奪安樂作毀訾，老奪光澤而令死。"],["s","這麼個嚴重法。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/017.mp3"},{"文":"慬哦瓦云：「死苦雖重，而時短促，此老最重。」","口譯":"慬哦瓦說：「死苦雖然重，但時間短促，這個老苦才是最重的。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 17:16","頁":159,"af":"69b","st":1036,"et":1052,"消文":[{"文":"死苦雖然厲害，但很短；真的說起來，這個老最嚴重。"}],"延伸":[],"逐字稿":[{"t":"69B 17:16","b":[["q","慬哦瓦云：「死苦雖重，而時短促，此老最重。」"],["s","死苦雖然厲害，但是它很短呀！真的說起來這個老最嚴重。下面那個祖師講的話，這是千真萬確的。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/018.mp3"},{"文":"迦瑪瓦云：「老漸漸至，故稍可忍，«若一時頓至»，實無能忍之方便。」","口譯":"迦瑪瓦說：「老是漸漸來的，所以還稍微可以忍受；如果一下子全部來到，實在沒有任何能忍受的方法。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 17:32","頁":159,"af":"69b","st":1052,"et":1252,"消文":[{"文":"幸好老是慢慢來的，通常四十以後漸漸開始，到七十、八十。"},{"文":"如果幾十年的老相一口氣來，沒有一個人受得了。"}],"延伸":[{"題":"若一時頓至","組":[{"題":"一時頓至無人能忍","說":[{"類":"喻","文":"平常忽然生了病倒下，痛苦難受到想到簡直不想活了。"},{"類":"例","文":"師父自述：坐下來「卡嗒」一下，站起來像拔樹；清楚的名字講到口邊就記不起來，眼前的人也想不起。"},{"類":"立","文":"念力衰退會到這種程度，你們無法想像。"}]},{"題":"趁年輕力壯精進","說":[{"類":"破","文":"我們居然安之若素，還說慢慢地來。"},{"類":"立","文":"現在只有年輕力壯的時候。"},{"類":"破","文":"年輕同修躲在後面，猜反正輪不到我，偷懶，是最大的損失。"},{"類":"例","文":"看見年輕同修精進，真讚歎；我老了，只能賺一點隨喜功德。"}]},{"題":"見人善惡皆成策勵","說":[{"類":"例","文":"一早起來看見對面同修的燈光，最大的歡喜，讚歎隨喜。"},{"類":"例","文":"看見鐘鼓敲完還在拖拉的人，以前心裡覺得這人怎麼樣，現在覺得真可惜：我可不要這樣，他策勵我。"},{"類":"下手","文":"不要為人家而生煩惱：一方面增長自己，一方面珍惜自己。"},{"類":"回扣","文":"處處把前面的道理多思惟；多思惟了，就開始可以努力了。"}]}],"說":[{"類":"喻","文":"平常忽然生了病倒下，痛苦難受到想到簡直不想活了。"},{"類":"例","文":"師父自述：坐下來「卡嗒」一下，站起來像拔樹；清楚的名字講到口邊就記不起來，眼前的人也想不起。"},{"類":"立","文":"念力衰退會到這種程度，你們無法想像。"},{"類":"破","文":"我們居然安之若素，還說慢慢地來。"},{"類":"立","文":"現在只有年輕力壯的時候。"},{"類":"破","文":"年輕同修躲在後面，猜反正輪不到我，偷懶，是最大的損失。"},{"類":"例","文":"看見年輕同修精進，真讚歎；我老了，只能賺一點隨喜功德。"},{"類":"例","文":"一早起來看見對面同修的燈光，最大的歡喜，讚歎隨喜。"},{"類":"例","文":"看見鐘鼓敲完還在拖拉的人，以前心裡覺得這人怎麼樣，現在覺得真可惜：我可不要這樣，他策勵我。"},{"類":"下手","文":"不要為人家而生煩惱：一方面增長自己，一方面珍惜自己。"},{"類":"回扣","文":"處處把前面的道理多思惟；多思惟了，就開始可以努力了。"}],"af":"69b","st":1052}],"逐字稿":[{"t":"69B 17:32","b":[["q","迦瑪瓦云：「老漸漸至，故稍可忍，若一時頓至，實無能忍之方便。」"],["s","幸好這個老是慢慢地來的，通常一個人四十以後漸漸開始就來了，來了。到七十、到八十，這幾十年當中，如果這個老的形象，幾十年當中一口氣來的話，沒有一個人能受得了，沒有一個人能受得了，這是千真萬確的。平常我們忽然間生了個病，你其實簡單得很咧，忽然間生了病倒在那個地方的話，唉呀！你這個痛苦之難受，就是這樣。我們往往生到那個病的話，想到簡直是不想活了，為什麼？他受不了嘛！所以假定這個老一口氣來的話，沒有一個人受得了。"]]},{"t":"69B 18:17","b":[["s","不想則已，有的時候，我現在已經有這個感覺，有的時候真是！千真萬確的，不管是你哪一方面，剛才前面所說的每一樣東西，我倒不大在乎我的頭髮白，也不在乎我的面孔上的皮膚像砧板一樣。可是的的確確坐下來的時候，叫我慢慢吞吞，我就坐在那裡「卡嗒！」就坐下來；站起來的就像拔樹一樣，站了個半天，實在好辛苦。然後呢跟你們講，有的時候是清楚明白得不得了的事情，咦？講到口邊就是那個名字就記不起來，想了個半天不曉得，想不起來。而且眼前的人喔，就這麼眼前的人，這是念力是衰退會到這種程度啊！你們無法想像的，會是這樣的一個嚴重法。"]]},{"t":"69B 19:12","b":[["s","所以它如果一口氣來的話，你真是沒有一個人能受得了，可是我們現在還居然安之若素，居然還說還是慢慢地來，怎麼能慢哪？現在只有唯一的年輕力壯的時候。所以我現在看見你們在座的一些年輕同修，居然躲在後面，猜猜反正輪不到我，偷懶哪，是最大的損失啊！反過來說，我看見那些年輕的同修，我真讚歎、真高興，我現在老了沒辦法了，我只有賺一點什麼？隨喜功德。"]]},{"t":"69B 19:46","b":[["s","所以我一早起來，欸！看見對面那個同修他真好，他的燈光總是 ……。我一早起來最大的歡喜，就是看見那個燈光。哎呀，讚歎啊！我說我雖然是老了，這個人還在修年輕啊！而我成就讚到年輕的功德。另外呢，另一個人在那兒，我在那裡已經起來了洗了個半天，他還在那邊拖囉沓拉在那個地方，鐘已經敲完了，敲鼓了，他還在那兒，還在剛剛洗臉。以前我心裡面總覺得這個人怎麼樣，現在我也學會了，唉！我覺得這個人真可惜啊！我可不要這樣啊，他可策勵我啊！欸，好啊！真好啊！我但願你們也能如此。所以你不要為人家而驚，不要為人家而生煩惱。總之，一方面對你自己增長，一方面珍惜你自己呀！處處地方要把前面告訴我們這個道理，你多思惟；你多思惟了，你就開始可以努力了。現在我們下面看苦："]]}],"口譯音":"口譯音檔/siwei-kudi-03/019.mp3"},{"文":"思惟病苦分五。\n身性變壞者，謂身肉銷瘦，皮膚乾枯等。","口譯":"思考病苦，分五點。第一，身體變樣：肌肉消瘦、皮膚乾枯等等。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"第三苦，病苦。思惟病苦分五：一是身性變壞；二是增長憂苦、多住憂苦；三是不能受用悅意境界；四是諸非可意境界受用，及雖非所欲須強受用；五是速離命根。","涵蓋":[19,23]}],"時":"69B 20:52","頁":160,"af":"69b","st":1252,"et":1274,"消文":[{"文":"病苦大家容易體會得到，唸一下，自己去體會。"}],"延伸":[],"逐字稿":[{"t":"69B 20:52","b":[["q","思惟病苦分五。"],["s","苦也分五個，把它唸一下。我想這個苦大家都容易體會得到，所以唸一下你們自己去體會它。第一個："]]},{"t":"69B 21:05","b":[["q","身性變壞者，謂身肉銷瘦，皮膚乾枯等。增長憂苦多住憂苦者，"],["s","這第二個："]]}],"口譯音":"口譯音檔/siwei-kudi-03/020.mp3"},{"文":"增長憂苦多住憂苦者，謂身中水等諸界，分不平均增減錯亂，身生逼惱，心起憂痛而度晝夜。","口譯":"第二，憂苦越來越多、常常活在憂苦裡：身體裡水、火、風等元素（四大）失去平衡，有的多有的少、亂了套，身體難受，心裡也憂愁痛苦，就這樣過日子。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 21:14","頁":160,"af":"69b","st":1274,"et":1285,"消文":[{"文":"「這是第二個」：師父只唸過，沒有另外解。"}],"延伸":[],"逐字稿":[{"t":"69B 21:14","b":[["q","謂身中水等諸界，分不平均增減錯亂，身生逼惱，心起憂痛而度晝夜。"],["s","這是第二個。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/021.mp3"},{"文":"不能受用悅意境界者，謂若有云，諸可意境於病有損，雖欲享受而不自在，如是諸威儀道，亦多不能隨欲。","口譯":"三、不能受用悅意境界：就是如果有人說，這些合意的境界對病有害，雖然想享受也不能自在；種種威儀（行住坐臥）也大多不能隨心所欲。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 21:25","頁":160,"af":"69b","st":1285,"et":1292,"消文":[{"文":"平常眼睛看、吃、玩都可以，那時候都不行了。"}],"延伸":[],"逐字稿":[{"t":"69B 21:25","b":[["q","不能受用悅意境界者，"],["s","平常的時候，你要眼睛也好，吃也好、玩也好，那個時候都不行了。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/022.mp3"},{"文":"諸非可意境界受用，雖非所欲須強受用者，謂諸非悅飲食藥等，須強飲用。如是火炙及刀割等諸粗苦事，皆須習近。","口譯":"四、對不合意的境界，雖然不想要也必須勉強受用：就是不喜歡的飲食、藥物等，必須勉強吃下。像火炙、刀割等種種粗重痛苦的事，都必須去接受。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 21:32","頁":160,"af":"69b","st":1292,"et":1330,"消文":[{"文":"前面是說你歡喜的，對不起，不行；你不歡喜的，偏偏要。"}],"延伸":[],"逐字稿":[{"t":"69B 21:32","b":[["q","謂若有云，諸可意境於病有損，雖欲享受而不自在，如是諸威儀道，亦多不能隨欲。諸非可意境界受用，雖非所欲須強受用者，謂諸非悅飲食藥等，須強飲用。如是火炙及刀割等諸粗苦事，皆須習近。"],["s","前面是說你歡喜的，對不起，不行。你不歡喜的偏偏要，就這樣。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/023.mp3"},{"文":"速離命根者，謂見病難治，便生痛苦，當於此等審細思惟。","口譯":"五、速離命根：就是看到病難以治好，便生起痛苦。應當對這些仔細思惟。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 22:10","頁":160,"af":"69b","st":1330,"et":1342,"消文":[{"文":"「同樣的」：師父只唸過，沒有另外解。"}],"延伸":[],"逐字稿":[{"t":"69B 22:10","b":[["q","速離命根者，謂見病難治，便生痛苦，當於此等審細思惟。"],["s","同樣的。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/024.mp3"},{"文":"《廣大遊戲經》云：「多百種病及病苦，如人逐鹿逼眾生，當觀老病壞眾生，惟願速說苦出離。","口譯":"《廣大遊戲經》說：「數百種病和病苦，就像獵人追鹿般逼迫眾生。當看到老與病毀壞眾生，唯願您快說出離苦的方法。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 22:22","頁":160,"af":"69b","st":1342,"et":1369,"消文":[{"文":"就像打獵的人趕鹿，病來害我們也是這樣。"},{"文":"趕快從佛告訴我們的這個苦，想辦法跳出來。"}],"延伸":[],"逐字稿":[{"t":"69B 22:22","b":[["q","《廣大遊戲經》云：「多百種病及病苦，如人逐鹿逼眾生，"],["s","就像人，打獵的人趕那個鹿一樣，這個病，這個病來害我們也是這個。"]]},{"t":"69B 22:37","b":[["q","當觀老病壞眾生，惟願速說苦出離。"],["s","趕快啊！要從佛那個地方，告訴我們這個苦，從這個地方想辦法跳出來啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-03/025.mp3"},{"文":"譬如冬季大風雪，草木林藥奪光榮，如是病奪眾生榮，衰損諸根及色力。令盡財穀及大藏，病常輕蔑諸眾生，作諸損惱瞋諸愛，周遍炎熱如空日。」","口譯":"就像冬天的大風雪，奪去草木、樹林、藥草的光彩，病也同樣奪去眾生的光彩，衰損諸根與色力。它令財物、穀糧以及大寶藏耗盡，病常常輕蔑眾生，造成種種損惱、讓所愛的人也生瞋，就像空中的烈日，周遍炎熱。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 22:49","頁":160,"af":"69b","st":1369,"et":1425,"消文":[{"文":"文字不必解釋，自己仔細觀察；這些自己都體會得到。"},{"文":"體會得到的就體會；體會不到的，信得過佛，努力去思惟、觀察。"},{"文":"目前最切要的一件事，就是把這個概念提起來。"}],"延伸":[],"逐字稿":[{"t":"69B 22:49","b":[["q","譬如冬季大風雪，草木林藥奪光榮，如是病奪眾生榮，衰損諸根及色力。"],["s","一樣啊！"]]},{"t":"69B 23:03","b":[["q","令盡財穀及大藏，病常輕蔑諸眾生，作諸損惱瞋諸愛，周遍炎熱如空日。」"],["s","這個文字也不必解釋，這個文字自己仔細地觀察，反正像這種東西自己都體會得到的，很容易。體會得到的，體會；體會不到的，信得過佛，努力去思惟、觀察。現在目前這個時候最切要的一件事情，我們一定要把這個概念提起來。最後，生、老、病、死當中，「死」："]]}],"口譯音":"口譯音檔/siwei-kudi-03/026.mp3"},{"文":"思惟死苦分五。謂捨離圓滿可愛財位，捨離圓滿可愛親族，捨離圓滿可愛朋翼，捨離圓滿可愛身體，死時當受猛利憂苦，«乃至意未厭此諸苦»，當數思惟。","口譯":"思考死苦，分五點：要離開自己擁有的、心愛的財富地位；要離開心愛的親人；要離開心愛的朋友；要離開自己心愛的身體；死的時候還要受劇烈的憂苦。在心裡還沒有對這些苦生起厭離之前，要一再地思考。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"第四苦，死苦。思惟死苦分五：一是捨離圓滿可愛財位；二是捨離圓滿可愛親族；三是捨離圓滿可愛朋翼；四是捨離圓滿可愛身體；五是當看到遠離上述所說四圓滿之後，由此而發的憂苦。","涵蓋":[26,27],"校":"舍→捨"}],"時":"69B 23:45","頁":160,"af":"69b","st":1425,"et":1475,"消文":[{"文":"死苦分五：捨離財位、親族、朋翼、身體，以及死時的猛利憂苦。"}],"延伸":[{"題":"乃至意未厭此諸苦","組":[{"題":"未厭之前數數思惟","說":[{"類":"立","文":"心念對這個真相不認識，因為不認識而不厭離，乃至於貪著。"},{"類":"下手","文":"在這種狀態要不斷地思惟；現在不忙別的，真正要忙的是這個。"}]},{"題":"不把佛法當學問","說":[{"類":"破","文":"在這裡求學問，不要把它看成學問看，它的目的在這裡。"},{"類":"立","文":"能在這個上面用功，那就是你的大學問。"},{"類":"破","文":"否則認識得再多，也沒有用。"}]}],"說":[{"類":"立","文":"心念對這個真相不認識，因為不認識而不厭離，乃至於貪著。"},{"類":"下手","文":"在這種狀態要不斷地思惟；現在不忙別的，真正要忙的是這個。"},{"類":"破","文":"在這裡求學問，不要把它看成學問看，它的目的在這裡。"},{"類":"立","文":"能在這個上面用功，那就是你的大學問。"},{"類":"破","文":"否則認識得再多，也沒有用。"}],"af":"69b","st":1425}],"逐字稿":[{"t":"69B 23:45","b":[["q","思惟死苦分五。謂捨離圓滿可愛財位，捨離圓滿可愛親族，捨離圓滿可愛朋翼，捨離圓滿可愛身體，死時當受猛利憂苦，乃至意未厭此諸苦，當數思惟。"],["s","只要我們的心念當中，對前面這個真相不認識，因為不認識而不厭離，乃至於貪著。在這種狀態，要不斷地思惟，現在我們不忙別的，真正要忙的是要忙這個啊，這個要注意啊！我們現在這裡要求學問，不要把它看成學問看，它是目的在這裡。你能夠在這個上面，那就是你的大學問，否則你認識得再多是沒有用啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-03/027.mp3"},{"文":"前四為苦之理者，謂見當離此四圓滿而發憂苦。","口譯":"前四種之所以是苦，是因為看到將要離開這四種圓滿而生起憂苦。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 24:35","頁":160,"af":"69b","st":1475,"et":1485,"消文":[{"文":"就是財位、親屬等等。"}],"延伸":[],"逐字稿":[{"t":"69B 24:35","b":[["q","前四為苦之理者，謂見當離此四圓滿而發憂苦。"],["s","這個就是說財位、親屬等等。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/028.mp3"},{"文":"《廣大遊戲經》亦云：「若死若沒死沒時，永離親愛諸眾生，不還非可重會遇，如樹落葉同逝水。死令王者無自在，死劫猶如水漂木，獨去無伴無二人，自業具果無自在。","口譯":"《廣大遊戲經》也說：「死亡、沒落的時候，永遠離開所親愛的眾生，一去不回、不能再相會，就像樹上的落葉、流逝的河水。死使國王也不得自在，死把人劫走就像水漂走木頭，獨自離去、沒有伴侶、沒有第二個人，只有自己的業帶著果報，不得自在。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 24:45","頁":160,"af":"69b","st":1485,"et":1512,"消文":[{"文":"這是自己的業力所感得的，沒有辦法可想。"}],"延伸":[],"逐字稿":[{"t":"69B 24:45","b":[["q","《廣大遊戲經》亦云：「若死若沒死沒時，永離親愛諸眾生，不還非可重會遇，如樹落葉同逝水。死令王者無自在，死劫猶如水漂木，獨去無伴無二人，自業具果無自在。"],["s","這個是自己的業力所感得的，你沒有辦法可想的。"]]}],"口譯音":"口譯音檔/siwei-kudi-03/029.mp3"},{"文":"死擒多百諸含靈，如海鯨吞諸眾生，猶龍金翅象遇獅，同草木聚遭猛火。」","口譯":"死亡擒住成百的有情，就像海中大鯨吞食眾生，像龍遇到金翅鳥、象遇到獅子，像草木堆遇到猛火。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 25:12","頁":160,"af":"69b","st":1512,"et":1612,"消文":[{"文":"死來的時候，不管在任何狀態當中，就這麼一條路。"},{"文":"八苦已講了生、老、病、死，每一個分五個項目；多去思惟、觀察，會產生強烈的感受：人生無非都是痛苦。"},{"文":"下面另外四苦，是眼前處處感受得到的；最後一個（五取蘊苦）才是根本、最重要的。"}],"延伸":[],"逐字稿":[{"t":"69B 25:12","b":[["q","死擒多百諸含靈，如海鯨吞諸眾生，猶龍金翅象遇獅，同草木聚遭猛火。」"],["s","這個死來的時候，就是這樣的一個狀態，不管在任何狀態當中，一旦死來了，好，就這麼一條路，就這麼一條路。這個是生老病死，這個四樣，今天這個地方說一下。"]]},{"t":"69B 25:43","b":[["s","請翻到《菩提道次第廣論》一六一，一百六十一頁。那個八苦已經講了生、老、病、死，每一個裡邊分五個項目，每一個裡邊分五個項目。這個是多去思惟、觀察，那麼那個時候，會產生強烈的一種感受，說人生無非都是痛苦。那麼下面另外四個，那就是眼前我們處處地方，感受這個三種，最後一個實際上呢，這就是根本，最重要的。現在一個一個地我們討論下去，看文："]]}],"口譯音":"口譯音檔/siwei-kudi-03/030.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-03/001.webp","n":1},{"img":"投影片/siwei-kudi-03/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/siwei-kudi-03/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/siwei-kudi-03/004.webp","n":4},{"img":"投影片/siwei-kudi-03/005.webp","n":5},{"img":"投影片/siwei-kudi-03/006.webp","n":6},{"img":"投影片/siwei-kudi-03/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=69a&st1=1601&et1=1752","box":[0.123625,0.3591111111111111,0.1265,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-03/008.webp","n":8},{"img":"投影片/siwei-kudi-03/009.webp","n":9},{"img":"投影片/siwei-kudi-03/010.webp","n":10},{"img":"投影片/siwei-kudi-03/011.webp","n":11},{"img":"投影片/siwei-kudi-03/012.webp","n":12},{"img":"投影片/siwei-kudi-03/013.webp","n":13,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=69b&st1=2&et1=259","box":[0.539875,0.288,0.1315,0.07288888888888889]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/siwei-kudi-03/014.webp","n":14},{"img":"投影片/siwei-kudi-03/015.webp","n":15},{"img":"投影片/siwei-kudi-03/016.webp","n":16},{"img":"投影片/siwei-kudi-03/017.webp","n":17},{"img":"投影片/siwei-kudi-03/018.webp","n":18,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=69b&st1=259&et1=521","box":[0.12 ei-kudi-03/041.webp","n":41},{"img":"投影片/siwei-kudi-03/042.webp","n":44,"yt":"E1qFpq1i0fY"},{"img":"投影片/siwei-kudi-03/043.webp","n":45}],"投影片PDF":"投影片/siwei-kudi-03/slides.pdf","音檔範圍":"69A 26:41～69B 26:52"},"siwei-kudi-04":{"id":"siwei-kudi-04","標題":"思惟苦諦(4)","根":"思惟八苦","科判焦點":"丑一 思惟八苦","課本範圍":"P161 L1 ~ P162 L4","堂數":89,"日期":"2026/11/24","分圖":[{"名":"怨憎會至五取蘊","原文":[0,6]},{"名":"取蘊為根本・厭離大悲","原文":[7,10]},{"名":"無垢聖語・猛利變動","原文":[11,15]}],"跨科判":null,"週":113,"班級":"24秋007","序":null,"音檔":{"69b":{"local":"音檔/gl1/069B.mp3","remote":"https://lamrim.xyz/player/media/gl1/069B.mp3"},"70a":{"local":"音檔/gl1/070A.mp3","remote":"https://lamrim.xyz/player/media/gl1/070A.mp3"},"70b":{"local":"音檔/gl1/070B.mp3","remote":"https://lamrim.xyz/player/media/gl1/070B.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=69b&st1=1612&af2=70a&af3=70b&et3=705","段":[{"文":"思惟怨憎會苦分五。謂如遇怨敵，便生憂苦。畏其制罰。怖畏惡名，遭非讚頌。畏苦惱死。違正法故，畏懼死後，墮諸惡趣。當思此等。","口譯":"思考和討厭的人碰在一起的苦，分五點：一遇到仇人，心裡就憂苦；怕他報復處罰；怕壞了名聲、被人說閒話；怕苦惱到死；又因為做了違背正法的事，怕死後掉進惡道。要思考這些。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 26:52","頁":161,"af":"69b","st":1612,"et":1768,"消文":[{"文":"世間理想的偏偏不容易找到，不希望的偏偏排遣不開；眼前想想，隨時隨地沒有一樣東西稱我們的心。"},{"文":"遇到怨敵就生憂苦：心裡憂愁，互相傷害身上苦惱；憂苦可分身心，也可總合身心而言。"},{"文":"畏其制罰：怕他傷害你。"},{"文":"怖畏惡名、遭非讚頌：你說我不對、我說你不對，種種誹謗；希望的讚頌得不到，反而受傷害。"},{"文":"畏苦惱死：乃至因此送掉性命；違正法故，還怕死後墮落惡趣。"},{"文":"怨的偏偏碰到，反過來你希望的，偏偏要別離。"}],"延伸":[],"逐字稿":[{"t":"69B 26:52","b":[["q","思惟怨憎會苦分五。"],["s","也分五樣。"]]},{"t":"69B 27:00","b":[["q","謂如遇怨敵，便生憂苦。畏其制罰。怖畏惡名，遭非讚頌。畏苦惱死。違正法故，畏懼死後，墮諸惡趣。當思此等。"],["s","世間理想的事情，偏偏不容易找到。那麼不理想的呢，我們不希望的呢，偏偏排遣不開。怨的冤家，瞋的，你所討厭的，偏偏要讓你碰到。我們眼前想想看，的確隨時隨地沒有一樣東西稱我們心。那麼這個裡邊分五個項目。遇到怨敵，就生憂、苦─心裡面憂愁，然後呢，怨敵互相傷害，身上面苦惱。這憂苦也可以分身心、兩方面，也可以總和身心而言。"]]},{"t":"69B 28:20","b":[["s","那麼又怕他，這總的，怕他傷害你，怕他傷害你，這第二個。由於這樣，同時呢「怖畏惡名」，這個怨家，大家都 ─你說我不對，我說你不對，那麼種種的對我們的誹謗。然後呢，「遭非讚頌」，讚跟頌是我們希望的，在這種情況之下，他偏偏不但得不到，而且傷害你。還有呢，怖畏惱死，不但是眼前實際上的名譽，實質上的傷害，而且乃至於因此而送掉性命。送掉了性命呢，「違正法故」，還要怕死後墮落惡趣，這樣。這個五個方面。怨的呢偏偏碰到，反過來你希望的嘛，偏偏要別離！"]]}],"口譯音":"口譯音檔/siwei-kudi-04/001.mp3"},{"文":"思惟愛別離苦分五。謂若捨離最愛親等，由此令心發生憂慼。語生愁歎。身生擾惱。念彼功德，思戀因緣令意熱惱。應受用等有所缺乏。當思此等。","口譯":"思惟愛別離苦，分為五種：就是如果與最親愛的人等分離，由此令內心生起憂愁悲慼；言語發出愁歎；身體生起擾惱；想念對方的好處，因思戀而令心意熱惱；應有的受用等也有所缺乏。應當思惟這些。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69B 29:28","頁":161,"af":"69b","st":1768,"et":null,"消文":[{"文":"令心發生憂慼：第一個是心裡憂愁。"},{"文":"語生愁歎：心裡憂慼，開起口來「唉呀，真不曉得什麼是好！」"},{"文":"身生擾惱：師父併在下一句講，沒有另外解。"},{"文":"念彼功德：想起這個恩愛的人種種好處，捨不得，心裡放不下。"},{"文":"應受用等有所缺乏：種種受用也缺乏；這五項都容易懂。"}],"延伸":[],"逐字稿":[{"t":"69B 29:28","b":[["q","思惟愛別離苦分五。謂若捨離最愛親等，由此令心發生憂慼。"],["s","第一個憂愁，心裡邊真是 ……。"]]},{"t":"69B 29:41","b":[["q","語生愁歎。"],["s","心裡面嘛，憂慼；開起口來嘛，唉呀，真不曉得什麼是好！"]]},{"t":"69B 29:50","b":[]},{"t":"70A 00:02","b":[["q","身生擾惱。念彼功德，思戀因緣令意熱惱。"],["s","因為想起來這個恩愛的人有種種好處，捨不得啊！心裡面就放不下。"]]},{"t":"70A 00:15","b":[["q","應受用等有所缺乏。當思此等。"],["s","因此我種種的受用也缺乏，也分五項，這都容易懂。"]]}],"口譯音":"口譯音檔/siwei-kudi-04/002.mp3"},{"文":"思惟所欲求不得苦分五。如愛別離。求不得者，謂務農業秋實不成，及營商賈未獲利等，由於所欲«勵力追求而未得»故，灰心憂苦。","口譯":"思考想要的求不到的苦，也分五點，跟愛別離苦一樣。求不到，例如種田到秋天卻沒收成、做生意卻沒賺到錢等等；拼命追求想要的東西卻得不到，就灰心、憂愁、痛苦。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70A 00:27","頁":161,"af":"70a","st":27,"et":121,"消文":[{"文":"第七個是你要求的求不到，就像愛別離一樣。"},{"文":"求不得，就是你所忙的事情：種田人忙了半天收成不好，作生意人得不到利益。"},{"文":"由於所欲勵力追求而未得，灰心憂苦：這個文都容易懂。"}],"延伸":[{"題":"勵力追求而未得","組":[{"題":"把文義擺進生活體會","說":[{"類":"下手","文":"這意義要隨時隨地、多方面，擺在我們現實生活狀態當中去體會。"}]},{"題":"修學路上也求不得","說":[{"類":"例","文":"出家修學佛法也是：想像中一番熱誠，跑到哪裡大失所望。"},{"類":"例","文":"偏偏碰見的不如想像；覺得真正有成就的，偏偏又沒辦法跟著他。"},{"類":"立","文":"不管世間、出世間，在在都是這種現況。"}]}],"說":[{"類":"下手","文":"這意義要隨時隨地、多方面，擺在我們現實生活狀態當中去體會。"},{"類":"例","文":"出家修學佛法也是：想像中一番熱誠，跑到哪裡大失所望。"},{"類":"例","文":"偏偏碰見的不如想像；覺得真正有成就的，偏偏又沒辦法跟著他。"},{"類":"立","文":"不管世間、出世間，在在都是這種現況。"}],"af":"70a","st":54}],"逐字稿":[{"t":"70A 00:27","b":[["q","思惟所欲求不得苦分五。如愛別離。"],["s","這第七個，你要求的呢求不到，就像愛別離一樣，就像愛別離一樣。愛別離是你親愛的，說"]]},{"t":"70A 00:39","b":[["q","求不得者，"],["s","就是你所忙的事情，"]]},{"t":"70A 00:42","b":[["q","謂務農業秋實不成，"],["s","種田人呢忙了半天，收成不好。及營商賈未獲利等，"]]},{"t":"70A 00:51","b":[["s","作生意人呢，得不到利益。"]]},{"t":"70A 00:54","b":[["q","由於所欲勵力追求而未得故，灰心憂苦。"],["s","這個文都容易懂。那麼我們這是把這個所說的意義，隨時隨地多方面，擺在我們現實生活狀態當中去體會。譬如說，乃至於我們出家了，修學佛法了也是，唉呀，想像當中一番熱誠，可是跑到哪裡呀大失所望！那就是什麼？求不得。求不得的另外一面呢，偏偏碰見的，那還不如我們想像。萬一你覺得滿好的話呢，也不一定能夠好 ─覺得現在，喔唷，許多真正有成就的等等，偏偏你又沒辦法跟著他，就是諸如此類。不管是世間、出世間，在在都是這種現況。最後："]]}],"口譯音":"口譯音檔/siwei-kudi-04/003.mp3"},{"文":"思惟宣說五種取蘊總為苦義分五。","口譯":"思考佛說的「總括來說，我們這個被煩惱帶來的身心（五取蘊）就是苦」這個道理，分五點。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70A 02:01","頁":161,"af":"70a","st":121,"et":157,"消文":[{"文":"平常常說「五陰熾盛」，到底怎麼個熾盛法，這裡說一下。"},{"文":"八苦歸結起來最重要的，就是最後五種取蘊的苦。"},{"文":"修中士道的重點就在這個地方，要好好地學。"}],"延伸":[],"逐字稿":[{"t":"70A 02:01","b":[["q","思惟宣說五種取蘊總為苦義分五。"],["s","平常我們常說「五陰熾盛」、五陰熾盛，到底怎麼個熾盛法呢？那麼這一個地方說一下。實際上呢真正這個思惟這八苦當中，真正最重要的歸結起來，就是這個最後那個五種取蘊當中的這個苦。我們修中士道的重點，重點就在這個地方，現在把這個我們好好地學一下。"]]}],"口譯音":"口譯音檔/siwei-kudi-04/004.mp3"},{"文":"謂是當成眾苦之器，及依已成«眾苦之器»，是苦苦器，是壞苦器，是行苦器。於此諸苦當數思惟。","口譯":"就是說：五取蘊是將成為眾苦的容器；以及依於已經形成的取蘊而成為眾苦的容器；是苦苦的容器；是壞苦的容器；是行苦的容器。對於這些苦應當反覆思惟。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70A 02:37","頁":161,"af":"70a","st":157,"et":442,"消文":[{"文":"五取蘊就是五蘊：色是現在的色身；受、想、行、識是心蘊。"},{"文":"五大類合成身心相續，在五趣中不斷輪轉，所以叫「數取趣」；平常說的「人」，擺在自己身上叫「我」。"},{"文":"當成眾苦之器：將來一旦得到，對未來是一切痛苦的根本；「器」像茶杯裝水，五取蘊是盛苦的。"},{"文":"依已成眾苦之器：已經成就了，一切痛苦依這上面而來，除了苦沒有別的。"},{"文":"苦苦器：本身就是苦苦，在身心上感受的苦。"},{"文":"壞苦器：快樂是壞苦，它壞的時候痛苦得受不了。"},{"文":"行苦器：平常不覺苦樂，但停不住，諸行無常永遠向前推衍，總在苦當中轉；應該數數思惟。"}],"延伸":[{"題":"眾苦之器","組":[{"題":"苦諦從取蘊認識","說":[{"類":"立","文":"真正應該認識的苦諦，特別要從這個地方，這是根本。"}]},{"題":"先把握根本","說":[{"類":"破","文":"學了很多東西，也許很有道理，總在枝末上轉，把握不住根本，越走越遠。"},{"類":"立","文":"修學佛法最重要的，首先要把住根本在什麼地方；要除苦，先認識苦的根本。"},{"類":"例","文":"佛法浩如煙海，下腳第一步的戒又這麼多，各部各派，不曉得從哪裡下手。"},{"類":"下手","文":"找到最主要的根本，從根本把握住，再慢慢接到枝葉，問題才能解決。"}]}],"說":[{"類":"立","文":"真正應該認識的苦諦，特別要從這個地方，這是根本。"},{"類":"破","文":"學了很多東西，也許很有道理，總在枝末上轉，把握不住根本，越走越遠。"},{"類":"立","文":"修學佛法最重要的，首先要把住根本在什麼地方；要除苦，先認識苦的根本。"},{"類":"例","文":"佛法浩如煙海，下腳第一步的戒又這麼多，各部各派，不曉得從哪裡下手。"},{"類":"下手","文":"找到最主要的根本，從根本把握住，再慢慢接到枝葉，問題才能解決。"}],"af":"70a","st":341}],"逐字稿":[{"t":"70A 02:37","b":[["q","謂是當成眾苦之器，及依已成眾苦之器，是苦苦器，是壞苦器，是行苦器。於此諸苦當數思惟。"],["s","這五個取蘊是什麼呢？就是我們所謂的五蘊。「色」，就是我們現在的色身，有色身，形色所成的，然後呢「受、想、行、識」，那是心蘊。「識」，最後那個識是識體，它識的心所法，它識的功效 ─受、想、行三樣東西。那麼總合起來呢，有這個五個大類的東西，合成功一種身心相續，這個身心相續在五趣當中是不斷地輪轉，所以叫「數取趣」，不斷地在這個輪迴當中輾轉，這個東西 ─五蘊、五取蘊，平常我們說的「人」。這個人擺在自己身上那就叫「我」，一切問題無不都從這個上頭出來的，這個是整個的一切問題的根本。現在我們看看，這個東西是什麼？我們平常所要求的一切一切，無非都在忙這個，無非都在忙這個，現在看看這個是什麼？"]]},{"t":"70A 04:13","b":[["s","說這個東西，「當成」，將來還沒有成之前，那所以說將來會得到。當你得到的時候 ─眾苦之器，對於未來來說，是一切痛苦的根本。「器」就是個器皿，譬如說我們這個茶杯裝水的，現在這個五取蘊呢是盛苦的。這個東西將來一旦成就了，幹什麼？喏，就是裝一點苦，沒有別的，它這東西就是這樣。「及依已成眾苦之器」，已經成就了呢，一切的痛苦是依這個上面而來的，這個東西有這樣的不理想，除了苦沒有別的。然後呢本身就是「苦苦器」，它本身就是苦苦，對於苦的東西當然是苦！這個苦，哪裡？就在身心上感受的。那麼還有快樂呢？對不起，快樂是「壞苦器」！它快樂是壞的，它壞的時候，你也痛苦得受不了。還有呢，「行苦器」，平常的是雖然並沒有感受到苦樂，對不起，它停不住的，諸行無常，永遠向前推衍。推衍的結果呢，你總還在這個苦當中轉，對於這個應該數數思惟。"]]},{"t":"70A 05:41","b":[["s","我們真正應該認識的，指的苦諦，特別從這個地方，這是根本。這個各式各樣的因很多，平常我們討論問題這裡要注意喲！就是我們必定要把握住根本何在。平常我們往往學了很多東西，你所看見的也許你很有道理，可是總在枝末上面轉，結果看了半天把握不住這個根本，走遠路，乃至於越走越遠，這是我們需要了解的。同樣地，修學佛法最重要的，你必定首先要把住根本在什麼地方。平常我們真正講的苦，各式各樣的，歸納起來無非要找到：欸，是苦！那麼你要除掉苦，根本在哪裡呢？這個你必定要首先認識它。"]]},{"t":"70A 06:36","b":[["s","同樣地，就是我們修學佛法，現在這個佛法是浩如煙海；不要說佛法浩如煙海，三藏當中我們說，唉呀，我們下腳第一步 ─戒，戒又這麼多。啊！然後這個東一部、西一部，大眾部、上座部、一切有部，乃至於你的的確確不曉得從哪裡下手！是在任何一方面，你要找到它的最主要的根本，從這個地方，那麼然後呢從根本上面把握住了，慢慢接到枝葉。這樣我們才有機會，也唯有這樣才能夠解決，要不然這個問題總歸不能解決。那麼現在我們這裡看下去："]]}],"口譯音":"口譯音檔/siwei-kudi-04/005.mp3"},{"文":"其中初者，謂依受此取蘊，能引來生以後眾苦。第二謂依已成之蘊，為老病等之所依止。","口譯":"其中第一點是說：因為有了這個身心，就會帶出下一輩子以後的種種苦。第二點是說：已經有了這個身心，它就成了老、病等苦的落腳處。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70A 07:22","頁":161,"af":"70a","st":442,"et":508,"消文":[{"文":"當成：一受了取蘊，造種種業，將來一切的苦都是現在造、引來以後的；以後現起又再引發以後，永遠增長。"},{"文":"已成：生、老、病、死、愛別離、怨憎會、求不得，都從這上面來，根本就在這裡。"}],"延伸":[],"逐字稿":[{"t":"70A 07:22","b":[["q","其中初者，"],["s","這第一個。"]]},{"t":"70A 07:24","b":[["q","謂依受此取蘊，能引來生以後眾苦。第二謂依已成之蘊，"],["s","這只是當成的，一受了這個取蘊以後，受了這個取蘊，就因為 ……譬如說我們現在有了這個五蘊以後，我們造種種的業，將來一切的以後的苦都是現在造，然後呢引來以後的，引來以後的。然後同時對現在來說呢，一切的苦也依於現在，所以它現在固然是苦，同樣也引發以後。當你引發以後，以後這個現起的時候，它又再引發以後，永遠這樣地增長。現在的苦是什麼？"]]},{"t":"70A 08:15","b":[["q","為老病等之所依止。"],["s","前面說的生、老、病、死，然後呢愛別離、怨憎會、求不得，都從這個上面，所以它那個根本就在這裡。"]]}],"口譯音":"口譯音檔/siwei-kudi-04/006.mp3"},{"文":"第三第四，謂彼二苦粗重隨逐能生彼二。","口譯":"第三、第四點是說：身心一直被苦苦、壞苦這兩種苦的種子（粗重）跟著，所以會不斷生出這兩種苦。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70A 08:28","頁":161,"af":"70a","st":508,"et":573,"消文":[{"文":"第三、第四就是苦苦跟壞苦。"},{"文":"當成、已成的五取蘊上「粗重隨逐」：身心是煩惱雜染所感得，異熟、等流、增上輾轉相應，在「種、現」輾轉流轉，這叫粗重。"},{"文":"由於這樣輾轉引生，無非是苦苦、壞苦。"}],"延伸":[],"逐字稿":[{"t":"70A 08:28","b":[["q","第三第四，謂彼二苦粗重隨逐能生彼二。"],["s","那麼第三、第四呢，就是苦苦跟壞苦，這個兩樣東西是為什麼呀？因為由於這個當成的五取蘊，以及已成的五取蘊，這個兩個上頭「粗重隨逐」。就是這個我們的身心，是煩惱雜染所感得的，這個煩惱雜染所感得的內容，無非是異熟、等流、增上輾轉相應，一直在這個「種、現」輾轉地流轉當中，所以這個叫「粗重」，一直不斷地在這個上面。由於這個輾轉地引生，所以無非是苦苦、壞苦。那麼最後一個行苦呢，"]]}],"口譯音":"口譯音檔/siwei-kudi-04/007.mp3"},{"文":"第五謂初成取蘊，即便生為行苦自性，以一切行為宿惑業他自在轉，是行苦故。於三苦時«此當詳說»。","口譯":"第五，是說取蘊一形成，就生為行苦的自性，因為一切諸行都受往昔的惑業所支配而轉，所以是行苦。這在講三苦時將會詳細說明。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70A 09:33","頁":161,"af":"70a","st":573,"et":916,"消文":[{"文":"一開始就一直在行當中；行蘊從無始以來沒有停過，這真是問題的中心。"},{"文":"現在的一切諸行，是往昔無明所造雜染之業所感得，必定按照惑業的行相來轉，你一點辦法都沒有，這是行苦。"},{"文":"苦苦、壞苦、行苦，下面會詳細告訴我們。"}],"延伸":[{"題":"此當詳說","組":[{"題":"取蘊是生死根本怨家","說":[{"類":"因","文":"為什麼下面還要詳細說？因為這是最主要的根本。"},{"類":"立","文":"認得取蘊的特質，才會產生大厭離；這才是生死根本怨家，一無是處。"},{"類":"立","文":"唯一好處是湊著它能修行；所以只求塞飽肚子去討飯，樹下一宿就得。"}]},{"題":"不識根本，講究衣食","說":[{"類":"破","文":"我們不認識，一天到晚講究這個東西，一切煩惱由此而生。"},{"類":"例","文":"在家人忙的兩大主題：生命的保持、生命的延續。"},{"類":"破","文":"出了家照理要解脫這個，卻還忙著它，嘴巴一到，問題都來了。"}]},{"題":"拔除根本，諸苦俱除","說":[{"類":"立","文":"前面講那麼多苦，是策勵你感受到絕大的不如意，追根究底找到根本。"},{"類":"立","文":"前面的苦都由五取蘊產生；五取蘊連根拔除了，上面的都沒有了。"}]},{"題":"精力集中於根本","說":[{"類":"破","文":"有人說「最好我去修行」，修些什麼他也不知道，修了半天是空忙。"},{"類":"破","文":"另一種要懂道理，文字上越扯越遠，扯不清。"},{"類":"下手","文":"把有限的精力集中在這裡，中堅問題解決了，下面自然跟著解決。"}]}],"說":[{"類":"因","文":"為什麼下面還要詳細說？因為這是最主要的根本。"},{"類":"立","文":"認得取蘊的特質，才會產生大厭離；這才是生死根本怨家，一無是處。"},{"類":"立","文":"唯一好處是湊著它能修行；所以只求塞飽肚子去討飯，樹下一宿就得。"},{"類":"破","文":"我們不認識，一天到晚講究這個東西，一切煩惱由此而生。"},{"類":"例","文":"在家人忙的兩大主題：生命的保持、生命的延續。"},{"類":"破","文":"出了家照理要解脫這個，卻還忙著它，嘴巴一到，問題都來了。"},{"類":"立","文":"前面講那麼多苦，是策勵你感受到絕大的不如意，追根究底找到根本。"},{"類":"立","文":"前面的苦都由五取蘊產生；五取蘊連根拔除了，上面的都沒有了。"},{"類":"破","文":"有人說「最好我去修行」，修些什麼他也不知道，修了半天是空忙。"},{"類":"破","文":"另一種要懂道理，文字上越扯越遠，扯不清。"},{"類":"下手","文":"把有限的精力集中在這裡，中堅問題解決了，下面自然跟著解決。"}],"af":"70a","st":653}],"逐字稿":[{"t":"70A 09:33","b":[["q","第五謂初成取蘊，即便生為行苦自性，"],["s","一開始那就一直在行當中，實際上所以說一開始的時候，就是在我們感受得到的這個情況之下。那以前有沒有？有，只是我們感受不到的。實際上這個行蘊，從無始以來，一直從來沒有停過地一直在進行當中，這個真是問題的中心。"]]},{"t":"70A 10:06","b":[["q","以一切行為宿惑業他自在轉，是行苦故。"],["s","因為我們現在的一切諸行是什麼？以前往昔的無明，由無明所造的種種雜染之業所感得的，所以必定還是按照這個惑業的行相來轉，一切都是惑業來決定的，你一點辦法都沒有，一點辦法都沒有。所以必然之間，會隨著這個因行而向前流轉，這個是行苦。那麼關於這個，"]]},{"t":"70A 10:53","b":[["q","於三苦時此當詳說。"],["s","苦苦、壞苦、行苦，這個下面會詳細告訴我們。為什麼他下面還要詳細告訴我們呢？因為這個是根本，最主要的根本。你認得了這個取蘊的特質以後，那個時候你才會產生大厭離，要不然我們一天到晚就忙什麼？忙這個東西。實際上呢這個才是我們的生死根本怨家，生死根本怨家！所以佛一再告訴我們，這個東西是一無是處，一無是處啊！這唯一的好處是什麼？湊現在這個東西能夠修行。因為這樣的關係，所以你為了修行，你還逼不得已地要吃的、要住的。那吃怎麼辦？去討飯，討到什麼只要塞飽肚子就行；住呢，唉呀，你哪裡都可以，樹下一宿就得。現在我們呢遠不止此，因為我們不認識，所以一天到晚就講究這個東西，一天到晚講究這個。因為講究這個呢，一切的煩惱是由此而生，一切煩惱由此而生！"]]},{"t":"70A 12:12","b":[["s","實際上我們也可以感受得到，在家人忙些什麼？說到最究竟的，這個是兩大主題之一，兩大主題之一：一個是生命的保持，一個是生命的延續。生命的保持就是為這張嘴巴，就是這樣。然後呢我們出了家以後，照理說要解脫這個東西，實際上呢因為這個根本問題沒有認識，所以一天到晚是還忙著它。那個嘴巴是啊，那真是，說起來，不管你怎麼說得頭頭是道，一跑到那地方問題都來了，問題都來了，還有種種的藉口。這個原因為什麼？就是我們對這個基本的概念不認識。"]]},{"t":"70A 13:07","b":[["s","前面儘管講很多苦，是的，可是他找不到根本。現在這個地方，把那個根本找出來了以後，到那個時候，你把這個根本問題解決了。當這個根本問題解決了，前面所有的苦，都是由於五取蘊而產生的，當那個五取蘊的問題解決了，連根拔除了，上面的都沒有了。所以要說前面那些問題的，為什麼？就是策勵你對現在的這種狀態，感受到絕大的不如意，然後呢那個時候你努力地，去要找解決這個問題。要去找解決，然後呢你追根究底找到根本，於是就拔除了。"]]},{"t":"70A 13:53","b":[["s","這個概念為什麼一再強調？為什麼佛在前面的時候告訴我們？這是我們現在處處地方，為什麼必須要知道？說你要講修行，是的，那麼你從哪裡修行起？如果你不了解這個，你修了半天，那不是空忙嗎？因為你摸到的只是邊邊的一部分，說要修行、要修行，有很多人就是這樣：唉呀，最好我去修行，你忙這個幹什麼！你為什麼要修，修些什麼啊？他也不知道！那既然不知道你怎麼修？另外一種呢，說那我要懂道理的，忙了半天越走越遠，文字上面越扯越不曉得扯不清去了。所以在這個地方再強調一下，強調一下，你必須要把握住這一些問題，把我們有限的精力集中在這個地方！然後你把那個中堅問題解決了，好！下面自然就跟著也都解決。"]]},{"t":"70A 15:03","b":[["s","下面再說，說現在我們了解了，原來這個問題在這裡。反過來，假定你對這個問題不了解，那什麼現象呢？"]]}],"口譯音":"口譯音檔/siwei-kudi-04/008.mp3"},{"文":"若於生死取蘊自性，未能發起真實厭離，則其真實«求解脫心»，無發生處。","口譯":"如果對於生死取蘊的自性，不能生起真實的厭離，那麼真實的求解脫心，就無從發生。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70A 15:16","頁":161,"af":"70a","st":916,"et":1327,"消文":[{"文":"不認識五取蘊本質是苦，還覺得這是我，快樂得很，要營養、要舒服，一切問題都來了，哪可能發生真實厭離。"},{"文":"解脫就是從縛著當中解開；縛著是惑跟業，綁著的就是五取蘊。"},{"文":"要在五取蘊上產生絕大的厭惡、求解脫的心，才進一步去找它為什麼被綁，這是修行佛法的根本。"}],"延伸":[{"題":"求解脫心","組":[{"題":"無的放矢","說":[{"類":"立","文":"不能發起真實厭離心，求解脫的心從哪裡發生？"},{"類":"立","文":"要解脫，才會求方便、修道，覺得持戒是必須的；念佛、參禪、學教都在這基礎上。"},{"類":"喻","文":"靶在哪裡不知道，拿槍朝天亂放；我們亂放打死很多人，還要賠命。"}]},{"題":"先問為何修行","說":[{"類":"下手","文":"不必忙著去修行，先忙「我為什麼要修行」；再找配胃口、適根性的方法，全部精神投入。"},{"類":"例","文":"曉得只有念佛，就牢牢抱著一句佛號，天塌下來是人家的事。"}]},{"題":"乘急戒緩之真意","說":[{"類":"立","文":"古人說「乘急」，是從根本急起：全部精神解決根本問題，所以也可以解脫。"},{"類":"破","文":"現在講乘急戒緩，乘急不急，戒又緩掉，不墮落到哪裡去。"},{"類":"立","文":"戒教你急，也是告訴你這是生死根本，不可以做，要在這裡擋住。"}]},{"題":"因地把握根本","說":[{"類":"例","文":"一位同修說：真正弄戒律要到羅漢，那時才能客觀見到問題。"},{"類":"立","文":"做不到不怕，因地上把握住根本，從這裡下去，問題一定解決。"},{"類":"破","文":"否則在戒行、戒相上這個、那個弄了半天，越走越遠。"},{"類":"回扣","文":"對生死取蘊自性不真實了解，求解脫心無發生處；出家不只為作羅漢。"}]}],"說":[{"類":"立","文":"不能發起真實厭離心，求解脫的心從哪裡發生？"},{"類":"立","文":"要解脫，才會求方便、修道，覺得持戒是必須的；念佛、參禪、學教都在這基礎上。"},{"類":"喻","文":"靶在哪裡不知道，拿槍朝天亂放；我們亂放打死很多人，還要賠命。"},{"類":"下手","文":"不必忙著去修行，先忙「我為什麼要修行」；再找配胃口、適根性的方法，全部精神投入。"},{"類":"例","文":"曉得只有念佛，就牢牢抱著一句佛號，天塌下來是人家的事。"},{"類":"立","文":"古人說「乘急」，是從根本急起：全部精神解決根本問題，所以也可以解脫。"},{"類":"破","文":"現在講乘急戒緩，乘急不急，戒又緩掉，不墮落到哪裡去。"},{"類":"立","文":"戒教你急，也是告訴你這是生死根本，不可以做，要在這裡擋住。"},{"類":"例","文":"一位同修說：真正弄戒律要到羅漢，那時才能客觀見到問題。"},{"類":"立","文":"做不到不怕，因地上把握住根本，從這裡下去，問題一定解決。"},{"類":"破","文":"否則在戒行、戒相上這個、那個弄了半天，越走越遠。"},{"類":"回扣","文":"對生死取蘊自性不真實了解，求解脫心無發生處；出家不只為作羅漢。"}],"af":"70a","st":998}],"逐字稿":[{"t":"70A 15:16","b":[["q","若於生死取蘊自性，未能發起真實厭離，則其真實求解脫心，無發生處。"],["s","假定關於這個問題，換句話說，五取蘊的本質是什麼東西，你根本不認識。因為它本質是苦的，你不認識是苦，既然不認識苦的話，我們還直覺得這是我，快樂得很啊！要營養，要長得胖胖，要長得肥肥，然後呢要求它舒服，在這種情況之下一切問題都來了，當然，哪可能發生真實厭離！現在前面已經了解了，所謂解脫是什麼？就是從縛著當中解開來。什麼是縛著？惑跟業。這個惑跟業綁著什麼？就是綁著我們這個五取蘊。所以你必要在這個五取蘊上面，產生絕大的厭惡，求解脫的心。那個時候才進一步去找，它什麼原因而綁著的等等，整個的修行佛法的根本從這裡。"]]},{"t":"70A 16:38","b":[["s","現在既然你不了解，於是就不能發起真實的厭離心；既然不能發起真實厭離心，你求解脫的心請問從哪裡發生起？因為你要解脫，所以那個時候你要去求種種解脫的方便，修那個道。那個時候才會有：啊，持戒是必須的！在這個基礎上面，念佛也好、參禪也好、學教也好。現在關於這個問題你找不到，沒有把握住，然後你說念佛、持戒，然後你說參禪、打坐，你坐，幹什麼啊？你幹什麼啊？你作了很多學問，你為什麼？我們不是在無的放矢嗎？所以前面說這個問題你沒解決，就像射箭，就像我們打靶一樣，靶在哪裡不知道，拿了槍朝天亂放。朝天亂放那最多浪費你子彈，我們現在是亂放的話打死了很多人，然後呢你就賠這個命欸！我們就是做這個事情。"]]},{"t":"70A 17:46","b":[["s","所以這一點大家不必忙著去修行，你必須忙著 ─我為什麼要修行！然後你有了這個，然後再找你修行的方法，那個時候你覺得：啊！這個方法配我的胃口，適我的根性。然後你全部精神，你自然解決嘛！哦，曉得現在這只有念佛，於是你聽見了牢牢抱著一句佛號，不管人家天塌下來，那是人家的事情。如果你發大心，「等到我去了，然後回過頭來幫助別人」，問題就解決了。如果你持戒，你只要把握住一個，哦，那戒上面告訴你，你能夠這樣清淨的話，小則生人天，大則得解脫，你全部精神貫注在這個裡頭。乃至於，所以為什麼人家說「乘急戒緩」，它的目的在什麼？在這裡，你把握住這點的話，你乘急戒緩也可以解脫。否則的話，對不起，那一定出毛病的，因為戒是根本嘛！"]]},{"t":"70A 18:56","b":[["s","為什麼講乘急戒緩也可以解脫呢？他到那個時候來講，「喔，這個是根本啊！」他一定要全部精神把那個根本問題解決。所以他把那個根本的，持這個戒本來要三具，身、口行持一點都不能錯，那時候他發現：只要把他的意把握住了，其他枝葉慢慢地再來，這樣。所以如果是念佛的話，他腦筋裡除了一句佛號什麼都沒有了，當然解脫！然後參禪的，他一天看著是「念佛的是誰？」、「拖著這個死屍的誰？」一定要找到它。欸，結果找到它了，跟空性相應了，那當然問題解決了。所以人家古人所以說「乘急」，是從這個地方急起啊！我們現在講乘急戒緩，緩了半天，乘急不急，戒又緩掉了，不墮落，到哪裡去！反過來說，那好，我們戒急了，它戒為什麼教你急呀？它目的還是這個，告訴你這個是生死的根本，不可以做啊！要在這個地方擋住！啊！於是你內心當中戰戰兢兢，因為了解：我們對事情的真相，凡夫畢竟是凡夫，不可能了解！"]]},{"t":"70A 20:14","b":[["s","所以有一天一位同修來跟我談，他是一個非常精采的人，哎呀，曾經弄過那個戒律。他當時告訴我：真正我們弄這個東西要到羅漢。我非常讚歎，一點都沒錯，為什麼？我們到了那個時候，心裡才不會被現行煩惱所轉，那時候你能客觀地見到這個問題。這個話是對的，可是我們現在做得到嗎？這個我們不談，真正的問題是什麼？我們雖然做不到，可是我們要問現在我們因地上面忙些什麼？哪！就在忙這個。你把握住這個了，在這種情況之下，儘管我們不可能把這個東西的問題，能夠圓滿地把握住，不怕！根本在哪裡你把握住了，你只要在這個地方下去，那一定問題解決！而這個戒的真正的目的在哪裡？就是這個。否則的話你如果弄不到的，然後戒行、戒相上面，喔唷，這個、這個，這個、那個，弄了個半天還是越走越遠了，這個我們必須要了解的。"]]},{"t":"70A 21:23","b":[["s","所以在這個地方他告訴我們：假定你對這個的生死取蘊的自性，沒有真實地了解的話，你求解脫的心無發生處。現在出家修行的目的幹什麼？前面告訴我們不但是單單作一個羅漢，作羅漢你八關齋戒也可以解決，你何必這麼行？沙彌也可以解決，像均提沙彌等等，你何必弄個兩百五十條這麼難行，得到一點的義利啊？這個我們必定要了解啊！所以這個是它的根本哪！"]]}],"口譯音":"口譯音檔/siwei-kudi-04/009.mp3"},{"文":"於諸有情流轉生死，亦無方便«能起大悲»，","口譯":"對於諸有情在生死中流轉，也就沒有方法能生起大悲，","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70A 22:07","頁":161,"af":"70a","st":1327,"et":1670,"消文":[{"文":"對自己發厭離心；了解這東西這麼可怕，推己及人，那時發大悲。"}],"延伸":[{"題":"能起大悲","組":[{"題":"推己及人起大悲","說":[{"類":"立","文":"大悲必定是自己深深見到取蘊的可怕，然後憐憫別人。"},{"類":"破","文":"自己對這東西貪著難捨，憐憫些什麼？完全顛倒。"},{"類":"立","文":"沒有厭離心絕不可能有大悲心，所謂大悲只是騙騙人。"}]},{"題":"理路清楚，步步上升","說":[{"類":"下手","文":"凡夫做不到厭離，正因做不到所以策發；目的是成佛，時時提醒發大悲心，這絕對正確。"},{"類":"立","文":"一開頭正確認識，步步上升，不走冤枉路；弄錯了拉回來，師友之間互相助力。"}]},{"題":"出離心大小乘共","說":[{"類":"破","文":"有人說「我是大乘菩薩，出離心是小乘行者做的」。"},{"類":"立","文":"龍樹、無著，任何完整的傳承都說得清楚：大悲從這上面發生。"},{"類":"立","文":"形象上有差別，內涵一模一樣：深深了解取蘊本身是苦，絕無例外。"}]},{"題":"又拉又推，一路向上","說":[{"類":"例","文":"做不到常覺得難過；了解了無比歡喜，末法時代碰到最完整根本的教法，感到慶幸。"},{"類":"因","文":"業感緣起，沒有宿生善根絕對碰不到。"},{"類":"喻","文":"一個拉、一個推：歡喜跑偏了，就想自己還有那麼多錯；推得太緊，又換成歡喜。方向總是一路向上。"}]}],"說":[{"類":"立","文":"大悲必定是自己深深見到取蘊的可怕，然後憐憫別人。"},{"類":"破","文":"自己對這東西貪著難捨，憐憫些什麼？完全顛倒。"},{"類":"立","文":"沒有厭離心絕不可能有大悲心，所謂大悲只是騙騙人。"},{"類":"下手","文":"凡夫做不到厭離，正因做不到所以策發；目的是成佛，時時提醒發大悲心，這絕對正確。"},{"類":"立","文":"一開頭正確認識，步步上升，不走冤枉路；弄錯了拉回來，師友之間互相助力。"},{"類":"破","文":"有人說「我是大乘菩薩，出離心是小乘行者做的」。"},{"類":"立","文":"龍樹、無著，任何完整的傳承都說得清楚：大悲從這上面發生。"},{"類":"立","文":"形象上有差別，內涵一模一樣：深深了解取蘊本身是苦，絕無例外。"},{"類":"例","文":"做不到常覺得難過；了解了無比歡喜，末法時代碰到最完整根本的教法，感到慶幸。"},{"類":"因","文":"業感緣起，沒有宿生善根絕對碰不到。"},{"類":"喻","文":"一個拉、一個推：歡喜跑偏了，就想自己還有那麼多錯；推得太緊，又換成歡喜。方向總是一路向上。"}],"af":"70a","st":1327}],"逐字稿":[{"t":"70A 22:07","b":[["q","於諸有情流轉生死，亦無方便能起大悲，"],["s","對自己呢，發厭離心；然後因為自己了解，原來這個東西這麼個可怕法，這個問題都在這個地方，由此而推己及人，那麼那個時候發大悲。所以大悲，必定自己深深見到這個東西的可怕，然後你憐憫別人。現在你對這個東西都貪著難捨，你憐憫，你憐憫些什麼啊？那不是完全顛倒了嗎，完全顛倒了嗎？所以這地方很明白的，是沒有厭離心絕不可能有大悲心，所謂大悲心那只是騙騙人。不過在這個地方我們有一點要注意哦！這是理路是我們清楚，然後呢行持上去的時候，必然地先了解了理路慢慢上升。所以我們是一個凡夫，你問我：你有沒有厭離心？我懂得厭離心，有的時候碰巧，碰到一點點，經常狀態只是策發自己 ─就因為自己不能厭離所以策發！但是我雖然現在連厭離心做不到，可是我的目的是要成佛，所以我時時提醒我要發大悲、大菩提心，這個絕對正確的，絕對沒有錯。就是你了解了這個理路，然後一步一步策勵自己上去，這個是正確的路子。"]]},{"t":"70A 23:41","b":[["s","所以剛才講那個道理，一開頭你一定要圓滿地認識，不是圓滿 ─正確地認識，然後呢步步上升，你就不會走冤枉路，這個是它最主要的，最主要的。那隨時弄錯了，欸，弄錯了，拉回來；弄錯了，拉回來，那麼那個時候大家師友之間啊，就產生了最好的互相的助力，這個根本的問題。所以現在人家說：「哎呀，我是個大乘菩薩，這個出離心這個都小乘行者做的。」我也不曉得他這個佛法是哪裡學起？至少在我是不懂的。我看見龍樹菩薩，人家都說這個是「八宗共祖」，最了不起的，無著菩薩，不管是哪一個完整的傳承當中，說得清清楚楚，他那個大悲心一定從這個上面發生的。是，等到他啟發了大悲，他主要的一天到晚，那個時候忘我而忙別人了。所以他那個形象上面，的的確確是跟那個全部精神貫注在只解決自己問題的形式，有一點差別。但是你根本地深入去探索的話，這個內涵本質是完全一模一樣。內涵是什麼？喏！這些數取趣在生死當中痛苦，他要把他從生死當中透脫出來。他深深地了解這個取蘊的本身是苦，這一點絕對共同，絕沒有例外！這一點沒有，沒有佛法！所以這一點我們必定要了解的。"]]},{"t":"70A 25:35","b":[["s","所以現在第一個概念從這地方，我就非常歡喜，從做不到這一點來說，我常常覺得難過；從了解這一點來說，我無比地歡喜。唉呀，我覺得在今天這個末法時代，大家這麼你說你的、我說我的，不曉得什麼是好，居然最完整、根本的教法在這裡，啊，感到無比地慶幸！如果我們不是宿生有相當的善根，碰不到。為什麼？業感緣起，就是這樣簡單。你沒有積這個善根絕對碰不到，想到高興啊，想到高興啊！然後推動著自己，趕快努力。既然前面告訴我們有這麼事情做不到，現在又了解了怎麼去做，這個力量就來啦！一個是拉你的，一個是推你的，又拉又推那當然上得去。"]]},{"t":"70A 26:38","b":[["s","所以當你感著得拉了歡喜的時候，一個不小心歡喜到別的地方去了，趕快想想：唉呀，我還有這麼多錯！所以那個拉到別地方歡喜心，就被這個苦切的心情把它對治掉了，變成功推的力量。結果那推、推、推、推，推得太緊了，到那個時候心裡面又換一個想法，變成拉的力量，啊，心裡又歡喜！這樣狀態當中，不管你是歡喜也好，不管你是悲切也好，方向總歸是一路向上，這個是我們這個地方應該了解的，應該了解的。"]]},{"t":"70A 27:17","b":[["s","然後呢方法上面，同樣地我們要認真探討，儘管，是！無不是走這個出離的路，不管是自利利他，但是那個方法萬一弄得不對的話，我們以為做對了，結果走、走、走、走，走到邊路上面去了。就像剛才說的，喔，又講修行，結果呢他自己不懂得道理；然後呢要講道理，又把握不住這個中心，諸如此類。"]]}],"口譯音":"口譯音檔/siwei-kudi-04/010.mp3"},{"文":"故隨轉趣大小何乘，然此意樂極為切要。","口譯":"所以，無論轉趣大乘或小乘，這個意樂（求解脫心）都極為重要。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70A 27:50","頁":161,"af":"70a","st":1670,"et":1719,"消文":[{"文":"不管大乘小乘，這個認識最最重要，是問題的中心。"},{"文":"這就是為什麼要學很多東西，卻以本論為先。"},{"文":"把握住這根本，才曉得學戒、念佛的目的在這裡；把這個概念把握住，學什麼就成什麼。"}],"延伸":[],"逐字稿":[{"t":"70A 27:50","b":[["q","故隨轉趣大小何乘，然此意樂極為切要。"],["s","所以不管你大乘小乘，這個概念、這個認識最最重要的，這個是問題的中心。到了這裡我們大家曉得：為什麼現在我們好像要學很多東西，卻以本論為先，大家了解了，喏，就這個。你把握住這個根本，然後你才曉得：啊！那個時候我要學什麼？要學戒。戒的目的什麼？在這裡啊！嗯，那就對了。然後你曉得要念佛，哦，為什麼要念佛？原來這樣啊！那持戒等等無不在這個上頭。所以你把這個概念把握得住，學什麼就成什麼！"]]}],"口譯音":"口譯音檔/siwei-kudi-04/011.mp3"},{"文":"發生此者，亦隨當從«無垢»聖語，如量解釋，先正尋求清淨了解。","口譯":"要生起這個意樂，也應當依從無垢的聖言，以及如量的解釋，先正確地尋求清淨的了解。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70A 28:39","頁":161,"af":"70a","st":1719,"et":null,"消文":[{"文":"這個聖道的命根怎麼發生？必須隨「無垢」聖語。"},{"文":"聖語的特質是針對問題來解決；書很多，要如理抉擇，質本身不能錯。"},{"文":"如量解釋：根據相應的，解釋得清清楚楚；先正尋求清淨了解，這裡面已包括次第。"}],"延伸":[{"題":"無垢","組":[{"題":"無垢與正確","說":[{"類":"立","文":"他不說正確而講無垢：正確的很多，有的是枝末、有的是根本，會轉圈子。"},{"類":"立","文":"正面提示有時有漏洞；反面反顯，把錯誤的地方整個擋住。"},{"類":"例","文":"同修用功太緊聽輕音樂，有正面效果，但不是無垢，像電視裡插的廣告。"}]},{"題":"學得圓滿才安全","說":[{"類":"下手","文":"念本論辛苦不要怕；前面辛苦一點，學得圓滿沒漏洞，修起來百分之百安全。"},{"類":"喻","文":"造船圖省事漏洞很多，開出海到處漏水，那時只有一條路：死。"}]}],"說":[{"類":"立","文":"他不說正確而講無垢：正確的很多，有的是枝末、有的是根本，會轉圈子。"},{"類":"立","文":"正面提示有時有漏洞；反面反顯，把錯誤的地方整個擋住。"},{"類":"例","文":"同修用功太緊聽輕音樂，有正面效果，但不是無垢，像電視裡插的廣告。"},{"類":"下手","文":"念本論辛苦不要怕；前面辛苦一點，學得圓滿沒漏洞，修起來百分之百安全。"},{"類":"喻","文":"造船圖省事漏洞很多，開出海到處漏水，那時只有一條路：死。"}],"af":"70a","st":1719}],"逐字稿":[{"t":"70A 28:39","b":[["q","發生此者，亦隨當從無垢聖語，如量解釋，先正尋求清淨了解。"],["s","欸，曉得了，那麼又告訴我們學的次第呢？那麼這樣的一個重要的真正聖道的命根，它這個根本怎麼發生的呢？唔，必須要隨「無垢」。他不說正確而講無垢，妙了！有的時候我們正確，這個對了，但是對不起，你這個對、他那個也對、他那個也對，這個這麼多「對」當中，這一個地方也許有的是枝末，有的是根本，你要轉圈子。他反過來 ─無垢，就是說他這個絕對沒有錯的，都是正確的、正面的。所以這個用反面的反顯，跟正面的提示，兩個的差別我要說一下：正面的提示提出來了以後，有的時候有漏洞的；如果反面反顯的話，換句話說，他把錯誤的地方整個地擋住了。"]]},{"t":"70B 00:09","b":[["s","譬如說我昨天講的，一個同修講的這個經驗。他說他到那時候用功，哎呀，用得心裡很緊，然後因為他是一個在家居士，那當然了，可以有的時候聽聽那個輕音樂之類。嗯，這有它的功德的，有它正面效果的，但是它不是「無垢」。昨天我就解釋了，你們了解了沒有？就像我這講那個關於這個電視當中，插一個廣告進去的道理。所以這個真正的嚴密的，凡是遵循法相上頭的，它為什麼這麼個好法。同時這地方也說，念本論就算很辛苦啊，你不要怕辛苦，它正因為你前面稍微辛苦一點，所以它學得圓滿一點漏洞都沒有。到那時候你修起來，一點漏洞都沒有的話，百分之百地安全。"]]},{"t":"70B 01:06","b":[["s","現在前面你要圖一點省事，我舉個比喻吧，比如你造個船，前面造個船，圖一點省事，結果漏洞很多。你以為造好了開出海去，這個地方漏水，那個地方漏水，到那時來不及了，一條路 ─死。所以現在我們這個地方，真正的這個原因告訴我們，這無垢的，絕對不會有漏洞的。這個聖語聖者，這個「聖語」的特質是什麼？針對著問題來解決的，所以無垢的聖語。儘管現在的書好多，各式各樣的書，但是這些書當中，我們一定要選擇，要如理地抉擇，這個才對，所以這個質本身不能錯。還有呢，「如量解釋」，根據相應的，解釋得清清楚楚。對這個道理「正尋求清淨了解」，這裡面次第已經包括：你先了解，了解了對了，"]]}],"口譯音":"口譯音檔/siwei-kudi-04/012.mp3"},{"文":"次須長時觀擇修習，引發其心«猛利變動»。","口譯":"其次必須長時間地觀察抉擇、修習，引發內心猛利地轉變。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 02:20","頁":161,"af":"70b","st":140,"et":482,"消文":[{"文":"懂了以後要長時觀察、修習，修改這個心，一定要令心意轉變過來。"},{"文":"做到了就行，做不到趕快猛利懺悔。"}],"延伸":[{"題":"猛利變動","組":[{"題":"懂了為何做不到","說":[{"類":"因","文":"懂了做不到，通常實際上是沒有真的懂。"},{"類":"因","文":"真的懂了，無始雜染習氣還在現行，所做還是生死染污之業，怎麼解脫。"}]},{"題":"皈依時的身心相續","說":[{"類":"回扣","文":"回想正修時一心皈依，要身心相續和合：了解以前一無可取，這是唯一可以皈投的。"},{"類":"立","文":"那時心裡的現行是隨順正法，不是煩惱。"},{"類":"例","文":"念佛的念累了腦中還是佛號，作夢也念；持戒的自然自淨其意，不管人家怎麼說。"}]},{"題":"見惑思惑仍在","說":[{"類":"破","文":"資糧未具、障礙未除：見惑上轉的，腦筋聰明，文字通達。"},{"類":"破","文":"思惑上轉的，曉得發脾氣不好，碰到還是發；看見東西就食指大動。"}]},{"題":"法樂在淨化煩惱","說":[{"類":"下手","文":"要懺悔，先破現行；長時觀察、思惟、修習，引發其心猛利變動。"},{"類":"立","文":"貪放下了滿心清涼，瞋放掉了安樂無比，知見稠林放下了：因地上就感受到法樂。"},{"類":"破","文":"文字聽得美不是法樂；那說相聲的，遠比我們精采。"},{"類":"立","文":"法樂跟法相應，法的特質是淨化煩惱；因地降伏煩惱，感得不輪轉生死的清淨之果。"}]}],"說":[{"類":"因","文":"懂了做不到，通常實際上是沒有真的懂。"},{"類":"因","文":"真的懂了，無始雜染習氣還在現行，所做還是生死染污之業，怎麼解脫。"},{"類":"回扣","文":"回想正修時一心皈依，要身心相續和合：了解以前一無可取，這是唯一可以皈投的。"},{"類":"立","文":"那時心裡的現行是隨順正法，不是煩惱。"},{"類":"例","文":"念佛的念累了腦中還是佛號，作夢也念；持戒的自然自淨其意，不管人家怎麼說。"},{"類":"破","文":"資糧未具、障礙未除：見惑上轉的，腦筋聰明，文字通達。"},{"類":"破","文":"思惑上轉的，曉得發脾氣不好，碰到還是發；看見東西就食指大動。"},{"類":"下手","文":"要懺悔，先破現行；長時觀察、思惟、修習，引發其心猛利變動。"},{"類":"立","文":"貪放下了滿心清涼，瞋放掉了安樂無比，知見稠林放下了：因地上就感受到法樂。"},{"類":"破","文":"文字聽得美不是法樂；那說相聲的，遠比我們精采。"},{"類":"立","文":"法樂跟法相應，法的特質是淨化煩惱；因地降伏煩惱，感得不輪轉生死的清淨之果。"}],"af":"70b","st":140}],"逐字稿":[{"t":"70B 02:20","b":[["q","次須長時觀擇修習，引發其心猛利變動。"],["s","這是平常我們真正修行的重要的關鍵哦！所以為什麼我們懂了做不到？通常實際上，我們沒有真的懂，這是第一個。現在在這裡我們了解了：啊！關鍵在這裡。懂是真的懂了，但是雖然真的懂了，因為無始以來習氣還在，在無始的習氣的現行當中。這個無始的習氣是什麼？雜染的。既然在雜染的習氣當中現行，你所做到的還是生死染污之業，還是感得這個苦惱的苦報，你怎麼可能解脫呢！所以這個地方，進一步告訴我們：你要長時地觀察，然後修習，就修改那個心，一定要令我們的心意轉變過來。如果做到了就行，做不到了，是趕快猛利懺悔。"]]},{"t":"70B 03:33","b":[["s","所以我們現在馬上就回想一下，對！當初在前面告訴我們正修的時候怎麼修啊？說先把佛像安置，然後呢我們一心皈依，這皈依這個意都在裡頭。萬一你資糧未具，業障未除，到那時你皈依是皈依不起來。他告訴我們的皈依有個特定的特質，一定要使身心相續和合，這幾句話。現在我們了解了，什麼叫「相續和合」？就是問你為什麼皈依的？啊，原因了解以前的苦，所以要找快樂，這個快樂所依靠的地方是這個。所以那個時侯，你一心皈投依靠他，那個時候心裡面什麼個現行？以前是一無可取，是唯一可以皈投啊！請問這種狀態的心裡的現行是煩惱還是隨順正法？是隨順正法嘛！一點都沒錯嘛！"]]},{"t":"70B 04:45","b":[["s","所以那個時候假定你念佛的話，阿彌陀佛、阿彌陀佛、阿彌陀佛 ……念累了嘴巴儘管不想，腦筋裡面還阿彌陀佛，等到你睡覺了作夢你也在阿彌陀佛。如果你參禪的話，一天到晚就看著這個；如果你持戒的話，自然必然會自淨其意。啊，人家各宗各派的，他怎麼說、他怎麼說，那我不去管他，那我不去管他，這各人的根性不一樣，我曉得這個針對我的毛病，我就照著這個自淨其意，哪裡還有什麼質疑的問題？沒有啦！結果呢，對不起，嘿，我們資糧未具，我們的障礙未除，或者在思惑上轉，或者在見惑上轉。見惑上轉那些人，腦筋很聰明哦！這個見解文字很通達。思惑上轉的人，那個習性很強，叫他不要發脾氣，他也曉得發脾氣不好，碰見這種情況，就是要發脾氣，看那個人也看不慣，看那個人看不慣；貪心不好嘛，講的時候滿好，等一下看見了東西，唉呀，食指大動。原因是什麼？就是這個。"]]},{"t":"70B 06:00","b":[["s","那麼怎麼辦呢？要懺悔。那麼懺悔的時候第一個就「破現行」，啊！現在我們心裡曉得了，原來這問題是這樣。那要怎麼辦？要長時候地觀察、思惟、修習，然後呢「引發其心，猛利變動」。怎麼變動啊？以前哪，心一天到晚在煩惱上面轉，現在整個地改過來了，啊，原來這個樣的！很清楚、很明白地變掉了，這第一個。還有呢變掉了以後，因為是煩惱，煩惱的行相是什麼？煩煩惱惱嘛，很簡單嘛！等到你變過來了以後，當下 ─平常你一直，你這個貪心放不下，到那放下了，哎呀，你那時覺得：啊！滿心清涼。本來你看見這種地方看不順眼的話，你瞋心放掉了，啊，你只覺得安樂無比。平常你在知見上面老轉的，現在發現原來是知見稠林，一點用場都沒有，那時放下了。"]]},{"t":"70B 07:02","b":[["s","所以不是說等到果位上面，因地上面你已經是感受得到這個法樂，這個才是真正的法樂。不是說：唉呀，那個講的個文字聽得很美。如果說講的文字聽得很美的話，你跑到說書場裡面，唱相聲的，說實在那個唱相聲的，遠比我們精采，我怎麼比得過一個唱相聲的人！這個概念你們務必要知道，務必要知道。所以法樂是跟法相應，法的特質是淨化煩惱，那個時候你因地上面很清楚、很明白地降伏了。有這個因，將來感得的果是什麼？清淨之果。清淨之果就是不輪轉生死的，兩個的根本差別。所以說："]]}],"口譯音":"口譯音檔/siwei-kudi-04/013.mp3"},{"文":"故薄伽梵令知苦諦生死過患，宣說八苦，所有密意，如聖無著極善決擇而為宣釋。","口譯":"所以佛為了讓我們認識苦諦、看清生死的過患，講了八苦；其中深刻的用意，正如無著菩薩非常善巧地分析、解說的那樣。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 08:02","頁":162,"af":"70b","st":482,"et":536,"消文":[{"文":"佛陀為了讓我們了解苦諦的特質說八苦，真正重要的密意就是這樣。"},{"文":"佛所說比較深奧，無著菩薩非常善巧地解釋了。"}],"延伸":[],"逐字稿":[{"t":"70B 08:02","b":[["q","故薄伽梵令知苦諦生死過患，宣說八苦，所有密意，如聖無著極善決擇而為宣釋。"],["s","所以佛陀為了要讓我們了解這個苦諦的特質，喏，就是這樣，所以說這幾樣東西。他這個真正重要的密意、內涵就是這樣的。那麼這個聖者，佛所說的是比較深奧，現在經過無著菩薩，非常善巧地把它解釋了，哪！就這個道理。啊！現在我們懂了。"]]}],"口譯音":"口譯音檔/siwei-kudi-04/014.mp3"},{"文":"如博朵瓦云：「於六趣中，隨生何趣，其後發生病痛死等，眾苦惱者，是病者病，是死者死，非彼不應，忽爾而起。是生死相，或生死性，住生死時，必不能越。我等於此，若起厭離，須斷其生，«此須斷因»。」","口譯":"如博朵瓦說：「在六趣之中，無論生在哪一趣，之後發生病痛、死亡等眾多苦惱，病的就是病，死的就是死，並不是不應該發生而忽然生起的。這是生死的相狀，或說是生死的本性，住在生死中時，必定無法超越。我們對此如果生起厭離，就必須斷除受生；而要斷除受生，就必須斷除它的因。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 08:56","頁":162,"af":"70b","st":536,"et":665,"消文":[{"文":"六道之中，不管生在哪裡，病、死等身心苦惱，不是沒有理由突然跑來的。"},{"文":"在雜染中感得生死輪迴，性是生死性，相是生死相，只要在輪迴中決定沒有辦法超越跳出。"},{"文":"認識了要發起厭離；真要斷除，要找它為什麼來的，斷其因。"}],"延伸":[{"題":"此須斷因","組":[{"題":"從苦諦推到集諦","說":[{"類":"立","文":"既然是這個原因產生這個結果，就要斷其因，所以從苦諦推到集諦。"}]},{"題":"未見過患，外面空轉","說":[{"類":"破","文":"這一點沒有的話，儘管講三毒，看起來卻不是毒，像最寶貝的東西。"},{"類":"例","文":"看見好東西唯恐少；教你修行一點事情，就苦得受不了。"},{"類":"立","文":"問題沒有找到，總歸在外面空轉。"}]}],"說":[{"類":"立","文":"既然是這個原因產生這個結果，就要斷其因，所以從苦諦推到集諦。"},{"類":"破","文":"這一點沒有的話，儘管講三毒，看起來卻不是毒，像最寶貝的東西。"},{"類":"例","文":"看見好東西唯恐少；教你修行一點事情，就苦得受不了。"},{"類":"立","文":"問題沒有找到，總歸在外面空轉。"}],"af":"70b","st":539}],"逐字稿":[{"t":"70B 08:56","b":[["q","如博朵瓦云："],["s","那麼這個祖師也告訴我們："]]},{"t":"70B 08:59","b":[["q","「於六趣中，隨生何趣，其後發生病痛死等，眾苦惱者，是病者病，是死者死，非彼不應，忽爾而起。是生死相，或生死性，住生死時，必不能越。我等於此，若起厭離，須斷其生，此須斷因。」"],["s","下面告訴我們，這個祖師說：在我們這個六道當中，不管三界、四生、六道，不管你在哪一個地方，所有的這些東西，種種的痛苦啊！然後這個種種的身心的苦惱，不管是病、死等等，它這個東西，不是說沒有理由地突然之間跑得來，不是的！它總是在這個地方，你在雜染的情況，感得生死的輪迴以後，它那個性就是「生死性」，相就是「生死相」。你只要在這個生死輪迴當中，你決定沒有辦法超越跳出。對於這一點我們要認識，認識了以後要發起厭離。你真正要厭離、要斷除的時候，要怎麼辦哪？那時候進一步要找它，它為什麼來的？哦！有這個原因。既然是這原因而產生這個結果的話，那個時候你要斷其因，所以從苦諦而推到集諦。如果你這一點沒有的話，的的確確地，儘管我們講：唉呀，這個三毒啊！但是你看起來這個不是毒，喔唷，這個三種什麼最寶貝的東西哦！看見那好東西，哎喲，唯恐少，這樣。教你修行一點事情的話，唉呀，這個東西苦得受不了，偷懶，不要說偷，這個話不必這麼說啦，總之就是問題沒有找到的話，你總歸在外面空轉。"]]}],"口譯音":"口譯音檔/siwei-kudi-04/015.mp3"},{"文":"當於前說，生老病死等已生眾苦，如是思惟。","口譯":"前面講的生、老、病、死等等已經發生的苦，就要像這樣去思考。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"70B 11:05","頁":162,"af":"70b","st":665,"et":705,"消文":[{"文":"照著前面這樣來思惟，這是正說八苦的根本原因，重點我們現在認得了。"},{"文":"五蘊中三苦的特質，最後還要講；這是分八類來講，下面第二思惟六苦。"}],"延伸":[],"逐字稿":[{"t":"70B 11:05","b":[["q","當於前說，生老病死等已生眾苦，如是思惟。"],["s","就要照著前面這個這樣來，這個是正說八苦的根本原因，所以它的重點現在我們認得了。那麼至於這個五蘊，他是說出重點來，五蘊當中最特別的，所謂三苦─苦苦、壞苦、行苦的特質，在最後那地方還要講。這是分八類來講。第二思惟六苦，思惟六苦。那麼這個方面我們也把它看一看："
