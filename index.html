  $("#plLoop").onclick=()=>{P.loop=!P.loop;if(P.loop)P.cont=false;syncPM();if(!P.loop)cancelLoopWait();toast(P.loop?"重複播放這一段（每遍間隔 5 秒）":"重複播放：關")};
  $("#plCont").onclick=()=>{P.cont=!P.cont;if(P.cont)P.loop=false;syncPM();toast(P.cont?"連續播放：播完接下一段":"連續播放：關")};
  $("#ppBtn").onclick=()=>{if(P.waiting){cancelLoopWait();$("#aud").play().catch(()=>{});return}if(aud.paused){if(P.et!=null&&aud.currentTime>=P.et-0.3)aud.currentTime=P.st;aud.play().catch(()=>{})}else aud.pause()};
  $("#plClose").onclick=()=>{cancelLoopWait();aud.pause();$("#player").hidden=true};
  $("#plBar").onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),end=P.et??aud.duration;if(!end)return;aud.currentTime=P.st+(e.clientX-r.left)/r.width*(end-P.st);if(aud.paused)aud.play().catch(()=>{})};
  document.addEventListener("click",e=>{const t=e.target.closest("button.play-ts");if(t){P.seg=S.seg;P.lid=S.lesson.id;playSeg(t.dataset.af,+t.dataset.st,t.dataset.et,"逐字稿");return}const b=e.target.closest("button.play");if(!b)return;e.stopPropagation();P.seg=b.dataset.seg!=null?+b.dataset.seg:S.seg;P.lid=S.lesson.id;playSeg(b.dataset.af,+b.dataset.st,b.dataset.et,b.dataset.t)});

const durTxt=(st,et)=>{if(et==null||et==="")return"";const d=Math.max(0,(+et)-st);return d>=60?`${Math.floor(d/60)}分${String(d%60).padStart(2,"0")}秒`:`${d}秒`};
const rangeTxt=(af,st,et)=>`${af.toUpperCase()} ${mmss(st)}`+(et!=null&&et!==""?`～${mmss(+et)}・${durTxt(st,et)}`:" 起・播到卷尾");
const segRange = s=>`${s.af.toUpperCase()} ${mmss(s.st)}`+(s.et!=null?`～${mmss(s.et)}`:" 起");

// ───────── 科判樹 ─────────
const groupsOf=y=>y.組&&y.組.length?y.組:[{題:null,說:y.說||[]}];
function chars(text){const out=[];let red=false;for(const ch of text){if(ch==="«")red=true;else if(ch==="»")red=false;else out.push([ch,red])}return out}
function cols(cs,cap){const out=[];let i=0;while(i<cs.length){let j=Math.min(i+cap,cs.length);while(j<cs.length&&NO_HEAD.has(cs[j][0]))j++;out.push(cs.slice(i,j));i=j}return out}
function Node(lv,text,o={}){
  const c=LV[lv],n={lv,kids:[],...o};
  n.size=c.size;n.pitch=c.size*c.pitch;n.cols=cols(chars(text),c.cap);
  n.tagS=lv===3?Math.round(n.size*.7):n.size-2;
  n.tagH=n.tag?n.tag.length*n.tagS+14:0;
  n.bw=n.cols.length*n.pitch;n.bh=n.tagH+Math.max(...n.cols.map(c=>c.length))*n.size;
  return n;
}
function width(n){if(!n.kids.length)return n.bw;const g=LV[n.kids[0].lv].gap;
  return Math.max(n.bw,n.kids.reduce((a,k)=>a+width(k),0)+g*(n.kids.length-1))}
function buildTree(L,{xw,from=0,to=L.段.length-1}){
  const root=Node(1,L.根);
  L.段.forEach((s,i)=>{
    if(i<from||i>to)return;
    const n2=Node(2,s.文,{s:i,time:s.時});
    if(xw&&s.消文.length){const n3=Node(3,"消文",{kind:"xw",s:i});
      s.消文.forEach((x,k)=>n3.kids.push(Node(5,x.文,{tag:x.類,s:i,xi:k})));n2.kids.push(n3)}
    s.延伸.forEach((y,yi)=>{const n3=Node(3,"«"+y.題+"»",{tag:"延伸",kind:"ys",s:i,yv:yi});
      groupsOf(y).forEach(g=>{let host=n3;
        if(g.題){host=Node(4,g.題,{kind:"grp",s:i,yv:yi});n3.kids.push(host)}
        g.說.forEach((x,k)=>host.kids.push(Node(5,x.文,{tag:x.類,s:i,yv:yi,k})))});
      n2.kids.push(n3)});
    root.kids.push(n2);
  });
  return root;
}
function layout(root){
  const h={};(function w(n){h[n.lv]=Math.max(h[n.lv]||0,n.bh);n.kids.forEach(w)})(root);
  const tops={};let y=MARGIN;Object.keys(h).sort().forEach(lv=>{tops[lv]=y;y+=h[lv]+ROW_GAP});
  const W=width(root)+MARGIN*2+40,H=y-ROW_GAP+MARGIN;
  (function place(n,right){n.x1=right;n.y=tops[n.lv];n.ax=right-n.pitch/2;
    if(n.kids.length){const g=LV[n.kids[0].lv].gap;
      // 最右邊的子節點對齊父節點的接線點，直線才不會拐一下
      let r=n.ax+n.kids[0].pitch/2;for(const k of n.kids){place(k,r);r-=width(k)+g}}})(root,W-MARGIN);
  return {root,W,H,tops};
}
function walk(n,f){f(n);n.kids.forEach(k=>walk(k,f))}
function glyphs(n,f){n.cols.forEach((col,ci)=>{const cx=n.x1-n.pitch*(ci+.5);col.forEach(([ch,red],i)=>f(VERT[ch]||ch,cx,n.y+n.tagH+(i+.5)*n.size,red))})}
function lines(lay,f){
  (function go(n){if(!n.kids.length)return;const bar=lay.tops[n.kids[0].lv]-BAR_DROP,xs=n.kids.map(k=>k.ax).concat(n.ax);
    const fc=n.tagH+n.cols[0].length*n.size, sg=n.lv===1?null:n.s;
    f(n.ax,n.y+fc+6,n.ax,bar,sg,n);f(Math.min(...xs),bar,Math.max(...xs),bar,sg,n);
    n.kids.forEach(k=>{f(k.ax,bar,k.ax,k.y-6,k.lv===2?k.s:sg,k);go(k)})})(lay.root);
}
// 整節時：每堂第一段的右側畫分隔，回傳 (x, 上緣, 下緣, 標籤, 是否第一堂)
function lessonMarks(lay,f){
  const L=S.lesson;if(!L||!L.isNode)return;
  walk(lay.root,n=>{if(n.lv!==2)return;const sg=L.段[n.s];if(!sg||sg.ls!==0)return;
    const first=n.s===lay.root.kids[0].s;
    f(n.x1+(first?0:LV[2].gap/2),lay.tops[2]-BAR_DROP-34,lay.H-20,`第${sg.堂}堂`,first)});
}
function tagColor(t){return t==="延伸"?"zhu":"t-"+(TAGKEY[t]||"hui")}

// SVG：畫面版用 CSS 變數（跟著深淺色），匯出版寫死淺色
function svgOf(lay,{exp=false,caption=""}={}){
  const C=k=>exp?LIGHT[k]:`var(--${k})`;const o=[];
  const H=lay.H+(caption?40:0);
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" ${exp?"":'id="tree" '}width="${lay.W}" height="${H}" viewBox="0 0 ${lay.W} ${H}">`);
  if(exp)o.push(`<rect width="100%" height="100%" fill="${LIGHT.paper}"/>`);
  o.push(`<g id="treeg" font-family='${KAI}'>`);
  lessonMarks(lay,(x,y1,y2,label,first)=>{
    if(!first)o.push(`<line x1="${x.toFixed(1)}" y1="${y1}" x2="${x.toFixed(1)}" y2="${y2}" style="stroke:${C("zhu")};stroke-width:1.4;stroke-dasharray:7 6;opacity:.55"/>`);
    o.push(`<text x="${(x-8).toFixed(1)}" y="${y1+16}" font-size="17" text-anchor="end" style="fill:${C("zhu")}" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">${esc(label)}</text>`)});
  lines(lay,(x1,y1,x2,y2,sg)=>o.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"`+
    (exp?` stroke="${LIGHT.line}" stroke-width="1.5"`:(sg!=null?` data-s="${sg}"`:""))+`/>`));
  walk(lay.root,n=>{
    const cls=["n","lv"+n.lv];if(n.lv===5)cls.push("t-"+(TAGKEY[n.tag]||"none"));
    o.push(exp?"<g>":`<g class="${cls.join(" ")}"${n.s!=null?` data-s="${n.s}"`:""}${n.yv!=null?` data-y="${n.yv}"`:""}>`);
    if(!exp&&n.lv>1)o.push(`<rect class="hit" x="${(n.x1-n.bw-6).toFixed(1)}" y="${(n.y-8).toFixed(1)}" width="${(n.bw+12).toFixed(1)}" height="${(n.bh+16).toFixed(1)}" rx="6"/>`);
    if(n.kind==="xw"){const w=n.size+14;o.push(`<rect x="${(n.ax-w/2).toFixed(1)}" y="${n.y-8}" width="${w}" height="${n.bh+16}" rx="4" fill="none" stroke="${C("gold")}" stroke-width="1.6"/>`)}
    if(n.tag){const t=n.tagS,w=t+6,h=n.tag.length*t+8;
      o.push(`<rect x="${(n.ax-w/2).toFixed(1)}" y="${n.y}" width="${w}" height="${h}" rx="4" style="fill:${C(tagColor(n.tag))}"/>`);
      [...n.tag].forEach((ch,i)=>o.push(`<text x="${n.ax.toFixed(1)}" y="${(n.y+4+t*(i+.5)).toFixed(1)}" font-size="${t}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="${exp?"Noto Sans TC, Microsoft JhengHei, sans-serif":"var(--f-ui)"}">${esc(ch)}</text>`))}
    if(n.kind==="grp")o.push(`<line x1="${(n.ax-n.size*.45).toFixed(1)}" y1="${n.y-6}" x2="${(n.ax+n.size*.45).toFixed(1)}" y2="${n.y-6}" style="stroke:${C("zhu")};stroke-width:2"/>`);
    const base=n.kind==="xw"?C("gold"):n.kind==="grp"?C("ink-2"):C("ink");
    o.push(`<text font-size="${n.size}" text-anchor="middle" dominant-baseline="central"${n.lv===1?' font-weight="700"':""} style="fill:${base}">`);
    glyphs(n,(ch,x,y,red)=>o.push(`<tspan x="${x.toFixed(1)}" y="${y.toFixed(1)}"${red?` style="fill:${C("zhu")}"`:""}>${esc(ch)}</tspan>`));
    o.push(`</text>`);
    if(n.time&&!exp){const sg=S.lesson.段[n.s];o.push(`<title>${segName(S.lesson,n.s)}・${esc(segRange(sg))}${sg.頁?"・課本 p"+sg.頁:""}</title>`)}
    o.push("</g>");
  });
  o.push("</g>");
  if(caption)o.push(`<text x="${MARGIN}" y="${H-28}" font-size="18" fill="${LIGHT["ink-3"]}" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">${esc(caption)}</text>`);
  o.push("</svg>");return o.join("");
}

// ───────── 畫主圖 ─────────
function renderTree(keepScroll){
  const L=S.lesson,wrap=$("#treewrap");
  const prevRight=keepScroll?wrap.scrollWidth-wrap.scrollLeft:null;
  const root=buildTree(L,{xw:S.xw});
  const lay=layout(root);S.laid=lay;
  wrap.innerHTML=svgOf(lay);
  applyScale();
  // 縮圖：只畫方塊（原文灰、延伸朱、引導淡），不畫字
  const mb=[];walk(lay.root,n=>{if(n.lv<2)return;const f=n.kind==="ys"?"var(--zhu)":n.kind==="xw"?"var(--gold)":n.lv===2?"var(--ink-3)":"var(--rule)";
    mb.push(`<rect x="${(n.x1-n.bw).toFixed(0)}" y="${n.y}" width="${Math.max(6,n.bw-4).toFixed(0)}" height="${n.bh}" rx="6" style="fill:${f}" data-s="${n.s}"/>`)});

}
function applyScale(){
  const wrap=$("#treewrap"),svg=$("#tree"),lay=S.laid;if(!svg)return;
  if(S.scale==null){const h=wrap.clientHeight||700;S.scale=Math.max(.6,Math.min(1,(h-8)/lay.H))}

  $("#zFit").textContent=Math.round(S.scale*100)+"%";
}
function paintState(){
  const svg=$("#tree");if(!svg)return;
  svg.querySelectorAll(".n").forEach(g=>{
    const s=+g.dataset.s,isL2=g.classList.contains("lv2");
    g.classList.toggle("sel",isL2&&s===S.seg);
    g.classList.toggle("inrange",isL2&&S.range&&s>=S.range[0]&&s<=S.range[1]);
  });
  svg.querySelectorAll("line").forEach(l=>l.classList.toggle("on",l.dataset.s!=null&&+l.dataset.s===S.seg));
  svg.classList.toggle("filt",!!S.filter);
  if(S.filter)svg.querySelectorAll(".lv5").forEach(g=>g.classList.toggle("on",g.classList.contains("t-"+S.filter)));
  document.querySelectorAll("#tagbar .tagbtn").forEach(b=>b.setAttribute("aria-pressed",String(!S.filter||b.dataset.k===S.filter)));
}
function scrollToSeg(i,smooth=true){
  const wrap=$("#treewrap"),lay=S.laid;if(!lay||!wrap.clientWidth)return;
  let n=null;walk(lay.root,x=>{if(x.lv===2&&x.s===i)n=x});if(!n)return;
  const right=n.x1*S.scale,left=(n.x1-Math.max(n.bw,width(n)))*S.scale;
  const cw=wrap.clientWidth;
  // 整段（含延伸）放得下就置中；放不下就讓原文那一行靠右邊，往左讀
  let target=(right-left)<cw-80?(left+right)/2-cw/2:right+40-cw;

function updateMini(){

  const W=wrap.scrollWidth,tw=$("#mini").clientWidth;

// ───────── 細看 ─────────
function kpPath(){ // 根據科判焦點找路徑

function renderDetail(){

  side.innerHTML=`

      <span class="pill">${rangeTxt(s.af,s.st,s.et)}</span>${playLink(s.af,s.st,s.et,"播放這段",false,`第 ${S.seg+1} 段`)}</div>

function renderMap(){
  const has=new Set(S.index.map(x=>x.科判焦點)),path=new Set(kpPath());
  const lessonsOf=n=>S.index.filter(x=>x.科判焦點===`${n.c} ${n.t}`||x.科判焦點===n.t);
  // 已整理的節點、各節點底下有幾堂、所有已整理節點共同的祖先
  const keep=new Set(),cnt=new Map(),paths=[];
  (function go(n,p){const me=p.concat(n),k=lessonsOf(n).length;if(k){paths.push(me);me.forEach(x=>{keep.add(x);cnt.set(x,(cnt.get(x)||0)+k)})}(n.k||[]).forEach(c=>go(c,me))})(S.kepan.樹,[]);
  let common=paths.length?paths[0].slice():[S.kepan.樹];
  for(const p of paths){let i=0;while(i<common.length&&i<p.length&&common[i]===p[i])i++;common=common.slice(0,i)}
  if(paths.length===1)common=common.slice(0,Math.max(1,common.length-2));   // 只有一處時留兩層脈絡
  const mine=!S.mapAll,start=mine?common.at(-1):S.kepan.樹;
  function lessonBlock(n,depth){
    const ls=lessonsOf(n);if(!ls.length)return "";
    const cur=ls.find(x=>S.lesson&&S.lesson.id===x.id),key=`${n.c} ${n.t}`,nodeCur=S.lesson&&S.lesson.isNode&&S.lesson.科判焦點===key;
    const whole=ls.length>1?`<button data-node="${esc(ls[0].id)}" class="lpill whole${nodeCur?" cur":""}" title="把這一節的 ${ls.length} 堂接成一張圖">整節 ${ls.length} 堂</button>`:"";
    return `<div class="lessons" style="--d:${depth}"><div class="lpills">${whole}${ls.map(x=>`<button data-lesson="${esc(x.id)}" class="lpill${cur===x?" cur":""}" title="${esc(x.標題)}　${esc(x.課本範圍)}">第${x.堂數}堂</button>`).join("")}</div>
      ${nodeCur?`<div class="lcard cur"><div class="lrange">${esc(S.lesson.課本範圍.replace(" ~ ","～"))}</div><div class="lplay" style="color:var(--ink-3)">第${esc(S.lesson.堂數)}堂接成一張圖，點單堂只看那一堂</div></div>`:""}
      ${cur?`<div class="lcard cur"><div class="lrange">${esc(cur.課本範圍.replace(" ~ ","～"))}</div>
        ${cur.音檔網址?`<a class="lplay" href="${esc(cur.音檔網址)}" target="_blank" rel="noopener" title="在廣論時時聽播放整堂課">▶ 全堂音檔　${esc(cur.音檔範圍||"")}</a>`:""}</div>`:""}</div>`;
  }
  function li(n,depth){
    if(mine&&!keep.has(n))return "";
    const key=`${n.c} ${n.t}`,isHas=lessonsOf(n).length>0,kids=(n.k||[]).filter(k=>!mine||keep.has(k));
    const isOpen=n===start||path.has(n)||(!mine&&depth<1)||(mine&&S.mapOpen&&S.mapOpen.has(n));
    const c=cnt.get(n)||0,badge=mine&&!isOpen&&kids.length&&c?`<span class="kcnt">${c} 堂</span>`:"";
    return `<li><div class="row${path.has(n)?" path":""}${isHas?" has":""}${isHas&&(lessonsOf(n).some(x=>S.lesson&&x.id===S.lesson.id)||(S.lesson&&S.lesson.isNode&&S.lesson.科判焦點===key))?" cur":""}" style="--d:${depth}" ${isHas?`data-has="${esc(key)}" tabindex="0"`:""}>
      ${kids.length?`<button class="tw" aria-expanded="${isOpen}" aria-label="展開">${isOpen?"▾":"▸"}</button>`:'<span class="tw"></span>'}
      ${n.c?`<span class="c">${esc(n.c)}</span>`:""}<span class="t">${esc(n.t)}</span>${badge}</div>${lessonBlock(n,depth)}
      ${kids.length?`<ul${isOpen?"":" hidden"}>${kids.map(k=>li(k,depth+1)).join("")}</ul>`:""}</li>`;
  }

  const cur=$("#kp .row.cur");if(cur)setTimeout(()=>{const m=$(".map");if(cur.offsetTop>m.scrollTop+m.clientHeight-80||cur.offsetTop<m.scrollTop)m.scrollTop=cur.offsetTop-m.clientHeight/3;m.scrollLeft=0},50);
}

function doSearch(q){
  q=q.trim();const box=$("#results");if(!q){box.hidden=true;return}
  const groups=[],LS=S.index.map(x=>S.lessons[x.id]).filter(Boolean);
  const multi=LS.length>1,tag=L=>multi?L.標題+"・":"";
  // 音檔：「69A」列出這一卷的所有段；「69A 12」「69a1230」「69A 12:30」跳到那個時間；「12:30」各卷都找
  const tm=q.match(TIME_RE),tm2=!tm&&q.match(/^\s*(\d{1,2})\s*[:：]\s*(\d{2})\s*$/);
  const segAt=(L,af,sec)=>{let hit=-1;L.段.forEach((s,i)=>{if(s.af===af&&s.st<=sec&&(s.et==null||sec<s.et||i===L.段.length-1||L.段[i+1].af!==af))hit=i});return hit};
  const allAf=[...new Set(LS.flatMap(L=>L.段.map(s=>s.af)))];
  if(tm){const want=(+tm[1])+tm[2].toLowerCase();const afk=allAf.find(a=>a.replace(/^0+/,"")===want)||want;
    if(tm[3]==null){
      const list=LS.flatMap(L=>L.段.map((s,i)=>({L,s,i})).filter(x=>x.s.af===afk));
      groups.push(["音檔 "+afk.toUpperCase(),list.map(x=>({lid:x.L.id,go:x.i,h:`${segRange(x.s)}　${tag(x.L)}第 ${x.i+1} 段`,m:plain(x.s.文).slice(0,36)+"…"})),
        list.length?null:`還沒整理到 ${afk.toUpperCase()}（目前有 ${allAf.map(a=>a.toUpperCase()).join("、")}）`]);
    }else{
      const sec=(+tm[3])*60+(tm[4]!=null?+tm[4]:0),res=[];
      LS.forEach(L=>{const h=segAt(L,afk,sec);if(h>=0&&L.段[h].st<=sec)res.push({lid:L.id,go:h,h:`${afk.toUpperCase()} ${mmss(sec)} → ${tag(L)}第 ${h+1} 段（${segRange(L.段[h])}）`,m:plain(L.段[h].文).slice(0,40)+"…"})});
      groups.push(["音檔",res.slice(0,3),res.length?null:`${afk.toUpperCase()} ${mmss(sec)} 還沒整理`]);
    }
  }else if(tm2){const sec=(+tm2[1])*60+(+tm2[2]);const res=[];
    LS.forEach(L=>[...new Set(L.段.map(s=>s.af))].forEach(af=>{const h=segAt(L,af,sec);if(h>=0)res.push({lid:L.id,go:h,h:`${af.toUpperCase()} ${mmss(sec)} → ${tag(L)}第 ${h+1} 段`,m:plain(L.段[h].文).slice(0,40)+"…"})}));
    if(res.length)groups.push(["音檔",res]);
  }
  const kp=[];(function go(n,p){const me=p.concat(n);if(n.t&&(n.t.includes(q)||(n.c&&n.c===q)))kp.push(me);(n.k||[]).forEach(k=>go(k,me))})(S.kepan.樹,[]);
  if(kp.length)groups.push(["科判",kp.slice(0,8).map(p=>{const n=p.at(-1),key=`${n.c} ${n.t}`,has=S.index.some(x=>x.科判焦點===key||x.科判焦點===n.t);
    return {kp:key,h:`${esc(n.c)} ${hl(n.t,q)}`,m:(has?"已整理・":"尚未整理・")+p.slice(1,-1).slice(-2).map(x=>x.t).join(" › "),raw:true}})]);
  const ls=LS.filter(L=>L.標題.includes(q));
  if(ls.length)groups.push(["課",ls.map(L=>({lid:L.id,go:0,h:`${esc(L.標題)}　第${L.堂數}堂`,m:L.課本範圍,raw:true}))]);
  const yw=[],ys=[],xw=[],ts=[];
  LS.forEach(L=>L.段.forEach((s,i)=>{const at=`${tag(L)}第 ${i+1} 段`,lid=L.id;
    if(plain(s.文).includes(q))yw.push({lid,go:i,h:hl(plain(s.文),q),m:at+(s.頁?"・p"+s.頁:""),raw:true});
    s.延伸.forEach((y,yi)=>{if(y.題.includes(q))ys.push({lid,go:i,y:yi,h:"延伸・"+hl(y.題,q),m:at,raw:true});
      groupsOf(y).forEach(g=>{if(g.題&&g.題.includes(q))ys.push({lid,go:i,y:yi,h:hl(g.題,q),m:`延伸・${y.題}・${at}`,raw:true})});
      y.說.forEach(x=>{if(x.文.includes(q))ys.push({lid,go:i,y:yi,h:`<span class="badge" style="background:var(--t-${TAGKEY[x.類]||"hui"})">${esc(x.類)}</span> `+hl(x.文,q),m:`延伸・${y.題}・${at}`,raw:true})})});
    if(s.口譯&&s.口譯.includes(q))xw.push({lid,go:i,h:hl(s.口譯,q),m:`口譯・${at}`,raw:true});
    s.消文.forEach(x=>{if(x.文.includes(q))xw.push({lid,go:i,h:hl(x.文,q),m:`消文・${at}`,raw:true})});
    s.逐字稿.forEach(t=>t.b.forEach(([k,x])=>{if(k==="s"&&x.includes(q))ts.push({lid,go:i,h:hl(x,q),m:`${t.t}・${at}`,raw:true})}));
  }));
  if(yw.length)groups.push(["原文",yw]);if(ys.length)groups.push(["延伸理路",ys]);if(xw.length)groups.push(["口譯・消文理路",xw]);if(ts.length)groups.push(["逐字稿（師父）",ts.slice(0,15)]);
  S.results=[];let html="";
  for(const [g,arr,note] of groups){html+=`<div class="grp">${g}</div>`;if(note)html+=`<div class="empty">${esc(note)}</div>`;
    arr.forEach(r=>{S.results.push(r);html+=`<button data-r="${S.results.length-1}"><div>${r.raw?r.h:esc(r.h)}</div><div class="meta">${esc(r.m)}</div></button>`})}
  box.innerHTML=html||`<div class="empty">找不到「${esc(q)}」。可以試試原文裡的詞、科判名稱，或「69A 12:30」這種音檔時間。</div>`;
  box.hidden=false;
}
function goResult(r){
  $("#results").hidden=true;
  if(r.kp){const row=[...document.querySelectorAll("#kp .row")].find(x=>x.querySelector(".t")&&(`${x.querySelector(".c")?.textContent||""} ${x.querySelector(".t").textContent}`.trim()===r.kp.trim()));
    openMapTo(r.kp);
    const hit=S.index.find(x=>x.科判焦點===r.kp||x.科判焦點===r.kp.split(" ").pop());
    if(hit){loadLesson(hit.id,0)}
    else toast("這一節還沒整理師父講解；科判上已標出位置。");
    if(isMobile())setM("map");return}
  if(isMobile()&&$("#main").dataset.m==="map")setM("outline");
  if(r.lid&&r.lid!==S.lesson.id){loadLesson(r.lid,r.go,r.y??null);return}
  selectSeg(r.go,{yan:r.y??null});
}
function openMapTo(key){
  if(!S.mapAll){S.mapAll=true;renderMap()}
  let target=null;const p=[];(function go(n,path){const me=path.concat(n);if(!target&&`${n.c} ${n.t}`.trim()===key.trim())target=me;(n.k||[]).forEach(k=>go(k,me))})(S.kepan.樹,[]);
  if(!target)return;
  // 依序展開
  const rows=[...document.querySelectorAll("#kp .row")];
  const keyOf=row=>`${row.querySelector(".c")?.textContent||""} ${row.querySelector(".t").textContent}`.trim();
  target.forEach(n=>{const r=rows.find(x=>keyOf(x)===`${n.c} ${n.t}`.trim());if(r){const ul=r.nextElementSibling;if(ul){ul.hidden=false;const b=r.querySelector(".tw");if(b){b.textContent="▾";b.setAttribute("aria-expanded","true")}}}});
  const last=rows.find(x=>keyOf(x)===key.trim());if(last){last.scrollIntoView({block:"center",behavior:"smooth"});last.classList.remove("flash");void last.offsetWidth;last.classList.add("flash")}
}

// ───────── 下載 ─────────
let downloads=null;
function openPop(){
  const L=S.lesson,parts=L.分圖||[];
  $("#rangeOpts").innerHTML=`<div class="sub">範圍</div>
    <label><input type="radio" name="rg" value="all" checked> 整課（${L.段.length} 段）</label>
    ${parts.map((p,i)=>`<label><input type="radio" name="rg" value="p${i}"> ${esc(p.名)}<span class="sub">　第 ${p.原文[0]+1}～${p.原文[1]+1} 段</span></label>`).join("")}
    <label><input type="radio" name="rg" value="seg"> 目前這一段（第 ${S.seg+1} 段）</label>
    <label><input type="radio" name="rg" value="pick"> 自選區段<span class="sub">　${S.range?`第 ${S.range[0]+1}～${S.range[1]+1} 段・`:""}在圖上點起點和終點</span></label>`;
  $("#dlXw").checked=S.xw;$("#dlMsg").textContent="";
  $("#pop").hidden=false;
}
function rangeFromPop(){
  const v=document.querySelector('input[name="rg"]:checked').value,L=S.lesson;
  if(v==="all")return[0,L.段.length-1,"整課"];
  if(v==="seg")return[S.seg,S.seg,`第${S.seg+1}段`];
  if(v==="pick")return S.range?[S.range[0],S.range[1],`第${S.range[0]+1}-${S.range[1]+1}段`]:null;
  const p=L.分圖[+v.slice(1)];return[p.原文[0],p.原文[1],p.名];
}
async function doDownload(){
  const v=document.querySelector('input[name="rg"]:checked').value;
  if(v==="pick"&&!S.range){startPick();return}
  const [a,b,name]=rangeFromPop(),xw=$("#dlXw").checked,fmt=document.querySelector('input[name="fmt"]:checked').value;
  const L=S.lesson,lay=layout(buildTree(L,{xw,from:a,to:b}));
  const cap=`${L.標題}　師父講解科判${xw?"":"（延伸理路）"}　${name}　｜　${L.課本範圍}　｜　紅字＝延伸關鍵詞　立＝所立　破＝所破　下手＝下手處　回扣＝回扣原文`;
  const fname=`${L.標題}_師父科判${xw?"":"_延伸"}_${name}.${fmt}`;
  $("#dlMsg").textContent="產生中…";
  try{
    let data;
    if(fmt==="svg")data=svgOf(lay,{exp:true,caption:cap});
    else data=await toPng(lay,cap);
    if(downloads)await downloads.save({filename:fname,data});
    else{const blob=data instanceof Blob?data:new Blob([data],{type:"image/svg+xml"});const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
    $("#pop").hidden=true;toast("已下載："+fname);
  }catch(e){
    const c=e&&e.code;$("#dlMsg").textContent=c==="declined"?"已取消。":c==="rate_limited"?"已經有一個存檔視窗開著，等一下再試。":"沒有存成："+(e&&e.message||e);
  }
}
async function toPng(lay,cap){
  const sc=2,H=lay.H+40,cv=document.createElement("canvas");cv.width=lay.W*sc;cv.height=H*sc;
  const ctx=cv.getContext("2d");ctx.scale(sc,sc);
  let all="";walk(lay.root,n=>n.cols.forEach(c=>c.forEach(([ch])=>all+=VERT[ch]||ch)));
  try{await Promise.all([26,21,30,46].map(z=>document.fonts.load(`${z}px "LXGW WenKai TC"`,all)))}catch(e){}
  ctx.fillStyle=LIGHT.paper;ctx.fillRect(0,0,lay.W,H);
  ctx.strokeStyle=LIGHT.line;ctx.lineWidth=1.5;
  lines(lay,(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()});
  lessonMarks(lay,(x,y1,y2,label,first)=>{ctx.save();ctx.strokeStyle=LIGHT.zhu;ctx.globalAlpha=.55;ctx.setLineDash([7,6]);
    if(!first){ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke()}ctx.restore();
    ctx.save();ctx.fillStyle=LIGHT.zhu;ctx.font='17px "Noto Sans TC",sans-serif';ctx.textAlign="right";ctx.textBaseline="alphabetic";ctx.fillText(label,x-8,y1+16);ctx.restore()});
  ctx.textAlign="center";ctx.textBaseline="middle";
  walk(lay.root,n=>{
    if(n.kind==="xw"){const w=n.size+14;ctx.strokeStyle=LIGHT.gold;ctx.lineWidth=1.6;rr(ctx,n.ax-w/2,n.y-8,w,n.bh+16,4);ctx.stroke()}
    if(n.tag){const t=n.tagS,w=t+6,h=n.tag.length*t+8;ctx.fillStyle=LIGHT[tagColor(n.tag)];rr(ctx,n.ax-w/2,n.y,w,h,4);ctx.fill();
      ctx.fillStyle="#fff";ctx.font=`500 ${t}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;[...n.tag].forEach((ch,i)=>ctx.fillText(ch,n.ax,n.y+4+t*(i+.5)))}
    if(n.kind==="grp"){ctx.strokeStyle=LIGHT.zhu;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(n.ax-n.size*.45,n.y-6);ctx.lineTo(n.ax+n.size*.45,n.y-6);ctx.stroke();ctx.strokeStyle=LIGHT.line;ctx.lineWidth=1.5}
    ctx.font=`${n.lv===1?"700 ":""}${n.size}px ${KAI}`;
    glyphs(n,(ch,x,y,red)=>{ctx.fillStyle=red?LIGHT.zhu:(n.kind==="xw"?LIGHT.gold:n.kind==="grp"?LIGHT["ink-2"]:LIGHT.ink);ctx.fillText(ch,x,y)});

  });
  ctx.textAlign="left";ctx.font='18px "Noto Sans TC","Microsoft JhengHei",sans-serif';ctx.fillStyle=LIGHT["ink-3"];ctx.fillText(cap,MARGIN,H-34);
  return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("圖太大，請改選較小的區段")),"image/png"));
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function startPick(){
  $("#pop").hidden=true;S.pick={a:null};
  let h=$("#pickhint");if(!h){h=document.createElement("div");h.id="pickhint";h.className="pickhint";$("#treewrap").appendChild(h)}
  h.textContent="自選區段：點起點那段原文";h.hidden=false;
  if(isMobile())setM("tree");
}
function pickClick(i){
  const h=$("#pickhint");
  if(S.pick.a==null){S.pick.a=i;S.range=[i,i];h.textContent=`起點：第 ${i+1} 段。再點終點那段原文`;paintState();return}
  const a=Math.min(S.pick.a,i),b=Math.max(S.pick.a,i);S.range=[a,b];S.pick=null;h.hidden=true;paintState();
  openPop();document.querySelector('input[name="rg"][value="pick"]').checked=true;
}

function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function setM(m){$("#main").dataset.m=m;document.querySelectorAll(".mtabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.m===m)));
  if(m==="tree"){S.scale=null;requestAnimationFrame(()=>{applyScale();scrollToSeg(S.seg,false);updateMini()})}
  if(m==="index"){S.tab="i";renderDetail()}else if(m==="ky"){S.tab="k";renderDetail()}else if(m==="ppt"){S.tab="p";renderDetail()}else if((S.tab==="i"||S.tab==="k"||S.tab==="p")&&isMobile()){S.tab="d"}
}

// ───────── 事件 ─────────
function bind(){
  const wrap=$("#treewrap");
  // 按住拖曳平移（滑鼠）；移動超過 5px 才算拖曳，不會誤觸點選
  let dg=null;
  wrap.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0)return;
    dg={x:e.clientX,y:e.clientY,l:wrap.scrollLeft,t:wrap.scrollTop,moved:false,id:e.pointerId}});
  wrap.addEventListener("pointermove",e=>{if(!dg)return;const dx=e.clientX-dg.x,dy=e.clientY-dg.y;
    if(!dg.moved&&Math.hypot(dx,dy)>5){dg.moved=true;wrap.classList.add("dragging");try{wrap.setPointerCapture(dg.id)}catch(_){}}
    if(dg.moved){wrap.scrollLeft=dg.l-dx;wrap.scrollTop=dg.t-dy}});
  const endDrag=()=>{if(!dg)return;if(dg.moved){wrap.dataset.justDragged="1";setTimeout(()=>delete wrap.dataset.justDragged,0)}
    wrap.classList.remove("dragging");dg=null};
  wrap.addEventListener("pointerup",endDrag);wrap.addEventListener("pointercancel",endDrag);
  // 滾輪：圖不需要上下捲的時候，直接變左右捲
  wrap.addEventListener("wheel",e=>{if(e.shiftKey||e.ctrlKey||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
    if(wrap.scrollHeight<=wrap.clientHeight+2){wrap.scrollLeft-=e.deltaY;e.preventDefault()}},{passive:false});

    if(wrap.dataset.justDragged)return;

  mini.addEventListener("pointerdown",e=>{drag=true;mini.setPointerCapture(e.pointerId);jump(e)});

  $("#zFit").onclick=()=>{S.scale=null;zoomKeep()};
  $("#tagbar").innerHTML=TAGS.filter((t,i,a)=>a.findIndex(x=>x[1]===t[1])===i).map(t=>`<button class="tagbtn" data-k="${t[1]}" style="background:var(--t-${t[1]})" aria-pressed="true" title="${t[2]}">${t[1]==="yu"?"喻例":t[0]}</button>`).join("");
  $("#tagbar").addEventListener("click",e=>{const b=e.target.closest(".tagbtn");if(!b)return;S.filter=S.filter===b.dataset.k?null:b.dataset.k;paintState();renderDetail();renderOutline()});
  $("#tabD").onclick=()=>{S.tab="d";syncTabs();renderDetail()};
  $("#tabI").onclick=()=>{S.tab="i";syncTabs();renderDetail()};
  $("#tabK").onclick=()=>{S.tab="k";syncTabs();renderDetail()};
  $("#tabP").onclick=()=>{S.tab="p";syncTabs();renderDetail()};
  $("#side").addEventListener("change",e=>{if(e.target.id==="kyRate"){K.rate=+e.target.value;store("kp.kyRate",String(K.rate));kyAud().playbackRate=K.rate;return}
    if(e.target.id==="kyOrig"){S.kyOrig=e.target.checked;store("kp.kyOrig",S.kyOrig?"1":"0");renderDetail()}});
  $("#side").addEventListener("click",e=>{
    if(e.target.closest("#pvPrev")){pvShow(PV.i-1);return}

    if(!e.target.closest("#pop")&&!e.target.closest("#dlBtn")&&!$("#pop").hidden&&!S.pick)$("#pop").hidden=true});
  $("#mapMine").onclick=()=>{S.mapAll=false;store("kp.mapAll","0");renderMap()};
  $("#mapAll").onclick=()=>{S.mapAll=true;store("kp.mapAll","1");renderMap()};
  $("#kp").addEventListener("click",e=>{
    const nb=e.target.closest("[data-node]");if(nb){loadLesson("n-"+nb.dataset.node,0);if(isMobile())setM("tree");return}
    const lb=e.target.closest("[data-lesson]");if(lb){loadLesson(lb.dataset.lesson,0);if(isMobile())setM("tree");return}
    // 展開／收起：點箭頭、點「n 堂」標籤，或點沒有課的節點整行都可以
    const row0=e.target.closest(".row");
    const tw=e.target.closest(".tw")||(e.target.closest(".kcnt")&&row0?.querySelector("button.tw"))||(row0&&!row0.classList.contains("has")?row0.querySelector("button.tw"):null);
    if(tw&&tw.tagName==="BUTTON"){let ul=tw.closest(".row").nextElementSibling;if(ul&&ul.classList.contains("lessons"))ul=ul.nextElementSibling;if(ul){ul.hidden=!ul.hidden;tw.textContent=ul.hidden?"▸":"▾";tw.setAttribute("aria-expanded",String(!ul.hidden));const k=tw.closest(".row").querySelector(".kcnt");if(k)k.style.visibility=ul.hidden?"":"hidden"}return}
    const r=e.target.closest(".row.has");if(r){const k=r.dataset.has,xs=S.index.filter(x=>x.科判焦點===k||x.科判焦點===k.split(" ").pop());
      if(xs.length>1)loadLesson("n-"+xs[0].id,0);else if(xs.length&&xs[0].id!==S.lesson.id)loadLesson(xs[0].id,0);if(isMobile())setM("tree")}
  });
  $("#dlBtn").onclick=e=>{e.stopPropagation();$("#pop").hidden?openPop():($("#pop").hidden=true)};
  $("#dlCancel").onclick=()=>$("#pop").hidden=true;
  $("#dlGo").onclick=doDownload;
  $("#outline").addEventListener("click",e=>{const oc=e.target.closest(".oc");if(!oc||e.target.closest("a,summary,button"))return;const i=+oc.id.slice(2);if(i!==S.seg){S.seg=i;document.querySelectorAll("#outline .oc").forEach((el,k)=>el.classList.toggle("sel",k===i));paintState()}});
  document.querySelectorAll(".mtabs button").forEach(b=>b.onclick=()=>setM(b.dataset.m));
  addEventListener("resize",()=>{applyScale();updateMini()});
  addEventListener("hashchange",fromHash);
  // 投影片：方向鍵換頁、F 全螢幕、Esc 離開（假全螢幕）
  document.addEventListener("keydown",e=>{
    if(S.tab!=="p"||(e.target.closest&&e.target.closest("input,select,textarea")))return;
    if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();pvShow(PV.i+1)}
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();pvShow(PV.i-1)}
    else if(e.key==="f"||e.key==="F"){pvFull(!(document.fullscreenElement||$(".pvstage.fakefs")))}
    else if(e.key==="Escape")pvFull(false);
  });
  // 手機：投影片左右滑動換頁
  let sx=null;document.addEventListener("touchstart",e=>{if(e.target.closest("#pvStage"))sx=e.touches[0].clientX},{passive:true});
  document.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>40)pvShow(PV.i+(dx<0?1:-1))},{passive:true});
}
// ───────── 分隔線：寬度存在本機 ─────────
const SPLIT={map:[270,0,520],det:[380,280,720]};
function setW(k,w,save){const [d,mn,mx]=SPLIT[k];w=Math.round(w);
  if(k==="map"&&w<90)w=0;else w=Math.max(mn,Math.min(mx,w));
  $("#main").style.setProperty(k==="map"?"--mapw":"--detw",w+"px");S[k+"W"]=w;
  if(save)store("kp."+k+"W",String(w));updateMini()}
function bindSplit(){
  [["gutL","map",1],["gutR","det",-1]].forEach(([id,k,sign])=>{
    const g=$("#"+id);let st=null;
    g.addEventListener("pointerdown",e=>{st={x:e.clientX,w:S[k+"W"]};g.setPointerCapture(e.pointerId);g.classList.add("on");document.body.classList.add("resizing");e.preventDefault()});
    g.addEventListener("pointermove",e=>{if(st)setW(k,st.w+sign*(e.clientX-st.x),false)});
    const end=()=>{if(!st)return;st=null;g.classList.remove("on");document.body.classList.remove("resizing");setW(k,S[k+"W"],true);applyScale()};
    g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
    g.addEventListener("dblclick",()=>{setW(k,SPLIT[k][0],true);store("kp."+k+"W",null)});
    g.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();setW(k,S[k+"W"]+(e.key==="ArrowRight"?sign:-sign)*20,true)}});
  });
  for(const k of ["map","det"]){const v=+store("kp."+k+"W");setW(k,v>=0&&store("kp."+k+"W")!=null?v:SPLIT[k][0],false)}
}
function zoomKeep(){const wrap=$("#treewrap"),fr=(wrap.scrollLeft+wrap.clientWidth/2)/wrap.scrollWidth;applyScale();wrap.scrollLeft=fr*wrap.scrollWidth-wrap.clientWidth/2;updateMini()}
function syncLayer(){$("#lyBoth").setAttribute("aria-pressed",String(S.xw));$("#lyYan").setAttribute("aria-pressed",String(!S.xw))}
function syncTabs(){$("#tabD").setAttribute("aria-selected",String(S.tab==="d"));$("#tabK").setAttribute("aria-selected",String(S.tab==="k"));$("#tabP").setAttribute("aria-selected",String(S.tab==="p"));$("#tabI").setAttribute("aria-selected",String(S.tab==="i"))}
function nodeKeyOf(L){return L.科判焦點}
function lessonsInNode(key){return S.index.filter(x=>x.科判焦點===key).map(x=>S.lessons[x.id]).filter(Boolean)}
function buildNode(key){
  const ls=lessonsInNode(key);if(!ls.length)return null;
  const id="n-"+ls[0].id;if(S.lessons[id])return S.lessons[id];
  const 段=[],分圖=[];
  ls.forEach(L=>{const a=段.length;L.段.forEach((x,i)=>段.push({...x,堂:L.堂數,lid:L.id,ls:i}));分圖.push({名:`第${L.堂數}堂`,原文:[a,段.length-1]})});
  const rng=ls[0].課本範圍.split("~")[0].trim()+" ~ "+ls.at(-1).課本範圍.split("~").pop().trim();
  const N={id,isNode:true,標題:ls[0].根,根:ls[0].根,科判焦點:key,課本範圍:rng,堂數:ls.length>1?`${ls[0].堂數}–${ls.at(-1).堂數}`:ls[0].堂數,
    日期:ls.length>1?`${ls[0].日期}～${ls.at(-1).日期}`:ls[0].日期,tch:ls[0].tch,音檔:Object.assign({},...ls.map(L=>L.音檔||{})),分圖,段};
  S.lessons[id]=N;return N;
}
function getLesson(id){if(S.lessons[id]&&!S.lessons[id].isNode)return S.lessons[id];
  if(id&&id.startsWith("n-")){const b=S.lessons[id.slice(2)];return b?buildNode(b.科判焦點):null}return S.lessons[id]||null}
// 段的稱呼：整節時加上堂數
function segName(L,i){const s=L.段[i];return L.isNode?`第${s.堂}堂・第 ${s.ls+1} 段`:`第 ${i+1} 段`}
function lessonInfoTxt(L){return L.isNode?`${L.根}・整節・第${L.堂數}堂・${L.課本範圍.replace(" ~ ","～")}`:`${L.標題}・第${L.堂數}堂・${L.課本範圍.replace(" ~ ","～")}・${L.日期}`}
function parseHash(){const m=location.hash.match(/^#([a-z0-9-]+?)-s(\d+)$/);return m&&getLesson(m[1])?{id:m[1],seg:+m[2]-1}:null}
function fromHash(){const h=parseHash();if(!h)return;if(h.id!==S.lesson.id)loadLesson(h.id,h.seg);else if(h.seg!==S.seg)selectSeg(h.seg)}
function loadLesson(id,seg=0,yan=null){
  const L=getLesson(id);if(!L)return;
  S.lesson=L;S.seg=Math.min(L.段.length-1,Math.max(0,seg));S.yan=yan;S.range=null;
  $("#lessonInfo").textContent=lessonInfoTxt(L);
  document.title=`${L.標題}・師父講解科判`;
  renderMap();renderTree();renderDetail();renderOutline();
  requestAnimationFrame(()=>{const w=$("#treewrap");w.scrollLeft=w.scrollWidth;scrollToSeg(S.seg,false);updateMini()});
  try{history.replaceState(null,"","#"+L.id+"-s"+(S.seg+1))}catch(e){}
  store("kp.last",L.id);
}

// ───────── 啟動 ─────────
async function start(){
  bind();bindPlayer();bindSplit();bindMediaSession();
  try{
    const emb=document.getElementById("kpdata");
    if(emb){const D=JSON.parse(emb.textContent);S.kepan=D.kepan;S.index=D.index;S.lessons=D.lessons}
    else{
      const [kp,idx]=await Promise.all([fetch("data/kepan.json").then(r=>r.json()),fetch("data/index.json").then(r=>r.json())]);
      S.kepan=kp;S.index=idx;
      S.lessons={};for(const x of idx)S.lessons[x.id]=await fetch(`data/lessons/${x.id}.json`).then(r=>r.json());
    }
  }catch(e){$("#side").innerHTML=`<p>資料載入失敗：${esc(e.message)}。重新整理一次試試。</p>`;return}
  const hh=parseHash(),last=store("kp.last");
  S.lesson=getLesson(hh?hh.id:(last&&getLesson(last)?last:S.index.at(-1).id));
  const L=S.lesson;document.title=`${L.標題}・師父講解科判`;
  $("#lessonInfo").textContent=lessonInfoTxt(L);
  S.mapAll=store("kp.mapAll")==="1";S.kyOrig=store("kp.kyOrig")==="1";K.rate=+(store("kp.kyRate")||1)||1;
  const sx=store("kp.xw");if(sx!=null)S.xw=sx==="1";syncLayer();
  const m=hh;if(hh)S.seg=Math.min(L.段.length-1,Math.max(0,hh.seg));else S.seg=0;
  renderMap();renderTree();renderDetail();renderOutline();
  const firstScroll=()=>{const w=$("#treewrap");w.scrollLeft=w.scrollWidth;scrollToSeg(S.seg,false);updateMini()};
  requestAnimationFrame(firstScroll);setTimeout(firstScroll,250);setTimeout(firstScroll,800);
  try{document.fonts.ready.then(()=>setTimeout(firstScroll,50))}catch(e){}
  if(m&&isMobile()){setM("outline");setTimeout(()=>$("#oc"+S.seg)?.scrollIntoView({block:"start"}),120)}
  try{downloads=window.claude?.use?await window.claude.use("downloads"):null}catch(e){downloads=null}
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&!window.claude)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
start();
</script>
</body></html>
