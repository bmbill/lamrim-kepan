:"65b","st":484,"et":498,"消文":[{"文":"檢查一下：質對不對，這個質要到什麼程度、什麼內容的狀態。"}],"延伸":[{"題":"生此意樂之量","組":[{"題":"共下士道，重新溫習","說":[{"類":"回扣","文":"生命無常快速，一眨眼就死；生前的圓滿像夢一樣，財位、親眷、身體，一樣都帶不去。"},{"類":"因","文":"唯有業帶得去——為了生前貪一點小便宜，生生世世把我們綑死，所以要找歸依之處。"},{"類":"回扣","文":"歸依能解脫，原因是法；法的根本在業：總業果、別業果，最後懺悔，把以前的淨除、現在的防止。"},{"類":"立","文":"不再憂愁墮落，永遠保持暇滿人身，生生增上，最後達到圓滿佛地。"}]},{"題":"如實去做，產生功效","說":[{"類":"破","文":"說了一個道理不算；事實的內容不相應，說得多好聽，最後還是把你送下地獄。"},{"類":"立","文":"把道理如實去做，產生如實的功效，這才是生此意樂之量；生起以後還要令堅固。"}]},{"題":"下一世還是求下一世","說":[{"類":"破","文":"對現世放不下、看不破，所謂希求後世都是空話。"},{"類":"立","文":"共下士求的增上生是下一世；到了下一世，還是求下一世——到最後那個下一世，就是佛。"}]}],"說":[{"類":"回扣","文":"生命無常快速，一眨眼就死；生前的圓滿像夢一樣，財位、親眷、身體，一樣都帶不去。"},{"類":"因","文":"唯有業帶得去——為了生前貪一點小便宜，生生世世把我們綑死，所以要找歸依之處。"},{"類":"回扣","文":"歸依能解脫，原因是法；法的根本在業：總業果、別業果，最後懺悔，把以前的淨除、現在的防止。"},{"類":"立","文":"不再憂愁墮落，永遠保持暇滿人身，生生增上，最後達到圓滿佛地。"},{"類":"破","文":"說了一個道理不算；事實的內容不相應，說得多好聽，最後還是把你送下地獄。"},{"類":"立","文":"把道理如實去做，產生如實的功效，這才是生此意樂之量；生起以後還要令堅固。"},{"類":"破","文":"對現世放不下、看不破，所謂希求後世都是空話。"},{"類":"立","文":"共下士求的增上生是下一世；到了下一世，還是求下一世——到最後那個下一世，就是佛。"}],"複習":true,"af":"65b","st":1067}],"逐字稿":[{"t":"65B 08:04","b":[["q","第二生此意樂之量者。"],["s","這個檢查一下哦！質就是它對不對，那麼這個質要到什麼程度及內容的狀態："]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/001.mp3"},{"文":"謂先有無偽，希求現世，其求後世，«唯虛言辭»。","口譯":"就是說：如果先前心中有著不虛假的、真實的希求現世之心，那麼所謂的希求後世，只是空話而已。","四家合註":"謂先有無偽希求現世，其求後世唯虛言解。","合註白話":{"same":0},"覺燈日光":null,"時":"65B 08:18","頁":150,"af":"65b","st":498,"et":633,"消文":[{"文":"無偽：硬是不錯的，心裡面真的在求現世；在這種狀態當中，所求的後世就是空話。"},{"類":"回扣","文":"共下士真正的基礎就是求後世：臨終時現世是一堆灰，灰帶不去，惡業把你送到地獄。"},{"類":"下手","文":"不要說道理已經懂了；真懂的時候一看腦筋，「我現在忙的還是忙這個」，那不算。"}],"延伸":[{"題":"唯虛言辭","組":[{"題":"如理檢點，攀緣不起","說":[{"類":"立","文":"真正如理如法去檢點，那個攀緣心一點都找不到；攀的都是現在的事情。"},{"類":"例","文":"一跑到廚房看見好東西，覺得這是生生世世把我害得這樣苦的大冤家，排斥都來不及。"}]},{"題":"一點鹽巴，足足夠了","說":[{"類":"破","文":"還要講營養，這個不夠、那個不好，又要淡、又要鹹、又要甜。"},{"類":"立","文":"一點鹽巴千真萬確已經足足夠了；那一把骨頭都要燒掉。"},{"類":"下手","文":"與其忙這些事情，真正要忙的是忙在這裡；這個解決了，下面的自然解決。"}]}],"說":[{"類":"立","文":"真正如理如法去檢點，那個攀緣心一點都找不到；攀的都是現在的事情。"},{"類":"例","文":"一跑到廚房看見好東西，覺得這是生生世世把我害得這樣苦的大冤家，排斥都來不及。"},{"類":"破","文":"還要講營養，這個不夠、那個不好，又要淡、又要鹹、又要甜。"},{"類":"立","文":"一點鹽巴千真萬確已經足足夠了；那一把骨頭都要燒掉。"},{"類":"下手","文":"與其忙這些事情，真正要忙的是忙在這裡；這個解決了，下面的自然解決。"}],"af":"65b","st":569}],"逐字稿":[{"t":"65B 08:18","b":[["q","謂先有無偽，希求現世，其求後世，唯虛言辭。"],["s","我們檢查、檢查看，假定你現在心裡邊有「無偽」，什麼叫無偽？硬是不錯的。不錯，什麼不錯？「求現世」，你那心裡面求現世的。那麼在這種狀態當中，你所謂的求的後世就是空話。這個地方共下士哦，共下士告訴我們的真正的下士基礎什麼？就是求後世。為什麼要求後世？因為我們看得很清楚嘛！到臨終的時候，現世是什麼啊？現世是什麼啊？一堆灰！灰以外，惡業！灰是一點帶不去，然後呢，惡業是把你送到地獄裡面去。所以這現世是絕對不是我們需要的。你要檢查的話，很簡單，不要說道理已經懂了、已經懂了！你真的懂得道理的時候，你一看腦筋裡面覺得，喔唷，我現在忙的還是忙這個！對不起，那不算。"]]},{"t":"65B 09:29","b":[["s","所以你如果真正能夠如理如法去檢點的話，那個攀緣心是硬是一點找不到。你為什麼要攀？攀什麼？都是攀現在的這種事情。對外面既不攀，也裡邊、眼前也不攀。喔，你一跑到廚房裡，看見那個的好東西，你一看覺得這個大冤家，生生世世把我害得這樣苦啊！你排斥都來不及啊！這個就這麼清楚、就這麼明白。那還要講營養，這個又不夠，那個也不好，味道也不好；啊，又要吃淡的，又要吃鹹的，又要吃甜的！所以自然而然啊，不要說味精哪等等，醬油等等統統送掉了，一點鹽巴已經千真萬確已經足足夠了。沒有鹽巴，沒有鹽巴有什麼關係？那一把骨頭都要燒掉啦，這個是千真萬確的事實啊！所以現在才從這裡地方，注意，現在我們與其忙這些事情，應該真正忙的是忙在這裡。你把這個問題解決了，下面的自然解決了。所以，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/002.mp3"},{"文":"即換其位，","口譯":"若把兩者的位置對調，","四家合註":"即換其位，","合註白話":{"same":0},"覺燈日光":null,"時":"65B 10:33","頁":150,"af":"65b","st":633,"et":638,"消文":[{"文":"好極了！把它換一換。"}],"延伸":[],"逐字稿":[{"t":"65B 10:33","b":[["q","即換其位，"],["s","好極了！把它換一換。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/003.mp3"},{"文":"令成希求後世為主，現在為副，則為生起。","口譯":"變成以追求來世為主、這一世的事為次，這才算是真的生起了。","四家合註":"令成希求後世為主，現在為副，則為生起。","合註白話":{"same":0},"覺燈日光":null,"時":"65B 10:38","頁":150,"af":"65b","st":638,"et":703,"消文":[{"文":"求後世為主，現在為次要，那就生起來了。"},{"類":"立","文":"「現在」不是忽視，現在還要：修行要拿這個身體來修。"},{"類":"喻","文":"佛說飲食還是要的，像塗車的油；吃飽就好了。"},{"類":"因","文":"身體強弱，眼前營養只佔三分之一、四分之一，宿生的業力最主要；所以說喝水也會胖。"}],"延伸":[],"逐字稿":[{"t":"65B 10:38","b":[["q","令成希求後世為主，現在為副，則為生起。"],["s","嗯，要求後世 ─主，現在是次要的，那麼生起來了。「現在」不是忽視喔！現在還要。為什麼？你要修要拿什麼？要拿這個東西來修嘛，所以要的。所以佛告訴我們飲食還是要的，這像什麼？塗車的油，還是要的。所以他講的，你吃飽，吃飽就好了，就這樣。我們現在常常講營養，其實真正營養 ─心裡面，我告訴你們。前面已經說了太多、太多這種典型的例子了，所以假定你心裡真正提起來的話，都不是問題。尤其是我們現在了解的，你的所以真正的強弱等等的，這個眼前這個營養有沒有關係？有！三分之一，四分之一，宿生的業力最主要的。所以說吃水也是胖，千真萬確的事實。生起了以後還要什麼？"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/004.mp3"},{"文":"然須令堅固，","口譯":"然而還必須讓它堅固，","四家合註":"然須令堅固，","合註白話":{"same":0},"覺燈日光":null,"時":"65B 11:43","頁":150,"af":"65b","st":703,"et":706,"消文":[{"文":"生起來還要堅固。"}],"延伸":[],"逐字稿":[{"t":"65B 11:43","b":[["q","然須令堅固，"],["s","生起來還要堅固。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/005.mp3"},{"文":"故此生已，«仍須勵力善為修習»。","口譯":"所以生起之後，仍然要努力好好地修習。","四家合註":"故此生已，仍須勵力善為修習。","合註白話":{"same":0},"覺燈日光":null,"時":"65B 11:46","頁":150,"af":"65b","st":706,"et":1376,"消文":[{"文":"生起了還要努力，何況現在我們還沒有生起。"},{"文":"這是檢查我們的量。"}],"延伸":[{"題":"仍須勵力善為修習","組":[{"題":"半個大餅，中氣最足","說":[{"類":"例","文":"師父在美國，營養知識、環境都好，結果怎麼吃就怎麼瘦，怎麼弄也弄不好。"},{"類":"例","文":"到達隆撒拉，一杯白開水、半個大餅，中午半個饅頭，菜就一樣；十年來身體最好就是那段時候，中氣從來沒有那麼足過。"}]},{"題":"真正的健康是心力","說":[{"類":"立","文":"煩惱淨化以後，真正最好的健康是心力。"},{"類":"例","文":"母親發瞋心時分泌的奶，給老鼠吃會把老鼠弄死；一發瞋心，分泌的東西對人體有害。"},{"類":"立","文":"心裡一天到晚跟貪瞋癡相應，怎麼營養也弄不好；跟法相應了，不要太多營養。"},{"類":"例","文":"虛雲老和尚活一百二十歲，沒講過營養；老太太九十多歲，吃白飯豆腐乳，一百斤照挑不誤。"}]},{"題":"貪求現世，不是佛法","說":[{"類":"破","文":"千萬不要學了佛以後，腦筋裡還在這個上面；對貪求現世放不下，不是佛法。"},{"類":"下手","文":"處處提醒自己：慚愧呀，我現在還是不行，放不下；以這種心情努力深入，慢慢一天天就行了。"}]},{"題":"先認過患，自然放下","說":[{"類":"破","文":"不是叫我們馬上放下，這一點在知見上一定要認識。"},{"類":"下手","文":"前面告訴我們的方法都是訣竅：認識它的過患最重要，了解過患、努力思惟，將來很容易就放下。"}]}],"說":[{"類":"例","文":"師父在美國，營養知識、環境都好，結果怎麼吃就怎麼瘦，怎麼弄也弄不好。"},{"類":"例","文":"到達隆撒拉，一杯白開水、半個大餅，中午半個饅頭，菜就一樣；十年來身體最好就是那段時候，中氣從來沒有那麼足過。"},{"類":"立","文":"煩惱淨化以後，真正最好的健康是心力。"},{"類":"例","文":"母親發瞋心時分泌的奶，給老鼠吃會把老鼠弄死；一發瞋心，分泌的東西對人體有害。"},{"類":"立","文":"心裡一天到晚跟貪瞋癡相應，怎麼營養也弄不好；跟法相應了，不要太多營養。"},{"類":"例","文":"虛雲老和尚活一百二十歲，沒講過營養；老太太九十多歲，吃白飯豆腐乳，一百斤照挑不誤。"},{"類":"破","文":"千萬不要學了佛以後，腦筋裡還在這個上面；對貪求現世放不下，不是佛法。"},{"類":"下手","文":"處處提醒自己：慚愧呀，我現在還是不行，放不下；以這種心情努力深入，慢慢一天天就行了。"},{"類":"破","文":"不是叫我們馬上放下，這一點在知見上一定要認識。"},{"類":"下手","文":"前面告訴我們的方法都是訣竅：認識它的過患最重要，了解過患、努力思惟，將來很容易就放下。"}],"af":"65b","st":706}],"逐字稿":[{"t":"65B 11:46","b":[["q","故此生已，仍須勵力善為修習。"],["s","生起了還要努力，何況現在我們沒有生起。這個是檢查我們這個量的，檢查我們這個量的。下面呢？不再講下去，我說一個故事。這個故事說過一遍，今天再說一遍。這個我這個身體一直不好，這是你們也看見的。對呀，啊，那總是我宿生的惡業，這樣。那麼這一生加上種種的不調，所以毛病很多。那麼這幾年一直在美國，你們曉得，喔唷，這個美國的生活你們去過的人都知道的。尤其是剛去的時候，在美國佛教會，那個副會長就是聖洛克斯醫院的這個，這個老人重健部的部長。哎呀，他實在是 ……告訴我們很多這營養的知識，吃這個那麼多少卡洛里，吃那個多少卡洛里。然後呢我到了洛杉磯那個地方的話，那個環境又這麼個好。哎呀，所以那個現在比如說我們，像平常那些什麼，吃到或者是餅乾，或者巧克力，大家就好。那裡我們向來從來不願意吃這些東西的，就是這樣。就算你同樣那個起士，那總歸是最好的，結果我怎麼吃就怎麼瘦，怎麼弄也就弄不好。"]]},{"t":"65B 13:13","b":[["s","後來我到印度去，跑到那個達隆撒拉，它那邊吃些什麼呀？早晨起來一杯茶，結果它那個奶茶，我這個胃又不好，又不能吃，然後一個大餅，就這樣。那個大餅又太大，我只能吃半個，所以我平常經常一杯白開水半個大餅。中午吃什麼呢？饅頭，喔唷，他們饅頭可以吃好幾個，那種饅頭我只能吃半個。為什麼？它其他沒有東西了嘛！然後那個菜的話呢？今天白菜就是白菜，明天洋芋就是洋芋，後天茄子就是茄子。晚上飯，然後一點湯，湯裡面就是一點鹽嘛，這樣。那時我也是一樣，剛開始晚上不吃，後來說，唔，晚上要吃。那我這個東西吃不來，我把早晨給我那個大餅，早晨吃半個，晚上吃半個，就這樣。你說什麼營養啊？你們說說看，什麼營養啊？結果我十年來身體最好的就是那一段時候，非常清楚、非常明白，中氣從來沒有那麼足過。然後呢磅磅那個，磅磅那個體重居然增加，走路身輕力壯，那這個胃也不出毛病。哎！這是我親身經驗。"]]},{"t":"65B 14:29","b":[["s","所以你們諸位，千萬不要在那裡談哪！如果說剛開始，是、是！我絕不忽視，這我曉得的，我們凡夫就是這個樣。但是你知見千萬注意啊！你不要學了佛以後，腦筋裡還在這個上面，所以他前面告訴我們，現在我們要學正知見，你處處提醒自己：「哎呀，慚愧呀！我現在還是不行，所以放不下呀！」你要這種心情，你總是努力地深入，這樣的話你慢慢、慢慢、慢慢走，你自然而然一天、一天、一天天行了。當你心裡面真正的煩惱能夠把它淨化了以後，欸，這身體上面的，真正最好的健康是什麼？就是心力，將來你自然會了解的。"]]},{"t":"65B 15:16","b":[["s","其實這個事情，不要說佛法，科學上面，已經得到了很多證明。說一個母親，她如果說在發脾氣的時候，那個時候發了瞋心以後，她那個奶啊，奶裡邊分泌出來的東西，我想你們可能看見過這個科學報告，給那個小孩子吃，不一定把那個小孩子毒死，可是把那個東西養給老鼠或是什麼東西，把那個老鼠會弄死的。因為一發瞋心，這個分泌的東西就對我們人體有害。所以現在你心裡面一天到晚跟貪瞋癡相應的話，你怎麼個營養啊，弄了個半天也弄不好。你現在如果能夠跟法相應了以後，把那個東西拿掉的話，你不要它太多營養。"]]},{"t":"65B 16:02","b":[["s","所以為什麼佛世的時候，他這個樣，但是他精神來得個旺喔！你看看我們大陸上面，虛雲老和尚活一百廿歲，他可沒講過營養哦！不但是我，我自己，我母親，我母親今年八十七歲，還有我們洛杉磯的那一個大護法，他姓談，他母親今年九十多歲了，我看見她那一次那一年八十四歲不曉得八十五歲。她還告訴我，噢，我在家裡 ─她那個美國待不慣，她在家裡還要做。她說一百斤的東西，叫她挑起來，照挑不誤。我曾經有一次試試看，哎喲，我拿五十斤的東西都拿不動。你說她吃什麼？我就回去看她吃什麼？很簡單，就是大白飯，然後呢，豆腐乳，如此而已。你說這個什麼營養？所以你們千萬哪，修學佛法的人，這一點是特別要注意！假定你對貪求現世的放不下的話，對不起，不是佛法！"]]},{"t":"65B 17:14","b":[["s","不過，現在在這個地方我們要注意啊，不是說叫我們馬上放下，這一點特別在知見上面我們一定要認識。他前面所有告訴我們的方法，都是訣竅，怎麼樣認識它的過患，這最重要的。你了解了這過患，努力去思惟的話，將來你很容易地就放下來了。所以他這個地方真正精采地，告訴我們 ─正知見！錯誤的地方怎麼辦。"]]},{"t":"65B 17:47","b":[["s","現在請翻到《菩提道次第廣論》一百五十頁，這個關於這個業的方面，業的方面，我們不妨再重新溫習一下，重新溫習一下。說由於我們了解了這個生命無常、快速，然後呢一眨眼就死。死的時候，所有生前的圓滿，像夢一樣，像夢一樣，什麼都沒有。不管你外面多大的財位，不管多麼親密的周圍的父母、妻兒、子女，沒有一樣東西帶得去，沒有一個人能隨你、肯隨你，就是他想隨你也跟不去。乃至於你自己的身體，到那個時候，燒成灰，灰也帶不走，也不是你的。唯有一樣東西，是業！這個卻是為了生前貪一點小便宜，這個業就生生世世把我們綑死。那因為這樣的關係啊，所以我們想從這個地方脫離，而找到歸依之處。"]]},{"t":"65B 19:17","b":[["s","那麼找到了歸依之處，而進一步了解，哦，他歸依了所以能夠解脫問題的原因是法，如法行持。那麼法的根本在業，那麼現在業，所以我們了解業的真正的整個的內涵了解了，然後呢在這個內涵當中，我們要求的是些什麼。所以是第一個是總業果，第二個是別業果。那麼一步一步，所以我們下面了解。最後呢，了解了這個事情以後，那麼我們就說，該怎麼辦，該怎麼辦？所以最後懺悔，把以前的淨除，現在的防止。於是在這種狀態當中，你不再憂愁墮落，永遠保持暇滿人身，然後在這個基礎上面生生增上、生生增上。現在雖然苦苦惱惱，那已經不錯了，比現在更好的，當然我們不必怕呀！何況你這樣增上的最後結果達到圓滿的佛地，那麼這一個次第我們都已經了解了。"]]},{"t":"65B 20:37","b":[["s","但是這一個道理要達到什麼樣的情況才算呢？所以昨天把「生此意樂之量」說明白。這個道理雖然懂了這樣說，可是，是不是內涵跟它相應，你要如實地檢查一下。不是說，啊，說了一個道理就算哪！這個事實的內容如果不相應的話，前面一再告訴我們，不管你說得多麼好聽，不管你說得多麼好聽，到最後的結果，還是把你送下地獄，那還是毫無意思。所以在這一個地方，我們特別要了解一個事實。什麼呢？就是，不是一個道理，而是要把這個道理如實去做；遵照這個道理如實去做，產生如實地功效，那麼這個就是，說生此意樂之量。生起來了以後，還要令這個堅固，那個時候才行，那個時候才行。"]]},{"t":"65B 21:55","b":[["s","關於這個前面的事情，我們應該牢牢記在心裡面。目前我們真正要做的就是這個，所以共下士這個是最基本的。假定說你對於現世的這個一切，放不下、看不破的話，那所謂的希求後世，那都是空話，那都是空話！而這個共下士真正要的增上生，是求下一世，這個下一世有它特別意義哦，特別意義哦！從表面上看來下一世，你真的到了下一世，下一世還是求下一世，下一世還是求下一世哦！這個真正的意義在這裡。到最後那個下一世什麼呢？就是佛，這是我們應該了解的。可是這個殊勝，這一點深入的意義留到下面去講。那麼第三，最後一點，看文。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/006.mp3"},{"文":"第三除遣於此邪分別者。","口譯":"第三、破除對此（希求增上生）的錯誤分別。","四家合註":"<span>第三、除遣於此邪分別<\/span><span class=\"sjan sj-miao\">，<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">於圓滿因除遣邪執；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">於決定勝因除遣邪執。初中分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">敘宗；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">破之。初<\/span><span>者：<\/span>","合註白話":{"id":"20617","頁":571,"白話":"第三科、破除對此的顛倒思惟，分為二科：一、破除對於圓滿因的顛倒思惟；二、破除對於決定勝因的顛倒思惟。第一科分為二科：一、陳述其主張；二、破斥。第一科：由於經典提到內心必須厭惡一切輪迴的富樂圓滿，所以有人對此產生誤解，心想：圓滿的身體與受用的增上生都是輪迴，所以不應對此心生追求。","注釋":["第三除遣於此邪分別：即前頁40「除遣此中邪執」一科。","圓滿：此指受用富足、善緣齊俱、幸福安樂，非指事情是否究竟成辦之義。下文「一切圓滿」、「諸圓滿事」亦同。","敘宗：法尊法師於《廣論》中多譯作「說其所欲」、「出計」。","以佛經說：相應段落參見北涼曇無讖譯《大般涅槃經·聖行品》云：「說是偈已復作是言：『憍尸迦！世有大士，為眾生故不貪己身，為欲利益諸眾生故，而修種種無量苦行。如是之人，見生死中諸過咎故，設見珍寶滿此大地、諸山、大海，不生貪著，如視涕唾。如是大士，棄捨財寶、所愛妻子、頭目髓腦、手足支節、所居舍宅、象馬車乘、奴婢僮僕，亦不願求生於天上，唯求欲令一切眾生得受快樂。如我所解，如是大士清淨無染，眾結永盡，唯欲求於阿耨多羅三藐三菩提。』」見《大正藏》冊12，頁449；《甘珠爾》對勘本冊52，頁519。","錯誤事：產生誤解之處。"],"已校":true},"覺燈日光":null,"時":"65B 22:56","頁":150,"af":"65b","st":1376,"et":1387,"消文":[{"文":"說明了道理以外，有一類錯誤的，要把它排除掉。"}],"延伸":[],"逐字稿":[{"t":"65B 22:56","b":[["q","第三除遣於此邪分別者。"],["s","同樣地，說明了道理以外，有一類錯誤的，他要把它排除掉。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/007.mp3"},{"文":"謂有一類，以佛經說，悉應背棄生死所有一切圓滿，為錯誤事，作是念云，身受用等諸圓滿事，增上生者，皆是生死，發求此心不應道理。","口譯":"就是說，有一類人把佛經所說「應當背棄生死中所有一切圓滿」這句話理解錯了，心裡這樣想：身體、受用等種種圓滿的事，也就是增上生（人天善趣的果報），全都屬於生死，發心去求它是不合道理的。","四家合註":"謂有一類，以佛經說悉應背棄生死所有一切圓滿，為錯誤事。作是念云：身、受用等諸圓滿事增上生者，皆是生死，發求此心不應道理。","合註白話":{"same":6},"覺燈日光":null,"時":"65B 23:07","頁":150,"af":"65b","st":1387,"et":1485,"消文":[{"文":"佛經說生死中的一切圓滿都是虛假的，要曉得它的過患、背棄它；這一類人就說：眼前受用等增上生的事都是生死輪迴，要求這個不合理。"},{"類":"破","文":"聽起來「對啊，我們不要它」；實際上是不是這樣？不。"},{"類":"立","文":"對求聲聞乘來說是對的：聲聞乘的目的的的確確是急求解脫，根本不要別的。"},{"文":"但是這個地方有它特別的意義。"}],"延伸":[],"逐字稿":[{"t":"65B 23:07","b":[["q","謂有一類，以佛經說，悉應背棄生死所有一切圓滿，為錯誤事，作是念云，身受用等諸圓滿事，增上生者，皆是生死，發求此心不應道理。"],["s","那麼它錯在哪裡呢？說有一類的人士，他看見佛經上面告訴我們說，說生死當中的一切的圓滿哪，那都是虛假的，我們應該曉得它的過患，應該背棄它，應該背棄它。所以他就看見經上這麼說，所以他就說：「哎呀，既然經上這麼說，所以我們眼前的受用等等，這一種屬於增上生的事情，那個都是生死輪迴當中的事情，要求這個不合理，要求這個不合理。」對這個話我們聽起來：對啊！千真萬確，我們不要它呀！實際上是不是這樣呢？不，不！對於求聲聞乘來說，是！因為聲聞乘的目的，的的確確「急求解脫」，他全部的精神求解脫，根本不要別的，根本不要別的。但是現在這個地方，它有它特別意義，看下面："]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/008.mp3"},{"文":"然所求中略有二類，謂於現位，須應希求，及是究竟所應希求。生死之中身等圓滿，","口譯":"然而所要希求的，大略有兩類：一類是就現前而希求的，一類是為了究竟而應當希求的。生死之中身體等等的圓滿，","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、破之，分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">觀待增上生而破；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">觀待決定勝而破。初中分二：第一、須輾轉漸受身等圓滿之理者：<\/span>然所求中略有二類，謂於現位須應希求，及是究竟所應希求。生死之中身等圓滿，","合註白話":{"id":"20673","頁":573,"白話":"第二科、破斥，分為二科：一、觀待增上生而破斥；二、觀待決定勝而破斥。第一科分為二科：第一科、必須依序經歷圓滿的身體等的道理：所求的內容當中，有暫時需要追求，以及究竟追求的目標這二種。即使是追求解脫者，也需要暫時追求輪迴中的身體等圓滿，因為依序經歷這些所依身，最後才會獲得決定勝。第二科、觀待於究竟的增上生而破除：並非任何身體、受用與眷屬圓滿的增上生都歸屬於輪迴，因為身體等圓滿達到究竟極致，即是佛陀的色身與圓滿的淨土，以及佛的眷屬。基於這個用意，《經莊嚴論》中說：「受用圓滿與身體圓滿，眷屬圓滿與精進或事業圓滿，具備這四種圓滿，即是殊勝增上生的體性。」是說藉由前四種波羅蜜多成就增上生。而在很多典籍中則一再提到，藉由這些前四種波羅蜜多成就色身。因此修持一切相智的人，由於長時間修持眾多殊勝的戒律、布施、忍辱等因，所以也是追求成辦這些因的果報——最極殊勝的身體等增上生。","注釋":["現前：指現階段。法尊法師原譯作「現法」，今據藏文改譯。","《莊嚴經論》於此密意說云：《莊嚴經論》，唯識部論典，全名《大乘經莊嚴論》，又名《莊嚴經論》、《大乘莊嚴經論》，共1卷，21品，至尊慈氏著。漢譯本有唐波羅頗蜜多羅譯《大乘莊嚴經論》的根本頌，共24品。本論主要闡述唯識宗無外境之義，事物皆是依靠心而安立、存在，且承許依他起、圓成實是諦實，遍計所執是無諦實，所以是唯識宗根本教典之一。引文唐波羅頗蜜多羅譯《大乘莊嚴經論》作：「資生身眷屬，發起初四成。」見《大正藏》冊31，頁627；《丹珠爾》對勘本冊70，頁850。","又多教典說：如《寶鬘論》、《入中論》等皆有提到。相應段落參見陳真諦三藏譯《寶行王正論‧菩提資糧品》云：「諸佛有色身，皆從福行起。」法尊法師譯《入中論》云：「如是施等三種法，善逝多為在家說，彼等亦即福資糧，復是諸佛色身因。」見《入中論善顯密意疏》，頁73；《大正藏》冊32，頁498；《丹珠爾》對勘本冊96，頁307；冊60，頁518。","增上生：法尊法師原譯作「勝生」，今據藏文改譯。"],"已校":true},"覺燈日光":null,"時":"65B 24:45","頁":150,"af":"65b","st":1485,"et":1580,"消文":[{"文":"所要求的增上生分兩類：一類為了現世的快樂；一類為了究竟的利益。"},{"文":"為了究竟，要利用這個身體，而且要最好、圓滿具足種種德相的身。"},{"類":"破","文":"為現生求快樂，五乘共法統統排斥；一有這個概念，跟佛法完全不相應。"},{"類":"立","文":"後者才是修學佛法的人需要的。"}],"延伸":[],"逐字稿":[{"t":"65B 24:45","b":[["q","然所求中略有二類，謂於現位，須應希求，及是究竟所應希求。生死之中身等圓滿，"],["s","說我們真正要求的這個增上生哪，一共分兩部分、兩類：有一類呢就是求現生，為了現世的快樂；還有一種呢，為了要求究竟的利益。那麼那個時候，我們也要利用這個身體，不但要這個身體，前面告訴我們，你為了要達到最圓滿的修道進程所用的身體，平常一個還不行，一定要最好、圓滿具足種種德相的身。這一個身是增上生，這是為了究意意義而要求的，分成功這個兩類。這個前者，對於現生要想求快樂，那個是的的確確，不管哪一個，五乘共法當中，統統排斥的，一有這個概念，跟佛法就不相應，完全不相應。至於後者呢，這就是我們修學佛法的人需要的，所以下面說，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/009.mp3"},{"文":"希解脫者，於現法中，亦須希求，","口譯":"希求解脫的人在現前也必須希求，","四家合註":"希解脫者，於現前中亦須希求，","合註白話":{"same":8},"覺燈日光":null,"時":"65B 26:20","頁":150,"af":"65b","st":1580,"et":1595,"消文":[{"文":"真正求解脫的人，對增上生也要的。"}],"延伸":[],"逐字稿":[{"t":"65B 26:20","b":[["q","希解脫者，於現法中，亦須希求，"],["s","這一個真正求解脫的人哪，對於這個增上生也要的。為什麼呀？"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/010.mp3"},{"文":"以由輾轉漸受此身，後邊乃得決定勝故。","口譯":"因為要依靠輾轉、逐漸地受得這樣的身，最後才能得到決定勝。","四家合註":"以由輾轉漸受此身，後邊乃得決定勝故。","合註白話":{"same":8},"覺燈日光":null,"時":"65B 26:35","頁":150,"af":"65b","st":1595,"et":1626,"消文":[{"文":"必定要憑藉這個圓滿的暇滿人身，而且要具足種種最圓滿德相，作為修行的工具，才達到究竟圓滿的決定勝。"}],"延伸":[],"逐字稿":[{"t":"65B 26:35","b":[["q","以由展轉漸受此身，後邊乃得決定勝故。"],["s","說你必定要憑藉了這個圓滿的暇滿人身，不但得到人身哦，單單這個人身還不具足，要具足種種最圓滿德相的這一個人身。根據這個作為修行的工具，然後才達到究竟圓滿的「決定勝」，這樣。所以說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/011.mp3"},{"文":"非凡所有身及受用，眷屬圓滿，增上生事，一切皆是生死所攝。","口譯":"並不是所有的好身體、好享受、好眷屬這些人天的福報，全都屬於生死輪迴的範圍。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、觀待究竟增上生而破者：<\/span>非凡所有身及受用、眷屬圓滿增上生事，一切皆是生死所攝，","合註白話":{"same":8},"覺燈日光":null,"時":"65B 27:06","頁":150,"af":"65b","st":1626,"et":1712,"消文":[{"文":"目前它是在生死輪迴當中，但要跳出生死輪迴，還要藉這個生死中的暇滿之身去修習。"},{"類":"例","文":"飲食受用處處呵斥不好，但修行還必要藉它：講究眼前的不需要，吃飽了讓你修行的卻是需要的。"},{"類":"立","文":"眼前如此，整個生命亦復如是；懂了這個道理，邪正分別得清清楚楚。"},{"類":"破","文":"要不然到哪裡都含含糊糊，不知不覺之間錯誤夾雜的東西都夾進去了。"}],"延伸":[],"逐字稿":[{"t":"65B 27:06","b":[["q","非凡所有身及受用，眷屬圓滿，增上生事，一切皆是生死所攝。"],["s","說，不是說所有的這些事情啊，都是生死輪迴當中。是，目前它是在生死輪迴當中，但是你要跳出生死輪迴，還要藉這個在生死輪迴當中的暇滿之身，去修習以後。這一部分這是我們要的，這我們要認得非常清楚、非常明白。以我們眼前來說，我們處處地方，這個飲食、受用，種種地方的呵斥不好；欸，但是它有個好處，什麼好處啊？修行還必要藉它，就是這樣。所以講究這個眼前這個，我們不需要；可是吃飽了以後讓你修行的這個，卻是我們需要的。眼前是如此，整個的生命亦復如是，我們要懂得這個道理，那麼在這個裡邊，你能夠邪正分別得清清楚楚。要不然，我們到哪裡都是含含糊糊，哎呀，好像是這樣，好像是那樣，不知不覺之間，那個錯誤夾雜的東西都夾進去了！那麼繼續下去。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/012.mp3"},{"文":"以其身等圓滿究竟，即佛色身，圓滿佛土，佛眷屬故。","口譯":"因為身體等等圓滿到了極點，就是佛的色身、圓滿的佛國淨土、佛的眷屬。","四家合註":"以其身等圓滿究竟，即佛色身、圓滿佛土、佛眷屬故。","合註白話":{"same":8},"覺燈日光":null,"時":"65B 28:32","頁":150,"af":"65b","st":1712,"et":null,"消文":[{"文":"增上生達到最究竟圓滿，就是圓滿的報身、圓滿的佛土、圓滿的眷屬。"},{"類":"破","文":"所求的不是眼前的；可是覺得既然要、就講究眼前，又完全錯了，細微的道理要分別清楚。"},{"類":"下手","文":"理路上分別清楚以後，在自己的概念上時時檢查、檢點，這是眼前修行第一步重要的事。"},{"類":"立","文":"在自己的內心、概念上查清楚不大容易，但這是真正修學的中心。"}],"延伸":[],"逐字稿":[{"t":"65B 28:32","b":[["q","以其身等圓滿究竟，即佛色身，圓滿佛土，佛眷屬故。"],["s","因為最後邊際的這個增上生，達到最究竟圓滿的時候，以及你周圍所有圓滿的一切的事情是什麼呢？就是你圓滿的報身，就是你圓滿的佛土，以及你圓滿的眷屬，就是這樣。所以它所求的不是眼前的，但是反過來說，你覺得既然要，然後你講究眼前，那你又完全錯了，這個裡邊的細微的道理，我們一定要分別得很清楚。理路上面分別清楚了以後，然後呢，在自己的概念上面要時時檢查、檢點，這個是我們眼前修行第一步重要的事情。"]]},{"t":"66A 00:13","b":[["s","要想在自己的內心、概念上面查清楚，這一點不大容易，但是這個卻是真正我們修學的中心，真正修學的中心。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/013.mp3"},{"文":"故《莊嚴經論》於此密意說云：「增上生謂受用身，圓滿眷屬勤圓滿。」","口譯":"所以《莊嚴經論》就是依這個用意說：「人天的福報，是指圓滿的享受、身體、眷屬和精進。」","四家合註":"故《莊嚴經論》於此密意說云：「<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">殊勝<\/span>增上生<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">體性，<\/span>謂受用<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">圓滿<\/span><span>及<\/span>身圓滿<span class=\"sjan sj-ba\">，<\/span>眷屬<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">圓滿及<\/span>勤<span class=\"sjan sj-ba\">、<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">事業<\/span>圓滿<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">具足四種圓滿<\/span>。」","合註白話":{"same":8},"覺燈日光":null,"時":"66A 00:26","頁":150,"af":"66a","st":26,"et":61,"消文":[{"文":"什麼是增上生？自己的受用、身、眷屬求得圓滿；為了這個要好好努力勤修，使它達到最究竟圓滿。"}],"延伸":[],"逐字稿":[{"t":"66A 00:26","b":[["q","故《莊嚴經論》於此密意說云：「增上生謂受用身，圓滿眷屬勤圓滿。」"],["s","所以這經個論上面告訴我們，經論上面它真實的意思就是說：什麼是增上生哪？那就是這個 ─你自己的受用的身，以及眷屬這些事情求得圓滿。為了這個，所以你要好好地努力去勤修，使它達到最究竟圓滿的地步。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/014.mp3"},{"文":"此說由前四度，成辦增上生。","口譯":"這是說，靠著前面四種波羅蜜（布施、持戒、忍辱、精進），成就人天的好果報。","四家合註":"此說由前四度成辦增上生。","合註白話":{"same":8},"覺燈日光":null,"時":"66A 01:01","頁":150,"af":"66a","st":61,"et":73,"消文":[{"文":"六度當中，前面的布施、持戒、忍辱，就是為了這個。"}],"延伸":[],"逐字稿":[{"t":"66A 01:01","b":[["q","此說由前四度，成辦增上生。"],["s","所以六度當中，前面這個布施、持戒、忍辱，就是為了這個。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/015.mp3"},{"文":"又多教典，說由此等成色身故。","口譯":"而且有很多經論說，靠著這些可以成就佛的色身。","四家合註":"又多教典<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">數數<\/span>說由此等<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">前四度<\/span>成色身故。","合註白話":{"same":8},"覺燈日光":null,"時":"66A 01:13","頁":150,"af":"66a","st":73,"et":83,"消文":[{"文":"這裡不細講，很多經論上都說得很清楚。"}],"延伸":[],"逐字稿":[{"t":"66A 01:13","b":[["q","又多教典，說由此等成色身故。"],["s","他不細講，但是說很多經論上面都說得很清楚。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/016.mp3"},{"文":"是故修種智者，經極長時，修諸極多，諸極殊勝，戒施忍等，亦是希求彼等妙果，最極殊勝身等勝生。","口譯":"所以修一切種智的人，經過極長的時間，修持極多、極殊勝的戒、施、忍等，也正是為了希求它們的妙果——最極殊勝的身等增上生。","四家合註":"是故修種智者，經極長時<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">間<\/span>，修諸極多、諸極殊勝<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">因──<\/span>戒、施、忍等，亦是希求<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">成辦<\/span>彼等<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">因<\/span><span>之<\/span>妙果，最極殊勝身等增上生。","合註白話":{"same":8},"覺燈日光":null,"時":"66A 01:23","頁":150,"af":"66a","st":83,"et":142,"消文":[{"文":"佛經過三大阿僧祇劫，實際上無量無邊阿僧祇劫，不是隨業在轉，是認真修布施、持戒、忍辱。"},{"類":"立","文":"為的是求殊勝之身，這才是增上生真正的意義；到究竟圓滿時，增上生與決定勝兩者就是一個。"}],"延伸":[],"逐字稿":[{"t":"66A 01:23","b":[["q","是故修種智者，經極長時，修諸極多，諸極殊勝，戒施忍等，亦是希求彼等妙果，最極殊勝身等勝生。"],["s","喏，所以說修佛種智，就是佛經過非常長的，通常我們說三大阿僧祇劫，實際上，實際上是無量無邊的阿僧祇劫，並不是在這個長時候當中隨著業在轉，是認真地修行。修什麼？布施、持戒、忍辱等。為什麼？就求這個殊勝之身，殊勝之身，這個才是它真正增上生的意義。那麼由於這個，然後呢達到究竟決定勝，當他究竟圓滿的時候，兩者就是一個。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/017.mp3"},{"文":"成辦究竟決定勝者，謂如《入行論》云：「由依人身舟，度脫大苦海。」是須依止，以人所表善趣之身，度諸有海，趣妙種智。此復須經多生，故能辦此身勝因尸羅，是道之根本。","口譯":"至於成辦究竟決定勝，就像《入行論》說：「依靠人身這條船，度脫生死大苦海。」就是必須依靠以人身為代表的善趣之身，度過三有大海，趣向一切種智。而這又需要經歷許多生，所以能成辦這種殊勝之身的因——尸羅（戒），就是道的根本。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、觀待決定勝而破者：<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">非唯如是，由於此因<\/span>成辦<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">二種<\/span>究竟決定勝者，謂如《入行論》云：「由依人身舟，度脫大苦海。」是須依止以人所表善趣之身，度諸有海<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">而解脫<\/span>，趣妙種智<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">一切智位<\/span>。此<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">果位<\/span>復<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">非於一增上依身所能成辦，<\/span>須經多生<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">依身而成辦<\/span>，<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">具相修道依身之因，須當守護圓滿戒律之理者：<\/span>故能辦此<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">增上生<\/span>身勝因<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如云：「增上生因除戒定非餘」，故<\/span>尸羅，是道之根本。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">設作是念：若爾，成辦解脫及一切智之依身，僅是善趣依身即可耶？答云：未可也。以<\/span>","合註白話":{"id":"20740","頁":575,"白話":"第二科、觀待於決定勝而破除：不僅如此，藉由此因成就二種究竟的決定勝，如同《入行論》中所說：「依靠人身之船，能夠超脫痛苦的大海。」必須依靠人所代表的善趣所依身渡越三有大海而解脫，並且邁向一切相智、一切智的果位，而這個果位又無法在一次增上生的所依身中完成，所以需要經歷很多生的所依身來修持。必須守護圓滿的戒律——條件俱全的修道所依身之因的道理：因此構成此增上生身的殊勝因，如同有言：「除了戒律以外，沒有其他增上生之因」——戒律，即是道之根本。如果心想：那麼只要是善趣的所依身，就可以作為成就解脫與一切智的所依嗎？答道：並非如此，雖然是善趣之身，由於條件不俱全，僅具有少部分的功德，因此縱然修道也會進程緩慢，所以需要一個圓滿的所依身。而要成辦這個，僅僅守護沙彌等不圓滿的學處是無法達成的，因此必須致力於守護比丘學處等圓滿的學處。","注釋":["《入行論》云：引文如石法師譯《入菩薩行‧精進品》作：「依此人身筏，當渡大苦海。」見《入菩薩行》，頁62；《丹珠爾》對勘本冊61，頁993。","如云：引文出自《入中論》。法尊法師譯《入中論》作：「增上生及決定勝，其因除戒定無餘。」見《入中論善顯密意疏》，頁58；《丹珠爾》對勘本冊60，頁516。","僅具一少分德：法尊法師原譯作「僅能成就一少分德」，今據藏文改譯。","求寂：指沙彌。見前頁182註5。"],"已校":true},"覺燈日光":null,"時":"66A 02:22","頁":150,"af":"66a","st":142,"et":327,"消文":[{"類":"喻","文":"暇滿人身像船一樣，是使我們超脫生死輪迴的寶貝、工具；船是渡脫生死苦海的寶筏。"},{"文":"要依止善趣人身超脫三有之海，達到一切種智，要經過很長時候。"},{"類":"立","文":"以前講尸羅好像就是戒；現在了解戒真正的綱要、綱骨就是業的道理，由於是業，所以必定要持戒。"}],"延伸":[],"逐字稿":[{"t":"66A 02:22","b":[["q","成辦究竟決定勝者，謂如《入行論》云：「由依人身舟，度脫大苦海。」是須依止，以人所表善趣之身，度諸有海，趣妙種智。此復須經多生，故能辦此身勝因尸羅，是道之根本。"],["s","引論上面，我們一定要「依人身舟」，這個暇滿人身就像船一樣，這個人身是使我們超脫生死輪迴的寶貝、工具，船是讓我們渡脫這個生死苦海的寶筏，就是這樣，這個比喻所指的內容。所以需要依止一個身體，這個人，善趣人身當中超脫三有之海，達到一切種智的地位。這個要經過很長時候，很長時候。那麼為了達到這個種種的因緣，前面說過，而這個根本是什麼？尸羅，所以這個是道的根本。以前我們講「尸羅」好像就是戒，現在了解了這個戒的真正的綱要、綱骨，就是業的道理，業的道理；由於是業，所以你必定要持戒。"]]},{"t":"66A 04:09","b":[["s","那麼這個是關於共下士部分，前面已經簡單地說明。最後有幾句話，這個幾句話對我們非常重要的，非常重要的。因為前面我們說是下士，說共下士，說現在所講的雖然是下士，但是呢卻是你為了達到最上圓滿的基礎，這是跟那些人共同的。跟那些人共同的基礎，對這些條件不夠的人來說，叫作共下士，共同他的；對於條件夠的人，這是他走上去必須要的基礎。所以在這一點上面，他說明了下面這兩句話，現在我們看看他說明的是什麼呀？就是你要達到最圓滿的、究竟的、圓滿的位嗎？喏！這樣的條件，這是我們需要的。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/018.mp3"},{"文":"若善趣身而不圓滿一切德相，僅能成就一少分德，雖修諸道進程微少。故«定須一最圓滿者»，此中護求寂等未圓學處，猶非滿足，故須勵力，護比丘等圓滿學處。","口譯":"如果善趣之身沒有圓滿一切德相，只能成就一小部分的功德，即使修習各種道，進展也很微少。所以一定需要一個最圓滿的身。這當中，守護求寂（沙彌）等尚未圓滿的學處，仍然不夠，所以必須努力守護比丘等圓滿的學處。","四家合註":"若善趣身而不圓滿一切德相，僅具一少分德，雖修諸道，進程微少，故定須一最圓滿者。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">成辦<\/span>此中<span class=\"sjan sj-ba\">，<\/span>護求寂等未圓學處，猶非滿足，故須勵力護比丘等圓滿學處。","合註白話":{"same":17},"覺燈日光":null,"時":"66A 05:27","頁":151,"af":"66a","st":327,"et":570,"消文":[{"類":"回扣","文":"共下士：條件不夠的人叫共下士，對條件夠的人，這是走上去必須要的基礎；最後這幾句話非常重要。"},{"文":"德相，就是前面思惟別業果時特別教我們認識的那一點。"},{"文":"不圓滿，得到的只是一部分；用這個不圓滿的工具修道，進步很少很少，要成無上菩提不可能。"}],"延伸":[{"題":"定須一最圓滿者","組":[{"題":"工具不全，事做不成","說":[{"類":"喻","文":"釘一個釘子，不用鐵鎚，拿手一點辦法都沒有。"},{"類":"喻","文":"用腳走路，走來走去最多在台灣，離開台灣一步都沒辦法。"},{"類":"立","文":"眼前任何事情，沒有完整的工具就做不好；何況要求無上佛道，要滿無邊功德，一定要最圓滿德相的工具——暇滿人身。"}]},{"題":"求寂未圓，護比丘等","說":[{"類":"立","文":"出家作沙彌，比凡夫好得多，但還不圓滿；要努力保護比丘「等」。"},{"類":"立","文":"比丘還不圓滿，是基礎；上面還要菩薩戒，乃至密宗戒。"}]},{"題":"外身內心，兩種圓滿","說":[{"類":"回扣","文":"前面具力業門大家記得不記得？"},{"類":"立","文":"外面最圓滿的是這個身，裡邊意樂最圓滿的是菩提心；以兩個無上圓滿的因辦佛果，輕而易舉。"}]}],"說":[{"類":"喻","文":"釘一個釘子，不用鐵鎚，拿手一點辦法都沒有。"},{"類":"喻","文":"用腳走路，走來走去最多在台灣，離開台灣一步都沒辦法。"},{"類":"立","文":"眼前任何事情，沒有完整的工具就做不好；何況要求無上佛道，要滿無邊功德，一定要最圓滿德相的工具——暇滿人身。"},{"類":"立","文":"出家作沙彌，比凡夫好得多，但還不圓滿；要努力保護比丘「等」。"},{"類":"立","文":"比丘還不圓滿，是基礎；上面還要菩薩戒，乃至密宗戒。"},{"類":"回扣","文":"前面具力業門大家記得不記得？"},{"類":"立","文":"外面最圓滿的是這個身，裡邊意樂最圓滿的是菩提心；以兩個無上圓滿的因辦佛果，輕而易舉。"}],"af":"66a","st":414}],"逐字稿":[{"t":"66A 05:27","b":[["q","若善趣身而不圓滿一切德相，僅能成就一少分德，雖修諸道進程微少。故定須一最圓滿者，此中護求寂等未圓學處，猶非滿足，故須勵力，護苾芻等圓滿學處。"],["s","說雖然你得到了善趣，這個是特別指人身，暇滿的人身，但是如果這個人身，「而不圓滿一切德相」，這個德相在前面思惟「別」，這個關於這個業果那一部分，教我們特別認識的那一點，就是講這個。如果你不圓滿，那麼你所得到的只是一部分。因為得到一部分，所以你用這個不圓滿的東西，那個時候去修道的話，他進步很少很少、很少很少。現在你要想求的這樣的圓滿無上菩提，根據這樣的一個差的工具，不可能、不可能，所以一定需要一個圓滿的。"]]},{"t":"66A 06:54","b":[["s","這個道理我們現在眼前樣樣事情都可以了解它，樣樣都了解它。你隨便做一件小事情，那沒關係。你不要說別的，現在你要想釘一個釘子，對不起，釘一個釘子，你就拿那個釘子，拿你的手，你一點辦法都沒有，釘不進去，對不對？這個很清楚。那麼簡單的一個釘子，你如果不用鐵鎚的話，對不起，你就是釘不進去。然後呢，譬如說你要到別的地方去的時候，你說用腳走路；對不起，腳走路，就算你走得到，你走來走去的話，也最多只能走在這個台灣，離開台灣一步，是一點辦法都沒有，這個不是很簡單嗎？沒有一件事情例外的，我們現在做眼前的任何事情，你沒有完整的工具，就做不好這件事情。何況他現在所要求的是什麼？無上佛道，這一點我們必定要知道的。那麼為了要求無上佛道，他一定要滿無邊的功德；要滿無邊的功德，一定要最圓滿的德相的工具，這個就是我們暇滿的人身。"]]},{"t":"66A 08:15","b":[["s","所以他下面說「此中護求寂等未圓學處」，還沒滿足哦，就算是你出家作個沙彌，哦，這個沙彌已經是比起凡夫好得多很多，欸，不圓滿。真正要努力的，努力要保護這個比丘「等」！為什麼講等啊？比丘還不圓滿喔，不過呢這個是基礎，在這個上頭還要什麼？還要菩薩，然後乃至於密宗戒。在前面具力業門當中，大家記得不記得？大家記得不記得？所以對我們外面來說，最圓滿的是這個身；對我們的裡邊意樂來說，最圓滿的是菩提心。現在你外面有一個最圓滿的這個比丘的相，裡邊是有最圓滿的大菩提意樂，在這種狀態當中，以兩個無上圓滿的因，那你要想辦那個佛果的話，那就容易了，輕而易舉，輕而易舉！這是我們要了解的。他下面："]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/019.mp3"},{"文":"有作是說，護持尸羅，若是為辦諸善趣者，則近事等亦能獲得，何須艱難，義利微少，諸比丘等。","口譯":"有人這樣說：護持戒律如果是為了成辦善趣，那麼近事（受五戒的居士）等也能獲得，何必受持那麼艱難、利益又少的比丘等戒呢？","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">說其所許；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">破之。今初：<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如是說已，<\/span>有作是說：「護持<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">別解脫之<\/span>尸羅，若是為辦諸善趣者，則近住等亦能獲得，何須艱難、義利微少諸比丘等？」","合註白話":{"id":"20805","頁":577,"白話":"第二科分為二科：一、陳述其主張；二、破斥。第一科：針對上述，有人提出：「如果守護別解脫的戒律是為了修成善趣，即使八戒居士也能獲得這個成果，何必藉助於困難而且利益微小的比丘等？」其他人則說：「如果別解脫的目的就是為了阿羅漢果，那麼未滿二十歲以前都不能成為比丘，然而五戒居士的所依身也能獲得阿羅漢果，所以應該推崇這種所依身，何必藉助於困難而利益微小的比丘？」第二科：應當要曉得，這種說法是不理解教法關鍵的極大謬論！因為前一種主張認為所有的守護戒律都只是為了修成善趣，這是不理解別解脫律儀需要有出離心的謬論；而後者的主張認為別解脫律儀只是為了成就阿羅漢果，這也不合理，因為大乘行者守護別解脫律儀，是為了獲得究竟的佛果，而這如前所述，必須依靠不斷地經歷圓滿殊勝善趣功德的所依身才能獲得，因此必須修持這個所依身的因——圓滿的戒律，不能只有局部。應當以居士等低階的律儀為基礎，而受持比丘等高階的律儀，精進守護圓滿的學處。在與下士共通的道次第中修心已宣說完畢。","注釋":["第二：即前頁558「於決定勝因除遣邪執」一科。","近住：八種具足別解脫戒者之一。承許於一晝夜中守護八條戒律的在家居士，即是近住。由於守護此八條戒，能夠趨近阿羅漢果位而住，故名近住。法尊法師原譯作「近住」，福智之聲出版社2003、2010年版《廣論》改作「近事」，今改回原譯。","別解脫所為：指受持別解脫戒的目的。法尊法師原譯作「別解脫所有要義」，今據藏文改譯。","然比丘者未滿二十則不堪受：佛世目犍連尊者度十七童子出家受比丘戒，他們因為遵從佛制午後不食，飢餓所苦，於是身體羸瘦，啼泣不止。釋尊聽到童子啼聲，了解事情發生始末，於是規定以後未滿二十歲，不能忍受飢渴等苦，不應度之受比丘戒。","近事：法尊法師原譯作「近事」，福智之聲出版社2003、2010年版《廣論》改作「近住」，今改回原譯。","委重：藏文意為精勤。"],"已校":true},"覺燈日光":null,"時":"66A 09:30","頁":151,"af":"66a","st":570,"et":669,"消文":[{"文":"持戒持得好可以不墮落、得人天身，乃至往生，不需要出家；八關齋戒、五戒都可以。"},{"文":"五戒跟比丘戒，難易天差地遠；這麼難做，得到的利益這麼少，何必呢。"},{"類":"立","文":"為了得到善趣，的確不需要；為了求生淨土也不需要，關起門來念佛就算了。"}],"延伸":[],"逐字稿":[{"t":"66A 09:30","b":[["q","有作是說，護持尸羅，若是為辦諸善趣者，則近住等亦能獲得，何須艱難，義利微少，諸苾芻等。"],["s","有人說：你持戒持得好的話，他可以不墮落，可以得到人天身呀！乃至於我們現在說：喔唷，往生啊！對不起，這不需要出家。為什麼？近住也能獲得。「近住」是什麼？就是八關齋戒，八關齋戒。實際上說的那一點，乃至於五戒都可以。那個五戒跟比丘戒，啊！這個難易差得天差地遠。既然五戒、八關齋戒可以做到，你何必持這個比丘戒？這麼艱難，難極了！結果得到的呢，一樣得到這麼一個小小的。所以這麼難地做，而得到的利益是這麼少，你何必呢！不需要。"]]},{"t":"66A 10:43","b":[["s","是，為了得到善趣的確不需要，乃至於你為了要求生淨土也不需要。你老實不客氣關起門來，自己在那兒吃飽了飯，「阿彌陀佛、阿彌陀佛 ……。」就念念就算了。現在這個時候要到世界上面賺一口飯吃吃，那太簡單啦！你何必出家啊！那麼進一步要什麼呢？有人說：啊！對、對、對，不單單是要人天哪！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/020.mp3"},{"文":"又餘眾云，若別解脫所有要義，是為獲得阿羅漢故。","口譯":"又有其他人說：別解脫戒的主要意義，是為了獲得阿羅漢果。","四家合註":"又餘眾云：「若別解脫所為，是為獲得阿羅漢故，","合註白話":{"same":19},"覺燈日光":null,"時":"66A 11:09","頁":151,"af":"66a","st":669,"et":689,"消文":[{"文":"這比較高明了：要求解脫，解脫果是阿羅漢；阿羅漢了不起，是真正人天的福田。"}],"延伸":[],"逐字稿":[{"t":"66A 11:09","b":[["q","又餘眾云，若別解脫所有要義，是為獲得阿羅漢故。"],["s","喏，他現在就比較高明了，說：「不是、不是，要獲得求解脫，解脫果是求阿羅漢。」阿羅漢是了不起，喔，那是真正我們人天的福田喔！嘿嘿，但是你看，他說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/021.mp3"},{"文":"然比丘者，未滿二十，則不堪受。近住之身，亦有能得阿羅漢者，應讚其身。難行少義，比丘何為。","口譯":"然而比丘戒未滿二十歲就不能受；近住（受八關齋戒者）之身也有能證得阿羅漢的，那就應該讚歎這種身才對。比丘戒難行而利益少，受它做什麼？","四家合註":"然比丘者，未滿二十，則不堪受，近事之身，亦有能得阿羅漢者，應讚其身。難行少義比丘何為？」","合註白話":{"same":19},"覺燈日光":null,"時":"66A 11:29","頁":151,"af":"66a","st":689,"et":770,"消文":[{"文":"比丘有很多條件，年不到二十不能受。"},{"文":"師父當年唸的本子是「近事之身」，自己說：據我了解證阿羅漢要八關齋戒，淫一定要斷，不曉得是文字誤還是了解不足；現行課本作「近住之身」。"},{"文":"比丘終生奉行二百多條，比丘尼更多；八關齋戒只要八條加過午不食，一天一夜，何必多此一舉。"}],"延伸":[],"逐字稿":[{"t":"66A 11:29","b":[["q","然苾芻者，未滿二十，則不堪受。近事之身，亦有能得阿羅漢者，應讚其身。難行少義，苾芻何為。"],["s","這個比丘啊，要曉得他很多條件啊，乃至於年不到二十是不能受。「近事」就是居士之身。這一點我就不敢肯定了，據我所了解的話，就是說獲得阿羅漢還要八關齋戒；換句話說他那個，這個淫一定要斷。不曉得這個是文字上的誤，還是我自己的了解不足。不管怎麼樣啦，不管是五戒也好，八關齋戒也好，的的確確是可以證得阿羅漢果的。那你同樣地，何必要這麼難行的比丘呢？啊！這個比丘是比起這個八關齋戒不曉得難多少，比丘是終生奉行，一行要二百多條，比丘尼是更多！然後呢，它這個東西只要八條，加上一個過午不食，然後呢奉行只要一天一夜，就能得到了，你何必多此一舉呢！這是千真萬確的。所以他說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/022.mp3"},{"文":"應當知此","口譯":"應當知道，這種說法","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二者：<\/span>應當知此","合註白話":{"same":19},"覺燈日光":null,"時":"66A 12:50","頁":151,"af":"66a","st":770,"et":775,"消文":[{"文":"下面是我們正確應該了解的。"}],"延伸":[],"逐字稿":[{"t":"66A 12:50","b":[["q","應當知此"],["s","這是下面我們正確應該的，這種說法"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/023.mp3"},{"文":"是全未知聖教扼要，極大亂言。","口譯":"是完全不懂聖教的扼要，是極大的胡言亂語。","四家合註":"是全未知聖教扼要，極大亂言。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">以前宗許一切持戒唯為成辦善趣故，是不知別解脫戒須有出離心之亂言。後宗許別解脫戒唯為阿羅漢果，亦復非理，以大乘者守護別解脫戒，是為證得究竟佛位故。此即如前所說，須依無間相續殊勝善趣圓滿功德依身，方能獲得，故當成辦其因圓滿戒律而非一分，<\/span>","合註白話":{"same":19},"覺燈日光":null,"時":"66A 12:55","頁":151,"af":"66a","st":775,"et":789,"消文":[{"文":"誤解了，不了解佛告訴我們真正的意趣。"}],"延伸":[],"逐字稿":[{"t":"66A 12:55","b":[["q","是全未知聖教扼要，極大亂言。"],["s","他誤解了，並不了解佛告訴我們的真正的意趣。那麼真正的意趣何在呢？"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/024.mp3"},{"文":"«應以下下律儀為依»，受上上者，«委重護持圓滿學處»。已說於共下士道次，淨修心訖。","口譯":"應該以較基礎的戒律為根基，再受更高的戒，鄭重地守護，把該學的都學圓滿。和下士共通的修心次第，到這裡講完了。","四家合註":"應以<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">近事等<\/span>下下律儀為依，受<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">比丘等<\/span>上上者，委重護持圓滿學處。","合註白話":{"same":19},"覺燈日光":null,"時":"66A 13:09","頁":151,"af":"66a","st":789,"et":1666,"消文":[{"文":"以最基本的律儀作基礎，真正要達到的目的是最究竟圓滿的；為了最究竟無上圓滿，要從最下面建立最穩固的基礎。"},{"文":"要認真保護、維持這個基礎，就是比丘的學處；三界當中只有這個最殊勝。"}],"延伸":[{"題":"應以下下律儀為依","組":[{"題":"摩天大廈，要打地基","說":[{"類":"喻","文":"造狗窩不要基礎，兩塊木板一釘就行；茅篷地稍微平平就可以；摩天大廈下面基礎不做，造得起來嗎？"}]},{"題":"出家不是貪便宜","說":[{"類":"破","文":"不要以為出了家就是貪一點便宜，乃至說出了家要念佛；老年人或有特別條件是的，真正出家的因要了解在這裡。"}]},{"題":"具力業門，所依殊勝","說":[{"類":"回扣","文":"一百三十三頁具力業門：兩個發了菩提心的人，在家人以三千大千世界最美滿的東西供養三寶，出家人只點一支小蠟燭，出家人的功德大。"},{"類":"因","文":"為什麼？他所依的就是這個。"}]}],"說":[{"類":"喻","文":"造狗窩不要基礎，兩塊木板一釘就行；茅篷地稍微平平就可以；摩天大廈下面基礎不做，造得起來嗎？"},{"類":"破","文":"不要以為出了家就是貪一點便宜，乃至說出了家要念佛；老年人或有特別條件是的，真正出家的因要了解在這裡。"},{"類":"回扣","文":"一百三十三頁具力業門：兩個發了菩提心的人，在家人以三千大千世界最美滿的東西供養三寶，出家人只點一支小蠟燭，出家人的功德大。"},{"類":"因","文":"為什麼？他所依的就是這個。"}],"af":"66a","st":843},{"題":"委重護持圓滿學處","組":[{"題":"出家因緣，殊勝難得","說":[{"類":"破","文":"很多人說修行就好了，何必出家——完全錯誤。"},{"類":"立","文":"沒有殊勝因緣，連出家的名字都聽不見、看不見，何況有機會披這件衣服。"}]},{"題":"一日一夜，七返天上","說":[{"類":"例","文":"《出家功德經》：鞞羅羨那只剩七天壽命，先玩六天，第七天出家，第二天就死了。"},{"類":"例","文":"生四天王天，一路上到他化自在天，再從四天王天上去，七返；天上的福報無法想像，最後到人間遇佛出家，證羅漢果。"},{"類":"破","文":"阿難以為他以前善根很多；佛說：你千萬不要起大邪見，就是這一天一夜出家的功德。"}]},{"題":"隨喜出家，功德無盡","說":[{"類":"立","文":"隨喜人家出家，比三千大千世界的供養還好：供養有盡，出家的功德無限。"}]},{"題":"清淨幢相，不可染污","說":[{"類":"立","文":"出家代表十方一切諸佛的清淨幢相；一披這件衣服，儘管是凡夫，把清淨幢相把握住了，一天一夜就這麼大的功德。"},{"類":"喻","文":"國旗布做綢做、髒的好的都代表國家；這裡代表的是十方諸佛的清淨幢相，做到了功德大，染污了就害了。"},{"類":"立","文":"就算作得不好下了地獄，受盡苦難、還了債，最後遇到佛還是證果；出家功德就這麼殊勝。"}]},{"題":"種下出家種子","說":[{"類":"下手","文":"現在沒有因緣，心裡也要想：我一定要出家，一定要讚歎出家，種下出家種子。"},{"類":"下手","文":"出了家，眼前短短幾十年太值得了，好好做，身心都歡喜。"}]},{"題":"外相內涵，菩提為因","說":[{"類":"立","文":"「護比丘等」的等字：不僅是這個相，還有跟相相應的內容——菩提心。"},{"類":"因","文":"這個相代表十方諸佛的清淨幢相，佛以菩提心為因，圓滿菩提果。"},{"類":"回扣","文":"共下士道到這裡為止；懺悔，以及眼前所做所忙的一切，真正究竟的目的在這裡。"}]}],"說":[{"類":"破","文":"很多人說修行就好了，何必出家——完全錯誤。"},{"類":"立","文":"沒有殊勝因緣，連出家的名字都聽不見、看不見，何況有機會披這件衣服。"},{"類":"例","文":"《出家功德經》：鞞羅羨那只剩七天壽命，先玩六天，第七天出家，第二天就死了。"},{"類":"例","文":"生四天王天，一路上到他化自在天，再從四天王天上去，七返；天上的福報無法想像，最後到人間遇佛出家，證羅漢果。"},{"類":"破","文":"阿難以為他以前善根很多；佛說：你千萬不要起大邪見，就是這一天一夜出家的功德。"},{"類":"立","文":"隨喜人家出家，比三千大千世界的供養還好：供養有盡，出家的功德無限。"},{"類":"立","文":"出家代表十方一切諸佛的清淨幢相；一披這件衣服，儘管是凡夫，把清淨幢相把握住了，一天一夜就這麼大的功德。"},{"類":"喻","文":"國旗布做綢做、髒的好的都代表國家；這裡代表的是十方諸佛的清淨幢相，做到了功德大，染污了就害了。"},{"類":"立","文":"就算作得不好下了地獄，受盡苦難、還了債，最後遇到佛還是證果；出家功德就這麼殊勝。"},{"類":"下手","文":"現在沒有因緣，心裡也要想：我一定要出家，一定要讚歎出家，種下出家種子。"},{"類":"下手","文":"出了家，眼前短短幾十年太值得了，好好做，身心都歡喜。"},{"類":"立","文":"「護比丘等」的等字：不僅是這個相，還有跟相相應的內容——菩提心。"},{"類":"因","文":"這個相代表十方諸佛的清淨幢相，佛以菩提心為因，圓滿菩提果。"},{"類":"回扣","文":"共下士道到這裡為止；懺悔，以及眼前所做所忙的一切，真正究竟的目的在這裡。"}],"af":"66a","st":962}],"逐字稿":[{"t":"66A 13:09","b":[["q","應以下下律儀為依，受上上者，委重護持圓滿學處。已說於共下士道次，淨修心訖。"],["s","哦，說拿我們最基本的這個律儀，作為我們的基礎，然後呢我們真正要達到的目的是最究竟圓滿的。所以我們為了這個最究竟無上圓滿的，所以要建最穩固的基礎，從最下面建立起來。所以這個情況之下，要這麼認真保護、維持這一個基礎，這個基礎就是我們的比丘的學處。這個在三界當中，只有這個最殊勝，只有這個殊勝，這是我們要了解的。"]]},{"t":"66A 14:03","b":[["s","其實這個道理這麼簡單，現在你要造一個房子，你要造一個什麼房子啊？你說，我造個狗窩，那根本不要基礎，要什麼基礎呀！你隨便弄兩塊木板一釘就行了！啊，我要造一個普通的茅篷，那地稍微平平就可以了；你要造一個鋼筋水泥的房子那就要了；現在你要造一個摩天大廈，對不起，你這個下面的基礎不做，你造得起來嗎？有這樣的嗎？所以我們這個地方這麼清楚、這麼明白。所以現在大家千萬不要說：「唉呀，出家呀 ……」好像出了家就是貪一點便宜，那完全錯了，完全錯了！乃至於說：「唉呀，現在我出了家，我要念佛啊！」是，老年人是的，或者有他特別條件。真正的出家的因，我們要了解在這個地方。"]]},{"t":"66A 14:56","b":[["s","大家記得不記得前面在一百三十三頁上面，講業的時候，「具力業門」，大家還記得不記得？同樣地兩個發了菩提心的人，一個是在家人，一個是出家人，出家當然指圓滿的比丘。那個在家人發菩提心，這菩提心的意義不得了，他把三千大千世界作為容量，所有的這麼多的最美滿的東西去供養佛、供養三寶，這個功德之大是不得了地大！結果一個出家人，就跑得去點一個小小的蠟燭，欸，這個功德，就出家這個人的功德要來得大，不能為比。為什麼？他所依的就是這個！這是我們應該真正了解的，在這裡、在前面、在後面，他一再地說明這一點，一再說明這一點。"]]},{"t":"66A 16:02","b":[["s","所以平常我們的的確確不了解出家的真實的意義，這個東西是非常糟糕，非常糟糕，也可以說非常可惜，非常可惜！出家哪那麼簡單？你不是有殊勝因緣，連它名字都聽不見，也看不見，何況你有機會去被這件衣服啊！所以現在很多人說，總覺得：唉呀，修行就好了，你何必出家！這完全錯誤，完全錯誤，完全錯誤，完全錯誤！"]]},{"t":"66A 16:36","b":[["s","這個佛經裡邊有這麼一個《出家功德經》，這個我在這地方，有好幾個《出家功德經》，我只是講這裡邊的一個，講這麼一個。有一個人他叫鞞羅羨那，這個名字，這個梵文啊，西藏話，我都唸不準，那沒關係啦！嗯，他也是個貴族，所謂長者子。那麼平常跟阿難很好，阿難經常也到他家裡去乞食，總是跑過去，總是去。有一天佛就告訴阿難：「阿難哪！你這個好朋友某人哪，他還有七天的壽命就要死了。」這樣。那麼阿難聽了，喔唷，很著急，他那個好朋友就要死了，那怎麼辦哪？「死了以後怎麼辦哪？」「那很難說，就看他怎麼辦。如果像現在這樣的話，他要墮落的，現在呢你可以救他。」啊！阿難聽見了佛講的，跑得去，跑到那家人的家裡去。"]]},{"t":"66A 17:45","b":[["s","平常因為他們都是貴族子弟，看見阿難是非常歡喜，然後呢就供養他。那一天阿難到了家裡，他也非常歡喜迎接，阿難就是愁眉苦臉，一言不發跑得去在那裡。欸，他就說：「阿難哪，我今天很高興看見你，你怎麼愁眉苦臉，你有什麼心事啊？」阿難還是不開口，連問他幾次都不開口。他心裡面覺得奇怪：「什麼，我做了什麼不對啊？什麼傷害了你，得罪了你啦？」阿難愁眉苦臉說：「這倒是沒有，不是為了我，是為了你！」「為了我？為了我為什麼這樣啊？」說：「佛告訴我，說你的壽命還只有七天啦！」啊！他一聽這個話，啊！人就癱掉了。他們都曉得，佛講的話，那絕對是百分之一百二十地可靠，「虛空可以變餘相，佛不說非諦實語」，他們都曉得這個。"]]},{"t":"66A 18:48","b":[["s","啊！那聽了這個話，怎麼辦啊？求那個阿難。阿難說：「你求我是沒辦法。佛告訴我，你死了以後這個要墮落的，唯一的辦法你出家。」「對啊！好、好、好。那既然還有七天，那這樣吧！我實在捨不得，讓我痛痛快快地再玩上六天，然後再出家。」要我們想起來真可笑，欸，但是真有這種人。但是這個人也真可愛喔，因為他曉得佛講的話就這麼確實，好、好、好。然後他就在六天當中盡情享受，到了第七天，那反正是明天就要死了，啊，就出家，就這麼出家。那時候因為佛在世，心裡邊也猛。你想假定是我們想到明天要死了，你出了家，你還肯忙別的嗎？當然什麼事情都不要了。那個時候大概他還沒有聽見那個淨土法門，如果聽見淨土法門，他一定往生了。不過他只是說：「好、好！現在就出了家了，照著規矩就這麼來。」第二天就死了。"]]},{"t":"66A 19:56","b":[["s","死了以後，那麼阿難就問佛陀了，說：「現在他到哪裡去了？」「他現在到四天王天去了。」佛就說這個功德：「然後呢四天王天死了以後到忉利天，忉利天死了以後到夜摩天，夜摩天死了以後到兜率天，然後再上去叫化樂天，再他化自在天。」我們曉得我們人間一般不是定福，定福是不動業，這個最高只能生到欲界天。他就這麼一天一夜的持戒功德，然後呢這麼樣。壽命多長呢？這我們就曉得的，這個四天王天的壽命是人間九百萬年。然後九百萬年死了以後到哪裡去？欸，再升上去啊！升到忉利天，忉利天的壽命是人間三千六百萬年。忉利天完了以後再上去，是夜摩天是人間一億四千四百萬年，這樣地上去。然後呢，到了這個第六天，完了以後怎麼辦？再下來，哪裡去？四天王天，再來，七返、七趟。"]]},{"t":"66A 21:05","b":[["s","經過這麼長的時候，那個天上的福報是我們無法想像的。你不要說他化自在天，就最起碼的到這個天，一到人間把最好的東西給你吃，你就覺得像吃大糞一樣，避得遠遠地受不了，這樣啊！你要什麼就什麼，哪有像我們現在，現在你再好，對不起，再好的東西，就算你有電扇，電扇吹了，等一下要風濕；冷氣要風濕，暖氣到那時候出去還不行。就算什麼都沒了，大小便沒人替代你，沒有一樣東西有這個。欸，他那個天上這樣，沒有一樣東西有這種事情的，也沒病，這樣。"]]},{"t":"66A 21:47","b":[["s","完了以後，七返完了以後，最後下來了，又跑到人間。那時候跑到人間，有一個佛出世。完了以後，他也是人天當中也是最富貴，到中年以後，覺得：唉呀，沒有意思。他出家這個另外這個因緣成熟了，然後呢跑得去見佛，再去出家，證羅漢果。阿難聽了：「啊，這麼好啊！佛陀啊！他大概以前還有很多善根吧！」佛陀說：「錯了，你完全錯了，你根本不了解，真正的出家的根本意義。他這樣大的福報，就這麼一天一夜的出家功德，你千萬不要起大邪見，就這麼一天一夜的出家的功德。但是他之這一生所以能夠出家，這個倒是的的確確地以前有功德。如果以前沒有殊勝因緣，對不起，他絕不可能。」出家的功德這麼大！"]]},{"t":"66A 22:44","b":[["s","所以諸位要了解，我們千萬不要說：「唉呀，平常都一樣的。」絕不一樣、絕不一樣！經上又告訴我們，如果人家出家，你贊成他，然後你幫助他，乃至於什麼都 ……，你隨喜，這個功德就不得了！經上有種種的比喻，你看看：「哎呀，這個出家人！」你無比地隨喜，比你供養什麼都好，比你供養什麼都好，乃至於三千大千世界這個東西去供養，比不上隨喜人家出家。為什麼？你那個供養是有盡的，這個出家的功德是無限的。眼前儘管他是先證得小乘果，但是究竟一定會走上這條路。這個有限的東西，跟無限永遠沒辦法比的，永遠沒辦法比的，這我們要了解，所以這個才是它真正的特質。反過來說，因為出家有它這樣無比殊勝的功德。出家所代表的，為什麼有這樣它的功德呢？因為它所代表的是十方一切諸佛的清淨幢相，你一被這件衣服的話，你那個時候所代表的這個意義就是這樣。所以你只要認認真真地、戰戰兢兢，儘管你是個凡夫，你只要把那個清淨幢相把握住了，一天一夜就這麼大的功德。"]]},{"t":"66A 24:04","b":[["s","這個道理說起來也簡單，我們世間什麼地方都可以做個比喻。譬如說我們現在做一個國旗，那個國旗大家看見了代表這個國家，人人看見了這是以國家這樣地尊敬它。這個國旗做的布沒什麼關係，綢做的也是，布做的也是，髒的、好的、壞的也是，你只要做成功這個國旗，這代表的意義這樣。他現在代表的不是國旗，十方一切諸佛的清淨幢相這個標幟喔，你想想看！所以你如果做到了，有這麼大的功德，染污了，對不起那就害了，那就害了。"]]},{"t":"66A 24:44","b":[["s","所以這是我特別強調，一再鼓勵大家出家。但是萬一你們出了家，不能好好地做的話，我始終也建議你們趕快回家去，下地獄是非常划不來、非常划不來。不！你就算下了地獄，欸，妙了！這個出家功德之美啊，真是無法想像的！等到你穿了這身衣服，如果作得不好下了地獄，他也是一樣的，一層一層地來，一層一層地來，受盡了苦難，然後呢到畜生當中，完了還了一個債，最後遇到佛，你也還是證果，出家功德就是這麼地殊勝。不同的呢，就是你如果說好好地持，短短的幾十年的辛苦，乃至於一天一夜的辛苦的話，你就得到這麼大的好，好完了以後最後證果。如果你不好好地，貪一點小便宜的話，下去！受無量無邊的苦，苦完了以後上來，他還是解脫，這個出家功德有這麼大，這是我們要了解的，這樣。"]]},{"t":"66A 25:56","b":[["s","所以我們想到這個地方的話，就算你現在沒有因緣，心裡想：「啊！我一定要出家，一定要讚歎出家！」一定心裡面要種下這個出家種子。如果出了家以後，千萬記得：這個眼前短短的幾十年，那太值得了，實在太值得啦！而且你好好地做的話，它有殊勝的種種的特別的感應，心裡歡喜，身心都歡喜，這個是我們要了解的。他下面後面一再強調。"]]},{"t":"66A 26:30","b":[["s","不過這個地方最後又說一句，要「護苾芻等圓滿學處」，這個「等」字告訴我們，不僅僅是這個相，還有跟「相」相應的內在的內容，這個內容是什麼？這個內容是什麼？菩提心，這個是菩提心。為什麼說這個是它的內容呢？因為它這個相所代表的 ─十方一切諸佛的清淨幢相。那麼佛是什麼？佛是以菩提心為因，圓滿了菩提果，這個是他的內涵，這個才是我們真正要了解的。這一點我在這地方再特別跟大家說一下，共下士道到這地方為止。所以現在我們講那個關於懺悔一切等等，以及眼前我們所有做的、忙的這些，真正究竟的目的在這裡，這個我們務必要了解的。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/025.mp3"}],"投影片":[{"img":"投影片/shenxin-yeguo-23/001.webp","n":1},{"img":"投影片/shenxin-yeguo-23/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/shenxin-yeguo-23/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/shenxin-yeguo-23/004.webp","n":4},{"img":"投影片/shenxin-yeguo-23/005.webp","n":5},{"img":"投影片/shenxin-yeguo-23/006.webp","n":6,"photo":[0.624375,0.2872311898512686,0.342,0.5005376202974628]},{"img":"投影片/shenxin-yeguo-23/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=65b&st1=484&et1=706","box":[0.124875,0.3591111111111111,0.12525,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-23/008.webp","n":8},{"img":"投影片/shenxin-yeguo-23/009.webp","n":9,"photo":[0.624375,0.28756714785651794,0.342,0.49986570428696414]},{"img":"投影片/shenxin-yeguo-23/010.webp","n":10,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=65b&st1=706&et1=916","box":[0.521125,0.3124444444444444,0.10775000000000001,0.05511111111111111]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/shenxin-yeguo-23/011.webp","n":11},{"img":"投影片/shenxin-yeguo-23/012.webp","n":12,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=65b&st1=916&et1=1067","box":[0.123625,0.3591111111111111,0.1265,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-23/013.webp","n":13},{"img":"投影片/shenxin-yeguo-23/014.webp","n":14,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=65b&st1=1067&et1=1376","box":[0.521125,0.3124444444444444,0.10775000000000001,0.05511111111111111]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img
