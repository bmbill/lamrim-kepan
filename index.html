<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#B3352B"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="步步依師"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>步步依師・廣論師父講解科判</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：地圖（廣論科判）｜道路＋前導車（直排師父科判）｜細看（消文・延伸・逐字稿）。宣紙、墨、朱砂、泥金。 */
:root{
  --paper:#F1EEE6; --panel:#E8E3D7; --raised:#F8F6F0; --ink:#26231E; --ink-2:#5D574C; --ink-3:#8E877A;
  --line:#6F685C; --rule:#D6CFBF; --zhu:#B3352B; --zhu-wash:rgba(179,53,43,.09); --gold:#92700F;
  --t-li:#2E6A88; --t-po:#AE3A2E; --t-yin:#7A58A3; --t-yu:#2E7A52; --t-xia:#B4701A; --t-hui:#777064;--t-rev:#6F7F8C;
  --f-kai:"LXGW WenKai TC","DFKai-SB","BiauKai","Kaiti TC",serif;
  --f-ui:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --shadow:0 6px 24px rgba(40,30,10,.12);
  --sj-ba:#950d43; --sj-miao:#00639e; --sj-yu:#007f3c; --sj-jha:#8a5a00;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1B1A17; --panel:#232119; --raised:#2A2820; --ink:#E9E3D4; --ink-2:#BAB2A1; --ink-3:#878070;
  --line:#958D7E; --rule:#3B382F; --zhu:#E1715F; --zhu-wash:rgba(225,113,95,.14); --gold:#D3AA4F;
  --t-li:#6FA8C6; --t-po:#E07A6C; --t-yin:#AC90D6; --t-yu:#6DBA8E; --t-xia:#E0A456; --t-hui:#A39C8E;--t-rev:#9AAAB6;
  --shadow:0 6px 24px rgba(0,0,0,.4); --sj-ba:#e3829f; --sj-miao:#6fb3e6; --sj-yu:#5fc48d; --sj-jha:#d9a75a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B1A17; --panel:#232119; --raised:#2A2820; --ink:#E9E3D4; --ink-2:#BAB2A1; --ink-3:#878070;
  --line:#958D7E; --rule:#3B382F; --zhu:#E1715F; --zhu-wash:rgba(225,113,95,.14); --gold:#D3AA4F;
  --t-li:#6FA8C6; --t-po:#E07A6C; --t-yin:#AC90D6; --t-yu:#6DBA8E; --t-xia:#E0A456; --t-hui:#A39C8E;--t-rev:#9AAAB6;
  --shadow:0 6px 24px rgba(0,0,0,.4); --sj-ba:#e3829f; --sj-miao:#6fb3e6; --sj-yu:#5fc48d; --sj-jha:#d9a75a; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.6;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--zhu);outline-offset:2px}
.app>*{min-width:0}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 頁首 */
header{display:flex;align-items:center;gap:14px;padding-block:10px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-kai);font-weight:700;font-size:22px;margin:0;letter-spacing:.08em;white-space:nowrap}
.brand h1 small{font-family:var(--f-ui);font-weight:400;font-size:11px;letter-spacing:.04em;color:var(--zhu);margin-left:8px;vertical-align:2px}
.brand .lesson{color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:1 1 320px;max-width:560px;margin-left:auto}
.search input{width:100%;box-sizing:border-box;padding:8px 12px 8px 34px;border:1px solid var(--rule);border-radius:8px;background:var(--raised)}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-3);fill:none}
.results{position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;max-height:min(70vh,560px);overflow:auto;background:var(--raised);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:6px}
.results .grp{font-size:11px;letter-spacing:.12em;color:var(--ink-3);padding:8px 10px 4px}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px}
.results button:hover,.results button.act{background:var(--zhu-wash)}
.results .meta{font-size:12px;color:var(--ink-3)}
.results mark{background:none;color:var(--zhu);font-weight:700}
.results .empty{padding:12px;color:var(--ink-2)}
.tools{display:flex;gap:6px;align-items:center}
.chip{border:1px solid var(--rule);background:var(--raised);border-radius:999px;padding:4px 11px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.zhu[aria-pressed="true"]{background:var(--zhu);border-color:var(--zhu);color:#fff}

/* 三欄 */
.main{--mapw:270px;--detw:380px;display:grid;grid-template-columns:var(--mapw) 9px minmax(0,1fr) 9px var(--detw);min-height:0;gap:0}
.gut{position:relative;cursor:col-resize;touch-action:none;z-index:4}
.gut::before{content:"";position:absolute;top:0;bottom:0;left:4px;width:1px;background:var(--rule)}
.gut::after{content:"";position:absolute;top:50%;left:2px;width:5px;height:36px;transform:translateY(-50%);border-radius:3px;background:var(--rule);opacity:0;transition:opacity .15s}
.gut:hover::before,.gut.on::before{background:var(--zhu);width:2px;left:3.5px}
.gut:hover::after,.gut.on::after{opacity:1;background:var(--zhu)}
body.resizing{cursor:col-resize;user-select:none}
body.resizing iframe,body.resizing svg{pointer-events:none}
.pane{min-height:0;overflow:auto}
.map{position:relative;padding:12px 8px 24px 0;min-width:0}
.detail{min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.center{display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0}

/* 地圖 */
.map h2,.side h2{font-size:11px;letter-spacing:.18em;color:var(--ink-3);font-weight:500;margin:4px 0 8px}
.kp ul{list-style:none;margin:0 0 0 5px;padding-left:3px;border-left:1px dotted var(--rule)}
.kp>ul{padding-left:0;border:0}
.kp li{margin:1px 0}
.kp{width:max-content;min-width:100%}
.kp .row{white-space:nowrap;display:flex;align-items:flex-start;gap:4px;padding:2px 4px;border-radius:5px;font-size:13px;line-height:1.45;color:var(--ink-3)}
.kp .row .tw{flex:none;width:22px;height:22px;margin:-2px 0 -2px -4px;border:0;border-radius:5px;background:none;padding:0;color:var(--ink-2);font-size:12px;line-height:22px;cursor:pointer}
.kp .row .tw:hover{background:var(--zhu-wash);color:var(--zhu)}
.kp .row:not(.has):has(button.tw){cursor:pointer}
.kp .row:not(.has):has(button.tw):hover{background:var(--zhu-wash)}
.kcnt{cursor:pointer}
.kcnt:hover{background:var(--zhu);color:#fff}
.kp .row .c{flex:none;font-family:var(--f-kai);color:var(--ink-3)}
.kp .row .t{font-family:var(--f-kai);font-size:14px}
.kp .row.path .t{color:var(--ink)}
.kp .row.has{color:var(--ink);cursor:pointer}
.kp .row.has .t{color:var(--zhu);font-weight:700}
.kp .row.has::after{content:"";flex:none;width:7px;height:7px;margin-top:6px;border-radius:50%;background:var(--zhu)}
.kp .row.has:hover,.kp .row.cur{background:var(--zhu-wash)}
.kp .row.flash{animation:flash 1.2s}
@keyframes flash{0%,40%{background:var(--zhu-wash);box-shadow:0 0 0 2px var(--zhu)}100%{box-shadow:none}}
.maphd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.maphd h2{margin:0}
.maphd .seg button{padding:1px 8px;font-size:12px}
.kp.mine{width:auto}
.kp.mine .row{white-space:normal}
.kp.mine ul{margin:0;padding:0;border:0}
.kp.mine .row{padding-left:calc(var(--d,0) * 9px + 4px)}
.kp.mine .row{padding-left:calc(var(--d,0) * 10px + 2px)}
.kpcrumb{font-size:11.5px;line-height:1.55;color:var(--ink-3);font-family:var(--f-kai);margin:0 2px 6px;padding-bottom:6px;border-bottom:1px dashed var(--rule)}
.kcnt{flex:none;margin-left:6px;font-family:var(--f-ui);font-size:11px;color:var(--zhu);border:1px solid var(--zhu-wash);background:var(--zhu-wash);border-radius:999px;padding:0 7px;line-height:18px;align-self:center}
.kp .lpills{display:flex;flex-wrap:wrap;gap:4px}
.kp .lcnt{flex:none;margin-left:6px;font-family:var(--f-ui);font-size:11px;color:var(--ink-3);border:1px solid var(--rule);border-radius:999px;padding:0 7px;line-height:18px;align-self:center}
.kp .row.has{cursor:pointer}
.kp .lpill{border:1px solid var(--rule);background:var(--raised);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kp .lpill:hover{border-color:var(--zhu);color:var(--zhu)}
.kp .lpill.cur{background:var(--zhu);border-color:var(--zhu);color:#fff}
.kp .lpill.whole{font-weight:700;color:var(--zhu);border-color:var(--zhu)}
.kp .lpill.whole.cur{color:#fff}
.kp .lpill.cross{border-style:dashed;color:var(--ink-3)}
.kp .lrange{font-family:var(--f-kai);font-size:14px;font-weight:700;color:var(--ink)}
.kp .lessons{margin:3px 0 8px;padding-left:min(calc(var(--d,0) * 10px + 20px),56px);display:flex;flex-direction:column;gap:5px}
.kp .lcard{border:1px solid var(--rule);background:var(--raised);border-radius:8px;padding:5px 9px;display:flex;flex-direction:column;gap:2px}
.kp .lcard.cur{border-color:var(--zhu);box-shadow:0 0 0 2px var(--zhu-wash)}
.kp .lcard button{border:0;background:none;padding:0;text-align:left;font-family:var(--f-kai);font-size:14px;color:var(--ink);font-weight:700;white-space:normal;line-height:1.45;font-variant-numeric:tabular-nums}
.kp .lcard .lplay{font-size:11.5px;line-height:1.5;color:var(--zhu);text-decoration:none;white-space:normal;font-variant-numeric:tabular-nums}
.kp .lcard .lplay:hover{text-decoration:underline}
.map .note{font-size:12px;color:var(--ink-3);margin:14px 4px 0;line-height:1.6}

/* 主圖 */
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.bar .lbl{font-size:12px;color:var(--ink-3);margin-right:2px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--raised)}
.seg button{border:0;background:none;padding:3px 10px;font-size:13px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tagbtn{border:0;border-radius:5px;padding:2px 8px;font-size:12px;color:#fff;opacity:.9}
.tagbtn[aria-pressed="false"]{background:transparent!important;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--rule);background:var(--raised);border-radius:7px;padding:3px 9px;font-size:13px}
.primary{border:0;background:var(--zhu);color:#fff;border-radius:7px;padding:5px 12px;font-size:13px;font-weight:500}
.treewrap{overflow:auto;min-height:0;position:relative;background:var(--paper);cursor:grab;touch-action:pan-x pan-y}
.treewrap.dragging{cursor:grabbing;user-select:none}
.treewrap.dragging #tree .n{cursor:grabbing}
#tree{display:block}
#tree .hit{fill:transparent;rx:6}
#tree .n{cursor:pointer}
#tree .n:hover .hit{fill:var(--zhu-wash)}
#tree .n.sel>.hit{fill:var(--zhu-wash);stroke:var(--zhu);stroke-width:1.4}
#tree .n.inrange>.hit{fill:var(--zhu-wash);stroke:var(--zhu);stroke-dasharray:5 4;stroke-width:1.4}
#tree line{stroke:var(--line);stroke-width:1.5}
#tree line.on{stroke:var(--zhu);stroke-width:2.4}
#tree.filt .lv5:not(.on),#tree.filt .lv4{opacity:.16}
#tree.filt .lv5.on>.hit{fill:var(--zhu-wash)}
.mini{border-top:1px solid var(--rule);padding:6px 12px 8px;background:var(--panel)}
.mini .track{position:relative;height:64px;cursor:pointer;border-radius:6px;overflow:hidden;background:var(--paper)}
.mini svg{position:absolute;inset:0;width:100%;height:100%}
.mini .view{position:absolute;top:0;bottom:0;border:2px solid var(--zhu);border-radius:5px;background:var(--zhu-wash);pointer-events:none}
.mini .cap{font-size:11px;color:var(--ink-3);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.pickhint{position:absolute;left:12px;top:12px;z-index:5;background:var(--zhu);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;box-shadow:var(--shadow)}

/* 細看 */
.tabs{display:flex;border-bottom:1px solid var(--rule);padding:0 14px}
.tabs button{border:0;background:none;padding:10px 4px;margin-right:18px;font-size:14px;color:var(--ink-3);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--zhu);font-weight:500}
.side{overflow:auto;padding:16px 18px 40px;min-height:0;min-width:0;width:100%;box-sizing:border-box;flex:1}
.crumb{font-size:12px;color:var(--ink-3);font-family:var(--f-kai);line-height:1.5}
.crumb b{color:var(--zhu);font-weight:700}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 8px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pill{border:1px solid var(--rule);border-radius:999px;padding:1px 9px;background:var(--raised)}
.play{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:#fff;background:var(--zhu);border-radius:999px;padding:3px 11px 3px 9px;font-size:12px;font-weight:500}
.play svg{width:12px;height:12px;fill:currentColor}
.play.ghost{background:none;color:var(--zhu);box-shadow:inset 0 0 0 1px var(--zhu)}
.yw{font-family:var(--f-kai);font-size:21px;line-height:1.75;margin:4px 0 14px;text-align:justify}
.red{color:var(--zhu)}
.sec{margin-top:18px}
.sec h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:0 0 8px;letter-spacing:.05em}
.badge{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;border-radius:4px;padding:0 6px;line-height:19px;color:#fff;white-space:nowrap}
.badge.xw{background:none;color:var(--gold);box-shadow:inset 0 0 0 1.4px var(--gold)}
.badge.ys{background:var(--zhu)}
.badge.ys.rev{background:var(--t-rev)}
.xwlist{margin:0;padding-left:0;list-style:none;counter-reset:x;font-family:var(--f-kai);font-size:16px;line-height:1.7}
.xwlist li{position:relative;padding-left:24px;margin:4px 0;counter-increment:x}
.xwlist li::before{content:counter(x);position:absolute;left:0;top:3px;font-family:var(--f-ui);font-size:11px;color:var(--gold);width:17px;height:17px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--gold);text-align:center;line-height:17px}
.ycard{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--raised)}
.ycard.hl{border-color:var(--zhu);box-shadow:0 0 0 2px var(--zhu-wash)}
.ycard .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ycard .kw{font-family:var(--f-kai);font-size:20px;color:var(--zhu);font-weight:700}
.ycard ul{list-style:none;margin:0;padding:0}
.ycard li{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:start;margin:7px 0;font-family:var(--f-kai);font-size:16px;line-height:1.65}
.ycard li .badge{margin-top:3px;justify-self:start}
.ycard li.dim{opacity:.3}
.ygrp{display:flex;align-items:center;gap:7px;margin:12px 0 2px;font-family:var(--f-kai);font-size:16px;font-weight:700;color:var(--ink-2)}
.ygrp:first-child{margin-top:2px}
.ygrp .gno{font-family:var(--f-kai);font-size:12px;color:var(--zhu);width:19px;height:19px;border-radius:50%;box-shadow:inset 0 0 0 1.2px var(--zhu);display:grid;place-items:center;font-weight:400}
.ycard ul.ingrp{margin-left:9px;padding-left:16px;border-left:1.5px solid var(--rule)}
details.ts{margin-top:18px;border-top:1px solid var(--rule);padding-top:10px}
details.ts summary{cursor:pointer;font-size:13px;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.ts summary::-webkit-details-marker{display:none}
details.ts summary::before{content:"▸";color:var(--ink-3);transition:transform .15s}
details.ts[open] summary::before{transform:rotate(90deg)}
.tsec{margin:12px 0}
.tsec .tt{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.tsec .tt button.play-ts{cursor:pointer;border:0;background:none;padding:0;color:var(--zhu);font-size:11px}
.tsec p{margin:4px 0;font-size:14px;line-height:1.8;color:var(--ink-2)}
.tsec p.q{font-family:var(--f-kai);font-size:16px;color:var(--ink);border-left:3px solid var(--gold);padding-left:10px}
.kyhd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.kyt{font-family:var(--f-kai);font-size:18px;font-weight:700}
.kym{font-size:12px;color:var(--ink-3)}
.kytools{display:flex;gap:8px;align-items:center}
.kyorig{font-size:12px;color:var(--ink-2);display:flex;gap:4px;align-items:center;cursor:pointer}
.kybody{font-family:var(--f-kai);font-size:16.5px;line-height:1.95}
.kyp{padding:4px 8px;margin:0 -8px;border-radius:7px;cursor:pointer}
.kyp:hover{background:var(--zhu-wash)}
.kyp{position:relative}
.kyone{position:absolute;right:2px;top:4px;border:0;background:var(--raised);color:var(--zhu);border-radius:50%;width:24px;height:24px;font-size:10px;opacity:0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.kyp:hover .kyone,.kyp.reading .kyone{opacity:1}
.kyp.reading{background:var(--zhu-wash);box-shadow:inset 3px 0 0 var(--zhu)}
.kyp.reading p{color:var(--ink)}
.kyread{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:8px 10px;border-radius:10px;background:var(--raised);border:1px solid var(--rule)}
.kyrbtn{border:0;background:var(--zhu);color:#fff;border-radius:999px;padding:4px 14px;font-size:13px;font-weight:500;white-space:nowrap}
.kyrinfo{flex:1;font-size:12px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#kyRate{font-size:12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:2px 4px}
.kyp.cur{background:var(--zhu-wash);box-shadow:inset 3px 0 0 var(--zhu)}
.kyp p{margin:0;text-indent:2em}
.kybody.orig .kyp{margin-bottom:10px}
.kybody.orig .kyp p{text-indent:0}
.kyo{font-size:13.5px;line-height:1.7;color:var(--ink-3);margin-bottom:2px}
.kpg{font-family:var(--f-ui);font-size:10.5px;color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:0 3px;margin-right:6px;vertical-align:2px;text-indent:0;display:inline-block}
.kyles{font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--zhu);margin:14px 0 4px;letter-spacing:.1em}
.pvhd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pvhd a.iconbtn{text-decoration:none;color:var(--ink)}

"思惟六苦","科判焦點":"丑二 思惟六苦","課本範圍":"P164 LL3 ~ P167 L1","堂數":91,"週":115,"班級":"24秋007","日期":"2026/12/8","音檔範圍":"71A 24:04～72A 01:13","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=71a&st1=1444&af2=71b&af3=72a&et3=73","跨科判":[{"科判":"丑三 思惟三苦","起":11}],"標記":null,"序":null},{"id":"siwei-kudi-07","標題":"思惟苦諦(7)","根":"思惟三苦","科判焦點":"丑三 思惟三苦","課本範圍":"P167 L1 ~ P169 L6","堂數":92,"週":116,"班級":"24秋007","日期":"2026/12/15","音檔範圍":"72A 01:13～72B 13:29","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=72a&st1=73&af2=72b&et2=809","跨科判":[{"科判":"子二 思惟別苦","起":11}],"標記":null,"序":null},{"id":"siwei-kudi-08","標題":"思惟苦諦(8)","根":"思惟別苦","科判焦點":"子二 思惟別苦","課本範圍":"P169 L7 ~ P171 L2","堂數":93,"週":117,"班級":"24秋007","日期":"2026/12/22","音檔範圍":"72B 13:29～73A 18:25","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=72b&st1=809&af2=73a&et2=1105","跨科判":[{"科判":"癸一 煩惱發生之理","起":4}],"標記":null,"序":null}],"lessons":{"shenxin-yeguo-11":{"id":"shenxin-yeguo-11","標題":"深信業果(十一)","根":"此等之果","科判焦點":"寅三 此等之果","課本範圍":"P135 L2 ~ P136 LL6","堂數":71,"日期":"2026/7/7","分圖":[{"名":"異熟果","原文":[0,1]},{"名":"等流果","原文":[2,9]},{"名":"增上果・殺盜","原文":[10,12]},{"名":"增上果・婬口意","原文":[13,19]}],"跨科判":null,"週":94,"班級":"24秋007","序":null,"音檔":{"57a":{"local":"音檔/gl1/057A.mp3","remote":"https://lamrim.xyz/player/media/gl1/057A.mp3"},"57b":{"local":"音檔/gl1/057B.mp3","remote":"https://lamrim.xyz/player/media/gl1/057B.mp3"},"58a":{"local":"音檔/gl1/058A.mp3","remote":"https://lamrim.xyz/player/media/gl1/058A.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=57a&st1=849&af2=57b&af3=58a&et3=1285","段":[{"文":"第三、其果分三。«異熟果»者，","口譯":"第三，業的果報分為三種。所謂異熟果，","四家合註":"<span>第三、其果，分三：<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">異熟果；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">等流果；<\/span><span class=\"sjan sj-miao\">三、<\/span><span class=\"sjan sj-miao\">增上果。今初、<\/span><span>異熟果者：<\/span>","合註白話":{"id":"15497","頁":425,"白話":"《俱舍論》中說：「異熟果是由於痛苦；等流果是由於殺害；增上果是由於毫無尊嚴，所以安立三種果。」第三科、這些的果報，分為三科：一、異熟果；二、等流果；三、增上果。第一科、異熟果：十種業道，各各都依三毒本身的強中弱而各分為三種。《本地分》提到，其中嚴重的殺生等十種業道，各各都會感生於地獄；中等的十種業道，各各都會感生為餓鬼；輕微的十種業道，各各都會感生為畜生。《十地經》則將中等與輕微二者的果報反過來說。","注釋":["《俱舍論》云：引文陳真諦三藏譯《阿毘達磨俱舍釋論‧分別業品》作：「由困苦除命，滅勢味果三。」唐玄奘大師譯《阿毘達磨俱舍論本頌‧分別業品》作：「此令他受苦，斷命壞威故。」此引文為偈頌體，巴梭法王在箋註中引述論文時一併為經文作註，因此翻譯時以紅色小字標註巴梭法王對該論文的註解。見《大正藏》冊29，頁245、318；《丹珠爾》對勘本冊79，頁32。","三果：三果為異熟果、等流果、增上果。異熟果，又名異熟。有情心續中，從有漏善因或不善因所出生的無覆無記的果，稱為異熟。異熟需要具足三個條件：第一、體性無覆無記；第二、有情心續所攝；第三、從有漏善或不善出生。等流果，又名等流。與自己的因同類的果，稱為等流果。增上果，又名主上果。由於因的力量而出生的果，稱為增上果。善慧摩尼大師認為，在自己所擁有或所掌控的地方所成熟的果，稱為主上果或增上果。藏文中增上果的增上一詞，直譯為控制、主導。參見《洛桑諾布文集》冊2，頁493。","第三其果：即前頁345「此等之果」一科。","謂十業道一一皆以三毒上中下品為所依事：關於上中下品的判別，善慧摩尼大師以殺生為例提到三種分法：一、愚癡發起的殺生是下品，貪心發起的殺生是中品，瞋心發起的殺生是上品。在三品中，由於三種煩惱猛利的程度不同，可以再分三品。二、具足前行、正行、結行者是上品，僅僅具足前行、正行者是中品，僅僅具足加行與等起，或僅僅心生等起者是下品。三、作已增長的業是上品，增長而不作的業是中品，作而不增長的業是下品。以善業而言，下士所造的善根是下品，中士所造的善根是中品，上士所造的善根是上品。其他善惡業依此類推。法尊法師原譯作「謂十業道一一皆依事及三毒上中下品」，今據藏文改譯。參見《洛桑諾布文集》冊2，頁493。","《本地分》說：相應段落參見唐玄奘大師譯《瑜伽師地論‧本地分》云：「謂耎位、中位、上位、生位、習氣位。由耎不善業故，生傍生中；由中不善業故，生餓鬼中；由上不善業故，生那落迦中。」見《大正藏》冊30，頁317；《丹珠爾》對勘本冊72，頁892。","《十地經》說：相應段落參見西晉竺法護譯《漸備一切智德經‧離垢住品》云：「其此十惡不善章句，甚為招致地獄緣報，中殃畜生，微孼餓鬼」東晉佛馱跋陀羅《大方廣佛華嚴經‧十地品》云：「此十不善道，上者、地獄因緣；中者、畜生因緣；下者、餓鬼因緣。」後秦鳩摩羅什大師譯《十住經‧離垢地》云：「此十不善道，上者、地獄因緣；中者、畜生因緣；下者、餓鬼因緣。」唐實叉難陀譯《大方廣佛華嚴經‧十地品》云：「十不善業道，上者地獄因，中者畜生因，下者餓鬼因。」唐尸羅達摩譯《佛說十地經‧菩薩離垢地》云：「復次十種不善業道，以由上品積集多作，為捺洛迦因；由中品故，為傍生因；由軟品故，為鬼界因。」見《大正藏》冊10，頁285；冊9，頁278；冊10，頁505、185、543；《甘珠爾》對勘本冊36，頁407。","相反：法尊法師原譯作「相違」，今據藏文改譯。"],"已校":true},"覺燈日光":null,"時":"57A 14:09","頁":135,"af":"57a","st":849,"et":877,"消文":[{"文":"三樣東西：異熟、等流以及增上果。文字很容易懂，這個內涵是絕端重要。"},{"文":"異熟就是異熟因果：宿生造了這個，這一世感得這個果報。"},{"文":"懂得這個內涵，就了解：我現在造了，將來到哪裡去；我現在這樣，以前從哪裡來；修行也就曉得從哪裡下手。"}],"延伸":[{"題":"其果分三","組":[{"題":"業是修學佛法的重心","說":[{"類":"回扣","文":"世間任何事情都由業來決定，而且業會增長廣大，這兩點是整個修學佛法的重心。"},{"類":"立","文":"不做的碰不到，造了一定逃不掉；這個概念不清楚，修學佛法始終在門外。"}]},{"題":"痛苦的根本把握不住，學了也沒用","說":[{"類":"因","文":"歸依是為了解決痛苦；追根究底，問題就在這個業。"},{"類":"破","文":"很多學了佛的人，知見跟佛法完全不相應：講的時候有，用的時候沒有。"}]},{"題":"佛的話不聽，倒聽算命先生的","說":[{"類":"破","文":"佛告訴我們這個因不要造、那個因應該造，我們不一定聽；算命先生、科學的一點皮毛，反而固執得要命。"},{"類":"立","文":"修學佛法第一件事，是認得以前概念的錯誤：一切是由業感果的。"}]}],"說":[{"類":"回扣","文":"世間任何事情都由業來決定，而且業會增長廣大，這兩點是整個修學佛法的重心。"},{"類":"立","文":"不做的碰不到，造了一定逃不掉；這個概念不清楚，修學佛法始終在門外。"},{"類":"因","文":"歸依是為了解決痛苦；追根究底，問題就在這個業。"},{"類":"破","文":"很多學了佛的人，知見跟佛法完全不相應：講的時候有，用的時候沒有。"},{"類":"破","文":"佛告訴我們這個因不要造、那個因應該造，我們不一定聽；算命先生、科學的一點皮毛，反而固執得要命。"},{"類":"立","文":"修學佛法第一件事，是認得以前概念的錯誤：一切是由業感果的。"}],"複習":true,"af":"57a","st":1544}],"逐字稿":[{"t":"57A 14:09","b":[["q","第三其果分三。異熟果者。"],["s","三樣東西：異熟、等流以及增上果。這文字很容易懂哦，這個內涵是絕端重要哦！所以現在文字我簡單地說一下。你懂得了這個內涵，平常我們的修行，初步的修行的認識都有了。異熟，換句話說就是異熟因果，你宿生造了這個，這一世感得這個果報，把它唸一下就行。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/001.mp3"},{"文":"謂十業道，一一皆依事及三毒上中下品，有三三等。《本地分》說：此中上品殺生等十，一一能感生那落迦；中十，一一感生餓鬼；下十，一一能感旁生。《十地經》說：中下二果與此相違。","口譯":"就是說十種業道，每一種都依所對的事，以及貪瞋癡三毒的上、中、下品，各有三種差別。《瑜伽師地論・本地分》說：上品的殺生等十業，每一種都能感生地獄；中品的十業，每一種感生餓鬼；下品的十業，每一種感生旁生。《十地經》則說，中品、下品的果報與此相反。","四家合註":"謂十業道一一皆以三毒上中下品為所依事，有三三等。《本地分》說：此中上品殺生等十，一一能感生那落迦；中十，一一感生餓鬼；下十，一一能感旁生。《十地經》說中下二果與此相反。","合註白話":{"same":0},"覺燈日光":null,"時":"57A 14:37","頁":135,"af":"57a","st":877,"et":1005,"消文":[{"文":"以猛利三毒造十惡業，到地獄；中品的是餓鬼；下品的是旁生。《十地經》把中、下兩個調一調。這個叫異熟果。"},{"文":"為什麼叫異熟？造的時候業是善性或惡性，將來感得的果報體本身無所謂善惡，這是異性。"},{"文":"造業是那個時候，感果是另外一個時候，是異時；造的時候在那個地方，感果跑到這裡來，是異地。"}],"延伸":[],"逐字稿":[{"t":"57A 14:37","b":[["q","謂十業道，一一皆依事及三毒上中下品，有三三等。〈本地分〉說，此中上品殺生等十，一一能感生那落迦，中十一一感生餓鬼，下十一一能感旁生，《十地經》說，中下二果與此相違。"],["s","就是說這個十業道，如果說惡業的話，以上品三毒的，那麼就感到地獄；如果是中品的，感到餓鬼；下品的感到畜生，這個是《瑜伽師地論》上說的。《十地經》中說的，上品的還是一樣，中、下的，那麼兩個調一調，他這個道理，這個文字很容易懂。換句話說，你造了惡業，如果是以猛利三毒造的話，十惡業的話到地獄裡面去，中品的是餓鬼，下品的是旁生，這個叫異熟果。"]]},{"t":"57A 15:39","b":[["s","為什麼叫異熟呢？因為他造的時候，這個業是或者善性，或者惡性。是的，譬如說你造的壞事，這是惡業，將來你感得那個果報體，那個果報的體本身無所謂善惡，對不對？像我們得到那個身體，那個身體什麼叫善惡呢？所以這個性，異性。還有呢時間，你造業的時間是那個時候，感果的時候是另外一個時候，異時。地方呢，造的時候是那個地方，感果的時候跑到那裡來，所以這個叫異熟果。"]]},{"t":"57A 16:17","b":[["s","從因到果除了這個異熟以外，還有兩樣東西，第二個叫等流果。先把這個三樣東西說一下，然後那個內涵說一下。說了那個內涵，我們就馬上了解了：啊，我現在造了，將來到哪裡去；我現在所以這樣，以前從哪裡來的，你就清楚了。你了解了這個東西以後，那個修行，你就開始正式可以了解從哪裡下手了。現在說一下那個等流："]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/002.mp3"},{"文":"«等流果»者，謂出惡趣，次生人中，如其次第，壽量短促，資財匱乏，妻不貞良，多遭誹謗，親友乖離，聞違意聲，言不威肅，貪瞋癡三，上品猛利。《諦者品》及《十地經》中，於其一一說二二果，","口譯":"等流果（跟原來的業同類的果報），是說從惡道出來、投生人間後，照十惡業的順序，分別是：壽命短、窮困、配偶不忠、常被誹謗、親友離散、常聽到難聽的話、說話沒人當一回事，以及貪、瞋、癡特別重。《諦者品》和《十地經》裡，每一種業都說了兩種果報，","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、<\/span><span>等流果者：<\/span>謂出惡趣，次生人中，如其次第，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">殺生感<\/span>壽量短促，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">不與取感<\/span>資財匱乏，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">邪淫感<\/span>妻不貞良，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">妄語感<\/span>多遭誹謗，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">離間感<\/span>親友乖離，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">惡口感<\/span>聞違意聲，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">綺語感<\/span>言不威肅，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">貪欲<\/span>貪<span class=\"sjan sj-ba\">、損害<\/span>瞋<span class=\"sjan sj-ba\">、邪見<\/span>癡三上品猛利。《諦者品》及《十地經》中，於其一一說二二果，","合註白話":{"id":"15581","頁":427,"白話":"第二科、等流果：即使從惡趣投生為人，依序也會由於殺生而短命；由於偷盜而缺乏受用；由於邪淫導致無法守護妻室；由於妄語導致謗聲四起；由於離間導致與親友分散；由於粗惡語導致聽到不悅耳的聲音；由於綺語導致說話無人聽信；貪求心的貪、損害心的瞋、邪見的癡，這三毒非常猛烈。《諦者品》及《十地經》中，則對每一個業各宣說兩種果報，提到即使投生為人，也會短壽而多病；受用微薄，而且受用與他人共有；奴僕眷屬不順從、不可信賴，妻子有第三者介入；謗聲四起，而且遭受他人欺騙；眷屬不和睦，而且鄙劣；聽到難聽的聲音，而且言語會引發爭端；說話不受尊重、不值得聽信，並且成為對沒有必要的俗務聰慧敏捷；貪心強烈而不知足，追求沒有利益的事，或者不追求有利益的事；傷害他人，或遭到他人傷害；見解低劣，而且狡詐成性。許多前輩上師認為，即使投生為人卻仍然喜好殺生等等，這是造作等流果，而上述那些則是領受等流果。除了被稱為聖者的第八者以上，其他都是亂說而蒙蔽人心，即使以這些言語從事利他，也會成為說話非常不受尊重的因。因此《三百頌》中說：「聖者在路上行走時不會說話；以及只說法語，不應隨順婦女等說話的方式，以及談說不如法的言論。」","注釋":["《諦者品》：相應段落參見元魏菩提留支譯《大薩遮尼乾子所說經．詣嚴熾王品》云：「殺生之罪能令眾生墮於地獄、畜生、餓鬼，若生人中得二種果報：一者、短命；二者、多病。偷盜之罪亦令眾生墮於地獄、畜生、餓鬼，若生人中得二種果報：一者、貧窮；二者、共財不得自在。邪婬之罪亦令眾生墮於地獄、畜生、餓鬼，若生人中得二種果報：一者、婦不受語；二者、自妻為他侵奪。妄語之罪亦令眾生墮於地獄、畜生、餓鬼，若生人中得二種果報：一者、常為他人所謗；二者、常為他人所誑。兩舌之罪亦令眾生墮於地獄、畜生、餓鬼，若生人中得二種果報：一者、得破壞眷屬；二者、得弊惡眷屬。惡口之罪亦令眾生墮於地獄、畜生、餓鬼，若生人中得二種果報：一者、不聞善名；二者、常起鬪諍。綺語之罪亦令眾生墮於地獄、畜生、餓鬼，若生人中得二種果報：一者、得不敬重語；二者、言無定實，不為他樂。貪欲之罪亦令眾生墮於地獄、畜生、餓鬼，若生人中得二種果報：一者、不知足；二者、常生貪心。瞋恚之罪亦令眾生墮於地獄、畜生、餓鬼，若生人中得二種果報：一者、無安隱心；二者、常念損害，無有慈心。邪見之罪亦令眾生墮於地獄、畜生、餓鬼，若生人中得二種果報：一者、常生邪見家；二者、心常諂曲。」見《大正藏》冊9，頁328；《甘珠爾》對勘本冊57，頁262。","《十地經》：相應段落參見西晉竺法護譯《漸備一切智德經．離垢住品》云：「是故我等若殺生者，歸於地獄、畜生、餓鬼，設生人間，有二惡報。何謂為二？所生之處，其壽常短，又多疾痛，而中夭逝，家室憂慼，莫不感哀。若喜竊取，亦歸三惡苦，若生人間，亦有二報。何謂為二？乏少財業，怨賊劫取，亡無多少，令人憂惱。犯他人妻室，亦歸三惡，復有二報：眷屬不貞，數共鬪諍。憙妄語者，歸於三苦，有二惡報。何謂為二？人多誹謗，言不見用。其兩舌者，亦歸三苦，復有二報：眷屬離散，生下賤子，共為伴黨。其惡口者，亦歸三苦，復有二報。何謂為二？聞不可聲，罵詈之音。其綺語者，亦歸三苦，復有二報。何謂為二？熱惱他人，所在至湊，不能自決。其貪餮者，亦歸三苦，復有二報：少於產業，又多疾病。其懷嫉妬，亦歸三苦，復有二報。何謂為二？若在人間，墮于邪見，不知止足。起于瞋恚，亦歸三苦，復有二報。何謂為二？自危己身，而惱他人。其邪見者，亦歸三苦，若生人間，復有二報。何謂為二？沒在邪見六十二非，憙行諛諂。如是多患，因致苦陰，由以合成不善根本。」東晉佛馱跋陀羅《大方廣佛華嚴經．十地品》云：「於中殺生之罪，能令眾生墮於地獄、畜生、餓鬼；若生人中，得二種果報：一者、短命；二者、多病。劫盜之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、貧窮；二者、共財不得自在。邪婬之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、婦不貞潔；二者、得不隨意眷屬。妄語之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、多被誹謗；二者、為人所誑。兩舌之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、得弊惡眷屬；二者、得不和眷屬。惡口之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、常聞惡音；二者、所可言說，恒有諍訟。無義語罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、所有言語人不信受；二者、有所言說不能明了。貪欲之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、多欲；二者、無有厭足。瞋惱之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、常為一切求其長短；二者、常為眾人之所惱害。邪見之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、生邪見家；二者、其心諂曲。」後秦鳩摩羅什大師譯《十住經．離垢地》云：「殺生之罪，能令眾生墮於地獄、畜生、餓鬼；若生人中，得二種果報：一者、短命；二者、多病。劫盜之罪，亦令眾生墮於地獄、畜生、餓鬼道；若生人中，得二種果報：一者、貧窮；二者、共財不得自在。邪婬之罪，亦令眾生墮於地獄、畜生、餓鬼道；若生人中，得二種果報：一者、婦不貞良；二者、得不隨意眷屬。妄語之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、多被誹謗；二者、恒為多人所誑。兩舌之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、得弊惡眷屬；二者、得不和眷屬。惡口之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、常聞惡音；二者、所可言說恒有諍訟。綺語之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、所有言語人不信受；二者、有所言說不能分了。貪欲之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、多欲；二者、無有厭足。瞋惱之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、常為他人求其長短；二者、常為他所惱害。邪見之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、常生邪見之家；二者、其心諂曲。」唐實叉難陀譯《大方廣佛華嚴經．十地品》云：「殺生之罪，能令眾生墮於地獄、畜生、餓鬼；若生人中，得二種果報：一者、短命；二者、多病。偷盜之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、貧窮；二者、共財不得自在。邪婬之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、妻不貞良；二者、不得隨意眷屬。妄語之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、多被誹謗；二者、為他所誑。兩舌之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、眷屬乖離；二者、親族弊惡。惡口之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、常聞惡聲；二者、言多諍訟。綺語之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、言無人受；二者、語不明了。貪欲之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、心不知足；二者、多欲無厭。瞋恚之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、常被他人求其長短；二者、恒被於他之所惱害。邪見之罪，亦令眾生墮三惡道；若生人中，得二種果報：一者、生邪見家；二者、其心諂曲。」唐尸羅達摩譯《佛說十地經．菩薩離垢地》云：「害生將導於捺落迦，將導傍生，將導鬼界；若復人中受生，引二種果：一者、短命；二者、多病。不與取將導於捺落迦，將導傍生，將導鬼界；若復人中受生，引二種果：一者、乏少資財；二者、共分資財。於欲邪行將導於捺落迦，將導傍生，將導鬼界；若復人中受生，引二種果：一者、妻不貞良；二者、眷屬不可依怙。虛誑語將導於捺落迦，將導傍生，將導鬼界；若復人中受生，引二種果：一者、多被誹謗；二者、為他所誑。離間語將導於捺落迦，將導傍生，將導鬼界；若復人中受生，引二種果：一者、眷屬乖離；二者、多被毀呰。麁惡語將導於捺落迦，將導傍生，將導鬼界；若復人中受生，引二種果：一者、聞不可意；二者、言多諍訟。雜穢語將導於捺落迦，將導傍生，將導鬼界；若復人中受生，引二種果：一者、言無人受；二者、辯不明了。貪欲將導於捺落迦，將導傍生，將導鬼界；若復人中受生，引二種果：一者、心不知足；二者、多欲無厭。瞋恚將導於捺落迦，將導傍生，將導鬼界；若復人中受生，引二種果：一者、常被他人求其長短；二者、恒被於他之所惱害。邪見將導於捺落迦，將導傍生，將導鬼界；若復人中受生，引二種果：一者、墮在邪見；二者、心多諂誑。」見《大正藏》冊10，頁466；冊9，頁549；冊10，頁505、185、543；《甘珠爾》對勘本冊36，頁407。","無定辯才：善慧摩尼大師認為，無定辯才指完全不清楚目的，但對沒必要的世間事務非常聰慧。參見《洛桑諾布文集》冊2，頁493。","貪欲重大不知喜足：善慧摩尼大師認為，貪欲重大指想要獲得尚未獲得的利養；不知喜足指雖然已經獲得利養，仍然希望獲得更多。參見《洛桑諾布文集》冊2，頁493。","尋求無利或不求利：善慧摩尼大師認為，尋求無利指致力於沒必要的世間事務；不求利指不致力於有意義的善行。參見《洛桑諾布文集》冊2，頁494。","造作等流果：夏日東活佛提到，造作等流果是指，過去造下這份業，如今仍然喜愛造同樣的業。參見《夏日東文集》冊1，頁413。","領受等流果：夏日東活佛提到，領受等流果是指，在自己的所依身或自己所處的環境，領受相同的果。參見《夏日東文集》冊1，頁413。","第八聖者名言以上：聖者名言指能夠稱為聖者。此處第八指預流向的聖者，由於預流向的聖者在預流向、預流、一來向、一來、不還向、不還、阿羅漢向與阿羅漢八種聖者當中，從阿羅漢倒數是第八位聖者，所以稱為第八或第八聖者。一般而言，經論中常以此作為聖者的最下限，所以此處才會提到第八聖者名言以上。","惑人之語：愚癡不明道理的言語。","《三百頌》云：《三百頌》，律部論典，全名《聖根本說一切有部沙彌頌》，又名《聖根本說一切有部沙彌三百頌》、《沙彌三百頌》、《毘尼三百頌》，共15品，238偈，釋迦光律師（Śākyaprabhā）著，尚無漢譯。釋迦光律師（生卒年不詳），二勝六莊嚴的二勝之一，主要依止福稱及寂光兩位上師，成為精通律藏的大德，與功德光律師同被尊為「二勝」。其著作已藏譯的有《聖根本說一切有部沙彌頌》及其自釋《具光》。本論為釋迦光律師應上座釋迦友（Śākyamitra）祈請而作，透過十戒、斷除四種隨順衰損，略攝毘尼等十五門，根據四部律典而詳細闡述沙彌學處，其所依據的律文並在其自釋《具光》有明確引出，是沙彌學處的圭臬之作。此段與原文出入頗大，相應段落出自《聖根本說一切有部沙彌三百頌．斷妄語學處第四》。參見《丹珠爾》對勘本冊93，頁183；《東噶辭典》，頁210。","道中聖不語：巴註引文只作「聖不語」，而查《三百頌》原文，則為「道中不語」，揣巴註之意應是聖者於行走時不言語，而因偈文斷句的關係，無法將上句的「道中」引入此偈，今據《三百頌》原文，權將「道中」補譯入此偈。","勿作婦等語勿說不如理：如月格西解為，此句意指不要按照女人等說話的方式談話，以及說非理的言語。在此女人只是舉例，等字包含由於放逸而講故事或唱歌等行為。非理指不是為了自他二利而說。但若依《三百頌》原文，則為「不要隨順婦女等講話的方式」，並無「勿說不如理」一句。"],"已校":true},"覺燈日光":null,"時":"57A 16:45","頁":135,"af":"57a","st":1005,"et":1098,"消文":[{"文":"等流就是跟因行相相等，繼續而流：因地當中造這樣的，果地當中跟這個因相應的又來了。"},{"類":"例","文":"殺生使人壽命不圓滿，這一生壽命也不圓滿；偷了別人，這一生資財缺乏；姦淫別人妻女，自己家人也如此；誹謗了別人，這一次也被誹謗。"},{"文":"異熟是因跟果不一樣；等流是相等的，同樣地繼續流來。"}],"延伸":[],"逐字稿":[{"t":"57A 16:45","b":[["q","等流果者。謂出惡趣，次生人中，如其次第，壽量短促，資財匱乏，妻不貞良，多遭誹謗，親友乖離，聞違意聲，言不威肅，貪瞋癡三，上品猛利。《諦者品》及《十地經》中，於其一一說二二果，"],["s","那麼等流果呢，什麼叫等流？就是說跟這個因行相等的、同等的。由於這個跟因相等的繼續而流，流是向前面過來。就是當因地當中造這樣的，果地當中跟這個因相應的又來了。所以說，那個時候如果你殺生，使得人家壽命不能圓滿的話，你這一生也感得壽命不圓滿。所以「如其次第」，殺生嘛壽命得短促；你要偷了別人，那麼缺少了，這一生你也資財缺乏；如果說你姦淫別人的妻女的話，你這一次你自己的家人也是如此；你誹謗了別人，這一次也誹謗你。下面，這一樣一樣東西，貪瞋癡的話呢，以前你這個貪瞋癡，現在呢也是貪瞋癡猛利。這個異熟是這個因跟果不一樣的。等流呢，相等的，就是同樣地，它繼續地流得來。那麼這個是《諦者品》。《十地經》當中呢，說有感兩種，它哪兩種呢？"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/003.mp3"},{"文":"謂：「設生人中，壽量短促，多諸疾病，","口譯":"就是：「假使生在人中，壽命短促，多有疾病；","四家合註":"謂：設生人中，壽量短促，多諸疾病；","合註白話":{"same":2},"覺燈日光":null,"時":"57A 18:18","頁":135,"af":"57a","st":1098,"et":1106,"消文":[{"文":"除了前面已經說的壽量短，還要多病。"}],"延伸":[],"逐字稿":[{"t":"57A 18:18","b":[["q","謂「設生人中，壽量短促多諸疾病，"],["s","除了前面已經說的壽量短，還要多病。資財匱乏與他共財。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/004.mp3"},{"文":"資財匱乏，與他共財，","口譯":"（偷盜的果報是）窮困，財物要跟別人共用；","四家合註":"資財匱乏，與他共財；","合註白話":{"same":2},"覺燈日光":null,"時":"57A 18:26","頁":135,"af":"57a","st":1106,"et":1117,"消文":[{"文":"偷盜的話，除了資財缺乏，還要與他共財：你的財富，自己沒辦法保有。"}],"延伸":[],"逐字稿":[{"t":"57A 18:26","b":[["s","第二個偷盜的話呢，除了資財缺乏還要與他共財，就是說你的財富，對不起，你自己沒辦法保有的。第三呢，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/005.mp3"},{"文":"眷屬不調或非可信，妻有匹偶，多遭誹謗，受他欺誑，眷屬不和，眷屬鄙惡，","口譯":"（邪淫的果報是）家人不聽話、靠不住，配偶另有對象；（妄語的果報是）常被誹謗、被人欺騙；（離間語的果報是）家人不和、家人品行差；","四家合註":"眷屬不調或非可信，妻有匹偶；多遭誹謗，受他欺誑；眷屬不和，眷屬鄙惡；","合註白話":{"same":2},"覺燈日光":null,"時":"57A 18:37","頁":135,"af":"57a","st":1117,"et":1147,"消文":[{"文":"你離間別人，到時候眷屬彼此間不和，家庭當中亂七八糟。"}],"延伸":[],"逐字稿":[{"t":"57A 18:37","b":[["q","眷屬不調或非可信，妻有匹偶。多遭誹謗受他欺誑。眷屬不和，眷屬鄙惡。"],["s","哪！那個就是離間。你離間別人，到那時候，你的眷屬也不但是彼此間不和，而且你的家庭當中，就這麼亂七八糟，就是這樣，就這麼亂七八糟，總歸是這個家庭不和睦。還有呢，你常常說罵別人的話、惡口的話，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/006.mp3"},{"文":"聞違意聲，語成鬥端，語不尊嚴，或非堪受，無定辯才，","口譯":"聽到不如意的聲音，言語成為爭鬥的開端；言語不受尊重，或說話不被人接受，沒有決定的辯才；","四家合註":"聞違意聲，語成鬥端；語不尊嚴或非堪受，無定辯才；","合註白話":{"same":2},"覺燈日光":null,"時":"57A 19:07","頁":135,"af":"57a","st":1147,"et":1156,"消文":[{"文":"常常罵別人、說惡口的話，感得聞違意聲、語成鬥端；綺語的話，語不尊嚴。"}],"延伸":[],"逐字稿":[{"t":"57A 19:07","b":[["q","聞違意聲，語成鬥端。語不尊嚴，"],["s","如果你綺語的話，語不尊嚴。"]]},{"t":"57A 19:13","b":[["q","或非堪受無定辯才。"],["s","下面是"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/007.mp3"},{"文":"貪欲重大，不知喜足，尋求無利或不求利，","口譯":"貪欲深重，不知滿足；所追求的都沒有利益，或者不去求真正的利益；","四家合註":"貪欲重大不知喜足，尋求無利或不求利；","合註白話":{"same":2},"覺燈日光":null,"時":"57A 19:16","頁":135,"af":"57a","st":1156,"et":1163,"消文":[{"文":"貪欲大，不知喜足，兩樣。"}],"延伸":[],"逐字稿":[{"t":"57A 19:16","b":[["q","貪欲重大不知喜足，"],["s","貪欲嘛大，不知喜足，兩樣。"]]},{"t":"57A 19:20","b":[["q","尋求無利或不求利。"],["s","這個瞋，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/008.mp3"},{"文":"損害於他，或遭他害，見解惡鄙，諂誑為性。」","口譯":"瞋恚的果是損害他人，或遭他人損害；邪見的果是見解惡劣鄙陋，本性諂曲虛誑。」","四家合註":"損害於他，或遭他害；見解惡鄙，諂誑為性。","合註白話":{"same":2},"覺燈日光":null,"時":"57A 19:23","頁":135,"af":"57a","st":1163,"et":1195,"消文":[{"文":"這個就是貪瞋癡，容易懂。等流果的特質一定要說明，有這個認識，那個時候才談得到修行。"}],"延伸":[],"逐字稿":[{"t":"57A 19:23","b":[["q","損害於他，或遭他害。見解惡鄙，諂誑為性。」"],["s","這個就是貪瞋癡，這個容易懂。然後呢這個等流的果的內涵，我要解釋一下。文字雖然 ……我不解釋，有一點困難你們只要努力地看一下，很容易懂。但是關於等流果的特質，我一定要說明一下，那個時候你們才認識，有這個認識，那個時候才談得到修行。最後兩句話先說一下："]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/009.mp3"},{"文":"諸先尊長說縱生人中，«愛樂殺生等事»，是«造作等流果»。前所說者，是領受等流果。","口譯":"過去的祖師們說：即使投生人間，還是喜歡殺生等等，這叫「造作等流果」（習慣跟著來）；前面說的那些，叫「領受等流果」（遭遇跟著來）。","四家合註":"諸先尊長說縱生人中，愛樂殺生等事，是造作等流果；前所說者，是領受等流果。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">除第八聖者名言以上，餘皆雜亂惑人之語。縱以如是言語而行他利，亦成語極不威肅因。故《三百頌》云：「道中聖不語，但說正法語；勿作婦等語，勿說不如理。」<\/span>","合註白話":{"same":2},"覺燈日光":null,"時":"57A 19:55","頁":135,"af":"57a","st":1195,"et":1456,"消文":[{"文":"殺生的話，到那個時候又歡喜殺生，這個心情跟因地當中一樣，叫作造作等流。"},{"文":"因為殺生的關係，壽量短促、多諸疾病，這個叫領受等流，這兩個不一樣。"}],"延伸":[{"題":"造作等流果","組":[{"題":"真等流與假等流","說":[{"類":"立","文":"等流有三種：真等流、假等流、分位等流。造作等流就是真等流：因地當中殺的心，果地當中這個心又現起，的的確確跟因相應。"},{"類":"立","文":"領受等流是假等流：殺了別人使人壽短痛苦，這一生壽命短、得疾病，只是跟因相似。"}]},{"題":"修行沒有別的，就是這個","說":[{"類":"破","文":"平常我們只是講異熟，修行人真正應該體會的是這個等流。"},{"類":"例","文":"有人做事勁道很大，有人提不起來；有人聰明，有人遲鈍；有人歡喜這個，有人歡喜那個，都是真等流。"}]},{"題":"眼前的造作等流相","說":[{"類":"例","文":"平常坐在那兒癡癡呆呆，或者好歡喜管人家閒事，那就是眼前的造作等流相，宿生就是這樣來的。"},{"類":"下手","文":"看見了什麼，內心當中起的反應就是這個狀態；真的想修行，就從這個地方努力起。"}]},{"題":"異熟看外面，等流看內心","說":[{"類":"立","文":"不要等到臨終還不曉得到哪裡去；起心動念的時候就清楚現在造了什麼業，也了解宿生是什麼因。"},{"類":"立","文":"異熟是外面看得見那個行相，等流就是你內心，自己檢查得清楚明白的。"}]}],"說":[{"類":"立","文":"等流有三種：真等流、假等流、分位等流。造作等流就是真等流：因地當中殺的心，果地當中這個心又現起，的的確確跟因相應。"},{"類":"立","文":"領受等流是假等流：殺了別人使人壽短痛苦，這一生壽命短、得疾病，只是跟因相似。"},{"類":"破","文":"平常我們只是講異熟，修行人真正應該體會的是這個等流。"},{"類":"例","文":"有人做事勁道很大，有人提不起來；有人聰明，有人遲鈍；有人歡喜這個，有人歡喜那個，都是真等流。"},{"類":"例","文":"平常坐在那兒癡癡呆呆，或者好歡喜管人家閒事，那就是眼前的造作等流相，宿生就是這樣來的。"},{"類":"下手","文":"看見了什麼，內心當中起的反應就是這個狀態；真的想修行，就從這個地方努力起。"},{"類":"立","文":"不要等到臨終還不曉得到哪裡去；起心動念的時候就清楚現在造了什麼業，也了解宿生是什麼因。"},{"類":"立","文":"異熟是外面看得見那個行相，等流就是你內心，自己檢查得清楚明白的。"}],"af":"57a","st":1241},{"題":"愛樂殺生等事","組":[{"題":"前念後念，輾轉相生","說":[{"類":"立","文":"造作等流又叫真等流：因地當中跟善心相應，到果位當中，它還是這個。"},{"類":"立","文":"前念後念輾轉相生，特質相同，剎那剎那延續，從前一世到這一生，從這一生到後一生。"}]},{"題":"果報現起，相應的心情又現起","說":[{"類":"因","文":"以前由這樣的心情去做，當異熟果報現起的時候，相應的知見、感受又現起來，這就是等流因果。"}]},{"題":"被傷害了，就要以牙還牙","說":[{"類":"例","文":"以前傷害過他，現在同樣被傷害，那個被傷害的感受，是領受等流。"},{"類":"例","文":"心裡起反應：我要以牙還牙報復他！好歡喜跟人家論辯見解，毛病都在這個上頭。"}]},{"題":"自己作不了主","說":[{"類":"破","文":"他害你，當然要報復；他罵你，當然要辯論，覺得作得了主、很有道理。"},{"類":"因","文":"為什麼心裡會生起這種反應？這是我們不知道的地方，就是為無明所覆蓋。"}]},{"題":"當下認得它","說":[{"類":"因","文":"壞的境界去報復，好的境界去歡喜感激，無非是貪、瞋、癡，總歸在三界生死當中輪迴。"},{"類":"下手","文":"真正的整個的轉化，就從這個地方轉化起：你當下認得它——不對，這個錯的！"}]},{"題":"密護根門","說":[{"類":"回扣","文":"四十七頁四種資糧的密護根門，馬上可以用：以正念防護，哪一念錯了不放縱，哪一念對了就安住。"},{"類":"下手","文":"不讓根去對境；對了境，不取行相、不取隨好，防的就是染污的意識。"}]},{"題":"曉得自己的過錯","說":[{"類":"破","文":"碰見問題都說我對；修學了半天，還是講那個莫名其妙的道理。"},{"類":"立","文":"要認識自己在無明大病當中，起心動念不是貪、就是瞋、就是癡，那時候才肯一心一意去改善。"}]},{"題":"到此為止，切斷","說":[{"類":"立","文":"異熟的報體、增上的外境無法離開；真正重要的是等流因果，了解了以後曉得到此為止，切斷！"},{"類":"下手","文":"修行第一步為什麼教懺悔，就從這上頭；在這兒聽呀、拜呀，就是薰習跟法相應的認識，時時刻刻把它增長。"}]}],"說":[{"類":"立","文":"造作等流又叫真等流：因地當中跟善心相應，到果位當中，它還是這個。"},{"類":"立","文":"前念後念輾轉相生，特質相同，剎那剎那延續，從前一世到這一生，從這一生到後一生。"},{"類":"因","文":"以前由這樣的心情去做，當異熟果報現起的時候，相應的知見、感受又現起來，這就是等流因果。"},{"類":"例","文":"以前傷害過他，現在同樣被傷害，那個被傷害的感受，是領受等流。"},{"類":"例","文":"心裡起反應：我要以牙還牙報復他！好歡喜跟人家論辯見解，毛病都在這個上頭。"},{"類":"破","文":"他害你，當然要報復；他罵你，當然要辯論，覺得作得了主、很有道理。"},{"類":"因","文":"為什麼心裡會生起這種反應？這是我們不知道的地方，就是為無明所覆蓋。"},{"類":"因","文":"壞的境界去報復，好的境界去歡喜感激，無非是貪、瞋、癡，總歸在三界生死當中輪迴。"},{"類":"下手","文":"真正的整個的轉化，就從這個地方轉化起：你當下認得它——不對，這個錯的！"},{"類":"回扣","文":"四十七頁四種資糧的密護根門，馬上可以用：以正念防護，哪一念錯了不放縱，哪一念對了就安住。"},{"類":"下手","文":"不讓根去對境；對了境，不取行相、不取隨好，防的就是染污的意識。"},{"類":"破","文":"碰見問題都說我對；修學了半天，還是講那個莫名其妙的道理。"},{"類":"立","文":"要認識自己在無明大病當中，起心動念不是貪、就是瞋、就是癡，那時候才肯一心一意去改善。"},{"類":"立","文":"異熟的報體、增上的外境無法離開；真正重要的是等流因果，了解了以後曉得到此為止，切斷！"},{"類":"下手","文":"修行第一步為什麼教懺悔，就從這上頭；在這兒聽呀、拜呀，就是薰習跟法相應的認識，時時刻刻把它增長。"}],"複習":true,"af":"57b","st":52}],"逐字稿":[{"t":"57A 19:55","b":[["q","諸先尊長說縱生人中，愛樂殺生等事，是造作等流果。前所說者，是領受等流果。"],["s","那個前面很多善知識說，這個等流果，說除了這個異熟果你造了以後要下地獄以外，然後生到人當中的話，欸，你殺生的話，你到那個時候又歡喜殺生。這個歡喜的殺生這個心情，跟它的因地當中一樣，那個時候你好歡喜殺，你這次又來了，這個等流叫作造作等流。另外還有因為你殺生的關係，所以你的壽量短促，多諸疾病，這個叫領受等流，這兩個不一樣的。"]]},{"t":"57A 20:41","b":[["s","那麼另外這個等流，另外一個 ……等流有三種等流，有一種叫真等流，有一種叫假等流，還有一個分位等流，分位等流不去講它。什麼叫真等流？就是這個造作等流。就是你殺的時候這個因是什麼因啊，前面你就是「殺」這個心，當因地當中你存了這個的話，然後呢果地當中，欸！這個心又現起了，就這樣。所以這個是的的確確地、真實地，跟你的因相應。然後呢領受等流的話，這個叫假等流。因為你殺的時候把別人的壽命弄短了，所以你這一生，你的感得的壽命也弄短了；因為你殺了別人，使人家痛苦了，所以這一次啊，你就得到疾病的痛苦，這是跟那個因相似的。"]]},{"t":"57A 21:32","b":[["s","這個地方真正重要的，主要的就是這個真等流。你平常的時候，如果說你眼前，我們常常說，要想看這個宿生什麼因，就看看我現在受的果；要想我現在的做的因，將來就曉得什麼果，一個是異熟，一個是等流。而這個真正重要的就是什麼？現在這個等流。平常我們心裡面哪，有很多人哪做起事情來，他心裡面這個勁道很大；有很多人，啊，就是提不起來。為什麼？有很多人腦筋很聰明，有很多人腦筋就很遲鈍：有很多人歡喜這個，有很多人歡喜那個。為什麼？喏真等流，很清楚、很明白，修行沒有別的，就是這個。"]]},{"t":"57A 22:26","b":[["s","所以這個因最主要的，平常我們只是講異熟，實際上修行人真正應該體會到、了解得到的 ─這個，這個是個重要的概念。平常你坐在這地方起心動念的時候，你不觀察它，就是這個樣，一觀察你就曉得了。平常你坐在那兒癡癡呆呆，那個就是你眼前的造作等流相，你宿生就是這個樣來的，如果你真的想修行的話，就從這個地方努力起。如果你坐在這個地方，平常的時候好歡喜管人家閒事，你宿生就是這個樣子。如果那個時候你看見了什麼，內心當中起的反應，喏，就是這個狀態，了解嗎？"]]},{"t":"57A 23:08","b":[["s","所以你真正了解了以後，千真萬確的，這個業啊，不要等到說臨終的時候還不曉得到哪裡去，你起心動念的時候很清楚，現在造了什麼業，同樣你也了解，宿生是什麼因，這一生會感得現在的果。異熟是這個樣，等流是這個樣，異熟是外面看得見那個行相，等流就是你內心，自己檢查得清楚明白的。這個指正報而言，依報在下頭。同樣地我們現在的依報，這個世間什麼等等，這個叫主上果，或者叫增上果。我看我們這個增上果講得完，講不完？啊，其實增上果這個裡邊，有一段最重要的，最重要、最重要的一個概念，這最後兩句話，最後兩句話。哦，還是把它唸一遍吧！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/010.mp3"},{"文":"«諸主上果或增上果»者，謂由殺生，能感外器世間所有飲食及藥果等，皆少光澤，勢力、異熟及與威德，並皆微劣，難於消變，生長疾病。","口譯":"所謂主上果或增上果，是說由於殺生，能感得外在器世間所有的飲食、藥物、果實等，都缺少光澤，它們的勢力、成熟與威德都很微弱低劣，難以消化，容易生病。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第三、<\/span><span>諸主上果或增上果者：<\/span>謂由殺生，能感外器世間所有飲食及藥、果等效用低下、羸劣<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">衰落<\/span>，勢能、威力並皆微劣，難於消變，生長疾病。","合註白話":{"id":"15824","頁":434,"白話":"第三科、增上果，或是主上果：由於殺生，導致外在環境中的飲食、藥物及果實等效力寡小、羸劣衰弱，作用及力量微弱，難以消化；並且會引發疾病，以致多數有情還未活到壽數就過世。不與取的增上果：果實減少、果實了無生氣、果實變異、果實中空；過度乾旱、降雨過度；果實乾枯以及毫無果實。邪淫的增上果：會有許多大小便排泄物、爛泥、嘔吐物、汙穢不淨與惡臭之物，以及辛酸困苦、不歡喜。妄語的增上果：農業與船運的事業無法興隆，這句話若以農田為例，在前一任地主經營期間收成豐碩，更換地主之後，盛況從此不再。又如同舟船，起初來往旅客眾多，由此獲得豐厚的利潤，之後由另一人當船主時卻不復從前。這就是後兩個主人所造之業的增上果。不和睦、經常受騙、充滿眾多苦難及可怖的因緣。離間語的增上果：地勢凹凸不平，滿是丘陵窪地，高低起伏、崎嶇難行，充滿眾多苦難及可怖的因緣。粗惡語的增上果：該地區會有大量枯樹、荊棘、石塊、細沙、瓦礫，粗糙而沒有光澤；沒有河流、湖泊、泉源，而有乾枯的土地、〔鹵田，指含鹽的鹼土。〕、〔不毛之地，指山谷及溝頭。〕、極惡劣的環境，以及懸崖、險峻的地方，充滿可怖的因緣。綺語的增上果：果樹結不出果實、在不當的季節也結出果實、該結實時卻不結果、未成熟的卻看似已熟；根部不穩固、無法持久地存活；令人喜愛的果園、森林、池塘很少；充滿眾多可怖的因緣。貪求心的增上果：所有盛況都逐年、逐季、逐月、逐日地不斷衰退損減，無法增長。損害心的增上果：出現瘟疫、災害、傳染病，產生許多紛亂、由敵軍引發的戰爭；還有大量的獅子、老虎等，以及毒蛇、蠍子、蟲火，上師說：所謂蟲火，就是現今的大蜘蛛。當牠鑽入耳朵，就將藍布鋪在地上，緩緩地敲鼓，並且灑水，藉以營造出夏季的情境，牠就會從耳朵裡爬出。《毘奈耶》中述及這個公案時，就是使用蟲火一詞，所以這是指蜘蛛。而且充斥著暴虐的夜叉及盜賊等。邪見的增上果：外在環境中，金礦等最為超勝而主要的來源盡數消失，不潔淨的事物看似至極潔淨、痛苦的事物看似至極安樂。總體而言沒有阻止輪迴痛苦的安居處所、尤其是沒有能阻止善趣中的損害的救護、沒有阻止因位煩惱的皈依處。這三種意業不可能成為利他，所以即使是菩薩也沒有被開許的時候。","注釋":["效用低下羸劣勢能威力並皆微劣：法尊法師原譯作「皆少光澤，勢力、異熟及與威德，並皆微劣」，係依玄奘大師譯《瑜伽師地論》文譯出，今據藏文改譯。","有情大抵：法尊法師原譯作「無量有情」，係依玄奘大師譯《瑜伽師地論》文譯出，今據藏文改譯。","果不滋長果多變壞果不貞實：夏日東活佛與善慧摩尼大師認為，果不滋長，指果實不良或果實營養含量低；果多變壞，指例如種下白青稞的種子，卻長出黑青稞；果不貞實，指穗不結實。阿嘉永津對果不滋長的解釋同前；夏日東活佛解釋果多變壞及果不貞實的意思，係依照慧海大師的《廣論講授筆記》。參見《阿嘉雍曾文集》冊上，頁81；《洛桑諾布文集》冊2，頁494；《夏日東文集》冊1，頁413；《廣論講授筆記》，頁38。","迫迮：藏文直譯為「困厄」，法尊法師係依玄奘大師譯《瑜伽師地論》文譯出。迮，音若「則」，即今之窄字。","農作行船事業邊際不甚滋息：慧海大師提到，農業以及船隻往來乘載不甚幸運，即是農作、行船事業邊際不甚滋息的意思。事業邊際，即事業之意，玄奘大師譯《瑜伽師地論》文中作「世俗事業」。參見《廣論講授筆記》，頁38。","稼穡豐稔：指農作物豐收。稼，音「架」，禾有實也；穡，音「色」，穀可收也。或言種之曰稼，斂之曰穡，乃泛指耕種收藏。稔，音「忍」，穀熟。","株杌：指光禿的樹木。株，音「珠」，露出地面的樹根；杌，音「物」，無枝葉的樹。","泉湧：此詞於藏文可作二義：法尊法師蓋取玄奘大師譯《瑜伽師地論》文譯作「泉湧」，阿嘉永津及善慧摩尼大師則解為能集水的小湖泊。參見《大正藏》冊30，頁633；《阿嘉雍曾文集》冊上，頁81；《洛桑諾布文集》冊2，頁494。","鹵田：此詞阿莽班智達與慧海大師解為又熱又乾之地；而阿嘉永津則解為鹵田，與《瑜伽師地論》等依據更為相符，也與法尊法師譯法相近。鹵田，指鹽分很重、無法耕種的土地。鹵，音「魯」，其四點象鹽形。參見《阿嘉雍曾文集》冊上，頁81；《夏日東文集》冊1，頁414；《廣論講授筆記》，頁38。","乾壑：法尊法師原譯作「丘陵」，係依玄奘大師譯《瑜伽師地論》文譯出，今據藏文改譯。","溝頭：指山谷最高的部分。","險：夏日東活佛解為充滿蠍子的地方。參見《夏日東文集》冊1，頁414。","怨敵興戰：法尊法師原譯作「怨敵驚怖」，係依玄奘大師譯《瑜伽師地論》文譯出，今據藏文改譯。","蝮蠍：蝮，音「副」，一種毒蛇；蠍，音「歇」，蠍子。藏文此詞但指蠍子。","蟲火：法尊法師原譯作「蚰蜒百足」。蟲火，《藏漢大辭典》中解作一種類似蜘蛛的毒蟲，譯作蚰蜒、蜈蚣，或解作螢火蟲。然巴註中將之解為某種蜘蛛，經查漢文諸律典中，多處言及蜈蚣蚰蜒而未見蜘蛛，是知法尊法師係依玄奘大師譯《瑜伽師地論》文譯出，然為兼存各說，故改譯。慧海大師提到，蟲火是一種生於火中，離開火便無法生存的動物，夏日東活佛亦引此說而解為小蜂。有些大德說是在厚、屯等地有一種類似蜘蛛的昆蟲，如果被牠咬到，那人不久就會昏迷而死。然考律典原文，此種蟲類能鑽入耳中，乃至能在耳中生七百幼蟲，可知此蟲並非蚰蜒、蜈蚣、大蜘蛛、蜜蜂等大型蟲類。又藏文律典的蟲火一詞並無火字，故知此蟲未必離開火便無法生存。參見《夏日東文集》冊1，頁414；《廣論講授筆記》，頁38；《藏漢大辭典》，頁2979。","撣灑：以撣子灑水。撣，音若「膽」，拂掃塵土的用具。","律中：相應段落參見《根本說一切有部毘奈耶．衣本事》。見《甘珠爾》對勘本冊3，頁153。","第一勝妙生源悉皆隱沒：夏日東活佛解為金礦中沒有金子，銀礦中沒有銀子等。參見《夏日東文集》冊1，頁414。","諸不淨物乍似最勝清淨諸苦惱物乍似最勝安樂：善慧摩尼大師認為，此兩句意指解為，將自他不淨的身體看似乾淨悅意；將世間苦性的事情看似安樂。法尊法師原譯作「諸不淨物乍似清淨，諸苦惱物乍似安樂」，係依玄奘大師譯《瑜伽師地論》文譯出，今據藏文補譯。參見《洛桑諾布文集》冊2，頁494。","非安居所非救護所非皈依所：善慧摩尼大師認為，安居所，可指救護惡趣苦的下士道法類，及開示下士道法類者；救護所，可指救護輪迴苦的中士道法類，及開示中士道法類者；皈依所，可指救護寂滅衰損的上士道法類，及開示上士道法類者。參見《洛桑諾布文集》冊2，頁495。"],"已校":true},"覺燈日光":null,"時":"57A 24:16","頁":135,"af":"57a","st":1456,"et":1502,"消文":[{"文":"增上果又叫主上果、士用果，指外面的器世間，我們的依報；前面的異熟、等流是正報。"},{"類":"喻","文":"就好像農夫種了穀子，到時候收割：你做了什麼事情，一定有跟你相關的回報。"},{"文":"因為殺生，外面的東西少光澤、少勢力，吃的東西難於消化，容易生疾病。"}],"延伸":[{"題":"生長疾病","組":[{"題":"營養要的，主要的還是業","說":[{"類":"立","文":"既然感得這個身體，營養不能不注意；但概念都擺在這上頭，學佛完全學錯了。"},{"類":"例","文":"有人喝水也胖；有位同學一天一餐吃得很少，精力很好；師父照美國標準補營養，反而瘦了半天。"}]},{"題":"學了佛，還拿世間來衡量","說":[{"類":"破","文":"世間任何東西做為助伴是必要的；學了佛不拿佛法衡量，還拿世間衡量，完全顛倒。"}]},{"題":"釜底抽薪","說":[{"類":"例","文":"《梵網》上說，遭到種種苦難的時候，趕快讀誦、講說、書寫經律。"},{"類":"因","文":"以前不懂，造了不相應的染污；現在唯一的辦法是從因地上淨化，如法嘛！"}]},{"題":"責備自己，不責備人家","說":[{"類":"破","文":"不要說這個不理想、那個不理想，責備人家，完全錯了。"},{"類":"立","文":"若真修道人，不見他人過；這是三乘的共法，下腳第一步的修行宗要。"}]}],"說":[{"類":"立","文":"既然感得這個身體，營養不能不注意；但概念都擺在這上頭，學佛完全學錯了。"},{"類":"例","文":"有人喝水也胖；有位同學一天一餐吃得很少，精力很好；師父照美國標準補營養，反而瘦了半天。"},{"類":"破","文":"世間任何東西做為助伴是必要的；學了佛不拿佛法衡量，還拿世間衡量，完全顛倒。"},{"類":"例","文":"《梵網》上說，遭到種種苦難的時候，趕快讀誦、講說、書寫經律。"},{"類":"因","文":"以前不懂，造了不相應的染污；現在唯一的辦法是從因地上淨化，如法嘛！"},{"類":"破","文":"不要說這個不理想、那個不理想，責備人家，完全錯了。"},{"類":"立","文":"若真修道人，不見他人過；這是三乘的共法，下腳第一步的修行宗要。"}],"af":"57b","st":1096}],"逐字稿":[{"t":"57A 24:16","b":[["q","諸主上果或增上果者，謂由殺生，能感外器世間所有飲食及藥果等皆少光澤，勢力，異熟及與威德，並皆微劣，難於消變，生長疾病。"],["s","就這樣，這個叫增上果，主上果，有時叫士用果。就換句話說，你忙了半天，譬如說我們忙了半天，那麼有收穫。現在我們忙了半天，這個正報情況，前面是異熟跟那個等流，那麼外面剩下來的依報，就是這個東西。因為你殺生，所以感得外面的東西就少光澤、少勢力等等，吃的東西難於消化，容易生疾病。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/011.mp3"},{"文":"由此因緣，無量有情，未盡壽量，而便中夭。","口譯":"由於這個因緣，無量的有情壽命還沒有盡，就中途夭折。","四家合註":"由此因緣，有情大抵未盡壽量而便中夭。","合註白話":{"id":"16620","頁":456,"白話":"第三科、顯示業的其他差別，其中分為三科：一、引滿；二、決定與不決定；三、哪種果報最先成熟。第一科分為四科：一、善不善兩者的引業與滿業差別；二、四句型的推算方式；三、引生與圓滿的道理；四、解說兩種業會引生多少世。第一科、引滿的差別：引生善趣的業是善法，引生惡趣的業則是不善法。能圓滿的業則不固定，在善趣中，也有肢節殘缺、五根不全、膚色醜惡、短命、多病，以及貧窮等，這些是由於不善所導致；畜生及餓鬼當中也有財富圓滿的，這是由善業所導致。第二科：既然如此，由能引的善業所引生當中，便有能滿的善業所圓滿，與能滿的不善業所圓滿兩種；由能引的不善業所引生當中，也有由能滿的不善業所圓滿，與能滿的善業所圓滿兩種，共有四種情形。第三科、引生與圓滿的道理：《集論》中說：「由於善不善業，前者導致投生於善趣，以及後者導致惡趣，應當曉得其中有能引生及能夠圓滿的業。能引生，是導致引生所引善惡趣的異熟蘊體的業；能夠圓滿，是導致投生該趣之後，在其所依身中領受喜愛與不喜愛的業。」第四科分為兩派：第一、《俱舍論》主張一個業只能引出一生：《俱舍論》中說：「一個業只能引出一生，能圓滿的則很多。」是提到由一個業引出一生，而不會引出許多生，能圓滿業則有許多；也不會由許多業引出一個身體。第二、《集論》主張從一可以引出眾多：《集論》則說：「既有由一個業引出一個身體的業，也有由一個業引出許多身體的業；既有由許多業引出一個身體的業，也有由許多業引出許多身體的業。」《釋論》中解釋：藉由一剎那的業，亦即一個業，僅僅滋長一生的異熟種子，亦即只引出一生，以及也有藉由這一個業，滋長許多生的異熟種子，亦即引出多生；另外，單是一個力量微小的業，無法引出一個身體，而是藉由眾多剎那的業，反覆滋長那一個身體的種子，亦即只引出那一生。以及也有眾多業互相倚賴而聚集，從而反覆滋長，引生出多生相續的眾多身體的種子。","注釋":["第三顯示業餘差別中：即前頁345「業餘差別」一科。","引滿差別：前文科判作「善不善二引滿業之差別」。","《集論》云：引文唐玄奘大師譯《大乘阿毘達磨集論》作：「善不善業於善趣惡趣中感生異熟時，有招引業、圓滿業。招引業者，謂由此業能感異熟果。圓滿業者，謂由此業生已，領受愛不愛果。」見《大正藏》冊31，頁679；《丹珠爾》對勘本冊76，頁216。","《俱舍論》云：引文陳真諦三藏譯《阿毘達磨俱舍釋論．分別業品》作：「一業引一生。」「多業能圓滿。」唐玄奘大師譯《阿毘達磨俱舍論》作：「一業引一生，多業能圓滿。」見《大正藏》冊29，頁246、318；《丹珠爾》對勘本冊79，頁33。","亦非眾多共引一生：藏文原文本作「亦非眾多共引一」，無「生」字，故箋註加一「身」字。法尊法師蓋取論義，補入「生」字。","《集論》則說：引文唐玄奘大師譯《大乘阿毘達磨集論》作：「或有業由一業力牽得一身，或有業由一業力牽得多身，或有業由多業力牽得一身，或有業由多業力牽得多身。」見《大正藏》冊31，頁679；《丹珠爾》對勘本冊76，頁216。","一身：法尊法師原譯作「一生」，今據藏文改譯，下文同。","《釋》中說云：《釋》，此處指《阿毘達磨集論》的釋論，《丹珠爾》中載有兩部，分別為《阿毘達磨集論釋》與《阿毘達磨集論解》，二者皆有宗喀巴大師所引用的相應段落。《阿毘達磨集論釋》，唯識部論典，共10卷，勝者子論師著，尚無漢譯。《阿毘達磨集論解》，唯識部論典，共5品，勝者子論師著。漢譯本有唐玄奘大師譯《大乘阿毘達磨雜集論》16卷。勝者子論師，唯識派祖師（生卒事蹟不詳），梵語Jinaputra及藏語རྒྱལ་བའི་སྲས義譯，又名最勝子。據《佛光大辭典》註釋此師為唯識十大論師之一，法護論師（Dharmapāla）的弟子，曾於北印度鉢伐多國作《瑜伽師地論釋》，另外又著有《菩薩戒品廣釋》與《阿毘達磨集論釋》。兩本論皆為《阿毘達磨集論》的詳細解釋。此段為宗喀巴大師取經文大意，非錄原文，相應段落參見唐玄奘大師譯《大乘阿毘達磨雜集論》云：「由一業力牽得一身，謂由一業力長養一生異熟種子故。或有業由一業力牽得多身，謂由一業力長養多生異熟種子故。或有業由多業力牽得一身，謂由多業剎那數數長養一生異熟種子故。或有業由多業力牽得多身，謂多剎那業更相資待，展轉長養多生異熟種子故。」見《大正藏》冊31，頁728；《佛光大辭典》冊7，頁6119；《丹珠爾》對勘本冊76，頁1070、1473。"],"已校":true},"覺燈日光":null,"時":"57A 25:02","頁":135,"af":"57a","st":1502,"et":1512,"消文":[{"文":"這個還是殺生的增上果。"}],"延伸":[{"題":"未盡壽量，而便中夭","組":[{"題":"病的人比以前特別多","說":[{"類":"例","文":"師父小時候鄉下民風淳厚，世代安居，很少聽見有病；傷風感冒煮點生薑紅糖喝一喝就好。"},{"類":"例","文":"現在不管科學多發達，到處都是病；師父一生胃病、肝病、肺病，動過幾次手術，基本原因都是這個。"}]}],"說":[{"類":"例","文":"師父小時候鄉下民風淳厚，世代安居，很少聽見有病；傷風感冒煮點生薑紅糖喝一喝就好。"},{"類":"例","文":"現在不管科學多發達，到處都是病；師父一生胃病、肝病、肺病，動過幾次手術，基本原因都是這個。"}],"af":"57b","st":1352}],"逐字稿":[{"t":"57A 25:02","b":[["q","由此因緣，無量有情，未盡壽量，而便中夭。"],["s","這個是殺。「不與取者」，我也把它唸一遍，重要的地方我再講。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/012.mp3"},{"文":"不與取者，謂«眾果尠少»，果不滋長，果多變壞，果不貞實，多無雨澤，雨多淋澇，果多乾枯及全無果。","口譯":"不與取的增上果，是果實稀少，果實不能生長，果實多變壞，果實不堅實；常常不下雨，或雨水過多成澇，果實多乾枯，乃至完全沒有果實。","四家合註":"不與取<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">增上果<\/span>者，謂眾果尠少、果不滋長、果多變壞、果不貞實，多無雨澤、雨多淋澇，果多乾枯及全無果。","合註白話":{"same":10},"覺燈日光":null,"時":"57A 25:12","頁":135,"af":"57a","st":1512,"et":null,"消文":[{"文":"有的地方下雨下得成災，有的地方旱得不得了，那都是這種原因。"},{"文":"你在世間的財物上面損害了別人，現在的世間就是這樣的狀態。"}],"延伸":[{"題":"眾果尠少","組":[{"題":"越騙越沒有","說":[{"類":"破","文":"大家忙著物質，用種種欺騙，是越騙越沒有。"},{"類":"因","文":"越是沒有越要保存，貪心增上的結果，這種東西越來越少；能夠布施，慢慢就多。"}]},{"題":"越發心越送，錢越來越多","說":[{"類":"例","文":"響應慈濟功德會的人，越發心越送，錢越來越多。"},{"類":"例","文":"素食店老闆一面素食一面供養，生意越做越好；台中一家素食店排隊七、八十人，旁邊餐館不到十個人。"}]},{"題":"眼前的故事，就是很大的警惕","說":[{"類":"因","文":"理論了解了，知見上雖然具足，習性上還是受平常的習性所支配。"},{"類":"下手","文":"要多看因果的書，眼前的故事活生生地現在眼前，就變成很有力的推動力量。"}]},{"題":"修慧不修福，世智聰辯","說":[{"類":"因","文":"認真去做但不修福，是「修慧不修福，羅漢應供薄」，證了果還討不到飯。"},{"類":"破","文":"文字做得很好、講道理很好，法理沒進入心中，是世智聰辯，下一世連佛法都不接受。"}]}],"說":[{"類":"破","文":"大家忙著物質，用種種欺騙，是越騙越沒有。"},{"類":"因","文":"越是沒有越要保存，貪心增上的結果，這種東西越來越少；能夠布施，慢慢就多。"},{"類":"例","文":"響應慈濟功德會的人，越發心越送，錢越來越多。"},{"類":"例","文":"素食店老闆一面素食一面供養，生意越做越好；台中一家素食店排隊七、八十人，旁邊餐館不到十個人。"},{"類":"因","文":"理論了解了，知見上雖然具足，習性上還是受平常的習性所支配。"},{"類":"下手","文":"要多看因果的書，眼前的故事活生生地現在眼前，就變成很有力的推動力量。"},{"類":"因","文":"認真去做但不修福，是「修慧不修福，羅漢應供薄」，證了果還討不到飯。"},{"類":"破","文":"文字做得很好、講道理很好，法理沒進入心中，是世智聰辯，下一世連佛法都不接受。"}],"af":"57b","st":1442}],"逐字稿":[{"t":"57A 25:12","b":[["q","不與取者，謂眾果尠少，"],["s","這是尠，眾果尠少，"]]},{"t":"57A 25:19","b":[["q","果不滋長，果多變壞，果不貞實，多無雨澤，雨多淋澇，果多乾枯及全無果。"],["s","這個就是不與取，就是現在這個時候，就是現在這個時候。有的地方啊下雨下得成災，有的地方旱得個不得了，那都是這種原因。再下面這個欲邪行。"]]},{"t":"57A 25:44","b":[["s","翻到《菩提道次第廣論》一百三十五頁。上一次已經把抉擇業果的道理，頭上面幾個原則說了一下。第一個，我們首先了解的，世間任何事情都由業來決定。所謂業就是前面所造的因，你造的什麼業的因，那麼將來一定感得什麼果，這個因果之間，一點都不錯。其次呢，這個業會增長廣大。這兩點是我們整個的修學佛法的重心，這我們必須要知道的。然後呢，不做的碰不到；造了一定哪逃不掉。如果我們對這個概念不清楚的話，修學佛法始終在門外，始終在門外。"]]},{"t":"57A 27:07","b":[["s","前面是歸依。我們了解，是了解世間的苦，所以呢，要找一個真正能夠幫助我們解脫的，於是最後找到說，在這種情況之下，唯一能夠幫助我們的這一個人，具足這個條件的是佛陀。於是這樣，然後呢怎麼一步一步推上來，追根究底，最後找到，啊，歸依了以後，所以能夠解決問題的，問題在哪裡？在這裡，那個時候我們要找到這個業。假定說我們對這個概念不清楚的話，儘管你信佛，沒有用！信佛的目的是什麼？解決你的痛苦，解決一切問題。而這個痛苦的根本，你把握不住的話，你雖然學了半天，沒有什麼用場。譬如現在我們平常看見很多學了佛的人，他還始終知見上面哪跟著佛法完全不相應。他自己覺得好像懂得很多道理，儘管懂得道理，是講的時候，有的，用的時候，沒有！"]]},{"t":"57A 28:28","b":[["s","那麼真正信了佛應該了解，一切法無非是空緣起，它不是天生如此的，它也不是不順的因，不是說自在天，或者是什麼。所以前面曾經特別說過了，現在我們很多學佛的人哪，雖然學了佛了，但是我們並沒有真正照著佛告訴我們的話來說。佛告訴我們：這個因不要造，這個因應該造，我們不一定聽他的。倒是世間一個算命先生告訴我們的，乃至於現在各式各樣都是世間的概念，都是世間的概念。現在我們講科學，各式各樣的說，啊！這個科學上怎麼講的，這樣。稍微碰見一點皮毛，大家固執得要命，總是覺得這個有 ……好像很對的樣子。這我們要了解，修學佛法第一件事情應該認得，什麼？是我們以前那種概念的錯誤，我們應該認得，一切是由這個業感果的。"]]},{"t":"57B 00:15","b":[["s","那麼這個業的四個行相我們了解了。了解了以後，更進一步就是說：那麼什麼樣的業是善的感得善果，什麼樣的是惡的感得惡果，我們也了解了。然後呢，下面又特別地說明，有幾種業它具有特別力量的，我們了解了。那麼最後曉得由這樣的業，感得那個果，那個果分三部分：異熟、等流以及增上果。"]]},{"t":"57B 00:52","b":[["s","這個等流果前面已經簡單地說了一下，今天要特別解釋一下的，這個黑板上寫的，黑板上寫的。說，「造作等流」，它又叫真等流，這什麼意思呢？是說你因地當中，是有善心相應的，到果位當中，它還是這個。平常我們起心動念，前一個心念是善的，後一個念頭繼續地下去，繼續地向前面的繼續不斷地流衍，繼續不斷地向前面推衍，是前念、後念輾轉相生，而這個輾轉相生的前後，它特質相同的，這叫等流因果。我們剎那剎那地延續，一直不會斷絕，從前一世到這一生，從這一生到後一生，就這樣。"]]},{"t":"57B 02:06","b":[["s","所以我們平常的一切的情況，譬如說前面說異熟，當那個果報現起的時候啊，當我們對了這個境以後，我們內心當中，就有一種知見、感受，跟它相應的生起的。那個時候的那種知見、那種感受怎麼來的呢？就是說我們曉得以前我們這種習氣，當我們做這件事情的時候，由於這樣的一種心情去做，所以當這個果報現起的時候，它相應的這個心情又現起來了。前面這個叫作異熟的因果，那麼當那個時候，跟它相應的心裡面現起的這種狀態，就是等流因果，等流因果。"]]},{"t":"57B 03:04","b":[["s","對這個認識，對我們是絕端重要的，所謂修行就從這個地方修行起。這個話怎麼講？譬如說現在前面有一個境界現起了，境界現起了。以前你曾經傷害過他，所以這個境界碰到你身上的話，你同樣地是被傷害，那麼這個叫作領受等流，這個叫作領受等流，你被傷害的那個感受。但是除了這個身體相續上的領受以外，心理上面你會起一種反應：「唉，被傷害了，那我要以牙還牙去報復他！」這個時候我們心裡一定會生起這種心情來；或者他對你好的，你也對他好的。總是我們心裡面有種種的這一種，以世間上面的 ……平常我們常常好歡喜跟人家論辯見解什麼東西，這個毛病都在這個上頭，所以修行就從這裡。"]]},{"t":"57B 04:16","b":[["s","所以我們真正要認識，認識什麼？就是認識這個。假定這個不認識的話，那個就談不到修行，這一點我們這個地方非常重要，非常重要，它會輾轉相續的。這是為什麼，我們自己作不了主的原因就是這樣。你說作不了主嗎？好像作得了主，就是前面一個境界現起了以後，你還覺得很有道理 ─欸，他來害你嘛，「我當然要報復啊！」他罵你嘛，「他說得沒有理由，我當然要跟他辯論哪！」嗯，就是這樣。是，在這種情況之下，我們覺得是可以作得了主，實際上你為什麼心裏會生起這種反應來？你為什麼對這件事情這樣想？這就是我們不知道的地方，這就是我們為無明所覆蓋的。現在修學佛法真正要認識，就是要認識這個，大家懂不懂這個？現在這裡不一定完全清楚，到後面的時候才說明了。"]]},{"t":"57B 05:18","b":[["s","那麼認識些什麼呢？認識就是說，現在我們不管你起了什麼念頭，說對於壞的境界你去報復，對於好的境界你去歡喜，或者感激什麼等等，這個無非是或瞋、或貪、或癡，不管你怎麼做，總歸在三界生死當中輪迴，三界生死當中輪迴。壞的墮落三惡道，好的就是保持人天，也是暫時的，到最後還是在這個地方跳不出去。因為什麼？這個是有漏的，無明相應的。是真正的整個的轉化，就從這個地方轉化起，你當下認得它 ─不對，這個錯的，這個錯的！"]]},{"t":"57B 06:14","b":[["s","到現在為止，錯、對的內涵，我們還沒有深一層地去談它，但從這個地方要了解這一點。前面我們曾經講過修行，什麼叫修行哪？就是對我們善所緣的數數憶持，然後呢不要讓它忘失；把無始以來所緣的惡的，把它改變過來，這個基本的概念。因為我們無始以來一直緣那個惡的，說這個惡的不是一定做壞事，就是說凡是有漏的這種事情，我們整個地都要把它淨化。那麼這個基本概念，當時這一個道理，現在這個地方我們回憶一下。"]]},{"t":"57B 07:06","b":[["s","下面又告訴我們四種資糧。這個四種資糧當中，現在請你們翻到四十七頁，我們馬上可以用的，如果說你們好好地善巧的話，那這個時候就可以派上用場了。四十七頁上面，告訴我們這個四種資糧，第一種叫作密護根門，這個密護根門當中分成功五個項目，五個項目。就是說「根門」是我們曉得的，說六根門頭，為什麼要護它呢？因為我們一切有漏的善惡業，都是從這個六根對著六塵，然後生起六識，造種種善惡之業。由於這個業，所以就感得種種生死果報，現在修行就從這個地方修起。"]]},{"t":"57B 08:09","b":[["s","第一個叫以何防護。那麼你現在要修行就是修這個，所謂修習防護囉！那麼怎麼樣修習法呢？叫作「以正念」，這個正念要怎麼辦呢？對正確的認識，心念保持這個正確的認識，經常地，而且很認真地保持。喔唷！哪一念錯了，那你馬上不要放縱它；哪一念對了，就安住在這個上頭。"]]},{"t":"57B 08:41","b":[["s","是，對、錯的真正的內涵，我們不一定很清楚，但是在座有很多修行人，譬如說他學禪的人，那麼當然，以前的禪我們不談，現在目前禪所流行的就是參一個說「念佛是誰？」看那個「誰」。然後呢或者你參一個是，趙州說：「這狗子有佛性也無？」參一個「無」。你全部精神貫注在這個上頭，總歸要把它那個根由找出來。念佛的人呢？一個念、一個心念，一直在那句阿彌陀佛上頭。為什麼呀？這因為當你平常起心動念，不管是善、不管是惡，這個本身都是染污的。那麼這個念頭，我們拿世俗的標準來說，容或是有善惡，可是這個世間善惡的標準，結果是什麼？在三界之內的升沈，跳不出生死輪迴，最後必定是在生死輪迴當中，這是絕端地痛苦。這個正念是正法相應的，但是呢因為無始以來，它一直在散亂當中，所以要很努力地、經常地保持。"]]},{"t":"57B 10:10","b":[["s","那麼那個念頭保持什麼呢？第二個保護這個六根，就是我們的眼、耳、鼻、舌、身、意。那麼從什麼地方去防起呢？從什麼地方去防起呢？就是說這個六根所對的境界，就是防那個六塵。哦！這個是你歡喜的，生起貪；這個你不歡喜的，生起瞋；其他的你無所謂的，生起癡，就是這個樣。"]]},{"t":"57B 10:43","b":[["s","那麼怎麼防法呢？那就是這樣，有兩種。一個呢，你曉得這個根對了境以後，一定跟著外面去轉，所以不要讓那個根去對那個境。譬如說我們為什麼剛出家的時候，一定要住在山林裡邊，乃至於我們為什麼說平常的時候不准出去？我們曉得，一跑出去，對不起！你這個就亂掉了。所以我們一天到晚在這個寺院裡邊，眼睛所對的，不是佛菩薩，就是經藏、師長、同學，都是三寶，就是這樣。然後使得你的意念這樣，這是一種防護的方法，所以你不縱那個根。"]]},{"t":"57B 11:28","b":[["s","還有呢，這個實際上是不可能一天到晚都做得到的，難免有的時候你需要這樣去做，有的是無意這樣去，那怎麼辦呢？當那個根對了境以後的話，你心裡上曉得：「欸，根對了境了。」對於所對的這個境，不取行相、不取隨好。什麼叫作「不取行相」？就是你看見了：欸，這個好看！你不去看它，曉得這個不對的。這個好聽！不去聽它。這樣的不看、不聽是離開貪。反過來說，這個不好的，然後呢你不去管它，是離開瞋。這個是行相，就是當下的這個相狀。什麼叫作「不取隨好」呢？事情過去了，過去了，你剛才看過了，你心裡想：欸，剛才這東西也不錯呀！啊！這樣。或者剛才這東西很糟糕，你心裡就嘀嘀咕咕弄了個半天。這個就是不取隨好。"]]},{"t":"57B 12:35","b":[["s","那麼最後它為什麼要防？防些什麼呢？就是在這個時候，使得我們的意根哪，不要受著這一個塵境，而生起染污的意識。這個染污的意識就是我們的煩惱，生死的根本，它真正的防，就是防這個。"]]},{"t":"57B 13:01","b":[["s","所以當我們心相續，前後相續的時候，一定在這個異熟的因果當中，所以我們無法離開我們這個異熟的報體，這個是正報。我們一定在那個增上因果當中，我們無法離開我們外面所對的境界，這個無法可想的，我們也不必去想它。真正重要的就是等流因果，當我們心裡面相應的起來的時候，那個時候我們曉得前面這樣來是為什麼。以前不了解正確的佛法，在無明長夜以來，這個長夜是無始以來，都在這個裡面轉，現在了解了以後曉得到此為止，切斷！"]]},{"t":"57B 14:01","b":[["s","所以一開頭的時候，為什麼說我們修學佛法必須要的幾個條件，第一個，曉得自己的過錯。這個道理說起來是容易極了，做起來是難極了。儘管現在大家都在那兒聽，都在那兒講啊，碰見問題呀都在自己說我的對，啊，不曉得有多少道理！所以剛開始的時候，人家跟我講道理我還是聽他，也原諒他，他本來不懂嘛！結果發現我們很多同修們，修學了那麼半天，他還是講那個莫名奇妙的道理。所以一個修學佛法的人，最主要的我們應該了解，我們在無明當中，你那個道理是越講是越錯，不曉得錯到哪裡去，這是我們必定應該知道的，所以過錯應該拿掉。然後正確的第一件應該認識什麼？應該認識我們在無明大病當中。所以我們那個起心動念都是錯的，不是貪、就是瞋、就是癡，最粗的，細的根本談不到，那個時候你才肯一心一意地怎麼去改善。那麼改善從哪裡開始？就從這裡。"]]},{"t":"57B 15:07","b":[["s","現在這概念有沒有？這是非常重要的一個概念哦！平常我們必須把那個整個所講的那個次第啊，把它歸納起來，現在已經有了一個基本的認識了。當你這個基本的認識，有了正確的認識了，那個時候你就曉得修行，為什麼修行第一步要教懺悔，懺悔如何懺法，都從這個上頭。所以今天講的那個東西特別重要，如果說你們把握得住的話，如法能夠真正去懺悔的話，那個時候你要修學的佛法都成功。如果這個概念把握不住的話，那─是，種種善根哪，總歸好的，可是你要想得到這個相應的結果的話，沒有這個可能，而且「絕無可能」，四個字！一直等到有一天，欸，等到你又轉過來，又跟這個法相應了，還是這一些！然後呢，那時候你成功了。"]]},{"t":"57B 16:08","b":[["s","所以記住！我們不要讓我們轉了半天哪，那個說「半天」是形容詞哦！那個半天，可能無量阿僧祇劫，在地獄裡面去轉哪！所以這個地方我特別說一下，這個等流對我們這麼的重要。平常我們起心動念，在任何情況之下，就是這個東西，就是這個東西，等流的心識，念念地向前相續。所以說修行、修行就從這個地方，把前面這個東西到此為止，後面這個東西引發。所以我們在這兒聽呀！拜呀！幹什麼？就是薰習新的、跟法相應的，隨順正法跳出生死輪迴的這個認識，把它薰習進去，然後時時刻刻地把這個增長，而不是把以前染污生死之業跟著它轉，不是！這一點我們在這個地方要認識的。下面再看：諸主上果或增上果者，"]]},{"t":"57B 17:20","b":[["s","「主上果或增上果」，這個「主」就是主要的，主要的上面它還有「增上」。這個意思就是平常我們就唯識上面舉一個比喻啊，它說就好像農夫，你種了穀子以後，到了收割一樣，收割一樣。換句話說，你做了什麼事情以後，你一定跟你相關的，它有回報。所以我們在這世間做了很多事情以後，這個正報是前面的異熟、等流。然後呢，外面這其他的回報，這個就是我們的，叫作士用果或者增上果。士用的話，士，就是你作者，用，就是你所受用的那些，那個主要的就是指外面的器世間，我們的依報。那個文字很容易懂，我們把它唸一遍。"]]},{"t":"57B 18:16","b":[["q","謂由殺生，能感外器世間所有飲食及藥果等皆少光澤，勢力，異熟及與威德，並皆微劣，難於消變，生長疾病。"],["s","所以現在這個時候，如果我們感覺得這些東西不好，大家千萬不要說：「哎呀，營養不好，不要這個！」營養要的，所以我們既然感得了這個身體以後，我們不能不注意。但是假定說，你的概念都擺在這個上頭的話，你學佛完全學錯了，完全學錯了，不必來學佛。我們必定要了解這個主要的是什麼？還是我們的業這個最重要。我以前聽人家講過一個話，當時我還覺得笑話，現在想想千真萬確。他有一個人很胖，大家覺得胖不好，他就說：「我這一點辦法都沒有，喝水他也胖。」這是千真萬確的。譬如我們這裡在座的有一位同學，他現在只吃兩餐，我鼓勵他吃兩餐，他一向吃一餐，他也吃得很少，但是來得個胖，精力來得個好！別的人呢，就像我來說吧！那個不曉得多少營養，美國的標準哪，怎麼個弄，弄來弄去就瘦了個半天，這個非常明白。"]]},{"t":"57B 19:39","b":[["s","現在世間人當然講那個，學佛的人還講那些，我是覺得完全顛倒，完全顛倒！我們不是說忽視，它前面說得很清楚的，凡是世間的任何一樣東西，用來做為我們的助伴，這我們必須要的。可是學了佛以後，居然不拿佛法來衡量，還拿這種世間來衡量的話，那錯了！所以這個地方告訴我們為什麼，就是我們宿生造了這個業，這是為什麼譬如說經論上面，乃至於戒經上面，《梵網》上面告訴我們，你遭到種種苦難的時候，你趕快跑得來讀誦、講說、書寫這個經律。那個時候我不懂，病的時候戒上面告訴我們病的時候你該休息，他為什麼跑得來讀誦、講說啊？很簡單！因為你以前不懂啊，然後你造了不相應的染污，現在既然在這種情況之下，你唯一的辦法從因地上面把它淨化。那時要因地上淨化怎麼辦？如法嘛！很簡單，就釜底抽薪，這是唯一的辦法呀！"]]},{"t":"57B 20:51","b":[["s","所以那個時候我們就曉得，現在之所以痛苦是為什麼？以前造了惡業啊！現在要趕快曉得，怎麼樣的惡的業因感得惡果，什麼樣的善業感得善果，從這個地方改善才可以啊！凡是現在，不管是異熟，以及主上或增上果，當我們感到的時候，我們立刻應該感受到。不必說：哎呀！現在這個地方，這個不理想、那個不理想，責備人家，錯了，完全錯了！世間法，是對的；佛法不是責備人家，責備自己。所以說：「若真修道人，不見他人過。」這個現在你們懂得嗎？假定說你們在這個地方體會不到的話，那就是冤枉了你們自己，冤枉了你們自己。不是說我們現在馬上做到，就是說，我們這個概念必須要認識，然後認識了努力去做。那麼剛開始的時候做不到，它有一個原因的，那個後面會告訴我們，在懺悔裡邊，以及為什麼要懺悔，後面就再講。"]]},{"t":"57B 22:09","b":[["s","所以關於到這一點，你們這兩天，心裡可以認真地思惟、觀察一下，講懺悔的時候詳細講。如果還有不了解的，那個時候在這裡把它提出來，我也會告訴你們。這是我們三乘的共法，下腳第一步的修行的宗要。繼續看："]]},{"t":"57B 22:32","b":[["q","由此因緣，無量有情，未盡壽量，而便中夭。"],["s","那麼這個還是殺生的這個增上果、增上果，就是這樣。我們現在看見眼前那個世間就是這樣，哎呀，不管你科學多發達，病的人是比以前特別多，這個實在是千真萬確的。我還記得我小的時候，那離開現在五十年以前。那鄉下去呀，因為那個時候的民風很淳厚，而且世代安居，通常一住在那裡幾百年，多則千年計，所以方方幾十里路之內都很熟。很少聽見人家說有什麼病啊，最多傷風感冒，傷風感冒也不必去看醫生，拿一點生薑，煮一點紅糖喝一喝好了，流兩天鼻涕就好了，很少有。現在啊！你跑到什麼地方去，到處都是病。以我自己本人來說，我一生啊得過各式各樣的病，胃病、肝病、肺病，那麼動過幾次手術，然後周圍的人也都是這個樣，這是基本的原因都是什麼？都是這個。在這個地方，我們要了解。第二"]]},{"t":"57B 24:02","b":[["q","不與取者，謂眾果尠少，果不滋長，果多變壞，果不貞實，多無雨澤，雨多淋澇，果多乾枯及全無果。"],["s","就是因為你不與取，因為你不與取，所以你感得的那個果報的話，就是這樣的果報。你在世間的財物上面損害了別人了，那麼現在的世間就是這樣的狀態。現在的人真可憐哪，大家忙著物質上的，他用種種地方，用種種欺騙，是越騙越沒有，越騙是越沒有！大家都是顛倒啊！大家都是顛倒啊！現在我們往往是，越是沒有哇，越是大家要保存起來，結果你越保存，因為那個貪心增上的結果，最後這種東西是越來越少，越來越少。反過來，你能夠布施的話，欸！這個東西慢慢、慢慢、慢慢地、慢慢地多。"]]},{"t":"57B 25:08","b":[["s","我們不必說看很多因果的故事，就是眼前，你看有很多很有意思哦！最近常常有這種報導，因為花蓮慈濟功德會，那真是一位了不起的大菩薩，所以有很多人起而響應。響應的結果啊，你們常常可以看見這種，結果他越發心越送，欸！這個錢越來越多。"]]},{"t":"57B 25:33","b":[["s","那前幾天還有一個素食店的老闆。他來了以後，一方面素食，一方面供養，結果生意做得越來越好。我那次到台中來也是一樣，我忘記掉那個什麼地方，有兩個店，一個素食店，一個是肉食店。那個素食店裡面哪，擠得呀排這個隊，我看看裡面小小個地方，總有七、八十個人。然後呢，另外旁邊那個普通的餐館哪，進去找的話找不到十個人，桌子都空在那個地方，就這樣。然後我吃完了，出家的法師他一定要供養，這個千真萬確的事實啊！"]]},{"t":"57B 26:12","b":[["s","所以我們平常，我們要多看因果概念的書，你理論了解了以後，知見上面雖然具足了，可是習性上面哪，還是受平常的這種習性所支配。你一定要多看，多看，換句話說，這個就是眼前的故事擺在那裡，就給你很大的警惕。喏、喏、喏、喏！你就看見他了，他做了善事就得到這個善果，做了惡事得到了惡果。這麼一來，就把你原來所了解的這個道理，就很清楚強烈地，活生生地現在你眼前，那個時候就變成功很有力的推動你的力量。這樣時候，你就變成功一個真正如法的修行人。要不然講講道理是對的，講完了以後，仍舊是懶癱癱坐在那個地方，只會講道理，也就是如此而已！"]]},{"t":"57B 27:09","b":[["s","這種情況有沒有果報？有，有兩種可能，這個果報。如果你真正認真地這樣地去做的話，那麼這一種，是「修慧不修福，是羅漢應供薄」。將來你生生世世會修行的，但是始終啊，哎呀，飯也吃不飽，證了果了，你還討不到飯，這是一種。還有一類，儘管你文字上面做得很好，講起道理來很好，實際上法理根本沒有進入你的心目當中。這種人變成了什麼？世智聰辯。喔！那講起來聰明得很，講起來能說善道，道理比誰都強，但是對不起，跟佛法不相應，下一世連它這個佛法都不接受，這是種典型的例子，這個我們要認識的。這個地方，隨便提一下。那麼再下面："]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/013.mp3"},{"文":"欲邪行者，謂多便穢，泥糞不淨，臭惡迫迮，不可愛樂。虛妄語者，謂農作、行船，事業邊際，不甚滋息，不相諧偶，多相欺惑，饒諸怖畏恐懼因緣。離間語者，謂其地處丘坑間隔，險阻難行，饒諸怖畏恐懼因緣。粗惡語者，謂其地所多諸株杌，刺石礫瓦，枯槁無潤，無有池沼、河流、泉湧，乾地、鹵田，丘陵、坑險，饒諸怖畏恐懼因緣。諸綺語者，謂諸果樹不結果實，非時結實，時不結實，未熟似熟，根不堅牢，勢不久停，園林、池沼，可樂極少，«饒諸怖畏恐懼因緣»。","口譯":"邪淫的增上果（影響生活環境的果報），是住的地方到處是屎尿污泥，又臭又擠，讓人不舒服。妄語的增上果，是種田、跑船這些工作最後都沒什麼收益，人跟人合不來，常常互相欺騙，處處讓人害怕不安。離間語的增上果，是住的地方高高低低、坑坑洞洞，路很難走，處處讓人害怕不安。粗惡語的增上果，是住的地方到處是樹樁、荊棘、石頭、碎瓦，乾巴巴的，沒有池塘、河流、泉水，只有乾土、鹽地、丘陵和險坑，處處讓人害怕不安。綺語的增上果，是果樹不結果，或該結果時不結、不該結時亂結，看起來熟了其實沒熟，根不牢、活不久，園林池塘沒有什麼讓人開心的地方，處處讓人害怕不安。","四家合註":"欲邪行者，謂多便穢、泥糞、不淨、臭惡、迫迮、不可愛樂。虛妄語者，謂農作、行船事業邊際，不甚滋息，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂如田地，前主之時稼穡豐稔，易主之後盛況不再；又如舟船，先時旅客眾多，獲利豐厚，船既易主，便不如前。此即猶後二主所積業之增上果也。<\/span>不相諧偶、多相欺惑，饒諸怖畏恐懼因緣。離間語者，謂其地處丘坑間隔險阻難行，饒諸怖畏恐懼因緣。粗惡語者，謂其地所多諸株杌、刺石礫瓦，枯槁無潤，無有池沼、河流、泉湧，乾地、<span class=\"sjan sj-ba\">〔<\/span>鹵田<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂鹽鹹地。〕<\/span>、<span class=\"sjan sj-ba\">〔<\/span>乾壑<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂山谷溝頭。〕<\/span>、坑<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">與崖邊、<\/span>險，饒諸怖畏恐懼因緣。諸綺語者，謂諸果樹不結果實、非時結實、時不結實、未熟似熟、根不堅牢、勢不久停，園、林、池沼可樂極少，饒諸怖畏恐懼因緣。","合註白話":{"same":10},"覺燈日光":null,"時":"57B 28:04","頁":136,"af":"57b","st":1684,"et":null,"消文":[{"文":"口業四種，每一個項目當中都是「饒諸怖畏恐懼因緣」。"},{"類":"因","文":"因地當中妄語提供不實，離間、惡口使人感受痛苦，綺語毫無意義，都遠離善、樂；果地自然遠離安樂，遠離安樂就多諸恐怖，因果絲毫不爽。"}],"延伸":[],"逐字稿":[{"t":"57B 28:04","b":[["q","欲邪行者，謂多便穢，泥糞不淨，臭惡迫迮，不可愛樂。"],["s","下面。"]]},{"t":"57B 28:14","b":[["q","虛妄語者，謂農作行船，事業邊際，不甚滋息，不相諧偶，多相欺惑，饒諸怖畏，恐懼因緣。離間語者，謂其地處丘坑間隔險阻難行，饒諸怖畏恐懼因緣。粗惡語者，謂其地所多諸株杌，刺石礫瓦，枯槁無潤，無有池沼，河流泉湧，乾地鹵田，丘陵坑險，饒諸怖畏恐懼因緣。諸綺語者，謂諸果樹不結果實，非時結實，時不結實，未熟似熟，根不堅牢，勢不久停，園林池沼，可樂極少，饒諸怖畏，恐懼因緣。"]]},{"t":"58A 00:03","b":[["q","虛妄語者，謂農作行船，事業邊際，不甚滋息，不相諧偶，多相欺惑，饒諸怖畏，恐懼因緣。離間語者，謂其地處丘坑間隔險阻難行，饒諸怖畏恐懼因緣。粗惡語者，謂其地所多諸株杌，刺石礫瓦，枯槁無潤，無有池沼，河流泉湧，乾地鹵田，丘陵坑險，饒諸怖畏恐懼因緣。諸綺語者，謂諸果樹不結果實，非時結實，時不結實，未熟似熟，根不堅牢，勢不久停，園林池沼，可樂極少，饒諸怖畏，恐懼因緣。"],["s","這個內容容易懂，不過，看這個每一個項目當中，這就我們口業四種當中，都是說，這些地方啊都是「多諸怖畏，恐懼因緣」，都是這個。為什麼原因，為什麼原因？因為你因地當中所以說那個妄語的時候，提供不實的；或者是使人家感受到痛苦的，不管是離間也好、惡口也好；那麼綺語呢，毫無意義的，反正這種毫無意義的事情的話，至少沒有意義的話。這個所謂意義的本身是什麼？善、樂。既然你現在開起口來都遠離這個的話，因地當中造了這個因，果地當中都自然的一定會產生這個現象 ─就是遠離安樂。遠離安樂嘛就多諸恐怖了，這是因果之間是絲毫不爽啊！下面這個三樣東西，我們要好好地認識一下。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/014.mp3"},{"文":"貪欲心者，謂«一切盛事»，經歷一一年時月日，漸漸衰微，唯減無增。","口譯":"貪欲心的增上果，是一切興盛美好的事物，經過一年年、一季季、一月月、一天天，逐漸衰微，只減不增。","四家合註":"貪欲心者，謂一切盛事，經歷一一年時月日，漸漸衰微，唯減無增。","合註白話":{"same":10},"覺燈日光":null,"時":"58A 01:25","頁":136,"af":"58a","st":85,"et":350,"消文":[{"文":"凡是貪欲心重的，一切的好事情，慢慢當中都在衰退，現在是特別地厲害。"}],"延伸":[{"題":"一切盛事","組":[{"題":"高樓大廈，還是山林平房","說":[{"類":"例","文":"住在高樓大廈舒服，還是在日月潭、溪頭的山林當中舒服？有個平房，前面種花草，早晨麻雀吱吱喳喳，人人都會選擇後者。"}]},{"題":"我們人還說進步了","說":[{"類":"例","文":"交通方便，噪音、空氣染污受不了；一部車幾十萬，為賺那幾十萬不曉得花多少功夫，兩隻腳跑身體還健康。"},{"類":"回扣","文":"這個不在貪當中，真正的惡果在最後一個，在邪見當中。"}]},{"題":"好的東西，慢慢地沒有了","說":[{"類":"例","文":"果園主人拿不好看的自家水果待客，一嚐就比較出來；現在的果實看起來大，味道遠不如以前。"},{"類":"例","文":"《營養與素食》上也這麼說；師父印象最深的沈香，好東西慢慢、慢慢地沒有了。"}]}],"說":[{"類":"例","文":"住在高樓大廈舒服，還是在日月潭、溪頭的山林當中舒服？有個平房，前面種花草，早晨麻雀吱吱喳喳，人人都會選擇後者。"},{"類":"例","文":"交通方便，噪音、空氣染污受不了；一部車幾十萬，為賺那幾十萬不曉得花多少功夫，兩隻腳跑身體還健康。"},{"類":"回扣","文":"這個不在貪當中，真正的惡果在最後一個，在邪見當中。"},{"類":"例","文":"果園主人拿不好看的自家水果待客，一嚐就比較出來；現在的果實看起來大，味道遠不如以前。"},{"類":"例","文":"《營養與素食》上也這麼說；師父印象最深的沈香，好東西慢慢、慢慢地沒有了。"}],"af":"58a","st":85}],"逐字稿":[{"t":"58A 01:25","b":[["q","貪欲心者，謂一切盛事，經歷一一年時月日，漸漸衰微唯減無增。"],["s","凡是貪欲心重的，這種業因感得的果報是什麼？一切的好事情，慢慢、慢慢、慢慢當中都在衰退，都在衰退。這件事情現在是特別地厲害，特別地厲害！也許有人說：「怎麼，現在在進步，怎麼個特別厲害法？」我說的這個盛事，以一個特別的眼光去看，我們要了解的，譬如說你，現在我隨便講一個吧！好像現在有高樓大廈，以前沒有高樓大廈，我們現在大家閉上眼睛自己想一想看：請問你住在高樓大廈舒服，還是你跑到日月潭或者溪頭去，在那個山林當中感覺得舒服？我想我們人人都會選擇後者吧！不要說跑到溪頭那種遊樂場所去，請問你在高樓大廈舒服，還是你有個平房，啊！前面種一點花、草，後面有一點草皮，然後呢到了早晨，這個麻雀飛到你院裡吱吱喳喳地叫幾下，這種情況舒服，還是這個高樓大廈悶在這裡舒服呀？不是很明白嗎，不是很明白嗎？"]]},{"t":"58A 03:10","b":[["s","然後現在說：「哎呀，現在這個時候交通很方便哪！」交通是方便，這個道理已經講過很多次了，那個噪音、空氣的染污，你簡直受不了！然後呢，你同樣的要達到一個目的，你平常兩隻腳跑，什麼都不要，跑完了以後身體還來得個健康。現在你坐這一部車子，一部車子要幾十萬，你為了賺那個幾十萬，不曉得要花多少功夫，你花那個多少功夫，可以做很多事情耶！我們人還說進步了。是，當然我不能說它完全不對，可是你如果把兩者當中對比一下的話，這個很難說。但是這個不在貪當中，這個真正的惡果在最後一個，在邪見當中。"]]},{"t":"58A 03:59","b":[["s","真正的很多盛事是指什麼？我啊想起一件很有趣的事情來，以前說有一個農人，他自己種的水果，然後呢他自己種果園的。那麼有客人來了，他就接待他，他就拿出來接待那個客人的那個水果，那樣子都長得不好看，也沒有長得那麼大。那個客人心裡想：嗯，那個主人好像這麼小氣，他那個果園這麼豐收，怎麼給他這個東西吃啊？他心裡有點嘀咕。然後那個主人很慎重地跑上來，告訴他，一個是果園裡面長出來，另外一個叫他嚐一嚐。他開始的時候有一點懷疑，結果仔細一看，噢，兩個馬上比較得出來了。"]]},{"t":"58A 05:01","b":[["s","這個如果說你們不注意，不會了解。注意的話，你們看，現在那個果實看起來好像很大，實際上吃起來的味道，不如以前那個老的，遠不如、遠不如！他在那個什麼，《營養與素食》這本書上面，《營養與素食》這上面，你們如果粗心的話，根本分不出來。自從我看見了這個以後，後來我仔細地體會，這是千真萬確的事實。現在我們有太多東西，好的東西，慢慢地、慢慢地沒有了。我以前感受到的很多好東西，印象特別深的就是沈香，我跟你們說過幾次，這個不再提它。現在這個時候，那個盛事慢慢、慢慢、慢慢地在減少。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/015.mp3"},{"文":"瞋恚心者，謂多疫癘，災橫擾惱，怨敵驚怖，獅子虎等，蟒蛇蝮蠍，蚰蜒百足，毒暴藥叉諸惡賊等。","口譯":"瞋恚心的增上果，是多有瘟疫、災難橫禍的擾惱，怨敵驚怖，有獅子、老虎等猛獸，蟒蛇、蝮蛇、蠍子、蚰蜒、蜈蚣，毒暴的藥叉，以及各種惡賊等。","四家合註":"瞋恚心者，謂多疫癘，災橫擾惱，怨敵興戰，獅子、虎等，蟒蛇、蝮蠍、蟲火，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">師云：言蟲火者，即今之大蜘蛛也。其入於耳中，則敷青布於地，徐徐擊鼓，撢灑水等，以擬盛夏，輒從耳出。律中言此公案之時，即用蟲火一詞，故說即蜘蛛也。<\/span>毒暴藥叉、諸惡賊等。","合註白話":{"same":10},"覺燈日光":null,"時":"58A 05:50","頁":136,"af":"58a","st":350,"et":470,"消文":[{"類":"例","文":"外面是種種傷害我們的野獸，乃至很小的昆蟲；裡邊是疾病，像癌、愛滋病。"},{"類":"例","文":"有一種殺人蜂，叮一下人就送命，這就是瞋心增上。"}],"延伸":[{"題":"瞋恚心者","組":[{"題":"草都像刀一樣","說":[{"類":"例","文":"經上說瞋心增上，感到草都像刀一樣；師父早晨出坡拔草，一拔，一手都是血。"},{"類":"例","文":"翻書，書頁居然把手割破，不止一次；這是瞋心增上的士用果，這麼個嚴重法！"}]}],"說":[{"類":"例","文":"經上說瞋心增上，感到草都像刀一樣；師父早晨出坡拔草，一拔，一手都是血。"},{"類":"例","文":"翻書，書頁居然把手割破，不止一次；這是瞋心增上的士用果，這麼個嚴重法！"}],"af":"58a","st":412}],"逐字稿":[{"t":"58A 05:50","b":[["q","瞋恚心者，謂多疫癘，災橫擾惱，怨敵驚怖，獅子虎等，蟒蛇蝮蠍，蚰蜒百足，毒暴藥叉諸惡賊等。"],["s","哎呀，那個外面嘛，種種的傷害我們的這個野獸等等，乃至於很小的昆蟲；裡邊是疾病，現在有幾樣東西非常可怕的病，說癌，然後愛滋病，啊，那簡直是 ……這個裡邊的。外面還有各式各樣的，這種。乃至於說蜂，有一種蜂叫殺人蜂，那個蜂非常可怕，那個台灣還沒有，台灣那個虎頭蜂還不可怕，那個殺人蜂被它叮一下的話，那個人就要送命喔，這麼個厲害法！你看一個蜂，這個為什麼呢？這個就是瞋心增上。"]]},{"t":"58A 06:52","b":[["s","以前經上面說，當我們瞋心增上，慢慢地感到那個草啊都是像刀一樣，草都是像刀一樣。不曉得你們碰見過沒有？我自己親自碰見到，我以前還不相信，這個草怎麼像刀一樣呢？有一次，我們那時候剛開始的時候，每一個人都要出坡的。早晨去出坡的時候，拔草，一拔，哎呀，那個一手都是血，那個草邊上就把我的手指頭切碎掉，不曉得你們碰見過沒有？那我才親眼體會到。然後呢乃至於那個書，我還有好幾次，不止一次，那個翻翻書，那個書邊上的頁子，居然一下子把我那個手割碎掉了，不曉得你們有沒有碰見過？那是什麼？就是我們瞋心增上的，這個世間的士用果增上的結果。這麼個嚴重法！下面，最下面那個是最糟糕 ─邪見增上的，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/016.mp3"},{"文":"諸邪見者，謂器世間所有第一«勝妙生源悉皆隱沒»，","口譯":"邪見的增上果，是世界上最好、最能長養萬物的那些資源，全都消失不見；","四家合註":"諸邪見者，謂器世間所有<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">金礦等<\/span>第一勝妙生源悉皆隱沒，","合註白話":{"same":11},"覺燈日光":null,"時":"58A 07:50","頁":136,"af":"58a","st":470,"et":785,"消文":[{"文":"真正殊勝的、好的、滋長我們生命的東西，慢慢地沒有了。"}],"延伸":[{"題":"勝妙生源悉皆隱沒","組":[{"題":"貪心一轉盛，這個東西就沒有","說":[{"類":"例","文":"《起世因緣經》說，人從光音天下來，身有光明，不用吃東西；地上長出很美的東西，一吃好吃得不得了。"},{"類":"因","文":"貪心轉盛，地味就沒有；一積聚，自然香粳米也消失。貪心增上，邪見也在增上。"}]},{"題":"印度之窮，原因何在","說":[{"類":"例","文":"《大唐西域記》有供大人米；三百多年前的朝聖傳記說印度富庶，今天印度之窮無法想像，馬鈴薯小得一口可以吃三個。"},{"類":"下手","文":"去朝聖不要走馬看花，看看當地的行為、思想，就曉得原因何在。"}]},{"題":"講起道理來比誰都強","說":[{"類":"例","文":"不是誹謗人家，是藉境作借鏡：自稱遠東第一；兩車相撞，司機下車講道理，講了六個鐘頭沒講清楚。"},{"類":"破","文":"學佛的人講道理，是天下最可憐的；他不是不懂，叫世智聰辯，這都是邪見。"}]}],"說":[{"類":"例","文":"《起世因緣經》說，人從光音天下來，身有光明，不用吃東西；地上長出很美的東西，一吃好吃得不得了。"},{"類":"因","文":"貪心轉盛，地味就沒有；一積聚，自然香粳米也消失。貪心增上，邪見也在增上。"},{"類":"例","文":"《大唐西域記》有供大人米；三百多年前的朝聖傳記說印度富庶，今天印度之窮無法想像，馬鈴薯小得一口可以吃三個。"},{"類":"下手","文":"去朝聖不要走馬看花，看看當地的行為、思想，就曉得原因何在。"},{"類":"例","文":"不是誹謗人家，是藉境作借鏡：自稱遠東第一；兩車相撞，司機下車講道理，講了六個鐘頭沒講清楚。"},{"類":"破","文":"學佛的人講道理，是天下最可憐的；他不是不懂，叫世智聰辯，這都是邪見。"}],"af":"58a","st":470}],"逐字稿":[{"t":"58A 07:50","b":[["q","諸邪見者，謂器世間，所有第一勝妙生源悉皆隱沒，"],["s","這個真正的殊勝的、好的，這個滋長我們生命的東西，慢慢地沒有了。在那個《起世因緣經》上面，那個經上面，最早的時候說這個人來的時候，從光音天來的。他雖然已經從天上面下來了，但是身上還有光明，他也不要吃東西，也沒有男女的慾望，都沒有！欸，那個時候地上長一種非常、非常美的東西，然後呢大家有人偶然歡喜，這無始以來的習氣，他就一吃，哎呀，這個好吃得不得了！所以大家就吃，這樣。那個時候吃得好，就吃、吃、吃，後來那個貪心轉盛了，貪心一轉盛，這個東西就沒有。然後呢一次不同、一次不同地生。到後來那個地味有一種，那個不要的，你就拿出來就吃就好了，就這樣。那麼到後來，大家覺得貪心增長了，就把它積聚起來，等到你一積聚，這個東西就消失掉了。後來長那個自然香粳米，那不用種的，它自然長出來，那東西也非常好。反正都是這樣，當你這個貪心增上了，這個東西慢慢地、慢慢地消失掉了。同時貪心增上了，還有一點，邪見也在增上，這個東西一定。所以很多真正勝妙的東西，都消失掉了。"]]},{"t":"58A 09:23","b":[["s","我看見那個《大唐西域記》，奘大師到西域去的時候，還有那種叫供大人米，喔唷，這個米大得不得了！這樣。現在印度我去過好幾次，印度地方之窮啊你無法想像。我看過三百多年以前，有一個聖者的這個傳記，他到印度去朝聖，那時候還就說，哎呀，那個印度地方的富庶，怎麼怎麼富庶啊！就這樣。我這次跑過去的話，那印度地方之窮啊，那長出來那個洋芋，這個馬鈴薯這麼大，這麼大，它那個皮也不剝，也沒有辦法剝皮嘛，一口氣可以吃它三個吃進去。啊，這是為什麼原因？你如果仔細 ……將來你們如果說有機會去，不要說，哎呀，朝聖，馬馬虎虎，走馬看花，你去看看當地他們這種行為，他們那個思想什麼等等的話，你就曉得原因何在。"]]},{"t":"58A 10:22","b":[["s","喔唷！這印度有幾種典型的人，我們現在這裡不是隨便哪，不是輕易地誹謗人家，這個萬萬不可以！我們是藉人家的一個境來作為借鏡。他們有這個很有趣的習慣，他們總自稱為大，「喔唷，我這個 ……。」這個因為這個印度的確是個大國嘛，他常常說「這個東西，遠東第一」，他曉得這個比歐美是比不上的，就這樣。那我如果不從這裡過去的話，說不定聽了他們。他們常常告訴我：喔唷，這個遠東第一，它還外銷到哪裡去，蘇聯也用它，哪裡也用它。那我一想 ─哦，不是，亞洲第一 ─不要說跟日本絕對沒辦法比，那個臺灣、香港、韓國、新加坡，不曉得比它好多少，他說是他第一，這樣。真是有意思啊，那妙不可言！"]]},{"t":"58A 11:14","b":[["s","然後普通人有兩種人，一種人就是懶的人，一天到晚去討飯，辛辛苦苦討到了五毛錢，然後一個大餅吃飽了，睡在公園裡，躺在那裡睡大覺。幾個人碰在一塊兒的話，大家講道理，家家吵，這個印度典型的樣子；再不然是乞丐。這個講起道理來，印度人這個道理的話，哇，那上至議會，下至平常的，到什麼地方他就會吵。有一次，還有一個妙咧！那個大路上面，那個大公路上面兩輛對開，開的時候，這個車子一個不小心，出了一個小小的車禍，兩個車子撞上了。那撞上了以後，然後兩個司機下來就去講道理，結果他一講，講了六個鐘頭，就沒講清楚。欸，下面這些人哪，才妙咧！那他們去講他們的道理，他們就坐在那個車子裡悠哉悠哉的，有的人去玩去了。你說這你無法想像的，他不是說我趕快把那問題解決了，做他的事情，他就有這個閒功夫去講那個。"]]},{"t":"58A 12:21","b":[["s","說明了現在這個世間，但是他講起來他有道理喔！所以現在這個時候，我往往看見那些講道理的人，我一看見講道理，我就可憐他。所以學佛的人講道理的話，啊，我覺得這個是天下最可憐是莫過於學佛的人！不學佛的人講道理，他不懂嘛，本來愚癡。所以這種什麼？都是邪見。他不是不懂啊，所以叫世智聰辯。你說他沒有嗎？他有啊！喔唷，這個講起道理來比誰都強，就是這樣。對嗎？那就另外一回事情。這是第一個，「勝妙生源悉皆隱沒」。還有呢，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/017.mp3"},{"文":"«諸不淨物乍似清淨»，","口譯":"種種不清淨的東西，乍看好像很清淨；","四家合註":"諸不淨物乍似最勝清淨，","合註白話":{"same":11},"覺燈日光":null,"時":"58A 13:05","頁":136,"af":"58a","st":785,"et":844,"消文":[{"類":"例","文":"請問汽車清淨不清淨？在台北早晨出去，到了晚上手一抹，那個灰不用肥皂洗不乾淨。"},{"文":"汽車、洋房，就是這些事情。"}],"延伸":[],"逐字稿":[{"t":"58A 13:05","b":[["q","諸不淨物乍似清淨，"],["s","你們懂不懂這句話？明明是不清淨的。你這個不清淨不要看它，唉呀，一個垃圾的髒哦！那我們現在隨便舉一個例子，剛才說的，請問汽車清淨不清淨，清淨不清淨？你仔細想一想看你就曉得了。譬如說我住在這個地方，你三天不擦桌子，桌子上有灰塵，一抹，最多抹一抹，手一撣，撣掉了。我在台北，你只要到了晚上，早晨出去，到了晚上手上一抹的話，那個手上的灰，你不用肥皂洗，洗不乾淨的。我想你們都有這個經驗，為什麼，為什麼？那是外物的不清淨哦！然後實際上呢，的的確確的，我們現在這個汽車、洋房不曉得多多少少，喏，就是這些事情，就是這些事情。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/018.mp3"},{"文":"«諸苦惱物乍似安樂»，","口譯":"種種帶來苦惱的東西，乍看好像很安樂；","四家合註":"諸苦惱物乍似最勝安樂，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">總則<\/span>非<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">遮輪迴苦之<\/span>","合註白話":{"same":11},"覺燈日光":null,"時":"58A 14:04","頁":136,"af":"58a","st":844,"et":850,"消文":[{"文":"這個不但是不淨，而且是苦惱。"}],"延伸":[],"逐字稿":[{"t":"58A 14:04","b":[["q","諸苦惱物乍似安樂，"],["s","這個不但是不淨，而且是苦惱。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/019.mp3"},{"文":"非安居所，非救護所，非歸依所。","口譯":"其實並不是安穩居住之處，不是救護之處，也不是歸依之處。","四家合註":"安居所，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">別則<\/span>非<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">遮善趣損害之<\/span>救護所，<span>及<\/span>非<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">遮除其因──煩惱之<\/span>皈依所。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">意三不容有利他故，縱為菩薩，亦無開許之時。<\/span>","合註白話":{"same":11},"覺燈日光":null,"時":"58A 14:10","頁":136,"af":"58a","st":850,"et":1285,"消文":[{"文":"明明不是安居、不是救護、不是歸依，我們覺得是，這是邪見，就是我們顛倒。"},{"文":"汽車、洋房是最苦惱的事情，我們覺得是安樂，拼命去追求。"}],"延伸":[{"題":"非安居所，非救護所，非歸依所","組":[{"題":"金子做的枷鎖","說":[{"類":"例","文":"普通家庭沒有兩萬塊錢很難生活；師父每天兩個饅頭、一把鹽，就可以過日子。"},{"類":"喻","文":"要汽車洋房，賺二十萬也不一定夠；把金子做的枷鎖牢牢套在脖子上，還高興得要命，扛也扛不動。"}]},{"題":"這兩句話不要輕輕放過","說":[{"類":"例","文":"電視增長染污之業，牢牢牽著你的時間，將來把你送到惡道去。"},{"類":"立","文":"不淨之物乍似清淨，苦惱之物乍似安樂，關鍵在邪見增上，所以叫增上果。"}]},{"題":"這完全是個奴隸","說":[{"類":"例","文":"路上撿來的糞掃衣洗乾淨，又軟又好，小偷也不要，那是真正安樂。"},{"類":"破","文":"流行高領、矮領、高跟鞋，忙五天賺錢、兩天表演給人看，被牽著鼻子走，是這個東西的奴隸，邪見增上啊！"}]},{"題":"眾生的共業","說":[{"類":"因","文":"真正可怕的是共業：不在異熟、等流當中，而在士用，整個大環境都是這樣。"},{"類":"例","文":"你今天了解了，穿一件破衣服，人人眼睛瞪你，你也覺得好像不大對勁。"}]},{"題":"不要跟著前面這個錯誤的念頭轉","說":[{"類":"下手","文":"千萬不要當作笑話看；檢點自己，在起心動念當中檢察，從那個地方改過來。"}]},{"題":"自己創造自己的命運","說":[{"類":"回扣","文":"前面是黑業果的差別，三樣東西；下面是白業果，一定要好好弄清楚。"},{"類":"立","文":"弄清楚了才談得上真正修行；能不能自己創造命運，乃至跳出生死，基本概念都從這裡開始。"}]}],"說":[{"類":"例","文":"普通家庭沒有兩萬塊錢很難生活；師父每天兩個饅頭、一把鹽，就可以過日子。"},{"類":"喻","文":"要汽車洋房，賺二十萬也不一定夠；把金子做的枷鎖牢牢套在脖子上，還高興得要命，扛也扛不動。"},{"類":"例","文":"電視增長染污之業，牢牢牽著你的時間，將來把你送到惡道去。"},{"類":"立","文":"不淨之物乍似清淨，苦惱之物乍似安樂，關鍵在邪見增上，所以叫增上果。"},{"類":"例","文":"路上撿來的糞掃衣洗乾淨，又軟又好，小偷也不要，那是真正安樂。"},{"類":"破","文":"流行高領、矮領、高跟鞋，忙五天賺錢、兩天表演給人看，被牽著鼻子走，是這個東西的奴隸，邪見增上啊！"},{"類":"因","文":"真正可怕的是共業：不在異熟、等流當中，而在士用，整個大環境都是這樣。"},{"類":"例","文":"你今天了解了，穿一件破衣服，人人眼睛瞪你，你也覺得好像不大對勁。"},{"類":"下手","文":"千萬不要當作笑話看；檢點自己，在起心動念當中檢察，從那個地方改過來。"},{"類":"回扣","文":"前面是黑業果的差別，三樣東西；下面是白業果，一定要好好弄清楚。"},{"類":"立","文":"弄清楚了才談得上真正修行；能不能自己創造命運，乃至跳出生死，基本概念都從這裡開始。"}],"af":"58a","st":881}],"逐字稿":[{"t":"58A 14:10","b":[["q","非安居所，非救護所，非歸依所。"],["s","這明明不是安居、不是救護、不是歸依，我們覺得這是安居、這是救護、這是歸依。這個是什麼？邪見，就是我們顛倒，顛倒的關係。明明，唉呀，這個汽車、洋房是最苦惱的事情，但是我們覺得這個是安樂，拼命去追求。所以我現在總覺得這個世間的人的顛倒，世間真顛倒啊！"]]},{"t":"58A 14:41","b":[["s","以現在這個情況之下，普通一般的一個家庭，你沒有兩萬塊錢是很難生活。可是問我的話，我只要說我每天有兩個饅頭、一把鹽，大概可以過日子了。兩個饅頭多少錢？我也不知道。大概二十塊錢夠了吧！一個月要不了幾百塊錢，就這樣。如果說你能夠自己還省一點，這個都不要。這兩萬塊錢並不說好哦，如果你要汽車、洋房的話，賺了二十萬也不一定哦！請問你要賺那個二十萬，你得花多少功夫？我只要一點點，對不起，一天假如現在出去打一個工賺到了，我剩下來的都是我的，我要做什麼就可以做什麼。他們現在不是，就把那個金子做的枷鎖，牢牢地套在自己的脖子上面，自己還覺得高興得要命，拼命地扛也扛不動。現在世間人人都是如此，你們想想看對不對，想想看對不對？他要維持這個洋房，要維持這個車子，要維持這個電視，要維持這個 ……。"]]},{"t":"58A 15:48","b":[["s","所以那幾年以前人家說：「哎呀，法師你這裡沒有電視？」我想了半天，電視要它幹什麼，電視要它幹什麼啊？增長你的染污之業，然後呢要把你花這麼多的時間，眼前把你的時間，牢牢牽著鼻子牽在這裡，將來把你送到惡道去。覺得這個是好的東西 ─喏，是「不淨之物是乍似清淨，諸苦惱物是乍似安樂。」這兩句話不要輕輕放過喔！關鍵在哪裡？就是我們的邪見增上的關係，所以它叫增上果啊！這一點說起來很容易，你們要好好地多思惟、多觀察！"]]},{"t":"58A 16:41","b":[["s","就像我們平常，我想我們很容易體會得到的，很多小事情。就是說我們現在大家坐在這裡，穿一件衣服，啊，你馬路上撿來，那個出家人說什麼？這個叫糞掃衣。你馬路上面撿來了，然後洗洗乾淨，穿在身上，嗨，你來得個舒服，又軟哪、又好！新衣服還很硬，對不對？你買了一件新衣服，那個小偷來得了，他又看中了。你穿了這件衣服，送給小偷他也不要你，你在任何情況下，絕不要擔心，它有這麼大的好處啊！那個是真正安樂，但是我們卻偏偏不要，然後呢一定要這樣。"]]},{"t":"58A 17:21","b":[["s","當然我們有的時候說笑話，但是這個裡邊卻有它的特別的道理。人家常常說愛虛榮心的人，一下時興流行的，流行這個，平常我們往往歡喜譏笑，譬如說女性，實際上男女皆然，沒有一個例外的。為了加強我們這個概念起見，我們不妨這樣說一下。說，一下時興那個高領子了，啊，那個領子，那個脖子擺在那裡真難受；一下那個矮領子，這麼一點點；一下那個敞了，一下又是高跟鞋，一下又是那個東西。嗨，你簡直是，你不曉得是怎麼一回事情！他還覺得很得意。"]]},{"t":"58A 18:02","b":[["s","實際上呢他自己被這個東西在牽著鼻子走，你們有沒有注意到這件事情？他最舒服的什麼？最舒服的就是那件糞掃衣，就是軟趴趴地穿在身上，然後坐在家裡，躺在沙發上面，最快樂是莫過於此。欸，他就偏偏要忙了個半天，一個禮拜至少到忙它五天，然後賺那個錢來，然後自己就受那個罪。一下子變成這樣，一下子變成這樣，一下子變成那樣。然後回來以後又馬上弄髒了，洗洗乾淨、燙燙好，掛在那個地方，下面出去的還要表演給人家看，那多可憐！忙了五天去賺這個錢，還有最後這兩天，然後最後兩天呢去幹什麼？去表演給人家去看。表演給人家看什麼？還是被人家牽著鼻子走。對不對？他一點點自己就做不得主，這完全是個奴隸！什麼奴隸？就是這個東西的奴隸。這什麼？邪見增上啊！"]]},{"t":"58A 19:02","b":[["s","但這個地方真正可怕的，因為是眾生的共業，所以它不在什麼？不在前面的異熟、等流當中，而就士用，整個的大環境都是這樣。儘管你今天了解了，你說了解了，你在這個圈子當中，你就穿一件破爛衣服，人人眼睛這麼瞪你，你也覺得：怎麼搞的，好像不大對勁。這個情況，這個地方我們真正要了解的。所以千萬不要把這個當作笑話看，當作笑話看太可惜了！我從這個地方，你們自己想你們的法則，然後檢點自己。檢點了自己，就在那個起心動念當中檢察自己，說：不要跟著前面這個錯誤的念頭轉，要那個地方開始改過來，要從這個地方改過來。"]]},{"t":"58A 19:57","b":[["s","那麼這個前面是關於這一部分，關於前面這一部分，業─這個果的這個第一部分。現在我們先把它看一看這個什麼。所謂思惟這個 ……看看前面那個什麼？總業果，分別思惟當中，抉擇這個業果當中的說明，說明這個業果的差別，說明業果的差別，這個是黑業的業果的差別，三樣東西。那麼再下面呢就講白業，白業果。關於這個方面除了我講以外，你們一定要好好地下去，好好地把它弄清楚。這個弄清楚了以後，我們再進一步才談得上真正地修行。或者應該更正確一點地來說，真正地你們能不能說，自己創造自己的命運，乃至於跳出生死，基本的概念都在這個地方開始，都在這地方開始。下面是「思惟白業果」，上面是黑業。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-11/020.mp3"}],"投影片":[{"img":"投影片/shenxin-yeguo-11/001.webp","n":1},{"img":"投影片/shenxin-yeguo-11/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/shenxin-yeguo-11/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/shenxin-yeguo-11/004.webp","n":4},{"img":"投影片/shenxin-yeguo-11/005.webp","n":5},{"img":
