photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-13/034.webp","n":37,"yt":"E1qFpq1i0fY"},{"img":"投影片/shenxin-yeguo-13/035.webp","n":38}],"投影片PDF":"投影片/shenxin-yeguo-13/slides.pdf","音檔範圍":"59A 03:07～59B 02:10"},"shenxin-yeguo-14":{"id":"shenxin-yeguo-14","標題":"深信業果(十四)","根":"思別業果","科判焦點":"壬二 思別業果","課本範圍":"P139 LL3 ~ P140 完","堂數":74,"日期":"2026/7/28","分圖":[{"名":"思惟別・勝所依","原文":[0,1]},{"名":"異熟功德八種","原文":[2,9]},{"名":"異熟果報八種","原文":[10,17]}],"跨科判":null,"週":97,"班級":"24秋007","序":null,"音檔":{"59b":{"local":"音檔/gl1/059B.mp3","remote":"https://lamrim.xyz/player/media/gl1/059B.mp3"},"60a":{"local":"音檔/gl1/060A.mp3","remote":"https://lamrim.xyz/player/media/gl1/060A.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=59b&st1=130&af2=60a&et2=455","段":[{"文":"第二«思惟別者»。","口譯":"第二，個別思惟（業果）。","四家合註":"<span>第二、思惟別<\/span><span class=\"sjan sj-miao\">，<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">分二：第一、須成辦圓具德相所依身之理<\/span><span>者：<\/span>","合註白話":{"id":"17254","頁":476,"白話":"第一科分為八項：一、壽命圓滿：是指藉由過去的引業而引生長壽，並且能如所引那般長久地活在世上。二、色澤圓滿：是指膚色及身形美妙，因此體態美好；五官沒有缺陷，因此人見人愛；體型勻稱適中，所以端正莊嚴。三、家世圓滿：是指出身於世人崇敬的名門貴族。四、自在圓滿：是指財力雄厚，具有親戚等廣大宗族，眷屬眾多。五、言辭威信：是指行為、言語不會誆騙他人，堪受信賴；對一切爭議的仲裁都足以作為準則，因此眾多有情都尊奉他的話語。六、威望遠播：是指對於布施具有勇悍、精進等功德，因而具有極高的聲望，美譽遠揚，由此成為廣大群眾供養的對象。七、男性：是指具足男根。八、具足力量：是指藉由過去的業力，成辦自己與他人的事業和工作，不會太辛勞，自然少有侵害，疾病不生，以及具有由今生的因緣所引發的大歡喜。這是由於今生自己先前所做一切都已成辦，因此心想：「無論我再做什麼，也都會成功。」自己會非常踴躍歡喜。另外，處在善趣是第一項，身軀是第二項，出生為第三項，受用與眷屬是第四項，第五項是世間的準則，第六項是他的名望，第七項是一切功德之器，第八項則是有能力承擔眾多事務。","注釋":["一壽量圓滿者：此中之小數字於福智之聲出版社2003、2010年版《廣論》皆如原文作大字，然查藏文並無此字，於《四家合註》原文中乃有，蓋為令讀者易於閱讀，故增之，然實非原文，故改作小字。下文亦同。","身形：法尊法師原譯作「顏容」，係依玄奘大師譯《瑜伽師地論》文譯出，今據藏文改譯。","言辭威信：法尊法師原譯作「信言圓滿」，係依玄奘大師譯《瑜伽師地論》文譯出，今據藏文改譯。","信委：相信、信任。","謂於惠施具足勇健精進等德由是獲得廣大稱譽復由此緣：法尊法師原譯作「有大名稱，有大美譽，謂於惠施具足勇健、精進等德；由此因緣」，蓋取玄奘大師譯《瑜伽師地論》文譯出，今據藏文改譯。","劬勞：勞苦。劬，音「衢」，指勤勞。","為性少惱：法尊法師原譯作「為性少病」，今據藏文改譯。此處「惱」作「惱害」解。","由現法緣起大勇悍：勇悍，藏文直譯為歡喜踴躍。法尊法師原譯作「於現法緣起大勇悍」，今據藏文改譯。"],"已校":true},"覺燈日光":null,"時":"59B 02:10","頁":139,"af":"59b","st":130,"et":292,"消文":[{"文":"對整個業感果的道理了解了；這裡告訴我們「思惟別者」——在整個佛法的中心當中，我們特別需要的那一部分。"}],"延伸":[{"題":"思惟別者","組":[{"題":"了解業果，找到下腳處","說":[{"類":"回扣","文":"為什麼學這個？了解世間的究竟狀態是苦，唯一救濟是三寶，所以歸依佛陀；佛陀能救護我們的原因，原來就在這個上頭。"},{"類":"立","文":"認識清楚了再進一步問：我應該怎麼做，才能生生增進、達到圓滿佛地？——「這個就是你要的」，我要下腳的地方。"}]},{"題":"次第嚴密，步步上升","說":[{"類":"立","文":"一方面了解整個，一方面了解進入的次第，走進去步步上升；層次安排這麼嚴密。"},{"類":"回扣","文":"前面說本論包含一切佛語、兩大傳承，而且次第按照調心的方法安排得這麼好。"},{"類":"立","文":"我們要遠離苦、得到樂，曉得了苦因樂因、如此因感如此果，下面就說怎麼辦。"}]}],"說":[{"類":"回扣","文":"為什麼學這個？了解世間的究竟狀態是苦，唯一救濟是三寶，所以歸依佛陀；佛陀能救護我們的原因，原來就在這個上頭。"},{"類":"立","文":"認識清楚了再進一步問：我應該怎麼做，才能生生增進、達到圓滿佛地？——「這個就是你要的」，我要下腳的地方。"},{"類":"立","文":"一方面了解整個，一方面了解進入的次第，走進去步步上升；層次安排這麼嚴密。"},{"類":"回扣","文":"前面說本論包含一切佛語、兩大傳承，而且次第按照調心的方法安排得這麼好。"},{"類":"立","文":"我們要遠離苦、得到樂，曉得了苦因樂因、如此因感如此果，下面就說怎麼辦。"}],"af":"59b","st":130}],"逐字稿":[{"t":"59B 02:10","b":[["q","第二思惟別者。"],["s","說我們現在對於整個的由業感果的道理是了解了，那麼我們為什麼要來學這個呢？那麼我們現在了解，回想到是因為我們了解世間的痛苦，世間的究竟狀態就是一個苦；說唯一的救濟就是三寶，說佛陀，所以於是歸依佛陀。而歸依了佛陀他所以能夠救護我們的原因，原來在這個上頭，你結果找到了，那麼這個道理也各別地認識清楚了。認識了清楚了，下面你又進一步說：「對！那麼在這個情況裡面，我了解了，我應該怎麼做才使得我生生增進，而能夠達到圓滿佛地呢？這一個特點在什麼地方呢？」所以這個地方現在告訴我們「思惟別者」，喏，這個就是你要的，這個就是你要的！在這一個整個的佛法的中心當中，我們特別需要的哪一部分？這裡。這個是思惟別的意思。"]]},{"t":"59B 03:35","b":[["s","所以，換句話說等到你把整個的問題弄清楚了以後，現在在這個問題當中，那就是我要的，我要下腳的那個地方。一方面你了解了這個整個，一方面你了解了進入的次第，然後你走進去的話是步步上升，了解嗎？所以這個他這個層次的安排這麼個嚴密。所以他前面告訴我們，這裡不但說明的時候是把一切的佛語都在裡頭；而且傳承下來的兩個主要的主流；不但如此，而且他這個次第是按照著我們調心的方法，所以他每一個部分就給我們安排得這麼好。所以現在我們進一步怎麼辦？說不是我們要遠離苦、得到樂嗎？那曉得了，什麼是苦的因，什麼是樂的因，如此的因感如此的果，那麼我們現在曉得了。所以由這個地方說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/001.mp3"},{"文":"謂由遠離十種不善，雖定能獲善妙所依，然若成一圓具德相，能修種智，«勝所依»者，修道進程，非餘能比，故應成辦如此所依。此中分三：一異熟功德，二異熟果報，三«異熟因緣»。","口譯":"不做十種惡業，雖然一定能得到好的人天身，但如果能得到一個條件圓滿具足、能修成佛智慧的殊勝人身，修行進步的速度是其他身體比不上的，所以應該去成就這樣的人身。這裡分三點：一、這種身體有哪些好的條件；二、這些條件有什麼作用；三、要種什麼因才能得到。","四家合註":"謂由遠離十種不善，雖定能獲善妙所依，然若成一圓具德相，能修種智勝所依者，修道進程非餘能比，故應成辦如此所依。<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-yu\">先輩諸師云：「相順之地為修習之處，正士為助伴，福德為因，善願為自性。」<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、於彼所依身因修學之理，<\/span><span>此中分三：<\/span><span>一、<\/span><span>異熟功德<\/span><span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-ba\">謂下文所言八者別別體性<\/span><span>；<\/span><span>二、<\/span><span>異熟果報<\/span><span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-ba\">謂彼八者作業<\/span><span>；<\/span><span>三、<\/span><span>異熟因緣<\/span><span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-ba\">謂出生彼八者之因<\/span><span>。<\/span>","合註白話":{"id":"17172","頁":473,"白話":"第二科、分別思惟，分為二科：第一科、必須成就條件俱全的所依身的道理：藉由遠離十種不善，雖然也能獲得很好的所依身，但是如果成就一個條件俱全、能夠修成一切相智的所依身，那麼修道的進程將會與其他迥然不同，所以應當成就這種所依身。前輩上師們曾說：「合適的環境是修持的處所，殊勝士夫是友伴，福德是因，善願則是本性。」第二科、學習此所依身之因的方法，這分為三科：一、異熟的功德，是指下文提到那八者各自的體性；二、異熟的果報，是指那八者的作業；三、異熟的因，是指產生那八者的起因。","注釋":["第二思惟別者：即前頁316「思別業果」一科。","種智：佛陀有三智：一切智、道智、一切相智，此指一切相智，又名一切種智。《大智度論》云：「所謂禪定、智慧等諸法，佛盡知諸法總相、別相故，名為一切種智。」妙音笑大師《八事七十義》云：「於一剎那頃無餘現前證知如所有、盡所有相之究竟智，是一切相智的性相。」「以現證三道無諦實的智慧所攝之大乘聖者現觀，是道智的性相。」「由現證一切事無我的那一分而安立的住於小乘證類的聖者相續之智，是一切智的性相。」見《大正藏》冊25，頁259；《七十義、地道、宗義合刊》，頁2（妙音笑大師著，印度：哲蚌果芒圖書館，2005）。","相順之地為修習之處正士為助伴福德為因善願為自性：這四者即是大乘四輪。《龍樹菩薩為禪陀迦王說法要偈》云：「生處中國遇善友，專念發心起正願，久殖功德具諸根，王今滿足此眾善。」《勸發諸王要偈》云：「得生有道國，遭遇善知識，正見心成就，宿命有功德，四寶輪具足，能出生死路。」《龍樹菩薩勸誡王頌》云：「生中依善友，及發於正願，先身為福業，四大輪全獲。」善慧摩尼大師依據此論解釋，大乘四輪分別為：住在合適的環境、依止正士夫善知識、具足發下善願的智慧、具足過去累積的福德。住在合適的環境，如《廣論》云：「住具五德之處：一、易於獲得，謂無大劬勞得衣食等。二、處所賢善，謂無猛獸等兇惡眾生，及無怨等之所居住。三、地土賢善，謂非引生疾病之地。四、伴友賢善，謂具良友戒見相同。五、具善妙相，謂日無多人夜靜聲寂。如《莊嚴經論》云：『具慧修行處，易得賢善處，善地及善友，瑜伽安樂具。』」依止正士夫善知識，是指依止大乘善知識與善友。發下善願的智慧，一般而言，是指專注於正法，尤其是專注於菩提道次第，因為如果能發願獲得來世的利益、解脫乃至無上菩提，是沒有較此更為殊勝的願境。與此相反，如果只發願得到現世的安樂，即是此處的惡願。具足過去累積的福德，是指具足過去累積的廣大福德，如果不具足福德，即使具備了前三種順緣，也無法產生想要修行正法的心，就算修行正法，也會被障礙；如果具足福德，修行正法時不會有障礙，即使出現障礙，也無法造成阻礙。自己不前往聚落，住在寂靜處，以及借給別人住處等等，是能住在合適的環境的因。如理依止自己的上師；對於自己尚未求法，但是對方具足堪為上師的功德者，也同樣如理依止；任作何善，最後都回向成為得到大乘善知識攝受的因，是依止正士夫善知識的因。自己努力聞思修清淨的正法，也透過講說、辯論、著述盡力弘揚，反覆串習想要修行清淨正法的欲求心，是具足發下善願的智慧的因。長時修行清淨的正法，無論行住坐臥，都時常作意：「我如果能夠累積廣大的福德與智慧資糧，該有多好。」這是具足過去累積的福德的因。參見《大正藏》冊32，頁746、749、752；《廣論》，頁346；《洛桑諾布文集》冊2，頁514。"],"已校":true},"覺燈日光":null,"時":"59B 04:52","頁":139,"af":"59b","st":292,"et":1073,"消文":[{"文":"遠離十惡、修十善，一定可以獲得「善妙所依」的人身，所謂暇滿人身。"},{"類":"例","文":"同樣得人身、進入佛法：有的人腦筋好、智慧相應；有的腦筋好卻世智聰辯，走上錯路；有的腦筋好身體不好，有的兩樣都好。"},{"文":"分成三：這樣的異熟報體有哪些優越條件（功德）；有什麼功效作用（果報）；要什麼因緣才得到（因緣）。"}],"延伸":[{"題":"勝所依","組":[{"題":"圓成佛道，差一點都不行","說":[{"類":"立","文":"得到了人身，是不是圓滿具足？還不是；要圓成無上佛道，差一點都不行。"},{"類":"立","文":"能修種智——從道種智到一切智——必然要依靠最好的「勝所依」。"},{"類":"破","文":"得不到的話，雖然也是人身，做起來非常非常慢；過程一慢，外面種種障礙，一不小心又走錯了。"}]},{"題":"修道工具要最好","說":[{"類":"喻","文":"要到遠地去，不但要知道怎麼去，還要最好的交通工具：坐船幾個月，碰到颱風、戰亂都不知道；坐飛機一天就到，還要挑安全的航空公司。"},{"類":"立","文":"做任何事都這樣，何況修學佛法：要努力把修學佛法所用的工具，具足最美妙完整的。"}]}],"說":[{"類":"立","文":"得到了人身，是不是圓滿具足？還不是；要圓成無上佛道，差一點都不行。"},{"類":"立","文":"能修種智——從道種智到一切智——必然要依靠最好的「勝所依」。"},{"類":"破","文":"得不到的話，雖然也是人身，做起來非常非常慢；過程一慢，外面種種障礙，一不小心又走錯了。"},{"類":"喻","文":"要到遠地去，不但要知道怎麼去，還要最好的交通工具：坐船幾個月，碰到颱風、戰亂都不知道；坐飛機一天就到，還要挑安全的航空公司。"},{"類":"立","文":"做任何事都這樣，何況修學佛法：要努力把修學佛法所用的工具，具足最美妙完整的。"}],"af":"59b","st":372},{"題":"異熟因緣","組":[{"題":"神通是如理修持的果","說":[{"類":"破","文":"世間亂象多，這裡神神怪怪、那裡神神怪怪，佛法裡也有；自己把握不住原則，一聽就心動。"},{"類":"立","文":"佛法講不講神通？絕對講！但神通是如理如法修持的必然結果；我們真正要求的是因，因地起心動念每一念相應，身口相應，自然感得。"}]},{"題":"四十二章經：持戒渴死者先見佛","說":[{"類":"例","文":"兩人遠道要去見佛，半路天旱，只有牛尾塘一點水，滿是小蟲。"},{"類":"例","文":"一人說：見佛就是要照佛說的做，寧可渴死也不喝——持佛戒馬上生天，化生後立刻去見佛。"},{"類":"例","文":"另一人喝了水，辛苦跑到佛前；佛說：「你這癡人！以為見到我啦？去佛千里。」旁邊那位清秀豐潤的，就是渴死的朋友。"}]},{"題":"莫急，補聽本論","說":[{"類":"破","文":"千萬不要看人有一點神通就跟著他；見到了佛，佛尚且說你這個癡人。"},{"類":"下手","文":"這一點都急不來；有同修說業障重要懺悔、要念佛，師父叫他好好把本論前面補聽，每個道理都告訴我們了。"}]},{"題":"不離如此因，如此果","說":[{"類":"回扣","文":"昨天講修行的關鍵在等流心識上面；有人問念佛、參禪的人可沒講這個——黑板上各種用功方法，自己先想一想怎麼融貫各宗。"},{"類":"立","文":"總之不離開如此因、如此果：只了解世間因果法則，可以在六道上升；更進一步第一義諦，可以跳出輪迴。"}]}],"說":[{"類":"破","文":"世間亂象多，這裡神神怪怪、那裡神神怪怪，佛法裡也有；自己把握不住原則，一聽就心動。"},{"類":"立","文":"佛法講不講神通？絕對講！但神通是如理如法修持的必然結果；我們真正要求的是因，因地起心動念每一念相應，身口相應，自然感得。"},{"類":"例","文":"兩人遠道要去見佛，半路天旱，只有牛尾塘一點水，滿是小蟲。"},{"類":"例","文":"一人說：見佛就是要照佛說的做，寧可渴死也不喝——持佛戒馬上生天，化生後立刻去見佛。"},{"類":"例","文":"另一人喝了水，辛苦跑到佛前；佛說：「你這癡人！以為見到我啦？去佛千里。」旁邊那位清秀豐潤的，就是渴死的朋友。"},{"類":"破","文":"千萬不要看人有一點神通就跟著他；見到了佛，佛尚且說你這個癡人。"},{"類":"下手","文":"這一點都急不來；有同修說業障重要懺悔、要念佛，師父叫他好好把本論前面補聽，每個道理都告訴我們了。"},{"類":"回扣","文":"昨天講修行的關鍵在等流心識上面；有人問念佛、參禪的人可沒講這個——黑板上各種用功方法，自己先想一想怎麼融貫各宗。"},{"類":"立","文":"總之不離開如此因、如此果：只了解世間因果法則，可以在六道上升；更進一步第一義諦，可以跳出輪迴。"}],"af":"59b","st":606}],"逐字稿":[{"t":"59B 04:52","b":[["q","謂由遠離十種不善，雖定能獲善妙所依，然若成一圓具德相，能修種智，勝所依者，修道進程，非餘能比，故應成辦如此所依。此中分三：一異熟功德，二異熟果報，三異熟因緣。"],["s","欸，說我們是的，你能夠遠離了這個十惡，修這個十善，是！一定可以獲得這個「妙善所依」的人身，所謂暇滿人身。那麼但是呢，在這個暇滿的人身當中還是有所差別。就我們眼前來看，同樣得到人身，所謂暇滿的話同樣進入佛法，結果有的人腦筋非常好，而且智慧也相應。有的人腦筋雖然好，欸，卻是世智聰辯，他腦筋害了，好了個半天，結果走上錯路，腦筋不好不談。有很多人他腦筋雖然好，那身體又不好，有很多人不但腦筋好，身體也好。它每一個地方，就有不同的地方嘛！"]]},{"t":"59B 06:12","b":[["s","那麼這個原因在哪裡呢？換句話說，他雖然得到了，是不是圓滿具足？這個還不是。要曉得，要想圓成無上佛道，這一個差一點都不行啊！所以說，要想能夠有一個圓具各種德相，能修無上佛道，「種智」，這個種智就是所謂從道種智到一切智，也可以說拿一切智 ─佛的智慧，是必然要依靠什麼？最好的「勝所依者」。否則的話呢，你得不到這個，雖然也得到的人身，但是做起來是非常、非常地慢，非常、非常地慢。不但是慢，那麼還有因為慢的過程，所以這個時候外面有各式各樣的障礙什麼等等，一個不小心，又走出錯了！"]]},{"t":"59B 07:18","b":[["s","所以在這個地方告訴我們，我們真正要修學佛法的人，應該努力地怎麼樣把修學佛法所使用的工具，具足最美妙完整的。就像我們現在舉個比喻，說我們現在要到遠地去，要到遠地去。譬如說要去印度朝聖，然後呢要去到哪裡去啊，說到美國去。那個時候你不但要認識怎麼去法，而且要最好的交通工具。你坐船是不是可以？當然可以，一坐坐上幾個月，欸，坐飛機一天就到。然後呢，你坐船坐幾個月的話，跑到那海裡面，什麼時候碰見颱風你也不知道，啊！那東西非常麻煩。尤其是現在那個時候世界是戰亂，你不曉得這幾個月當中發生了什麼事情啊，有種種的不如意地方。所以一定要找說這個最好，不但找了飛機，這個飛機你還要看看這家航空公司，它非常安全，這家航空公司老出毛病。對不對？我們做任何一件事情都是這樣，何況現在是修學佛法。那麼在這種情況之下，我們要想得到這樣的這個圓滿具足一切修持德相的人身應該是什麼？這個是我們特別應該了解的，所以這幾個地方就告訴我們這個。"]]},{"t":"59B 09:09","b":[["s","它又分成三：異熟功德，異熟果報，異熟因緣。說，你現在要得到的這樣的一個異熟的報體，就是我們現在的這個緣，暇滿的人身，這應該有些什麼內容？這個內容換句話 ─功德，有什麼、哪幾個優越的好的條件？那麼這個優越的條件，第二呢，它有什麼樣的功效？能夠產生什麼樣的作用？第三個，你要得到這樣的一個異熟的圓滿的報體，要有什麼樣的因緣？那麼我們了解了，為了求這樣的一個暇滿的人身，我們在因地當中這樣去努力，自然你一定得到這個果報，這個觀念我們首先要建立。"]]},{"t":"59B 10:06","b":[["s","現在我常常聽見人家講，尤其是現在這個時候，這個世界、世間上面好多亂的現象。常常有的人，哎呀，這個地方神神怪怪，那個地方神神怪怪，不要說是外道，就是佛法當中也有很多神神怪怪的事情。我們往往自己把握不住原則，聽見了這個，噢喲，就被它心動了。佛法裡邊講不講神通？講，絕對講！但是神通是什麼？你如理如法修持的必然結果，這是果啊！我們真正要求的是應該求什麼？喏，這個因在哪裡，了解了，然後我們在因地當中起心動念當中，每一念相應，由於這個心念，然後身口相應，自然你會感得這個。如果你不了解這一點去做的話，那對不起，沒有用、沒有用！不要說眼前那些小小的一點鬼通、一點感應，一點用場都沒有。佛在世的時候，非常清楚、非常明白，佛在這地方，很多去親近佛的人他沒有得到好處耶！不要說提婆達多等等，《四十二章經》當中兩個公案，你們牢牢地記住！這個地方再說一遍，這個公案的內涵。"]]},{"t":"59B 11:46","b":[["s","兩個住在遠地的人聽見了佛以後，要去見佛。然後跑到半路上面，天旱，沒有水喝。我們一天沒飯吃可以，一天沒水喝就很難受，兩三天不一定餓得死，可是沒有水喝的話就渴死了。結果跑到半路上面，看見有一個「牛尾塘」，換句話說那個牛踩著那個田凹下去一點點水。那麼兩個人看見，哎呀，看見了水不管髒不髒，只要水就喝，結果裡面都是小蟲，你怎麼弄也沒辦法把那個小蟲拿掉。"]]},{"t":"59B 12:32","b":[["s","一個人一看，說：「不行、不行！我們既然要去見佛，佛告訴我們，我們要怎麼做。」佛告訴我們，你要想求學佛法，譬如我們就皈依佛，皈依了佛以後就照著佛的道理做。以前我們不懂容或會犯這個毛病，現在懂得了。你為什麼皈依佛啊？要脫苦、要得樂嘛！這皈依了佛怎麼才能夠脫苦、離苦得樂？欸，他告訴你的辦法如法行持嘛！這樣。所以從前者，然後呢我們在世間的一切，六道當中選擇，唯有佛是我們的皈依處，等到你皈依了佛以後才了解，原來皈依佛的正皈依的是法，那麼要照著法去做，那個才是。"]]},{"t":"59B 13:25","b":[["s","你正確地了解了，這個人他就了解的，所以說：「欸，佛，我們要去見佛的目的是在這裡，既然佛告訴我們的行持的方法這樣的話，對不起！今天渴死了，我要照著它去做。」另外一個人就說：「你這個人真傻，你見不到佛有什麼用？我們先喝了水，然後見到了佛，問題不是就好了嗎？」結果一個人堅持不喝那個水，一個人就喝了，不喝那個人馬上就渴死掉了。要我們世間的人想起來這個人真傻。嘿！結果他因為持了佛戒馬上生天，一生天，天人他有幾個特質，他曉得：哦，我宿生什麼因緣來到這裡。而且他確定曉得他這一生成了天人，這個天人的特質，他是化生的 ─原來這樣因緣。啊！他馬上就去見佛，見到了佛了。"]]},{"t":"59B 14:21","b":[["s","另外一個人呢？喝了水，然後辛辛苦苦又跑了很長一段時候，見到了佛。佛當然曉得這件事情囉！所以就故意問他：「哎呀，你遠道而來很辛苦，你哪裡來啊？」這個人又是一肚子委屈那個心情，報告那個佛如此這般，那麼就有兩個人 ……。然後佛怎麼說？「你這個癡人！你以為見到我啦！去佛千里，你看看旁邊那個人。」他站在旁邊，果然看見一個人，看見這個人面孔很熟，可是這個人長得非常清秀、非常豐潤，年紀輕得不得了，這人間少見、見不到。正在懷疑，佛跟他說：「喏！就是跟你一起來餓死的那個朋友，他因為持佛淨戒馬上餓死，結果呢得到了這個。你見到我有什麼用呢？」"]]},{"t":"59B 15:19","b":[["s","所以現在我們千萬不要，哎喲，這個人有一點神通，又有人什麼樣子，你跟著他。這個神通能比得上佛嗎？見到了佛，佛尚且說你這個癡人，你有什麼用！所以我們真正要學佛法，必定要從這一個地方去認識啊！了解不了解？所以這個一點都急不來的，大家萬萬不要急，萬萬不要急，你一定要把握得住這個。昨天下午還有一個同修問我說：「唉呀，我現在業障很重，我要懺悔，唉呀，我要念佛 ……。」我就告訴他，那麼你好好地把那個本論前面補聽，他自然每個道理都告訴我們，這是佛的最圓滿的教法呀！這一點我們根本需要認識的。"]]},{"t":"59B 16:05","b":[["s","所以在這個地方我們曉得，你要得到這樣的果，那麼因地上面應該如何下手。昨天講的是最重要的東西已經說過了，在這個地方今天重提一下。那為什麼要重提呢？昨天我講整個的修行的關鍵，就在那個等流心識上面，那有人問我了：「欸，那人家念佛的人他可沒講那個，參禪的人沒講這個。」是啊！有很多人說：啊！你不要去妄分別，他可沒講這個，這個話怎麼講？你們現在細細想一想，我把黑板上那個一般用功的方法都在這裡，這個概念先擺在這裡，你自己想一想。現在不必想，先看一下，然後呢，你下課的幾分鐘想一想，或者今天告訴你，或者明天告訴你。如果說你能夠想得自己想通了，那最好！那時候一補的話，你自己就曉得怎麼融貫各宗各派，任何一家用功的方法，否則的話，到那時候再告訴你關鍵何在。"]]},{"t":"59B 17:13","b":[["s","總之一句話 ─不離開如此因、如此果，造這樣的業因感這樣的業果。如果說你只了解這個世間因果的法則，那麼在六道當中可以上升；如果你更進一步第一義諦的話，可以跳出輪迴，還不外乎這一個。現在我們看，第一個，就是異熟的功德，這種的異熟就是這一種的果報體，有什麼樣的殊勝的、優越的條件。那麼這裡又分八："]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/002.mp3"},{"文":"初中分八。一壽量圓滿者，謂宿能引牽引長壽，如其所引，長壽久住。","口譯":"第一點（好的條件）有八種。第一，壽命圓滿：過去的業決定了長壽，就照那樣長長久久地活著。","四家合註":"<span>初中分八：<\/span><span>一、<\/span><span>壽量圓滿者：<\/span>謂宿能引牽引長壽，如其所引，長壽久住。","合註白話":{"same":0},"覺燈日光":null,"時":"59B 17:53","頁":139,"af":"59b","st":1073,"et":1148,"消文":[{"文":"需要長壽，因為宿生造的是長壽的業。"},{"類":"例","文":"十幾歲開始學，學十年、十五年到三十歲，壽命只有二十歲，一點用場都沒有；剛修出一點樣子就完了。"},{"文":"單單壽量夠不夠？不夠：壽長卻一天到晚造惡業，壽越長惡業越大，所以還要其他條件。"}],"延伸":[],"逐字稿":[{"t":"59B 17:53","b":[["q","初中分八。一壽量圓滿者，"],["s","說：一、這種人他的壽量圓滿。"]]},{"t":"59B 18:03","b":[["q","謂宿能引牽引長壽，如其所引，長壽久住。"],["s","第一個，需要長壽，需要長壽，因為他宿生造的這個業是一個長壽的業。為什麼要長壽啊？那我們現在修習佛法，小的時候不行，你到了十幾歲開始可以學。學它個十年、十五年到了三十歲。對不起！你的壽命只有二十歲，嘿，一點用場都沒有。就算你三十歲，剛學會要開始修了，不行；就算你三十五歲，修了又有一點樣子，完了！他壽量一定要圓滿，這個是第一個重要。不過單單那個壽量夠不夠？不夠，壽雖然長，但是你偏偏一天到晚造惡業，結果你那個壽越長，是惡業越大，是越倒楣。所以還要其他的條件，下面一樣一樣說。第二："]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/003.mp3"},{"文":"二形色圓滿者，謂由形色顯色善故，顏容殊妙，根無闕故，眾所樂見，橫豎稱故，形量端嚴。","口譯":"二、形色圓滿：由於形色、顯色都好，所以容貌殊妙；由於諸根沒有缺損，所以大眾樂於見到；由於身材橫豎相稱，所以形量端正莊嚴。","四家合註":"<span>二、<\/span><span>形色圓滿者：<\/span>謂由形色、顯色善故，身形殊妙；根無闕故，眾所樂見；橫豎稱故，形量端嚴。","合註白話":{"same":0},"覺燈日光":null,"時":"59B 19:08","頁":140,"af":"59b","st":1148,"et":1234,"消文":[{"文":"形色是長得樣子好，顯色是看起來好、膚色豐潤；根一定要具足。"},{"文":"根不闕主要是自修；還要利人：跟大眾相處，大家看見你歡喜，求教也好、幫人也好，就容易產生正面的功效。"}],"延伸":[],"逐字稿":[{"t":"59B 19:08","b":[["q","二形色圓滿者，謂由形色顯色善故，顏容殊妙，根無闕故，眾所樂見，橫豎稱故，形量端嚴。"],["s","那麼長相好，長相好。「形色」跟「顯色」，形色，長得樣子好，顯色，看起來好。有很多人這個面孔長得很黑，教人家一看，唉！這個黑炭。那我們通常一看見這個人，不要說黑人哪！一看。還有的人呢，這個皮膚那就是，總是就是有很多人，你教你 ……不但樣子長得好，而且那個膚色非常豐潤，這樣。那麼「根」當然一定是具足，如果眼睛去掉一個，或者鼻子那麼塌掉了，耳朵又這樣，那個不行。為什麼呀？那麼這樣的教人家看得歡喜，看得歡喜。根闕主要的是包括自己的自修，如果其他的，還要利人，你跟大眾相處，大家一看，看見你歡喜呀，不管你去向人家求教也好，或者你幫人家也好，這個就樂於產生正面的功效。第三："]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/004.mp3"},{"文":"三族姓圓滿者，謂生世間，恭敬稱揚，諸高貴種。","口譯":"第三，出身圓滿：生在世人尊敬、稱讚的高貴家族。","四家合註":"<span>三、<\/span><span>族姓圓滿者：<\/span>謂生世間恭敬稱揚諸高貴種。","合註白話":{"same":0},"覺燈日光":null,"時":"59B 20:34","頁":140,"af":"59b","st":1234,"et":1272,"消文":[{"文":"家世出身圓滿：某某人家子弟、王家子弟，有學問、有地位，這種家庭出身自然受人景仰尊重。"}],"延伸":[],"逐字稿":[{"t":"59B 20:34","b":[["q","三族姓圓滿者，謂生世間，恭敬稱揚，諸高貴種。"],["s","第三個，就是他的家世出身圓滿，現在我們講起來，「噢喲，這個人可是某某人家的子弟喔！」以前說起來，噢，這個是王家子弟，現在這個人說他家世是如何地好法，不但是百萬的富豪、千萬的富豪，而且這是都是有學問、有什麼的，就這樣。那自然而然這種家庭出身，受人景仰、尊重。第四："]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/005.mp3"},{"文":"四自在圓滿者，謂大財位，有親友等廣大朋翼，具大僚屬。","口譯":"第四，自在圓滿：有很多財富和地位，有親友等很多支持的人，還有很多部屬。","四家合註":"<span>四、<\/span><span>自在圓滿者：<\/span>謂大財位，有親友等廣大朋翼，具大僚屬。<span>五、<\/span>","合註白話":{"same":0},"覺燈日光":null,"時":"59B 21:12","頁":140,"af":"59b","st":1272,"et":1303,"消文":[{"文":"要做事要兩樣：人——家裡、外面的朋友來幫助；以及財位。有財有用，自利利人都能做。"}],"延伸":[],"逐字稿":[{"t":"59B 21:12","b":[["q","四自在圓滿者，謂大財位，有親友等廣大朋翼，具大僚屬。"],["s","這個就是你要做什麼事情的話，要兩樣東西：第一個 人，第二個 法。人呢，說自己的家裡邊，外面的朋友等等，這個來幫助你；外面的財位。然後這樣，你有財、有用，要做什麼事情，不管是自利也好，是利人也好。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/006.mp3"},{"文":"五信言圓滿者，謂諸有情信奉言教，由其身語於他無欺，堪為信委，於其一切諍訟斷證，堪為量故。","口譯":"五、信言圓滿：是指有情都信奉他的言教，因為他的身語對他人沒有欺誑，堪為人所信任委託，對一切諍訟的判斷與證明，都堪為準則。","四家合註":"<span>言辭威信者：<\/span>謂諸有情信奉言教，由其身語於他無欺，堪為信委，於其一切諍訟斷證，堪為量故。","合註白話":{"same":0},"覺燈日光":null,"時":"59B 21:43","頁":140,"af":"59b","st":1303,"et":1353,"消文":[{"文":"講的話人家聽著歡喜，不欺騙他人，人人信得過；對事情的認識、處斷的標準公正嚴明，大家服服貼貼。"},{"文":"否則隨便談一些問題，大家吵吵鬧鬧，沒有用場。"}],"延伸":[],"逐字稿":[{"t":"59B 21:43","b":[["q","五信言圓滿者，謂諸有情信奉言教，由其身語於他無欺，堪為信委，於其一切諍訟斷證，堪為量故。"],["s","那麼第五個，就是你講的話讓人家聽著你歡喜，這樣。那麼然後呢，說的人也不欺負別人，不欺騙他人，人人信得過你。不但人家信得過你，而且你對事情的認識，處斷的標準，是非常公正嚴明，大家對你服服貼貼、服服貼貼。否則的話，唉呀，隨便談一些問題，大家吵吵鬧鬧是沒有用場。第六："]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/007.mp3"},{"文":"六大勢名稱者，有大名稱，有大美譽，謂於惠施，具足勇健精進等德，由此因緣，為諸大眾所供養處。","口譯":"第六，有大名望：名聲很大、讚美很多；也就是在布施等方面勇敢精進，因此受到大眾的敬重供養。","四家合註":"<span>六、<\/span><span>大勢名稱者：<\/span>謂於惠施具足勇健、精進等德，由是獲得廣大稱譽；復由此緣，為諸大眾所供養處。","合註白話":{"id":"17328","頁":478,"白話":"第二科、異熟的果報，分為八項：第一項：從自身與他人的利益出發，能夠長時積累眾多善業。第二項：乍見之下，所化機就會歡喜地聚集，對他所說的話都願意聽從與實踐。第三項：他的指導都能被遵行而不違背。第四項：透過布施而攝受有情，使他們成熟為足以聽受正法的法器。第五項：透過愛語、利行、同事而攝受並且成熟有情。第六項：由於協助完成一切事務，施予恩惠，所以會獲得報答、迅速聽從其教導。第七項：能成為一切功德之器；由於追求與勤奮，成為一切事業之器；成為智慧廣博、能詳細分辨所知之器。另外，處在大眾當中不會畏懼，具有強大的勇氣；並且與一切有情共行、交談或是受用，或者處在僻靜之處，都沒有罣礙。女性則無法獨自停留在僻靜之處。第八項：無論對於自己或他人的利益都不會厭倦，踴躍歡喜的力量強大而堅固，所以獲得分辨抉擇的力量，是指獲得諸如能以一根毛髮綁住三千大千世界，將之拋上梵天世界的體力，以及立誓將一切有情安置在佛地的心力，神通迅捷。","注釋":["長時積集：法尊法師原譯作「長時積集、增長」，今據藏文刪「增長」。","而令成熟：法尊法師原譯作「速令成熟」，係依玄奘大師譯《瑜伽師地論》文譯出，今據藏文改譯。","故得報恩：法尊法師原譯作「為報恩故」，今據藏文改譯。","事業：此詞藏文為，在果芒本中字標有註記，表示疑誤，以待來者確認。","屏處：僻靜的地方。屏，音「瓶」，蔽也，古通偋。","勇猛：藏文直譯為「踴躍歡喜的力量強大」。","神通迅捷：法尊法師原譯作「速發神通」，今據藏文改譯。"],"已校":true},"覺燈日光":null,"時":"59B 22:33","頁":140,"af":"59b","st":1353,"et":1384,"消文":[{"文":"有大名稱，人家覺得這個人好：他惠施，不但財而且法，布施時勇健精進，所以大眾信仰供養他。"}],"延伸":[],"逐字稿":[{"t":"59B 22:33","b":[["q","六大勢名稱者，有大名稱，有大美譽，謂於惠施，具足勇健精進等德，由此因緣，為諸大眾所供養處。"],["s","他有大名稱，有大名稱，人家都是覺得這個人好，為什麼呢？他有這個，他惠施，他惠施不但是財，而且法，而且布施的時候「勇健精進」，所以大眾都信仰、供養他。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/008.mp3"},{"文":"七丈夫性者，謂成就男根。八大力具足者，謂由«宿業力»，為性少病，或全無病，於現法緣，起大勇悍。","口譯":"第七，男身：就是得到男子的身體。第八，力量充足：因為過去業力，天生很少生病或完全不生病，面對這一生的各種事情，都能勇猛有勁。","四家合註":"<span>七、<\/span><span>丈夫性者：<\/span>謂成就男根。<span>八、<\/span><span>大力具足者：<\/span>謂由宿業力，<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-ba\">辦自他業及諸所作，鮮少劬勞，<\/span>為性少惱，或全無病，由現法緣起大勇悍。<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-ba\">此乃自於此生之中，先前任作何事，皆得遂果，由是扼要，念我更作何事亦當成辦，而發大勇喜。<\/span>","合註白話":{"same":0},"覺燈日光":null,"時":"59B 23:04","頁":140,"af":"59b","st":1384,"et":1661,"消文":[{"文":"第八是有大力量，這裡主要說宿業的力量。"}],"延伸":[{"題":"宿業力","組":[{"題":"病有四種因緣","說":[{"類":"立","文":"醫是絕對有用的；但病有四種因緣：四大不調，醫生可以看也需要看；宿業所感，醫生沒辦法；鬼神觸惱，醫生也沒辦法；自己出岔，飲食不適量、寒暖不知。"},{"類":"立","文":"這裡講大力具足，主要是宿業力。"}]},{"題":"崇明聖人與小牛：少病由宿業","說":[{"類":"例","文":"家鄉的崇明聖人，前清老秀才，行持嚴峻人人佩服，卻一生多病；他母親一生沒病，不曉得病人之苦。"},{"類":"例","文":"學校同學外號小牛，餓兩餐不在乎、吃冰喝熱都沒事；流行性感冒全校病倒五分之三，他從來沒病過。"}]},{"題":"身強心才勇悍","說":[{"類":"立","文":"講醫不是否定，它有絕對的價值；但了解佛法的人要了解這個特質：大力具足是宿業力。"},{"類":"因","文":"少病或全無病，身體強壯，所以心裡也比較勇悍。"},{"類":"破","文":"很多人未嘗不想用功，一提起來腰又痠、頭又痛，那是沒辦法。"}]}],"說":[{"類":"立","文":"醫是絕對有用的；但病有四種因緣：四大不調，醫生可以看也需要看；宿業所感，醫生沒辦法；鬼神觸惱，醫生也沒辦法；自己出岔，飲食不適量、寒暖不知。"},{"類":"立","文":"這裡講大力具足，主要是宿業力。"},{"類":"例","文":"家鄉的崇明聖人，前清老秀才，行持嚴峻人人佩服，卻一生多病；他母親一生沒病，不曉得病人之苦。"},{"類":"例","文":"學校同學外號小牛，餓兩餐不在乎、吃冰喝熱都沒事；流行性感冒全校病倒五分之三，他從來沒病過。"},{"類":"立","文":"講醫不是否定，它有絕對的價值；但了解佛法的人要了解這個特質：大力具足是宿業力。"},{"類":"因","文":"少病或全無病，身體強壯，所以心裡也比較勇悍。"},{"類":"破","文":"很多人未嘗不想用功，一提起來腰又痠、頭又痛，那是沒辦法。"}],"af":"59b","st":1384}],"逐字稿":[{"t":"59B 23:04","b":[["q","七丈夫性者，謂成就男根。八大力具足者，謂由宿業力，為性少病，或全無病，於現法緣，起大勇悍。"],["s","那麼第八，是有大力量，這個就是說主要的那這個地方的宿業的力量。所以現在有很多人講醫，這個醫是絕對有用的，我們要曉得我們的病，總共有四種因緣，四種因緣。第一個就是四大不調，這個四大不調是醫生可以看的，也需要醫生看；第二個宿業所感，那個醫生沒辦法；第三個是鬼神觸惱，這個醫生也沒有辦法；第四個自己出岔，不應該做的事情，去做那種事情。譬如說我們飲食，這個應該適量，他不適量，不應該吃的他吃了。然後呢天氣，他寒暖不知，有諸如此類的事情。主要的四樣，其中有一樣那個是這個四大，現在的醫生；而實際上呢，特別是這個地方具足這個大力，主要的是宿業力、宿業力。"]]},{"t":"59B 24:28","b":[["s","我看見過好幾個人，那是我小的時候，我家鄉有一個，我們稱他為叫「崇明聖人」，他很有意思，這個人的確了不起哦！他是前清末年的是一個老秀才，他最後那個時候考，他考上的。他真正的好不在他考上那個功名，而這個人的行持的嚴峻，啊，那人人佩服他，那個道德的操守，所以我們家鄉都稱他為聖人。這個人很怪，他人雖然很好，但是他多病，他一生多病，結果偏偏他的母親一生沒有病。那個時候我遇見他的時候，那位老人家已經快八十歲了。他有一次跟我父親講，那是我父親的一位老師，唉！他說：「我一生最苦的啊，那個時候母親 ……。」因為他是 ─以前的人都非常孝順，他對母親是絕對地孝順，當然做母親的人也絕對疼愛這個兒子，何況這個兒子這麼好。可是妙咧！這個母親的人從來沒生過病，也不曉得病人之苦，偏偏那個兒子，他一身都是病，這樣。"]]},{"t":"59B 25:39","b":[["s","所以當時我聽了這個東西的確不大懂，以後慢慢地、慢慢地了解了，我遇見很多人，他就是不曉得什麼是病。然後那個時候我們在學校裡面有一個同學，我還記得他，他好有意思喔！他這個身體我們叫他小牛，為什麼叫他小牛啊？他跑到什麼地方，就在那個地方又奔、跑、吃、弄這個，這樣。餓，餓、餓、餓，餓一餐、餓兩餐也不在乎；吃的時候一口氣，噢喲，大家吃脹了，他多吃一點也不在乎。剛剛吃完冰的，馬上喝熱的也沒關係；喝完了熱的，他冰的吃進去，冰淇淋幾個吃進去，也就這個樣。有很多人、其他人都受不了。那我們三年級不曉得四年級，那個時候第一次，不曉得第二次，那種特別的流行性感冒，那個時候剛開始，第一次大量地侵襲台灣，一下大量的人生病。那個時候我們在學校裡念書的時候，學校裡為這個病，病倒的人占五分之三。你可以想像單單那麼個小區域，老師、同學結果為了這個病居然沒辦法，放假幾天。我們天天跑醫院，噢喲！他一天到晚忙，他從來沒有病過，你說這種人怎麼講啊？"]]},{"t":"59B 26:54","b":[["s","所以現在人很多講醫，我不是說否定，是絕對它有它的絕對的價值，可是我們必定要，尤其是了解了佛法的人，我們要了解這個特質，了解這個特質。所以那麼這個地方特別說，這個地方大力具足是什麼？特別講「宿業力」。所以，他的或者病很少，或者全無病，不但沒有病而且身體很強壯，因為他強壯，所以這個心裡面也比較勇悍。現在有很多人未嘗不想用功，他用功一提起來啊，唉呀！等一下腰又痠了，頭又痛了，哇！那是沒辦法好想。這個有八樣東西，這個八樣東西。那麼他上面解釋一下。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/009.mp3"},{"文":"此復第一謂住樂趣，第二謂身，生為第三，財位僚屬為四，第五謂為世間量則，第六謂彼所有名稱，七謂一切功德之器，第八謂於諸所應作勢力具足。","口譯":"這八種又可以說：第一是住於樂趣（的壽量），第二是身體，第三是出生，第四是財位僚屬，第五是成為世間的準則，第六是他所有的名稱，第七是一切功德之器，第八是對於一切所應作的事勢力具足。","四家合註":"此復第一謂住樂趣，第二謂身，生為第三，財位僚屬為四，第五謂為世間量則，第六謂彼所有名稱，七謂一切功德之器，第八謂於諸所應作勢力具足。","合註白話":{"same":0},"覺燈日光":null,"時":"59B 27:41","頁":140,"af":"59b","st":1661,"et":1731,"消文":[{"文":"八樣當中一定要在樂趣當中，特別指人；第二是身體，第三是出身。"},{"文":"第五：他一句話大家信得過，世間做事的衡量標準就是這個，事情可以擺平。"},{"文":"第六：接觸的人固然，不接觸的人也聽見某人如何，非常重要。"},{"文":"第七：要做圓滿的功德，男身非常重要；第八：要做的事必須有這個條件。"}],"延伸":[],"逐字稿":[{"t":"59B 27:41","b":[["q","此復第一謂住樂趣，"],["s","這個八樣東西當中，一定要在樂趣當中，特別指人。"]]},{"t":"59B 27:49","b":[["q","第二謂身，"],["s","身體。第三："]]},{"t":"59B 27:53","b":[["q","生為第三，"],["s","就是他的出身。"]]},{"t":"59B 27:57","b":[["q","財位僚屬為四，第五謂為世間量則，"],["s","第五是什麼呢？就是他的話，大家信得過他，因為世間要想做事情的話，衡量的標準就是這個，衡量的標準。他一句話，大家覺得對了、對了，事情可以擺平了！你要想做事情，這個是重要的。"]]},{"t":"59B 28:22","b":[["q","第六謂彼所有名稱，"],["s","就這樣，跟你接觸的人固然，跟你不接觸的人，他也聽見了，啊！說某人如何、如何，這個對我們是非常重要的。第七："]]},{"t":"59B 28:35","b":[["q","七謂一切功德之器，"],["s","我們要想做圓滿的功德的話，這個男身是非常重要。"]]},{"t":"59B 28:43","b":[["q","第八謂於諸所應作勢力具足。"],["s","你要做的必須要這個條件。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/010.mp3"},{"文":"異熟果報分八。初者依自他利，能於長時，積集增長，無量善根。","口譯":"這些條件的作用有八種。第一（長壽），能在很長的時間裡，為自己和別人累積、增長無量的善根。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、<\/span><span>異熟果報，分八：初者：<\/span>依自他利，能於長時積集無量善根。","合註白話":{"same":7},"覺燈日光":null,"時":"59B 28:51","頁":140,"af":"59b","st":1731,"et":1771,"消文":[{"文":"異熟果報就是詳細說明這樣的異熟體有什麼業用、功效，也按上面八樣。"},{"文":"初是壽：要修習增長善根，時間很重要，所以壽要圓滿。"}],"延伸":[],"逐字稿":[{"t":"59B 28:51","b":[["q","異熟果報分八。初者依自他利，"],["s","那麼下面那個，這個「異熟果報」，就是特別地詳細說明一下，像上面所說的這樣的這個異熟體，它有什麼樣的業用，有什麼樣的功效。「分八」，也按照著上面這個八樣。「初」，就是壽，壽的話不管要想思自利、他利，"]]},{"t":"59B 29:18","b":[["q","能於長時，積集增長，無量善根。"],["s","你要想修習增長善根，這個時間很重要，所以壽要圓滿。第二個呢，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/011.mp3"},{"文":"第二者謂諸大眾暫見歡喜，咸共歸仰，凡所發言，無不聽用。","口譯":"第二，大眾一見就歡喜，都來歸仰，凡是所說的話，沒有不聽從採用的。","四家合註":"<span>第二者：<\/span>謂諸大眾暫見歡喜，咸共歸仰，凡所發言，無不聽用。","合註白話":{"same":7},"覺燈日光":null,"時":"59B 29:31","頁":140,"af":"59b","st":1771,"et":null,"消文":[{"文":"一看這個人就歡喜；人家說開始好已經是一半的成功，一看見歡喜，事情就好辦了。"}],"延伸":[],"逐字稿":[{"t":"59B 29:31","b":[["q","第二者謂諸大眾暫見歡喜，咸共歸仰，凡所發言，無不聽用。"],["s","你一看這個人就歡喜，你看起來歡喜，人家常說：啊，這個開始的好啊，已經是一半的成功。一看見好歡喜的話，事情就很好辦了，這樣。所以這一點有這麼樣的好處。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/012.mp3"},{"文":"第三者謂所勸教，無違敬用。","口譯":"第三，他所勸導教誨的，人們不違背，恭敬奉行。","四家合註":"<span>第三者：<\/span>謂所勸教，無違敬用。","合註白話":{"same":7},"覺燈日光":null,"時":"60A 00:24","頁":140,"af":"60a","st":24,"et":99,"消文":[{"文":"第三就是族姓、出身。"},{"類":"例","文":"以為西方不講門閥，到了西方才發現講得更厲害，歐洲、美國都非常重視出身——世間就是這樣。"},{"文":"好出身的人做這樣的事，大概不會錯，自然容易受他勸誡，要他做任何事業也容易成功。"}],"延伸":[],"逐字稿":[{"t":"60A 00:24","b":[["s","「第三」，第三是什麼呢？就是前面講的族姓，就是出身。"]]},{"t":"60A 00:29","b":[["q","謂所勸教，無違敬用。"],["s","我們常常介紹一個人，啊！說這個某人的家世如何，如果這個有輝煌的家世，我們通常會介紹，在以前是尤其重要。也許有人說：「現在的人好像不講這個了。」我以前也以為如此，以為大概我們東方人像中國、日本、印度，印度是不談啦，印度那世襲得太厲害了，中國、日本都講這個門閥世家，我以為西方不講。嘿！結果這一次到了西方以後，才發現西方人講得才厲害咧，講得才厲害咧！不但歐洲大陸是固然講，美國也是，他非常重視那個門閥，這個世間就是這個樣，就是這個樣。人家說：「噢！這個某人出身如何如何。」那就是這樣。那在這種狀態之下，一個這樣好的出身的人，做這樣的事情，那大概不會錯了。自然這個我們就容易受他的勸誡，你要他做任何事業，也容易成功。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/013.mp3"},{"文":"第四者謂以布施攝諸有情，令其成熟。","口譯":"第四，以布施攝受有情，使他們成熟。","四家合註":"<span>第四者：<\/span>謂以布施攝諸有情，令其成熟<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-ba\">堪為受法之器<\/span>。","合註白話":{"same":7},"覺燈日光":null,"時":"60A 01:39","頁":140,"af":"60a","st":99,"et":134,"消文":[{"文":"就是「自在」：財施有錢，法施有聰明智慧又學得好；人家沒有的給他，不懂的告訴他，自然服服貼貼跟著你。"},{"文":"「攝諸有情」容易成熟，修無上佛道必不可少。"}],"延伸":[],"逐字稿":[{"t":"60A 01:39","b":[["q","第四者謂以布施攝諸有情，令其成熟。"],["s","就是「自在」，那是什麼呢？不管是財，不管是法，這一方面你都自在啊！財施，那麼你有錢；法施，你有聰明、智慧，又學得又好。人家沒有的，你給他，人家不懂的，你告訴他，就是這樣，那自然人家服服貼貼跟著你呀！所以，「攝諸有情」容易成熟，我們修無上佛道是必不可少的。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/014.mp3"},{"文":"第五者謂以«愛語利行同事»，攝諸有情，速令成熟。","口譯":"第五（有大名望），能用好話、做對人有益的事、和大家同甘共苦，來帶領眾生，讓他們很快成熟。","四家合註":"<span>第五者：<\/span>謂以愛語、利行、同事，攝諸有情，而令成熟。","合註白話":{"same":7},"覺燈日光":null,"時":"60A 02:14","頁":140,"af":"60a","st":134,"et":203,"消文":[{"文":"這都靠語言：「信言圓滿」，一開口就對。"}],"延伸":[{"題":"愛語利行同事","組":[{"題":"不要多開口，莫詭辯","說":[{"類":"破","文":"很多人就歡喜開口：一開口不知說到哪裡，文不對題；還有把握不住中心還在詭辯、強辯，非常糟糕。"},{"類":"下手","文":"所以現在一開始就要養成：平常建議大家不要多開口。"}]},{"題":"因地養成，果上易攝受","說":[{"類":"立","文":"因地當中由於什麼，果位就達到這樣的功效：有了這個條件，人家容易接受，愛語、利行、同事就容易。"}]}],"說":[{"類":"破","文":"很多人就歡喜開口：一開口不知說到哪裡，文不對題；還有把握不住中心還在詭辯、強辯，非常糟糕。"},{"類":"下手","文":"所以現在一開始就要養成：平常建議大家不要多開口。"},{"類":"立","文":"因地當中由於什麼，果位就達到這樣的功效：有了這個條件，人家容易接受，愛語、利行、同事就容易。"}],"af":"60a","st":134}],"逐字稿":[{"t":"60A 02:14","b":[["q","第五者謂以愛語利行同事，攝諸有情，速令成熟。"],["s","這個都靠語言哪！你的「信言圓滿」，你出起口來 ─對！那就好。所以這是為什麼，我們現在一開始要養成功啊，平常我常常建議大家不要多開口，有很多人就是歡喜開口。你開口如果說得對也好，他一開口也不知道說到哪裡去了，文不對題是一種。還有一種呢？這個往往把握不住中心還在詭辯、強辯，這種東西都是非常糟糕，非常糟糕的事情。平常的時候，我們主要的這個因地當中由於什麼，那麼果位當中達到這樣的功效，這個我們要了解。眼前的好處就是這個，眼前就是你平常因為有了這個條件哪，所以人家容易接受，所以「愛語、利行、同事」是容易。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/015.mp3"},{"文":"第六者謂由營助一切事業，施布恩德，為報恩故，速受勸教。","口譯":"第六（男身），因為他幫助大家做各種事、對人有恩，大家為了報恩，很快就願意聽他的勸導。","四家合註":"<span>第六者：<\/span>謂由營助一切事業，施布恩德，故得報恩，速受勸教。","合註白話":{"same":7},"覺燈日光":null,"時":"60A 03:23","頁":140,"af":"60a","st":203,"et":246,"消文":[{"文":"為什麼有大勢名稱？因為幫助別人，財也好法也好；得到的感恩，沒得到的也求這個恩，自然處處跟著你轉，做什麼都容易成功。"}],"延伸":[],"逐字稿":[{"t":"60A 03:23","b":[["q","第六者謂由營助一切事業，施布恩德，為報恩故，速受勸教。"],["s","那麼第六為什麼有「大勢名稱」呢？就是這樣，就是因為你幫助別人，就因為你幫助別人嘛！不管是財、法，因為這樣，所以呀人家感你的恩，一是得到的是感你的恩，沒有得到也要求這個恩，自然而然這樣的情況之下，他處處地方來跟著你轉，那麼你要做什麼事情很容易成功，這是它的功效。第七就是「丈夫性」 ─男性。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/016.mp3"},{"文":"第七者謂為«一切勝功德器»，欲樂勤勇，堪為一切事業之器，智慧廣博，堪為思擇所知之器。又於大眾都無所畏。又與一切有情同行，言論受用，或住屏處皆無嫌礙。","口譯":"第七（男身），能成為承載一切殊勝功德的器皿：有意願又勤勉勇猛，能擔當一切事業；智慧廣博，能思考分辨各種道理。又在大眾面前不會害怕；和任何眾生一起行動、交談、共用東西，或在隱密的地方相處，都不會惹人懷疑、沒有妨礙。","四家合註":"<span>第七者：<\/span>謂為一切勝功德器；欲樂、勤勇，堪為一切事業之器；智慧廣博，堪為思擇所知之器。又於大眾都無所畏，<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-ba\">心力強大，<\/span>又與一切有情同行、言論、受用，或住屏處，皆無嫌礙。<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-ba\">女眾不能獨居屏處。<\/span>","合註白話":{"same":7},"覺燈日光":null,"時":"60A 04:06","頁":140,"af":"60a","st":246,"et":379,"消文":[{"文":"男性是「一切勝功德器」：並不是樣樣男性好，女性也有特殊的地方，但有些確實不如，比如欲樂勤勇、在大眾中都無所畏。"}],"延伸":[{"題":"一切勝功德器","組":[{"題":"各盡所長，截長補短","說":[{"類":"立","文":"這裡並不強調；天下的事本來就平等——如此因、如此果，各有長短，各盡所長，截長補短，恰到好處。"}]},{"題":"莫在枝末上爭","說":[{"類":"破","文":"西方強調男女平等，不在根本問題上爭論，而在枝末上去摸，這很糟糕。"},{"類":"立","文":"這裡不深探討，只是了解：由於共業，世間的量則如此，男性在任何情況下無所畏懼、勇悍之心特強。"}]}],"說":[{"類":"立","文":"這裡並不強調；天下的事本來就平等——如此因、如此果，各有長短，各盡所長，截長補短，恰到好處。"},{"類":"破","文":"西方強調男女平等，不在根本問題上爭論，而在枝末上去摸，這很糟糕。"},{"類":"立","文":"這裡不深探討，只是了解：由於共業，世間的量則如此，男性在任何情況下無所畏懼、勇悍之心特強。"}],"af":"60a","st":319}],"逐字稿":[{"t":"60A 04:06","b":[["q","謂為一切勝功德器，欲樂勤勇，堪為一切事業之器，智慧廣博，堪為思擇所知之器。又於大眾都無所畏。又與一切有情同行，言論受用，或住屏處皆無嫌礙。"],["s","這個男性是「一切勝功德器」，這並不是說樣樣東西都是男性好，不！女性也有女性的特殊的地方。但是呢，她女性有很多的的確確不如男性的地方，譬如說「欲樂勤勇」，勇悍的心情，這個男性的特徵，男性的特徵在這個地方。那麼還有呢？譬如說後面所說的「大眾都無所畏」，為什麼啊？在任何情況之下，你說這個女性，尤其是現在，你要單獨的，或者很多地方的話，哦！這個東西不行，這個東西不行，這樣。它有這樣的幾個，那麼下面告訴我們的，這個必定要具足男性的特別的幾個。"]]},{"t":"60A 05:19","b":[["s","不過在這個地方我們並不強調，因為尤其是現在的西方人，強調這個男女平等。唉呀！我覺得這個事情真是很遺憾的事情。天下的事情，本來就是平等的 ─如此因，如此果，各有它的長短，你各盡所長，截長補短，是恰到好處。現在不在根本問題上面爭論，而在枝末上面去摸，這個東西很糟糕，那個很糟糕！所以我們這個地方，這個問題不去深一層地探討，我們只是了解，這個由於共業，世間的量則如此。的的確確這個男性，是在任何情況之下是無所畏懼，而且勇悍之心特強，這個女性這個條件是不具足的，不具足的。那麼第八呢，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/017.mp3"},{"文":"第八者謂於自他利，皆無厭倦，勇猛堅固，能得慧力，速發神通。","口譯":"第八，（大力具足）對於自利利他都不厭倦，勇猛堅固，能得到慧力，迅速發起神通。","四家合註":"<span>第八者：<\/span>謂於自他利皆無厭倦，勇猛堅固，能得慧力，<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-yu\">謂如能以一髮繫三千界而拋至梵天世界之身力，及如誓將一切眾生安置於佛地之心力，<\/span>神通迅捷。","合註白話":{"same":7},"覺燈日光":null,"時":"60A 06:19","頁":140,"af":"60a","st":379,"et":455,"消文":[{"文":"「大力具足」，做什麼事勇往直前；否則做一點事就提不起來，又怕又不勇猛，勇猛一下又累得塌掉。"},{"文":"不但勇猛而且堅固，定慧都能得到，速發神通，事情很快辦成功；要真正深入佛法，沒有這個條件絕無可能。"},{"文":"這八樣東西以什麼原因得到？下面看異熟八因。"}],"延伸":[],"逐字稿":[{"t":"60A 06:19","b":[["q","謂於自他利，皆無厭倦，勇猛堅固，能得慧力，速發神通。"],["s","這個第八是什麼？「大力具足」。因為他具有了這個，所以他做什麼事情是勇往直前。要不然的話，唉呀，做一點事情就心裡面就提不起來，就又怕，又不勇猛；然後呢雖然勇猛的話不堅固，雖然勇猛做了一下，等一下又累得坐在那裡塌掉了，這個東西不行。不但勇猛而且堅固，因為他勇猛堅固，所以定慧什麼等等都能夠得到。要想真正深入佛法，你沒有這個條件，是絕無可能，絕無可能！由於這樣，那麼定慧力得，於是速發神通。然後呢達到了這種情況之下，你要辦的事情，那可以非常快地辦成功，這個就是這八樣東西特別的好處，特別的功用。那麼這個八樣東西，以什麼原因得到的呢？看異熟八因，第一個，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-14/018.mp3"}],"投影片":[{"img":"投影片/shenxin-yeguo-14/001.webp","n":1},{"img":"投影片/shenxin-yeguo-14/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/shenxin-yeguo-14/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/shenxin-yeguo-14/004.webp","n":4},{"img":"投影片/shenxin-yeguo-14/005.webp","n":5},{"img":"投影片/shenxin-yeguo-14/006.webp","n":6},{"img":"投影片/shenxin-yeguo-14/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=59b&st1=130&et1=292","box":[0.133625,0.3091111111111111,0.13775,0.07733333333333334]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564
