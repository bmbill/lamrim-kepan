0001,0.05511111111111111]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/shenxin-yeguo-21/033.webp","n":44},{"img":"投影片/shenxin-yeguo-21/034.webp","n":45},{"img":"投影片/shenxin-yeguo-21/035.webp","n":46,"photo":[0.5643119463582678,0.06666666666666667,0.37856785187007874,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-21/036.webp","n":50,"yt":"E1qFpq1i0fY"},{"img":"投影片/shenxin-yeguo-21/037.webp","n":51}],"投影片PDF":"投影片/shenxin-yeguo-21/slides.pdf","音檔範圍":"63B 28:08～64B 25:15"},"shenxin-yeguo-22":{"id":"shenxin-yeguo-22","標題":"深信業果(二十二)","根":"特以四力淨修道理","科判焦點":"癸二 特以四力淨修道理","課本範圍":"P147 LL4 ~ P150 L1","堂數":82,"日期":"2026/9/29","分圖":[{"名":"唯除先業・擊綵球","原文":[0,5]},{"名":"補特伽羅差別・令初無犯","原文":[6,14]},{"名":"無死亡怖・正見為本","原文":[15,25]}],"跨科判":null,"週":106,"班級":"24秋007","序":null,"音檔":{"64b":{"local":"音檔/gl1/064B.mp3","remote":"https://lamrim.xyz/player/media/gl1/064B.mp3"},"65a":{"local":"音檔/gl1/065A.mp3","remote":"https://lamrim.xyz/player/media/gl1/065A.mp3"},"65b":{"local":"音檔/gl1/065B.mp3","remote":"https://lamrim.xyz/player/media/gl1/065B.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=64b&st1=1515&af2=65a&af3=65b&et3=484","段":[{"文":"若能盡淨有力之業，云何經說唯除先業所有異熟？謂感盲等異熟之時，現在對治難以淨除。若在因位，尚未感果，則易遮止。密意於此，故如上說，«無有過失»。","口譯":"有人問：如果懺悔能把力量很強的業都清淨掉，為什麼經上又說「只有過去業已經成熟的果報除外」？回答：這是指已經招來眼盲等果報的時候，現在再懺悔很難消除；如果還在種因的階段、果報還沒出現，就容易擋住。經上是這個意思，所以前面那樣說並沒有矛盾。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第七者、如經云：「除業異熟」，已感業異熟之生盲殘疾等雖莫能遮，然仍能盡淨定業道理之斷諍理者：<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">若爾，如以四力對治淨除，<\/span>若能盡淨有力之業，云何<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">契<\/span>經<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">中<\/span>說「唯除先業所有異熟<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">者<\/span>」？謂<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">其果<\/span>盲<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">及殘疾<\/span>等<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">前世之業已引此生，而如所引，<\/span>異熟<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">既已<\/span>感生之時，現在對治難以淨除。若<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">前世業已引此生，然今<\/span>在因位，尚未感果，則易遮止。密意於此，故如上說，無有過失。","合註白話":{"id":"19689","頁":545,"白話":"第七科、如同經典中說「除了業的異熟以外」，如果業已經成熟為殘疾失明等，雖然無法扭轉，但是仍然可以徹底淨化決定業，對此道理斷除詰難的道理：有人問道：「若是如此，經過四種對治力淨化，如果連至極強力的業也能被徹底淨化，那麼經典中所謂『除了過去的業的異熟以外』，又該如何解釋？」答道：前世的業在今生招感先天眼盲與殘疾等果報，並且如所招感，異熟已經成熟時，確實很難以當下的對治品淨化；而前世的業雖然已經招感，但是目前如果還在果報尚未成熟的因的階段，則容易扭轉。是基於這個用意而這麼說，所以沒有過失。《分別熾燃論》說道：「有人提出：『如果藉由對治摧毀，連強力的罪惡都會被最徹底地連根消盡，為何世尊的經典中還要指出「除了過去的業的異熟以外」？』答道：這是指已經領受了形成先天眼盲、獨眼、殘疾、跛足以及聾啞等體性的因位，以及累積這種因之後，其果報的階段，是基於這個用意而這麼說的。因為什麼原因呢？已經轉變為成熟階段的體性，先天眼盲等已經成熟的那些業的果報，即使生起對治力，沒有能力使之完全消盡。雖然如此，但是在尚未感果的因位階段的動機——思心所去造作而累積的業，如果以不善為例，當獲得並修持其他特定的思心所，亦即其對治時，則必定會完全消盡，就如同指鬘只差一位就殺滿一千人、未生怨王弒生父法王、娑嚩迦弒母，以及與此相同的殺害父親，還有無憂法王，前半生是號稱「暴虐無憂王」的惡人等，為他們開示對治法，藉由修持而得以見諦等的史實一般。","注釋":["如經云：引文出自《大般若波羅蜜多經‧稱揚功德品》。唐玄奘大師譯《大般若波羅蜜多經‧稱揚功德品》作：「唯除先世定業異熟現世應受。」見《大正藏》冊7，頁556；《甘珠爾》對勘本冊29，頁708。","謂盲等異熟感生之時：法尊法師原譯作「謂感盲等異熟之時」，為配合箋註，故改譯。","《分別熾然論》云：引文見《丹珠爾》對勘本冊58，頁450。","意謂已受生盲一目殘疾顛跛及啞聾等自性因位以及果位故作是說：法尊法師原譯作「意謂已受生盲、一目、缺足、顛跛及啞聾等自性因果，故作是說」，為配合箋註，故改譯。依如月格西解釋，受用因位，意指因已成熟為果；受用果位，指成熟為果位之後正在發生作用，故二者皆是指感果的階段。","指鬘殺人缺一滿千：指鬘，佛世一阿羅漢（生卒年不詳），梵語Aṅguli-mālya及藏語སོར་ཕྲེང་義譯，又名央掘摩羅。尊者生於舍衛國，年少聰慧，儀表庠序，力超勇士。起初從摩尼跋陀羅婆羅門（Maṇibhadra）研習外道學說。後因婆羅門受其妻欺騙，命令尊者殺一千人，取其手指串成指鬘，才能消罪，成為真正的婆羅門。於是尊者執刀出城殺人，殺至九百九十九人時，正逢母親送飯，尊者心意迷亂，欲舉刀殺害母親。釋尊觀其得度因緣成熟，即化現在尊者不遠處。尊者見到釋尊，轉為追趕釋尊，奮力追趕也無法追上，於是呼喚釋尊。後因釋尊善巧度化，尊者殷重懺悔前愆，出家修道。因尊者根器非凡，聞佛說法，即得阿羅漢果。參見《大正藏》冊2，頁508；《甘珠爾》對勘本冊62，頁347。","未生怨弒其生父法王：未生怨，佛世一國王，梵語Ajātaśatru及藏語མ་སྐྱེས་དགྲ義譯，又名阿闍世。王生於摩竭陀國王族。由於王母韋提希（Vaidehī）懷孕時，相師就預言這胎兒未來會殺害父親，故取名為未生怨。其父頻婆娑羅王因聽到相師的預言，在他出生時，便將他從樓上丟下，但未生怨王僅僅折斷一節指頭，故又名為折指、婆羅留枝（Balaruci）。王長大後，由提婆達多（Devadatta）教唆篡位，將其父幽禁在牢獄，不供應任何飲食，使之餓死。王因此惡業身體長出許多毒瘡，痛苦難忍。後依良臣耆婆（Jīvaka）引見佛陀，於佛前誠心悔過，並於後半生全心全意護持佛教。參見《大正藏》冊12，頁565、冊24，頁189；《甘珠爾》對勘本冊4，頁511。","娑嚩迦弒母：娑嚩迦，梵語Svaka（ཤྭ་ཀ）音譯，生卒事蹟不詳。典故出自《根本說一切有部毘奈耶‧出家事》。相應段落參見唐義淨大師譯《根本說一切有部毘奈耶‧出家事》云：「緣在室羅筏城。有一長者，娶妻未久便誕一息，資以乳餔。爾時長者告其妻曰：『賢首！生此子者雖用我財，亦能代我償諸債負。』作是語已，便將貨物詣往外國興易取利，便沒不還。其妻以自身力及託諸親，種種養育，年漸長大。爾時此兒與諸童子相隨而往，至餘長者家。時彼長者有一少女，見此童子，便以花鬘擲彼童子。時諸童子問曰：『汝於此女有期會耶？』答言：『有。』諸童報曰：『此之長者為性嚴惡，汝莫為斯事，損害於汝。』諸餘童子乃至日暮守此童子，不令非法，便共相隨至於母處。私報母曰：『此小童兒，與某長者少女，欲為非法。我等勸諭，制不聽為。我今歸去，於此夜中宜應遮止。』母曰：『汝等既能共相勸諭，甚為善事。』其母即令童子入房安置，又於房中安觸瓶水及以觸盆，母自當門安床而臥。至夜半後，子告母曰：『與我開門，出外便易。』母即告曰：『房中已安觸盆，可應便易。』須臾之頃，其子復告：『與我開門。』母亦不開，子遂瞋怒。母曰：『汝所去處，我先已知。我今寧可於此受死，終不為汝開門。』凡欲火染心，無惡不作、不避惡業，遂於此時拔劍殺母橫屍於地，即詣長者家。既至彼已，見其少女，身形戰掉。女曰：『汝勿生怖，惟我獨住更無餘人。』童子念曰：『我今應報令知已殺於母。』告言：『少女！我已為汝殺母命根。』女曰：『汝所生母？為是嬭母？』報言：『是我所生母。』其女念曰：『此人瞋怒尚殺親母，況我餘人。』作是念已，報言：『汝應且待，我暫昇樓。』女上樓訖，高聲唱言：『此中有賊。』彼人聞已，於水竇中潛身而出。到己宅內，擲刀於地，高聲唱言：『賊殺我母、賊殺我母。』作是唱已，便依世法燒葬其母。內自思忖：『深是惡人，造極逆罪。』情懷戰懼不自寧心，遂向處處祠天，隨處告問：『修何業行而滅重罪？』或有說言：『應當入火。』或有說言：『自墜高巖。』或有說言：『投身溺水。』或有說言：『自縊其身。』各各說言所作方便，皆令自死，無有出路。復於後時往逝多林，乃見苾芻念誦經論，聲中頌曰：『若人作惡業，修善而能滅；彼能照世間，如日出雲翳。』爾時此人便作是念：『出家釋子有除罪法，今我應當出家，修諸善業而滅其罪。』即詣苾芻處白言：『聖者！我欲出家，願見哀愍。』時此苾芻便與出家并授近圓。既出家已，精懃讀誦，於三藏教悉皆具解，辯才無礙善能論答。別有苾芻問彼人曰：『具壽！何因苦行精懃？有何別求？』彼人答曰：『我為消重罪故。』問言：『汝作何罪？』答曰：『殺母。』又問：『是親生母？為當乳母？』答曰：『是親生母。』時諸苾芻以緣白佛。爾時世尊告諸苾芻曰：『若人殺母，便求出家，與出家者當壞我法，即須擯棄。從今已往，於我法律之中，若有人來求出家者，當須問言：『汝非殺母不？』若不問者，得越法罪。』其人被眾擯已，便自念曰：『我今不可還俗，應須遠去邊境而住。』便往邊境之處化一長者，長者於此苾芻乃生信敬，為造一寺。諸方客侶皆來此寺，來者皆為說法，多有證阿羅漢果。復於異時，身有病患，用諸根菓莖葉種種藥草，療治不差。漸漸困篤，餘命無幾。告弟子曰：『當造浴室。』時諸弟子依教，便造浴室。爾時師主說伽他曰：『積聚皆消散，崇高必墮落，合會終別離，有命咸歸死。』說此頌已，便即命終，墮無間地獄。然諸弟子證阿羅漢者，入定諦觀，鄔波馱耶當生何處？於諸天宮，諦觀不見；復觀人間及傍生趣并餓鬼中，悉皆不見。復觀地獄，乃見在於無間地獄中。爾時弟子共作是念：『我鄔波馱耶生存之時，持戒多聞，以法攝受。曾作何業墮於無間？』又復諦觀，乃見殺母之業。既被地獄猛火逼身，意想將是所造浴室，遂即唱言：『浴室浴室，熾熱猛火極燒於我。』是時當門獄卒以杵打頭，告言：『薄福罪人，此是無間地獄，云何言是浴室？』被打頭時乃發善心，即便命終，生四天王宮。凡生天者，起三種念：我從何來？今生何處？復緣何業？作此念時，乃見我從無間獄死，生在四天王宮，緣作浴室洗浴苾芻，乘斯福力而生此天。是時天子復作是念：『我緣世尊善方便故令我生天，不應安住，當須詣世尊所，以報此恩。』既至佛所，聽聞妙法，便證初果。得見諦已，歸還天宮。時彼上首弟子是阿羅漢，眾欲食時，於上座處坐。其小弟子為僧伽行水，是時上座鉢中受水，指頭觸水，覺水極冷，便作是念：『我今於此飲斯冷水。鄔波馱耶在地獄之中飲鎔銅汁。』便觀地獄，遍皆不見；復觀人間、傍生、鬼趣，皆悉不見。即觀天上，乃見生在四天王宮，復於佛所而證初果。見已微笑，語言：『是佛、是法、是僧大淨妙事不可思議。此極重業，墮於地獄，有勝功能，得生天上。』彼行水者白尊者曰：『鄔波馱耶死，得為上座，歡喜笑耶？』告曰：『具壽！汝今所問，非正是時，若僧伽集時，可問斯事，當為汝說。』後於異時，苾芻僧伽集。其小同學眾中問曰：『大德！前是何事歡喜為笑耶？為見鄔波馱耶死，得為上座故歡喜笑耶？』于時眾首對於僧伽廣如上說，時諸弟子皆大歡喜，咸稱：『佛法僧寶是大勝利，我鄔波馱耶造斯罪業而得生天。』」夏日東活佛提及，此中娑嚩迦相傳是佛世的樂行比丘，但經查尋漢藏譯本，皆未提及此比丘名為樂行。參見《大正藏》冊23，頁1038；《甘珠爾》對勘本冊1，頁282；《夏日東文集》冊1，頁444。","殺父：典故出自《根本說一切有部毘奈耶‧出家事》。在漢譯本中無此相應段落。夏日東活佛提及，此因緣為某一童子貪著女眾，由於其父阻擋，此童子因而殺害父親。參見《甘珠爾》對勘本冊1，頁291；《夏日東文集》冊1，頁444。","無憂法王：釋尊授記的古印度護法國王（約公元前304～232），梵語Aśoka及藏語མྱ་ངན་མེད་義譯，又名阿育王。王前世為德勝童子，在玩土時見佛乞食，心生歡喜，便拿土供養釋尊，發願為王。佛陀授記童子在佛涅槃百年之後，將成為轉輪聖王，統領南贍部洲，名叫阿恕伽，供養佛舍利造八萬四千塔，利益有情。王為阿闍世王後代，頻頭莎羅王子。母為婆羅門女，本因在後宮受人嫉妒，專作種種苦役，但生下無憂王後，從此便不再被他人欺侮，故取其子名為無憂。多羅那他《印度佛教史》中則記載，王出生於北印度瞻巴阿拿境，父為日種國王涅米大，母本為商主妻子。王出生時，由於消除了父王的憂惱，故取名為無憂。王年少時雖然通達各種文學、武術，但因前世以土供佛，導致今生身形醜惡，不被父王喜愛。由是常被派遣攻打敵國，而卻不給兵器。因王福德，地神此時從地湧出奉上兵器，王便攻克敵國，令其投降歸附。王出生時，相師曾預言王未來當繼承王位，因父王的輔相與太子不合，輔相遂將相師預言告五百大臣，共謀殺害太子，而奉無憂王登基。雖然如是，但是許多大臣、宮女都輕視、厭惡無憂王，因此王殘殺五百大臣及五百宮女，人民便稱王為暴王無憂。王又召喚殺父弒母的惡人耆梨，蓋酷刑房，名愛樂獄，其中刑罰比照地獄。曾有僧人誤入刑房將被燒殺，僧人哀求緩刑七日，在七日中，看見遍地屎尿、內臟種種不淨，於是生起厭離之心，精勤修道得證羅漢。此時惡人雖以各種方式行刑，絲毫不能傷害羅漢，於是往報國王。羅漢知王得度因緣已到，於是變現廣大神通，調伏國王，並且告王釋尊授記。王心生希有，懺悔前愆，皈依佛門，毀壞刑房。其後，王遵循佛記，召喚鬼神相助，一夜建造八萬四千佛舍利塔，人民改稱王為法王無憂。又迎請優婆毱多尊者（Upagupta），宣揚三寶功德，教化十方眾生。王親自供養佛僧數以萬計，並廣勸百姓布施修福。晚年想仿效須達長者鋪金供佛，發願供養百億黃金。供養到九十六億黃金時，罹患重病，王子、大臣擔心庫藏空虛，所以不再供養。此時侍臣以金盤、銀盤為王送食，王仍將金盤等物施予眾僧。於臨終時，侍臣送半顆菴摩羅果，王吩咐侍臣轉告僧眾：「此菴摩羅果是國王最後供養。」轉問輔相：「在此世間誰得自在？」輔相答道：「只有世尊得大自在。」王即合掌發願：「除了庫藏，其他一切都供養佛僧！我今生累積的一切功德，不求世間的人天果位，只願速成佛位，得大自在。」說完以齒印封詔，交付輔相，隨即命終。關於無憂王傳，各地所傳略有出入，此處以漢傳說法為主，參照藏傳說法稍作補充。參見《大正藏》冊50，頁99；《印度佛教史》，頁30。","見諦：即見道，包含三乘見道。由於獲得見道時能夠現證四諦，所以稱為見諦。"],"已校":true},"覺燈日光":null,"時":"64B 25:29","頁":147,"af":"64b","st":1529,"et":null,"消文":[{"文":"又提一個問題：懺悔既能把惡業清淨，經上為什麼說先業的異熟要除開？那不是不能完全淨化了嗎？"},{"文":"業已經感果的時候，沒辦法淨除；在因位的時候淨修，可以遮止。"},{"類":"喻","文":"草還沒結種先拔掉；結了種把種子敲爛，泡水曬太陽也不長；已經發芽長出來了，要它不長，沒有這個可能。"},{"文":"所以跟前面所說完全相順，經的意思是這個，絕對沒有過失。"}],"延伸":[{"題":"無有過失","組":[{"題":"圓滿教法，百無一失","說":[{"類":"立","文":"說「無有過失」這裡有一個大道理：圓滿的教法一點漏洞都沒有。"},{"類":"因","文":"修行出種種問題，是因為懂了一點點，不懂的一大堆，漏洞多多少少，還覺得做對了，結果紕漏百出。"},{"類":"立","文":"這裡把綱要告訴你，每一個有問題的地方都說清楚；把握住去做，百無一失。"}]},{"題":"通達一切聖教無違","說":[{"類":"回扣","文":"本論一開始說它的特別好處：一切經論的內涵通達而不違背——在這裡處處顯出來。"},{"類":"立","文":"各經彼此看似矛盾的地方都提出來：小乘怎麼說、大乘怎麼說，告訴你意義，絕不違背。"},{"類":"立","文":"將來講共中、上士更進一層：大小之間不但沒有矛盾，完全相順、相輔，只是愈趨深廣。"}]},{"題":"莫以現知判斷一切","說":[{"類":"喻","文":"小學生回家說「這是老師講的」，天經地義；長大了才覺得可笑。"},{"類":"立","文":"剛開始學難免偏執；執著不是壞事，但要了解它有缺點。"},{"類":"下手","文":"不要拿現在所知道的去判斷一切，要拿它推動自己趕快努力深入。"}]}],"說":[{"類":"立","文":"說「無有過失」這裡有一個大道理：圓滿的教法一點漏洞都沒有。"},{"類":"因","文":"修行出種種問題，是因為懂了一點點，不懂的一大堆，漏洞多多少少，還覺得做對了，結果紕漏百出。"},{"類":"立","文":"這裡把綱要告訴你，每一個有問題的地方都說清楚；把握住去做，百無一失。"},{"類":"回扣","文":"本論一開始說它的特別好處：一切經論的內涵通達而不違背——在這裡處處顯出來。"},{"類":"立","文":"各經彼此看似矛盾的地方都提出來：小乘怎麼說、大乘怎麼說，告訴你意義，絕不違背。"},{"類":"立","文":"將來講共中、上士更進一層：大小之間不但沒有矛盾，完全相順、相輔，只是愈趨深廣。"},{"類":"喻","文":"小學生回家說「這是老師講的」，天經地義；長大了才覺得可笑。"},{"類":"立","文":"剛開始學難免偏執；執著不是壞事，但要了解它有缺點。"},{"類":"下手","文":"不要拿現在所知道的去判斷一切，要拿它推動自己趕快努力深入。"}],"af":"64b","st":1664}],"逐字稿":[{"t":"64B 25:29","b":[["q","若能盡淨有力之業，云何經說唯除先業所有異熟？謂感盲等異熟之時，現在對治難以淨除。若在因位，尚未感果，則易遮止。密意於此，故如上說，無有過失。"],["s","他下面又提出一個問題來，說：「既然像你這樣說，經過了懺悔，能夠把所有的這個惡業都能夠清淨的話，那麼經上面說先業所有的異熟，經上面又說這個要除開，它為什麼還要除開呢？既然你能夠徹底淨除的話，還有什麼除開，能夠除開的話，它不是不能完全淨化了嗎？」他下面說，當這個業你已經感得果了，已經感得果的時候，你就沒辦法淨除了；在因位的時候你還可以，在因位的時候，那個時候你淨修的話，可以遮止。"]]},{"t":"64B 26:38","b":[["s","這個道理用一個現實來比喻，比如我們說，草我們不要讓它長，那麼當這個草的種子，還沒有結種的時候，你先把它拔掉，不結種，這一個。第二個，結了種以後，那個種子你把它拿出來把它敲敲爛是第二個。敲爛了以後，儘管到那時候泡在水裡、曬得太陽，它絕對不結；是的，它那個種子還在那裡，但是它不會感果。但是萬一那個草，你草的種子你沒有事先破壞，到了春天已經發了芽，長出來了，你要叫它再不長芽，有沒有這個可能啊？那當然沒有這個可能，這是我們要懂得的。所以這個道理跟前面所說的仍舊完全相順，完全不違背，所以經上的意思是這個，所以它絕對沒有過失。"]]},{"t":"64B 27:44","b":[["s","關於這個地方他說沒有過失這一點，以及這一段話，這地方有一個大道理哦！這個也就是圓滿教法殊勝之處，凡是圓滿的教法，它一點漏洞都沒有的，前面這個道理我已經跟你們講過。我們現在所以修行的時候出種種問題，為什麼呢？你不能說你不懂，你懂得了一點點。懂得了一點點，結果呢你不懂的地方是一大堆，結果呢一大堆不懂的地方，這漏洞不曉得多多少少，你還覺得做對了，結果做的時候，因為有漏洞在，所以紕漏百出。現在這個地方啊，他雖然把那個綱要告訴你，凡是綱要的地方，每一個有問題的地方，他都告訴你清清楚楚，所以你只要把握住這個地方去做的話，百無一失。"]]},{"t":"64B 28:38","b":[["s","所以他把經上面，各種不同的經典上面，彼此有矛盾的地方都提出來。所以本論一開始告訴我們說，本論的特別好處，它能夠把一切的經論內涵通達而不違背，大家記得不記得？在這地方就處處地方顯出來了。欸！小乘怎麼說，大乘怎麼說，為什麼它這樣呢？喏！告訴你它的意義為什麼，絕不違背。你在粗淺的地方去看的時候，還覺得這是因為針對著這個，因為針對著這個，如果你真更深一層去看的話，那這個問題更是徹底圓滿地解決。將來講到共中、上士的時候，我會把剛才說那個話，更進一層地告訴你們。到那時候你自然會曉得大小之間，彼此是一點沒有矛盾；不但沒有衝突、沒有矛盾，而且完全相順、相輔，只是愈趨深廣，愈趨深廣。"]]},{"t":"65A 00:12","b":[["s","不同的只是我們無始以來的習氣，我們就有一種偏執。就像我們平常人念書也是一樣，我們念書進了小學裡面，小學裡面哪，到了這個學校裡學到了一點，回來了一定是：「喔唷，這個老師講的！」喔唷，這個老師講的是天經地義。等到我們自己長大了以後，自己乃至於曉得，真可笑，但是人人都有這個經驗，對不對？現在我們就是也是這樣。所以我們剛剛開始學的時候是難免的，要嘛自己不好好地，要好好地學，到那時候自己會，哎呀，執著得不得了。那時候我們真正重要的，注意，這個執著不是一件壞事，但是要了解這個執著有它的缺點。那麼當這種情況之下，趁這個機會要注意，說不要拿我們現在所知道的去判斷一切，要拿這個推動我們的力量啊，趕快努力深入，這個時候就把這個問題就可以解決了。繼續下去。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/001.mp3"},{"文":"《分別熾然論》云：「設作是云：若諸惡罪至極永盡，云何說除先業異熟耶？意謂已受生盲，一目缺足，顛跛及啞聾等，自性因果，故作是說。何以故？以諸業果，若已轉成異熟位體，非有功能，令其遍盡。","口譯":"《分別熾然論》說：「假如有人這樣問：如果種種惡罪能究竟永盡，為什麼又說要除開先業的異熟呢？這是指已經領受了天生眼盲、一眼失明、缺腳、跛足以及啞、聾等等這些自性因果，所以這樣說。為什麼呢？因為種種業果如果已經轉成異熟的果體，就沒有能力讓它完全淨盡了。","四家合註":"《分別熾然論》云：「設作是云：『若<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">以對治摧壞，<\/span>諸惡罪<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">勢力雖大，亦能從根<\/span>至極永盡，云何<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">佛經中<\/span>說「除先業異熟」耶？』<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此<\/span>意謂已受<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">能成<\/span>生盲、一目、殘疾、顛跛及啞聾等自性因位<span class=\"sjan sj-ba\">，<\/span>以及<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">由積其因而至彼<\/span>果位<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">時<\/span>，故作是說。何以故？以<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">已成就生盲等<\/span>諸業果<span class=\"sjan sj-ba\">，<\/span>若已轉成異熟位體，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">起對治力，<\/span>非有功能令其遍盡。","合註白話":{"same":0},"覺燈日光":null,"時":"65A 01:16","頁":147,"af":"65a","st":76,"et":105,"消文":[{"文":"就是前面剛才解釋的（師父併在上一段，沒有另外解）。"}],"延伸":[],"逐字稿":[{"t":"65A 01:16","b":[["q","《分別熾然論》云：「設作是云：若諸惡罪至極永盡，云何說除先業異熟耶？意謂已受生盲，一目缺足，顛跛及啞聾等，自性因果，故作是說。何以故？以諸業果，若已轉成異熟位體，非有功能，令其徧盡。"],["s","那就是前面，就是前面剛才解釋的。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/002.mp3"},{"文":"若因位思，正造作者，獲得所餘思差別力，能令永盡。","口譯":"如果還在因位的思業、正在造作的時候，獲得其餘殊勝思業的力量，就能讓它永遠淨盡。","四家合註":"<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">雖則如是，<\/span>若因位<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">階果報未成之等起<\/span>思<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">其所<\/span>正造作<span class=\"sjan sj-ba\">、<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">積聚之業<\/span>者，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如以不善為例，<\/span>獲得所餘<span class=\"sjan sj-ba\">〔<\/span>思差別力<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂其對治。〕而修習之<\/span>，<span class=\"sjan sj-ba\">必定<\/span>能令永盡。","合註白話":{"same":0},"覺燈日光":null,"時":"65A 01:45","頁":148,"af":"65a","st":105,"et":143,"消文":[{"文":"「思」就是業；還在因位、沒有感果，正在造作或造了還沒感果。"},{"文":"經過對治，「獲得所餘」——其他造的業的力量，把前面的統統抵銷，徹底淨除乾淨。"}],"延伸":[],"逐字稿":[{"t":"65A 01:45","b":[["q","若因位思，正造作者，獲得所餘思差別力，能令永盡。"],["s","假定它還在因位當中，「思」，思就是業嘛！在因位當中還沒有感果，你正在造作了；或者造作了以後還沒感果。那麼經過你的對治，「獲得所餘」，就是其他的這個思，思就是我們的造的業。這個其他造的業的這個力量，把它前面的統統抵銷，能夠「令盡」，徹底地淨除乾淨。下面引，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/003.mp3"},{"文":"猶如開示指鬘，«未生怨»，娑嚩迦，殺父及無憂等。","口譯":"就像經中講的指鬘、未生怨王、娑嚩迦、殺父的人和無憂王這些人的故事（他們都造了重罪，後來懺悔淨除）。","四家合註":"猶如開示<span class=\"sjan sj-ba\">〔<\/span>指鬘<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">殺人缺一滿千。〕<\/span>、<span class=\"sjan sj-ba\">〔<\/span>未生怨<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">弒其生父法王。〕<\/span>、<span class=\"sjan sj-ba\">〔<\/span>娑嚩迦<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">弒母。〕<\/span>、<span class=\"sjan sj-ba\">〔<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">又與其相類<\/span>殺父<span class=\"sjan sj-ba\">。〕<\/span>及<span class=\"sjan sj-ba\">〔<\/span>無憂<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">法王，上半生時人稱暴王無憂之罪人。〕<\/span>等<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">對治，而修習之，得見諦等<\/span>。","合註白話":{"same":0},"覺燈日光":null,"時":"65A 02:23","頁":148,"af":"65a","st":143,"et":265,"消文":[{"文":"就是前面講的那幾個公案：阿闍世王叫「未生怨」，殺了父親；「指鬘」就是鴦堀摩羅的公案。"}],"延伸":[{"題":"未生怨","組":[{"題":"未生怨的由來","說":[{"類":"例","文":"摩羯陀國王非常信佛，沒有兒子；山裡一位仙人將來會轉生成他的兒子，他等不及，把仙人害死，仙人就投生到他家。"},{"類":"例","文":"國王知道兒子長大要報復，很害怕；生下來丟在地上，沒跌死，跌壞一隻手指。"},{"類":"例","文":"長大後人家告訴他這段因緣，阿闍世王起了惡心——所以叫「未生怨」。"}]},{"題":"業感果，一點不差","說":[{"類":"立","文":"順便說明：業感果一點都不差。"}]}],"說":[{"類":"例","文":"摩羯陀國王非常信佛，沒有兒子；山裡一位仙人將來會轉生成他的兒子，他等不及，把仙人害死，仙人就投生到他家。"},{"類":"例","文":"國王知道兒子長大要報復，很害怕；生下來丟在地上，沒跌死，跌壞一隻手指。"},{"類":"例","文":"長大後人家告訴他這段因緣，阿闍世王起了惡心——所以叫「未生怨」。"},{"類":"立","文":"順便說明：業感果一點都不差。"}],"af":"65a","st":143}],"逐字稿":[{"t":"65A 02:23","b":[["q","猶如開示指鬘，未生怨，娑迦，殺父及無憂等。"],["s","就是前面講的那個幾個公案，一個是阿闍世王，阿闍世王叫「未生怨」，你們曉得這個公案。這個，把他父親殺死了，剛才已經說過了這個道理。那麼對這個未生怨哪，既然這個地方說了，我也順便提一下。那個摩羯陀國是當年印度是一個大國，那麼他非常信佛，可是沒有兒子，可是沒有兒子，那麼他後來求兒子。那個時候山裡邊有一個仙人，那就是外道婆羅門。啊，他這樣，他要求嗣，所以他就 ……說這個仙人將來會轉成他的兒子，他就等不得了，把那個仙人，把他害死。害死了以後呢，弄死了以後，然後這個人就投生到他家裡面，投生到家裡面。後來就告訴他：「哦，將來，因為你以前，你害了他以後，將來他長大了以後，你要還報他。」就這樣。"]]},{"t":"65A 03:42","b":[["s","他曉得了以後很害怕，雖然求到了兒子了，覺得既然這樣的話，這個兒子將來長大了要還報的話，倒不如把那個兒子弄死了。所以他那個兒子生出來的時候，他把他丟出去，丟在那個地上。結果丟在地上沒跌死，把他那個手指跌壞掉了一個，他也不知道。後來一直長大了以後，人家就告訴他，欸，你這個因緣是這樣啊！於是這阿闍世王起了這個惡心，所以他叫未生怨，這有這麼一段公案。這個地方也順便說明，這個業感果是一點都不差，這樣，那麼這個下面就不去說了。那個「指鬘」就是鴦堀摩羅這個公案，這個經上面告訴我們說得清清楚楚。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/004.mp3"},{"文":"設作是云，未生怨王及殺母等，若已生起所餘善思，何故其業未得永盡，生無間耶？是為令於所有業果，發信解故，現示感生諸無間等，非是未能，無餘永盡所有諸業。如擊綵球，隨擊而躍，生彼即脫，雖那洛迦火燄等事，亦未能觸。","口譯":"假如有人問：未生怨王以及殺母的人等等，如果已經生起了其餘的善思，為什麼他們的業還沒有永盡，仍然生到無間地獄呢？這是為了讓人對一切業果發起信解，所以示現感生無間等等，並不是不能毫無剩餘地永盡所有的業。就像拍擊綵球，一拍就彈起來，生到那裡隨即脫出，連那洛迦的火燄等等都碰觸不到。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第八、依典故破不合定律之理：<\/span>設作是云：『未生怨王及殺母等，若已生起所餘善思<span class=\"sjan sj-ba\">──<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">對治<\/span>，何故其業未得永盡，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">後世<\/span>生無間耶？』<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">答云：無過。此等<\/span>是為<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">由此因感此果，表徵因果無欺誑，或<\/span>令於所有業果發信解故，<span class=\"sjan sj-ba\">師云：『於後世中，已成先業所引異熟，是果位時無能遮退，而於因位可遮止者，或如有人，由於先業入母胎已，便即引生七歲之時一眼當瞎，十歲之時足當致殘，二十歲時手復當斷。於其初者，由未修成遮退方便等，故如所引，七歲之時一眼已瞎，此為異熟既成，故不能遮。其後諸果，雖已引生，然仍為其所引未成之因位，故行遮退方便，尚能遮退。』昔時罪惡雖極力大，然若生起其餘善心──對治，遍能永盡。於此或曰：此不應理。若如是者，但為<\/span>現示<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">須臾<\/span>感生諸無間等，非是未能無餘永盡所餘諸業。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">若是未盡，則本當長時領受地獄苦者，成唯生其中，<\/span>如擊綵球，隨擊<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">無間<\/span>而躍，生彼<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">無間<\/span>即脫，雖那洛迦火燄等事，亦未能<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">略<\/span>觸，","合註白話":{"id":"19943","頁":552,"白話":"第八科、依過去的典故破除不合定律的情形：有人提出：『既然未生怨王與殺害母親者，他們已經生起其他對治品的善心所，為何業沒有消盡，下一生仍然投生於無間地獄？』答道：這沒有過失，他們是為了以從此因生如此果來表徵因果真實不虛，或是為了激發對業果的信心，所以上師說：『下一生，宿業所招感的異熟已經成熟，在果報階段沒有轉寰餘地；而在因的階段還能扭轉。例如一個人，過去的業使他進入母胎，已經招感了七歲時一眼會失明，十歲將會雙腳殘疾，二十歲時雙手也將殘廢。一開始未修起扭轉的辦法，於是便如業所招感，在七歲時一眼失明，這是異熟已經結成，因此無法扭轉；而後面的雖然已經招感，但是還處在尚未如所招感那般結成的因的階段，所以運用扭轉的辦法，應該是可以阻止的。』即使過去的罪惡力量極其強大，然而一旦生起其他對治的善心所，就必定會消盡。對此有人指出：這點並不合理，若是如此，只是顯示短暫地投生至無間地獄等，並非表示無法毫無殘留地消盡那些業。若是無法消盡，那麼本應長期承受地獄之苦，成為只是投生其中而已，就如擊打綵球便會立刻彈起一般，投生其中的當下便能脫離，連地獄的火焰等都不必稍微觸及。所以如此一來，既能成立這是因為修習對治品，所以即使是有力的罪惡也能夠被最深度地連根拔除，而這也成立：『已造的不會憑空消失，所以業也不是根本毫無果報。』」","注釋":["昔時罪惡雖極力大然若生起其餘善心對治遍能永盡於此或曰此不應理若如是者：此段箋註連結下文「但為現示須臾感生諸無間等，非是未能無餘永盡所餘諸業」，難以理解，因為前段箋註才說「生起對治就能永盡罪惡」是不合理的，而後文隨即又說「因為如果這是合理的，短暫生到無間地獄等，並非不能顯示惡業完全淨除」，故前後難以會通。依如月格西解釋，此段箋註或可移至此科開頭：「設作是云：『未生怨王及殺母等，若已生起所餘善思——對治，何故其業未得永盡，後世生無間耶？』」則前後連結可解為：「『生起對治就能永盡罪惡』是不合理的，因為如果這是合理的，有人就會反問說：『未生怨王及殺母等人，已經生起了有力對治，但是為何惡業仍然沒有完全淨除，後世還生於無間地獄呢？』」這樣就容易解釋此段箋註。然四家合註各本都沒有將此段箋註移到前面的版本，故不改之。","所餘諸業：法尊法師原譯作「所有諸業」，今據藏文改譯。","最極從根拔除諸惡：法尊法師原譯作「最極拔除諸惡根本」，今據藏文改譯。"],"已校":true},"覺燈日光":null,"時":"65A 04:25","頁":148,"af":"65a","st":265,"et":345,"消文":[{"文":"前面已經講過，就是阿闍世王那個公案。說他永盡了，為什麼還要墮落？造了這個業，業相還是有的。"},{"文":"但他懺悔了，的的確確完全懺悔乾淨，所以雖然墮落，像拍球一樣，「通」一下下去，上來了。"},{"文":"問他無間地獄是什麼？他不曉得；那洛迦的火燄他也沒碰到。"},{"類":"下手","文":"想到這裡要好好懺悔——這是現在唯一的事情；懺悔了，功德增上。"}],"延伸":[],"逐字稿":[{"t":"65A 04:25","b":[["q","設作是云，未生怨王及殺母等，若已生起所餘善思，何故其業未得永盡，生無間耶？是為令於所有業果，發信解故，現示感生諸無間等，非是未能，無餘永盡所有諸業。如擊綵球，隨擊而躍，生彼即脫，雖那洛迦火燄等事，亦未能觸。"],["s","前面已經講過了，就是這個阿闍世王那個公案。他 ─你說他永盡了，他為什麼還要墮落呀？不，他造了這個業，這個業相還是有的，所以大家要了解。但是呢他懺悔了，的的確確完全懺悔乾淨了。他因為懺悔乾淨了，所以雖然墮落，所以像那個擊綵球，像拍球一樣，「通！」一下，下去，上來了。他到了無間地獄，問他無間地獄是什麼？他不曉得。所以那洛迦的火燄他也沒有碰到，那就是這個情況。你想到這裡的話，豈不是從根本圓滿了。啊，所以想到這裡，要好好懺悔啊！現在我們唯一的事情。是將來的惡果，懺悔，現在懺悔了以後能夠功德增上，就這個道理。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/005.mp3"},{"文":"由是則成，最極拔除諸惡根本，亦非諸業全無果報。」","口譯":"由此就成立：既能最徹底地拔除種種惡業的根本，也不是說諸業完全沒有果報。」","四家合註":"<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">以是故，<\/span>由是則成<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">修對治故，亦能<\/span>最極從根拔除<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">具力<\/span>諸惡，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">復能成立：『已作不消亡故，<\/span>亦非諸業<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">畢竟<\/span>全無果報。<span class=\"sjan sj-ba\">』<\/span>」","合註白話":{"same":4},"覺燈日光":null,"時":"65A 05:45","頁":148,"af":"65a","st":345,"et":367,"消文":[{"文":"不但惡業可以徹底淨除；反過來也了解，業一定要感果，至少還有這個形相。"}],"延伸":[],"逐字稿":[{"t":"65A 05:45","b":[["q","由是則成，最極拔除諸惡根本，亦非諸業全無果報。」"],["s","不但是惡的我們徹底淨除，但是反過來也了解，說這個業一定要感果的，至少還有這個形相。那麼下面有一點特別說明一下，這一點非常重要！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/006.mp3"},{"文":"«補特伽羅差別»一類，不決定者。《三摩地王經》說：「勇授大王，殺華月嚴，遂起追悔，為建塔廟，經九十五俱胝千歲，廣興供養，一日三時，悔除罪惡，善護尸羅，然壽沒後，生無間中，經六十二阿庾他俱胝劫，受盲目等無邊眾苦。」","口譯":"這也因人而異：有一類人造的罪，不一定能完全淨除。《三摩地王經》說：「勇授大王殺了華月嚴，後來很後悔，為他建塔，在九千五百億年那麼長的時間裡大做供養，每天三次懺悔罪業，好好守戒；但壽命結束後，還是投生到無間地獄，在極長極長的劫數裡，受眼盲等無邊的苦。」","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第九、一類補特伽羅雖不決定，然亦無過之理：<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">若爾，但唯串習對治，縱罪力大，亦必能從根本淨除之耶？由因業力極大，<\/span>補特伽羅差別一類，不決定者，《三摩地王經》說：勇授大王殺華月嚴，遂起追悔，建立塔廟廣興供養。經九十五俱胝千歲，一日三時，悔除罪惡，善護尸羅。然壽沒後，生無間中；經六十二阿庾他俱胝劫，受盲目等無邊眾苦。<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">無惱指鬘、娑嚩迦等典故，當從《賢愚》等別別經中了知。<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">設作是念：若爾，懺悔至此仍無義耶？<\/span>","合註白話":{"id":"20191","頁":559,"白話":"第五科、必須致力於最初就不要沾染的道理：既然如此，藉由條件俱全的懺悔防護，雖然能夠無餘地淨除罪惡，但是從一開始就不沾染過失的清淨，與懺悔之後的清淨二者有很大的差別。就如《菩薩地》中提到犯根本墮時，雖然可以藉由領受菩薩戒而還淨，但是那一生絕不可能登上初地。《攝研磨經》中也說：「請問道：『世尊，如果有人受惡友影響而犯下如此的謗法罪，世尊，那時此人應如何脫離此罪？』世尊回答文殊童子：『文殊，如果在七年內每日三次懺悔過失，那麼七年後將會淨化，此後至少要經過十劫才能獲得忍位。』」提到即使已經淨除罪惡，但是再怎麼快都必須歷經十劫才能獲得忍位。因此，所謂無餘地淨除的意思，是指無餘地淨除感生不悅意果的機會，但是生起道的證德等，則是被大幅地延後，所以應當致力於一開始就不要沾染。有提到：「邪見、誹謗正法與瞋恨，根本墮、後悔與行動，因為增上慢而驕傲自滿，還有由於貪好財利恭敬而輕視俗人、菩薩與上師，這些是耗盡善業之因。」應當警惕這些而勤於懺悔罪惡。因此提到聖者對於再小的罪墮，就算性命交關也不會明知故犯。如果藉由懺悔淨除與一開始就不違犯二者沒有差別的話，就無須這麼做。在世間也明顯可見，一旦手腳受傷，雖然可以療癒復原，但是終究與從來沒有受傷不同。","注釋":["第五勵力於初即當不沾染之理者：即前頁498「勵力於初即不沾染之理」一科。","懺悔防護：法尊法師原譯作「悔護」。一般而言，「悔」與「懺」意思相通，常並列作「懺悔」，表懺罪時悔心為要，但是藏文二字實有差別；悔乃心所之一，懺則包括四力，各有所指。今為表明此處藏文為「懺」，故改譯。下文亦同。","懺悔：法尊法師原譯作「悔除」，今據藏文改譯。","《菩薩地》中所說：相應段落參見唐玄奘大師譯《瑜伽師地論‧戒品》云：「非諸菩薩暫一現行他勝處法，便捨菩薩淨戒律儀，如諸苾芻犯他勝法，即便棄捨別解脫戒。若諸菩薩由此毀犯，棄捨菩薩淨戒律儀，於現法中堪任更受非不堪任，如苾芻住別解脫戒犯他勝法，於現法中不任更受。」「如是名為菩薩四種他勝處法，菩薩於四他勝處法，隨犯一種，況犯一切，不復堪能於現法中，增長攝受菩薩廣大菩提資糧，不復堪能於現法中，意樂清淨，是即名為相似菩薩，非真菩薩。」此段解釋參見宗喀巴大師所造《菩薩戒品釋》云：「德光論師云：『言攝受者，謂令引發。言增長者，謂令增盛。』餘論釋為『更無勢力能集大地相近資糧』。意樂清淨者，一切釋論皆謂得地，即得初地。總之，隨犯一種他勝處罪，即於現生決定不能證入初地。」見《大正藏》冊30，頁515；《菩薩戒品釋》，頁124；《甘珠爾》對勘本冊73，頁733；《宗喀巴文集》冊1，頁523。","初地：菩薩十地中其中一地。初地菩薩心中的道，由於是十地當中的第一地，所以稱為「初」；由於能夠作為許多功德的所依，就像大地作為山河等的所依，所以稱為「地」。菩薩發菩提心後，累積一大阿僧祇劫的資糧到達圓滿，就能進登初地，成為聖位菩薩。","《攝研磨經》亦云：《攝研磨經》，經集部經典，全名《聖攝一切研磨大乘經》，共1卷。漢譯本有隋毘尼多流支譯《大乘方廣總持經》1卷。此經大意為，佛在王舍城將般涅槃時，入如法三昧，莊嚴大千世界，大眾雲集，佛陀再次現廣長舌相，覆蓋大千世界。至尊彌勒請問法義，於是大眾請佛說此經。佛告彌勒：一切法皆是佛說，不應該分別大小，偏取一邊，假如因此毀謗佛法，則造下無量無邊惡業。又提及阿彌陀佛和世尊往昔因緣，以致佛土示現有淨、穢之別。最後教誡菩薩眾不可以毀謗其他菩薩，假如毀謗的話，則會造下極大的惡業。引文見隋毘尼多流支譯《大乘方廣總持經》作：「爾時文殊師利童子白佛言：『世尊！如佛所說，如是愚人以近惡友現身起謗。如是，世尊！以何因緣能免斯咎？』佛告文殊師利：『我於往昔七年之中，晝夜六時懺悔身、口及與意業所作重罪，從是已後乃得清淨。經十劫已，獲得法忍。』」見《大正藏》冊9，頁382；《甘珠爾》對勘本冊63，頁509。","懺罪：法尊法師原譯作「悔罪」，今據藏文改譯。","忍：此指加行道忍位，為四加行道中的第三階段。修行者獲得加行道忍位時，能夠堪忍證得諸法無我，不會感到懼怕，所以稱作「忍」。獲得加行道忍位以後，不會再由於業惑而投生惡趣受苦。","起道證等極為遙遠：夏日東活佛提到，一般而言，如果犯別解脫戒他勝罪而覆藏，則此生無法獲得阿羅漢果位；如果犯菩薩戒根本墮，則此生無法登地；如果犯密宗戒根本墮，則此生無法獲得雙運果位。參見《夏日東文集》冊1，頁445。","悔行：如月格西解釋，此處悔、行二者並非針對前文的根本墮而言，而是分別指對善行追悔，以及無慚無愧放逸行惡。","愛著利敬故蔑俗菩薩師：如月格西解釋，此句意為尚且不能因為愛著利養而輕蔑俗人，更何況輕視菩薩乃至上師。蔑，音「滅」，輕視。","故說：如《大般涅槃經》提到聖者對微小的罪惡會心生怖畏而護戒。相應段落參見北涼曇無讖譯《大般涅槃經‧聖行品》云：「迦葉！云何菩薩摩訶薩所修聖行？菩薩摩訶薩若從聲聞、若從如來，得聞如是《大涅槃經》，聞已生信，信已應作如是思惟：『諸佛世尊有無上道，有大正法，大眾正行，復有方等大乘經典。我今當為愛樂貪求大乘經故，捨離所愛妻子、眷屬、所居舍宅、金銀珍寶、微妙瓔珞、香花伎樂、奴婢僕使、男女大小、象馬車乘、牛羊鷄犬、猪豕之屬。』復作是念：『居家迫迮，猶如牢獄，一切煩惱由之而生。出家寬曠，猶如虛空，一切善法因之增長。若在家居，不得盡壽淨修梵行，我今應當剃除鬚髮，出家學道。』作是念已，『我今定當出家修學無上正真菩提之道。』菩薩如是欲出家時，天魔波旬生大苦惱，言是菩薩復當與我興大戰諍。善男子！如是菩薩何處當復與人戰諍？是時菩薩即至僧坊，若見如來及佛弟子威儀具足、諸根寂靜、其心柔和、清淨寂滅，即至其所而求出家，剃除鬚髮，服三法衣。既出家已，奉持禁戒，威儀不缺，進止安詳，無所觸犯。乃至小罪，心生怖畏，護戒之心，猶如金剛。善男子！譬如有人帶持浮囊，欲渡大海。爾時海中有一羅剎，即從其人乞索浮囊。其人聞已即作是念：『我今若與必定沒死。』答言：『羅剎！汝寧殺我，浮囊叵得。』羅剎復言：『汝若不能全與我者，見惠其半。』是人猶故不肯與之。羅剎復言：『汝若不肯惠我半者，幸願與我三分之一。』是人不肯。羅剎復言：『若不能者，當施手許。』是人不肯。羅剎復言：『汝今若復不能與我如手許者，我今飢窮，眾苦所逼，願當濟我如微塵許。』是人復言：『汝今所索，誠復不多，然我今日方當渡海，不知前途近遠如何？若與汝者，氣當漸出，大海之難，何由得過？脫能中路沒水而死。』善男子！菩薩摩訶薩護持禁戒，亦復如是，如彼渡人護惜浮囊。菩薩如是護戒之時，常有煩惱諸惡羅剎，語菩薩言：『汝當信我，終不相欺，但破四禁，護持餘戒，以是因緣，令汝安隱，得入涅槃。』菩薩爾時應作是言：『我今寧持如是禁戒墮阿鼻獄，終不毀犯而生天上。』煩惱羅剎復作是言：『卿若不能破四禁者，可破僧殘，以是因緣，令汝安隱得入涅槃。』菩薩亦應不隨其語。羅剎復言：『卿若不能犯僧殘者，亦可故犯偷蘭遮罪，以是因緣令汝安隱得入涅槃。』菩薩爾時亦復不隨。羅剎復言：『卿若不能犯偷蘭遮者，可犯捨墮，以是因緣可得安隱入於涅槃。』菩薩爾時亦不隨之。羅剎復言：『卿若不能犯捨墮者，可破波夜提，以是因緣令汝安隱得入涅槃。』菩薩爾時亦不隨之。羅剎復言：『卿若不能犯波夜提者，幸可毀破突吉羅戒，以是因緣可得安隱入於涅槃。』菩薩爾時心自念言：『我今若犯突吉羅罪，不發露者，則不能渡生死彼岸而得涅槃。』菩薩摩訶薩於是微小諸戒律中，護持堅固心如金剛。菩薩摩訶薩持四重禁及突吉羅，敬重堅固，等無差別。菩薩若能如是堅持，則為具足五根諸戒，所謂具足菩薩根本業清淨戒、前後眷屬餘清淨戒、非諸惡覺覺清淨戒、護持正念念清淨戒、迴向阿耨多羅三藐三菩提戒。」見《大正藏》冊12，頁432；《甘珠爾》對勘本冊52，頁407。","故說聖者於微罪墮：法尊法師原譯作「是故聖者於微小罪」，今據藏文改譯。"],"已校":true},"覺燈日光":null,"時":"65A 06:07","頁":148,"af":"65a","st":367,"et":453,"消文":[{"文":"前面說可以永盡，這裡卻還有不一定的：補特伽羅——就是你造業的對象。"},{"文":"華月嚴是個菩薩；勇授大王殺了他就後悔，建塔廟、懺悔——照前面說四力應該都有了。"},{"文":"時間這麼長，廣興供養、一日三時悔除、善護尸羅，死了以後還生到阿鼻地獄，出來還受盲目等無邊眾苦。"}],"延伸":[{"題":"補特伽羅差別","組":[{"題":"傷大乘補特伽羅，最難懺","說":[{"類":"因","文":"為什麼這裡抵銷不掉？因為他殺的對象是大乘菩薩。"},{"類":"立","文":"傷的對象是人如此，傷的是法也一樣：謗大乘經典的罪過一樣難懺。"},{"類":"因","文":"大乘的法相、發了心的大菩薩跟法界相應；怎麼懺悔，就是沒辦法跟它相應。"},{"類":"例","文":"經上說三千大千世界眾生都證了果，不如對大乘經典的隨喜功德——《法華經》〈隨喜功德品〉。"}]},{"題":"發大菩提心，悔過力大","說":[{"類":"回扣","文":"黑板上懺悔支：違背大乘戒、傷害大乘行者、毀謗大乘佛法之難懺，這裡特別警惕；量到上士才說出來。"},{"類":"立","文":"反過來妙了：真正發大菩提心，心也跟法界相應，那時悔過的力量大得不得了。"}]}],"說":[{"類":"因","文":"為什麼這裡抵銷不掉？因為他殺的對象是大乘菩薩。"},{"類":"立","文":"傷的對象是人如此，傷的是法也一樣：謗大乘經典的罪過一樣難懺。"},{"類":"因","文":"大乘的法相、發了心的大菩薩跟法界相應；怎麼懺悔，就是沒辦法跟它相應。"},{"類":"例","文":"經上說三千大千世界眾生都證了果，不如對大乘經典的隨喜功德——《法華經》〈隨喜功德品〉。"},{"類":"回扣","文":"黑板上懺悔支：違背大乘戒、傷害大乘行者、毀謗大乘佛法之難懺，這裡特別警惕；量到上士才說出來。"},{"類":"立","文":"反過來妙了：真正發大菩提心，心也跟法界相應，那時悔過的力量大得不得了。"}],"af":"65a","st":461}],"逐字稿":[{"t":"65A 06:07","b":[["q","補特伽羅差別一類，不決定者。《三摩地王經》說：「勇授大王，殺華月嚴，遂起追悔，為建塔廟，經九十五俱胝千歲，廣興供養，一日三時，悔除罪惡，善護尸羅，然壽沒後，生無間中，經六十二阿庾他俱胝劫，受盲目等無邊眾苦。」"],["s","欸！前面告訴我們可以永盡的，這個地方卻還有不一定的喲！什麼呢？補特伽羅 ─說你造的對象。引經上面，說這麼一個人哪，勇授大王殺了一個華月嚴，為什麼？華月嚴是個菩薩，他把他殺了以後就後悔了，然後呢為他建塔廟，然後去懺悔。喔唷，不得了哦！照前面所說的這個懺悔的話，他四力應該都有了。經這麼長，「九十五俱胝千歲」，而且「廣興供養」，而且一天三時地悔除罪過，而且善護尸羅，但是死了以後還生到無間當中，生到阿鼻地獄。時間經過這麼長，出來了以後，「受盲目等無邊眾苦」。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/007.mp3"},{"文":"雖則如是，然其悔罪非為唐捐。","口譯":"雖然是這樣，但他的悔罪並沒有白費。","四家合註":"雖則如是，然其悔罪非為唐捐。","合註白話":{"same":6},"覺燈日光":null,"時":"65A 07:33","頁":148,"af":"65a","st":453,"et":461,"消文":[{"文":"雖然這樣，他的懺悔還是沒有白費。"}],"延伸":[],"逐字稿":[{"t":"65A 07:33","b":[["q","雖則如是，然其悔罪非為唐捐。"],["s","雖然這樣哦，但他的懺悔還是沒有白費哦！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/008.mp3"},{"文":"若不悔除，須受極重恆常大苦，尤過彼故。","口譯":"因為如果不悔除，就必須領受極重而恆常的大苦，比那個還要嚴重的緣故。","四家合註":"若不悔除，須受極重恆常大苦，尤過彼故。<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">師云：如是具戒比丘，以還淨法淨除殺害旁生之墮，雖不能淨其罪，然前所作非為無義，以若不行還淨，則墮罪異熟及其衍息更尤重故。是故四力對治淨罪之理，雖由對治力之大小，與時之長短等，隨其所應，而有根除者、有重轉輕微者、有長時轉短時等。然凡所淨之分，即如種為火燒，縱然遇緣，終不生果。而將後世引至此生者，或如修長壽法，能將後世天身長壽引至此生等，有種種相。<\/span>","合註白話":{"same":6},"覺燈日光":null,"時":"65A 07:41","頁":148,"af":"65a","st":461,"et":580,"消文":[{"文":"懺悔的力量還是有的，有多少懺悔的力量就抵銷掉多少。"}],"延伸":[],"逐字稿":[{"t":"65A 07:41","b":[["q","若不悔除，須受極重恆常大苦，尤過彼故。"],["s","他懺悔的力量還是有的，他有多少懺悔的力量就抵銷掉多少。那麼為什麼這個地方抵銷不掉呢？因為他所殺的那個對象，他是一個大乘的菩薩。所以如果說你傷的對象是人，這樣；如果你傷的對象是法，也是一樣。所以注意喔！這個謗大乘經典的這個罪過的難懺也是一樣，難懺悔也是一樣喔！因為這個大乘的法相是什麼？跟法界相應的。發了心的這個眾生 ─大菩薩跟法界相應的；你怎麼懺悔，你就是沒有辦法跟這個東西相應。這個羅漢，那個怎麼個弄法 ─所以處處地方，經上面說，哎呀，三千大千世界所有的眾生證了果了，對不起！你不如那個對大乘經典，乃至於隨喜的功德等等，《法華經》上面〈隨喜功德品〉有這件事情。"]]},{"t":"65A 08:47","b":[["s","關於這一點，講到將來這個上士的時候，才說出這個量來，這一點我們要注意啊！所以黑板上關於這一點，懺悔支，為什麼違背，尤其是大乘戒，以及對於這個大乘的行，以及對大乘的法，傷害了這個大乘的行者，以及毀謗了這個大乘的佛法之難懺。這個地方就特別告訴我們一下，特別警惕一下。但是反過來，妙咧！假定你真正地能夠發大乘的大菩提心的話，欸，妙咧！因為你的心也跟法界相應，那個時候你這個悔過的力量之大，是大得不得了！這個到後面慢慢、慢慢地再去講它，再去講它。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/009.mp3"},{"文":"又由悔護清淨無餘，然從最初無罪染之清淨，及由悔除清淨之二，有大差殊。","口譯":"又，雖然由悔除和防護可以清淨無餘，但是從最初就沒有罪染的清淨，和由悔除而得的清淨，這兩者有很大的差別。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第五、勵力於初即當不沾染之理者：<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如是<\/span>又由<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">具相<\/span>懺悔防護<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">罪惡<\/span>清淨無餘，然從最初無罪染之清淨，及由懺悔清淨之二，有大差殊。","合註白話":{"same":6},"覺燈日光":null,"時":"65A 09:40","頁":148,"af":"65a","st":580,"et":605,"消文":[{"文":"雖然可以懺乾淨，但懺乾淨跟一開始沒有犯，兩樣東西有絕大的差別。"}],"延伸":[],"逐字稿":[{"t":"65A 09:40","b":[["q","又由悔護清淨無餘，然從最初無罪染之清淨，及由悔除清淨之二，有大差殊。"],["s","雖然可以懺乾淨，但是這個懺乾淨跟一開始沒有犯，兩樣東西有絕大的差別哦！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/010.mp3"},{"文":"猶如〈菩薩地〉中所說，犯根本罪，雖可重受菩薩律儀，而能還出，然於此生，決定不能獲得初地。","口譯":"就像〈菩薩地〉說的：犯了菩薩戒的根本罪，雖然可以重新受菩薩戒、把罪清淨回來，但這一生一定證不到初地。","四家合註":"猶如《菩薩地》中所說，犯根本罪雖可重受菩薩律儀而能還出，然於此生決定不能獲得初地。","合註白話":{"same":6},"覺燈日光":null,"時":"65A 10:05","頁":148,"af":"65a","st":605,"et":659,"消文":[{"文":"犯了根本罪完全壞掉；懺悔乾淨重受，清淨這一點一樣，證得功德那一點就不一樣：這一生決定不能獲得初地。"},{"文":"末法好像總是沒希望；其實到現在都還有圓滿的教法，有這個可能。"},{"文":"所以根本戒絕對重要，絕對不能破壞，原因在此。"}],"延伸":[],"逐字稿":[{"t":"65A 10:05","b":[["q","猶如〈菩薩地〉中所說，犯根本罪，雖可重受菩薩律儀，而能還出，然於此生，決定不能獲得初地。"],["s","〈菩薩地〉上面告訴我們，你犯了根本罪以後，唉，完全壞掉了。壞掉了以後，你雖然懺悔乾淨，重受，你還是可以得到清淨。對於得到清淨那一點來說是一樣的，但是要證得功德那一點來說，那就不一樣了，這一生哪，你決定不能獲得初地。以我們現在來說，因為我們末法了，我們好像總是沒有希望。實際上正法的時候 ─是！有這個可能。實際上一直到現在，都尚且有這個圓滿的教法，有這個可能。所以它那個根本的戒是絕對、絕對地重要！絕對不能破壞！原因就在此。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/011.mp3"},{"文":"《攝研磨經》亦云：「世尊，設若有一，«由近惡友增上力故»，造作如此誹謗正法，世尊爾時如何能脫此罪。作是請已，世尊告妙吉祥童子云，曼殊室利，設七年中，一日三時於罪悔罪，後乃清淨，其後至少須經十劫，始能得忍。」","口譯":"《攝研磨經》也說：「世尊！假如有人由於親近惡友的增上力，造作了這樣誹謗正法的罪，世尊，那時他要怎樣才能脫離這罪？」這樣請問後，世尊告訴妙吉祥童子說：「曼殊室利！假如在七年之中，每天三時對所犯的罪悔罪，之後才得清淨；在那之後至少還要經過十劫，才能得忍。」","四家合註":"《攝研磨經》亦云：「世尊，設若有一由近惡友增上力故，造作如此誹謗正法。世尊，爾時如何能脫此罪？作是請已，世尊告妙吉祥童子云：曼殊室利，設七年中，一日三時於罪懺罪，後乃清淨，其後至少須經十劫，始能得忍。」","合註白話":{"same":6},"覺燈日光":null,"時":"65A 10:59","頁":148,"af":"65a","st":659,"et":843,"消文":[{"文":"馬上引經證明：文殊菩薩問世尊，有人誹謗正法怎麼辦。"},{"文":"犯了以後七年當中一日三時悔過，可以清淨；但至少要經過十劫才能得忍——證得初地無生法忍。"},{"類":"下手","文":"這個戒千萬不能犯，尤其謗正法戒、對菩薩的瞋恨心；對大乘教法沒有正確認識前，千萬不要順著自己的知見亂來。"}],"延伸":[{"題":"由近惡友增上力故","組":[{"題":"一切壞處從惡友來","說":[{"類":"回扣","文":"前面一開始說：一切好處都從善知識來；反過來，一切壞處從惡友、惡知識來。"},{"類":"立","文":"這裡不講惡知識、不講壞蛋，講「惡友」——是你的好朋友，跟你滿好，但沒有正知見。"}]},{"題":"似是而非，要有知見判別","說":[{"類":"例","文":"惡友來同情你：「你這麼辛苦，常住的規定真不合理，叫你做這些事情！」"},{"類":"下手","文":"要有自己的知見去判別：常住不如理，你應該離開；常住如理，那個惡友趕快遠離。"},{"類":"立","文":"惡知識說的相似、似是而非，講起來很有道理；跟他在一起，這種虧吃起來不得了地嚴重。"}]}],"說":[{"類":"回扣","文":"前面一開始說：一切好處都從善知識來；反過來，一切壞處從惡友、惡知識來。"},{"類":"立","文":"這裡不講惡知識、不講壞蛋，講「惡友」——是你的好朋友，跟你滿好，但沒有正知見。"},{"類":"例","文":"惡友來同情你：「你這麼辛苦，常住的規定真不合理，叫你做這些事情！」"},{"類":"下手","文":"要有自己的知見去判別：常住不如理，你應該離開；常住如理，那個惡友趕快遠離。"},{"類":"立","文":"惡知識說的相似、似是而非，講起來很有道理；跟他在一起，這種虧吃起來不得了地嚴重。"}],"af":"65a","st":659}],"逐字稿":[{"t":"65A 10:59","b":[["q","《攝研磨經》亦云：「世尊，設若有一，由近惡友增上力故，造作如此誹謗正法，世尊爾時如何能脫此罪。作是請已，世尊告妙吉祥童子云，曼殊室利，設七年中，一日三時於罪悔罪，後乃清淨，其後至少須經十劫，始能得忍。」"],["s","馬上證明經上面的。這個是文殊菩薩問世尊，那麼世尊就告訴他，說有一個人哪，他假定「誹謗正法」，前面一句話很重要哦，「由近惡友增上力故」。前面一開始告訴我們，一切的好處都從善知識來，反過來，一切的壞處是從惡友、惡知識。這個地方注意啊！他不講惡知識，他不講壞蛋，講「惡友」，這是你的好朋友哦！但是這個好朋友，他沒有正知見，欸，他還跟你滿好囉！哎呀，這個東西呀，來同情你，說：「某人哪！你這麼辛苦，這個常住的規定真不合理，叫你做這些事情哦！」對不起，你那時候要有自己的知見去判別、判別。如果常住的確不如理，你應該離開，如果常住是如理的話，那個惡友你趕快遠離。你碰著他一塊的時候，有你虧吃的，這種虧吃起來是不得了地嚴重哦！這一點，真正修學佛法最好的是莫過於善知識，反過來，最嚴重的是莫過於惡知識。他惡知識說的有相似，似是而非的，講起來很有道理哦！現在我們很容易碰見這種情況，很容易碰見這種情況。"]]},{"t":"65A 12:57","b":[["s","那個時候你如果說「誹謗」啦，那麼，怎麼辦呢？佛就告訴我們，你犯了這個罪以後，七年當中，「一日三時於罪悔過」，要經過這麼長如法如理努力，你可以。但是至少要經過十劫，才能夠「得忍」。要經過這麼長的時候，才能夠證得初地無生法忍。這麼長的時候，喔！這個時間，還是非常嚴重啊！所以，注意啊！這個戒是千萬不能犯，尤其是謗正法戒，以及對菩薩的瞋恨心這一類。最主要的就對大乘教法，在我們沒有正確認識之前啊，千萬不要隨意這個順著自己的知見亂來。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/012.mp3"},{"文":"此說諸惡雖已清淨，然得忍位，任如何速，須經十劫。是故無餘清淨之義，謂是能感非悅意果，無餘永淨。","口譯":"這是說種種惡業雖然已經清淨，但要得到忍位，不論多快，都必須經過十劫。所以「無餘清淨」的意義，是指能感得不悅意果報的那部分，毫無剩餘地永遠清淨。","四家合註":"此說諸惡雖已清淨，然得忍位，任如何速，須經十劫。是故無餘清淨之義，謂是能感非悅意果無餘永淨，","合註白話":{"same":6},"覺燈日光":null,"時":"65A 14:03","頁":149,"af":"65a","st":843,"et":869,"消文":[{"文":"「無餘清淨」是指感惡果的那個惡業，可以完全弄乾淨。"}],"延伸":[],"逐字稿":[{"t":"65A 14:03","b":[["q","此說諸惡雖已清淨，然得忍位，任如何速，須經十劫。是故無餘清淨之義，謂是能感非悅意果，無餘永淨。"],["s","喏，這個說明了，所以「無餘清淨」是指什麼而言？就是感惡果的這個惡業，可以完全弄乾淨，對於道的證等，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/013.mp3"},{"文":"起道證等，極為遙遠，故應勵力，令初無犯。","口譯":"但要生起道的證德等等，卻極為遙遠；所以應當努力，讓自己從一開始就不犯。","四家合註":"起道證等，極為遙遠，故應勵力，令初無犯。","合註白話":{"same":6},"覺燈日光":null,"時":"65A 14:29","頁":149,"af":"65a","st":869,"et":894,"消文":[{"文":"對於道的證德，極為遙遠；所以一開始就不要犯。"},{"文":"哪怕再小的戒，你把它看得最大，對我們絕定有好處。"}],"延伸":[],"逐字稿":[{"t":"65A 14:29","b":[["q","起道證等，極為遙遠，故應勵力，令初無犯。"],["s","所以我們一開始的時候不要犯。說到這裡，為什麼我們對小小戒要感到，哪怕再小的戒，你把它看得最大的，對我們絕定有好處，對我們絕定有好處！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/014.mp3"},{"文":"是故聖者，於微小罪，«雖為命故，不故知轉»。若懺悔淨，與初無犯二無差別，是則無須如是行故，即如世間，亦可現見傷手足等，雖可治療，然終不如初未傷損。","口譯":"所以聖者對於微小的罪，即使是為了保全性命，也不會明知故犯。如果懺悔所得的清淨與最初不犯沒有差別，那就不需要這樣做了。就像世間也可以看到，手腳等受了傷，雖然可以治療，但終究不如最初沒有受傷。","四家合註":"<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">如云：「邪見謗法瞋，根本墮悔行，增上慢驕滿，愛著利敬故，蔑俗菩薩師，是盡善法因。」應當慎防此等，勵力懺罪。<\/span>故說聖者於微罪墮，雖為命故，不故知轉。若懺悔淨與初無犯二無差別，是則無須如是行故。即如世間，亦可現見傷手足等，雖可治療，然終不如初未傷損。","合註白話":{"same":6},"覺燈日光":null,"時":"65A 14:54","頁":149,"af":"65a","st":894,"et":1116,"消文":[{"文":"真正的聖者就是這樣；我們要學佛，就要努力去學。"},{"文":"不是馬上教我們做到，而是因地當中種下這個種子，將來很容易做到。"},{"類":"下手","文":"常常想：「聖者尚且如此，我凡夫怎麼可以？我要努力！」做不到也不會錯到哪裡去，慢慢罪障淨除、資糧集聚。"},{"文":"「若懺悔淨…然終不如初未傷損」這幾句師父沒有唸，也沒有另外解。"}],"延伸":[{"題":"雖為命故，不故知轉","組":[{"題":"隨方毘尼的藉口","說":[{"類":"例","文":"有人說：「這是佛三千年前制的，時代、地點跟現在不一樣，佛不是說隨方毘尼嗎？佛在現在制的戒也一定不是這樣。」"},{"類":"破","文":"講得很有道理，心裡就輕棄掉這個戒；找了最大的藉口也不知道，由一點小地方引發非常嚴重的。"}]},{"題":"為何我感得末法","說":[{"類":"下手","文":"要想：時地是有不同，但請問（問我自己）——為什麼我感得現在的末法，感不到世尊正法的時候？"},{"類":"立","文":"一想到這裡就慚愧、懊悔，拼命都來不及；知見就差這一點點。"}]},{"題":"戰戰兢兢，隨順環境","說":[{"類":"立","文":"客觀環境的確如此，慢慢隨順；戰戰兢兢，心裡覺得「沒辦法也只好這樣」——那時用隨方毘尼就對了。"},{"類":"立","文":"這樣念佛沒問題：欣、厭之心生起，覺得自己一無是處、唯一依靠是佛，一心念佛，一定去。"},{"類":"例","文":"就算沒有，把持正見，最多掉落龍當中，彌勒佛出世時解脫。"},{"類":"回扣","文":"虛空可以變，佛講的話絕對不會差，這是絕對信得過的。"}]}],"說":[{"類":"例","文":"有人說：「這是佛三千年前制的，時代、地點跟現在不一樣，佛不是說隨方毘尼嗎？佛在現在制的戒也一定不是這樣。」"},{"類":"破","文":"講得很有道理，心裡就輕棄掉這個戒；找了最大的藉口也不知道，由一點小地方引發非常嚴重的。"},{"類":"下手","文":"要想：時地是有不同，但請問（問我自己）——為什麼我感得現在的末法，感不到世尊正法的時候？"},{"類":"立","文":"一想到這裡就慚愧、懊悔，拼命都來不及；知見就差這一點點。"},{"類":"立","文":"客觀環境的確如此，慢慢隨順；戰戰兢兢，心裡覺得「沒辦法也只好這樣」——那時用隨方毘尼就對了。"},{"類":"立","文":"這樣念佛沒問題：欣、厭之心生起，覺得自己一無是處、唯一依靠是佛，一心念佛，一定去。"},{"類":"例","文":"就算沒有，把持正見，最多掉落龍當中，彌勒佛出世時解脫。"},{"類":"回扣","文":"虛空可以變，佛講的話絕對不會差，這是絕對信得過的。"}],"af":"65a","st":938}],"逐字稿":[{"t":"65A 14:54","b":[["q","是故聖者，於微小罪，雖為命故，不故知轉。"],["s","真正的聖者就是這樣的，現在我們不是要學佛嗎？對！我們要努力去學。這一點要再說一下，不是說馬上教我們做到，但是我們因地當中啊，要種下這個種子，你種下這個種子，你將來很容易做到。所以我們常常想：「哎呀，我是個凡夫啊！聖者尚且如此，我凡夫怎麼可以？我要努力啊！」你一直這樣子去想！雖然你做不到，你不會錯到哪裡去。你努力地做，慢慢、慢慢地罪障淨除了，慢慢地資糧集聚了，有一天你很容易做到。"]]},{"t":"65A 15:38","b":[["s","如果你不這樣想，反過來，你現在有人說：「哎呀，這個是佛在三千年以前制的啦！那個是時代啊，那個時候所處的地點跟現在不一樣啦！佛不是說那個隨方毘尼嗎？對啊！現在時間也不同，地點也不同，這個也你不要去管它啦！」欸，講得很有道理啊！然後你還自己覺得：「欸，如果是佛在現在的話，制的戒也一定不是這樣的哦！」你講得很有道理，很容易地，你心裡面就輕棄掉了這個戒。然後呢，自己找了最大的藉口也不知道，下面去，很可能由這樣一點小小的地方，引發了非常嚴重的，非常嚴重的。所以我們必定要想：「是啊！沒有錯，這個時、地是有不同的，但是請問（這個所謂請問是問我自己啊），為什麼我感得現在的末法，感不到世尊正法時候啊？」你為什麼不從這個眼光去想？你一想到這裡就慚愧，然後你就懊悔，拼命都來不及，還會說：「對啊！三千年以前的，如果世尊在現在的時候不這樣了！」你這個概念就整個改掉了，所以這個知見就差一點點哦！這一個概念我們要了解哦！"]]},{"t":"65A 17:10","b":[["s","並不是說一定要教你怎麼樣，然後你做的時候，我們做，仍舊是 ─是的，環境固然是如此嘛，我的的確確這客觀的環境就是如此啊！那我還在慢慢、慢慢地、慢慢地隨順著這個，這個倒是千真萬確的。那個時候你用那個隨方毘尼，那就對了！你是戰戰兢兢地，心裡總覺得：唉！那沒辦法，沒辦法也只好這樣。在這種情況之下如果是你念佛，沒問題，可以念得去。的的確確你能夠欣、厭之心生起來，你把持住這個，一心念佛。因為什麼？你心裡面造的業是什麼業？你感覺得：唉，這個是一無是處；然後你唯一的依靠是他，雖然你做不圓滿，你的業是這個嘛，到那時候你一定去。就算你沒有這個，你把持這個正見，將來你最多掉落龍當中，欸！到彌勒佛出世的時候你解脫了。經上面告訴我們清清楚楚，佛說的話，前面說的，虛空可以變哪，佛講的話是絕對不會一點點差的，這是我們絕對可以信得過的一件事情，就在這裡。繼續下去。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/015.mp3"},{"文":"如是勵力，如《集法論》云：「若作諸惡未修福，誤失正法得非法，具惡業人死怖畏，如於大海散朽船。","口譯":"應當這樣努力，如《集法論》說：「如果造作種種惡業而沒有修福，誤失了正法而得到非法，這種具有惡業的人臨死時會恐怖畏懼，就像在大海中乘著快要散掉的朽船。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第六、須當修持之喻者：<\/span>如是勵力，如《集法論<span class=\"sjan sj-ba\">．<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">罪惡品<\/span>》云：「<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">其因緣者，能仁於舍衛城現大神變，制伏富蘭那等，而說此二偈。<\/span>若作諸惡未修福，誤失正法得非法，具惡業人死怖畏，如於大海散朽船。","合註白話":{"id":"20346","頁":563,"白話":"第六科、必須修持的比喻：如此努力，如同《集法句‧罪惡品》記載當時的因緣，是佛陀在舍衛城顯現廣大神變，降伏富蘭那等而宣說這兩個偈頌，提到：「作惡而不積福，錯失正法而得到非法，身懷罪業的人們將會恐懼死亡，就像殘破的船隻在汪洋中解體。積福而不作惡，奉行殊勝正士宗風的法，他便永遠不會恐懼死亡，就像乘著牢固的船隻航向對岸。」不應像前者那樣，而應當盡力成為後者。","注釋":["如《集法論》云：此二偈因緣語王大師雖說是於釋尊現大神變時所說，然在《集法句釋》中，此二偈的因緣則為菩薩在菩提樹下將成道時，無量魔軍圍繞，天人詢問菩薩是否怖畏，菩薩於是以此二偈回答，與語註所述不同。引文於漢譯本中無相應段落。典故參見《大正藏》冊24，頁331；《丹珠爾》對勘本冊83，頁876；《甘珠爾》對勘本冊11，頁94。引文見《丹珠爾》對勘本冊83，頁71。","富蘭那：印度六師外道之一，全名富蘭那迦葉（Pūraṇakāśyapa），又作棓刺拏、布刺拏、不蘭迦葉、補刺那迦葉、布賴那伽葉、布刺拏迦葉波、晡刺拏迦攝波子。為舍衛國婆羅門，有五百位弟子，宣講無因、無道德、眾生所造善惡皆沒有果報。後來因為佛教興起，並且與其門徒辯論。因此六師外道聯合，要與佛陀比試神通，請波斯匿王主持，佛陀答應七天後，與六師外道比試神通。七天後，大眾集會於舍衛國，佛陀現大神變，國王請六師外道顯示神通，六師無以回應。最後金剛手大藥叉主放猛風、下暴雨，將六師外道房舍摧毀，於是富蘭那等六師外道全部逃散。參見《大正藏》冊4，頁360；《佛光大辭典》冊7，頁6213。","朽船：藏文原意為不好的船隻。朽，音「ㄒㄧㄡˇ」，腐敗。","應如後者勵力而行：法尊法師原譯作「應如後行」，今據藏文補譯。"],"已校":true},"覺燈日光":null,"時":"65A 18:36","頁":149,"af":"65a","st":1116,"et":1153,"消文":[{"文":"造了很多壞事，沒有積福，傷害了正法，做的都是非法；這樣造惡業的人死的時候就恐怖。"},{"類":"喻","文":"像在大海裡面乘一艘破爛的爛船。"}],"延伸":[],"逐字稿":[{"t":"65A 18:36","b":[["q","如是勵力，如《集法論》云：「若作諸惡未修福，誤失正法得非法，具惡業人死怖畏，如於大海散朽船。"],["s","造了很多壞事，沒有積福，然後呢正法傷害了，做了都是非法的。像這樣的造惡業的人，死的時候就恐怖，為什麼呀？像大海裡面乘一個破爛的爛船一樣，乘一個破爛的爛船一樣。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/016.mp3"},{"文":"若已修福未作惡，行諸善士妙法軌，«此則終無死亡怖»，如乘固船登彼岸。」","口譯":"如果已經修福而沒有作惡，奉行諸善士的妙法軌則，這樣的人終究不會有死亡的恐怖，就像乘著堅固的船登上彼岸。」","四家合註":"若已修福未作惡，行諸善士妙法軌，此則終無死亡怖，如乘固船登彼岸。」莫依前作，應如後者勵力而行。","合註白話":{"same":15},"覺燈日光":null,"時":"65A 19:13","頁":149,"af":"65a","st":1153,"et":1454,"消文":[{"文":"造了種種福業，惡業沒有造，所有行為都是「妙法軌」，不是普通的善。"},{"類":"喻","文":"乘堅固的船：在海裡不出毛病，而且到彼岸去，高興快樂，哪裡會恐怖？"}],"延伸":[{"題":"此則終無死亡怖","組":[{"題":"如法行持，死時歡喜","說":[{"類":"例","文":"古人到死的時候高高興興到處告別：「再過幾天我要走了！」等著阿彌陀佛來接，哪有不歡喜？"},{"類":"立","文":"不但古人，如法行持的今人還是有，師父親眼看見。"},{"類":"下手","文":"你們只要如法去試，心裡也會生起這個量來。"}]},{"題":"受罵如還債，無債一身輕","說":[{"類":"立","文":"業感果，所以不必看果是什麼，看業是什麼；業從你心裡造起。"},{"類":"例","文":"人家罵你：「我前面欠了他的債，今天還了，高興！無債一身輕。」"},{"類":"例","文":"以前不知道：他罵我、我再罵他，永遠在地獄裡滾，偶然到人間又造大罪下去。"}]},{"題":"成就忍辱，病為策勵","說":[{"類":"立","文":"不但還了債，他還成就我的忍辱；沒有人來罵你，能忍辱、持戒、精進嗎？六波羅蜜的功德都靠他完成。"},{"類":"例","文":"生病也歡喜：病是還以前的惡業，現在要造善業；而且病是死因，趕快多念阿彌陀佛。"}]},{"題":"業重業近，臨終不怖","說":[{"類":"回扣","文":"業在生死當中的行相：第一個是重，第二個是近。"},{"類":"立","文":"以前造了重業一定去；業力不夠重，拼命念是「近」，一直保持這個念到死，一定到極樂世界。"},{"類":"回扣","文":"理路清楚了，去試，相應時一一現起，死的時候也不會怕。"}]}],"說":[{"類":"例","文":"古人到死的時候高高興興到處告別：「再過幾天我要走了！」等著阿彌陀佛來接，哪有不歡喜？"},{"類":"立","文":"不但古人，如法行持的今人還是有，師父親眼看見。"},{"類":"下手","文":"你們只要如法去試，心裡也會生起這個量來。"},{"類":"立","文":"業感果，所以不必看果是什麼，看業是什麼；業從你心裡造起。"},{"類":"例","文":"人家罵你：「我前面欠了他的債，今天還了，高興！無債一身輕。」"},{"類":"例","文":"以前不知道：他罵我、我再罵他，永遠在地獄裡滾，偶然到人間又造大罪下去。"},{"類":"立","文":"不但還了債，他還成就我的忍辱；沒有人來罵你，能忍辱、持戒、精進嗎？六波羅蜜的功德都靠他完成。"},{"類":"例","文":"生病也歡喜：病是還以前的惡業，現在要造善業；而且病是死因，趕快多念阿彌陀佛。"},{"類":"回扣","文":"業在生死當中的行相：第一個是重，第二個是近。"},{"類":"立","文":"以前造了重業一定去；業力不夠重，拼命念是「近」，一直保持這個念到死，一定到極樂世界。"},{"類":"回扣","文":"理路清楚了，去試，相應時一一現起，死的時候也不會怕。"}],"af":"65a","st":1153}],"逐字稿":[{"t":"65A 19:13","b":[["q","若已修福未作惡，行諸善士妙法軌，此則終無死亡怖，如乘固船登彼岸。」"],["s","反過來，你造了種種的福業，而惡業呢沒有造。然後你所有的行為都是什麼？「妙法軌」，這個善不但是普通的，妙法啊！這樣情況之下，你對死亡你就不會恐怖。就像什麼？乘一個堅固的船，在海裡不會出毛病，第一個。而且這個船幹什麼？到彼岸去，本來這個地方是一無是處，現在有這麼一個好的船到彼岸去，你高興快樂，哪裡會恐怖？不會恐怖，這也是千真萬確的事實。你看古人這種狀態，古人這種狀態，他到死了以後，他高高興興地到處去告別：「某人啊，再過幾天我要走了！」他心裡好歡喜，為什麼歡喜？再過幾天，他不要在這個娑婆世界受苦了，到極樂世界去了，然後等著阿彌陀佛來接他，哪有不歡喜的事情？不但古人，這個說「古人」的話，就是如法行持的，今人還是有這種人，這是我親眼看見的。你們不妨去自己試試看，你們只要如法去試的話，你們自己心裡面也會生起這個量來，我告訴你。就這麼千真萬確！"]]},{"t":"65A 20:54","b":[["s","我可以立刻舉個例子來告訴你，業─感果，所以我們不必看果是什麼，我們看業是什麼。業是哪裡造起？你心裡造起。如果你現在懂得了以後，那麼人家來罵你了，以前是罵你的時候，照你平常的知見：這個傢伙沒有道理，怎麼跑得來罵我？現在你懂得了這個道理以後，那簡單得很啊！你有道理，他又偏偏罵你的話，「我前面欠了他的債。啊！好，今天還了他，高興！無債一身輕。」更進一步啊：欸，以前不知道，輾轉地來，他罵我，我再罵他；他再罵我，我再罵他 ……永遠在地獄裡面滾。偶然跑到人世間，人世間才得到一 ……這個罪剛輕一點點，偶然跑到人世間又造了大罪，下去！我現在懂得了這個道理以後，以前到了大苦消完了，跑到人間把他還債了，得到了這個機會還掉了，啊，真高興！這第一個高興。"]]},{"t":"65A 22:07","b":[["s","第二個呢，我現在不但是還了債，而且還要向上，他成就我的忍辱。喔，你正更高興啊！假定沒有這個人來罵你，請問你能忍辱嗎？請問你能持戒嗎？請問你能精進嗎？從這個地方說起來，所有的這個六波羅蜜的功德，都靠他讓你完成的，那個時候你想到你歡喜，啊呀，你這歡喜得不得了！眼前很簡單一件事情，他罵你嘛，你也歡喜，然後你生病嘛，你也歡喜。為什麼？同樣的道理呀，對心上面他是罵你，對身上面就是病痛嘛！一樣的道理。啊，那現在好極了，正好因為那個病策勵你說，那以前為什麼生病？那以前造的惡業，因為惡業所以生病；現在呢，我了解了，那個病是還以前的惡業，可是現在我要造善業啊！而且病是死因，喔唷，趕快多念阿彌陀佛，念得清清楚楚，曉得每一句話，拼命念。"]]},{"t":"65A 23:18","b":[["s","如果說你以前已經造了「重」的業的話，那是一定去；如果說你的業力不夠重的話，你拼命地念，這是「近」，對不對？我們業在生死當中的行相是什麼？第一個是重，第二個是近。所以病是死因，現在病完了要死，所以你現在拼命念，嘎啦、嘎啦念，一直保持這個念。如果念到死的話，到那個時候一定到極樂世界去嘛！這不是很清楚、很明白嗎？你當下就可感受得到，想想看對不對？理路現在清楚了，你們只要去試，你真正地試到相應的時候，一一會現起。所以說古人、古人哪，所以真正地說起來，就是如法的道理他去做了。比起現在這個人人做不到的差別，你只要去做，就是這樣，所以死的時候你也不會怕。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/017.mp3"},{"文":"莫依前作，應如後行。此復若說眾多應理言辭而放逸轉，義利微劣。","口譯":"不要照前一種去做，應當照後一種去行。這又是說：如果說了很多合理的言辭，卻放逸而轉，所得的義利就很微少。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第七、須如所知不放逸而修持者：<\/span>此復若<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">口中<\/span>說眾多應理<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">具正因之<\/span>言辭<span class=\"sjan sj-ba\">，<\/span>而<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">趣修時則<\/span>放逸轉，義利微劣。","合註白話":{"id":"20545","頁":569,"白話":"第八科、讚歎為正見，並且教誡要珍視業果：既然如此，如同《親友書》中所說：「大王！如果你想要獲得善趣、階段性的增上生，以及決定勝的解脫、一切智，也務必要修習信解兩種業及其果報的世間正見，原因是補特伽羅由於從善惡業不會產生苦樂果的顛倒見解，使得眼前的行為雖然彷彿是實踐善行，也都悉數具有強力而慘酷的痛苦異熟。」正確地看待緣起、二種業以及因果，這是成就一切乘及一切士夫利益不可或缺的根基。因此以上述為代表，應當閱讀《念住經》、《賢愚經》、《百業經》、《百喻經》、《毘奈耶阿笈摩》中的眾多因緣，也要閱讀其他典籍，藉此生起強猛而持久的確切認知，應該將此作為關鍵內涵。","注釋":["《親友書》亦云：引文劉宋求那跋摩譯《龍樹菩薩為禪陀迦王說法要偈》作：「欲求天樂及涅槃，應勤修習正知見，雖有利智入邪道，微妙功德永無餘。」劉宋僧伽跋摩譯《勸發諸王要偈》作：「求生天解脫，當勤修正見，邪見雖行善，一切得苦果。」唐義淨大師譯《龍樹菩薩勸誡王頌》作：「若悕天解脫，爾當修正見，設使人行善，邪見招惡果。」見《大正藏》冊32，頁746、749、752；《丹珠爾》對勘本冊96，頁674。","若人邪見雖妙行一切皆具酷異熟：夏日東活佛與善慧摩尼大師提到，雖然此段巴梭法王解為「如果有人心懷『善惡業不會感生苦樂果』的邪見，儘管眼前的行為多麼善妙，然而全部都會感得痛苦的異熟」；但是應該解為「如果有人對業果心懷邪見而行布施，雖然布施並非沒有善報，然而由於對業果心懷邪見，以致所行布施無法感得悅意的異熟」，並非心懷邪見者布施，會引生不悅意的異熟。「酷異熟」，法尊法師原譯作「苦異熟」，今據藏文改譯。參見《洛桑諾布文集》冊2，頁530；《夏日東文集》冊1，頁446。","是故應以前說為徵亦閱《念住經》：「為徵」，即「作為代表」。法尊法師原譯作「故應多閱前文所說，及《念住經》」，今據藏文改譯。","《百喻》：經集部經典，全名《滿慈子等百本生經》，又名《富樓那等阿波陀那一百》，共22卷。漢譯本有吳國支謙譯《撰集百緣經》10卷。本經分十品，每一品以幾個偈頌收攝十個本生故事，由於第一個本生是滿慈子的本生故事，又有一百個本生，所以取名為《滿慈子等百本生經》。本經透過一百個本生故事，闡述善業感樂果、惡業感苦果的道理，勸告世人奉行善業，謹防惡業。"],"已校":true},"覺燈日光":null,"時":"65A 24:14","頁":149,"af":"65a","st":1454,"et":1486,"消文":[{"文":"再叮囑一下：說了很多如理的，頭頭是道，但行為不相應，義利很少——還是有，但太少。"}],"延伸":[],"逐字稿":[{"t":"65A 24:14","b":[["q","莫依前作，應如後行。此復若說眾多應理言辭而放逸轉，義利微劣。"],["s","下面再叮囑我們一下，雖然你說了很多如理的，講的道理是頭頭是道，但是你的行為不相應啊，這個義利很少；還是有道理的，但是太少。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/018.mp3"},{"文":"若有僅知微少法義，然«隨所知正行取捨»，義利殊大。","口譯":"如果有人僅僅知道少許的法義，卻能隨著所知道的正確地行持取捨，所得的義利就非常大。","四家合註":"若有僅知微少法義<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">文辭<\/span>，然隨所知<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">起於修持<\/span>正行取捨，義利殊大。","合註白話":{"same":17},"覺燈日光":null,"時":"65A 24:46","頁":149,"af":"65a","st":1486,"et":1697,"消文":[{"文":"知道的雖然少，能照著它正確行持，該取的取、該捨的捨，義利就大了。"},{"文":"注意：不是鼓勵我們不要懂得多，是鼓勵懂得了以後要能如法行持。"}],"延伸":[{"題":"隨所知正行取捨","組":[{"題":"如法思惟，越想越高興","說":[{"類":"例","文":"一位同修每次講完就用這道理去觀察，越學越高興；師父再補充，「哎呀，我怎麼以前沒有想到！」"},{"類":"因","文":"如法思惟，罪惡擋住了、煩惱消除了、功德增長了；煩惱的行相是苦苦惱惱，擋住了當然開開心心。"},{"類":"破","文":"放逸轉：聽的時候聽懂了，講也可以，書本一合，腦筋裡還是老樣子——沒有真正去想。"}]},{"題":"知道越多，功德越大","說":[{"類":"例","文":"他來罵你：只懂一點，只覺得「還債」；懂布施，「讓他罵罵消掉一點氣」就是無畏施；再懂持戒、忍辱、精進。"},{"類":"立","文":"知道得越多，功德越大；要把所知道的法義不要放逸，如理取捨。"}]},{"題":"莫誤解為少知即可","說":[{"類":"立","文":"知道得越多越好，知道的必定要如法行持；不能行持，倒不如少知一點——是這個意思。"},{"類":"破","文":"千萬不要誤解成「那我不要知道很多」，那就誤解了經義。"}]}],"說":[{"類":"例","文":"一位同修每次講完就用這道理去觀察，越學越高興；師父再補充，「哎呀，我怎麼以前沒有想到！」"},{"類":"因","文":"如法思惟，罪惡擋住了、煩惱消除了、功德增長了；煩惱的行相是苦苦惱惱，擋住了當然開開心心。"},{"類":"破","文":"放逸轉：聽的時候聽懂了，講也可以，書本一合，腦筋裡還是老樣子——沒有真正去想。"},{"類":"例","文":"他來罵你：只懂一點，只覺得「還債」；懂布施，「讓他罵罵消掉一點氣」就是無畏施；再懂持戒、忍辱、精進。"},{"類":"立","文":"知道得越多，功德越大；要把所知道的法義不要放逸，如理取捨。"},{"類":"立","文":"知道得越多越好，知道的必定要如法行持；不能行持，倒不如少知一點——是這個意思。"},{"類":"破","文":"千萬不要誤解成「那我不要知道很多」，那就誤解了經義。"}],"af":"65a","st":1534}],"逐字稿":[{"t":"65A 24:46","b":[["q","若有僅知微少法義，然隨所知正行取捨，義利殊大。"],["s","假定說你隨知道的，雖然少，你能夠照著它，照著所指導的去正確地行持，該取的是取，該捨的是捨，這個義利就大了。不過在這個地方注意喔！他不是鼓勵我們哪 ─那我們聽了這個話，哎呀，那我們不要懂得很多，懂得一點點就夠了。他這個地方不是鼓勵我們不要懂得多，要鼓勵我們懂得了以後，要能夠如法地行持，這個是重要的。這個是行持，欸，這個是重要的！"]]},{"t":"65A 25:34","b":[["s","所以我要馬上把一個道理，這也是我們同修之間，因為有一個同修來跟我談，哎呀，他說，他現在越學越高興啊！我們每次講完了以後，他就用這個道理去觀察，哎呀，觀察得很歡喜。他來告訴我，我覺得：是啊！然後呢我再給他補充。「哎呀！那我怎麼以前沒有想到。」我說：「對啊！」然後呢，你真正地能夠去想的話，這想得越多是越高興。這個為什麼高興？因為他如法地思惟的話，這個罪惡擋住了。罪惡擋住了，煩惱消除了，功德增長了。煩惱的行相是什麼？心裡苦苦惱惱嘛！你擋住了當然開開心心嘛！就這樣。差別在什麼地方呢？就說前面所說的，所知法義放逸轉的話，就像我們現在，哎呀，聽的時候聽懂了，講的時候可以，等到了聽完了、講完了書本一合，你腦筋裡還是老樣子。那個是什麼？放逸轉，你沒有真正去想啊！"]]},{"t":"65A 26:40","b":[["s","現在才告訴我們的，哪怕你是懂得一點點，你能夠隨著它去做，懂得一點點隨著它去做，都有義利；懂得更多隨著它去做更多，懂得越多是產生的效果越大。就像我們剛才那個比喻來說：比如說你懂得一點點，他來罵你，你只是覺得，啊，我前面欠了他的，還債啊！那你的快樂只有還債，只是如此而已。假定你能更懂得布施、持戒、忍辱、精進什麼等等的話，你就想，他罵你啊，總有他心裡不痛快的事情，「我讓他罵罵的話，他消掉一點氣的話，我布施，施於無畏，好啊！」就這樣。所以布施有了，然後呢，經上面告訴我們持戒，持戒的時候是什麼？欸，不管他外面怎麼樣，我裡面觀我們的身行啊，我可要照著這個戒去做啊，我在持戒。然後呢我忍辱、我精進。你知道得越多，你的功德豈不是越大，對不對？所以這個地方的真正重要是什麼？要把我們所知道這個法義不要放逸，如理取捨，這個要懂得哦！"]]},{"t":"65A 27:54","b":[["s","所以在這一個地方就告訴我們，的的確確你知道得越多越好，然後呢，知道的必定要如法行持。假定你不能行持的話，你倒不如少知一點，是這樣的意思。你千萬不要誤解了說：「啊，那、那、那我不要知道得很多。」那你就誤解了這個經義了。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/019.mp3"},{"文":"《集法句》云：「若人宣多如理語，放逸而不如是行，譬如牧人數他畜，彼非能得沙門分。","口譯":"《集法句》說：「如果有人宣說了許多如理的話，卻放逸而不照著去行，就像牧人替別人數牲畜一樣，他不能得到沙門的果分。","四家合註":"《集法句<span class=\"sjan sj-ba\">．<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">不放逸品<\/span>》云：「<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">其因緣者，提婆達多於王舍城中拳殺蓮花色比丘尼，又作種種非應行事，次於他時返會眾中，以多異門說法。時於近處，佛於午後又見牧人數牛而行，為此而說此偈。<\/span>若人<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">放逸如提婆達多，口中<\/span>宣多如理<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">具正因<\/span>語，<span>然<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">趣於修持之時，隨<\/span>放逸<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">轉<\/span>而不如是行<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">持<\/span>，譬如牧人<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">雖<\/span>數他畜，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">然僅能得薄少薪酬，不得其畜及其果利乳、酥油等，如是<\/span>彼<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">放逸者，但得擅於文辭之稱歎，<\/span>非能<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">獲<\/span>得<span class=\"sjan sj-ba\">〔<\/span>沙門分<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂沙門果<\/span>。<span class=\"sjan sj-ba\">〕<\/span>","合註白話":{"same":17},"覺燈日光":null,"時":"65A 28:17","頁":149,"af":"65a","st":1697,"et":1732,"消文":[{"文":"講了很多話，但不照著去做。"},{"類":"喻","文":"就像代人家放牛，一天到晚看著，牛是人家的；真正的沙門果——解脫的果，你得不到，因為沒有如理行持。"}],"延伸":[],"逐字稿":[{"t":"65A 28:17","b":[["q","《集法句》云：「若人宣多如理語，放逸而不如是行，譬如牧人數他畜，彼非能得沙門分。"],["s","就是這樣，講了很多話，但是不照著去做。就像給人家，代人家放牛一樣，對不起，你一天到晚看著牛是人家的，你得不到，這個真正的沙門 ─這解脫的果，你得不到，因為你沒有如理行持嘛！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/020.mp3"},{"文":"設雖少說如理語，然能正行法隨法，及能«遠離貪瞋癡»，此等能得沙門分。","口譯":"假使雖然只說了少許如理的話，卻能正確地行持法隨法行，並且能遠離貪瞋癡，這樣的人就能得到沙門的果分。","四家合註":"設雖少說如理語，然能<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如己所說<\/span>正行法隨法，及能斷除貪瞋癡，此等能得沙門分。","合註白話":{"same":17},"覺燈日光":null,"時":"65A 28:52","頁":149,"af":"65a","st":1732,"et":null,"消文":[{"文":"反過來就對了；正式的行持是什麼？「遠離貪瞋癡」，要注意。"}],"延伸":[{"題":"遠離貪瞋癡","組":[{"題":"看看你這個心","說":[{"類":"回扣","文":"黑板上這一個：真正懺悔，說來說去就這個。"},{"類":"因","文":"對三有不能認識它的真相，生不起厭離心，什麼都沒有用。"},{"類":"下手","文":"檢查自己最簡單：看看你什麼心？攀緣心趕快拿掉；真正利益他的心，增長它。"}]},{"題":"未能檢點，不敢出去","說":[{"類":"立","文":"這個地方很細緻；教法沒有正確認識之前，檢點不出來。"},{"類":"例","文":"師父也不敢出去：還沒辦法如實認識、檢點內心，出去儘管說弘法，不知不覺當中在損法。"},{"類":"回扣","文":"跟這個東西一相應，你就完了。"}]}],"說":[{"類":"回扣","文":"黑板上這一個：真正懺悔，說來說去就這個。"},{"類":"因","文":"對三有不能認識它的真相，生不起厭離心，什麼都沒有用。"},{"類":"下手","文":"檢查自己最簡單：看看你什麼心？攀緣心趕快拿掉；真正利益他的心，增長它。"},{"類":"立","文":"這個地方很細緻；教法沒有正確認識之前，檢點不出來。"},{"類":"例","文":"師父也不敢出去：還沒辦法如實認識、檢點內心，出去儘管說弘法，不知不覺當中在損法。"},{"類":"回扣","文":"跟這個東西一相應，你就完了。"}],"af":"65a","st":1732}],"逐字稿":[{"t":"65A 28:52","b":[["q","設雖少說如理語，然能正行法隨法，及能遠離貪瞋癡，此等能得沙門分。"],["s","這反過來，就對了。那麼正式的行持是什麼？「遠離貪瞋癡」，要注意喔！所以黑板上這一個，真正懺悔，說來說去就這個。如果說我們對於這個三有這個，是不能認識它的真相，生不起厭離心來的話，你什麼都沒有用。所以這個檢查自己最簡單，一看！看看你這個心，你什麼心？如果你攀緣心，趕快把它拿掉它，趕快把它拿掉它！"]]},{"t":"65B 00:11","b":[["s","如果不是這個，你真的利益他的心，你把它增長它，對了。但這個地方很細緻喔！我們到現在為止，說實在的，教法沒有正確認識之前，檢點不出來的。所以眼前真正重要的事情，對我們諸位住在這裡，我也是如此，我也不敢出去。儘管我跟你們講，但是我不敢出去的原因哪，我曉得，到現在為止，還沒辦法如真實的認識，還沒有辦法檢點自己的內心。一出去，儘管我說弘法，對不起，不知不覺當中在損法，跟這個東西相應了。跟這個東西一相應的話，你就完了！這一點我們要了解的。下面說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/021.mp3"},{"文":"比丘«樂防慎»，深畏諸放逸，自導出惡趣，如象出淤泥。","口譯":"比丘樂於防護謹慎，深深畏懼種種放逸，自己引導自己出離惡趣，就像大象從淤泥中走出來。","四家合註":"比丘樂防慎，深<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">怖<\/span>畏諸放逸，自導出惡趣，如象出淤泥。","合註白話":{"same":17},"覺燈日光":null,"時":"65B 00:55","頁":149,"af":"65b","st":55,"et":159,"消文":[{"文":"真正的出家人，應該努力地、謹慎地防護。"},{"文":"「深畏諸放逸」：體會到味道，才感覺放逸原來這麼可怕；現在還沒懂道理，最好信得過佛語。"},{"文":"造什麼業感什麼果；要跳出惡趣，還是自己把自己引導出來，從淤泥當中救出來。"}],"延伸":[{"題":"樂防慎","組":[{"題":"防出味道，越作越快樂","說":[{"類":"立","文":"還有一個「樂」，妙了！剛開始防的時候滿苦，真的防出味道來，越作越快樂。"},{"類":"例","文":"在座同修已經有幾位是這樣；正覺寺的女眾聽了，上面沒有安排自修，自己就開始自修起來。"},{"類":"立","文":"肯如法去做：剛開始覺得不是味道，慢慢快樂來了，到後來叫你不走這條路都辦不到——人人都是這個經驗。"}]}],"說":[{"類":"立","文":"還有一個「樂」，妙了！剛開始防的時候滿苦，真的防出味道來，越作越快樂。"},{"類":"例","文":"在座同修已經有幾位是這樣；正覺寺的女眾聽了，上面沒有安排自修，自己就開始自修起來。"},{"類":"立","文":"肯如法去做：剛開始覺得不是味道，慢慢快樂來了，到後來叫你不走這條路都辦不到——人人都是這個經驗。"}],"af":"65b","st":55}],"逐字稿":[{"t":"65B 00:55","b":[["q","苾芻樂防慎，深畏諸放逸，自導出惡趣，如象出淤泥。"],["s","我們真正的出家人，應該努力地去防護，謹慎地防護。還有一個「樂」，欸，妙咧！你剛開始防的時候滿苦的，等到你真的防出味道來是越作越快樂，啊，越作越快樂！在座的同修當中已經有幾位，這個千真萬確的事實。所以我的確鼓勵你們哪，不要說你們，下面那個正覺寺的女眾，她們聽見了以後，她們一再說。哎，我真讚歎！我們這裡，上面沒有自修，她們自己就開始自修起來了。你只要肯如法地去做，剛開始的時候是覺得，嗯，覺得不是味道，慢慢、慢慢地快樂來了，到後來是越來越快樂，到後來教你不走這個路是辦不到！人人都是這個經驗，所以這是快樂的事情。"]]},{"t":"65B 02:05","b":[["s","「深畏諸放逸」啊！你體會到了這個味道，那個時候你會感覺到，這個放逸原來這麼可怕。可是現在我們沒有懂得道理，最好信得過佛語，喔，這個放逸這個事情啊，很糟糕、很糟糕！你只有這樣地努力啊，那麼自然你造什麼業，感什麼果。所以要想跳出惡趣，還是你自己把自己引導出來，那個時候就把我們從淤泥當中救出來了。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/022.mp3"},{"文":"比丘樂防慎，深畏諸放逸，能抖一切惡，如風吹樹葉。」","口譯":"比丘樂於防護謹慎，深深畏懼種種放逸，就能抖落一切惡業，就像風吹落樹葉一樣。」","四家合註":"比丘樂防慎，深<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">怖<\/span>畏諸放逸，能抖一切惡，如風吹樹葉。」","合註白話":{"same":17},"覺燈日光":null,"時":"65B 02:39","頁":149,"af":"65b","st":159,"et":185,"消文":[{"文":"前面是象出淤泥，很辛苦；後面「風吹樹葉」，很輕鬆。"},{"文":"剛開始難，到後來風一吹，樹葉紛紛掉下來，惡業馬上消得乾乾淨淨。"}],"延伸":[],"逐字稿":[{"t":"65B 02:39","b":[["q","苾芻樂防慎，深畏諸放逸，能抖一切惡，如風吹樹葉。」"],["s","前面是象出淤泥，噢，這個很辛苦哦！到後面哪，「風吹樹葉」，啊，那個很輕鬆哦！是的，剛開始的時候是難的，到後來很輕鬆，風一吹，那個樹葉是紛紛都掉下來，這個惡業馬上就消得乾乾淨淨。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/023.mp3"},{"文":"如是《親友書》亦云：「若希善趣諸解脫，«願多修習於正見»，若人邪見雖妙行，一切皆具苦異熟。」","口譯":"同樣地，《親友書》也說：「如果希求善趣和解脫，願你多多修習正見；如果有人懷著邪見，縱然有美妙的行為，一切都具有痛苦的異熟。」","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第八、讚為正見，教令珍愛業果者：<\/span>如是《親友書》亦云：「若<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">國王汝<\/span>希<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">修得<\/span>善趣<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">現前增上生及決定勝──<\/span>諸解脫<span class=\"sjan sj-ba\">、<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">一切智<\/span>，願<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">亦當<\/span>多修習於<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">世間<\/span>正見，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">信解二業及果。其因相者，<\/span>若人邪見<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂善惡業不生苦樂果，<\/span>雖<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">當前威儀似行<\/span>妙行，一切<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">悉<\/span>皆具<span class=\"sjan sj-ba\">〔<\/span>酷<span>烈<\/span><span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂重大也。〕<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">痛苦<\/span>異熟<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">故<\/span>。」","合註白話":{"same":17},"覺燈日光":null,"時":"65B 03:05","頁":149,"af":"65b","st":185,"et":296,"消文":[{"文":"前面是經，下面是論；龍樹菩薩為什麼叫《親友書》？這才是真正的好朋友、親人，我、我、我才是冤家。"},{"文":"要求善趣、要求解脫，就「願多修習於正見」。"}],"延伸":[{"題":"願多修習於正見","組":[{"題":"有了正見，樣樣都來","說":[{"類":"立","文":"現在真正重要只有一件：有了正見，下面樣樣都來了。"},{"類":"破","文":"不是「我要學一學定」「趕快得到一心不亂」——不要！"},{"類":"立","文":"得到正見以後去念佛，一心不亂一定得到；壽命稍微長一點，三昧都可以。"}]},{"題":"邪見雖妙行，還是苦","說":[{"類":"立","文":"邪見的人，儘管行持很妙，不管做什麼，「具苦異熟」。"},{"類":"例","文":"就是出家人，身口七支防護得非常好，知見不正，結果還是苦的，何況普通人。"}]}],"說":[{"類":"立","文":"現在真正重要只有一件：有了正見，下面樣樣都來了。"},{"類":"破","文":"不是「我要學一學定」「趕快得到一心不亂」——不要！"},{"類":"立","文":"得到正見以後去念佛，一心不亂一定得到；壽命稍微長一點，三昧都可以。"},{"類":"立","文":"邪見的人，儘管行持很妙，不管做什麼，「具苦異熟」。"},{"類":"例","文":"就是出家人，身口七支防護得非常好，知見不正，結果還是苦的，何況普通人。"}],"af":"65b","st":185}],"逐字稿":[{"t":"65B 03:05","b":[["q","如是《親友書》亦云：「若希善趣諸解脫，願多修習於正見，若人邪見雖妙行，一切皆具苦異熟。」"],["s","前面是經，下面是論。那麼龍樹菩薩告訴我們，為什麼叫《親友書》啊？這個才是真正你的好朋友欸，這個才是你的親人欸！平常我們，我、我、我，我這個東西，我們的冤家欸！這個真正的好朋友，真正的親人怎麼告訴我們哪？說你如果要求善趣、要求解脫的話，那應該怎麼辦哪？這一句話，「願多修習於正見」。現在我們真正重要的只有一件事情，你有了正見哪，下面樣樣都來了，有了正見是下面樣樣都來了。所以現在我們真正重要的，不是說「哎呀，我要學一學定啊！」「我們要學一學什麼呀？」「哎喲，我趕快得到一心不亂哪！」不要！你得到了正見以後，去念佛的話，一心不亂一定得到。不要說一心不亂，三昧都可以，如果你壽命稍微長一點的話，這是千真萬確的事實。反過來「若人邪見雖妙行」，哦，如果邪見的話，他儘管他行持很妙，不管做什麼，「具苦異熟」。這不要說世間人哦，就是出家人，儘管他的行持非常好，身口七支防護得非常好，知見不正，結果還是苦的，何況是普通的人，何況是普通的人！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/024.mp3"},{"文":"此於緣起二業因果，正觀見者，乃是能成一切諸乘，及辦一切士夫義利，必不容少根本依處。","口譯":"對緣起、善惡二業因果的正確認識，是成就一切大小乘、成辦一切修行人的利益，絕對不能缺少的根本。","四家合註":"此於緣起二業因果，正觀見者，乃是能成一切諸乘，及辦一切士夫義利，必不容少根本依處，","合註白話":{"same":17},"覺燈日光":null,"時":"65B 04:56","頁":149,"af":"65b","st":296,"et":360,"消文":[{"文":"「緣起」：空的道理這裡還沒講，因為是共下士；由於因果法則，苦樂因果如理如法一點不錯地見到。"},{"文":"人天、聲聞、緣覺、大乘一切諸乘，以及一切士夫所有的好處，這是「必不容少根本依處」——根本因。"},{"文":"目前真正要修學的第一件事情，就是這個。"}],"延伸":[],"逐字稿":[{"t":"65B 04:56","b":[["q","此於緣起二業因果正觀見者，乃是能成一切諸乘，及辦一切士夫義利，必不容少根本依處。"],["s","好！到這裡說，這個對於「緣起」 ─緣起的空的道理這裡還沒講，因為是共下士 ─由於因果的法則，然後呢苦樂的因果，你能夠如理如法一點都不錯，見到這個道理。這一件事情是什麼？一切諸乘 ─人天、聲聞、緣覺、大乘，以及一切士夫，所有的好處，這是「必不容少根本依處」。根本因！必不可少的。所以現在我們目前真正要修學的第一件事情，這個、這個！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/025.mp3"},{"文":"故應多閱前文所說，及《念住經》，《賢愚因緣》，《百業》，《百喻》，及《毘奈耶》，《阿笈摩》中，諸多因緣，並諸餘典，令起猛利恆常定解，應當持為極扼要義。","口譯":"所以要多讀前面講的，以及《念住經》、《賢愚因緣經》、《百業經》、《百喻經》，還有戒律和阿含經裡的許多因緣故事，以及其他經論，讓自己生起強烈又持久的確定信解，要把這當作最最關鍵的道理。","四家合註":"是故應以前說為徵，亦閱《念住經》、《賢愚因緣》、《百業》、《百喻》及《毘奈耶阿笈摩》中諸多因緣，並諸餘典，令起猛利恆常定解，應當持為極扼要義。","合註白話":{"same":17},"覺燈日光":null,"時":"65B 06:00","頁":149,"af":"65b","st":360,"et":484,"消文":[{"文":"照前面的道理，還要看《念住經》《賢愚因緣經》《百業經》《百喻經》《毘奈耶》，還有《雜寶藏經》、本生、本事。"},{"文":"「諸餘典」就是師父給大家看的《了凡四訓》《俞淨意公遇竈神記》《德育古鑑》。"},{"文":"看得越多印象越深，到「猛利恆常定解」：心裡確定不疑，而且繼續保持、力量恆常，作為修持最重要的。"},{"類":"回扣","文":"印光大師說「因果是律宗綱骨」；整個佛法戒定慧都建立在因果上。質有了，下面說量。"}],"延伸":[],"逐字稿":[{"t":"65B 06:00","b":[["q","故應多閱前文所說，及《念住經》，《賢愚因緣》，《百業》，《百喻》，及《毘奈耶》，《阿笈摩》中，諸多因緣，並諸餘典，令起猛利恆常定解，應當持為極扼要義。"],["s","所以我們應該照前面告訴我們的這個道理，還要《念住經》、《賢愚因緣經》、《百業經》、《百喻經》、《毘奈耶經》。還有很多哦，像《雜寶藏經》、本生，然後呢這個本事啊，都是這些。乃至於「諸餘典」，諸餘典就是我現在給你們看的《了凡四訓》、《俞淨意公遇竈神記》、《德育古鑑》啊，這些都是。你看得越多，你的印象越深，一直等到什麼程度才可以呢？「令起猛利恆常定解」，這個心裡的念頭確定不疑，而且這種確定不疑地繼續保持，不但繼續保持而且力量恆常，應該把這個作為我們修持最重要的，修持最重要的。"]]},{"t":"65B 07:24","b":[["s","所以印光大師也告訴我們說，因果是律宗綱骨。我們講戒律，真正的這個戒律的這個綱骨，什麼？因果！整個的佛法沒有別的，就是這個。因為它有因果，所以才講戒定慧，這個都建立在這個上頭的，這是我們要了解的。現在這個地方呢，就把這個道理說明。那麼現在好了，啊！這個道理懂得了，這個質有了，第二，量是什麼呢？第二。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/026.mp3"}],"投影片":[{"img":"投影片/shenxin-yeguo-22/001.webp","n":1},{"img":"投影片/shenxin-yeguo-22/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/shenxin-yeguo-22/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/shenxin-yeguo-22/004.webp","n":4},{"img":"投影片/shenxin-yeguo-22/005.webp","n":5},{"img":"投影片/shenxin-yeguo-22/006.webp","n":6},{"img":"投影片/shenxin-yeguo-22/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=64b&st1=1529&et1=1664","box":[0.124875,0.3591111111111111,0.12525,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-22/008.webp","n":8},{"img":"投影片/shenxin-yeguo-22/009.webp","n":9,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=64b&st1=1664&et1=1791","box":[0.539875,0.288,0.1315,0.07288888888888889]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/shenxin-yeguo-22/010.webp","n":10},{"img":"投影片/shenxin-yeguo-22/011.webp","n":11,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=65a&st1=12&et1=76","box":[0.123625,0.3591111111111111,0.1265,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":
