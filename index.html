；二、修持業果，只能藉由佛語來確切地認知的道理；三、空性顯現為業果的道理；四、如果不思惟業果，光是裝懂並沒有好處；五、而這也要檢視自己心續的道理；六、如此思惟之後，就會遮止惡行的道理；七、眼前被虛假的安樂所迷亂，最終會遭受損害的道理；八、依照前輩殊勝士夫的說法才合理。其中第一科：如同《入行論》所說：「確切地認知從不善因產生痛苦之果，而且我的心續都被此所充滿。因此，用怎樣的方法才必定能從中脫離？就像毒藥進入體內一般，我日日夜夜都只應思考這個問題。」又提到：「佛陀說一切善法的根本就是對此勝解的欲求，而這個勝解、欲求的根本，則是以信心作為欲求的所依，恆久地修習思惟黑白業之異熟果的這種相信業果的信心。」了解黑白業及果報之後，不能只停留在認知，應當反覆修持，因為這是至極隱晦的內容，所以極難獲得確切的認知。關於對此難以獲得確切的認知，格西博朵瓦也曾說：「空性還能藉由道理領會；最為深邃的是業果。」","注釋":["第三思已進止道理：即前頁316「思已正行進止之理」一科。","如《入行論》云：引文如石法師譯《入菩薩行·懺悔罪業品》作：「不善生諸苦，云何得脫除，故我當一心，日夜思除苦。」見《入菩薩行》，頁17；《丹珠爾》對勘本冊61，頁961。","唯應思惟此：法尊法師原譯作「理應思惟此」，今據藏文改譯。","又云：引文出自《入行論》。如石法師譯《入菩薩行·精進品》作：「佛說一切善，根本為信樂，信樂本則為，恆思業因果。」見《入菩薩行》，頁65；《丹珠爾》對勘本冊61，頁996。","極不現事：又名極隱蔽分、極隱蔽事。一般的凡夫無法以現量、事勢比量、極成比量了解，必須藉由聖言量成立，進而引生信許比量才能通達的法，即是極隱蔽分。由於不是一般的現量或推理所能了解，所以名為極隱蔽分。","格西博朵瓦亦云：引文出自《藍色手冊》。見《藍色手冊頌釋》，頁192，然與正文略有不同。"],"已校":true},"覺燈日光":null,"時":"61B 10:54","頁":142,"af":"61b","st":654,"et":654,"消文":[{"類":"回扣","文":"本堂音檔未講這句（師父前一天在 61A 講；本堂從 61B 10:54 師父重講「應修深忍」接起），以下是前一天的講解，讀原文時參考。"},{"文":"了解了業果，現在我們怎麼照著去做。"},{"文":"第一是了解了以後整個地告訴我們該怎麼辦；第二步特別是要懺悔。"},{"類":"回扣","文":"中國天台、賢首講懺悔用十門，這裡用四門，開合雖然不同，內容是徹底圓滿。"}],"延伸":[],"逐字稿":[],"口譯音":"口譯音檔/shenxin-yeguo-16/001.mp3"},{"文":"今初　如《入行論》云：「苦從不善生，如何定脫此，我晝夜恆時，理應思惟此。」","口譯":"現在講第一。如《入行論》說：「苦是從不善業生起的，要如何才能決定脫離這個苦？我日日夜夜、時時刻刻，都應當思惟這件事。」","四家合註":"如《入行論》云：「<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">定解<\/span>苦<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">果<\/span>從不善<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">因出<\/span>生，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">而我相續為之充盈，行<\/span>如何<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">方便得決<\/span>定脫此？<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如毒入腹，<\/span>我晝夜恆時，唯應思惟此。」","合註白話":{"same":0},"覺燈日光":null,"時":"61B 10:54","頁":142,"af":"61b","st":654,"et":654,"消文":[{"類":"回扣","文":"本堂音檔未講這句（師父前一天在 61A 講；本堂從 61B 10:54 師父重講「應修深忍」接起），以下是前一天的講解，讀原文時參考。"},{"文":"苦是從惡業生起的，怎麼樣才能從苦當中透脫出來？苦透脫出來就是快樂了。"},{"文":"我們真正要求的就是這個，所以晝夜應該思惟這個道理，這才是我們現在真正要做的。"}],"延伸":[],"逐字稿":[],"口譯音":"口譯音檔/shenxin-yeguo-16/002.mp3"},{"文":"又云：「能仁說勝解，一切善品本，又此之根本，恆修異熟果。」","口譯":"《入行論》又說：「能仁（佛）說：勝解是一切善品的根本；而勝解的根本，是恆常修習（業的）異熟果。」","四家合註":"又云：「能仁說<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">於彼<\/span>勝解<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">之欲求<\/span>，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">是為<\/span>一切善品本，又<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">於<\/span>此<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">勝解或欲求<\/span>之根本，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">是以信心作為欲求之依，<\/span>恆<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">時<\/span>修<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">思惟黑白業<\/span>異熟果<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">之信解業果信<\/span>。」","合註白話":{"same":0},"覺燈日光":null,"時":"61B 10:54","頁":142,"af":"61b","st":654,"et":654,"消文":[{"類":"回扣","文":"本堂音檔未講這句（師父前一天在 61A 講；本堂從 61B 10:54 師父重講「應修深忍」接起），以下是前一天的講解，讀原文時參考。"},{"文":"勝解就是殊勝的見解，對這個道理產生決定正確的認識，不管人家說什麼，絕不動搖。"},{"文":"有了勝解，所有的善法都由此而來；勝解的根本是不斷修習「這個因感得這個果」的道理。"}],"延伸":[],"逐字稿":[],"口譯音":"口譯音檔/shenxin-yeguo-16/003.mp3"},{"文":"謂既了知黑白業果，非唯了知即便止住，應數修習，以此是為極不現事，極難獲得決定解故。","口譯":"意思是：既然已經了知黑業、白業的果報，不是只要了知就停在那裡，而應當數數修習；因為這是極不現見的事，極難獲得決定的信解。","四家合註":"謂既了知黑白業果，非唯了知即便止住，應數修習，以此是為極不現事，極難獲得決定解故。<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">於此難得定解者，格西博朵瓦亦云：「空性猶可以理知解，極甚深者厥為業果。」<\/span>","合註白話":{"same":0},"覺燈日光":null,"時":"61B 10:54","頁":142,"af":"61b","st":654,"et":654,"消文":[{"類":"回扣","文":"本堂音檔未講這句（師父前一天在 61A 講；本堂從 61B 10:54 師父重講「應修深忍」接起），以下是前一天的講解，讀原文時參考。"},{"文":"懂得黑業白業感這樣的果，不是懂了就停在這裡，應該數數修習。"},{"類":"回扣","文":"怎麼修習法，前面修習軌理講過；聞、思各階段的次第一點都不可亂，前面沒聽的非補聽不可。"},{"文":"「極不現事」，不是眼前可以觀察得到的。"}],"延伸":[],"逐字稿":[],"口譯音":"口譯音檔/shenxin-yeguo-16/004.mp3"},{"文":"此復如《三摩地王經》云：「設月星處皆墮落，具山聚落地壞散，虛空界可變餘相，然尊不說非諦語。」","口譯":"這也就像《三摩地王經》說的：「就算日月星辰都掉下來，有山有村莊的大地都崩壞散掉，虛空都能變成別的樣子，佛也絕不會說不真實的話。」","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、修習業果唯如佛語定解之理者：<\/span><i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">於彼獲得定解方便，亦唯觀待於信解如來之語，其道理者，<\/span>此復如《三摩地王經》云：「設月星<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">從自<\/span>處皆墮落<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">於地<\/span>，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此<\/span>具山聚落<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">大<\/span>地<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">忽如糟粕團破裂<\/span>壞散，虛空界可變餘<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">地等實物之<\/span>相，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">容有此事否？雖不容有，<\/span>然<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">縱容有此等諸事，佛薄伽梵<\/span>尊不說非諦語<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">或不容說，此為有力假設<\/span>。」","合註白話":{"id":"17653","頁":488,"白話":"第二科、修持業果，只能依照佛語來確切地認知的道理：對此獲得確切認知的方法，也唯有仰賴於相信如來的法語。因此其中的道理，這也如同《三摩地王經》所說：「即使星月從自己的所在位置墜落於地，承載著山嶽、城市的大地就像酒糟團碎裂一般忽然崩塌，虛空界也轉變成土地等其他事物的樣貌——這些可能發生嗎？雖然不可能，但是縱然這些都成為可能，佛世尊您也絕不會說出不真實的話，不可能這麼說。這是一種有力的假設。」應當修持對如來法語的信心，因為如果對此沒有獲得不假造作的確切認知，則對任何正法都不會獲得佛陀所歡喜的確切認知。另外，對於開示業果的經典，解釋如來意旨的大師們，也都視同世尊言如其實地宣說的教言一般，不另外宣說其用意與目的，而視為言如其實的了義。","注釋":["第二修習業果唯如佛語定解之理者：即前頁472「修習業果唯依佛語定解之理」一科。","《三摩地王經》云：引文高齊那連提耶舍譯《月燈三昧經》作：「假使虛空星宿落，地海城邑悉壞滅，虛空無為性變異，如來終無不實語。」見《大正藏》冊15，頁565；《甘珠爾》冊55，頁113。","糟粕團：用酒渣作成之摶食，結構鬆軟，容易散裂。糟粕，酒之渣滓。細分之，則沉者曰糟，浮者曰粕。粕，音若「魄」。","決定信解：藏文直譯為「決定、定解」，下文亦同。","如言可取：可以如同文詞字面所說的內容執取，即是如言可取。","密意所依：字面所說的內容不是講說者真正想要表達的意涵，而是有更深的意思隱含在其中，所隱含的更深意思即是密意所依。","了義：此處指可以如言而取的意涵，即是了義。"],"已校":true},"覺燈日光":null,"時":"61B 10:54","頁":142,"af":"61b","st":654,"et":654,"消文":[{"類":"回扣","文":"本堂音檔未講這句（師父前一天在 61A 講；本堂從 61B 10:54 師父重講「應修深忍」接起），以下是前一天的講解，讀原文時參考。"},{"文":"月亮、星可以墮落，像山一樣堅牢的地方可以徹底敗壞，乃至虛空可以變；但世尊絕對不說一點不實在的話。"},{"文":"任何東西可變，這個道理絕對不變，我們要信得過。"}],"延伸":[],"逐字稿":[],"口譯音":"口譯音檔/shenxin-yeguo-16/005.mp3"},{"文":"«於如來語，應修深忍»，","口譯":"對於如來的話，應當修習深忍（深深地忍可、信受）。","四家合註":"於如來語，應修深忍，","合註白話":{"same":4},"覺燈日光":null,"時":"61B 10:54","頁":142,"af":"61b","st":654,"et":780,"消文":[{"文":"師父隔天重新開講：「昨天說到空性，這個再唸一遍」，再講一次「於如來語，應修深忍」（本堂從這裡開始播）。"}],"延伸":[{"題":"於如來語，應修深忍","組":[{"題":"深忍是起念即知果","說":[{"類":"立","文":"深忍的狀態：一切時處隨時現起，「有這個果，一定有它的因」；起一念，立刻曉得這一念將來感得什麼果。"}]},{"題":"對比觀照自己起心","說":[{"類":"下手","文":"馬上對比一下、觀照一下，我們現在的起心動念有沒有跟它相應？"},{"類":"破","文":"隨便看見一個境界就跟著它轉：好的貪，反過來瞋，不屬於這兩種是癡，就是染污相。"},{"類":"下手","文":"還沒達到深忍狀態之前，現在真正應該努力的就是這個。"}]}],"說":[{"類":"立","文":"深忍的狀態：一切時處隨時現起，「有這個果，一定有它的因」；起一念，立刻曉得這一念將來感得什麼果。"},{"類":"下手","文":"馬上對比一下、觀照一下，我們現在的起心動念有沒有跟它相應？"},{"類":"破","文":"隨便看見一個境界就跟著它轉：好的貪，反過來瞋，不屬於這兩種是癡，就是染污相。"},{"類":"下手","文":"還沒達到深忍狀態之前，現在真正應該努力的就是這個。"}],"複習":true,"af":"61b","st":654}],"逐字稿":[{"t":"61B 11:56","b":[["s","我們馬上可以對比一下、觀照一下。我們現在的起心動念是什麼？有沒有跟它相應？這個很明白，隨便看見一個境界，你馬上就跟著它轉了，嗯！就跟著它去了。然後呢？好的 貪，反過來 瞋，不屬於這兩種 ─癡，那個就是我們染污相。你對於如來的前面告訴我們的道理，經過了正確地認識、深思，經過這樣地修習以後，你起心動念這個情況就完全不一樣了，喏，這個是屬於深忍，勝解的狀態。乃至於我們還沒有達到這種狀態之前，我們一定要努力，現在真正應該努力的就是這個，現在真正應該努力的就是這個。所以說，「若未於此獲得真實決定信解」，那麼「任於何法，悉不能得，勝者所愛，決定信解。」勝者所愛，這不但是佛、佛菩薩，真正如法行持者，他絕對不是這樣的。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/006.mp3"},{"文":"若未於此獲得真實決定信解，任於何法，悉不能得，勝者所愛，決定信解。","口譯":"如果對業果沒有真正確定的信解，不管修什麼法，都得不到佛所歡喜的那種確定信解。","四家合註":"若未於此獲得真實決定信解，任於何法，悉不能得勝者所愛決定信解。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此復開示業果諸經，造釋密意諸論主，皆視如世尊所說如言可取之語，不更述餘密意所依以及所為，執為了義如言可取。<\/span>","合註白話":{"same":4},"覺燈日光":null,"時":"61B 13:00","頁":142,"af":"61b","st":780,"et":808,"消文":[{"文":"對這道理要有正確、實在的認識，這是如理；經過思惟觀察，產生決定不移動的信解。"},{"文":"「勝者所愛」：不但佛、佛菩薩，真正如法行持者，絕對不是隨著境界轉的。"}],"延伸":[],"逐字稿":[],"口譯音":"口譯音檔/shenxin-yeguo-16/007.mp3"},{"文":"如有一類，說於空性，已獲決定，然於業果無決定信，不慎重者，是乃«顛倒了解空性»。","口譯":"例如有一類人，說自己對空性已經獲得決定，然而對業果卻沒有決定的信心，因此不慎重（取捨），這就是顛倒了解空性。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第三、空性現為業果之理者：<\/span>如有一類，說於空性已獲決定，然於業果無決定信，不慎重者，是乃顛倒了解空性；<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">善<\/span>解<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">非自性成立之<\/span>","合註白話":{"id":"17722","頁":490,"白話":"第三科、空性顯現為業果的道理：有人聲稱對空性獲得確切的認知，但是對業果卻沒有確切認知，而且不予重視，這是顛倒地理解空性。因為如果善加領會自性不成立的空性，就會將此空性視為雖然自性不成立，卻是在名言中，僅依靠各自的因緣而安立的緣起的內涵，進而成為對業果生起確切認知的助力。這本經中說：「萬法好似幻化、水泡、陽焰以及閃電，一切諸法就如水中的月影，雖然顯現為月亮，卻不成立為月亮一般，雖然顯現為諦實，卻不成立為諦實。」這是開示法無我。「死亡以後邁向來世的〔有情、意生、儒童等，經典中說是不同的稱呼。〕他們固然自性不可得。」這是開示補特伽羅無我。「雖然像這樣沒有自性，但是造了善惡業卻不會歸於空無，也不會與未造集的業相遇，因為會按照黑白因而分別成熟為苦樂果報。這種空與業果緣起二者相輔相成的正理之門相當奧妙而隱微，愚夫難以現前看見，只能是佛陀的現前所行境。」","注釋":["即彼經云：彼經即指《三摩地王經》。高齊那連提耶舍譯《月燈三昧經》作：「猶如泡沫及炎電，諸法亦如水中月。眾生壽命不可得，於此界沒他世生，所作之業無失壞，黑白業報亦不亡。因果相應勝法門，微細難見佛境界。」見《大正藏》冊15，頁575；《甘珠爾》冊55，頁170。","意生：心意所生或心意的自性所生，為「有情」的別稱。藏文中「意」字有心意與力量兩種意思。","儒童：有情的另一種稱呼。劫初的人愚癡無知，只是具有心識而已，所以命名為有情。之後心智漸漸開化，則命名為儒童等，表示心智開始成長。至今此詞泛指有情。","經中說為異名：相應段落參見唐玄奘大師譯《大般若波羅蜜多經．無雜法義品》云：「觀察忍者，謂諸菩薩摩訶薩作是思惟：『諸行如幻、虛妄不實、不得自在，亦如虛空無我、有情、命者、生者、養者、士夫、補特伽羅、意生、儒童、作者、受者、知者、見者皆不可得，唯是虛妄分別所起。』」見《大正藏》冊6，頁953；《甘珠爾》對勘本冊24，頁825。","現前行境：現前識的所行境界。即不是透過分別心的影像，而是以眼等現前識清晰觀見的境界。"],"已校":true},"覺燈日光":null,"時":"61B 13:28","頁":142,"af":"61b","st":808,"et":1267,"消文":[{"文":"有人說見到了空性，但對業果沒有決定信，所以不認真去做，這種人了解的空性是顛倒的。"}],"延伸":[{"題":"顛倒了解空性","組":[{"題":"中觀不能停在文字","說":[{"類":"例","文":"師父自述：以前看了中觀的解釋自己覺得很懂，到現在才感覺對中觀完全門外，只在文字上做初基工夫。"},{"類":"破","文":"以為「中觀我懂啦，很簡單」，嘴巴說了半天、行持完全不相應，那完全戲論，損害佛法莫過於此。"}]},{"題":"唯一辦法依教奉行","說":[{"類":"立","文":"緣起甚深，唯佛與佛乃能究竟；業感緣起的最初因，眾生絕無可能找到。"},{"類":"下手","文":"唯一的辦法是聽佛：佛說不能做，老老實實、規規矩矩、恭恭敬敬、認認真真去做；老師說怎麼做就怎麼做。"}]},{"題":"見空之後更離細垢","說":[{"類":"例","文":"初地見到空性，發現空就是緣起，所以二地是離垢地，細微的戒都不犯。"},{"類":"例","文":"曾子臨終堅持換掉大夫的蓆子，說「啟予足，啟予手」，而今而後可以免掉，一舉一動都這麼謹慎。"},{"類":"例","文":"《華嚴》善財參的善知識，除了前兩位都是在家人，行持就是大地菩薩的標準樣子。"},{"類":"破","文":"見到空性而馬馬虎虎是顛倒，這種人千萬不要去聽他。"}]}],"說":[{"類":"例","文":"師父自述：以前看了中觀的解釋自己覺得很懂，到現在才感覺對中觀完全門外，只在文字上做初基工夫。"},{"類":"破","文":"以為「中觀我懂啦，很簡單」，嘴巴說了半天、行持完全不相應，那完全戲論，損害佛法莫過於此。"},{"類":"立","文":"緣起甚深，唯佛與佛乃能究竟；業感緣起的最初因，眾生絕無可能找到。"},{"類":"下手","文":"唯一的辦法是聽佛：佛說不能做，老老實實、規規矩矩、恭恭敬敬、認認真真去做；老師說怎麼做就怎麼做。"},{"類":"例","文":"初地見到空性，發現空就是緣起，所以二地是離垢地，細微的戒都不犯。"},{"類":"例","文":"曾子臨終堅持換掉大夫的蓆子，說「啟予足，啟予手」，而今而後可以免掉，一舉一動都這麼謹慎。"},{"類":"例","文":"《華嚴》善財參的善知識，除了前兩位都是在家人，行持就是大地菩薩的標準樣子。"},{"類":"破","文":"見到空性而馬馬虎虎是顛倒，這種人千萬不要去聽他。"}],"複習":true,"af":"61b","st":808}],"逐字稿":[{"t":"61B 13:28","b":[["s","下面說：「如有一類，說於空性，已獲決定，然於業果無決定信，不慎重者，是乃顛倒了解空性。」有一類說了解了空性了，但是對於這個如此因感如此果，居然馬馬虎虎、隨隨便便的話，那個對不起，他完全錯誤了，他說的了解是顛倒。現在這種情況啊，我們要檢點一下。我以前自己覺得，看了一下那個現在的書，中觀的解釋啦等等，自己覺得很懂。後來我跟同修們談談，很多人都覺得：噢喲！這個他懂了，乃至於可以跟別人去講了。一直等到現在我才感覺到，原來我們真正說起來，對於這個中觀完全門外。中觀到底說些什麼？可以說，不能說一竅不通，至少說都在文字上面做這個初基工夫，文字所指的真正的內涵，是一點都不知道，一點都不知道。如果在這種情況之下努力深入，那前面這個文字是對我們的最佳指導，非常好。否則，如果就以為這個，乃至於說：「哎呀，中觀我懂啦！這個很簡單！」那完全戲論，那完全空話，損害佛法莫過於此。假定這個空觀，就是這樣說那些的話，那個能救得了嗎？一點都救不了。嘴巴裡面說了半天，然後行持是完全不相應，這個是這個地方所說的，顛倒了解啊！"]]},{"t":"61B 15:29","b":[["s","因為你有了這個正確的認識，所以你必定會什麼？認真持戒。因為我們了解我們起心動念無非都是無明相應的，對於這個空緣起的道理，這「緣起甚深」哪，只有佛與佛乃能究竟，這個事實。換句話說，對於這個業感緣起這個因，最初因，我們眾生沒有一個人，絕無可能找到，眼前我們任何一件事情，你絕對找不到，這樣。這件事情只有佛才能看得清楚，那麼既然一切的事情都由這個業因所感得的果的話，你怎麼曉得這個因感得什麼果呢？我們能知道嗎？當然不知道。那個時候，你唯一的辦法─聽佛，所以佛告訴你，這個不能做，你老老實實、規規矩矩、恭恭敬敬、認認真真去做，你一步比一步深，一步比一步好處。所以剛開始我們不了解之前，唯一的辦法，就是依照著老師，他告訴你怎麼做，就這麼樣做；他告訴你不要做，你就不要做；他告訴你要做，你就是要做，就是這樣，這個道理就在這地方，這麼簡單。"]]},{"t":"61B 16:53","b":[["s","所以尤其一旦證得了空性，菩薩初地以後，他那時候更是非常努力、非常謹慎；因為在沒有證得空性之前，他全部的精神貫注在這個地方，要了解這個。一旦了解了以後，為什麼第二地一定是「離垢地」呢？那個時候就見到了空性了，那個時候發現，原來空就是緣起，這個細微的一點事情他都不敢馬虎，全部精神貫注在這裡。所以到了這個時候，得努力修行才可以離垢，細微的戒才不犯。那我們現在凡夫分上面，根本了解都不了解，自己懂了一點點，自己覺得愛怎麼辦就怎麼辦，這是顛倒了解，對自己的損害是莫甚於此。"]]},{"t":"61B 17:45","b":[["s","我們了解這個道理以後，你就可以看哪，世間很多人，在佛不出世的時候，很多這種聖人，實際上都是諸佛菩薩。我講一個公案給你們聽聽，我們中國的聖人，孔老夫子是「大成至聖」。啊，那真是了不起！他門下有四個最了不起的 ─復聖，是顏子；然後呢第二個誰呀？曾子。曾子啊他臨 ……曾參啦就是，他臨死的時候，生病的時候，那個生得很嚴重喔！他叫他兒子，他因為他子弟尊重他，他睡的那個，那個是古代每一個人做任何一件事情，一切都有跟他相應的身分，相應的一切的標準。譬如說我們現在說比丘，那麼平常嘛穿五衣，碰見什麼時候穿七衣，什麼情況穿大衣；沙彌嘛穿縵衣；在家人是不可以，穿一件海青等等，都是這樣，一點都不能亂來。"]]},{"t":"61B 19:01","b":[["s","那麼那時候古代的人，你看喔！那個曾子，因為他的子弟尊重他，他是一個很有德行的人喔，睡的那個蓆子睡得好一點。結果曾子說：「欸，我睡那個蓆子是大夫的蓆，我可不是，趕快給我換！」他病得重得要命啊，因為那個時候動彈不得的時候，他「不行、不行！」一定要給他換。最後換，換的蓆子沒換好，他命就送掉了。喏，這為什麼要這樣做？要我們平常的時候稍微一點小毛病，「唉呀，再叫我忙這個事情，個無關緊要的，你也馬虎它，幹什麼？」為什麼？這裡好好地想一想。然後他臨終的時候，他跟他的兒子說：「小子，啟予足，啟予手。」他說你把我的腳看一看，把我的手看一看哪！然後他說，「而今而後」，從現在以後我可以免掉。因為以前只要你有這個身體在，你隨便的一舉一動，你就會得影響，這個就是業。現在那個身體壞掉了，那從此以後你不必再受這個身體之累。換句話說，他的隨便一個動作這麼謹慎，為什麼啊？我們就是看不懂。喏，你現在到了這裡你就了解了。"]]},{"t":"61B 20:22","b":[["s","所以任何一個真正修學的聖者，他三業這麼地謹慎法，不要說佛法裡邊，乃至於世間這種都是菩薩。然後你了解這個道理，你回去看《華嚴》，你就一目了然。那《華嚴》上面善財童子參的那些人，除了第一、第二個和尚，下面那個都是在家人，對不對？他一點點都沒有說，他把那個佛字貼在這個額骨頭上的樣子，但是他的行持是什麼？那就是大地菩薩的標準樣子，他正因為他見到空性，所以說這地方說見到了空性而馬馬虎虎 ─顛倒，這種人千萬不要去聽他。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/008.mp3"},{"文":"解空性者，謂即«見為緣起»之義，是於業果發生定解為助伴故。","口譯":"（因為）真正了解空性，就是見到（一切法）是緣起的意義，這對於業果生起定解，是作為助伴的緣故。","四家合註":"空性者，謂即見<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">空<\/span>為<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">雖非自性成立，然名言中唯依自因緣假立<\/span>緣起之義，是於業果發生定解為助伴故。","合註白話":{"same":7},"覺燈日光":null,"時":"61B 21:07","頁":142,"af":"61b","st":1267,"et":1313,"消文":[{"文":"真正了解空性就是見到緣起：因為空，所以緣起；因為緣起，所以空。"},{"類":"回扣","文":"這句師父前一天（61B 04:34）逐句講過，本堂在 21:07 重提強調。"}],"延伸":[{"題":"見為緣起","組":[{"題":"逆行不是我們學的","說":[{"類":"例","文":"濟公活佛、近代的金山活佛，還有西康一位像金山活佛一樣「發瘋」的人，明顯現的是逆行。"},{"類":"立","文":"這種人了不起，但現的是逆行，這一點我們要了解。"}]},{"題":"見空與見緣起互為助伴","說":[{"類":"回扣","文":"所以說「見空性就是見緣起」，這兩樣恰恰互為助伴，師父特別再強調重提一下。"}]}],"說":[{"類":"例","文":"濟公活佛、近代的金山活佛，還有西康一位像金山活佛一樣「發瘋」的人，明顯現的是逆行。"},{"類":"立","文":"這種人了不起，但現的是逆行，這一點我們要了解。"},{"類":"回扣","文":"所以說「見空性就是見緣起」，這兩樣恰恰互為助伴，師父特別再強調重提一下。"}],"複習":true,"af":"61b","st":1267}],"逐字稿":[{"t":"61B 21:07","b":[["s","不過有一類我們要了解喔 ─逆行。譬如說我們中國很有名的濟顛活佛，這個濟公活佛，民間的傳說，有這個人的 ─近代的金山活佛，然後呢，我曉得的西康有一個叫什麼呼魯圖馬峰之東（編者按：此處未查到確切名稱）的一個，一個也是像金山活佛一樣的一個發瘋的人，這種人都是了不起，但是他明顯地現的是個逆行，現那個逆行，這一點我們在這地方要了解。所以他說「見空性就是見緣起」，這兩樣東西恰恰是互為助伴的，所以我這地方特別再強調重提一下。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/009.mp3"},{"文":"即彼經云：「一切諸法如水月，等於幻泡陽燄電，雖諸死已往他世，有情意生不可得。然作諸業終不失，如其黑白成熟果，如此理趣門賢妙，微細難見佛行境。」","口譯":"就是那部經（《三摩地王經》）說：「一切諸法就像水中的月亮，又等同幻化的水泡、陽燄和閃電；雖然有情死後往生他世，但那個意生之身是找不到實體的。然而所造的種種業始終不會失壞，就像它是黑業、白業而成熟為苦樂之果一樣。這樣的道理真是賢善微妙的法門，微細難見，是佛所行的境界。」","四家合註":"即彼經云：「<span class=\"sjan sj-ba\">『<\/span>一切諸法<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">猶<\/span>如水<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">中之<\/span>月<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">雖顯現為月，然月不成立；諸法<\/span>等於幻泡陽燄電，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">雖現諦實，然無諦實』，此顯示法無我。『<\/span>雖諸死已往他世，<span class=\"sjan sj-ba\">〔<\/span>有情意生<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">與儒童等，經中說為異名。〕其自性<\/span>不可得。<span class=\"sjan sj-ba\">』<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此顯補特伽羅無我已，如是雖無自性，<\/span>然作諸<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">善不善<\/span>業終不失，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">或未造亦不遇，<\/span>如其黑白<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">因，如是別別<\/span>成熟<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">苦樂<\/span>果，如此<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">空與業果緣起二者，一一互為助伴之<\/span>理趣門賢妙，微細<span class=\"sjan sj-ba\">、<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">愚夫<\/span>難<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">現<\/span>見<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">唯<\/span><span>是<\/span>佛<span>之<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">現前<\/span>行境。」","合註白話":{"same":7},"覺燈日光":null,"時":"61B 21:53","頁":142,"af":"61b","st":1313,"et":1516,"消文":[{"文":"了解了道理，馬上引經證明，那是佛親口講的。"},{"文":"一切諸法像水中月：說它沒有，看得清清楚楚；說它有，絕對找不到。幻泡一碰就沒有了。"},{"類":"例","文":"陽燄：師父在美國的高速公路上，夏天老遠望過去像一攤水，開過去一點都沒有。"},{"文":"「意生」就是世間所說的靈魂，總覺得像搬家一樣搬到他世；其實不可得，沒有真實這樣東西。"},{"文":"可是「然作諸業終不失」：造黑業感惡果，造白業感善果。"},{"文":"因為空所以是緣起，因為緣起所以業因感如此的果；只是流轉，沒有真實的內容。這道理非常微細，是諸佛所行境界。"}],"延伸":[],"逐字稿":[{"t":"61B 21:53","b":[["q","即彼經云："],["s","了解了道理馬上引經證，那是佛親口講的。"]]},{"t":"61B 21:58","b":[["q","「一切諸法如水月，等於幻泡陽燄電，雖諸死已往他世，有情意生不可得。然作諸業終不失，如其黑白成熟果，如此理趣門賢妙，微細難見佛行境。」"],["s","一切諸法就像水裡邊的月，你說它沒有吧，你看得清清楚楚；你說它有吧，絕對找不到。就像什麼呢？「幻泡」，虛幻的那個泡，那泡本身那就是這樣，你看看，一碰，沒有囉！「陽燄」，那就是太陽很強烈的時候，夏天因為那個水蒸氣的關係，你老遠看得像水一樣，真像水，實際上跑過去看看，沒有。我們這裡不一定看得見，你要在什麼地方你看得見呢？那個高速公路，遠遠地，現在我們這裡的確看它不見，你一定要那很長的那個路，很長的路。以前我陽燄一直沒看見，後來到了美國，他那個高速公路又寬又大，車子又少。然後你開的時候，喔唷，老遠望過去，夏天的時候就是看見那個水，就像那個水一樣；那時候，哦，原來陽燄，不過等到你開過去一點都沒有。然後就「電」，就這樣，就這樣！"]]},{"t":"61B 23:33","b":[["s","然後呢這個一切諸法，包括了情與無情，然後對我們來說，我們雖然死了以後到他世，「意生」是繼續地流轉，我們總覺得好像有一個靈魂，像一個搬家一樣，從這個房子裡搬到那邊去。我們通常稱，世間上稱它靈魂，現在這地方是「意生」。他那個意生「不可得」，並沒有真實的這樣東西。"]]},{"t":"61B 24:05","b":[["s","欸，可是妙咧！但是「然作諸業終不失」，這個業會繼續地繼續下去，繼續下去。那麼「如其黑白成熟果」，就像這個業你造的黑，那麼感得的惡果；造的白，就是善的，就感得的福、善果，這一個道理啊，這一個道理啊，是「理趣門賢妙」，這是微妙，深妙極了，但是這個正確的，這個才是正確的。所以我們說空，正因為空所以是緣起，因為緣起所以這個業因感如此的果，只是這個因感得這個果的流轉，而沒有真實的內容，就像水中的月、陽燄、電等等。而這個道理是非常地微細，我們普通人看不見的，這個是諸佛所行的境界，這個我們要了解。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/010.mp3"},{"文":"是故應於緣起二業，及諸因果發生定解，一切晝夜觀察三門，斷截惡趣。","口譯":"所以應當對於緣起的黑白二業，以及它們的因果生起決定的了解，在一切晝夜中觀察自己的身口意三門，以此截斷惡趣。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第四、不思業果，但唯佯作知解，無所助益者：<\/span>故於緣起、二業及諸因果發生定解，一切晝夜觀三門者，得斷惡趣。","合註白話":{"id":"17831","頁":493,"白話":"第五科、思惟業果也要結合自己的心續，因此首先認清自己錯入迷途的道理：這樣檢視心續時，前輩祖師們曾說：在業因果的這個章節中比對正法時，完全不符合，這是我們的過錯，所以完全無法解脫。比對業果後，是要注意是否符合。如果用正法校對自相續時發現沒有一點符合的，而對於不符合的部分，能夠發自心髓地認知自己是如此，就是智者。《集法句．第二十五品親友集》中記載，有一位比丘說：「我蓄意犯下墮罪，真是愚夫！」對此，世尊說道：「如果有愚夫以自己的心續比對正法，發現不符合時，懂得自稱是愚夫，認清自己是不符合正法的劣等人，這樣的人在此是智者。」當比對正法時，就像背負死屍的人一般與法背道而馳，卻妄想是修行者、智者、大德中的頂尖，這是最下等的愚夫。《集法句．第二十五品親友集》中說道：「如果有愚夫，明明是不符合正法的下等人，卻心想『我是智者』，這樣的人稱為愚夫當中的最劣等。」","注釋":["第五思惟業果亦當結合自心相續於最初時辨明自身歧誤理者：即前頁472「此復當觀察自相續之理」一科。","校對正法：夏日東活佛提到，此處的正法指開示業果的正法。參見《夏日東文集》冊1，頁429。","全無解脫故：法尊法師原譯作「全無解脫」，今據藏文補譯。","了知如是不符順者：法尊法師原譯作「了知如是」，今據藏文補譯。","《集法句》云：引文姚秦竺佛念譯《出曜經．親品》、宋天息災譯《法集要頌經．善友品》皆作：「愚者自稱愚，當知善黠慧。」夏日東活佛引用六世班禪的解釋：當一位凡夫反省自己是否與法相符順，見到與法不符順時，心生深刻的追悔，認為自己比愚者更為愚癡，由此能分辨善惡，就是智者。參見《夏日東文集》冊1，頁429。引文見《大正藏》冊4，頁729、790；《丹珠爾》對勘本冊83，頁58。","乖反：違背。乖與反都是相違義。","猶如負屍：夏日東活佛提到，拉薩地區背屍的人，背死屍時是背部相對，以此比喻我們的心與正法也是完全相背的。參見《夏日東文集》冊1，頁429。","《集法句》云：引文吳維祇難等譯《法句經．愚闇品》及晉法炬法立譯《法句譬喻經．愚闇品》皆作：「愚而勝智，是謂極愚。」姚秦竺佛念譯《出曜經．親品》、宋天息災譯《法集要頌經．善友品》皆作：「愚人自稱智，是謂愚中甚。」見《大正藏》冊4，頁563、586、729、790；《丹珠爾》對勘本冊83，頁58。"],"已校":true},"覺燈日光":null,"時":"61B 25:16","頁":142,"af":"61b","st":1516,"et":1613,"消文":[{"文":"業感緣起：造了黑感惡，造了善感福樂；從業因到業果的道理，要修習、啟發，得到決定的勝解。"},{"文":"得到勝解就有了標準，晝夜拿這個標準去衡量身口意、起心動念：不對的馬上防止，好的努力去做。"},{"文":"因地當中切斷了，自然把將來感得惡趣的門關閉掉——這是眼前第一重要。"}],"延伸":[],"逐字稿":[{"t":"61B 25:16","b":[["q","是故應於緣起二業，及諸因果發生定解，一切晝夜觀察三門，斷截惡趣。"],["s","所以我們應該對於這個業感緣起這個道理，你造了黑感惡，造了善，然後呢感得福樂可愛的這個兩種業的道理。應該從它的業因感到它的業果的這個道理，要能夠修習、啟發，而得到決定的勝解，那個時候，行了！然後你得到了這個勝解以後，也不是馬馬虎虎喔！那個時候你有了一個標準了，拿這個標準去衡量，拿這個標準去行持。所以晝夜你就用這個標準去看，說身、口、意，起心動念之間，你起的什麼因，如果是不對的，馬上防止，好的努力去做。所以這樣把因地當中切斷了，自然而然把將來感得惡趣的這個門關閉掉了，關閉掉了。既然這樣的話，當然將來你就不會去啊！所以這個道理是我們眼前第一個重要。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/011.mp3"},{"文":"若不先善因果差別，縱少知法，然將三門«放逸»轉者，唯是開啟諸惡趣門。","口譯":"如果不先善巧了解因果的差別，縱然稍微懂得一點法，但讓身口意三門放逸而轉，那就只是在打開種種惡趣的門。","四家合註":"若不先善因果差別，縱少知法，然將三門放逸轉者，唯是開啟諸惡趣門。","合註白話":{"id":"17781","頁":492,"白話":"第四科、如果不思惟業果，只是裝懂並沒有好處：因此一個對於緣起、二種業以及因果產生確切的認知，並且日日夜夜觀察三門的人，才能截斷惡趣；起初就未精通因果的差別，縱然懂得少許，卻放縱三門，這純粹是在開啟惡趣的門。《海龍王請問經》中說，佛陀喚道：「龍王！菩薩透過一種法，就能真正地斷絕投生惡趣、惡道、顛倒墮落。這一法是什麼？就是觀察抉擇善法，心中緣想：我應該如何度過日日夜夜？」","注釋":["故於緣起二業及諸因果發生定解一切晝夜觀三門者得斷惡趣：法尊法師原譯作「是故應於緣起、二業，及諸因果發生定解，一切晝夜觀察三門，斷截惡趣」，今據藏文改譯。","《海問經》云：引文西晉竺法護譯《佛說海龍王經．十德六度品》作：「佛語龍王：『菩薩有一法，皆斷一切惡趣眾難。何等為一？專察妙法。』」見《大正藏》冊15，頁146；《甘珠爾》對勘本冊58，頁418。","能正斷除：法尊法師原譯作「能斷」，今據藏文改譯。","惡趣惡道顛倒墮落：善慧摩尼大師解釋，一般而言，此三者是同義，但是各別也可將惡趣配上餓鬼，將惡道配畜生，將顛倒墮落配上地獄來解釋。惡趣惡道，法尊法師原譯作「險惡惡趣」，唐慧琳《一切經音義》云：「阿波那伽低，此云惡趣，不名惡道。道是因義，由履而行；趣是果名，已到之處，故不名惡道也。」此二詞於藏文中亦有正行與已到之別，故改譯。參見《大正藏》冊34，頁538；《洛桑諾布文集》冊2，頁519。"],"已校":true},"覺燈日光":null,"時":"61B 26:53","頁":142,"af":"61b","st":1613,"et":1760,"消文":[{"文":"對這個道理不能善巧了解，就算稍稍懂得一點法，對法的根本沒有正確認識，或有一點認識還沒產生決定勝解。"},{"文":"那時身口意仍舊非常放逸，「唯是開啟惡趣門」，只有將來墮落的份。"}],"延伸":[{"題":"放逸","組":[{"題":"提不起來，先找其因","說":[{"類":"立","文":"常覺得「這個提起來真難」——為什麼提不起來？自己不妨先找這個因。"},{"類":"因","文":"主要無非是怕苦、貪一點快樂；這裡明白告訴我們，貪一點小小快樂，受到的是大苦。"},{"類":"下手","文":"正因為提不起來、放逸，所以那地方尤其需要努力。"}]},{"題":"依眾靠眾，依止善知識","說":[{"類":"下手","文":"萬一情況不行，最好的辦法就是依眾靠眾，依靠善知識。"},{"類":"破","文":"自己提不起來，又不願意依靠，最好找個地方躲起來——那就完了。"},{"類":"例","文":"自己關到茅篷裡：條件具足，一個人專修好極了；條件不具足，反正沒人管，愛怎麼辦就怎麼辦，是件危險的事。"},{"類":"回扣","文":"一點點眼前的舒服，將來受無窮大苦。"}]}],"說":[{"類":"立","文":"常覺得「這個提起來真難」——為什麼提不起來？自己不妨先找這個因。"},{"類":"因","文":"主要無非是怕苦、貪一點快樂；這裡明白告訴我們，貪一點小小快樂，受到的是大苦。"},{"類":"下手","文":"正因為提不起來、放逸，所以那地方尤其需要努力。"},{"類":"下手","文":"萬一情況不行，最好的辦法就是依眾靠眾，依靠善知識。"},{"類":"破","文":"自己提不起來，又不願意依靠，最好找個地方躲起來——那就完了。"},{"類":"例","文":"自己關到茅篷裡：條件具足，一個人專修好極了；條件不具足，反正沒人管，愛怎麼辦就怎麼辦，是件危險的事。"},{"類":"回扣","文":"一點點眼前的舒服，將來受無窮大苦。"}],"af":"61b","st":1665}],"逐字稿":[{"t":"61B 26:53","b":[["q","若不先善因果差別，縱少知法，然將三門放逸轉者，唯是開啟諸惡趣門。"],["s","假定你對這個道理不能善巧地了解的話，就算你稍稍懂得一點法，懂得了法，因為對於這個法的根本，你沒有正確的認識；或者稍微有一點認識，而不能產生，還沒有產生決定的勝解。那個時候你身口意仍舊放逸，仍舊非常放逸，對不起，這樣的話，「唯是開啟惡趣門」，你只有將來墮落的份哪！這一點我們在這地方經常努力。"]]},{"t":"61B 27:45","b":[["s","眼前對我們來說，我們往往感覺到：哎呀，這個提起來是真難哪！你為什麼提不起來啊？為什麼提不起來？你自己不妨先找這個因，而這主要的無非是什麼？怕苦，無非是貪一點快樂。但是這個地方，很明白告訴我們，你貪一點小小的快樂，受到的大苦，受到的大苦！你所以這個地方，正因為你提不起來，放逸，所以那地方尤其需要努力啊！尤其需要努力啊！那麼萬一碰見情況不行的，怎麼辦呢？那最好的辦法，就是依靠 ─依所謂依眾靠眾，依靠那個善知識。"]]},{"t":"61B 28:37","b":[["s","現在呢，自己也提不起來，又不願意依靠，最好找一個地方，那你完了，那就完了！這是所以我為什麼常常說，自己關起來到茅篷裡邊去，是一件危險的事情。你如果這個條件具足了，去，一個人專門修，那好極了！如果你這個條件不具足，跑到那個茅篷裡面正好，反正沒人管，你愛怎麼辦就怎麼辦，你覺得過的生活來得個舒服。一點點眼前的舒服，將來受無窮大苦啊！這個我們一定要了解的。下面引經上面證明。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/012.mp3"},{"文":"《海問經》云：「龍王，諸菩薩由一種法，能斷生諸險惡惡趣，顛倒墮落。","口譯":"《海問經》說：「龍王，菩薩們靠著一種方法，就能斷除投生到各種險惡的惡道、顛倒墮落。","四家合註":"《海問經》云：「<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">佛喚<\/span>龍王，諸菩薩由一種法，能正斷除生諸惡趣、惡道、顛倒墮落。","合註白話":{"same":11},"覺燈日光":null,"時":"61B 29:20","頁":142,"af":"61b","st":1760,"et":null,"消文":[{"文":"就是《海龍王請問經》，前面已經引過；佛告訴娑羯羅龍王。"},{"文":"菩薩只要把握住一個法門，就能把墮落惡趣的門切斷，絕不再顛倒墮落。"},{"類":"回扣","文":"只要一樣東西——可見何等重要，這也是前面說「一切白法的根本」。"}],"延伸":[],"逐字稿":[{"t":"61B 29:20","b":[["q","《海問經》云："],["s","就是《海龍王請問經》，前面已經引過的。"]]},{"t":"62A 00:03","b":[["q","「龍王，諸菩薩由一種法，能斷生諸險惡惡趣，顛倒墮落。"],["s","佛告訴龍王，就是娑羯羅龍王，說這個一切菩薩，只要有一個，他把握住了一個法門，他就能夠把墮落惡趣的這個門能夠斷除，能夠切斷，他絕不再顛倒，絕不再墮落。那麼這哪一樣東西呢？你看只要一樣東西哦！你由此可以想見，這個一樣東西何等地重要！這也是前面為什麼說「一切白法的根本」，一切好事的根本就在這裡。一法是什麼呀？"]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/013.mp3"},{"文":"一法云何？謂於諸善法觀察思擇，作如是念：«我今若何度諸晝夜»。」","口譯":"是哪一種法呢？就是對於種種善法觀察思擇，心中作這樣的念：『我現在要怎麼度過這些晝夜？』」","四家合註":"一法云何？謂於諸善法觀察思擇，作如是念：我今若何度諸晝夜？」","合註白話":{"same":11},"覺燈日光":null,"時":"62A 00:54","頁":142,"af":"62a","st":54,"et":217,"消文":[{"文":"照著前面的善法去觀察、去思擇，就是如理思惟。"},{"文":"記得次第：如理思惟之前，要依止善知識、聽聞正法。"},{"文":"腦筋裡維持這個正確的念頭，「作如是念」，這就是正念。"}],"延伸":[{"題":"我今若何度諸晝夜","組":[{"題":"密護根門，以正念護","說":[{"類":"回扣","文":"前面「密護根門，正知而行」：拿什麼護？經常、殷重的正念；正知而行還是拿那個正念。"},{"類":"下手","文":"這裡也是：「我現在二十四小時該怎麼過法？」好好問一下，自然會做得好。"}]},{"題":"下了善因，一天到晚歡喜","說":[{"類":"立","文":"真正了解了，你下那個因就是那個善果，所以一天到晚好歡喜。"},{"類":"喻","文":"種田、做生意不一定賺錢，看好了就做得歡喜；佛的一切智智告訴我們的，一塊錢本錢一定賺成千上萬。"},{"類":"回扣","文":"時時觀察「我又下了這個因」，必然眼前快樂，將來更好。"}]}],"說":[{"類":"回扣","文":"前面「密護根門，正知而行」：拿什麼護？經常、殷重的正念；正知而行還是拿那個正念。"},{"類":"下手","文":"這裡也是：「我現在二十四小時該怎麼過法？」好好問一下，自然會做得好。"},{"類":"立","文":"真正了解了，你下那個因就是那個善果，所以一天到晚好歡喜。"},{"類":"喻","文":"種田、做生意不一定賺錢，看好了就做得歡喜；佛的一切智智告訴我們的，一塊錢本錢一定賺成千上萬。"},{"類":"回扣","文":"時時觀察「我又下了這個因」，必然眼前快樂，將來更好。"}],"af":"62a","st":102}],"逐字稿":[{"t":"62A 00:54","b":[["q","一法云何？謂於諸善法觀察思擇，作如是念：我今若何度諸晝夜。」"],["s","就是照著前面告訴我們的這個善法去觀察、去思擇，這觀察跟思擇是大有道理哦！就是說如理思惟。記得這個次第，如理思惟之前還要不要什麼？記住哦！依止善知識，聽聞正法。根據這個正確的道理去觀察、去思惟，然後那個時候腦筋裡維持著這個正念，作這樣地如是念，這個就是正念。"]]},{"t":"62A 01:42","b":[["s","你們還記得前面這個「密護根門，正知而行」，密護根門護的什麼？第一個，拿什麼東西來護？正念。經常、殷重的正念，喏！正知而行呢？你還是曉得你做些什麼，那還是拿那個正念呀！拿這個正念，什麼呢？如法相應，現在這裡也是如此，是這樣地念：我啊，現在二十四小時該怎麼個過法？我們只要好好地去問一下，那個時候你自然而然你會做得好的。是啊！我要求好；要求好嘛，你在因地上面努力。所以你真正了解了這一點，你就一天到晚好歡喜啊！因為你感覺很清楚：現在你下那個因，就是那個善果啊！"]]},{"t":"62A 02:43","b":[["s","平常我們種田或者做生意，這一個不一定到年終的時候一定賺錢，但是看好的話，哇！你就做得很歡喜。現在我們修學佛法了解佛的一切智智，他告訴我們這樣去做法，這個結果是必定順利，而且必定賺大錢，你把一塊錢的本錢下下去，一定賺它成千上萬。所以這個時候你了解了這一點，一天到晚你時時刻刻觀察：對，我又下了這個因！又下了因怎麼會不快樂，怎麼會不快樂呢？所以必然是眼前快樂，將來是更好啊！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/014.mp3"},{"文":"若能如是觀相續者，諸先覺云：此因果時，校對正法，全不符順，於此乃是我等錯誤，全無解脫。","口譯":"如果能夠這樣觀察自己的相續，先覺的祖師們說：在觀察這因果的時候，拿正法來校對，發現完全不符合也不隨順；這就是我們的錯誤所在，所以完全沒有解脫。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第五、思惟業果亦當結合自心相續，於最初時辨明自身歧誤理者：<\/span>若能如是觀相續者，諸先覺云：此因果時，校對正法，全不符順，於此乃是我等錯誤，全無解脫故。","合註白話":{"same":10},"覺燈日光":null,"時":"62A 03:37","頁":143,"af":"62a","st":217,"et":384,"消文":[{"文":"「相續」就是我們的身心，心為主導，身口隨之而行。"},{"文":"為什麼舉「諸先覺」？我們一片大無明，觀不出結果；看祖師怎麼修，那是我們的榜樣。"},{"文":"「符」是完全相應，「順」是至少步步向上；符了就是佛，順了就是菩薩，就不會像現在煩煩惱惱。"},{"文":"看現在的果就曉得我們的因，看我們的因就曉得將來必然的果；不符不順，所以得不到解脫。"},{"類":"例","文":"煩惱相：站又不是、坐又不是；念書拜佛沒勁，聊天上街來得起勁；明明曉得不對，偏偏做不到——毛病都在這裡。"}],"延伸":[],"逐字稿":[{"t":"62A 03:37","b":[["q","若能如是觀相續者，諸先覺云：此因果時，校對正法，全不符順，於此乃是我等錯誤，全無解脫。"],["s","欸，現在我們能夠這樣照這個辦法來去觀察我們的身心 ─「相續」就是我們的身心，這個裡邊心為主導，然後身口是隨之而行。那個時候應該產生什麼現象啊？他說「諸先覺」，就是祖師，為什麼這個地方說祖師？換句話說，我們現在觀察、觀察，我們是一片大無明，觀不出什麼結果來。喏！看看那些祖師修行的人他是怎麼樣的，這是我們的榜樣。"]]},{"t":"62A 04:30","b":[["s","說：這個的「因果時」，那麼你「校對」，把我們現在不管是若因、若果啊，跟這個正法互相對比一下，結果你發現：唉，全不符順！既不向法符，也不順。「符」是完全相應了，「順」呢？至少跟著它這樣地步步向上。的的確確我們全不符順！符順了什麼呀？如果符了，我們就是佛啊；如果順了，我們就是菩薩啊！那至少我們現在不會像現在這樣煩煩惱惱。因為如果你跟法相應了以後，你心裡是非常歡喜，一點煩惱都沒有，你的果報生生增上，哪會有現在這樣不對呀！可是，所以不然的原因為什麼？跟正法不相應啊！"]]},{"t":"62A 05:32","b":[["s","喏，看看我們現在的果就曉得我們的因；同樣地，看看我們的因就曉得將來的必然的果欸！這因為我們這個不符順、錯了，所以得不到解脫。得不到解脫，煩惱相是什麼？心裡是煩煩惱惱、苦苦惱惱，唉呀，不曉得怎麼辦是好！站又不是、坐又不是，唯一的，碰見幾個人大家聊聊天，哎呀，來得個高興，張三長、李四短。那你念書、拜佛沒有勁，跑到街上去玩，來得個起勁；明明曉得這樣不對，偏偏又做不到。毛病都在這裡。這個原因就在這裡，所以我們真正觀察，那立刻就找得到。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/015.mp3"},{"文":"校對業果，是觀順否，若«以法校自相續»時，全無符順，而能至心了知如是，是為智者。《集法句》云：「若愚自知愚，是名為智者。」","口譯":"拿業果來校對，就是觀察自己是否隨順；如果用法來校對自己的相續時，完全不符不順，卻能至心了知自己是這樣，這就是智者。《集法句》說：「如果愚人自己知道愚，這就叫作智者。」","四家合註":"校對業果，是觀順否，若以法校自相續時，全無符順，而能至心了知如是不符順者，是為智者。《集法句<span class=\"sjan sj-ba\">．<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">第二十五品親友集<\/span>》云：<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">有一比丘，謂：「我故犯墮罪，故為愚夫。」世尊告曰：<\/span>「若愚<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">將自心相續校對法時，設不相順，而<\/span>自知愚，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">為不順法之庸人，<\/span><span>於此<\/span>是名為智者。」","合註白話":{"same":10},"覺燈日光":null,"時":"62A 06:24","頁":143,"af":"62a","st":384,"et":518,"消文":[{"文":"把業的道理從因果上對比、校核一下，看看跟它順不順；拿這個道理來校正、檢點我們的相續。"}],"延伸":[{"題":"以法校自相續","組":[{"題":"法是用來校自相續","說":[{"類":"破","文":"懂了法不是講給別人聽，更不是拿這個法去衡量別人。"},{"類":"例","文":"拿法衡量別人：「我就對，他就是不對！」可以數出別人一百萬樣不對，自己的找不到。"},{"類":"立","文":"真正的法是來校對自己、檢點相續；那時就看見既不符、又不順，至心了解，就是智者。"}]},{"題":"愚自知愚，至少肯改","說":[{"類":"立","文":"《集法句》是共小乘最基本的：愚人自己知道愚，至少曉得可以肯改。"},{"類":"破","文":"太多人動不動一大堆道理，總說別人不對；世間人本來如此，修學佛法就有佛法的標準。"},{"類":"下手","文":"萬一不行，趕快去找，總有原因；找到了去做，那就對了。"}]}],"說":[{"類":"破","文":"懂了法不是講給別人聽，更不是拿這個法去衡量別人。"},{"類":"例","文":"拿法衡量別人：「我就對，他就是不對！」可以數出別人一百萬樣不對，自己的找不到。"},{"類":"立","文":"真正的法是來校對自己、檢點相續；那時就看見既不符、又不順，至心了解，就是智者。"},{"類":"立","文":"《集法句》是共小乘最基本的：愚人自己知道愚，至少曉得可以肯改。"},{"類":"破","文":"太多人動不動一大堆道理，總說別人不對；世間人本來如此，修學佛法就有佛法的標準。"},{"類":"下手","文":"萬一不行，趕快去找，總有原因；找到了去做，那就對了。"}],"af":"62a","st":384}],"逐字稿":[{"t":"62A 06:24","b":[["q","校對業果，是觀順否，若以法校自相續時，全無符順，而能至心了知如是，是為智者。《集法句》云：「若愚自知愚，是名為智者。」"],["s","我們這樣地把這個業的道理，從因果上面去對比、校核一下，看看跟它順、不順。那個時候拿這個道理來校正我們，來檢點我們的相續。這個地方告訴我們這個法，不是說你懂了這個法去講一個道理，不是講給別人聽，更不是拿這個法去衡量別人。我們拿這個衡量別人的話，往往說：「我就對，他就是不對、他就是不對、他就是不對 ……！」你們可以數出別人一百萬樣不對還數不完，自己呢？找不到！為什麼啊？就是這個。真正的法是來自己校對我們，檢點我們的相續，那你真正的修學這是必須要的，那時候你就看見既不符、又不順。如果你能夠這樣地了解，而且至心了解的，這個是智者，這個是智者。"]]},{"t":"62A 07:58","b":[["s","下面引經證，《集法句》。《集法句》那個是最基本的、最基本的，換句話說共小乘的，說：「如果愚的人自己知道愚，這個人就是智慧。」他至少曉得了可以肯改呀！所以我現在看見太多的人，他動不動一大堆道理，總說別人不對。世間人本來如此，修學了佛法，那個時候，喏，這個佛法的標準在這裡，佛法的標準在這裡！萬一不行的話，那趕快去找，總有原因，你找到了然後去做，那就對了。這是一種，反過來，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/016.mp3"},{"文":"若校法時，與法乖反，«猶如負屍»，自妄希為法者，智者，淨者，極頂，是為下愚。《集法句》云：「若愚思為智，說彼為愚癡。」","口譯":"如果拿法來校對時，與法完全相違，就像背著一具死屍，卻還自己妄想是修法的人、是智者、是清淨的人、是最頂尖的人，這就是下等的愚人。《集法句》說：「如果愚人自以為有智慧，就說他是愚癡。」","四家合註":"若校法時，與法乖反，猶如負屍，自妄希為法者、智者、淨者極頂，是為下愚。《集法句<span class=\"sjan sj-ba\">．<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">第二十五品親友集<\/span>》云：「若愚<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">既為與法不順之庸人，猶<\/span>思<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">我<\/span>為智<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">者<\/span>，說彼為愚癡<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">中之鄙劣者<\/span>。」","合註白話":{"same":10},"覺燈日光":null,"時":"62A 08:38","頁":143,"af":"62a","st":518,"et":635,"消文":[{"文":"拿法來校對自己，實際上跟法完全相反，「猶如負屍」。"},{"文":"「自妄希為法者」：自己還覺得他對、他懂、他淨——這是最差的愚癡；愚人自以為智，是極頂愚癡的人。"}],"延伸":[{"題":"猶如負屍","組":[{"題":"皮下有血始得","說":[{"類":"例","文":"說人是「行屍走肉」；祖師說修學佛法「皮下有血始得」。"},{"類":"喻","文":"死屍看起來像個人，割開來沒有血，沒有用。"},{"類":"立","文":"校對了法而不能跟法相應，我們就是這樣。"}]},{"題":"死屍、畜生都不如","說":[{"類":"立","文":"死屍還好，至少不做壞事；校對了法不相順，自己還覺得對、還做壞事，死屍都不如。"},{"類":"例","文":"人家罵「畜生都不如」，師父越想越對：這真是我的大善知識。"},{"類":"因","文":"畜生不會造這麼多大壞事，畜生不會說「我對、你錯」。"}]}],"說":[{"類":"例","文":"說人是「行屍走肉」；祖師說修學佛法「皮下有血始得」。"},{"類":"喻","文":"死屍看起來像個人，割開來沒有血，沒有用。"},{"類":"立","文":"校對了法而不能跟法相應，我們就是這樣。"},{"類":"立","文":"死屍還好，至少不做壞事；校對了法不相順，自己還覺得對、還做壞事，死屍都不如。"},{"類":"例","文":"人家罵「畜生都不如」，師父越想越對：這真是我的大善知識。"},{"類":"因","文":"畜生不會造這麼多大壞事，畜生不會說「我對、你錯」。"}],"af":"62a","st":518}],"逐字稿":[{"t":"62A 08:38","b":[["q","若校法時，與法乖反，猶如負屍，自妄希為法者，智者，淨者極頂，是為下愚。《集法句》云：「若愚思為智，說彼為愚癡。」"],["s","反過來，你拿法來自己校對的時候，你實際上真正跟法完全相反，「猶如負屍」。什麼叫負屍啊？什麼叫負屍啊？我們說你這個人是行屍走肉，猶棄屍人。所以祖師常常說我們：你要修學佛法，皮下有血始得。什麼叫皮下？這個死屍，你看看那樣子像一個人，但他死掉了，沒有用。你如果刺他，如果是割開他的話，他血沒有的。我們如果說校對了法，而不能跟法相應的話，我們就是這樣。實際上死屍還好咧，他至少不做壞事呀！我們現在是校對了法你不相順，自己還覺得對的話，還做壞事，所以這死屍都不如啊！"]]},{"t":"62A 09:49","b":[["s","所以我們常常說：「你這個人畜生，畜生都不如！」唉呀，的的確確我現在越想越對，這個真是我大善知識。我們的確畜生都不如，畜生還不會造這麼多大壞事，畜生不會說：「哦！我對、你錯。」這一個倒是千真萬確的事實。所以在這個地方，他自己還「妄希為法者」 ─欸，他對、他懂、他淨！啊！這個真是最差、最差的，「極」，最差的愚癡啊！所以經上面告訴我們：這愚癡的人自以為智的話，對不起！這個人是極頂愚癡的人。所以最後祖師警告我們哪："]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/017.mp3"},{"文":"故其極下，亦莫思為於法已解。","口譯":"所以，即使是最下等的，也不要以為自己對於法已經了解了。","四家合註":"故於最下，亦當於法<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">以善知自心相續與法順否之慧力，令<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">自實非智而希冀為智者之〔<\/span>心意開解<span class=\"sjan sj-miao\">，<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">意謂思而令心通曉，或思而通曉詞義；以此中<\/span><span class=\"sjan sj-miao\">ཤེད<\/span><span class=\"sjan sj-miao\">音謝<\/span><span class=\"sjan sj-miao\">者，即是意故，如言意生與意我之意。《翻譯名義集．分別證達》云：「瑪拿薩」為「具意」，「瑪努雜」為「意生」或「儒童」自身；《語合二章》亦說如是即其自身，及「瑪拿」為意之對字。劫初之人愚無所知，故命名為有情等，其智既開，則命名為具意乃至儒童，此為《施設論》及經教說故。《本地分》中「愚夫意未開」，即訓為不知言語；而《本地分．意地》中說：「愚夫長時矯飾藏護，執為己有，謂念我及我所而立有情乃至儒童之名，故說為意。」故其義為於法詞義開解而思，以克主一切智云：「講修玄談表相之修善。」〕<\/span>而思擇之。","合註白話":{"id":"18268","頁":505,"白話":"第六科、如此思惟之後，也要杜絕惡行的道理：如同《諦者品》中提到，佛陀喚道：「大王！你不要殺生，為什麼呢？由於一切生靈都極度愛惜生命，因此都想長久守護壽命，所以不但不能直接殺生，即使在內心深處，從最初動機剛散動的階段起也不要意圖殺生，應當要阻止。」對於十種不善，另外還有上述那些罪業，即使動機的心念都不應冒起，在心念或前行的階段全面依靠防護之心，在行動或正行時應當串習防護之心；這兩者在結行時，都應當反覆思惟，多次發起防護之心。如果不這麼杜絕惡行，即使不願意也必須承受痛苦，因為無論去到何處都無法脫離。第七科、如果眼前被虛假的安樂所迷亂，最終會遭受損害的道理：所以眼前雖然稍顯安樂，但是果報成熟時會淚流滿面、即使不願意也要承受，這樣的業是不應該造作的。而那些在領受異熟時能夠受用無罪喜樂的業，應該要造作。《集法句》中記載這一段的緣由，是世尊走到河邊，看見一名漁夫在大量地殺魚，於是問道：「漁夫，有什麼事會令你害怕？」漁夫答道：「喬達摩，我害怕痛苦！」佛陀便告訴他：「那你就不要讓對方痛苦！那樣做將使自己永無安樂。」而說道：「你既然畏懼痛苦，你也有不喜愛痛苦、不悅意的心，那麼無論公開或私下，就不應該造作有罪的業。如果先前造下罪業，或者未來將要造作，一旦承受其苦果的時限來臨，縱使你從床上驚呼起身逃離，也無法從那痛苦果報中脫身。其原因是無論住在何處，沒有業不會侵入的地方，空中沒有，海裡也沒有。縱然躲進群山內部，也沒有這樣的處所。」又說道：「那些智慧低下、昧於取捨的愚夫，透過造下什麼業，對待自己如同仇敵一般進行損害；造下那樣的罪業，招來熾熱的果報，這是極端不合理的。所以希望善待自己的智者，如果造下什麼業將會悲痛憂苦，而且必須淚流滿面，哭著一一承受無窮盡的異熟，這些業還是不造為妙。造作什麼就不會憂苦，而且能歡欣安樂地一一承受悅意的異熟，這些業還是造作為妙。第一個的原因是，在王舍城，有一個餓鬼來到上座舍利弗面前說道：『聖者！過去我是王舍城中的商人，由於吝嗇、自恃種姓，以及做出類似餓鬼的行為，因而導致投生為餓鬼。如果能讓我的親友設齋供養佛陀等比丘僧眾，那就太好了！』還說了許多。由於這件事，佛陀開示道：自身為了追求安樂，而作出去達成目的的樣子，接著卻掉舉而且放逸地造下罪業，他將會流著淚承受這些罪業的眾多異熟巨苦。」","注釋":["如《諦者品》云：引文劉宋求那跋陀羅譯《佛說菩薩行方便境界神通變化經》作：「亦莫枉斷眾生命，一切眾生愛壽命，慧者不應害眾生，愛護眾生如己身。」元魏菩提留支譯《大薩遮尼乾子所說經．詣嚴熾王品》作：「一切諸眾生，無不愛壽命，王若求長生，不應行殺害。」見《大正藏》冊9，頁307、329；《甘珠爾》對勘本冊57，頁264。","加行：此處「加行」是相對於下句巴註的「正行」，故應解為「前行」之義。","加行：此處「加行」是相對於上句巴註的「意樂」，故應解為「行動」之義，亦即由意樂所發起的行動。","靜息之心：藏文直譯為防護之心。","《集法句》云：引文姚秦竺佛念譯《出曜經．行品》作：「若人畏苦，亦不樂苦，勿造惡行，念尋變悔。」「至誠為惡，已作當作，不免於苦，欲避何益？」「非空非海中，非入山石間，莫能於此處，避免宿惡殃。」宋天息災譯《法集要頌經．業品》作：「若人畏苦報，亦不樂行苦，勿造諸惡行，念尋生變悔。至誠為諸惡，自作教他作，不免於苦報，欲避有何益？非空非海中，非入山石間，莫能於此處，避免宿惡殃。」見《大正藏》冊4，頁668、781；《丹珠爾》對勘本冊83，頁23。","山中：此詞藏文原意為山中的縫隙、山裡面，包括山洞等。如月格西解釋，此處指山體內部。連同上文則其義為：就算鑽進山裡頭，讓大山包住自己，也逃不過業力的法則。","又云：引文出自《集法句》。姚秦竺佛念譯《出曜經．行品》作：「凡人為惡，不能自覺，愚癡快意，後受鬱毒。」「夫人行惡，還自熾然，啼泣流面，後受其報。」「吉人行德，相隨積增，甘心為之，福應自然。」「戲笑為惡，已作身行，號泣受報，隨行罪至。」見《大正藏》冊4，頁671；《丹珠爾》對勘本冊83，頁24。","最初之因相者：即前文提到「作何能逼惱，淚覆面泣哭，別別受異熟，莫作此業善」這一偈的原因。","舍利子：佛陀十大弟子之一（生卒年不詳），梵語Śāriputra（ཤཱ་རིའི་བུ），又名舍利弗、舍利弗多、舍利弗羅、舍利弗怛羅、舍利弗多羅、奢利富多羅、奢利弗多羅、奢唎補怛羅、設利弗呾羅、鶖鷺子、秋露子、鴝鴿子、迴鴿子。舍利子相貌端嚴，博通四吠陀及各種技藝，年幼時即能摧伏敵宗。與目犍連一同拜六師外道中之刪闍耶毘羅胝子（Sañjaya vairatīputra）出家學道，僅學七天即成為兩百五十人的導師。後見佛陀弟子馬勝比丘（Aśvajit），威儀庠序，對佛陀教法生起強大信心，隨即與目犍連各率弟子皈依佛陀。精進修學證得阿羅漢果，常隨世尊遊化各方國土教導眾生，成為智慧第一的上首弟子。舍利子尊者的事蹟，在經典中記載頗多，如《賢愚經．須達起精舍品》、《法華經．方便品》等等。最後不忍見佛滅度，較佛陀提早入滅，荼毘後之舍利在各地建塔供奉。參見《佛光大辭典》，頁4409。"],"已校":true},"覺燈日光":null,"時":"62A 10:35","頁":143,"af":"62a","st":635,"et":688,"消文":[{"文":"再差、再差，千萬不要覺得「我已經懂啦」。"},{"文":"就算三藏十二部都看過，佛說：我講的法如爪上土，沒講的是大地土。"},{"文":"證果的聖者尚嫌自己還有太多不懂，何況我們是凡夫。下面祖師語錄，再進一層。"}],"延伸":[],"逐字稿":[{"t":"62A 10:35","b":[["q","故其極下，亦莫思為於法已解。"],["s","所以你再差、再差，你千萬不要覺得，說：「我已經懂啦！我已經懂啦！」你就算三藏十二部教典都看過了，佛說得清清楚楚，說：「我講的法如爪上土，我沒有講的法是大地土啊！」現在我們隨便看了一點點就覺得懂得很多，那實在是可笑極啦！乃至於證得果的很多聖者，他尚嫌自己還太多沒地方懂，何況我們是個凡夫呀！下面祖師的語錄，再進一層，一層一層地說明。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/018.mp3"},{"文":"又博朵瓦則引此《本生論》文觀察相續，如云：「虛空與地中隔遠，大海彼此岸亦遠，東西二山中尤遠，«凡與正法遠於彼»。」","口譯":"博朵瓦則引這段《本生論》的文來觀察自己的相續，如說：「虛空與大地中間相隔很遠，大海的此岸與彼岸也很遠，東西兩座山之間更遠；而凡夫與正法的距離，比這些還要遠。」","四家合註":"博朵瓦亦引《本生論》此文，而謂須當觀察相續，如云：「<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">譬如<\/span>虛空與地中隔遠，大海彼此岸亦遠，東西二山中尤遠，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">即如此喻，<\/span>凡<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">夫心續<\/span>與正法遠<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">隔<\/span>於彼。」","合註白話":{"same":17},"覺燈日光":null,"時":"62A 11:28","頁":143,"af":"62a","st":688,"et":834,"消文":[{"文":"大祖師拿經論上的文來觀察、檢點、反省自己。"},{"文":"天和地、海的兩岸、兩山之間都遠得不得了；我跟法相應，比這些還遠。"},{"文":"這麼了不起的大祖師，檢查結果如此；我們檢查了還找不到，表示愚癡到極點。"},{"類":"下手","文":"現在不努力至誠、恭敬、懺悔去求，以後沒有辦法。"}],"延伸":[{"題":"凡與正法遠於彼","組":[{"題":"心心念念記著我是大愚癡人","說":[{"類":"立","文":"愚癡到這裡已經夠了，再下去一點辦法都沒有；唯一的機會是趕快曉得「我太差」，趕快努力。"},{"類":"下手","文":"心心念念記著「我是個大愚癡人」，一心恭敬三寶。"},{"類":"破","文":"不要拿著法老去看別人不是，要拿來檢查自己，自己就一步一步透脫了。"}]},{"題":"由具六想到生勝解","說":[{"類":"回扣","文":"最前面告訴我們「具六想」是原則，信得過，多多少少可以做。"},{"類":"立","文":"到這裡道理說清楚了，再深入思惟產生勝解，就非常有力，時時刻刻在進步、上升、淨化。"}]}],"說":[{"類":"立","文":"愚癡到這裡已經夠了，再下去一點辦法都沒有；唯一的機會是趕快曉得「我太差」，趕快努力。"},{"類":"下手","文":"心心念念記著「我是個大愚癡人」，一心恭敬三寶。"},{"類":"破","文":"不要拿著法老去看別人不是，要拿來檢查自己，自己就一步一步透脫了。"},{"類":"回扣","文":"最前面告訴我們「具六想」是原則，信得過，多多少少可以做。"},{"類":"立","文":"到這裡道理說清楚了，再深入思惟產生勝解，就非常有力，時時刻刻在進步、上升、淨化。"}],"af":"62a","st":765}],"逐字稿":[{"t":"62A 11:28","b":[["q","又博朵瓦則引此《本生論》文觀察相續，如云："],["s","那個大祖師他就用上面這一段經論上面的文，拿來自己觀察、檢點自己，反省自己，他就覺得：「唉呀！」怎麼呀？虛空與大地啊這麼遠隔，"]]},{"t":"62A 11:49","b":[["q","「虛空與地中隔遠，大海彼此岸亦遠，東西二山中尤遠，凡與正法遠於彼。」"],["s","唉，他說：「我看看哪！天空跟大地那差得不曉得多遠；兩個海的彼岸也這麼遠；兩個山中間，哪一個都是遠得不得了。而我現在跟法相應，遠比前面這個來得遠哪！」那些大祖師，這麼了不起的大祖師！他檢查的結果是如此，這個地方值得我們注意啊！我們所以檢查了找不到的原因，這表示我們的愚癡到極點。假定我們不現在努力，至誠、恭敬、懺悔，然後求的話，以後沒有辦法啦！"]]},{"t":"62A 12:45","b":[["s","所以前面一再告訴我們，我們現在的愚癡到這地方已經夠啦，你再下去是一點辦法都沒有了啦！所以唯一的現在的機會是趕快曉得：唉呀，現在我太差，趕快努力啊！心心念念記著「我是個大愚癡人哪！」然後呢一心恭敬這個三寶，說努力啊，不要拿著這個法老去看別人不是，要拿來檢查自己，你就自己一步一步透脫了。"]]},{"t":"62A 13:20","b":[["s","所以最前面剛開始的時候，告訴我們「具六想」是原則，那是我們信得過，多多少少可以做。到了現在這裡，這個道理說得清楚了以後，你自然而然，啊，千真萬確！如果說你把這個道理再深入思惟的時候，你產生了勝解了以後，那個時候就非常有力，你就時時刻刻在進步、在上升、在淨化。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/019.mp3"},{"文":"此說我等凡庸與法，二者中間，如彼諸喻，極相隔遠。此頌是月菩薩從持善說婆羅門前，«供千兩金»，所受之法。","口譯":"這是說我們凡庸之人與法兩者之間，就像那些比喻一樣，相隔極遠。這個偈頌，是月菩薩從持善說婆羅門那裡，供養了千兩黃金，所求受的法。","四家合註":"此說我等凡庸與法，二者中間如彼諸喻，極相隔遠。此頌是婆羅門持善說之禮而來，月菩薩供千兩金所受之法。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">彼王子為蘇達薩子所說四偈中第四偈亦即此。<\/span>","合註白話":{"same":17},"覺燈日光":null,"時":"62A 13:54","頁":143,"af":"62a","st":834,"et":1011,"消文":[{"文":"普通人跟法兩者當中差得這麼遠，一定要認真檢點；不檢點根本看不出來。"},{"文":"不如法觀察，覺得空空洞洞；如法觀察，感覺實在得不能再實在。"},{"文":"心裡現行的都是模模糊糊的業，碰不上那個法——差就差在這裡，處處要警惕、策勵。"},{"文":"月菩薩得到這麼一個簡單的偈，供千兩金。"}],"延伸":[{"題":"供千兩金","組":[{"題":"法不要一分錢，還推三阻四","說":[{"類":"立","文":"師父想到這裡，每每深深痛苦、懺悔。"},{"類":"例","文":"法不要你們一分錢，書買來送給你們，樣樣供給，請你們去念，還推三阻四；叫你去補聽前面的，這也忙、那也忙。"},{"類":"例","文":"有位居士腳燙傷，回家休養還跑來聽——師父聽了真感動。"}]},{"題":"趁得暇滿，唯一機會","說":[{"類":"立","文":"好好努力自然會相應，相應了自然會努力。"},{"類":"破","文":"年輕朋友千萬不要隨便浪費；等到要的時候，供千兩金、萬兩黃金都不一定得到。"},{"類":"回扣","文":"趁我們現在得到暇滿人身，是唯一的機會。"}]}],"說":[{"類":"立","文":"師父想到這裡，每每深深痛苦、懺悔。"},{"類":"例","文":"法不要你們一分錢，書買來送給你們，樣樣供給，請你們去念，還推三阻四；叫你去補聽前面的，這也忙、那也忙。"},{"類":"例","文":"有位居士腳燙傷，回家休養還跑來聽——師父聽了真感動。"},{"類":"立","文":"好好努力自然會相應，相應了自然會努力。"},{"類":"破","文":"年輕朋友千萬不要隨便浪費；等到要的時候，供千兩金、萬兩黃金都不一定得到。"},{"類":"回扣","文":"趁我們現在得到暇滿人身，是唯一的機會。"}],"af":"62a","st":924}],"逐字稿":[{"t":"62A 13:54","b":[["q","此說我等凡庸與法，二者中間，如彼諸喻，極相隔遠。此頌是月菩薩從持善說婆羅門前，供千兩金，所受之法。"],["s","上面這個話，是說我們普通人跟法兩者當中，唉呀，差得這麼遠！這個一定要認真地自己檢點，你不檢點你根本就看不出來，何況這個東西就是那麼空洞的、那麼抽象的。如果你真正地去觀察的話，你到那時候感覺得實在得不能再實在！但是如果你不經過如法地觀察的話，你覺得空空洞洞的。為什麼呀？那就是我們現在心裡的現行這種業，現在心裡就是模模糊糊那些東西，你根本碰不上那個法。碰不上那個法的話，在你心裡的感受上面跟那個法，就這麼空洞啊！要曉得這個是什麼原因，這個就是我們的差，差就差在這裡。所以處處地方真正要警惕的、要策勵的就是這個，這個。而上面這個是什麼？那一位月菩薩從那個婆羅門前面得到的，他得到這麼一個簡單的偈，供千兩金哦，看看哦！"]]},{"t":"62A 15:24","b":[["s","啊，所以我想到這裡，我就每每自己、自己覺得深深地痛苦、懺悔呀！現在我看見在座的很多同修也是這樣，那個法不要你們一分錢，書還要買來送給你們，還要人家樣樣東西供給你們，請你們去念，哎呀，還要推三阻四。然後叫你們說那個前面沒有聽，去聽一聽，唉呀，自己找了個半天，這個也忙、那個也忙，實在是跟法不相應。我前天看見那個誰呀？賴居士他腳燙傷了，我曉得這個痛苦得不得了，他因為要回家休養，他跑得來，幹什麼？在那兒聽。唉呀，我聽了真感動，嗯，你看！這樣。"]]},{"t":"62A 16:16","b":[["s","所以這個東西的的確確自然而然，你們只要好好地去努力，自然會相應，你相應了自然而然會努力。現在年輕的那些朋友們，千萬不要隨便浪費掉了啊！等到那個時候你要的時候，供千兩金不一定得到哦！那萬兩黃金都得不到，你再有什麼東西沒有用啊！這是趁我們現在得到暇滿人身的時候，是唯一的機會。下面那個祖師，又有一個祖師，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/020.mp3"},{"文":"朵壟巴亦云：「若有觀慧而正觀察，«如於險坡放擲線團»，與法漸遠。」","口譯":"朵壟巴也說：「如果有觀察的智慧而正確觀察，就會發現自己像在陡坡上放下線團一樣，離法越來越遠。」","四家合註":"朵壟巴亦云：「若是知觀擇<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">自心與法相不相順<\/span>者，則其觀擇之時，<span>便<\/span>如於險坡放擲線團，與法漸遠。」","合註白話":{"same":17},"覺燈日光":null,"時":"62A 16:51","頁":143,"af":"62a","st":1011,"et":1210,"消文":[{"文":"拿正確的智慧如法去觀察，會發現不但這麼遠，而且像陡坡上放一個線球，越滾越遠。"}],"延伸":[{"題":"如於險坡放擲線團","組":[{"題":"煩惱等流，與法漸遠","說":[{"類":"立","文":"觀察一下現在的心：是無始以來跟煩惱相應的等流一直在向前推動。"},{"類":"因","文":"一直在煩惱上面走，所以跟法越來越遠，心裡就這麼鬆鬆散散。"}]},{"題":"相應與否，觀心可知","說":[{"類":"例","文":"真正跟法相應：看書、聽錄音帶、聽課、講說，一碰到眼睛瞪得大大的，全部精神貫注——至少慢慢在近了。"},{"類":"例","文":"反過來一碰到就打瞌睡：「怎麼這個時間還這麼長，還不下課？」"},{"類":"下手","文":"了解這個道理，去觀察自己的內心，就了解了。"}]},{"題":"心不相應，喊破喉嚨也徒然","說":[{"類":"破","文":"一天到晚忙著要持戒、要念佛，不了解這個，磕頭念佛，心裡不相應。"},{"類":"例","文":"祖師說：念佛喊破喉嚨也徒然，拜佛頭顱磕破也徒然，閉關千年不出也徒然。"},{"類":"回扣","文":"就是拿這個來檢查自己內心的相續——對、不對。"}]}],"說":[{"類":"立","文":"觀察一下現在的心：是無始以來跟煩惱相應的等流一直在向前推動。"},{"類":"因","文":"一直在煩惱上面走，所以跟法越來越遠，心裡就這麼鬆鬆散散。"},{"類":"例","文":"真正跟法相應：看書、聽錄音帶、聽課、講說，一碰到眼睛瞪得大大的，全部精神貫注——至少慢慢在近了。"},{"類":"例","文":"反過來一碰到就打瞌睡：「怎麼這個時間還這麼長，還不下課？」"},{"類":"下手","文":"了解這個道理，去觀察自己的內心，就了解了。"},{"類":"破","文":"一天到晚忙著要持戒、要念佛，不了解這個，磕頭念佛，心裡不相應。"},{"類":"例","文":"祖師說：念佛喊破喉嚨也徒然，拜佛頭顱磕破也徒然，閉關千年不出也徒然。"},{"類":"回扣","文":"就是拿這個來檢查自己內心的相續——對、不對。"}],"af":"62a","st":1011}],"逐字稿":[{"t":"62A 16:51","b":[["q","朵巴亦云：「若有觀慧而正觀察，如於險坡放擲線團，與法漸遠。」"],["s","如果我們拿正確的智慧去觀察的話，如法去觀察的話，你會發現：嘿，不但這麼遠，而且妙咧！就像那個很陡的山坡上面放一個線球，越滾越遠、越滾越遠、越來越遠！為什麼這樣？為什麼這樣？這個就是他如法真正觀察的結果。其實這一點我們也可以觀察得出來，我們現在如果觀察一下我們的心裡什麼樣的狀態呢？我想大家都會感覺得到的。我們以前說過很多，你自己很容易地感覺得出來，現在的心裡面，是以前無始以來跟煩惱相應那個等流一直在向前推動，對不對？就是那個等流，所以那個等流不斷地在向前推動，那表示什麼？跟法越來越遠，越來越遠，它一直在煩惱上面走嘛！所以我們心裡就這麼鬆鬆散散，就是這個情況，就是這個情況。所以從很多地方我漸漸地、慢慢地感受得到。這將來自然而然到那個時候，你自己會很清楚、很明白的，很清楚、很明白的。"]]},{"t":"62A 18:24","b":[["s","所以說我現在也漸漸地體會到，如果你真正跟法相應的時候，不管你看書也好、聽錄音帶也好、聽課也好、講說也好。你一碰到，哇！這個眼睛就瞪得大大的，全部精神就貫注在裡頭。那個是你至少沒有遠，慢慢地在近了。反過來，你一碰到那個地方啊，你就直打瞌睡，唉呀，心裡面覺得：怎麼這個時間還老這麼長，還不下課？那就這個現象，就這個現象。在任何一個情況之下，任何狀態之下，都是那種狀態。當你自己看書的時候，你儘管看累了，哎，就捨不得，那個時候勉強還並不是太遠的時候。這個是很容易，如果你了解這個道理，然後去觀察你的內心的話，你就了解了。"]]},{"t":"62A 19:17","b":[["s","現在我們一天到晚說忙著，唉呀，希望要什麼樣持戒、要念佛。從哪裡做起？這個道理這個地方說得清清楚楚、明明白白，就是這些，就是這些啊！如果你不了解，儘管你在這個地方磕頭、念佛，但是你心裡面，對不起，不相應啊！這是為什麼祖師一再告訴我們：如果你心裡面散亂，如果你不相應的話，念佛是喊破喉嚨也徒然，拜佛是頭顱磕破也徒然，閉關呢？是千年不出也徒然。現在我們了解了，現在我們了解了，就是你拿這個東西來檢查自己的內心的相續 ─對、不對。現在我們繼續下去："]]}],"口譯音":"口譯音檔/shenxin-yeguo-16/021.mp3"}],"投影片":[{"img":"投影片/shenxin-yeguo-16/001.webp","n":1},{"img":"投影片/shenxin-yeguo-16/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/shenxin-yeguo-16/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/shenxin-yeguo-16/004.webp","n":4},{"img":"投影片/shenxin-yeguo-16/005.webp","n":5},{"img":"投影片/shenxin-yeguo-16/006.webp","n":6},{"img":"投影片/shenxin-yeguo-16/007.webp","n":7},{"img":"投影片/shenxin-yeguo-16/008.webp","n":8},{"img":"投影片/shenxin-yeguo-16/009.webp","n":9,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=61b&st1=654&et1=808","box":[0.124875,0.3591111111111111,0.12525,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-16/010.webp","n":10},{"img":"投影片/shenxin-yeguo-16/011.webp","n":11},{"img":"投影片/shenxin-yeguo-16/012.webp","n":12,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=61b&st1=808&et1=1013","box":[0.546125,0.29688888888888887,0.1365,0.06622222222222222]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/shenxin-yeguo-16/013.webp","n":13},{"img":"投影片/shenxin-yeguo-16/014.webp","n":14,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=61 24秋007","序":null,"音檔":{"62a":{"local":"音檔/gl1/062A.mp3","remote":"https://lamrim.xyz/player/media/gl1/062A.mp3"},"62b":{"local":"音檔/gl1/062B.mp3","remote":"https://lamrim.xyz/player/media/gl1/062B.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=62a&st1=1210&af2=62b&et2=1121","段":[{"文":"如是思已，遮止惡行之理者。","口譯":"這樣思考之後，要怎樣停止惡行，道理如下。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第六、<\/span><span>如是思已，遮止惡行之理者：<\/span>","合註白話":{"id":"18268","頁":505,"白話":"第六科、如此思惟之後，也要杜絕惡行的道理：如同《諦者品》中提到，佛陀喚道：「大王！你不要殺生，為什麼呢？由於一切生靈都極度愛惜生命，因此都想長久守護壽命，所以不但不能直接殺生，即使在內心深處，從最初動機剛散動的階段起也不要意圖殺生，應當要阻止。」對於十種不善，另外還有上述那些罪業，即使動機的心念都不應冒起，在心念或前行的階段全面依靠防護之心，在行動或正行時應當串習防護之心；這兩者在結行時，都應當反覆思惟，多次發起防護之心。如果不這麼杜絕惡行，即使不願意也必須承受痛苦，因為無論去到何處都無法脫離。第七科、如果眼前被虛假的安樂所迷亂，最終會遭受損害的道理：所以眼前雖然稍顯安樂，但是果報成熟時會淚流滿面、即使不願意也要承受，這樣的業是不應該造作的。而那些在領受異熟時能夠受用無罪喜樂的業，應該要造作。《集法句》中記載這一段的緣由，是世尊走到河邊，看見一名漁夫在大量地殺魚，於是問道：「漁夫，有什麼事會令你害怕？」漁夫答道：「喬達摩，我害怕痛苦！」佛陀便告訴他：「那你就不要讓對方痛苦！那樣做將使自己永無安樂。」而說道：「你既然畏懼痛苦，你也有不喜愛痛苦、不悅意的心，那麼無論公開或私下，就不應該造作有罪的業。如果先前造下罪業，或者未來將要造作，一旦承受其苦果的時限來臨，縱使你從床上驚呼起身逃離，也無法從那痛苦果報中脫身。其原因是無論住在何處，沒有業不會侵入的地方，空中沒有，海裡也沒有。縱然躲進群山內部，也沒有這樣的處所。」又說道：「那些智慧低下、昧於取捨的愚夫，透過造下什麼業，對待自己如同仇敵一般進行損害；造下那樣的罪業，招來熾熱的果報，這是極端不合理的。所以希望善待自己的智者，如果造下什麼業將會悲痛憂苦，而且必須淚流滿面，哭著一一承受無窮盡的異熟，這些業還是不造為妙。造作什麼就不會憂苦，而且能歡欣安樂地一一承受悅意的異熟，這些業還是造作為妙。第一個的原因是，在王舍城，有一個餓鬼來到上座舍利弗面前說道：『聖者！過去我是王舍城中的商人，由於吝嗇、自恃種姓，以及做出類似餓鬼的行為，因而導致投生為餓鬼。如果能讓我的親友設齋供養佛陀等比丘僧眾，那就太好了！』還說了許多。由於這件事，佛陀開示道：自身為了追求安樂，而作出去達成目的的樣子，接著卻掉舉而且放逸地造下罪業，他將會流著淚承受這些罪業的眾多異熟巨苦。」","注釋":["如《諦者品》云：引文劉宋求那跋陀羅譯《佛說菩薩行方便境界神通變化經》作：「亦莫枉斷眾生命，一切眾生愛壽命，慧者不應害眾生，愛護眾生如己身。」元魏菩提留支譯《大薩遮尼乾子所說經．詣嚴熾王品》作：「一切諸眾生，無不愛壽命，王若求長生，不應行殺害。」見《大正藏》冊9，頁307、329；《甘珠爾》對勘本冊57，頁264。","加行：此處「加行」是相對於下句巴註的「正行」，故應解為「前行」之義。","加行：此處「加行」是相對於上句巴註的「意樂」，故應解為「行動」之義，亦即由意樂所發起的行動。","靜息之心：藏文直譯為防護之心。","《集法句》云：引文姚秦竺佛念譯《出曜經．行品》作：「若人畏苦，亦不樂苦，勿造惡行，念尋變悔。」「至誠為惡，已作當作，不免於苦，欲避何益？」「非空非海中，非入山石間，莫能於此處，避免宿惡殃。」宋天息災譯《法集要頌經．業品》作：「若人畏苦報，亦不樂行苦，勿造諸惡行，念尋生變悔。至誠為諸惡，自作教他作，不免於苦報，欲避有何益？非空非海中，非入山石間，莫能於此處，避免宿惡殃。」見《大正藏》冊4，頁668、781；《丹珠爾》對勘本冊83，頁23。","山中：此詞藏文原意為山中的縫隙、山裡面，包括山洞等。如月格西解釋，此處指山體內部。連同上文則其義為：就算鑽進山裡頭，讓大山包住自己，也逃不過業力的法則。","又云：引文出自《集法句》。姚秦竺佛念譯《出曜經．行品》作：「凡人為惡，不能自覺，愚癡快意，後受鬱毒。」「夫人行惡，還自熾然，啼泣流面，後受其報。」「吉人行德，相隨積增，甘心為之，福應自然。」「戲笑為惡，已作身行，號泣受報，隨行罪至。」見《大正藏》冊4，頁671；《丹珠爾》對勘本冊83，頁24。","最初之因相者：即前文提到「作何能逼惱，淚覆面泣哭，別別受異熟，莫作此業善」這一偈的原因。","舍利子：佛陀十大弟子之一（生卒年不詳），梵語Śāriputra（ཤཱ་རིའི་བུ），又名舍利弗、舍利弗多、舍利弗羅、舍利弗怛羅、舍利弗多羅、奢利富多羅、奢利弗多羅、奢唎補怛羅、設利弗呾羅、鶖鷺子、秋露子、鴝鴿子、迴鴿子。舍利子相貌端嚴，博通四吠陀及各種技藝，年幼時即能摧伏敵宗。與目犍連一同拜六師外道中之刪闍耶毘羅胝子（Sañjaya vairatīputra）出家學道，僅學七天即成為兩百五十人的導師。後見佛陀弟子馬勝比丘（Aśvajit），威儀庠序，對佛陀教法生起強大信心，隨即與目犍連各率弟子皈依佛陀。精進修學證得阿羅漢果，常隨世尊遊化各方國土教導眾生，成為智慧第一的上首弟子。舍利子尊者的事蹟，在經典中記載頗多，如《賢愚經．須達起精舍品》、《法華經．方便品》等等。最後不忍見佛滅度，較佛陀提早入滅，荼毘後之舍利在各地建塔供奉。參見《佛光大辭典》，頁4409。"],"已校":true},"覺燈日光":null,"時":"62A 20:10","頁":143,"af":"62a","st":1210,"et":1239,"消文":[{"文":"這樣了解、思惟觀察了，有了標準：原來我們心裡是這樣；要求好、要去惡，必定要這樣。"},{"文":"從這個地方遮止起、修行起。"}],"延伸":[],"逐字稿":[{"t":"62A 20:10","b":[["q","如是思已，遮止惡行之理者。"],["s","像這樣地了解、思惟觀察了，那時有了標準了：哦，原來我們心裡是這個樣啊！啊，要求好，必定要這樣，要去掉惡，必定要這樣！那麼那個時候你曉得了，從這個地方遮止起，從這個地方修行起。下面這個道理說：欸，了解以後，你要遮止惡行，怎麼辦呢？"]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/001.mp3"},{"文":"如《諦者品》云：「大王汝莫為殺生，一切眾生極愛命，由是欲護長壽命，«意中永莫思殺生»。」","口譯":"如《諦者品》說：「大王，你不要殺生！一切眾生都極愛惜自己的生命；因此若想護持自己的長壽，心意當中永遠不要起殺生的念頭。」","四家合註":"如《諦者品》云：「<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">佛喚<\/span>大王<span class=\"sjan sj-ba\">！<\/span>汝莫為殺生，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">何以故？以<\/span>一切眾生極愛命，由是欲護長壽命，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">非唯不親作殺生耳，<\/span>意中<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂從最初等起方散逸時，即<\/span>永莫思殺生<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂當遮之<\/span>。」","合註白話":{"same":0},"覺燈日光":null,"時":"62A 20:39","頁":143,"af":"62a","st":1239,"et":1332,"消文":[{"文":"一切眾生無不愛命，你愛護自己，也不要殺。"},{"文":"下面不強調殺，強調「意中永莫思殺生」：意念當中沒有，身口自然沒有；從最細微處防起，其他地方自然都沒有了。"}],"延伸":[{"題":"意中永莫思殺生","組":[{"題":"騙不了因果","說":[{"類":"立","文":"騙別人很容易，騙自己騙不過，騙因果更是絕無可能。"}]},{"題":"被愚癡所騙，無明是冤家","說":[{"類":"因","文":"說實在真要騙自己倒不會，我們是被愚癡所騙，所以叫顛倒、叫愚癡。"},{"類":"回扣","文":"後面講到無明，那個才是我們的冤家；殺是這樣，其他呢？——接下一句。"}]}],"說":[{"類":"立","文":"騙別人很容易，騙自己騙不過，騙因果更是絕無可能。"},{"類":"因","文":"說實在真要騙自己倒不會，我們是被愚癡所騙，所以叫顛倒、叫愚癡。"},{"類":"回扣","文":"後面講到無明，那個才是我們的冤家；殺是這樣，其他呢？——接下一句。"}],"af":"62a","st":1291}],"逐字稿":[{"t":"62A 20:39","b":[["q","如《諦者品》云：「大王汝莫為殺生，一切眾生極愛命，由是欲護長壽命，意中永莫思殺生。」"],["s","這個經上面，佛就告訴我們說：大王，你不要殺生啊！為什麼？一切眾生無不愛命的，因此你如果也愛護你自己的話，你也不要殺。他下面他不強調那個殺，他就告訴我們什麼？「意中永莫思殺生」，你意念當中永遠不要這樣想，你意念當中沒有的話，自然你的身、口就沒有。所以從最細微的地方你防起的話，自然而然其他的地方都沒有了。"]]},{"t":"62A 21:31","b":[["s","所以現在我們……相都是防行相，所以說騙別人很容易，騙自己很難，騙不過的，騙自己騙不過的，騙因果更是絕無可能！說實在我們現在真正要騙自己倒不會，我們實在是什麼？我們被愚癡所騙，所以叫作顛倒，所以叫愚癡啊！所以他後面講到無明的時候，它無明叫什麼？那個才是我們的冤家。哦！現在我們了解了，這個殺是這樣，其他呢？"]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/002.mp3"},{"文":"謂十不善及如前說，諸餘罪惡，發起意樂，«亦莫現行»。","口譯":"就是說，對於十不善業以及前面所說的其餘種種罪惡，連發起的意樂也不要讓它現行。","四家合註":"謂十不善及如前說諸餘罪惡，發起意樂亦莫現行，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">於意樂或加行之時<\/span>","合註白話":{"same":0},"覺燈日光":null,"時":"62A 22:12","頁":143,"af":"62a","st":1332,"et":1429,"消文":[{"文":"不但殺，一切惡的罪行，乃至最起碼的意念，都不要讓它生起；「現行」就是讓它生起。"},{"文":"凡夫種子還在，現行一生起，種子又增長、業又增長。"},{"文":"現行不現起，那時現起的是善業、白業、淨業；只要遮止了，自然生起白淨之業。"}],"延伸":[{"題":"亦莫現行","組":[{"題":"業就是這個，不到淨土也不行","說":[{"類":"立","文":"惡遮止了、白淨業生起，你不要生天也做不到；回向淨土，到那時不到淨土也不行。"},{"類":"因","文":"因為你的業就是這個，就這麼簡單、這麼明白。"}]},{"題":"念佛學教，基本教理在此","說":[{"類":"破","文":"很多念佛的人居然不要學這個——有大善根，偏偏不肯學，要去念佛，怎麼念？"},{"類":"立","文":"學教、持戒、學哪一個都如此，基本教理不都在這個地方嗎？"}]}],"說":[{"類":"立","文":"惡遮止了、白淨業生起，你不要生天也做不到；回向淨土，到那時不到淨土也不行。"},{"類":"因","文":"因為你的業就是這個，就這麼簡單、這麼明白。"},{"類":"破","文":"很多念佛的人居然不要學這個——有大善根，偏偏不肯學，要去念佛，怎麼念？"},{"類":"立","文":"學教、持戒、學哪一個都如此，基本教理不都在這個地方嗎？"}],"af":"62a","st":1387}],"逐字稿":[{"t":"62A 22:12","b":[["q","謂十不善及如前說，諸餘罪惡，發起意樂，亦莫現行。"],["s","不但殺，其他的每樣東西都是，就像前面告訴我們這個道理，一切惡的罪行，乃至於最起碼的意念，你也不要讓它生起，「亦莫現行」，現行就是讓它生起。因為我們凡夫位上面那個種子還在，你現行千萬不要讓它生起，要曉得你現行生起了，那個種子又繼續增長了，業又增長了。如果說你這個現行不現起的，請問那個時候現起的什麼？善業嘛！白業嘛！淨業嘛！所以只要這個遮止了，自然而然生起的就是白淨之業。"]]},{"t":"62A 23:07","b":[["s","在這種情況之下，你不要生天也做不到，如果你回向的話，你回向淨土的話，到那時候不到淨土也不行，因為你的業就是這個，就是這麼簡單、這麼明白。所以現在有很多念佛的人啊，居然不要學這個的，唉！我實在覺得 ……他有大善根，當然！可是他偏偏又不行，又不肯學這個，要去念佛，怎麼念？然後學教也是如此，持戒也是如此，學哪一個都是如此，這個基本教理不都在這個地方嗎？這一個上面說的道理，應該怎麼辦啊？"]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/003.mp3"},{"文":"應修應習，應多修習，靜息之心。","口譯":"應當修、應當習，應當多多修習這種讓惡行靜息的心。","四家合註":"應修<span class=\"sjan sj-ba\">；<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">於加行或正行之時<\/span>應習<span class=\"sjan sj-yu\">；<\/span><i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">此二亦當於完結之時<\/span>，應多<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">數數思惟<\/span>修習靜息之心。","合註白話":{"same":0},"覺燈日光":null,"時":"62A 23:49","頁":143,"af":"62a","st":1429,"et":1466,"消文":[{"文":"強調這個才是要修、應該習的；為什麼拆開來強調？這裡才真正要「應多修習」。"},{"文":"真正開始修行沒有別的，就是靜息十惡業；靜息當下本身就是十善業、白業。"},{"文":"不修，就沒辦法遮止。"}],"延伸":[],"逐字稿":[{"t":"62A 23:49","b":[["q","應修應習，應多修習，靜息之心。"],["s","他這個地方強調這個才是我們要修的，應該習的喔！他為什麼把它拆開來、強調？說我們這個地方才真正要「應多修習」啊！現在我們真正開始修行的沒有別的，就是這個，就是這個 ─靜息這個十惡業。靜息當下本身什麼？就是十善業、白業。假定你不修，你就沒有辦法遮止，所以說，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/004.mp3"},{"文":"若未如是遮止惡行，雖非所欲，然須受苦，任赴何處，不能脫故。","口譯":"如果沒有這樣遮止惡行，那麼雖然不是自己想要的，仍然必須受苦，不論到什麼地方，都無法逃脫的緣故。","四家合註":"若未如是遮止惡行，雖非所欲然須受苦，任赴何處不能脫故。","合註白話":{"same":0},"覺燈日光":null,"時":"62A 24:26","頁":143,"af":"62a","st":1466,"et":1507,"消文":[{"文":"沒有如理思惟、觀察、行持，就沒辦法遮止惡行；沒辦法遮止，一定感得惡果。"},{"文":"惡果雖然你不希望，非受不可，任何情況之下絕對不能逃脫。"}],"延伸":[],"逐字稿":[{"t":"62A 24:26","b":[["q","若未如是遮止惡行，雖非所欲，然須受苦，任赴何處，不能脫故。"],["s","你假定沒有這樣地如理思惟、觀察，然後去行持的話，你就沒辦法遮止這個惡行。沒辦法遮止惡行的時候一定感得惡果，這個惡果雖然你不希望的，對不起，你不希望也沒有用，你非受不可！你還是要受這個苦，在任何情況之下你絕對不能逃脫。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/005.mp3"},{"文":"是故現前似少安樂，然果熟時，雖非所欲，淚流覆面，而須忍受，如是之業是非應作。","口譯":"所以，有些業眼前看起來似乎得到少許安樂，但等到果報成熟時，雖然不是自己所希望的，卻要淚流滿面地忍受；這樣的業是不應當做的。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第七、現前迷於狀似安樂，終則遭受損害之理者：<\/span>是故現前似少安樂，然果熟時，雖非所欲，淚流覆面而須忍受，如是之業是非應作；","合註白話":{"same":0},"覺燈日光":null,"時":"62A 25:07","頁":143,"af":"62a","st":1507,"et":1626,"消文":[{"文":"了解這個道理以後，一切時處唯一的辦法，就是在因地當中注意這個業。"},{"類":"喻","文":"修行本身是苦事，心理上卻是快樂的，就像打勝仗：打仗總是苦，打勝了真快樂。"},{"類":"例","文":"眼前少少安樂：說話站在人家前面，做事偷偷摸摸站在後面；好吃的多吃一點，壞吃的推給別人。"},{"文":"果熟的時候「淚流覆面，而須忍受」——這樣的業，趁早不要做。"},{"類":"回扣","文":"這裡真妙：他不是教你受苦，處處還是教你要快樂；佛法真正美、真正好就在這裡，就這麼眼前、這麼實在。"}],"延伸":[],"逐字稿":[{"t":"62A 25:07","b":[["q","是故現前似少安樂，然果熟時，雖非所欲，淚流覆面，而須忍受，如是之業是非應作。"],["s","你了解了這個道理以後，一切時處唯一的辦法，就是在因地當中注意這個業啊！所以在這種情況之下，假定你不如理去做、如理修行 ─修行本身是一件苦事哦！不過苦雖然苦，心理上卻是快樂的。我們常常那個比喻：就像打勝仗一樣，打仗總歸是苦的，但是打勝了真快樂；不管做任何事情，做生意也好，做任何事情也好。反過來呢？對不起，啊，你眼前是覺得滿安樂，唉呀，這個說起話來說得好聽，站在人家前面，做起事情來，偷偷摸摸站在人家後面；好吃的東西總想多吃一點，壞吃的東西就推給別人去。眼前好像是少少安樂，但是對不起，果熟的時候，這個雖然不是你希望的，對不起，這個要你「淚流覆面，而須忍受」。像這樣的業，趁早不要做，趁早不要做啊！"]]},{"t":"62A 26:33","b":[["s","所以這個地方真妙極了！他不是教你受苦，他處處地方還是教你，喏，那你要快樂，對嘛！就是給你快樂嘛！那那個快樂是這樣的，你懂嗎？這個地方真正，所以佛法真正美，真正好的地方是在這個地方，它不是講個空話，就這麼眼前，就這麼實在，正是我們人人所需求的，正是我們人人所希望的。這個是這一方面，另外一方面，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/006.mp3"},{"文":"若受果時能感受用«無罪喜樂»，如是之業是所應行。","口譯":"如果在受果的時候，能感得受用沒有罪過的喜樂，這樣的業就是應當去做的。","四家合註":"若受果時，能感受用無罪喜樂，如是之業是所應行。","合註白話":{"same":0},"覺燈日光":null,"時":"62A 27:06","頁":143,"af":"62a","st":1626,"et":1733,"消文":[{"文":"受果的時候是喜樂，而且這個喜樂無罪；這樣的業正是現在因地當中要努力的。"}],"延伸":[{"題":"無罪喜樂","組":[{"題":"三世怨的喜樂是有罪的","說":[{"類":"立","文":"平常造了很多喜樂——三世怨：眼前得到一點，最後又害了。"},{"類":"例","文":"大富翁、大財閥有了錢以後造罪，最後又墮地獄——那個喜樂是有罪的。"}]},{"題":"持戒越想越高興","說":[{"類":"立","文":"了解這個，持戒不會覺得「這也不能做、那也不能做」，反而高興。"},{"類":"例","文":"這裡防止了，叫我不要下地獄；那裡防止了，不讓我做畜生、可以不墮餓鬼——哪有對戒會厭惡的？"},{"類":"例","文":"辦私事也不想辦了：身體養得胖胖的，死的時候燒起來還多花一點柴費。"},{"類":"下手","文":"自然一天到晚就忙這個，不管任何事情都會這樣認真做。"}]}],"說":[{"類":"立","文":"平常造了很多喜樂——三世怨：眼前得到一點，最後又害了。"},{"類":"例","文":"大富翁、大財閥有了錢以後造罪，最後又墮地獄——那個喜樂是有罪的。"},{"類":"立","文":"了解這個，持戒不會覺得「這也不能做、那也不能做」，反而高興。"},{"類":"例","文":"這裡防止了，叫我不要下地獄；那裡防止了，不讓我做畜生、可以不墮餓鬼——哪有對戒會厭惡的？"},{"類":"例","文":"辦私事也不想辦了：身體養得胖胖的，死的時候燒起來還多花一點柴費。"},{"類":"下手","文":"自然一天到晚就忙這個，不管任何事情都會這樣認真做。"}],"af":"62a","st":1626}],"逐字稿":[{"t":"62A 27:06","b":[["q","若受果時能感受用無罪喜樂，如是之業是所應行。"],["s","等到你受果的時候，那個時候它是喜樂，這個喜樂無罪。為什麼叫「無罪喜樂」呢？這個要注意哦！平常我們造了很多這個喜樂 ─三世怨。哦，那三世怨的喜樂眼前得到了一點，最後又害了。這眼前太多這種大富翁、大財閥，那個喜樂是有罪的。他有了錢以後造罪，完了，最後又墮地獄。現在我們這個喜樂是無罪的，這個受果的時候能夠感得這個，那這樣的業我們要做，這一種業正是現在我們因地當中努力的。"]]},{"t":"62A 27:55","b":[["s","你了解了這個，那個持戒你不會覺得叫你這個也不能做，叫你這個也不能做。你會高興啊！唉呀，這個地方防止了，叫我不要下地獄；那個地方防止了，不讓我做畜生；那個地方防止了，可以不墮餓鬼。你是越想越高興耶！哪有說對這個戒覺得會厭惡的呢？所以這個是自然而然你會這樣認真做，不管任何事情。平常我們說「公事辦、公事辦，辦了公事辦私事」就很難，到那個時候叫你辦私事你實在也不想辦！因為你曉得辦了半天，身體養了胖胖的，到死的時候燒起來還得多花一點柴費，一點用場都沒有。你自然而然一天到晚就忙這個，這個道理都在這裡。所以，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/007.mp3"},{"文":"《集法句》云：「若汝怖畏苦，汝不愛樂苦，於現或不現，莫作諸惡業。設已作惡業，或當作亦然，汝雖急起逃，然不能脫苦。任其居何處，無業不能至，非空非海內，亦非入山中。」","口譯":"《集法句》說：「如果你怖畏痛苦，你不喜愛痛苦，那麼不論在人前人後，都不要造作種種惡業。假如已經造了惡業，或者將要造，也是一樣；你縱然急忙逃走，也不能脫離痛苦。不論你住在什麼地方，沒有業到不了的地方；不在空中，不在海裡，也不是躲進山中就能逃掉。」","四家合註":"《集法句》云：「<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">其因緣者，薄伽梵行至河畔，見一漁父殺害眾魚，遂問之曰：『漁父，汝有何事堪懼？』白云：『喬達摩，吾畏苦楚。』佛告之曰：『若爾，汝莫施苦於他！如是為者，不得安樂！』<\/span>若汝怖畏苦，汝不愛樂苦，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">有不悅之心，<\/span>於現或不現，莫作諸惡業。設<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">先前<\/span>已作惡業，或<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">後時<\/span>當作亦然，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">當受其苦果之際，<\/span>汝雖<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">自榻<\/span><span>驚呼<\/span>急起<span>而<\/span>逃，然不能脫<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">其<\/span>苦<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">果<\/span>。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">其因相者，<\/span>任其居何處，無業不能至，非空非海內，亦非入山中。」","合註白話":{"same":0},"覺燈日光":null,"時":"62A 28:53","頁":143,"af":"62a","st":1733,"et":null,"消文":[{"文":"你怕不怕苦？當然怕！不愛苦，那麼眼前或不眼前，任何時候都不要造惡業。"},{"文":"已經作了或將要作的，不管怎麼逃，那個苦沒辦法逃。"},{"文":"沒有一個地方逃得掉，業感果的道理就是這樣。"}],"延伸":[],"逐字稿":[{"t":"62A 28:53","b":[["q","《集法句》云：「若汝怖畏苦，汝不愛樂苦，於現或不現，莫作諸惡業。"],["s","經上告訴我們：你現在是怕苦，對啊！問我怕不怕？當然怕！我想我們在座的同學大家都跟我有同感吧？苦的確怕，你不愛苦，如果你不愛苦、不想苦的話，那麼眼前或者不眼前的，不管任何時候，那個時候不要造惡業。眼前是不要造，"]]},{"t":"62A 29:32","b":[["q","設已作惡業，或當作亦然，汝雖急起逃，然不能脫苦。"]]},{"t":"62B 00:03","b":[["q","設已作惡業，或當作亦然，汝雖急起逃，然不能脫苦。"],["s","如果說已經作了，或者將來要作的，凡是造了以後不管你怎麼逃，對不起，逃不掉的，那個苦你沒辦法逃。"]]},{"t":"62B 00:15","b":[["q","任其居何處，無業不能至，非空非海內，亦非入山中。」"],["s","沒有一個地方逃得掉，這個業是感這個道理就是這樣，就是這樣！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/008.mp3"},{"文":"又云：「諸少慧愚稚，«於自如怨敵»，現行諸惡業，能感辛楚果。作何能逼惱，淚覆面泣哭，別別受異熟，莫作此業善。","口譯":"又說：「那些缺少智慧、愚癡幼稚的人，對待自己就像對待怨敵一樣，造作種種惡業，能感得辛酸痛楚的果報。凡是造了之後會讓自己逼迫苦惱、淚流滿面哭泣、一一領受異熟果報的業，不去做才是善。","四家合註":"又云：「<span>（一）<\/span>諸<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">昧取捨之<\/span>少慧愚稚，<span>（三）<\/span>於自<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">身<\/span>如怨敵<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">而作損害<\/span>，<span>（二）<\/span>現行諸惡業，<span>（四）<\/span>能感辛楚果。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此極非理，故求善自身之智者，<\/span>作何<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">業<\/span>能逼惱，淚覆面泣哭，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">須<\/span>別別受<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">無盡<\/span>異熟，莫作此業<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">則<\/span>善。","合註白話":{"same":0},"覺燈日光":null,"時":"62B 00:30","頁":144,"af":"62b","st":30,"et":179,"消文":[{"文":"智慧缺少、愚癡幼稚——我們在佛法上的確很幼稚，但總算進入佛法了，慢慢會長大，這要自己慶幸。"},{"文":"因為愚癡不認識，造種種惡業，將來感得辛楚的果，痛苦得不得了；這種業千萬不要做。"}],"延伸":[{"題":"於自如怨敵","組":[{"題":"真正害我們的就是自己","說":[{"類":"立","文":"處處覺得是為我，實際上是害我；旁人沒辦法害你，真正害我們的就是自己。"},{"類":"因","文":"是什麼？無明；無明顯出來的行相就是貪瞋癡。"}]},{"題":"見煩惱與思煩惱","說":[{"類":"例","文":"講起來聰明得很，世智聰辯——這是見煩惱。"},{"類":"例","文":"習性很重，覺得要這樣、要那樣——這是思煩惱。"},{"類":"回扣","文":"這都是自己害自己。"}]}],"說":[{"類":"立","文":"處處覺得是為我，實際上是害我；旁人沒辦法害你，真正害我們的就是自己。"},{"類":"因","文":"是什麼？無明；無明顯出來的行相就是貪瞋癡。"},{"類":"例","文":"講起來聰明得很，世智聰辯——這是見煩惱。"},{"類":"例","文":"習性很重，覺得要這樣、要那樣——這是思煩惱。"},{"類":"回扣","文":"這都是自己害自己。"}],"af":"62b","st":30}],"逐字稿":[{"t":"62B 00:30","b":[["q","又云：「諸少慧愚稚，於自如怨敵，現行諸惡業，能感辛楚果。作何能逼惱，淚覆面泣哭，別別受異熟，莫作此業善。"],["s","眼前那些智慧不夠的人、缺少的人，愚癡幼稚，幼稚 ─我們在佛法上面的確是很幼稚，的確，但是總算我們已經進入佛法了，雖然幼稚啊，慢慢地會長大的，這個還是我們要自己慶幸的。愚癡，那麼這一種情況之下，怎麼辦呢？「於自如怨敵」，這個話就是眼前我們的狀態。我們處處地方覺得為我，實際上呢是害我，旁人沒辦法害你，真正害我們的，就是自己，就是自己。什麼？無明。無明顯出來的行相什麼？就是個貪瞋癡，就是見煩惱，就是癡煩惱，不是，就是見煩惱，就是思煩惱。喔唷！講起來聰明得很，世智聰辯，這個是見煩惱；然後呢習性很重，唉呀，覺得要這個樣，覺得要那個樣，這個是思煩惱，這個是思煩惱，這個都是自己害自己。"]]},{"t":"62B 02:11","b":[["s","所以我們眼前，因為我們什麼？愚癡，所以不認識這個，所以自己在害自己。因為愚癡，因為這樣，所以現在造種種的惡業，那個時候這個惡業造下了，一定將來感得惡果，這個果「辛楚」啊，痛苦得不得了，痛苦得不得了啊！所以假定造了什麼樣能夠感得這種痛苦逼惱，這種業會感得這樣的異熟苦報的，那千萬不要做，千萬不要做！另外一方面："]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/009.mp3"},{"文":"作何無逼惱，歡喜意欣悅，別別受異熟，作此業善哉。","口譯":"凡是造了之後不會逼迫苦惱，而是歡喜、心意欣悅地一一領受異熟果報的業，去做這樣的業真是善哉。","四家合註":"作何無逼惱，歡喜意欣悅，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">當<\/span>別別受<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">悅意<\/span>異熟，作此業善哉。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">最初之因相者，<\/span><i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">於王舍城中，有一餓鬼來稟上座舍利子言：『聖者，我於昔時曾作王舍城商賈，由慳吝及種姓驕慢，行類餓鬼諸行，故生餓鬼之中。若能令我親眷，齋供佛陀等諸比丘僧伽，則為善妙』云云，乃至廣說，由是之故，薄伽梵云：<\/span>","合註白話":{"same":0},"覺燈日光":null,"時":"62B 02:59","頁":144,"af":"62b","st":179,"et":211,"消文":[{"文":"作了以後感果時，心理上不苦惱，生理上不逼惱，而且歡喜；這種異熟果的業，現在去造，對了！"}],"延伸":[],"逐字稿":[{"t":"62B 02:59","b":[["q","作何無逼惱，歡喜意欣悅，別別受異熟，作此業善哉。"],["s","欸，另外那個，你作了以後將來感果的時候，它不會苦惱，不會壓逼，心理上面嘛不苦惱，生理上面嘛不會逼惱，那麼而且歡喜的。關於這個，這一種異熟果的業，現在去造，對啦！好的！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/010.mp3"},{"文":"自欲安樂故，掉舉作惡業，此惡業異熟，當哭泣領受。」","口譯":"為了自己想要安樂的緣故，心掉舉散亂而造作惡業；這惡業的異熟果報，將來就要哭泣著領受。」","四家合註":"自欲安樂故，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">似若成辦其事，繼而即<\/span>掉舉<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">放逸<\/span>作惡業，此惡業異熟<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">大苦<\/span>，當哭泣領受。」","合註白話":{"same":0},"覺燈日光":null,"時":"62B 03:31","頁":144,"af":"62b","st":211,"et":280,"消文":[{"文":"我們都希望安樂，因為希望安樂就「掉舉作惡業」。"},{"文":"掉舉是跟貪相應的散亂之心；總說就是心裡散散亂亂，特別跟貪相應。"},{"文":"為什麼不說瞋？貪不到、被人障礙，就發脾氣——貪跟瞋是一件事情的兩面。"},{"文":"現在要安樂，領受異熟的時候痛苦無比，來不及了。"}],"延伸":[],"逐字稿":[{"t":"62B 03:31","b":[["q","自欲安樂故，掉舉作惡業，此惡業異熟，當哭泣領受。」"],["s","那最後、最後這一句話，我們現在都希望安樂，因為希望安樂，於是怎麼辦哪？「掉舉作惡業」，這個掉舉就是什麼？跟貪相應的散亂之心。實際上掉舉呢，總說起來就是心裡面散散亂亂，特別的是跟貪相應的。這個地方為什麼不說瞋呢？就是說，當你貪，貪不到了，被人家障礙住了，你就發脾氣了嘛！所以這個貪跟瞋是一件事情的兩個面哪！總之一句話，凡是你心散亂照著這樣的話，那麼這個時候，你造了這個惡業的異熟，對不起，雖然你現在是要安樂，到那個時候領受的時候就痛苦無比啊！到那時候來不及啦！「又云」哪，下面又告訴我們，一步一步地深入。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/011.mp3"},{"文":"又云：「惡業雖現前，«非定如刀割»，然眾生惡業，於他世現起。由其諸惡業，各受辛異熟，是故諸眾生，於他世了知。如從鐵起銹，銹起食其鐵，如是未觀作，自業感惡趣。」","口譯":"又說：「惡業雖然現前，不一定像刀割那樣痛；然而眾生的惡業，會在他世現起。由於那些惡業，各自領受辛酸的異熟，所以眾生到他世才了知。就像從鐵生出鏽，鏽生起後反過來吃掉那塊鐵；同樣地，不加觀察而造作，自己的業就感得惡趣。」","四家合註":"又云：「惡業雖現前<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">方造訖<\/span>，非定如刀割，然<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">任何等善惡<\/span>眾生<span class=\"sjan sj-ba\">，<\/span>惡業<span>當令<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">果報<\/span>，於他世現起。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如何現起？<\/span><i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">舍衛國中有四商主相結為友，一者無信，二者無恥，三者行惡，四者極悋。彼等猶仍恆作是念：『我等何當成就天身，得增上生，享其圓滿！』如是思已，至大師前。為於此故，佛言：<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">眾生<\/span>由其諸惡業<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">因<\/span>，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">須<\/span>各受<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">粗暴<\/span>辛<span>楚<\/span>異熟，是故<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">彼所引<\/span>諸<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">惡趣<\/span>眾生，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">從此死歿，<\/span>於他世<span class=\"sjan sj-ba\">〔<\/span>了知<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂現前起也<\/span>。<span class=\"sjan sj-ba\">〕」<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">又云：「由造惡業故，造者自殃其身者，譬<\/span>如從鐵起銹<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">時<\/span>，銹起<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">侵<\/span>食其<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">原<\/span>鐵，如是未<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">善<\/span>觀<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">察取捨而<\/span>作，<span>由<\/span>自<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">不善<\/span>業<span>令<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">造者自<\/span>感惡趣。」","合註白話":{"id":"18367","頁":508,"白話":"又說道：「雖然罪業不一定會在剛造下的短期內，就如同利刃切割，但是罪業將會使任何善惡眾生在來世顯現果報。會如何呈現？舍衛城有四名商主結交為友，第一位沒有信仰，第二位不知羞恥，第三位從事犯罪，第四位非常吝嗇。然而他們卻經常生起這樣的念頭：『有朝一日我們要修成天神，獲得善趣，享受天神的富樂圓滿。』他們來到佛陀面前，佛陀為此而說道：眾生由於罪業之因，將來必須在何處分別承受那些罪業導致的粗暴而熾熱的異熟。從今生死去之後，這樣的業會使其所招引的惡趣眾生，在來世〔了知，是指現前。〕。」又提到：「由於造下罪業，造者將會自食惡果，就像從鐵產生鐵鏽時，生起的鐵鏽卻會侵蝕原來的鐵本身；同樣地，由於不善加觀察取捨而造下自身的不善業，導致造者自己步向惡趣。」","注釋":["又云：引文出自《集法句》。引文姚秦竺佛念譯《出曜經‧行品》作：「惡不即時，如彼利劍，不慮後世，當受其報。」「惡為惡所纏，為惡不自覺，至惡知惡至，受惡惡根原。」「如鐵生垢，反食其身，惡生於心，還自壞形。」宋天息災譯《法集要頌經‧業品》作：「惡不即時受，如彼鋒利劍，不慮於後世，當受其苦報。惡為惡所縛，為惡不自覺，至惡知惡至，受惡惡根源。如鐵生翳垢，反食其自身，惡生於自心，還當壞其體。」典故參見《丹珠爾》對勘本冊83，頁453。引文見《大正藏》冊4，頁671、782；《丹珠爾》對勘本冊83，頁24。"],"已校":true},"覺燈日光":null,"時":"62B 04:40","頁":144,"af":"62b","st":280,"et":510,"消文":[{"文":"現前感得的不如意再怎麼樣，也不會像刀割；可是小小不如意就受不了，飲食不配胃口就覺得受不了。"},{"文":"小小不能忍、應做的小小努力不願做，結果造種種惡業；他世現起，「各受辛異熟」，那時刀割是最好的。"},{"類":"喻","文":"鐵生銹不是外來的，是鐵自己生的，生完了把鐵爛掉；惡業不是別人給的，別人沒辦法害你，是自己造的。"}],"延伸":[{"題":"非定如刀割","組":[{"題":"板鴨店前，心裡蹦蹦跳","說":[{"類":"例","文":"師父經過板鴨店，一隻烤鴨二百四十元，心裡「蹦、蹦、蹦」跳了半天：隨便欠人家二百四十塊，就被燒成這樣、烤成這樣被人家吃——划不來！"},{"類":"例","文":"走路踩到螞蟻，一腳下去幾十個；造了一點惡業，將來也是這樣一下子。"}]},{"題":"眼前再苦，絕不如刀割","說":[{"類":"立","文":"現在再大的苦，絕對不會像刀割在身上；到受苦的時候，刀割是最好的，千真萬確。"},{"類":"回扣","文":"前面說是「極不現事」，不是眼前看得見的，所以一定要好好思惟。"},{"類":"下手","文":"眼前心裡現行都是煩惱，一定要努力修行，把煩惱淨除、懺悔。"}]}],"說":[{"類":"例","文":"師父經過板鴨店，一隻烤鴨二百四十元，心裡「蹦、蹦、蹦」跳了半天：隨便欠人家二百四十塊，就被燒成這樣、烤成這樣被人家吃——划不來！"},{"類":"例","文":"走路踩到螞蟻，一腳下去幾十個；造了一點惡業，將來也是這樣一下子。"},{"類":"立","文":"現在再大的苦，絕對不會像刀割在身上；到受苦的時候，刀割是最好的，千真萬確。"},{"類":"回扣","文":"前面說是「極不現事」，不是眼前看得見的，所以一定要好好思惟。"},{"類":"下手","文":"眼前心裡現行都是煩惱，一定要努力修行，把煩惱淨除、懺悔。"}],"af":"62b","st":381}],"逐字稿":[{"t":"62B 04:40","b":[["q","又云：「惡業雖現前，非定如刀割，然眾生惡業，於他世現起。由其諸惡業，各受辛異熟，是故諸眾生，於他世了知。如從鐵起銹，銹起食其鐵，如是未觀作，自業感惡趣。」"],["s","說，對我們現前來說，這個惡業雖然現前啊，這個惡業現前，就是我們感得的這個惡果，儘管現前種種不如意，但是再怎麼，它絕對不會這麼厲害的，像刀割，對不對？這個很清楚、很明白。唉呀，你今天稍微這個地方不如意一點，像會刀割這麼嗎？不會呀！我們最多說，唉呀，今天這個地方飲食稍微不配點胃口，唉呀，我們覺得受不了了！一定要講得樣樣如意自己的，實在是 ……。我們再嚴重的惡業絕對不會像刀割一樣，這個是很容易的，但是我們就是不了解這個道理啊！然後呢這種小小的不能忍受，應該做的小小的努力不願意去做，結果呢眼前造種種的惡業。造了種種的惡業，將來他世現起的時候，對不起，那個時候又去作惡業。「各受辛異熟」，非常痛苦、非常痛苦的，那個時候感得那個果，刀割是最好、最好的。"]]},{"t":"62B 06:21","b":[["s","我昨天下午出去，回來的時候經過一個板鴨店，一看，已經燒熟的一隻烤鴨二百四十元。唉呀，我一看心裡面「蹦、蹦、蹦、蹦」跳了半天！我說我現在隨便造一點惡業，隨便欠人家二百四十塊錢，到那時候你還他！現在你呀二百四十塊錢哪裡用不掉，哪裡省不下來？對不起，你那個時候如果造了惡業的話，然後呢欠了這麼一點點，就被他燒成這個樣，烤成這個樣，然後被人家吃，划不來呀！實在划不來，實在划不來呀！然後有的時候我跑過去跑到螞蟻，一腳踩下去，啊，一下幾十個！我們造了一點惡業，到那個時候你隨隨便便任何情況之下，喏、喏、喏，被人家一下這樣的話 ……所以現在再怎麼大的苦，不要說：唉呀，現在這個地方這個不行、那個不行啊！對不起，絕對不會像刀割在你身上吧？到那時你受苦的時候，那刀割是最好的喲，那是千真萬確的喲，這是我們應該了解的啊！"]]},{"t":"62B 07:32","b":[["s","所以在這裡我們一定要好好地思惟，因為這個絕對不是 ─前面說是「極不現事」，它不是那麼眼前很明白讓你看得見的。我們眼前心理現行的是什麼？都是煩惱。所以我們一定要努力地修行，把這個煩惱把它淨除、懺悔，那個時候才可以。所以我們現在要了解，這件事情像鐵生銹一樣，對不起，鐵生銹不是外來的，它還是鐵自己生的，生完了以後呢，自己把那個鐵爛掉了。喏，就是我們這樣，這個惡業不是別人給你的，別人沒辦法害你，還是我們自己造的。所以我們自己看看做了沒有做，唉呀，這個都是我們自己造的業所感得的啊，經上面處處地方這樣告訴我們。好了，這個經上面說得很清楚、很明白。下面看："]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/012.mp3"},{"文":"康壟巴謂樸窮瓦云：「善知識說«唯有業果是極緊要»，現今講說聽聞修習，皆非貴重，我念唯此極難修持。」樸窮瓦亦云：「實爾。」","口譯":"康壟巴對樸窮瓦說：「善知識說唯有業果是最要緊的；現今的講說、聽聞、修習都不算貴重，我想唯有這個業果是最難修持的。」樸窮瓦也說：「確實如此。」","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第八、應如先輩正士所說而行：<\/span>康壟巴謂樸窮瓦云：「<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">我等<\/span>善知識<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">敦巴<\/span>說唯有業果，是極緊要，現今<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">一切智者於之<\/span>講說聽聞修習，皆非貴重，我念蓋唯獨此極難修持。」樸窮瓦亦云：「實爾。」","合註白話":{"id":"18424","頁":509,"白話":"第八科、應當依照前輩殊勝士夫的說法而作：康隆巴大師曾對樸穹瓦大師說：「我們的善知識敦巴曾說，只有業果是最重要的。現今所有智者都以為對此講聞修持沒有價值，我想也許只有這件事難以修持。」樸穹瓦大師也答道：「確實如此。」格西敦巴曾喚道：「覺窩瓦！別太過大膽，這緣起是很微細的。」樸穹瓦大師說：「我到老年時，契合、符順了開示業果的《賢愚經》。」霞惹瓦大師則說：「無論發生任何過失，佛陀從未歸咎於是環境惡劣以及修建房舍所致，始終都說是因為造了這樣的業，所以在這裡發生此事。而說所有的過失都歸於自己所造的業。」","注釋":["第八應如先輩正士所說而行：即前頁473「如先輩正士所言應理」一科。","康壟巴：種敦巴尊者的居士弟子（公元1025～1115），藏語ཁམས་ལུང་པ音譯，本名釋迦功德（釋迦雲丹．ཤཱཀྱ་ཡོན་ཏན），又名格西康隆巴。生於澎玉雍瓦（འཕན་ཡུལ་ལུང་བ）的崗氏家族。年少時學習經論，曾說：「我在拉薩（ལྷ་ས）、聶塘（སྙེ་ཐང），不是以牛馬的方式度過人生。」在聶塘時值遇阿底峽尊者，之後在熱振寺長期依止種敦巴尊者，而成為大眾普遍傳稱的四昆仲之一。大師在其住世的九十年間，以樹立實修的法幢，感召千人之多一起共修菩提心，以此利益眾生、弘揚教法！之後91歲於康隆示寂。大師著有《八座修法》。參見《師師相承傳》中文冊上，頁283；藏文冊上，頁341。","皆非貴重：夏日東活佛認為此句意指「沒有時間修持」。參見《夏日東文集》冊1，頁433。","我念蓋唯獨此極難修持：法尊法師原譯作「我念唯此極難修持」，今據藏文改譯。","覺窩瓦：藏語音譯，此是對人的尊稱，猶言大德、尊者等。","契合《賢愚》：法尊法師原譯作「依附《賢愚》」。阿嘉永津、慧海大師、善慧摩尼大師與夏日東活佛認為，此句意指對業果的取捨行持已經合乎《賢愚經》。猶不逾矩之義，故改譯。參見《阿嘉雍曾文集》冊上，頁83；《洛桑諾布文集》冊2，頁519；《夏日東文集》冊1，頁433；《廣論講授筆記》，頁39。","隨有何過佛不歸咎是方所惡宅舍所感皆說是由作如此業於此中生：慧海大師解釋，如果請問佛陀自身出現過失的原因時，佛陀不會回答：「因為你今年去了不應該去的地方，或者今年翻修了不應該翻修的房舍。」而是答道：「這完全是由於業果。」善慧摩尼大師提到，是方所惡，指自己所前往的處所方位惡劣；宅舍所感，指翻修房舍。法尊法師原譯作「佛不報怨」，今據藏文改譯。參見《洛桑諾布文集》冊2，頁519；《廣論講授筆記》，頁39。"],"已校":true},"覺燈日光":null,"時":"62B 08:30","頁":144,"af":"62b","st":510,"et":686,"消文":[{"文":"老師善知識告訴我們，業果最重要；學參禪、靜坐，見大善知識要灌頂——這些都不是貴重的。"},{"文":"業果不但最重要，而且很難修持。"},{"文":"阿底峽尊者全印度尊為「能仁第二」「釋迦再來」，到西藏人家稱他「業果喇嘛」；樸窮瓦也說：千真萬確！"}],"延伸":[{"題":"唯有業果是極緊要","組":[{"題":"業果喇嘛，處處講業果","說":[{"類":"例","文":"《阿底峽尊者傳》：藏王請尊者把佛法精華、修行最重要的道理說一下——不是最高的大法，是「業感緣起」。"},{"類":"立","文":"所以人家稱他「業果喇嘛」，跑到哪裡都跟你講這個。"}]},{"題":"生起定解，肯不肯偷懶","說":[{"類":"立","文":"真正對業感緣起、因果報應產生決定深刻的印象，你肯不肯做一點壞事？肯不肯偷一點懶？"},{"類":"立","文":"這道理說起來容易，做起來不容易。"},{"類":"回扣","文":"業感緣起後面還有一個字——空；從這個概念上把握住，所以這件事情很重要。"}]}],"說":[{"類":"例","文":"《阿底峽尊者傳》：藏王請尊者把佛法精華、修行最重要的道理說一下——不是最高的大法，是「業感緣起」。"},{"類":"立","文":"所以人家稱他「業果喇嘛」，跑到哪裡都跟你講這個。"},{"類":"立","文":"真正對業感緣起、因果報應產生決定深刻的印象，你肯不肯做一點壞事？肯不肯偷一點懶？"},{"類":"立","文":"這道理說起來容易，做起來不容易。"},{"類":"回扣","文":"業感緣起後面還有一個字——空；從這個概念上把握住，所以這件事情很重要。"}],"af":"62b","st":597}],"逐字稿":[{"t":"62B 08:30","b":[["q","康壠巴謂樸窮瓦云："],["s","那個祖師們他們怎麼說："]]},{"t":"62B 08:35","b":[["q","「善知識說唯有業果是極緊要，現今講說聽聞修習，皆非貴重，我念唯此極難修持。」樸窮瓦亦云：「實爾。」"],["s","他們兩個對說，說我們的老師善知識告訴我們，這個業果是最重要、最重要，這眼前講很多道理，說很多修習 ─實際上我們學太多這樣東西，唉呀，不管是小的參禪、靜坐，有很多人說我要學打坐，我要學什麼；哦，看見一個大善知識我要去灌一個頂，哎喲，是大得不得了。對不起，這個都不是貴重的，最重要的是什麼？業果！而且這個道理不但最重要啊，而且很難修持。所以當年阿底峽尊者到西藏去的，人家稱他為「業果喇嘛」，喇嘛是什麼？最尊貴的稱呼。換句話說，這個了不起的大善知識專門講這個東西。你看，像阿底峽尊者這麼了不起的人，印度當年這樣的狀態，全印度尊他為「能仁第二」，「釋迦再來」，他告訴我們的什麼？就是這個道理。結果呢？下面樸窮瓦也說：「千真萬確，一點都沒有錯，一點都沒有錯！」那祖師告訴我們的。上面這一段話，這個覺"]]},{"t":"62B 09:57","b":[["s","瓦那段公案，你們可以看看那個《阿底峽尊者傳》，《阿底峽尊者傳》到他後來到西藏以後，那個藏王請他，希望他能夠把佛法的精華，把這個修行最重要的道理給大家說一下。要我們現在想起來，唉呀，最好是最高的高高大法，其實他不是，告訴你什麼？「業感緣起」就是，所以人家稱他為「業果喇嘛」，他跑到哪裡跟你講這個。"]]},{"t":"62B 10:39","b":[["s","我們現在不妨認真想一想，當你真正地對這個業感緣起，這因果報應，產生了決定深刻印象，你肯不肯做一點壞事，你肯不肯偷一點懶？但是這個道理說起來容易哦！講起來，不容易哦！實際上業感緣起後面還有一個字 ─空，業感緣起這是世間的因果，然後呢了解空性這是更重要的一個特點。所以現在我們真正重要從這一個，這個概念上面把握住這一點，把握住這一點，所以說這個事情很重要。下面："]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/013.mp3"},{"文":"又敦巴云：「覺𡁮瓦心莫寬大，此緣起微細。」","口譯":"又敦巴說：「覺𡁮瓦（尊者）啊，心不要寬大鬆泛，這個緣起是很微細的。」","四家合註":"又<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">格西<\/span>敦巴云：「<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">喚曰<\/span>覺窩瓦，心莫寬大，此緣起微細。」","合註白話":{"same":12},"覺燈日光":null,"時":"62B 11:26","頁":144,"af":"62b","st":686,"et":769,"消文":[{"文":"「覺𡁮瓦」是尊重的稱呼，就像我們稱「菩薩呀」。"},{"文":"換一個口氣：不要浮浮泛泛，自己覺得懂了就馬馬虎虎；放逸的狀態就是「寬大」——覺得平常、還滿好。"},{"文":"一定要非常認真，產生正確認識，深入思惟觀察到產生勝解，心裡就不會放逸。"},{"文":"緣起非常細微，粗顯的地方看得見，細微的地方根本不知道。"}],"延伸":[],"逐字稿":[{"t":"62B 11:26","b":[["q","又敦巴云：「覺𡁮瓦心莫寬大，此緣起微細。」"],["s","這「覺𡁮瓦」是平常我們稱作，哎，菩薩啊，常常對人家就是比較尊重一點的稱呼。一般說什麼：「菩薩呀，你心裡不要自己覺得寬大呀！」換一個口氣我們就了解了：我們不要這麼浮浮泛泛，自己覺得懂了就馬馬虎虎 ─就是我們這種心裡面。一定要非常認真，對這個事情要確定產生它正確的認識，而且深入地思惟觀察到產生勝解，那個時候你心裡面就不會放逸。放逸的狀態是什麼呢？就是這個地方說寬大、寬大 ─欸，就覺得平常，你還說不上什麼，還覺得滿好，就這個。要曉得這個緣起的這個道理是非常細微，我們呢儘管今天講了，粗顯的地方看得見，細微的地方根本不知道啊！所以，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/014.mp3"},{"文":"樸窮瓦云：「我至老時，«依附《賢愚》»。」","口譯":"樸窮瓦說：「我到老的時候，還是依靠《賢愚因緣經》。」","四家合註":"樸窮瓦云：「我至老時，契合<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">符順開示業果之<\/span>《賢愚<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">經<\/span>》。」","合註白話":{"same":12},"覺燈日光":null,"時":"62B 12:49","頁":144,"af":"62b","st":769,"et":898,"消文":[{"文":"樸窮瓦是敦巴三位最重要的心子之一。"},{"文":"這樣一位大善知識修了一輩子，到老還看《賢愚因緣經》——某人因地種了什麼因，感得這個果。"}],"延伸":[{"題":"依附《賢愚》","組":[{"題":"大善知識到老還看","說":[{"類":"下手","文":"所以師父鼓勵大家好好看這種書：經上的固然要看，像《了凡四訓》《俞淨意公遇竈神記》，無非說明這個。"},{"類":"破","文":"大善知識到老還要看，我們剛入佛門都不要看——好的說都是佛菩薩再來，壞的說是我們業太重。"},{"類":"下手","文":"這一點要自己檢查，然後策勵。"}]},{"題":"認真去看，驚心動魄","說":[{"類":"立","文":"凡夫走上去的，認真去看，一定產生警惕，乃至驚心動魄，就不會這麼馬馬虎虎。"},{"類":"立","文":"覺得「唉呀，我實在太差」，那時就開始走上修學佛法了。"},{"類":"回扣","文":"愚的人自己曉得自己差——對了！看看祖師的榜樣。"}]}],"說":[{"類":"下手","文":"所以師父鼓勵大家好好看這種書：經上的固然要看，像《了凡四訓》《俞淨意公遇竈神記》，無非說明這個。"},{"類":"破","文":"大善知識到老還要看，我們剛入佛門都不要看——好的說都是佛菩薩再來，壞的說是我們業太重。"},{"類":"下手","文":"這一點要自己檢查，然後策勵。"},{"類":"立","文":"凡夫走上去的，認真去看，一定產生警惕，乃至驚心動魄，就不會這麼馬馬虎虎。"},{"類":"立","文":"覺得「唉呀，我實在太差」，那時就開始走上修學佛法了。"},{"類":"回扣","文":"愚的人自己曉得自己差——對了！看看祖師的榜樣。"}],"af":"62b","st":774}],"逐字稿":[{"t":"62B 12:49","b":[["q","樸窮瓦云："],["s","樸窮瓦就是敦巴的三個心子最重要的，說："]]},{"t":"62B 12:54","b":[["q","「我至老時，依附《賢愚》。」"],["s","看看！這樣的一位大善知識，他修行了一輩子，他說我到老了我還什麼？「依附《賢愚》」，賢愚什麼？《賢愚因緣經》。換句話說他一直修到老了，他一直還看什麼？看那個，喏，《賢愚因緣經》。《賢愚因緣經》就是平常我們經常舉的很多例子，說某人因地當中種了一個什麼因，感得這個果。這是為什麼我鼓勵大家好好地看看像這種書，經上面固然我們要看，乃至於現在流通的，像《了凡四訓》、《俞淨意公遇竈神記》，無非都是說明了這個。那些大善知識修了一輩子到老了還要看，我們現在啊，我覺得真是人人都是佛菩薩，我們剛入佛門都不要看。這個當然從好的地方說都是佛菩薩再來人，那了不起；壞的地方來看的話，那表示我們現在的這個業太重。所以這一點我們要自己檢查了然後策勵呀！"]]},{"t":"62B 14:17","b":[["s","我想我們沒有一個人例外的，假定說你是凡夫走上去的話，你去看了以後，你認真去看的話，你一定會產生很警惕的心情，乃至於你自己感覺得驚心動魄，就不會這麼馬馬虎虎了。到那時候你要任何時候覺得：唉呀，不可以啊！你如果那個時候覺得這不可以，你只覺得，唉呀，我實在太差，那時候你就開始走上修學佛法了。所以他說愚的人自己曉得自己差，對了，對了！那就是我們現在應該走的，看看那個祖師的榜樣呀！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/015.mp3"},{"文":"霞惹瓦云：「隨有何過，«佛不報怨»，是方所惡，宅舍所感，皆說是由作如此業，於此中生。」","口譯":"霞惹瓦說：「不論有什麼過失，佛都不會報怨；這個地方的惡劣、所住宅舍的不好，都說是由於造了這樣的業，才生在這裡。」","四家合註":"霞惹瓦云：「隨有何過，佛不歸咎是方所惡、宅舍所感，皆說是由作如此業，於此中生<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">而說一切過失皆歸自所造業<\/span>。」","合註白話":{"id":"18488","頁":511,"白話":"第二科、以四力淨化的道理，分為八科：一、不應毫不考慮就置之不理，而是應當依循大悲導師的言教，以各種方法淨化；二、還淨墮罪；三、以四力還淨惡業；四、淨化的道理，以及斷除詰難；五、致力於一開始就不要沾染的道理；六、必須修持的比喻；七、必須隨所了知而不放逸地修持；八、讚歎為正見，並且教誡要珍視業果。第一科：如上所述，雖然致力於不被惡行沾染，但是如果由於放逸以及煩惱過多等因素，以致發生過失，則不可毫不考慮就置之不理，必須致力於大悲導師所開示的那些還淨方法。第二科：而還淨墮罪的方法，則應依照三種律儀中各別宣說的作法去實踐。","注釋":["應如三種律儀別說而行：法尊法師原譯作「應如三種律儀別說」，今據藏文補譯。三種律儀，指別解脫律儀、菩薩律儀與密乘律儀。"],"已校":true},"覺燈日光":null,"時":"62B 14:58","頁":144,"af":"62b","st":898,"et":1121,"消文":[{"文":"不管做什麼，佛不會報怨；所感得的一切善惡，都是做這樣的業感這樣的果。"},{"類":"回扣","文":"了解了業果，從此努力不再做、以後也要防止。"},{"文":"但生命不是從現在開始，無量劫來積了不曉得多少；了解了有時不小心、妄念、放逸還要犯，怎麼辦？"},{"類":"下手","文":"有一個特別的辦法──要懺悔：以前造的一定要懺除乾淨，以後萬一不小心也把它懺除乾淨，就可以不感這個惡果。"}],"延伸":[{"題":"佛不報怨","組":[{"題":"護法護的是法","說":[{"類":"破","文":"常聽人說：「這樣做，護法、韋馱菩薩、伽藍聖眾會護持的。」聽起來很有道理，實際上很難說。"},{"類":"立","文":"韋馱、伽藍決定是護法的，但他護的是法；眾生造的業不相應，沒有用。"},{"類":"因","文":"如果都是他們護，請問現在會不會是末法？既然是末法，他們護在哪裡？"}]},{"題":"如法行持，才得護持","說":[{"類":"破","文":"自己不努力，叫護法去護，這不是顛倒嗎？"},{"類":"立","文":"你如法行，就有這樣的業力感得，那時他才護你；他護的是法，可沒有護你的非法。"},{"類":"立","文":"眼前種種不如意是宿生的業，業過完了，不但護法會護，佛菩薩會接引。"},{"類":"下手","文":"在這龍蛇混雜的狀態中，你如法、你忍，他就會一直保護著你。"}]}],"說":[{"類":"破","文":"常聽人說：「這樣做，護法、韋馱菩薩、伽藍聖眾會護持的。」聽起來很有道理，實際上很難說。"},{"類":"立","文":"韋馱、伽藍決定是護法的，但他護的是法；眾生造的業不相應，沒有用。"},{"類":"因","文":"如果都是他們護，請問現在會不會是末法？既然是末法，他們護在哪裡？"},{"類":"破","文":"自己不努力，叫護法去護，這不是顛倒嗎？"},{"類":"立","文":"你如法行，就有這樣的業力感得，那時他才護你；他護的是法，可沒有護你的非法。"},{"類":"立","文":"眼前種種不如意是宿生的業，業過完了，不但護法會護，佛菩薩會接引。"},{"類":"下手","文":"在這龍蛇混雜的狀態中，你如法、你忍，他就會一直保護著你。"}],"af":"62b","st":898}],"逐字稿":[{"t":"62B 14:58","b":[["q","霞惹瓦云：「隨有何過，佛不報怨，是方所惡，宅舍所感，皆說是由作如此業，於此中生。」"],["s","又有一個祖師說：它不管你做什麼事情，佛不會報怨。我們絕對不要說做了這個以後佛報怨，佛不會的。我們所有一切的任何事情所以感得的善惡，都是什麼？你做這樣的業感這樣的果，做這樣的業感這樣的果。像我們常常還聽見人家說一句很有趣的話，說：「這樣做的話，那個護法，或者是韋馱菩薩，或者是伽藍聖眾，他會護持的。」這個話聽起來好像很有道理，實際上有沒有道理？這很難說！韋馱菩薩、伽藍聖眾決定是護法的，但是他護的是法哦，他護的是法哦！如果我們眾生造的業不相應的話，那個沒有用哦！這個道理很清楚、很明白。假定說這個法要都是他們護，他們真是像我們想像當中說，都是他們護的話，現在請問：會不會是末法？現在是末法。那麼既然是末法，他們護的，他們護在哪裡啊？這不是道理很簡單、很清楚嘛！你們現在想想看對不對？"]]},{"t":"62B 16:35","b":[["s","我聽見太多的人，啊！說這個護法會護的。你自己不努力，叫護法去護，這不是顛倒嗎？你如法行，就有你這樣的業力來感得，那個時候你如法，他才護你；他護的是法耶，他可沒有護你非法，你要了解哦，這個很清楚、很明白。所以眼前在這個龍蛇混雜的狀態當中，你如法、你忍，那個就是你如法，他會一直保護著你。你所以現在眼前感種種不如意，那是你宿生的業，等到這個業過完了以後，不但護法會護，佛菩薩會接引，到那個時候，你不到極樂世界也到天上去。對了嘛，這個才是真的呀！所以你如法行持，那個時候才會如法地護持你哦！不要我們自己不管，說：「啊，那個護法 ……」沒有這樣的事情。這個我們要了解，這我們要了解。"]]},{"t":"62B 17:40","b":[["s","那麼現在我們了解了，這個是了解了這個業以後，我們必定要認識的一個，說：對了！現在了解了以後，那從此以後努力就不再做了，以後也要防止。但是有一個問題：我這個生命不是從現在開始的，從無量劫來那個時候積了不曉得多多少少，那怎麼辦，那怎麼辦？還有一個，儘管我現在了解了，但是有的時候不小心，或者是妄念，或者放逸還要犯，那怎麼辦呢？欸，那個時候它有一個特別的辦法 ─要懺悔。以前造的一定要懺除乾淨，然後呢，以後萬一不小心你也應該把它懺除乾淨，這樣你就可以不感這個惡果，不感這個惡果。所以這個地方進一步："]]}],"口譯音":"口譯音檔/shenxin-yeguo-17/016.mp3"}],"投影片":[{"img":"投影片/shenxin-yeguo-17/001.webp","n":1},{"img":"投影片/shenxin-yeguo-17/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/shenxin-yeguo-17/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/shenxin-yeguo-17/004.webp","n":4},{"img":"投影片/shenxin-yeguo-17/005.webp","n":5},{"img":"投影片/she
