mg":"投影片/shenxin-yeguo-11/039.webp","n":42,"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-11/040.webp","n":45,"yt":"E1qFpq1i0fY"},{"img":"投影片/shenxin-yeguo-11/041.webp","n":46}],"投影片PDF":"投影片/shenxin-yeguo-11/slides.pdf","音檔範圍":"57A 14:09～58A 21:25"},"shenxin-yeguo-12":{"id":"shenxin-yeguo-12","標題":"深信業果(十二)","根":"白業果","科判焦點":"丑二 白業果","課本範圍":"P136 LL5 ~ P138 L4","堂數":72,"日期":"2026/7/14","分圖":[{"名":"白業・靜息方便","原文":[0,3]},{"名":"白業果・三乘","原文":[4,9]},{"名":"引滿差別","根":"業餘差別","原文":[10,20]}],"跨科判":[{"科判":"丑三 業餘差別","起":10}],"週":95,"班級":"24秋007","序":null,"音檔":{"58a":{"local":"音檔/gl1/058A.mp3","remote":"https://lamrim.xyz/player/media/gl1/058A.mp3"},"58b":{"local":"音檔/gl1/058B.mp3","remote":"https://lamrim.xyz/player/media/gl1/058B.mp3"},"59a":{"local":"音檔/gl1/059A.mp3","remote":"https://lamrim.xyz/player/media/gl1/059A.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=58a&st1=1285&af2=58b&af3=59a&et3=187","段":[{"文":"一白業，二果。今初，〈本地分〉說，於殺生不與取欲邪行，起過患欲解，起勝善心，若於彼起«靜息方便»，及於彼靜息究竟中，所有身業。語四意三，亦皆如是。","口譯":"善業和它的果報分兩點：一、善業；二、善業的果報。先講第一點。〈本地分〉說：對殺生、偷盜、邪淫，看清它們的過患、真心想避開，生起很好的善心，進而想辦法停止，並且徹底做到不犯，這整個過程中的身體行為，就是善業。口的四種、意的三種，也都是這樣。","四家合註":"<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如前所說，僅唯不行殺生等十，不成安住十白業道，故當辨識十種不善、見為過患、修斷加行、防護，從究竟斷心之上而為安立。初者例如身三白業體性，<\/span>《本地分》說︰「於殺生、不與取、欲邪行，起過患欲解，起勝善心，若於彼起靜息方便，及於彼靜息究竟中所有身業。語四、意三，亦皆如是。","合註白話":{"id":"16620","頁":456,"白話":"第三科、顯示業的其他差別，其中分為三科：一、引滿；二、決定與不決定；三、哪種果報最先成熟。第一科分為四科：一、善不善兩者的引業與滿業差別；二、四句型的推算方式；三、引生與圓滿的道理；四、解說兩種業會引生多少世。第一科、引滿的差別：引生善趣的業是善法，引生惡趣的業則是不善法。能圓滿的業則不固定，在善趣中，也有肢節殘缺、五根不全、膚色醜惡、短命、多病，以及貧窮等，這些是由於不善所導致；畜生及餓鬼當中也有財富圓滿的，這是由善業所導致。第二科：既然如此，由能引的善業所引生當中，便有能滿的善業所圓滿，與能滿的不善業所圓滿兩種；由能引的不善業所引生當中，也有由能滿的不善業所圓滿，與能滿的善業所圓滿兩種，共有四種情形。第三科、引生與圓滿的道理：《集論》中說：「由於善不善業，前者導致投生於善趣，以及後者導致惡趣，應當曉得其中有能引生及能夠圓滿的業。能引生，是導致引生所引善惡趣的異熟蘊體的業；能夠圓滿，是導致投生該趣之後，在其所依身中領受喜愛與不喜愛的業。」第四科分為兩派：第一、《俱舍論》主張一個業只能引出一生：《俱舍論》中說：「一個業只能引出一生，能圓滿的則很多。」是提到由一個業引出一生，而不會引出許多生，能圓滿業則有許多；也不會由許多業引出一個身體。第二、《集論》主張從一可以引出眾多：《集論》則說：「既有由一個業引出一個身體的業，也有由一個業引出許多身體的業；既有由許多業引出一個身體的業，也有由許多業引出許多身體的業。」《釋論》中解釋：藉由一剎那的業，亦即一個業，僅僅滋長一生的異熟種子，亦即只引出一生，以及也有藉由這一個業，滋長許多生的異熟種子，亦即引出多生；另外，單是一個力量微小的業，無法引出一個身體，而是藉由眾多剎那的業，反覆滋長那一個身體的種子，亦即只引出那一生。以及也有眾多業互相倚賴而聚集，從而反覆滋長，引生出多生相續的眾多身體的種子。","注釋":["第三顯示業餘差別中：即前頁345「業餘差別」一科。","引滿差別：前文科判作「善不善二引滿業之差別」。","《集論》云：引文唐玄奘大師譯《大乘阿毘達磨集論》作：「善不善業於善趣惡趣中感生異熟時，有招引業、圓滿業。招引業者，謂由此業能感異熟果。圓滿業者，謂由此業生已，領受愛不愛果。」見《大正藏》冊31，頁679；《丹珠爾》對勘本冊76，頁216。","《俱舍論》云：引文陳真諦三藏譯《阿毘達磨俱舍釋論．分別業品》作：「一業引一生。」「多業能圓滿。」唐玄奘大師譯《阿毘達磨俱舍論》作：「一業引一生，多業能圓滿。」見《大正藏》冊29，頁246、318；《丹珠爾》對勘本冊79，頁33。","亦非眾多共引一生：藏文原文本作「亦非眾多共引一」，無「生」字，故箋註加一「身」字。法尊法師蓋取論義，補入「生」字。","《集論》則說：引文唐玄奘大師譯《大乘阿毘達磨集論》作：「或有業由一業力牽得一身，或有業由一業力牽得多身，或有業由多業力牽得一身，或有業由多業力牽得多身。」見《大正藏》冊31，頁679；《丹珠爾》對勘本冊76，頁216。","一身：法尊法師原譯作「一生」，今據藏文改譯，下文同。","《釋》中說云：《釋》，此處指《阿毘達磨集論》的釋論，《丹珠爾》中載有兩部，分別為《阿毘達磨集論釋》與《阿毘達磨集論解》，二者皆有宗喀巴大師所引用的相應段落。《阿毘達磨集論釋》，唯識部論典，共10卷，勝者子論師著，尚無漢譯。《阿毘達磨集論解》，唯識部論典，共5品，勝者子論師著。漢譯本有唐玄奘大師譯《大乘阿毘達磨雜集論》16卷。勝者子論師，唯識派祖師（生卒事蹟不詳），梵語Jinaputra及藏語རྒྱལ་བའི་སྲས義譯，又名最勝子。據《佛光大辭典》註釋此師為唯識十大論師之一，法護論師（Dharmapāla）的弟子，曾於北印度鉢伐多國作《瑜伽師地論釋》，另外又著有《菩薩戒品廣釋》與《阿毘達磨集論釋》。兩本論皆為《阿毘達磨集論》的詳細解釋。此段為宗喀巴大師取經文大意，非錄原文，相應段落參見唐玄奘大師譯《大乘阿毘達磨雜集論》云：「由一業力牽得一身，謂由一業力長養一生異熟種子故。或有業由一業力牽得多身，謂由一業力長養多生異熟種子故。或有業由多業力牽得一身，謂由多業剎那數數長養一生異熟種子故。或有業由多業力牽得多身，謂多剎那業更相資待，展轉長養多生異熟種子故。」見《大正藏》冊31，頁728；《佛光大辭典》冊7，頁6119；《丹珠爾》對勘本冊76，頁1070、1473。"],"已校":true},"覺燈日光":null,"時":"58A 21:25","頁":136,"af":"58a","st":1285,"et":1697,"消文":[{"文":"前面講黑業，這裡講白業：以前做殺盜淫這些事，現在了解它種種的害處，有了正確的認識。"},{"文":"以前不了解，一心好樂去追求，那是貪欲；現在了解了錯誤，一心去排斥，這個欲跟法相應，叫善法欲。"},{"文":"「起勝善心」：從根本上了解了而生起的善心，叫殊勝，不是世間一般的善惡。"},{"文":"前面起的是染污相應的意樂，現在是勝善相應的意樂；前面起殺生等加行，現在起「靜息」——停止不再做的種種方便。"}],"延伸":[{"題":"靜息方便","組":[{"題":"先認清過患，再起遠離方便","說":[{"類":"立","文":"對業感果的道理、對第一義諦，我們都不知道；了解了它的過患，慢慢跟勝善相應，當然就要遠離，生起種種靜息的方便。"},{"類":"下手","文":"剛開始道理懂了，習氣很強，境界來擋不住；所以先遠離：出家，不跟在家人在一起，廟在山裡，碰不見。"},{"類":"喻","文":"吃東西像塗車油，只要塞飽肚子就算；廚房儘量不要去，越簡單越好。"}]},{"題":"出家是為三界人天師表","說":[{"類":"破","文":"出了家還要講口味，講一大堆世俗的道理——那在家一樣修行，不必出家。"},{"類":"立","文":"出家修行，是要做三界人天師表；一時做不到，但要有正確的認識，心心念念努力，慢慢自然做到。"},{"類":"例","文":"古來都是身貧道不貧；師父小時候看到的廟裡，平常哪有什麼菜，根本沒有。"}]},{"題":"從境上遠離，內心與法相應","說":[{"類":"立","文":"內心先有這個認識，再起加行，慢慢從境上遠離，努力學習內心跟它相應——這就是修白業。"},{"類":"回扣","文":"上面講的是身業的殺、不與取、欲邪行，下面講語業、意業。"}]}],"說":[{"類":"立","文":"對業感果的道理、對第一義諦，我們都不知道；了解了它的過患，慢慢跟勝善相應，當然就要遠離，生起種種靜息的方便。"},{"類":"下手","文":"剛開始道理懂了，習氣很強，境界來擋不住；所以先遠離：出家，不跟在家人在一起，廟在山裡，碰不見。"},{"類":"喻","文":"吃東西像塗車油，只要塞飽肚子就算；廚房儘量不要去，越簡單越好。"},{"類":"破","文":"出了家還要講口味，講一大堆世俗的道理——那在家一樣修行，不必出家。"},{"類":"立","文":"出家修行，是要做三界人天師表；一時做不到，但要有正確的認識，心心念念努力，慢慢自然做到。"},{"類":"例","文":"古來都是身貧道不貧；師父小時候看到的廟裡，平常哪有什麼菜，根本沒有。"},{"類":"立","文":"內心先有這個認識，再起加行，慢慢從境上遠離，努力學習內心跟它相應——這就是修白業。"},{"類":"回扣","文":"上面講的是身業的殺、不與取、欲邪行，下面講語業、意業。"}],"af":"58a","st":1512}],"逐字稿":[{"t":"58A 21:25","b":[["q","一白業，二果　今初〈本地分〉說，於殺生不與取欲邪行，起過患欲解起勝善心，若於彼起靜息方便，及於彼靜息究竟中，所有身業。語四意三，亦皆如是。"],["s","那麼前面講黑 惡業，這裡講白 善業。那麼善業是什麼呢？就是前面所說的這個黑業，殺、盜、淫、身三、口四等等，以前做的這種事情，現在了解它有種種的害處，種種的過失，對於這個道理，你有正確地認識。因為你以前不了解，所以你一心好樂去追求它，現在你了解了這個錯誤，所以一心去排斥它，排斥它。那麼好樂的時候，這個欲是「貪欲」，排斥的時候，這個欲跟法相應叫「善法欲」，對於這個有它正確地認識。「起勝善心」，由於這樣的關係，然後那個生起來的這個善心，這個叫勝 ─超勝、殊勝的。平常世間也有善惡，現在我們從根本上面了解了，所以不是世間的。"]]},{"t":"58A 23:05","b":[["s","對於業果來說，有兩點內容我們不知道，一個是由業感果的道理，我們不知道；第二個，就是第一義諦。這個業感果彼此之間的究竟的原因在什麼地方？說空，空故業感緣起，所以業感緣起是因果的道理，這個是第一層。第二層呢，因為業感緣起所以它的空，這是第二層，第二層我們稱它為第一義，叫勝義。那麼現在對於這些事情，你了解了它的過失、患害，慢慢地跟勝善相應，既然生了勝善相應的話，當然你要遠離它，那個時候生起種種的靜息的方便。"]]},{"t":"58A 24:07","b":[["s","前面的話呢，我們起的什麼？起的是所謂意樂，這個意樂就是說跟染污相應的心理；現在那個意樂的話，勝善相應的心理。由於這種心理的話，前面這個心理起殺生等加行，現在呢我們起什麼？「起靜息」，停止不再做的種種的方便，這個方便就是我們的行為。「及於彼靜息究竟事中」，所有身業、語業，身語意三都是如此，這個反過來就是。所以這個裡邊也包含了什麼？第一個對這件事情的認識，以前是不認識，無明相應的，所以呢起種種的貪、瞋、癡相應的意樂。現在呢正確了解了，了解它的過患以後起勝善心，然後的加行，就起的靜息的方便，說以前要去貪，哦，現在不去！"]]},{"t":"58A 25:12","b":[["s","那麼，這個上面我不妨作一下 ─假定我們剛開始的時候，道理雖然懂，但是因為習氣很強，所以在境界上面是擋不住。那我們了解了：對不起，我根本就遠離，我出家，不跟在家人在一起。然後這個廟宇在山裡邊，嗯，碰不見，好囉！這個是遠離的，在開始的方便。乃至於平常的時候，儘管到了這裡，我們還難免要吃、要睡，所以廚房裡儘量不要去，這是為什麼我們現在儘量地把它越簡單越好。佛告訴我們這個像塗車油，你只要塞飽肚子就算。當然我們一下做不到，但是我們一定要把握得住，是這個情況。"]]},{"t":"58A 26:07","b":[["s","所以說到這裡順便，有人告訴我 ……出了家還要講口味，還要講什麼，我總歸告訴他，那你回家去，用不著到這裡來，用不著到這裡來。他又講很多道理，那個道理都是世俗的道理。是，你可以到世俗上面，做一個很好的人，但是不必出家，在家一樣修行。要曉得如果是出家修行的話，要為什麼？要三界人天師表。是，我們一時做不到，是的，不是說一下要做到，但是我們必定要有了這個正確地認識，心心念念說我要努力、努力，你慢慢地做到，自然做到。所以古來那些人哪，到後來都是什麼 ─身貧是道不貧。我們不必說佛世，也不必說太過那麼乞丐，就是我們中國古代，不要說古代，就是我眼前看見，我小的時候，那個廟裡哪有什麼東西吃呀！喏，不妨你們問問我們老和尚。我那時候聽我們像仁法師，那個時候什麼啊？平常的時候哪有什麼菜，根本沒有的呀！這個我們要了解，所以我在這地方順便說一下。"]]},{"t":"58A 27:15","b":[["s","我們必定要內心上面先有這個認識，然後呢進一步起加行的時候，什麼？就遠離的方便，這樣。慢慢、慢慢地從境上面去遠離，然後呢努力去學習內心當中跟它相應，這個就是我們修行白業是這樣的。所以關於這本書上的，回頭我們再講，你們拿到了以後，自己先好好地看一遍，拿到了看一遍。然後呢我會找時間跟你們真正解釋，到這個下士道完的時候，整個的這個修行的宗要，整個的修行的宗要。上面我們已經講了善業；殺、然後呢不與取、欲邪行。下面呢，說"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/001.mp3"},{"文":"其差別者，謂云語業及云意業。","口譯":"其中的差別，只在於把「身業」換成「語業」和「意業」來說。","四家合註":"其差別者，謂云語業及云意業」。","合註白話":{"same":0},"覺燈日光":null,"時":"58A 28:17","頁":136,"af":"58a","st":1697,"et":1711,"消文":[{"文":"上面講的是身三種，下面是語業跟意業，同樣的道理。"}],"延伸":[],"逐字稿":[{"t":"58A 28:17","b":[["q","其差別者，謂云語業及云意業。"],["s","上面是講的身三種，下面的是語業跟意業，同樣的道理："]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/002.mp3"},{"文":"事及意樂，加行究竟，如應配合。","口譯":"對象、動機、行動、完成這四個條件，要依每一種善業適當地對應。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二者：<\/span>事及意樂、加行、究竟，如應配合。","合註白話":{"same":0},"覺燈日光":null,"時":"58A 28:31","頁":136,"af":"58a","st":1711,"et":1745,"消文":[{"文":"造惡的時候分四個部分：事——所做的對象；意樂——造的時候的心理狀態；加行——造業時所起的種種方便；以及究竟。"},{"文":"「如應配合」：跟各個不同的業相應地去配合。"}],"延伸":[],"逐字稿":[{"t":"58A 28:31","b":[["q","事及意樂，加行究竟，如應配合。"],["s","我們造惡的時候，分四個部分：事 所做的對象，意樂 我們造的時候心理狀態，加行是造業的時候的所起的種種的方便，以及究竟。那麼「如應配合」，就跟各個不同的業，相應地去配合。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/003.mp3"},{"文":"例如遠離殺生業道，事者，謂他有情。意樂者，謂見過患，起遠離欲。加行者，謂起諸行靜息殺害。究竟者，謂正靜息圓滿身業，«以此道理»，餘亦應知。","口譯":"例如遠離殺生的業道：事，是指其他的有情；意樂，是見到殺生的過患，生起遠離的欲求；加行，是生起種種行為來靜息殺害；究竟，是真正止息殺害、圓滿這個身業。依這個道理，其餘的業道也應當了知。","四家合註":"例如遠離殺生業道，事者，謂他有情。意樂者，謂見過患，起遠離欲。加行者，謂起諸行靜息殺害。究竟者，謂正靜息圓滿身業。以此道理，餘亦應知。","合註白話":{"same":0},"覺燈日光":null,"時":"58A 29:05","頁":136,"af":"58a","st":1745,"et":null,"消文":[{"文":"上面這個懂了，下面就很容易懂。"}],"延伸":[{"題":"以此道理","組":[{"題":"上面一堂絕端重要，務必弄懂","說":[{"類":"立","文":"文字很容易懂，最重要的是上面一堂課，這是修行決定的關鍵，大家千萬注意。"},{"類":"下手","文":"聽過了以後，好好深入地去思惟觀察，務必要弄懂；弄懂了，心裡馬上有不同的感受。"}]},{"題":"概念不清，始終在形相上轉","說":[{"類":"破","文":"歸依了、受五戒了、出家了、受比丘菩薩戒了，到底修些什麼？還是含糊一片。"},{"類":"立","文":"概念清楚了，心念一動就清楚：這又是老毛病，在染污當中；反過來，一對，馬上曉得這一念對。念佛、學定，主要概念都在這上頭。"}]},{"題":"認得增上果是騙子，才放得下","說":[{"類":"立","文":"等流心識是內心的，增上果是外在的，同樣要清楚；不清楚，就被外面的東西纏得死死的。"},{"類":"因","文":"明明是邪見增上最惡劣的結果，偏偏看成好的；認識了，曉得那是大騙子，叫你放不下也不可能。"},{"類":"破","文":"不認識的話，覺得是好東西，叫你放怎麼放？修行就變成千辛萬苦。"}]},{"題":"嘴巴相應，心裡不相應","說":[{"類":"例","文":"周利槃陀伽笨到「掃帚」兩個字都記不住：宿生出家時持戒很好，卻聽不進空緣起，還毀謗，墮阿鼻地獄，出來以後多生一直笨。"},{"類":"例","文":"另一個宿生是大班智達，名相辯得很清楚，但慢心憍心很強，嘴巴講的是法，心裡不相應，死後墮落，墮落以後還是笨。"}]},{"題":"靠正知見認得自己起心動念","說":[{"類":"立","文":"貪瞋癡增上產生種種顛倒，能認得正誤，靠正知見；正知見所見到的，就是自己的起心動念，這叫等流因果，修行從這裡開始。"},{"類":"立","文":"有了這一念，拜佛、念佛、吃飯、睡覺，沒有一時一刻不是修行。"}]}],"說":[{"類":"立","文":"文字很容易懂，最重要的是上面一堂課，這是修行決定的關鍵，大家千萬注意。"},{"類":"下手","文":"聽過了以後，好好深入地去思惟觀察，務必要弄懂；弄懂了，心裡馬上有不同的感受。"},{"類":"破","文":"歸依了、受五戒了、出家了、受比丘菩薩戒了，到底修些什麼？還是含糊一片。"},{"類":"立","文":"概念清楚了，心念一動就清楚：這又是老毛病，在染污當中；反過來，一對，馬上曉得這一念對。念佛、學定，主要概念都在這上頭。"},{"類":"立","文":"等流心識是內心的，增上果是外在的，同樣要清楚；不清楚，就被外面的東西纏得死死的。"},{"類":"因","文":"明明是邪見增上最惡劣的結果，偏偏看成好的；認識了，曉得那是大騙子，叫你放不下也不可能。"},{"類":"破","文":"不認識的話，覺得是好東西，叫你放怎麼放？修行就變成千辛萬苦。"},{"類":"例","文":"周利槃陀伽笨到「掃帚」兩個字都記不住：宿生出家時持戒很好，卻聽不進空緣起，還毀謗，墮阿鼻地獄，出來以後多生一直笨。"},{"類":"例","文":"另一個宿生是大班智達，名相辯得很清楚，但慢心憍心很強，嘴巴講的是法，心裡不相應，死後墮落，墮落以後還是笨。"},{"類":"立","文":"貪瞋癡增上產生種種顛倒，能認得正誤，靠正知見；正知見所見到的，就是自己的起心動念，這叫等流因果，修行從這裡開始。"},{"類":"立","文":"有了這一念，拜佛、念佛、吃飯、睡覺，沒有一時一刻不是修行。"}],"af":"58b","st":8}],"逐字稿":[{"t":"58A 29:05","b":[["q","例如遠離殺生業道，事者，謂他有情。意樂者，謂見過患，起遠離欲。加行者，謂起諸行靜息殺害。究竟者，謂正靜息圓滿身業，以此道理，餘亦應知。"],["s","那上面這個懂了，下面這就很容易懂；上面這個很容易懂。"]]},{"t":"58B 00:08","b":[["s","所以在這個地方，這個文字很容易懂，可是最重要的就是上面一節、上面一堂課。大家千萬注意！這是我們修行決定的關鍵，你對這個概念能不能認識、能不能修行，上面這一堂課絕端重要！所以大家聽過了以後，我希望你們好好地深入地去思惟、觀察一下，務必要弄懂。弄懂了之後，你心裡馬上有不同的感受，立刻可以感受得出來，非常清楚。"]]},{"t":"58B 00:42","b":[["s","否則的話呢，儘管你講修行、修行，修了半天你始終在形相上面轉。是，你說，啊，我歸依啦，說我受了五戒啦，乃至於出家剃度啦，乃至於受了比丘、菩薩戒了！但是你到底是修些什麼呀？對不起，你還是含糊一片。假定說你剛才上面這個概念弄清楚的時候，你心念一動你就清楚了：欸，這又跟著老毛病，在染污當中；反過來，一對，你馬上曉得這一念對的，那個時候你就千真萬確地曉得的。如果說念佛，這一念必定念得去，如果說學定，這一念必定是跟它相應，這個主要的概念就在這個上頭。"]]},{"t":"58B 01:32","b":[["s","那麼輔助我們加深這種概念的策勵，就是剛才說的貪心增上，以及瞋心增上以及邪見增上的時候，那個士用果，就是那個增上果的狀態。這個等流心識完全是你內心的，你只要自己的心裡面一觀察就可以；而現在那個士用果是外在的，可是這個概念還是同樣地清楚哦！假定你不清楚的話，你一定對外面的東西不要說看不破、放不下，一定為它纏得死死的、纏得牢牢的。然後呢所有世間這個道理呀，千真萬確都從這個地方講起的，這樣。始終在這個地方纏，一點用場都沒有！所以你必定要了解，說原來這些東西，所以這個樣，都是什麼？邪見增上的結果，是明明這個是最惡劣的一個結果，我們偏偏把它看成好的。當你能夠有這個認識了以後，叫你放不下，可能嗎？你曉得得很清楚，那個是完全大騙子啊！害我們都從這個上面害起的。如果你不認識的話，雖然說要修行，叫你放，欸，覺得這個是好東西嘛，怎麼叫你放呀？你放不掉啊，這個修行就變成千辛萬苦，修行就變成千辛萬苦啊！"]]},{"t":"58B 03:03","b":[["s","所以說到這個地方，我就想起一個很有趣的一個公案。這個佛的大弟子當中有一個非常特殊的，也很了不起的一個人 ─周利槃陀伽，大家都曉得這個人。這個人為什麼這麼特別呢？因為他笨。他這個笨的情況簡直是，他哥哥要出家，他也要跟著他哥哥出家，不讓他出家，哭哭啼啼，因為他太笨嘛，實在笨得一塌糊塗。然後呢佛就看見了，說：「好好好！那你來出家吧！」那麼出了家了。出家了以後呢，那個時候已經有很多佛弟子就教他，跟了幾百個人哪，就教他一個偈子就記不住。教一個偈子，四句偈喔！就是得前忘後，實在沒有方法，最後就告訴他學「掃帚」兩個字。他就念掃帚，念了個掃，掃什麼？掃什麼？帚字忘記掉了。哦，掃帚，帚帚帚，帚了半天，帚什麼？掃字忘記掉了。那我們無法想像說天下居然有這麼笨的人！欸，就有這麼笨的人。後來他證羅漢果了，他證了羅漢果了。"]]},{"t":"58B 04:16","b":[["s","那麼當然這個裡邊還有很多很有趣的事情，可是真正最主要的這個裡邊什麼原因呢？那麼就問佛了。那麼佛就說呀，他說在很多無量無邊劫以前，那個時候有一個佛出世，那個時候佛出世的時候，有一個國王出了家，那麼出了家以後，後來呢王子也出家。那麼出了家以後就跟著去學，去學的其中，他先跟著那個和尚。那個和尚就告訴他很多方法，除了講那個所謂持戒什麼等等，當然講那個法理，那個佛法的法理主要的都是講空緣起，他對這個東西聽不進，他對這個就是聽不進。所以他就毀謗，心裡面就否定那個和尚所教的。可是那個阿闍黎告訴他的，他倒滿聽得進，就這樣。所以他這個人持戒的行相是持得非常好，但是對於這個佛法的真正深入的內涵就不相應，不相應而且還去毀謗。所以後來他死了以後就墮阿鼻地獄，哎呀，不曉得多苦。然後出來了以後餘報他一直笨，笨得一直多生多劫就是這樣，一直到現在，一直到現在他還是這麼個笨法。但是他畢竟還在出家當中有過這麼一段緣，所以後來證了果了，這是一個。"]]},{"t":"58B 05:58","b":[["s","另外有一個呢，他宿生當中又是，也在印度不曉得什麼地方，他是個大班智達。但是那個大班智達，他就是辯那些名相是很清楚，但是呢他本身是什麼？慢心、憍心很強，就怕人家勝過他，就怕人家勝過他。所以結果他講的是法，嘴巴講得相應，可是心裡邊卻不相應，心裡邊卻不相應。所以結果他死了以後就墮落，墮落了以後還是這樣笨，這麼的公案。"]]},{"t":"58B 06:37","b":[["s","這個說明了什麼？說明了就是真正重要的問題，我們必定要把握得住在哪裡。這個上面因為前面正講到，說是貪、瞋、癡增上的狀態，產生我們種種的顛倒的現象，而在這種情況之下，你所以能夠認得它 ─正、誤，靠什麼？靠正知見。所以正知見所見到的，就是我們自己的起心動念，這個叫作等流因果，修行就從這個地方開始。你有了這個念頭固然，你拜佛、念佛作任何事情，沒有一樣事情不是修行，就是你坐在這裡，就是你吃飯、你睡覺，沒有一個時、沒有一刻不是，這我們要很清楚、很明白的。那麼上面呢講白業，那個白業的果呢，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/004.mp3"},{"文":"果中有三，異熟者，謂由軟中上品善業，感生人中，欲界天中，上二界天。","口譯":"善業的果報有三種。異熟果（成熟時投生的果報），是小、中、大三種程度的善業，分別讓人投生到人道、欲界天、色界和無色界的天上。","四家合註":"<span>果中<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">分說為三；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">亦成勝果之理。初中<\/span><span>有三：異熟者，<\/span>謂由軟中上品善業，感生人中、欲界天中、上二界天。","合註白話":{"same":0},"覺燈日光":null,"時":"58B 07:44","頁":137,"af":"58b","st":464,"et":492,"消文":[{"文":"善業的輕重不同，果報也不同：最重大的感上二界，中等的欲界，最下品——軟品——感生人中。"}],"延伸":[],"逐字稿":[{"t":"58B 07:44","b":[["q","果中有三，異熟者，謂由軟中上品善業，感生人中，欲界天中，上二界天。"],["s","那麼由於你作的善業的重輕，然後分出來的果報也不同，最重大的善業感上二界，中等的是欲界，最下品的 軟品 感生人中。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/005.mp3"},{"文":"諸等流果，及增上果，«違於不善»，如理應知。","口譯":"至於等流果和增上果，與不善業的果相反，應當如理了知。","四家合註":"<span>諸等流果及增上果，<\/span>違於不善，如理應知。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">修習三乘功德，定須十善，故於總體道之所修中為切要者，<\/span>","合註白話":{"same":0},"覺燈日光":null,"時":"58B 08:12","頁":137,"af":"58b","st":492,"et":659,"消文":[{"文":"等流果跟增上果，跟上面相反；道理很容易，一說就過去了。"}],"延伸":[{"題":"違於不善","組":[{"題":"等流：當年的心理相又現起","說":[{"類":"立","文":"道理一說就過去，可是這個感受才是真正重要：等流果就是當年你心理上什麼樣的心理相，現在心裡又現起了。"},{"類":"例","文":"看見小蟲，很多人歡喜去把牠弄死，也有人歡喜保護牠、放走牠。"},{"類":"例","文":"師父在美國看見一家人，兒子從小給他吃葷就吐，長大看見小蟲一定去保護；母親不讓他到廟裡，怕他一去就做和尚——這就是等流因果。"}]},{"題":"莫用世俗道理愚癡自己","說":[{"類":"破","文":"念了很多書的人覺得很懂道理，錯了！那些道理都是世間、在輪迴當中的。"},{"類":"立","文":"真正的善惡簡別，要從這個地方去簡別。"}]},{"題":"耳目所對、起心動念無非在此","說":[{"類":"立","文":"等流果跟增上果兩點，對修行特別重要：耳目所對、起心動念無非在這裡面。"},{"類":"下手","文":"有了正確的認識，隨時遇見，能把惡業靜息、懺悔，把善業增長。"}]}],"說":[{"類":"立","文":"道理一說就過去，可是這個感受才是真正重要：等流果就是當年你心理上什麼樣的心理相，現在心裡又現起了。"},{"類":"例","文":"看見小蟲，很多人歡喜去把牠弄死，也有人歡喜保護牠、放走牠。"},{"類":"例","文":"師父在美國看見一家人，兒子從小給他吃葷就吐，長大看見小蟲一定去保護；母親不讓他到廟裡，怕他一去就做和尚——這就是等流因果。"},{"類":"破","文":"念了很多書的人覺得很懂道理，錯了！那些道理都是世間、在輪迴當中的。"},{"類":"立","文":"真正的善惡簡別，要從這個地方去簡別。"},{"類":"立","文":"等流果跟增上果兩點，對修行特別重要：耳目所對、起心動念無非在這裡面。"},{"類":"下手","文":"有了正確的認識，隨時遇見，能把惡業靜息、懺悔，把善業增長。"}],"af":"58b","st":492}],"逐字稿":[{"t":"58B 08:12","b":[["q","諸等流果，及增上果，違於不善，如理應知。"],["s","等流果跟增上果，跟上面相反，這個我們應該了解。這個道理很容易，一說就過去了，可是這個感受，在這個地方，我們提一下，這個才是真正重要的，才是真正重要的。譬如說我們講等流果，就是說當年你心理上面是怎麼樣的心理相，現在心裡又現起了。有很多人看見個小蟲，他就歡喜摸牠，把牠弄死；有很多人看見那個小蟲，他就歡喜牠，會去保護牠，他要放走牠。有很多人，大部分的人都是把牠弄死的多，但是確確實實有這種人。"]]},{"t":"58B 09:01","b":[["s","不但在國內，我在美國那時候看見有一個，哦，他家裡非常好，他母親是非常信佛，然後談起來說他的兒子如何如何好，但是從來不讓他兒子到廟裡來，我說奇怪了，為什麼不讓他到廟裡來呀？後來一聽曉得了，如果讓那個兒子一到廟裡，這個兒子準做和尚。這個母親那當然，她雖然信佛，要他做和尚也不願意。問她為什麼？他從小就是給他葷的東西吃，吃進去他又會吐出來，然後長大了以後叫他吃，他就不願意吃。然後長大了看見一點點小蟲，他就看見那個小蟲他一定要去保護牠，就這樣。你想像得到嗎？這是什麼？喏，很簡單，等流因果！"]]},{"t":"58B 09:51","b":[["s","所以碰見這種情況之下，我們不懂得也就罷了，我們懂得了，千萬自己不要陷在為世俗的這種道理來愚癡自己呀！我們總覺得，哎唷，好像 ……尤其是念了很多書的人，覺得很懂道理，錯了！你這個道理都是世間，在輪迴當中的。這個地方我們真正地善惡簡別，要從這個地方去簡別，要從這個地方簡別。所以特別地說，這一個等流果跟那個增上果這兩點，對我們的修行當中是特別重要、特別重要，特別重要！因為我們耳目所對、起心動念無非在這個裡邊，你有了正確的認識，你隨時所遇見這種情況之下的話，那個時候，你能夠把惡業，把它靜息、懺悔，善業把它增長，這個概念我們應該了解。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/006.mp3"},{"文":"《十地經》說，以此十種，怖畏生死，離諸悲心，由隨順他言教修習，辦聲聞果。","口譯":"《十地經》說：修這十種善業，如果是因為害怕生死、沒有悲心，而照著別人的教導去修，就成就聲聞的果位。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、成就殊勝者：<\/span>《十地經》說：以此十種怖畏生死，離諸<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">大<\/span>悲心，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">於最後有，<\/span>由隨順他<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">說法<\/span>言教修習<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">證無我相<\/span>，辦聲聞果。又","合註白話":{"same":0},"覺燈日光":null,"時":"58B 10:59","頁":137,"af":"58b","st":659,"et":716,"消文":[{"文":"前面的十惡十善是人天的果報，經上更深一層：對生死的真相認識得更正確，不管多好多壞都在輪迴中，生天一樣可怕，一心想跳出來。"},{"文":"可是只想到自己，沒有引發悲心；「隨順他言教」——聽了佛陀與諸佛菩薩的教化努力修行，這是聲聞果。"}],"延伸":[],"逐字稿":[{"t":"58B 10:59","b":[["q","《十地經》說，以此十種，怖畏生死，離諸悲心，由隨順他言教修習，辦聲聞果。"],["s","那麼，前面講的這個十惡十善這是人天的果報，經上面更深一層。由於你對於生死的真相認識得更正確，說不管多好、多壞都在生死輪迴當中，生了天一樣地可怕，然後呢你就覺得一心想跳出來。可是你只想到自己，而沒有引發那個悲心，這是第一種情況。然後呢「隨順他言教」，已經聽了佛陀以及諸佛菩薩的教化，努力去修行，這個 ─「聲聞果」。進一步，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/007.mp3"},{"文":"又諸無悲，不依止他，欲自覺悟，善修緣起，辦獨勝果。","口譯":"如果沒有悲心、不靠別人、想自己開悟，好好地觀修緣起，就成就獨覺的果位。","四家合註":"<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">依十種，<\/span>諸無<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">大<\/span>悲，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">於最後有，〔<\/span>不依止他，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂不觀待於說法。〕<\/span>欲自覺悟<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">證得獨覺菩提<\/span>，解了緣起而作修治，辦獨勝果。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此復於彼十種之上，<\/span>若<span>（二）<\/span>","合註白話":{"same":0},"覺燈日光":null,"時":"58B 11:56","頁":137,"af":"58b","st":716,"et":750,"消文":[{"文":"這是緣覺果：條件一樣，也覺得世間苦，急求自己解決而沒有悲心，但並沒有聽人家講，靠自己的智慧辨別。"}],"延伸":[],"逐字稿":[{"t":"58B 11:56","b":[["q","又諸無悲，不依止他，欲自覺悟，善修緣起，辦獨勝果。"],["s","這個就是緣覺果，條件是一樣的，他也覺得世間的苦，但是呢並沒有聽人家講。雖然同樣地感到世間苦，同樣地求自己，急求自己解決而沒有悲心，那麼那個時候，他能夠靠他自己的智慧辨別，這個叫緣覺。三，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/008.mp3"},{"文":"若心廣大，«具足悲心»，善權方便，廣發宏願，終不棄捨一切有情，於極廣大諸佛智慧，緣慮修習，成辦菩薩一切諸地波羅蜜多。由善修習此一切種，則能成辦一切佛法。","口譯":"如果心胸廣大、有悲心、善用方法、發廣大的願、永遠不放棄任何眾生，一心嚮往、修學諸佛極其廣大的智慧，就能成就菩薩的各個階位和各種波羅蜜。把這一切都修好，就能成就一切佛的功德。","四家合註":"心廣大，<span>（一）<\/span>具足<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">大<\/span>悲心，善權方便，廣發宏願，終不棄捨一切有情，於<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如是<\/span><span>（四）<\/span>極廣大諸佛智慧<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">圓滿菩提<\/span>，<span>（三）<\/span>緣慮修習，<span>（五）<\/span>成辦菩薩一切諸地波羅蜜多。由<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">究竟<\/span>善修習此一切種，則能成辦一切佛法。","合註白話":{"same":0},"覺燈日光":null,"時":"58B 12:30","頁":137,"af":"58b","st":750,"et":962,"消文":[{"文":"「廣大」有個內涵：不是今天也想救人就叫廣大。"}],"延伸":[{"題":"具足悲心","組":[{"題":"普緣一切有情才是大悲","說":[{"類":"立","文":"真正大悲的行相：普緣盡法界、虛空界一切有情，上至無色界諸天，下至阿鼻地獄；最親近的、最厭惡的，沒有一個例外。"},{"類":"破","文":"不了解這個行相，往往引起大小乘的諍辯：說小乘沒悲心——當然有，他們也修四無量心。"}]},{"題":"我們的悲心還不如二乘","說":[{"類":"立","文":"說起來我們的悲心還沒有他大：樣樣只管自己，叫代別人考慮都不願意，稍微損失一點就噘嘴，總覺得別人不對。"},{"類":"立","文":"二乘的悲心還不算大悲；大悲真正的行相在後頭，了解了才分得出大乘跟二乘的差別。"}]},{"題":"眼前下手：處處代別人想","說":[{"類":"因","文":"悲心廣大要廣利一切有情，就要懂得怎麼幫別人，所以要種種方便、廣發宏願、不捨一切有情。"},{"類":"下手","文":"一下做不到，宿生善業感到這裡；眼前做得到的，是處處地方都能代別人想一想，這一點特別重要。"}]},{"題":"小事都不肯，灌大頂也無用","說":[{"類":"破","文":"在這裡學大乘，一點小事要利益旁邊一點點人，誰都不願意，找種種藉口——實在非常差。"},{"類":"立","文":"說大乘、說密乘，灌了什麼大頂，一點用場都沒有；要從小地方慢慢培養，增長這個心。"},{"類":"下手","文":"不但認識意義，還要認識它所指的心理狀態，把這一個改變過來——那時候對了、修行了，好處是自己的。"}]}],"說":[{"類":"立","文":"真正大悲的行相：普緣盡法界、虛空界一切有情，上至無色界諸天，下至阿鼻地獄；最親近的、最厭惡的，沒有一個例外。"},{"類":"破","文":"不了解這個行相，往往引起大小乘的諍辯：說小乘沒悲心——當然有，他們也修四無量心。"},{"類":"立","文":"說起來我們的悲心還沒有他大：樣樣只管自己，叫代別人考慮都不願意，稍微損失一點就噘嘴，總覺得別人不對。"},{"類":"立","文":"二乘的悲心還不算大悲；大悲真正的行相在後頭，了解了才分得出大乘跟二乘的差別。"},{"類":"因","文":"悲心廣大要廣利一切有情，就要懂得怎麼幫別人，所以要種種方便、廣發宏願、不捨一切有情。"},{"類":"下手","文":"一下做不到，宿生善業感到這裡；眼前做得到的，是處處地方都能代別人想一想，這一點特別重要。"},{"類":"破","文":"在這裡學大乘，一點小事要利益旁邊一點點人，誰都不願意，找種種藉口——實在非常差。"},{"類":"立","文":"說大乘、說密乘，灌了什麼大頂，一點用場都沒有；要從小地方慢慢培養，增長這個心。"},{"類":"下手","文":"不但認識意義，還要認識它所指的心理狀態，把這一個改變過來——那時候對了、修行了，好處是自己的。"}],"af":"58b","st":750}],"逐字稿":[{"t":"58B 12:30","b":[["q","若心廣大，具足悲心，善權方便，廣發宏願，終不棄捨一切有情，於極廣大諸佛智慧，緣慮修習，成辦菩薩一切諸地波羅蜜多。由善修習此一切種，則能成辦一切佛法。"],["s","如果你心裡面廣大、具足悲心。這個「廣大」有個內涵，不是說，啊，我今天我也想救人，這個不叫廣大，這個不叫廣大。他這個真正的大悲的行相是什麼？普緣盡法界、虛空界一切有情，上至無色界諸天，下至阿鼻地獄，一切有情；你最親近的人，你最厭惡的人，沒有一個例外，這樣的才是悲心。所以現在有很多人不了解這個行相，往往引起那個大小乘的諍辯，說他們小乘哪裡沒悲心。有，怎麼會沒有，當然有嘛！他們也有修四無量心。說起來我們這個悲心還沒有他大咧！我們還樣樣地只管自己，叫代別人考慮考慮都不願意，稍微自己損失一點，自己就噘了個嘴巴，總覺得別人不對，這樣。實際上呢的的確確遠不如他們，但是他們這個算是大悲心嗎？不是，這個我們要了解的。關於大悲的真正的行相在後頭，我們了解了這一點，那麼才能夠分別得出來，這個大乘跟二乘之間的差別。"]]},{"t":"58B 14:18","b":[["s","那麼因為他的悲心廣大，他要廣利一切有情；要廣利一切有情，你必定要曉得怎麼樣幫別人的忙，這樣。所以要懂得種種的方便，還要「廣發宏願，不捨棄一切有情」，這樣的話，修，那個才是！所以現在呢本論是引導我們走這個路，一下我們是做不到的，但是我們也有幸宿生的善業感到這裡。眼前我們做得到的是什麼呢？處處地方都能夠代別人想一想，這一點哪特別重要，這一點特別重要！"]]},{"t":"58B 14:56","b":[["s","說到這裡有一點事情我覺得非常感慨！儘管我們在這裡大家學那個大乘的，可是一點小小的事情，要利益旁邊的一點點人哪，哎呀，大家都誰都不願意，找了種種的藉口，找了種種的藉口。這個事情實在是非常差，非常差！我們必定要從小地方慢慢地去培養，然後呢增長這個心，你才有機會慢慢、慢慢地說。說起來大乘，乃至於說密乘，喔唷，灌了什麼的個大的頂，一點用場都沒有，一點用場都沒有！這個是我們要正確地了解的。總之，對這個真實的內涵，不但要把意義認識，而且它意義所指的真正的心理狀態你認識了，把這一個改變過來。那個時候，對了、修行了！結果好處是你自己的呀，這個我們應該要了解它。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/009.mp3"},{"文":"如是二聚十種業道，及彼諸果，凡餘教典，未明說者，一切皆是如〈本地分〉，〈攝決擇分〉意趣而說。","口譯":"像這樣善惡兩類的十種業和它們的果報，凡是其他經論沒有明白講的，都是依照〈本地分〉、〈攝決擇分〉的意思來說的。","四家合註":"如是二聚十種業道，及彼諸果，凡餘教典未明說者，一切皆是如《本地分》、《攝決擇分》意趣而說。","合註白話":{"same":0},"覺燈日光":null,"時":"58B 16:02","頁":137,"af":"58b","st":962,"et":1027,"消文":[{"文":"兩聚就是黑的十種、白的十種；業以及果，別處沒說清楚的，《瑜伽師地論》〈本地分〉〈攝決擇分〉說得非常清楚。"},{"文":"主要、基本的意理已經有了；再把共中士的十二緣起了解，就不會錯到哪裡去。"}],"延伸":[],"逐字稿":[{"t":"58B 16:02","b":[["q","如是二聚十種業道，及彼諸果，凡餘教典，未明說者，一切皆是如〈本地分〉，〈攝決擇分〉意趣而說。"],["s","現在上面所說的兩聚、十種業道，一個就是黑的十種，一個就是善的、白的，兩聚。業以及果，凡是別的地方沒有說清楚的，那麼在《瑜伽師地論》〈本地分〉跟〈攝決擇分〉當中說得非常清楚、非常明白，這個我們要了解。儘管如此，上面我們說的，主要的、基本的意理已經有了，基本的意理已經有了。再下面，如果我們把共中士當中，十二緣起能夠了解的話，大概就不會錯到哪裡去了，主要的基本概念都能夠把握得住了。現在我們繼續下去。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/010.mp3"},{"文":"第三顯示業餘差別中，引滿差別者。","口譯":"第三，說明業的其餘差別，其中先說引業與滿業的差別。","四家合註":"<span>第三、顯示業餘差別中，<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">分三：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">引滿；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">定不定；<\/span><span class=\"sjan sj-miao\">三、<\/span><span class=\"sjan sj-miao\">先熟何果。初中分四：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">善不善二引滿業之差別；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">四句計法；<\/span><span class=\"sjan sj-miao\">三、<\/span><span class=\"sjan sj-miao\">引滿之理；<\/span><span class=\"sjan sj-miao\">四、<\/span><span class=\"sjan sj-miao\">解說能引幾生。今初、<\/span><span>引滿差別者：<\/span>","合註白話":{"same":0},"覺燈日光":null,"時":"58B 17:07","頁":137,"af":"58b","st":1027,"et":1058,"消文":[{"文":"除了上面說的，其他相關的業的道理：業的分類很多，這裡只說跟修行最有關係的幾點。"},{"文":"這種業的分類，有一種叫引業，一種叫滿業。"}],"延伸":[],"逐字稿":[{"t":"58B 17:07","b":[["q","第三顯示業餘差別中，"],["s","那麼除了上面說的這個以外，其他的業的相關的一些道理，主要的在這裡說一說。普通講業的話，可以用各種不同的分類，不曉得說多少種，那麼在這個地方最主要的，重要的幾點，跟我們修行最有關係的。"]]},{"t":"58B 17:31","b":[["q","引滿差別者。"],["s","這種業的分類，有一種叫引業，一種叫滿業。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/011.mp3"},{"文":"引樂趣業是諸善法，引惡趣業是諸不善。","口譯":"牽引往生樂趣的業是各種善法，牽引往生惡趣的業是各種不善。","四家合註":"引樂趣業是諸善法，引惡趣業是諸不善。","合註白話":{"same":0},"覺燈日光":null,"時":"58B 17:38","頁":137,"af":"58b","st":1058,"et":1086,"消文":[{"文":"引業：能夠引導你下一生到哪裡去的業。善業引到善趣、樂趣——人天當中；惡業引到三惡道當中。"}],"延伸":[],"逐字稿":[{"t":"58B 17:38","b":[["q","引樂趣業是諸善法，引惡趣業是諸不善。"],["s","什麼叫引業呢？就是這個業能夠引導你下一生到哪裡去的，這個業叫引業。善業呢，引導你到善趣去、樂趣去，說人天當中；惡業呢，引導你到不善、三惡道當中去，這個叫引業。滿業，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/012.mp3"},{"文":"諸能滿者，則無決定。","口譯":"至於能圓滿的業（滿業），則沒有一定。","四家合註":"諸能滿者，則無決定，","合註白話":{"same":0},"覺燈日光":null,"時":"58B 18:06","頁":137,"af":"58b","st":1086,"et":1095,"消文":[{"文":"滿業就沒有一定的，下面說這個道理。"}],"延伸":[],"逐字稿":[{"t":"58B 18:06","b":[["q","諸能滿者，則無決定。"],["s","滿業就沒有一定的，那麼下面說這個道理。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/013.mp3"},{"文":"於樂趣中，亦有斷支，關節殘根，顏貌醜陋，短壽多疾，匱乏財等，«是不善作»。","口譯":"在樂趣之中，也有肢體斷缺、關節殘疾、根不具足、容貌醜陋、短命多病、缺乏財物等等，這些是不善業所造成的。","四家合註":"於樂趣中，亦有斷支關節、殘根、顏貌醜陋、短壽、多疾、匱乏財等，是不善作；","合註白話":{"same":0},"覺燈日光":null,"時":"58B 18:15","頁":137,"af":"58b","st":1095,"et":1323,"消文":[{"文":"引業引的是樂趣，在樂趣當中卻斷手、瞎眼、醜陋、短命、又窮——因為他造的不善業是滿業：引業善，滿業不善。"},{"類":"回扣","文":"前面說過根本因跟圓滿因：根本因就是引，圓滿因就是到了那裡是否圓滿。"},{"文":"引業善、又以善業圓滿，不但生在善道，而且樣樣圓滿；引業善、滿業惡，到了善道，一生充滿惡的、痛苦的。"}],"延伸":[{"題":"是不善作","組":[{"題":"引善滿惡：修行而不肯捨","說":[{"類":"例","文":"很努力修行，正知見也把握得住，平常要他捨一點東西幫忙別人卻不願意，只管自己。"},{"類":"立","文":"到那時候還是修行，可是得不到人家幫助：要飯肚子餓，找人幫忙遭白眼。分辨得越清楚，越能助我們行持。"}]},{"題":"想修提不起，關鍵在此","說":[{"類":"破","文":"很多人說：我不管它，只要念佛。真能放下一心提得起，好；可是做不到——想修提不起，想不修又捨不得。"},{"類":"立","文":"怎麼修法？關鍵都在這裡；這種例子了解得越透徹，心裡行相非常清楚，自然一步一步走上去。"}]},{"題":"知見越正，非修行不可","說":[{"類":"立","文":"了解透徹到某個程度，會發現非修行不可：不修行是想討便宜，可是所有便宜只有修行來。"},{"類":"立","文":"知見越正確，修行越容易；得到完整的正知見，叫你不修行絕對辦不到。"}]}],"說":[{"類":"例","文":"很努力修行，正知見也把握得住，平常要他捨一點東西幫忙別人卻不願意，只管自己。"},{"類":"立","文":"到那時候還是修行，可是得不到人家幫助：要飯肚子餓，找人幫忙遭白眼。分辨得越清楚，越能助我們行持。"},{"類":"破","文":"很多人說：我不管它，只要念佛。真能放下一心提得起，好；可是做不到——想修提不起，想不修又捨不得。"},{"類":"立","文":"怎麼修法？關鍵都在這裡；這種例子了解得越透徹，心裡行相非常清楚，自然一步一步走上去。"},{"類":"立","文":"了解透徹到某個程度，會發現非修行不可：不修行是想討便宜，可是所有便宜只有修行來。"},{"類":"立","文":"知見越正確，修行越容易；得到完整的正知見，叫你不修行絕對辦不到。"}],"af":"58b","st":1191}],"逐字稿":[{"t":"58B 18:15","b":[["q","於樂趣中，亦有斷支，關節殘根，顏貌醜陋，短壽多疾，匱乏財等，是不善作。"],["s","說樂趣當中，他的引業是引的樂趣，但是在樂趣當中，對不起，他又斷手、瞎眼，長得又醜陋，壽又短命，又窮，這個都是非常糟糕的。這是為什麼？因為他造的不善業，這個不善業是什麼？滿業。所以他引業是善的，是滿業卻不善。前面我們曾經說過根本因跟圓滿因，大家還記得吧？根本因就是引，圓滿因就是說你到了這個地方是否圓滿。假定說你的引業是根本因是善業，然後所以引導你到了善道當中去，然後呢你也以善業來圓滿，那麼你不但生在善道，而且你這個善道當中是樣樣圓滿。反過來，雖然你引業根本是善的，但是呢你這個圓滿業是惡的，結果你到了善道啊，你這個一生當中充滿著惡的、痛苦的。這引、滿二業的不同，引、滿二業的不同。"]]},{"t":"58B 19:51","b":[["s","譬如說我們現在我們要修行，哎呀，你很努力地修行。你修行是修行，可是平常這正知見把握得住，把握得很好，平常要向他捨一點東西幫忙別人他可不願意，只管自己的。對，到那個時候你還是修行，修行是修行，可是你得不到人家幫助。要飯哪，他就肚子餓；你跑得去找人家幫忙，遭人家白眼，諸如此類的事情，諸如此類的事情，這個我們隨舉一例。你分辨得越清楚，那麼將來助我們行持當中越好。"]]},{"t":"58B 20:27","b":[["s","當然現在有很多人哪，唉呀，我反正不管它呀，我只要念佛。是，你假定真的什麼都放下來，一心一意，的的確確能夠提起來，好啊！到了極樂世界阿彌陀佛自然告訴你。然後我一心一意學定，什麼都不管，好啊！你得了定以後，生了天；可是生了天也不一定保險哦！可是你現在做得到嗎？對不起，做不到。你想修啊，提不起；想不修啊，又捨不得，那怎麼辦呢？毛病就在這裡。現在有太多人，哎呀，要想修行的，怎麼修法？喏，這個關鍵都在這裡，大家清楚不清楚？所以凡是這種例，你了解得越透徹，到那時候你心裡面行相非常清楚，那自然而然一步一步走上去。"]]},{"t":"58B 21:15","b":[["s","不但如此，而且當你了解得透徹到某一個程度，你會發現非修行不可。這個話怎麼講？你為什麼不修行啊？要想討一點便宜！結果你發現所有的便宜哪裡來的？只有修行來呀！所以你知見越正確，那個時候修行是越容易，越容易。假定你得到完整的這個正知見的話，叫你不修行，是絕對辦不到，這麼個好法，這麼個好法！所以現在我們這裡主要的都是講這些道理，繼續下去。那麼上面說，這個是善引是惡滿，現在呢，說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/014.mp3"},{"文":"於諸旁生及餓鬼中，亦有富樂極圓滿者，是善所作。","口譯":"在旁生和餓鬼之中，也有富足安樂極為圓滿的，這是善業所造成的。","四家合註":"於諸旁生及餓鬼中，亦有富樂極圓滿者，是善所作。","合註白話":{"same":0},"覺燈日光":null,"時":"58B 22:03","頁":137,"af":"58b","st":1323,"et":1348,"消文":[{"文":"這是惡引善滿：引業是惡的，所以掉到旁生、餓鬼當中；但是滿業不錯，所以也有富樂，很圓滿。"}],"延伸":[],"逐字稿":[{"t":"58B 22:03","b":[["q","於諸旁生及餓鬼中，亦有富樂極圓滿者，是善所作。"],["s","這個是惡引是善滿，引業是惡的，因為引業是惡的，所以掉到旁生、餓鬼當中。嘿，但是啊，他的滿業可是不錯喲，所以他也有富樂，很圓滿 ─善所作。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/015.mp3"},{"文":"由如是故，«共成四句»，","口譯":"因為這樣，總共可以排出四種組合，","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二者：<\/span>由如是故，共成四句。","合註白話":{"same":0},"覺燈日光":null,"時":"58B 22:28","頁":137,"af":"58b","st":1348,"et":1698,"消文":[{"文":"引業善，滿業有善、不善；引業惡，滿業也有善、不善——共有四種，要了解。"}],"延伸":[{"題":"共成四句","組":[{"題":"亭湖神：修福無慧，惡引善滿","說":[{"類":"例","文":"最早譯經的朱士行大師，到了亭湖；湖神非常靈異，祈禱時兩船對開，各有順風，香火極盛。"},{"類":"例","文":"湖神託夢請大師超渡，交出供養的財物；超渡後發現一條死去的大蟒蛇，幾個山頭那麼大。"},{"類":"因","文":"宿生兩人一起修行：大師福慧並行；那人修了福，卻沒有慧——沒有正知見，引業可怕墮旁生，滿業做了很多，得到大福報。"},{"類":"立","文":"不是說布施行善就好，到那時候你會象身掛瓔珞。"}]},{"題":"西方的狗，象身掛瓔珞","說":[{"類":"例","文":"西方人的狗，主人天天洗澡、做衣服、坐汽車，超市一整排專賣寵物罐頭，比人吃的還貴；剩飯給牠，牠看一下不吃。"},{"類":"因","文":"這就是宿生沒有正知見的修行人：引業惡、滿業善；反過來，引業善、滿業惡。"}]},{"題":"正知見最重要，福慧並行","說":[{"類":"下手","文":"不要說我們在修行，一定要檢查檢查：正知見最重要、最重要、最重要。"},{"類":"破","文":"得到了正知見，也不要說只要修行，供養什麼都不管——那時成就羅漢果，說起來可憐得很。"},{"類":"回扣","文":"這就是為什麼這裡要告訴我們引、滿二業。"}]}],"說":[{"類":"例","文":"最早譯經的朱士行大師，到了亭湖；湖神非常靈異，祈禱時兩船對開，各有順風，香火極盛。"},{"類":"例","文":"湖神託夢請大師超渡，交出供養的財物；超渡後發現一條死去的大蟒蛇，幾個山頭那麼大。"},{"類":"因","文":"宿生兩人一起修行：大師福慧並行；那人修了福，卻沒有慧——沒有正知見，引業可怕墮旁生，滿業做了很多，得到大福報。"},{"類":"立","文":"不是說布施行善就好，到那時候你會象身掛瓔珞。"},{"類":"例","文":"西方人的狗，主人天天洗澡、做衣服、坐汽車，超市一整排專賣寵物罐頭，比人吃的還貴；剩飯給牠，牠看一下不吃。"},{"類":"因","文":"這就是宿生沒有正知見的修行人：引業惡、滿業善；反過來，引業善、滿業惡。"},{"類":"下手","文":"不要說我們在修行，一定要檢查檢查：正知見最重要、最重要、最重要。"},{"類":"破","文":"得到了正知見，也不要說只要修行，供養什麼都不管——那時成就羅漢果，說起來可憐得很。"},{"類":"回扣","文":"這就是為什麼這裡要告訴我們引、滿二業。"}],"af":"58b","st":1371}],"逐字稿":[{"t":"58B 22:28","b":[["q","由如是故，共成四句，"],["s","因為這樣的關係成四句，就是引業善，然後呢滿業善跟不善；還有呢，引業惡，是滿業是善跟不善，有這麼樣的四種，這個是我們要了解的，這是我們要了解的。"]]},{"t":"58B 22:51","b":[["s","記得這個故事嗎？到我們中國來最早期的譯經大師 ─朱士行，他是一個修行人，結果到中國來，這亭湖神，這個公案你們知道不知道？他是西域的人，他宿生是個修行人，然後呢他結果最早把佛法傳到中國來，而且翻譯了很多最早期的經典，這個人非常精采的，翻譯的經也非常好。那麼那個時候，中國有一個地方叫"]]},{"t":"58B 23:27","b":[["s","亭湖，那個湖邊上有一個湖神，那個神非常靈異喔！你只要祈禱的話，只要祈禱的話，他一定有感應。感應到什麼程度？譬如說你祈禱他，他一定幫你一陣風。結果呢一個船向那邊開，一個船向那邊開，對開，照理說，有了東風就沒有西風，有了西風就沒有東風。欸，妙咧！他你只要去祈禱的話，向東開的有西風幫助，向西方開的有東風幫助，兩個船互不影響，這麼個神奇法！喔唷，所以這個廟裡的香火是非常盛、非常盛！"]]},{"t":"58B 24:12","b":[["s","結果那個朱士行大師來的時候，那一天晚上，那個廟祝就夢見那個廟神就告訴他，說明天來這兒有一位高僧，你請求他超渡，我這個地方有很多人家供養我的財物，你就交給他，讓他超渡我。那麼這個廟祝醒過來了以後，第二天盼望，說照著那個廟神所指示的，果然來個船，一看，有一個和尚。那麼就請那個和尚上來，告訴他。告訴他了以後呢，那個朱士行大師就超渡，那個大師是已經有成就的喲，他的本地風光我們不知道，我們不知道，但是的確有成就的。因為他 ……我想你們在座的已經聽說過他的故事，等一下我還會再多說一點，說明這個人的成就，那麼現在我們繼續這個故事。"]]},{"t":"58B 25:12","b":[["s","於是他就超渡，超渡完了以後他就說了，那過兩天你們會發現這個裡邊有條大蟒蛇，那個大蟒蛇是什麼呢？就是那個亭湖廟的神，牠因為經過超渡了以後，得脫惡趣。果然沒有錯，朱士行大師走了以後就發現一條大蟒蛇，幾個山頭，哇，不得了！我們不要說那個大山，要我們那個後山，一個山頭，要多少長，不得了地大，死在那個地方。那麼什麼原因呢？他是宿生他們兩個一起修行，都是修行人，都是修行人。結果呢，朱士行大師是福慧並行，那個人他福是修了，這慧可沒有，慧可沒有。於是他的引業是造惡業，慧就是正知見，沒有正知見，所以結果引業很可怕，掉了，墮落旁生當中；但是滿業，他也做了很多喔，於是得到這麼大的福報。所以不是我們現在說，哎呀，你布施、你行善哪！欸，到那個時候你會象身掛瓔珞。"]]},{"t":"58B 26:33","b":[["s","我現在尤其是在西方，你常常看見宿生那種好好 ……這個沒有正知見的修行人。什麼人哪？狗。你去看好了，啊呀！那個西方人的狗，那個主人天天給牠洗澡，然後呢還要做了衣服給牠穿，這個出去的時候，一定捧在那個汽車裡邊，那個超級市場裡邊一定有一行，是專門賣這個寵愛動物的食品罐頭的。現在當然我們台幣升值了，以前買起來這比我們人吃的還要貴。像我們現在隨便給牠吃一點，那牠絕對不要吃。我剛去的時候不知道，有一次剩下來一點點飯給牠吃，牠跑得去看了一下，不吃，這樣啊！這個典型的例子。如果拿這個東西跑到印度去的話，哇，那個乞丐搶來打架，那是豐富得不得了。這是什麼？前者就是引業是惡的，滿業是善的；後者引業是善的，滿業是惡的，這一點我們現在辨別得清楚。"]]},{"t":"58B 27:43","b":[["s","所以不要說我們現在在修行喔，你一定要檢查檢查，正知見這個是最重要，最重要、最重要的這一點！反過來說，雖然你得到了正知見了，你不要說，哎，我只要修行就算了，其他的供養什麼等等都不要管了。那個時候就算你成就，你成就個羅漢果，倒也說起來可憐得很哪！這個概念，是為什麼這個地方要告訴我們引、滿二業，引、滿二業。下面繼續："]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/016.mp3"},{"文":"謂於能引善所引中，有由能滿善所圓滿及由不善圓滿二類。於諸能引不善引中，有由能滿不善圓滿及由善法圓滿二類。","口譯":"就是：由善業決定投生的那一生裡，有的是靠善業讓生活圓滿，有的是靠惡業讓生活圓滿；由惡業決定投生的那一生裡，有的是靠惡業讓生活圓滿，有的是靠善業讓生活圓滿。","四家合註":"謂於能引善所引中，有由能滿善所圓滿及由不善圓滿二類；於諸能引不善引中，有由能滿不善圓滿及由善法圓滿二類。","合註白話":{"same":0},"覺燈日光":null,"時":"58B 28:18","頁":137,"af":"58b","st":1698,"et":1723,"消文":[{"文":"就是分成四句，容易了解。"}],"延伸":[],"逐字稿":[{"t":"58B 28:18","b":[["q","謂於能引善所引中，有由能滿善所圓滿及由不善圓滿二類。於諸能引不善引中，有由能滿不善圓滿及由善法圓滿二類。"],["s","就是分成四句，這個我們容易了解的。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/017.mp3"},{"文":"《集論》云：「應知善不善業，是能牽引及能圓滿，於善惡趣受生之業，能牽引者謂能引異熟，能圓滿者謂既生已，能令領納愛與非愛。」","口譯":"《集論》說：「應當知道，善業與不善業都有能牽引的、能圓滿的。在善趣、惡趣受生的業之中，能牽引的是指能牽引異熟；能圓滿的是指生到那裡以後，能讓人領受可愛與不可愛的果。」","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第三、引滿之理：<\/span>《集論》云：「應知善不善業，是能牽引及能圓滿於<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">前者感<\/span>善<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">後者感<\/span>惡趣受生之業。能牽引者，謂能引<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">所引彼趣<\/span>異熟<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">蘊之業<\/span>；能圓滿者，謂既生<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">彼趣<\/span>已，能令<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">其依身<\/span>領納愛與非愛<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">之業<\/span>。」","合註白話":{"same":0},"覺燈日光":null,"時":"58B 28:43","頁":137,"af":"58b","st":1723,"et":null,"消文":[{"文":"善業不善業分兩類：引業的善跟不善，滿業的善跟不善。"},{"文":"引業是引你的異熟果的；滿業是引生到這一界以後，得到可愛或不可愛的——善業得可愛，否則不可愛。"}],"延伸":[],"逐字稿":[{"t":"58B 28:43","b":[["q","《集論》云：「應知善不善業，是能牽引及能圓滿，"],["s","這個裡邊善業跟不善業分成兩類：一個是引業的善跟不善，一個是滿業的善跟不善。"]]},{"t":"58B 28:56","b":[["q","於善惡趣受生之業，能牽引者謂能引異熟，"],["s","喏，就是，這個引業是引你的異熟果的。"]]},{"t":"58B 29:08","b":[["q","能圓滿者謂既生已，能令領納愛與非愛。」"],["s","解釋得更清楚。"]]},{"t":"59A 00:06","b":[["s","滿業，就是等到你引生到這一界以後，你得到的可愛的或者是不可愛的；善業得到的是可愛，否則得到不可愛。然後呢，這個引滿當中，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/018.mp3"},{"文":"《俱舍論》云：「由一引一生，能滿則眾多。」謂由一業能引一生，非能引多，亦非眾多共引一生。諸能滿中，則有眾多。","口譯":"《俱舍論》說：「由一個業牽引一生，能圓滿的業則有許多。」意思是：一個業能牽引一生，不能牽引多生，也不是許多業共同牽引一生；在能圓滿的業中，則有許多。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第四分為二宗：第一、《俱舍》宗一業唯引一生說者：<\/span>《俱舍論》云：「由一<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">業唯<\/span>引一生，能滿則眾多。」謂由一業能引一生，非能引多，亦非眾多<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">業<\/span>共引一生<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">身<\/span>。諸能滿中，則有眾多。","合註白話":{"same":0},"覺燈日光":null,"時":"59A 00:21","頁":137,"af":"59a","st":21,"et":45,"消文":[{"文":"一個引業能引一生，滿業由很多來圓滿一生。"}],"延伸":[],"逐字稿":[{"t":"59A 00:21","b":[["q","《俱舍論》云：「由一引一生，能滿則眾多。」"],["s","所以由一個引業能夠引一生，滿業就是由很多來圓滿一生。"]]},{"t":"59A 00:33","b":[["q","謂由一業能引一生，非能引多，亦非眾多共引一生。諸能滿中，則有眾多。"],["s","另外一個，另外一個怎麼說呢？不是這樣的，有的是一個引一生，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/019.mp3"},{"文":"《集論》則說，頗有諸業，唯由一業牽引一生。又有諸業，唯由一業牽引多生。頗有諸業，由眾多業牽引一生。亦有諸業，由眾多業牽引多生。","口譯":"《集論》又說：有的是一個業決定一生；有的是一個業決定很多生；有的是很多個業決定一生；也有的是很多個業決定很多生。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、《集論》宗一能引多說者：<\/span>《集論》則說：「頗有諸業，唯由一業牽引一身；又有諸業，唯由一業牽引多身；頗有諸業，由眾多業牽引一身；亦有諸業，由眾多業牽引多身。」","合註白話":{"same":0},"覺燈日光":null,"時":"59A 00:45","頁":138,"af":"59a","st":45,"et":56,"消文":[{"文":"另一種說法不是這樣：有的一引一生，有的不是——各說各的。"}],"延伸":[],"逐字稿":[{"t":"59A 00:45","b":[["q","《集論》則說，頗有諸業，唯由一業牽引一生。又有諸業，唯由一業牽引多生。頗有諸業，由眾多業牽引一生。亦有諸業，由眾多業牽引多生。"],["s","這個解釋，各說各的。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/020.mp3"},{"文":"釋中說云：「有由一剎那業，唯能長養一世異熟種子。及由彼業而能長養多世異熟種子。有由多剎那業，唯能數數長養一世種子。及由眾多互相觀待，而能數數«長養展轉多生種子»。」","口譯":"《集論》的註解說：「有的是一瞬間造的業，只能種下一世果報的種子；也有一瞬間造的業，能種下很多世果報的種子。有的是很多瞬間造的業，只能一再加強一世的種子；也有很多業互相配合，能一再加強很多世的種子。」","四家合註":"《釋》中說云：有由<span class=\"sjan sj-ba\">〔<\/span>一剎那業<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂即一業。〕<\/span>唯能<span class=\"sjan sj-ba\">〔<\/span>長養一世異熟種子<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂唯引一生。〕<\/span>，及<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">又<\/span>由彼<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">一<\/span>業而能<span class=\"sjan sj-ba\">〔<\/span>長養多世異熟種子<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂引多生<\/span>。<span class=\"sjan sj-ba\">〕<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">又一微弱之業不能引生一身，<\/span>有由多<span class=\"sjan sj-ba\">〔<\/span>剎那業<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂即業也。〕<\/span>唯能數數長養<span class=\"sjan sj-ba\">〔<\/span>一世種子<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂引彼一身。〕<\/span>，及<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">又有<\/span>由眾多<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">業<\/span>互相觀待<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">聚合，<\/span>而能數數<span class=\"sjan sj-ba\">〔<\/span>長養<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂引生。〕<\/span>輾轉<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">眾<\/span>多生<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">多身<\/span>種子。","合註白話":{"same":0},"覺燈日光":null,"時":"59A 00:56","頁":138,"af":"59a","st":56,"et":187,"消文":[{"文":"這個道理這裡不詳細解釋，只要看清楚就行，等講十二因緣時會詳細解釋。"}],"延伸":[{"題":"長養展轉多生種子","組":[{"題":"留待十二緣起詳說","說":[{"類":"破","文":"平常把十二因緣看成「無明緣行、行緣識……」唸過去，大家都懂。"},{"類":"立","文":"其實這是修行的主要關鍵：前面什麼因感現在的果；現在果現起時，以什麼方式對它能轉過來、以什麼方式對它就跟著走，都在裡面。"},{"類":"回扣","文":"一個業留什麼種子、什麼時候感果、感果的狀態與內容，都留到那時再講。"}]},{"題":"眼前這部分非弄熟不可","說":[{"類":"下手","文":"為了將來有正確的認識，眼前這一部分非要把它弄熟不可；弄熟了，後面一講就非常清楚。"},{"類":"回扣","文":"真要修行，記住「四種資糧」：道理懂了、相狀了解了、方法有了，修行就很容易。"}]}],"說":[{"類":"破","文":"平常把十二因緣看成「無明緣行、行緣識……」唸過去，大家都懂。"},{"類":"立","文":"其實這是修行的主要關鍵：前面什麼因感現在的果；現在果現起時，以什麼方式對它能轉過來、以什麼方式對它就跟著走，都在裡面。"},{"類":"回扣","文":"一個業留什麼種子、什麼時候感果、感果的狀態與內容，都留到那時再講。"},{"類":"下手","文":"為了將來有正確的認識，眼前這一部分非要把它弄熟不可；弄熟了，後面一講就非常清楚。"},{"類":"回扣","文":"真要修行，記住「四種資糧」：道理懂了、相狀了解了、方法有了，修行就很容易。"}],"af":"59a","st":56}],"逐字稿":[{"t":"59A 00:56","b":[["q","釋中說云：「有由一剎那業，唯能長養一世異熟種子。及由彼業而能長養多世異熟種子。有由多剎那業，唯能數數長養一世種子。及由眾多互相觀待，而能數數長養展轉多生種子。」"],["s","現在這個道理，這裡不詳細解釋，你只要看清楚就行，等到下面講十二因緣的時候，我會詳細地解釋。這個十二因緣，平常我們總是把它看：啊，無明緣行、行緣識、識緣名色 ……就這麼唸過去，大家都懂。實際上，這個是我們修行的主要的關鍵，現在這裡講業的時候我就講到。將來講到十二緣起的時候，就是說前面什麼因，感得現在的果；以及現在果現起的時候，你以什麼方式對它，能夠轉過來；以及你以什麼方式對它，跟著它走，都在這個裡邊，清楚極了、明白極了。還有，為什麼一個業，說這個種子，現在留一個種子以及什麼時候感果，感果的狀態，感果的內容，都留到那個地方再去講。"]]},{"t":"59A 02:22","b":[["s","不過，為了將來我們有正確的認識起見，眼前這一部分，你們非要把它弄熟不可。你們能夠弄熟了，講到後面，一講，就非常清楚、非常明白。如果說真正還要修行的話，記住，這個「四種資糧」，這個地方就那麼明白、那麼清楚了。修行的道理你懂了，相狀你了解了，方法有了，那個時候修行就很容易、很容易！那麼，這個是業的引、滿。還有呢，定、不定受，下面說，有的業是一定受，有的是不一定；什麼業是一定，什麼業是不一定。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-12/021.mp3"}],"投影片":[{"img":"投影片/shenxin-yeguo-12/001.webp","n":1},{"img":"投影片/shenxin-yeguo-12/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/shenxin-yeguo-12/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/shenxin-yeguo-12/004.webp","n":4},{"img":"投影片/shenxin-yeguo-12/005.webp","n":5},{"img":"投影片/shenxin-yeguo-12/006.webp","n":6},{"img":"投影片/shenxin-yeguo-12/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=58a&st1=1447&et1=1697","box":[0.124875,0.358,0.12525,0.07288888888888889]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-12/008.webp","n":8},{"img":"投影片/shenxin-yeguo-12/009.webp","n":9},{"img":"投影片/shenxin-yeguo-12/010.webp","n":10,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=58b&st1=8&et1=183","box":[0.544875,0.29466666666666663,0.13775,0.06844444444444445]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/shenxin-yeguo-12/011.webp","n":11},{"img":"投影片/shenxin-yeguo-12/012.webp","n":12,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=58b&st1=183&et1=464","box":[0.124875,0.3591111111111111,0.12525,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-12/013.webp","n":13},{"img":"投影片/shenxin-yeguo-12/014.webp","n":14},{"img":"投影片/shenxin-yeguo-12/015.webp","n":15,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=58b&st1=492&et1=659","box":[0.539875,0.288,0.1315,0.07288888888888889]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/shenxin-yeguo-12/016.webp","n":16},{"img":"投影片/shenxin-yeguo-12/017.webp","n":17},{"img":"投影片/shenxin-yeguo-12/018.webp","n":18},{"img":"投影片/shenxin-yeguo-12/019.webp"," 75,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-12/038.webp","n":41,"yt":"E1qFpq1i0fY"},{"img":"投影片/shenxin-yeguo-12/039.webp","n":42}],"投影片PDF":"投影片/shenxin-yeguo-12/slides.pdf","音檔範圍":"58A 21:25～59A 03:07"},"shenxin-yeguo-13":{"id":"shenxin-yeguo-13","標題":"深信業果(十三)","根":"業餘差別","科判焦點":"丑三 業餘差別","課本範圍":"P138 L3 ~ P139 LL4","堂數":73,"日期":"2026/7/21","分圖":[{"名":"作與增長","原文":[0,7]},{"名":"增長非作・四句","原文":[8,11]},{"名":"受果時分・成熟次第","原文":[12,17]}],"跨科判":null,"週":96,"班級":"24秋007","序":null,"音檔":{"59a":{"local":"音檔/gl1/059A.mp3","remote":"https://lamrim.xyz/player/media/gl1/059A.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=59a&st1=187&af2=59b&et2=130","段":[{"文":"定不定受業者，如〈本地分〉云：「順定受業者，謂故思已，若作若增長業。","口譯":"一定會受報的業、和不一定會受報的業：就像〈本地分〉說的：「一定會受報的業，是指經過故意思考之後，做了、而且力量不斷加強的業。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、定不定，分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">由作增之門解說；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">由時之門分說為三。初中分四：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">總說定不定；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">作與增長二者差別；<\/span><span class=\"sjan sj-miao\">三、<\/span><span class=\"sjan sj-miao\">說彼二為四句；<\/span><span class=\"sjan sj-miao\">四、<\/span><span class=\"sjan sj-miao\">餘業相配之理。今初：<\/span>定不定受業者，如《本地分》云：「順定受業者，謂故思已，若作若增長業。","合註白話":{"id":"16762","頁":460,"白話":"第二科、決定與不決定業，分為二科：一、從造作與增長的角度解釋；二、從時間的角度解釋成三種。第一科分為四科：一、總體解釋決定與不決定業；二、造作與增長二者的差異；三、說明這二者為四句型；四、對應於其他業的道理。第一科：決定會領受與不一定會領受的業，如同《本地分》中所說：「決定會領受的業，是指故意造作與增長的業；不一定會領受的業，是指故意造作而不去增長的業。」","注釋":["定不定受業者：論典當中對定不定受業有兩種解釋方式，宗喀巴大師於本論是依《本地分》的說法。另《大乘阿毘達磨集論》中提到「云何名為決定受業？謂作業決定、受異熟決定、分位決定。」意指定受業為「確定造業、如果沒有遇到阻礙，確定會領受那個業的異熟、領受異熟的時間確定的業」，反之則為不定受業。參見《大正藏》冊31，頁679。","如《本地分》云：引文唐玄奘大師譯《瑜伽師地論．本地分》作：「順定受業者，謂故思已，若作若增長業；順不定受業者，謂故思已，作而不增長業。」見《大正藏》冊30，頁319；《丹珠爾》對勘本冊72，頁902。"],"已校":true},"覺燈日光":null,"時":"59A 03:07","頁":138,"af":"59a","st":187,"et":232,"消文":[{"文":"這一種是一定要受的——順定受。"},{"文":"「故思已」：思就是思業、意業，腦筋裡起心動念，就是受想行識的「行」。"},{"類":"例","文":"動腦筋：「這個東西好，怎麼想辦法獲得它；這個不好，怎麼排斥它」——就是這種心裡的狀態。"},{"文":"故思已，然後「若作」，還要「增長」，這是一定受。"}],"延伸":[],"逐字稿":[{"t":"59A 03:07","b":[["q","定不定受業者，如〈本地分〉云：「順定受業者，謂故思已，若作若增長業。"],["s","說，這一種是一定要受的 ─順定受，將來。這個業是什麼？「故思已」，思就是思業，就是意業，你腦筋裡面起心動念，換句話我們受、想、行、識的「行」。這個我們要了解，譬如說，你想，動這個腦筋：「唔，這個東西好，我怎麼樣想辦法去獲得它；這個東西不好，我怎麼樣去排斥它。」就這個心裡面這種狀態。故思已，然後呢，下面「若作」而還要「增長」，這個是一定受。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/001.mp3"},{"文":"順不定受業者，謂故思已，作而不增長業。」","口譯":"順不定受業，是指經過故意思惟之後，造作了卻沒有增長的業。」","四家合註":"順不定受業者，謂故思已，作而不增長業。」","合註白話":{"same":0},"覺燈日光":null,"時":"59A 03:52","頁":138,"af":"59a","st":232,"et":242,"消文":[{"文":"作是作了，但是不增長；什麼是作、什麼是增長，下面說。"}],"延伸":[],"逐字稿":[{"t":"59A 03:52","b":[["q","順不定受業者，謂故思已，作而不增長業。」"],["s","作是作了，但是不增長，那麼什麼是作，什麼是增長呢？下面："]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/002.mp3"},{"文":"作與增長所有差別者，即前論云：「云何作業，謂若«思業»或思惟已身語所起。」","口譯":"作與增長的差別，就是前面那部論說的：「什麼是作業？就是思業，或者思惟之後由身、語所發起的業。」","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二者：<\/span>作與增長所有差別者，即前論云：「云何作業？謂若思已業，或思惟已身語所起。」","合註白話":{"id":"16801","頁":462,"白話":"第二科：造作與增長的差異，如同前論所說：「什麼是造作的業？是指思已業，或是經過思惟之後，以身語發起行動。」又說：「增長業，是指除了十種行相的業，亦即：在一、夢境中所作；二、無知而作；三、不是故意要作；四、力量不強而且不是持續地作；五、失誤而作；六、由於遺忘而作；七、出於被迫而作；八、本質屬於無記；九、被懊悔抵消；十、被對治品抵消。除了這十種行相的業以外，其他的業都是增長業。不增長的業，指的便是上述十種業。」","注釋":["所有：藏文直譯為「的」。","即前論云：前論即指《瑜伽師地論》。引文唐玄奘大師譯《瑜伽師地論．本地分》作：「作業者，謂若思業，若思已所起身業語業。」見《大正藏》冊30，頁319；《丹珠爾》對勘本冊72，頁902。","思已業：法尊法師原譯作「思業」，係依玄奘大師譯《瑜伽師地論》文譯出，今據藏文改譯。","又云：引文出自《瑜伽師地論》。唐玄奘大師譯《瑜伽師地論．本地分》作：「增長業者，謂除十種業。何等為十？一、夢所作業；二、無知所作業；三、無故思所作業；四、不利不數所作業；五、狂亂所作業；六、失念所作業；七、非樂欲所作業；八、自性無記業；九、悔所損業；十、對治所損業。除此十種，所餘諸業名為增長。不增長業者，謂即所說十種業。」見《大正藏》冊30，頁319；《丹珠爾》對勘本冊72，頁902。","一夢所作：此中之小數字於福智之聲出版社2003、2010年版《廣論》皆如原文作大字，然查藏文並無此字，且於《四家合註》原文中亦無數字，蓋法尊法師為令讀者易於閱讀，故增之，然實非原文，故改作小字。下文亦同。","不利不數：藏文直譯為「不猛利、不持續」。","狂亂：藏文直譯為「失誤」。","失念所作：藏文直譯為「遺忘所作」。","十種業：夏日東活佛提到，夢所作，譬如夢中殺害仇敵，醒後未以耽著潤澤；無知所作，譬如小孩無知而殺蟲蟻；無故思所作，譬如被強迫做某件事情，或者小孩未經思考，被哄騙而殺生；不利不數所作，譬如一起殺念就突然殺死蜜蜂；失誤所作，譬如想要毆打石像卻誤殺他人；失念所作，譬如忘記當天受持近住律儀而殺死虱子；非樂欲所作，譬如僕人沒有自主權，只能遵照主人的命令殺羊；自性無記，沒有留意的情況下，螞蟻就死在腳下；悔所損害，刻意殺害敵人後，一直追悔，故僅僅頭痛就得以淨化；對治所損，譬如阿羅漢心中的不定業。參見《夏日東文集》冊1，420。"],"已校":true},"覺燈日光":null,"時":"59A 04:02","頁":138,"af":"59a","st":242,"et":468,"消文":[{"文":"平常大家都說造業，到底造些什麼業、怎麼造？這裡告訴我們：腦筋裡所想的，想了以後身語發起的。"},{"類":"例","文":"看見一個東西想：「這東西好，我也想獲得它」；看見人家出去玩，想「我也去」或「我不跟他，好好用心」——都是。"},{"文":"起心動念隨時隨地無不在這上頭，想了，身口就跟著跑掉了；一天到晚無非都在這裡。"}],"延伸":[{"題":"思業","組":[{"題":"無記也從等流來","說":[{"類":"破","文":"有人說：我很多時候好像沒有思——那是無記業。"},{"類":"因","文":"無記業怎麼來？還是前面的等流、宿生；因地造了這個，果上就是這個。"}]},{"題":"癡癡呆呆，是無記的墮落相","說":[{"類":"例","文":"螺螄、蚌蛤、烏龜一合，擺在那裡三天五天、十年八年；蚌根本不會爬，丟在哪裡就在哪裡。"},{"類":"破","文":"坐在那裡癡癡呆呆打瞌睡，自己還覺得「剛才坐得很好」——錯了！"},{"類":"立","文":"這不是說笑話，特別點醒：沒有殊勝的善引業，這都是墮落相，將來流落到這種狀態，這就是無記的貪。"}]},{"題":"世智聰辯也是思的行相","說":[{"類":"例","文":"另一種腦筋很聰明，專門非理作意，強辯起來道理說得不得了——世智聰辯。"},{"類":"下手","文":"每一個地方都要認得清楚這個思的行相。"}]},{"題":"正因邪因，處處顯露","說":[{"類":"因","文":"心裡越遲鈍的人，自然而然就緩慢。"},{"類":"破","文":"不是鼓勵一定要很靈活——猴子很靈活也不一定好。"},{"類":"立","文":"正因跟邪因之間，不管多小的地方，都會這麼清楚明白地示現出來。"}]}],"說":[{"類":"破","文":"有人說：我很多時候好像沒有思——那是無記業。"},{"類":"因","文":"無記業怎麼來？還是前面的等流、宿生；因地造了這個，果上就是這個。"},{"類":"例","文":"螺螄、蚌蛤、烏龜一合，擺在那裡三天五天、十年八年；蚌根本不會爬，丟在哪裡就在哪裡。"},{"類":"破","文":"坐在那裡癡癡呆呆打瞌睡，自己還覺得「剛才坐得很好」——錯了！"},{"類":"立","文":"這不是說笑話，特別點醒：沒有殊勝的善引業，這都是墮落相，將來流落到這種狀態，這就是無記的貪。"},{"類":"例","文":"另一種腦筋很聰明，專門非理作意，強辯起來道理說得不得了——世智聰辯。"},{"類":"下手","文":"每一個地方都要認得清楚這個思的行相。"},{"類":"因","文":"心裡越遲鈍的人，自然而然就緩慢。"},{"類":"破","文":"不是鼓勵一定要很靈活——猴子很靈活也不一定好。"},{"類":"立","文":"正因跟邪因之間，不管多小的地方，都會這麼清楚明白地示現出來。"}],"af":"59a","st":319}],"逐字稿":[{"t":"59A 04:02","b":[["q","作與增長所有差別者，即前論云：「云何作業，謂若思業或思惟已身語所起。」"],["s","這個叫「作業」，就是你造了。什麼叫造業？平常我們說造業、造業，大家都說造業，到底是造些什麼業？怎麼造法？現在告訴我們。就是說「思業」、「思惟已」的「身語所起」，你腦筋裡所想的，腦筋裡動腦筋的這個地方。譬如說你看見了一個東西，然後你就想：「欸，這個東西好喔！哎呀，這東西我也想怎麼歡喜獲得它！」乃至於很小的小地方。當然除了這個，譬如說你隨便看見人家有一點閒，咦，你就看：這些人幹什麼？哦，他出去玩。你想：「我也想出去玩一下。」或者你想：「這個人出去玩，我可不跟他，我在那裡好好地用心。」這個都是。所以，你起心動念隨時隨地無不是在這個上頭。你想跟著他去玩哪，等一下你就想：「想辦法，等一下怎麼 ……」你就跟著他，身口就跟他跑掉了。你想他不做，你在這兒努力，他去玩的時候，你在那兒好好用功。對不對？所以我們一天到晚，無非都在這個地方。"]]},{"t":"59A 05:19","b":[["s","還有一個，你說：「我好像很多情況之下沒有思。」那是什麼？那就是你的無記業。這個無記業怎麼來的？還是前面的等流。那麼為什麼有無記業呢？那個就是宿生，還是宿生。有很多人就這麼癡癡呆呆地，他因地當中造了這個，果上面就是這個。或者餘業未了，凡是你看看那個下等動物來的，螺螄、蚌蛤這樣，那個烏龜牠那個一合，擺在那個地方的話，三天、五天、十年、八年就在那個地方，那就是平常。那麼因地當中什麼呢？就是平常我們，因為我們有很多啊你說他不修行嗎？他修行。說他修行嗎？他又這樣。他又滿歡喜坐著乃至於，然後坐在那裡癡癡呆呆地就打了瞌睡，自己還覺得：「啊，剛才坐一下，坐得很好！」睡一覺嘛，當然好啦！在這種情況之下，錯了！我這地方千千萬萬不是說笑話喔！我這地方特別點醒喔！假定你有殊勝的善的引業還可以，你沒有的話，這個都是墮落相，將來就會流落到這種狀態當中去。這個就是無記的貪，這種相貌。"]]},{"t":"59A 06:34","b":[["s","還有一種呢，腦筋很聰明，聰明是聰明的，他專門在非理作意，跟你這種強辯的事情說起來，道理說得不得了，那世智聰辯。所以我們每一個地方我們必定要認得得清楚，這個思的行相，這個思的行相。"]]},{"t":"59A 06:51","b":[["s","然後呢有了思，「身語所起」，剛才說，這個人坐在那裡癡癡呆呆地，所以他將來感得的，那個很多動物就是這樣。那個蚌牠根本就不會、不會爬的，就在那裡，你丟在那地方，牠就在那個地方。那烏龜還比較好一點，牠還會爬一爬，還會游一游。原因為什麼呢？就是他心裡越是遲鈍的人，他自然而然他就是這樣，就是什麼？緩慢。那每一個地方，你了解了這一點，你就會很清楚、很明白。我這地方不是鼓勵一定要很靈活喔，猴子很靈活也不一定好啊，對吧！所以總之，你要曉得這個正因跟邪因之間，不管任何一點小小的地方，它就會這麼清楚明白地示現顯露出來，這個是作。下面呢，增長。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/003.mp3"},{"文":"又云：「增長業者，除十種業，","口譯":"又說：「增長業，是除了以下十種業以外的業，","四家合註":"又云：「增長業者，除十種業，","合註白話":{"same":2},"覺燈日光":null,"時":"59A 07:48","頁":138,"af":"59a","st":468,"et":475,"消文":[{"文":"換句話說，除了十種都是增長業；下面那十種是不增長的。"}],"延伸":[],"逐字稿":[{"t":"59A 07:48","b":[["q","又云：「增長業者，除十種業，"],["s","換句話說，除了十種，都是增長業。那麼下面那個十種是不增長的。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/004.mp3"},{"文":"謂一夢所作，二無知所作，三無故思所作，四不利不數所作，五狂亂所作，六失念所作，七非樂欲所作，八自性無記，九悔所損害，十«對治所損»。","口譯":"就是：一、在夢裡做的；二、不知道而做的；三、不是故意做的；四、不強烈、也不是一再做的；五、神智錯亂時做的；六、一時忘了而做的；七、不是自己想做的；八、本身不善不惡的；九、做了之後已經後悔、把力量削弱的；十、已經用對治法把力量削弱的。","四家合註":"謂：<span>一、<\/span>夢所作；<span>二、<\/span>無知所作；<span>三、<\/span>無故思所作；<span>四、<\/span>不利不數所作；<span>五、<\/span>狂亂所作；<span>六、<\/span>失念所作；<span>七、<\/span>非樂欲所作；<span>八、<\/span>自性無記；<span>九、<\/span>悔所損害；<span>十、<\/span>對治所損。","合註白話":{"id":"16915","頁":465,"白話":"第三科、分為四種情形：第一科、造作而不增長：《攝決擇分》中也提到四種情形：造作而不增長的殺生業，是指因為不擅長而作；上師說：此處如果理解為智者與愚人二者當中的不智者所作，那麼在前文已經將之解釋為重業，不應該再列入不增長業。所以是指動作不夠熟練，或是像避之不及而誤殺。在夢中所作；不是蓄意要作；沒有意願而被他人迫使去作；只作了一次，之後又以強烈的悔意與深知過患之心摧壞惡業，受持能斷的律儀而將之削減到極其微薄；尚未感生異熟，便藉由世間的離欲，壓制其種子；以及藉由出世間的能斷之道徹底破壞種子。第二科、增長而不造作：是指為了殺害生命而長期思索，然而尚未殺害。即使最終沒有形之於身語，但是動機強烈而持久，這與將三種意業解釋為重大的關鍵相同，是深重的惡業。第三科、造作而增長：除了前面那兩種情形以外，所有具備前行、正行、完結三者的殺生。第四科、不造作而且不增長：是指這三種以外的情形。第四科、對應於其他業的道理：從不與而取到綺語之間，同樣也應當按照相對應的情況而了解。三種意業中沒有在此提到的第二種增長而不造作的情形，而第一種造作而不增長業的情形當中，也沒有非蓄意而作，以及受他人指使而作。","注釋":["分為四句：即前頁447「說彼二為四句」一科。","《攝決擇分》亦說四句：此段是取經文大意，非錄原文，相應段落參見唐玄奘大師譯《瑜伽師地論．攝決擇分》云：「復次殺生所引不善諸業，或有是作而非增長，或有增長而非是作，或有亦作亦復增長，或有非作亦非增長。初句謂無識別童稚所作；或夢所作；或不思而作；或自無欲他逼令作；或有暫作續即還起猛利悔心及厭患心，懇責遠離，正受律儀令彼微薄；未與果報便起世間離欲之道，損彼種子；次起出世永斷之道，害彼種子令無有餘。增長而非作者：謂如有一為害生故，於長夜中數隨尋伺，由此因緣，彼遂增長殺生所引惡不善法，然不能作殺生之業。亦作亦增長者：謂除先所說作非增長、增長非作，所餘一切殺生業相。非作非增長者：謂除上爾所相。如是所餘不與取等乃至綺語，隨其所應如殺應知。於貪欲、瞋恚、邪見中，無有第二增長而非作句；於初句中，無有不思而作，及他逼令作，餘如前說。」見《大正藏》冊30，頁633；《丹珠爾》對勘本冊74，頁335。","作殺生而非增長：法尊法師原譯作「一作殺生而非增長」，此中數字藏文原無，且於《四家合註》原文亦無，蓋法尊法師為令讀者易於閱讀，故增之。今為配合箋註，故刪之。下文「增長而非作者」等三科亦同。","無識別：此詞藏文即前所依門力大時所說的「不智」，因有多種解法，此處法尊法師係依玄奘大師譯《瑜伽師地論》文譯出，意即不嫻熟、不沉穩，方與下文巴註的內容相契。","嫺巧：熟練善巧。嫺，音「閑」，熟練，又作嫻。","避之不及：此詞藏文為方言古語，如月格西解釋為想方設法也無法避免，例如不小心跌倒時，發現下方有蟲蟻等，盡力閃避仍造成死傷。","若有暫作：藏文直譯為「僅僅只做一次」。","續即摧以猛利追悔及厭患心由受能斷律儀：法尊法師原譯作「發起猛利追悔及厭患心，懇責厭離，正受律儀」，係依玄奘大師譯《瑜伽師地論》文譯出，今據藏文改譯。","世間所有離欲：此處「所有」藏文意為「的」，是指「世間道的離欲」，亦即以世間的有漏定遠離貪欲。","出世永斷之道：指無漏的無間道，由於斷除任何一種煩惱種子，都必須在心中生起無間道，所以稱無間道為永斷之道、能斷之道。","正壞：法尊法師原譯作「害彼」，係依玄奘大師譯《瑜伽師地論》文譯出，今據藏文改譯。","尋伺：一般而言，尋、伺是五十一心所當中的兩種心所。《大乘廣五蘊論》云：「云何尋？謂思慧差別，意言尋求，令心麁相分別為性。意言者，謂是意識，是中或依思，或依慧而起。分別麁相者，謂尋求瓶衣車乘等之麁相，樂觸苦觸等所依為業。云何伺？謂思慧差別，意言伺察，令心細相分別為性。細相者，謂於瓶衣等分別細相成不成等差別之義。」《阿毘達磨俱舍論》云：「尋伺別者，謂心麁細。心之麁性名尋，心之細性名伺。」此處尋伺則解為動詞，意即觀察對境的粗細行相。參見《大正藏》冊31，頁854；冊29，頁21。"],"已校":true},"覺燈日光":null,"時":"59A 07:55","頁":138,"af":"59a","st":475,"et":745,"消文":[{"文":"夢裡所作不增長，不會感果——所以懺悔時說夢作不增長；夢裡會作，是等流，並不強烈。"},{"類":"例","文":"無知所作：一下走過去踩死幾個螞蟻，根本不知道。"},{"文":"無故思所作：境界一對，事前沒有想就作了。"},{"類":"破","文":"注意：很多無故思是很濃厚的習氣，前面故思、數數作養成的，還是定受；這裡只是說單單這一個業沒有故思。"},{"類":"例","文":"不利不數：上班時被要求做不太合理的事，不為求利，也不常做。"},{"文":"狂亂是失了心；失念是正念正知一下沒注意到；非樂欲是作這件事不是你好樂的。"},{"類":"破","文":"自性無記如走、坐、睡覺，不會感果；但睡時懶惰的心卻是，不要說睡覺無記就一天到晚睡。"}],"延伸":[{"題":"對治所損","組":[{"題":"悔與對治，修行人用得上","說":[{"類":"立","文":"第九、第十是我們修行用得上的：造了增長業，但是懊悔「我以前怎麼做這個，不對啊」——就不增長，業就不一定受。"},{"類":"立","文":"最好的是聖教告訴我們的對治：雖然種了種子，針對病根去治療。"}]},{"題":"種子未發，先把它破壞","說":[{"類":"喻","文":"種子種下去了，還沒發芽就把它破壞掉；發了芽把它拔掉，就長不起來。"},{"類":"回扣","文":"最後這兩點，是修行人特別用來淨除以往所造的。"}]}],"說":[{"類":"立","文":"第九、第十是我們修行用得上的：造了增長業，但是懊悔「我以前怎麼做這個，不對啊」——就不增長，業就不一定受。"},{"類":"立","文":"最好的是聖教告訴我們的對治：雖然種了種子，針對病根去治療。"},{"類":"喻","文":"種子種下去了，還沒發芽就把它破壞掉；發了芽把它拔掉，就長不起來。"},{"類":"回扣","文":"最後這兩點，是修行人特別用來淨除以往所造的。"}],"af":"59a","st":680}],"逐字稿":[{"t":"59A 07:55","b":[["q","謂一夢所作，二無知所作，三無故思所作，四不利不數所作，五狂亂所作，六失念所作，七非樂欲所作，八自性無記，九悔所損害，十對治所損。"],["s","就這幾樣。什麼是不增長的呢？「夢」裡面。所以平常我們說這個懺悔的時候，夢作的時候不增長，就是這個原因，它不會感果的、它不會感果的。那麼那夢裡面為什麼會「所作」呢？這地方順便一提。這個就是等流，這個就是等流，就這樣。或者是以前的，或者是現在的，但是它並不強烈，並不是非常強烈，這種情形。第二個「無知所作」，你作的時候你不知道，你什麼叫不知道？哦，一下走過去，踩死幾個螞蟻，我根本不知道，這個就是無知所作，這個不是增長的。"]]},{"t":"59A 08:59","b":[["s","「無故思所作」，你作這件事情，你並沒有先去思惟。這個情況什麼呢？往往我們眼前一個境界對起了以後，你並沒有事前先想，欸，碰到了，你那時候這樣去作，這種情況叫無故思。不過注意喲！有很多無故思啊，很濃厚的習氣，他這個非常強有力的習氣，因為這個習氣的關係，這個還是定受。他這個習氣怎麼來的？前面由於他的故思、數數作，養成功了習慣，雖然現在不故思，他繼續下去。這地方就是說，單單這一個業，單單這個業，這部分他沒有故思所作，這個不增長。"]]},{"t":"59A 09:49","b":[["s","下面說「不利、不數所作」，雖然你去作了，但是呢，你對你作的這個事情，你不是為了求利益，你也不得已，你實在也不想去作乃至於，對你沒有好處。但是你還要去作，而且呢，你不常常去作，不常常去作。這個什麼意思呢？譬如說，我們現在上班，那個辦公的地方教你作一個不太合理的事情。唉！這東西啊你覺得，你不為求什麼利；還有呢，不數所作。「狂亂所作」，這個我們了解的，失了心了。什麼叫「失念所作」呢？就是平常的時候，我們這個正念正知現前，有的時候，你一下就沒有注意到了，沒有注意到了，這種情況。「非欲樂所作」，就是作這件事情，不是你好樂的。"]]},{"t":"59A 10:46","b":[["s","「自性無記」，自性無記的它本身就不會感這個果的。什麼叫自性無記？走路、坐在這地方，就是這樣，所以四威儀中很多，睡覺，這個不會感果的，睡覺沒有善惡之分。當然你睡的時候懶惰，這個懶惰的心卻是，但是睡本身卻不是，這個我們要了解的，這個要了解的。所以，不要說：「哦！睡覺是無記的，那我反正一天到晚就睡覺。」你這個懶惰的心，卻是不行喔！這個我們分得很清楚。"]]},{"t":"59A 11:20","b":[["s","那麼第九、第十這兩個，就是我們修行用得上的。雖然你造了，前面造了增長業，但是呢你「懊悔」，說：「唉呀！我以前怎麼做這個事情啊，不對啊！」這個時候就它不增長。如果不增長的話，這個業就不一定受。還有呢「對治」，最好的，聖教裡邊告訴我們的對治，就是雖然你種了這個種子，你針對著這個病根去治療。舉個譬喻，譬如說你雖然種下去了，種是種下去了，欸，你還沒有發芽的時候，你就把它破壞掉了。乃至於雖然發了芽，你把它拔掉了，那時候它就長不起來了，這個就是對治。所以這個最後的兩點，它是我們修行人特別用來淨除以往所造的，以往所造的所以能夠那個，就靠這兩點。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/005.mp3"},{"文":"除此十種業所餘諸業。","口譯":"除了這十種業以外的其餘各種業（就是增長業）。","四家合註":"除此十種業，所餘諸業。不增長業者，謂即所說十種。」","合註白話":{"same":2},"覺燈日光":null,"時":"59A 12:25","頁":138,"af":"59a","st":745,"et":756,"消文":[{"文":"除了十種都是增長；不增長業就是所說的十種。"}],"延伸":[],"逐字稿":[{"t":"59A 12:25","b":[["q","除此十種業所餘諸業。"],["s","那麼，除了十種都是增長。所以「不增長業者，謂即所說十種。」"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/006.mp3"},{"文":"〈攝決擇分〉亦說四句，一作殺生而非增長，","口譯":"〈攝決擇分〉也說了四句：第一、作了殺生卻不增長，","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第三、分為四句：第一、作而非增長者：<\/span>《攝決擇分》亦說四句：作殺生而非增長，","合註白話":{"id":"17046","頁":469,"白話":"第二科、從時間的角度解釋，分為二科：一、概略說明；二、詳細闡述。第一科：必定領受當中，從感果時間的角度分為三種。第二科分為三科：第一科分為二科：一、定義；二、支分。第一科：其中現法受，是指該業的果報在當生就會成熟。第二科：《本地分》則提到，這又可分為顧惜今生與不顧惜今生二者、利益心與損害心二者、對三寶等懷著損害心與信心二者、利益與損害父母等二者，共有八種。由於非常顧惜身體、受用與三有的心念所造作的不善業，在今生就會感果。或由非常不顧惜這些的心念，而造作善業。同樣地，對有情懷著非常想要傷害的心，以及非常悲憫、想要利益的心；另外非常想要迫害三寶與上師等的心，以及對他們懷著強烈的信仰與勝解的心念等；還有瞋惱父母上師等恩人而不報恩的心念所造的不善業，在今生就會感果；而真摯地回饋報恩的心念所造的善業，在今生就會感果。第二科、順生受：是指在第二生感果。第三科、順後受：則是指在第三世以後成熟。","注釋":["第二由時之門解說：即前頁447「由時之門分說為三」一科。意指在決定受中，依領受果報的時間分成三種：現法受、順生受、順後受。","《本地分》說：此段是取經文大意，非錄原文，相應段落參見唐玄奘大師譯《瑜伽師地論·本地分》云：「應知欲解復有八種：一、有顧欲解；二、無顧欲解；三、損惱欲解；四、慈悲欲解；五、憎害欲解；六、淨信欲解；七、棄恩欲解；八、知恩欲解。有顧欲解，造不善業受現法果者，謂如有一由增上欲解，顧戀其身、顧戀財物、顧戀諸有，造不善業。無顧欲解，所造善業受現法果者，謂如有一以增上欲解，不顧其身、不顧財物、不顧諸有，造作善業。損惱欲解，造不善業受現法果者，謂如有一於他有情補特伽羅，以增上品損惱欲解造不善業。慈悲欲解，所造善業受現法果者，謂如有一於他有情補特伽羅，以增上品慈悲欲解造作善業。憎害欲解，造不善業受現法果者，謂如有一於佛法僧，及隨一種尊重處事，以增上品憎害欲解造不善業。淨信欲解，所造善業受現法果者，謂如有一於佛法僧等，以增上品淨信欲解造作善業。棄恩欲解，造不善業受現法果者，謂如有一於父母所，及隨一種恩造之處，以增上品背恩欲解、欺誑欲解、酷暴欲解，造不善業。知恩欲解，所造善業受現法果者，謂如有一於父母等，以增上品知恩欲解、報恩欲解，所作善業。」見《大正藏》冊30，頁318；《丹珠爾》對勘本冊72，頁894。","悲心及饒益心：法尊法師原譯作「慈悲」，係依玄奘大師譯《瑜伽師地論》文譯出，今據藏文改譯。","恩造之所：藏文直譯為「恩人」，法尊法師蓋取玄奘大師譯《瑜伽師地論》文譯出。","酷暴背恩：指瞋怒損惱而不知報恩。法尊法師原譯作「增上品酷暴背恩」，蓋取玄奘大師譯《瑜伽師地論》文譯出，今據藏文刪「增上品」。"],"已校":true},"覺燈日光":null,"時":"59A 12:36","頁":138,"af":"59a","st":756,"et":763,"消文":[{"文":"作了，不增長；〈攝決擇分〉每樣東西都說四句分別。"}],"延伸":[],"逐字稿":[{"t":"59A 12:36","b":[["q","〈攝決擇分〉亦說四句，一作殺生而非增長，"],["s","作了，不增長。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/007.mp3"},{"文":"謂無識別所作，夢中所作，非故思作，自無樂欲他逼令作，若有暫作，續即發起«猛利追悔»及厭患心，懇責厭離，正受律儀，令彼薄弱，未與異熟，便起世間所有離欲，損彼種子及起出世永斷之道，害彼種子。","口譯":"就是沒有識別所作、夢中所作、不是故意思惟所作、自己沒有樂欲而被他人逼迫所作；或者雖然暫時作了，接著就生起猛利的追悔和厭患心，懇切地自責、厭離，正式受持律儀，使它的力量薄弱；在還沒有感得異熟之前，就生起世間的離欲，損害它的種子，以及生起出世間永斷的道，斷害它的種子。","四家合註":"謂無識別所作；<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">師云：若解此為智愚二者所分之不智，則前文已說之為重，故不當為非增長，故為舉止不嫺巧或如避之不及而殺生者。<\/span>夢中所作；非故思作；自無樂欲他逼令作；若有暫作，續即摧以猛利追悔及厭患心，由受能斷律儀，令彼薄弱；未與異熟，便起世間所有離欲，損彼種子；及起出世永斷之道，正壞種子。","合註白話":{"same":4},"覺燈日光":null,"時":"59A 12:43","頁":138,"af":"59a","st":763,"et":1037,"消文":[{"文":"這個概念很重要：雖然造了，能夠不受。"},{"類":"例","文":"無故思所作：蚊蟲一叮，「欸！」一下打死，那時的確沒有故思。"},{"類":"破","文":"但不要打完了說「反正是無故思」——那下面就故思掉了；心理行相非常細微，打完了應該生起懺悔。"},{"文":"「若有暫作」：作了是增長的，但作完立刻生起猛利追悔、厭患心、懇責厭離，這是一般世間的。"},{"文":"進一步「正受律儀」是出世的：追悔之後從此不再犯，照出世的標準，「令彼薄弱」。"},{"類":"喻","文":"像種子收起來曬得乾乾的，擺在石頭上、罈子裡，曬不到太陽碰不到水，長不起來——這是損；擺在火上燒焦，怎麼泡水曬太陽也長不起來——這是永害。"}],"延伸":[{"題":"猛利追悔","組":[{"題":"自覺有理再三想，就是增長","說":[{"類":"破","文":"事情發生了，老覺得我有道理，還繼續不斷想了半天，找到機會還跟人家爭——就完了！那是故思，增長業。"},{"類":"立","文":"剛開始第一步一定會犯，難免的。"}]},{"題":"犯了就悔責，可不定受","說":[{"類":"下手","文":"努力修學了解這個道理，隨時犯了以後曉得「唉呀，我又錯了」，努力悔責，就可以不定受。"},{"類":"立","文":"在這個基礎上，這一生不遭惡劣、不墮落，下一世能生生增上，乃至跳出輪迴。"}]},{"題":"惡業增上求往生，南轅北轍","說":[{"類":"破","文":"要不然惡業拼命在增上，還求生天、求往生，不是南轅北轍嗎？"},{"類":"回扣","文":"這個基本的概念就在這裡。"}]}],"說":[{"類":"破","文":"事情發生了，老覺得我有道理，還繼續不斷想了半天，找到機會還跟人家爭——就完了！那是故思，增長業。"},{"類":"立","文":"剛開始第一步一定會犯，難免的。"},{"類":"下手","文":"努力修學了解這個道理，隨時犯了以後曉得「唉呀，我又錯了」，努力悔責，就可以不定受。"},{"類":"立","文":"在這個基礎上，這一生不遭惡劣、不墮落，下一世能生生增上，乃至跳出輪迴。"},{"類":"破","文":"要不然惡業拼命在增上，還求生天、求往生，不是南轅北轍嗎？"},{"類":"回扣","文":"這個基本的概念就在這裡。"}],"af":"59a","st":967}],"逐字稿":[{"t":"59A 12:43","b":[["q","謂無識別所作，夢中所作，非故思作，自無樂欲他逼令作，若有暫作，續即發起猛利追悔及厭患心，懇責厭離，正受律儀，令彼薄弱，未與異熟，便起世間所有離欲，損彼種子及起出世永斷之道，害彼種子。"],["s","現在講，這個概念對我們很重要。〈攝決擇分〉當中說，這個也有四句分別，它每樣東西都說。作而不增長，作是作了，但是不增長。這個，為什麼這地方特別說這個業不會定受 ─不定受？雖然你造了，你能夠不受。那麼什麼呢？看：「無識別所作」，無識別所作，換句話說你根本不知道。「夢中所作」，這剛才已經說過了。「無故思所作」，譬如說一個蚊蟲，一叮，你那時候根本不曉得，欸，一來，把牠打死掉了。是，那個時候你的的確確不是能夠清清楚楚地曉得，你在那兒有個叮你，「欸！」這麼一來，那個時候你沒有故思，就是這樣的情況。但是你不要說：「啊，這個是無故思所作！」下面這個就是故思掉了。這個我們要分得很清楚喔！所以這個心理的行相是非常細微、非常細微喔！不要說，啊，這個是、是、是……打完了以後，反正是我不故思所作，那時候你應該生起懺悔。所以後面這個心，前面的就變成功，就這個裡邊有差別了，每一個地方很細的。還有「自無樂欲他逼令作」，別人逼著你去做的，這個前面已經說過。"]]},{"t":"59A 14:32","b":[["q","另外一種呢，「若有暫作」，是─下面這個，就是說你作了是增長的，但是你作完了以後，「續即發起猛利追悔及厭患心」，你懊悔，唉呀！你說你怎麼、「我怎麼做這種錯誤的事情啊？」還要感到錯誤、厭離，「懇責厭離」，這個對！"],["s","這個就是一般世間的。進一步呢，「正受律儀」，更進一步出世，出世還同樣地，一定包括對前面這個追悔、厭患，然後呢，從此以後不再犯。不再犯呢，以前是照著世俗的標準去專門做這種壞事，現在照著出世的標準，於是這樣「令彼薄弱」，讓它那個種子的力量薄弱。為什麼？它不增長嘛，就這樣。像一個種子一樣，你收起來了以後，乾得個要命，擺在石頭上面，它就長不起來呀！"]]},{"t":"59A 15:27","b":[["s","還有呢，「便起世間所有離欲」，對世間再離開，欲是增長它的一個力量，現在你離開了，「損彼種子」，使得那個種子受損害。乃至於「起出世永斷之道，害彼種子」，永遠斷除。像那個種子一樣，前面「損」的話，你把它曬得乾得要命，擺在石頭上面，擺在那個罈裡面，欸，曬不到太陽，碰不到水，它長不起來；「永害」呢？你擺在火上燒燒焦，完了！你怎麼個要擺在水裡面泡、太陽去曬，它也長不起來，這樣。"]]},{"t":"59A 16:07","b":[["s","所以平常是為什麼我處處地方告訴大家，說要了解這個道理啊！平常我們發生的事情，事情發生了，往往自己老覺得我有道理。噢喲，這個道理呀，還繼續不斷地想了半天，找到了機會還跟人家爭，你就完了，你就完了！那個什麼？故思啊，增長業。那麼我們難免的，剛開始難免我們會，不但是難免，尤其剛開始第一步是一定會的。所以我們努力地修學，了解了這個，隨時犯過了以後，曉得「唉呀，怎麼我又錯了！我就努力地 ……」你這樣地悔責的話，這樣的話，可以不定受，這樣可以不定受。然後在這個基礎上面，這一生你不會遭到惡劣的，乃至於少少惡劣，你不墮落。因為你不墮落，下一世能夠生生增上，下一世能夠生生增上，你乃至於能夠跳出輪迴等等。要不然你惡業增上，拼命在增上，你還求生天、還求往生，那個不是南轅北轍嗎？這個基本的概念就在這裡。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/008.mp3"},{"文":"二增長而非作者，","口譯":"第二種，是心裡力量加強了、但沒有實際去做的，","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、<\/span><span>增長而非作者：<\/span>","合註白話":{"same":4},"覺燈日光":null,"時":"59A 17:17","頁":138,"af":"59a","st":1037,"et":1045,"消文":[{"文":"妙咧！沒有作卻會增長的。"}],"延伸":[],"逐字稿":[{"t":"59A 17:17","b":[["q","二增長而非作者，"],["s","欸，妙咧！沒有作卻會增長的。下面呢，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/009.mp3"},{"文":"為害生故，於長夜中，«數隨尋伺»，然未殺生。","口譯":"為了要傷害眾生，在長夜之中，屢屢隨著尋思伺察，然而並沒有殺生。","四家合註":"為害生故，於長夜中，數隨尋伺，然未殺生。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此雖終未形諸身口，然而等起猛利長時，與說意三為重同一扼要，罪惡廣大。<\/span>","合註白話":{"same":4},"覺燈日光":null,"時":"59A 17:25","頁":138,"af":"59a","st":1045,"et":1178,"消文":[{"文":"雖然沒去殺，但心裡老是去尋伺。"}],"延伸":[{"題":"數隨尋伺","組":[{"題":"心裡老在嘀咕，增長最厲害","說":[{"類":"立","文":"我們極大部分時候就做這個罪，很糟糕。"},{"類":"例","文":"遇見歡喜的，雖然沒有去拿；不歡喜的，雖然沒有罵他，可是心裡老在那兒嘀咕。"},{"類":"立","文":"內因果的增長，再沒有比這個更厲害的，這一點最重要。"}]},{"題":"胡思亂想，也是增長非作","說":[{"類":"破","文":"平常沒事情癡癡呆呆，要嘛去聊天，要嘛胡思亂想——都是增長而非作，一定是定受的業。"},{"類":"立","文":"坐在那裡動腦筋想那件事情：做不成已經在增長，做成更不談。"}]},{"題":"金貓因緣：一路歡喜想好事","說":[{"類":"回扣","文":"前面金貓因緣：只送了三個銅板，一路歡喜、一路想著這好事，就得到這麼大的果報。"},{"類":"下手","文":"現在我們一路腦子裡想什麼？自己檢點一下就曉得了。"}]},{"題":"貪瞋易認，癡相應最難治","說":[{"類":"下手","文":"感覺貪相應，不對，排除；瞋相應，不對！"},{"類":"立","文":"最難對治的是癡相應：糊裡糊塗一天，好像沒做什麼錯事——要對治它。"}]}],"說":[{"類":"立","文":"我們極大部分時候就做這個罪，很糟糕。"},{"類":"例","文":"遇見歡喜的，雖然沒有去拿；不歡喜的，雖然沒有罵他，可是心裡老在那兒嘀咕。"},{"類":"立","文":"內因果的增長，再沒有比這個更厲害的，這一點最重要。"},{"類":"破","文":"平常沒事情癡癡呆呆，要嘛去聊天，要嘛胡思亂想——都是增長而非作，一定是定受的業。"},{"類":"立","文":"坐在那裡動腦筋想那件事情：做不成已經在增長，做成更不談。"},{"類":"回扣","文":"前面金貓因緣：只送了三個銅板，一路歡喜、一路想著這好事，就得到這麼大的果報。"},{"類":"下手","文":"現在我們一路腦子裡想什麼？自己檢點一下就曉得了。"},{"類":"下手","文":"感覺貪相應，不對，排除；瞋相應，不對！"},{"類":"立","文":"最難對治的是癡相應：糊裡糊塗一天，好像沒做什麼錯事——要對治它。"}],"af":"59a","st":1045}],"逐字稿":[{"t":"59A 17:25","b":[["q","為害生故，於長夜中，數隨尋伺，然未殺生。"],["s","你經常雖然你沒有去殺，但是心裡面老是去「尋伺」，尋伺。我們極大部分的時候，我們就做這個罪，這個很糟糕、很糟糕！譬如說，你遇見了一件事情，你歡喜的，雖然你沒有啊有行為上跑得去把那東西拿得來；你不歡喜的，雖然你沒有行為上面你沒有排斥他、罵他，可是你心裡面老在那兒嘀咕，就這個。這個前面所講的這個業的增長，內因果的增長，再沒有比這個更厲害的，就這個，所以這一點是我們最重要的。"]]},{"t":"59A 18:14","b":[["s","所以為什麼平常我們要多了解，經常拿那個法理擺在心裡面。平常我們大部分時間沒事情，癡癡呆呆，幹什麼？要嘛跑得去聊聊天，要嘛心裡面就胡思亂想，想那個什麼東西，這個都是什麼？這個都是「增長而非作」。凡是增長而非作的話，這種一定是定受的業。注意喲、注意喲！我們平常最容易犯的就是這個毛病，平常我們坐在那個地方就想：嗯！這個怎麼動個腦筋，怎麼樣想那件事情 ……。就算你這件事情做不成功，這已經在增長了；做成功，那更不談！所以前面告訴我們太多的例子，大家還記得不記得金貓因緣？他就送了三個銅板，然後呢，他下面增長，一路歡喜，一路想著這個好事情，他就得到這麼大的果報。現在我們一路腦子裡想的什麼？你自己檢點一下就曉得了。所以，這個地方我們只要修行的話，如果感覺到貪相應，哦！不對，排除掉。瞋相應，不對！最難對治，還是癡相應！嗯，就是糊裡糊塗地就這麼一天，好像沒什麼做什麼錯事啊！要對治它，要對治它！這地方我們了解，第二個。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/010.mp3"},{"文":"三作而增長者，謂除前二句一切殺生。四非作非增長者，謂除前三。","口譯":"第三、作而且增長的，是除了前兩句以外的一切殺生。第四、非作也非增長的，是除了前三句以外的。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第三、<\/span><span>作而增長者：<\/span>謂除<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">彼<\/span>前二句一切<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">由具加行、正行、結行三者之門而<\/span>殺生。<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第四、<\/span><span>非作非增長者：<\/span>謂除前三。","合註白話":{"same":4},"覺燈日光":null,"時":"59A 19:38","頁":138,"af":"59a","st":1178,"et":1187,"消文":[{"文":"「作而增長」容易：除了前兩句，又作又增長。"},{"文":"第四，既沒有作，也沒有增長。"}],"延伸":[],"逐字稿":[{"t":"59A 19:38","b":[["q","三作而增長者，謂除前二句一切殺生。"],["s","三，「作而增長」，那個容易。謂除兩句，又作又增長。"]]},{"t":"59A 19:44","b":[["q","四非作非增長者，謂除前三。"],["s","既沒有作，也沒有增長。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/011.mp3"},{"文":"從不與取乃至綺語，隨其所應如殺應知。於意三中，無第二句，於初句中，亦無不思而作，他逼令作。","口譯":"從偷盜一直到綺語，都可以照殺生的情況類推。意業的三種（貪、瞋、邪見）沒有第二種情況；第一種情況裡，也沒有「沒想就做了」和「被別人逼著做」這兩類。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第四、餘業相配之理：<\/span>從不與取乃至綺語，隨其所應如殺應知。於意三中，無<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">其中所說<\/span>第二句<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">增長而非作<\/span>。於初句<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">作而非增長業<\/span>中，亦無不思而作、他逼令作。","合註白話":{"same":4},"覺燈日光":null,"時":"59A 19:47","頁":138,"af":"59a","st":1187,"et":1252,"消文":[{"文":"意當中沒有第二句「增長而非作」：意本身就沒有作，它的作就是增長，有起心動念就是增長。"},{"文":"初句「作而不增長」中，也沒有「不思而作、他逼令作」。"},{"文":"每個地方分別清楚，業的事情就很清楚了。"}],"延伸":[],"逐字稿":[{"t":"59A 19:47","b":[["q","從不與取乃至綺語，隨其所應如殺應知。於意三中，無第二句，於初句中，亦無不思而作，他逼令作。"],["s","這意當中沒有第二句，為什麼呀？第二句是什麼？「增長而非作」。意本身哪，意本身它就沒有作；它那個作就是增長，有起心動念就是增長。所以這第二句是增長而非作，對於這個意沒有；起心動念，意這個意念貪瞋癡就在那裡造。那麼然後呢，初句中，「亦無不思而作，他逼令作」。第一句當中是什麼呢？第一句當中就是「作而不增長」，就是「無不思而作，他逼令作」，這個容易了解。這個我們每一個地方分別清楚了以後，好，業的事情，很清楚了，那麼決定受。還有呢決定受，說不定跟定了解了，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/012.mp3"},{"文":"決定受中，依受果時分三。","口譯":"一定會受報的業，依照受報的時間分三種。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、由時之門解說，分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">略示；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">廣說。今初：<\/span>決定受中，依受果時分三。","合註白話":{"same":6},"覺燈日光":null,"時":"59A 20:52","頁":139,"af":"59a","st":1252,"et":1262,"消文":[{"文":"決定受還分出前後不同；第一個，現法就受。"}],"延伸":[],"逐字稿":[{"t":"59A 20:52","b":[["q","決定受中，"],["s","還分出前後不同。"]]},{"t":"59A 20:56","b":[["q","依受果時分三。"],["s","第一個呢，現法就受。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/013.mp3"},{"文":"其中現法受者，謂即彼果現法成熟。〈本地分〉說此復有八，若由增上顧戀意樂，«顧戀其身»，財物諸有，造作不善，於現法受。","口譯":"其中「現世受報」，是說果報在這一生就成熟。〈本地分〉說這又有八種情況：如果因為非常強烈地貪戀自己的身體、財物和生命，而做了惡事，就在這一生受報。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二分三：初中分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">性相；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">支分。今初：<\/span>其中現法受者，謂即彼果現法成熟。<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二者：<\/span>《本地分》說此復有八，<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">謂顧不顧戀現世二者、饒益心與損害心二者、於三寶等憎害及淨信二者、於父母等饒益損害二者。<\/span>若由增上顧戀意樂，顧戀其身、財物、諸有，造作不善，於現法受。","合註白話":{"same":6},"覺燈日光":null,"時":"59A 21:02","頁":139,"af":"59a","st":1262,"et":1381,"消文":[{"文":"造了以後現在就受的。「增上的顧戀意樂」：貪心非常厲害，對身體、財物種種放不下，這是現法受。"}],"延伸":[{"題":"顧戀其身","組":[{"題":"注重營養身體，就是顧戀","說":[{"類":"破","文":"修學佛法、出了家的人，好像這一點太強的不大有；仔細觀察，毛病來了！"},{"類":"例","文":"平常很注意營養、很注意身體，動不動忙這個——這就是顧戀意樂，「顧戀其身」。"}]},{"題":"醫生與佛說不同，聽佛的","說":[{"類":"回扣","文":"前面一再說：皈投三寶以後，大師是佛，法是佛告訴我們的法，僧是同行者。"},{"類":"立","文":"身體要顧慮，醫生講的要聽；但看看佛怎麼講——醫生講的跟佛講的不一樣時，聽醫生的就錯了。"}]},{"題":"修身越修越堅固，逃不出輪迴","說":[{"類":"破","文":"一天到晚還忙這個，修行修什麼？修那個身！"},{"類":"立","文":"這個身體越修越堅固，逃不走，永遠在生死輪迴當中，而且現法當中就受。"}]}],"說":[{"類":"破","文":"修學佛法、出了家的人，好像這一點太強的不大有；仔細觀察，毛病來了！"},{"類":"例","文":"平常很注意營養、很注意身體，動不動忙這個——這就是顧戀意樂，「顧戀其身」。"},{"類":"回扣","文":"前面一再說：皈投三寶以後，大師是佛，法是佛告訴我們的法，僧是同行者。"},{"類":"立","文":"身體要顧慮，醫生講的要聽；但看看佛怎麼講——醫生講的跟佛講的不一樣時，聽醫生的就錯了。"},{"類":"破","文":"一天到晚還忙這個，修行修什麼？修那個身！"},{"類":"立","文":"這個身體越修越堅固，逃不走，永遠在生死輪迴當中，而且現法當中就受。"}],"af":"59a","st":1262}],"逐字稿":[{"t":"59A 21:02","b":[["q","其中現法受者，謂即彼果現法成熟。〈本地分〉說此復有八，若由增上顧戀意樂，顧戀其身，財物諸有，造作不善，於現法受。"],["s","有一個呢，造了以後現在就受的。那麼〈本地分〉當中，幹什麼？「增上的顧戀意樂」，那個增上的話，就是譬如說你的顧戀意樂就是貪增上的，唉呀，那貪心非常厲害，對那個身體啊，對那個財物啊，種種放不下，這個現法受，這個現法受。所以談到這裡，通常我們一般來說，尤其是修學佛法，尤其是出了家的人，大概這一點太強的不大有。好像太強的不大有，但是實際上我們仔細觀察的話，毛病來了！平常我們注意呀，都很注意營養，很注意身體，哎呀，動不動就忙這個，這個什麼？顧戀意樂。顧戀什麼？「顧戀其身」，這個注意喔！這樣。"]]},{"t":"59A 22:01","b":[["s","所以前面已經一再告訴我們了，你真正地皈投了三寶以後，大師，誰？佛；然後呢，法，是佛告訴我們的法；僧，就是我們的同行者。我們所以出了家了以後，是，因為針對著我們眼前，我們身體要顧慮的，可是不要說：「這個醫生怎麼講的！」是，醫生講的，我們要聽他的，看看佛怎麼講的？如果醫生講的跟佛講的不一樣的時候，聽醫生的，錯了。這個要了解喔，這個要了解喔！然後呢，這個倒還是次要的，平常我們最容易犯的毛病，一天到晚還忙這個。實際上你修行修什麼？你修那個身嘛！對，結果所以你這個身體是會越修越堅固，逃不走，永遠在輪迴在生死當中。這個還會現法當中就受的。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/014.mp3"},{"文":"若由增上不顧意樂，不顧彼等，作諸善法。","口譯":"如果能非常徹底地放下，不貪戀這些而去行善，（也在這一生受報）。","四家合註":"若由增上不顧意樂，不顧彼等，作諸善法。","合註白話":{"same":6},"覺燈日光":null,"時":"59A 23:01","頁":139,"af":"59a","st":1381,"et":1392,"消文":[{"文":"能努力地反過來，這一生也會受；布施、持戒，這個也有。"}],"延伸":[],"逐字稿":[{"t":"59A 23:01","b":[["q","若由增上不顧意樂，不顧彼等，作諸善法。"],["s","喏！你能努力地反過來，這一生也會。布施啊、持戒啊這個也有。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/015.mp3"},{"文":"如是若於諸有情所，增上損惱增上慈悲。又於三寶尊重等所增上憎害，及於此所，增上淨信，勝解意樂。又於父母諸尊重等恩造之所，由增上品，酷暴背恩，所有意樂，所作不善，於現法受。若由增上報恩意樂所作善法，於現法受。","口譯":"同樣的，對眾生非常強烈地傷害、或非常強烈地慈悲；對三寶、師長等非常強烈地憎恨傷害，或非常強烈地清淨信心、深信不疑；又對父母、師長等有恩的人，非常殘暴、忘恩負義而做的惡事，都在這一生受報。如果是以非常強烈的報恩心所做的善事，也在這一生受報。","四家合註":"如是若於諸有情所，增上損惱，增上悲心及饒益心；又於三寶尊重等所，增上憎害，及於此所，增上淨信、勝解意樂；又於父母諸尊重等恩造之所，由酷暴背恩所有意樂，所作不善，於現法受；若由增上報恩意樂所作善法，於現法受。","合註白話":{"same":6},"覺燈日光":null,"時":"59A 23:12","頁":139,"af":"59a","st":1392,"et":1426,"消文":[{"文":"像這些東西，都是現在就受的。"}],"延伸":[],"逐字稿":[{"t":"59A 23:12","b":[["q","如是若於諸有情所，增上損惱增上慈悲。又於三寶尊重等所增上憎害，及於此所，增上淨信，勝解意樂。又於父母諸尊重等恩造之所，由增上品，酷暴背恩，所有意樂，所作不善，於現法受。若由增上報恩意樂所作善法，於現法受。"],["s","這個像這些東西，都是現在就受的，都是現在就受的。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/016.mp3"},{"文":"順生受者，謂於二世當受其果。«順後受者»，謂於三世以後成熟。","口譯":"順生受，是說在第二世受果。順後受，是說在第三世以後才成熟。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、<\/span><span>順生受者：<\/span>謂於二世當受其果。<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第三、<\/span><span>順後受者：<\/span>謂於三世以後成熟。","合註白話":{"same":6},"覺燈日光":null,"時":"59A 23:46","頁":139,"af":"59a","st":1426,"et":1536,"消文":[{"文":"決定受分成三部分：現生就受、第二世受、第三世以後成熟。"}],"延伸":[{"題":"順後受者","組":[{"題":"如法修行，現生後生都好","說":[{"類":"立","文":"真正努力修行，增上生這一生就開始，後生還要好，後生更要好。"},{"類":"立","文":"念佛也好，做什麼也好：最後成佛，下一世往生，這一生還得到種種快樂——所有的修行都是如此。"}]},{"題":"修行反而生病：重業輕受","說":[{"類":"破","文":"很多人修行了，感到的好像不一定如意，這個概念要很清楚。"},{"類":"例","文":"老和尚修行了怎麼老生病？那是造了種種善業現生受：本來要下地獄、旁生，生生被殺被吃來還，這一世一點小病就解決了。"}]},{"題":"認識清楚，越走越歡喜","說":[{"類":"立","文":"認識清楚了，對我們是絕大的鼓勵，走起來非常歡樂，越走越高興、越走越快樂。"}]}],"說":[{"類":"立","文":"真正努力修行，增上生這一生就開始，後生還要好，後生更要好。"},{"類":"立","文":"念佛也好，做什麼也好：最後成佛，下一世往生，這一生還得到種種快樂——所有的修行都是如此。"},{"類":"破","文":"很多人修行了，感到的好像不一定如意，這個概念要很清楚。"},{"類":"例","文":"老和尚修行了怎麼老生病？那是造了種種善業現生受：本來要下地獄、旁生，生生被殺被吃來還，這一世一點小病就解決了。"},{"類":"立","文":"認識清楚了，對我們是絕大的鼓勵，走起來非常歡樂，越走越高興、越走越快樂。"}],"af":"59a","st":1426}],"逐字稿":[{"t":"59A 23:46","b":[["q","順生受者，謂於二世當受其果。順後受者，謂於三世以後成熟。"],["s","所以我們決定受的當中，也分成功三部分，一個就是現生就受，一個就是第二世受，還有一個呢，第三世以後成熟，第三世以後成熟。那麼，如果說我們真正努力修行的話，這個增上生很明白地，這一生就開始，後生還要好，後生更要好！這個就是我們能夠如法的。所以的的確確念佛也好，不管做什麼也好，最後固然是成佛，然後呢，下一世固然是往生，這一生還得到種種快樂耶！當然，所有的修行都是如此，不僅僅是念佛，廣義的，這一點我們要了解，這一點我們要了解。"]]},{"t":"59A 24:44","b":[["s","乃至於有很多人雖然修行了，但是好像他感到的不一定如意吧！這個概念我們要很清楚。比如以我們這裡的老和尚例子為主，欸，他就修行了以後，怎麼老是生病啊？那個就是他造了種種的善業了，現生受；他本來要，造大惡業啊，要下地獄乃至於旁生當中，生生世世被人家殺、吃、還哪，這一世一點小病就解決了。這個非常明顯的，有太多這種例子，所以對於這個概念，我們一定還同樣地要對它認識得很清楚。你認識得很清楚，對我們是一個絕大的鼓勵，然後呢你走起來覺得非常歡樂，越走越高興，越走越快樂。最後一段話說一下。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/017.mp3"},{"文":"於相續中，現有眾多善不善業成熟理者，謂諸重業即先成熟。輕重若等，«於臨終時何者現前»，彼即先熟。若此亦等，則何增上«多串習»者。若此復等，則先所作，彼即先熟。如《俱舍釋》所引頌云：「諸業於生死，隨重近串習，隨先作其中，即前前成熟。」","口譯":"相續中現有眾多善業、不善業，成熟的道理是：重業先成熟。輕重如果相等，臨終時哪一個現前，那一個就先成熟。如果這也相等，那麼哪一個是增上、多串習的，就先成熟。如果這也相等，那麼先造作的先成熟。如《俱舍釋》所引的偈頌說：「諸業在生死中，隨著重的、近的、串習的、先作的，依次先成熟。」","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第三、先熟何業之果者：<\/span>於相續中現有眾多善不善業成熟理者，謂諸重業即先成熟。輕重若等，於臨終時何者現前，彼即先熟。若此亦等，則何增上多串習者。若此復等，則先所作，彼即先熟。如《俱舍釋》所引頌云：「諸<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-ba\">相續中有眾多<\/span>業於生死<span>中<\/span>，<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-ba\">感果之理者，謂於其中<\/span>隨重近串習，隨先作其中，即前前成熟。」<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-yu\">師云：「此復佛子博朵瓦以喻說之，謂如一大河渡口，雖有眾多先至之人，然若有第巴霍札之輩，則因彼權重，當先渡之。若權勢相等，則未至棧橋者，仍不得渡，故誰近棧橋者便得渡之。若俱得棧橋，則視誰與船夫宿為熟識者得渡之。若此一切皆相等者，則視最初誰先呈請者得渡之。」<\/span>","合註白話":{"id":"17115","頁":471,"白話":"第三科、哪個業的果報最先成熟：眾多存在於心續中的善不善業，其成熟方式為：哪一個業較重，就會最先成熟；如果輕重相等，哪一個在臨終時現起，就會先成熟。如果在這點上也相等，則視何者串習得較為強烈。如果在這點上還是相等，當初先造作哪一個，就會先行成熟。如同《俱舍釋》中引述經文道：「存在於心續的眾多業，在輪迴當中感果的方式，其中哪個為重、哪個靠近、哪個熟習、哪個先作，其中越是前者就越先成熟。」上師說：「另外，如同佛子博朵瓦大師從譬喻的角度說到，就像在一條大河的渡口，雖然同時有許多人很早就抵達，但是如果出現一位第巴霍札，由於他權勢較大，必須讓他先渡河。如果是與他勢力相當，但是沒有到達棧橋的話，也無法過河，所以誰靠近棧橋，誰就先過河。如果同樣都在棧橋，則視誰與船夫過去交情較深，誰就先過河。如果這些全都相等，則視誰先申請過河，誰就能先過河。」","注釋":["第三先熟何業之果者：即前頁442「先熟何果」一科。","如《俱舍釋》所引頌云：引文陳真諦三藏譯《阿毘達磨俱舍釋論·破說我品》作：「若重近數習，及昔作諸業，先先先後熟，於輪轉有續。」唐玄奘大師譯《阿毘達磨俱舍論·破執我品》作：「業極重近起，數習先所作，前前前後熟。」慧海大師引三世貢唐大師的話提到：如同《俱舍釋》此段所說，在懺悔、防護時，首先先懺除重業，其次懺除串習較強烈的業，其次懺除此生先造作的業等等。如果能先懺除會先成熟的業，就有懺悔的時間。夏日東活佛亦引此段補充說明。參見《夏日東文集》冊1，頁423；《廣論講授筆記》，頁39。引文見《大正藏》冊29，頁310、159；《丹珠爾》對勘本冊79，頁908。","第巴霍札：本指掌管文書的小官，此處泛指有權勢地位的官吏。","得渡之：這段文中，擁有權位的第巴霍札，比喻重業先熟；近棧橋者，比喻臨近死亡時所造的業先熟；與船夫宿為熟識者，比喻常串習的業先熟；先呈請者，比喻當前三者的條件相等時，先作的業先熟。"],"已校":true},"覺燈日光":null,"時":"59A 25:36","頁":139,"af":"59a","st":1536,"et":null,"消文":[{"文":"相續中有無量無邊各式各樣的業，哪一個先感果？第一，重業一定先成熟；輕重相前面已經說過。"},{"文":"沒有特別重的，就看臨終那時哪一個現起。"},{"文":"偈子再念一遍：第一隨重，第二隨近，第三串習就是習慣，第四上面都沒有，最先作的最先成熟——「前前成熟」。"}],"延伸":[{"題":"於臨終時何者現前","組":[{"題":"臨終助念的道理","說":[{"類":"立","文":"這就是為什麼臨終要助念：求往生的固然；不往生的、乃至平常不信佛的，臨終提醒他，他跟那個相應也好。"}]},{"題":"提醒一生好事，相應即好","說":[{"類":"例","文":"告訴他：「你一生造了很多好事，這一生苦不堪言沒意思，完了以後生天去了。」他想起來歡喜了，心裡相應。"},{"類":"立","文":"最靠近臨終的時候把這一個引起來，就是第二個「近」。"}]},{"題":"佛像長幡接引","說":[{"類":"例","文":"所以西方當時臨終一定用佛像、用長幡接引他，有它的道理，就是指第二點。"}]}],"說":[{"類":"立","文":"這就是為什麼臨終要助念：求往生的固然；不往生的、乃至平常不信佛的，臨終提醒他，他跟那個相應也好。"},{"類":"例","文":"告訴他：「你一生造了很多好事，這一生苦不堪言沒意思，完了以後生天去了。」他想起來歡喜了，心裡相應。"},{"類":"立","文":"最靠近臨終的時候把這一個引起來，就是第二個「近」。"},{"類":"例","文":"所以西方當時臨終一定用佛像、用長幡接引他，有它的道理，就是指第二點。"}],"af":"59a","st":1536},{"題":"多串習","組":[{"題":"習性往往多生多劫","說":[{"類":"回扣","文":"前面說不要說無故思，習性非常厲害；對我們極大部分來說，就是這個習性。"},{"類":"立","文":"這個習性往往不是這一生造成，多生多劫——等流習氣的重就是這樣。"}]},{"題":"修行最要改無始習染","說":[{"類":"下手","文":"現在修行最重要的，就是把無始的習染改過來。"}]},{"題":"業果是修行的主要概念","說":[{"類":"立","文":"到這裡，善惡業基本的概念都有了；整個修行的主要概念全在這裡，下面都從這裡一步步來。"},{"類":"立","文":"有了這個概念，參禪、念佛、學教，乃至世間為什麼感惡果、自己為什麼有這個習慣，每一處都這麼清楚。"}]}],"說":[{"類":"回扣","文":"前面說不要說無故思，習性非常厲害；對我們極大部分來說，就是這個習性。"},{"類":"立","文":"這個習性往往不是這一生造成，多生多劫——等流習氣的重就是這樣。"},{"類":"下手","文":"現在修行最重要的，就是把無始的習染改過來。"},{"類":"立","文":"到這裡，善惡業基本的概念都有了；整個修行的主要概念全在這裡，下面都從這裡一步步來。"},{"類":"立","文":"有了這個概念，參禪、念佛、學教，乃至世間為什麼感惡果、自己為什麼有這個習慣，每一處都這麼清楚。"}],"af":"59a","st":1645},{"題":"業果基礎總複習","組":[{"題":"前面了解了，後面才跟得上","說":[{"類":"回扣","文":"今天翻到一百三十九頁：總的業果關係、黑業白業及其果、具力業、輕重、引滿、定不定，都要了解。"},{"類":"破","文":"前面沒聽、覺得聽不懂，再看前面更糟——好像這樣，其實恰恰相反。"},{"類":"下手","文":"沒聽的人一定要補聽：前面的基礎慢慢了解了，後面自然都懂，因為這是有層次的。"}]},{"題":"把握基礎，才能運用修持","說":[{"類":"立","文":"每一處完了都要把握住；更深入時就是利用前面這些基礎，會運用才能修持有得。"}]}],"說":[{"類":"回扣","文":"今天翻到一百三十九頁：總的業果關係、黑業白業及其果、具力業、輕重、引滿、定不定，都要了解。"},{"類":"破","文":"前面沒聽、覺得聽不懂，再看前面更糟——好像這樣，其實恰恰相反。"},{"類":"下手","文":"沒聽的人一定要補聽：前面的基礎慢慢了解了，後面自然都懂，因為這是有層次的。"},{"類":"立","文":"每一處完了都要把握住；更深入時就是利用前面這些基礎，會運用才能修持有得。"}],"複習":true,"af":"59b","st":3}],"逐字稿":[{"t":"59A 25:36","b":[["q","於相續中，現有眾多善不善業成熟理者，謂諸重業即先成熟。輕重若等，於臨終時何者現前，彼即先熟。若此亦等，則何增上多串習者。若此復等，則先所作，彼即先熟。如《俱舍釋》所引頌云：「諸業於生死，隨重近串習，隨先作其中，即前前成熟。」"],["s","那麼，現在我們相續當中有不曉得無量無邊的各式各樣的業，有善、有不善，那麼哪一個先成熟，換句話說哪一個先感果呢？喏！這個分出來了。第一個，重業一定先成熟，這個業越重。那麼重的，輕重相前面已經說過了，對吧！輕重相前面已經說過了。假定說沒有特別重，輕重等的話，那麼怎麼辦呢？就是臨終的時候，那個時候哪一個東西現起。這一點是為什麼我們臨終的要助念的關係。就是他如果說求往生的，固然；就是不往生的，乃至於平常不信佛的，你臨終的時候能夠提醒他那個東西，他跟那個相應，他也好。"]]},{"t":"59A 26:51","b":[["s","實際上呢，臨終的提醒不但如此，還告訴他：「哎呀，你一生造了很多好事啊，這一生苦不堪言，沒意思！你現在完了以後，生天去了。」你能夠提醒他，欸，他想起歡喜了。那個時候他心裡面這個相應的話，他想這個，就是最靠近臨終的時候，把這一個引起來，這是第二個，這樣。所以「西方當時」，他臨終的時候，一定用那個佛像、用長幡接引他等等，這個是有他的道理的，就是指第二點。"]]},{"t":"59A 27:25","b":[["s","「此」 ─如果相等的話，那麼下面呢，習慣，就是你的習性、習性。所以前面說，不要說無故思喔，這個習性非常厲害。對我們極大部分來說，就是這個習性。而且這個習性哪，往往不是這一生造成，多生多劫，所以這個等流習氣的重，就是這個樣。我們現在修行最重要的就是什麼呢？把這個無始的習染改過來。那麼假定是這個也沒有的話，那麼先作的先成熟，你越是前面先作的，那是先成熟。下面就是《俱舍》上面告訴我們這個道理的一個偈子，這個偈子，大家只要念一下。我再念一遍：「諸業」，這個業在生死當中，哪一個先成熟？第一個，隨重；第二個，隨近；第三個，習慣，串習就是習慣；第四個，前面上面都沒有的話，最先作的最先成熟，所以「前前成熟」。"]]},{"t":"59A 28:36","b":[["s","到這地方，那麼關於這個善惡業的基本的概念都已經有了，基本的概念都有了。凡是對這個道理不（編者按：錄音帶中間切斷） ……清楚，整個的修行的主要的概念全部在這裡，所以下面的都從這地方一步步來的。當然這個次第很清楚，你所以今天能夠達到這個，一定還有前面的這個層次一步一步、一步一步 ……這麼來。然後呢有了這個概念以後，不管是參禪、念佛、學教乃至於世間他為什麼這樣，他為什麼感到這個惡果，然後呢你觀察自己的話，你也曉得了。起心動念的時候固然你知道，不起心動念你也知道，為什麼你會有這個習慣，為什麼會有這個樣，每一個地方就這麼清楚、就這麼明白！"]]},{"t":"59B 00:03","b":[["s","今天請翻到《廣論》一百三十九頁，這個關於業那個部分，這個總的業、果之間的道理、關係，我們已經有了一個基本的認識。那麼什麼是黑業，黑業的果；什麼是白業，白業的果，以及這個業感果當中，幾個特別的相關的什麼具力的業，還有它什麼樣是輕重，還有呢什麼是引業、滿業，定、不定這種概念都要了解。你前面的了解了，你後面才跟得上，前面的不了解，你後面是越聽越糊塗。所以我特別說明，你凡是前面沒有聽的人，一定要補聽的原因。是的，現在你聽的覺得聽不懂啊，於是你感覺到：唉呀，這個地方聽不懂，再去看前面的更糟糕啊！好像有這樣的。實際上呢恰恰相反，你把前面的基礎慢慢地了解了，後面自然而然都懂，因為這個是有層次的嘛！這個有層次的，你們這個概念一定要了解。同樣的道理，說每一個地方你完了以後，你必須要把握住，那麼這個後面更深入的時候，更深入就是利用前面這些基礎，你利用的時候你才會運用它，能夠運用才能夠修持有得。那麼下面那個叫："]]}],"口譯音":"口譯音檔/shenxin-yeguo-13/018.mp3"}],"投影片":[{"img":"投影片/shenxin-yeguo-13/001.webp","n":1},{"img":"投影片/shenxin-yeguo-13/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/shenxin-yeguo-13/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/shenxin-yeguo-13/004.webp","n":4},{"img":"投影片/shenxin-yeguo-13/005.webp","n":5},{"img":"投影片/shenxin-yeguo-13/006.webp","n":6},{"img":"投影片/shenxin-yeguo-13/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=59a&st1=242&et1=468","box":[0.133625,0.3091111111111111,0.13775,0.07733333333333334]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-13/008.webp","n":8},{"img":"投影片/shenxin-yeguo-13/009.webp","n":9},{"img":"投影片/shenxin-yeguo-13/010.webp","n":10,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=59a&st1=475&et1=745","box":[0.546125,0.29466666666666663,0.1365,0.06844444444444445]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/shenxin-yeguo-13/011.webp","n":11},{"img":"投影片/shenxin-yeguo-13/012.webp","n":12},{"img":"投影片/shenxin-yeguo-13/013.webp","n":13,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=59a&st1=763&et1=1037","box":[0.128625,0.3002222222222222,0.1315,0.06622222222222222]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-13/014.webp","n":14},{"im
