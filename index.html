/gl1/072A.mp3","remote":"https://lamrim.xyz/player/media/gl1/072A.mp3"},"72b":{"local":"音檔/gl1/072B.mp3","remote":"https://lamrim.xyz/player/media/gl1/072B.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=72a&st1=73&af2=72b&et2=809","段":[{"文":"如負重擔，隨其重擔當負幾久，便有爾許不樂，取蘊重擔亦爾，","口譯":"如同背負重擔，隨著那重擔要背負多久，就有多久的不樂；取蘊的重擔也是這樣，","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 01:13","頁":167,"af":"72a","st":73,"et":130,"消文":[{"文":"苦諦的根本就在五取蘊，就是我們的身心；簡單說就是平常講的「我」，每個人自己的主體。"},{"類":"喻","文":"像挑了幾百斤的重擔，只要擔子還在身上沒卸下來，痛苦一直在，快樂永遠沒辦法解決。"},{"文":"「取蘊重擔亦爾」，這一句話我們要著眼。"}],"延伸":[],"逐字稿":[{"t":"72A 01:13","b":[["q","如負重擔，隨其重擔當負幾久，便有爾許不樂，取蘊重擔亦爾，"],["s","它真正的這個苦諦的根本在哪裡？就在那個五取蘊，換句話說，哪！就是我們的身心。簡單來說，就是說平常我們講的這個我，任何一個人，他那個人他自己的主體。就像挑了一個幾百斤的重擔一樣，只要他那個擔子還在身上沒有卸下來，對不起，那個痛苦一直在，那個快樂永遠沒有辦法解決。所以說「取蘊重擔亦爾」，這一句話我們要著眼。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/001.mp3"},{"文":"乃至«執持»爾時受苦，","口譯":"只要還執持著，那時就會受苦，","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 02:10","頁":167,"af":"72a","st":130,"et":214,"消文":[{"文":"只要沒有對治把它徹底解決，那時就是「執持」；只要它還在執著，那時一定受苦。"}],"延伸":[{"題":"執持","組":[{"題":"執持即我執法執","說":[{"類":"立","文":"執持是心裡無始以來的習氣，不知不覺一直在這個上頭，所以叫我執、法執。"}]},{"題":"從名詞找到內涵","說":[{"類":"破","文":"平常都這麼說，可是我執是什麼？法執是什麼？不知道；認得兩個名字，對解決真實問題眼前沒有用場。"},{"類":"下手","文":"必定要從這兩個名詞上，找到名詞所指的內涵；找到了內涵，那時才可以把它拿掉。"}]}],"說":[{"類":"立","文":"執持是心裡無始以來的習氣，不知不覺一直在這個上頭，所以叫我執、法執。"},{"類":"破","文":"平常都這麼說，可是我執是什麼？法執是什麼？不知道；認得兩個名字，對解決真實問題眼前沒有用場。"},{"類":"下手","文":"必定要從這兩個名詞上，找到名詞所指的內涵；找到了內涵，那時才可以把它拿掉。"}],"af":"72a","st":140}],"逐字稿":[{"t":"72A 02:10","b":[["q","乃至執持爾時受苦，"],["s","只要你沒有對治把它徹底地解決，那個時候就是「執持」。這個執持是心裡面無始以來的習氣，不知不覺當中一直在這個上頭，所以叫我執、法執。平常我們都這麼說，可是我執是什麼？不知道。法執是什麼？不知道。那這種狀態當中，你認得兩個名字，對於我們解決這個真實問題，眼前並沒有用場，而這個苦惱卻是眼前逼在這個地方。所以你必定要從這兩個名詞上面，找到名詞所指的內涵何在，找到了這個內涵，那個時候你才可以把它拿掉。所以說這個「執持」，那就是，喏！這兩個名詞所代表的實際的意義，只要它還在執著著，那時候一定受苦。那麼，為什麼呀？"]]}],"口譯音":"口譯音檔/siwei-kudi-07/002.mp3"},{"文":"以此蘊中有苦煩惱粗重安住，故為行苦。","口譯":"因為這個身心裡，一直藏著苦和煩惱的種子（粗重），所以叫做「行苦」。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 03:34","頁":167,"af":"72a","st":214,"et":297,"消文":[{"文":"這個蘊當中，苦的根本「煩惱粗重」就在裡頭，所以叫行苦。"},{"文":"眼前雖然沒現出來，它一直向前不停；不是真的不苦，只是好像沒受大苦，隨時遇到緣，苦性就顯發出來。"},{"文":"這個緣是無量劫以來集的；這是我們生死大痛苦的重擔，要對治的就在這裡。"},{"文":"這一點不認識，所有的佛法無根本，沒有建立處。"}],"延伸":[],"逐字稿":[{"t":"72A 03:34","b":[["q","以此蘊中有苦煩惱粗重安住，故為行苦。"],["s","在這個蘊當中，就是這個苦的根本是「煩惱粗重」，就在這個裡頭，就在這個裡頭，所以這個叫作「行苦」。眼前雖然沒現出來，但是它隨時一直在向前不停的；既然不停的話，並不安住在眼前好像不苦那個階段。不是真的不苦哦，只是好像沒有受大苦，但是一直推動的話，它隨時遇到緣，哪！那個苦性就馬上顯發出來。而這個緣也就是我們無量劫以來集的，不曉得多多少少，這個是我們要了解的。所以真正講的這個苦的種種，最後我們要認識的，就是認識說：哦！原來就在這個上頭，這個是我們生死大痛苦的重擔，所以要對治的就在這個地方。所以關於這一點你不認識的話，那所有的佛法無根本，沒有建立處。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/003.mp3"},{"文":"既有此已，雖於現在苦受未生，然其無間由種種門能起眾苦，","口譯":"既然有了這個身心，就算現在還沒有痛苦的感受，它隨時都會從各個方面生出種種苦，","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 04:57","頁":167,"af":"72a","st":297,"et":328,"消文":[{"文":"只要這個蘊在，煩惱的粗重就安住在上頭；現在雖然沒有生苦，「無間」不停地，遇到內外種種的緣，苦就起來了。"}],"延伸":[],"逐字稿":[{"t":"72A 04:57","b":[["q","既有此已，雖於現在苦受未生，然其無間由種種門能起眾苦，"],["s","這只要一旦這個蘊在，因為蘊在，所以煩惱的粗重就安住在這個上頭。在這種狀態，現在雖然沒有生苦，但是「無間」 ─不停地，讓那個不同的門，遇種種的緣，內、外的等等，那苦就起來了。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/004.mp3"},{"文":"故此行苦，徧一切苦及是所餘二苦根本，故應於此«多修厭離»。","口譯":"所以這個行苦，遍於一切苦，並且是其餘二苦（苦苦、壞苦）的根本，所以應當對此多修厭離。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 05:28","頁":167,"af":"72a","st":328,"et":599,"消文":[{"文":"最後歸結到應該了解的：這個苦是徧一切處的，在我們感受上卻偏偏感受不到。"},{"文":"平常一直講苦，從來不注意佛告訴我們苦諦的苦，要找的根本卻在這個地方。"}],"延伸":[{"題":"多修厭離","組":[{"題":"感受不到，只是人天乘","說":[{"類":"破","文":"這個如果感受不到，所謂佛法最多只是人天乘；人天乘另一個名字叫「三世怨」，你願意做三世怨的事嗎？"},{"類":"破","文":"太多人修學佛法，說佛法好，好在哪裡不一定知道；從什麼地方開始修也不知道。"}]},{"題":"生老病死，不待人教","說":[{"類":"喻","文":"說世間苦，就說生老病死；這種事還要人家告訴，我們實在太笨，動物碰見痛苦也曉得避免。"},{"類":"回扣","文":"這是根本所在，務必在這個地方注意。"}]},{"題":"多思惟修習，生起相應量","說":[{"類":"立","文":"了解不是就行：理論上雖然如此，眼前感受上很難體會。"},{"類":"下手","文":"必定要多思惟、多修習，一直到內心生起相應的量，那時會生起大厭離；修學佛法第一個根本厭離心，必定從這裡出來。"},{"類":"破","文":"沒辦法真正感受到，單單了解，又是三世怨，變成世間很聰明的那些人。"}]},{"題":"智者視善趣如那洛迦","說":[{"類":"立","文":"厭離心生起來以後，哪怕生到天上，深深了解行苦自性還沒有解脫，所以「智者視善趣等同那洛迦」。"},{"類":"因","文":"只要那個取蘊還在，問題沒有解決。"}]},{"題":"如理去做，便有感受","說":[{"類":"例","文":"最近開始說懺悔等等，就有同學產生不同的感受；產生感受的，都是能如理去做的人。"},{"類":"立","文":"懂得很多卻放逸而轉，不相應，沒有用；知道得少，做了馬上得到好處。"},{"類":"破","文":"不要誤解成「那就不要懂得很多」：如法懂得一點就得一點好處，懂得更多好處更多。"}]}],"說":[{"類":"破","文":"這個如果感受不到，所謂佛法最多只是人天乘；人天乘另一個名字叫「三世怨」，你願意做三世怨的事嗎？"},{"類":"破","文":"太多人修學佛法，說佛法好，好在哪裡不一定知道；從什麼地方開始修也不知道。"},{"類":"喻","文":"說世間苦，就說生老病死；這種事還要人家告訴，我們實在太笨，動物碰見痛苦也曉得避免。"},{"類":"回扣","文":"這是根本所在，務必在這個地方注意。"},{"類":"立","文":"了解不是就行：理論上雖然如此，眼前感受上很難體會。"},{"類":"下手","文":"必定要多思惟、多修習，一直到內心生起相應的量，那時會生起大厭離；修學佛法第一個根本厭離心，必定從這裡出來。"},{"類":"破","文":"沒辦法真正感受到，單單了解，又是三世怨，變成世間很聰明的那些人。"},{"類":"立","文":"厭離心生起來以後，哪怕生到天上，深深了解行苦自性還沒有解脫，所以「智者視善趣等同那洛迦」。"},{"類":"因","文":"只要那個取蘊還在，問題沒有解決。"},{"類":"例","文":"最近開始說懺悔等等，就有同學產生不同的感受；產生感受的，都是能如理去做的人。"},{"類":"立","文":"懂得很多卻放逸而轉，不相應，沒有用；知道得少，做了馬上得到好處。"},{"類":"破","文":"不要誤解成「那就不要懂得很多」：如法懂得一點就得一點好處，懂得更多好處更多。"}],"af":"72a","st":350}],"逐字稿":[{"t":"72A 05:28","b":[["q","故此行苦，徧一切苦及是所餘二苦根本，故應於此多修厭離。"],["s","這就是我們最後歸結到應該了解的，這個苦是徧一切處的。實際上在我們感受，卻偏偏感受不到。我們平常一直講苦，從來不注意佛告訴我們真正的苦諦的苦，要找到根本，卻是在這個地方，這個就是我們平常感受不到的。所以說這個如果你感受不到的，所謂佛法始終最多只是人天乘，而人天乘我們另外一個名字來說它叫作「三世怨」，你願意做那個三世怨的事情嗎？這一點我們特別了解、特別注意！尤其是平常，我們太多人修學佛法，說是佛法好的，好在哪裡？不一定知道。要修行，如何修行啊？從什麼地方開始啊？啊，說世間是苦，苦在哪裡呀？唉呀，說這個生、老、病、死，是，如果說這種事情還要人家來告訴你的話，我們實在太笨！不要說個動物牠碰見這種痛苦，牠也曉得避免，而我們作為一個人，難道要懂得的就懂得這一些嗎？這個是它根本所在，我們務必在這個地方應該注意！"]]},{"t":"72A 06:59","b":[["s","那麼現在呢，了解到了，不是了解就行啊，前面一再說、一再說：這個認識，理論上雖然如此，但是呢眼前的感受上面，是你很難體會到的。所以你必定要思惟、多思惟，修習、多修習，一直等到內心生起相應的量，那時候你會生起大厭離，那就對了！所以修學佛法它第一個根本 ─厭離心，必定從這裡出來。等到你一旦這個厭離心生起來了以後，那個時候哪怕生到天上，因為你深深地了解這個行苦的自性，還沒有解脫，所以說智者視善趣等同那洛迦。真正有智慧，能夠如理了解世間真相，這真相是苦諦的，這種人把天上面的這種快樂，看得像地獄一樣，原因就在這裡。因為這是行蘊自性，只要那個取蘊還在，問題沒有解決。最後再說一遍，這問題的關鍵不但是了解，而要怎麼樣去內心感受到，這是個大學問。如果你沒有辦法真正感受到，單單了解的話，那又是個三世怨，就變成世間很聰明的那些人。"]]},{"t":"72A 08:35","b":[["s","所以最近漸漸地、慢慢地我們開始說懺悔或者什麼等等，就有不同的同學就產生不同的感受。而這種產生感受的，實際上都是什麼？那都是他能夠如理去做的人，如理去做的人。所以經上面一再告訴我們，雖然你懂得很多，但是你放逸而轉，不相應，沒有用；反過來你雖然知道的很少，你做了，馬上就會得到好處。不過這地方我們不要誤解：那既然如此，我們不要懂得很多了。不是！你如法地懂得一點馬上得到好處，你能夠懂得更多，好處更多。這個地方就告訴我們，你把了解的如法行持，跟它相應，體會到它真正的好處。那麼這個是大概我們已經有一個認識了。下面又特別地說明，關於壞苦 ─樂受這件事情，因為這是我們最難破的，假定這個破掉了，下面的問題就比較容易。看文："]]}],"口譯音":"口譯音檔/siwei-kudi-07/005.mp3"},{"文":"又能增貪現前樂受，多是於苦，漸息滅位妄起樂覺，全無不待除苦所顯自性之樂。","口譯":"又，那能增長貪欲的現前樂受，大多是在苦漸漸息滅的階段，虛妄地生起樂的感覺；完全沒有不依待苦的除去而顯現的、自性的快樂。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 09:59","頁":167,"af":"72a","st":599,"et":713,"消文":[{"文":"眼前很多快樂的事情，都是不認識、誤解、顛倒的妄見；它能增長貪毒，而貪毒是引發生死最主要的主因。"},{"文":"這都是苦的「漸息滅位」：苦慢慢減輕，對前面大苦來說減輕一點，好像是樂，「妄」就是錯誤的感覺。"},{"文":"「全無不待除苦所顯」：是苦除的時候顯出來的，本性絕對沒有快樂，本質上絕對是苦。"}],"延伸":[],"逐字稿":[{"t":"72A 09:59","b":[["q","又能增貪現前樂受，多是於苦，漸息滅位妄起樂覺，全無不待除苦所顯自性之樂。"],["s","說眼前很多快樂的事情，這個都是不認識，誤解、顛倒的一種妄見，這個東西有它的絕大缺點，能夠增長我們的貪毒，而貪毒是引發生死的最主要的一個主因。實際上這個真的樂嗎？不是的呀！這都是苦的「漸息滅位」 ─它是苦，可是這個苦慢慢地、慢慢地在減輕當中。當在漸漸減輕當中的，欸，你覺得在輕了、輕了，於是對前面這個大苦來說，既然減輕了一點，好像這是樂，所以你「妄」，就是錯誤的感覺，以為它是樂。它並沒有實質上面本來應該樂的，本性是樂的這個實質沒有，實質沒有。所以「全無不待除苦所顯」，因為這是苦漸漸減少，所以當苦除的時候顯出來的，不是它本性，本性絕對沒有快樂的，本質上面絕對是苦的。馬上用一個事實來說明：譬如說你呀一直走，走得很長，走得很多的路，下面說，以為苦。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/006.mp3"},{"文":"譬如太走為苦，略為住息遂生樂覺，現見此是先生大苦，漸息滅時樂漸次起，故非性樂。若太久坐，仍復如前，生眾苦故。","口譯":"譬如走得太久成為苦，稍微停下休息，就生起樂的感覺；可以現見這是先生起了大苦，在苦漸漸息滅時，樂才漸次生起，所以不是自性的樂。如果坐得太久，又會像前面一樣，生起眾苦的緣故。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 11:53","頁":167,"af":"72a","st":713,"et":819,"消文":[{"文":"跑了很久，暫時停一下、坐一下，覺得好舒服、好快樂。"},{"文":"事實是當下有很大的苦惱，停一下大苦漸漸減少消失；減輕的感覺妄起樂想，不是本質快樂。"},{"類":"喻","文":"假定坐下是快樂的，應該越坐越快樂；就像賺錢，賺得越多越好。"},{"文":"結果叫你老坐在那裡，不但不快樂，又苦得要命，要站起來走一走；睡、吃也一樣，沒有一個例外。"}],"延伸":[],"逐字稿":[{"t":"72A 11:53","b":[["q","譬如太走為苦，略為住息遂生樂覺。"],["s","跑了很久以後，暫時叫你停一下、坐一下，唉呀，覺得那時候好舒服、好快樂！那是什麼？那個是因為啊 ─"]]},{"t":"72A 12:11","b":[["q","現見此是先生大苦，漸息滅時樂漸次起，故非性樂。"],["s","這事實是當下就有很大的苦惱，那麼你停一下呢，那個大的苦惱漸漸地減少，漸漸地消失，所以你這個減輕的感覺，妄起樂想，而不是這件事情本身、本質快樂，它本質不快樂。所以他下面緊跟著這個問題，假定說坐下來是快樂的話，那應該越坐越快樂，因為它本來是快樂的嘛。就像賺錢一樣，賺一塊錢固然賺，越賺是賺得越多是越好，應該這個樣啊！同樣的道理，如果是這個坐下來是快樂的話，坐得越久是越快樂呀！所以下面說，"]]},{"t":"72A 13:12","b":[["q","若太久坐，仍復如前，生眾苦故。"],["s","結果叫你老坐在那裡呀，欸，它不但不快樂，你又苦得要命。所以叫你老坐在那裡，你坐了多久啊，你要站起來去走一走。為什麼？又苦得苦不堪言。苦，就是這樣，坐；然後呢叫你睡，又是這樣；叫你吃，沒有一個例外的。所以他下面說："]]}],"口譯音":"口譯音檔/siwei-kudi-07/007.mp3"},{"文":"若是性樂之因者，應如苦因，隨其習近，其苦漸增，如是習近行住坐臥，飲食日陰等，亦應隨其幾久習近，便有爾許安樂漸起，現見太久唯生苦故。","口譯":"如果是自性之樂的因，就應當像苦因一樣：隨著習近它，苦就漸漸增加；同樣地，習近行住坐臥、飲食、日曬、陰涼等，也應當隨著習近多久，就有多少安樂漸漸生起。然而現見習近太久，唯有生苦的緣故。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 13:39","頁":167,"af":"72a","st":819,"et":1004,"消文":[{"文":"假定本質是快樂，就像苦一樣，坐得越久快樂越多；苦本來就是苦，時間越久越難受。"},{"文":"快樂的事情卻不是：剛換一換覺得快樂，過一下快樂消失，再下去苦得受不了；說明本性不是快樂而是苦。"},{"文":"行住坐臥沒有例外：走了想坐，坐了要睡，叫你老躺在床上也躺不住；是大苦漸漸息滅所生的相對感覺，這就是無明。"},{"類":"例","文":"飲食日陰：渴了飲、餓了食、寒了曬太陽、熱了找陰涼；太陽越曬越大又受不了，吃到後來胃口也沒有了。"},{"文":"樂的本質是虛妄的，只是苦的漸息滅位，這一點非常重要；弄久了，結果總是苦。"}],"延伸":[],"逐字稿":[{"t":"72A 13:39","b":[["q","若是性樂之因者，應如苦因，隨其習近，其苦漸增，如是習近行住坐臥，飲食日陰等，亦應隨其幾久習近，便有爾許安樂漸起，"],["s","喏！假定這個快樂本性、本質是快樂的話，就像苦一樣的話，應該怎麼樣呢？你坐得越久，那麼這個快樂越多。天下的苦本來就是苦的，這個苦的時間越久，痛苦越難受、越厲害。為什麼呀？因為它本性就是苦的。這快樂的事情卻不是，剛開始的時候，你換一換覺得快樂了，過了一下快樂慢慢地消失掉了，再繼續下去那個快樂就沒有，苦了，再下去就苦得受不了了！這個說明什麼？說明它本性不是真正的快樂，而是苦！所以這個我們要自己如理認識，如果你們聽懂了，就應該沒問題，不聽懂回去仔細想一想，這個概念非常重要！"]]},{"t":"72A 14:55","b":[["s","就像同樣的道理，你走久了以後坐，坐久了以後又要換一個，「如是習近行住坐臥」，沒有一個例外的。啊！你說走了半天又想坐一下，坐了半天又不行，要睡一下，睡了一下又要站起來，叫你老躺在床上你也躺不住。為什麼？它始終是同一個道理，這是大苦的漸漸息滅所生起的，相對的這種感覺，只是減少一點，它本質還是苦，就是我們這個妄想顛倒，所以叫無明嘛！"]]},{"t":"72A 15:36","b":[["s","除了這個以外，「飲食日陰」，當你渴的時候 ─飲；餓的時候是食；寒的時候是日；日的時候是陰，都是這個樣。啊！說今天冷了，曬曬太陽，然後呢太陽越來越大，你又受不了了。假定曬太陽是快樂的，應該越曬越快樂啊！又不是，沒有一個例外的。乃至於飲食，你倒吃吃看！唉呀，吃到後來，吃得難受得不得了，到後來不但是肚子吃壞了，你胃口也沒有了，沒有一樣不是這樣的！所以所有的這些事情都是什麼？都是苦的漸息滅位。從這個上面我們就認得，哦，原來這個樂的本質是虛妄的，只是苦的漸息滅位，這一點非常重要、非常重要！非常重要、非常重要！所以在這一種狀態啊，"]]},{"t":"72A 16:36","b":[["q","現見太久唯生苦故。"],["s","你只要弄久了，結果總是苦，總是苦。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/008.mp3"},{"文":"如是亦如《入胎經》云：「難陀，行住坐臥諸威儀中，應當了知別別是苦。諸靜慮師應觀彼彼威儀自性，若行度日不住不坐不臥，彼則於行唯別受苦，別別領受猛性，粗性，難可忍性，非悅意性，非於其行，起安樂想。」餘三威儀亦如是說。","口譯":"又如《入胎經》說：「難陀，在行住坐臥各種威儀中，應當了知各個都是苦。各位修靜慮的人應當觀察各種威儀的自性：如果整天只是行走，不住、不坐、不臥，那麼他在行走中就唯獨承受苦，各別領受猛烈的、粗重的、難以忍受的、不悅意的感受，而不會對行走生起安樂想。」其餘三種威儀也是這樣說。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 16:44","頁":167,"af":"72a","st":1004,"et":1070,"消文":[{"文":"說明了道理，馬上告訴我們經上也是這樣說。"},{"文":"每一件事情，個別個別沒有一個例外，都是苦；真正是粗、猛而難以忍受的痛苦。"},{"文":"「諸靜慮師應觀彼彼威儀自性，若行度日不住不坐不臥，彼則於行唯別受苦」：師父沒有唸，直接接下句。"},{"文":"絕對不能從這上面妄想以為快樂；不但行住坐臥，前面說的飲食日陰，世間沒有一個例外。"}],"延伸":[],"逐字稿":[{"t":"72A 16:44","b":[["q","如是亦如《入胎經》云："],["s","那麼說明了這個道理，馬上告訴我們，經上面的就是這樣說的。說："]]},{"t":"72A 16:53","b":[["q","「難陀，行住坐臥諸威儀中，應當了知別別是苦。"],["s","這個每一件事情，個別個別沒有一個例外，都是苦。所以："]]},{"t":"72A 17:10","b":[["q","別別領受猛性，粗性，難可忍性，非悅意性。"],["s","每一件事情，它真正的是粗、猛而難以忍受的這種痛苦啊！"]]},{"t":"72A 17:26","b":[["q","非於其行，起安樂想。」"],["s","絕對不能從這個上面妄想以為快樂。行是如此，「餘三威儀亦如是說」，不但是行住坐臥，其他的所有的，前面說飲食日陰，世間沒有一個例外的呀！繼續又說："]]}],"口譯音":"口譯音檔/siwei-kudi-07/009.mp3"},{"文":"「難陀，然由彼彼威儀之苦，暫間斷故，遂於餘餘新生眾苦，妄起樂想。難陀，生唯苦生，滅唯苦滅，生唯行生，滅唯行滅。」","口譯":"「難陀，然而由於各個威儀的苦暫時間斷，於是就對其餘新生起的眾苦，虛妄地生起樂想。難陀，生起的唯是苦的生起，滅去的唯是苦的滅去；生起的唯是行的生起，滅去的唯是行的滅去。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 17:50","頁":167,"af":"72a","st":1070,"et":1107,"消文":[{"文":"這一段就是前面說明的道理。"},{"文":"世間一切法，現起是苦，滅也是苦；所以要努力找「滅」的辦法，把一切消除掉，那時得到寂滅之樂。"}],"延伸":[],"逐字稿":[{"t":"72A 17:50","b":[["q","「難陀，然由彼彼威儀之苦，暫間斷故，遂於餘餘新生眾苦，妄起樂想。"],["s","那這一段就是前面的，說明這個道理。"]]},{"t":"72A 18:01","b":[["q","難陀，生唯苦生，滅唯苦滅，生唯行生，滅唯行滅。」"],["s","世間一切法，現起是苦，然後呢滅也是苦，所以我們要努力找「滅」這個辦法，就把一切消除掉，那個時候得到寂滅之樂。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/010.mp3"},{"文":"《四百論》亦云：「如安樂增長，現見反成苦，如是苦增長，然非可轉樂。」","口譯":"《四百論》也說：「如同安樂增長，現見反而成為苦；像這樣苦增長，卻不能轉成樂。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 18:27","頁":167,"af":"72a","st":1107,"et":1287,"消文":[{"文":"第一個說道理，馬上用經證，經證以後祖師再加說明；大師又把經論的道理抉擇出來，宗要讓我們認得清清楚楚。"},{"文":"安樂增長，時間增久必反變成苦；苦增長不會轉成樂，因為苦本身就是苦。"},{"文":"世間最難認識、放不下的樂原來是苦，還有什麼好貪？行苦的自性不斷推衍，世間沒有一點地方不是苦。"},{"文":"苦的根本因就在五蘊身心：取蘊的重擔一天在，問題一直在，真正應該厭離的就是這個。"},{"文":"處處忙著修飾它、營養它、保護它，完全走上錯誤之路：概念是邪知見，行為是染污業，造成惡習，把你綁得死死的，越找越痛苦。"},{"文":"這把苦的特別行相告訴我們，這個叫總苦。"}],"延伸":[],"逐字稿":[{"t":"72A 18:27","b":[["q","《四百論》亦云：「如安樂增長，現見反成苦，如是苦增長，然非可轉樂。」"],["s","第一個是說道理，馬上用經證，經證了以後，祖師再加說明。祖師論上面怎麼說啊？說，就像我們妄見的，像安樂覺得增長，增長的結果，慢慢地增長，時間增久的時候必反變成功苦；但是呢，苦這個東西如果增長的話不會轉成樂。為什麼？苦本身就是苦，它的特質就是苦，你時間越長苦越多；可是樂卻不是，所以時間一增長的話，對不起，啊，苦又來了！所以若經、若論都是這個，那麼然後呢，大師又把這個經論的道理抉擇出來，把這個宗要讓我們認得地清清楚楚。現在到這裡我們了解了：哦！的的確確的，我們世間最難以認識的，而放不下的樂，原來這個不是真的，是苦！那麼既然樂都是苦，還有什麼一切好貪的呢？行呢？連它樂都沒有，雖然眼前一下感受不到，可是行苦的自性不斷地推衍哪，所以它結果又是苦，總結起來世間是沒有一點地方不是苦。"]]},{"t":"72A 20:11","b":[["s","而那個苦的根本因在哪裡呢？沒有別的，就是在我們五蘊身心上面，這是它真正我們應該認識的這個。所以告訴我們，這個取蘊的重擔只要一天在，一天沒有解決，問題一直在，我們真正應該厭離的就是厭離這個。現在我們處處地方忙這個，要修飾、修飾它；要營養、營養它；要保護、保護它，那完全走上錯誤之路。你這個概念就是邪知見，你這個行為就是染污之業，然後造成功這個惡習，到那個時候你不知不覺當中，這個東西又要來了。就把你綁得死死的，永遠在這個裡邊，你還覺得是找快樂，結果是越找越痛苦啊！那麼這個把苦的特別的行相告訴我們，這個叫總苦，把那個苦的特質。下面呢，"]]}],"口譯音":"口譯音檔/siwei-kudi-07/011.mp3"},{"文":"第二思惟別苦有六，三惡趣苦已如前說。","口譯":"第二，分別思考各道的苦，共有六道；三惡道的苦前面已經講過了。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 21:27","頁":167,"af":"72a","st":1287,"et":1337,"消文":[{"文":"一切有情在三界當中有不同的位次：天、修羅、人三個善道；地獄、餓鬼、畜生。換一個角度看，也無不是苦。"},{"文":"共下士已經把三惡趣苦說明了，痛苦的厲害我們一點都無法忍受；人是善道，結果呢？"}],"延伸":[],"逐字稿":[{"t":"72A 21:27","b":[["q","第二思惟別苦有六，"],["s","那個，因為一切的有情在三界當中，有不同的幾個位次，我們所謂六趣或者六道 ─天、修羅、人是三個善道；地獄、餓鬼、畜生。現在我們看看，用另外這樣的一個角度去看，這個內容是什麼？啊，它也無不是苦！"]]},{"t":"72A 21:58","b":[["q","三惡趣苦已如前說。"],["s","在前面共下士當中，已經把三惡趣苦說明了。唉呀，這個痛苦的厲害，我們現在一點都無法忍受呀！那麼人呢？說是善道，應該呀！結果，"]]}],"口譯音":"口譯音檔/siwei-kudi-07/012.mp3"},{"文":"人苦者，謂飢渴寒熱，不可意觸，追求勞苦，復有生老病死等七，如前當知。","口譯":"人的苦：飢餓、口渴、寒冷、炎熱，碰到不舒服的事，為了謀生到處奔波勞累；另外還有生、老、病、死等七種苦，照前面講的去認識。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 22:17","頁":167,"af":"72a","st":1337,"et":1389,"消文":[{"文":"這是人人感受得到的：飢渴、寒熱、不可意觸；不可意觸通常指外面，實際上心裡也如此，一天到晚煩煩惱惱，被它牽著鼻子走。"},{"文":"為了要求妄樂去追求，得到了怕失去，失去了又拼命追求，人實在是顛倒。"},{"文":"生老病死等七，前面已經說過了。"}],"延伸":[],"逐字稿":[{"t":"72A 22:17","b":[["q","人苦者，謂飢渴寒熱，不可意觸，追求勞苦，"],["s","喏！這個是我們人人感受得到的。唉！又「飢渴」、又「寒熱」，又「不可意觸」。這個不可意觸通常是指外面，實際上心裡也是如此，我們一天到晚煩煩惱惱，一天到晚沒有一個例外的，都是為了這個問題、這個麻煩，被它牽著鼻子走。還有呢，去為了追求，為了要求這個妄樂去追求，得到了就怕失去，失去了又要拼命追求，人實在是顛倒啊！"]]},{"t":"72A 23:03","b":[["q","復有生老病死等七，如前當知。"],["s","那前面已經說過了。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/013.mp3"},{"文":"又如《資糧論》云：「惡趣苦無餘，人中亦現有，苦逼等地獄，貧如琰魔世。此中旁生苦，強力於羸弱，制罰及損害，相續如暴流。","口譯":"又如《資糧論》說：「惡趣的苦無一遺漏，在人中也現前都有：苦的逼迫等同地獄，貧窮如同琰魔世界（餓鬼）。這當中旁生的苦，是強者對弱者的制罰及損害，相續不斷如同暴流。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 23:09","頁":168,"af":"72a","st":1389,"et":1462,"消文":[{"文":"儘管人道是善趣，三惡道的苦人當中也有。"},{"文":"身心種種逼惱相當於地獄，地獄的特質就是一天到晚在寒熱的逼惱當中。"},{"文":"「貧如琰魔世」：鬼道是閻羅王所管轄，貧窮，這個也沒有、那個也沒有。"},{"文":"畜生是被驅馳、恐怖、被傷害；人中體弱的被強力所使，制罰、損害，像瀑布一樣不斷。"}],"延伸":[],"逐字稿":[{"t":"72A 23:09","b":[["q","又如《資糧論》云：「惡趣苦無餘，人中亦現有，苦逼等地獄，貧如琰魔世。此中旁生苦，強力於羸弱，制罰及損害，相續如暴流。"],["s","儘管人道是善趣，但是對不起，三惡道的這個苦，我們人當中也有。我們人當中有種種的身心的逼惱，這個就相當於地獄一樣，地獄的特質就是一天到晚在寒熱兩樣東西的逼惱當中。那麼「貧如琰魔世」，那麼餓鬼呢？這個是鬼道，鬼道是閻羅王所管轄的，那是貧窮啊，這個也沒有，那個也沒有。畜生呢？是種種被驅馳、恐怖、被傷害，就像這個比較體弱差的人被強力所使，以及制罰、損害，這種苦繼續不斷地像瀑布一樣，非常厲害！"]]}],"口譯音":"口譯音檔/siwei-kudi-07/014.mp3"},{"文":"有因貧乏起，«餘從不足生»，追求難忍苦，一切謀略殺。」","口譯":"（人的苦）有的因貧乏而生起，其餘的從不知足而生；追求的苦難以忍受，一切的謀略與殺害（都由此而來）。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 24:22","頁":168,"af":"72a","st":1462,"et":1550,"消文":[{"文":"有很多苦由貧；有很多人很富有了又不足。"},{"文":"追求的話，現在士農工商有種種苦惱；為了這個，心裡謀計、略取、傷殺，都從這上來。"}],"延伸":[{"題":"餘從不足生","組":[{"題":"滿足兩字真難","說":[{"類":"立","文":"這個滿足兩個字真難哪！越是豪富越是忙得起勁，為什麼？不足嘛。"}]},{"題":"所需無幾，偏要更多","說":[{"類":"立","文":"我們人真正需要的，一天三餐，兩餐就夠了，夜圖一宿，要這麼多錢幹什麼？"},{"類":"例","文":"有了百萬還要千萬，有了千萬要億，有了億還要萬億，有了錢還要地位；秦始皇併吞六國，還要長生不老。"}]},{"題":"善惡道一樣是苦","說":[{"類":"立","文":"貧固然不好，不貧也不行；世間的真相，是善惡道一樣。"}]}],"說":[{"類":"立","文":"這個滿足兩個字真難哪！越是豪富越是忙得起勁，為什麼？不足嘛。"},{"類":"立","文":"我們人真正需要的，一天三餐，兩餐就夠了，夜圖一宿，要這麼多錢幹什麼？"},{"類":"例","文":"有了百萬還要千萬，有了千萬要億，有了億還要萬億，有了錢還要地位；秦始皇併吞六國，還要長生不老。"},{"類":"立","文":"貧固然不好，不貧也不行；世間的真相，是善惡道一樣。"}],"af":"72a","st":1475}],"逐字稿":[{"t":"72A 24:22","b":[["q","有因貧乏起，餘從不足生，追求難忍苦，一切謀略殺。」"],["s","有很多苦由貧，有很多人呢，雖然你滿有，很富有了又不足。這個滿足兩個字真難哪！我們看那個很多豪富，越是豪富越是忙得起勁，為什麼？不足嘛！說起來真簡單！我們人真正需要的，一天三餐，就是兩餐就夠了，夜圖一宿，要這麼多錢幹什麼？偏偏有些世間人，有了百萬還要千萬，有了千萬要億，有了億還要萬億，有了錢還要地位。唉呀，不曉得要多少！那秦始皇併吞了六國，還要長生不老，就這樣，世間沒有一個例外的，就是這樣，就是這樣。所以貧固然不好，不貧也不行哪！那麼然後呢，你追求的話，種種，像我們曉得的，我們現在一切的士農工商，有種種的苦惱。然後呢，你為了這個事情，你生其他的，心裡邊謀計略、傷殺，都從這個上來。世間的真相，是善惡道一樣呀！"]]}],"口譯音":"口譯音檔/siwei-kudi-07/015.mp3"},{"文":"《四百論》云：「«勝者為意苦»，庸流從身生，二苦日日中，能壞此世間。」","口譯":"《四百論》說：「優勝的人是心意的苦，平庸的人是從身體生起的苦；這兩種苦天天都在，能毀壞這個世間。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 25:50","頁":168,"af":"72a","st":1550,"et":1770,"消文":[{"文":"差的人身苦，是窮人；好的人意苦。"},{"文":"被這樣的二苦，不斷地「日日中」，壞了；我們一天到晚就忙這個事情，這是人。"}],"延伸":[{"題":"勝者為意苦","組":[{"題":"董事長不如司機","說":[{"類":"例","文":"一位大公司董事長嘆氣說：「我還不如我的司機。」司機叫他向東就向東，心安理得；我又要想支票到期、應酬、打高爾夫、請客，睡眠的時間都剝奪掉。"},{"類":"例","文":"司機車子一放，回去呼呼睡大覺；千真萬確，你們想想是不是？"}]},{"題":"世人忙追，人世顛倒","說":[{"類":"破","文":"所有世間人一天到晚忙追這個，這叫顛倒，人世真正的顛倒；我是越想越對。"}]},{"題":"一件破衣，一點不操心","說":[{"類":"例","文":"以前在家是白領，衣服很講究，出去要體面、西裝革履。"},{"類":"例","文":"出家後到師父那裡撿幾件破衣服，洗乾淨穿上，小偷都不要；髒了洗、破了補，白天晚上都它，一點都不要操心，這麼舒服法。"}]},{"題":"原則用在任何地方","說":[{"類":"下手","文":"不一定從這上面去體會，要把這個原則用在任何一個地方，深深領會真正重要的事情是什麼。"},{"類":"因","文":"因為這個妄見，形成現在這個東西，輾轉相應，真是苦惱。"}]}],"說":[{"類":"例","文":"一位大公司董事長嘆氣說：「我還不如我的司機。」司機叫他向東就向東，心安理得；我又要想支票到期、應酬、打高爾夫、請客，睡眠的時間都剝奪掉。"},{"類":"例","文":"司機車子一放，回去呼呼睡大覺；千真萬確，你們想想是不是？"},{"類":"破","文":"所有世間人一天到晚忙追這個，這叫顛倒，人世真正的顛倒；我是越想越對。"},{"類":"例","文":"以前在家是白領，衣服很講究，出去要體面、西裝革履。"},{"類":"例","文":"出家後到師父那裡撿幾件破衣服，洗乾淨穿上，小偷都不要；髒了洗、破了補，白天晚上都它，一點都不要操心，這麼舒服法。"},{"類":"下手","文":"不一定從這上面去體會，要把這個原則用在任何一個地方，深深領會真正重要的事情是什麼。"},{"類":"因","文":"因為這個妄見，形成現在這個東西，輾轉相應，真是苦惱。"}],"af":"72a","st":1560}],"逐字稿":[{"t":"72A 25:50","b":[["q","《四百論》云：「勝者為意苦，庸流從身生，二苦日日中，能壞此世間。」"],["s","差的人呢，身苦，是嘛，窮人；好的人呢，意苦。說到這意苦，我也想起來了，現在那位已經死掉了，他本來不曉得是什麼大公司，我忘記掉了，那個大公司的董事長。有一天，他就隨便不曉得 ……說笑話，幾個老朋友，「唉！」他嘆了一個長氣，有人說：「像你這樣你還有什麼不如意呀？」他就說：「唉！不要去談了，我自己算算，我還不如我的司機。」喔！要是我做大老闆的話，同樣的兩個人，當然願意做大老闆。那個大老闆好舒服坐在那個地方，那個司機前面就開它，那個大老闆就說向東他就向東，向西他就向西，好像是那個大老闆那麼舒服！結果呢大老闆怎麼說？他說：「那個司機，我只要告訴他你向東他就向東，要叫他向西他就向西，他心裡面真是心安理得。我在那裡又要想這個，又要想那個，又要想那個 ……唉呀！這張支票要什麼時候到期了；這個禮拜六還要一個什麼應酬；還要跟誰一個人打一個高爾夫球；還要請一個客；政府某一個大官，還要這個應酬、這個應酬 ……。那晚上睡眠的時間都剝奪掉了。」他那個司機開到那個地方，他車子一放，回去呀呼呼睡大覺。千真萬確喔！你們想想看是不是？唉，之顛倒啊！"]]},{"t":"72A 27:34","b":[["s","但是我們偏偏所有世間人，都一天到晚要忙什麼？忙追這個，所以這個叫顛倒，人世的真正的顛倒！我們想想看對不對？我覺得現在是越想越對，以前我想我們諸位都是從在家人過來的，我也是，現在後來變成出家人了。以前在家，這個衣服，所謂白領階級，那個很講究哦！出去的時候要體面，當初是念書，然後跑出去西裝革履 ─通常人家說。到後來出家了以後，跑到我師父那裡撿幾件破衣服，就洗洗乾淨穿在身上，不要說小偷強盜你送給他，他都不要。我跑到哪裡要坐下，坐下就坐下了，站起來拍拍屁股就好了嘛，那麼簡單！髒，髒一點有什麼關係？太髒嘛洗洗就好了；破，破了嘛就補，就這樣。白天也是它，晚上也是它，睡覺了，棉被一蓋就好了。用不著說一下嘛睡衣，一下嘛這個，白天要白天的，晚上要晚禮服，今天參加這個又要那個 ……。啊！一點都不要操心，這麼個舒服法。結果人就是這麼顛倒。"]]},{"t":"72A 28:50","b":[["s","所以，我所以說這樣的一件事情，它不一定從這個上面去體會，我們應該把這個原則，用在任何一個地方，用在任何一個地方。讓我們深深領會到，真正裡面重要的事情是什麼？我們因為這個妄見，形成了現在這個東西，然後呢輾轉相應，真是苦惱啊！就被這樣的二苦，不斷地「日日中」，壞了！我們一天到晚就忙這個事情，這是人。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/016.mp3"},{"文":"非天苦者。如《親友書》云：「諸非天中意苦重，由其性瞋天德故，此等由其趣性障，具慧不能見聖諦。」","口譯":"非天（阿修羅）的苦：如《親友書》說：「諸非天之中，心意的苦很重，因為他們本性就瞋恨天人的福德；這些非天由於所生之趣的本性障礙，雖具智慧也不能見到聖諦。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72A 29:30","頁":168,"af":"72a","st":1770,"et":null,"消文":[{"文":"非天就是修羅道。"},{"文":"非天當中意最苦；本性瞋心非常大，福德可以跟天相比，但瞋心太大。"},{"文":"「趣性障」：那一道的特質就是瞋心特別重；雖然有智慧，沒辦法「見聖諦」。"},{"文":"一到這一道只有造惡，絕沒有機會透脫；這裡先不談，談這一道特別的痛苦。"}],"延伸":[],"逐字稿":[{"t":"72A 29:30","b":[["q","非天苦者。"],["s","非天就是，我們說魔，修羅道是魔，修羅道。"]]},{"t":"72A 29:39","b":[["q","如《親友書》云：「諸非天中意苦重，由其性瞋天德故，此等由其趣性障，具慧不能見聖諦。」"]]},{"t":"72B 00:03","b":[["s","那麼這個修 羅道，我們另外一個名字叫「非天」，他這個非天當中啊意最苦，這個心最苦。為什麼？他那個本性，他這種人的心裡瞋心非常大，他的福德可以跟天互相比，但是他那個瞋心太大，就是這樣。雖然他也有天上面種種的好的條件，但是那個「趣性障」，就是那一趣，就是那一道，就是修羅道那個特質就是瞋心特別重。那時候雖然也有智慧，但是這一道的眾生沒有辦法「見聖諦」 ─真正見到聖者之教。所以一到這一道的話，只有造惡，啊，那非常糟糕！不但絕沒有機會透脫，這個地方就先不談，談這一道特別的痛苦。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/017.mp3"},{"文":"此由不忍，嫉天富樂，令意熱惱，由此因緣，與天鬥諍，受割裂等傷身眾苦。此等雖具智慧，然由異熟障故，於彼身中不堪見諦。","口譯":"這是因為他們受不了、嫉妒天人的富貴快樂，心裡像火燒一樣難受；因此跟天人打仗，身體被砍被割，受種種傷害的苦。他們雖然也有智慧，但因為這個果報身本身的障礙，在這樣的身體裡沒辦法證悟真理。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 01:02","頁":168,"af":"72b","st":62,"et":153,"消文":[{"文":"瞋心大、嫉妒心強，不能忍受人家的好，看見別人比他強就受不了。"},{"類":"例","文":"天人長得美不可言，修羅福雖大卻個個醜陋；修羅的女兒嫁給帝釋；帝釋天吃的果，樹根長在修羅宮，果子卻掉在帝釋的園子裡。"},{"文":"所以一天到晚要跟天打；一打就受割裂。"},{"文":"雖然有智慧，由於所感得的非天這一趣的異熟障礙，沒有辦法見諦。"}],"延伸":[],"逐字稿":[{"t":"72B 01:02","b":[["q","此由不忍，嫉天富樂，令意熱惱，"],["s","因為他瞋心大，嫉妒心強，不能忍受人家的好，他意裡面特別地強，啊，看見別人比他強就受不了。別人就偏偏比他強，那個天人都長得美不可言，修羅的福雖然大，長得個個醜陋。啊，妙不可言！還有呢，這個帝釋的這個太太，就是修羅的女兒，她長得，女的很漂亮，結果呢就嫁給那個天。啊！就這樣，種種不理想的。還有那個帝釋天吃的那種天上的果，那個樹那個根呢，就長在那個修羅宮當中，根長在那裡，長出來的果，可掉在帝釋天的園子裡邊。唉，這實在是難受啊！實在是難受。他本性本來就是瞋心很大，嫉妒心很強，所以他一天到晚要跟那個天打。所以："]]},{"t":"72B 02:06","b":[["q","由此因緣，與天鬥諍，"],["s","然後一打呢？"]]},{"t":"72B 02:10","b":[["q","受割裂等傷身眾苦。此等雖具智慧，然由異熟障故，於彼身中不堪見諦。"],["s","他雖然有智慧，但是由於這個異熟，他所感得的這個非天這一趣，這個障礙存在，他沒有辦法見諦，沒有辦法見諦的。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/018.mp3"},{"文":"《念住經》說此為旁生，《瑜伽師地論》«說為天趣»。","口譯":"關於非天（阿修羅）屬於哪一道，《念住經》說是畜生道，《瑜伽師地論》說是天道。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 02:33","頁":168,"af":"72b","st":153,"et":250,"消文":[{"文":"有經說他是旁生，畜生道，他愚癡；《瑜伽師地論》說天趣。"},{"文":"所以有的列成五趣，有的列為專門一類，成為六趣。"}],"延伸":[{"題":"說為天趣","組":[{"題":"人間也有修羅","說":[{"類":"例","文":"這種狀態我們人間也有：人間修福報修得很大，但是瞋心。"},{"類":"例","文":"看見人家布施：「這有什麼了不起，他布施一千，我布施一萬！」人家造大廟：「我造得比他更大！」"}]},{"題":"修福而意地不淨","說":[{"類":"因","文":"造了以後，沒有造大惡業，大概可能進入修羅道；造大惡業的更不談。"},{"類":"立","文":"造了福報尚且如此；只要意地不清淨，到那時苦不堪言，這個必定要注意。"}]},{"題":"上界尚且如此","說":[{"類":"回扣","文":"人間也是：司機開完回家就好了；老闆一天到晚躺在枕頭上睡不著，吃安眠藥，明天還頭痛，真划不來。"},{"類":"立","文":"上界尚且如此，何況其他！"}]}],"說":[{"類":"例","文":"這種狀態我們人間也有：人間修福報修得很大，但是瞋心。"},{"類":"例","文":"看見人家布施：「這有什麼了不起，他布施一千，我布施一萬！」人家造大廟：「我造得比他更大！」"},{"類":"因","文":"造了以後，沒有造大惡業，大概可能進入修羅道；造大惡業的更不談。"},{"類":"立","文":"造了福報尚且如此；只要意地不清淨，到那時苦不堪言，這個必定要注意。"},{"類":"回扣","文":"人間也是：司機開完回家就好了；老闆一天到晚躺在枕頭上睡不著，吃安眠藥，明天還頭痛，真划不來。"},{"類":"立","文":"上界尚且如此，何況其他！"}],"af":"72b","st":175}],"逐字稿":[{"t":"72B 02:33","b":[["q","《念住經》說此為旁生，《瑜伽師地論》說為天趣。"],["s","有一個經說他這個是旁生，所以畜生道 ─他愚癡；那麼《瑜伽師地論》上說天趣。所以有的人列入這個變成五趣，有的人列為專門一類，列入六趣。就這種狀態呢我們人間也有，實際上這種人，就是人間修福報，修得很大，但是瞋心。往往有的時候布施，我也曾經看見過的，人家去布施，他看見他布施：「這有什麼了不起，他布施一千，我布施一萬！」就是這樣。人家造一個大廟，造這麼多 ─「我造得比他更大！」對不起，你造了以後，如果你沒有造大的大惡業的話，那麼你大概是可能進入修羅道；如果你造大惡業的話，那更不談。所以這個我們必定要注意啊！造了福報尚且如此啊！你只要意地不清淨的話，到那個時候苦不堪言。人間也是這樣欸，剛才說的這個司機真痛快，開完了以後回家去那好了，剩下來事情反正不管；這個老闆一天到晚躺在這個枕頭上，睡不著還要吃安眠藥，吃了安眠藥，明天還要頭痛。所以這一件事情是真划不來呀！那麼上界尚且如此，何況其他呀！那麼最後看看天："]]}],"口譯音":"口譯音檔/siwei-kudi-07/019.mp3"},{"文":"思惟天苦分二：一欲天三苦，二上二界粗重苦。今初　初死墮苦中有二，","口譯":"思惟天的苦分為二：一、欲界天的三種苦，二、上二界（色界、無色界）的粗重苦。現在說第一。第一種死墮苦之中有二，","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 04:10","頁":168,"af":"72b","st":250,"et":271,"消文":[{"文":"天分成兩種：欲界，還有上面色、無色界；欲天有三種苦。"},{"文":"欲界在生的時候很好，到墮落的時候苦不堪言。"}],"延伸":[],"逐字稿":[{"t":"72B 04:10","b":[["q","思惟天苦分二：一欲天三苦，二上二界粗重苦。　今初"],["s","天分成功兩種，一種欲界，還有呢上面 ─色、無色界。欲天有三種苦："]]},{"t":"72B 04:22","b":[["q","初死墮苦中有二，"],["s","欲界，在生的時候很好，到墮落的時候，那苦不堪言。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/020.mp3"},{"文":"死歿苦者，如云：「諸天趣樂雖極大，然其死苦大於彼，如是思已諸智者，莫愛有盡天趣樂。」","口譯":"死歿的苦：如說：「諸天趣的快樂雖然極大，然而他們死時的苦比那還大；像這樣思惟以後，諸位智者，不要貪愛有窮盡的天趣之樂。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 04:31","頁":168,"af":"72b","st":271,"et":358,"消文":[{"文":"天上很快樂，但死的時候是絕大的痛苦。"},{"類":"例","文":"沒有什麼也就算了；一旦有了錢就怕失掉；政治上爬上去的怕掉下來，他是在人家頭上踩上去的，當然不願被人家踩。"},{"類":"例","文":"享受富貴慣了，忽然衣食不繼，還要看人家臉色，這個痛苦之難受。"},{"文":"了解了，真正有智慧的人絕對不會貪；何況時間一下就過去，像前面無常當中說的。"}],"延伸":[],"逐字稿":[{"t":"72B 04:31","b":[["q","死歿苦者，如云：「諸天趣樂雖極大，然其死苦大於彼，如是思已諸智者，莫愛有盡天趣樂。」"],["s","天上很快樂，但是死的時候，唉，那絕大的痛苦，絕大的痛苦！就像我們現在，你沒有什麼，反正沒有什麼，也就算了；你一旦有了錢哪，哎呀，那個就要怕什麼？失掉。所以凡是有地位的人，我們看，尤其是現在這種政治上面，這個鬥爭得厲害呀，他爬上去了就怕掉下來。他所以爬上去，為什麼？他是拼命在人家的頭上踩上去的，他既然在人家頭上踩上去，當然不願意被人家來踩，這個很明白。同樣的道理，所以上面固然好，跌下來的痛苦啊，就是痛苦極了。他平常習慣上面享受慣了，平常我們人家說，習慣了大，享受富貴的，忽然之間跑得去，你畏畏縮縮，唉呀！衣食不繼，還要看人家的臉色，這個痛苦之難受啊！了解了這個，啊！那真正有智慧的人絕對不會貪。何況這個時間一下就過去掉了，像前面無常當中，切切要記住！"]]}],"口譯音":"口譯音檔/siwei-kudi-07/021.mp3"},{"文":"謂較昔受天欲生樂，將臨歿時，五死相現，所起痛苦，極重於彼。五死相者，即如彼云：「身色變為不可愛，不樂本座，華鬘萎，衣服垢染，身出汗，是於先時所不出。天趣報死五死相，起於住天界諸天，等同地上諸人中，傳報當死諸死相。」","口譯":"就是說，比起過去所受的天界欲樂，在將要死歿時，五種死相出現，所生起的痛苦，比那欲樂還重。五種死相，就如那部論說：「身色變為不可愛，不喜歡自己本來的座位，花鬘枯萎，衣服垢染，身體出汗，這是以前不曾出的。天趣中預報死亡的五種死相，生起於住在天界的諸天身上，就等同地上人們之中，預報將死的各種死相。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 05:58","頁":168,"af":"72b","st":358,"et":450,"消文":[{"文":"在天享樂時不知不覺過去，快死時「五死相」現起，痛苦的心情是不得了。"},{"文":"本來可愛的變掉了；本來坐的帝座、天子座坐不住了；花鬘萎了，衣服髒垢了，身上出汗了，這些先時不出的，臨死來了。"},{"文":"就像我們人病了；人病了不一定死，醫得好；天上五衰相一現就非死不可，真可怕。"}],"延伸":[],"逐字稿":[{"t":"72B 05:58","b":[["q","謂較昔受天欲生樂，將臨歿時，五死相現，所起痛苦，極重於彼。"],["s","就是說，在天享樂的時候，不知不覺當中過去掉了，等到你快死的時候，這五衰相，「五死相」現起的時候，那個痛苦的心情是不得了啊！"]]},{"t":"72B 06:19","b":[["q","五死相者，即如彼云：「身色變為不可愛，"],["s","本來可愛的，變掉了。"]]},{"t":"72B 06:25","b":[["q","不樂本座，"],["s","本來坐的地方，這個帝座、天子座，那個時候坐在那裡坐不住了。華鬘萎，衣服垢染，身出汗，是於先時所不出。"]]},{"t":"72B 06:34","b":[["s","身上的花鬘萎了，衣服是髒垢了，身上出汗了。這個五樣東西，先時不出的，到臨死的時候，欸！來了。所以："]]},{"t":"72B 06:45","b":[["q","天趣報死五死相，起於住天界諸天，等同地上諸人中，傳報當死諸死相。」"],["s","那個就是欲界天的，欲界天的這種五死相。他「諸天」，那就是欲界天的諸天，就像地上的一樣，欸，這個東西有這個形相生起，就像我們病了，那個他也就是這個狀態。我們人病了以後不一定死，醫得好的，那個天上面的五衰相一現的話，那就死了，非死不可。真可怕！那麼這個「死歿苦」。第二呢，"]]}],"口譯音":"口譯音檔/siwei-kudi-07/022.mp3"},{"文":"墮下處苦者，如云：「從天世間死歿已，設若全無少餘善，彼無自在往旁生，餓鬼地獄隨一處。」","口譯":"墮下處的苦：如說：「從天的世間死歿以後，如果完全沒有少許剩餘的善業，他就不由自主地前往旁生、餓鬼、地獄中的任何一處。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 07:30","頁":168,"af":"72b","st":450,"et":516,"消文":[{"文":"死了以後還要墮落；沒有善，自己沒有力量，隨業而轉。"},{"類":"例","文":"皈依當中說過羯摩那法天子五衰相現，天人有神通看到死後要墮落。"},{"文":"上升的機會少之又少，墮落的極大部分；不是百分之九十九比一，經上說是大地土跟爪上土；天上一無是處。"}],"延伸":[],"逐字稿":[{"t":"72B 07:30","b":[["q","墮下處苦者，"],["s","死了以後呢，糟了，還要墮落！"]]},{"t":"72B 07:34","b":[["q","如云：「從天世間死歿已，設若全無少餘善，彼無自在往旁生，餓鬼地獄隨一處。」"],["s","從天上死了，如果沒有善的話，他自己沒有力量的，沒有力量，還是隨業而轉，到那時候墮落到畜生當中。上面我們曾經說過的，皈依當中那個羯摩那法天子他五衰相現，天人有這個神通的，死了以後可以看看到哪裡去，一看，要墮落。啊！這個一般來說，上升的機會少之又少，墮落的情況極大部分、極大部分。這個比數不是說百分之九十九跟百分之一的比哦，經上說得很清楚，說大地土跟爪上土這樣，這樣的可怕法呀！所以那個天上是一無是處呀！"]]}],"口譯音":"口譯音檔/siwei-kudi-07/023.mp3"},{"文":"悚慄苦者，謂由有成就廣大福聚及上妙五欲天子生時，諸薄福天子，見已惶怖，由此因緣受大憂苦。","口譯":"驚恐的苦：福報很大、享受最好的五欲的天子出生時，那些福報薄的天子看到了，就驚慌害怕，因此非常憂苦。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 08:36","頁":169,"af":"72b","st":516,"et":587,"消文":[{"文":"這一種是害怕：更大福德的天子生起時，薄福的天子看見就受大苦惱；大力天子一犯瞋心，差一點的就被欺凌。"},{"類":"喻","文":"像世間大魚吞小魚，天上亦復如是；越是爬得高，被吞、被壓迫的時候痛苦越大。"}],"延伸":[],"逐字稿":[{"t":"72B 08:36","b":[["q","悚慄苦者，謂由有成就廣大福聚及上妙五欲天子生時，諸薄福天子，見已惶怖，由此因緣受大憂苦。"],["s","那麼還有一種呢，這一種就是他害怕。說另外有更大福德的這一種天子，生起的時候，那個薄福的天子看見了，就要受大苦惱，受大苦惱。這個一旦那個大力的天子一犯瞋心的話，哇！那個差一點的就被他欺凌了。就像我們現在世間也是一樣，其實一樣，任何到處都是一樣的，大魚吞小魚這個情況，天上亦復如是。他雖然不是把你吞掉了，但是呢你遭到的痛苦啊，我們現在眼前看看哪到處都是，天上亦復如是。而更是，越是爬得高，那個時候被吞、被壓迫的時候這個痛苦是越大。還有呢，"]]}],"口譯音":"口譯音檔/siwei-kudi-07/024.mp3"},{"文":"斫裂殺害苦者，謂天與非天鬥諍之時，受斷支節，破裂其身及殺害苦，若斷其頭，即便殞歿，傷身斷節，續還如故。","口譯":"斫裂殺害的苦：就是天人與非天鬥爭的時候，承受斷截肢節、破裂身體以及被殺害的苦；如果被斷頭就會死亡，傷了身體、斷了肢節，還能接續恢復如故。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 09:47","頁":169,"af":"72b","st":587,"et":639,"消文":[{"文":"或者被傷，或者被殺；非天經常跟天鬥，被傷害只是當時刀砍上去痛，完了身體又恢復。"},{"文":"頭一斷掉，命就送掉了。"}],"延伸":[],"逐字稿":[{"t":"72B 09:47","b":[["q","斫裂殺害苦者，謂天與非天鬥諍之時，受斷支節，破裂其身及殺害苦，若斷其頭，即便殞歿，傷身斷節，續還如故。"],["s","還有呢，這個或者被傷，或者被殺。那個非天經常要跟天上面鬥，那麼如果鬥了以後呢，如果說被傷害的話，那只是傷害的當時，刀砍上去痛苦的，完了以後他那個身體又恢復了，這個還可以。但是那個頭一斷掉了，對不起，那個命就送掉了，哦，這個頭很重要。那麼，"]]}],"口譯音":"口譯音檔/siwei-kudi-07/025.mp3"},{"文":"驅擯者，謂諸具足強力諸天，纔一發憤，諸劣天子，便被驅擯出其自宮。","口譯":"驅擯：就是具足強大力量的諸天才一發怒，那些劣弱的天子，就被驅逐出自己的宮殿。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 10:39","頁":169,"af":"72b","st":639,"et":668,"消文":[{"文":"這是為什麼前面心裡恐怖：力量強的一發脾氣，比較差的就被從自己的地方趕出去，本來好好享受，當然痛苦。"}],"延伸":[],"逐字稿":[{"t":"72B 10:39","b":[["q","驅擯者，謂諸具足強力諸天，纔一發憤，諸劣天子，便被驅擯出其自宮。"],["s","這是為什麼前面心裡恐怖的，那個力量強的人哪，一旦發起脾氣來，那個比較差的人，就被從他自己的地方就趕出去。那麼本來這地方好好地享受，你被趕出去，當然痛苦啦！"]]}],"口譯音":"口譯音檔/siwei-kudi-07/026.mp3"},{"文":"又如《資糧論》云：「所有受欲天，彼亦無樂心，遭欲貪熾然，內火而燒煮。若諸心散亂，彼豈有安樂，非於無散心，剎那能自在。散逸擾亂性，終不能寂滅，等同有薪火，徧受大風吹。」","口譯":"又如《資糧論》說：「所有受用欲樂的天人，他們也沒有安樂的心；遭受欲貪熾燃，被內心的火所燒煮。如果心散亂，他們哪裡會有安樂？沒有不散亂的心，連一剎那也不能自在。散逸擾亂的本性，終究不能寂滅，就如同有薪柴的火，遍受大風吹動。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 11:08","頁":169,"af":"72b","st":668,"et":774,"消文":[{"文":"欲界天受欲，並沒有真正的快樂；貪欲還在，內心貪欲之火熾然，一直在煩惱當中。"},{"文":"心散亂煩惱絕不可能安樂，一剎那也不能自在；心的自在一定要自己把持得住自己。"},{"文":"平常的快樂還是隨著外境在轉，看見好看的心就跟著跑掉，被人家牽著鼻子走，有什麼快樂。"},{"文":"散亂放逸本質是「擾亂」，不是寂滅；像有火的柴，在散亂的風當中燒，是沒有證得寂滅的必然狀態。"}],"延伸":[],"逐字稿":[{"t":"72B 11:08","b":[["q","又如《資糧論》云：「所有受欲天，彼亦無樂心，遭欲貪熾然，內火而燒煮。若諸心散亂，彼豈有安樂，非於無散心，剎那能自在。散逸擾亂性，終不能寂滅，等同有薪火，徧受大風吹。」"],["s","那麼這個論上面告訴我們，所有欲界天，受欲的，實際上他並沒有真正的快樂，沒有真正的快樂。為什麼呀？因為這個貪欲還在，既然這個貪欲，內心這個貪欲之火熾然的話，那心裡面一直在這個煩惱當中。凡是這心散亂煩惱的話，絕不可能得到安樂，這個在這種狀態當中，一剎那也不能自在。所以心的自在一定要什麼？自己把持得住自己，這個才是。平常的時候我們的快樂，實際上還是隨著外境在轉，啊，你看見好看的，你跟著心跟它去跑掉了，心跟它去跑掉了，被人家牽著鼻子走，這有什麼快樂好言呢？就是這樣的狀態呀！所以這樣，這種狀態叫散亂放逸，那個本質是「擾亂」。擾亂就是混雜的，這個不是寂滅。就像有火的那個柴一樣，它一定在這個散亂的風當中燒。燒，那就是熾烈的狀態，就是我們沒有證得寂滅的必然狀態。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/027.mp3"},{"文":"又云：「如病愈未久，食所不宜食。」","口譯":"又說：「如同病剛痊癒不久，就吃了不適宜吃的食物。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 12:54","頁":169,"af":"72b","st":774,"et":809,"消文":[{"文":"病剛好再吃不適宜的，病又發了；天上的快樂亦是如此。"},{"文":"由於布施等生到天上，欲樂很大，福不能積，貪心又增長，再墮落；這是欲界。"}],"延伸":[],"逐字稿":[{"t":"72B 12:54","b":[["q","又云：「如病愈未久，食所不宜食。」"],["s","病剛剛好，你還再吃不適宜的，對不起，它病又發了。那個天上的快樂亦是如此！世間由於布施，或者修種種的，然後呢生到天上。那個時候啊生到了天上，那個欲樂很大，它又來了，福不能積啊，貪心又增長了，再墮落。那個是欲界。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/028.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-07/001.webp","n":1},{"img":"投影片/siwei-kudi-07/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/siwei-kudi-07/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/siwei-kudi-07/004.webp","n":4},{"img":"投影片/siwei-kudi-07/005.webp","n":5},{"img":"投影片/siwei-kudi-07/006.webp","n":6},{"img":"投影片/siwei-kudi-07/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=72a&st1=73&et1=214","box":[0.133625,0.3091111111111111,0.13775,0.07733333333333334]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-07/008.webp","n":8},{"img":"投影片/siwei-kudi-07/009.webp","n":9},{"img":"投影片/siwei-kudi-07/010.webp","n":10,"links":[{"t":"音檔連結","url":"https://lamrim. 7/046.webp","n":46},{"img":"投影片/siwei-kudi-07/047.webp","n":47},{"img":"投影片/siwei-kudi-07/048.webp","n":48},{"img":"投影片/siwei-kudi-07/049.webp","n":49,"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-07/050.webp","n":52,"yt":"E1qFpq1i0fY"},{"img":"投影片/siwei-kudi-07/051.webp","n":53}],"投影片PDF":"投影片/siwei-kudi-07/slides.pdf","音檔範圍":"72A 01:13～72B 13:29"},"siwei-kudi-08":{"id":"siwei-kudi-08","標題":"思惟苦諦(8)","根":"思惟別苦","科判焦點":"子二 思惟別苦","課本範圍":"P169 L7 ~ P171 L2","堂數":93,"日期":"2026/12/22","分圖":[{"名":"上界粗重苦・觀察其因","原文":[0,3]},{"名":"煩惱為生死上首","原文":[4,12],"根":"煩惱發生之理"},{"名":"正明煩惱・總相與前六","原文":[13,21],"根":"煩惱發生之理"}],"跨科判":[{"科判":"癸一 煩惱發生之理","起":4}],"週":117,"班級":"24秋007","序":null,"音檔":{"72b":{"local":"音檔/gl1/072B.mp3","remote":"https://lamrim.xyz/player/media/gl1/072B.mp3"},"73a":{"local":"音檔/gl1/073A.mp3","remote":"https://lamrim.xyz/player/media/gl1/073A.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=72b&st1=809&af2=73a&et2=1105","段":[{"文":"色及無色上界諸天，雖無此諸苦，然煩惱隨逐，有諸障礙，於死於住悉無自在，故彼亦由粗重為苦。","口譯":"色界及無色界的上界諸天，雖然沒有這些苦，然而有煩惱隨逐、有種種障礙，對於死亡與安住都沒有自在，所以他們也由於粗重而是苦。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 13:29","頁":169,"af":"72b","st":809,"et":859,"消文":[{"文":"再上面比較好，沒有欲界天這些苦，但煩惱還在，生死痛苦的根本還在，障礙並沒除掉。"},{"文":"對於死生沒辦法自己把握：不是說我想不死就做得了，要死的時候一點辦法都沒有；還是在煩惱當中。"}],"延伸":[],"逐字稿":[{"t":"72B 13:29","b":[["q","色及無色上界諸天，雖無此諸苦，然煩惱隨逐，有諸障礙，於死於住悉無自在，"],["s","那麼再上面呢，比較好，沒有像欲界天，這個苦是沒有的，但是啊這個煩惱還在那裡。這個痛苦生死的根本還在那裡，所以這個障礙也並沒除掉。所以對於這個死生，還是沒辦法自己把握得住 ─無自在。不是說我要想不死就做得了，要死的時候，他也一點辦法都沒有。"]]},{"t":"72B 14:13","b":[["q","故彼亦由粗重為苦。"],["s","還是在煩惱當中。就像那個論上說："]]}],"口譯音":"口譯音檔/siwei-kudi-08/001.mp3"},{"文":"又如《資糧論》云：「色無色諸天，超越於苦苦，以定樂為性，住劫不傾動。然非畢竟脫，從彼仍當墮，似已得超越，惡趣苦暴流，雖勵不久住，等同空飛鳥，如童力射箭，墮落為邊際。如久然諸燈，剎那剎那壞，諸行變壞苦，仍當極侵惱。」","口譯":"又如《資糧論》說：「色界、無色界諸天，超越了苦苦，以禪定之樂為本性，住於劫中不傾動。然而並非究竟解脫，從那裡仍然會墮落；看似已經超越了惡趣之苦的暴流，雖然努力，也不能久住；如同飛在空中的鳥，如同孩童用力射出的箭，最終以墮落為邊際。如同點燃很久的燈，剎那剎那地壞滅；諸行變壞的苦，仍然會極度侵惱。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 14:19","頁":169,"af":"72b","st":859,"et":993,"消文":[{"文":"苦苦是沒有了；在定樂當中很長的時候，看定的深淺時間有長短，最高非想非非想天住八萬大劫，到了還是要墮落。"},{"類":"例","文":"鬱頭藍弗修成非想非非想天，死了以後墮落到畜生道；定好難修，完了還要墮落。"},{"文":"看起來好像超越了惡趣大苦，但行苦自性還在，沒辦法停得住。"},{"類":"喻","文":"像鳥飛在空中，飛一飛要停下來；像射箭，射上去力盡了又墮落。"},{"類":"喻","文":"像燈，現在是亮，可是一刻都不停地慢慢消失，最後仍舊為苦所侵；惡道是苦，善道結果也如此。"}],"延伸":[],"逐字稿":[{"t":"72B 14:19","b":[["q","又如《資糧論》云：「色無色諸天，超越於苦苦，"],["s","是，苦苦是沒有了。"]]},{"t":"72B 14:23","b":[["q","以定樂為性，住劫不傾動。然非畢竟脫，"],["s","他在定樂當中，他那個定樂，很長的時候。看他定的深淺而時間有長短，最高的非想非非想天，住八萬大劫，對不起，到了以後你還是要墮落。鬱頭藍弗就是那個典型的公案，他修非想非非想天修成功了，最後死了以後呢，墮落到畜生道當中。你看！啊，這個定是好難修，結果他完了以後還是要墮落。最高的非想非非想天尚且如此，何況 ……不談了。"]]},{"t":"72B 15:15","b":[["q","從彼仍當墮，似已得超越，惡趣苦暴流，雖勵不久住，等同空飛鳥，如童力射箭，墮落為邊際。"],["s","他到了最後一定要墮落的，所以當時看起來好像已經超越了，因為他苦苦沒有了嘛，已經超越了這個惡趣的種種大苦，但是對不起，他的行苦自性還在，他沒有辦法停得住的。就像鳥飛在空當中，暫時雖然飛一下，對不起牠飛一飛要停下來；又像人家射箭一樣，射上去呀到那時候力盡了，它又墮落了。他最後的，最後的邊際是就，跑到最後他還是墮落。"]]},{"t":"72B 16:06","b":[["q","如久然諸燈，剎那剎那壞，諸行變壞苦，仍當極侵惱。」"],["s","像燈一樣，現在是亮，可是它無時無刻，一刻都不停住地，正在慢慢、慢慢、慢慢地消失當中，最後仍舊為苦所侵。惡道是苦，善道結果也是如此。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/002.mp3"},{"文":"如是思惟五趣六趣，總別諸苦，厭患生死意欲出離，«便當觀察其因»，","口譯":"像這樣思考五道、六道整體和各別的苦，厭倦生死、想要出離，就應該去觀察造成這些苦的原因，","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 16:33","頁":169,"af":"72b","st":993,"et":1155,"消文":[{"文":"不管總的思惟、別的思惟，任何角度、任何狀態，觀察思惟的結果沒有一點例外是苦；了解以後產生的結果：厭患。"}],"延伸":[{"題":"便當觀察其因","組":[{"題":"換個地方，求不到樂","說":[{"類":"破","文":"總覺得「求快樂啊」，錯了！找不到快樂，這個世間的特質就是這樣。"},{"類":"破","文":"對眼前不滿意，「這裡不好，換一個地方，那個地方可以快樂」，世間人這樣想，完全錯了。"}]},{"題":"佛法指出樂的特質","說":[{"類":"立","文":"佛法難道不是找快樂？是；差別在世間人找快樂是頭痛醫頭、腳痛醫腳。"},{"類":"立","文":"佛法指出快樂的特質是什麼：根本你的認識就錯了，要從這上面轉一個方法。"}]},{"題":"逃得了環境，逃不了自己","說":[{"類":"破","文":"不要說這裡不理想、那裡不理想，然後要換、要找。"},{"類":"立","文":"你可以逃得了環境，逃不了自己；自己就是身心五蘊、煩惱，真正要透脫的是煩惱，所以必定要認得煩惱。"}]},{"題":"有因就能解決","說":[{"類":"破","文":"找不到因，說「反正沒辦法了」，那張開眼睛就去享樂，什麼壞事都去做好了。"},{"類":"立","文":"現在好，有原因的，可以解決；所以進一步了解了苦，就找它的原因。"}]}],"說":[{"類":"破","文":"總覺得「求快樂啊」，錯了！找不到快樂，這個世間的特質就是這樣。"},{"類":"破","文":"對眼前不滿意，「這裡不好，換一個地方，那個地方可以快樂」，世間人這樣想，完全錯了。"},{"類":"立","文":"佛法難道不是找快樂？是；差別在世間人找快樂是頭痛醫頭、腳痛醫腳。"},{"類":"立","文":"佛法指出快樂的特質是什麼：根本你的認識就錯了，要從這上面轉一個方法。"},{"類":"破","文":"不要說這裡不理想、那裡不理想，然後要換、要找。"},{"類":"立","文":"你可以逃得了環境，逃不了自己；自己就是身心五蘊、煩惱，真正要透脫的是煩惱，所以必定要認得煩惱。"},{"類":"破","文":"找不到因，說「反正沒辦法了」，那張開眼睛就去享樂，什麼壞事都去做好了。"},{"類":"立","文":"現在好，有原因的，可以解決；所以進一步了解了苦，就找它的原因。"}],"af":"72b","st":1020}],"逐字稿":[{"t":"72B 16:33","b":[["q","如是思惟五趣六趣，總別諸苦，厭患生死意欲出離，便當觀察其因，"],["s","那麼經過了上面，不管是你總的思惟，不管是別的思惟，就是說，在任何一個角度，任何一個狀態，你觀察、思惟的結果，沒有一點點例外 ─是苦，是苦！那個時候你了解了以後啊，產生一個什麼結果？厭患。所以我們現在總覺得：「唉呀，求快樂啊！」錯了！錯了！錯了！找不到快樂的，這個世間的特質就是這樣，這一點我們必定要知道。所以平常我們眼前哪，一定要把這個道理仔細地觀察一下：我們眼前到底忙些什麼？如果我們是對眼前不滿意，說「這裡不好啊，換一個地方去啊！那個地方可以快樂呀！」錯了，完全錯了。世間的人這樣想的，佛法不是。那難道不是找快樂嗎？是。差別在哪裡呢？就是世間一般人找的快樂，是頭痛醫頭、腳痛醫腳，只是如此。佛法裡面說，是的，你找快樂，結果呢你跑到我這裡來，說我可以告訴你，我這裡有快樂的，指出來 ─快樂的特質是什麼，根本你的認識就錯了，你要從這個上面去轉一個方法。"]]},{"t":"72B 18:07","b":[["s","所以對我們修學佛法的人來說，我們必定要了解。不要說：哎喲，這裡不理想啊，那裡不理想啊！然後要換哪、要找啊！不是，你可以逃得了環境，是逃不了自己。自己是什麼？喏，身心五蘊、煩惱。我們真正要透脫是透脫這個煩惱，所以必定要認得煩惱。把這個解決了，問題就解決了，因為這個是痛苦的因，所以說「厭患生死意欲出離，便當觀察其因」。那麼你整個的生死的內容無非是痛苦，沒有一個地方可以逃的，沒有一個地方有安樂的，那找到它的因。如果找不到它的因的話，說反正沒辦法了！那好了，我們現在只要有一天哪，張開眼睛來就去享樂，然後你什麼事情都去做好了嘛，反正壞事 ……只要快樂。欸，現在好，有原因的，那可以解決！所以進一步了解了這個苦，就找它的痛苦的原因。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/003.mp3"},{"文":"念云如是生死«以何為因»。","口譯":"心想：像這樣的生死，是以什麼為因？","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 19:15","頁":169,"af":"72b","st":1155,"et":1353,"消文":[{"文":"三界之內無不是苦，原因在哪裡？因為感受苦的逼切，所以找苦的原因，找到的這個叫集諦。"},{"文":"集是「招感」：由此可以感得痛苦的果報，就是痛苦的原因所在；把原因拿掉，痛苦就消失。"}],"延伸":[{"題":"以何為因","組":[{"題":"為苦而忙，就要找因","說":[{"類":"立","文":"既然我們為痛苦而忙，真正要找的是這個，這才是修學佛法的特質；大家務必在這裡認真把握住。"}]},{"題":"碰到一點修一點，漏洞百出","說":[{"類":"破","文":"不要碰到一點去修一點，那時並不圓滿，乃至並不是根本；以為碰到了，結果漏洞百出，忙了半天痛苦仍在。"}]},{"題":"先堵漏洞，再清髒水","說":[{"類":"喻","文":"房間裡有水，沒找到漏洞就拼命擦，擦了半天那地方又來了，自己疲憊不堪，屋裡照樣是髒水。"},{"類":"下手","文":"必定要找到根本，其他暫時不管，先把漏洞堵死，再慢慢把髒水清乾淨，問題解決。"}]},{"題":"莫隨人轉，根本未找到","說":[{"類":"破","文":"人家告訴你參禪、念佛，哪個密宗好，你就跟著去修；根本的問題在哪裡沒找到。"},{"類":"喻","文":"像拿濕布擦地，那塊地乾了，濕布拿掉回頭一看又來了。"},{"類":"破","文":"太多人修行忙這些，自己還不懂，還要去幫別人，越幫越忙。"},{"類":"回扣","文":"這裡告訴我們根本在哪裡，由此而講集諦門。"}]}],"說":[{"類":"立","文":"既然我們為痛苦而忙，真正要找的是這個，這才是修學佛法的特質；大家務必在這裡認真把握住。"},{"類":"破","文":"不要碰到一點去修一點，那時並不圓滿，乃至並不是根本；以為碰到了，結果漏洞百出，忙了半天痛苦仍在。"},{"類":"喻","文":"房間裡有水，沒找到漏洞就拼命擦，擦了半天那地方又來了，自己疲憊不堪，屋裡照樣是髒水。"},{"類":"下手","文":"必定要找到根本，其他暫時不管，先把漏洞堵死，再慢慢把髒水清乾淨，問題解決。"},{"類":"破","文":"人家告訴你參禪、念佛，哪個密宗好，你就跟著去修；根本的問題在哪裡沒找到。"},{"類":"喻","文":"像拿濕布擦地，那塊地乾了，濕布拿掉回頭一看又來了。"},{"類":"破","文":"太多人修行忙這些，自己還不懂，還要去幫別人，越幫越忙。"},{"類":"回扣","文":"這裡告訴我們根本在哪裡，由此而講集諦門。"}],"af":"72b","st":1200}],"逐字稿":[{"t":"72B 19:15","b":[["q","念云如是生死以何為因。"],["s","說進一步我們要觀察，這樣的三界之內無不是苦，原因在哪裡呀？那麼進一步中，因為感受苦的逼切，所以我們找苦的原因，這個時候找到，啊！原來這個地方。那麼這個叫什麼？集諦。所以現在我們哪，從了解了苦，要求脫苦而找到這個苦的原因是集諦。集，什麼呢？它的所謂「招感」，由於這樣的可以感得痛苦的果報，換句話說，這就是痛苦的原因所在。你只要把這個痛苦的原因拿掉了，痛苦就消失。所以既然是我們為痛苦而忙，那麼真正要找的，這個才是，這個才是我們修學佛法的特質。所以大家注意啊，大家修學佛法，務必要在這個地方認真把握住。前面不同的地方，常常說明、歸類等等，它原因無非是要說明這個 ─你要修不要說碰到一點去修，碰到一點去修，那個時候並不圓滿，乃至於並不是根本，你以為碰到了，結果漏洞百出。因為漏洞百出，所以忙了半天痛苦仍舊在，你沒摸到根本，沒摸到根本。"]]},{"t":"72B 20:55","b":[["s","比如說我們現在說，哎呀，我們房間裡面有水呀，你把它擦掉。結果你沒找到漏洞，沒有找到水哪裡來的，你拼命去擦，擦了半天，那個地方又來了；擦了半天，那個地方又來了，越弄越糟。結果嘛自己忙得疲憊不堪哪，屋裡面照樣都是髒水，有用嗎？修行也是如此。你必定要找到根本，暫時其他地方先不管它，把那個漏洞堵死了，堵死了它沒有再來了，然後你慢慢地把裡面的髒水清乾淨。好囉，問題解決！"]]},{"t":"72B 21:32","b":[["s","所以我們修行哪，在這個地方，特別 ─這個概念要一而再、再而三地擺在腦筋裡面。不要說：哎呀，我現在要去修行去啦！人家告訴你怎麼修啊？參禪，人家告訴你念佛，人家告訴你 ……不管是哪一個法門，哦，這個密宗好，你只要去修修就行，然後你就跟著去修。實際上，根本的問題在哪裡你沒找到。有沒有一點樣子？有一點樣子的。當然就像那擦地一樣嘛，你拿著濕布一擦，那塊地就乾了，等到你濕布拿掉了，回過頭來看看，那個地方又來了。那有什麼用啊？所以我們現在太多的人修行都是忙這些，然後呢自己還不懂，還要去幫別人去，是越幫越忙啊！現在這個地方告訴我們，哦，這個情況這樣的，根本在哪裡呀？由此而講集諦門，那麼就找。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/004.mp3"},{"文":"第二，由集諦門思惟流轉生死次第分三：一煩惱發生之理，二彼集業之理，三死沒及結生之理。","口譯":"第二，從集諦（苦的原因）這方面思考我們怎樣流轉生死，分三點：一、煩惱是怎樣生起的；二、煩惱怎樣造業；三、怎樣死去、又怎樣投生下一世。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 22:33","頁":169,"af":"72b","st":1353,"et":1419,"消文":[{"文":"為什麼會生死？由於這個因。因是什麼？惑跟業。"},{"文":"先了解煩惱怎麼發生；再了解惑業為什麼會招感生死、為什麼會集業；最後是怎麼死、又怎麼結生。"},{"類":"回扣","文":"從這裡我們就把因找到了，然後從因上面看怎麼樣把它清除。"}],"延伸":[],"逐字稿":[{"t":"72B 22:33","b":[["q","第二，由集諦門思惟流轉生死次第分三："],["s","說為什麼會流轉生死，這個原因呢？分三部分："]]},{"t":"72B 22:43","b":[["q","一煩惱發生之理，二彼集業之理，三死沒及結生之理。"],["s","這個為什麼會生死呀？由於這個因。因是什麼？煩惱跟業，惑、業，就是這樣。那麼這個煩惱怎麼發生的呢？先了解。為什麼發生了這個惑跟業會招感到生死呢？所以他就講，這個為什麼會集業。那麼招感生死又是怎麼樣的招感法呢？所以怎麼死，又怎麼會結呢，這個道理下面就了解一下。從這個地方，我們就把因找到了，然後從因上面看看，怎麼樣把它清除。翻過來。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/005.mp3"},{"文":"今初　成辦生死之因，雖俱須惑業，然以煩惱而為上首。","口譯":"現在講第一。成辦生死的因，雖然惑與業兩者都需要，但是以煩惱為首要。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 23:39","頁":170,"af":"72b","st":1419,"et":1470,"消文":[{"文":"痛苦的真正根本在惑跟業：惑或叫無明、煩惱；業或叫行，名字各式各樣，總之這兩樣東西。"},{"類":"例","文":"十二因緣當中的無明、行，就是這兩個；或者愛、取、有：愛、取是惑，有是業。"},{"文":"雖然要這兩樣東西，裡面主要的卻是惑，是煩惱。"}],"延伸":[],"逐字稿":[{"t":"72B 23:39","b":[["q","今初　成辦生死之因，雖俱須惑業，然以煩惱而為上首。"],["s","現在了解了，說這個痛苦的真正的根本，在這個惑跟業。「惑」，或者叫無明，或者叫煩惱；「業」，或者叫行，或者叫什麼其他的種種的名字，有各式各樣的不同的名字。總之一句話，這兩樣東西。十二因緣當中說無明、行這兩個，就是這樣；或者是愛、取、有，愛、取是惑，有是業，這樣。那麼，但是雖然要這兩樣東西呀，這個裡面主要的卻是惑，卻是煩惱。下面看，"]]}],"口譯音":"口譯音檔/siwei-kudi-08/006.mp3"},{"文":"若無煩惱，雖有宿業超諸量數，然如種子，若無潤澤及其土等，定不發芽。","口譯":"如果沒有煩惱，雖然有超過計量之數的宿業，然而就像種子，如果沒有水分滋潤以及土壤等，決定不會發芽。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 24:30","頁":170,"af":"72b","st":1470,"et":1508,"消文":[{"文":"假定煩惱斷掉了，雖然有無量無邊、數都不能數的宿業，也不會感果。"},{"類":"喻","文":"像種子，沒有土、水、太陽這些因緣，長不出來。"}],"延伸":[],"逐字稿":[{"t":"72B 24:30","b":[["q","若無煩惱，雖有宿業超諸量數，然如種子，若無潤澤及其土等，定不發芽。"],["s","為什麼這煩惱為主要呢？就是說假定你的煩惱沒有了，斷掉了，雖然你有無量無邊的宿業，數都不能數，但是就像「種子」一樣，那個種子如果說沒有其他的因緣─土呀、水呀、太陽呀！對不起，它長不出來，長不出來，這個不會感果的。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/007.mp3"},{"文":"如是諸業缺«俱有緣»，亦定不能發苦芽故。","口譯":"同樣地，諸業如果缺少俱有緣，也決定不能生出苦芽。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 25:08","頁":170,"af":"72b","st":1508,"et":1586,"消文":[{"文":"業之所以能感果，一定還要一個「俱有緣」，或者叫俱有因，這個就是惑，就是煩惱。"}],"延伸":[{"題":"俱有緣","組":[{"題":"彼此撐持，缺一不成","說":[{"類":"喻","文":"布是經線跟緯線織的：經是緯的俱有緣，緯是經的俱有緣。"},{"類":"喻","文":"三腳架，這一根撐得起來，靠另外那幾根；少掉了，撐不起來。"}]},{"題":"無惑則業不結果","說":[{"類":"回扣","文":"沒有惑，雖然有業，不可能成功，不能結果。"}]}],"說":[{"類":"喻","文":"布是經線跟緯線織的：經是緯的俱有緣，緯是經的俱有緣。"},{"類":"喻","文":"三腳架，這一根撐得起來，靠另外那幾根；少掉了，撐不起來。"},{"類":"回扣","文":"沒有惑，雖然有業，不可能成功，不能結果。"}],"af":"72b","st":1530}],"逐字稿":[{"t":"72B 25:08","b":[["q","如是諸業缺俱有緣，亦定不能發苦芽故。"],["s","所以這個業之所以能夠感果，一定還要一個什麼？「俱有緣」，或者俱有因，這個就是惑，就是煩惱。有這個俱有緣才能夠感果，什麼叫俱有緣呢？或者叫俱有因？現在我們隨便說，現在我們每個人身上穿的衣服，我這件衣服，這個衣服是布做的對不對？這個布怎麼做的？經線跟緯線。這個經就是緯線的俱有緣、俱有因；這個緯就是經的俱有緣，這樣的。平常我們說架一個架子，三腳架，用三根架撐在一塊兒，那個你之這一根所以撐起來，就靠另外那個撐起來的，這個就是你的俱有緣。少掉了這個，對不起，你撐不起來的，懂不懂？就是這樣的。所以呀，如果沒有這個惑的話，這個雖然有業，對不起，它不可能成功，不能結果。反過來呢，"]]}],"口譯音":"口譯音檔/siwei-kudi-08/008.mp3"},{"文":"又若有煩惱，縱無宿業，無間新集，取後有故。","口譯":"又如果有煩惱，縱然沒有宿業，也會立即新造集業，而取得後有。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 26:26","頁":170,"af":"72b","st":1586,"et":1626,"消文":[{"文":"就算沒有宿業，有煩惱，煩惱為緣，會使你生長這個業；一跟著造，惑業具足，馬上又生了。"},{"類":"回扣","文":"從生死的因當中，找到最主要的主腦是惑，是煩惱。"}],"延伸":[],"逐字稿":[{"t":"72B 26:26","b":[["q","又若有煩惱，縱無宿業，無間新集，取後有故。"],["s","就算是你沒有宿業，但是你有煩惱，因為你有煩惱，這個煩惱呀，它會煩惱為緣哪，會使你生長這個業。欸！因為有煩惱在，這個業就跟著來造了，一跟著造，惑、業具足啊，它馬上又生了。所以在這個地方，我們又從這個惑、業，生死的因當中，找到最主要的主腦是惑，是煩惱。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/009.mp3"},{"文":"如是亦如《釋量論》云：「超度諸有愛，非餘業能引，滅盡俱有故。」","口譯":"就如《釋量論》所說：「超越了對三有的貪愛，其餘的業就不能牽引後有，因為俱有緣已經滅盡了。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 27:06","頁":170,"af":"72b","st":1626,"et":1738,"消文":[{"文":"諸有就是三有：欲有、色有、無色有；「有」是業，它一定會感得下面新生命結生的力量，十二因緣會詳細說明。"},{"文":"把對諸有的愛（就是惑）超脫了，其他的業就不會再引發你的生死，因為俱有緣統統弄乾淨了。"},{"類":"喻","文":"電燈樣樣弄好了，沒有電，沒用；有了電，沒有燈，也不會亮。兩個人才吵得起架，一個人吵不起來。"},{"類":"立","文":"天底下的事情就是這個樣，少掉一樣東西就不成。"}],"延伸":[],"逐字稿":[{"t":"72B 27:06","b":[["q","如是亦如《釋量論》云："],["s","下面引那個經論："]]},{"t":"72B 27:11","b":[["q","「超度諸有愛，非餘業能引，滅盡俱有故。」"],["s","我們要想超出諸有，諸有就是三有，三有是什麼？欲有、色有、無色有。「有」啊是業，為什麼叫作「有」，不講業呢？就是說，它一定會感得下面這個新生命的結生的這個力量，這個業力在十二因緣當中會詳細說明它，說明它。就是說你要想超越這個生死輪迴，當一切的諸有的這個愛，愛就是惑，你能夠把這個能夠超脫了，超脫出來的話，那麼其他的所有東西，就不會再引發你的業，說「非餘業能引」，它就不會再引發你的生死。為什麼呀？「滅盡俱有故」，就是那個俱有緣，上面說那個俱有緣哪，統統弄乾淨了，統統弄乾淨了。就像你要做一個布一樣，經線雖然擺在這裡，緯線沒有了，對不起，那個就是經線，就不成其為布。你做任何一件事情，少掉一樣東西 ─你那個電燈，樣樣弄好了，電沒有，沒有用；再不然你雖然有了電了，燈沒有，它也不會亮，就是這樣。所有的事情，兩個人吵架，它一定是兩個人才吵得起來，一個人吵不起架來。這個天底下的事情，就是這個樣，所以像這一類事情，我們要了解。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/010.mp3"},{"文":"又云：「若有愛，仍當出生故。」","口譯":"又說：「如果還有愛，仍然會出生。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 28:58","頁":170,"af":"72b","st":1738,"et":1755,"消文":[{"文":"愛就是煩惱；愛在，馬上跟著造業，煩惱跟業具足，就繼續生死。"}],"延伸":[],"逐字稿":[{"t":"72B 28:58","b":[["q","又云：「若有愛，仍當出生故。」"],["s","反過來呢，如果你這個愛，愛就是煩惱，如果你這個愛在的話，對不起，由於煩惱，馬上跟著這個煩惱就造了業。一造了業的話，煩惱跟業具足，他就繼續地生死。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/011.mp3"},{"文":"是故開示«煩惱對治極為重要»。","口譯":"所以，講清楚怎樣對治煩惱非常重要。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"72B 29:15","頁":170,"af":"72b","st":1755,"et":null,"消文":[{"文":"生死的因在這裡，因當中主要的是煩惱。煩惱是什麼？如何對治？要對治它，一定要認得它的本質，這是最重要的。"}],"延伸":[{"題":"煩惱對治極為重要","組":[{"題":"修行從哪裡修起","說":[{"類":"立","文":"到這裡停一下：大家都修行了，請問你修什麼？從哪裡修起？在這裡！"}]},{"題":"莫修我，越修越大","說":[{"類":"破","文":"記著以前說過的：不要修「我」！修我越修越大，跳不出生死輪迴，還覺得很得意，一生空空白費。"},{"類":"下手","文":"前面沒有聽的趕快補聽，否則跑到這裡來是白上了這個課。"}]},{"題":"依佛如理如量解決","說":[{"類":"立","文":"只有佛是如理如量地解決一切問題；現在告訴我們問題在這裡：要對治生死的根本，最後找到要對治煩惱。"}]}],"說":[{"類":"立","文":"到這裡停一下：大家都修行了，請問你修什麼？從哪裡修起？在這裡！"},{"類":"破","文":"記著以前說過的：不要修「我」！修我越修越大，跳不出生死輪迴，還覺得很得意，一生空空白費。"},{"類":"下手","文":"前面沒有聽的趕快補聽，否則跑到這裡來是白上了這個課。"},{"類":"立","文":"只有佛是如理如量地解決一切問題；現在告訴我們問題在這裡：要對治生死的根本，最後找到要對治煩惱。"}],"af":"73a","st":3}],"逐字稿":[{"t":"72B 29:15","b":[["q","是故開示煩惱對治極為重要。"],["s","那麼既然我們了解了生死的因在這裡，那麼更進一步就了解了，這個因當中主要的是煩惱。那麼煩惱是什麼呢？如何去對治呢？你要對治它，一定要認得它本質是什麼呢，這個是最重要的。"]]},{"t":"73A 00:03","b":[["s","所以到這個地方，我們停一下，我們現在大家都修行了，請問你修什麼啊？你從哪裡修起啊？在這裡，在這裡。所以我們應該想一想，說我們要修行啦，記著我以前說過的話：不要修「我」！修「我」是修我越修越大，跳不出生死輪迴啊！這一點諸位以前前面沒有聽的人趕快補聽，否則的話你跑到這裡來是白上了這個課了。我們都在這兒修我，不知道，還覺得很得意，結果修了我越修越大，只見我大。我既然大，在生死輪迴當中轉，一生空空白費。我們要學佛，因為只有佛是如理如量地解決一切問題，他曉得這個什麼辦法，所以第一件事情現在要認真了解。現在他這裡告訴我們了，原來這個問題在這裡啊！說你要對治這個生死的根本嘛，最後找到了要對治這個煩惱；那麼你要曉得煩惱的道理，要如何對治的話，怎麼辦呢？"]]}],"口譯音":"口譯音檔/siwei-kudi-08/012.mp3"},{"文":"此復賴於先知煩惱，故於煩惱，«應當善巧»。","口譯":"而要對治煩惱，又要先認識煩惱，所以對煩惱要弄得很清楚。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"73A 01:15","頁":170,"af":"73a","st":75,"et":156,"消文":[{"文":"你先必定要曉得什麼是煩惱。"}],"延伸":[{"題":"應當善巧","組":[{"題":"先認清所對治","說":[{"類":"喻","文":"叫你掃地，本來是掃地上的垃圾，你卻把桌上的書本統統掃掉了，那不是開玩笑嗎？"},{"類":"立","文":"必定要把所對治的內容認得清清楚楚。"}]},{"題":"能治方法的質量次第","說":[{"類":"立","文":"進一步還要認得拿什麼來對治它，對治的方法以及正確與否，每一個地方的質、量、次第。"}]},{"題":"層層深入找到根本","說":[{"類":"回扣","文":"現在層層深入，找到生死的根本原因在煩惱；找到了以後，進一步了解煩惱是什麼。"}]}],"說":[{"類":"喻","文":"叫你掃地，本來是掃地上的垃圾，你卻把桌上的書本統統掃掉了，那不是開玩笑嗎？"},{"類":"立","文":"必定要把所對治的內容認得清清楚楚。"},{"類":"立","文":"進一步還要認得拿什麼來對治它，對治的方法以及正確與否，每一個地方的質、量、次第。"},{"類":"回扣","文":"現在層層深入，找到生死的根本原因在煩惱；找到了以後，進一步了解煩惱是什麼。"}],"af":"73a","st":80}],"逐字稿":[{"t":"73A 01:15","b":[["q","此復賴於先知煩惱，"],["s","你先必定要曉得什麼是煩惱。"]]},{"t":"73A 01:20","b":[["q","故於煩惱，應當善巧。"],["s","你要善巧地了知，你才可以對治它呀！否則的話你做任何事情，叫你拔草固然如此，叫你掃地如此，叫你做任何事情 ……今天跑得來叫你打掃這個房間，掃一下，你到底要掃掉什麼你不知道，本來叫你掃掉地上的垃圾，你卻把桌子上面的那些書本統統掃掉了，那你算什麼呀？那不是開玩笑嗎？這樣。所以必定要把你所對治的內容，要認得得清清楚楚。進一步還要認得，所對治的內容知道了，拿什麼東西來對治它，對治的方法以及這個正確與否，每一個地方它的質、量、次第。"]]},{"t":"73A 02:12","b":[["s","現在我們又進一步層層深入，找到生死的根本原因，原來在煩惱。找到了以後，所以我們進一步去了解一下煩惱是什麼？下面看："]]}],"口譯音":"口譯音檔/siwei-kudi-08/013.mp3"},{"文":"此中分四：一正明煩惱，二如何生起之次第，三煩惱之因，四煩惱過患。今初","口譯":"這部分分四點：一、說明什麼是煩惱；二、煩惱生起的順序；三、煩惱的起因；四、煩惱的過患。下面先講第一點。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"73A 02:36","頁":170,"af":"73a","st":156,"et":247,"消文":[{"文":"第一先如法如理地了解什麼是煩惱。"},{"文":"從生起的次第上可以找到它的根源；了解了禍患準備消滅它，就找它的原因、根本、行相，每一處清楚了，就容易下手對治。"},{"類":"立","文":"煩惱對治了，一切痛苦都解決；自己的問題解決了，才能幫助別人。"},{"類":"回扣","文":"不管大乘小乘，自利利人的根本在此，所以這裡叫「共中士」：學大乘也從這裡開始。"}],"延伸":[],"逐字稿":[{"t":"73A 02:36","b":[["q","此中分四：一正明煩惱，"],["s","第一個先說煩惱是什麼，對這個我們必定要先了解它，如法如理地了解什麼是煩惱。第二呢，"]]},{"t":"73A 02:52","b":[["q","二如何生起之次第，三煩惱之因，四煩惱過患。　今初"],["s","為什麼要找那個生起的次第？你從那個生起的次第上面你可以找到它 ─哦！它的根源在哪裡。然後呢生起的原因是什麼，最後它有什麼禍害。你這個了解了以後，它這個禍患了解了，你準備要消滅它；要去消滅它，你就找到它的什麼原因，然後它的根本在哪裡，就這樣，都找到了，以及它煩惱的行相，你每一個地方清楚了，那個時候你就容易下手對治。這個煩惱對治了，一切痛苦都解決，你能夠自己有問題解決了，那個時候你才能夠幫助別人哪！所以歸根結底，不管是大乘小乘、自利利人的根本在此，所以這個地方叫「共中士」 ─只管你自己的就你學這個，如果你要學大乘的也從這裡開始。看文："]]}],"口譯音":"口譯音檔/siwei-kudi-08/014.mp3"},{"文":"煩惱總相者。如《集論》云：「若有法生，即便生起極不靜相。由彼生故令心相續，極不靜起，是煩惱相。」謂若何生，令心相續，«極不寂靜»。","口譯":"煩惱共同的特徵，就像《集論》說的：「有一種心念一生起，心就變得非常不平靜；因為它生起，讓心念一個接一個都非常不安，這就是煩惱的特徵。」意思是：凡是一生起就讓心念非常不平靜的，就是煩惱。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"73A 04:07","頁":170,"af":"73a","st":247,"et":399,"消文":[{"文":"「法」指一切色法、心法；任何一樣東西生起，就生起不寂靜、不安靜的相，令身心相續不寂靜繼續不斷，這叫煩惱相。"}],"延伸":[{"題":"極不寂靜","組":[{"題":"粗猛的容易認得","說":[{"類":"例","文":"發脾氣的時候坐立不安，青筋直爆，心裡直跳，什麼事情都幹得出來；貪心來時也是很強烈的狀態。"}]},{"題":"學靜才顯出不靜","說":[{"類":"立","文":"細微的狀態平常難感覺；當你學定坐下來，才覺得「哎呀，這個不行啊」。"},{"類":"下手","文":"一定要相對地去學一個寧靜的狀態，才顯得出不寂靜，也才了解行的自相。"}]},{"題":"眼前都在煩惱當中","說":[{"類":"破","文":"凡夫以為發了脾氣才叫煩惱，不是的。"},{"類":"立","文":"有了這個經驗，任何時候心裡生起來就認得它：眼前任何狀態都在煩惱當中，只是比較細，或在癡性當中。"}]}],"說":[{"類":"例","文":"發脾氣的時候坐立不安，青筋直爆，心裡直跳，什麼事情都幹得出來；貪心來時也是很強烈的狀態。"},{"類":"立","文":"細微的狀態平常難感覺；當你學定坐下來，才覺得「哎呀，這個不行啊」。"},{"類":"下手","文":"一定要相對地去學一個寧靜的狀態，才顯得出不寂靜，也才了解行的自相。"},{"類":"破","文":"凡夫以為發了脾氣才叫煩惱，不是的。"},{"類":"立","文":"有了這個經驗，任何時候心裡生起來就認得它：眼前任何狀態都在煩惱當中，只是比較細，或在癡性當中。"}],"af":"73a","st":285}],"逐字稿":[{"t":"73A 04:07","b":[["q","煩惱總相者。如《集論》云：「若有法生，即便生起極不靜相。由彼生故令心相續，極不靜起，是煩惱相。」謂若何生，令心相續，極不寂靜。"],["s","說任何一個法 這個「法」指一切色法、心法，所有的任何一樣東西 如果這個生起的時候，就生起一個不寂靜、不安靜的相。因為這個生了以後，令我們身心相續不寂靜繼續不斷地生起，這個叫煩惱相，這個叫煩惱相。所以現在我們因為沒有體會到這個「靜」這個狀態，所以這個煩惱相不明顯，但是呢粗猛的卻是很容易。譬如說你發脾氣了，我自己覺得：唉呀！那個時候人就坐立不安，然後呢就是面孔上青筋直爆，心裡面就直跳。啊！這個樣子，就什麼事情都幹得出來，跟著來了。貪心來的時候也是一樣，那個時候心裡面是很強烈的狀態，可是沒有這種強烈的這種啊，細微的這個狀態平常就難感覺得出來了。只有當你要學定，坐下來的話，你就自己覺得心裡邊：「哎呀，這個不行啊！」所以你一定要相對地去學一個寧靜的狀態，那個時候你就顯得出來不寂靜的狀態，那個時候你也才了解所謂行的自相，這一點在這個地方特別說明一下。"]]},{"t":"73A 05:53","b":[["s","反過來，你有了這個經驗，就很容易感受到：哦，這個煩惱生起來了！就在任何那個時候心裡面生起來，你就認得它。通常我們的凡夫剛才開始覺得什麼叫煩惱，好像等到你發了脾氣了這個才叫煩惱，不是的，不是的。就是你眼前在任何狀態都是，這是都在煩惱當中，不過這種煩惱比較細，或在癡性當中，這個是我們必定應該了解的，這個是它的總體整相。各別地說來，那麼十種，十種，就是屬於我們平常說的五鈍、五利。貪，第一個。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/015.mp3"},{"文":"各別相中有十煩惱。貪者，謂緣內外可意淨境，隨逐躭著，如油著布難以洗除。此亦«耽戀自所緣境»，與彼所緣難以分離。","口譯":"個別的特徵，有十種煩惱。貪，是看到自己身上或外面令人喜歡、覺得美好的東西，就黏著放不下，像油沾到布上很難洗掉。貪也是對所喜愛的對象戀戀不捨，很難跟它分開。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"73A 06:39","頁":170,"af":"73a","st":399,"et":510,"消文":[{"文":"十種就是平常說的五鈍、五利。"},{"文":"不管所緣的是內或外：外是一切境界，內是自己身心，乃至意地當中的見解，我的地位、我的名譽；跟著它一直不放失，著在上頭。"},{"類":"喻","文":"油碰在布裡還可以洗乾淨；祖師說「如油入麵」，油放在麵粉糰裡，一點辦法都沒有。"}],"延伸":[{"題":"耽戀自所緣境","組":[{"題":"難分難解的行相","說":[{"類":"立","文":"對自己所緣的歡喜它，不忍分離、難分難解，心裡就是這樣；貪心生起來，簡直一點辦法都沒有。"}]},{"題":"看不見，卻隨時都在","說":[{"類":"例","文":"不但好看、好吃、好玩、有錢；眼前有東西總歸選好的，累了就要去躺，碰見一點小不如意就想……"}]},{"題":"對我的耽著","說":[{"類":"回扣","文":"總歸對這個「我」產生種種耽著，就是貪的行相。"}]}],"說":[{"類":"立","文":"對自己所緣的歡喜它，不忍分離、難分難解，心裡就是這樣；貪心生起來，簡直一點辦法都沒有。"},{"類":"例","文":"不但好看、好吃、好玩、有錢；眼前有東西總歸選好的，累了就要去躺，碰見一點小不如意就想……"},{"類":"回扣","文":"總歸對這個「我」產生種種耽著，就是貪的行相。"}],"af":"73a","st":457}],"逐字稿":[{"t":"73A 06:39","b":[["q","各別相中有十煩惱。貪者，謂緣內外可意淨境，隨逐躭著，如油著布難以洗除。此亦耽戀自所緣境，與彼所緣難以分離。"],["s","這個就是貪的行相。不管你這個心所緣的、所對的是內或者是外，外是外面的一切境界，內是你自己的身心，乃至你意地當中的見解，覺得我這個地位、我這個名譽、我這個什麼，這些。對這些東西跟著它，一直不放失，著在這個上頭。這個東西叫油碰在布裡邊，我們祖師更有一句話：如油入麵 ─碰到布裡邊還可以洗得乾淨，如果這個油啊放在麵粉糰裡面，你拿它一點辦法都沒有，這個貪就這麼個難弄法。"]]},{"t":"73A 07:37","b":[["s","就是他又進一步說，「耽著自所緣境」，這個貪的行相就是對你自己所緣的歡喜它，不忍分離、難分難解的狀態，心裡邊就是這樣！這個就是貪的行相。所以平常當我們貪心生起來，你簡直一點辦法都沒有。而且這個貪心的行相啊，你真正看好像看不見，但是隨時隨地都在。哦，這樣，不但是我們經常說外面好看的、好吃的、好玩的、有錢什麼等等，眼前一切的東西，你自然而然覺得眼前有個東西總歸選好的；唉呀，累了就要去躺；碰見一點小的不如意呀就想 ……總歸對這個「我」產生種種的耽著，這就是這個行相。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/016.mp3"},{"文":"瞋者，謂緣諸有情及苦，苦具，謂刀杖荊刺等，發恚惱心，發粗猛心，於彼諸境思作無義。","口譯":"瞋，是緣諸有情以及苦、苦具（也就是刀杖、荊棘等），生起恚惱之心、粗猛之心，對那些境界想要做無義的損害。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"73A 08:30","頁":170,"af":"73a","st":510,"et":569,"消文":[{"文":"對有情（對方）、苦的本身，或傷害我們的東西，發不能忍耐、粗猛的瞋恚心，要對所瞋的境界做無理的傷害。"},{"類":"例","文":"一個東西撞你一下，你一定把它拿掉，那就是對苦具。"}],"延伸":[],"逐字稿":[{"t":"73A 08:30","b":[["q","瞋者，"],["s","那麼第二個。"]]},{"t":"73A 08:33","b":[["q","謂緣諸有情及苦，苦具，謂刀杖荊刺等，發恚惱心，發粗猛心，於彼諸境思作無義。"],["s","瞋就是這樣。對於或者是「有情」 ─對方嘛！「苦、苦具」，這個苦就是苦的、痛苦的本身，或者是傷害我們的那些東西。傷害我們的東西，那些刀啊、杖啊、什麼東西啊，如果這些傷了你，你就對它：「好，這個傢伙，你！」譬如說你跑過去，一個東西撞你一下，這個東西你一定把它拿掉它，就是這個，那是苦具。發那個不能忍耐、粗猛地對它這種心，瞋恚的心情，要想對所緣的、所瞋的這個境界，做無理的要傷害它的。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/017.mp3"},{"文":"慢者，謂依止薩迦耶見，緣內外之高下好惡，令心高舉，高相隨轉。","口譯":"慢，是以「有個實在的我」這種錯誤見解（薩迦耶見）為基礎，在自己和別人的高低好壞上比來比去，讓心高高在上，一直擺出高人一等的樣子。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"73A 09:29","頁":170,"af":"73a","st":569,"et":613,"消文":[{"文":"慢依薩迦耶見；薩迦耶見通常說「我見」，正翻叫「壞聚見」，下面再講。"},{"文":"慢就是依我，覺得我比他高、我不如他；不管內外，總使自己要想高過對方、高過別人。"}],"延伸":[],"逐字稿":[{"t":"73A 09:29","b":[["q","慢者，謂依止薩迦耶見，緣內外之高下好惡，令心高舉，高相隨轉。"],["s","慢，怎麼來的呢？它有依一個薩迦耶見，薩迦耶見通常我們就說「我見」，但是呢正翻的時候不叫我見，叫「壞聚見」，等到下面講那個薩迦耶見的再講。通常就說我，慢就是依我，然後呢我比他高、我不如他，由於這樣，不管是內、是外，現出來這個，總是使得自己要想高過對方、高過別人。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/018.mp3"},{"文":"無明者，謂於四諦，業果，三寶自性，«心不明了»，染污無知。","口譯":"無明，是對四諦、業果、三寶的真實內涵，心裡不清楚，這種被煩惱染污的無知。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"73A 10:13","頁":170,"af":"73a","st":613,"et":710,"消文":[{"文":"對真實的內容不了解叫作無明；四諦是世間真實的行相。"}],"延伸":[{"題":"心不明了","組":[{"題":"不知苦、不知苦因","說":[{"類":"立","文":"世間一切是苦，偏偏不了解；苦有原因，又找錯了非苦之因。"},{"類":"例","文":"假定知道苦的原因，人家罵你一下，一定忍受：他所以罵我，總是以前欠了他，還了就好了；實際上我們不會。"}]},{"題":"更不知滅道","說":[{"類":"立","文":"流轉不知道；能徹底淨除的辦法，滅諦、道諦，更不知道。"}]},{"題":"自作聰明說迷信","說":[{"類":"破","文":"講這個道理的人，我們還自作聰明說是迷信，世間真顛倒！"},{"類":"回扣","文":"業果、三寶自性不明了，是染污的無知，就是愚癡，生死的根本。"}]}],"說":[{"類":"立","文":"世間一切是苦，偏偏不了解；苦有原因，又找錯了非苦之因。"},{"類":"例","文":"假定知道苦的原因，人家罵你一下，一定忍受：他所以罵我，總是以前欠了他，還了就好了；實際上我們不會。"},{"類":"立","文":"流轉不知道；能徹底淨除的辦法，滅諦、道諦，更不知道。"},{"類":"破","文":"講這個道理的人，我們還自作聰明說是迷信，世間真顛倒！"},{"類":"回扣","文":"業果、三寶自性不明了，是染污的無知，就是愚癡，生死的根本。"}],"af":"73a","st":640}],"逐字稿":[{"t":"73A 10:13","b":[["q","無明者，謂於四諦，業果，三寶自性，心不明了，染污無知。"],["s","這叫作無明 ─對於真實的內容不了解。這個四樣東西（四諦）是世間真實的行相，世間一切真實的行相是苦的，你就偏偏不了解，覺得這是苦。那個苦呢是有它原因的，你又不了解，以為呀 ……找錯了非苦之因。譬如說，我們現在有苦了，應該了解這個苦的原因，從根本上面下手，但是我們平常都不知道的，平常都不知道的。假定我們知道苦的原因，人家來罵你一下的話，你一定忍受。為什麼？欸，他所以罵我，我總是以前欠了他，還了就好了嘛！但是實際上呢，我們不會。為什麼？因為我們不知道苦的原因，所以第二個，對這個事情的真相的因也不知道。同時呢，這流轉固然不知道啊，說它的的確確苦，也像你所希望的把它徹底地淨除，徹底地淨除有它徹底淨除的辦法，這個叫滅諦、道諦，這是我們更不知道！這個就是我們世間，偏偏講這個道理的人，我們還自作聰明，說這是迷信，世間真顛倒啊！「業果」那是由業感果，「三寶的自性」等等，這個不明了，這是種無知，這是錯誤的、染污的無知，就是愚癡。這個愚癡啊，染污、雜染的，所以啊生死的根本。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/019.mp3"},{"文":"疑者，謂緣諦等三法，«念其有耶無耶？是耶非耶？»","口譯":"疑，是緣四諦等三種法，心想：它是有呢、還是沒有？是對呢、還是不對？","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"73A 11:50","頁":170,"af":"73a","st":710,"et":800,"消文":[{"文":"這是懷疑；疑的反面是信。"},{"類":"回扣","文":"貪、瞋、無明、疑、慢是五鈍使，下面是五利使；一個行相非常猛利，一個不猛利但深厚，這裡沒提先不談。"}],"延伸":[{"題":"念其有耶無耶","組":[{"題":"只是啟發了信的種子","說":[{"類":"破","文":"不要以為我們現在信了，信談不到；只是啟發了信的種子，正在這條路上走。"}]},{"題":"預流聖者不壞信","說":[{"類":"例","文":"證得預流果的聖者得不壞信，寧願餓死也不會造惡，因為曉得一定有因果關係，沒有一點懷疑。"}]},{"題":"講時有，做時忘","說":[{"類":"破","文":"我們儘管曉得因果，講的時候有，做的時候忘得乾乾淨淨；曉得不可以做，做的時候照做不誤。"},{"類":"回扣","文":"這都是信心未淨，疑在這裡。"}]}],"說":[{"類":"破","文":"不要以為我們現在信了，信談不到；只是啟發了信的種子，正在這條路上走。"},{"類":"例","文":"證得預流果的聖者得不壞信，寧願餓死也不會造惡，因為曉得一定有因果關係，沒有一點懷疑。"},{"類":"破","文":"我們儘管曉得因果，講的時候有，做的時候忘得乾乾淨淨；曉得不可以做，做的時候照做不誤。"},{"類":"回扣","文":"這都是信心未淨，疑在這裡。"}],"af":"73a","st":725}],"逐字稿":[{"t":"73A 11:50","b":[["q","疑者，謂緣諦等三法，念其有耶無耶？是耶非耶？"],["s","這個是懷疑，這個是懷疑。這個疑的反面是信，我們不要以為我們現在信了，我們信談不到哦！我們只是已經啟發了信的種子，正在這條路上去走。真正得到了淨信心的，譬如說：證得預流果的聖者叫不壞信，他那個信心就清淨了。他到那個時候一定寧願餓死，他不會造惡。他因為曉得這個一定有它的因果關係，他不會在那個果相上面，沒有一點懷疑。我們儘管曉得因果，講的時候有，做的時候忘得乾乾淨淨；曉得這個不可以做，做的時候又照做不誤，就是這樣。所以這種狀態啊，那都是什麼？這個信心未淨，這個疑在這裡。"]]},{"t":"73A 12:51","b":[["s","那麼這個就是通常我們所謂的五鈍使 ─貪、瞋、無明、疑、慢；下面叫五利使，通常我們說。為什麼叫鈍的、利的呢？因為這個行相非常地猛利；一個呢前面並不是很猛利，但是呢它很深厚，這個既然這裡沒提，我們先不去談它。那麼下面就是"]]}],"口譯音":"口譯音檔/siwei-kudi-08/020.mp3"},{"文":"壞聚見者，謂緣取蘊，計我我所，染慧為性，我我所見。","口譯":"壞聚見，是緣五取蘊，計執為我、我所，以染污慧為體性，就是我見、我所見。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"73A 13:20","頁":171,"af":"73a","st":800,"et":883,"消文":[{"文":"平常就說我見。實際上真的有我、我所嗎？沒有；原來只是取蘊：色受想行識五樣東西聚在一塊。"},{"文":"它在無常變壞當中，是虛假的；染慧是染污的認識，觀照的力量透過雜染看錯了，以為上頭有我、我所。"},{"類":"立","文":"平常一天到晚忙這個我，原來是壞聚；真正騙你的根本就在這裡。"}],"延伸":[],"逐字稿":[{"t":"73A 13:20","b":[["q","壞聚見者，"],["s","平常就說我見。"]]},{"t":"73A 13:24","b":[["q","謂緣取蘊，計我我所，染慧為性，我我所見。"],["s","那就是說，見到了「我」跟「我所」這個東西。那為什麼叫它「壞聚見」呢？實際上真的有我嗎？真的有我所嗎？沒有。原來這是什麼？這是聚、聚，「取蘊」或者是；這個蘊就是歸類，這個五樣東西聚在一塊，哪五樣東西啊？色、受、想、行、識。而這個東西在無常的變壞當中，它是虛假的，是一無可取的，結果因為我們「染慧」 ─染污的認識，慧是一種觀照的力量，這個觀照的力量透過了染污、雜染了，你看不清楚，看錯了，以為在這個上頭有一個我或者我所。所以我們另外的名字叫我、我所見，這個地方叫壞聚見。當你認識了這個東西以後，你就對這個東西，平常我們一天到晚忙這個我，原來這個是什麼 ─壞聚，真正騙你的根本就在這裡啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-08/021.mp3"},{"文":"其中壞是無常，聚是眾多，為欲顯此所見之事，唯是無常，非一之法，«全無常一補特伽羅»，故為立名曰壞聚見。","口譯":"其中「壞」是指會變化、無常；「聚」是指由很多部分合成。為了說明我們所看的這個身心，只是無常、由多種東西組成的，根本沒有一個恆常不變、單一的「我」，所以叫做「壞聚見」。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"73A 14:43","頁":171,"af":"73a","st":883,"et":1105,"消文":[{"文":"壞是無常，聚是幾樣東西合起來；補特伽羅以前稱人、有情，在自己身上叫作我。"},{"類":"立","文":"一切的根本都從這個上頭來；無常早就了解，任何情況之下停不住它一剎那。"}],"延伸":[{"題":"全無常一補特伽羅","組":[{"題":"身心非一，手不是我","說":[{"類":"例","文":"手切斷了，你還是你，只少了一個手；「我的手」屬於你，不是你。"},{"類":"例","文":"腳、心臟如此；「我的心」，心也不是我，一樣的道理。"}]},{"題":"說作得了主，仍是被動","說":[{"類":"例","文":"我說你作不了主，你回答「我作得了」，這是被動的；主是主動，你完全在被動。"},{"類":"破","文":"在相對範圍之內有似是而非的作主，就像前面似是而非的安樂，這就是顛倒。"}]},{"題":"染慧如戴有色眼鏡","說":[{"類":"喻","文":"戴了黃顏色眼鏡，白的看成黃的；戴了紅的看成紅的。染慧所見就是這樣。"}]}],"說":[{"類":"例","文":"手切斷了，你還是你，只少了一個手；「我的手」屬於你，不是你。"},{"類":"例","文":"腳、心臟如此；「我的心」，心也不是我，一樣的道理。"},{"類":"例","文":"我說你作不了主，你回答「我作得了」，這是被動的；主是主動，你完全在被動。"},{"類":"破","文":"在相對範圍之內有似是而非的作主，就像前面似是而非的安樂，這就是顛倒。"},{"類":"喻","文":"戴了黃顏色眼鏡，白的看成黃的；戴了紅的看成紅的。染慧所見就是這樣。"}],"af":"73a","st":958}],"逐字稿":[{"t":"73A 14:43","b":[["q","其中壞是無常，聚是眾多，為欲顯此所見之事，唯是無常，非一之法，全無常一補特伽羅，故為立名曰壞聚見。"],["s","那麼就解釋一下。為什麼是「壞」呢？無常呀！「聚」是幾樣東西合起來。就是我們這個染慧所見的東西，它是「無常」的，是「非一」的，全沒有常一的補特伽羅。「補特伽羅」我們以前稱為人、有情，就這樣。這個人跟有情在自己身上叫作我，就這個地方立為壞聚見，一切的根本都從這個上頭來的，一切的根本都從這個上頭來的。它既無常，也非一，所謂「一」的話，什麼？我們總覺得好像「我」這個東西就是我，天生來如此，獨立的，就是，實際上不是。而且我還有一個特質是可以主宰的，這種東西全沒有，我們以前都討論過。無常，早就了解，在任何情況之下，你沒有辦法停住它一分、一秒、一剎那。"]]},{"t":"73A 15:58","b":[["s","至於這「一」，就是一跟異是相對的，實際上你真正是一嗎？不是！身、心兩個很明白。如果是一的話，說你那個手，這個手算是你，還是不是你啊？如果說是一的話，那的的確確這個手，你跟手分不開；如果那個手切斷掉了，對不起！你還是你，好好的，只是你少掉了一個手，可想而知這個不是，實際上狀態。同樣理論上面，如果「你的手」或者「我的手」，不要說「我的」、「你的」，屬於你的，那不是你，不是很明白嗎？所以這也不是一。那麼手是如此，腳也是如此，乃至於心臟也可以如此，就是這個樣子。那我的心呢，應該是我吧？同樣的說「我的心」，那是「我的心」哦，心不是我耶，一樣的道理，這個很清楚、很明白。"]]},{"t":"73A 16:56","b":[["s","然後你能作得了主嗎？那我們已經討論過了，現在談到這問題，又再說一下。我說我啊，不妨我們對白，譬如我們兩人談論，我說：「你作不了主。」你想了半天：「對呀！我是作不了主。」那當然作不了主。也許有人不服氣，說：「不！我作得了主。」當你說你作得了主的時候，你是什麼啊？因為我說你作不了，所以你回答我，說你能作得了主，你這是被動的，對不對？我說你這樣，「欸，我說我這樣。」這你被動的，請問你被動的，這是算「主」嗎？主是什麼啊？主是主動耶，你完全在被動耶！所以你說：「我是作不了。」那麼當然已經作不了。結果你說：「我作得了。」你還是作不了。人就是這麼顛倒啊！這樣。但是呢他的的確確在他相對的範圍之內，是有他似是而非的這種作主，就好像前面說似是而非的那個安樂在，這個就叫作顛倒啊！所以叫染慧。所以他那個觀照的能力，由染污所看見的，所以戴了個有色眼鏡，明明是白的，他看起來戴了個黃顏色就看成黃的，戴了紅顏色就看成紅的，就這樣。這個就是壞聚見。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/022.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-08/001.webp","n":1},{"img":"投影片/siwei-kudi-08/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/siwei-kudi-08/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/siwei-kudi-08/004.webp","n":4},{"img":"投影片/siwei-kudi-08/005.webp","n":5},{"img":"投影片/siwei-kudi-08/006.webp","n":6},{"img":"投影片/siwei-kudi-08/007.webp","n":7},{"img":"投影片/siwei-kudi-08/008.webp","n":8,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=72b&st1=809&et1=993","box":[0.133625,0.3091111111111111,0.13775,0.07733333333333334]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-08/009.webp","n":9},{"img":"投影片/siwei-kudi-08/010.webp","n":10},{"img":"投影片/siwei-kudi-08/011.webp","n":11,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=72b&st1=993&et1=1155","box":[0.534875,0.2791111111111111,0.1265,0.064]}],"photo":[0.05,0.1666666666666666   if(P.af!==af||P.usingRemote){P.af=af;P.usingRemote=false;aud.src=src;aud.onloadedmetadata=()=>{aud.onloadedmetadata=null;go()};aud.load()}
  else go();
  $("#plLabel").innerHTML=`${esc(rangeTxt(af,st,P.et))}<b>${esc(title||"")}</b>`;
  $("#player").hidden=false;
  const ext=$("#plExt");if(ext)ext.href=playUrl(af,st,P.et);

// 連續播放：接著播下一段，畫面跟著選到那一段
// 重複播放：每遍之間停 5 秒（播放列顯示倒數）
const LOOP_GAP=5;
function loopAgain(){
  const aud=$("#aud");if(P.waiting)return;
  aud.pause();aud.currentTime=P.st;P.waiting=true;
  let g=$("#gapaud");if(!g){g=document.createElement("audio");g.id="gapaud";g.preload="auto";g.src="音檔/silence-5s.mp3";document.body.appendChild(g);
    g.addEventListener("ended",()=>{if(!P.waiting)return;P.waiting=false;clearInterval(P.waitT);if(P.loop)$("#aud").play().catch(()=>{})})}
  g.currentTime=0;
  g.play().then(()=>{const tm=$("#plTime");clearInterval(P.waitT);P.waitT=setInterval(()=>{if(!P.waiting){clearInterval(P.waitT);return}
      if(tm)tm.textContent=`${Math.max(1,Math.ceil(LOOP_GAP-g.currentTime))} 秒後重播`},250)})
   .catch(()=>{P.waiting=false;if(P.loop)setTimeout(()=>aud.play().catch(()=>{}),LOOP_GAP*1000)});   // 無聲檔播不了就退回計時
}
function cancelLoopWait(){if(P.waiting){P.waiting=false;clearInterval(P.waitT);const g=$("#gapaud");if(g)g.pause()}}
function playPrevSeg(){
  const L=S.lesson;if(P.lid!==L.id||P.seg==null||P.seg<=0)return false;
  const i=P.seg-1,s=L.段[i];P.seg=i;P.switching=true;setTimeout(()=>P.switching=false,800);
  selectSeg(i);playSeg(s.af,s.st,s.et,segName(L,i));return true;
}
function mediaMeta(title,album){
  if(!("mediaSession" in navigator))return;
  const base={title:title||"師父音檔",artist:"步步依師",album:album||""};
  try{navigator.mediaSession.metadata=new MediaMetadata({...base,artwork:[{src:new URL("icons/icon-192.png",location.href).href,sizes:"192x192",type:"image/png"},{src:new URL("icons/icon-512.png",location.href).href,sizes:"512x512",type:"image/png"}]})}
  catch(e){try{navigator.mediaSession.metadata=new MediaMetadata(base)}catch(_){}}   // 單機開檔時圖示網址不合法，就不帶圖
}
// 鎖定畫面的按鈕要控制「正在播的那一個」：師父音檔或口譯朗讀
function bindMediaSession(){
  if(!("mediaSession" in navigator))return;
  const ms=navigator.mediaSession,act=()=>{const k=$("#kyaud");return k&&!k.paused||(k&&K.playing)?"ky":"main"};
  const h=(name,fn)=>{try{ms.setActionHandler(name,fn)}catch(e){}};
  h("play",()=>{(act()==="ky"?$("#kyaud"):$("#aud")).play().catch(()=>{})});
  h("pause",()=>{$("#aud").pause();const k=$("#kyaud");if(k)k.pause()});
  h("nexttrack",()=>{if(act()==="ky")kyNext();else playNextSeg()});
  h("previoustrack",()=>{if(act()==="ky"){if(K.i>0)kyStart(K.i-1)}else playPrevSeg()});
  h("seekto",d=>{const a=act()==="ky"?$("#kyaud"):$("#aud");if(d&&d.seekTime!=null)a.currentTime=d.seekTime});
}
function playNextSeg(){
  const L=S.lesson;if(P.lid!==L.id||P.seg==null)return false;
  const i=P.seg+1;if(i>=L.段.length){toast("這堂課的音檔播完了");return false}
  const s=L.段[i];P.seg=i;P.switching=true;setTimeout(()=>P.switching=false,800);
  selectSeg(i);if(isMobile()&&$("#main").dataset.m==="outline")$("#oc"+i)?.scrollIntoView({behavior:"smooth",block:"start"});
  playSeg(s.af,s.st,s.et,segName(L,i));return true;

// 投影片上的迷你播放鈕：跟著師父音檔的狀態
function pvAudUI(){
  const b=$("#pvAud"),a=$("#aud");if(!b||!a)return;
  const on=!$("#player").hidden&&a.src;b.hidden=!on;if(!on)return;
  b.textContent=(a.paused?"▶ ":"❚❚ ")+($("#plLabel")?.innerText||"").replace(/\n/g," ");
}
function bindPlayer(){
  const aud=$("#aud");
  aud.addEventListener("error",()=>{ // 本機沒下載就改連線上
    if(!P.usingRemote&&P.af){P.usingRemote=true;const st=P.st;aud.src=audioSrc(P.af,true);aud.onloadedmetadata=()=>{aud.onloadedmetadata=null;aud.currentTime=st;aud.play().catch(()=>{})};aud.load();toast("本機沒有音檔，改從網路播放")}

  aud.addEventListener("play",icon);aud.addEventListener("pause",icon);
  aud.addEventListener("play",pvAudUI);aud.addEventListener("pause",pvAudUI);
  aud.addEventListener("ended",()=>{if(P.loop)loopAgain();else if(P.cont)playNextSeg()});   // 播到卷尾的段落

  $("#plLoop").onclick=()=>{P.loop=!P.loop;if(P.loop)P.cont=false;syncPM();if(!P.loop)cancelLoopWait();toast(P.loop?"重複播放這一段（每遍間隔 5 秒）":"重複播放：關")};
  $("#plCont").onclick=()=>{P.cont=!P.cont;if(P.cont)P.loop=false;syncPM();toast(P.cont?"連續播放：播完接下一段":"連續播放：關")};
  $("#ppBtn").onclick=()=>{if(P.waiting){cancelLoopWait();$("#aud").play().catch(()=>{});return}if(aud.paused){if(P.et!=null&&aud.currentTime>=P.et-0.3)aud.currentTime=P.st;aud.play().catch(()=>{})}else aud.pause()};
  $("#plClose").onclick=()=>{cancelLoopWait();aud.pause();$("#player").hidden=true};
  $("#plBar").onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),end=P.et??aud.duration;if(!end)return;aud.currentTime=P.st+(e.clientX-r.left)/r.width*(end-P.st);if(aud.paused)aud.play().catch(()=>{})};
  document.addEventListener("click",e=>{const t=e.target.closest("button.play-ts");if(t){P.seg=S.seg;P.lid=S.lesson.id;playSeg(t.dataset.af,+t.dataset.st,t.dataset.et,"逐字稿");return}const b=e.target.closest("button.play");if(!b)return;e.stopPropagation();P.seg=b.dataset.seg!=null?+b.dataset.seg:S.seg;P.lid=S.lesson.id;playSeg(b.dataset.af,+b.dataset.st,b.dataset.et,b.dataset.t)});
}
const durTxt=(st,et)=>{if(et==null||et==="")return"";const d=Math.max(0,(+et)-st);return d>=60?`${Math.floor(d/60)}分${String(d%60).padStart(2,"0")}秒`:`${d}秒`};
const rangeTxt=(af,st,et)=>`${af.toUpperCase()} ${mmss(st)}`+(et!=null&&et!==""?`～${mmss(+et)}・${durTxt(st,et)}`:" 起・播到卷尾");
const segRange = s=>`${s.af.toUpperCase()} ${mmss(s.st)}`+(s.et!=null?`～${mmss(s.et)}`:" 起");

// ───────── 科判樹 ─────────
const groupsOf=y=>y.組&&y.組.length?y.組:[{題:null,說:y.說||[]}];
function chars(text){const out=[];let red=false;for(const ch of text){if(ch==="«")red=true;else if(ch==="»")red=false;else out.push([ch,red])}return out}
function cols(cs,cap){const out=[];let i=0;while(i<cs.length){let j=Math.min(i+cap,cs.length);while(j<cs.length&&NO_HEAD.has(cs[j][0]))j++;out.push(cs.slice(i,j));i=j}return out}
function Node(lv,text,o={}){
  const c=LV[lv],n={lv,kids:[],...o};
  n.size=c.size;n.pitch=c.size*c.pitch;n.cols=cols(chars(text),c.cap);
  n.tagS=lv===3?Math.round(n.size*.7):n.size-2;
  n.tagH=n.tag?n.tag.length*n.tagS+14:0;
  n.bw=n.cols.length*n.pitch;n.bh=n.tagH+Math.max(...n.cols.map(c=>c.length))*n.size;
  return n;
}
function width(n){if(!n.kids.length)return n.bw;const g=LV[n.kids[0].lv].gap;
  return Math.max(n.bw,n.kids.reduce((a,k)=>a+width(k),0)+g*(n.kids.length-1))}
function buildTree(L,{xw,from=0,to=L.段.length-1}){
  const root=Node(1,L.根);
  L.段.forEach((s,i)=>{
    if(i<from||i>to)return;
    const n2=Node(2,s.文,{s:i,time:s.時});
    if(xw&&s.消文.length){const n3=Node(3,"消文",{kind:"xw",s:i});
      s.消文.forEach((x,k)=>n3.kids.push(Node(5,x.文,{tag:x.類,s:i,xi:k})));n2.kids.push(n3)}
    s.延伸.forEach((y,yi)=>{const n3=Node(3,"«"+y.題+"»",{tag:y.複習?"複習":"延伸",kind:"ys",s:i,yv:yi});
      groupsOf(y).forEach(g=>{let host=n3;
        if(g.題){host=Node(4,g.題,{kind:"grp",s:i,yv:yi});n3.kids.push(host)}
        g.說.forEach((x,k)=>host.kids.push(Node(5,x.文,{tag:x.類,s:i,yv:yi,k})))});
      n2.kids.push(n3)});
    root.kids.push(n2);
  });
  return root;
}
function layout(root){
  const h={};(function w(n){h[n.lv]=Math.max(h[n.lv]||0,n.bh);n.kids.forEach(w)})(root);
  const tops={};let y=MARGIN;Object.keys(h).sort().forEach(lv=>{tops[lv]=y;y+=h[lv]+ROW_GAP});
  const W=width(root)+MARGIN*2+40,H=y-ROW_GAP+MARGIN;
  (function place(n,right){n.x1=right;n.y=tops[n.lv];n.ax=right-n.pitch/2;
    if(n.kids.length){const g=LV[n.kids[0].lv].gap;
      // 最右邊的子節點對齊父節點的接線點，直線才不會拐一下
      let r=n.ax+n.kids[0].pitch/2;for(const k of n.kids){place(k,r);r-=width(k)+g}}})(root,W-MARGIN);
  return {root,W,H,tops};
}
function walk(n,f){f(n);n.kids.forEach(k=>walk(k,f))}
function glyphs(n,f){n.cols.forEach((col,ci)=>{const cx=n.x1-n.pitch*(ci+.5);col.forEach(([ch,red],i)=>f(VERT[ch]||ch,cx,n.y+n.tagH+(i+.5)*n.size,red))})}
function lines(lay,f){
  (function go(n){if(!n.kids.length)return;const bar=lay.tops[n.kids[0].lv]-BAR_DROP,xs=n.kids.map(k=>k.ax).concat(n.ax);
    const fc=n.tagH+n.cols[0].length*n.size, sg=n.lv===1?null:n.s;
    f(n.ax,n.y+fc+6,n.ax,bar,sg,n);f(Math.min(...xs),bar,Math.max(...xs),bar,sg,n);
    n.kids.forEach(k=>{f(k.ax,bar,k.ax,k.y-6,k.lv===2?k.s:sg,k);go(k)})})(lay.root);
}
// 整節時：每堂第一段的右側畫分隔，回傳 (x, 上緣, 下緣, 標籤, 是否第一堂)
function lessonMarks(lay,f){
  const L=S.lesson;if(!L||!L.isNode)return;
  walk(lay.root,n=>{if(n.lv!==2)return;const sg=L.段[n.s];if(!sg||sg.ls!==0)return;
    const first=n.s===lay.root.kids[0].s;
    f(n.x1+(first?0:LV[2].gap/2),lay.tops[2]-BAR_DROP-34,lay.H-20,`第${sg.堂}堂`,first)});
}
function tagColor(t){return t==="延伸"?"zhu":t==="複習"?"t-rev":"t-"+(TAGKEY[t]||"hui")}

// SVG：畫面版用 CSS 變數（跟著深淺色），匯出版寫死淺色
function svgOf(lay,{exp=false,caption=""}={}){
  const C=k=>exp?LIGHT[k]:`var(--${k})`;const o=[];
  const H=lay.H+(caption?40:0);
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" ${exp?"":'id="tree" '}width="${lay.W}" height="${H}" viewBox="0 0 ${lay.W} ${H}">`);
  if(exp)o.push(`<rect width="100%" height="100%" fill="${LIGHT.paper}"/>`);
  o.push(`<g id="treeg" font-family='${KAI}'>`);
  lessonMarks(lay,(x,y1,y2,label,first)=>{
    if(!first)o.push(`<line x1="${x.toFixed(1)}" y1="${y1}" x2="${x.toFixed(1)}" y2="${y2}" style="stroke:${C("zhu")};stroke-width:1.4;stroke-dasharray:7 6;opacity:.55"/>`);
    o.push(`<text x="${(x-8).toFixed(1)}" y="${y1+16}" font-size="17" text-anchor="end" style="fill:${C("zhu")}" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">${esc(label)}</text>`)});
  lines(lay,(x1,y1,x2,y2,sg)=>o.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"`+
    (exp?` stroke="${LIGHT.line}" stroke-width="1.5"`:(sg!=null?` data-s="${sg}"`:""))+`/>`));
  walk(lay.root,n=>{
    const cls=["n","lv"+n.lv];if(n.lv===5)cls.push("t-"+(TAGKEY[n.tag]||"none"));
    o.push(exp?"<g>":`<g class="${cls.join(" ")}"${n.s!=null?` data-s="${n.s}"`:""}${n.yv!=null?` data-y="${n.yv}"`:""}>`);
    if(!exp&&n.lv>1)o.push(`<rect class="hit" x="${(n.x1-n.bw-6).toFixed(1)}" y="${(n.y-8).toFixed(1)}" width="${(n.bw+12).toFixed(1)}" height="${(n.bh+16).toFixed(1)}" rx="6"/>`);
    if(n.kind==="xw"){const w=n.size+14;o.push(`<rect x="${(n.ax-w/2).toFixed(1)}" y="${n.y-8}" width="${w}" height="${n.bh+16}" rx="4" fill="none" stroke="${C("gold")}" stroke-width="1.6"/>`)}
    if(n.tag){const t=n.tagS,w=t+6,h=n.tag.length*t+8;
      o.push(`<rect x="${(n.ax-w/2).toFixed(1)}" y="${n.y}" width="${w}" height="${h}" rx="4" style="fill:${C(tagColor(n.tag))}"/>`);
      [...n.tag].forEach((ch,i)=>o.push(`<text x="${n.ax.toFixed(1)}" y="${(n.y+4+t*(i+.5)).toFixed(1)}" font-size="${t}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="${exp?"Noto Sans TC, Microsoft JhengHei, sans-serif":"var(--f-ui)"}">${esc(ch)}</text>`))}
    if(n.kind==="grp")o.push(`<line x1="${(n.ax-n.size*.45).toFixed(1)}" y1="${n.y-6}" x2="${(n.ax+n.size*.45).toFixed(1)}" y2="${n.y-6}" style="stroke:${C("zhu")};stroke-width:2"/>`);
    const base=n.kind==="xw"?C("gold"):n.kind==="grp"?C("ink-2"):C("ink");
    o.push(`<text font-size="${n.size}" text-anchor="middle" dominant-baseline="central"${n.lv===1?' font-weight="700"':""} style="fill:${base}">`);
    glyphs(n,(ch,x,y,red)=>o.push(`<tspan x="${x.toFixed(1)}" y="${y.toFixed(1)}"${red?` style="fill:${C("zhu")}"`:""}>${esc(ch)}</tspan>`));
    o.push(`</text>`);
    if(n.time&&!exp){const sg=S.lesson.段[n.s];o.push(`<title>${segName(S.lesson,n.s)}・${esc(segRange(sg))}${sg.頁?"・課本 p"+sg.頁:""}</title>`)}
    o.push("</g>");
  });
  o.push("</g>");
  if(caption)o.push(`<text x="${MARGIN}" y="${H-28}" font-size="18" fill="${LIGHT["ink-3"]}" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">${esc(caption)}</text>`);
  o.push("</svg>");return o.join("");
}

// ───────── 畫主圖 ─────────
function renderTree(keepScroll){
  const L=S.lesson,wrap=$("#treewrap");
  const prevRight=keepScroll?wrap.scrollWidth-wrap.scrollLeft:null;
  const root=buildTree(L,{xw:S.xw});
  const lay=layout(root);S.laid=lay;
  wrap.innerHTML=svgOf(lay);
  applyScale();
  // 縮圖：只畫方塊（原文灰、延伸朱、引導淡），不畫字
  const mb=[];walk(lay.root,n=>{if(n.lv<2)return;const f=n.kind==="ys"?"var(--zhu)":n.kind==="xw"?"var(--gold)":n.lv===2?"var(--ink-3)":"var(--rule)";
    mb.push(`<rect x="${(n.x1-n.bw).toFixed(0)}" y="${n.y}" width="${Math.max(6,n.bw-4).toFixed(0)}" height="${n.bh}" rx="6" style="fill:${f}" data-s="${n.s}"/>`)});
  $("#mini").innerHTML=`<svg viewBox="0 0 ${lay.W} ${lay.H}" preserveAspectRatio="none">${mb.join("")}</svg><div class="view" id="miniView"></div>`;
  $("#miniCap").textContent=`${L.段.length} 段原文・延伸 ${L.段.reduce((a,s)=>a+s.延伸.length,0)} 處`;
  if(prevRight!=null)wrap.scrollLeft=wrap.scrollWidth-prevRight;
  paintState();updateMini();
}
function applyScale(){
  const wrap=$("#treewrap"),svg=$("#tree"),lay=S.laid;if(!svg)return;
  if(S.scale==null){const h=wrap.clientHeight||700;S.scale=Math.max(.6,Math.min(1,(h-8)/lay.H))}
  svg.setAttribute("width",Math.round(lay.W*S.scale));svg.setAttribute("height",Math.round(lay.H*S.scale));
  $("#zFit").textContent=Math.round(S.scale*100)+"%";
}
function paintState(){
  const svg=$("#tree");if(!svg)return;
  svg.querySelectorAll(".n").forEach(g=>{
    const s=+g.dataset.s,isL2=g.classList.contains("lv2");
    g.classList.toggle("sel",isL2&&s===S.seg);
    g.classList.toggle("inrange",isL2&&S.range&&s>=S.range[0]&&s<=S.range[1]);
  });
  svg.querySelectorAll("line").forEach(l=>l.classList.toggle("on",l.dataset.s!=null&&+l.dataset.s===S.seg));
  svg.classList.toggle("filt",!!S.filter);
  if(S.filter)svg.querySelectorAll(".lv5").forEach(g=>g.classList.toggle("on",g.classList.contains("t-"+S.filter)));
  document.querySelectorAll("#tagbar .tagbtn").forEach(b=>b.setAttribute("aria-pressed",String(!S.filter||b.dataset.k===S.filter)));
}
function scrollToSeg(i,smooth=true){
  const wrap=$("#treewrap"),lay=S.laid;if(!lay||!wrap.clientWidth)return;
  let n=null;walk(lay.root,x=>{if(x.lv===2&&x.s===i)n=x});if(!n)return;
  const right=n.x1*S.scale,left=(n.x1-Math.max(n.bw,width(n)))*S.scale;
  const cw=wrap.clientWidth;
  // 整段（含延伸）放得下就置中；放不下就讓原文那一行靠右邊，往左讀
  let target=(right-left)<cw-80?(left+right)/2-cw/2:right+40-cw;
  target=Math.max(0,Math.min(wrap.scrollWidth-cw,target));

function updateMini(){
  const wrap=$("#treewrap"),v=$("#miniView");if(!v||!wrap.scrollWidth)return;
  const W=wrap.scrollWidth,tw=$("#mini").clientWidth;
  v.style.left=(wrap.scrollLeft/W*tw)+"px";v.style.width=Math.max(10,wrap.clientWidth/W*tw)+"px";
}

// ───────── 細看 ─────────
function kpPath(){ // 根據科判焦點找路徑
  const want=S.lesson.科判焦點;let found=null;
  (function go(n,p){const me=p.concat(n);if(!found&&(`${n.c} ${n.t}`===want||n.t===want))found=me;(n.k||[]).forEach(k=>go(k,me))})(S.kepan.樹,[]);

}
function renderDetail(){

async function toPng(lay,cap){
  const sc=2,H=lay.H+40,cv=document.createElement("canvas");cv.width=lay.W*sc;cv.height=H*sc;

  try{await Promise.all([26,21,30,46].map(z=>document.fonts.load(`${z}px "LXGW WenKai TC"`,all)))}catch(e){}
  ctx.fillStyle=LIGHT.paper;ctx.fillRect(0,0,lay.W,H);
  ctx.strokeStyle=LIGHT.line;ctx.lineWidth=1.5;
  lines(lay,(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()});
  lessonMarks(lay,(x,y1,y2,label,first)=>{ctx.save();ctx.strokeStyle=LIGHT.zhu;ctx.globalAlpha=.55;ctx.setLineDash([7,6]);
    if(!first){ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke()}ctx.restore();
    ctx.save();ctx.fillStyle=LIGHT.zhu;ctx.font='17px "Noto Sans TC",sans-serif';ctx.textAlign="right";ctx.textBaseline="alphabetic";ctx.fillText(label,x-8,y1+16);ctx.restore()});
  ctx.textAlign="center";ctx.textBaseline="middle";
  walk(lay.root,n=>{
    if(n.kind==="xw"){const w=n.size+14;ctx.strokeStyle=LIGHT.gold;ctx.lineWidth=1.6;rr(ctx,n.ax-w/2,n.y-8,w,n.bh+16,4);ctx.stroke()}
    if(n.tag){const t=n.tagS,w=t+6,h=n.tag.length*t+8;ctx.fillStyle=LIGHT[tagColor(n.tag)];rr(ctx,n.ax-w/2,n.y,w,h,4);ctx.fill();
      ctx.fillStyle="#fff";ctx.font=`500 ${t}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;[...n.tag].forEach((ch,i)=>ctx.fillText(ch,n.ax,n.y+4+t*(i+.5)))}
    if(n.kind==="grp"){ctx.strokeStyle=LIGHT.zhu;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(n.ax-n.size*.45,n.y-6);ctx.lineTo(n.ax+n.size*.45,n.y-6);ctx.stroke();ctx.strokeStyle=LIGHT.line;ctx.lineWidth=1.5}
    ctx.font=`${n.lv===1?"700 ":""}${n.size}px ${KAI}`;
    glyphs(n,(ch,x,y,red)=>{ctx.fillStyle=red?LIGHT.zhu:(n.kind==="xw"?LIGHT.gold:n.kind==="grp"?LIGHT["ink-2"]:LIGHT.ink);ctx.fillText(ch,x,y)});

  });
  ctx.textAlign="left";ctx.font='18px "Noto Sans TC","Microsoft JhengHei",sans-serif';ctx.fillStyle=LIGHT["ink-3"];ctx.fillText(cap,MARGIN,H-34);
  return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("圖太大，請改選較小的區段")),"image/png"));
}

  $("#dlCancel").onclick=()=>$("#pop").hidden=true;
  $("#dlGo").onclick=doDownload;
  $("#outline").addEventListener("click",e=>{const oc=e.target.closest(".oc");if(!oc||e.target.closest("a,summary,button"))return;const i=+oc.id.slice(2);if(i!==S.seg){S.seg=i;document.querySelectorAll("#outline .oc").forEach((el,k)=>el.classList.toggle("sel",k===i));paintState()}});
  document.querySelectorAll(".mtabs button").forEach(b=>b.onclick=()=>setM(b.dataset.m));
  addEventListener("resize",()=>{applyScale();updateMini();pvLayout()});
  document.addEventListener("fullscreenchange",()=>setTimeout(()=>{pvLayout();if(S.tab==="p"){pvVideo(slidesOf(S.lesson)[PV.i]);if(PV.emb){const e=PV.emb;pvEmbedClose();pvEmbedOpen(e.pg,e.url)}}},80));
  addEventListener("hashchange",fromHash);
  // 投影片：方向鍵換頁、F 全螢幕、Esc 離開（假全螢幕）
  document.addEventListener("keydown",e=>{
    if(S.tab!=="p"||(e.target.closest&&e.target.closest("input,select,textarea")))return;
    if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();pvShow(PV.i+1)}
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();pvShow(PV.i-1)}
    else if(e.key==="f"||e.key==="F"){pvFull(!(document.fullscreenElement||$(".pvstage.fakefs")))}
    else if(e.key==="Escape")pvFull(false);
  });
  // 手機：投影片左右滑動換頁
  let sx=null;document.addEventListener("touchstart",e=>{if(e.target.closest("#pvStage"))sx=e.touches[0].clientX},{passive:true});
  document.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>40)pvShow(PV.i+(dx<0?1:-1))},{passive:true});
}
// ───────── 分隔線：寬度存在本機 ─────────
const SPLIT={map:[270,0,520],det:[380,280,720]};
function setW(k,w,save){const [d,mn,mx]=SPLIT[k];w=Math.round(w);
  if(k==="map"&&w<90)w=0;else w=Math.max(mn,Math.min(mx,w));
  $("#main").style.setProperty(k==="map"?"--mapw":"--detw",w+"px");S[k+"W"]=w;
  if(save)store("kp."+k+"W",String(w));updateMini()}
function bindSplit(){
  [["gutL","map",1],["gutR","det",-1]].forEach(([id,k,sign])=>{
    const g=$("#"+id);let st=null;
    g.addEventListener("pointerdown",e=>{st={x:e.clientX,w:S[k+"W"]};g.setPointerCapture(e.pointerId);g.classList.add("on");document.body.classList.add("resizing");e.preventDefault()});
    g.addEventListener("pointermove",e=>{if(st)setW(k,st.w+sign*(e.clientX-st.x),false)});
    const end=()=>{if(!st)return;st=null;g.classList.remove("on");document.body.classList.remove("resizing");setW(k,S[k+"W"],true);applyScale()};
    g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
    g.addEventListener("dblclick",()=>{setW(k,SPLIT[k][0],true);store("kp."+k+"W",null)});
    g.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();setW(k,S[k+"W"]+(e.key==="ArrowRight"?sign:-sign)*20,true)}});
  });
  for(const k of ["map","det"]){const v=+store("kp."+k+"W");setW(k,v>=0&&store("kp."+k+"W")!=null?v:SPLIT[k][0],false)}
}
function zoomKeep(){const wrap=$("#treewrap"),fr=(wrap.scrollLeft+wrap.clientWidth/2)/wrap.scrollWidth;applyScale();wrap.scrollLeft=fr*wrap.scrollWidth-wrap.clientWidth/2;updateMini()}
function syncLayer(){$("#lyBoth").setAttribute("aria-pressed",String(S.xw));$("#lyYan").setAttribute("aria-pressed",String(!S.xw))}
function syncTabs(){$("#tabD").setAttribute("aria-selected",String(S.tab==="d"));$("#tabK").setAttribute("aria-selected",String(S.tab==="k"));$("#tabP").setAttribute("aria-selected",String(S.tab==="p"));$("#tabI").setAttribute("aria-selected",String(S.tab==="i"))}
function nodeKeyOf(L){return L.科判焦點}
function lessonsInNode(key){return S.index.filter(x=>x.科判焦點===key).map(x=>S.lessons[x.id]).filter(Boolean)}
function buildNode(key){
  const ls=lessonsInNode(key);if(!ls.length)return null;
  const id="n-"+ls[0].id;if(S.lessons[id])return S.lessons[id];
  const 段=[],分圖=[];
  ls.forEach(L=>{const a=段.length;L.段.forEach((x,i)=>段.push({...x,堂:L.堂數,lid:L.id,ls:i}));分圖.push({名:TN(L),原文:[a,段.length-1]})});
  const rng=ls[0].課本範圍.split("~")[0].trim()+" ~ "+ls.at(-1).課本範圍.split("~").pop().trim();
  const N={id,isNode:true,標題:ls[0].根,根:ls[0].根,科判焦點:key,課本範圍:rng,堂數:ls.length>1?`${ls[0].堂數}–${ls.at(-1).堂數}`:ls[0].堂數,
    日期:ls.length>1?`${ls[0].日期}～${ls.at(-1).日期}`:ls[0].日期,tch:ls[0].tch,音檔:Object.assign({},...ls.map(L=>L.音檔||{})),分圖,段};
  S.lessons[id]=N;return N;
}
function getLesson(id){if(S.lessons[id]&&!S.lessons[id].isNode)return S.lessons[id];
  if(id&&id.startsWith("n-")){const b=S.lessons[id.slice(2)];return b?buildNode(b.科判焦點):null}return S.lessons[id]||null}
// 段的稱呼：整節時加上堂數
function segName(L,i){const s=L.段[i];return L.isNode?`第${s.堂}堂・第 ${s.ls+1} 段`:`第 ${i+1} 段`}
// 堂次的稱呼：不算正課的（如下士道總複習）堂數是 null，改用「標記」
function TN(x){return x.堂數==null?(x.標記||"總複習"):`第${x.堂數}堂`}
function lessonInfoTxt(L){return L.isNode?`${L.根}・整節・第${L.堂數}堂・${L.課本範圍.replace(" ~ ","～")}`:[L.標題,TN(L)+(L.週?`（第${L.週}週）`:""),L.課本範圍.replace(" ~ ","～"),L.日期].filter(Boolean).join("・")}
function parseHash(){const m=location.hash.match(/^#([a-z0-9-]+?)-s(\d+)$/);return m&&getLesson(m[1])?{id:m[1],seg:+m[2]-1}:null}
function fromHash(){const h=parseHash();if(!h)return;if(h.id!==S.lesson.id)loadLesson(h.id,h.seg);else if(h.seg!==S.seg)selectSeg(h.seg)}
function loadLesson(id,seg=0,yan=null){
  const L=getLesson(id);if(!L)return;
  S.lesson=L;S.seg=Math.min(L.段.length-1,Math.max(0,seg));S.yan=yan;S.range=null;
  $("#lessonInfo").textContent=lessonInfoTxt(L);
  document.title=`${L.標題}・步步依師`;
  renderMap();renderTree();renderDetail();renderOutline();
  requestAnimationFrame(()=>{const w=$("#treewrap");w.scrollLeft=w.scrollWidth;scrollToSeg(S.seg,false);updateMini()});
  try{history.replaceState(null,"","#"+L.id+"-s"+(S.seg+1))}catch(e){}
  store("kp.last",L.id);
}

// ───────── 啟動 ─────────
async function start(){
  bind();bindPlayer();bindSplit();bindMediaSession();
  try{
    const emb=document.getElementById("kpdata");
    if(emb){const D=JSON.parse(emb.textContent);S.kepan=D.kepan;S.index=D.index;S.lessons=D.lessons;S.課表=D.課表||{}}
    else{
      const [kp,idx]=await Promise.all([fetch("data/kepan.json").then(r=>r.json()),fetch("data/index.json").then(r=>r.json())]);
      S.kepan=kp;S.index=idx;
      S.lessons={};for(const x of idx)S.lessons[x.id]=await fetch(`data/lessons/${x.id}.json`).then(r=>r.json());
    }
  }catch(e){$("#side").innerHTML=`<p>資料載入失敗：${esc(e.message)}。重新整理一次試試。</p>`;return}
  const hh=parseHash(),last=store("kp.last");
  S.lesson=getLesson(hh?hh.id:(last&&getLesson(last)?last:S.index.at(-1).id));
  const L=S.lesson;document.title=`${L.標題}・步步依師`;
  $("#lessonInfo").textContent=lessonInfoTxt(L);
  S.mapAll=store("kp.mapAll")==="1";S.sjMode=store("kp.sjMode")||"bh";S.kyBh=store("kp.kyBh")==="1";S.kyOrig=store("kp.kyOrig")==="1";K.rate=+(store("kp.kyRate")||1)||1;
  const sx=store("kp.xw");if(sx!=null)S.xw=sx==="1";syncLayer();
  const m=hh;if(hh)S.seg=Math.min(L.段.length-1,Math.max(0,hh.seg));else S.seg=0;
  renderMap();renderTree();renderDetail();renderOutline();
  const firstScroll=()=>{const w=$("#treewrap");w.scrollLeft=w.scrollWidth;scrollToSeg(S.seg,false);updateMini()};
  requestAnimationFrame(firstScroll);setTimeout(firstScroll,250);setTimeout(firstScroll,800);
  try{document.fonts.ready.then(()=>setTimeout(firstScroll,50))}catch(e){}
  if(m&&isMobile()){setM("outline");setTimeout(()=>$("#oc"+S.seg)?.scrollIntoView({block:"start"}),120)}
  try{downloads=window.claude?.use?await window.claude.use("downloads"):null}catch(e){downloads=null}
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&!window.claude){
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!S.reloaded){S.reloaded=true;location.reload()}});   // 新版接手就換成新版
  }
}
start();
</script>
</body></html>
