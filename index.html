檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=63b&st1=1688&af2=64a&af3=64b&et3=1515","段":[{"文":"惡淨之理者。","口譯":"以下說明惡業得以清淨的道理。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第四、淨除之理並及斷諍，分九：第一、由淨治者及對治圓不圓滿增上力故，淨除之理有上中下多種之理者：<\/span>惡淨之理者，","合註白話":null,"覺燈日光":null,"時":"63B 28:08","頁":146,"af":"63b","st":1688,"et":1748,"消文":[{"文":"為什麼懺悔能夠淨除種種的惡業？"},{"文":"前面說「縱使百千劫，所作業不亡」，這裡說能清淨，不是有矛盾了嗎？"},{"文":"對這個概念不清楚的話，最好把它弄清楚。"}],"延伸":[],"逐字稿":[{"t":"63B 28:08","b":[["q","惡淨之理者。"],["s","為什麼懺悔能夠淨除種種的惡業呢？那個惡為什麼能夠清淨呢？前面曾經說，這個業你造了以後，「縱使百千劫，所作業不亡，因緣合會時，果報還自受。」造了以後，不管多少時候它不亡的，它現在告訴我們說這個地方那個能夠清淨的，這不是有矛盾了嗎？這樣。那麼現在這地方告訴我們這個道理，告訴我們道理。因為我最近沒精神，所以也沒有來考你們，那這地方呢我來說明一下。如果說你們對這概念不清楚的話，那麼最好把它弄清楚。說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/001.mp3"},{"文":"謂諸能感於惡趣中極大苦因，或令變為感微苦因，或生惡趣，«然不領受諸惡趣苦»，","口譯":"就是說：本來能感得惡趣中極大痛苦的那個業因，或者讓它轉變成只感得輕微痛苦的因；或者雖然仍生到惡趣，卻不領受惡趣的種種苦；","四家合註":"謂諸能感於惡趣中極大苦因，或令變為感微苦因；或生惡趣，然不領受諸惡趣苦；","合註白話":{"id":"19284","頁":534,"白話":"第四科、淨化的道理以及斷除詰難，分為九科：第一科、由於淨化的人以及對治品圓滿與否，以致會有上中下各種淨除情形的道理：淨除罪惡的方式，是指原先會產生惡趣大苦之因，轉化為產生小苦之因；或者雖然投生惡趣，但是不會承受惡趣的痛苦；甚至僅僅在現在的所依身上引發頭痛，就得以淨除。同樣地，原先必須長時間承受的轉化為短暫承受，甚至完全不必承受。這也是由於淨化的人力量大小、四種對治力是否圓滿、勁道是否強猛，以及延續的時間長短等因素所致，所以無法一概斷定。","注釋":["感微苦因：此句在福智之聲出版社2003、2010年版《廣論》皆作：「感微苦困」，經查漢藏教理院本及藏文本，正確為「感微苦因」，故改之。","僅：法尊法師原譯作「稍」，今據藏文改譯。"],"已校":true},"覺燈日光":null,"時":"63B 29:08","頁":146,"af":"63b","st":1748,"et":null,"消文":[{"文":"本來會生到惡趣受極大苦報的業因，如法如理懺悔以後，變成很輕微的一點點困苦。"},{"文":"不再墮落到惡道；或者雖然墮落，但是不會領受那個痛苦。"}],"延伸":[{"題":"然不領受諸惡趣苦","組":[{"題":"阿闍世王墮而不受","說":[{"類":"例","文":"阿闍世王殺父，又幫提婆達多跟佛搗蛋，五逆重罪；臨終罪相現起，求佛懺悔。"},{"類":"立","文":"墮落了沒有？墮落了。受苦了沒有？沒有——拍球地獄，一下就跳出來。"}]},{"題":"獄火一觸，苦不堪忍","說":[{"類":"例","文":"祖師語錄裡有人到地獄看一眼，獄火烘一下，回到人間像燒焦一樣，幾個月都弄不好。"},{"類":"喻","文":"小指頭擺在開水裡燙十分鐘，你試試看。"}]},{"題":"莫說大話，唯有懺悔","說":[{"類":"破","文":"不要說「我不怕」「我要下地獄去度眾生」；師父自己受了一點小苦，這個大口萬萬不敢開。"},{"類":"例","文":"分菜時好的分給別人，壞的擺在那裡，心裡嘀咕了半天都放不下。"},{"類":"下手","文":"內心真正反省觀察，只有一條路——拼命懺悔，拼命修行。"},{"類":"立","文":"大話容易說，騙別人容易，騙自己一點都騙不了。"}]}],"說":[{"類":"例","文":"阿闍世王殺父，又幫提婆達多跟佛搗蛋，五逆重罪；臨終罪相現起，求佛懺悔。"},{"類":"立","文":"墮落了沒有？墮落了。受苦了沒有？沒有——拍球地獄，一下就跳出來。"},{"類":"例","文":"祖師語錄裡有人到地獄看一眼，獄火烘一下，回到人間像燒焦一樣，幾個月都弄不好。"},{"類":"喻","文":"小指頭擺在開水裡燙十分鐘，你試試看。"},{"類":"破","文":"不要說「我不怕」「我要下地獄去度眾生」；師父自己受了一點小苦，這個大口萬萬不敢開。"},{"類":"例","文":"分菜時好的分給別人，壞的擺在那裡，心裡嘀咕了半天都放不下。"},{"類":"下手","文":"內心真正反省觀察，只有一條路——拼命懺悔，拼命修行。"},{"類":"立","文":"大話容易說，騙別人容易，騙自己一點都騙不了。"}],"af":"64a","st":21}],"逐字稿":[{"t":"63B 29:08","b":[["q","謂諸能感於惡趣中極大苦因，或令變為感微苦因，或生惡趣，然不領受諸惡趣苦，或於現身稍受頭痛，即得清淨。"],["s","這個狀態，怎麼樣這個罪惡，這個惡業會清淨呢？下面告訴我們，說本來你造了這個惡業以後，這個惡業會感到、生到惡趣當中的，這個是受極大苦報的這個惡業的業因。現在經過了這樣地如法如理地懺悔以後，它就變得很小輕微的一點點的困苦，不再墮落到惡道，或者雖然墮落到惡道，但是你不會領受這個痛苦。"]]},{"t":"64A 00:21","b":[["s","我們曉得佛世有一個大公案，阿闍世王是摩羯陀國的頻婆娑羅王的兒子，他第一個把他父親殺掉，這個是五逆之罪；然後呢幫助提婆達多專門跟佛搗蛋，這麼一個人。最後臨終的時候那個罪相現起，哎呀！可怕極了。那麼好的，那個時候他有一個大臣耆婆，實際他就是他的弟弟，他是一個非常信佛的，耆婆是大醫王，他就告訴佛。「哦，告訴他，你現在就只有懺悔。」所以他那個時候生起大恐怖，然後呢去求佛懺悔，結果懺悔乾淨了，五逆之罪都懺悔乾淨哦！但是他懺悔，懺悔乾淨了，本來這個五逆之罪墮落這個無間地獄的話，是不得了地、不得了地恐怖啊，那無法想像的！結果他墮落了沒有？墮落了。受苦了沒有？沒有，他這個墮落叫拍球地獄，像那個球一樣，「蹬！」一下它跳出來了，所以他才下去，也就起來了，阿鼻地獄什麼樣子他不知道。"]]},{"t":"64A 01:45","b":[["s","如果說你們能夠這樣的話，你歡喜不歡喜啊？不要說叫你受它無量無邊的長劫，叫你跑得去受一天，那我們沒有一個人 ……。我曾經看見很多這種古代的這個祖師們語錄上面，有很多生前，那出家人也好，在家人也好，特別的因緣到地獄裡面去，偶然看見那個地獄裡面一點樣子。然後呢看見那個獄火燒的情況，那個火就噴出來烘上一下，這個痛苦啊，然後到了人間，那個像燒焦一樣，弄了幾個月都弄不好。喏、喏、喏！現在我們這個賴居士燙了一下，你們不妨試試看，如果你們不怕的話，最好弄那個開水，你選一個最小的地方自己試試看，小指頭擺在水裡面燙它個十分鐘，你試試看。"]]},{"t":"64A 02:47","b":[["s","我建議你們，不要說：「啊！我不怕。」這個話千萬不要說。因為以前我就犯了這個大毛病，總覺得自己英雄好漢，「欸！我不在乎！」乃至於說：「嗯，我要修學佛法，那下地獄去度眾生！」等到我後來受了一點小苦，唉呀，覺得這個大口是萬萬不敢開，不要說這樣啊！所以我常常說啊，你只要內心真正能夠反省觀察一下的話，沒有一個人例外的，他只有一條路 ─拼命懺悔，拼命修行。不要說你拿那個手指頭擺在水裡面，今天很簡單，吃飯了，分菜了，好的東西分給別人了，然後呢壞的東西擺在那裡，你心裡面老那個嘀咕，嘀咕了半天都放不下，這不是很清楚、很明白的道理嘛！所以在這一點上面，大話容易說，騙別人容易，騙自己是一點都騙不了的。這是一種，或者呢，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/002.mp3"},{"文":"或於現身稍受頭痛，即得清淨。","口譯":"或者就在現在這一生稍微受個頭痛，罪就清淨了。","四家合註":"或於現身僅受頭痛，即得清淨。","合註白話":{"same":1},"覺燈日光":null,"時":"64A 03:55","頁":146,"af":"64a","st":235,"et":245,"消文":[{"文":"現在這一身當中，就能夠得到清淨。"}],"延伸":[],"逐字稿":[{"t":"64A 03:55","b":[["q","或於現身稍受頭痛，即得清淨。"],["s","你現在現身當中，就是能夠得到清淨。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/003.mp3"},{"文":"如是諸應長時受者，或為短期，或全不受。此復是由淨修之人力之大小，四力對治，圓不圓具，勢猛不猛，及時相續恆促等門，故無定準。","口譯":"像這樣，本來應當長時領受的苦果，或者縮短為很短的一期，或者完全不必領受。這又是由修懺的人力量大小、四力對治具不具足、修的時候勢力猛不猛利、以及修的時間相續得久不久等等而定，所以沒有一定的標準。","四家合註":"如是諸應長時受者，或為短期，或全不受。此復是由淨修之人力之大小、四力對治圓不圓具、勢猛不猛，及時相續恆促等門，故無定準。","合註白話":{"same":1},"覺燈日光":null,"時":"64A 04:05","頁":146,"af":"64a","st":245,"et":333,"消文":[{"文":"本來要到三惡道受極長時候的大痛苦，懺悔以後很短的時候，乃至完全不受。這憑什麼？"},{"文":"看修的人力量大小、四力圓不圓滿、心情猛利不猛利、時間長短，所以沒有一定。"},{"文":"反過來說是一定的：對治有多少力量，就淨除多少惡業的力量，半斤對八兩，一絲一毫都不差。"}],"延伸":[],"逐字稿":[{"t":"64A 04:05","b":[["q","如是諸應長時受者，或為短期，或全不受。"],["s","像上面所說的，經過了懺悔以後，你要到三惡道中受極長時候的大痛苦，現在呢，欸，很短的時候，乃至於可以完全不受。這個憑什麼？"],["q","此復是由淨修之人力之大小，四力對治，圓不圓具，勢猛不猛，及時相續恆促等門，故無定準。"]]},{"t":"64A 04:34","b":[["s","「此復是由淨修之人力之大小，四力對治圓不圓具」，修的時候，勢猛不猛利，及修的時間相續是長還是短等門，所以「故無定準」。這個完全看你修的人的力量的大小，然後你四個力量圓滿不圓滿，修的時候的心情是猛利不猛利，修的時間是長短，所以沒有一定的。反過來說呢，一定的，你對治有多少力量，多少力量就淨除掉多少惡業的力量，半斤就是對八兩，一絲一毫都不差，就這樣清楚，就這樣明白！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/004.mp3"},{"文":"諸契經中及毘奈耶皆說：「諸業縱百劫不亡。」意謂未修四力對治，","口譯":"各部經和戒經都說「所造的業縱使經過百劫也不會消失」，意思是指還沒有修四力對治而言；","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、定業亦得從根淨除之理者：<\/span>諸契經中及《毘奈耶》皆說：「諸業縱百劫不亡。」意謂未修四力對治；","合註白話":{"id":"19318","頁":535,"白話":"第二科、即使是決定業也能徹底淨除的道理：佛經及《毘奈耶》都提到：「縱然歷經百劫，業也不會憑空消失。」這是基於沒有修持四力對治而說的；如果依照上述以四力對治淨化，則說即使是必定領受的業也能淨除。《八千頌大疏》中說：「如上所述，『凡是趨近於稍微增強對治品時，自己便會趨近於稍微被消減，這樣的法性在對治品大幅增強，變得有力而圓滿時，自己就必然容有可能被有力的對治品徹底消盡的時刻等，就像是黃金當中的雜質等，起初稍加淨化提煉時，就可能被稍微去除，因此在最終淨化圓滿時，雜質也就可以徹底消盡。所有謗法的正法業障等強力的業障，也都是上述對治品圓滿時，自己就會徹底消盡的法性。』藉由這個成立語的正理，能夠成立由於狂妄的心所致謗捨正法等墮落之處，都能一無遺漏地被對治品消盡。","注釋":["諸契經：相應段落參見唐義淨大師譯《大寶積經·佛說入胎藏會》云：「假使經百劫，所作業不亡，因緣會遇時，果報還自受。」宋施護等《福力太子因緣經》云：「假使經百劫，不壞諸業因，因緣和合時，有情隨受果。」見《大正藏》冊11，頁335、冊3，頁435；《甘珠爾》對勘本冊76，頁43。","《毘奈耶》皆說：引文唐義淨大師譯《根本說一切有部毘奈耶》作：「假使經百劫，所作業不亡，因緣會遇時，果報還自受。」見《大正藏》冊23，頁1053；《甘珠爾》對勘本冊1，頁94。","《八千頌大疏》中云：《八千頌大疏》，般若部論典，全名《聖般若八千頌釋現觀莊嚴光明論》，又名《八千頌廣釋》、《莊嚴光明論》，共32品，獅子賢論師著，尚無漢譯。獅子賢論師，廣行派傳承祖師，梵語Haribhadra及藏語（僧格桑波）義譯。論師出生於王族，其母因遭獅子攻擊而喪命，然肚子裡的孩兒仍存活，所以將此兒取名為獅子賢。論師長大之後，出家研習一切宗派教義，通達無礙，特別對於《般若》的教義，勤苦地尋求，猶如常啼菩薩一樣。當時靜命阿闍黎住持佛教，因此前往依止阿闍黎，在其座下深入研究至尊彌勒所傳《般若》教授，及無著兄弟、聖解脫軍所著的論典，並閱讀怙主龍樹所解釋的中觀諸論。論師同時研究深見、廣行二派的傳承教授，又於菩提道次第教授，數數觀擇，精勤修行，終於獲得佛法心要——三乘道次圓滿道體，生起殊妙的悟解。其後論師為廣弘聖教，於靜命阿闍黎前，求受至尊彌勒修法，日夜精勤修持，於夢中得見至尊彌勒聖顏，啟問說：「您的論著有許多註疏，要以哪本為依據？」至尊彌勒答道：「應當先通曉一切註疏，再將其中合理之處攝集成論，這就由你來著作！」於是論師為了尋找造論的施主，從喀薩巴呢（Khasarpāṇi）西行。當時達瑪巴王（Dharmapāla）得知論師精通《般若》，於是派遣使者迎請至三莊嚴寺，為數千僧眾廣傳《般若》教授，並由國王當造論施主。論師即依至尊彌勒所授記，造《現觀莊嚴論顯明義釋》；匯合《現觀》、《般若》而著《八千頌廣釋》；依照聖解脫軍所著《般若二萬五千頌光明論》，將《般若二萬五千頌》的經文，配合《現觀》要義，而造《八品論》；並造《攝功德寶易解論》、《般若修法》、《真札巴文法變格頌》等論典。論師悲智無比，又得至尊彌勒加持攝受，所以其所著作的《顯明義釋》，成為修習菩提道次第的人共同遵行的「般若法眼」。論師所著述的《八千頌廣釋》，從六加行法，至止觀雙運之間，一切三士道次扼要，都如《般若經》所說，無誤開示所有道次的道體、數量、次第，明晰地顯示至尊彌勒的教授，因此其論著也成為後世修學《現觀》行者的準繩。參見《師師相承傳》中文冊上，頁121；藏文冊上，頁165。引文見《丹珠爾》對勘本冊51，頁1573。","損減之法：此指能夠被損減的法，比如惡業、罪障等可以透過生起對治而能被損減、消亡，所以稱為損減之法。","金穢：黃金當中的汙垢。","成立語：一種表達正因的論式語言，分為同法正成立語、不同法正成立語兩種。例如：「凡是所作就是無常，譬如瓶子，聲音也是所作」，這是「聲音有法，是無常，因為是所作的緣故」此一論式的同法正成立語。該成立語中，「凡是所作就是無常，譬如瓶子」二句能夠令聞者直接了解所作因成立聲音是無常的隨品遍，「聲音也是所作」一句能夠令聞者直接了解所作因成立聲音是無常的宗法，所以是所作因成立聲音是無常的同法正成立語。「凡是常法就是非所作，譬如無為的虛空，聲音是所作」，這是「聲音有法，是無常，因為是所作的緣故」此一論式的不同法正成立語。該成立語中，「凡是常法就是非所作，譬如無為的虛空」二句能夠令聞者直接了解所作因成立聲音是無常的反品遍，「聲音是所作」一句能夠令聞者直接了解所作因成立聲音是無常的宗法，所以是所作因成立聲音是無常的不同法正成立語。"],"已校":true},"覺燈日光":null,"時":"64A 05:33","頁":146,"af":"64a","st":333,"et":347,"消文":[{"文":"經上所以說不亡的，是說你沒有修對治。"}],"延伸":[],"逐字稿":[{"t":"64A 05:33","b":[["q","諸契經中及毘奈耶皆說：「諸業縱百劫不亡。」意謂未修四力對治，"],["s","經上面所以說不亡的，是說你沒有修對治。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/005.mp3"},{"文":"若如所說而以四力對治淨修，雖順定受，亦說能淨。","口譯":"如果照前面所說，以四力對治如法淨修，即使是順定受的重業，也說能夠淨除。","四家合註":"若如所說而以四力對治淨修，雖順定受，亦說能淨。","合註白話":{"same":4},"覺燈日光":null,"時":"64A 05:47","頁":146,"af":"64a","st":347,"et":409,"消文":[{"文":"如法淨修的話，就算定受也能淨。"},{"文":"回想業在生死中感果的次第：隨重、隨近、隨串習、隨先；定受的業一定是最重的。"},{"文":"最重的都能夠清淨，何況其他？這是戒經上說的。"}],"延伸":[],"逐字稿":[{"t":"64A 05:47","b":[["q","若如所說而以四力對治淨修，雖順定受，亦說能淨。"],["s","如果你如法地去淨修的話，那麼就算定受 ─通常定受的業是最重的業，記得前面吧，那個諸業在生死當中的次第怎麼來的？隨重、隨近，然後呢隨串習，然後呢，前，四個次第對不對？重業是最先，所以你定受，下一生要受的是最重的；如果沒有重業的，那你是臨終的時候，那個業先現起，就靠近它的；如果沒有，你的習慣多的；最後，那是你最先造的。所以換句話說，「順定受」這個業一定是重的，那現在這個重的都能夠清淨，何況是其他呢？那麼這個是戒經上面的。然後呢，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/006.mp3"},{"文":"《八千頌大疏》中云：「謂若凡是近對治品，可損減法，彼由成就有力對治，能畢竟盡如金穢等。正法障等一切皆是如所說法，由此正理，則«妄執心»，所作墮處可無餘盡。","口譯":"《八千頌大疏》說：「凡是靠近對治品、可以被損減的法，由於成就了有力量的對治，就能徹底淨盡，像除去金礦裡的雜穢一樣。正法障等一切罪障，都屬於前面所說的這種法；依這個正理，由妄執心所造的墮罪，都可以毫無剩餘地淨盡。","四家合註":"《八千頌大疏》中云：「謂若『凡是<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">略微增長<\/span>近對治品，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">自即<\/span>可<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">趨近略微<\/span>損減<span>之<\/span>法，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">若極增長對治品，圓滿有力，<\/span>彼由成就有力對治，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">自即必<\/span>能<span>有<\/span>畢竟盡<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">之時等<\/span>，如金穢等<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">最初略作淨治<\/span>，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">則可稍去之，終圓滿淨治之，則金穢亦可畢竟去之。〔<\/span>正法<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂謗法之<\/span>障<span class=\"sjan sj-ba\">。〕<\/span>等一切<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">大力<\/span>皆是如所說<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">若對治圓滿自當盡淨之<\/span>法。』由此<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">成立語<\/span>正理，則<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">成立<\/span>妄執心所作<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謗正法等<\/span>墮處，可無餘<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">對治令<\/span>盡。","合註白話":{"same":4},"覺燈日光":null,"時":"64A 06:49","頁":146,"af":"64a","st":409,"et":1152,"消文":[{"文":"《八千頌》就是《大般若經》，大疏是它的註解。"},{"文":"近對治品：正對治要通達空性、徹底損壞種子；近對治沒有破壞種子，但讓種子不會感得現行。"},{"文":"可損減法：把種子的勢力減低、損害了；有力量的對治，能抵銷以前造的力量。"},{"類":"喻","文":"像金礦裡的髒東西，像洗衣服：找對了對象、加夠了力量、用足了水，可以洗得乾乾淨淨。"},{"文":"正法障是障當中最嚴重的，最嚴重的都能淨除，何況其他。"}],"延伸":[{"題":"妄執心","組":[{"題":"起心動念無非是罪","說":[{"類":"因","文":"造罪的根本就是妄執——邪妄的執著。"},{"類":"立","文":"沒正確了解我法二執、空性緣起之前，我們起心動念無非是罪，哪怕想對了都是罪。"},{"類":"立","文":"所以一心一意念佛：起心動念沒有一個對的，只有歸投依靠。"}]},{"題":"不知自己在妄執中","說":[{"類":"破","文":"最大的麻煩是不曉得自己在妄執當中，總覺得自己有道理。"},{"類":"破","文":"不如理思惟、觀察、對治，曉得一點法也沒用場，照樣隨煩惱轉。"},{"類":"例","文":"師父自省：講得頭頭是道，起心動念相應的時間的確不多，所以經常警惕。"},{"類":"立","文":"佛法很美，一警惕就歡喜無比。"}]},{"題":"念佛正是依止於法","說":[{"類":"因","文":"正皈依是皈依法，為什麼教我們念南無阿彌陀佛，不教念南無法？"},{"類":"立","文":"皈依法的真實內涵：以前依無明起心動念，現在曉得錯了，要如理依止正法。"},{"類":"立","文":"一心「南無阿彌陀佛」時，以前我錯了，現在一心依靠——這就是正依止法。"},{"類":"下手","文":"年輕、出家、要弘法，每一個法相都要弄清楚，修持時一念對、一念錯清清楚楚。"}]},{"題":"以世間量則說明佛法","說":[{"類":"破","文":"有人說知識青年不易說服；其實就怕他不跟你講道理。"},{"類":"立","文":"前面的道理都是世間的量則，這才是佛法可貴的地方。"},{"類":"例","文":"師父學理工，學佛後才發現真正的科學只在佛法當中。"}]}],"說":[{"類":"因","文":"造罪的根本就是妄執——邪妄的執著。"},{"類":"立","文":"沒正確了解我法二執、空性緣起之前，我們起心動念無非是罪，哪怕想對了都是罪。"},{"類":"立","文":"所以一心一意念佛：起心動念沒有一個對的，只有歸投依靠。"},{"類":"破","文":"最大的麻煩是不曉得自己在妄執當中，總覺得自己有道理。"},{"類":"破","文":"不如理思惟、觀察、對治，曉得一點法也沒用場，照樣隨煩惱轉。"},{"類":"例","文":"師父自省：講得頭頭是道，起心動念相應的時間的確不多，所以經常警惕。"},{"類":"立","文":"佛法很美，一警惕就歡喜無比。"},{"類":"因","文":"正皈依是皈依法，為什麼教我們念南無阿彌陀佛，不教念南無法？"},{"類":"立","文":"皈依法的真實內涵：以前依無明起心動念，現在曉得錯了，要如理依止正法。"},{"類":"立","文":"一心「南無阿彌陀佛」時，以前我錯了，現在一心依靠——這就是正依止法。"},{"類":"下手","文":"年輕、出家、要弘法，每一個法相都要弄清楚，修持時一念對、一念錯清清楚楚。"},{"類":"破","文":"有人說知識青年不易說服；其實就怕他不跟你講道理。"},{"類":"立","文":"前面的道理都是世間的量則，這才是佛法可貴的地方。"},{"類":"例","文":"師父學理工，學佛後才發現真正的科學只在佛法當中。"}],"af":"64a","st":536}],"逐字稿":[{"t":"64A 06:49","b":[["q","《八千頌大疏》中云："],["s","《八千頌》就是《大般若經》，《大般若經》的疏，就是註解，它也說："]]},{"t":"64A 06:59","b":[["q","「謂若凡是近對治品，可損減法，彼由成就有力對治，能畢竟盡如金穢等。正法障等一切皆是如所說法，由此正理，則妄執心，所作墮處可無餘盡。"],["s","說凡是你修了這個對治 ─它那個地方叫「近對治品」，為什麼不是正對治而講近對治？它正對治是什麼？一定要通達空性，把那個種子要徹底地把它損壞。現在前面所講的近對治，並沒有把那個種子整個破壞，但是你能夠這樣的話，那個種子就不會感得現行，他下面會告訴我們的。「可損減法」，它把那個種子的勢力，把它減低了，把它損害了。說由於成就了這樣的對治，而且這個對治，具有力量的，因為具有力量所以它以前造的力量你能夠抵銷。這種情況之下就「畢竟盡如金穢等」，就像那個金礦當中的髒東西，就像我們洗衣服，你只要正確地找對了這個對象，油嘛，你用非肥皂，灰塵嘛，抖一抖，否則的話擺在水裡漂一漂，你只要找對了這個，然後呢加夠了力量，用足了水，欸！可以洗得乾乾淨淨。像乃至於「正法障等」，那個是障當中最嚴重、最嚴重的，最嚴重的都可以淨除掉，何況其他！"]]},{"t":"64A 08:56","b":[["s","由於這個道理，所以「妄執心，所作墮處可無餘盡」，所有的罪障都可以盡除。這個裡邊特別說「妄執心」，說我們為什麼造罪呢？造罪的根本，這地方特別說一下 ─妄執，邪妄的，邪妄的。所以現在在我們並沒有真實了解說，我、法二執的行相，以及見、思煩惱的行相，沒有正確了解之前，法空性，這空緣起，你沒有正確了解之前，總之，最重要的我們要記住：我們現在起心動念無非是罪，哪怕你想對了都是罪，哪怕你想對了都是罪。因為我們現在想對了的時候，說還是三界輪迴當中，生天之法是有的。所以你因為這樣關係，所以你一心一意啊「南無阿彌陀佛」，為什麼要這樣呢？因為我起心動念沒有一個對的，所以一心一意只有歸投依靠你，就是這樣，這個是。不過呢，現在從這個地方我們更進一步了解了，是正歸依正歸依的法，它更廣泛。所以這地方我們要有一點認識，說妄執心這個概念。"]]},{"t":"64A 10:30","b":[["s","平常我們真正麻煩的，我們不曉得我們在妄執當中，我們總覺得自己有道理，這個是一個最大麻煩的事情，而這一點還非要經過這樣地說明、懺悔，到那時候你才有機會認得它、淨除它，否則的話沒有用。所以前面一再說，你呀如果不如理地思惟、觀察、對治、修行，縱然曉得一點法，你結果還是隨著煩惱放逸而轉，曉得的法沒有用場，到那時候惡業照樣地來。現在我們太多都是這種現象，尤其是觀察、觀察我自己，我就是這個毛病。哦，講起來我自己曉得講得頭頭是道，我想你們也覺得吧 ─喔唷，講得很好！可是我自己問起來，我心裡面常常害怕，說得頭頭是道，可是起心動念相應的時間啊，不是沒有，的確不多，這是千真萬確的，所以我自己經常很警惕。它有一個好處，平常我們一警惕呀，在那坐立不安哪！佛法這個很美，你一警惕，你就馬上覺得歡喜無比，欸！它有這樣的好處。這個是這地方順便一提，順便一提，關於這個妄執心的事情，我們應該了解，你能夠這樣去做了，那麼就對！關於這種事情都可以統統淨除乾淨。"]]},{"t":"64A 12:08","b":[["s","談到這裡有了一個問題了，前面已經問過你們，已經提過了，說現在我們曉得這個地方說正皈依是皈依法，既然正皈依法，請問我們現在念佛，那你說這個是皈依佛，還是皈依法？這跟你們講過沒有？有沒有講過？沒有。問過，對不對？問過你們，你們想得出這個道理來嗎？現在經上面又告訴我們是正皈依的正皈依法，既然正皈依法，為什麼不教我們念南無法，教我們念南無佛，教我們念南無阿彌陀佛，教我們念南無釋迦牟尼佛，乃至於教我們念菩薩，不教我們念南無法呀？為什麼？這個裡邊是有矛盾嗎？你們說有沒有矛盾啊？我們信得過，不會有矛盾的，但是道理你說得通嗎？你倒說說看，大家是不是覺得有矛盾在呀？不要說矛盾，想它不通，那現在我告訴你。"]]},{"t":"64A 13:13","b":[["s","它皈依法的真實的內涵是什麼？到現在我們慢慢地了解，這個地方所謂皈依法，不是我們早晚課的時候「自皈依法」念它一遍。念它一遍是皈依法，你皈依了以後自然身口相應的行持，可是它的中心是什麼？就是以前我們心理的行相是什麼行相啊？依於無明，對不對？起心動念都在這個上頭。喔！現在曉得了，不對，不對，這個錯了，現在我怎麼辦？要如理依止正法，這個是皈依法的真正內涵，真正的定義，對不對？了解不了解？所以它前面告訴我們正皈依是法，為什麼？喏！一切功德的圓滿，一切罪障的淨除，都是如法行持以後，分分斷證而來，斷惡，然後呢證德。惡斷了，好了，前面的罪過都沒有了；德證了，功德圓滿了，那就行了嘛！所以一個是斷德圓滿，一個是智德圓滿 ─佛啊！這個是依於法，沒錯呀！"]]},{"t":"64A 14:49","b":[["s","那麼現在呢我們了解這個道理，對不起，了解是了解了，法的真實的內涵還是一片糊塗。只有一件事情是曉得的，以前這種心理起心動念都在罪惡當中，那怎麼辦呢？那唯有依靠的，只有依靠著阿彌陀佛。所以當你正念阿彌陀佛的時候，那個時候你心裡的狀態是什麼？心裡的狀態是什麼？你真正一心一意「南無阿彌陀佛」的時候，南無什麼？皈投依靠嘛！以前我錯了，現在我一心依靠阿彌陀佛，這個心是什麼心啊？正依止法，對不對？清楚不清楚？每一個地方這個行相非常清楚。"]]},{"t":"64A 15:38","b":[["s","所以在這一點，如果你們只想說：「哎呀！我現在年紀也大囉，也不想學什麼囉，就念念阿彌陀佛。」你也能的的確確如法地念到底，那你的確不去管它，你念到了極樂世界，阿彌陀佛自然會告訴你。如果你現在在這個世間年紀又輕，又穿了這種衣服，又想弘法的時候，人家問你，對不起，你弄了半天自己也弄不清楚的話，那個時候，那就不大相應了，對不對？所以你每一個地方這個法相弄得非常清楚。然後呢因為弄清楚了，你自己修持起來的時候一點不含糊，你了解得很清楚，這一念對、這一念錯！不會是弄了半天，自己還不曉得對不對，然後人家問起來，你可以分析得清清楚楚。"]]},{"t":"64A 16:27","b":[["s","所以現在有的人曾經跟我這麼說，現在這個佛法滿流行 ……，不是，現在佛法弘傳得很好，而有一類人你就不容易去說服他，什麼？知識青年。我的觀念恰恰相反，我跟你們說過了，你真正能夠說服的就是這些知識青年，就怕他不跟你講道理。他說：「我已經相信了。」你跟他講什麼，他也不聽你，「我已經相信，你講這個道理幹什麼？」那你一點辦法都沒有。其實他真的懂了沒有？對不起，天曉得！如果他要肯跟你講道理的時候 ─喏！這個前面所有的道理，這都是世間的量則喔，它不是我們佛法裡面特別講的哦！你要曉得這個才是佛法真正可貴的地方。所以這每一個地方，它沒有一點含糊的，這個概念大家弄清楚。"]]},{"t":"64A 17:29","b":[["s","所以你了解了這一點，自然而然就像前面說的：「哎呀！別人大家也說啊，信了他那個教，不要信的別的了，你現在佛教也是，信了你的佛不要信別的，你跟別人有什麼不一樣？」欸，對不起，我這個就是跟別人不一樣，我跟大家坐在這兒講道理。所以以我現在的了解，正因為我當年沒出家的時候是學科學的 ─談不到真正科學啦，至少碰到一點科學的邊，學工程的，理工，所以等到我學了佛以後才發現，真正的科學只有在佛法當中，只有在佛法當中。"]]},{"t":"64A 18:15","b":[["s","這個學科學家的科學的精神是精采的，絕對精采的，但是他採用的方法，所認知的範圍，那實在是、實在是，也只能說他已經開始慢慢地進幼稚園。所以我以後常常有很多人跟我講科學，我心裡面直好笑，唉，這些人哪真是，講科學實在是不懂真的科學，真的懂得科學的，他一定會跑到這條路上去。所以不怕他不跟你講道理，反過來，就怕他不跟你講道理，那你就拿他一點辦法都沒有。不過當然還是有一種人，他跟你講道理，講道理以後，到那時候他跟你橫來，「就是你有道理，我就是不聽你。」那沒辦法，那是沒辦法，這是我們隨便一談。下面還有一個問題："]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/007.mp3"},{"文":"諸經說云『諸業雖百劫』等者，應知是說，若不修習能對治品。若不爾者，«則違正理»及違多經。","口譯":"各經所說「所造的業雖經百劫也不消失」等等，應當知道是就「沒有修習能對治品」而說的；若不這樣解釋，就違背正理，也違背許多經。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第三、雖淨定罪，然與定不定業之字義不相違者：<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">於此或曰：若爾，則違<\/span>諸經說云，『諸業雖百劫<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">不亡<\/span>』等者，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">說有不容消亡之業。答云：無過。如是說者，<\/span>應知是說『若不修習能對治品<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">則其異熟定不容消亡<\/span>』，若不爾者，則違<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如前所陳成立語<\/span>正理及違多經<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">文<\/span>。","合註白話":{"id":"19416","頁":538,"白話":"第三科、雖然能夠淨除決定罪，但是並不違背決定業與不決定業的詞義：對此有人提出：若是如此，就違背了經典中說：『業縱然歷經百劫也不會憑空消失』等，說有不可能憑空消失的業。答道：沒有這樣的過失，因為應當要知道，這樣的說法是基於『如果沒有修持對治品，異熟必定不可能憑空消失』而言，因為若非如此，就會有悖於上述成立語那樣的正理，還會違背許多經典的文句。對此有人提出：若是如此，就有悖於必定領受異熟的業的說法。答道：沒有這樣的過失，因為必定領受異熟的說法，也是指『諸如過去造作而增長的業，如果沒有修持對治，則必定會領受異熟』，以這樣的說法解釋過了。有人說：若是如此，就會與不一定領受的業沒有差異，因為這兩者同樣都是如果修持對治品，就不一定領受異熟的緣故。答道：這也沒有過失，因為必定領受的業，是如果不修持對治品就必定會領受異熟；應當要確切地認知、曉得所謂不定領受的業，是即使原先就沒有修持對治品，也不一定會感生異熟果，因此只是可能會產生果報。」","注釋":["亦是如此所說：法尊法師原譯作「應知亦是如此所說」，今據藏文刪「應知」。","應當定解說不定者雖不修習能對治品然亦偶或生果耳：法尊法師原譯作「說不定者，雖不修習能對治品，然亦應知不定感果」，今據藏文改譯。"],"已校":true},"覺燈日光":null,"時":"64A 19:12","頁":146,"af":"64a","st":1152,"et":null,"消文":[{"文":"百劫不亡是沒有修對治；修了對治，一定不會。"},{"文":"假定修習以後業還存在，很多經上的道理就違背了；經前後一定不違背。"}],"延伸":[{"題":"則違正理","組":[{"題":"欠債與還債","說":[{"類":"喻","文":"我欠他十塊、他欠我十塊，自己不欠不虧，可是債還在；我欠他十塊、還了十塊，就沒有債了。"}]},{"題":"力用相反，彼此抵銷","說":[{"類":"喻","文":"我推一個力，有人反方向推：力小，仍推過去但慢一點；力一樣，就不動；力更大，就推回來。"},{"類":"立","文":"物理找不到力的來源，佛法說：業力。拿科學反對佛法的人，佛法在門外。"}]},{"題":"行相相同，力用相反","說":[{"類":"立","文":"造業時見境起貪欲；對治時見其過患，生起善法欲——同樣是欲，方向恰恰相反。"},{"類":"因","文":"貪欲出於無明邪妄分別，善法欲出於正知見；無明故行，明也產生相反的力。"},{"類":"立","文":"所以四力要圓滿：造的時候怎麼造，對治的時候每一方面都顧到，質對了量也對了，就徹底消除。"}]},{"題":"兩業皆不亡失","說":[{"類":"回扣","文":"造的業推那邊，對治的業推這邊，兩個業都沒有亡失——諸業縱百劫不亡，一點沒有矛盾。"},{"類":"破","文":"有矛盾，問題都在你自己。"}]},{"題":"智慧是對治煩惱","說":[{"類":"立","文":"佛覺悟了世間的量則，用世間共同接受的量則說明正確的道理，所以學佛是智慧之學。"},{"類":"破","文":"不要癡癡呆呆，也不要變成世智聰辯：說得頭頭是道、不能對治煩惱的，不是佛法的智慧。"}]},{"題":"不發露不成懺悔","說":[{"類":"破","文":"「我不要發露可不可以？」掩飾著這件事，你真的在懺悔嗎？"},{"類":"立","文":"正確了解以後，叫你掩飾都不願意。"},{"類":"立","文":"根在正知見，從起心動念上找——佛法叫內明。騙得了自己，騙不了因果；不要相信「我」。"}]}],"說":[{"類":"喻","文":"我欠他十塊、他欠我十塊，自己不欠不虧，可是債還在；我欠他十塊、還了十塊，就沒有債了。"},{"類":"喻","文":"我推一個力，有人反方向推：力小，仍推過去但慢一點；力一樣，就不動；力更大，就推回來。"},{"類":"立","文":"物理找不到力的來源，佛法說：業力。拿科學反對佛法的人，佛法在門外。"},{"類":"立","文":"造業時見境起貪欲；對治時見其過患，生起善法欲——同樣是欲，方向恰恰相反。"},{"類":"因","文":"貪欲出於無明邪妄分別，善法欲出於正知見；無明故行，明也產生相反的力。"},{"類":"立","文":"所以四力要圓滿：造的時候怎麼造，對治的時候每一方面都顧到，質對了量也對了，就徹底消除。"},{"類":"回扣","文":"造的業推那邊，對治的業推這邊，兩個業都沒有亡失——諸業縱百劫不亡，一點沒有矛盾。"},{"類":"破","文":"有矛盾，問題都在你自己。"},{"類":"立","文":"佛覺悟了世間的量則，用世間共同接受的量則說明正確的道理，所以學佛是智慧之學。"},{"類":"破","文":"不要癡癡呆呆，也不要變成世智聰辯：說得頭頭是道、不能對治煩惱的，不是佛法的智慧。"},{"類":"破","文":"「我不要發露可不可以？」掩飾著這件事，你真的在懺悔嗎？"},{"類":"立","文":"正確了解以後，叫你掩飾都不願意。"},{"類":"立","文":"根在正知見，從起心動念上找——佛法叫內明。騙得了自己，騙不了因果；不要相信「我」。"}],"af":"64a","st":1172}],"逐字稿":[{"t":"64A 19:12","b":[["q","諸經說云『諸業雖百劫』等者，應知是說，若不修習能對治品。"],["s","經上面說，百劫造了絕對不亡的，要曉得這是沒有修對治，如果修了對治，一定不會的。"]]},{"t":"64A 19:32","b":[["q","若不爾者，則違正理及違多經。"],["s","他假定說經上面說造了一定不亡，那麼你修習了以後它也存在的話，這樣一來的話，很多經上面講的道理就有違背了。這個經前面、後面一定不違背的，所以前面所以說造了不亡，是因為你沒對治，對治了以後它就消失掉了，經上面很多地方都是這樣說。可是這個理論它並沒有說得很清楚，現在這個道理，我在這地方跟你們說明一下，你們就很容易很清楚明白了。如果是在座的諸位，尤其是學理工的，那個概念特別清楚，或者我們把中學的物理現象，你隨便一提的話，你就很清楚。"]]},{"t":"64A 20:35","b":[["s","現在呢，或者我們不要說物理現象的，因為畢竟學「力」的人比較少。世間一般大家的量則，我欠了你十塊錢，他欠了我十塊錢，結果呢？對我來說，我不欠不虧，我自己本身來說，我身上的這個負債來說，不欠不虧。儘管這樣，可是對不起，我碰見他，他是我的債主；然後呢我碰見這個人，我是他的債主，對不起，這個債還在，對不對？清楚不清楚？另外一種，我欠了他十塊錢，我還了他十塊錢，結果呢我有沒有債？沒有。然後呢我碰見他的時候，他是不是我的債主啊？不再是了，清楚不清楚？懂不懂？有疑問的請提出來現在，一點沒有疑問。"]]},{"t":"64A 21:42","b":[["s","然後呢我再進一步用「力」來告訴我們，用力來告訴我們，然後我用一個力，比如說推我前面這東西，我如果推這東西，這東西就向那邊推動，對不對？然後呢旁邊如果有一個人，要擋住這個推動的話，他也要推住，怎麼辦呢？就是在這個反方向，反方向用同樣的力來推。如果說他反方向推的話，他的力小，我還是推過去一點，但是呢並沒有原來這麼快了，也沒有原來這麼遠。他假定力慢慢地加強，加到跟我一樣的話，對不起，那個就不動了。如果他的力量超過我的話，它又反回來了，對不對？還有一種情況，我是這個力這樣推，結果他也用一個力那樣推，請問這個力跟我這個力有沒有關係啊？是了不相關，了不相關，所以這個非常清楚、非常明白，所以物理上面就講這個道理。"]]},{"t":"64A 22:49","b":[["s","所以物理上面，如果你們懂得力學然後講佛法的話，啊，美極了！為什麼呀？這個物理上面儘管講力是世間的，說萬有引力，樣樣有力，但是這個力的來源哪來的？他找不到，只曉得任何一樣東西有它的力，以前說，這個物質說有力；現在發現原來沒有物質，本來就是一個力場，可是真正說起來，根本就找不到物質，就是那個地方有一種能力存在。那麼這個能力哪來的？找不到。佛法上面告訴我們，妙極了，這個能力哪來的？業力。啊，這佛法真正高明的地方。所以現在大家說科學，說了科學去反對佛法，這種人不信佛的當然，信了佛居然拿科學來反對佛法，那個人哪，佛法在門外。真正的世間一切的量則，你懂得了佛法，任何一樣東西解釋得那徹底圓滿，尤其是科學，醫學，不管是理、工、醫、農任何一樣東西，那今天我在這告訴你們。"]]},{"t":"64A 24:01","b":[["s","所以當你造業的時候，你什麼，以你的心去造，現在我們把這個剛才那個比喻，馬上用到事實上面。造的時候這個業是怎麼個造法的？你看見這個東西，啊！歡喜它，你起個貪心，這樣去。是不是這樣？就是用你的心，對這個東西這樣來。現在呢，他前面告訴我們怎麼對治啊？你看見這個是「起過患欲」。以前是曉得什麼？曉得它有種種的好處，你要執取它，現在你恰恰相反，要曉得它有種種的過失患害，於是你排斥它。所以這兩個東西是行相相同，是力用相反。心理的狀態，完全是依靠你的心理狀態，還是這個欲，前面那個欲叫貪欲，現在的欲叫什麼？善法欲。為什麼貪欲？你無明，不知道，邪妄地分別；為什麼善法欲？你正知見。它那個正跟邪之間，像黑跟明一樣，恰恰相反哪！完全相反。因為這個無明，無明故行，行是什麼？力嘛！現在呢同樣地，你因為是明、智慧，所以它也產生一個力，那個力跟它相反，完全相反。"]]},{"t":"64A 25:29","b":[["s","所以在這個時候，你修對治的時候，為什麼要四力圓滿？就是你造的時候就這樣造的，現在你對治的時候，也在哪一方面都顧慮到了。這個方式都顧慮到了，質都對了，下面的力那量也對了，你只要完全做對了，徹底消除、一點不剩，清楚不清楚？"]]},{"t":"64A 25:55","b":[["s","正因為如此，所以正因為這個道理，所以諸業縱百劫，它絕對不亡失的道理，業一定不會亡失的！以前你造的業是造這個業，所以它一定推著這邊走；現在你造的業是這個業，它一定也推著這個走。所以那個在同樣一件事情上頭，發生有什麼效果？這兩個業也都沒有亡失，對不對？絕對不亡失的。所以這個力因為這樣不亡失，所以向那邊走；這個力向那邊也不亡失，向那邊走，結果碰到最後那個不動。實際上動是不動？那個力呢，兩個力都沒有亡失，對不對？所以你真正了解了，啊，那個佛經真美呀！它絕對不會有一點矛盾之處，所以有矛盾問題都在你自己，清楚不清楚？"]]},{"t":"64A 26:55","b":[["s","所以常常有人問：「有人什麼這樣說，有人這麼說，你到底怎麼講？」那你告訴他，這麼清楚、這麼明白，不管你是用經說，乃至世間的理則。說到這裡，同樣你們也曉得了，佛法真正可貴的地方，就是你可以用世間的量則，說明這個最深刻的道理。其他的宗教他一定要說：欸！這個是神講的、這個佛講的。是，我們也是佛講的，佛是什麼？覺悟了世間的量則，所以他用那個世間的共同接受的量則，來說明這個正確的道理。但是有一點不行，就是如果世間的量則你不懂，是個大愚癡蛋，那沒辦法好想，那沒辦法好想，所以這個修學佛法是智慧之學啊！"]]},{"t":"64A 27:44","b":[["s","說到這裡，大家不要說：哎呀，我在這修行了，好像這癡癡呆呆呀！那個前面已經告訴我們，你已經走到錯誤的這條路上去了。但是也不要覺得：啊，你很聰明啊！這個聰明要注意哦！千萬不要變成世智聰辯，佛法的智慧是對治煩惱的喲！然後呢你談起來，說起來說得頭頭是道，對治不了煩惱，還增長煩惱，這個不是佛法的智慧哦！提一下。好！現在我們了解了：喔！原來這個樣。那以後就非常清楚了。"]]},{"t":"64A 28:24","b":[["s","所以當你正修對治的時候，有人說：「那麼我不要發露這個，可以不可以？」請問你不發露能懺悔得乾淨嗎？你造的時候針對著這件事情，你現在要懺悔，是把它掩飾著這件事情，你真的在懺悔嗎？假定你真懺悔的話，你還會掩飾嗎？所以這個掩飾這件事情是懺悔嗎？所以當你對剛才這種道理正確了解了以後，你會必然產生一個結果，以前不知道去造，現在知道了以後，叫你掩飾都不願意啊！叫你掩飾都不願意啊！這是必然的現象，對不對？"]]},{"t":"64A 29:14","b":[["s","就像剛才說的一樣，所以你每一個地方它就這麼細緻，一點不錯。所以你必定要找到了根，而這個根在哪裡？正知見。從哪裡知見？就起心動念。所以佛法叫作內明，妙極了，是一點都沒錯，你自己清清楚楚。所以到了這個時候我們曉得了：啊！原來我們常常說，你騙得了別人，是騙不了自己啊，就是這樣。"]]},{"t":"64B 00:08","b":[["s","進一步，你騙得了自己，是騙不了因果啊！我們倒不是有意騙自己，我們愚癡。所以現在這個地方處處地方提醒我們：唉呀！不要相信「我」呀，「我」這個東西的話，是真正我的生死大冤家，這個無明的根本，後面會告訴我們的，就在這裡，就在這裡。那麼下面我們繼續說下去。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/008.mp3"},{"文":"說順定受，應知亦是如此所說。","口譯":"說順定受業，應當知道也是這樣說的。","四家合註":"<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">於此或曰：若爾，則與所說順定受異熟之業相違。答曰：無過。<\/span>說順定受<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">異熟<\/span>，亦是<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">已為『如昔作已增長業，若不修對治，則定領受異熟』<\/span>如此<span class=\"sjan sj-ba\">之說<\/span>所<span>釋<\/span>說。<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">或曰：若爾，則與不定受業成無差別，以此二者，若修對治，同為不定受異熟故。答曰：此亦無過。順定受業者，若不修對治，則定領受異熟。<\/span>應當定解<span class=\"sjan sj-ba\">、<\/span>","合註白話":{"id":"19479","頁":540,"白話":"第四科、雖然由於淨化者的力道微弱，以致業無法徹底淨除，然而所淨除的部分，即是指削弱其異熟，以致不會感生果報，以及其比喻：如上所述，藉由懺悔及防護等等，削弱了感生異熟的能力的這些業，即使與其他因緣相遇，也不會感生異熟。同樣地，由於生起邪見與瞋恚而摧毀善根，也是如此。《分別熾燃論》中說：「當善法已被邪見與損害心等摧毀而削弱，或是不善業也已經被呵責，亦即追悔往昔過失的心，還有防護未來、坦誠不藏匿等，總之是被完備四力的對治品摧毀而削弱其勢力，這些業即使因緣已經匯聚、已經與因緣相遇，但是還能從什麼善惡業產生什麼苦樂果報？應當不會產生，因為這些善不善業能夠感生各自異熟果報的種子的能力，已經被對治品削弱。而能如此削弱的原因，以諸如謗法的業障為例，它為何不是可能有徹底連根剷除消盡的機會？應該是有的，因為稍微生起其對治品時，它就可能稍微損減；既然如此，當其對治品達到圓滿時，它也必定有機會被連根消盡。第一個理由成立，因為稍微生起能妨礙其存在的對治品時，它的存在就會被中止，並且被稍微削減；不僅如此，如果它存在的因緣稍微沒有匯聚或不俱全，也會導致損害了它，它存在的時間也變遷而轉為不存在、消逝殆盡的緣故。對治品摧毀罪惡的方式，不是只有連根消盡而已，還有其他的摧毀方式。經典中說道：『若藉由受持正法等對治的力量，他原本必定要承受來世惡趣大苦的罪惡，也會轉化為在今生這一世承受輕微的異熟。』同樣又說道：『另外，那些未來將邁向惡趣的業，由於被對治品摧毀，藉此轉化為在今生僅僅頭痛的小苦。』","注釋":["如是說由懺悔及防護等：法尊法師原譯作「如是由悔及防護等」，今據藏文改譯。","《分別熾然論》云：《分別熾然論》，中觀部論典，全名《中觀心論釋·分別熾然論》，又名《分別熾燃論》，共11品，27卷，清辨論師著，尚無漢譯。清辨論師，中觀自續派及經部行中觀自續派的開派祖師、相傳為長老須菩提的化身（約公元6世紀），梵語Bhāvaviveka及藏語（雷登傑）義譯，又名婆毘吠伽、婆毘薛迦、明辯、分別明菩薩。師出生於南印度摩梨耶羅（Mālyara）的王族，出家修道，親見金剛手菩薩，成就殊勝三摩地，依止龍樹菩薩學習中觀。由於龍樹菩薩所傳的中觀正見涵義幽微，論師為了引導眾生漸次領悟，因而著述《般若燈論》、《中觀心論》、《分別熾燃論》等論著。開創經部行中觀自續派學說，當時追隨其說者甚多，並且與法護論師展開中觀與唯識之間的爭論，也破斥同為中觀學派的佛護論師（Buddhapālita）的學說。《大唐西域記》云：「婆毘吠伽（唐言清辯）論師住阿素洛宮待見慈氏菩薩成佛之處。」《分別熾燃論》為《中觀心論》的自釋，其中廣說內外道的宗義，以經部行中觀自續派的見地，闡述人、法二無我等內涵。參見《大正藏》冊51，頁930；《印度佛教史》，頁143；《師師相承傳》中文冊上，頁161；藏文冊上，頁212；《新譯大唐西域記》，頁550。引文見《丹珠爾》對勘本冊58，頁449。","發露：法尊法師原譯作「悔除」，今依藏文改譯。","會：此字原為箋註，法尊法師取其意譯入正文。","有法：見前頁220註7。"],"已校":true},"覺燈日光":null,"時":"64B 00:36","頁":146,"af":"64b","st":36,"et":43,"消文":[{"文":"順定受也是這樣。"}],"延伸":[],"逐字稿":[{"t":"64B 00:36","b":[["q","說順定受，應知亦是如此所說。"],["s","順定受也是這樣。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/009.mp3"},{"文":"說不定者，雖不修習能對治品，然亦應知«不定感果»。」","口譯":"至於說不定受業，那麼即使沒有修習能對治品，也應當知道它不一定感果。」","四家合註":"<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">了知：<\/span>說不定<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">受<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">業<\/span>者，雖不修習能對治品，然亦<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">不決定感異熟果，故<\/span>偶或生果耳。」","合註白話":{"same":8},"覺燈日光":null,"時":"64B 00:43","頁":146,"af":"64b","st":43,"et":271,"消文":[{"文":"不定受的，就算不修對治，也不一定感果。"},{"文":"定受、不定受、感果不感果，到共中士道時再詳細說明。"}],"延伸":[{"題":"不定感果","組":[{"題":"未懂也要馬上懺悔","說":[{"類":"因","文":"不努力懺悔，心一直在煩惱現行當中，深細的佛法進不去。"},{"類":"下手","文":"就算不一定懂，馬上遠離，跟著師父，好好念佛、拜佛。"}]},{"題":"保住形式，才有內涵","說":[{"類":"破","文":"不要說早晚課徒具形式，還不如不要。"},{"類":"立","文":"形式還在，有機會就告訴你它的內涵；形式一掃除，佛法就完了——所以對最起碼的形象也無比尊重。"}]},{"題":"了解越多，持戒越易","說":[{"類":"立","文":"不說四眾過：破戒的人撐起三寶形象，讓你有機會隨喜、讚歎、啟發悲心，是你成佛的資糧。"},{"類":"例","文":"同修去聽別人講法，以前會批評，現在心裡無比歡喜——法就這麼好。"}]}],"說":[{"類":"因","文":"不努力懺悔，心一直在煩惱現行當中，深細的佛法進不去。"},{"類":"下手","文":"就算不一定懂，馬上遠離，跟著師父，好好念佛、拜佛。"},{"類":"破","文":"不要說早晚課徒具形式，還不如不要。"},{"類":"立","文":"形式還在，有機會就告訴你它的內涵；形式一掃除，佛法就完了——所以對最起碼的形象也無比尊重。"},{"類":"立","文":"不說四眾過：破戒的人撐起三寶形象，讓你有機會隨喜、讚歎、啟發悲心，是你成佛的資糧。"},{"類":"例","文":"同修去聽別人講法，以前會批評，現在心裡無比歡喜——法就這麼好。"}],"af":"64b","st":43}],"逐字稿":[{"t":"64B 00:43","b":[["q","說不定者，雖不修習能對治品，然亦應知不定感果。」"],["s","說不定受的話，就是你不修對治，也不一定感果。關於這個定受、不定受，感果、不感果啊，到後面共中士道的時候，我會詳細地說明，這個道理也像今天講的一樣，它每一個地方啊非常正確，一點都絲毫不差，絲毫不差。現在到這個地方，雖然我們並沒有正確地了解，但是我們必定要馬上開始懺悔，原因是如果說你不努力懺悔，心裡邊一直在這種煩惱的現行當中的話，它那深細的佛法你進不去的，這個是它很重要的一個原因。所以我們一路上面一定是這樣，第一個，儘管你不一定懂，馬上遠離，然後呢跟著師父身邊，聽他，好好地念佛、拜佛。"]]},{"t":"64B 01:52","b":[["s","所以我們現在從早晚課開始，每一樣東西那都是最好的，只可惜的是我們現在不懂，乃至於我們就說：「現在這樣的早晚課它徒具形式，還不如不要就罷了！」那這個地方現在我們了解了：幸好現在還有這個形式，因為還有這個形式，至少有機會的時候，有機會會告訴你，喏，這個形式所具的內涵是什麼。你了解了，形式已經有了，然後呢內涵一用，馬上對。你一旦把那形式掃除掉了，那完了，從此以後佛法就完了！所以想到了這裡的話，不管是在任何情況之下，你還是會對最起碼的形象，是都會對它產生無比地尊重，無比地恭敬。"]]},{"t":"64B 02:42","b":[["s","同時你這個概念認識了以後，那個時候你要持戒就遠來得容易。尤其是現在戒經上面說，不要說四眾過，不要隨便說別人，我們總覺得這個人好像滿身是罪，你怎麼去不說他呢？欸，他就有絕大的功德，就有絕大的功德。而且你也了解了你真正所要的 ─你要你的功德嘛對不對？他現在他破戒，他下地獄，結果呢他卻把那個三寶的形象撐起來，讓你有機會見到，讓你有機會隨喜，讓你有機會讚歎，乃至於讓你有機會啟發悲心去救度他，他不是你成佛的資糧嗎？你不感激他，可能嗎？喔！所以你了解得越多，這個問題越簡單，這個持戒是越容易，然後呢罪障淨除，是功德增長啊！"]]},{"t":"64B 03:49","b":[["s","所以昨天還有一位同修來跟我談，我聽了真歡喜呀！他說這個教法真美，他偶然有一天出去，也跑著去聽人家講法，他就隨便去一聽。唉呀，叫是他說是如果以前聽了以後，一定會覺得：這種人也在那地方講這個，實在是啊！結果呢？他因為懂得了這種教法以後，他心裡面產生無比地歡喜，他怎麼歡喜呢？就告訴我剛才這個道理。我說：「對啊！佛法就這麼好，法就這麼好！」這個這是我們這個地方應該了解的。繼續下去："]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/010.mp3"},{"文":"如是由悔及防護等，«傷損能感異熟功能»者，雖遇餘緣，亦定不能感發異熟。","口譯":"像這樣，因為後悔、發誓不再做等等，把這個業會招來果報的力量破壞了，那麼即使以後碰到其他條件，也一定不會再結出果報。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第四、由淨治者力微弱故，業雖未能畢竟淨治，然所淨治即衰損其異熟，令不感果，並其譬喻者：<\/span>如是說由懺悔及防護等，傷損能感異熟功能者，雖遇餘緣，亦定不能感發異熟。","合註白話":{"same":8},"覺燈日光":null,"時":"64B 04:31","頁":146,"af":"64b","st":271,"et":812,"消文":[{"文":"經過「悔」或「防護」努力以後，把能感異熟的功能損傷了。"},{"文":"功能就是唯識講的種子；遇到緣，也不會感發異熟的果。"}],"延伸":[{"題":"傷損能感異熟功能","組":[{"題":"習慣即是業因","說":[{"類":"喻","文":"一個東西吃慣了，少了它就少不掉；每天起來先看報紙、喝茶——習慣就是種下的業因，到時候感果。"}]},{"題":"道理雖懂，力量不足","說":[{"類":"例","文":"師父住山裡很久不看報紙，一到外面看見報紙，拿起來看了個起勁，怎麼也拿不掉。"},{"類":"立","文":"見到的不是它真的好處，是習慣養成的愛好；唯一的辦法是見到它的害處。"}]},{"題":"數數思惟，生起力量","說":[{"類":"下手","文":"空下來就想報紙的害處，想到心裡力量很強；再看到報紙：「你這傢伙以前專門騙我！」高高興興丟掉。"},{"類":"因","文":"思就是行，行就是業，業有力量。"}]},{"題":"以正見防護正念","說":[{"類":"回扣","文":"雖遇緣：境界又來了，染著的力量生不起來，被對治的力量損害了——不會再拿起報紙來看。"},{"類":"立","文":"聽了要回去照方法努力，不努力對不起自己；整個相續加什麼業進去，就顯什麼果。"}]}],"說":[{"類":"喻","文":"一個東西吃慣了，少了它就少不掉；每天起來先看報紙、喝茶——習慣就是種下的業因，到時候感果。"},{"類":"例","文":"師父住山裡很久不看報紙，一到外面看見報紙，拿起來看了個起勁，怎麼也拿不掉。"},{"類":"立","文":"見到的不是它真的好處，是習慣養成的愛好；唯一的辦法是見到它的害處。"},{"類":"下手","文":"空下來就想報紙的害處，想到心裡力量很強；再看到報紙：「你這傢伙以前專門騙我！」高高興興丟掉。"},{"類":"因","文":"思就是行，行就是業，業有力量。"},{"類":"回扣","文":"雖遇緣：境界又來了，染著的力量生不起來，被對治的力量損害了——不會再拿起報紙來看。"},{"類":"立","文":"聽了要回去照方法努力，不努力對不起自己；整個相續加什麼業進去，就顯什麼果。"}],"af":"64b","st":342}],"逐字稿":[{"t":"64B 04:31","b":[["q","如是由悔及防護等，傷損能感異熟功能者，雖遇餘緣，亦定不能感發異熟。"],["s","喏，就像前面的「悔」或者「防護」，經過了這樣地努力了以後，把這個能感的異熟的功能 ─這個異熟的功能，唯識上面我們叫它種子，現在這地方他用這個「功能」，意思一樣的。但是呢他所以不完全用唯識法相，唯識的名字，他有他的理由，這個我們不去管它。就是說這一種能感得異熟的業因的這個種子，雖然遇到緣，它也不會感發異熟的果。關於這個話很容易懂 ─應該這麼說：這個話，我們一聽就聽清楚了，可是這個道理，我在這地方告訴你們一下。也同樣地剛才的情形，我們馬上可以感受得到，而且這個感受，就對我們這麼地活生生的一個感受。"]]},{"t":"64B 05:42","b":[["s","剛才我隨便說眼前這樣東西，平常你歡喜它的，你歡喜它的，然後一開始的時候，你為什麼歡喜它？通常有幾種原因，就是你有機會，你碰到了吃，欸，吃過了，「這個滿好吃啊！」也許不一定好吃，你天天吃、天天吃，吃慣了以後，到那時候你就覺得少了這個你就少不掉。我們有太多這個嗜好，是不是這樣？所以你就很歡喜。然後呢，你只要慢慢、慢慢地養成功了習慣，於是到這個境界現起的時候，到那時候你沒有這東西就少不了它。如果我們天天早晨起來，在家人早晨起來，跑到門口去看報紙，然後呢喝茶，然後呢做什麼，我們每一個人有每一個人的習慣的，所以到那時候自然而然。這個習慣什麼啊？你種下去的業因對不對？這個因，到那個時候感得那個果。你每天這樣做，到了第二天早晨他起來的時候，他自然而然就跑到門口去看看報紙來了沒有，「欸，還沒來！」這個報紙還沒看，他就會覺得坐立不安之感。"]]},{"t":"64B 06:58","b":[["s","現在我們，我們有我們自己的習慣，每一個人都是這樣的。那麼對治呢？就這樣，你曉得這個東西，啊！原來這個東西對我們這麼大的害處。然後呢雖然你曉得了害處，習慣還在，於是你用其他的方式去對治它，這個對治有它的種種的方法，比如讀誦甚深經典、觀罪性空、種種的念誦。現在我就用報紙這一件事情，平常的話，你雖然說這個報紙看了不好，我想你們很多人都有這種經驗：你要不訂報紙，過了一些時候也許你就忘記掉了，可是一旦看見了報紙，喔！你拿起來，說不定它一坐坐了一個鐘頭，二個鐘頭，你也忘記掉了。"]]},{"t":"64B 07:46","b":[["s","這個當時我自己有這個經驗。那時候我跟著法師住在那個山裡面，那個山裡面有一個地方完全沒有報紙的，後來很久也不看報紙，我自己覺得不看報紙覺得滿好。結果一旦跑到那個外面看見那個報紙，拿起來看了個起勁，就是這樣，怎麼弄這個就是拿不掉它，怎麼弄拿不掉它！後來慢慢地由於這個本論的告訴我們，喔！了解了，原來這個真正的問題。就是說，它一定要正確地見到這個東西的過患，以前是見到它的好處 ─實際上我們真的見到它的好處啊？不是，是習慣養成功對它的愛好。所以這個「習」這個是很難改的，你真正要對治它的唯一的辦法，你一定要見到它的害處。所以這個見道然後修道，它有它的特別的。"]]},{"t":"64B 08:42","b":[["s","那時候我就想：這個報紙它有什麼好處呢？想來想去呀，這越想越糟糕，越想越糟糕！那個報紙上面很多東西你覺得，比如說常常很吸引人的這種東西，或者你歡喜看文藝的，你會看那個文藝的副刊；乃至於後來有一段是流行武俠小說，我也對這東西很入迷。到後來想想還真顛倒，它那個東西完全是憑空想像的，就這麼莫名其妙地，想到一下那地方，一下那地方；我也會想啊，想了一套，編了一套故事去騙別人，騙得教人家瞪大了眼睛看，其實呢完全在那裡說大話，空口說白話。我想：唉，我這個人真愚癡，學佛人怎麼愚癡到這種程度！那為什麼受他騙？想了半天，慢慢慢慢找到了問題了，這個問題並不圓滿，可是已經慢慢慢找對了。那時候我想：哎呀，我真是個愚癡，就是被它騙！"]]},{"t":"64B 09:46","b":[["s","然後呢我想，你是普通一般的情況，你稍微了解一點的就會這樣，就是說我懂得了這個道理；可是懂得了道理，跑著去，下面看見還是跟著它跑。以後我也進一步了解了，原來道理雖懂，力量不足。要產生力量什麼呢？他告訴我們 ─數數思惟。其實這個道理，前面都告訴我們過了。這個思是什麼？行。行是什麼？業，業有一種力量的。哦！那時候我懂了，我就空下來，沒有事情的時候，就想著那個報紙的害處。啊，想，到後來，想、想、想、想，慢慢這個心裡的力量很強。然後呢我就自己試驗，又跑出去的時候，就想那個報紙有什麼缺點。以後當那個報紙那個東西來的時候，我拿到報紙以後就看，「啊！你這個傢伙以前專門在騙我，我現在可不上你的當了！」欸，妙咧！你以前你怎麼也擋不住要看的，現在你覺得是非常歡喜不上它當了，然後呢就這麼丟掉了，你高高興興地。"]]},{"t":"64B 10:57","b":[["s","不是說今天做到了，明天馬上做到，就跟著來喔，那時候自己立刻就檢查得出來。所以你用什麼方式保護那個正念 ─用正見。然後呢正見是什麼，正念是什麼，你會清清楚楚，當這兩樣東西在的時候，這不管什麼東西，這東西完全防護住了。現在你同樣這東西，你現在修了對治以後，然後呢當境界現起的時候，他怎麼說？「雖遇緣」，換句話說這個東西緣又來了，對不對？但是你沒有修過對治的時候，心情是什麼？你只看見它對你的好處，就是以前的染著；你修了對治以後，你那個心裡邊「啊，原來這個東西！」它這個染著的力量生得起來嗎？生不起來了，被你這個對治的力量把它損害了，到那個時候你不會再拿起來。我剛才舉那個報紙，你就不會拿起報紙來看，清楚不清楚？是這個這麼地明白，這麼地清楚！就這樣。"]]},{"t":"64B 12:05","b":[["s","所以我為什麼在這地方那麼不厭其詳地告訴你們，這有個道理在的喲，我但願你們聽見了這個話，回過頭去好好照以前告訴你們的辦法努力。要是不努力的話，你們對不起你們自己，我在這裡喊了個半天，我也覺得浪費了我的喉嚨、喉舌；但是你如果懂得了真正去做的話，那最寶貝的東西都在裡頭喔！所以他說你能夠損傷能感異熟的因，那個時候雖然遇到這個緣，它不會感果的道理就是，眼前的事情就這樣，將來的事情亦復如是。我們整個的相續沒有別的，就是這個東西，就是這個東西繼續不斷地相續。所以你呀相續當中加什麼業進去，它就顯什麼樣的果，彼此之間絲毫不差。在這種狀態之下，我們現在回想：喔！一切由業決定、業如何增長廣大、為什麼造了一定碰、不造一定碰不到，這個道理清楚了。在一百四十六頁上面，一百四十六頁的這個最後一句。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/011.mp3"},{"文":"如是由生邪見瞋恚，摧壞善根，亦復同爾。","口譯":"反過來，生起邪見、瞋恨心，把善根破壞掉，道理也是一樣的。","四家合註":"如是由生邪見、瞋恚摧壞善根，亦復同爾。","合註白話":{"same":8},"覺燈日光":null,"時":"64B 13:32","頁":147,"af":"64b","st":812,"et":897,"消文":[{"文":"惡業懺除了，遇到惡緣不結果；反過來，善根被邪見、瞋恚摧壞，遇到善緣也不結善果。"},{"文":"正反兩樣都知道了：壞的儘量懺除，好的儘量防護而增長。"}],"延伸":[],"逐字稿":[{"t":"64B 13:32","b":[["q","如是由生邪見瞋恚，摧壞善根，亦復同爾。"],["s","這地方就是說，這個如果說你造了壞的事情，然後你經過了懺悔以後，懺除了以後啊，雖然遇見那個惡緣，這個惡業不會結果；反過來，雖然你有了善根，那個善根如果你前面邪見或者瞋恚，把那個善根摧壞了，到那時候那個善根遇見善緣，它也不能結善果。不管是惡、不管是善，這個心相，就是這樣的心相。如果這個心相偏那邊的，也是這個心相，偏那邊的也是這個心相。偏那邊是黑的，然後你懺悔了，這個黑的惡果不會結；反過來，偏那邊善的，如果你由於邪見跟瞋恚摧壞了，這善果也不結。那麼現在正、反兩樣，我們都知道了，所以壞的我們儘量地把它懺除，好的儘量防護而增長。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/012.mp3"},{"文":"《分別熾然論》云：「若時善法，由生邪見，瞋恚虧損。或諸不善，若由厭訶，防護悔除，是等對治，傷損其力。彼等雖得眾緣會合，然由傷損若善不善種子功能，豈能有果從彼感發。«由無緣合，時亦遷謝»，豈非從其根本拔除。","口譯":"《分別熾然論》說：「當善法由於生起邪見、瞋恚而虧損，或者不善業由於厭惡訶責、防護悔除這些對治而傷損了力量，那麼它們縱使遇到眾緣會合，可是善或不善的種子功能既已受傷，怎麼還能從那裡感發出果來？既然沒有緣可以會合，時節也已經遷流過去，這豈不就是從根本上拔除了嗎？","四家合註":"《分別熾然論》云：「<span>（一）<\/span>若時善法由生邪見、瞋恚<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">等摧壞<\/span>虧損；或諸不善，若由<span class=\"sjan sj-ba\">〔<\/span>厭訶<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂悔前事心。〕<\/span>、<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">於後<\/span>防護、<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">不祕藏而<\/span>發露，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">總之，<\/span>是等<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">完具四力之<\/span>對治<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">摧壞<\/span>，傷損其力，彼等雖得眾<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">因<\/span>緣會合，然<span>（三）<\/span>由<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">對治<\/span>傷損若<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此等<\/span>善不善<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">業能感自異熟果之<\/span>種子功能<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">故<\/span>，<span>（二）<\/span>豈能有<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">苦樂<\/span>果從彼<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">善不善<\/span>感發？<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">應不感發，<\/span><span>（五）<\/span><span class=\"sjan sj-ba\">以若略生彼之對治，則彼即能略微損減；若如是者，則其對治圓滿，自亦遍有從根永盡之時故。初因成立，以若略生能障彼安住之對治，則能令彼安住間斷，復略消減；非唯如是，<\/span>由<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">其住分略<\/span>無<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">或不具足因<\/span>緣合，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">亦能害彼，其住<\/span>時亦遷謝<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">而不安住或永盡故。<\/span><span>（四）<\/span><span class=\"sjan sj-ba\">能如是衰損之因相，亦如謗法之業障有法<\/span>，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">彼<\/span>豈非<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">容有<\/span>從其根本拔除<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">永盡之時<\/span>？<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">應當容有，<\/span><span>（六）<\/span><span class=\"sjan sj-ba\">以對治摧壞罪惡之理，非唯從根永盡耳，尚有其餘摧壞之理，<\/span>如經說云：『<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">以<\/span>受持正法<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">等對治力<\/span>，雖其所有順定受<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">後世惡趣大苦<\/span><span>之<\/span>惡，亦當變為於現法<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此生<\/span>受<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">微小異熟<\/span>。』又如說云：『<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如是<\/span>復次，諸往<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">後世<\/span>惡趣業<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">由以對治摧壞故<\/span>，此唯能感<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此生小苦<\/span>頭痛許。』","合註白話":{"same":8},"覺燈日光":null,"時":"64B 14:57","頁":147,"af":"64b","st":897,"et":1229,"消文":[{"文":"善法被邪見、瞋恚損壞，這一點要非常小心。"},{"文":"厭是厭惡、訶是訶斥，然後防護不再犯、懺悔——就對治了。"},{"文":"原來的善惡業損傷了，雖然遇到緣也不能感果；眼前這樣，將來也這樣。"}],"延伸":[{"題":"由無緣合，時亦遷謝","組":[{"題":"等流先淨，外緣碰不上","說":[{"類":"立","文":"造業有異熟、等流在內身心，士用在外境；懺悔一定淨除裡邊的等流。"},{"類":"立","文":"以前歡喜的心變成厭惡，境界現起時你排斥它，外緣碰不上。"}]},{"題":"種子壞了，不再發芽","說":[{"類":"喻","文":"稻種收下來，明年下雨出太陽就長出來；種子弄壞了，曬太陽、泡水也長不出來；再過時節，永遠沒機會。"}]},{"題":"先問如何懺悔","說":[{"類":"下手","文":"人家問懺悔能不能淨除，先了解如何懺悔：造罪的原因、懺悔的方式說清楚，自然有答案。"},{"類":"破","文":"做不對，頭顱磕破也沒有用。"}]},{"題":"修行原來如此","說":[{"類":"立","文":"懺悔如此，積累功德也如此；人天、小乘、大乘、密乘沒有一個例外，整個佛法講的就是因果。"},{"類":"立","文":"了解了這個道理，念佛、參禪、學定，哪有一個不成。"}]}],"說":[{"類":"立","文":"造業有異熟、等流在內身心，士用在外境；懺悔一定淨除裡邊的等流。"},{"類":"立","文":"以前歡喜的心變成厭惡，境界現起時你排斥它，外緣碰不上。"},{"類":"喻","文":"稻種收下來，明年下雨出太陽就長出來；種子弄壞了，曬太陽、泡水也長不出來；再過時節，永遠沒機會。"},{"類":"下手","文":"人家問懺悔能不能淨除，先了解如何懺悔：造罪的原因、懺悔的方式說清楚，自然有答案。"},{"類":"破","文":"做不對，頭顱磕破也沒有用。"},{"類":"立","文":"懺悔如此，積累功德也如此；人天、小乘、大乘、密乘沒有一個例外，整個佛法講的就是因果。"},{"類":"立","文":"了解了這個道理，念佛、參禪、學定，哪有一個不成。"}],"af":"64b","st":1013}],"逐字稿":[{"t":"64B 14:57","b":[["q","《分別熾然論》云：「若時善法，由生邪見，瞋恚虧損。或諸不善，若由厭訶，防護悔除，是等對治，傷損其力。彼等雖得眾緣會合，然由傷損若善不善種子功能，豈能有果從彼感發。由無緣合，時亦遷謝，豈非從其根本拔除。"],["s","喏，這個論上面就告訴我們，說或者是你的善法，種的種種的、做了種種的善業，可是到後來，或者是邪見，或者是瞋恚，把這個善業損壞了，把這個損壞了，這一點我們要非常小心、非常小心！反過來呢是不善，如果說你了解了，然後曉得這個壞事情的過患，你「厭訶」，厭是厭惡，訶是訶斥，然後呢防護不再犯，懺悔，就對治它了，這個是我們應該精進努力。這個兩種方式，把原來是種下去的這個善惡業損傷了以後，那個時候雖然遇到緣，它不能感發這個果，不能感發果，第一個。上一堂就是講這個道理，眼前的就是這樣，將來的也是這樣，因為理論就是這樣嘛，不管你時間用在哪裡，就這麼個道理，就這麼簡單的一件事情，這樣。"]]},{"t":"64B 16:53","b":[["s","再下面呢？「由無緣合，時亦遷謝」，這個話怎麼講呢？就是說當你造任何一個業的時候，它分幾部分，「異熟、等流」這是在你自己內身心上頭的，這個「士用果」是從外面境界上面的。如果是你造了這樣的業的話，這個東西同時現起，經過了你自己懺悔，或者三樣東西同時淨除，或者最主要的呢，是裡邊的等流，那是一定把它淨除的。以前的等流是什麼？你造的惡，現在我懊悔：「唉呀，我怎麼這樣錯啊！」所以當這一件事情現起來的時候，你以前歡喜那個心，現在變成功厭惡的心，對不對？所以當境界現起的時候你厭惡它了，當然你排斥它了。所以當感果的時候，這個外緣雖然現起，但是你排斥了，那個外緣碰不上。"]]},{"t":"64B 18:03","b":[["s","就像說，現在嘛我今年種一個稻子，結了果，然後收下來了以後，到了明年春天下雨了，出太陽了，那個稻就長出來了。這個外面這個雨跟陽，這個叫外頭的外緣，現在我們不妨歸入增上果當中，那麼種子本身就是等流、異熟。現在經過我這個懺悔把那個種子弄壞了，弄壞了以後，儘管那個曬太陽、泡水，它長不出來。再過了一些時候，太陽也沒有，水也沒有了，它當然永遠沒機會了，所以下面說「時亦遷謝」，時節它也變掉了。那當然既然如此的話，是不是不會感果了？所以「豈非從其根本拔除」，喏！這個理路這麼清楚。"]]},{"t":"64B 19:07","b":[["s","哦！現在我們完全明白了，所以以後碰到這種情況，人家問你：「欸，懺悔了以後能不能淨除？」你怎麼回答他？這裡現在你不要先問能不能，你先要了解你如何懺悔，懂不懂？你把造罪的原因是什麼，懺悔的方式是什麼，說得清清楚楚，那不必解答，下面自然。你做對了，絕對！做不對，儘管你在磕頭，頭顱磕破，沒有用，就這樣。"]]},{"t":"64B 19:44","b":[["s","那麼既然懺悔是如此，積累的功德當然也是如此，所以我們到了這個地方才曉得：啊，修行原來是這樣的！是不管是人天、小乘、大乘、密乘，沒有一個例外。因為整個佛法講的 ─因果，就是如此，最膚淺的，人天乘；深一層的，聲、緣，乃至於大乘，這個地方是基本。所以我們說了解了這個道理以後，不管你做什麼，念佛，念佛成；參禪，參禪成；然後呢學定，學定成，哪有一個不成的事情。繼續下去。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/013.mp3"},{"文":"如經說云：『受持正法，雖其所有順定受惡，亦當變為於現法受。』又如說云：『復次諸往惡趣業，此唯能感頭痛許。』設作是云：『若尚有果，唯頭痛者，豈是從其根本拔耶？』諸惡業果，無餘圓滿，謂當感受那落迦苦，若尚不受那落迦中諸輕微苦，豈非即從根本拔除。於此略起頭痛等故，豈是本來原無果報。」","口譯":"像經上說：「受持正法的人，即使他所有的是順定受的惡業，也會轉變成在現在這一生就受掉。」又像另一處說：「再者，那些本來要往惡趣的業，如今只能感得頭痛這麼一點而已。」假使有人這樣問：「如果還有果報、只是頭痛，怎麼算是從根本拔除呢？」要知道：這些惡業的果報，圓滿無餘地說，本來是應當感受那落迦的大苦；如今連那落迦中最輕微的苦都不必領受了，這豈不就是從根本拔除？至於這裡只略起個頭痛等等，那是因為畢竟造過，哪裡能說本來就沒有果報呢。」","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第五、雖遺微細果報，然猶不違從根淨除不善異熟之理者：<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">於此結合依據，<\/span>設<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">有<\/span>作是云：『<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">若爾，當受後世惡趣大苦之業，由對治力令成此生唯頭痛者，<\/span>若尚有果，唯<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此生<\/span>頭痛者，豈是從其根本拔<span>除<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">或摧壞彼業之果<\/span>耶？<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂非然也。<\/span>』<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">答曰：無過。如是<\/span>諸惡業果<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">不以對治摧壞，須當<\/span>無餘圓滿<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">領受<\/span>，謂<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">須<\/span>當感受那落迦<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">極大<\/span>苦，若<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">以對治力摧壞彼業功能之補特伽羅，<\/span>尚不受那落迦中諸輕微苦，豈非即從根本拔除<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">其業果報<\/span>？<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">是也。如是，復從<\/span>於此<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">業但唯<\/span>略起<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">現世<\/span>頭痛等<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">果<\/span>故，豈是<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">其業<\/span>本來原無果報？<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">非也。<\/span>」","合註白話":{"id":"19560","頁":542,"白話":"第五科、即使殘留微少果報，也不違背從根淨除不善異熟的道理：對於前述具有根據的說法，如果有人提出：『若是如此，將在來世承受惡趣大苦的業，藉由對治的力量轉變為只是在今生頭痛，這種狀況下，既然在今生還僅存頭痛的果報，怎麼會是連根剷除、摧毀該業的果報？就應當不是了。』答道：沒有過失，因為這樣的惡業果報如果未經對治摧毀，必定完全圓滿地承受的話，是必定要承受地獄的極大痛苦；相較之下，藉由什麼對治的力量摧毀此業的能力，以致那位補特伽羅連微少的地獄痛苦都不用承受，這難道不是最徹底地根除該業的果報？應該是的。既然如此，此業僅僅在此世產生頭痛等果報，又豈是這個業根本就沒有果報？當然不是。」","注釋":[],"已校":true},"覺燈日光":null,"時":"64B 20:29","頁":147,"af":"64b","st":1229,"et":1397,"消文":[{"文":"認真受持正法，本來下一世定受的惡業，變成現法受，受了一點，下次就沒有了。"},{"文":"有人問：還要感得頭痛，怎麼說是根本拔掉？本來要到那落迦，現在徹底不去了，豈不是根本拔除。"},{"文":"畢竟造了，跟不造不一樣，所以還感得小小的頭痛。"},{"文":"力有大小、有方向：大小是量，方向是質；觀察越深入，認識越正確，效果越圓滿。"}],"延伸":[],"逐字稿":[{"t":"64B 20:29","b":[["q","如經說云：『受持正法，雖其所有順定受惡，亦當變為於現法受。』又如說云：『復次諸往惡趣業，此唯能感頭痛許。』設作是云：『若尚有果，唯頭痛者，豈是從其根本拔耶？』諸惡業果，無餘圓滿，謂當感受那落迦苦，若尚不受那落迦中諸輕微苦，豈非即從根本拔除。於此略起頭痛等故，豈是本來原無果報。」"],["s","下面就說：就像經上面說，說由於你這樣「受持正法」什麼等等，認真去做，本來你造的這個惡業是定受的，是最糟糕的，將來下一世一定要感的，因為你現在受持了正法，所以現在變成現法受，受了一點嘛，好囉！下次就沒有了。"]]},{"t":"64B 21:32","b":[["s","下面又說，現在那個惡趣，本來要惡業當中的，現在就感得 ……有的人這麼說，他說：「你本來要去惡趣，你說淨除了，但是呢這個就是感得頭痛。假定你說還要感得頭痛的話，那怎麼說是從它根本拔掉了呢？」他現在告訴我們：你現在這個惡業的果啊，本來要到那落迦的，現在呢，徹底地不到那落迦去了，那落迦是何等地可怕，現在你完全不要去了，豈不是根本拔除了？但是呢畢竟你是造了，所以既然造了，跟不造不一樣，所以你還感得小小的頭痛等等，這個道理就是這個樣。"]]},{"t":"64B 22:31","b":[["s","所以假定說我們把前面剛才所講的，這個業的力量懂得了以後的話，關於這些疑問，一點都沒有了，一點都沒有了，自然而然你有什麼的業，就產生什麼樣的功效。平常我們在講力當中，這有幾個很有趣的現象，力，講力最基本的，有一個叫大小，有一個叫方向，最基本的。這個大小是講它的量，方向實際上就講它的質，那麼現在我們用在這個地方亦復如是。所以它每一地方它你要越是觀察地深入，那麼然後你認識地越正確，將來產生的效果是越圓滿。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/014.mp3"},{"文":"雖未獲得真能對治壞煩惱種，然由違緣令傷損故，縱遇眾緣亦不感果，內外因果，多是如是。","口譯":"雖然還沒有獲得真正能夠壞掉煩惱種子的正對治，但由於違緣已經把它傷損了，所以縱使遇到眾緣也不感果；內因果、外因果，大多都是這樣。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第六、四力雖非作為摧壞罪種之對治，然衰損之果不能感生之理者：<\/span>雖未獲得真能對治壞煩惱種，然由違緣令傷損故，縱遇餘緣亦不感果，內外因果，見多如此。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">先輩或謂：「如以四力對治淨罪者，是將異熟暫延遲也，非與緣會仍不感果，以其未斷彼種子故。若因不成，則世間道應能斷除所斷種子。」為破除如此邪解，故說如是。<\/span>","合註白話":{"id":"19587","頁":543,"白話":"第六科、四力雖然不作為毀滅罪惡種子的對治品，但是經過削弱的果報也不會被引生的道理：雖然沒有獲得毀滅煩惱種子的對治品，但是由於違緣而削弱它，因此即使其他因緣匯聚也不會感生果報，這在內在與外在的因果中都相當多見。某些前輩祖師說：「以四種對治力淨化罪惡，是將其異熟暫時延後，而非即使遇到因緣也不感果，因為四種對治力並未斷除煩惱的種子。如果不成立的話，那麼世間道就應當能夠斷除所斷的種子。」正是為了消除這種顛倒思惟，所以這麼說。因此，雖然勤於累積眾多善業，但是如果不防護瞋恚等摧毀善根的因緣，就會如上所述，連根摧毀果報，因此必須致力於防護，使之不再產生；並且精進地還淨過去累積的不善。","注釋":["縱遇餘緣：法尊法師原譯作「縱遇眾緣」，今據藏文改譯。","見多如此：法尊法師原譯作「多是如是」，今據藏文改譯。","瞋等：原文無此二字，法尊法師取意譯入。"],"已校":true},"覺燈日光":null,"時":"64B 23:17","頁":147,"af":"64b","st":1397,"et":1444,"消文":[{"文":"真的對治要把整個功能淨除，要證得空性，那時才是正對治。"},{"文":"現在這種對治，損害了感果的功能，所以遇緣而不感；內外因果都是如此。"}],"延伸":[],"逐字稿":[{"t":"64B 23:17","b":[["q","雖未獲得真能對治壞煩惱種，然由違緣令傷損故，縱遇眾緣亦不感果，內外因果，多是如是。"],["s","說像前面這樣，還沒有得到真的對治喔！什麼是真的對治？真的對治一定要把那個真正整個的功能淨除掉，那是什麼？要證得空性的時候，那個時候正對治了，那時候真的對治了。現在這種對治，由於這個損惱了以後，損害了這個感果的功能，所以遇緣而不感。「內外因果多是如是」，不管內因果、外因果都是如此。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/015.mp3"},{"文":"故雖勤修眾多善法，若不防護瞋恚心等壞善之因，則如前說。故須勵力防護瞋等，精勤修習不善還出。","口譯":"所以即使認真修了很多善法，如果不小心防範瞋恨等會破壞善根的東西，結果就會像前面說的那樣（善根被毀）。因此一定要努力防範瞋恨等，並且認真修懺悔，把已經造的惡業清淨掉。","四家合註":"故雖勤修眾多善法，若不防護瞋恚心等壞善之因，則如前說<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">從根摧壞其果<\/span>。故須勵力防護瞋等<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">從此不生<\/span>，精勤修習<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">昔所積造<\/span>不善還出。","合註白話":{"same":14},"覺燈日光":null,"時":"64B 24:04","頁":147,"af":"64b","st":1444,"et":1515,"消文":[{"文":"造了惡法可以懺悔淨除；同樣地，造了很多善法，有邪見、瞋恚也會損壞善根，修行的人要特別注意。"},{"文":"最容易犯的是戒：戒相已經難，第三句「自淨其意」尤其難。"},{"文":"好的不要損壞，壞的努力淨除。"}],"延伸":[],"逐字稿":[{"t":"64B 24:04","b":[["q","故雖勤修眾多善法，若不防護瞋恚心等壞善之因，則如前說。"],["s","所以注意哦！固然造了惡法，我們可以懺悔淨除，同樣地，你雖然造了很多善法，如果你有邪見、瞋恚等等的話，同樣地會把你的這個善根損壞喲，這是我們修行的人特別注意哦！那麼現在我們尤其容易犯的幾件事情：第一個，戒。啊，這個戒要想持得好，真難！戒要想持得好，真難！那麼戒相已經難了，所以這個略戒當中第一、第二句已經難了，第三句是尤其難哪！第三句「自淨其意」，這個是尤其難。這是我們要說，所以他告訴我們「則如前說」，像你前面說的，因為儘管你造了很多的善業，因為你起了這種心哪，壞掉了，壞掉了！"],["q","故須勵力防護瞋等，精勤修習不善還出。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-21/016.mp3"}],"投影片":[{"img":"投影片/shenxin-yeguo-21/001.webp","n":1},{"img":"投影片/shenxin-yeguo-21/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/shenxin-yeguo-21/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/shenxin-yeguo-21/004.webp","n":4},{"img":"投影片/shenxin-yeguo-21/005.webp","n":5},{"img":"投影片/shenxin-yeguo-21/006.webp","n":6},{"img":"投影片/shenxin-yeguo-21/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=63b&st1=1688&et1=1800","box":[0.123625,0.3591111111111111,0.1265,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-21/008.webp","n":8},{"img":"投影片/shenxin-yeguo-21/009.webp","n":9,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=64a&st1=21&et1=235","box":[0.534875,0.2791111111111111,0.1265,0.06177777777777778]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/shenxin-yeguo-21/010.webp","n":10},{"img":"投影片/shenxin-yeguo-21/011.webp","n":11},{"img":"投影片/shenxin-yeguo-21/012.webp","n":14},{"img":"投影片/shenxin-yeguo-21/013.webp","n":15,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=64a&st1=419&et1=728","box":[0.519875,0.25577777777777777,0.10900000000000001,0.064]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/shenxin-yeguo-21/014.webp","n":16},{"img":"投影片/shenxin-yeguo-21/015.webp","n":19},{"img":"投影片/shenxin-yeguo-21/016.webp","n":20,"links":[{"t":
