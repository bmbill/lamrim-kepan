":25,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=67b&st1=1269&et1=1555","box":[0.123625,0.3591111111111111,0.1265,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/xiqiu-jietuo-01/025.webp","n":26},{"img":"投影片/xiqiu-jietuo-01/026.webp","n":27},{"img":"投影片/xiqiu-jietuo-01/027.webp","n":28},{"img":"投影片/xiqiu-jietuo-01/028.webp","n":29,"photo":[0.04024803149606299,0.17,0.919628875492126,0.73]},{"img":"投影片/xiqiu-jietuo-01/029.webp","n":30,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=67b&st1=1568&et1=1770","box":[0.519875,0.25577777777777777,0.10900000000000001,0.064]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/xiqiu-jietuo-01/030.webp","n":31},{"img":"投影片/xiqiu-jietuo-01/031.webp","n":32,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=68a&st1=15&et1=345","box":[0.124875,0.3591111111111111,0.12525,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/xiqiu-jietuo-01/032.webp","n":33},{"img":"投影片/xiqiu-jietuo-01/033.webp","n":34},{"img":"投影片/xiqiu-jietuo-01/034.webp","n":35,"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/xiqiu-jietuo-01/035.webp","n":39,"yt":"E1qFpq1i0fY"},{"img":"投影片/xiqiu-jietuo-01/036.webp","n":40}],"投影片PDF":"投影片/xiqiu-jietuo-01/slides.pdf","音檔範圍":"67A 24:08～68A 05:45"},"siwei-kudi-01":{"id":"siwei-kudi-01","標題":"思惟苦諦(1)","根":"顯示四諦先說苦諦之意趣","科判焦點":"癸一 顯示四諦先說苦諦之意趣","課本範圍":"P154 L1 ~ P155 L7","堂數":86,"日期":"2026/11/3","分圖":[{"名":"違次第之扼要","原文":[0,6]},{"名":"四諦次第","原文":[7,16]},{"名":"總攝與策勵","原文":[17,22]}],"跨科判":null,"週":109,"班級":"24秋007","序":null,"音檔":{"68a":{"local":"音檔/gl1/068A.mp3","remote":"https://lamrim.xyz/player/media/gl1/068A.mp3"},"68b":{"local":"音檔/gl1/068B.mp3","remote":"https://lamrim.xyz/player/media/gl1/068B.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=68a&st1=345&af2=68b&et2=1051","段":[{"文":"希求解脫方便分二：一由於苦集門中思惟，二由於十二緣起思惟。","口譯":"生起希求解脫之心的方法分兩條路：一是從苦、苦的原因這兩方面去思考；二是從十二緣起去思考。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"整段","文":"以現觀生起的次第來講，現觀次第就是證量生起的次第，或思（四聖諦）的模式，首先思惟我們為什麼會苦？是真的苦嗎？反復地思惟苦相的道理。如果痛苦是不能解決的，思惟痛苦就無用，還不如就不要去想痛苦，讓自己保持樂觀的態度。如果痛苦是可以解決的，思惟痛苦就很有意義了。因為痛苦是可以解決的緣故，我們若再保持樂觀，就是欺騙自己，那就不對了。我們應該更積極地去解決痛苦，讓自己獲得永久的安樂才是。","涵蓋":[0,17]},{"類":"整段","文":"從無始以來，我們一直欲求離苦得樂，卻一直在累積錯誤的因緣，想要離苦得樂，結局卻是離樂得苦。如果追求快樂的方式不改，我們再怎麼想要離苦得樂，結果還是會跟今天一樣。再過千劫、萬劫、億劫，也都是一樣，因為因果絲毫不爽。我們把離苦得樂的權利、一生所追求的目標，非常愚蠢地完全交給愛我執和我執去操控。愛我執心胸如此狹小，它只想到自己；我執對實際情況完全不瞭解，是一種執實的顛倒執著，我們居然把自己的痛苦和快樂交給這兩個執著。口頭上說歸依佛，但實際上，我們歸依的是愛我執和我執。一再如此，所感得的果報是什麼呢？如同宗喀巴大師所說：「四大瀑流猛漂激，業繩繫縛難掙脫。」一直想要離苦得樂，一直想要從痛苦的苦海中脫離，可是卻被生、老、病、死之激烈瀑流帶走，無自主地一直漂流著。如果漂流時，我們的手腳可以活動，可以游泳，至少還有脫離的機會，可是我們不只是被四大瀑流牽引，同時也被業的繩索緊緊捆綁，無法掙脫。","涵蓋":[0,17],"校":"系縛→繫縛"},{"類":"整段","文":"「業繩繫縛難掙脫」的另一個理由是，我們不是看到煩惱的過患或修法之後就不會再造業了。即使看到了煩惱的過患，只要沒有透過對治力去消滅煩惱的根本，我們就一直隨著煩惱而造業。只要內心煩惱生起，心與煩惱相應，我們的身語意就每一刹那都在造業。我們現在所感的果，可能是一個業所引發的好幾世之一。一個業所引發的好幾世中，我們又累積了多少業？不要說一世、一天，就說一個小時裡面，我們就造了許多業。我們會造多少業？千萬，甚至億萬、百億萬、千億萬的業？我們的業只會越來越多，而且大都與煩惱相應。所以業繩真的是緊緊繫縛著我們，如何能掙脫呢？過去的業還沒消受完，又再造新業，真是太恐怖了。四大瀑流就是這樣一直逼迫我們，牽引著我們，我們隨著瀑流無有自主地漂流。","涵蓋":[0,17],"校":"系縛→繫縛"},{"類":"整段","文":"「既入我執堅鐵網」、「復被無明大暗蔽」，而且我們又被投入無明我執的堅鐵網當中。我們所做的事，幾乎都是隨著愛我執和真實執著，也就是在心胸非常狹小的觀念下及顛倒認知實相的情況下去做事。如此，想要從生、老、病、死當中脫離，真是太難了。如果眼睛可以看得到，至少內心還可以安穩一點，可是卻又被無明的黑暗給蒙住，根本無法看到實際的狀況。在煩惱等內外因緣聚集下，如何才能看到正法等善因緣呢？所以《入行論》中說到：善法好比是我們長久居住在黑暗當中一刹那的閃電一樣，是如此地短促，如此地微弱。","涵蓋":[0,17],"校":"複被→復被"},{"類":"整段","文":"「無邊生死生復生，三苦逼害恒相續。」痛苦源源不斷，一定是我們在離苦得樂的方法上有了錯誤。如果方法沒有錯，無始以來到現在，我們都致力於離苦得樂，今天應該是很快樂才對，可是卻沒有。我們要仔細思考這個問題。","涵蓋":[0,17],"校":"生複生→生復生"}],"時":"68A 05:45","頁":154,"af":"68a","st":345,"et":396,"消文":[{"文":"啟發的方法分兩部分：一由集諦門思惟，二由十二緣起門思惟。"},{"文":"兩者任意了解一個、把握住一個，問題就可以解決。"}],"延伸":[],"逐字稿":[{"t":"68A 05:45","b":[["q","希求解脫方便分二："],["s","這個啟發的方法分兩部分，第一個由集諦門思惟，第二個由十二緣起門思惟。"]]},{"t":"68A 05:54","b":[["q","一由於苦集門中思惟，二由於十二緣起思惟。"],["s","這兩者當中你任意能夠了解一個，把握住一個，問題就可以解決了。你要想兩個都認識的話，那彼此之間為什麼要這樣開合，如果你弄得很清楚的話，那這個問題真是易如反掌。你去到 ……在任何情況之下，你可以處處體會，可以處處體會，所有的眼前這種障礙，都消除掉了。現在我們分那個兩部分看下去：初就是由苦集門中，分二。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/001.mp3"},{"文":"初中分二：一思惟苦諦生死過患，二思惟集諦流轉次第。初中分二：一顯示四諦先說苦諦之意趣，二正修苦諦。今初","口譯":"第一條路又分兩點：一、思考苦諦，也就是生死有哪些過患；二、思考集諦，也就是我們是怎樣一步步流轉生死的。前一點又分兩小點：一、說明四諦為什麼先講苦諦；二、正式修苦諦。下面先講第一小點。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68A 06:36","頁":154,"af":"68a","st":396,"et":486,"消文":[{"文":"先認識、觀察、思惟：生死的特質是苦，確確實實是苦。"},{"文":"再問：為什麼會在生死當中流轉？"},{"文":"先說明四諦為什麼先講苦諦，然後正講苦諦。"},{"文":"平常覺得「告訴我們就好」，找不到必須這樣說的理由；實際上有絕大的原因。"}],"延伸":[],"逐字稿":[{"t":"68A 06:36","b":[["q","一初中分二：思惟苦諦生死過患，"],["s","第一個先要了解、認識、觀察、思惟，這個生死的特質是什麼？苦，是苦。確確實實這一個是苦的。第二個呢，"]]},{"t":"68A 06:55","b":[["q","二思惟集諦流轉次第。"],["s","那麼為什麼會在生死當中流轉呢？為什麼呢？這樣。這個兩部分，又一一各別分開來講。"]]},{"t":"68A 07:11","b":[["q","初中分二：一顯示四諦先說苦諦之意趣，二正修苦諦。　今初"],["s","先說明四諦，說苦集滅道，為什麼先要講苦諦的原因，然後正講苦諦，現在說下去。要平常在我們一般狀態學的時候，我們就說：「經上面嘛告訴我們苦集滅道，你就告訴我們算囉！他為什麼要講，哦，『先說苦諦』啊、為什麼啊，這個次第為什麼要這講啊？」這樣。平常我們說：「啊！你趕快告訴我，告訴我們曉得嘛就好啦！」好像那個道理表面上面，我們找不到必須要說的理由，通常我們這種狀態。實際上呢，這個有他的絕大的原因在，絕大的原因在，現在我們把這個文看下去。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/002.mp3"},{"文":"集諦為因，苦諦是彼之果，故集是先，果應是後。","口譯":"集諦是因，苦諦是它的果，所以集應在先，果應在後。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"以四聖諦的生起次第來說，污染的因果二諦是先有集諦後有苦諦，清淨的因果二諦是先有道諦才有滅諦。先以見道無間道現證空性的智慧正對治煩惱，見道無間道時現證空性的智慧就是道諦，由此在見道解脫道時才會獲得斷除見道所斷之滅諦，所以先有道諦才能證得滅諦。既然集諦先有，苦諦後有，為何世尊不按照這種次第而說，卻先說苦諦，後說集諦呢？宗喀巴大師說，導師釋迦牟尼佛沒有按照因果次第宣說四聖諦，而以現觀次第宣說，有極大意義、具極大的修持扼要。為什麼呢？如果有情不想獲得解脫，再怎麼跟他說解脫之道，他也不會去追求。雖然道諦先有，滅諦後有，可是如果他不想追求滅諦，縱使跟他說道諦，他也不會想要去獲得。為了對滅諦生起希求心，我們必須先看到滅諦的功德。在看到滅諦的殊勝之前，必須瞭解為什麼要尋求滅諦、為什麼要解脫。我們現在所擁有的輪迴的安樂只是短暫的，我們被欺騙、迷惑，以為這是真正的安樂，由此感到心滿意足。實際上，我們不能滿足於短暫的安樂，因為有更長久的安樂值得去追求。透過這種方式引導，才是非常有智慧的引導方式：首先使有情瞭解，只要被業和煩惱所轉，就沒有任何的安樂。認知此苦相，深深感覺痛苦，才會想要厭離，才會去尋求苦因。否則，想從痛苦當中解脫，只是一種想法、一種祈求而已，並不實際。如果真的想從痛苦當中獲得脫離，就不應該只是發願、祈求，而應該去尋找痛苦之因來自於哪裡，那就是集諦。","涵蓋":[2,6],"校":"輪回→輪迴、滿足于→滿足於"}],"時":"68A 08:06","頁":154,"af":"68a","st":486,"et":533,"消文":[{"文":"流轉生死的因是集，感得的果是苦。"},{"文":"照先後次第，應該集在先、苦在後。"}],"延伸":[],"逐字稿":[{"t":"68A 08:06","b":[["q","集諦為因，苦諦是彼之果，故集是先，果應是後。"],["s","集就是因。由於造了這個因，聚集了這個因，那麼感得的這個因的果。流轉生死的因是集，然後呢感得流轉生死的果是苦，所以照這個先後的次第，應該是集在先而苦在後。結果呢，世尊卻先講苦，後講集，所以說：為什麼原因世尊不順那個次第？"]]}],"口譯音":"口譯音檔/siwei-kudi-01/003.mp3"},{"文":"何故世尊不順彼義之次第而作是說，諸苾芻此是苦聖諦，此是集聖諦耶？","口譯":"為什麼世尊不依照這個義理的次第，卻這樣說：「諸比丘，這是苦聖諦，這是集聖諦」呢？","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68A 08:53","頁":154,"af":"68a","st":533,"et":559,"消文":[{"文":"世尊正講時先說「這是苦」，再說「這是集」，次第恰恰相反，什麼原因？"}],"延伸":[],"逐字稿":[{"t":"68A 08:53","b":[["q","何故世尊不順彼義之次第而作是說，諸苾芻此是苦聖諦，此是集聖諦耶？"],["s","世尊正講的時候先告訴我們：這個是苦啊，你應該知道，這是集啊！他那個次第卻先講苦然後講集，恰恰相反，什麼原因呢？下面就說："]]}],"口譯音":"口譯音檔/siwei-kudi-01/004.mp3"},{"文":"大師於此違因果次第而宣說者，以«有至大修持扼要»，故無過失。","口譯":"大師在這裡違反因果次第來宣說，是因為其中有極重大的修持扼要，所以沒有過失。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68A 09:19","頁":154,"af":"68a","st":559,"et":750,"消文":[{"文":"佛把因果次第顛倒來說，有特別的原因：修行的綱要在這裡。"},{"文":"學了要去修，修的次第就是這樣，所以沒有任何過錯。"}],"延伸":[{"題":"修持扼要","組":[{"題":"缺少推動修行的力量","說":[{"類":"立","文":"我們不能修行，是缺少推動修行的力量：曉得要修，就是提不起來。"},{"類":"例","文":"故事中看見地獄、天堂的情況這麼嚴重，不管年輕年老都拼命了。"}]},{"題":"身病求醫，心苦求脫","說":[{"類":"喻","文":"生了病，該做的事都不願做，急著找醫生；病只是小小的苦。"},{"類":"立","文":"心理上也感受到苦切的力量，就坐立不安，一心求解脫。"},{"類":"回扣","文":"所以先說苦諦，這是修行的次第，這是正確的。"}]}],"說":[{"類":"立","文":"我們不能修行，是缺少推動修行的力量：曉得要修，就是提不起來。"},{"類":"例","文":"故事中看見地獄、天堂的情況這麼嚴重，不管年輕年老都拼命了。"},{"類":"喻","文":"生了病，該做的事都不願做，急著找醫生；病只是小小的苦。"},{"類":"立","文":"心理上也感受到苦切的力量，就坐立不安，一心求解脫。"},{"類":"回扣","文":"所以先說苦諦，這是修行的次第，這是正確的。"}],"af":"68a","st":559}],"逐字稿":[{"t":"68A 09:19","b":[["q","大師於此違因果次第而宣說者，以有至大修持扼要，故無過失。"],["s","第一個告訴我們，說佛對於這一件事情，把那個因果次第顛倒違反而說，他有他的特別的原因的。什麼原因？修行的綱要在這裡。你為什麼要學？你要學了去修行，結果你要修行的，那個次第就是這樣的，所以沒有任何過錯，沒有任何過錯。反過來說，他就是絕對正確地要這樣講，世尊之所以為世尊，原因就在這個地方。關於這一點，對於我們有一個非常重要的啟示。我們平常所以不能修行的原因，就是缺少了推動我們修行的力量，曉得這個要修行，要好，但是就提不起來。那麼我們以前聽過那個各式各樣的故事，那個故事都是這樣的：哎呀，他去了，出了家也不行。結果跑到地獄裡一看，跑到天堂上一看，哎呀！那個時候不管他年輕也好、年老也好，大家都拼命了。為什麼？啊！原來看見這個情況是這麼個嚴重。"]]},{"t":"68A 10:50","b":[["s","那麼同樣地，對我們也是一樣。我們雖然沒有這個福德因緣，感得佛菩薩帶我們到天堂地獄去看看，但是我們眼前都遭受到了。哦，一生了病，哎唷，生了病趕快去找醫生啊，這個事情，要該做的事情都不願意。你就急著、忙著，病是件小小的苦，你就拼命去找醫生。所以現在這個地方也指出來，說喏、喏、喏，這一個東西本身哪，是在大病、大苦當中啊！那麼他指出來了以後，如果說你能夠如理照他指出來的方法，一步一步地深入，那個時候你內心上面就產生一種狀態，什麼？覺得這個痛苦的逼迫性，就在這裡啊！那是無法忍受，你就拼命要去求解脫了。所以他為什麼要先說的次第。"]]},{"t":"68A 11:56","b":[["s","從剛才這個說的譬喻當中，我們也可感受得到，假定我們在生理上面遭到了病，我們會求醫。現在呢，照著這個方法，在心理上面，如果你也感受得到苦切的這種力量的話，你那時候就會坐立不安。坐立不安幹什麼？一心求解脫。你能夠這樣去，哪有不解脫的道理？所以這個是修行的次第，這個是正確的，這是正確的。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/005.mp3"},{"文":"此復云何，謂諸所化，若於生死自先未發無倒希求解脫之心，«根本斷絕»，彼於解脫云何能導。","口譯":"這是怎麼說呢？就是說：所化的眾生，如果對於生死，自己先沒有生起無顛倒的希求解脫之心，根本就斷絕了，那要怎麼引導他趣向解脫呢？","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68A 12:30","頁":154,"af":"68a","st":750,"et":1069,"消文":[{"文":"所化：世尊要化度的眾生。"},{"文":"對生死的本質不了解，貪著難捨，根本不想求解脫。"},{"文":"修是修解脫，根本不想解脫還教他修，那不是顛倒嗎？所以根本已經斷絕。"},{"類":"例","文":"彼於解脫云何能導：教他不要貪著，他覺得「這是我要的」，聽了生煩惱，越弄越遠。"}],"延伸":[{"題":"根本斷絕","組":[{"題":"先問來此的目的","說":[{"類":"下手","文":"不要說我在修行，先問問：你跑到這裡來，目的幹什麼？要很清楚。"}]},{"題":"宿生善根引入佛門","說":[{"類":"立","文":"今天有機會接觸佛法，都是宿生有善根。"},{"類":"因","文":"異熟、等流、士用：裡邊的因碰見外面的緣，看見出家就歡喜。"}]},{"題":"求解脫的根本因未立","說":[{"類":"因","文":"經過生死流轉迷糊掉了，又與世間染污、無始無明習氣相應。"},{"類":"例","文":"一心嚮往出家、求善知識、念佛，推動的因卻根本沒找到。"},{"類":"立","文":"作主的是無始生死的染心，求解脫的根本還沒建立，這叫根本斷絕。"}]},{"題":"以正知見破染污現行","說":[{"類":"下手","文":"先要有正確知見的認識，經過懺悔，把世俗染污的現行破壞、克服。"},{"類":"回扣","文":"大師外支已成，真正的問題都在自己的障礙當中。"}]}],"說":[{"類":"下手","文":"不要說我在修行，先問問：你跑到這裡來，目的幹什麼？要很清楚。"},{"類":"立","文":"今天有機會接觸佛法，都是宿生有善根。"},{"類":"因","文":"異熟、等流、士用：裡邊的因碰見外面的緣，看見出家就歡喜。"},{"類":"因","文":"經過生死流轉迷糊掉了，又與世間染污、無始無明習氣相應。"},{"類":"例","文":"一心嚮往出家、求善知識、念佛，推動的因卻根本沒找到。"},{"類":"立","文":"作主的是無始生死的染心，求解脫的根本還沒建立，這叫根本斷絕。"},{"類":"下手","文":"先要有正確知見的認識，經過懺悔，把世俗染污的現行破壞、克服。"},{"類":"回扣","文":"大師外支已成，真正的問題都在自己的障礙當中。"}],"af":"68a","st":750}],"逐字稿":[{"t":"68A 12:30","b":[["q","此復云何，謂諸所化，若於生死自先未發無倒希求解脫之心，根本斷絕，彼於解脫云何能導。"],["s","那就是這樣。對於所化的，就世尊要化度的那些眾生，他假定對於這個生死的本質並不了解，貪著難捨，根本不想求解脫，根本不想求解脫，那個時候你教他修，修什麼啊？修是修解脫，現在我根本不想修解脫，你修，那不是顛倒嗎？所以這根本已經斷絕了。諸位啊，這個地方好好地想一想，不要說我在那兒修行，我跑到那兒修行，你先問問：你跑到這裡來目的幹什麼啊？要很清楚、很明白。有一點我們必定要了解的，所有在座的各位，乃至於儘管不出家，今天跟佛法有機會接觸，都是宿生有善根。從前面我們講的業果的道理當中，曉得這個異熟同時有個等流，然後呢還有士用。士用就是外面的客觀的環境，異熟就是我們現在的這個身心的果報，然後呢等流就是心理，心生起的狀態。這個是宿生的善根所集，所以這一世，裡邊的因碰見外面的緣，你看見了出家你就歡喜，就會走上去。"]]},{"t":"68A 14:25","b":[["s","但是他為什麼要這樣走的這個根本的因，經過了這樣的生死的流轉以後，迷糊掉了。再加上出世了以後，前面所接觸的，都是世間染污，而這個染污呢，又是跟我們無始以來所種的這個無明習氣相應。所以以前一直都引發這個東西，所以在非常強有力的，世俗的這種貪染的現行當中，那個時候，對於求解脫這個心一點都沒有。當你接觸了以後，雖然啟發了好樂之心，跑到佛門當中來，但是那個根本本身有沒有？還沒有。這是所以一定第一件事情，要有正確的知見上的認識，經過懺悔，把前面跟世俗染污的這個現行，要把它破壞，還要把它克服。那個時候，他內心當中，引發出來這個認識，那個時候，你會心裡說：啊，要求解脫！"]]},{"t":"68A 15:47","b":[["s","我自己的經驗，以及我遇見很多同修，他就是一心一意，啊！對於出家的嚮往，然後呢要求善知識。儘管出家，儘管求善知識，但是呢，根本因真正找到的非常少。他也想去念佛，覺得念佛好，但是呢他這個推動的因始終不強；實際上與其說始終不強，這個推動的因根本都沒找到，就是這種狀態。就是宿生的這個善業，加上這一生的一個雜染，你糊裡糊塗有這種力量在這個裡頭的，但是呢他抉擇不出來。所謂抉擇不出來的話就是，不是以這個力量為主的，不是以這個力量主的。那麼是哪一個力量主的呢？就是 ─喏，無始生死的染心。現在我們雖然來了以後，對不起，眼睛所看，耳朵所聽，都是世俗上的那種，哎呀，知見上面、習性上面，種種的這些事情。所以說這個，他真正求解脫的根本，對不起，還沒有建立起來，這地方叫「根本斷絕」。"]]},{"t":"68A 17:06","b":[["s","「彼於解脫云何能導」，到那個時候你就引導教他解脫，你怎麼引導他呢？你教他說：「哎呀，不要貪著啊！」他覺得：「這是我要的東西，你教我這個不做、那個不做！」他儘管坐在那裡，心裡聽起來真是生煩惱。啊，你教他這樣做，他就覺得：「哎呀，最好我多睡一會兒覺，最好多做那個 ……。」教他這個不行、那個不行，那是越弄越遠哪，越弄越遠哪！這是我們要正確了解。所以說大師外支已成，真正的問題都在自己這個障礙當中，自己那個障礙當中啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-01/006.mp3"},{"文":"以諸所化無明闇覆，於諸苦性生死圓滿，執為安樂，«顛倒所誑»。","口譯":"因為所化的眾生被無明黑暗所覆蓋，對於本性是苦的生死圓滿（三有盛事），執著為安樂，被顛倒所欺誑。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68A 17:49","頁":154,"af":"68a","st":1069,"et":1235,"消文":[{"文":"被無明癡闇覆障著，看不見事實的真相。"},{"文":"生死輪迴種種都是苦，被它現出的虛誑相所騙，覺得是安樂。"},{"文":"儘管宿生善根讓他跑來，他還是不行，根本原因在這裡。"}],"延伸":[{"題":"顛倒所誑","組":[{"題":"了解此理，一門深入","說":[{"類":"立","文":"正確了解這個，拿到哪一個法門都一心深入，就不起是非諍論。"},{"類":"例","文":"正法時「解脫堅固」，聽見「掃帚」兩個字，就把心裡的煩惱掃乾淨。"}]},{"題":"世智聰辯不相應","說":[{"類":"破","文":"聽了這麼多法，這也不對、那也不對，辨別一大堆，叫世智聰辯。"},{"類":"立","文":"真實淨化了，聰辯是絕端重要的工具。"},{"類":"回扣","文":"差就差在是否為顛倒所誑、無明所覆；第一件事要轉為正知見。"}]}],"說":[{"類":"立","文":"正確了解這個，拿到哪一個法門都一心深入，就不起是非諍論。"},{"類":"例","文":"正法時「解脫堅固」，聽見「掃帚」兩個字，就把心裡的煩惱掃乾淨。"},{"類":"破","文":"聽了這麼多法，這也不對、那也不對，辨別一大堆，叫世智聰辯。"},{"類":"立","文":"真實淨化了，聰辯是絕端重要的工具。"},{"類":"回扣","文":"差就差在是否為顛倒所誑、無明所覆；第一件事要轉為正知見。"}],"af":"68a","st":1142}],"逐字稿":[{"t":"68A 17:49","b":[["q","以諸所化無明闇覆，於諸苦性生死圓滿，執為安樂，顛倒所誑。"],["s","而這一個所化度之機 ─就是我們，這一個狀態當中，仍舊被這個無明癡闇覆障著，看不見事實的真相，看不見事實的真相。明明在生死輪迴當中，種種的這一種事情都是苦的，都是苦的。他把這一個苦的這個特質，現出來這個，在生死輪迴當中虛誑這些相，他被它所騙，覺得這是安樂的，這是安樂的。所以說「執為安樂，顛倒所誑。」你要教他這地方不要這樣，他還覺得：嗯，這個正是我所需要的，你教我不要，那怎麼可能？儘管他宿生的善根，讓他跑到這地方來，他還是不行，這根本原因在這裡。"]]},{"t":"68A 19:02","b":[["s","所以真正修學佛法，第一點你務必要了解這個。當你正確地了解這個，不管你拿到了哪一個法門，你就一心一意地從這個法門當中去深入，就不會大家起是非諍論。所以正法的時候叫作「解脫堅固」，他聽見了一個法，啊！他全部的精神貫注在這裡，乃至於聽見了「掃帚」兩個字，他掃掃、掃掃，然後呢把心裡的煩惱掃乾淨了。現在我們聽見了這麼多的法，哎呀，他偏偏還是說：「唉，這個也不對，那個也不對！」辨別得一大堆，啊，那個時候實在不相應啊！所以這種情況之下，叫作什麼？不幸地，這種叫世智聰辯，這個是我在這個地方，我們特別應該了解的。反過來，如果說你能夠真實地淨化了，這個對我們是絕端重要的一個工具，絕端重要的一個工具。差就差在什麼？喏，一點點 ─是不是為顛倒所誑？是不是為無明所覆？所以第一件事，要把這個不正確的認識轉變為正知見。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/007.mp3"},{"文":"如《四百論》云：「此大苦海中，悉無諸邊岸，愚人沉此中，云何不生畏。」","口譯":"如《四百論》說：「這個大苦海中，完全沒有邊際與岸，愚人沈溺在其中，怎麼不生起怖畏呢？」","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"光是認識痛苦，想從痛苦中脫離是不夠的，必須要尋找苦因才是。這也是為什麼佛在宣說四聖諦的時候，不是以四聖諦的生起次第而說，而是以思惟四聖諦的模式，以現觀生起次第而說，即先說苦後說集，次說滅再說道。尚未生起脫離生死的希求心，對滅諦沒有希求，怎麼可能走上道諦？這是不可能的。所以雖然以因果生起次第來講，先有道諦，後有滅諦，可是以思惟模式來講，佛陀先說了滅諦，對滅諦生起了歡喜心，才會想要去學道。如果對現有的輪迴安樂深感喜足，怎麼會想要獲得解脫？那是不可能的。如《四百論》所說：「此大苦海中，悉無諸邊岸，愚人沉此中，云何不生畏？」所以必須先說凡是被業和煩惱所轉的一切都是苦性，沒有真正的安樂。透過苦諦的解說，真正認識痛苦，才會產生厭離，這就是為何先說苦諦的原因。看到痛苦才會產生厭離心，才會去尋求苦因。","涵蓋":[7,10],"校":"輪回→輪迴、雲何→云何"}],"時":"68A 20:35","頁":154,"af":"68a","st":1235,"et":1264,"消文":[{"文":"生死輪迴的大苦海，沒有邊、沒有底。"},{"文":"愚癡的人在裡邊一點都不怕，何等愚癡。"}],"延伸":[],"逐字稿":[{"t":"68A 20:35","b":[["q","如《四百論》云：「此大苦海中，悉無諸邊岸，愚人沉此中，云何不生畏。」"],["s","這一個生死輪迴的大苦海，既沒有邊、又沒有底啊，愚癡的人在這個裡邊哪，一點都不怕。哎呀，怎麼不怕，這個人是何等地愚癡呀！所以"]]}],"口譯音":"口譯音檔/siwei-kudi-01/008.mp3"},{"文":"先須為說«此實是苦»，非有安樂，","口譯":"所以先必須為他說明：這實在是苦，並沒有安樂，","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68A 21:04","頁":154,"af":"68a","st":1264,"et":1372,"消文":[{"文":"先必定要告訴他：這是苦，不是安樂。"}],"延伸":[{"題":"此實是苦","組":[{"題":"戒的根本由此建立","說":[{"類":"立","文":"先有苦集滅道的次第，修道時第一步才是持戒，戒的根本從這上面建立。"},{"類":"破","文":"這個把握不住，請問你持的戒持些什麼？為什麼跑到這裡來？"}]},{"題":"觀身不淨，觀受是苦","說":[{"類":"立","文":"三十七道品第一的四念處，也是講這個。"},{"類":"喻","文":"身體不淨，像大便一樣臭，你一看見就厭惡。"},{"類":"立","文":"種種快樂告訴你是苦，必然如此，沒有一處不是。"}]}],"說":[{"類":"立","文":"先有苦集滅道的次第，修道時第一步才是持戒，戒的根本從這上面建立。"},{"類":"破","文":"這個把握不住，請問你持的戒持些什麼？為什麼跑到這裡來？"},{"類":"立","文":"三十七道品第一的四念處，也是講這個。"},{"類":"喻","文":"身體不淨，像大便一樣臭，你一看見就厭惡。"},{"類":"立","文":"種種快樂告訴你是苦，必然如此，沒有一處不是。"}],"af":"68a","st":1264}],"逐字稿":[{"t":"68A 21:04","b":[["q","先須為說此實是苦，非有安樂，"],["s","所以先必定要告訴他：這個是苦啊，這不是安樂啊！佛拿這個告訴我們。那麼這個時候，我們應該第一個了解是了解這一點，所以不管我們現在學什麼，這是真正重要的，真正重要的啊！就是說，雖然說出家，大家說：「哎呀，出家五年哪，先要依止阿闍黎，知道開、遮、持、犯。」要曉得為什麼立這個戒，為什麼守那個戒，這你必定要知道。佛一定說苦、集、滅、道，因為你有這個次第，然後你去修道，修道的時候第一步才是持戒。所以這個戒的根本，還在從這個上面建立起來，必然我們要知道的。如果你這個把握不住的，請問你持的戒，你持些什麼？你為什麼跑到這裡來？這不是很明白的一個事情。"]]},{"t":"68A 22:08","b":[["s","所以三十七道品當中，第一個四念處，也是講這個。「觀身不淨、觀受是苦」，這第一個。平常我們最難放得下的就是這個身體，就難放得下的就是眼前的種種的貪著。所以告訴你：這個身體，不像你想像真實啊！不淨，像大便一樣地臭，你會愛護嗎？啊，你一看見你就厭惡！然後你種種的快樂，說告訴你這是苦啊！是必然如此的，沒有一個地方不是如此的，這是我們應該了解的。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/009.mp3"},{"文":"說多苦相令起厭離，是故於初先說苦諦。","口譯":"從多方面說明苦的行相，令他生起厭離，所以最初先說苦諦。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68A 22:52","頁":154,"af":"68a","st":1372,"et":1415,"消文":[{"文":"多方面、種種善巧說明，目的只有一個：引起厭離心。"},{"文":"苦諦正確認識了，下面都有了，這是根本；沒有的話，都在走遠路。"}],"延伸":[],"逐字稿":[{"t":"68A 22:52","b":[["q","說多苦相令起厭離，是故於初先說苦諦。"],["s","不但一方面，多方面的、種種方面地善巧說明，目的一個 ─引起厭離心，所以先說苦諦。現在我們真正修行沒有別的，也必定要從這個上面，你把苦諦如果正確地認識，下面都有了，這是根本。如果這個沒有的話，那對不起，下面都在這兒走遠路，都在走遠路啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-01/010.mp3"},{"文":"此後自見墮於苦海，則於苦海欲求脫離，便見其苦必須滅除。","口譯":"這之後，他自己看見墮在苦海中，就會想從苦海中脫離，便看到這個苦必須要滅除。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68A 23:35","頁":154,"af":"68a","st":1415,"et":1432,"消文":[{"文":"了解了苦，就要求解脫，生起滅苦之心。"}],"延伸":[],"逐字稿":[{"t":"68A 23:35","b":[["q","此後自見墮於苦海，則於苦海欲求脫離，便見其苦必須滅除。"],["s","因為你了解了這個苦，所以你要求解脫，所以這個時候，你要求滅苦之心。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/011.mp3"},{"文":"此復了知，未止其因苦終不滅，便念其因復為何等，由此始能了知集諦，是故«集諦於苦後說»。","口譯":"接著又了解：不止息苦的因，苦終究不會滅，便想苦的因又是什麼，由此才能了知集諦，所以集諦在苦諦之後說。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"在瞭解集諦的時候，要瞭解一切的痛苦是由業和煩惱所生。煩惱和業二者，真正讓我們造業的是煩惱。墮入輪迴的業是來自煩惱。煩惱的根本來自於哪裡？仔細地去尋找才會知道：原來一切都是由自性執著所產生，把所見的一切都執取為如同所見到般地真實，覺得一切都是從它那邊而有。產生貪、瞋的原因是，我們看到悅意境時，會覺得悅意境是從它那邊而有，是以自力形成了悅意的作用，我們會如此地看到，並且如此地執著。由對悅意境的真實執著產生了對悅意境的貪，由對不悅意境的真實執著產生了對不悅意境的瞋。當我們尋找煩惱來源，思考煩惱的根本是否可以斷除，就會從實際的情況去尋找，即悅意境與不悅意境是否有自性？是否真實存在？當透過法義深入地瞭解到諸法究竟的存在並非如所見般地真實，我們才相信，原來讓我痛苦的真正原因是，無始以來到現在，我都未了知空性、沒有看清實相，於是就會深信透過現證空性能斷除一切煩惱的根本，之後才會相信滅諦的功德，並誓願去證得。所以在集諦之後宣說滅諦。","涵蓋":[11,13],"校":"輪回→輪迴"}],"時":"68A 23:52","頁":154,"af":"68a","st":1432,"et":1584,"消文":[{"文":"苦是果，要消除果，必定要從因地上解決。"},{"文":"進一步找苦的因，就是集諦。"},{"文":"找到集諦就努力克服這個因，滅、道二諦跟著來，戒定慧三學自然如法修持。"}],"延伸":[{"題":"集諦於苦後說","組":[{"題":"學問再大也無用","說":[{"類":"破","文":"講戒頭頭是道，四分、五分、十誦律樣樣弄通，做大學問家，流轉生死一點用場都沒有。"}]},{"題":"把握根本，一句佛號亦足","說":[{"類":"例","文":"周利槃陀伽只懂得兩個字，都可以解決這個問題。"},{"類":"立","文":"只有一句阿彌陀佛，照樣可以了脫生死。"},{"類":"回扣","文":"這個根本第一要把握住，所以集諦在後說。"}]}],"說":[{"類":"破","文":"講戒頭頭是道，四分、五分、十誦律樣樣弄通，做大學問家，流轉生死一點用場都沒有。"},{"類":"例","文":"周利槃陀伽只懂得兩個字，都可以解決這個問題。"},{"類":"立","文":"只有一句阿彌陀佛，照樣可以了脫生死。"},{"類":"回扣","文":"這個根本第一要把握住，所以集諦在後說。"}],"af":"68a","st":1518}],"逐字稿":[{"t":"68A 23:52","b":[["q","此復了知，未止其因苦終不滅，便念其因復為何等，由此始能了知集諦，是故集諦於苦後說。"],["s","喏，這個來了！哦，因為你要想除掉那個苦，除掉那個苦，那麼這個苦怎麼來的呢？你了解這個苦是果，真正要把那個果消除掉了，必定要從因地上面解決。那麼這個現在的苦果的因在哪裡呢？那個時候你進一步找那個苦的因，這個集諦。所以由於苦的認識，然後呢策發我們求解脫的心，從苦當中解脫出來。因為要求這個心，所以一發了這個心，所以找：苦從哪裡來的呀？那個時候，你就會努力去找，那麼然後去找。當你這個時候你找到了集諦的話，你就努力會克服這個因，那個時候，它滅、道二諦就跟著來了。由於這樣，所以戒定慧的三學自然你如法修持。"]]},{"t":"68A 25:18","b":[["s","否則的話，儘管你說講戒，講得這麼頭頭是道，哎呀，不要說單單我們中國的四分律，五分律、十誦律，你樣樣弄通，你做個大學問家，說不定你戴各式各樣的博士的方帽，一點用場都沒有！流轉生死當中，弄得不好還說不定還要墮落，這個是我們必定要知道的，必定要知道的。反之，你就算這些東西，不要說每一個部都通，像周利槃陀伽一樣，只懂得兩個字，你都可以解決這個問題。現在有更巧妙的方法，他周利槃陀伽還要證了羅漢果了，現在也不要，羅漢果都不要，你就想到什麼都不知道，我只有一句阿彌陀佛了，欸，你照樣可以了脫生死，這個是我們必定要了解的。這個根本，現在第一要把握得住啊！所以他是為什麼集諦在後說。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/012.mp3"},{"文":"次知生死眾苦，皆由有漏業生，其業復由煩惱發起，煩惱根本是為我執，便知集諦。","口譯":"接著了知生死的眾苦，都是由有漏業所生，業又是由煩惱所發起，煩惱的根本是我執，這樣便了知了集諦。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68A 26:24","頁":154,"af":"68a","st":1584,"et":1615,"消文":[{"文":"一步一步追根究底：生死的苦是有漏業，業是煩惱所起，煩惱的根本是我執。"},{"文":"這時就了解了集諦真正的行相。"}],"延伸":[],"逐字稿":[{"t":"68A 26:24","b":[["q","次知生死眾苦，皆由有漏業生，其業復由煩惱發起，煩惱根本是為我執，便知集諦。"],["s","一步一步地，從這個上頭追根究底地找到：哎呀，生死的苦是有漏的業，業又是煩惱所起，那麼煩惱的根本是我執，那個時候你把集諦的真正的行相了解了。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/013.mp3"},{"文":"若見我執亦能止滅，«誓願»現證滅苦之滅，故於集後宣說滅諦。","口譯":"如果看到連我執也能夠斷除，就會發願要親自證得「苦完全止息」的境界，所以講完集諦之後，接著講滅諦。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68A 26:55","頁":154,"af":"68a","st":1615,"et":1694,"消文":[{"文":"我執不是天生的，是虛妄顛倒的，可以淨化、消滅。"},{"文":"原來一切痛苦的根本在這裡，一定要想辦法去掉它。"}],"延伸":[{"題":"誓願","組":[{"題":"誓是必定要達到的願","說":[{"類":"立","文":"不但願，「誓」是必定要達到的願。"},{"類":"破","文":"浮浮泛泛「我也想啊」，想了半天還坐在這裡。"}]},{"題":"打起全部精神修行","說":[{"類":"立","文":"修行不是有氣無力，是打起全部精神，心裡是這樣的狀態。"},{"類":"例","文":"那些大祖師們就是這個樣子。"},{"類":"回扣","文":"所以集諦後面宣說滅諦。"}]}],"說":[{"類":"立","文":"不但願，「誓」是必定要達到的願。"},{"類":"破","文":"浮浮泛泛「我也想啊」，想了半天還坐在這裡。"},{"類":"立","文":"修行不是有氣無力，是打起全部精神，心裡是這樣的狀態。"},{"類":"例","文":"那些大祖師們就是這個樣子。"},{"類":"回扣","文":"所以集諦後面宣說滅諦。"}],"af":"68a","st":1615}],"逐字稿":[{"t":"68A 26:55","b":[["q","若見我執亦能止滅，誓願現證滅苦之滅，故於集後宣說滅諦。"],["s","你了解了這個，緊跟著見到：噢！原來這個我執這個東西，不是天生的，而卻是虛妄顛倒的，這個東西，你可以把它淨化、消滅。所以那個時候你想：啊，原來一切痛苦的根本在這裡啊！那那個時候你一定要想辦法，去把它去掉它，所以是「誓願」，不但願，「誓」是什麼？就是你必定要達到的這個願。不是我們浮浮泛泛：哎呀，我也想啊！雖然你也想，你還是弄得想了半天，坐在這個地方。他那個誓不是 ─我一定要做到它！你站起來全部精神去幹，當然，這個是指我們的心裡的這種狀態。所以這個修行不是什麼浮浮泛泛、有氣無力，不是的！修行是打起全部精神來，就這樣，心裡是這樣狀態。因為有這種心理，所以做任何事情的時候，那必然如此。你看那些大祖師們，他就是這樣，就是這個樣。所以那個時候，他集諦後面宣說滅諦。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/014.mp3"},{"文":"若爾開示苦諦之後，即於解脫發生希求，苦諦之後應說滅諦。","口譯":"有人會問：照這樣說，講完苦諦，人就已經想要解脫了，那苦諦之後應該直接講滅諦才對啊？","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"有人說：開示了苦諦之後，因為對苦諦發起厭離心、對解脫產生希求心，所以應該在苦諦之後說滅諦。宗喀巴大師答：雖然看到痛苦，想從痛苦當中獲得脫離，可是如果不知道痛苦的原因，那麼想要脫離痛苦的心是不切實際的。先看到痛苦，接著尋求苦因，再去確認這個苦因是不是可以斷除，應如此思惟才有邏輯。而不是一看到痛苦就說：「哇！好苦！我想要脫離。」這樣的厭離苦、希求解脫的心是無法堅定的，只是一種發願、一種祈求而已。當我們深信解脫、深信滅諦時，絕對會想透過某種方法獲得解脫，於是趨向道諦，是故道諦最後宣說。如《相續本母》所說，一個病人首先要知道自己有病，才會去找醫生，希望醫生幫他找病因，如果他自己都覺得沒有病，他也不會去找醫生。若要從病苦中脫離，必須先知道自己真的罹患某種疾病，之後才去斷病因，追求遠離疾病的安樂。為了得到遠離疾病的安樂，必須透過藥物消除自己的疾病。知道苦諦如同知病，斷除集諦如同斷除病因，所以說知苦斷集。如同想要得到遠離疾病的安樂，所以佛說了證滅；如同療病須依於藥，所以佛說了修道。","涵蓋":[14,17]}],"時":"68A 28:14","頁":154,"af":"68a","st":1694,"et":1709,"消文":[{"文":"照這樣說，說了苦諦就要求解脫，應該講滅諦，為什麼又說集諦？"}],"延伸":[],"逐字稿":[{"t":"68A 28:14","b":[["q","若爾開示苦諦之後，即於解脫發生希求，苦諦之後應說滅諦。"],["s","照你這樣說的話，那麼說了苦諦以後應該 ……你要求解脫嘛，就講滅諦啊，為什麼又說集諦呢？"]]}],"口譯音":"口譯音檔/siwei-kudi-01/015.mp3"},{"文":"答云，無過，爾時雖有欲解脫心，欣得寂滅眾苦之滅，然猶未明眾苦之因，未見其因定能遮止，故於解脫，不能定執為所應得，定當證滅。","口譯":"答：沒有過失。那時雖然有想解脫的心，欣求得到寂滅眾苦的滅，但還不明白眾苦的因，沒看到那個因一定能被遮止，所以對於解脫，還不能確定地執持為自己所應得、一定能證得的滅。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68A 28:29","頁":154,"af":"68a","st":1709,"et":null,"消文":[{"文":"答：沒有錯。"},{"文":"滅就是息滅一切痛苦；那時雖想求解脫，但不了解苦的因。"},{"文":"不曉得這個因是不是一定能去掉，就不能確定做不做得到，所以不先講滅。"}],"延伸":[],"逐字稿":[{"t":"68A 28:29","b":[["q","答云，無過，"],["s","他說：沒有錯的。為什麼呀？"]]},{"t":"68A 28:33","b":[["q","爾時雖有欲解脫心，欣得寂滅眾苦之滅，然猶未明眾苦之因，未見其因定能遮止，故於解脫，不能定執為所應得，定當證滅。"],["s","是的，那個時候，雖然你要想求解脫，希望把一切的苦得到靜息 ─所以這滅就是息滅一切的痛苦 ─但是你並不了解那個苦的因，不曉得這個因是不是一定能夠遮止，換句話說，一定能夠去掉。所以這個時候你不能確定，是不是能夠做得到，是不是能夠達到你息滅一切痛苦的這一個狀態，所以說這個時候不先講滅。"]]},{"t":"68A 29:36","b":[["q","如是若執定當證滅，定當解脫，便念何為趣解脫道，趣向道諦，是故道諦最後宣說。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/016.mp3"},{"文":"如是若執定當證滅，定當解脫，便念何為趣解脫道，趣向道諦，«是故道諦最後宣說»。","口譯":"像這樣，若確定一定能證得滅、一定能解脫，便會想：什麼是趣向解脫的道？於是趣向道諦，所以道諦最後宣說。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68B 00:03","頁":155,"af":"68b","st":3,"et":106,"消文":[{"文":"找到苦的因原來可以止息，就一心要止息。"},{"文":"止息有一定的方法，叫作「道」。"},{"文":"修道時才講戒定慧三學，不是世間五花八門、理工醫農那一套。"}],"延伸":[{"題":"道諦最後宣說","組":[{"題":"依次第學，學到哪受用到哪","說":[{"類":"立","文":"照這個次第來，心就跟它相應，步步深入，學到哪裡受用到哪裡。"},{"類":"破","文":"否則一直在煩惱中轉；修一點善法也被雜染所染，永遠流轉生死。"}]}],"說":[{"類":"立","文":"照這個次第來，心就跟它相應，步步深入，學到哪裡受用到哪裡。"},{"類":"破","文":"否則一直在煩惱中轉；修一點善法也被雜染所染，永遠流轉生死。"}],"af":"68b","st":56}],"逐字稿":[{"t":"68B 00:03","b":[["q","如是若執定當證滅，定當解脫，便念何為趣解脫道，趣向道諦，是故道諦最後宣說。"],["s","現在照著次第，說首先了解了苦，那麼由於苦了找到了苦的因，而找到苦的因在這地方，原來可以止息的，那個時候你就想：啊！那我一心也要止息。但是你要止息怎麼做法呢？原來有它止息的一定的方法，那個叫作「道」。由於這樣地追求到道，那麼講道，就修道的時候，那個時候才講戒定慧三學。而不是世間的五花八門，而不是世間的小學、中學、大學，而不是世間的所謂理工醫農、士農工商，這套東西就完全用不上。有它這樣的必然的次第。"]]},{"t":"68B 00:56","b":[["s","所以你照著這個次第來的話，自然你的心裡面就跟它相應，然後就步步深入，你學到哪裡受用到哪裡。要不然你學到哪裡，自己一直在煩惱當中轉，所以這個都是雜染之法。儘管你修一點善法，是難免為雜染所染，所以始終啊 ……。現在我們就是這個狀態，因為你修了一點法，所以它有一點跟法相應的這個善報，但是這個東西雜染的，始終這個善，唉呀，跟著很多煩惱、痛苦，而結果永遠流轉生死，它基本原因就在這裡。所以在這裡，我們一定第一個要把握得住。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/017.mp3"},{"文":"如是亦如《相續本母》云：「如病應知斷病因，當得樂住應依藥，苦因彼滅如是道，«應知應斷應證修»。」","口譯":"這也就像《相續本母》說的：「好比生病，要先認識病，要除掉生病的原因，想要恢復健康就要靠吃藥；苦、苦的原因、苦的止息、通往止息的道路也是這樣：苦要認識，苦因要斷除，苦的止息要親證，道路要修行。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68B 01:46","頁":155,"af":"68b","st":106,"et":250,"消文":[{"文":"生了病，要感受病苦，要曉得病因、斷除病因，再找藥、依藥。"},{"文":"苦而找到苦因是集諦，見到因可以消滅是滅諦，如何滅是道諦。"},{"文":"苦應知，集應斷，滅應證，道應修。"}],"延伸":[{"題":"應知應斷應證修","組":[{"題":"三轉四諦十二法輪","說":[{"類":"立","文":"苦應知，集應斷，滅應證，道應修，就是世尊三轉四諦十二法輪。"}]},{"題":"大小乘不離四諦","說":[{"類":"立","文":"所有大小乘的基本內容就是這個，佛法離開四諦就沒有了。"},{"類":"立","文":"只管自己是小乘，了解透徹是緣覺，推廣到一切有情是佛菩薩。"}]}],"說":[{"類":"立","文":"苦應知，集應斷，滅應證，道應修，就是世尊三轉四諦十二法輪。"},{"類":"立","文":"所有大小乘的基本內容就是這個，佛法離開四諦就沒有了。"},{"類":"立","文":"只管自己是小乘，了解透徹是緣覺，推廣到一切有情是佛菩薩。"}],"af":"68b","st":189}],"逐字稿":[{"t":"68B 01:46","b":[["q","如是亦如《相續本母》云：「如病應知斷病因，當得樂住應依藥，苦因彼滅如是道，應知應斷應證修。」"],["s","現在就比喻，就像生了病，那麼要感受到這個病的痛苦，那麼要曉得你這個病原因從哪裡啊？要曉得斷除病的因，那麼要求這個斷病，那麼那個時候要找藥，那個時候才依這個藥。這個同樣地，所以這個苦，由於苦而跟著找到苦的因 ─集諦；然後呢是從因上面，見到這個因可以消滅 ─滅諦；然後呢，如何滅是道諦。這個是我們真正「此苦汝應知」啊，然後呢應斷、應修，這個。這個是集，是你應斷哪！然後呢這個是滅，你應證哪！要想證那個滅諦，該怎麼辦呢？要修這個道啊！"]]},{"t":"68B 03:09","b":[["s","所以世尊三轉四諦十二法輪，就是這個樣。第一：這個苦，你應該知道啊！為什麼苦？有它的原因，這個原因你應該斷。然後呢斷了就證得這個滅諦，這個才是你真正需要的。要想證得滅諦怎麼辦呢？修這個道，就這樣。這個就是世尊所以說這個次第，所有的大小乘基本的內容，就是這個！就這個，沒有、再也沒有別的了！佛法離開了四諦就沒有了，只是把四諦的層次深廣不同 ─只管你自己，那就是小乘；如果說你把這個道理，深刻一點地了解透徹一點是緣覺；推廣到一切有情，就是佛菩薩，如此！"]]}],"口譯音":"口譯音檔/siwei-kudi-01/018.mp3"},{"文":"如是四諦，大小乘中皆數宣說，是為善逝總攝生死流轉，生死還滅諸扼要處。","口譯":"這樣的四諦，大乘、小乘的經典裡都一再地講，因為它是佛把「怎樣流轉生死、怎樣從生死出離」的關鍵全部收攝在一起的地方。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"佛說四聖諦的時候，不只說了「此是苦諦，此是集諦，此是滅諦，此是道諦」。佛也說了「知苦、斷集、證滅、修道」。四聖諦的內容非常重要，是佛教的精神所在。《現觀莊嚴論》的第二品和第四品多次說到四聖諦的內涵。","涵蓋":[18,19]},{"類":"整段","文":"下部論師認為，煩惱的根本是補特伽羅獨立之實體有的我執。但中觀應成派認為，煩惱的根本來自於自性我執。若以下部的說法去修學，只能壓伏粗分的煩惱，細微的煩惱仍然存在。為什麼能壓伏粗分煩惱呢？因為由補特伽羅獨立之實體有的執著所產生的煩惱，可以透過補特伽羅獨立之實體空的認知來壓伏。然而補特伽羅獨立之實體空的認知無法損害細微的自性執著所產生的煩惱，因為透過補特伽羅獨立之實體空的認知並不能認知自性空，所以自性執著仍然存在。因為由自性執著所帶來的煩惱仍然存在，所以還是沒有辦法獲得解脫。","涵蓋":[18,22]}],"時":"68B 04:10","頁":155,"af":"68b","st":250,"et":300,"消文":[{"文":"「數」是到處，整個大小乘佛法所說的就是這個。"},{"文":"生死流轉還滅的最綱要都在這裡，一切經典都依這個綱要深細說明。"}],"延伸":[],"逐字稿":[{"t":"68B 04:10","b":[["q","如是四諦，大小乘中皆數宣說，是為善逝總攝生死流轉，生死還滅諸扼要處。"],["s","所以說，這個四諦，大乘小乘當中都要數數 ─這個「數」是到處，整個的大小乘佛法所說的，就是這個。所以佛把生死流轉還滅的最綱要，都在這個地方，所有的一切經典都是根據這個綱要，深細地來說明。有很多呢把整個的四個都說，有很多呢偏重於某一方面，乃至於越深越細。佛經沒有一個例外，都是這樣。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/019.mp3"},{"文":"故修解脫極為切要，亦是修行大嗢柁南，故須如是次第引導學者。","口譯":"所以四諦對修解脫來說非常要緊，也是整個修行的總綱，因此一定要照這個次第帶領學法的人。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68B 05:00","頁":155,"af":"68b","st":300,"et":401,"消文":[{"文":"對真正修解脫的，這是最最重要的。"},{"文":"嗢柁南是綱宗扼要，通常譯為偈；四聖諦也叫四法嗢柁南。"},{"文":"整個修行的綱要就是這個，所以用這個次第引導；本論的美也在這裡。"}],"延伸":[],"逐字稿":[{"t":"68B 05:00","b":[["q","故修解脫極為切要，亦是修行大嗢柁南，故須如是次第引導學者。"],["s","所以，對於真正修解脫的，這個是最最重要的，這個真的最重要的。也是修行的 ─「嗢柁南」這個地方是指綱要，綱宗扼要。通常嗢陀南我們可以翻成功一個「偈」，偈子，所以前面說完了，那個偈子總結起來。換句話說，整個修行的綱要，就是這個！整個修行的綱要，就是這個。平常我們除了這個嗢柁南說這個偈子以外，就是四聖諦也叫四法嗢柁南，哪個四法？那就是苦、集、滅、道，就是這樣。乃至於三法印，它也叫三個 ─哦，不是，不是苦、集、滅、道，這個「諸行無常」，這個「諸法無我」 ……就是四法印，就是這個四法印，換句話說那是綱要，整個佛法的。所以這個修行的整個的綱要，所以用這個次第引導。也可以說完整的佛法就是這樣，所以本論的美也在這個地方。那麼下面呢，再把這個話說一下，這個是策勵我們的。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/020.mp3"},{"文":"若未真實思惟苦諦，厭捨生死，則求解脫亦唯虛言，«隨其所作悉成集諦»。","口譯":"如果沒有真正去思考苦諦，打從心裡厭倦、想捨離生死，那說要求解脫只是一句空話；不管做什麼，都只會變成再受苦的原因。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"不認識苦諦，卻說要追求解脫，那只是口頭上說說而已，並不是真正知道解脫是什麼。如果沒有思惟集諦，善加瞭解業和煩惱、生死根本等，那簡直如同沒有看清目標就亂發箭。這樣會有什麼危險？就是真正修行的根本被斷截了。有人說：要毫無作意，一切的作意都是煩惱、都是無明，一切的痛苦是來自於執著，所以所有的執著都必須斷除。如此，善惡都不分了，這種情況就是「斷截正道扼要」。四聖諦就是針對善惡兩者而說了染汙的因果二諦及清淨的因果二諦，善惡、染汙清淨都不分，就沒有四聖諦可言。若對集諦認知不夠，修行就會勞而無果，再怎麼努力修學都無用。","涵蓋":[20,21],"校":"亂髮箭→亂發箭"}],"時":"68B 06:41","頁":155,"af":"68b","st":401,"et":658,"消文":[{"文":"對苦諦沒有正確認識，或認識了沒有如理思惟、生起相應的量，內心還在世間雜染中現行。"},{"文":"那時貪著生死，不是厭捨生死，求解脫都是空話。"},{"文":"不管做什麼還是集諦，集諦就是流轉生死。"}],"延伸":[{"題":"隨其所作悉成集諦","組":[{"題":"忘失菩提心，是名魔業","說":[{"類":"立","文":"更深一層說：「忘失菩提心，修諸善法，是名魔業。」也就是這個。"},{"類":"因","文":"修學的根本目的一旦忘失，做什麼都是集諦，把你拖在生死當中。"}]},{"題":"道理要在內心找到相應","說":[{"類":"立","文":"用功不只是追求學問、文字，要在內心找到相應的意義，策發對生死的恐怖厭患。"},{"類":"破","文":"一類人只在文字上推敲。"},{"類":"破","文":"一類人覺得這裡生活滿好，吃好睡好，講起來頭頭是道，總不相應。"}]},{"題":"思惟以破現法雜染","說":[{"類":"下手","文":"不但知道，還要去思惟，把跟現法雜染相應的現行破壞，如法的心就生起來。"},{"類":"回扣","文":"若未真實思惟苦諦，就不能厭捨生死，做什麼都是集諦。"}]}],"說":[{"類":"立","文":"更深一層說：「忘失菩提心，修諸善法，是名魔業。」也就是這個。"},{"類":"因","文":"修學的根本目的一旦忘失，做什麼都是集諦，把你拖在生死當中。"},{"類":"立","文":"用功不只是追求學問、文字，要在內心找到相應的意義，策發對生死的恐怖厭患。"},{"類":"破","文":"一類人只在文字上推敲。"},{"類":"破","文":"一類人覺得這裡生活滿好，吃好睡好，講起來頭頭是道，總不相應。"},{"類":"下手","文":"不但知道，還要去思惟，把跟現法雜染相應的現行破壞，如法的心就生起來。"},{"類":"回扣","文":"若未真實思惟苦諦，就不能厭捨生死，做什麼都是集諦。"}],"af":"68b","st":401}],"逐字稿":[{"t":"68B 06:41","b":[["q","若未真實思惟苦諦，厭捨生死，則求解脫亦唯虛言，隨其所作悉成集諦。"],["s","所以假定你對苦諦沒有正確的認識，以及認識雖然認識了，沒有如理思惟，生起相應的量，那個時候我們的內心還是在現法，世間的一切上面這種雜染當中現行。那個時候貪著生死，不是厭捨生死，這個時候，所謂求解脫都是空話，都是虛話。在家人固然談不到，出家啦，更在這個地方浪費自己啊！更是浪費自己啊！所以它「隨其所作」，不管你做什麼，你還是集諦，集諦是什麼？流轉生死。在小乘這樣說 ─不是，不是說小乘，在基本上面這樣說。如果我們更深一層、更圓滿一點說的話，另外一句話說：「忘失菩提心，修諸善法，是名魔業。」也就是這個。你修學的根本目的何在？這個菩提心。這個地方就是什麼？求解脫這個心。如果你一旦忘失掉了，那你做什麼事情都是集諦，集諦是什麼？魔是什麼？就是專門把你拖在生死當中的。所以現在這個地方呢，不管我們做什麼學問，這個一定要了解的。"]]},{"t":"68B 08:34","b":[["s","最近在座大部分同學，我看了非常歡喜，非常讚歎，為什麼？大家很用功。但是注意哦！這個用功不僅僅是追求一點學問，也不是追求文字，說：啊，現在了解了！你必定要把了解的道理，要在內心上面找到相應的意義；換句話說，這個道理所指的是什麼。那個時候策發我們對眼前生死的恐怖厭患，由於這個而推動我們努力如理去追求。否則的話呢，你一定會在這個文字上面推敲，文字上面推敲，這是一類。另外一類呢，儘管在這裡，哎呀！覺得這個地方的生活真是滿好，也不要跑得去忙，反正早晨稍微早一點起來，上一個殿，到那個時候吃起來，哎唷，人家樣樣送得來的。啊，那是講究口味，真是！吃完了以後一個大覺睡得個好，什麼都不要做。那個時候，講起來，喔唷，等下還要頭頭是道，意見很多，總不相應啊！總不相應，原因在這個地方，這一點是我們必定要知道的啊！"]]},{"t":"68B 10:00","b":[["s","所以這句話，好好地再讓我們自己提醒我們一下：「若未真實思惟苦諦」，你沒有真實地思惟的話，就不能「厭捨生死」。不但知道，知道了還要去思惟，這個情況就是，把跟現法雜染相應的現行破壞了，那個時候如法的心生起來，那一定會對於我們眼前那個會產生厭惡。那個時候你一心求解脫，那個時候對了，你做的事情都為求解脫而忙。否則的話，你心裡面不管做些什麼、想些什麼，都是集諦。進一步："]]}],"口譯音":"口譯音檔/siwei-kudi-01/021.mp3"},{"文":"若未思集，善知惑業生死根本，«猶如射箭未見鵠的»，是即斷截正道扼要，遂於非脫三有之道妄執為是，勞而無果。","口譯":"如果沒有思惟集諦，善巧了知惑與業是生死的根本，就好像射箭沒看見箭靶，這就斷截了正道的扼要，於是把不能脫離三有的道錯執為是，徒勞而沒有結果。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68B 10:58","頁":155,"af":"68b","st":658,"et":867,"消文":[{"文":"苦的根本是惑、業兩樣：無明與行，是生死的根本。"},{"文":"善知：不是講時懂、講完糊塗，也不是寫成論文只在書本上。"},{"文":"斷截正道扼要：道路本身已經斷掉了。"},{"文":"妄執為是、勞而無果：以為在修道，其實修錯了，忙了半天沒有果。"}],"延伸":[{"題":"猶如射箭未見鵠的","組":[{"題":"無的放矢","說":[{"類":"喻","文":"射箭沒看見靶子，無的放矢，你射些什麼？"}]},{"題":"自問為何而修","說":[{"類":"例","文":"拜佛、念經、早晚課、研究學問、寫文章、學戒、學定，你為什麼？"},{"類":"破","文":"學定為了身體好，看人持戒覺得好看，完全不相應。"},{"類":"下手","文":"最好自己問問自己：為什麼要做？"},{"類":"回扣","文":"「勞而無果」，論上都給了最佳指導。"}]}],"說":[{"類":"喻","文":"射箭沒看見靶子，無的放矢，你射些什麼？"},{"類":"例","文":"拜佛、念經、早晚課、研究學問、寫文章、學戒、學定，你為什麼？"},{"類":"破","文":"學定為了身體好，看人持戒覺得好看，完全不相應。"},{"類":"下手","文":"最好自己問問自己：為什麼要做？"},{"類":"回扣","文":"「勞而無果」，論上都給了最佳指導。"}],"af":"68b","st":725}],"逐字稿":[{"t":"68B 10:58","b":[["q","若未思集，善知惑業生死根本，猶如射箭未見鵠的，是即斷截正道扼要，遂於非脫三有之道妄執為是，勞而無果。"],["s","更進一步，那麼說你現在了解了這個苦的特質，所以進一步要脫苦。那麼苦的根本在哪裡呢？原來是兩個東西：惑、業，就是無明、行兩樣東西，那個是生死的根本。假定你這個生死的根本不知道，或者雖然知道了又不善巧，說並不是馬馬虎虎知道，講的時候懂，等到講完了，自己腦筋裡糊塗一片，這個沒有用。或者你雖然能夠講給別人聽，講完了這個道理所指的，指的什麼？在書本上面。「我的論文得到了一個大博士！」但是它所指的內心的心理行相是什麼？兩回事情，那個沒有用。"]]},{"t":"68B 12:05","b":[["s","這個像什麼？射箭一樣，你射箭的靶子在哪裡你沒看見。請問你射箭，靶子沒看見，你無的放矢，人家說。什麼叫「無的放矢」？你沒目的，那個射箭，你射些什麼啊？就是這樣。我們現在修道，你修些什麼啊？這個就很清楚了。你拜佛，你為什麼要拜佛？你念經，你為什麼要念經？你作早課、作晚課，然後你研究學問，然後你寫文章，然後你學戒律，然後你學定，你為什麼啊？現在有很多人，「哎呀，我要學學定。」你為什麼學定？說實在他也不知道！覺得學定滿好，啊！修了定身體好的，學了什麼的 ……那完全不相應，這完全不相應啊！然後學戒，「喔唷，人家這個戒，你看這樣！」是，它對我們有引發的功效，這是我們宿生善根相應，但是他為什麼要這樣做？這個都是射箭哪，他沒有找到那目的啊！"]]},{"t":"68B 13:17","b":[["s","所以那個時候，正道的扼要切斷掉了，換句話說，你這個道路本身已經斷掉了。這個時候你忙的是什麼？「遂於非脫三有之道妄執為是，勞而無果。」那時候你修的道也不對，你修錯了，你忙了個半天，你以為在修道呀，但是，因為你修道的目的像射箭一樣，射箭要射到那個紅心、那個靶子，你這個靶子也沒有看見，你射了個半天，沒有果啊！修道的目的是要解脫生死的根本，生死的根本在哪裡你不知道，你修了半天。所以現在很多人哪，喔唷，天天去拜佛，忙著去拜佛，有很多人天天要念多少佛，有很多人讀多少經，還要寫論文，還要記這個、又要記那個，你為什麼要做呀？最好自己問問自己。這個地方都給了我們最佳指導啊！「勞而無果」，告訴我們。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/022.mp3"},{"文":"若未能知應斷之苦集，則亦不明靜苦之解脫，故欲求解脫，«亦唯增上慢»耳。","口譯":"如果不能了知應斷的苦與集，也就不明白息滅苦的解脫，所以想求解脫，也只是增上慢而已。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"「若未能知應斷之苦集，則亦不明靜苦之解脫」，對苦諦、集諦的認識不足，所獲得的果當然也有限，它只能暫時壓伏煩惱，無法傷害煩惱的根本。所以不瞭解苦諦、集諦，卻說追求解脫，其實都是我慢在作祟。因為認識苦諦、集諦很重要的緣故，接下來就詳細解說苦諦、集諦。"}],"時":"68B 14:27","頁":155,"af":"68b","st":867,"et":1051,"消文":[{"文":"應斷的苦、集沒有把握清楚，下面都沒有用。"},{"文":"從苦、集追根究底，才找到脫苦集的方法，就是解脫之道。"},{"文":"不了解之前，所謂修行最多只是增上慢；慢已經不好，還要增上。"}],"延伸":[{"題":"亦唯增上慢","組":[{"題":"看不見值得學習的","說":[{"類":"破","文":"這也瞧不起、那也瞧不起，看不到一個值得學習的。"}]},{"題":"懂了則處處感激","說":[{"類":"例","文":"聽見「阿彌陀佛」四個字已經夠了，牢牢抱著，感激得不得了。"},{"類":"立","文":"解脫的煩惱越多，功德越多，越感激人家，沒有是非之心。"}]},{"題":"弄清次第，所作皆淨","說":[{"類":"下手","文":"先把為什麼這樣建立的次第弄清楚，照著做，每一步會推動你上去。"},{"類":"立","文":"一心擺在這裡，造的業都是淨業，不是集諦所攝。"},{"類":"回扣","文":"先說苦諦的理由在此；下面接著「正修苦」。"}]}],"說":[{"類":"破","文":"這也瞧不起、那也瞧不起，看不到一個值得學習的。"},{"類":"例","文":"聽見「阿彌陀佛」四個字已經夠了，牢牢抱著，感激得不得了。"},{"類":"立","文":"解脫的煩惱越多，功德越多，越感激人家，沒有是非之心。"},{"類":"下手","文":"先把為什麼這樣建立的次第弄清楚，照著做，每一步會推動你上去。"},{"類":"立","文":"一心擺在這裡，造的業都是淨業，不是集諦所攝。"},{"類":"回扣","文":"先說苦諦的理由在此；下面接著「正修苦」。"}],"af":"68b","st":867}],"逐字稿":[{"t":"68B 14:27","b":[["q","若未能知應斷之苦集，則亦不明靜苦之解脫，故欲求解脫，亦唯增上慢耳。"],["s","所以如果一開始的時候，「應斷的苦集」兩樣東西，你沒有把握得清楚的話，對不起，下面都沒有用，「則亦不明靜苦之解脫」啊！這個必定是從苦、集兩樣東西上面，追根究底才找到正脫苦集的這個方法，然後這個就是解脫之道。所以不了解之前，我們所謂的修行，最多也只是「增上慢」哪！增上慢，慢已經不好還要增上。這是為什麼我們現在修學佛法很容易：唉，這個也瞧不起，那個也瞧不起，看不見、看不到一個可以值得學習的。假定真正懂了以後，聽見「阿彌陀佛」四個字已經夠了，牢牢地抱著它，自己拼命都來不及，不管任何人，「阿彌陀佛，他提供了這個四個字讓我念佛，我感激得不得了啊！」他是與非，你管他幹什麼？這不是很簡單的道理！當然你更進一步的話，你更進一步解脫的煩惱越多，增長的功德是越多。所以自然而然，你越會感激人家都來不及，你哪裡有一點對這種是非之心。"]]},{"t":"68B 16:20","b":[["s","所以在這個地方先告訴我們，說：哦，佛原來一定有這樣的重要的關鍵問題啊！所以說這個地方先說苦諦的理由在此，在這地方我們現在可以了解了。所以大家不要忙著說，哎呀，你要去修行啊！你一定要把它為什麼這樣建立的次第，你弄得很清楚，了解了然後照著去做，那個時候你很清楚、很明白，每一步一點不錯，它會推動你上去。因為這個力量，所以找到了你修行的方法的話，你一心一意全部擺在這個地方去做，不管你做什麼，那個不是集諦所攝，你造的任何業都是淨業。既然你造的業都是淨業，哪有不透脫生死輪迴的道理。由於這樣的次第認識了，下面就告訴我們「正修苦」，那個時候正式地修行那個苦諦了。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/023.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-01/001.webp","n":1},{"img":"投影片/siwei-kudi-01/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/siwei-kudi-01/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/siwei-kudi-01/004.webp","n":4},{"img":"投影片/siwei-kudi-01/005.webp","n":5},{"img":"投影片/siwei-kudi-01/006.webp","n":6},{"img":"投影片/siwei-kudi-01/007.webp","n":7},{"img":"投影片/siwei-kudi-01/008.webp","n":8,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=68a&st1=345&et1=750","box":[0.128625,0.3002222222222222,0.1315,0.06622222222222222]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-01/009.webp","n":9},{"img":"投影片/siwei-kudi-01/010.webp","n":10},{"img":"投影片/siwei-kudi-01/011.webp","n":11,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=68a&st1=750&et1=1069","box":[0.519875,0.25577777777777777,0.10900000000000001,0.064]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/siwei-kudi-01/012.webp","n":12},{"img":"投影片/siwei-kudi-01/013.webp","n":13},{"img":"投影片/siwei-kudi-01/014.webp","n":14,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=68a&st1=1069&et1=1372","box":[0.123625,0.3591111111111111,0.1265,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-01/015.webp","n":15},{"img":"投影片/siwei-kudi-01/016.webp","n":16},{"img":"投影片/siwei-kudi-0 webp","n":39},{"img":"投影片/siwei-kudi-01/037.webp","n":42,"yt":"E1qFpq1i0fY"},{"img":"投影片/siwei-kudi-01/038.webp","n":43}],"投影片PDF":"投影片/siwei-kudi-01/slides.pdf","音檔範圍":"68A 05:45～68B 17:31"},"siwei-kudi-02":{"id":"siwei-kudi-02","標題":"思惟苦諦(2)","根":"思惟八苦","科判焦點":"丑一 思惟八苦","課本範圍":"P155 L8 ~ P157 L7","堂數":87,"日期":"2026/11/10","分圖":[{"名":"標八苦・修法總則","原文":[0,9]},{"名":"引經證成・止觀","原文":[10,16]},{"名":"生苦五相","原文":[17,24]}],"跨科判":null,"週":110,"班級":"24秋007","序":null,"音檔":{"68b":{"local":"音檔/gl1/068B.mp3","remote":"https://lamrim.xyz/player/media/gl1/068B.mp3"},"69a":{"local":"音檔/gl1/069A.mp3","remote":"https://lamrim.xyz/player/media/gl1/069A.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=68b&st1=1051&af2=69a&et2=1601","段":[{"文":"第二正修苦分二：一思惟生死總苦，二思惟別苦。初中分三：一思惟八苦，二思惟六苦，三思惟三苦。今初","口譯":"第二部分，正式修苦諦，分兩點：一、思考生死整體的苦；二、分別思考各道的苦。第一點又分三小點：一、思考八苦；二、思考六苦；三、思考三苦。下面先講第一小點。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68B 17:31","頁":155,"af":"68b","st":1051,"et":1088,"消文":[{"文":"先把苦的總相說明一下，第二個別地說。"},{"文":"總相當中，平常常聽見說「八苦交煎」，一個一個來看。"}],"延伸":[],"逐字稿":[{"t":"68B 17:31","b":[["q","第二正修苦分二：一思惟生死總苦，二思惟別苦。"],["s","把這個苦的總相，說明一下。第二呢？個別地說。"]]},{"t":"68B 17:52","b":[["q","初中分三：一思惟八苦，二思惟六苦，三思惟三苦。　今初"],["s","那麼先說那個總相，總相當中平常我們常常聽見說「八苦交煎」，乃至於下面的，我們一個一個來看。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/001.mp3"},{"文":"如《親友書》云：「仁和應厭於生死，欲乏死病及老等，無量眾苦出生處。」應如是修。","口譯":"就像《親友書》說的：「仁和（龍樹菩薩對國王的敬稱）啊，你應該厭倦生死，因為求不到想要的、死、病、老等等，無數的苦都是從生死裡生出來的。」就應該這樣去修。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68B 18:08","頁":155,"af":"68b","st":1088,"et":1143,"消文":[{"文":"對三有生死輪迴的內涵，應該認識而生起厭惡。"},{"文":"這裡快樂一點都沒有，想要的都得不到；死、病、老，各式痛苦都從這裡來。"},{"文":"應如是修：這是我們應該認識、應該這樣去修的。"}],"延伸":[],"逐字稿":[{"t":"68B 18:08","b":[["q","如《親友書》云：「仁和應厭於生死，欲乏死病及老等，無量眾苦出生處。」應如是修。"],["s","所以菩薩呀！這個你應該了解，去生起厭患的啊！對於這個三有生死輪迴這個內涵，你應該認識而生起的厭惡。要曉得這個裡邊快樂是一點都沒有，你要想的東西都得不到，恰恰相反的是什麼？死、病、老，各式各樣的痛苦都從這個地方來的，這是我們應該認識，應該這樣去修的。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/002.mp3"},{"文":"此中修習厭生死者，謂思惟彼是眾苦根源。苦者，謂已顯說欲乏等四，等字攝四，共為八種。此八種苦，是薄伽梵於多經中，明苦諦時«數所宣說»。","口譯":"這裡所說修習厭離生死，就是思惟生死是眾苦的根源。所說的苦，是已明白說出的欲乏等四種，「等」字又攝四種，共為八種。這八種苦，是薄伽梵在許多經中，說明苦諦時一再宣說的。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"「等字攝四，共為八種」，在此「等」字包含其他四苦，即怨憎會苦、愛別離苦、所欲求不得苦、取蘊總為苦（五取蘊苦）。八苦，即生、老、病、死四苦加上「等」字所攝四苦。八苦中最主要的就是生、死二苦。佛在解釋苦諦的時候，數數說到了這八苦。"}],"時":"68B 19:03","頁":155,"af":"68b","st":1143,"et":1232,"消文":[{"文":"欲乏：欲樂缺乏，沒有好的，沒有好的就是壞的。"},{"文":"等字包含生老病死，共分八個項目。"},{"文":"這八項，世尊在很多經典中不斷地告訴我們。"}],"延伸":[{"題":"數所宣說","組":[{"題":"多方策勵，觸動內心","說":[{"類":"因","文":"為什麼不斷地講？用多方面的策勵，總有一點觸動你的心。"}]},{"題":"於相應處把握努力","說":[{"類":"下手","文":"那裡看到跟你相應了，就拼命在那裡把握住、去努力。"},{"類":"破","文":"稍微看一看就說沒勁；只在外面轉，暇滿人身就浪費掉了。"}]}],"說":[{"類":"因","文":"為什麼不斷地講？用多方面的策勵，總有一點觸動你的心。"},{"類":"下手","文":"那裡看到跟你相應了，就拼命在那裡把握住、去努力。"},{"類":"破","文":"稍微看一看就說沒勁；只在外面轉，暇滿人身就浪費掉了。"}],"af":"68b","st":1143}],"逐字稿":[{"t":"68B 19:03","b":[["q","此中修習厭生死者，謂思惟彼是眾苦根源。苦者，謂已顯說欲乏等四，等字攝四，共為八種。此八種苦，是薄伽梵於多經中，明苦諦時數所宣說。"],["s","前面告訴我們苦啊，就是說明了什麼？「欲乏」，就是欲樂缺乏，沒有好的，沒有好的那就是壞的嘛！「等」，這個等字包涵了下面，生老病死。那麼現在共分八個項目。這八個項目，世尊在很多經典當中，不斷、不斷地告訴我們。他為什麼要不斷、不斷告訴我們哪？用多方面的策勵，總有一點一下觸動你的心，然後你從這地方拼命進入、努力，就行了，就行了。現在我們也是這樣，所以不要說稍微看一看，哎呀，看了沒有勁，你要努力去看。那裡看到了跟你相應了，那你就拼命在這地方把握住，去努力，那個時候就有機會，就有機會。否則只是在這外面轉，好可惜啊，就把這個暇滿的人身就浪費掉了啦！"]]}],"口譯音":"口譯音檔/siwei-kudi-02/003.mp3"},{"文":"修共中士一切所緣法類，如共下時所說共法，此亦應取。","口譯":"修和中士共通的所有觀修內容時，前面講下士時說過的那些共通的修法，這裡也要拿來用。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"修共中士道法義時，與共下士道共同修學的法類也要取來修習。不是說我現在學到中士道了，先前的內容就不用去修習了。為了生起出離心，仍要思惟依止善知識、暇滿義大、念死無常等內容，尤其要思惟歸依三寶和業果。至於在共下士道時沒有說到，只有在共中士道時說到的不共法類，具有智慧的人，不只對宗喀巴大師在此做的解說、總結進行觀修，對於宗喀巴大師引用的經文也都應該去思惟。如果做不到這樣，對於所引用的經文這部分可以先暫時擱置，但是對於主要的內容還是要反復地去思惟。","涵蓋":[3,6]},{"類":"整段","文":"一切的功德都來自於止觀。觀修就是反復思惟法義，止修就是讓自己的內心安住在先前思惟的法義上面。讓自己的內心儘量生起強烈的覺受，如果覺受有點變弱了，就再反復地思惟法義，再次地提升覺受。提升覺受後，暫時不要思惟，讓內心安住在這種覺受上。如此，止、觀兩者互相地雙運，以這種方式來學習。","涵蓋":[3,16]}],"時":"68B 20:32","頁":155,"af":"68b","st":1232,"et":1266,"消文":[{"文":"開始修中士了；中士跟下士是次第相關地向上進步。"},{"文":"共下士的法這裡還要取來修，等到堅固了再走上去。"}],"延伸":[],"逐字稿":[{"t":"68B 20:32","b":[["q","修共中士一切所緣法類，如共下時所說共法，此亦應取。"],["s","那麼，現在我們這個地方開始修中士了。說這個中士跟前面的下士，是次第相關地向上進步。所以前面共下士的，這個地方還是應該取來修習，等到這個堅固了，然後呢走上去。所以："]]}],"口譯音":"口譯音檔/siwei-kudi-02/004.mp3"},{"文":"諸不共之修事，若有慧力，如下所寫皆當善修。","口譯":"各種不共的修事，如果有慧力，對以下所寫的都應善加修習。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68B 21:06","頁":155,"af":"68b","st":1266,"et":1311,"消文":[{"文":"不共指中士道：目的在上的是共，只求下的則對下不共。"},{"文":"前面基礎修好了，有慧力就照下面所說的修。"},{"文":"換句話說：力量不夠，暫時不必忙，先把基礎弄好。"}],"延伸":[],"逐字稿":[{"t":"68B 21:06","b":[["q","諸不共之修事，若有慧力，如下所寫皆當善修。"],["s","那麼，不共呢？就是指中士道，這個中士道對這個下士來說，不共的。有很多人他的目的在上，那麼是共同的；有很多人目的只求下，所以對下是不共的。所以假定他把前面那個基礎修好了，進一步修上面這個，那麼那個時候，如果有慧力的時候，那麼照著下面的所做。換句話說這個地方告訴我們什麼？如果你的力量不夠，暫時不必忙，先把基礎弄好。所以說："]]}],"口譯音":"口譯音檔/siwei-kudi-02/005.mp3"},{"文":"若慧劣弱，可暫捨置所引教文，","口譯":"如果慧力薄弱，可以暫時放下所引的經論文句，","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68B 21:51","頁":156,"af":"68b","st":1311,"et":1326,"消文":[{"文":"力量不夠的話，暫時不要先忙下面深入的。"}],"延伸":[],"逐字稿":[{"t":"68B 21:51","b":[["q","若慧劣弱，可暫捨置所引教文，"],["s","如果你的力量不夠的話，暫時不要先忙，忙下面深入的。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/006.mp3"},{"文":"唯當修習«應時義體»。","口譯":"只修眼前這個時候該修、用得上的那些重點就好。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68B 22:06","頁":156,"af":"68b","st":1326,"et":1550,"消文":[{"文":"修習跟我們相應的、合宜的，步步踏實地深入。"}],"延伸":[{"題":"應時義體","組":[{"題":"同行依論轉心的行相","說":[{"類":"例","文":"愛講道理的同修說：「我已經錯了，我感到真高興！」轉過來得到功德。"}]},{"題":"先認清自己的程度","說":[{"類":"立","文":"進佛門一定要了解兩件事：目的何在，習氣是什麼。"},{"類":"因","文":"宿生習氣使我們進佛門，來了幹什麼卻弄不清楚；六祖聞一句即相應，畢竟少數。"}]},{"題":"先把握根本因","說":[{"類":"破","文":"弄不清楚時，千萬不要說：哪裡有大法去求。"},{"類":"立","文":"先把握根本因，進一步才是圓滿因。"},{"類":"喻","文":"做生意先要了解賺不賺錢；虧本生意拼命做，越做越虧本。"}]},{"題":"慧以對治煩惱為特質","說":[{"類":"立","文":"慧的特質是對治煩惱：認識了才能對治，才能解脫生死。"},{"類":"破","文":"否則拋棄世間跑到這裡來，不顛倒了嗎？"},{"類":"回扣","文":"慧力比較差的話，應該修習應時義體。"}]}],"說":[{"類":"例","文":"愛講道理的同修說：「我已經錯了，我感到真高興！」轉過來得到功德。"},{"類":"立","文":"進佛門一定要了解兩件事：目的何在，習氣是什麼。"},{"類":"因","文":"宿生習氣使我們進佛門，來了幹什麼卻弄不清楚；六祖聞一句即相應，畢竟少數。"},{"類":"破","文":"弄不清楚時，千萬不要說：哪裡有大法去求。"},{"類":"立","文":"先把握根本因，進一步才是圓滿因。"},{"類":"喻","文":"做生意先要了解賺不賺錢；虧本生意拼命做，越做越虧本。"},{"類":"立","文":"慧的特質是對治煩惱：認識了才能對治，才能解脫生死。"},{"類":"破","文":"否則拋棄世間跑到這裡來，不顛倒了嗎？"},{"類":"回扣","文":"慧力比較差的話，應該修習應時義體。"}],"af":"68b","st":1326}],"逐字稿":[{"t":"68B 22:06","b":[["q","唯當修習應時義體。"],["s","就是應該修習跟我們相應的、合宜的這個。我們總要步步踏實，這樣深入，這個是它最重要的！那麼照著這個次第上來，就步步地。所以我剛才說，我們懺悔有人見效，然後呢，讀了文有人見效，最近有好幾位同學。以前哪就有一位同修，他常常歡喜講道理，最近他認識了，他常常說：「哎呀，我已經錯了，我感到真高興！」我實在讚歎，我實在感謝！因為什麼呢？我們大家共同研究，他轉過來了，他得到功德，然後呢我也沾了他的光，我一天當中為了他歡喜，啊，我覺得真歡喜啊！"]]},{"t":"68B 23:06","b":[["s","這個法，所以我這個地方特別說明：你們一定要了解，一定要了解什麼？兩件事情。哪兩件事情？這個目的何在，還有習氣是什麼。我們因為宿生的習氣所使，因為宿生的習氣所使，所以自然而然又跑到佛門當中來。但是剛才說過了，雖然來是來了，來了目的幹什麼？一下的的確確弄不清楚的，這個倒是千真萬確的事實。極少數的大根性的人，他很快相應，譬如六祖大師，哦，他聽見了人家唸一句《金剛經》，行了，就這樣。可是這種人畢竟少數。我們大部分人哪，是，你看見這個廟很歡喜，你只是歡喜而已，這已經很難得了，你肯出家已經更不容易了。但是呢，畢竟我們在這個習氣當中。"]]},{"t":"68B 24:07","b":[["s","所以現在眼前進來的第一件事情，你一定要把這個，如果說弄不清楚的話，千萬不要說：哎呀，哪裡有大法去求啊，哪一個什麼好啊！不是的。說主要的它的根本在什麼地方把握住，根本因，進一步是圓滿因；根本因，然後是圓滿因。就像你賺錢一樣，你先要了解你做這個生意賺錢、不賺錢，賺錢的，然後再談那個生意做下去。所以你弄不清楚，明明這個虧本生意，你拼命地做，越做啊是越虧本哪！這是我們要了解的。所以實際上，他前面告訴我們，說：如果說自己的慧的力量比較差的話，那麼應該修習應時體義。慧的特質是什麼？慧的特質是對治煩惱。你必定要認識這個東西，你才談得到對它對治，對治了煩惱，才能夠解脫生死，這個才是我們進入佛門當中修行的特質。否則的話，你把世間的事情拋棄掉了，跑到這地方來，你不顛倒了嗎？你忙這些事情幹什麼？這是我們應該了解的。所以繼續。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/007.mp3"},{"文":"此等雖是思擇而修，然除應修諸所緣外，餘善不善無記等上，«悉不應散»。","口譯":"這些雖然是一邊思考一邊觀察的修法，但除了正在觀修的內容之外，不管是善的、惡的、還是不善不惡的事，心都不可以跑去那裡。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"在思惟這些法義時，要遠離散亂，專注在法義上。與法義無關的，無論是善、惡、無記，都不應該去思惟。內心不要往外攀緣，往外攀緣容易產生散亂，沒有辦法專注。當內心沒有散亂時，也要避免沉沒及昏沉等，不要思惟到一半，又隨著沉沒而轉。思惟法義時，要讓內心非常有活力，漸次修習。","涵蓋":[7,9]}],"時":"68B 25:50","頁":156,"af":"68b","st":1550,"et":1719,"消文":[{"文":"思擇：為何不講聞？前面是善知識指導聽聞，現在如所聽聞的正理來思惟。"},{"文":"應修諸所緣：上課要聽，早晚課隨文作觀念誦。"},{"文":"除此以外一切時，善、不善、無記上都不應散亂。"}],"延伸":[{"題":"悉不應散","組":[{"題":"不散方能對治不善","說":[{"類":"因","文":"不善、無記怎麼也不散亂？不善的更不能散亂！不散亂才曉得是不善而對治。"},{"類":"破","文":"不善現起時一散亂，修了半天是白忙，抵銷掉了。"}]},{"題":"一切時處不放鬆","說":[{"類":"立","文":"正修時一時一刻不放鬆，出去散步聊天也不會走歪路。"},{"類":"喻","文":"坐了沒味道出去散心，涼亭一坐三個鐘頭還嫌不夠；看書難得十分二十分。"},{"類":"立","文":"別小看這裡，我們的毛病、關鍵都在這上頭。"}]}],"說":[{"類":"因","文":"不善、無記怎麼也不散亂？不善的更不能散亂！不散亂才曉得是不善而對治。"},{"類":"破","文":"不善現起時一散亂，修了半天是白忙，抵銷掉了。"},{"類":"立","文":"正修時一時一刻不放鬆，出去散步聊天也不會走歪路。"},{"類":"喻","文":"坐了沒味道出去散心，涼亭一坐三個鐘頭還嫌不夠；看書難得十分二十分。"},{"類":"立","文":"別小看這裡，我們的毛病、關鍵都在這上頭。"}],"af":"68b","st":1550}],"逐字稿":[{"t":"68B 25:50","b":[["q","此等雖是思擇而修，然除應修諸所緣外，餘善不善無記等上，悉不應散。"],["s","了解了這一點，那麼我們緊跟著下去。說這些，是的，修這些都要什麼，「思擇」。他為什麼不講聞呢？因為前面告訴我們，什麼？這是善知識指導正確的內容，讓我們學習聽聞；從這裡我們現在開始的是，如所聽聞的正理而來思惟啊！所以說「雖是思擇而修」。但是除了我們「應修諸所緣外」 ─這個很重要哦！就是說，我們現在上課的時候要聽，作早晚課的時候要隨文作觀念誦，然後呢，除此以外，「餘善不善無記等上，悉不應散」。在除了這個時間以外，一切時間上頭，不管是善的、不善的、無記等上，都不應該散亂。你說：欸，善的嘛不要散亂，不善的、無記上面怎麼不散亂哪？善的固然是不要散亂，不善的是更不能散亂哪！因為你不散亂，所以你曉得：哎喲，不善的。曉得了不善的，然後你對治。如果不善的現起，你一散亂，你修了個半天，是白忙啊，然後呢抵銷掉了。懂不懂這個道理？"]]},{"t":"68B 27:39","b":[["s","所以你正式修的時候，一時一刻都不能放鬆，這個你必定要自己把握得住，那樣的話你才會認真地去修習。就算到那時候你出去散一下步，就算是聊一下天，你也不會走歪路。要不然的話，啊，你就算用功在這兒坐了一下，坐了就沒味道，然後跑出去想散散心，看見幾個人坐在涼亭裡，「哎呀，找到機會了！」然後就坐下來，啊！高高興興。在那裡看書，難得看它十分、二十分；這一坐啊，坐三個鐘頭，還嫌不夠，為什麼原因？就是這個。所以他這個地方你別小看哪，好像沒有深刻的道理，實際上真正的我們毛病、關鍵都在這個上頭啊！這是我們應該了解的！這是我們必定應該了解的。所以說："]]}],"口譯音":"口譯音檔/siwei-kudi-02/008.mp3"},{"文":"當於所緣遮心掉等，亦莫令隨昏睡沈沒增上而轉，","口譯":"應當在所緣上遮止內心的掉舉等，也不要讓心隨著昏睡、沈沒的增上力而轉，","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68B 28:39","頁":156,"af":"68b","st":1719,"et":1766,"消文":[{"文":"能識的心緣所緣，不如法的話要遮止它。"},{"文":"掉：跟散亂、貪相應的；等：包括其他不相應的。"},{"文":"向上揚是掉舉，掉完向下沈是昏沈，都是輪迴因。"}],"延伸":[],"逐字稿":[{"t":"68B 28:39","b":[["q","當於所緣遮心掉等，"],["s","所以我們在任何一切時候，我們這個心 ─在識心當中，一定有一個能識的心，去識所識的對象、所緣的。這個對這個所緣的，如果不如法的話，要遮止它。「掉等」，「等」字包括了不相應的，「掉」就是跟散亂、貪相應的這種。"]]},{"t":"68B 29:10","b":[["q","亦莫令隨昏睡沈沒增上而轉，"],["s","向上揚的時候嘛，掉舉，然後呢掉完了以後，向下沈的時候是昏沈，那個都是輪迴因。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/009.mp3"},{"文":"當令其識極為明淨，漸次修習。","口譯":"要讓心保持得非常清楚、非常乾淨，一步一步慢慢修。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"68B 29:26","頁":156,"af":"68b","st":1766,"et":null,"消文":[{"文":"一切時處心要明跟淨：跟善淨之法相應，而且很明。"},{"文":"稍微一點輕昏狀態，已經不對了。"},{"文":"依這個目標，慢慢地一步一步深入相應。"}],"延伸":[],"逐字稿":[{"t":"68B 29:26","b":[["q","當令其識極為明淨，漸次修習。"],["s","一切時處，要使我們的心情兩個現象：明跟淨。淨是清淨的，一定是跟善淨之法，而且這個善淨之法很明。"]]},{"t":"69A 00:05","b":[["s","有的時候稍微一點輕昏狀態，已經不對了，一定要明淨。這個是目標，然後呢，我們慢慢、慢慢地根據了這個認識的目標，慢慢、慢慢地修習，想辦法一步一步地深入相應。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/010.mp3"},{"文":"《入行論》云：「雖長夜修行，念誦苦行等，若心散亂修，佛說無義利。」此說一切«散亂善行»，其果微少。","口譯":"《入行論》說：「雖然長時修行，念誦、苦行等等，如果以散亂心來修，佛說沒有義利。」這是說一切散亂的善行，它的果報很微少。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69A 00:24","頁":156,"af":"69a","st":24,"et":154,"消文":[{"文":"長時修行、念誦、苦行，心散亂就沒有多大利益。"},{"文":"要怎麼辦？照前面說的，令其識明淨。"},{"文":"散亂善行，得到的果非常少。"}],"延伸":[{"題":"散亂善行","組":[{"題":"身具德相，心要明淨","說":[{"類":"立","文":"回想前面：修行要靠人身，還要最圓滿的德相，具足戒乃至菩薩戒。"},{"類":"立","文":"心裡也要明跟淨，身心相應，才真正應得上佛說的戒。"}]},{"題":"以自淨其意為戒中心","說":[{"類":"立","文":"戒總括三句：以「自淨其意」為中心，形之身口「諸惡莫作，眾善奉行」。"},{"類":"立","文":"然後進入定慧，這是必定不能動的道理。"}]}],"說":[{"類":"立","文":"回想前面：修行要靠人身，還要最圓滿的德相，具足戒乃至菩薩戒。"},{"類":"立","文":"心裡也要明跟淨，身心相應，才真正應得上佛說的戒。"},{"類":"立","文":"戒總括三句：以「自淨其意」為中心，形之身口「諸惡莫作，眾善奉行」。"},{"類":"立","文":"然後進入定慧，這是必定不能動的道理。"}],"af":"69a","st":70}],"逐字稿":[{"t":"69A 00:24","b":[["q","《入行論》云：「雖長夜修行，念誦苦行等，若心散亂修，佛說無義利。」此說一切散亂善行，其果微少。"],["s","喏！引論上面告訴我們。雖然你長時候地修行，念誦、苦行等等，這個各方面的，但是你的心如果散亂的話，這樣也沒有多大的利益。要怎麼辦呢？就是照前面說的，令其識明淨，這樣的。「此說一切散亂善行，其果微少」，他得到的果非常少、非常少。"]]},{"t":"69A 01:10","b":[["s","說到這裡我們也同時可以回想一下，所以前面說，我們修行雖然是要靠人身，就是得到了人身還要最圓滿的德相。所以外面的身一定要選這樣的，說六道當中只有人道，人道當中還要這樣的圓滿的德相。不是一般的在家，不是受五戒、八關齋戒，乃至於沙彌，要具足戒，而且在具足戒上面，還要受菩薩戒等等。然後呢，心裡邊是要什麼狀態？也要身心一一相應，明跟淨，那個時候才真正應得上佛告訴我們的戒。佛講的戒，總括起來就這麼三句 ─以「自淨其意」作為它的中心，然後呢，由於這個心體上面，形之於身口是「諸惡莫作，眾善奉行」！然後進入定慧，這個是必定不能動的一個道理。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/011.mp3"},{"文":"又《修信大乘經》云：「善男子由此異門，說諸菩薩，隨其所有信解大乘，大乘出生，當知一切，皆是由其不散亂心，正思法義之所出生。」","口譯":"《修信大乘經》又說：「善男子，從這個角度來說，菩薩們對大乘的所有信心和理解，以及大乘功德的生起，你要知道，全都是從心不散亂、正確地思考法的文句和道理而產生的。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69A 02:34","頁":156,"af":"69a","st":154,"et":225,"消文":[{"文":"前面是論，這裡是經。異門：各方面不同的種種門。"},{"文":"信解大乘：由認識啟發信心，增長見解，如法行持。"},{"文":"大乘功德從開始到圓滿，都從不散亂心正思法義出生。"}],"延伸":[],"逐字稿":[{"t":"69A 02:34","b":[["q","又《修信大乘經》云：「善男子由此異門，說諸菩薩，隨其所有信解大乘，大乘出生，當知一切，皆是由其不散亂心，正思法義之所出生。」"],["s","前面是論，那個地方是經，也告訴我們，由於上面所說的這個道理，各式、各方面，「異門」是各方面不同的種種門當中說。修、修大乘的，「信解大乘」就是初步的信，由如何認識，啟發信心，然後呢，深入增長見解，如法行持。一切大乘的功德，從開始到圓滿出生，都從這個地方，什麼？「不散亂心」，那個不散亂心幹什麼？用這個心「正思法義」。是，前面所說的，我們現在的一切時處，不管是善、不善、無記等上，不要令它餘散，都安住在這個上頭。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/012.mp3"},{"文":"此中不散亂心者，謂除善所緣，不向餘散，«法及義»者謂文及義。","口譯":"這裡所說的不散亂心，是指除了善所緣之外，心不向其他地方散亂；法和義，是指文和義。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69A 03:45","頁":156,"af":"69a","st":225,"et":293,"消文":[{"文":"「那麼就是這個」：師父併在上一句講，沒有另外解。"}],"延伸":[{"題":"法及義","組":[{"題":"未治煩惱，學法無用","說":[{"類":"破","文":"來了還滿好，心裡面卻煩煩惱惱。"},{"類":"立","文":"佛法真正的中心就是對治煩惱。"},{"類":"破","文":"不能對治煩惱，就是跟著佛身邊也沒有用。"}]},{"題":"淨除煩惱為唯一目的","說":[{"類":"立","文":"我們所學的只有一個目的：淨除煩惱，這是根本。"},{"類":"回扣","文":"不散亂、正思法義，法的特質就是指這個。"}]}],"說":[{"類":"破","文":"來了還滿好，心裡面卻煩煩惱惱。"},{"類":"立","文":"佛法真正的中心就是對治煩惱。"},{"類":"破","文":"不能對治煩惱，就是跟著佛身邊也沒有用。"},{"類":"立","文":"我們所學的只有一個目的：淨除煩惱，這是根本。"},{"類":"回扣","文":"不散亂、正思法義，法的特質就是指這個。"}],"af":"69a","st":225}],"逐字稿":[{"t":"69A 03:45","b":[["q","此中不散亂心者，謂除善所緣，不向餘散，法及義者謂文及義。"],["s","那麼就是這個。這個道理，我們只要自己內心上面，一觀察就很容易了解。現在很多人來了，大家覺得：哎呀，來是來了還滿好，心裡面就是煩煩惱惱啊！那時候你要清楚喔！修學佛法沒有別的，佛法的真正的中心就是對治煩惱，就是對治煩惱。如果說你不能對治煩惱的話，在任何地方，就是跟著佛身邊也沒有用！就是跟著佛身邊也沒有用，這是我們千真萬確必定要認識的。我們所有學的東西，只有一個目的，什麼？淨除煩惱，如此，因為這是根本嘛！所以不散亂，正思法義，法的特質指的是什麼？就是指這個，這是我們應該了解的。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/013.mp3"},{"文":"正思惟者，謂以觀慧觀察思擇，由此顯示隨修一切功德之法，皆須此二。","口譯":"「正思惟」，是指用能觀察的智慧去仔細觀察、分辨。這就說明：不管修哪一種功德，都少不了「心不散亂」和「正確觀察」這兩樣。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69A 04:53","頁":156,"af":"69a","st":293,"et":339,"消文":[{"文":"正思惟：如法地、一點不錯地思惟。"},{"文":"觀慧觀察思擇：以智慧觀察、抉擇，不是糊里糊塗的。"},{"文":"一切功德，都由不散亂的心正思惟而來。"}],"延伸":[],"逐字稿":[{"t":"69A 04:53","b":[["q","正思惟者，謂以觀慧觀察思擇，由此顯示隨修一切功德之法，皆須此二。"],["s","那麼然後呢，你照著他的「正思惟」，如法地、一點不錯地思惟。那麼這個思惟什麼？就是以觀察的慧，就是我們的心裡面觀察、抉擇。這不是糊裡糊塗的喔！這個慧就是智慧，去觀察、去思惟、去抉擇。從這個地方說，一切的功德都這樣來的，都這樣才來的，以不散亂的心去正思惟，然後深入。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/014.mp3"},{"文":"故說引發三乘一切功德，皆須二事，一除善所緣心不餘散，專一而住真奢摩他«或其隨順»。二善觀察善所緣境，如所有性盡所有性，毘缽舍那或其隨順。","口譯":"所以說，要生起聲聞、獨覺、菩薩三乘的一切功德，都需要兩件事：第一，心只放在善的對象上，不往別處跑，專一安住，這是真正的「止」（奢摩他），或是接近止的狀態；第二，好好觀察善的對象，看清它的真實本性和它所有的面向，這是真正的「觀」（毘缽舍那），或是接近觀的狀態。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"三乘一切功德產生的根本有二：一是遠離一切散亂的奢摩他，或隨順奢摩他。修九住心但尚未獲得奢摩他之前，是隨順奢摩他，它的作用與奢摩他相似，就是內心沒有散亂，安住在境上。二是毗缽舍那，或隨順毗缽舍那。「此中若無真實止觀及隨順二」，這句話如果不加「隨順」二字，就要說三乘一切的善法都要由真實止觀生起，但這是不一定的。以入大乘之門的菩提心來講，一旦生起自然任運的菩提心，就獲得大乘資糧道。生起菩提心不一定要有真正的奢摩他和毗缽舍那，可是卻必須依賴止修與觀修。觀修就是思惟的修行，止修就是專注的修行。止修就是奢摩他的隨順，觀修就是毗缽舍那的隨順。多加了「隨順」，三乘一切的善法都是由真實止觀或隨順止觀而產生的，就有道理了。如果只是講真實止觀，那麼三乘一切功德並非都是止觀之果，如同菩提心。當然生起菩提心之前先獲得真實止觀的也是有，不是沒有，但是生起菩提心一定需要真實止觀嗎？不一定。","涵蓋":[14,16]}],"時":"69A 05:39","頁":156,"af":"69a","st":339,"et":549,"消文":[{"文":"三乘功德主要只有兩樣：一是止，善所緣心不餘散，安住其上。"},{"文":"或其隨順：未證奢摩他前，隨於此法、順於此法，先集聚資糧。"},{"文":"二是觀。如所有性：一切法的真如、本性、空性。"},{"文":"盡所有性：一切法現出來的相，五蘊、六入、十八界。"},{"文":"真實內涵，到毘缽舍那時再詳細講。"}],"延伸":[{"題":"或其隨順","組":[{"題":"戒是定的基礎","說":[{"類":"立","文":"戒是定的基礎，這才是學戒真正的目的。"},{"類":"破","文":"講戒這裡怎麼說、那裡怎麼說，到處生是非，完全弄錯戒的特質。"},{"類":"喻","文":"十八部如金碗裂開，不管哪一塊都是金。"}]},{"題":"集聚定資糧以趣慧","說":[{"類":"回扣","文":"其隨順，就是集聚定的資糧，我們目前做的這些；定是為了慧。"},{"類":"下手","文":"做任何事始終記得這個中心目標，慢慢地越跑越近。"}]}],"說":[{"類":"立","文":"戒是定的基礎，這才是學戒真正的目的。"},{"類":"破","文":"講戒這裡怎麼說、那裡怎麼說，到處生是非，完全弄錯戒的特質。"},{"類":"喻","文":"十八部如金碗裂開，不管哪一塊都是金。"},{"類":"回扣","文":"其隨順，就是集聚定的資糧，我們目前做的這些；定是為了慧。"},{"類":"下手","文":"做任何事始終記得這個中心目標，慢慢地越跑越近。"}],"af":"69a","st":339}],"逐字稿":[{"t":"69A 05:39","b":[["q","故說引發三乘一切功德，皆須二事，一除善所緣心不餘散，專一而住真奢摩他或其隨順。二善觀察善所緣境，如所有性盡所有性，毘缽舍那或其隨順。"],["s","那麼，這個裡邊整個的三乘的功德，主要的只有二樣：一個就是止，所謂「善所緣心不餘散」，安住在這個上頭。「或其隨順」，什麼叫隨順呢？就是你沒有證得奢摩他之前，隨於這個法，順於這個法。就像我們現在，把這個心總是種種地先集聚資糧，準備努力。所以戒是什麼？定的基礎，這才是我們學戒的真正目的，學戒真正的目的。這是我們必定要了解的。"]]},{"t":"69A 06:39","b":[["s","現在我看見有一些人那真是，說起來也可以說很可憐。哎喲！他講這個戒啊，這裡怎麼說，那裡怎麼說，結果弄了這個戒，到處在那裡生是非。他不曉得戒的真正的特質是幹什麼的，完全弄錯掉了。所以說，佛說得清清楚楚，十八部，哪一部 ……隨不同的根性 ─金啊、碗啊，碗裂開來了，不管哪一塊都是金啊！真正重要的，你要派這個用場。現在你弄錯了，這個是我們要了解的，所以這個目的在這裡。那所以「其隨順」，就是你要集聚定的資糧，那麼我們目前做的這些。而定是為什麼？目的還是為了慧，所以進一步是「善觀察善所緣境，如所有性盡所有性，毘缽舍那或其隨順。」那麼，這個盡所有性、如所有性，前面也簡單地說，真實的內涵等到毘缽舍那的時候，再詳細講說它。"]]},{"t":"69A 07:53","b":[["s","這「如所有性」就是換句話說，一切法的真如，簡單地說。換句話說，我們就說：喏！這個一切法的真相，或者說它的本性，或者說空性，就是這個。「盡所有性」呢，說一切法現出來的相，那就是這些啦，或者是五蘊啦、什麼六入啦、十八界啦，換句話說這個法在圈子裡面就是這個，它就是它整個的邊際。那進一步來說，就是那一個空性所現出來的行相、法相，或者緣起，或者是俗諦，種種所牽涉的，你歸納起來，那不外乎說五蘊，乃至於到十八界等等，這一些。那麼這個呢，就是屬於毘缽舍那，所謂觀。我們現在這個也就是隨順，那一步一步我們這麼上去，這個才是我們的中心，我們的目標。做任何一件事情，修學佛法，我們始終記得這個。你如果記得這個的話，做什麼事情，慢慢地、慢慢地，越跑越近，越跑越近，越跑越上，這一點特別重要。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/015.mp3"},{"文":"如是亦如《解深密經》云：「慈氏，若諸聲聞，或諸菩薩，或諸如來，所有世間及出世間一切善法，當知皆是此奢摩他，毘缽舍那所得之果。」","口譯":"這也像《解深密經》說的：「慈氏（彌勒菩薩），不論聲聞、菩薩還是佛，所有世間和出世間的善法，你要知道，全都是靠止和觀修出來的成果。」","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69A 09:09","頁":156,"af":"69a","st":549,"et":577,"消文":[{"文":"聲聞、菩薩、佛，世出世間一切善法，都是這兩樣所得的果。"}],"延伸":[],"逐字稿":[{"t":"69A 09:09","b":[["q","如是亦如《解深密經》云：「慈氏，若諸聲聞，或諸菩薩，或諸如來，所有世間及出世間一切善法，當知皆是此奢摩他，毘缽舍那所得之果。」"],["s","喏，經上面，不管聲聞、菩薩、佛，不管世間、出世間一切善法，都是這兩樣東西所得的果，所得的果。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/016.mp3"},{"文":"此中若無真實止觀及«隨順»二，則三乘一切功德，非定皆是止觀之果。","口譯":"這裡如果沒有包括真實的止觀及隨順止觀這兩類，那麼三乘的一切功德，就不一定都是止觀的果了。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69A 09:37","頁":156,"af":"69a","st":577,"et":1131,"消文":[{"文":"隨順：止觀的眷屬、類屬。"},{"文":"這是反顯：實際上三乘所有功德都是止觀的果。"},{"文":"正修八苦之前，又把次第重新提一下。"}],"延伸":[{"題":"隨順","組":[{"題":"佛一再提醒重視基礎","說":[{"類":"因","文":"平常提不上去，就是忽視了這一點；佛見到我們的毛病都在這上頭，所以一再提醒。"},{"類":"喻","文":"看書急著找中心，像造一百層樓，下面基礎不要。"}]},{"題":"莫好高騖遠，莫退屈","說":[{"類":"破","文":"好高騖遠；或說「我就是不行」癱著爬不起來，「只要念念佛」卻昏沈瞌睡：過猶不及。"},{"類":"下手","文":"觀察壞的策勵自己；太緊了就觀察好的，慶幸放寬。慢慢調，急不來。"}]},{"題":"同行討論的重要","說":[{"類":"例","文":"同修用功太緊，聽輕鬆的音樂放鬆心情。"},{"類":"喻","文":"電視廣告當時討厭，日後派上用場；靡靡之音的種子落在心裡，遇緣又生起。"},{"類":"立","文":"自己覺得想對了，這裡大有問題，這才是要觀察、討論的。"}]},{"題":"因地做對，果自然現","說":[{"類":"立","文":"不要怕摸不進去；因地做對了，果自然現起。"},{"類":"回扣","文":"有了這個策勵、這個認識，正修了：那麼怎麼修？說八苦當中。"}]}],"說":[{"類":"因","文":"平常提不上去，就是忽視了這一點；佛見到我們的毛病都在這上頭，所以一再提醒。"},{"類":"喻","文":"看書急著找中心，像造一百層樓，下面基礎不要。"},{"類":"破","文":"好高騖遠；或說「我就是不行」癱著爬不起來，「只要念念佛」卻昏沈瞌睡：過猶不及。"},{"類":"下手","文":"觀察壞的策勵自己；太緊了就觀察好的，慶幸放寬。慢慢調，急不來。"},{"類":"例","文":"同修用功太緊，聽輕鬆的音樂放鬆心情。"},{"類":"喻","文":"電視廣告當時討厭，日後派上用場；靡靡之音的種子落在心裡，遇緣又生起。"},{"類":"立","文":"自己覺得想對了，這裡大有問題，這才是要觀察、討論的。"},{"類":"立","文":"不要怕摸不進去；因地做對了，果自然現起。"},{"類":"回扣","文":"有了這個策勵、這個認識，正修了：那麼怎麼修？說八苦當中。"}],"af":"69a","st":652}],"逐字稿":[{"t":"69A 09:37","b":[["q","此中若無真實止觀及隨順二，則三乘一切功德，非定皆是止觀之果。"],["s","假定沒有真實的這個止觀及其隨順，隨順就是說它的眷屬、類屬，那麼就三乘的功德，不一定。實際上呢，三乘的所有的功德都是止觀的果。所以換句話說，這是反顯。總之一句話：不管三乘哪一乘，它真正重要的目的都在這個上頭。那是在正修那個八苦之前，先又提一下。說現在我們要修了，那麼這個次第，從下面怎麼上來，乃至於修的時候，又重新提。前面是告訴我們：修的時候正修時怎麼修；然後呢修完了以後，迴向怎麼迴向；迴向完了再下面一座，還沒有修的中間應該如何。又講四種資糧，然後又講把錯誤的很多錯誤的概念又提出，一步一步說得這麼清楚。乃至於到現在正式修了，他又隨時提醒我們，隨時提醒我們。"]]},{"t":"69A 10:52","b":[["s","這個地方有一個重點，這我們平常真正提不上去的，就是忽視掉了這一點，就是忽視掉了這一點，所以這個地方一再提醒。為什麼佛要一再提醒？佛陀的一切智人，就正見到我們平常的毛病都在這上頭。平常我們看書總是這樣，趕快要找到那個問題的中心在哪裡，欸，結果你往往前面這個東西不要的。像造房子一樣，「哎呀！我希望造的房子，造的一百層樓。」你趕快把一百層樓建起來，下面基礎不要的。至於像這個地方，他佛陀處處地方告訴我們，說下面這個你必須要修，你有了力量啊向上去。"]]},{"t":"69A 11:41","b":[["s","現在我們每有一類人，哎呀！好高騖遠，總翹求高的。反過來有一類人，「唉呀，我就是不行，我就是不行！」癱在這裡就爬不起來，就這樣。說：「我只要念念佛。」念佛本來不錯呀，你真的如果念佛的話，是非常好呀！結果呢，他心裡面就因為這麼弱，他說的時候，「我只要念念佛。」實際上行的時候，他念了佛沒有？沒有念欸！在那裡昏沈、瞌睡，一生空過，所以說過猶不及啊！我們目前大部分犯的毛病就是這個。大的來說這樣，細的來說呢，我們心理狀態平常也是這樣，一下猛利的時候，就衝過頭；一下塌下來的時候，唉！又提不起，就這樣。"]]},{"t":"69A 12:36","b":[["s","所以這一點地方，所以從這地方我們要注意，這個不是說一下叫我們改過來。所以這個後面就告訴我們，我們做任何事情，就是這樣：它開頭的時候，哇！起伏很大；然後呢你曉得了，慢慢、慢慢、慢慢、慢慢、慢慢，它必然地調得這樣子相。只要你自己感覺到，慢慢地，欸，在對了；然後呢，你緣著你做的這個方式，這樣進，還是急不來的喔！這就是真實的進步，真實的進步必然如此的，這我們要了解，這我們要了解。然後到了這個時候的話，你隨時觀察壞的方面，策勵自己。然後呢，策勵自己覺得很緊了，然後呢觀察好的方面呢，慶幸，啊，又放寬了，高興。就這樣地不斷地在調，它慢慢地一步一步、一步一步。"]]},{"t":"69A 13:24","b":[["s","這個地方我順便提起以前的事情來，所以平常思惟觀察固然是絕端地重要，還有呢，同學之間的共同的真正的討論，也非常重要。諸位啊！你們千萬不要把這個工夫，用在聊天上頭啊！這裡有幾位同修，經常願意跑得來跟我談談，我真歡喜，真歡喜啊！他往往有的時候他有一個小問題，我不妨舉出來。"]]},{"t":"69A 13:55","b":[["s","那有一個同修就說：嗯，有的時候，覺得用功用得心裡很緊。那是一個的確非常好的一個同修，他然後用功用得很緊，所以這個心裡就，哎喲，非常緊張，覺得：哎呀，這個死啊！又是：一旦生命失去了 ……那些都是好現象。然後呢，越弄越緊、越弄越緊，到那時候睡也睡不著，到那時候，書啊，看起書來 ……這樣。那怎麼辦？他就想一個鬆弛的辦法，欸，最後有的時候找到了一個鬆弛的辦法，找到鬆弛的辦法。那麼那位同修是個在家的同修，所以他就 ……因為在家人哪，以前譬如說有的時候聽聽什麼，外面偶然這個很輕鬆的這種音樂等等，欸，這個是滿好啊，這樣。對呀！然後呢，放輕鬆了以後再來。他說：「我的的確確地說，我並沒有染著這個音樂，可是那個時候，卻是放鬆了我的這個心情。」在他想起來很好。"]]},{"t":"69A 15:02","b":[["s","原則上面，我也非常讚歎他，可是那個時候就顯出那個討論的非常重要來，非常重要來了。所以我那時候舉了一個比喻，我當時也沒有談。「是，非常好，可是我舉一個例子給你聽聽。」他說：「好。」「你看電視看過沒有？」「看過。」「然後正在一個重要的節目，你聽得、看得很起勁的時候，忽然之間來一個廣告。你就覺得這個廣告真討厭，怎麼來這個東西，趕快、趕快過去。是，廣告商也未嘗不知道這樣，但是他就把那個廣告插進去，你曉得他為什麼？欸，妙了，你那個時候固然一心一意，正因為一心一意全部吸引在裡頭，那個廣告商讓你討厭；等到完了以後，你不在這個節目當中現行，有一天你想到要用的時候，你就想到：哎呀！當年討厭那個東西，就是你現在要的，它就派上用場了。」「嗯，對呀！」"]]},{"t":"69A 16:03","b":[["s","「現在你想想看，那個時候沒錯，你現在覺得很緊的時候，讓你調一下，是的，你覺得現在的心裡並沒有什麼。可是調的這個，那種世間的這種靡靡之音的種子，落在心裡面。假定說你證得果的聖人，不怕！佛根本不在乎。你是個凡夫，你還有無比地染污的種子，還有很多無比地染污的外緣。當另外一個時候，你的心不在正念上頭的時候，然後呢，你心裡本來就在這個世間的染緣當中，它又生起來了，因為有這個種子，裡邊有這個種子，外面有這個緣，你就跟著它去了。」他想了半天，「哎呀！沒有錯。」「就像你雖然當時是討厭這個廣告，但是對不起，這個廣告就派上用場了，對嗎？」「是啊！」"]]},{"t":"69A 17:01","b":[["s","所以有的時候我們平常我們自己覺得想對了，對不起，這裡有問題的哦！這個才是我們真正應該觀察、討論啊！所以平常不要說：「啊！我懂了，現在我就是對啊！」對不起，這裡大有問題，佛法不是那麼簡單。那麼佛有沒有？佛有，有種種善巧方便，這個地方我們不深入，我隨舉一例。結果這位同學聽了好歡喜啊！我剛才告訴你的，馬上有感應的，就是他只要處處深入，他隨時觸發到，隨時就來了。啊！他今天早晨懺悔完了以後，一句話，哎呀！他哭了個半天，然後又歡喜了半天。我就報告老法師，老法師好高興！「哈！善根發！」這千真萬確的，凡是真正有過經驗的，他這個次第必然是如此。"]]},{"t":"69A 17:53","b":[["s","所以我就特別提醒你們：你們不要怕，眼前好像顯得，唉呀，怎麼也摸不進去。你不要忙，只要因，這個因地當中你做對了，你只要再摸，你不要問它摸得進摸不進，這個因地在對了，你正在進去嘛，很簡單嘛！到那個時候，到某個時候，它這個果自然必然現起來的。這是所有過來佛菩薩，都是這樣的經驗，他也告訴我們。那眼前就是像我們普通這麼看看，大家推起來，你看看、我看看，我跟你都差不多。的確差不多啊，但是他在因地上面如法走，馬上見效。所以像這樣完整的次第，你只要肯做，立刻見效。現在呢，我們有了這個策勵，有了這個認識，那個時候正修了，原來在這裡呀！那麼怎麼修？說八苦當中，"]]}],"口譯音":"口譯音檔/siwei-kudi-02/017.mp3"},{"文":"如是八苦之中，初思惟生苦分五。","口譯":"八苦當中，先思考生苦，分成五點來講。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"八苦是生、老、病、死、怨憎會苦、愛別離苦、所欲求不得苦，及取蘊總為苦（五取蘊苦），共八苦。首先，生苦又可以分五：一、眾苦所隨故生為苦，二、粗重所隨故生為苦，三、眾苦所依故生為苦，四、煩惱所依故生為苦，五、不隨所欲離別法性故生苦。"},{"類":"整段","文":"接下來說八苦的內涵，這部分非常重要。在此所說的痛苦，不是看不到的痛苦，而是我們可以親身經歷、親眼見到的痛苦。就連人道的這種痛苦我們都無法忍受，更何況是三惡道的痛苦。透過思惟中士道痛苦，再去看下士道的痛苦，才能產生非常強烈的信心。有時候，雖然道次第以生起的次第來講，是由下下道生起，可是在思惟時，可以從上上法類思惟，這對下下道的生起絕對有幫助。我們不要認為生起的時候，是由下下道生起上上道，所以學習及思惟時，只學下下法類，下下道還未堅定之前，不用思惟上上法類，這是錯誤的想法。當然每個人的情況不同，以我個人來講，是先思惟中士道所說的痛苦。否則直接看三惡道的痛苦，尤其是看地獄的痛苦時，對熱的時候非常熱、冷的時候非常冷，會產生一點點的疑惑。但是透過思惟中士道的內容，才相信業果一節所說，原來由不可思議的惡業會感得不可思議的苦果，所以不可思議的冷和熱是絕對有可能的。由多因去做思惟，感受比較深刻。","涵蓋":[17,24]}],"時":"69A 18:51","頁":156,"af":"69a","st":1131,"et":1159,"消文":[{"文":"八苦：生、老、病、死、愛別離、求不得、怨憎會、五陰熾盛。"},{"文":"一樣一樣分開研究；生苦分五個項目。"}],"延伸":[],"逐字稿":[{"t":"69A 18:51","b":[["q","如是八苦之中，"],["s","思惟生苦。那個八苦平常我們曉得的：生、老、病、死、愛別離、求不得、怨憎會、五陰熾盛，八樣東西。一樣一樣分開來，研究下去。"]]},{"t":"69A 19:16","b":[["q","初思惟生苦分五。"],["s","分五個項目。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/018.mp3"},{"文":"眾苦所隨故生為苦者，謂諸有情那洛迦中，及諸一向唯苦餓鬼，並諸胎生卵生，如是四類，於初生時，便有無量猛利苦受，隨逐而生。","口譯":"第一，生是苦，因為一出生就有各種苦跟著來：地獄的眾生、一直只受苦的餓鬼，還有胎生、卵生的眾生，這四類在剛出生的時候，就有無數劇烈的痛苦緊跟著一起生出來。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"第一、眾苦所隨故生為苦。無論地獄眾生、一向唯苦的餓鬼（餓鬼在生時有兩種，一是只有痛苦，二是沒有那麼痛苦）、胎生、卵生出生時，都有無量猛苦逼迫而生。以人道來講，在胎裡面就有種種的痛苦，一出母胎，也有很大的痛苦。所以嬰兒一生下來沒有不哭的，因為已經習慣了胎中的環境，一出生，接觸到外面的空氣，那種刺痛，嬰兒是無法忍受的，所以他就會放聲大哭。"}],"時":"69A 19:19","頁":156,"af":"69a","st":1159,"et":1212,"消文":[{"文":"一切的苦都隨著生，生一來，苦就跟著來了。"},{"文":"那洛迦、餓鬼、胎生、卵生四類，一有這個身體，無量猛苦跟著來。"}],"延伸":[],"逐字稿":[{"t":"69A 19:19","b":[["q","眾苦所隨故生為苦者，謂諸有情那洛迦中，及諸一向唯苦餓鬼，並諸胎生卵生，如是四類，於初生時，便有無量猛利苦受，隨逐而生。"],["s","第一個，「生」這個苦，它這個東西啊，一切的苦都隨著這個生，生一來，苦就跟著來了。那洛迦當然不談，一跑下去，唉呀，那不得了！餓鬼。除了這個以外，就是其他的胎生、卵生，一切四類，只要一生，一有了這個身體以後，無量的猛苦跟著來了，無量的苦都跟著來，只要「生」有，苦都跟著來了。第二個呢，"]]}],"口譯音":"口譯音檔/siwei-kudi-02/019.mp3"},{"文":"粗重所隨故生為苦者，謂三界一切諸行，為煩惱品粗重所隨，無堪能性，不自在轉。","口譯":"第二，生是苦，因為有「粗重」跟著：三界裡的一切身心，都被煩惱的種子（粗重）緊緊跟著，所以沒有力量照自己的意思去做，作不了主。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"第二、粗重所隨故生為苦。這個非常重要，下面講止觀章時，會說到所謂的粗重為性。我們在行善法時，心緣善法已經十分困難了，更何況是身去行善法。因為身粗重，所以我們無法隨心所欲地驅使身來行善法。很奇怪喲！我們的身體做壞事情時，好像都不會覺得疲倦；可是想用我們的身體來行善時，卻會出現狀況，如累了、想睡了，這就是身粗重。心更不用說，心粗重更為嚴重。隨著身心粗重，我們不堪能行善法。投生之時，無法隨心所欲地到想去的地方，無自主地、無奈地接受後世的輪轉。生的時候是由業和煩惱所生，業和煩惱所帶來的身心幾乎都是煩惱的因緣，只要遇到小小的因緣就會馬上產生煩惱。拿身體來講，身體健康時容易產生貪欲，長得莊嚴容易產生傲慢，長得醜陋容易產生嫉妒、憤恨或沒有自信、沮喪，身體衰敗時容易生起瞋心。只要身體有一點點的變化，馬上就會產生煩惱，身體本身就像製造煩惱的機器。一切生、老、病、死苦都是因為有這個身體，它是過去一切痛苦的所依、現在痛苦的正依、未來痛苦的所依，這個身體會造作許多的業，我們將來必須承受許多的痛苦。而且心的痛苦與身的痛苦又是互相相應、互相依賴和增長。粗重的身心確實是產生煩惱、痛苦的因緣。","涵蓋":[19,20]}],"時":"69A 20:12","頁":157,"af":"69a","st":1212,"et":1260,"消文":[{"文":"粗重就是煩惱的異名；一旦生了，煩惱也跟著來。"},{"文":"三界一切行：乃至色界、無色界，都在行苦當中。"},{"文":"無堪能性：沒有力量，想不受輪迴的圈套，做不到，不得自在。"}],"延伸":[],"逐字稿":[{"t":"69A 20:12","b":[["q","粗重所隨故生為苦者，"],["s","什麼是「粗重」呢？粗重就是煩惱的異名。"]]},{"t":"69A 20:20","b":[["q","謂三界一切諸行，為煩惱品粗重所隨，無堪能性，不自在轉。"],["s","這一旦生了以後，生起來了以後，煩惱也跟著來了。「三界一切行」，不但是地獄，那當然不談，惡道不談，乃至於天上面，色界也好，無色界也好，行苦當中。這個「行」本身就是「煩惱品」。「無堪能性」，什麼叫無堪能性？你沒有力量，你想不受這個苦的輪迴的圈套，做不到，你不得自在的。這第二個。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/020.mp3"},{"文":"三界有情諸行生起，皆為煩惱品類粗重隨逐。總之由有生住增長，煩惱種子隨逐流轉，故無堪能安住善事，亦不如欲自在而轉。","口譯":"三界眾生的身心一生起來，就被煩惱的種子緊緊跟著。總之，因為有出生、存續、成長，煩惱的種子就一路跟著流轉，所以沒有力量安住在善事上，也不能照自己想要的那樣自在。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69A 21:00","頁":157,"af":"69a","st":1260,"et":1347,"消文":[{"文":"由生住增長，煩惱的現行、種子跟著流轉。"},{"文":"所以沒辦法安住在善所緣的事上。"},{"文":"不如欲自在而轉：希望要快樂，它偏偏不聽你招呼。"},{"類":"例","文":"好吃的吃飽了肚子脹，還要上大號、洗、買、弄；最快樂的吃就這麼多。"}],"延伸":[],"逐字稿":[{"t":"69A 21:00","b":[["q","三界有情諸行生起，皆為煩惱品類粗重隨逐。總之由有生住增長，煩惱種子隨逐流轉，故無堪能安住善事，亦不如欲自在而轉。"],["s","這個就是粗重煩惱的特質。因為三界的一切有情在行當中，行當中，那麼行的話呢，煩惱品粗重跟著來、跟著來。所以總之一句話：由於生、住、增長，生了下面緊跟著就什麼？喏，這樣來了，就是那個煩惱的現行，現行種子，跟著在這地方流轉，你沒辦法安住在善所緣的事，沒辦法。「亦不如欲自在而轉」，你希望的事情，對不起，做不到。你希望要快樂，它就偏偏不聽你招呼。就是眼前小小的快樂，好吃的東西吃飽了，等一下唉呀！肚子脹脹地難受，等一下還要上大號去、還要去洗、還要去忙、還要去買、還要去弄。那吃，這最快樂的事情，就這麼多，其他的不談了。所以這個生啊，是會有這樣的不理想啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-02/021.mp3"},{"文":"眾苦所依故生為苦者，謂於三界既受生已，由此因緣，便能增長老病死等，無邊眾苦。","口譯":"第三，生是苦，因為它是各種苦的依靠處：在三界裡一出生，就以此為條件，老、病、死等無邊的痛苦就跟著長出來。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"第三、眾苦所依故生為苦。既然被業和煩惱所生，就沒有什麼好事。有因業和煩惱而生，自然有因業和煩惱而死，由業和煩惱所帶來的種種問題就會生起。為什麼呢？因為我們的生是依靠眾苦所依的業和煩惱而生，光是這一點就值得痛苦了。"}],"時":"69A 22:27","頁":157,"af":"69a","st":1347,"et":1383,"消文":[{"文":"生是一切苦的依處；受生了，老病死無邊眾苦都依此而來。"}],"延伸":[],"逐字稿":[{"t":"69A 22:27","b":[["q","眾苦所依故生為苦者，謂於三界既受生已，由此因緣，便能增長老病死等，無邊眾苦。"],["s","第三個，這個生是一切苦的依處，這個一切的苦都依這個上面，所以「眾苦所依」。第一個是眾苦所跟著來，還有呢煩惱跟著來，煩惱。現在呢，一切的苦是依於這個生，這三界之內一旦受生了，下面的都依這個，無邊眾苦。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/022.mp3"},{"文":"煩惱所依故生為苦者，謂於生死既受生已，便於貪境瞋境癡境發生三毒，由此能令身心苦惱不靜，不安樂住，謂諸煩惱，由種種門逼惱身心。","口譯":"第四，生是苦，因為它是煩惱的依靠處：在生死中一出生，遇到喜歡的就起貪、遇到討厭的就起瞋、遇到不明白的就起癡，這三毒讓身心苦惱不安、沒辦法安樂；也就是說，各種煩惱從各個方面折磨我們的身心。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"第四、煩惱所依故生為苦。被業和煩惱生下來之後，不是就沒有煩惱了，由業和煩惱帶來的身心容易相應於煩惱。如同上述所說，身體的好壞會直接影響到我們的心，馬上產生煩惱，身體好的時候就生貪、生慢，身體差一點的時候就生瞋。心也一樣，因為我們現有的心是業和煩惱帶來的，所以心容易相應於煩惱，起心動念很容易起煩惱。由業和煩惱所產生的四蘊─受蘊、想蘊、行蘊、識蘊，只要因緣具足，若沒有刻意地去對治煩惱，幾乎都是自然地趨向煩惱。故諸先賢大師說：如果我們沒有刻意地生起對治力，精進地去對治煩惱，而認為煩惱可以自己消失，那是絕對不可能的。我們放縱煩惱，煩惱就會吃定我們。唯一斷除煩惱的方式，只有生起大精進力刻意地去對治它，除此之外，沒有其他的方式。"}],"時":"69A 23:03","頁":157,"af":"69a","st":1383,"et":1451,"消文":[{"文":"前面講苦果，這裡講苦因煩惱。"},{"文":"前面是生理的老病死，這裡是心理的。"},{"文":"好的貪、不好的瞋、其他的癡；三毒令身心逼惱，不靜不安樂。"}],"延伸":[],"逐字稿":[{"t":"69A 23:03","b":[["q","煩惱所依故生為苦者，謂於生死既受生已，便於貪境瞋境癡境發生三毒，由此能令身心苦惱不靜，不安樂住，謂諸煩惱，由種種門逼惱身心。"],["s","那麼這個是煩惱。這個幾樣東西，一個是苦的果，一個是苦的因。因當中又分成業因跟那個 ……業因當中是惑、業等等。現在這個地方所講的就是苦因煩惱，「煩惱所依」。一旦生起來了以後，這個煩惱都增長了，這煩惱是心理現象。上面說這個是指生理的，病啊、老啊、死啊，這個地方是心理的。因為你生了以後，對於好的嘛是貪，不好的嘛是瞋，其他的是癡，「發生三毒」。因為這個三毒令身心逼惱，「不靜」，不安樂。啊！這個是第四點，這個是第四點。最後"]]}],"口譯音":"口譯音檔/siwei-kudi-02/023.mp3"},{"文":"不隨所欲離別法性故生苦者，謂一切生最後邊際咸不出死，此非所愛，此復能令唯受眾苦。","口譯":"五、不隨所欲離別法性故生是苦：就是一切的生，最後的終點都不出於死，這不是所愛樂的，而且又只會令人承受眾苦。","四家合註":null,"合註白話":null,"覺燈日光":[{"類":"確定","文":"第五、不隨所欲離別法性故生苦。既然被業和煩惱所生，下述所說的種種痛苦都會引發，我們無法自在地讓自己離苦得樂。"}],"時":"69A 24:11","頁":157,"af":"69a","st":1451,"et":1491,"消文":[{"文":"不隨所欲：道地的不自在，你希望的總歸不聽你招呼。"},{"文":"離別法性：沒有人想死，偏偏最後要死；生的本質法爾如是。"},{"文":"「謂一切生…」：師父只說「就這樣」，沒有另外解。"}],"延伸":[],"逐字稿":[{"t":"69A 24:11","b":[["q","不隨所欲離別法性故生苦者，"],["s","就這樣。最後生苦是什麼？「不隨所欲」，就是道地的不自在，你沒辦法自己把握住自己的，你希望的，它總歸不聽你招呼，到最後呢 ─別離。沒有一個人想別離，換句話說，沒有人想死的，它偏偏到最後你要死，這「別離法性」。它「生」這個特質的本質，法爾如是，這叫作苦。"]]},{"t":"69A 24:43","b":[["q","謂一切生最後邊際咸不出死，此非所愛，此復能令唯受眾苦。"],["s","就這樣。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/024.mp3"},{"文":"«故應思惟»如是生時，眾苦俱生，粗重俱生，生復能引衰老病等煩惱死亡，此亦能令受苦道理。","口譯":"所以應當思惟：像這樣出生的時候，眾苦一起生起，粗重一起生起，生又能引來衰老、病等、煩惱與死亡，這也就是生能令人受苦的道理。","四家合註":null,"合註白話":null,"覺燈日光":null,"時":"69A 24:51","頁":157,"af":"69a","st":1491,"et":1601,"消文":[{"文":"一共五樣：從生上面去想，分五個項目。"}],"延伸":[{"題":"故應思惟","組":[{"題":"多方思惟，增長功德","說":[{"類":"立","文":"越能深入多方面去思惟，增長的功德越大。"}]},{"題":"於可愛境思其過患","說":[{"類":"破","文":"眼前都顛倒了：把可愛、快樂的看成淨相增長。"},{"類":"下手","文":"對眼前可愛的東西，要想到它可怕、不可愛的那一面。"}]},{"題":"講戒不思惟則無用","說":[{"類":"破","文":"講了半天戒，境界現前了不相干，就是沒有認真思惟。"},{"類":"回扣","文":"這個地方，宗大師現在提醒我們這一點。"}]}],"說":[{"類":"立","文":"越能深入多方面去思惟，增長的功德越大。"},{"類":"破","文":"眼前都顛倒了：把可愛、快樂的看成淨相增長。"},{"類":"下手","文":"對眼前可愛的東西，要想到它可怕、不可愛的那一面。"},{"類":"破","文":"講了半天戒，境界現前了不相干，就是沒有認真思惟。"},{"類":"回扣","文":"這個地方，宗大師現在提醒我們這一點。"}],"af":"69a","st":1504}],"逐字稿":[{"t":"69A 24:51","b":[["q","故應思惟如是生時，眾苦俱生，粗重俱生，生復能引衰老病等煩惱死亡，"],["s","一共五樣。"]]},{"t":"69A 25:04","b":[["q","此亦能令受苦道理。"],["s","所以從第一個，從生上面去想，又分這個五個項目，分五個項目。你越能夠深入多方面去思惟，那麼增長的功德是越大，增長的功德越大。我們眼前都顛倒了。前面一開始告訴我們，我們把眼前很多事情覺得淨相增長。「淨相」是什麼？好的，看快樂的、安樂的。我們無始的煩惱在這裡，唯一的方法就是對治。所以對眼前很多可愛的東西，千萬注意啊！要想到它的可怕，不可愛的那一面。你如果不修習這個的話，說什麼都沒有用。講戒，就在這個上面，所以講了半天的戒，然後呢到這個境界現起，為什麼一點用場都沒有啊？就是你沒有認真思惟。所以有一些人，哎呀！講戒啊，又講這個、講這個，境界現前，了不相干。我心裡面實在覺得可憐，也只能說這樣，只能說可憐、愚癡啊！然後呢，他還自作聰明，這是我覺得愚癡是莫勝於此！我想這是我的善知識，阿彌陀佛！我可千萬不要犯這個毛病。這個，這個地方他現在提醒我們這一點。"]]}],"口譯音":"口譯音檔/siwei-kudi-02/025.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-02/001.webp","n":1},{"img":"投影片/siwei-kudi-02/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/siwei-kudi-02/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/siwei-kudi-02/004.webp","n":4},{"img":"投影片/siwei-kudi-02/
