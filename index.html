<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#B3352B"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="廣論科判"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>師父講解科判</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：地圖（廣論科判）｜道路＋前導車（直排師父科判）｜細看（消文・延伸・逐字稿）。宣紙、墨、朱砂、泥金。 */
:root{
  --paper:#F1EEE6; --panel:#E8E3D7; --raised:#F8F6F0; --ink:#26231E; --ink-2:#5D574C; --ink-3:#8E877A;
  --line:#6F685C; --rule:#D6CFBF; --zhu:#B3352B; --zhu-wash:rgba(179,53,43,.09); --gold:#92700F;
  --t-li:#2E6A88; --t-po:#AE3A2E; --t-yin:#7A58A3; --t-yu:#2E7A52; --t-xia:#B4701A; --t-hui:#777064;
  --f-kai:"LXGW WenKai TC","DFKai-SB","BiauKai","Kaiti TC",serif;
  --f-ui:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --shadow:0 6px 24px rgba(40,30,10,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1B1A17; --panel:#232119; --raised:#2A2820; --ink:#E9E3D4; --ink-2:#BAB2A1; --ink-3:#878070;
  --line:#958D7E; --rule:#3B382F; --zhu:#E1715F; --zhu-wash:rgba(225,113,95,.14); --gold:#D3AA4F;
  --t-li:#6FA8C6; --t-po:#E07A6C; --t-yin:#AC90D6; --t-yu:#6DBA8E; --t-xia:#E0A456; --t-hui:#A39C8E;
  --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B1A17; --panel:#232119; --raised:#2A2820; --ink:#E9E3D4; --ink-2:#BAB2A1; --ink-3:#878070;
  --line:#958D7E; --rule:#3B382F; --zhu:#E1715F; --zhu-wash:rgba(225,113,95,.14); --gold:#D3AA4F;
  --t-li:#6FA8C6; --t-po:#E07A6C; --t-yin:#AC90D6; --t-yu:#6DBA8E; --t-xia:#E0A456; --t-hui:#A39C8E;
  --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.6;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--zhu);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 頁首 */
header{display:flex;align-items:center;gap:14px;padding-block:10px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-kai);font-weight:700;font-size:22px;margin:0;letter-spacing:.08em;white-space:nowrap}
.brand .lesson{color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:1 1 320px;max-width:560px;margin-left:auto}
.search input{width:100%;box-sizing:border-box;padding:8px 12px 8px 34px;border:1px solid var(--rule);border-radius:8px;background:var(--raised)}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-3);fill:none}
.results{position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;max-height:min(70vh,560px);overflow:auto;background:var(--raised);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:6px}
.results .grp{font-size:11px;letter-spacing:.12em;color:var(--ink-3);padding:8px 10px 4px}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px}
.results button:hover,.results button.act{background:var(--zhu-wash)}
.results .meta{font-size:12px;color:var(--ink-3)}
.results mark{background:none;color:var(--zhu);font-weight:700}
.results .empty{padding:12px;color:var(--ink-2)}
.tools{display:flex;gap:6px;align-items:center}
.chip{border:1px solid var(--rule);background:var(--raised);border-radius:999px;padding:4px 11px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.zhu[aria-pressed="true"]{background:var(--zhu);border-color:var(--zhu);color:#fff}

/* 三欄 */
.main{--mapw:270px;--detw:380px;display:grid;grid-template-columns:var(--mapw) 9px minmax(0,1fr) 9px var(--detw);min-height:0;gap:0}
.gut{position:relative;cursor:col-resize;touch-action:none;z-index:4}
.gut::before{content:"";position:absolute;top:0;bottom:0;left:4px;width:1px;background:var(--rule)}
.gut::after{content:"";position:absolute;top:50%;left:2px;width:5px;height:36px;transform:translateY(-50%);border-radius:3px;background:var(--rule);opacity:0;transition:opacity .15s}
.gut:hover::before,.gut.on::before{background:var(--zhu);width:2px;left:3.5px}
.gut:hover::after,.gut.on::after{opacity:1;background:var(--zhu)}
body.resizing{cursor:col-resize;user-select:none}
body.resizing iframe,body.resizing svg{pointer-events:none}
.pane{min-height:0;overflow:auto}
.map{position:relative;padding:12px 8px 24px 0;min-width:0}
.detail{min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.center{display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0}

/* 地圖 */
.map h2,.side h2{font-size:11px;letter-spacing:.18em;color:var(--ink-3);font-weight:500;margin:4px 0 8px}
.kp ul{list-style:none;margin:0 0 0 5px;padding-left:3px;border-left:1px dotted var(--rule)}
.kp>ul{padding-left:0;border:0}
.kp li{margin:1px 0}
.kp{width:max-content;min-width:100%}
.kp .row{white-space:nowrap;display:flex;align-items:flex-start;gap:4px;padding:2px 4px;border-radius:5px;font-size:13px;line-height:1.45;color:var(--ink-3)}
.kp .row .tw{flex:none;width:22px;height:22px;margin:-2px 0 -2px -4px;border:0;border-radius:5px;background:none;padding:0;color:var(--ink-2);font-size:12px;line-height:22px;cursor:pointer}
.kp .row .tw:hover{background:var(--zhu-wash);color:var(--zhu)}
.kp .row:not(.has):has(button.tw){cursor:pointer}
.kp .row:not(.has):has(button.tw):hover{background:var(--zhu-wash)}
.kcnt{cursor:pointer}
.kcnt:hover{background:var(--zhu);color:#fff}
.kp .row .c{flex:none;font-family:var(--f-kai);color:var(--ink-3)}
.kp .row .t{font-family:var(--f-kai);font-size:14px}
.kp .row.path .t{color:var(--ink)}
.kp .row.has{color:var(--ink);cursor:pointer}
.kp .row.has .t{color:var(--zhu);font-weight:700}
.kp .row.has::after{content:"";flex:none;width:7px;height:7px;margin-top:6px;border-radius:50%;background:var(--zhu)}
.kp .row.has:hover,.kp .row.cur{background:var(--zhu-wash)}
.kp .row.flash{animation:flash 1.2s}
@keyframes flash{0%,40%{background:var(--zhu-wash);box-shadow:0 0 0 2px var(--zhu)}100%{box-shadow:none}}
.maphd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.maphd h2{margin:0}
.maphd .seg button{padding:1px 8px;font-size:12px}
.kp.mine{width:auto}
.kp.mine .row{white-space:normal}
.kp.mine ul{margin:0;padding:0;border:0}
.kp.mine .row{padding-left:calc(var(--d,0) * 9px + 4px)}
.kp.mine .row{padding-left:calc(var(--d,0) * 10px + 2px)}
.kpcrumb{font-size:11.5px;line-height:1.55;color:var(--ink-3);font-family:var(--f-kai);margin:0 2px 6px;padding-bottom:6px;border-bottom:1px dashed var(--rule)}
.kcnt{flex:none;margin-left:6px;font-family:var(--f-ui);font-size:11px;color:var(--zhu);border:1px solid var(--zhu-wash);background:var(--zhu-wash);border-radius:999px;padding:0 7px;line-height:18px;align-self:center}
.kp .lpills{display:flex;flex-wrap:wrap;gap:4px}
.kp .lpill{border:1px solid var(--rule);background:var(--raised);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kp .lpill:hover{border-color:var(--zhu);color:var(--zhu)}
.kp .lpill.cur{background:var(--zhu);border-color:var(--zhu);color:#fff}
.kp .lpill.whole{font-weight:700;color:var(--zhu);border-color:var(--zhu)}
.kp .lpill.whole.cur{color:#fff}
.kp .lrange{font-family:var(--f-kai);font-size:14px;font-weight:700;color:var(--ink)}
.kp .lessons{margin:3px 0 8px;padding-left:min(calc(var(--d,0) * 10px + 20px),56px);display:flex;flex-direction:column;gap:5px}
.kp .lcard{border:1px solid var(--rule);background:var(--raised);border-radius:8px;padding:5px 9px;display:flex;flex-direction:column;gap:2px}
.kp .lcard.cur{border-color:var(--zhu);box-shadow:0 0 0 2px var(--zhu-wash)}
.kp .lcard button{border:0;background:none;padding:0;text-align:left;font-family:var(--f-kai);font-size:14px;color:var(--ink);font-weight:700;white-space:normal;line-height:1.45;font-variant-numeric:tabular-nums}
.kp .lcard .lplay{font-size:11.5px;line-height:1.5;color:var(--zhu);text-decoration:none;white-space:normal;font-variant-numeric:tabular-nums}
.kp .lcard .lplay:hover{text-decoration:underline}
.map .note{font-size:12px;color:var(--ink-3);margin:14px 4px 0;line-height:1.6}

/* 主圖 */
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.bar .lbl{font-size:12px;color:var(--ink-3);margin-right:2px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--raised)}
.seg button{border:0;background:none;padding:3px 10px;font-size:13px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tagbtn{border:0;border-radius:5px;padding:2px 8px;font-size:12px;color:#fff;opacity:.9}
.tagbtn[aria-pressed="false"]{background:transparent!important;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--rule);background:var(--raised);border-radius:7px;padding:3px 9px;font-size:13px}
.primary{border:0;background:var(--zhu);color:#fff;border-radius:7px;padding:5px 12px;font-size:13px;font-weight:500}
.treewrap{overflow:auto;min-height:0;position:relative;background:var(--paper);cursor:grab;touch-action:pan-x pan-y}
.treewrap.dragging{cursor:grabbing;user-select:none}
.treewrap.dragging #tree .n{cursor:grabbing}
#tree{display:block}
#tree .hit{fill:transparent;rx:6}
#tree .n{cursor:pointer}
#tree .n:hover .hit{fill:var(--zhu-wash)}
#tree .n.sel>.hit{fill:var(--zhu-wash);stroke:var(--zhu);stroke-width:1.4}
#tree .n.inrange>.hit{fill:var(--zhu-wash);stroke:var(--zhu);stroke-dasharray:5 4;stroke-width:1.4}
#tree line{stroke:var(--line);stroke-width:1.5}
#tree line.on{stroke:var(--zhu);stroke-width:2.4}
#tree.filt .lv5:not(.on),#tree.filt .lv4{opacity:.16}
#tree.filt .lv5.on>.hit{fill:var(--zhu-wash)}
.mini{border-top:1px solid var(--rule);padding:6px 12px 8px;background:var(--panel)}
.mini .track{position:relative;height:64px;cursor:pointer;border-radius:6px;overflow:hidden;background:var(--paper)}
.mini svg{position:absolute;inset:0;width:100%;height:100%}
.mini .view{position:absolute;top:0;bottom:0;border:2px solid var(--zhu);border-radius:5px;background:var(--zhu-wash);pointer-events:none}
.mini .cap{font-size:11px;color:var(--ink-3);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.pickhint{position:absolute;left:12px;top:12px;z-index:5;background:var(--zhu);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;box-shadow:var(--shadow)}

/* 細看 */
.tabs{display:flex;border-bottom:1px solid var(--rule);padding:0 14px}
.tabs button{border:0;background:none;padding:10px 4px;margin-right:18px;font-size:14px;color:var(--ink-3);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--zhu);font-weight:500}
.side{overflow:auto;padding:16px 18px 40px;min-height:0;flex:1}
.crumb{font-size:12px;color:var(--ink-3);font-family:var(--f-kai);line-height:1.5}
.crumb b{color:var(--zhu);font-weight:700}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 8px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pill{border:1px solid var(--rule);border-radius:999px;padding:1px 9px;background:var(--raised)}
.play{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:#fff;background:var(--zhu);border-radius:999px;padding:3px 11px 3px 9px;font-size:12px;font-weight:500}
.play svg{width:12px;height:12px;fill:currentColor}
.play.ghost{background:none;color:var(--zhu);box-shadow:inset 0 0 0 1px var(--zhu)}
.yw{font-family:var(--f-kai);font-size:21px;line-height:1.75;margin:4px 0 14px;text-align:justify}
.red{color:var(--zhu)}
.sec{margin-top:18px}
.sec h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:0 0 8px;letter-spacing:.05em}
.badge{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;border-radius:4px;padding:0 6px;line-height:19px;color:#fff;white-space:nowrap}
.badge.xw{background:none;color:var(--gold);box-shadow:inset 0 0 0 1.4px var(--gold)}
.badge.ys{background:var(--zhu)}
.xwlist{margin:0;padding-left:0;list-style:none;counter-reset:x;font-family:var(--f-kai);font-size:16px;line-height:1.7}
.xwlist li{position:relative;padding-left:24px;margin:4px 0;counter-increment:x}
.xwlist li::before{content:counter(x);position:absolute;left:0;top:3px;font-family:var(--f-ui);font-size:11px;color:var(--gold);width:17px;height:17px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--gold);text-align:center;line-height:17px}
.ycard{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--raised)}
.ycard.hl{border-color:var(--zhu);box-shadow:0 0 0 2px var(--zhu-wash)}
.ycard .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ycard .kw{font-family:var(--f-kai);font-size:20px;color:var(--zhu);font-weight:700}
.ycard ul{list-style:none;margin:0;padding:0}
.ycard li{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:start;margin:7px 0;font-family:var(--f-kai);font-size:16px;line-height:1.65}
.ycard li .badge{margin-top:3px;justify-self:start}
.ycard li.dim{opacity:.3}
.ygrp{display:flex;align-items:center;gap:7px;margin:12px 0 2px;font-family:var(--f-kai);font-size:16px;font-weight:700;color:var(--ink-2)}
.ygrp:first-child{margin-top:2px}
.ygrp .gno{font-family:var(--f-kai);font-size:12px;color:var(--zhu);width:19px;height:19px;border-radius:50%;box-shadow:inset 0 0 0 1.2px var(--zhu);display:grid;place-items:center;font-weight:400}
.ycard ul.ingrp{margin-left:9px;padding-left:16px;border-left:1.5px solid var(--rule)}
details.ts{margin-top:18px;border-top:1px solid var(--rule);padding-top:10px}
details.ts summary{cursor:pointer;font-size:13px;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.ts summary::-webkit-details-marker{display:none}
details.ts summary::before{content:"▸";color:var(--ink-3);transition:transform .15s}
details.ts[open] summary::before{transform:rotate(90deg)}
.tsec{margin:12px 0}
.tsec .tt{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.tsec .tt button.play-ts{cursor:pointer;border:0;background:none;padding:0;color:var(--zhu);font-size:11px}
.tsec p{margin:4px 0;font-size:14px;line-height:1.8;color:var(--ink-2)}
.tsec p.q{font-family:var(--f-kai);font-size:16px;color:var(--ink);border-left:3px solid var(--gold);padding-left:10px}
.kyhd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.kyt{font-family:var(--f-kai);font-size:18px;font-weight:700}
.kym{font-size:12px;color:var(--ink-3)}
.kytools{display:flex;gap:8px;align-items:center}
.kyorig{font-size:12px;color:var(--ink-2);display:flex;gap:4px;align-items:center;cursor:pointer}
.kybody{font-family:var(--f-kai);font-size:16.5px;line-height:1.95}
.kyp{padding:4px 8px;margin:0 -8px;border-radius:7px;cursor:pointer}
.kyp:hover{background:var(--zhu-wash)}
.kyp{position:relative}
.kyone{position:absolute;right:2px;top:4px;border:0;background:var(--raised);color:var(--zhu);border-radius:50%;width:24px;height:24px;font-size:10px;opacity:0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.kyp:hover .kyone,.kyp.reading .kyone{opacity:1}
.kyp.reading{background:var(--zhu-wash);box-shadow:inset 3px 0 0 var(--zhu)}
.kyp.reading p{color:var(--ink)}
.kyread{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:8px 10px;border-radius:10px;background:var(--raised);border:1px solid var(--rule)}
.kyrbtn{border:0;background:var(--zhu);color:#fff;border-radius:999px;padding:4px 14px;font-size:13px;font-weight:500;white-space:nowrap}
.kyrinfo{flex:1;font-size:12px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#kyRate{font-size:12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:2px 4px}
.kyp.cur{background:var(--zhu-wash);box-shadow:inset 3px 0 0 var(--zhu)}
.kyp p{margin:0;text-indent:2em}
.kybody.orig .kyp{margin-bottom:10px}
.kybody.orig .kyp p{text-indent:0}
.kyo{font-size:13.5px;line-height:1.7;color:var(--ink-3);margin-bottom:2px}
.kpg{font-family:var(--f-ui);font-size:10.5px;color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:0 3px;margin-right:6px;vertical-align:2px;text-indent:0;display:inline-block}
.kyles{font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--zhu);margin:14px 0 4px;letter-spacing:.1em}
.pvhd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pvhd a.iconbtn{text-decoration:none;color:var(--ink)}
.pvstage{position:relative;aspect-ratio:16/9;background:#111;border-radius:8px;overflow:hidden;user-select:none}
.pvstage img{width:100%;height:100%;object-fit:contain;display:block}
.pvnav{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;color:#fff;font-size:34px;opacity:0;transition:opacity .15s;cursor:pointer}
.pvnav.prev{left:0;text-align:left;padding-left:10px}.pvnav.next{right:0;text-align:right;padding-right:10px}
.pvstage:hover .pvnav{opacity:.7}
.pvcount{position:absolute;right:8px;bottom:6px;font-size:11px;color:#fff;background:rgba(0,0,0,.45);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.pvexit{display:none;position:absolute;right:14px;top:12px;border:0;background:rgba(0,0,0,.5);color:#fff;border-radius:50%;width:36px;height:36px;font-size:16px;z-index:2}
.pvstage:fullscreen,.pvstage.fakefs{border-radius:0;aspect-ratio:auto}
