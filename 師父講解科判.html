rim.xyz/player/media/gl1/065A.mp3"},"65b":{"local":"音檔/gl1/065B.mp3","remote":"https://lamrim.xyz/player/media/gl1/065B.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=64b&st1=1515&af2=65a&af3=65b&et3=484","段":[{"文":"若能盡淨有力之業，云何經說唯除先業所有異熟？謂感盲等異熟之時，現在對治難以淨除。若在因位，尚未感果，則易遮止。密意於此，故如上說，«無有過失»。","口譯":"如果懺悔能淨盡有力的業，為什麼經上說「唯除先業所有的異熟」？這是說：在已經感得眼盲等異熟果的時候，現在的對治難以淨除；如果還在因位、尚未感果，就容易遮止。經的密意在此，所以像上面那樣說，並沒有過失。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第七者、如經云：「除業異熟」，已感業異熟之生盲殘疾等雖莫能遮，然仍能盡淨定業道理之斷諍理者：<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">若爾，如以四力對治淨除，<\/span>若能盡淨有力之業，云何<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">契<\/span>經<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">中<\/span>說「唯除先業所有異熟<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">者<\/span>」？謂<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">其果<\/span>盲<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">及殘疾<\/span>等<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">前世之業已引此生，而如所引，<\/span>異熟<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">既已<\/span>感生之時，現在對治難以淨除。若<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">前世業已引此生，然今<\/span>在因位，尚未感果，則易遮止。密意於此，故如上說，無有過失。","覺燈日光":null,"時":"64B 25:29","頁":147,"af":"64b","st":1529,"et":null,"消文":[{"文":"又提一個問題：懺悔既能把惡業清淨，經上為什麼說先業的異熟要除開？那不是不能完全淨化了嗎？"},{"文":"業已經感果的時候，沒辦法淨除；在因位的時候淨修，可以遮止。"},{"類":"喻","文":"草還沒結種先拔掉；結了種把種子敲爛，泡水曬太陽也不長；已經發芽長出來了，要它不長，沒有這個可能。"},{"文":"所以跟前面所說完全相順，經的意思是這個，絕對沒有過失。"}],"延伸":[{"題":"無有過失","組":[{"題":"圓滿教法，百無一失","說":[{"類":"立","文":"說「無有過失」這裡有一個大道理：圓滿的教法一點漏洞都沒有。"},{"類":"因","文":"修行出種種問題，是因為懂了一點點，不懂的一大堆，漏洞多多少少，還覺得做對了，結果紕漏百出。"},{"類":"立","文":"這裡把綱要告訴你，每一個有問題的地方都說清楚；把握住去做，百無一失。"}]},{"題":"通達一切聖教無違","說":[{"類":"回扣","文":"本論一開始說它的特別好處：一切經論的內涵通達而不違背——在這裡處處顯出來。"},{"類":"立","文":"各經彼此看似矛盾的地方都提出來：小乘怎麼說、大乘怎麼說，告訴你意義，絕不違背。"},{"類":"立","文":"將來講共中、上士更進一層：大小之間不但沒有矛盾，完全相順、相輔，只是愈趨深廣。"}]},{"題":"莫以現知判斷一切","說":[{"類":"喻","文":"小學生回家說「這是老師講的」，天經地義；長大了才覺得可笑。"},{"類":"立","文":"剛開始學難免偏執；執著不是壞事，但要了解它有缺點。"},{"類":"下手","文":"不要拿現在所知道的去判斷一切，要拿它推動自己趕快努力深入。"}]}],"說":[{"類":"立","文":"說「無有過失」這裡有一個大道理：圓滿的教法一點漏洞都沒有。"},{"類":"因","文":"修行出種種問題，是因為懂了一點點，不懂的一大堆，漏洞多多少少，還覺得做對了，結果紕漏百出。"},{"類":"立","文":"這裡把綱要告訴你，每一個有問題的地方都說清楚；把握住去做，百無一失。"},{"類":"回扣","文":"本論一開始說它的特別好處：一切經論的內涵通達而不違背——在這裡處處顯出來。"},{"類":"立","文":"各經彼此看似矛盾的地方都提出來：小乘怎麼說、大乘怎麼說，告訴你意義，絕不違背。"},{"類":"立","文":"將來講共中、上士更進一層：大小之間不但沒有矛盾，完全相順、相輔，只是愈趨深廣。"},{"類":"喻","文":"小學生回家說「這是老師講的」，天經地義；長大了才覺得可笑。"},{"類":"立","文":"剛開始學難免偏執；執著不是壞事，但要了解它有缺點。"},{"類":"下手","文":"不要拿現在所知道的去判斷一切，要拿它推動自己趕快努力深入。"}],"af":"64b","st":1664}],"逐字稿":[{"t":"64B 25:29","b":[["q","若能盡淨有力之業，云何經說唯除先業所有異熟？謂感盲等異熟之時，現在對治難以淨除。若在因位，尚未感果，則易遮止。密意於此，故如上說，無有過失。"],["s","他下面又提出一個問題來，說：「既然像你這樣說，經過了懺悔，能夠把所有的這個惡業都能夠清淨的話，那麼經上面說先業所有的異熟，經上面又說這個要除開，它為什麼還要除開呢？既然你能夠徹底淨除的話，還有什麼除開，能夠除開的話，它不是不能完全淨化了嗎？」他下面說，當這個業你已經感得果了，已經感得果的時候，你就沒辦法淨除了；在因位的時候你還可以，在因位的時候，那個時候你淨修的話，可以遮止。"]]},{"t":"64B 26:38","b":[["s","這個道理用一個現實來比喻，比如我們說，草我們不要讓它長，那麼當這個草的種子，還沒有結種的時候，你先把它拔掉，不結種，這一個。第二個，結了種以後，那個種子你把它拿出來把它敲敲爛是第二個。敲爛了以後，儘管到那時候泡在水裡、曬得太陽，它絕對不結；是的，它那個種子還在那裡，但是它不會感果。但是萬一那個草，你草的種子你沒有事先破壞，到了春天已經發了芽，長出來了，你要叫它再不長芽，有沒有這個可能啊？那當然沒有這個可能，這是我們要懂得的。所以這個道理跟前面所說的仍舊完全相順，完全不違背，所以經上的意思是這個，所以它絕對沒有過失。"]]},{"t":"64B 27:44","b":[["s","關於這個地方他說沒有過失這一點，以及這一段話，這地方有一個大道理哦！這個也就是圓滿教法殊勝之處，凡是圓滿的教法，它一點漏洞都沒有的，前面這個道理我已經跟你們講過。我們現在所以修行的時候出種種問題，為什麼呢？你不能說你不懂，你懂得了一點點。懂得了一點點，結果呢你不懂的地方是一大堆，結果呢一大堆不懂的地方，這漏洞不曉得多多少少，你還覺得做對了，結果做的時候，因為有漏洞在，所以紕漏百出。現在這個地方啊，他雖然把那個綱要告訴你，凡是綱要的地方，每一個有問題的地方，他都告訴你清清楚楚，所以你只要把握住這個地方去做的話，百無一失。"]]},{"t":"64B 28:38","b":[["s","所以他把經上面，各種不同的經典上面，彼此有矛盾的地方都提出來。所以本論一開始告訴我們說，本論的特別好處，它能夠把一切的經論內涵通達而不違背，大家記得不記得？在這地方就處處地方顯出來了。欸！小乘怎麼說，大乘怎麼說，為什麼它這樣呢？喏！告訴你它的意義為什麼，絕不違背。你在粗淺的地方去看的時候，還覺得這是因為針對著這個，因為針對著這個，如果你真更深一層去看的話，那這個問題更是徹底圓滿地解決。將來講到共中、上士的時候，我會把剛才說那個話，更進一層地告訴你們。到那時候你自然會曉得大小之間，彼此是一點沒有矛盾；不但沒有衝突、沒有矛盾，而且完全相順、相輔，只是愈趨深廣，愈趨深廣。"]]},{"t":"65A 00:12","b":[["s","不同的只是我們無始以來的習氣，我們就有一種偏執。就像我們平常人念書也是一樣，我們念書進了小學裡面，小學裡面哪，到了這個學校裡學到了一點，回來了一定是：「喔唷，這個老師講的！」喔唷，這個老師講的是天經地義。等到我們自己長大了以後，自己乃至於曉得，真可笑，但是人人都有這個經驗，對不對？現在我們就是也是這樣。所以我們剛剛開始學的時候是難免的，要嘛自己不好好地，要好好地學，到那時候自己會，哎呀，執著得不得了。那時候我們真正重要的，注意，這個執著不是一件壞事，但是要了解這個執著有它的缺點。那麼當這種情況之下，趁這個機會要注意，說不要拿我們現在所知道的去判斷一切，要拿這個推動我們的力量啊，趕快努力深入，這個時候就把這個問題就可以解決了。繼續下去。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/001.mp3"},{"文":"《分別熾然論》云：「設作是云：若諸惡罪至極永盡，云何說除先業異熟耶？意謂已受生盲，一目缺足，顛跛及啞聾等，自性因果，故作是說。何以故？以諸業果，若已轉成異熟位體，非有功能，令其遍盡。","口譯":"《分別熾然論》說：「假如有人這樣問：如果種種惡罪能究竟永盡，為什麼又說要除開先業的異熟呢？這是指已經領受了天生眼盲、一眼失明、缺腳、跛足以及啞、聾等等這些自性因果，所以這樣說。為什麼呢？因為種種業果如果已經轉成異熟的果體，就沒有能力讓它完全淨盡了。","四家合註":"《分別熾然論》云：「設作是云：『若<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">以對治摧壞，<\/span>諸惡罪<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">勢力雖大，亦能從根<\/span>至極永盡，云何<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">佛經中<\/span>說「除先業異熟」耶？』<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此<\/span>意謂已受<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">能成<\/span>生盲、一目、殘疾、顛跛及啞聾等自性因位<span class=\"sjan sj-ba\">，<\/span>以及<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">由積其因而至彼<\/span>果位<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">時<\/span>，故作是說。何以故？以<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">已成就生盲等<\/span>諸業果<span class=\"sjan sj-ba\">，<\/span>若已轉成異熟位體，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">起對治力，<\/span>非有功能令其遍盡。","覺燈日光":null,"時":"65A 01:16","頁":147,"af":"65a","st":76,"et":105,"消文":[{"文":"就是前面剛才解釋的（師父併在上一段，沒有另外解）。"}],"延伸":[],"逐字稿":[{"t":"65A 01:16","b":[["q","《分別熾然論》云：「設作是云：若諸惡罪至極永盡，云何說除先業異熟耶？意謂已受生盲，一目缺足，顛跛及啞聾等，自性因果，故作是說。何以故？以諸業果，若已轉成異熟位體，非有功能，令其徧盡。"],["s","那就是前面，就是前面剛才解釋的。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/002.mp3"},{"文":"若因位思，正造作者，獲得所餘思差別力，能令永盡。","口譯":"如果還在因位的思業、正在造作的時候，獲得其餘殊勝思業的力量，就能讓它永遠淨盡。","四家合註":"<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">雖則如是，<\/span>若因位<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">階果報未成之等起<\/span>思<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">其所<\/span>正造作<span class=\"sjan sj-ba\">、<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">積聚之業<\/span>者，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如以不善為例，<\/span>獲得所餘<span class=\"sjan sj-ba\">〔<\/span>思差別力<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂其對治。〕而修習之<\/span>，<span class=\"sjan sj-ba\">必定<\/span>能令永盡。","覺燈日光":null,"時":"65A 01:45","頁":148,"af":"65a","st":105,"et":143,"消文":[{"文":"「思」就是業；還在因位、沒有感果，正在造作或造了還沒感果。"},{"文":"經過對治，「獲得所餘」——其他造的業的力量，把前面的統統抵銷，徹底淨除乾淨。"}],"延伸":[],"逐字稿":[{"t":"65A 01:45","b":[["q","若因位思，正造作者，獲得所餘思差別力，能令永盡。"],["s","假定它還在因位當中，「思」，思就是業嘛！在因位當中還沒有感果，你正在造作了；或者造作了以後還沒感果。那麼經過你的對治，「獲得所餘」，就是其他的這個思，思就是我們的造的業。這個其他造的業的這個力量，把它前面的統統抵銷，能夠「令盡」，徹底地淨除乾淨。下面引，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/003.mp3"},{"文":"猶如開示指鬘，«未生怨»，娑嚩迦，殺父及無憂等。","口譯":"就像經中所開示的指鬘、未生怨、娑嚩迦、殺父者以及無憂王等人的例子。","四家合註":"猶如開示<span class=\"sjan sj-ba\">〔<\/span>指鬘<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">殺人缺一滿千。〕<\/span>、<span class=\"sjan sj-ba\">〔<\/span>未生怨<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">弒其生父法王。〕<\/span>、<span class=\"sjan sj-ba\">〔<\/span>娑嚩迦<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">弒母。〕<\/span>、<span class=\"sjan sj-ba\">〔<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">又與其相類<\/span>殺父<span class=\"sjan sj-ba\">。〕<\/span>及<span class=\"sjan sj-ba\">〔<\/span>無憂<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">法王，上半生時人稱暴王無憂之罪人。〕<\/span>等<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">對治，而修習之，得見諦等<\/span>。","覺燈日光":null,"時":"65A 02:23","頁":148,"af":"65a","st":143,"et":265,"消文":[{"文":"就是前面講的那幾個公案：阿闍世王叫「未生怨」，殺了父親；「指鬘」就是鴦堀摩羅的公案。"}],"延伸":[{"題":"未生怨","組":[{"題":"未生怨的由來","說":[{"類":"例","文":"摩羯陀國王非常信佛，沒有兒子；山裡一位仙人將來會轉生成他的兒子，他等不及，把仙人害死，仙人就投生到他家。"},{"類":"例","文":"國王知道兒子長大要報復，很害怕；生下來丟在地上，沒跌死，跌壞一隻手指。"},{"類":"例","文":"長大後人家告訴他這段因緣，阿闍世王起了惡心——所以叫「未生怨」。"}]},{"題":"業感果，一點不差","說":[{"類":"立","文":"順便說明：業感果一點都不差。"}]}],"說":[{"類":"例","文":"摩羯陀國王非常信佛，沒有兒子；山裡一位仙人將來會轉生成他的兒子，他等不及，把仙人害死，仙人就投生到他家。"},{"類":"例","文":"國王知道兒子長大要報復，很害怕；生下來丟在地上，沒跌死，跌壞一隻手指。"},{"類":"例","文":"長大後人家告訴他這段因緣，阿闍世王起了惡心——所以叫「未生怨」。"},{"類":"立","文":"順便說明：業感果一點都不差。"}],"af":"65a","st":143}],"逐字稿":[{"t":"65A 02:23","b":[["q","猶如開示指鬘，未生怨，娑迦，殺父及無憂等。"],["s","就是前面講的那個幾個公案，一個是阿闍世王，阿闍世王叫「未生怨」，你們曉得這個公案。這個，把他父親殺死了，剛才已經說過了這個道理。那麼對這個未生怨哪，既然這個地方說了，我也順便提一下。那個摩羯陀國是當年印度是一個大國，那麼他非常信佛，可是沒有兒子，可是沒有兒子，那麼他後來求兒子。那個時候山裡邊有一個仙人，那就是外道婆羅門。啊，他這樣，他要求嗣，所以他就 ……說這個仙人將來會轉成他的兒子，他就等不得了，把那個仙人，把他害死。害死了以後呢，弄死了以後，然後這個人就投生到他家裡面，投生到家裡面。後來就告訴他：「哦，將來，因為你以前，你害了他以後，將來他長大了以後，你要還報他。」就這樣。"]]},{"t":"65A 03:42","b":[["s","他曉得了以後很害怕，雖然求到了兒子了，覺得既然這樣的話，這個兒子將來長大了要還報的話，倒不如把那個兒子弄死了。所以他那個兒子生出來的時候，他把他丟出去，丟在那個地上。結果丟在地上沒跌死，把他那個手指跌壞掉了一個，他也不知道。後來一直長大了以後，人家就告訴他，欸，你這個因緣是這樣啊！於是這阿闍世王起了這個惡心，所以他叫未生怨，這有這麼一段公案。這個地方也順便說明，這個業感果是一點都不差，這樣，那麼這個下面就不去說了。那個「指鬘」就是鴦堀摩羅這個公案，這個經上面告訴我們說得清清楚楚。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/004.mp3"},{"文":"設作是云，未生怨王及殺母等，若已生起所餘善思，何故其業未得永盡，生無間耶？是為令於所有業果，發信解故，現示感生諸無間等，非是未能，無餘永盡所有諸業。如擊綵球，隨擊而躍，生彼即脫，雖那洛迦火燄等事，亦未能觸。","口譯":"假如有人問：未生怨王以及殺母的人等等，如果已經生起了其餘的善思，為什麼他們的業還沒有永盡，仍然生到無間地獄呢？這是為了讓人對一切業果發起信解，所以示現感生無間等等，並不是不能毫無剩餘地永盡所有的業。就像拍擊綵球，一拍就彈起來，生到那裡隨即脫出，連那洛迦的火燄等等都碰觸不到。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第八、依典故破不合定律之理：<\/span>設作是云：『未生怨王及殺母等，若已生起所餘善思<span class=\"sjan sj-ba\">──<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">對治<\/span>，何故其業未得永盡，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">後世<\/span>生無間耶？』<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">答云：無過。此等<\/span>是為<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">由此因感此果，表徵因果無欺誑，或<\/span>令於所有業果發信解故，<span class=\"sjan sj-ba\">師云：『於後世中，已成先業所引異熟，是果位時無能遮退，而於因位可遮止者，或如有人，由於先業入母胎已，便即引生七歲之時一眼當瞎，十歲之時足當致殘，二十歲時手復當斷。於其初者，由未修成遮退方便等，故如所引，七歲之時一眼已瞎，此為異熟既成，故不能遮。其後諸果，雖已引生，然仍為其所引未成之因位，故行遮退方便，尚能遮退。』昔時罪惡雖極力大，然若生起其餘善心──對治，遍能永盡。於此或曰：此不應理。若如是者，但為<\/span>現示<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">須臾<\/span>感生諸無間等，非是未能無餘永盡所餘諸業。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">若是未盡，則本當長時領受地獄苦者，成唯生其中，<\/span>如擊綵球，隨擊<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">無間<\/span>而躍，生彼<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">無間<\/span>即脫，雖那洛迦火燄等事，亦未能<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">略<\/span>觸，","覺燈日光":null,"時":"65A 04:25","頁":148,"af":"65a","st":265,"et":345,"消文":[{"文":"前面已經講過，就是阿闍世王那個公案。說他永盡了，為什麼還要墮落？造了這個業，業相還是有的。"},{"文":"但他懺悔了，的的確確完全懺悔乾淨，所以雖然墮落，像拍球一樣，「通」一下下去，上來了。"},{"文":"問他無間地獄是什麼？他不曉得；那洛迦的火燄他也沒碰到。"},{"類":"下手","文":"想到這裡要好好懺悔——這是現在唯一的事情；懺悔了，功德增上。"}],"延伸":[],"逐字稿":[{"t":"65A 04:25","b":[["q","設作是云，未生怨王及殺母等，若已生起所餘善思，何故其業未得永盡，生無間耶？是為令於所有業果，發信解故，現示感生諸無間等，非是未能，無餘永盡所有諸業。如擊綵球，隨擊而躍，生彼即脫，雖那洛迦火燄等事，亦未能觸。"],["s","前面已經講過了，就是這個阿闍世王那個公案。他 ─你說他永盡了，他為什麼還要墮落呀？不，他造了這個業，這個業相還是有的，所以大家要了解。但是呢他懺悔了，的的確確完全懺悔乾淨了。他因為懺悔乾淨了，所以雖然墮落，所以像那個擊綵球，像拍球一樣，「通！」一下，下去，上來了。他到了無間地獄，問他無間地獄是什麼？他不曉得。所以那洛迦的火燄他也沒有碰到，那就是這個情況。你想到這裡的話，豈不是從根本圓滿了。啊，所以想到這裡，要好好懺悔啊！現在我們唯一的事情。是將來的惡果，懺悔，現在懺悔了以後能夠功德增上，就這個道理。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/005.mp3"},{"文":"由是則成，最極拔除諸惡根本，亦非諸業全無果報。」","口譯":"由此就成立：既能最徹底地拔除種種惡業的根本，也不是說諸業完全沒有果報。」","四家合註":"<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">以是故，<\/span>由是則成<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">修對治故，亦能<\/span>最極從根拔除<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">具力<\/span>諸惡，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">復能成立：『已作不消亡故，<\/span>亦非諸業<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">畢竟<\/span>全無果報。<span class=\"sjan sj-ba\">』<\/span>」","覺燈日光":null,"時":"65A 05:45","頁":148,"af":"65a","st":345,"et":367,"消文":[{"文":"不但惡業可以徹底淨除；反過來也了解，業一定要感果，至少還有這個形相。"}],"延伸":[],"逐字稿":[{"t":"65A 05:45","b":[["q","由是則成，最極拔除諸惡根本，亦非諸業全無果報。」"],["s","不但是惡的我們徹底淨除，但是反過來也了解，說這個業一定要感果的，至少還有這個形相。那麼下面有一點特別說明一下，這一點非常重要！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/006.mp3"},{"文":"«補特伽羅差別»一類，不決定者。《三摩地王經》說：「勇授大王，殺華月嚴，遂起追悔，為建塔廟，經九十五俱胝千歲，廣興供養，一日三時，悔除罪惡，善護尸羅，然壽沒後，生無間中，經六十二阿庾他俱胝劫，受盲目等無邊眾苦。」","口譯":"由於所對補特伽羅的差別，有一類是不決定的。《三摩地王經》說：「勇授大王殺了華月嚴，隨即生起追悔，為他建造塔廟，經過九十五俱胝千年，廣興供養，每天三時悔除罪惡，善護尸羅；然而壽命終了之後，生到無間地獄中，經過六十二阿庾他俱胝劫，領受眼盲等無邊的痛苦。」","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第九、一類補特伽羅雖不決定，然亦無過之理：<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">若爾，但唯串習對治，縱罪力大，亦必能從根本淨除之耶？由因業力極大，<\/span>補特伽羅差別一類，不決定者，《三摩地王經》說：勇授大王殺華月嚴，遂起追悔，建立塔廟廣興供養。經九十五俱胝千歲，一日三時，悔除罪惡，善護尸羅。然壽沒後，生無間中；經六十二阿庾他俱胝劫，受盲目等無邊眾苦。<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">無惱指鬘、娑嚩迦等典故，當從《賢愚》等別別經中了知。<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">設作是念：若爾，懺悔至此仍無義耶？<\/span>","覺燈日光":null,"時":"65A 06:07","頁":148,"af":"65a","st":367,"et":453,"消文":[{"文":"前面說可以永盡，這裡卻還有不一定的：補特伽羅——就是你造業的對象。"},{"文":"華月嚴是個菩薩；勇授大王殺了他就後悔，建塔廟、懺悔——照前面說四力應該都有了。"},{"文":"時間這麼長，廣興供養、一日三時悔除、善護尸羅，死了以後還生到阿鼻地獄，出來還受盲目等無邊眾苦。"}],"延伸":[{"題":"補特伽羅差別","組":[{"題":"傷大乘補特伽羅，最難懺","說":[{"類":"因","文":"為什麼這裡抵銷不掉？因為他殺的對象是大乘菩薩。"},{"類":"立","文":"傷的對象是人如此，傷的是法也一樣：謗大乘經典的罪過一樣難懺。"},{"類":"因","文":"大乘的法相、發了心的大菩薩跟法界相應；怎麼懺悔，就是沒辦法跟它相應。"},{"類":"例","文":"經上說三千大千世界眾生都證了果，不如對大乘經典的隨喜功德——《法華經》〈隨喜功德品〉。"}]},{"題":"發大菩提心，悔過力大","說":[{"類":"回扣","文":"黑板上懺悔支：違背大乘戒、傷害大乘行者、毀謗大乘佛法之難懺，這裡特別警惕；量到上士才說出來。"},{"類":"立","文":"反過來妙了：真正發大菩提心，心也跟法界相應，那時悔過的力量大得不得了。"}]}],"說":[{"類":"因","文":"為什麼這裡抵銷不掉？因為他殺的對象是大乘菩薩。"},{"類":"立","文":"傷的對象是人如此，傷的是法也一樣：謗大乘經典的罪過一樣難懺。"},{"類":"因","文":"大乘的法相、發了心的大菩薩跟法界相應；怎麼懺悔，就是沒辦法跟它相應。"},{"類":"例","文":"經上說三千大千世界眾生都證了果，不如對大乘經典的隨喜功德——《法華經》〈隨喜功德品〉。"},{"類":"回扣","文":"黑板上懺悔支：違背大乘戒、傷害大乘行者、毀謗大乘佛法之難懺，這裡特別警惕；量到上士才說出來。"},{"類":"立","文":"反過來妙了：真正發大菩提心，心也跟法界相應，那時悔過的力量大得不得了。"}],"af":"65a","st":461}],"逐字稿":[{"t":"65A 06:07","b":[["q","補特伽羅差別一類，不決定者。《三摩地王經》說：「勇授大王，殺華月嚴，遂起追悔，為建塔廟，經九十五俱胝千歲，廣興供養，一日三時，悔除罪惡，善護尸羅，然壽沒後，生無間中，經六十二阿庾他俱胝劫，受盲目等無邊眾苦。」"],["s","欸！前面告訴我們可以永盡的，這個地方卻還有不一定的喲！什麼呢？補特伽羅 ─說你造的對象。引經上面，說這麼一個人哪，勇授大王殺了一個華月嚴，為什麼？華月嚴是個菩薩，他把他殺了以後就後悔了，然後呢為他建塔廟，然後去懺悔。喔唷，不得了哦！照前面所說的這個懺悔的話，他四力應該都有了。經這麼長，「九十五俱胝千歲」，而且「廣興供養」，而且一天三時地悔除罪過，而且善護尸羅，但是死了以後還生到無間當中，生到阿鼻地獄。時間經過這麼長，出來了以後，「受盲目等無邊眾苦」。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/007.mp3"},{"文":"雖則如是，然其悔罪非為唐捐。","口譯":"雖然是這樣，但他的悔罪並沒有白費。","四家合註":"雖則如是，然其悔罪非為唐捐。","覺燈日光":null,"時":"65A 07:33","頁":148,"af":"65a","st":453,"et":461,"消文":[{"文":"雖然這樣，他的懺悔還是沒有白費。"}],"延伸":[],"逐字稿":[{"t":"65A 07:33","b":[["q","雖則如是，然其悔罪非為唐捐。"],["s","雖然這樣哦，但他的懺悔還是沒有白費哦！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/008.mp3"},{"文":"若不悔除，須受極重恆常大苦，尤過彼故。","口譯":"因為如果不悔除，就必須領受極重而恆常的大苦，比那個還要嚴重的緣故。","四家合註":"若不悔除，須受極重恆常大苦，尤過彼故。<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">師云：如是具戒比丘，以還淨法淨除殺害旁生之墮，雖不能淨其罪，然前所作非為無義，以若不行還淨，則墮罪異熟及其衍息更尤重故。是故四力對治淨罪之理，雖由對治力之大小，與時之長短等，隨其所應，而有根除者、有重轉輕微者、有長時轉短時等。然凡所淨之分，即如種為火燒，縱然遇緣，終不生果。而將後世引至此生者，或如修長壽法，能將後世天身長壽引至此生等，有種種相。<\/span>","覺燈日光":null,"時":"65A 07:41","頁":148,"af":"65a","st":461,"et":580,"消文":[{"文":"懺悔的力量還是有的，有多少懺悔的力量就抵銷掉多少。"}],"延伸":[],"逐字稿":[{"t":"65A 07:41","b":[["q","若不悔除，須受極重恆常大苦，尤過彼故。"],["s","他懺悔的力量還是有的，他有多少懺悔的力量就抵銷掉多少。那麼為什麼這個地方抵銷不掉呢？因為他所殺的那個對象，他是一個大乘的菩薩。所以如果說你傷的對象是人，這樣；如果你傷的對象是法，也是一樣。所以注意喔！這個謗大乘經典的這個罪過的難懺也是一樣，難懺悔也是一樣喔！因為這個大乘的法相是什麼？跟法界相應的。發了心的這個眾生 ─大菩薩跟法界相應的；你怎麼懺悔，你就是沒有辦法跟這個東西相應。這個羅漢，那個怎麼個弄法 ─所以處處地方，經上面說，哎呀，三千大千世界所有的眾生證了果了，對不起！你不如那個對大乘經典，乃至於隨喜的功德等等，《法華經》上面〈隨喜功德品〉有這件事情。"]]},{"t":"65A 08:47","b":[["s","關於這一點，講到將來這個上士的時候，才說出這個量來，這一點我們要注意啊！所以黑板上關於這一點，懺悔支，為什麼違背，尤其是大乘戒，以及對於這個大乘的行，以及對大乘的法，傷害了這個大乘的行者，以及毀謗了這個大乘的佛法之難懺。這個地方就特別告訴我們一下，特別警惕一下。但是反過來，妙咧！假定你真正地能夠發大乘的大菩提心的話，欸，妙咧！因為你的心也跟法界相應，那個時候你這個悔過的力量之大，是大得不得了！這個到後面慢慢、慢慢地再去講它，再去講它。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/009.mp3"},{"文":"又由悔護清淨無餘，然從最初無罪染之清淨，及由悔除清淨之二，有大差殊。","口譯":"又，雖然由悔除和防護可以清淨無餘，但是從最初就沒有罪染的清淨，和由悔除而得的清淨，這兩者有很大的差別。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第五、勵力於初即當不沾染之理者：<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如是<\/span>又由<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">具相<\/span>懺悔防護<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">罪惡<\/span>清淨無餘，然從最初無罪染之清淨，及由懺悔清淨之二，有大差殊。","覺燈日光":null,"時":"65A 09:40","頁":148,"af":"65a","st":580,"et":605,"消文":[{"文":"雖然可以懺乾淨，但懺乾淨跟一開始沒有犯，兩樣東西有絕大的差別。"}],"延伸":[],"逐字稿":[{"t":"65A 09:40","b":[["q","又由悔護清淨無餘，然從最初無罪染之清淨，及由悔除清淨之二，有大差殊。"],["s","雖然可以懺乾淨，但是這個懺乾淨跟一開始沒有犯，兩樣東西有絕大的差別哦！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/010.mp3"},{"文":"猶如〈菩薩地〉中所說，犯根本罪，雖可重受菩薩律儀，而能還出，然於此生，決定不能獲得初地。","口譯":"就像〈菩薩地〉中所說：犯了根本罪，雖然可以重新受菩薩律儀而從罪中還出，但是在這一生之中，決定不能獲得初地。","四家合註":"猶如《菩薩地》中所說，犯根本罪雖可重受菩薩律儀而能還出，然於此生決定不能獲得初地。","覺燈日光":null,"時":"65A 10:05","頁":148,"af":"65a","st":605,"et":659,"消文":[{"文":"犯了根本罪完全壞掉；懺悔乾淨重受，清淨這一點一樣，證得功德那一點就不一樣：這一生決定不能獲得初地。"},{"文":"末法好像總是沒希望；其實到現在都還有圓滿的教法，有這個可能。"},{"文":"所以根本戒絕對重要，絕對不能破壞，原因在此。"}],"延伸":[],"逐字稿":[{"t":"65A 10:05","b":[["q","猶如〈菩薩地〉中所說，犯根本罪，雖可重受菩薩律儀，而能還出，然於此生，決定不能獲得初地。"],["s","〈菩薩地〉上面告訴我們，你犯了根本罪以後，唉，完全壞掉了。壞掉了以後，你雖然懺悔乾淨，重受，你還是可以得到清淨。對於得到清淨那一點來說是一樣的，但是要證得功德那一點來說，那就不一樣了，這一生哪，你決定不能獲得初地。以我們現在來說，因為我們末法了，我們好像總是沒有希望。實際上正法的時候 ─是！有這個可能。實際上一直到現在，都尚且有這個圓滿的教法，有這個可能。所以它那個根本的戒是絕對、絕對地重要！絕對不能破壞！原因就在此。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/011.mp3"},{"文":"《攝研磨經》亦云：「世尊，設若有一，«由近惡友增上力故»，造作如此誹謗正法，世尊爾時如何能脫此罪。作是請已，世尊告妙吉祥童子云，曼殊室利，設七年中，一日三時於罪悔罪，後乃清淨，其後至少須經十劫，始能得忍。」","口譯":"《攝研磨經》也說：「世尊！假如有人由於親近惡友的增上力，造作了這樣誹謗正法的罪，世尊，那時他要怎樣才能脫離這罪？」這樣請問後，世尊告訴妙吉祥童子說：「曼殊室利！假如在七年之中，每天三時對所犯的罪悔罪，之後才得清淨；在那之後至少還要經過十劫，才能得忍。」","四家合註":"《攝研磨經》亦云：「世尊，設若有一由近惡友增上力故，造作如此誹謗正法。世尊，爾時如何能脫此罪？作是請已，世尊告妙吉祥童子云：曼殊室利，設七年中，一日三時於罪懺罪，後乃清淨，其後至少須經十劫，始能得忍。」","覺燈日光":null,"時":"65A 10:59","頁":148,"af":"65a","st":659,"et":843,"消文":[{"文":"馬上引經證明：文殊菩薩問世尊，有人誹謗正法怎麼辦。"},{"文":"犯了以後七年當中一日三時悔過，可以清淨；但至少要經過十劫才能得忍——證得初地無生法忍。"},{"類":"下手","文":"這個戒千萬不能犯，尤其謗正法戒、對菩薩的瞋恨心；對大乘教法沒有正確認識前，千萬不要順著自己的知見亂來。"}],"延伸":[{"題":"由近惡友增上力故","組":[{"題":"一切壞處從惡友來","說":[{"類":"回扣","文":"前面一開始說：一切好處都從善知識來；反過來，一切壞處從惡友、惡知識來。"},{"類":"立","文":"這裡不講惡知識、不講壞蛋，講「惡友」——是你的好朋友，跟你滿好，但沒有正知見。"}]},{"題":"似是而非，要有知見判別","說":[{"類":"例","文":"惡友來同情你：「你這麼辛苦，常住的規定真不合理，叫你做這些事情！」"},{"類":"下手","文":"要有自己的知見去判別：常住不如理，你應該離開；常住如理，那個惡友趕快遠離。"},{"類":"立","文":"惡知識說的相似、似是而非，講起來很有道理；跟他在一起，這種虧吃起來不得了地嚴重。"}]}],"說":[{"類":"回扣","文":"前面一開始說：一切好處都從善知識來；反過來，一切壞處從惡友、惡知識來。"},{"類":"立","文":"這裡不講惡知識、不講壞蛋，講「惡友」——是你的好朋友，跟你滿好，但沒有正知見。"},{"類":"例","文":"惡友來同情你：「你這麼辛苦，常住的規定真不合理，叫你做這些事情！」"},{"類":"下手","文":"要有自己的知見去判別：常住不如理，你應該離開；常住如理，那個惡友趕快遠離。"},{"類":"立","文":"惡知識說的相似、似是而非，講起來很有道理；跟他在一起，這種虧吃起來不得了地嚴重。"}],"af":"65a","st":659}],"逐字稿":[{"t":"65A 10:59","b":[["q","《攝研磨經》亦云：「世尊，設若有一，由近惡友增上力故，造作如此誹謗正法，世尊爾時如何能脫此罪。作是請已，世尊告妙吉祥童子云，曼殊室利，設七年中，一日三時於罪悔罪，後乃清淨，其後至少須經十劫，始能得忍。」"],["s","馬上證明經上面的。這個是文殊菩薩問世尊，那麼世尊就告訴他，說有一個人哪，他假定「誹謗正法」，前面一句話很重要哦，「由近惡友增上力故」。前面一開始告訴我們，一切的好處都從善知識來，反過來，一切的壞處是從惡友、惡知識。這個地方注意啊！他不講惡知識，他不講壞蛋，講「惡友」，這是你的好朋友哦！但是這個好朋友，他沒有正知見，欸，他還跟你滿好囉！哎呀，這個東西呀，來同情你，說：「某人哪！你這麼辛苦，這個常住的規定真不合理，叫你做這些事情哦！」對不起，你那時候要有自己的知見去判別、判別。如果常住的確不如理，你應該離開，如果常住是如理的話，那個惡友你趕快遠離。你碰著他一塊的時候，有你虧吃的，這種虧吃起來是不得了地嚴重哦！這一點，真正修學佛法最好的是莫過於善知識，反過來，最嚴重的是莫過於惡知識。他惡知識說的有相似，似是而非的，講起來很有道理哦！現在我們很容易碰見這種情況，很容易碰見這種情況。"]]},{"t":"65A 12:57","b":[["s","那個時候你如果說「誹謗」啦，那麼，怎麼辦呢？佛就告訴我們，你犯了這個罪以後，七年當中，「一日三時於罪悔過」，要經過這麼長如法如理努力，你可以。但是至少要經過十劫，才能夠「得忍」。要經過這麼長的時候，才能夠證得初地無生法忍。這麼長的時候，喔！這個時間，還是非常嚴重啊！所以，注意啊！這個戒是千萬不能犯，尤其是謗正法戒，以及對菩薩的瞋恨心這一類。最主要的就對大乘教法，在我們沒有正確認識之前啊，千萬不要隨意這個順著自己的知見亂來。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/012.mp3"},{"文":"此說諸惡雖已清淨，然得忍位，任如何速，須經十劫。是故無餘清淨之義，謂是能感非悅意果，無餘永淨。","口譯":"這是說種種惡業雖然已經清淨，但要得到忍位，不論多快，都必須經過十劫。所以「無餘清淨」的意義，是指能感得不悅意果報的那部分，毫無剩餘地永遠清淨。","四家合註":"此說諸惡雖已清淨，然得忍位，任如何速，須經十劫。是故無餘清淨之義，謂是能感非悅意果無餘永淨，","覺燈日光":null,"時":"65A 14:03","頁":149,"af":"65a","st":843,"et":869,"消文":[{"文":"「無餘清淨」是指感惡果的那個惡業，可以完全弄乾淨。"}],"延伸":[],"逐字稿":[{"t":"65A 14:03","b":[["q","此說諸惡雖已清淨，然得忍位，任如何速，須經十劫。是故無餘清淨之義，謂是能感非悅意果，無餘永淨。"],["s","喏，這個說明了，所以「無餘清淨」是指什麼而言？就是感惡果的這個惡業，可以完全弄乾淨，對於道的證等，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/013.mp3"},{"文":"起道證等，極為遙遠，故應勵力，令初無犯。","口譯":"但要生起道的證德等等，卻極為遙遠；所以應當努力，讓自己從一開始就不犯。","四家合註":"起道證等，極為遙遠，故應勵力，令初無犯。","覺燈日光":null,"時":"65A 14:29","頁":149,"af":"65a","st":869,"et":894,"消文":[{"文":"對於道的證德，極為遙遠；所以一開始就不要犯。"},{"文":"哪怕再小的戒，你把它看得最大，對我們絕定有好處。"}],"延伸":[],"逐字稿":[{"t":"65A 14:29","b":[["q","起道證等，極為遙遠，故應勵力，令初無犯。"],["s","所以我們一開始的時候不要犯。說到這裡，為什麼我們對小小戒要感到，哪怕再小的戒，你把它看得最大的，對我們絕定有好處，對我們絕定有好處！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/014.mp3"},{"文":"是故聖者，於微小罪，«雖為命故，不故知轉»。若懺悔淨，與初無犯二無差別，是則無須如是行故，即如世間，亦可現見傷手足等，雖可治療，然終不如初未傷損。","口譯":"所以聖者對於微小的罪，即使是為了保全性命，也不會明知故犯。如果懺悔所得的清淨與最初不犯沒有差別，那就不需要這樣做了。就像世間也可以看到，手腳等受了傷，雖然可以治療，但終究不如最初沒有受傷。","四家合註":"<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">如云：「邪見謗法瞋，根本墮悔行，增上慢驕滿，愛著利敬故，蔑俗菩薩師，是盡善法因。」應當慎防此等，勵力懺罪。<\/span>故說聖者於微罪墮，雖為命故，不故知轉。若懺悔淨與初無犯二無差別，是則無須如是行故。即如世間，亦可現見傷手足等，雖可治療，然終不如初未傷損。","覺燈日光":null,"時":"65A 14:54","頁":149,"af":"65a","st":894,"et":1116,"消文":[{"文":"真正的聖者就是這樣；我們要學佛，就要努力去學。"},{"文":"不是馬上教我們做到，而是因地當中種下這個種子，將來很容易做到。"},{"類":"下手","文":"常常想：「聖者尚且如此，我凡夫怎麼可以？我要努力！」做不到也不會錯到哪裡去，慢慢罪障淨除、資糧集聚。"},{"文":"「若懺悔淨…然終不如初未傷損」這幾句師父沒有唸，也沒有另外解。"}],"延伸":[{"題":"雖為命故，不故知轉","組":[{"題":"隨方毘尼的藉口","說":[{"類":"例","文":"有人說：「這是佛三千年前制的，時代、地點跟現在不一樣，佛不是說隨方毘尼嗎？佛在現在制的戒也一定不是這樣。」"},{"類":"破","文":"講得很有道理，心裡就輕棄掉這個戒；找了最大的藉口也不知道，由一點小地方引發非常嚴重的。"}]},{"題":"為何我感得末法","說":[{"類":"下手","文":"要想：時地是有不同，但請問（問我自己）——為什麼我感得現在的末法，感不到世尊正法的時候？"},{"類":"立","文":"一想到這裡就慚愧、懊悔，拼命都來不及；知見就差這一點點。"}]},{"題":"戰戰兢兢，隨順環境","說":[{"類":"立","文":"客觀環境的確如此，慢慢隨順；戰戰兢兢，心裡覺得「沒辦法也只好這樣」——那時用隨方毘尼就對了。"},{"類":"立","文":"這樣念佛沒問題：欣、厭之心生起，覺得自己一無是處、唯一依靠是佛，一心念佛，一定去。"},{"類":"例","文":"就算沒有，把持正見，最多掉落龍當中，彌勒佛出世時解脫。"},{"類":"回扣","文":"虛空可以變，佛講的話絕對不會差，這是絕對信得過的。"}]}],"說":[{"類":"例","文":"有人說：「這是佛三千年前制的，時代、地點跟現在不一樣，佛不是說隨方毘尼嗎？佛在現在制的戒也一定不是這樣。」"},{"類":"破","文":"講得很有道理，心裡就輕棄掉這個戒；找了最大的藉口也不知道，由一點小地方引發非常嚴重的。"},{"類":"下手","文":"要想：時地是有不同，但請問（問我自己）——為什麼我感得現在的末法，感不到世尊正法的時候？"},{"類":"立","文":"一想到這裡就慚愧、懊悔，拼命都來不及；知見就差這一點點。"},{"類":"立","文":"客觀環境的確如此，慢慢隨順；戰戰兢兢，心裡覺得「沒辦法也只好這樣」——那時用隨方毘尼就對了。"},{"類":"立","文":"這樣念佛沒問題：欣、厭之心生起，覺得自己一無是處、唯一依靠是佛，一心念佛，一定去。"},{"類":"例","文":"就算沒有，把持正見，最多掉落龍當中，彌勒佛出世時解脫。"},{"類":"回扣","文":"虛空可以變，佛講的話絕對不會差，這是絕對信得過的。"}],"af":"65a","st":938}],"逐字稿":[{"t":"65A 14:54","b":[["q","是故聖者，於微小罪，雖為命故，不故知轉。"],["s","真正的聖者就是這樣的，現在我們不是要學佛嗎？對！我們要努力去學。這一點要再說一下，不是說馬上教我們做到，但是我們因地當中啊，要種下這個種子，你種下這個種子，你將來很容易做到。所以我們常常想：「哎呀，我是個凡夫啊！聖者尚且如此，我凡夫怎麼可以？我要努力啊！」你一直這樣子去想！雖然你做不到，你不會錯到哪裡去。你努力地做，慢慢、慢慢地罪障淨除了，慢慢地資糧集聚了，有一天你很容易做到。"]]},{"t":"65A 15:38","b":[["s","如果你不這樣想，反過來，你現在有人說：「哎呀，這個是佛在三千年以前制的啦！那個是時代啊，那個時候所處的地點跟現在不一樣啦！佛不是說那個隨方毘尼嗎？對啊！現在時間也不同，地點也不同，這個也你不要去管它啦！」欸，講得很有道理啊！然後你還自己覺得：「欸，如果是佛在現在的話，制的戒也一定不是這樣的哦！」你講得很有道理，很容易地，你心裡面就輕棄掉了這個戒。然後呢，自己找了最大的藉口也不知道，下面去，很可能由這樣一點小小的地方，引發了非常嚴重的，非常嚴重的。所以我們必定要想：「是啊！沒有錯，這個時、地是有不同的，但是請問（這個所謂請問是問我自己啊），為什麼我感得現在的末法，感不到世尊正法時候啊？」你為什麼不從這個眼光去想？你一想到這裡就慚愧，然後你就懊悔，拼命都來不及，還會說：「對啊！三千年以前的，如果世尊在現在的時候不這樣了！」你這個概念就整個改掉了，所以這個知見就差一點點哦！這一個概念我們要了解哦！"]]},{"t":"65A 17:10","b":[["s","並不是說一定要教你怎麼樣，然後你做的時候，我們做，仍舊是 ─是的，環境固然是如此嘛，我的的確確這客觀的環境就是如此啊！那我還在慢慢、慢慢地、慢慢地隨順著這個，這個倒是千真萬確的。那個時候你用那個隨方毘尼，那就對了！你是戰戰兢兢地，心裡總覺得：唉！那沒辦法，沒辦法也只好這樣。在這種情況之下如果是你念佛，沒問題，可以念得去。的的確確你能夠欣、厭之心生起來，你把持住這個，一心念佛。因為什麼？你心裡面造的業是什麼業？你感覺得：唉，這個是一無是處；然後你唯一的依靠是他，雖然你做不圓滿，你的業是這個嘛，到那時候你一定去。就算你沒有這個，你把持這個正見，將來你最多掉落龍當中，欸！到彌勒佛出世的時候你解脫了。經上面告訴我們清清楚楚，佛說的話，前面說的，虛空可以變哪，佛講的話是絕對不會一點點差的，這是我們絕對可以信得過的一件事情，就在這裡。繼續下去。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/015.mp3"},{"文":"如是勵力，如《集法論》云：「若作諸惡未修福，誤失正法得非法，具惡業人死怖畏，如於大海散朽船。","口譯":"應當這樣努力，如《集法論》說：「如果造作種種惡業而沒有修福，誤失了正法而得到非法，這種具有惡業的人臨死時會恐怖畏懼，就像在大海中乘著快要散掉的朽船。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第六、須當修持之喻者：<\/span>如是勵力，如《集法論<span class=\"sjan sj-ba\">．<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">罪惡品<\/span>》云：「<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">其因緣者，能仁於舍衛城現大神變，制伏富蘭那等，而說此二偈。<\/span>若作諸惡未修福，誤失正法得非法，具惡業人死怖畏，如於大海散朽船。","覺燈日光":null,"時":"65A 18:36","頁":149,"af":"65a","st":1116,"et":1153,"消文":[{"文":"造了很多壞事，沒有積福，傷害了正法，做的都是非法；這樣造惡業的人死的時候就恐怖。"},{"類":"喻","文":"像在大海裡面乘一艘破爛的爛船。"}],"延伸":[],"逐字稿":[{"t":"65A 18:36","b":[["q","如是勵力，如《集法論》云：「若作諸惡未修福，誤失正法得非法，具惡業人死怖畏，如於大海散朽船。"],["s","造了很多壞事，沒有積福，然後呢正法傷害了，做了都是非法的。像這樣的造惡業的人，死的時候就恐怖，為什麼呀？像大海裡面乘一個破爛的爛船一樣，乘一個破爛的爛船一樣。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/016.mp3"},{"文":"若已修福未作惡，行諸善士妙法軌，«此則終無死亡怖»，如乘固船登彼岸。」","口譯":"如果已經修福而沒有作惡，奉行諸善士的妙法軌則，這樣的人終究不會有死亡的恐怖，就像乘著堅固的船登上彼岸。」","四家合註":"若已修福未作惡，行諸善士妙法軌，此則終無死亡怖，如乘固船登彼岸。」莫依前作，應如後者勵力而行。","覺燈日光":null,"時":"65A 19:13","頁":149,"af":"65a","st":1153,"et":1454,"消文":[{"文":"造了種種福業，惡業沒有造，所有行為都是「妙法軌」，不是普通的善。"},{"類":"喻","文":"乘堅固的船：在海裡不出毛病，而且到彼岸去，高興快樂，哪裡會恐怖？"}],"延伸":[{"題":"此則終無死亡怖","組":[{"題":"如法行持，死時歡喜","說":[{"類":"例","文":"古人到死的時候高高興興到處告別：「再過幾天我要走了！」等著阿彌陀佛來接，哪有不歡喜？"},{"類":"立","文":"不但古人，如法行持的今人還是有，師父親眼看見。"},{"類":"下手","文":"你們只要如法去試，心裡也會生起這個量來。"}]},{"題":"受罵如還債，無債一身輕","說":[{"類":"立","文":"業感果，所以不必看果是什麼，看業是什麼；業從你心裡造起。"},{"類":"例","文":"人家罵你：「我前面欠了他的債，今天還了，高興！無債一身輕。」"},{"類":"例","文":"以前不知道：他罵我、我再罵他，永遠在地獄裡滾，偶然到人間又造大罪下去。"}]},{"題":"成就忍辱，病為策勵","說":[{"類":"立","文":"不但還了債，他還成就我的忍辱；沒有人來罵你，能忍辱、持戒、精進嗎？六波羅蜜的功德都靠他完成。"},{"類":"例","文":"生病也歡喜：病是還以前的惡業，現在要造善業；而且病是死因，趕快多念阿彌陀佛。"}]},{"題":"業重業近，臨終不怖","說":[{"類":"回扣","文":"業在生死當中的行相：第一個是重，第二個是近。"},{"類":"立","文":"以前造了重業一定去；業力不夠重，拼命念是「近」，一直保持這個念到死，一定到極樂世界。"},{"類":"回扣","文":"理路清楚了，去試，相應時一一現起，死的時候也不會怕。"}]}],"說":[{"類":"例","文":"古人到死的時候高高興興到處告別：「再過幾天我要走了！」等著阿彌陀佛來接，哪有不歡喜？"},{"類":"立","文":"不但古人，如法行持的今人還是有，師父親眼看見。"},{"類":"下手","文":"你們只要如法去試，心裡也會生起這個量來。"},{"類":"立","文":"業感果，所以不必看果是什麼，看業是什麼；業從你心裡造起。"},{"類":"例","文":"人家罵你：「我前面欠了他的債，今天還了，高興！無債一身輕。」"},{"類":"例","文":"以前不知道：他罵我、我再罵他，永遠在地獄裡滾，偶然到人間又造大罪下去。"},{"類":"立","文":"不但還了債，他還成就我的忍辱；沒有人來罵你，能忍辱、持戒、精進嗎？六波羅蜜的功德都靠他完成。"},{"類":"例","文":"生病也歡喜：病是還以前的惡業，現在要造善業；而且病是死因，趕快多念阿彌陀佛。"},{"類":"回扣","文":"業在生死當中的行相：第一個是重，第二個是近。"},{"類":"立","文":"以前造了重業一定去；業力不夠重，拼命念是「近」，一直保持這個念到死，一定到極樂世界。"},{"類":"回扣","文":"理路清楚了，去試，相應時一一現起，死的時候也不會怕。"}],"af":"65a","st":1153}],"逐字稿":[{"t":"65A 19:13","b":[["q","若已修福未作惡，行諸善士妙法軌，此則終無死亡怖，如乘固船登彼岸。」"],["s","反過來，你造了種種的福業，而惡業呢沒有造。然後你所有的行為都是什麼？「妙法軌」，這個善不但是普通的，妙法啊！這樣情況之下，你對死亡你就不會恐怖。就像什麼？乘一個堅固的船，在海裡不會出毛病，第一個。而且這個船幹什麼？到彼岸去，本來這個地方是一無是處，現在有這麼一個好的船到彼岸去，你高興快樂，哪裡會恐怖？不會恐怖，這也是千真萬確的事實。你看古人這種狀態，古人這種狀態，他到死了以後，他高高興興地到處去告別：「某人啊，再過幾天我要走了！」他心裡好歡喜，為什麼歡喜？再過幾天，他不要在這個娑婆世界受苦了，到極樂世界去了，然後等著阿彌陀佛來接他，哪有不歡喜的事情？不但古人，這個說「古人」的話，就是如法行持的，今人還是有這種人，這是我親眼看見的。你們不妨去自己試試看，你們只要如法去試的話，你們自己心裡面也會生起這個量來，我告訴你。就這麼千真萬確！"]]},{"t":"65A 20:54","b":[["s","我可以立刻舉個例子來告訴你，業─感果，所以我們不必看果是什麼，我們看業是什麼。業是哪裡造起？你心裡造起。如果你現在懂得了以後，那麼人家來罵你了，以前是罵你的時候，照你平常的知見：這個傢伙沒有道理，怎麼跑得來罵我？現在你懂得了這個道理以後，那簡單得很啊！你有道理，他又偏偏罵你的話，「我前面欠了他的債。啊！好，今天還了他，高興！無債一身輕。」更進一步啊：欸，以前不知道，輾轉地來，他罵我，我再罵他；他再罵我，我再罵他 ……永遠在地獄裡面滾。偶然跑到人世間，人世間才得到一 ……這個罪剛輕一點點，偶然跑到人世間又造了大罪，下去！我現在懂得了這個道理以後，以前到了大苦消完了，跑到人間把他還債了，得到了這個機會還掉了，啊，真高興！這第一個高興。"]]},{"t":"65A 22:07","b":[["s","第二個呢，我現在不但是還了債，而且還要向上，他成就我的忍辱。喔，你正更高興啊！假定沒有這個人來罵你，請問你能忍辱嗎？請問你能持戒嗎？請問你能精進嗎？從這個地方說起來，所有的這個六波羅蜜的功德，都靠他讓你完成的，那個時候你想到你歡喜，啊呀，你這歡喜得不得了！眼前很簡單一件事情，他罵你嘛，你也歡喜，然後你生病嘛，你也歡喜。為什麼？同樣的道理呀，對心上面他是罵你，對身上面就是病痛嘛！一樣的道理。啊，那現在好極了，正好因為那個病策勵你說，那以前為什麼生病？那以前造的惡業，因為惡業所以生病；現在呢，我了解了，那個病是還以前的惡業，可是現在我要造善業啊！而且病是死因，喔唷，趕快多念阿彌陀佛，念得清清楚楚，曉得每一句話，拼命念。"]]},{"t":"65A 23:18","b":[["s","如果說你以前已經造了「重」的業的話，那是一定去；如果說你的業力不夠重的話，你拼命地念，這是「近」，對不對？我們業在生死當中的行相是什麼？第一個是重，第二個是近。所以病是死因，現在病完了要死，所以你現在拼命念，嘎啦、嘎啦念，一直保持這個念。如果念到死的話，到那個時候一定到極樂世界去嘛！這不是很清楚、很明白嗎？你當下就可感受得到，想想看對不對？理路現在清楚了，你們只要去試，你真正地試到相應的時候，一一會現起。所以說古人、古人哪，所以真正地說起來，就是如法的道理他去做了。比起現在這個人人做不到的差別，你只要去做，就是這樣，所以死的時候你也不會怕。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/017.mp3"},{"文":"莫依前作，應如後行。此復若說眾多應理言辭而放逸轉，義利微劣。","口譯":"不要照前一種去做，應當照後一種去行。這又是說：如果說了很多合理的言辭，卻放逸而轉，所得的義利就很微少。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第七、須如所知不放逸而修持者：<\/span>此復若<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">口中<\/span>說眾多應理<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">具正因之<\/span>言辭<span class=\"sjan sj-ba\">，<\/span>而<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">趣修時則<\/span>放逸轉，義利微劣。","覺燈日光":null,"時":"65A 24:14","頁":149,"af":"65a","st":1454,"et":1486,"消文":[{"文":"再叮囑一下：說了很多如理的，頭頭是道，但行為不相應，義利很少——還是有，但太少。"}],"延伸":[],"逐字稿":[{"t":"65A 24:14","b":[["q","莫依前作，應如後行。此復若說眾多應理言辭而放逸轉，義利微劣。"],["s","下面再叮囑我們一下，雖然你說了很多如理的，講的道理是頭頭是道，但是你的行為不相應啊，這個義利很少；還是有道理的，但是太少。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/018.mp3"},{"文":"若有僅知微少法義，然«隨所知正行取捨»，義利殊大。","口譯":"如果有人僅僅知道少許的法義，卻能隨著所知道的正確地行持取捨，所得的義利就非常大。","四家合註":"若有僅知微少法義<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">文辭<\/span>，然隨所知<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">起於修持<\/span>正行取捨，義利殊大。","覺燈日光":null,"時":"65A 24:46","頁":149,"af":"65a","st":1486,"et":1697,"消文":[{"文":"知道的雖然少，能照著它正確行持，該取的取、該捨的捨，義利就大了。"},{"文":"注意：不是鼓勵我們不要懂得多，是鼓勵懂得了以後要能如法行持。"}],"延伸":[{"題":"隨所知正行取捨","組":[{"題":"如法思惟，越想越高興","說":[{"類":"例","文":"一位同修每次講完就用這道理去觀察，越學越高興；師父再補充，「哎呀，我怎麼以前沒有想到！」"},{"類":"因","文":"如法思惟，罪惡擋住了、煩惱消除了、功德增長了；煩惱的行相是苦苦惱惱，擋住了當然開開心心。"},{"類":"破","文":"放逸轉：聽的時候聽懂了，講也可以，書本一合，腦筋裡還是老樣子——沒有真正去想。"}]},{"題":"知道越多，功德越大","說":[{"類":"例","文":"他來罵你：只懂一點，只覺得「還債」；懂布施，「讓他罵罵消掉一點氣」就是無畏施；再懂持戒、忍辱、精進。"},{"類":"立","文":"知道得越多，功德越大；要把所知道的法義不要放逸，如理取捨。"}]},{"題":"莫誤解為少知即可","說":[{"類":"立","文":"知道得越多越好，知道的必定要如法行持；不能行持，倒不如少知一點——是這個意思。"},{"類":"破","文":"千萬不要誤解成「那我不要知道很多」，那就誤解了經義。"}]}],"說":[{"類":"例","文":"一位同修每次講完就用這道理去觀察，越學越高興；師父再補充，「哎呀，我怎麼以前沒有想到！」"},{"類":"因","文":"如法思惟，罪惡擋住了、煩惱消除了、功德增長了；煩惱的行相是苦苦惱惱，擋住了當然開開心心。"},{"類":"破","文":"放逸轉：聽的時候聽懂了，講也可以，書本一合，腦筋裡還是老樣子——沒有真正去想。"},{"類":"例","文":"他來罵你：只懂一點，只覺得「還債」；懂布施，「讓他罵罵消掉一點氣」就是無畏施；再懂持戒、忍辱、精進。"},{"類":"立","文":"知道得越多，功德越大；要把所知道的法義不要放逸，如理取捨。"},{"類":"立","文":"知道得越多越好，知道的必定要如法行持；不能行持，倒不如少知一點——是這個意思。"},{"類":"破","文":"千萬不要誤解成「那我不要知道很多」，那就誤解了經義。"}],"af":"65a","st":1534}],"逐字稿":[{"t":"65A 24:46","b":[["q","若有僅知微少法義，然隨所知正行取捨，義利殊大。"],["s","假定說你隨知道的，雖然少，你能夠照著它，照著所指導的去正確地行持，該取的是取，該捨的是捨，這個義利就大了。不過在這個地方注意喔！他不是鼓勵我們哪 ─那我們聽了這個話，哎呀，那我們不要懂得很多，懂得一點點就夠了。他這個地方不是鼓勵我們不要懂得多，要鼓勵我們懂得了以後，要能夠如法地行持，這個是重要的。這個是行持，欸，這個是重要的！"]]},{"t":"65A 25:34","b":[["s","所以我要馬上把一個道理，這也是我們同修之間，因為有一個同修來跟我談，哎呀，他說，他現在越學越高興啊！我們每次講完了以後，他就用這個道理去觀察，哎呀，觀察得很歡喜。他來告訴我，我覺得：是啊！然後呢我再給他補充。「哎呀！那我怎麼以前沒有想到。」我說：「對啊！」然後呢，你真正地能夠去想的話，這想得越多是越高興。這個為什麼高興？因為他如法地思惟的話，這個罪惡擋住了。罪惡擋住了，煩惱消除了，功德增長了。煩惱的行相是什麼？心裡苦苦惱惱嘛！你擋住了當然開開心心嘛！就這樣。差別在什麼地方呢？就說前面所說的，所知法義放逸轉的話，就像我們現在，哎呀，聽的時候聽懂了，講的時候可以，等到了聽完了、講完了書本一合，你腦筋裡還是老樣子。那個是什麼？放逸轉，你沒有真正去想啊！"]]},{"t":"65A 26:40","b":[["s","現在才告訴我們的，哪怕你是懂得一點點，你能夠隨著它去做，懂得一點點隨著它去做，都有義利；懂得更多隨著它去做更多，懂得越多是產生的效果越大。就像我們剛才那個比喻來說：比如說你懂得一點點，他來罵你，你只是覺得，啊，我前面欠了他的，還債啊！那你的快樂只有還債，只是如此而已。假定你能更懂得布施、持戒、忍辱、精進什麼等等的話，你就想，他罵你啊，總有他心裡不痛快的事情，「我讓他罵罵的話，他消掉一點氣的話，我布施，施於無畏，好啊！」就這樣。所以布施有了，然後呢，經上面告訴我們持戒，持戒的時候是什麼？欸，不管他外面怎麼樣，我裡面觀我們的身行啊，我可要照著這個戒去做啊，我在持戒。然後呢我忍辱、我精進。你知道得越多，你的功德豈不是越大，對不對？所以這個地方的真正重要是什麼？要把我們所知道這個法義不要放逸，如理取捨，這個要懂得哦！"]]},{"t":"65A 27:54","b":[["s","所以在這一個地方就告訴我們，的的確確你知道得越多越好，然後呢，知道的必定要如法行持。假定你不能行持的話，你倒不如少知一點，是這樣的意思。你千萬不要誤解了說：「啊，那、那、那我不要知道得很多。」那你就誤解了這個經義了。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/019.mp3"},{"文":"《集法句》云：「若人宣多如理語，放逸而不如是行，譬如牧人數他畜，彼非能得沙門分。","口譯":"《集法句》說：「如果有人宣說了許多如理的話，卻放逸而不照著去行，就像牧人替別人數牲畜一樣，他不能得到沙門的果分。","四家合註":"《集法句<span class=\"sjan sj-ba\">．<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">不放逸品<\/span>》云：「<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">其因緣者，提婆達多於王舍城中拳殺蓮花色比丘尼，又作種種非應行事，次於他時返會眾中，以多異門說法。時於近處，佛於午後又見牧人數牛而行，為此而說此偈。<\/span>若人<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">放逸如提婆達多，口中<\/span>宣多如理<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">具正因<\/span>語，<span>然<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">趣於修持之時，隨<\/span>放逸<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">轉<\/span>而不如是行<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">持<\/span>，譬如牧人<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">雖<\/span>數他畜，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">然僅能得薄少薪酬，不得其畜及其果利乳、酥油等，如是<\/span>彼<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">放逸者，但得擅於文辭之稱歎，<\/span>非能<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">獲<\/span>得<span class=\"sjan sj-ba\">〔<\/span>沙門分<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂沙門果<\/span>。<span class=\"sjan sj-ba\">〕<\/span>","覺燈日光":null,"時":"65A 28:17","頁":149,"af":"65a","st":1697,"et":1732,"消文":[{"文":"講了很多話，但不照著去做。"},{"類":"喻","文":"就像代人家放牛，一天到晚看著，牛是人家的；真正的沙門果——解脫的果，你得不到，因為沒有如理行持。"}],"延伸":[],"逐字稿":[{"t":"65A 28:17","b":[["q","《集法句》云：「若人宣多如理語，放逸而不如是行，譬如牧人數他畜，彼非能得沙門分。"],["s","就是這樣，講了很多話，但是不照著去做。就像給人家，代人家放牛一樣，對不起，你一天到晚看著牛是人家的，你得不到，這個真正的沙門 ─這解脫的果，你得不到，因為你沒有如理行持嘛！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/020.mp3"},{"文":"設雖少說如理語，然能正行法隨法，及能«遠離貪瞋癡»，此等能得沙門分。","口譯":"假使雖然只說了少許如理的話，卻能正確地行持法隨法行，並且能遠離貪瞋癡，這樣的人就能得到沙門的果分。","四家合註":"設雖少說如理語，然能<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如己所說<\/span>正行法隨法，及能斷除貪瞋癡，此等能得沙門分。","覺燈日光":null,"時":"65A 28:52","頁":149,"af":"65a","st":1732,"et":null,"消文":[{"文":"反過來就對了；正式的行持是什麼？「遠離貪瞋癡」，要注意。"}],"延伸":[{"題":"遠離貪瞋癡","組":[{"題":"看看你這個心","說":[{"類":"回扣","文":"黑板上這一個：真正懺悔，說來說去就這個。"},{"類":"因","文":"對三有不能認識它的真相，生不起厭離心，什麼都沒有用。"},{"類":"下手","文":"檢查自己最簡單：看看你什麼心？攀緣心趕快拿掉；真正利益他的心，增長它。"}]},{"題":"未能檢點，不敢出去","說":[{"類":"立","文":"這個地方很細緻；教法沒有正確認識之前，檢點不出來。"},{"類":"例","文":"師父也不敢出去：還沒辦法如實認識、檢點內心，出去儘管說弘法，不知不覺當中在損法。"},{"類":"回扣","文":"跟這個東西一相應，你就完了。"}]}],"說":[{"類":"回扣","文":"黑板上這一個：真正懺悔，說來說去就這個。"},{"類":"因","文":"對三有不能認識它的真相，生不起厭離心，什麼都沒有用。"},{"類":"下手","文":"檢查自己最簡單：看看你什麼心？攀緣心趕快拿掉；真正利益他的心，增長它。"},{"類":"立","文":"這個地方很細緻；教法沒有正確認識之前，檢點不出來。"},{"類":"例","文":"師父也不敢出去：還沒辦法如實認識、檢點內心，出去儘管說弘法，不知不覺當中在損法。"},{"類":"回扣","文":"跟這個東西一相應，你就完了。"}],"af":"65a","st":1732}],"逐字稿":[{"t":"65A 28:52","b":[["q","設雖少說如理語，然能正行法隨法，及能遠離貪瞋癡，此等能得沙門分。"],["s","這反過來，就對了。那麼正式的行持是什麼？「遠離貪瞋癡」，要注意喔！所以黑板上這一個，真正懺悔，說來說去就這個。如果說我們對於這個三有這個，是不能認識它的真相，生不起厭離心來的話，你什麼都沒有用。所以這個檢查自己最簡單，一看！看看你這個心，你什麼心？如果你攀緣心，趕快把它拿掉它，趕快把它拿掉它！"]]},{"t":"65B 00:11","b":[["s","如果不是這個，你真的利益他的心，你把它增長它，對了。但這個地方很細緻喔！我們到現在為止，說實在的，教法沒有正確認識之前，檢點不出來的。所以眼前真正重要的事情，對我們諸位住在這裡，我也是如此，我也不敢出去。儘管我跟你們講，但是我不敢出去的原因哪，我曉得，到現在為止，還沒辦法如真實的認識，還沒有辦法檢點自己的內心。一出去，儘管我說弘法，對不起，不知不覺當中在損法，跟這個東西相應了。跟這個東西一相應的話，你就完了！這一點我們要了解的。下面說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/021.mp3"},{"文":"比丘«樂防慎»，深畏諸放逸，自導出惡趣，如象出淤泥。","口譯":"比丘樂於防護謹慎，深深畏懼種種放逸，自己引導自己出離惡趣，就像大象從淤泥中走出來。","四家合註":"比丘樂防慎，深<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">怖<\/span>畏諸放逸，自導出惡趣，如象出淤泥。","覺燈日光":null,"時":"65B 00:55","頁":149,"af":"65b","st":55,"et":159,"消文":[{"文":"真正的出家人，應該努力地、謹慎地防護。"},{"文":"「深畏諸放逸」：體會到味道，才感覺放逸原來這麼可怕；現在還沒懂道理，最好信得過佛語。"},{"文":"造什麼業感什麼果；要跳出惡趣，還是自己把自己引導出來，從淤泥當中救出來。"}],"延伸":[{"題":"樂防慎","組":[{"題":"防出味道，越作越快樂","說":[{"類":"立","文":"還有一個「樂」，妙了！剛開始防的時候滿苦，真的防出味道來，越作越快樂。"},{"類":"例","文":"在座同修已經有幾位是這樣；正覺寺的女眾聽了，上面沒有安排自修，自己就開始自修起來。"},{"類":"立","文":"肯如法去做：剛開始覺得不是味道，慢慢快樂來了，到後來叫你不走這條路都辦不到——人人都是這個經驗。"}]}],"說":[{"類":"立","文":"還有一個「樂」，妙了！剛開始防的時候滿苦，真的防出味道來，越作越快樂。"},{"類":"例","文":"在座同修已經有幾位是這樣；正覺寺的女眾聽了，上面沒有安排自修，自己就開始自修起來。"},{"類":"立","文":"肯如法去做：剛開始覺得不是味道，慢慢快樂來了，到後來叫你不走這條路都辦不到——人人都是這個經驗。"}],"af":"65b","st":55}],"逐字稿":[{"t":"65B 00:55","b":[["q","苾芻樂防慎，深畏諸放逸，自導出惡趣，如象出淤泥。"],["s","我們真正的出家人，應該努力地去防護，謹慎地防護。還有一個「樂」，欸，妙咧！你剛開始防的時候滿苦的，等到你真的防出味道來是越作越快樂，啊，越作越快樂！在座的同修當中已經有幾位，這個千真萬確的事實。所以我的確鼓勵你們哪，不要說你們，下面那個正覺寺的女眾，她們聽見了以後，她們一再說。哎，我真讚歎！我們這裡，上面沒有自修，她們自己就開始自修起來了。你只要肯如法地去做，剛開始的時候是覺得，嗯，覺得不是味道，慢慢、慢慢地快樂來了，到後來是越來越快樂，到後來教你不走這個路是辦不到！人人都是這個經驗，所以這是快樂的事情。"]]},{"t":"65B 02:05","b":[["s","「深畏諸放逸」啊！你體會到了這個味道，那個時候你會感覺到，這個放逸原來這麼可怕。可是現在我們沒有懂得道理，最好信得過佛語，喔，這個放逸這個事情啊，很糟糕、很糟糕！你只有這樣地努力啊，那麼自然你造什麼業，感什麼果。所以要想跳出惡趣，還是你自己把自己引導出來，那個時候就把我們從淤泥當中救出來了。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/022.mp3"},{"文":"比丘樂防慎，深畏諸放逸，能抖一切惡，如風吹樹葉。」","口譯":"比丘樂於防護謹慎，深深畏懼種種放逸，就能抖落一切惡業，就像風吹落樹葉一樣。」","四家合註":"比丘樂防慎，深<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">怖<\/span>畏諸放逸，能抖一切惡，如風吹樹葉。」","覺燈日光":null,"時":"65B 02:39","頁":149,"af":"65b","st":159,"et":185,"消文":[{"文":"前面是象出淤泥，很辛苦；後面「風吹樹葉」，很輕鬆。"},{"文":"剛開始難，到後來風一吹，樹葉紛紛掉下來，惡業馬上消得乾乾淨淨。"}],"延伸":[],"逐字稿":[{"t":"65B 02:39","b":[["q","苾芻樂防慎，深畏諸放逸，能抖一切惡，如風吹樹葉。」"],["s","前面是象出淤泥，噢，這個很辛苦哦！到後面哪，「風吹樹葉」，啊，那個很輕鬆哦！是的，剛開始的時候是難的，到後來很輕鬆，風一吹，那個樹葉是紛紛都掉下來，這個惡業馬上就消得乾乾淨淨。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/023.mp3"},{"文":"如是《親友書》亦云：「若希善趣諸解脫，«願多修習於正見»，若人邪見雖妙行，一切皆具苦異熟。」","口譯":"同樣地，《親友書》也說：「如果希求善趣和解脫，願你多多修習正見；如果有人懷著邪見，縱然有美妙的行為，一切都具有痛苦的異熟。」","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第八、讚為正見，教令珍愛業果者：<\/span>如是《親友書》亦云：「若<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">國王汝<\/span>希<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">修得<\/span>善趣<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">現前增上生及決定勝──<\/span>諸解脫<span class=\"sjan sj-ba\">、<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">一切智<\/span>，願<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">亦當<\/span>多修習於<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">世間<\/span>正見，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">信解二業及果。其因相者，<\/span>若人邪見<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂善惡業不生苦樂果，<\/span>雖<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">當前威儀似行<\/span>妙行，一切<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">悉<\/span>皆具<span class=\"sjan sj-ba\">〔<\/span>酷<span>烈<\/span><span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">謂重大也。〕<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">痛苦<\/span>異熟<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">故<\/span>。」","覺燈日光":null,"時":"65B 03:05","頁":149,"af":"65b","st":185,"et":296,"消文":[{"文":"前面是經，下面是論；龍樹菩薩為什麼叫《親友書》？這才是真正的好朋友、親人，我、我、我才是冤家。"},{"文":"要求善趣、要求解脫，就「願多修習於正見」。"}],"延伸":[{"題":"願多修習於正見","組":[{"題":"有了正見，樣樣都來","說":[{"類":"立","文":"現在真正重要只有一件：有了正見，下面樣樣都來了。"},{"類":"破","文":"不是「我要學一學定」「趕快得到一心不亂」——不要！"},{"類":"立","文":"得到正見以後去念佛，一心不亂一定得到；壽命稍微長一點，三昧都可以。"}]},{"題":"邪見雖妙行，還是苦","說":[{"類":"立","文":"邪見的人，儘管行持很妙，不管做什麼，「具苦異熟」。"},{"類":"例","文":"就是出家人，身口七支防護得非常好，知見不正，結果還是苦的，何況普通人。"}]}],"說":[{"類":"立","文":"現在真正重要只有一件：有了正見，下面樣樣都來了。"},{"類":"破","文":"不是「我要學一學定」「趕快得到一心不亂」——不要！"},{"類":"立","文":"得到正見以後去念佛，一心不亂一定得到；壽命稍微長一點，三昧都可以。"},{"類":"立","文":"邪見的人，儘管行持很妙，不管做什麼，「具苦異熟」。"},{"類":"例","文":"就是出家人，身口七支防護得非常好，知見不正，結果還是苦的，何況普通人。"}],"af":"65b","st":185}],"逐字稿":[{"t":"65B 03:05","b":[["q","如是《親友書》亦云：「若希善趣諸解脫，願多修習於正見，若人邪見雖妙行，一切皆具苦異熟。」"],["s","前面是經，下面是論。那麼龍樹菩薩告訴我們，為什麼叫《親友書》啊？這個才是真正你的好朋友欸，這個才是你的親人欸！平常我們，我、我、我，我這個東西，我們的冤家欸！這個真正的好朋友，真正的親人怎麼告訴我們哪？說你如果要求善趣、要求解脫的話，那應該怎麼辦哪？這一句話，「願多修習於正見」。現在我們真正重要的只有一件事情，你有了正見哪，下面樣樣都來了，有了正見是下面樣樣都來了。所以現在我們真正重要的，不是說「哎呀，我要學一學定啊！」「我們要學一學什麼呀？」「哎喲，我趕快得到一心不亂哪！」不要！你得到了正見以後，去念佛的話，一心不亂一定得到。不要說一心不亂，三昧都可以，如果你壽命稍微長一點的話，這是千真萬確的事實。反過來「若人邪見雖妙行」，哦，如果邪見的話，他儘管他行持很妙，不管做什麼，「具苦異熟」。這不要說世間人哦，就是出家人，儘管他的行持非常好，身口七支防護得非常好，知見不正，結果還是苦的，何況是普通的人，何況是普通的人！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/024.mp3"},{"文":"此於緣起二業因果，正觀見者，乃是能成一切諸乘，及辦一切士夫義利，必不容少根本依處。","口譯":"這種對於緣起的黑白二業因果的正確觀見，是能成就一切諸乘、成辦一切士夫義利，必定不可缺少的根本依處。","四家合註":"此於緣起二業因果，正觀見者，乃是能成一切諸乘，及辦一切士夫義利，必不容少根本依處，","覺燈日光":null,"時":"65B 04:56","頁":149,"af":"65b","st":296,"et":360,"消文":[{"文":"「緣起」：空的道理這裡還沒講，因為是共下士；由於因果法則，苦樂因果如理如法一點不錯地見到。"},{"文":"人天、聲聞、緣覺、大乘一切諸乘，以及一切士夫所有的好處，這是「必不容少根本依處」——根本因。"},{"文":"目前真正要修學的第一件事情，就是這個。"}],"延伸":[],"逐字稿":[{"t":"65B 04:56","b":[["q","此於緣起二業因果正觀見者，乃是能成一切諸乘，及辦一切士夫義利，必不容少根本依處。"],["s","好！到這裡說，這個對於「緣起」 ─緣起的空的道理這裡還沒講，因為是共下士 ─由於因果的法則，然後呢苦樂的因果，你能夠如理如法一點都不錯，見到這個道理。這一件事情是什麼？一切諸乘 ─人天、聲聞、緣覺、大乘，以及一切士夫，所有的好處，這是「必不容少根本依處」。根本因！必不可少的。所以現在我們目前真正要修學的第一件事情，這個、這個！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/025.mp3"},{"文":"故應多閱前文所說，及《念住經》，《賢愚因緣》，《百業》，《百喻》，及《毘奈耶》，《阿笈摩》中，諸多因緣，並諸餘典，令起猛利恆常定解，應當持為極扼要義。","口譯":"所以應當多多閱讀前文所說的，以及《念住經》、《賢愚因緣經》、《百業經》、《百喻經》，還有《毘奈耶》、《阿笈摩》中的種種因緣故事，以及其他典籍，令自己生起猛利而恆常的定解，應當把這個執持為最極扼要的義理。","四家合註":"是故應以前說為徵，亦閱《念住經》、《賢愚因緣》、《百業》、《百喻》及《毘奈耶阿笈摩》中諸多因緣，並諸餘典，令起猛利恆常定解，應當持為極扼要義。","覺燈日光":null,"時":"65B 06:00","頁":149,"af":"65b","st":360,"et":484,"消文":[{"文":"照前面的道理，還要看《念住經》《賢愚因緣經》《百業經》《百喻經》《毘奈耶》，還有《雜寶藏經》、本生、本事。"},{"文":"「諸餘典」就是師父給大家看的《了凡四訓》《俞淨意公遇竈神記》《德育古鑑》。"},{"文":"看得越多印象越深，到「猛利恆常定解」：心裡確定不疑，而且繼續保持、力量恆常，作為修持最重要的。"},{"類":"回扣","文":"印光大師說「因果是律宗綱骨」；整個佛法戒定慧都建立在因果上。質有了，下面說量。"}],"延伸":[],"逐字稿":[{"t":"65B 06:00","b":[["q","故應多閱前文所說，及《念住經》，《賢愚因緣》，《百業》，《百喻》，及《毘奈耶》，《阿笈摩》中，諸多因緣，並諸餘典，令起猛利恆常定解，應當持為極扼要義。"],["s","所以我們應該照前面告訴我們的這個道理，還要《念住經》、《賢愚因緣經》、《百業經》、《百喻經》、《毘奈耶經》。還有很多哦，像《雜寶藏經》、本生，然後呢這個本事啊，都是這些。乃至於「諸餘典」，諸餘典就是我現在給你們看的《了凡四訓》、《俞淨意公遇竈神記》、《德育古鑑》啊，這些都是。你看得越多，你的印象越深，一直等到什麼程度才可以呢？「令起猛利恆常定解」，這個心裡的念頭確定不疑，而且這種確定不疑地繼續保持，不但繼續保持而且力量恆常，應該把這個作為我們修持最重要的，修持最重要的。"]]},{"t":"65B 07:24","b":[["s","所以印光大師也告訴我們說，因果是律宗綱骨。我們講戒律，真正的這個戒律的這個綱骨，什麼？因果！整個的佛法沒有別的，就是這個。因為它有因果，所以才講戒定慧，這個都建立在這個上頭的，這是我們要了解的。現在這個地方呢，就把這個道理說明。那麼現在好了，啊！這個道理懂得了，這個質有了，第二，量是什麼呢？第二。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-22/026.mp3"}],"投影片":[{"img":"投影片/shenxin-yeguo-22/001.webp","n":1},{"img":"投影片/shenxin-yeguo-22/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/shenxin-yeguo-22/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/shenxin-yeguo-22/004.webp","n":4},{"img":"投影片/shenxin-yeguo-22/005.webp","n":5},{"img":"投影片/shenxin-yeguo-22/006.webp","n":6},{"img":"投影片/shenxin-yeguo-22/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=64b&st1=1529&et1=1664","box":[0.124875,0.3591111111111111,0.12525,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-22/008.webp","n":8},{"img":"投影片/shenxin-yeguo-22/009.webp","n":9,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=64b&st1=1664&et1=1791","box":[0.539875,0.288,0.1315,0.07288888888888889]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/shenxin-yeguo-22/010.webp","n":10},{"img":"投影片/shenxin-yeguo-22/011.webp","n":11,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=65a&st1=12&et1=76","box":[0.123625,0.3591111111111111,0.1265,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-22/012.webp","n":12},{"img":"投影片/shenxin-yeguo-22/013.webp","n":13},{"img":"投影片/shenxin-yeguo-22/014.webp","n":14},{"img":"投影片/shenxin-yeguo-22/015.webp","n":15},{"img":"投影片/shenxin-yeguo-22/016.webp","n":16},{"img":"投影片/shenxin-yeguo-22/017.webp","n":17,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=65a&st1=143&et1=345","box":[0.546125,0.29466666666666663,0.1365,0.06844444444444445]}],"pho 我們綑死，所以要找歸依之處。"},{"類":"回扣","文":"歸依能解脫，原因是法；法的根本在業：總業果、別業果，最後懺悔，把以前的淨除、現在的防止。"},{"類":"立","文":"不再憂愁墮落，永遠保持暇滿人身，生生增上，最後達到圓滿佛地。"},{"類":"破","文":"說了一個道理不算；事實的內容不相應，說得多好聽，最後還是把你送下地獄。"},{"類":"立","文":"把道理如實去做，產生如實的功效，這才是生此意樂之量；生起以後還要令堅固。"},{"類":"破","文":"對現世放不下、看不破，所謂希求後世都是空話。"},{"類":"立","文":"共下士求的增上生是下一世；到了下一世，還是求下一世——到最後那個下一世，就是佛。"}],"複習":true,"af":"65b","st":1067}],"逐字稿":[{"t":"65B 08:04","b":[["q","第二生此意樂之量者。"],["s","這個檢查一下哦！質就是它對不對，那麼這個質要到什麼程度及內容的狀態："]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/001.mp3"},{"文":"謂先有無偽，希求現世，其求後世，«唯虛言辭»。","口譯":"就是說：如果先前心中有著不虛假的、真實的希求現世之心，那麼所謂的希求後世，只是空話而已。","四家合註":"謂先有無偽希求現世，其求後世唯虛言解。","覺燈日光":null,"時":"65B 08:18","頁":150,"af":"65b","st":498,"et":633,"消文":[{"文":"無偽：硬是不錯的，心裡面真的在求現世；在這種狀態當中，所求的後世就是空話。"},{"類":"回扣","文":"共下士真正的基礎就是求後世：臨終時現世是一堆灰，灰帶不去，惡業把你送到地獄。"},{"類":"下手","文":"不要說道理已經懂了；真懂的時候一看腦筋，「我現在忙的還是忙這個」，那不算。"}],"延伸":[{"題":"唯虛言辭","組":[{"題":"如理檢點，攀緣不起","說":[{"類":"立","文":"真正如理如法去檢點，那個攀緣心一點都找不到；攀的都是現在的事情。"},{"類":"例","文":"一跑到廚房看見好東西，覺得這是生生世世把我害得這樣苦的大冤家，排斥都來不及。"}]},{"題":"一點鹽巴，足足夠了","說":[{"類":"破","文":"還要講營養，這個不夠、那個不好，又要淡、又要鹹、又要甜。"},{"類":"立","文":"一點鹽巴千真萬確已經足足夠了；那一把骨頭都要燒掉。"},{"類":"下手","文":"與其忙這些事情，真正要忙的是忙在這裡；這個解決了，下面的自然解決。"}]}],"說":[{"類":"立","文":"真正如理如法去檢點，那個攀緣心一點都找不到；攀的都是現在的事情。"},{"類":"例","文":"一跑到廚房看見好東西，覺得這是生生世世把我害得這樣苦的大冤家，排斥都來不及。"},{"類":"破","文":"還要講營養，這個不夠、那個不好，又要淡、又要鹹、又要甜。"},{"類":"立","文":"一點鹽巴千真萬確已經足足夠了；那一把骨頭都要燒掉。"},{"類":"下手","文":"與其忙這些事情，真正要忙的是忙在這裡；這個解決了，下面的自然解決。"}],"af":"65b","st":569}],"逐字稿":[{"t":"65B 08:18","b":[["q","謂先有無偽，希求現世，其求後世，唯虛言辭。"],["s","我們檢查、檢查看，假定你現在心裡邊有「無偽」，什麼叫無偽？硬是不錯的。不錯，什麼不錯？「求現世」，你那心裡面求現世的。那麼在這種狀態當中，你所謂的求的後世就是空話。這個地方共下士哦，共下士告訴我們的真正的下士基礎什麼？就是求後世。為什麼要求後世？因為我們看得很清楚嘛！到臨終的時候，現世是什麼啊？現世是什麼啊？一堆灰！灰以外，惡業！灰是一點帶不去，然後呢，惡業是把你送到地獄裡面去。所以這現世是絕對不是我們需要的。你要檢查的話，很簡單，不要說道理已經懂了、已經懂了！你真的懂得道理的時候，你一看腦筋裡面覺得，喔唷，我現在忙的還是忙這個！對不起，那不算。"]]},{"t":"65B 09:29","b":[["s","所以你如果真正能夠如理如法去檢點的話，那個攀緣心是硬是一點找不到。你為什麼要攀？攀什麼？都是攀現在的這種事情。對外面既不攀，也裡邊、眼前也不攀。喔，你一跑到廚房裡，看見那個的好東西，你一看覺得這個大冤家，生生世世把我害得這樣苦啊！你排斥都來不及啊！這個就這麼清楚、就這麼明白。那還要講營養，這個又不夠，那個也不好，味道也不好；啊，又要吃淡的，又要吃鹹的，又要吃甜的！所以自然而然啊，不要說味精哪等等，醬油等等統統送掉了，一點鹽巴已經千真萬確已經足足夠了。沒有鹽巴，沒有鹽巴有什麼關係？那一把骨頭都要燒掉啦，這個是千真萬確的事實啊！所以現在才從這裡地方，注意，現在我們與其忙這些事情，應該真正忙的是忙在這裡。你把這個問題解決了，下面的自然解決了。所以，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/002.mp3"},{"文":"即換其位，","口譯":"若把兩者的位置對調，","四家合註":"即換其位，","覺燈日光":null,"時":"65B 10:33","頁":150,"af":"65b","st":633,"et":638,"消文":[{"文":"好極了！把它換一換。"}],"延伸":[],"逐字稿":[{"t":"65B 10:33","b":[["q","即換其位，"],["s","好極了！把它換一換。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/003.mp3"},{"文":"令成希求後世為主，現在為副，則為生起。","口譯":"變成以希求後世為主、現世為次要，這樣才算是生起了。","四家合註":"令成希求後世為主，現在為副，則為生起。","覺燈日光":null,"時":"65B 10:38","頁":150,"af":"65b","st":638,"et":703,"消文":[{"文":"求後世為主，現在為次要，那就生起來了。"},{"類":"立","文":"「現在」不是忽視，現在還要：修行要拿這個身體來修。"},{"類":"喻","文":"佛說飲食還是要的，像塗車的油；吃飽就好了。"},{"類":"因","文":"身體強弱，眼前營養只佔三分之一、四分之一，宿生的業力最主要；所以說喝水也會胖。"}],"延伸":[],"逐字稿":[{"t":"65B 10:38","b":[["q","令成希求後世為主，現在為副，則為生起。"],["s","嗯，要求後世 ─主，現在是次要的，那麼生起來了。「現在」不是忽視喔！現在還要。為什麼？你要修要拿什麼？要拿這個東西來修嘛，所以要的。所以佛告訴我們飲食還是要的，這像什麼？塗車的油，還是要的。所以他講的，你吃飽，吃飽就好了，就這樣。我們現在常常講營養，其實真正營養 ─心裡面，我告訴你們。前面已經說了太多、太多這種典型的例子了，所以假定你心裡真正提起來的話，都不是問題。尤其是我們現在了解的，你的所以真正的強弱等等的，這個眼前這個營養有沒有關係？有！三分之一，四分之一，宿生的業力最主要的。所以說吃水也是胖，千真萬確的事實。生起了以後還要什麼？"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/004.mp3"},{"文":"然須令堅固，","口譯":"然而還必須讓它堅固，","四家合註":"然須令堅固，","覺燈日光":null,"時":"65B 11:43","頁":150,"af":"65b","st":703,"et":706,"消文":[{"文":"生起來還要堅固。"}],"延伸":[],"逐字稿":[{"t":"65B 11:43","b":[["q","然須令堅固，"],["s","生起來還要堅固。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/005.mp3"},{"文":"故此生已，«仍須勵力善為修習»。","口譯":"所以生起之後，仍然要努力好好地修習。","四家合註":"故此生已，仍須勵力善為修習。","覺燈日光":null,"時":"65B 11:46","頁":150,"af":"65b","st":706,"et":1376,"消文":[{"文":"生起了還要努力，何況現在我們還沒有生起。"},{"文":"這是檢查我們的量。"}],"延伸":[{"題":"仍須勵力善為修習","組":[{"題":"半個大餅，中氣最足","說":[{"類":"例","文":"師父在美國，營養知識、環境都好，結果怎麼吃就怎麼瘦，怎麼弄也弄不好。"},{"類":"例","文":"到達隆撒拉，一杯白開水、半個大餅，中午半個饅頭，菜就一樣；十年來身體最好就是那段時候，中氣從來沒有那麼足過。"}]},{"題":"真正的健康是心力","說":[{"類":"立","文":"煩惱淨化以後，真正最好的健康是心力。"},{"類":"例","文":"母親發瞋心時分泌的奶，給老鼠吃會把老鼠弄死；一發瞋心，分泌的東西對人體有害。"},{"類":"立","文":"心裡一天到晚跟貪瞋癡相應，怎麼營養也弄不好；跟法相應了，不要太多營養。"},{"類":"例","文":"虛雲老和尚活一百二十歲，沒講過營養；老太太九十多歲，吃白飯豆腐乳，一百斤照挑不誤。"}]},{"題":"貪求現世，不是佛法","說":[{"類":"破","文":"千萬不要學了佛以後，腦筋裡還在這個上面；對貪求現世放不下，不是佛法。"},{"類":"下手","文":"處處提醒自己：慚愧呀，我現在還是不行，放不下；以這種心情努力深入，慢慢一天天就行了。"}]},{"題":"先認過患，自然放下","說":[{"類":"破","文":"不是叫我們馬上放下，這一點在知見上一定要認識。"},{"類":"下手","文":"前面告訴我們的方法都是訣竅：認識它的過患最重要，了解過患、努力思惟，將來很容易就放下。"}]}],"說":[{"類":"例","文":"師父在美國，營養知識、環境都好，結果怎麼吃就怎麼瘦，怎麼弄也弄不好。"},{"類":"例","文":"到達隆撒拉，一杯白開水、半個大餅，中午半個饅頭，菜就一樣；十年來身體最好就是那段時候，中氣從來沒有那麼足過。"},{"類":"立","文":"煩惱淨化以後，真正最好的健康是心力。"},{"類":"例","文":"母親發瞋心時分泌的奶，給老鼠吃會把老鼠弄死；一發瞋心，分泌的東西對人體有害。"},{"類":"立","文":"心裡一天到晚跟貪瞋癡相應，怎麼營養也弄不好；跟法相應了，不要太多營養。"},{"類":"例","文":"虛雲老和尚活一百二十歲，沒講過營養；老太太九十多歲，吃白飯豆腐乳，一百斤照挑不誤。"},{"類":"破","文":"千萬不要學了佛以後，腦筋裡還在這個上面；對貪求現世放不下，不是佛法。"},{"類":"下手","文":"處處提醒自己：慚愧呀，我現在還是不行，放不下；以這種心情努力深入，慢慢一天天就行了。"},{"類":"破","文":"不是叫我們馬上放下，這一點在知見上一定要認識。"},{"類":"下手","文":"前面告訴我們的方法都是訣竅：認識它的過患最重要，了解過患、努力思惟，將來很容易就放下。"}],"af":"65b","st":706}],"逐字稿":[{"t":"65B 11:46","b":[["q","故此生已，仍須勵力善為修習。"],["s","生起了還要努力，何況現在我們沒有生起。這個是檢查我們這個量的，檢查我們這個量的。下面呢？不再講下去，我說一個故事。這個故事說過一遍，今天再說一遍。這個我這個身體一直不好，這是你們也看見的。對呀，啊，那總是我宿生的惡業，這樣。那麼這一生加上種種的不調，所以毛病很多。那麼這幾年一直在美國，你們曉得，喔唷，這個美國的生活你們去過的人都知道的。尤其是剛去的時候，在美國佛教會，那個副會長就是聖洛克斯醫院的這個，這個老人重健部的部長。哎呀，他實在是 ……告訴我們很多這營養的知識，吃這個那麼多少卡洛里，吃那個多少卡洛里。然後呢我到了洛杉磯那個地方的話，那個環境又這麼個好。哎呀，所以那個現在比如說我們，像平常那些什麼，吃到或者是餅乾，或者巧克力，大家就好。那裡我們向來從來不願意吃這些東西的，就是這樣。就算你同樣那個起士，那總歸是最好的，結果我怎麼吃就怎麼瘦，怎麼弄也就弄不好。"]]},{"t":"65B 13:13","b":[["s","後來我到印度去，跑到那個達隆撒拉，它那邊吃些什麼呀？早晨起來一杯茶，結果它那個奶茶，我這個胃又不好，又不能吃，然後一個大餅，就這樣。那個大餅又太大，我只能吃半個，所以我平常經常一杯白開水半個大餅。中午吃什麼呢？饅頭，喔唷，他們饅頭可以吃好幾個，那種饅頭我只能吃半個。為什麼？它其他沒有東西了嘛！然後那個菜的話呢？今天白菜就是白菜，明天洋芋就是洋芋，後天茄子就是茄子。晚上飯，然後一點湯，湯裡面就是一點鹽嘛，這樣。那時我也是一樣，剛開始晚上不吃，後來說，唔，晚上要吃。那我這個東西吃不來，我把早晨給我那個大餅，早晨吃半個，晚上吃半個，就這樣。你說什麼營養啊？你們說說看，什麼營養啊？結果我十年來身體最好的就是那一段時候，非常清楚、非常明白，中氣從來沒有那麼足過。然後呢磅磅那個，磅磅那個體重居然增加，走路身輕力壯，那這個胃也不出毛病。哎！這是我親身經驗。"]]},{"t":"65B 14:29","b":[["s","所以你們諸位，千萬不要在那裡談哪！如果說剛開始，是、是！我絕不忽視，這我曉得的，我們凡夫就是這個樣。但是你知見千萬注意啊！你不要學了佛以後，腦筋裡還在這個上面，所以他前面告訴我們，現在我們要學正知見，你處處提醒自己：「哎呀，慚愧呀！我現在還是不行，所以放不下呀！」你要這種心情，你總是努力地深入，這樣的話你慢慢、慢慢、慢慢走，你自然而然一天、一天、一天天行了。當你心裡面真正的煩惱能夠把它淨化了以後，欸，這身體上面的，真正最好的健康是什麼？就是心力，將來你自然會了解的。"]]},{"t":"65B 15:16","b":[["s","其實這個事情，不要說佛法，科學上面，已經得到了很多證明。說一個母親，她如果說在發脾氣的時候，那個時候發了瞋心以後，她那個奶啊，奶裡邊分泌出來的東西，我想你們可能看見過這個科學報告，給那個小孩子吃，不一定把那個小孩子毒死，可是把那個東西養給老鼠或是什麼東西，把那個老鼠會弄死的。因為一發瞋心，這個分泌的東西就對我們人體有害。所以現在你心裡面一天到晚跟貪瞋癡相應的話，你怎麼個營養啊，弄了個半天也弄不好。你現在如果能夠跟法相應了以後，把那個東西拿掉的話，你不要它太多營養。"]]},{"t":"65B 16:02","b":[["s","所以為什麼佛世的時候，他這個樣，但是他精神來得個旺喔！你看看我們大陸上面，虛雲老和尚活一百廿歲，他可沒講過營養哦！不但是我，我自己，我母親，我母親今年八十七歲，還有我們洛杉磯的那一個大護法，他姓談，他母親今年九十多歲了，我看見她那一次那一年八十四歲不曉得八十五歲。她還告訴我，噢，我在家裡 ─她那個美國待不慣，她在家裡還要做。她說一百斤的東西，叫她挑起來，照挑不誤。我曾經有一次試試看，哎喲，我拿五十斤的東西都拿不動。你說她吃什麼？我就回去看她吃什麼？很簡單，就是大白飯，然後呢，豆腐乳，如此而已。你說這個什麼營養？所以你們千萬哪，修學佛法的人，這一點是特別要注意！假定你對貪求現世的放不下的話，對不起，不是佛法！"]]},{"t":"65B 17:14","b":[["s","不過，現在在這個地方我們要注意啊，不是說叫我們馬上放下，這一點特別在知見上面我們一定要認識。他前面所有告訴我們的方法，都是訣竅，怎麼樣認識它的過患，這最重要的。你了解了這過患，努力去思惟的話，將來你很容易地就放下來了。所以他這個地方真正精采地，告訴我們 ─正知見！錯誤的地方怎麼辦。"]]},{"t":"65B 17:47","b":[["s","現在請翻到《菩提道次第廣論》一百五十頁，這個關於這個業的方面，業的方面，我們不妨再重新溫習一下，重新溫習一下。說由於我們了解了這個生命無常、快速，然後呢一眨眼就死。死的時候，所有生前的圓滿，像夢一樣，像夢一樣，什麼都沒有。不管你外面多大的財位，不管多麼親密的周圍的父母、妻兒、子女，沒有一樣東西帶得去，沒有一個人能隨你、肯隨你，就是他想隨你也跟不去。乃至於你自己的身體，到那個時候，燒成灰，灰也帶不走，也不是你的。唯有一樣東西，是業！這個卻是為了生前貪一點小便宜，這個業就生生世世把我們綑死。那因為這樣的關係啊，所以我們想從這個地方脫離，而找到歸依之處。"]]},{"t":"65B 19:17","b":[["s","那麼找到了歸依之處，而進一步了解，哦，他歸依了所以能夠解脫問題的原因是法，如法行持。那麼法的根本在業，那麼現在業，所以我們了解業的真正的整個的內涵了解了，然後呢在這個內涵當中，我們要求的是些什麼。所以是第一個是總業果，第二個是別業果。那麼一步一步，所以我們下面了解。最後呢，了解了這個事情以後，那麼我們就說，該怎麼辦，該怎麼辦？所以最後懺悔，把以前的淨除，現在的防止。於是在這種狀態當中，你不再憂愁墮落，永遠保持暇滿人身，然後在這個基礎上面生生增上、生生增上。現在雖然苦苦惱惱，那已經不錯了，比現在更好的，當然我們不必怕呀！何況你這樣增上的最後結果達到圓滿的佛地，那麼這一個次第我們都已經了解了。"]]},{"t":"65B 20:37","b":[["s","但是這一個道理要達到什麼樣的情況才算呢？所以昨天把「生此意樂之量」說明白。這個道理雖然懂了這樣說，可是，是不是內涵跟它相應，你要如實地檢查一下。不是說，啊，說了一個道理就算哪！這個事實的內容如果不相應的話，前面一再告訴我們，不管你說得多麼好聽，不管你說得多麼好聽，到最後的結果，還是把你送下地獄，那還是毫無意思。所以在這一個地方，我們特別要了解一個事實。什麼呢？就是，不是一個道理，而是要把這個道理如實去做；遵照這個道理如實去做，產生如實地功效，那麼這個就是，說生此意樂之量。生起來了以後，還要令這個堅固，那個時候才行，那個時候才行。"]]},{"t":"65B 21:55","b":[["s","關於這個前面的事情，我們應該牢牢記在心裡面。目前我們真正要做的就是這個，所以共下士這個是最基本的。假定說你對於現世的這個一切，放不下、看不破的話，那所謂的希求後世，那都是空話，那都是空話！而這個共下士真正要的增上生，是求下一世，這個下一世有它特別意義哦，特別意義哦！從表面上看來下一世，你真的到了下一世，下一世還是求下一世，下一世還是求下一世哦！這個真正的意義在這裡。到最後那個下一世什麼呢？就是佛，這是我們應該了解的。可是這個殊勝，這一點深入的意義留到下面去講。那麼第三，最後一點，看文。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/006.mp3"},{"文":"第三除遣於此邪分別者。","口譯":"第三、破除對此（希求增上生）的錯誤分別。","四家合註":"<span>第三、除遣於此邪分別<\/span><span class=\"sjan sj-miao\">，<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">於圓滿因除遣邪執；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">於決定勝因除遣邪執。初中分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">敘宗；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">破之。初<\/span><span>者：<\/span>","覺燈日光":null,"時":"65B 22:56","頁":150,"af":"65b","st":1376,"et":1387,"消文":[{"文":"說明了道理以外，有一類錯誤的，要把它排除掉。"}],"延伸":[],"逐字稿":[{"t":"65B 22:56","b":[["q","第三除遣於此邪分別者。"],["s","同樣地，說明了道理以外，有一類錯誤的，他要把它排除掉。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/007.mp3"},{"文":"謂有一類，以佛經說，悉應背棄生死所有一切圓滿，為錯誤事，作是念云，身受用等諸圓滿事，增上生者，皆是生死，發求此心不應道理。","口譯":"就是說，有一類人把佛經所說「應當背棄生死中所有一切圓滿」這句話理解錯了，心裡這樣想：身體、受用等種種圓滿的事，也就是增上生（人天善趣的果報），全都屬於生死，發心去求它是不合道理的。","四家合註":"謂有一類，以佛經說悉應背棄生死所有一切圓滿，為錯誤事。作是念云：身、受用等諸圓滿事增上生者，皆是生死，發求此心不應道理。","覺燈日光":null,"時":"65B 23:07","頁":150,"af":"65b","st":1387,"et":1485,"消文":[{"文":"佛經說生死中的一切圓滿都是虛假的，要曉得它的過患、背棄它；這一類人就說：眼前受用等增上生的事都是生死輪迴，要求這個不合理。"},{"類":"破","文":"聽起來「對啊，我們不要它」；實際上是不是這樣？不。"},{"類":"立","文":"對求聲聞乘來說是對的：聲聞乘的目的的的確確是急求解脫，根本不要別的。"},{"文":"但是這個地方有它特別的意義。"}],"延伸":[],"逐字稿":[{"t":"65B 23:07","b":[["q","謂有一類，以佛經說，悉應背棄生死所有一切圓滿，為錯誤事，作是念云，身受用等諸圓滿事，增上生者，皆是生死，發求此心不應道理。"],["s","那麼它錯在哪裡呢？說有一類的人士，他看見佛經上面告訴我們說，說生死當中的一切的圓滿哪，那都是虛假的，我們應該曉得它的過患，應該背棄它，應該背棄它。所以他就看見經上這麼說，所以他就說：「哎呀，既然經上這麼說，所以我們眼前的受用等等，這一種屬於增上生的事情，那個都是生死輪迴當中的事情，要求這個不合理，要求這個不合理。」對這個話我們聽起來：對啊！千真萬確，我們不要它呀！實際上是不是這樣呢？不，不！對於求聲聞乘來說，是！因為聲聞乘的目的，的的確確「急求解脫」，他全部的精神求解脫，根本不要別的，根本不要別的。但是現在這個地方，它有它特別意義，看下面："]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/008.mp3"},{"文":"然所求中略有二類，謂於現位，須應希求，及是究竟所應希求。生死之中身等圓滿，","口譯":"然而所要希求的，大略有兩類：一類是就現前而希求的，一類是為了究竟而應當希求的。生死之中身體等等的圓滿，","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、破之，分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">觀待增上生而破；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">觀待決定勝而破。初中分二：第一、須輾轉漸受身等圓滿之理者：<\/span>然所求中略有二類，謂於現位須應希求，及是究竟所應希求。生死之中身等圓滿，","覺燈日光":null,"時":"65B 24:45","頁":150,"af":"65b","st":1485,"et":1580,"消文":[{"文":"所要求的增上生分兩類：一類為了現世的快樂；一類為了究竟的利益。"},{"文":"為了究竟，要利用這個身體，而且要最好、圓滿具足種種德相的身。"},{"類":"破","文":"為現生求快樂，五乘共法統統排斥；一有這個概念，跟佛法完全不相應。"},{"類":"立","文":"後者才是修學佛法的人需要的。"}],"延伸":[],"逐字稿":[{"t":"65B 24:45","b":[["q","然所求中略有二類，謂於現位，須應希求，及是究竟所應希求。生死之中身等圓滿，"],["s","說我們真正要求的這個增上生哪，一共分兩部分、兩類：有一類呢就是求現生，為了現世的快樂；還有一種呢，為了要求究竟的利益。那麼那個時候，我們也要利用這個身體，不但要這個身體，前面告訴我們，你為了要達到最圓滿的修道進程所用的身體，平常一個還不行，一定要最好、圓滿具足種種德相的身。這一個身是增上生，這是為了究意意義而要求的，分成功這個兩類。這個前者，對於現生要想求快樂，那個是的的確確，不管哪一個，五乘共法當中，統統排斥的，一有這個概念，跟佛法就不相應，完全不相應。至於後者呢，這就是我們修學佛法的人需要的，所以下面說，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/009.mp3"},{"文":"希解脫者，於現法中，亦須希求，","口譯":"希求解脫的人在現前也必須希求，","四家合註":"希解脫者，於現前中亦須希求，","覺燈日光":null,"時":"65B 26:20","頁":150,"af":"65b","st":1580,"et":1595,"消文":[{"文":"真正求解脫的人，對增上生也要的。"}],"延伸":[],"逐字稿":[{"t":"65B 26:20","b":[["q","希解脫者，於現法中，亦須希求，"],["s","這一個真正求解脫的人哪，對於這個增上生也要的。為什麼呀？"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/010.mp3"},{"文":"以由輾轉漸受此身，後邊乃得決定勝故。","口譯":"因為要依靠輾轉、逐漸地受得這樣的身，最後才能得到決定勝。","四家合註":"以由輾轉漸受此身，後邊乃得決定勝故。","覺燈日光":null,"時":"65B 26:35","頁":150,"af":"65b","st":1595,"et":1626,"消文":[{"文":"必定要憑藉這個圓滿的暇滿人身，而且要具足種種最圓滿德相，作為修行的工具，才達到究竟圓滿的決定勝。"}],"延伸":[],"逐字稿":[{"t":"65B 26:35","b":[["q","以由展轉漸受此身，後邊乃得決定勝故。"],["s","說你必定要憑藉了這個圓滿的暇滿人身，不但得到人身哦，單單這個人身還不具足，要具足種種最圓滿德相的這一個人身。根據這個作為修行的工具，然後才達到究竟圓滿的「決定勝」，這樣。所以說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/011.mp3"},{"文":"非凡所有身及受用，眷屬圓滿，增上生事，一切皆是生死所攝。","口譯":"並不是所有的身體、受用、眷屬圓滿這些增上生的事，全都屬於生死所攝。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、觀待究竟增上生而破者：<\/span>非凡所有身及受用、眷屬圓滿增上生事，一切皆是生死所攝，","覺燈日光":null,"時":"65B 27:06","頁":150,"af":"65b","st":1626,"et":1712,"消文":[{"文":"目前它是在生死輪迴當中，但要跳出生死輪迴，還要藉這個生死中的暇滿之身去修習。"},{"類":"例","文":"飲食受用處處呵斥不好，但修行還必要藉它：講究眼前的不需要，吃飽了讓你修行的卻是需要的。"},{"類":"立","文":"眼前如此，整個生命亦復如是；懂了這個道理，邪正分別得清清楚楚。"},{"類":"破","文":"要不然到哪裡都含含糊糊，不知不覺之間錯誤夾雜的東西都夾進去了。"}],"延伸":[],"逐字稿":[{"t":"65B 27:06","b":[["q","非凡所有身及受用，眷屬圓滿，增上生事，一切皆是生死所攝。"],["s","說，不是說所有的這些事情啊，都是生死輪迴當中。是，目前它是在生死輪迴當中，但是你要跳出生死輪迴，還要藉這個在生死輪迴當中的暇滿之身，去修習以後。這一部分這是我們要的，這我們要認得非常清楚、非常明白。以我們眼前來說，我們處處地方，這個飲食、受用，種種地方的呵斥不好；欸，但是它有個好處，什麼好處啊？修行還必要藉它，就是這樣。所以講究這個眼前這個，我們不需要；可是吃飽了以後讓你修行的這個，卻是我們需要的。眼前是如此，整個的生命亦復如是，我們要懂得這個道理，那麼在這個裡邊，你能夠邪正分別得清清楚楚。要不然，我們到哪裡都是含含糊糊，哎呀，好像是這樣，好像是那樣，不知不覺之間，那個錯誤夾雜的東西都夾進去了！那麼繼續下去。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/012.mp3"},{"文":"以其身等圓滿究竟，即佛色身，圓滿佛土，佛眷屬故。","口譯":"因為身等圓滿到了究竟，就是佛的色身、圓滿的佛土與佛的眷屬。","四家合註":"以其身等圓滿究竟，即佛色身、圓滿佛土、佛眷屬故。","覺燈日光":null,"時":"65B 28:32","頁":150,"af":"65b","st":1712,"et":null,"消文":[{"文":"增上生達到最究竟圓滿，就是圓滿的報身、圓滿的佛土、圓滿的眷屬。"},{"類":"破","文":"所求的不是眼前的；可是覺得既然要、就講究眼前，又完全錯了，細微的道理要分別清楚。"},{"類":"下手","文":"理路上分別清楚以後，在自己的概念上時時檢查、檢點，這是眼前修行第一步重要的事。"},{"類":"立","文":"在自己的內心、概念上查清楚不大容易，但這是真正修學的中心。"}],"延伸":[],"逐字稿":[{"t":"65B 28:32","b":[["q","以其身等圓滿究竟，即佛色身，圓滿佛土，佛眷屬故。"],["s","因為最後邊際的這個增上生，達到最究竟圓滿的時候，以及你周圍所有圓滿的一切的事情是什麼呢？就是你圓滿的報身，就是你圓滿的佛土，以及你圓滿的眷屬，就是這樣。所以它所求的不是眼前的，但是反過來說，你覺得既然要，然後你講究眼前，那你又完全錯了，這個裡邊的細微的道理，我們一定要分別得很清楚。理路上面分別清楚了以後，然後呢，在自己的概念上面要時時檢查、檢點，這個是我們眼前修行第一步重要的事情。"]]},{"t":"66A 00:13","b":[["s","要想在自己的內心、概念上面查清楚，這一點不大容易，但是這個卻是真正我們修學的中心，真正修學的中心。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/013.mp3"},{"文":"故《莊嚴經論》於此密意說云：「增上生謂受用身，圓滿眷屬勤圓滿。」","口譯":"所以《莊嚴經論》就著這個密意說：「增上生，是指受用圓滿、身圓滿、眷屬圓滿，以及精勤圓滿。」","四家合註":"故《莊嚴經論》於此密意說云：「<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">殊勝<\/span>增上生<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">體性，<\/span>謂受用<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">圓滿<\/span><span>及<\/span>身圓滿<span class=\"sjan sj-ba\">，<\/span>眷屬<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">圓滿及<\/span>勤<span class=\"sjan sj-ba\">、<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">事業<\/span>圓滿<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">具足四種圓滿<\/span>。」","覺燈日光":null,"時":"66A 00:26","頁":150,"af":"66a","st":26,"et":61,"消文":[{"文":"什麼是增上生？自己的受用、身、眷屬求得圓滿；為了這個要好好努力勤修，使它達到最究竟圓滿。"}],"延伸":[],"逐字稿":[{"t":"66A 00:26","b":[["q","故《莊嚴經論》於此密意說云：「增上生謂受用身，圓滿眷屬勤圓滿。」"],["s","所以這經個論上面告訴我們，經論上面它真實的意思就是說：什麼是增上生哪？那就是這個 ─你自己的受用的身，以及眷屬這些事情求得圓滿。為了這個，所以你要好好地努力去勤修，使它達到最究竟圓滿的地步。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/014.mp3"},{"文":"此說由前四度，成辦增上生。","口譯":"這是說由前四度（布施、持戒、忍辱、精進）成辦增上生。","四家合註":"此說由前四度成辦增上生。","覺燈日光":null,"時":"66A 01:01","頁":150,"af":"66a","st":61,"et":73,"消文":[{"文":"六度當中，前面的布施、持戒、忍辱，就是為了這個。"}],"延伸":[],"逐字稿":[{"t":"66A 01:01","b":[["q","此說由前四度，成辦增上生。"],["s","所以六度當中，前面這個布施、持戒、忍辱，就是為了這個。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/015.mp3"},{"文":"又多教典，說由此等成色身故。","口譯":"又有許多教典說，由這些成就佛的色身。","四家合註":"又多教典<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">數數<\/span>說由此等<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">前四度<\/span>成色身故。","覺燈日光":null,"時":"66A 01:13","頁":150,"af":"66a","st":73,"et":83,"消文":[{"文":"這裡不細講，很多經論上都說得很清楚。"}],"延伸":[],"逐字稿":[{"t":"66A 01:13","b":[["q","又多教典，說由此等成色身故。"],["s","他不細講，但是說很多經論上面都說得很清楚。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/016.mp3"},{"文":"是故修種智者，經極長時，修諸極多，諸極殊勝，戒施忍等，亦是希求彼等妙果，最極殊勝身等勝生。","口譯":"所以修一切種智的人，經過極長的時間，修持極多、極殊勝的戒、施、忍等，也正是為了希求它們的妙果——最極殊勝的身等增上生。","四家合註":"是故修種智者，經極長時<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">間<\/span>，修諸極多、諸極殊勝<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">因──<\/span>戒、施、忍等，亦是希求<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">成辦<\/span>彼等<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">因<\/span><span>之<\/span>妙果，最極殊勝身等增上生。","覺燈日光":null,"時":"66A 01:23","頁":150,"af":"66a","st":83,"et":142,"消文":[{"文":"佛經過三大阿僧祇劫，實際上無量無邊阿僧祇劫，不是隨業在轉，是認真修布施、持戒、忍辱。"},{"類":"立","文":"為的是求殊勝之身，這才是增上生真正的意義；到究竟圓滿時，增上生與決定勝兩者就是一個。"}],"延伸":[],"逐字稿":[{"t":"66A 01:23","b":[["q","是故修種智者，經極長時，修諸極多，諸極殊勝，戒施忍等，亦是希求彼等妙果，最極殊勝身等勝生。"],["s","喏，所以說修佛種智，就是佛經過非常長的，通常我們說三大阿僧祇劫，實際上，實際上是無量無邊的阿僧祇劫，並不是在這個長時候當中隨著業在轉，是認真地修行。修什麼？布施、持戒、忍辱等。為什麼？就求這個殊勝之身，殊勝之身，這個才是它真正增上生的意義。那麼由於這個，然後呢達到究竟決定勝，當他究竟圓滿的時候，兩者就是一個。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/017.mp3"},{"文":"成辦究竟決定勝者，謂如《入行論》云：「由依人身舟，度脫大苦海。」是須依止，以人所表善趣之身，度諸有海，趣妙種智。此復須經多生，故能辦此身勝因尸羅，是道之根本。","口譯":"至於成辦究竟決定勝，就像《入行論》說：「依靠人身這條船，度脫生死大苦海。」就是必須依靠以人身為代表的善趣之身，度過三有大海，趣向一切種智。而這又需要經歷許多生，所以能成辦這種殊勝之身的因——尸羅（戒），就是道的根本。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、觀待決定勝而破者：<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">非唯如是，由於此因<\/span>成辦<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">二種<\/span>究竟決定勝者，謂如《入行論》云：「由依人身舟，度脫大苦海。」是須依止以人所表善趣之身，度諸有海<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">而解脫<\/span>，趣妙種智<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">一切智位<\/span>。此<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">果位<\/span>復<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">非於一增上依身所能成辦，<\/span>須經多生<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">依身而成辦<\/span>，<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">具相修道依身之因，須當守護圓滿戒律之理者：<\/span>故能辦此<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">增上生<\/span>身勝因<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如云：「增上生因除戒定非餘」，故<\/span>尸羅，是道之根本。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">設作是念：若爾，成辦解脫及一切智之依身，僅是善趣依身即可耶？答云：未可也。以<\/span>","覺燈日光":null,"時":"66A 02:22","頁":150,"af":"66a","st":142,"et":327,"消文":[{"類":"喻","文":"暇滿人身像船一樣，是使我們超脫生死輪迴的寶貝、工具；船是渡脫生死苦海的寶筏。"},{"文":"要依止善趣人身超脫三有之海，達到一切種智，要經過很長時候。"},{"類":"立","文":"以前講尸羅好像就是戒；現在了解戒真正的綱要、綱骨就是業的道理，由於是業，所以必定要持戒。"}],"延伸":[],"逐字稿":[{"t":"66A 02:22","b":[["q","成辦究竟決定勝者，謂如《入行論》云：「由依人身舟，度脫大苦海。」是須依止，以人所表善趣之身，度諸有海，趣妙種智。此復須經多生，故能辦此身勝因尸羅，是道之根本。"],["s","引論上面，我們一定要「依人身舟」，這個暇滿人身就像船一樣，這個人身是使我們超脫生死輪迴的寶貝、工具，船是讓我們渡脫這個生死苦海的寶筏，就是這樣，這個比喻所指的內容。所以需要依止一個身體，這個人，善趣人身當中超脫三有之海，達到一切種智的地位。這個要經過很長時候，很長時候。那麼為了達到這個種種的因緣，前面說過，而這個根本是什麼？尸羅，所以這個是道的根本。以前我們講「尸羅」好像就是戒，現在了解了這個戒的真正的綱要、綱骨，就是業的道理，業的道理；由於是業，所以你必定要持戒。"]]},{"t":"66A 04:09","b":[["s","那麼這個是關於共下士部分，前面已經簡單地說明。最後有幾句話，這個幾句話對我們非常重要的，非常重要的。因為前面我們說是下士，說共下士，說現在所講的雖然是下士，但是呢卻是你為了達到最上圓滿的基礎，這是跟那些人共同的。跟那些人共同的基礎，對這些條件不夠的人來說，叫作共下士，共同他的；對於條件夠的人，這是他走上去必須要的基礎。所以在這一點上面，他說明了下面這兩句話，現在我們看看他說明的是什麼呀？就是你要達到最圓滿的、究竟的、圓滿的位嗎？喏！這樣的條件，這是我們需要的。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/018.mp3"},{"文":"若善趣身而不圓滿一切德相，僅能成就一少分德，雖修諸道進程微少。故«定須一最圓滿者»，此中護求寂等未圓學處，猶非滿足，故須勵力，護比丘等圓滿學處。","口譯":"如果善趣之身沒有圓滿一切德相，只能成就一小部分的功德，即使修習各種道，進展也很微少。所以一定需要一個最圓滿的身。這當中，守護求寂（沙彌）等尚未圓滿的學處，仍然不夠，所以必須努力守護比丘等圓滿的學處。","四家合註":"若善趣身而不圓滿一切德相，僅具一少分德，雖修諸道，進程微少，故定須一最圓滿者。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">成辦<\/span>此中<span class=\"sjan sj-ba\">，<\/span>護求寂等未圓學處，猶非滿足，故須勵力護比丘等圓滿學處。","覺燈日光":null,"時":"66A 05:27","頁":151,"af":"66a","st":327,"et":570,"消文":[{"類":"回扣","文":"共下士：條件不夠的人叫共下士，對條件夠的人，這是走上去必須要的基礎；最後這幾句話非常重要。"},{"文":"德相，就是前面思惟別業果時特別教我們認識的那一點。"},{"文":"不圓滿，得到的只是一部分；用這個不圓滿的工具修道，進步很少很少，要成無上菩提不可能。"}],"延伸":[{"題":"定須一最圓滿者","組":[{"題":"工具不全，事做不成","說":[{"類":"喻","文":"釘一個釘子，不用鐵鎚，拿手一點辦法都沒有。"},{"類":"喻","文":"用腳走路，走來走去最多在台灣，離開台灣一步都沒辦法。"},{"類":"立","文":"眼前任何事情，沒有完整的工具就做不好；何況要求無上佛道，要滿無邊功德，一定要最圓滿德相的工具——暇滿人身。"}]},{"題":"求寂未圓，護比丘等","說":[{"類":"立","文":"出家作沙彌，比凡夫好得多，但還不圓滿；要努力保護比丘「等」。"},{"類":"立","文":"比丘還不圓滿，是基礎；上面還要菩薩戒，乃至密宗戒。"}]},{"題":"外身內心，兩種圓滿","說":[{"類":"回扣","文":"前面具力業門大家記得不記得？"},{"類":"立","文":"外面最圓滿的是這個身，裡邊意樂最圓滿的是菩提心；以兩個無上圓滿的因辦佛果，輕而易舉。"}]}],"說":[{"類":"喻","文":"釘一個釘子，不用鐵鎚，拿手一點辦法都沒有。"},{"類":"喻","文":"用腳走路，走來走去最多在台灣，離開台灣一步都沒辦法。"},{"類":"立","文":"眼前任何事情，沒有完整的工具就做不好；何況要求無上佛道，要滿無邊功德，一定要最圓滿德相的工具——暇滿人身。"},{"類":"立","文":"出家作沙彌，比凡夫好得多，但還不圓滿；要努力保護比丘「等」。"},{"類":"立","文":"比丘還不圓滿，是基礎；上面還要菩薩戒，乃至密宗戒。"},{"類":"回扣","文":"前面具力業門大家記得不記得？"},{"類":"立","文":"外面最圓滿的是這個身，裡邊意樂最圓滿的是菩提心；以兩個無上圓滿的因辦佛果，輕而易舉。"}],"af":"66a","st":414}],"逐字稿":[{"t":"66A 05:27","b":[["q","若善趣身而不圓滿一切德相，僅能成就一少分德，雖修諸道進程微少。故定須一最圓滿者，此中護求寂等未圓學處，猶非滿足，故須勵力，護苾芻等圓滿學處。"],["s","說雖然你得到了善趣，這個是特別指人身，暇滿的人身，但是如果這個人身，「而不圓滿一切德相」，這個德相在前面思惟「別」，這個關於這個業果那一部分，教我們特別認識的那一點，就是講這個。如果你不圓滿，那麼你所得到的只是一部分。因為得到一部分，所以你用這個不圓滿的東西，那個時候去修道的話，他進步很少很少、很少很少。現在你要想求的這樣的圓滿無上菩提，根據這樣的一個差的工具，不可能、不可能，所以一定需要一個圓滿的。"]]},{"t":"66A 06:54","b":[["s","這個道理我們現在眼前樣樣事情都可以了解它，樣樣都了解它。你隨便做一件小事情，那沒關係。你不要說別的，現在你要想釘一個釘子，對不起，釘一個釘子，你就拿那個釘子，拿你的手，你一點辦法都沒有，釘不進去，對不對？這個很清楚。那麼簡單的一個釘子，你如果不用鐵鎚的話，對不起，你就是釘不進去。然後呢，譬如說你要到別的地方去的時候，你說用腳走路；對不起，腳走路，就算你走得到，你走來走去的話，也最多只能走在這個台灣，離開台灣一步，是一點辦法都沒有，這個不是很簡單嗎？沒有一件事情例外的，我們現在做眼前的任何事情，你沒有完整的工具，就做不好這件事情。何況他現在所要求的是什麼？無上佛道，這一點我們必定要知道的。那麼為了要求無上佛道，他一定要滿無邊的功德；要滿無邊的功德，一定要最圓滿的德相的工具，這個就是我們暇滿的人身。"]]},{"t":"66A 08:15","b":[["s","所以他下面說「此中護求寂等未圓學處」，還沒滿足哦，就算是你出家作個沙彌，哦，這個沙彌已經是比起凡夫好得多很多，欸，不圓滿。真正要努力的，努力要保護這個比丘「等」！為什麼講等啊？比丘還不圓滿喔，不過呢這個是基礎，在這個上頭還要什麼？還要菩薩，然後乃至於密宗戒。在前面具力業門當中，大家記得不記得？大家記得不記得？所以對我們外面來說，最圓滿的是這個身；對我們的裡邊意樂來說，最圓滿的是菩提心。現在你外面有一個最圓滿的這個比丘的相，裡邊是有最圓滿的大菩提意樂，在這種狀態當中，以兩個無上圓滿的因，那你要想辦那個佛果的話，那就容易了，輕而易舉，輕而易舉！這是我們要了解的。他下面："]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/019.mp3"},{"文":"有作是說，護持尸羅，若是為辦諸善趣者，則近事等亦能獲得，何須艱難，義利微少，諸比丘等。","口譯":"有人這樣說：護持戒律如果是為了成辦善趣，那麼近事（受五戒的居士）等也能獲得，何必受持那麼艱難、利益又少的比丘等戒呢？","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">說其所許；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">破之。今初：<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如是說已，<\/span>有作是說：「護持<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">別解脫之<\/span>尸羅，若是為辦諸善趣者，則近住等亦能獲得，何須艱難、義利微少諸比丘等？」","覺燈日光":null,"時":"66A 09:30","頁":151,"af":"66a","st":570,"et":669,"消文":[{"文":"持戒持得好可以不墮落、得人天身，乃至往生，不需要出家；八關齋戒、五戒都可以。"},{"文":"五戒跟比丘戒，難易天差地遠；這麼難做，得到的利益這麼少，何必呢。"},{"類":"立","文":"為了得到善趣，的確不需要；為了求生淨土也不需要，關起門來念佛就算了。"}],"延伸":[],"逐字稿":[{"t":"66A 09:30","b":[["q","有作是說，護持尸羅，若是為辦諸善趣者，則近住等亦能獲得，何須艱難，義利微少，諸苾芻等。"],["s","有人說：你持戒持得好的話，他可以不墮落，可以得到人天身呀！乃至於我們現在說：喔唷，往生啊！對不起，這不需要出家。為什麼？近住也能獲得。「近住」是什麼？就是八關齋戒，八關齋戒。實際上說的那一點，乃至於五戒都可以。那個五戒跟比丘戒，啊！這個難易差得天差地遠。既然五戒、八關齋戒可以做到，你何必持這個比丘戒？這麼艱難，難極了！結果得到的呢，一樣得到這麼一個小小的。所以這麼難地做，而得到的利益是這麼少，你何必呢！不需要。"]]},{"t":"66A 10:43","b":[["s","是，為了得到善趣的確不需要，乃至於你為了要求生淨土也不需要。你老實不客氣關起門來，自己在那兒吃飽了飯，「阿彌陀佛、阿彌陀佛 ……。」就念念就算了。現在這個時候要到世界上面賺一口飯吃吃，那太簡單啦！你何必出家啊！那麼進一步要什麼呢？有人說：啊！對、對、對，不單單是要人天哪！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/020.mp3"},{"文":"又餘眾云，若別解脫所有要義，是為獲得阿羅漢故。","口譯":"又有其他人說：別解脫戒的主要意義，是為了獲得阿羅漢果。","四家合註":"又餘眾云：「若別解脫所為，是為獲得阿羅漢故，","覺燈日光":null,"時":"66A 11:09","頁":151,"af":"66a","st":669,"et":689,"消文":[{"文":"這比較高明了：要求解脫，解脫果是阿羅漢；阿羅漢了不起，是真正人天的福田。"}],"延伸":[],"逐字稿":[{"t":"66A 11:09","b":[["q","又餘眾云，若別解脫所有要義，是為獲得阿羅漢故。"],["s","喏，他現在就比較高明了，說：「不是、不是，要獲得求解脫，解脫果是求阿羅漢。」阿羅漢是了不起，喔，那是真正我們人天的福田喔！嘿嘿，但是你看，他說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/021.mp3"},{"文":"然比丘者，未滿二十，則不堪受。近住之身，亦有能得阿羅漢者，應讚其身。難行少義，比丘何為。","口譯":"然而比丘戒未滿二十歲就不能受；近住（受八關齋戒者）之身也有能證得阿羅漢的，那就應該讚歎這種身才對。比丘戒難行而利益少，受它做什麼？","四家合註":"然比丘者，未滿二十，則不堪受，近事之身，亦有能得阿羅漢者，應讚其身。難行少義比丘何為？」","覺燈日光":null,"時":"66A 11:29","頁":151,"af":"66a","st":689,"et":770,"消文":[{"文":"比丘有很多條件，年不到二十不能受。"},{"文":"師父當年唸的本子是「近事之身」，自己說：據我了解證阿羅漢要八關齋戒，淫一定要斷，不曉得是文字誤還是了解不足；現行課本作「近住之身」。"},{"文":"比丘終生奉行二百多條，比丘尼更多；八關齋戒只要八條加過午不食，一天一夜，何必多此一舉。"}],"延伸":[],"逐字稿":[{"t":"66A 11:29","b":[["q","然苾芻者，未滿二十，則不堪受。近事之身，亦有能得阿羅漢者，應讚其身。難行少義，苾芻何為。"],["s","這個比丘啊，要曉得他很多條件啊，乃至於年不到二十是不能受。「近事」就是居士之身。這一點我就不敢肯定了，據我所了解的話，就是說獲得阿羅漢還要八關齋戒；換句話說他那個，這個淫一定要斷。不曉得這個是文字上的誤，還是我自己的了解不足。不管怎麼樣啦，不管是五戒也好，八關齋戒也好，的的確確是可以證得阿羅漢果的。那你同樣地，何必要這麼難行的比丘呢？啊！這個比丘是比起這個八關齋戒不曉得難多少，比丘是終生奉行，一行要二百多條，比丘尼是更多！然後呢，它這個東西只要八條，加上一個過午不食，然後呢奉行只要一天一夜，就能得到了，你何必多此一舉呢！這是千真萬確的。所以他說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/022.mp3"},{"文":"應當知此","口譯":"應當知道，這種說法","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二者：<\/span>應當知此","覺燈日光":null,"時":"66A 12:50","頁":151,"af":"66a","st":770,"et":775,"消文":[{"文":"下面是我們正確應該了解的。"}],"延伸":[],"逐字稿":[{"t":"66A 12:50","b":[["q","應當知此"],["s","這是下面我們正確應該的，這種說法"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/023.mp3"},{"文":"是全未知聖教扼要，極大亂言。","口譯":"是完全不懂聖教的扼要，是極大的胡言亂語。","四家合註":"是全未知聖教扼要，極大亂言。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">以前宗許一切持戒唯為成辦善趣故，是不知別解脫戒須有出離心之亂言。後宗許別解脫戒唯為阿羅漢果，亦復非理，以大乘者守護別解脫戒，是為證得究竟佛位故。此即如前所說，須依無間相續殊勝善趣圓滿功德依身，方能獲得，故當成辦其因圓滿戒律而非一分，<\/span>","覺燈日光":null,"時":"66A 12:55","頁":151,"af":"66a","st":775,"et":789,"消文":[{"文":"誤解了，不了解佛告訴我們真正的意趣。"}],"延伸":[],"逐字稿":[{"t":"66A 12:55","b":[["q","是全未知聖教扼要，極大亂言。"],["s","他誤解了，並不了解佛告訴我們的真正的意趣。那麼真正的意趣何在呢？"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/024.mp3"},{"文":"«應以下下律儀為依»，受上上者，«委重護持圓滿學處»。已說於共下士道次，淨修心訖。","口譯":"應該以下下的律儀為依止（基礎），再受上上的律儀，慎重地護持圓滿的學處。在共下士道次第中淨修其心的部分，已經說完了。","四家合註":"應以<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">近事等<\/span>下下律儀為依，受<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">比丘等<\/span>上上者，委重護持圓滿學處。","覺燈日光":null,"時":"66A 13:09","頁":151,"af":"66a","st":789,"et":1666,"消文":[{"文":"以最基本的律儀作基礎，真正要達到的目的是最究竟圓滿的；為了最究竟無上圓滿，要從最下面建立最穩固的基礎。"},{"文":"要認真保護、維持這個基礎，就是比丘的學處；三界當中只有這個最殊勝。"}],"延伸":[{"題":"應以下下律儀為依","組":[{"題":"摩天大廈，要打地基","說":[{"類":"喻","文":"造狗窩不要基礎，兩塊木板一釘就行；茅篷地稍微平平就可以；摩天大廈下面基礎不做，造得起來嗎？"}]},{"題":"出家不是貪便宜","說":[{"類":"破","文":"不要以為出了家就是貪一點便宜，乃至說出了家要念佛；老年人或有特別條件是的，真正出家的因要了解在這裡。"}]},{"題":"具力業門，所依殊勝","說":[{"類":"回扣","文":"一百三十三頁具力業門：兩個發了菩提心的人，在家人以三千大千世界最美滿的東西供養三寶，出家人只點一支小蠟燭，出家人的功德大。"},{"類":"因","文":"為什麼？他所依的就是這個。"}]}],"說":[{"類":"喻","文":"造狗窩不要基礎，兩塊木板一釘就行；茅篷地稍微平平就可以；摩天大廈下面基礎不做，造得起來嗎？"},{"類":"破","文":"不要以為出了家就是貪一點便宜，乃至說出了家要念佛；老年人或有特別條件是的，真正出家的因要了解在這裡。"},{"類":"回扣","文":"一百三十三頁具力業門：兩個發了菩提心的人，在家人以三千大千世界最美滿的東西供養三寶，出家人只點一支小蠟燭，出家人的功德大。"},{"類":"因","文":"為什麼？他所依的就是這個。"}],"af":"66a","st":843},{"題":"委重護持圓滿學處","組":[{"題":"出家因緣，殊勝難得","說":[{"類":"破","文":"很多人說修行就好了，何必出家——完全錯誤。"},{"類":"立","文":"沒有殊勝因緣，連出家的名字都聽不見、看不見，何況有機會披這件衣服。"}]},{"題":"一日一夜，七返天上","說":[{"類":"例","文":"《出家功德經》：鞞羅羨那只剩七天壽命，先玩六天，第七天出家，第二天就死了。"},{"類":"例","文":"生四天王天，一路上到他化自在天，再從四天王天上去，七返；天上的福報無法想像，最後到人間遇佛出家，證羅漢果。"},{"類":"破","文":"阿難以為他以前善根很多；佛說：你千萬不要起大邪見，就是這一天一夜出家的功德。"}]},{"題":"隨喜出家，功德無盡","說":[{"類":"立","文":"隨喜人家出家，比三千大千世界的供養還好：供養有盡，出家的功德無限。"}]},{"題":"清淨幢相，不可染污","說":[{"類":"立","文":"出家代表十方一切諸佛的清淨幢相；一披這件衣服，儘管是凡夫，把清淨幢相把握住了，一天一夜就這麼大的功德。"},{"類":"喻","文":"國旗布做綢做、髒的好的都代表國家；這裡代表的是十方諸佛的清淨幢相，做到了功德大，染污了就害了。"},{"類":"立","文":"就算作得不好下了地獄，受盡苦難、還了債，最後遇到佛還是證果；出家功德就這麼殊勝。"}]},{"題":"種下出家種子","說":[{"類":"下手","文":"現在沒有因緣，心裡也要想：我一定要出家，一定要讚歎出家，種下出家種子。"},{"類":"下手","文":"出了家，眼前短短幾十年太值得了，好好做，身心都歡喜。"}]},{"題":"外相內涵，菩提為因","說":[{"類":"立","文":"「護比丘等」的等字：不僅是這個相，還有跟相相應的內容——菩提心。"},{"類":"因","文":"這個相代表十方諸佛的清淨幢相，佛以菩提心為因，圓滿菩提果。"},{"類":"回扣","文":"共下士道到這裡為止；懺悔，以及眼前所做所忙的一切，真正究竟的目的在這裡。"}]}],"說":[{"類":"破","文":"很多人說修行就好了，何必出家——完全錯誤。"},{"類":"立","文":"沒有殊勝因緣，連出家的名字都聽不見、看不見，何況有機會披這件衣服。"},{"類":"例","文":"《出家功德經》：鞞羅羨那只剩七天壽命，先玩六天，第七天出家，第二天就死了。"},{"類":"例","文":"生四天王天，一路上到他化自在天，再從四天王天上去，七返；天上的福報無法想像，最後到人間遇佛出家，證羅漢果。"},{"類":"破","文":"阿難以為他以前善根很多；佛說：你千萬不要起大邪見，就是這一天一夜出家的功德。"},{"類":"立","文":"隨喜人家出家，比三千大千世界的供養還好：供養有盡，出家的功德無限。"},{"類":"立","文":"出家代表十方一切諸佛的清淨幢相；一披這件衣服，儘管是凡夫，把清淨幢相把握住了，一天一夜就這麼大的功德。"},{"類":"喻","文":"國旗布做綢做、髒的好的都代表國家；這裡代表的是十方諸佛的清淨幢相，做到了功德大，染污了就害了。"},{"類":"立","文":"就算作得不好下了地獄，受盡苦難、還了債，最後遇到佛還是證果；出家功德就這麼殊勝。"},{"類":"下手","文":"現在沒有因緣，心裡也要想：我一定要出家，一定要讚歎出家，種下出家種子。"},{"類":"下手","文":"出了家，眼前短短幾十年太值得了，好好做，身心都歡喜。"},{"類":"立","文":"「護比丘等」的等字：不僅是這個相，還有跟相相應的內容——菩提心。"},{"類":"因","文":"這個相代表十方諸佛的清淨幢相，佛以菩提心為因，圓滿菩提果。"},{"類":"回扣","文":"共下士道到這裡為止；懺悔，以及眼前所做所忙的一切，真正究竟的目的在這裡。"}],"af":"66a","st":962}],"逐字稿":[{"t":"66A 13:09","b":[["q","應以下下律儀為依，受上上者，委重護持圓滿學處。已說於共下士道次，淨修心訖。"],["s","哦，說拿我們最基本的這個律儀，作為我們的基礎，然後呢我們真正要達到的目的是最究竟圓滿的。所以我們為了這個最究竟無上圓滿的，所以要建最穩固的基礎，從最下面建立起來。所以這個情況之下，要這麼認真保護、維持這一個基礎，這個基礎就是我們的比丘的學處。這個在三界當中，只有這個最殊勝，只有這個殊勝，這是我們要了解的。"]]},{"t":"66A 14:03","b":[["s","其實這個道理這麼簡單，現在你要造一個房子，你要造一個什麼房子啊？你說，我造個狗窩，那根本不要基礎，要什麼基礎呀！你隨便弄兩塊木板一釘就行了！啊，我要造一個普通的茅篷，那地稍微平平就可以了；你要造一個鋼筋水泥的房子那就要了；現在你要造一個摩天大廈，對不起，你這個下面的基礎不做，你造得起來嗎？有這樣的嗎？所以我們這個地方這麼清楚、這麼明白。所以現在大家千萬不要說：「唉呀，出家呀 ……」好像出了家就是貪一點便宜，那完全錯了，完全錯了！乃至於說：「唉呀，現在我出了家，我要念佛啊！」是，老年人是的，或者有他特別條件。真正的出家的因，我們要了解在這個地方。"]]},{"t":"66A 14:56","b":[["s","大家記得不記得前面在一百三十三頁上面，講業的時候，「具力業門」，大家還記得不記得？同樣地兩個發了菩提心的人，一個是在家人，一個是出家人，出家當然指圓滿的比丘。那個在家人發菩提心，這菩提心的意義不得了，他把三千大千世界作為容量，所有的這麼多的最美滿的東西去供養佛、供養三寶，這個功德之大是不得了地大！結果一個出家人，就跑得去點一個小小的蠟燭，欸，這個功德，就出家這個人的功德要來得大，不能為比。為什麼？他所依的就是這個！這是我們應該真正了解的，在這裡、在前面、在後面，他一再地說明這一點，一再說明這一點。"]]},{"t":"66A 16:02","b":[["s","所以平常我們的的確確不了解出家的真實的意義，這個東西是非常糟糕，非常糟糕，也可以說非常可惜，非常可惜！出家哪那麼簡單？你不是有殊勝因緣，連它名字都聽不見，也看不見，何況你有機會去被這件衣服啊！所以現在很多人說，總覺得：唉呀，修行就好了，你何必出家！這完全錯誤，完全錯誤，完全錯誤，完全錯誤！"]]},{"t":"66A 16:36","b":[["s","這個佛經裡邊有這麼一個《出家功德經》，這個我在這地方，有好幾個《出家功德經》，我只是講這裡邊的一個，講這麼一個。有一個人他叫鞞羅羨那，這個名字，這個梵文啊，西藏話，我都唸不準，那沒關係啦！嗯，他也是個貴族，所謂長者子。那麼平常跟阿難很好，阿難經常也到他家裡去乞食，總是跑過去，總是去。有一天佛就告訴阿難：「阿難哪！你這個好朋友某人哪，他還有七天的壽命就要死了。」這樣。那麼阿難聽了，喔唷，很著急，他那個好朋友就要死了，那怎麼辦哪？「死了以後怎麼辦哪？」「那很難說，就看他怎麼辦。如果像現在這樣的話，他要墮落的，現在呢你可以救他。」啊！阿難聽見了佛講的，跑得去，跑到那家人的家裡去。"]]},{"t":"66A 17:45","b":[["s","平常因為他們都是貴族子弟，看見阿難是非常歡喜，然後呢就供養他。那一天阿難到了家裡，他也非常歡喜迎接，阿難就是愁眉苦臉，一言不發跑得去在那裡。欸，他就說：「阿難哪，我今天很高興看見你，你怎麼愁眉苦臉，你有什麼心事啊？」阿難還是不開口，連問他幾次都不開口。他心裡面覺得奇怪：「什麼，我做了什麼不對啊？什麼傷害了你，得罪了你啦？」阿難愁眉苦臉說：「這倒是沒有，不是為了我，是為了你！」「為了我？為了我為什麼這樣啊？」說：「佛告訴我，說你的壽命還只有七天啦！」啊！他一聽這個話，啊！人就癱掉了。他們都曉得，佛講的話，那絕對是百分之一百二十地可靠，「虛空可以變餘相，佛不說非諦實語」，他們都曉得這個。"]]},{"t":"66A 18:48","b":[["s","啊！那聽了這個話，怎麼辦啊？求那個阿難。阿難說：「你求我是沒辦法。佛告訴我，你死了以後這個要墮落的，唯一的辦法你出家。」「對啊！好、好、好。那既然還有七天，那這樣吧！我實在捨不得，讓我痛痛快快地再玩上六天，然後再出家。」要我們想起來真可笑，欸，但是真有這種人。但是這個人也真可愛喔，因為他曉得佛講的話就這麼確實，好、好、好。然後他就在六天當中盡情享受，到了第七天，那反正是明天就要死了，啊，就出家，就這麼出家。那時候因為佛在世，心裡邊也猛。你想假定是我們想到明天要死了，你出了家，你還肯忙別的嗎？當然什麼事情都不要了。那個時候大概他還沒有聽見那個淨土法門，如果聽見淨土法門，他一定往生了。不過他只是說：「好、好！現在就出了家了，照著規矩就這麼來。」第二天就死了。"]]},{"t":"66A 19:56","b":[["s","死了以後，那麼阿難就問佛陀了，說：「現在他到哪裡去了？」「他現在到四天王天去了。」佛就說這個功德：「然後呢四天王天死了以後到忉利天，忉利天死了以後到夜摩天，夜摩天死了以後到兜率天，然後再上去叫化樂天，再他化自在天。」我們曉得我們人間一般不是定福，定福是不動業，這個最高只能生到欲界天。他就這麼一天一夜的持戒功德，然後呢這麼樣。壽命多長呢？這我們就曉得的，這個四天王天的壽命是人間九百萬年。然後九百萬年死了以後到哪裡去？欸，再升上去啊！升到忉利天，忉利天的壽命是人間三千六百萬年。忉利天完了以後再上去，是夜摩天是人間一億四千四百萬年，這樣地上去。然後呢，到了這個第六天，完了以後怎麼辦？再下來，哪裡去？四天王天，再來，七返、七趟。"]]},{"t":"66A 21:05","b":[["s","經過這麼長的時候，那個天上的福報是我們無法想像的。你不要說他化自在天，就最起碼的到這個天，一到人間把最好的東西給你吃，你就覺得像吃大糞一樣，避得遠遠地受不了，這樣啊！你要什麼就什麼，哪有像我們現在，現在你再好，對不起，再好的東西，就算你有電扇，電扇吹了，等一下要風濕；冷氣要風濕，暖氣到那時候出去還不行。就算什麼都沒了，大小便沒人替代你，沒有一樣東西有這個。欸，他那個天上這樣，沒有一樣東西有這種事情的，也沒病，這樣。"]]},{"t":"66A 21:47","b":[["s","完了以後，七返完了以後，最後下來了，又跑到人間。那時候跑到人間，有一個佛出世。完了以後，他也是人天當中也是最富貴，到中年以後，覺得：唉呀，沒有意思。他出家這個另外這個因緣成熟了，然後呢跑得去見佛，再去出家，證羅漢果。阿難聽了：「啊，這麼好啊！佛陀啊！他大概以前還有很多善根吧！」佛陀說：「錯了，你完全錯了，你根本不了解，真正的出家的根本意義。他這樣大的福報，就這麼一天一夜的出家功德，你千萬不要起大邪見，就這麼一天一夜的出家的功德。但是他之這一生所以能夠出家，這個倒是的的確確地以前有功德。如果以前沒有殊勝因緣，對不起，他絕不可能。」出家的功德這麼大！"]]},{"t":"66A 22:44","b":[["s","所以諸位要了解，我們千萬不要說：「唉呀，平常都一樣的。」絕不一樣、絕不一樣！經上又告訴我們，如果人家出家，你贊成他，然後你幫助他，乃至於什麼都 ……，你隨喜，這個功德就不得了！經上有種種的比喻，你看看：「哎呀，這個出家人！」你無比地隨喜，比你供養什麼都好，比你供養什麼都好，乃至於三千大千世界這個東西去供養，比不上隨喜人家出家。為什麼？你那個供養是有盡的，這個出家的功德是無限的。眼前儘管他是先證得小乘果，但是究竟一定會走上這條路。這個有限的東西，跟無限永遠沒辦法比的，永遠沒辦法比的，這我們要了解，所以這個才是它真正的特質。反過來說，因為出家有它這樣無比殊勝的功德。出家所代表的，為什麼有這樣它的功德呢？因為它所代表的是十方一切諸佛的清淨幢相，你一被這件衣服的話，你那個時候所代表的這個意義就是這樣。所以你只要認認真真地、戰戰兢兢，儘管你是個凡夫，你只要把那個清淨幢相把握住了，一天一夜就這麼大的功德。"]]},{"t":"66A 24:04","b":[["s","這個道理說起來也簡單，我們世間什麼地方都可以做個比喻。譬如說我們現在做一個國旗，那個國旗大家看見了代表這個國家，人人看見了這是以國家這樣地尊敬它。這個國旗做的布沒什麼關係，綢做的也是，布做的也是，髒的、好的、壞的也是，你只要做成功這個國旗，這代表的意義這樣。他現在代表的不是國旗，十方一切諸佛的清淨幢相這個標幟喔，你想想看！所以你如果做到了，有這麼大的功德，染污了，對不起那就害了，那就害了。"]]},{"t":"66A 24:44","b":[["s","所以這是我特別強調，一再鼓勵大家出家。但是萬一你們出了家，不能好好地做的話，我始終也建議你們趕快回家去，下地獄是非常划不來、非常划不來。不！你就算下了地獄，欸，妙了！這個出家功德之美啊，真是無法想像的！等到你穿了這身衣服，如果作得不好下了地獄，他也是一樣的，一層一層地來，一層一層地來，受盡了苦難，然後呢到畜生當中，完了還了一個債，最後遇到佛，你也還是證果，出家功德就是這麼地殊勝。不同的呢，就是你如果說好好地持，短短的幾十年的辛苦，乃至於一天一夜的辛苦的話，你就得到這麼大的好，好完了以後最後證果。如果你不好好地，貪一點小便宜的話，下去！受無量無邊的苦，苦完了以後上來，他還是解脫，這個出家功德有這麼大，這是我們要了解的，這樣。"]]},{"t":"66A 25:56","b":[["s","所以我們想到這個地方的話，就算你現在沒有因緣，心裡想：「啊！我一定要出家，一定要讚歎出家！」一定心裡面要種下這個出家種子。如果出了家以後，千萬記得：這個眼前短短的幾十年，那太值得了，實在太值得啦！而且你好好地做的話，它有殊勝的種種的特別的感應，心裡歡喜，身心都歡喜，這個是我們要了解的。他下面後面一再強調。"]]},{"t":"66A 26:30","b":[["s","不過這個地方最後又說一句，要「護苾芻等圓滿學處」，這個「等」字告訴我們，不僅僅是這個相，還有跟「相」相應的內在的內容，這個內容是什麼？這個內容是什麼？菩提心，這個是菩提心。為什麼說這個是它的內容呢？因為它這個相所代表的 ─十方一切諸佛的清淨幢相。那麼佛是什麼？佛是以菩提心為因，圓滿了菩提果，這個是他的內涵，這個才是我們真正要了解的。這一點我在這地方再特別跟大家說一下，共下士道到這地方為止。所以現在我們講那個關於懺悔一切等等，以及眼前我們所有做的、忙的這些，真正究竟的目的在這裡，這個我們務必要了解的。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-23/025.mp3"}],"投影片":[{"img":"投影片/shenxin-yeguo-23/001.webp","n":1},{"img":"投影片/shenxin-yeguo-23/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/shenxin-yeguo-23/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/shenxin-yeguo-23/004.webp","n":4},{"img":"投影片/shenxin-yeguo-23/005.webp","n":5},{"img":"投影片/shenxin-yeguo-23/006.webp","n":6,"photo":[0.624375,0.2872311898512686,0.342,0.5005376202974628]},{"img":"投影片/shenxin-yeguo-23/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=65b&st1=484&et1=706","box":[0.124875,0.3591111111111111,0.12525,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-23/008.webp","n":8},{"img":"投影片/shenxin-yeguo-23/009.webp","n":9,"photo":[0.624375,0.28756714785651794,0.342,0.49986570428696414]},{"img":"投影片/shenxin-yeguo-23/010.webp","n":10,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=65b&st1=706&et1=916","box":[0.521125,0.3124444444444444,0.10775000000000001,0.05511111111111111]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/shenxin-yeguo-23/011.webp","n":11},{"img":"投影片/shenxin-yeguo-23/012.webp","n":12,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=65b&st1=916&et1=1067","box":[0.123625,0.3591111111111111,0.1265,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-23/013.webp","n":13},{"img":"投影片/shenxin-yeguo-23/014.webp","n":14,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=65b&st1=1067&et1=1376","box":[0.521125,0.3124444444444444,0.10775000000000001,0.05511111111111111]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投
