[],"逐字稿":[{"t":"67A 24:08","b":[["q","敬禮勝尊具大悲者足。"],["s","它每一個地方開始的時候，一定是皈敬世尊，皈敬世尊，這個道理一開始說過了。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/001.mp3"},{"文":"如是隨念當死及思死後墮惡趣之道理，能令其心厭捨現世，於後善趣發生希求。","口譯":"像這樣，隨念自己必定會死，以及思惟死後墮入惡趣的道理，能讓內心厭捨現世，而對後世的善趣生起希求。","四家合註":null,"覺燈日光":null,"時":"67A 24:28","頁":152,"af":"67a","st":1468,"et":1504,"消文":[{"文":"這就是前面下士道所說的皈依之因。"},{"文":"這個認識一定是依靠善知識指明世間的真相，自己如理觀察思惟的結果。"}],"延伸":[],"逐字稿":[{"t":"67A 24:28","b":[["q","如是隨念當死及思死後墮惡趣之道理，能令其心厭捨現世，於後善趣發生希求。"],["s","這就是前面下士道當中所說的皈依之因。因為內心當中有了這個認識，當然這個認識一定是依靠善知識，指明世間的真相，你如理觀察思惟的結果。所以到那個時候，就要求皈依。說："]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/002.mp3"},{"文":"次由共同皈依及由定解黑白業果，勵力斷惡修善，則能獲得善趣妙位。","口譯":"接著藉由共同皈依，以及對黑白業果生起定解，努力斷惡修善，就能獲得善趣的殊妙果位。","四家合註":null,"覺燈日光":null,"時":"67A 25:04","頁":152,"af":"67a","st":1504,"et":1531,"消文":[{"文":"由這樣的因而皈依，皈依了，了解正確佛法的根本，如法行持、斷惡修善，所以增上生。"}],"延伸":[],"逐字稿":[{"t":"67A 25:04","b":[["q","次由共同皈依及由定解黑白業果，勵力斷惡修善，則能獲得善趣妙位。"],["s","由於這樣的因，所以你皈依，由於這樣皈依了，最後達到了解正確的佛法的根本，如法行持、斷惡修善，所以增上生。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/003.mp3"},{"文":"«然非以此便生喜足»，","口譯":"然而並不是到此就心生滿足，","四家合註":null,"覺燈日光":null,"時":"67A 25:31","頁":152,"af":"67a","st":1531,"et":1699,"消文":[{"文":"你不要把這個作為滿足。"}],"延伸":[{"題":"然非以此便生喜足","組":[{"題":"自以為懂，便聽不進","說":[{"類":"例","文":"師父說自己以前的毛病：懂得一點，就覺得懂得不得了，人家告訴的都聽不進。"},{"類":"破","文":"現在很多同學也是這樣，懂了一點就覺得樣樣都懂，其他都聽不進。"}]},{"題":"凡夫榜樣不足為足","說":[{"類":"因","文":"我們看見的是五濁惡世的凡夫世界，稍微好一點就拿來當榜樣，做到了也只是如此。"},{"類":"因","文":"前面說過，證得羅漢果都還不夠。"}]},{"題":"認得己錯，才爬得上去","說":[{"類":"立","文":"發現自己錯了，那是有智慧的人，有了這個就爬得上去。"},{"類":"破","文":"自己覺得很懂，最多只是世智聰辯，是八難中人。"}]},{"題":"共下士量的行相","說":[{"類":"例","文":"到齋堂吃飯，如曠野食子肉想，越吃越難受，可以飽了趕快放下，那才是生起。"},{"類":"破","文":"越吃越起勁，連共下士都沒有；居然還喜樂，那完全錯了。"}]}],"說":[{"類":"例","文":"師父說自己以前的毛病：懂得一點，就覺得懂得不得了，人家告訴的都聽不進。"},{"類":"破","文":"現在很多同學也是這樣，懂了一點就覺得樣樣都懂，其他都聽不進。"},{"類":"因","文":"我們看見的是五濁惡世的凡夫世界，稍微好一點就拿來當榜樣，做到了也只是如此。"},{"類":"因","文":"前面說過，證得羅漢果都還不夠。"},{"類":"立","文":"發現自己錯了，那是有智慧的人，有了這個就爬得上去。"},{"類":"破","文":"自己覺得很懂，最多只是世智聰辯，是八難中人。"},{"類":"例","文":"到齋堂吃飯，如曠野食子肉想，越吃越難受，可以飽了趕快放下，那才是生起。"},{"類":"破","文":"越吃越起勁，連共下士都沒有；居然還喜樂，那完全錯了。"}],"af":"67a","st":1531}],"逐字稿":[{"t":"67A 25:31","b":[["q","然非以此便生喜足，"],["s","你不要把這個作為滿足。這個話講一下，這個話講一下。我們現在有沒有得到這個？對不起，很難說，以我來說，我自己曉得還沒有，所以我自己一點都不敢馬虎。我以前我有一個毛病，懂得了一點，哎呀，自己覺得懂得不得了，人家告訴我的就聽不進，我總覺得很懂。現在我看很多同學當中也是這個樣子，唉呀，他懂得了，他總覺得樣樣都懂了，然後呢其他也聽不進了，這個好遺憾、好可惜！世間也是如此，出世也是如此。"]]},{"t":"67A 26:24","b":[["s","或者你看見，看見的不是壞喔，的的確確地，它的的確確是好。可是不幸的我們看見的什麼？我們看見的是五濁惡世的凡夫世界，在這個凡夫世界稍微好一點，然後你就覺得以這個榜樣的話，就算你做到了也只是如此欸！對不對？前面告訴我們，你證得了這個聖者的羅漢果都不行欸，這個是我們要了解的。所以我這個地方特別提一下，如果我們自己覺得「我很對！」你錯了，你錯了！前面告訴我們，你真正相應的話，如果你發現你自己錯了，那你是有智慧的人，你有了這個你就可以爬得上去。反過來說，你自己覺得你很懂啦，那對不起，你只是一個世智聰辯最多，而且這是八難中人，這是我們千萬要注意的！"]]},{"t":"67A 27:25","b":[["s","所以現在前面已經提醒我們，這地方更告訴我們：千萬不可以覺得夠了！所謂這夠了已經生起什麼？已經生起共下士之量。所以大家注意，你們自己檢查檢查，是不是你已經生起共下士之量哦？我們共下士之量生起什麼現象？一看見眼前現在，一跑到齋堂裡，「唉呀，這個東西可怕，但是我不能不吃它！」所以你每吃一口，佛經上面告訴我們，如曠野食子肉想。你越吃是越難受，吃得可以飽了，唉呀，趕快放下來，那個才是生起哦！如果你吃的時候越吃越起勁的話，對不起，連它共下士都沒有。如果在這種情況，居然喜樂的話，那完全錯了！進一步，"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/004.mp3"},{"文":"是令發起共下士之意樂及發共中士之意樂，厭捨生死一切事已，依此因緣而發大菩提心引入上士，","口譯":"而是要藉此發起共下士的意樂，以及發起共中士的意樂；厭捨生死中的一切事之後，依此因緣發起大菩提心，引入上士道。","四家合註":null,"覺燈日光":null,"時":"67A 28:19","頁":152,"af":"67a","st":1699,"et":1753,"消文":[{"文":"先在這個基礎上做，這個基礎跟下士一樣，叫共下士。"},{"文":"再上一步是共中士，內容是「厭捨生死一切」：後世生了天也不要。"},{"文":"依這個「發大菩提心引入上士」，這個才是。"}],"延伸":[],"逐字稿":[{"t":"67A 28:19","b":[["q","是令發起共下士之意樂及發共中士之意樂，厭捨生死一切事已，依此因緣而發大菩提心引入上士，"],["s","為什麼不能把這個就覺得滿足呀？哦！是說這個地方讓你作為基礎，先從這個基礎上面做這件事情。這個基礎部分是跟下士一樣的，這個叫共下士。然後更進一步，再上面一步 ─中士，這個是因為共中士一樣的，它共中士的內容是「厭捨生死一切」，不但是求後世，後世生了天你也不要。那麼依這個「發大菩提心引入上士」，這個才是。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/005.mp3"},{"文":"故於此中，須修中士之意樂。","口譯":"所以在這裡，必須修習中士的意樂。","四家合註":null,"覺燈日光":null,"時":"67A 29:13","頁":152,"af":"67a","st":1753,"et":null,"消文":[{"文":"已經有了下士的量，進一步就要上去。"},{"類":"喻","文":"念完了小學，正好念中學；不要說：「我小學了，現在樣樣都懂了。」"}],"延伸":[],"逐字稿":[{"t":"67A 29:13","b":[["q","故於此中，須修中士之意樂。"],["s","現在我們已經有了下士的量了，進一步就要上去。欸，念完了小學，要學中學了，不要說：「哎喲，我小學了，我現在樣樣都懂了。」要是說：「欸，我現在小學了，念完正好念中學了。」這樣那就對了！"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/006.mp3"},{"文":"所謂雖得人天勝位，然仍未能出於行苦，若即於此執為樂性，實為顛倒。","口譯":"也就是說，雖然得到了人天的殊勝果位，仍然沒有出離行苦；如果就把它執著為快樂，實在是顛倒。","四家合註":null,"覺燈日光":null,"時":"67B 00:08","頁":152,"af":"67b","st":8,"et":30,"消文":[{"文":"雖然得到了人天的好處，但行苦還沒出，最後還在輪迴當中；把這個當快樂，就是顛倒。"}],"延伸":[],"逐字稿":[{"t":"67B 00:08","b":[["q","所謂雖得人天勝位，然仍未能出於行苦，若即於此執為樂性，實為顛倒。"],["s","為什麼？雖然說你得到了人天的好處，但是行苦還沒出，最後還在輪迴當中哦！假定你把這個以為快樂的話，那你是顛倒了。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/007.mp3"},{"文":"故於真實全無安樂，其後定當墮諸惡趣邊際惡故，譬如有一無間定當墮於懸險，現於險崖暫為休息。","口譯":"所以真實來說完全沒有安樂，因為之後必定會墮入惡趣，結局終究是惡的。就好比有一個人，馬上就一定要墜下懸崖，現在只是在險崖上暫時休息而已。","四家合註":null,"覺燈日光":null,"時":"67B 00:30","頁":152,"af":"67b","st":30,"et":65,"消文":[{"文":"共下士做到了，對真實究竟的意義來說，一點快樂都沒有，最後一定要墮落。"},{"文":"就像在懸崖上暫時休息，一動馬上就跌下去，粉身碎骨。"}],"延伸":[],"逐字稿":[{"t":"67B 00:30","b":[["q","故於真實全無安樂，其後定當墮諸惡趣邊際惡故，譬如有一無間定當墮於懸險，現於險崖暫為休息。"],["s","所以雖然共下士做到了，但是對於這個真實的究竟意義來說，一點快樂都沒有，最後一定要墮落的。就像我們現在，在這個懸崖當中暫時休息一下一樣，一動馬上就跌下去，粉身骨碎啊！"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/008.mp3"},{"文":"《入行論》云：「數數來善趣，數受諸安樂，死後墮惡趣，常受極大苦。」","口譯":"《入行論》說：「一再地來到善趣，一再地享受種種安樂，死後卻墮入惡趣，長久承受極大的痛苦。」","四家合註":null,"覺燈日光":null,"時":"67B 01:05","頁":152,"af":"67b","st":65,"et":73,"消文":[{"文":"師父只說「這很明白」，沒有另外解。"}],"延伸":[],"逐字稿":[{"t":"67B 01:05","b":[["q","《入行論》云：「數數來善趣，數受諸安樂，死後墮惡趣，常受極大苦。」"],["s","這很明白。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/009.mp3"},{"文":"《弟子書》中亦云：「諸常轉入生死輪，而於暫憩思為樂，彼定無主漸百返，漂流等非等諸趣。」","口譯":"《弟子書》中也說：「那些常常轉入生死輪迴的人，把暫時的歇息想成快樂，他們必定身不由己，漸漸百返（無數次）漂流在或上或下（等非等）的各趣之中。」","四家合註":null,"覺燈日光":null,"時":"67B 01:13","頁":152,"af":"67b","st":73,"et":133,"消文":[{"文":"永遠在生死輪迴中轉，目前只是暫時得到一點人天好的位子，因愚癡顛倒把它看成快樂。"},{"文":"看不清楚就是無明，無明當然作不了主。"},{"文":"「百」不是一百趟，是泛指永遠在六道輪轉；「等非等」是或上或下。"}],"延伸":[],"逐字稿":[{"t":"67B 01:13","b":[["q","《弟子書》中亦云：「諸常轉入生死輪，而於暫憩思為樂，彼定無主漸百返，漂流等非等諸趣。」"],["s","現在我們普通人是怎麼樣？永遠在生死輪迴當中轉，而目前只是暫時得到一點點，這個三有當中的人天好的位子。把這個內容看不清楚，因為愚癡顛倒而把它看成快樂的。那個是沒有正確的認識，他自己作不了主。為什麼？看不清楚，無明，無明嘛當然作不了主。於是漸漸又轉百返，於永遠 ─這個「百」不是一百趟，百是泛，泛指，永遠在六道當中輪轉。「等非等」，或者上、或者下，這個意思。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/010.mp3"},{"文":"故於善趣亦當厭患，猶如惡趣。","口譯":"所以對於善趣也應當厭患，就像厭患惡趣一樣。","四家合註":null,"覺燈日光":null,"時":"67B 02:13","頁":152,"af":"67b","st":133,"et":144,"消文":[{"文":"我們對好的應該產生厭惡，這個是非常重要的。"}],"延伸":[],"逐字稿":[{"t":"67B 02:13","b":[["q","故於善趣亦當厭患，猶如惡趣。"],["s","所以我們真正的，對好的應該產生厭惡，這個是非常重要的。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/011.mp3"},{"文":"《四百論》云：「諸智畏善趣，等同奈洛迦，不畏三有者，此中遍皆無。」","口譯":"《四百論》說：「有智慧的人畏懼善趣，就如同畏懼奈洛迦（地獄）；不畏懼三有的，在智者之中完全沒有。」","四家合註":null,"覺燈日光":null,"時":"67B 02:24","頁":152,"af":"67b","st":144,"et":188,"消文":[{"文":"真正的智者對善趣看得像地獄一樣，不怕的，在這個圈子裡絕對沒有。"},{"文":"就算生天、做國王、做天王，看起來像地獄一樣恐怖，這個才是。"}],"延伸":[],"逐字稿":[{"t":"67B 02:24","b":[["q","《四百論》云：「諸智畏善趣，等同奈洛迦，不畏三有者，此中徧皆無。」"],["s","這個論上面告訴我們，真正的智者，對這個善趣看得像地獄一樣，不怕這個的，在我們這個圈子裡是絕對沒有的。注意哦！所以現在我們要了解，你一旦真正的出家，這個才是我們的目標。在這個圈子裡邊，不要說眼前，就把你生天，生到天上面去，就把你做到一個國王，就把你做到天王，你看起來像地獄一樣地恐怖，這個才是哦！"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/012.mp3"},{"文":"《攝功德寶》中亦云：「諸具«貪生死»意恆流轉。」","口譯":"《攝功德寶》中也說：「凡是心意貪著生死的人，就會恆常流轉。」","四家合註":null,"覺燈日光":null,"時":"67B 03:08","頁":152,"af":"67b","st":188,"et":278,"消文":[{"文":"貪著生死的心意狀態，永遠在生死中流轉，這是要認識、真正產生厭離的。"}],"延伸":[{"題":"貪生死","組":[{"題":"法愛不遣，便上不去","說":[{"類":"立","文":"任何一樣好東西都要了解：真正修行時，法愛如果不遣，就上不去。"},{"類":"例","文":"加行位到了頂位會「頂墮」：修了法歡喜，有這一念歡喜的執著，就爬不上去。"}]},{"題":"先認識，再對治","說":[{"類":"破","文":"我們差得十萬八千里，心裡還這麼放不下。"},{"類":"下手","文":"現在真正要的是正知見，先認識，然後慢慢努力去對治。"}]}],"說":[{"類":"立","文":"任何一樣好東西都要了解：真正修行時，法愛如果不遣，就上不去。"},{"類":"例","文":"加行位到了頂位會「頂墮」：修了法歡喜，有這一念歡喜的執著，就爬不上去。"},{"類":"破","文":"我們差得十萬八千里，心裡還這麼放不下。"},{"類":"下手","文":"現在真正要的是正知見，先認識，然後慢慢努力去對治。"}],"af":"67b","st":188}],"逐字稿":[{"t":"67B 03:08","b":[["q","《攝功德寶》中亦云：「諸具貪生死意恆流轉。」"],["s","我們現在這個狀態是什麼？這個貪著生死的這個，這一個心意狀態什麼呢？永遠在生死當中流轉，這是我們應該認識，真正產生厭離的。所以任何一樣好東西，你要了解，真正修行的時候，法愛如果說不遣的話，你上不去。所以在這個五道十地當中，資糧、加行，這個加行再上面去，所謂加行是煖、頂、忍、世第一地。世第一地最後的後心，那就是見道。這個到了這個頂端以後叫「頂墮」，停在那裡上不去了。它頂墮是什麼？就是他修了法以後他也歡喜，唉呀，覺得好，他有這樣的一念的歡喜的執著，就爬不上去。看看哪！那些人都是已經我們說起來是已經真實相似見道，說大徹大悟的祖師很多是這種人，他有了這一念，上不去。我們現在差得十萬八千里，這個心裡面還這麼個放不下，這個我們要認識的。不是要去做到，我處處地方提醒，我們真正要認識的現在 ─正知見，見的就是見這個，然後呢慢慢地努力去對治它。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/013.mp3"},{"文":"《弟子書》中亦云：「如如於諸趣中«起樂想»，如是如是癡闇極重厚，","口譯":"《弟子書》中也說：「越是對諸趣生起快樂的想法，愚癡的黑暗就越是深重厚密；","四家合註":null,"覺燈日光":null,"時":"67B 04:38","頁":152,"af":"67b","st":278,"et":437,"消文":[{"文":"對六道輪迴「起樂想」，覺得是快樂的，這個愚癡非常重。"}],"延伸":[{"題":"起樂想","組":[{"題":"樣樣看不開","說":[{"類":"破","文":"這個放不下、那個放不下：利看不開，名也看不開，錢看不開，身體也看不開。"}]},{"題":"打了板爬不起來","說":[{"類":"例","文":"師父自述：打了板還趴在床上爬不起來；阿闍黎說「叭！你坐起來！」腳放下地，趕快穿衣服。"},{"類":"破","文":"「冷得要命，再擺在棉被裡，反正打頭板」，那你就害了。"}]},{"題":"快樂都是陷阱","說":[{"類":"立","文":"從任何一件事情，不要看成快樂的，這種快樂都是陷阱；這個念頭最重要。"}]},{"題":"說己過，為策勵弟子","說":[{"類":"因","文":"常說自己的過錯，是要你們不要害怕：受尊重的老師也滿身錯誤，認得錯在改。"},{"類":"破","文":"不是認得了道理看別人不是、跟別人講道理。"},{"類":"下手","文":"看見自己錯在哪裡，努力策勵：「我爬不起來，我偏要爬起來！」"}]}],"說":[{"類":"破","文":"這個放不下、那個放不下：利看不開，名也看不開，錢看不開，身體也看不開。"},{"類":"例","文":"師父自述：打了板還趴在床上爬不起來；阿闍黎說「叭！你坐起來！」腳放下地，趕快穿衣服。"},{"類":"破","文":"「冷得要命，再擺在棉被裡，反正打頭板」，那你就害了。"},{"類":"立","文":"從任何一件事情，不要看成快樂的，這種快樂都是陷阱；這個念頭最重要。"},{"類":"因","文":"常說自己的過錯，是要你們不要害怕：受尊重的老師也滿身錯誤，認得錯在改。"},{"類":"破","文":"不是認得了道理看別人不是、跟別人講道理。"},{"類":"下手","文":"看見自己錯在哪裡，努力策勵：「我爬不起來，我偏要爬起來！」"}],"af":"67b","st":278}],"逐字稿":[{"t":"67B 04:38","b":[["q","《弟子書》中亦云：「如如於諸趣中起樂想，如是如是癡闇極重厚，"],["s","嗯，就像這個樣，你對這個六道輪迴當中，如果說你「起樂想」，感覺得這是快樂的話，對不起，那你這個愚癡非常重。所以我們眼前看看真可憐哪！這個也放不下、那個也放不下，這個也看不開、這個也看不開。利固然看不開，名也看不開，錢固然看不開，身體也看不開。乃至於我常常覺得，打了板了還趴這個床上爬不起來，唉，實在是，實在是，我自己深深一直為這感覺 ……儘管跟你們說，策勵你們，問我自己做到了沒有？我老實說我沒做到。我只是經常提醒：打了板了，趕快起來！有時候頭昏了半天。我總記得，當年我這個阿闍黎告訴我的話：「叭！你坐起來！」然後坐起來，然後呢腳放下地，哎喲，冷得要命！好，趕快穿衣服。千萬不要說：「哎喲，冷得要命，再擺在棉被裡面，反正打頭板。」那你就害了。"]]},{"t":"67B 05:56","b":[["s","這個注意哦！就是你處處地方，這正知見最重要，這是我隨便一提。你從任何一件事情，不要看成快樂的，這種快樂的都是什麼？陷阱，陷阱！這是我們必定應該認識的一件事情。你有了這一個念頭，現在真正重要的就是，注意哦！這個念頭最重要。"]]},{"t":"67B 06:20","b":[["s","所以眼前我常常告訴你們我自己的過錯，這有個原因的，就是你們不要害怕！就算是現在你們覺得，很尊重的這樣的一個老師，他自己都有錯誤，不但有錯，滿身錯誤。可是真正重要的是什麼呢？我自己認得了錯誤在改。因為改，所以今天你們覺得能夠尊重他，尚且如此，何況是佛呢！所以你們只要 ……這個才是你們該學的地方。所以注意！真正重要的，不是認得了道理看別人不是，跟別人講道理。你必定要把這個道理，看見自己錯在哪裡，然後努力策勵自己：「我總歸要努力！對不起，我爬不起來，我偏要爬起來！」就是這個。所以告訴我們，你如果對這個地方起點樂想，錯了！反過來，"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/014.mp3"},{"文":"如如於諸趣中«起苦想»，如是如是癡闇極微薄。","口譯":"越是對諸趣生起痛苦的想法，愚癡的黑暗就越是微弱稀薄。","四家合註":null,"覺燈日光":null,"時":"67B 07:17","頁":152,"af":"67b","st":437,"et":503,"消文":[{"文":"對快樂的事情能「起苦想」，愚癡慢慢減輕，這個東西叫智慧。"}],"延伸":[{"題":"起苦想","組":[{"題":"聰明用在觀照自己","說":[{"類":"立","文":"很多人腦筋很好，把腦筋用在這上頭就對了：這樣思惟，然後觀照自己。"}]},{"題":"對治見煩惱","說":[{"類":"例","文":"要跟人辯論時想：錯了，原來不是我有道理，是見煩惱重，話到嘴邊馬上吞下去。"}]},{"題":"對治思煩惱的習性","說":[{"類":"例","文":"冷得受不了又想縮進被窩：「不對，我寧願咬緊牙關多冷一下，一定要起來！」"}]}],"說":[{"類":"立","文":"很多人腦筋很好，把腦筋用在這上頭就對了：這樣思惟，然後觀照自己。"},{"類":"例","文":"要跟人辯論時想：錯了，原來不是我有道理，是見煩惱重，話到嘴邊馬上吞下去。"},{"類":"例","文":"冷得受不了又想縮進被窩：「不對，我寧願咬緊牙關多冷一下，一定要起來！」"}],"af":"67b","st":437}],"逐字稿":[{"t":"67B 07:17","b":[["q","如如於諸趣中起苦想，如是如是癡闇極微薄。"],["s","對一些那快樂的事情，你能夠「起苦想」，那麼你那個時候愚癡慢慢地減輕了，這個東西叫智慧。現在有很多人腦筋的確很好，然後你把那個腦筋用在這個上頭，那就對了。哦！應該這樣地思惟，然後呢觀照自己。你能夠觀照了以後，到那時候，你往往要跟人家辯論的時候想：欸，錯了、錯了！原來不是我有道理，是我是什麼？見煩惱重。那個時候，你話到嘴邊馬上吞下去。這個時候你的這個智慧慢慢地就增長了，愚癡就減少了，這個對見煩惱而言。同時呢對思煩惱這個習性來說，也是一樣，你平常的時候覺得：唉呀，冷得受不了，你剛才說的，又想縮到被窩裡。「欸，不對、不對，這個東西不行！我寧願在那裡咬緊牙關，然後多冷一下，然後策勵自己再穿衣服，一定要起來！」就這樣。說這個是平常我們應該知道的。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/015.mp3"},{"文":"如如修習«淨相»極增長，如是如是貪燄極熾然。","口譯":"越是修習清淨美好之相而讓它極為增長，貪欲的火焰就越是熾盛；","四家合註":null,"覺燈日光":null,"時":"67B 08:23","頁":153,"af":"67b","st":503,"et":560,"消文":[{"文":"對美好的東西覺得它好，貪心就增長。"}],"延伸":[{"題":"淨相","組":[{"題":"貪心越貪越厲害","說":[{"類":"立","文":"貪非常可怕，越貪越厲害，大家都有這個經驗；貪心永不能圓滿。"}]},{"題":"依眾靠眾的好處","說":[{"類":"立","文":"在大眾面前總覺得不好意思，靠著大家，多多少少少造一點罪。"},{"類":"破","文":"等到一個人的時候，你就害了。"},{"類":"下手","文":"凡是歡喜的東西，不要看見它是清淨美好的。"}]}],"說":[{"類":"立","文":"貪非常可怕，越貪越厲害，大家都有這個經驗；貪心永不能圓滿。"},{"類":"立","文":"在大眾面前總覺得不好意思，靠著大家，多多少少少造一點罪。"},{"類":"破","文":"等到一個人的時候，你就害了。"},{"類":"下手","文":"凡是歡喜的東西，不要看見它是清淨美好的。"}],"af":"67b","st":503}],"逐字稿":[{"t":"67B 08:23","b":[["q","如如修習淨相極增長，如是如是貪燄極熾然。"],["s","下面就是告訴我們，眼前對美好的東西，你把這個美好的，覺得它好的話，害了！這個東西貪心，貪心增長，貪這個東西非常可怕，是越貪是越厲害的。這我想我們大家都有這個經驗，你這麼越貪是越厲害的。所以這個「依眾靠眾」還有個好處，儘管我們現在理路或者清楚，或者不清楚，習性或者厲害，可是在大眾面前總覺得不大好意思，所以靠著大家多多少少，少造一點罪。等到你一個人的時候，你就害了，這貪心永不能圓滿。所以凡是我們歡喜的東西的話，不要看見它是清淨美好的。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/016.mp3"},{"文":"如如修習不淨極增長，如是如是貪燄極殄息。」","口譯":"越是修習不淨之相而讓它極為增長，貪欲的火焰就越是止息。」","四家合註":null,"覺燈日光":null,"時":"67B 09:20","頁":153,"af":"67b","st":560,"et":597,"消文":[{"類":"喻","文":"要看見這東西好可怕，是大騙子，給你一點小甜頭，把你送到地獄去。"},{"文":"初心修的人對貪心有不淨觀等特別的對治，以後講；這裡先了解原則。"}],"延伸":[],"逐字稿":[{"t":"67B 09:20","b":[["q","如如修習不淨極增長，如是如是貪燄極殄息。」"],["s","你要看見這個東西好可怕的，是大騙子，這個大騙子給你一點小小的甜頭，把你送到地獄裡面去，那時候你想到的話，你心裡面就對它起恐怖。當然真正的平常我們初心修的人，對貪心譬如說用不淨觀什麼等等，有它特別的對治，這個以後講，眼前這裡我們要了解這個原則。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/017.mp3"},{"文":"此說從無始來，執著三有盛事為樂，增益串習諸淨妙相。","口譯":"這是說：從無始以來，我們把三有中的興盛圓滿之事執著為快樂，增益、串習種種清淨美妙的相。","四家合註":null,"覺燈日光":null,"時":"67B 09:57","頁":153,"af":"67b","st":597,"et":627,"消文":[{"文":"無始以來虛妄顛倒，把三有中的好事看成快樂，一向把妄想以為正確，這個要認得它。"}],"延伸":[],"逐字稿":[{"t":"67B 09:57","b":[["q","此說從無始來，執著三有盛事為樂，增益串習諸淨妙相。"],["s","上面告訴我們，因為我們無始以來，我們虛妄顛倒的關係，把這個三有當中這種好事情，把它看成快樂。一向習慣，一向把這個妄想以為正確的，所以總把它看得這是好的，這個我們要認得它。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/018.mp3"},{"文":"能治此者，若修«苦性及不淨相»彼等便息，","口譯":"能對治這個的，是修習苦性與不淨相，那些（執樂、執淨）便會止息；","四家合註":null,"覺燈日光":null,"時":"67B 10:27","頁":153,"af":"67b","st":627,"et":756,"消文":[{"文":"最佳的對治是修苦性，原來這是苦的；還有修不淨觀。"}],"延伸":[{"題":"苦性及不淨相","組":[{"題":"觀受是苦，觀身不淨","說":[{"類":"立","文":"正修時修「觀受是苦、觀身不淨」，這是最難對治的兩樣東西。"},{"類":"因","文":"正確的方法，後面講煩惱的時候再提起。"}]},{"題":"事前認識，臨境對治","說":[{"類":"破","文":"煩惱真正轉的時候，誰都拿它沒辦法。"},{"類":"下手","文":"必須事前認識、思惟觀察，境界現起時有力的對治才生得起來。"},{"類":"立","文":"那時你歡喜：「今天我居然打了一個勝仗！」那個快樂才是真正的快樂。"}]},{"題":"吃得起勁，真的快樂嗎","說":[{"類":"例","文":"吃得很起勁，吃完肚子脹脹的，站也不是睡也不是，昏昏沈沈，到時候又要來了。"},{"類":"回扣","文":"如法地修學，這個就靜息了。"}]}],"說":[{"類":"立","文":"正修時修「觀受是苦、觀身不淨」，這是最難對治的兩樣東西。"},{"類":"因","文":"正確的方法，後面講煩惱的時候再提起。"},{"類":"破","文":"煩惱真正轉的時候，誰都拿它沒辦法。"},{"類":"下手","文":"必須事前認識、思惟觀察，境界現起時有力的對治才生得起來。"},{"類":"立","文":"那時你歡喜：「今天我居然打了一個勝仗！」那個快樂才是真正的快樂。"},{"類":"例","文":"吃得很起勁，吃完肚子脹脹的，站也不是睡也不是，昏昏沈沈，到時候又要來了。"},{"類":"回扣","文":"如法地修學，這個就靜息了。"}],"af":"67b","st":627}],"逐字稿":[{"t":"67B 10:27","b":[["q","能治此者，若修苦性及不淨相彼等便息，"],["s","它最佳的對治，什麼呢？修苦性，修苦性，說原來這是苦的；還有呢不淨，修不淨觀。實際上這個裡邊，正修的時候修什麼？「觀受是苦、觀身不淨」，這是我們最難對治的兩樣東西，最難對治的東西。但是它有正確的方法，正確的方法，下面將來告訴我們煩惱的時候，那時候我再提起。當你這個一個念頭生起來的時候，你那時候才了解了，原來你又在被煩惱轉。然後呢轉了以後，真正煩惱轉的時候，的的確確我們誰都拿它一點辦法都沒有，這個是可怕極了。所以你必須事前認識，然後呢思惟觀察，到境界現起的時候，這一個正法相應的這一種現行現起的時候，那個時候你有力的對治生起了。那時候你歡喜，「啊，今天我居然打了一個勝仗！」那個快樂真正的快樂。"]]},{"t":"67B 11:44","b":[["s","你平常吃的東西，當你吃的時候吃得很起勁，你真的快樂嗎？那大家不妨心平氣和想想看。我們大家都有這個毛病 ─貪心，唉呀，好東西，事前是越多越好；吃完了以後，哈，肚子吃得脹脹的，睡在那裡，站也不是、睡也不是，就這樣。當時真的快樂嗎？吃的時候並不覺得快樂耶，我想大家都有這個感覺。你是一個勁兒就在那個地方做那件事情，吃完了以後昏昏沈沈，然後到那個時候又要來了，快樂在哪裡啊？欸，但是奇怪，它就偏偏到那個時候就讓你去這樣做，這個就是這個真正的行相。這個煩惱止息的道理，慢慢地好好地學。那麼你能夠如法地修學的話，這個就靜息了。反過來，"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/019.mp3"},{"文":"若不修習便增癡貪，轉諸有輪，故修諸有過患為要。","口譯":"如果不修習，便會增長愚癡與貪欲，在三有之輪中流轉。所以修習三有的過患是最重要的。","四家合註":null,"覺燈日光":null,"時":"67B 12:36","頁":153,"af":"67b","st":756,"et":844,"消文":[{"文":"不如法修對治，癡跟貪一直增長；貪裡一定有癡，得不到瞋也跟著來，三樣輾轉相應。"},{"文":"由此造業、輪迴三有跳不出來；要跳出來，就要修三有一切盛事的過患。"},{"文":"了解了才步步深入解脫，這進入第二個步驟，叫中士。"}],"延伸":[],"逐字稿":[{"t":"67B 12:36","b":[["q","若不修習便增癡貪，轉諸有輪，故修諸有過患為要。"],["s","所以如果說你不如法地去修行，修習這個對治法的話，那麼那個時候一直增長的癡跟貪，貪裡邊一定有癡。然後呢貪的最後的結果，得不到的話，瞋也跟著來，這個三樣東西就這樣的輾轉地相應。由於這個造業，然後輪迴三有，你沒辦法跳出來。既然前面你怕、厭惡，唯一的辦法就是這裡。所以現在曉得，啊，你真正要跳出來，要做些什麼呀？它說從這個上頭，從業感果的必然性，是了解我們真正要修的，是要修三有一切盛事的過患。然後從這個了解了以後，才步步深入能夠解脫，那個才是說進入更深一層，第二個步驟叫作中士。所以現在我們看看，那麼修中士這一個內容說些什麼呢？"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/020.mp3"},{"文":"中士道次修心分四：一正修意樂，二彼生起之量，三除遣於此邪執分別，四決擇能趣解脫道性。初中分二：一明求解脫之心，二發此之方便。今初","口譯":"中士道次第修心分為四部分：一、正修意樂，二、意樂生起的量，三、破除對此的邪執分別，四、抉擇能趣向解脫之道的體性。第一部分又分二：一、說明希求解脫之心，二、發起此心的方便。以下說第一。","四家合註":null,"覺燈日光":null,"時":"67B 14:04","頁":153,"af":"67b","st":844,"et":905,"消文":[{"文":"正修意樂：正修的內容是什麼，心裡應該有什麼認識、怎麼做。"},{"文":"決擇能趣解脫道性：要修解脫，解脫道是怎麼一回事。"},{"文":"初中分二：求解脫的心是什麼，以及怎麼樣發生這樣的心。"}],"延伸":[],"逐字稿":[{"t":"67B 14:04","b":[["q","中士道次修心分四：一正修意樂，二彼生起之量，三除遣於此邪執分別，四決擇能趣解脫道性。初中分二：一明求解脫之心，二發此之方便。　今初"],["s","「中士道次修心分四」，第一個「正修意樂」，喏，正修的這個內容是什麼，我們心裡應該些什麼認識，怎麼樣的做法。「彼生起之量」，第二個。「三除遣於此邪執分別」，這個是一樣的。第四「決擇能趣解脫道性」，既然你要求解脫，最後了解了，說第四個那個地方，就現在告訴我們了，我們哪，你要修解脫嗎？對了，解脫道是什麼一回事情，解脫道是怎麼一回事情。現在次第來講：「初中分二」，就是正修意樂。「明求解脫之心」，求解脫的心是什麼？第二怎麼樣發生這樣的求解脫的心，所以「發此之方便」。今初。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/021.mp3"},{"文":"言解脫者，謂脫諸縛。此復業及煩惱，謂於生死是能繫縛，","口譯":"所謂解脫，就是脫離種種束縛。這束縛就是業與煩惱，它們是把我們繫縛在生死中的「能繫縛」。","四家合註":null,"覺燈日光":null,"時":"67B 15:05","頁":153,"af":"67b","st":905,"et":932,"消文":[{"文":"解脫就是把綁住的解開來；綁住你的是業跟煩惱，把我們綁在生死當中。"}],"延伸":[],"逐字稿":[{"t":"67B 15:05","b":[["q","言解脫者，謂脫諸縛。此復業及煩惱，謂於生死是能繫縛，"],["s","所謂「解脫」，什麼樣呢？簡單，就是把綁住的把它解開來，這麼簡單法。那麼什麼東西綁住你啊？業跟煩惱，就是業跟煩惱把我們綁在生死當中，就是這麼簡單。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/022.mp3"},{"文":"即由此二增上力故。若依界判，欲界等三。以趣分別，謂天趣等或五或六。依生處門，謂胎等四，即於其中結蘊相續，是繫縛之體性。","口譯":"就是由這兩者的增上力：若依界來分，有欲界等三界；依趣來分，有天趣等五趣或六趣；依出生的方式來分，有胎生等四生。就在這當中結生五蘊、相續不斷，這就是（所）繫縛的體性。","四家合註":null,"覺燈日光":null,"時":"67B 15:32","頁":153,"af":"67b","st":932,"et":1075,"消文":[{"文":"業跟煩惱輾轉增加，把你綁住；綁的範圍分三界：欲界、色界、無色界。"},{"文":"分趣是六趣或五趣，把修羅判作天趣就是五趣。"},{"文":"生處門是胎、卵、濕、化四生。"},{"文":"前面的蘊滅、後面的蘊生，是「結蘊相續」，這個相續體就是被綁住的。"},{"類":"喻","文":"就像繩子綑著你：繩子是業跟煩惱，你就是這個五蘊。"}],"延伸":[],"逐字稿":[{"t":"67B 15:32","b":[["q","即由此二增上力故。若依界判，欲界等三。以趣分別，謂天趣等或五或六。依生處門，謂胎等四，即於其中結蘊相續，是繫縛之體性。"],["s","說，是的，現在綁住你的就是業跟煩惱，由於這兩樣東西的輾轉增加，結果呢把你綁住了。那綁在哪裡呀？綁的地方，如果拿這個「界」，拿那個地方，拿那個範圍來區的話，三界：欲界、色界、無色界。然後在這個三界當中，如果分「趣」，就是我們分成功六趣，或者就是這個六個類型，那麼或者是六等，或者是五等。如果把修羅判作天趣的話，就是五等，有的把修羅叫作非天，這個沒關係。還有一種呢，「生處門」，就是在三界當中你怎麼去出生的，那麼分成功四：胎、卵、濕、化，就是這樣，不外乎這個。"]]},{"t":"67B 16:48","b":[["s","就是不管是三界，不管是六趣，不管是四生，總之前後業感緣起，前面的蘊滅，後面的蘊生，是「結蘊相續」。在這個裡邊繼續不斷地這個五蘊身，繼續不斷地向前推衍，說結生相續。那個蘊、五蘊，不是有一樣真實的東西。而這個五類東西，到那個時候舊的壞了，新的又生起來了，這一個東西，生新起來的繼續不斷向前面推衍下去，這個相續體，這個就是被綁住的這個。而業跟煩惱，綁住那個蘊體，就是這麼；就像那個繩子綑著你，就這麼簡單。這個繩子是業跟煩惱，現在這個你呢，就是這個蘊，五蘊。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/023.mp3"},{"文":"故從此脫，即名解脫，","口譯":"所以從這當中脫離，就叫做解脫；","四家合註":null,"覺燈日光":null,"時":"67B 17:55","頁":153,"af":"67b","st":1075,"et":1082,"消文":[{"文":"從這個地方解脫開來，就是。"}],"延伸":[],"逐字稿":[{"t":"67B 17:55","b":[["q","故從此脫，即名解脫，"],["s","就是這樣，從這個地方解脫開來，就是！"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/024.mp3"},{"文":"欲求得此，即是希求解脫之心。","口譯":"想要求得這個，就是希求解脫之心。","四家合註":null,"覺燈日光":null,"時":"67B 18:02","頁":153,"af":"67b","st":1082,"et":1094,"消文":[{"文":"「不要被它綁住，我一定要想辦法跳出來」，就是這個。"}],"延伸":[],"逐字稿":[{"t":"67B 18:02","b":[["q","欲求得此，即是希求解脫之心。"],["s","你現在呢要想從這個地方，說唉呀，不要被它綁住，我一定要想辦法跳出來，就是這個，就是這樣！"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/025.mp3"},{"文":"又此解脫，非為惑業諸行生已息滅，以諸生法，於第二時定不安住，不待修習能治等緣，則不須勵力，一切解脫便成過失，","口譯":"再者，這個解脫，並不是指惑、業等諸行生起之後自然息滅；因為一切有生之法，到了第二剎那一定不會安住，若這樣就算解脫，那就不必依靠修習對治等因緣、不須努力，一切都會自然解脫，這就成了過失。","四家合註":null,"覺燈日光":null,"時":"67B 18:14","頁":153,"af":"67b","st":1094,"et":1199,"消文":[{"文":"業跟煩惱的諸行前滅後生，生滅不停，生完自己就會消滅。"},{"文":"如果不修習對治，它就繼續不斷地生滅相續下去；必定要修習對治，斷了這個相續。"}],"延伸":[],"逐字稿":[{"t":"67B 18:14","b":[["q","又此解脫，非為惑業諸行生已息滅，以諸生法，於第二時定不安住，不待修習能治等緣，則不須勵力，一切解脫便成過失，"],["s","前面我們不是說業跟煩惱是能綁的東西，然後呢結蘊相續，就是我們生死的流轉的這個所綁的東西。那麼業跟煩惱的，說這個裡邊這樣，說這個業跟煩惱的諸行，它這個前面滅，後面的生。生完了以後它又滅，滅完了以後又生，生滅不停的。所以它生完了以後，它自己就會消滅。「以諸生法，於第二時定不安住」，它那個結蘊的事情，本身就是永遠生滅，永遠生滅。「不待修習」，假定說你不要去修習，說「不待修習能治等緣，則不須勵力，一切解脫便成過失」，就是說，那結蘊的體本身是什麼東西？找不到。它是怎麼一個？生滅繼續相續，換句話它一直相續的，一直相續下去的。這種情況之下，你必定要修習對治，斷了這個相續，那就對了。否則的話，如果你不修習對治的話，是呀，如果你不修習的話，對不起，它本身啊，它繼續不斷地就生滅、生滅、生滅。所以，"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/026.mp3"},{"文":"故若未生對治，當於未來結生相續。","口譯":"所以如果沒有生起對治，未來還會結生相續。","四家合註":null,"覺燈日光":null,"時":"67B 19:59","頁":153,"af":"67b","st":1199,"et":1207,"消文":[{"文":"沒有修這個對治，它永遠接下去。"}],"延伸":[],"逐字稿":[{"t":"67B 19:59","b":[["q","故若未生對治，當於未來結生相續。"],["s","所以你沒有修這個對治的話，它永遠接下去。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/027.mp3"},{"文":"由其發起對治力故，結生相續即便止息。","口譯":"由於發起了對治力，結生相續就會止息。","四家合註":null,"覺燈日光":null,"時":"67B 20:07","頁":153,"af":"67b","st":1207,"et":1555,"消文":[{"文":"針對結生相續修習，它就停止，繫縛也就沒有了。"},{"文":"求解脫一定要有正確的方法；方法的內容留在下一次講。"}],"延伸":[],"逐字稿":[{"t":"67B 20:07","b":[["q","由其發起對治力故，結生相續即便止息。"],["s","你一定要修習，針對著這個生死流轉的結生相續，那麼它那個東西就停止了；那個停止了以後，那個繫縛也就沒有了。所以這個地方特別告訴我們，我們要求解脫心，那麼要求什麼解脫心呢？就要對這個結生相續，要找到如法如理的對治，對治了這個東西以後，那麼這個解脫才能夠具體地成就。了解了，所以說，哦，要求解脫，要一定要有解脫的方法，正確的方法，簡單的一句話就是這個。至於這個方法的內容呢，我想留在下面一次再講，今天這一堂就講到這個地方。"]]},{"t":"67B 21:09","b":[["s","今天，《菩提道次第廣論》一百五十三頁，卷六，共中士，中士道。那麼這個中士，由於前面那個基礎上來，我們進一步了解說，雖然人天當中保持了善趣，是善道，但是畢竟最後還要墮落。由於這個原因，所以想到畢竟墮落還是苦，這樣不行，進一步還要更求進一步的解決。那麼那個從這個基礎上面，又向上一步，這個叫中士。那麼次第呢分四部分：正修意樂，哪一個是正式的，就是我們說中士要修的。換句話說我們的心裡的內容，我們應該有的認識，以及心裡這個狀態是什麼樣。那麼怎麼樣才能夠發生這樣的一個狀態，他告訴我們的，用什麼方法才行。這了解了以後，有一種錯誤的概念要去掉。對正確的了解了，錯誤的去掉了，最後告訴我們，那麼現在修什麼樣的道，能夠達到你這個目的。這個分這個四科，這個次第層層推進，圓成我們的目標。"]]},{"t":"67B 23:16","b":[["s","那麼前面已經說過，所謂求解脫的心是指什麼樣的心？那麼這個心怎麼樣才能夠發起？平常說我們大家都希望，沒有一個人例外的，要想從痛苦當中脫出來，要想從痛苦當中脫出來。沒有一個人例外的，可是找不到，原因呢就是自己的愚癡，自己的愚癡。因為愚癡、不了解，所以不曉得從哪裡去找。現在我們很幸運地曉得，哦，要去找一定從那個方面，這個就歸結到從三寶。那麼更從那個地方了解了，單單前面這個不夠，更進一步到這裡。"]]},{"t":"67B 24:15","b":[["s","那麼說現在呢，雖然我們進一步要求解脫，但是這個解脫的心，是曉得解脫，怎麼樣才能夠使得這樣的這個內心，跟它相應的如理如量地生起來？雖然我們大家都會這樣覺得：唉呀，這要求解脫啊！雖然你要求解脫，但是想完了以後，那下面就沒有一個力量來推動你，沒有一個力量來推動你，這樣。因為沒有推動的力量，所以當你想的時候儘管想，想完了以後，仍舊陷在自己一向的這一種習性當中，這種習性就是無明相應的見思煩惱。那種見思煩惱，儘管你拿來閱讀佛經，有的讀了半天增長各式各樣的知見，增長各式各樣的知見。結果呢它本來是要指導我們，憑這個去跳出輪迴的，淨化這個知見的；結果你弄了個半天，知見增長了一大堆。知見增長了，慢心也跟著增長，結果是煩惱是越弄越多。所以在這地方我們要很善巧地，找到這個正靜息的方便。那麼現在他下面告訴我們："]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/028.mp3"},{"文":"第二«發此之方便»者。","口譯":"第二、發起此（希求解脫）心的方便。","四家合註":null,"覺燈日光":null,"時":"67B 25:55","頁":153,"af":"67b","st":1555,"et":1568,"消文":[{"文":"怎麼樣能夠啟發這樣一個如理如量的認識。"}],"延伸":[{"題":"發此之方便","組":[{"題":"中士四科，層層推進","說":[{"類":"因","文":"下一堂開頭複習：正修意樂、生起之量、除遣邪執、決擇解脫道性，次第層層推進。"}]},{"題":"求脫苦而不得其門","說":[{"類":"因","文":"沒有一個人不想從痛苦中脫出來，可是找不到，原因是自己的愚癡。"},{"類":"立","文":"我們很幸運曉得要從三寶去找，更從這裡進一步。"}]},{"題":"沒有推動之力","說":[{"類":"破","文":"想求解脫，想完了沒有一個力量推動你，仍舊陷在無明相應的見思煩惱習性中。"},{"類":"破","文":"讀經增長一大堆知見，慢心也跟著增長，煩惱越弄越多。"},{"類":"回扣","文":"所以要很善巧地找到正靜息的方便，下面就告訴我們。"}]}],"說":[{"類":"因","文":"下一堂開頭複習：正修意樂、生起之量、除遣邪執、決擇解脫道性，次第層層推進。"},{"類":"因","文":"沒有一個人不想從痛苦中脫出來，可是找不到，原因是自己的愚癡。"},{"類":"立","文":"我們很幸運曉得要從三寶去找，更從這裡進一步。"},{"類":"破","文":"想求解脫，想完了沒有一個力量推動你，仍舊陷在無明相應的見思煩惱習性中。"},{"類":"破","文":"讀經增長一大堆知見，慢心也跟著增長，煩惱越弄越多。"},{"類":"回扣","文":"所以要很善巧地找到正靜息的方便，下面就告訴我們。"}],"複習":true,"af":"67b","st":1269}],"逐字稿":[{"t":"67B 25:55","b":[["q","第二發此之方便者。"],["s","怎麼樣能夠啟發這樣一個如理如量的認識。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/029.mp3"},{"文":"譬如欲得止息渴苦，由於渴逼，見非愛相。","口譯":"譬如想要止息口渴之苦，是因為被渴所逼迫，看見了它不可愛的樣子。","四家合註":null,"覺燈日光":null,"時":"67B 26:08","頁":153,"af":"67b","st":1568,"et":1633,"消文":[{"文":"嘴巴渴得痛苦不堪，就一心一意要去找水喝。"},{"類":"喻","文":"小病叫你看醫生也懶得看；病痛苦難受了，叫你不看也做不到。"},{"文":"感到它可怕、痛苦，由這個力量逼迫，才會一心去求從痛苦中透脫。"}],"延伸":[],"逐字稿":[{"t":"67B 26:08","b":[["q","譬如欲得止息渴苦，由於渴逼，見非愛相。"],["s","那麼先舉一個譬喻。譬如說我們嘴巴渴了以後，覺得痛苦不堪，那麼你一心一意要想去找水喝。為什麼？因為你覺得嘴巴渴的時候，那是痛苦難受。這個譬喻我們可以更加深一點說，你生了病，假如那個小病沒有關係的話，叫你去看醫生你也懶得看。但是那個病痛苦難受的話，叫你不看醫生也做不到。同樣的道理，一定是對於這件事情感到它的非可愛，就是應該這麼反面的，更強烈說可怕、痛苦的這種狀態，由於這個力量逼迫，所以你一心就去求怎麼解脫痛苦，怎麼從痛苦當中透脫出來。所以"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/030.mp3"},{"文":"如是欲得，諸取蘊苦寂滅解脫，亦由觀見，取蘊苦性«所有過患»。","口譯":"同樣地，想要得到諸取蘊之苦寂滅的解脫，也要靠觀見取蘊（身心五蘊）是苦性的種種過患。","四家合註":null,"覺燈日光":null,"時":"67B 27:13","頁":153,"af":"67b","st":1633,"et":1724,"消文":[{"文":"取蘊就是我們身心的五蘊，它的特質是苦，以及苦的種種過失患害；真實見到了，才會一心求跳出來。"}],"延伸":[{"題":"所有過患","組":[{"題":"不見過患，求脫是空話","說":[{"類":"立","文":"見到了才會找解脫道、努力去修；這是道的根本。"},{"類":"破","文":"沒有這個力量，推動你的力量都沒有，嘴巴上都是空話。"}]},{"題":"處處把握原則","說":[{"類":"例","文":"為什麼要持戒？同樣要把握得住這個原則。"},{"類":"破","文":"否則弄弄弄就弄錯掉了。"}]}],"說":[{"類":"立","文":"見到了才會找解脫道、努力去修；這是道的根本。"},{"類":"破","文":"沒有這個力量，推動你的力量都沒有，嘴巴上都是空話。"},{"類":"例","文":"為什麼要持戒？同樣要把握得住這個原則。"},{"類":"破","文":"否則弄弄弄就弄錯掉了。"}],"af":"67b","st":1633}],"逐字稿":[{"t":"67B 27:13","b":[["q","如是欲得，諸取蘊苦寂滅解脫，亦由觀見，取蘊苦性所有過患。"],["s","同樣的，現在我們要想從這個苦蘊當中得到解脫，解決這個苦，也必須見到這個取蘊 這個取蘊就是我們身心的五蘊 它那個特質是苦的，以及它這個苦的種種的過失、患害。當你真實地見到了，那個時候你才一心一意才會求它跳出來。你要見不到這個的話，那根本不可能，所以說這個是道的根本在這裡。因為你要從這個地方求解脫，有找到了解脫的這個道，進而去找，找到了解脫之道，那時候你才會努力去修。你沒有這個力量的話，推動你的力量都沒有啊，所以嘴巴上面都是空話，原因在此。我們每一個地方必定要把握得住！乃至於現在你說，你為什麼要持戒？同樣的道理，你必定要把握得住這個原則，這個是最重要的。否則的話，你弄弄弄就弄錯掉了，弄弄弄就弄錯掉了。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/031.mp3"},{"文":"故若未修三有過患，於彼發起欲捨之心，則於苦滅不起欲得。","口譯":"所以如果沒有修習三有的過患，對它生起想要捨離的心，那麼對於苦的寂滅，就不會生起想要得到的心。","四家合註":null,"覺燈日光":null,"時":"67B 28:44","頁":153,"af":"67b","st":1724,"et":null,"消文":[{"文":"第一件事先要認識苦蘊所在的三有的種種禍患、不理想。"},{"文":"見到了就產生厭惡捨離，為了跳出來，才會去求解除痛苦的方法。"}],"延伸":[],"逐字稿":[{"t":"67B 28:44","b":[["q","故若未修三有過患，於彼發起欲捨之心，則於苦滅不起欲得。"],["s","所以第一件事情，我們先一定要認識苦蘊所在的三有，這個三有的種種禍患，種種的不理想。當你見到了不理想、禍患的話，你就一心一意產生厭惡捨離，一心一意從這個地方跳出來。為了要跳出來，你就想怎麼樣才把這個痛苦能夠解除，你才會去求解除的這個方法。"]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/032.mp3"},{"文":"《四百論》云：「誰於此無厭，彼豈敬寂靜，如«貪著自家»，難出此三有。」","口譯":"《四百論》說：「誰對此（三有）沒有厭離，他怎麼會敬重寂靜（涅槃）？就如同貪戀自己的家一樣，難以出離這三有。」","四家合註":null,"覺燈日光":null,"時":"68A 00:15","頁":153,"af":"68a","st":15,"et":345,"消文":[{"文":"不生厭離心，怎麼可能求寂滅；見到三有這麼好，貪著難捨，怎麼可能跳出來。"}],"延伸":[{"題":"貪著自家","組":[{"題":"不知為何而學，空轉一生","說":[{"類":"破","文":"說要修行、受戒、出家、認真去學，根本沒把握住為什麼來學，知見學問一大堆，始終在空轉。"}]},{"題":"先把握根本因","說":[{"類":"立","文":"先把根本因指出來；根本因有了，在上面著力，慢慢增長圓滿就行了。"},{"類":"破","文":"否則忙了半天，圓滿的是染污之因，越做越遠。"}]},{"題":"三世怨","說":[{"類":"例","文":"修福德沒把握根本因，將來福報很大；做學問，這一世很聰明；持戒相，轉世聲望官位很高。"}]},{"題":"根本把握，修哪門都對","說":[{"類":"例","文":"念佛如救頭燃，那句佛號就念得非常堅固；持戒曉得目的，就很努力；做學問也是。"},{"類":"破","文":"否則處處諍論，我對你錯。"}]},{"題":"兩種偏差","說":[{"類":"破","文":"一種忙著要解脫、不管方法，關起門修了半天，在煩惱中轉不知道。"},{"類":"破","文":"一種先作學問，不曉得目的，比較各宗各派，諍論不曉得引起多少。"},{"類":"回扣","文":"所以這裡特別告訴我們：希求解脫的方法，根本何在。"}]}],"說":[{"類":"破","文":"說要修行、受戒、出家、認真去學，根本沒把握住為什麼來學，知見學問一大堆，始終在空轉。"},{"類":"立","文":"先把根本因指出來；根本因有了，在上面著力，慢慢增長圓滿就行了。"},{"類":"破","文":"否則忙了半天，圓滿的是染污之因，越做越遠。"},{"類":"例","文":"修福德沒把握根本因，將來福報很大；做學問，這一世很聰明；持戒相，轉世聲望官位很高。"},{"類":"例","文":"念佛如救頭燃，那句佛號就念得非常堅固；持戒曉得目的，就很努力；做學問也是。"},{"類":"破","文":"否則處處諍論，我對你錯。"},{"類":"破","文":"一種忙著要解脫、不管方法，關起門修了半天，在煩惱中轉不知道。"},{"類":"破","文":"一種先作學問，不曉得目的，比較各宗各派，諍論不曉得引起多少。"},{"類":"回扣","文":"所以這裡特別告訴我們：希求解脫的方法，根本何在。"}],"af":"68a","st":15}],"逐字稿":[{"t":"68A 00:15","b":[["q","《四百論》云：「誰於此無厭，彼豈敬寂靜，如貪著自家，難出此三有。」"],["s","任何一個人，對於這一個事情，如果不產生厭離心的話，他怎麼可能求寂滅這個厭離的方法呢？不可能的。反過來，他因為不了解這個三有的過患，而他見到三有這麼個好，所以他貪著難捨。既然貪著難捨，怎麼可能讓他從這個地方跳出來，怎麼可能從這個地方跳出來？所以啊現在有很多人哪，哎呀，要修行，說是要修行，喔唷，乃至於說受戒，乃至於出家，乃至於認真地去學；學了半天，他根本就沒把握住 ─你為什麼要跑得來學？他把握不住。所以到後來，知見一大堆，學問做了一大堆，有很多這樣。結果呢他始終在那個地方空轉，那是非常可惜，那是非常可惜！"]]},{"t":"68A 01:34","b":[["s","所以在這個地方，他首先把那個根本因指出來，換句話說，那個根本因有了，然後你在這個上面著力的話，把那個根本因慢慢增長圓滿，也就行了。否則的話，你忙了半天，忙了半天你所圓滿了什麼？染污之因，越做越遠，越做越遠哪，這一點是我們在這個地方首先應該認識。有了這個認識，然後你步步深入，所有的這些事情，都是幫忙我們解脫生死的。如果你這一個不認識，然後你跑進去的話，你那個知見都是不相應的，都是不相應的，這樣。那麼這種知見到後來呢，如果說你修的功德，那三世怨，到那個時候你很有錢；如果說你做學問，三世怨，你很有學問，就是這樣。"]]},{"t":"68A 02:35","b":[["s","所以現在有很多很有學問的人，很有財勢的人，乃至於很有地位的人，那種人他不能進入佛法的原因是什麼？就是有一類他修福德，啊，也在佛門當中布施、弄啊，修廟乃至於，但是根本因在哪裡，沒有把握得住。開始他是對的，沒有把握得住，所以他將來得到福報很大。有一類他那個時候，然後呢做學問做得很多，哎呀，經哪、律啊、論，然後深入思惟、觀察，乃至於講說，但是同樣地，根本因沒有把握得住，這一世很聰明，乃至於念書念得很好。有一類，持戒的戒相上面啊，做得非常地如宜，但是雖然如此，他真正的自淨其意，他的根本，為什麼要持這個戒的目的把握不住，這一轉世的時候，他聲望 ─說官位很高，那這個都是這樣來的。"]]},{"t":"68A 03:54","b":[["s","所以現在在這個地方，不管我們將來學什麼，你這一個根本因一定要把握得住，把握得住以後，然後不管你修哪一個都對。譬如說我們現在淨土念佛，是正因為如此，所以你那時候如救頭燃，「唉呀，別的我管不到啦，我只有一心一意依靠阿彌陀佛啊！」那時候你那句佛號就念得非常堅固。如果你持戒的話，你曉得得非常清楚，原來這戒的目的是在這個地方，自然而然你把握得住了，你就很努力。做學問也是如此。否則的話，我們處處地方產生諍論，說我這個對、你這個錯，然後呢大家又要忙這個、忙這個。在佛世的時候，這個典型的例子就是這樣。佛就告訴他這樣，喔，他聽見了，全部精神貫注在他自己的問題上，要解決這個問題。如果他解決了，解決了以後他煩惱解脫了，那個時候你再做就好了。"]]},{"t":"68A 05:00","b":[["s","那我們現在，不，有一種人比較差的，哎呀，忙著要去解脫，不管這些。結果呢，方法得不到，儘管你關起門來修行，修了半天，在煩惱當中轉，不知道。那麼反過來有一類人是先要了解，然後去作學問，作了學問作了半天，他不曉得作學問的目的是什麼，然後比較各宗、各派、各家、各門，這個對、這個不對，學問一大堆，諍論不曉得引起多少，也跑到外頭去，這個我們必須要認識的。所以現在這個地方特別告訴我們，喏，希求解脫的方法，根本何在！那看下去，說："]]}],"口譯音":"口譯音檔/xiqiu-jietuo-01/033.mp3"}],"投影片":[{"img":"投影片/xiqiu-jietuo-01/001.webp","n":1},{"img":"投影片/xiqiu-jietuo-01/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/xiqiu-jietuo-01/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/xiqiu-jietuo-01/004.webp","n":4},{"img":"投影片/xiqiu-jietuo-01/005.webp","n":5},{"img":"投影片/xiqiu-jietuo-01/006.webp","n":6},{"img":"投影片/xiqiu-jietuo-01/007.webp","n":7},{"img":"投影片/xiqiu-jietuo-01/008.webp","n":8,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=67a&st1=1531&et1=1785","box":[0.124875,0.3591111111111111,0.12525,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/xiqiu-jietuo-01/009.webp","n":9},{"img":"投影片/xiqiu-jietuo-01/010.webp","n":10},{"img":"投影片/xiqiu-jietuo-01/011.webp","n":11},{"img":"投影片/xiqiu-jietuo-01/012.webp","n":12,"photo":[0.6531148499015748,0.175,0.2845203001968504,0.725]},{"img":"投影片/xiqiu-jietuo-01/013.webp","n":13,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=67b&st1=188&et1=503","box":[0.544875,0.29466666666666663,0.13775,0.06844444444444445]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/xiqiu-jietuo-01/014.webp","n":14},{"img":"投影片/xiqiu-jietuo-01/015.webp","n":15},{"img":"投影片/xiqiu-jietuo-01/016.webp","n":16,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=67b&st1=503&et1=756","box":[0.124875,0.3591111111111111,0.12525,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/xiqiu-jietuo-01/017.webp","n":17},{"img":"投影片/xiqiu-jietuo-01/018.webp","n":19},{"img":"投影片/xiqiu-jietuo-01/019.webp","n":20},{"img":"投影片/xiqiu-jietuo-01/020.webp","n":21},{"img":"投影片/xiqiu-jietuo-01/021.webp","n":22,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=67b&st1=905&et1=1094","box":[0.519875,0.25577777777777777,0.10900000000000001,0.064]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/xiqiu-jietuo-01/022.webp","n":23},{"img":"投影片/xiqiu-jietuo-01/023.webp","n":24},{"img":"投影片/xiqiu-jietuo-01/024.webp","n":25,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=67b&st1=1269&et1=1555","box":[0.123625,0.3591111111111111,0.1265,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/xiqiu-jietuo-01/025.webp","n":26},{"img":"投影片/xiqiu-jietuo-01/026.webp","n":27},{"img":"投影片/xiqiu-jietuo-01/027.webp","n":28},{"img":"投影片/xiqiu-jietuo-01/028.webp","n":29,"photo":[0.04024803149606299,0.17,0.919628875492126,0.73]},{"img":"投影片/xiqiu-jietuo-01/029.webp","n":30,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=67b&st1=1568&et1=1770","box":[0.519875,0.25577777777777777,0.10900000000000001,0.064]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/xiqiu-jietuo-01/030.webp","n":31},{"img":"投影片/xiqiu-jietuo-01/031.webp","n":32,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=68a&st1=15&et1=345","box":[0.124875,0.3591111111111111,0.12525,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/xiqiu-jietuo-01/032.webp","n":33},{"img":"投影片/xiqiu-jietuo-01/033.webp","n":34},{"img":"投影片/xiqiu-jietuo-01/034.webp","n":35,"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/xiqiu-jietuo-01/035.webp","n":39,"yt":"E1qFpq1i0fY"},{"img":"投影片/xiqiu-jietuo-01/036.webp","n":40}],"投影片PDF":"投影片/xiqiu-jietuo-01/slides.pdf","音檔範圍":"67A 24:08～68A 05:45"},"siwei-kudi-01":{"id":"siwei-kudi-01","標題":"思惟苦諦(1)","根":"顯示四諦先說苦諦之意趣","科判焦點":"癸一 顯示四諦先說苦諦之意趣","課本範圍":"P154 L1 ~ P155 L7","堂數":85,"日期":"2026/11/3","分圖":[{"名":"違次第之扼要","原文":[0,6]},{"名":"四諦次第","原文":[7,16]},{"名":"總攝與策勵","原文":[17,22]}],"跨科判":null,"週":109,"班級":"24秋007","音檔":{"68a":{"local":"音檔/gl1/068A.mp3","remote":"https://lamrim.xyz/player/media/gl1/068A.mp3"},"68b":{"local":"音檔/gl1/068B.mp3","remote":"https://lamrim.xyz/player/media/gl1/068B.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=68a&st1=345&af2=68b&et2=1051","段":[{"文":"希求解脫方便分二：一由於苦集門中思惟，二由於十二緣起思惟。","口譯":"希求解脫的方便分為二：一、由苦集門中思惟，二、由十二緣起思惟。","四家合註":null,"覺燈日光":[{"類":"整段","文":"以現觀生起的次第來講，現觀次第就是證量生起的次第，或思（四聖諦）的模式，首先思惟我們為什麼會苦？是真的苦嗎？反復地思惟苦相的道理。如果痛苦是不能解決的，思惟痛苦就無用，還不如就不要去想痛苦，讓自己保持樂觀的態度。如果痛苦是可以解決的，思惟痛苦就很有意義了。因為痛苦是可以解決的緣故，我們若再保持樂觀，就是欺騙自己，那就不對了。我們應該更積極地去解決痛苦，讓自己獲得永久的安樂才是。","涵蓋":[0,17]},{"類":"整段","文":"從無始以來，我們一直欲求離苦得樂，卻一直在累積錯誤的因緣，想要離苦得樂，結局卻是離樂得苦。如果追求快樂的方式不改，我們再怎麼想要離苦得樂，結果還是會跟今天一樣。再過千劫、萬劫、億劫，也都是一樣，因為因果絲毫不爽。我們把離苦得樂的權利、一生所追求的目標，非常愚蠢地完全交給愛我執和我執去操控。愛我執心胸如此狹小，它只想到自己；我執對實際情況完全不瞭解，是一種執實的顛倒執著，我們居然把自己的痛苦和快樂交給這兩個執著。口頭上說歸依佛，但實際上，我們歸依的是愛我執和我執。一再如此，所感得的果報是什麼呢？如同宗喀巴大師所說：「四大瀑流猛漂激，業繩繫縛難掙脫。」一直想要離苦得樂，一直想要從痛苦的苦海中脫離，可是卻被生、老、病、死之激烈瀑流帶走，無自主地一直漂流著。如果漂流時，我們的手腳可以活動，可以游泳，至少還有脫離的機會，可是我們不只是被四大瀑流牽引，同時也被業的繩索緊緊捆綁，無法掙脫。","涵蓋":[0,17],"校":"系縛→繫縛"},{"類":"整段","文":"「業繩繫縛難掙脫」的另一個理由是，我們不是看到煩惱的過患或修法之後就不會再造業了。即使看到了煩惱的過患，只要沒有透過對治力去消滅煩惱的根本，我們就一直隨著煩惱而造業。只要內心煩惱生起，心與煩惱相應，我們的身語意就每一刹那都在造業。我們現在所感的果，可能是一個業所引發的好幾世之一。一個業所引發的好幾世中，我們又累積了多少業？不要說一世、一天，就說一個小時裡面，我們就造了許多業。我們會造多少業？千萬，甚至億萬、百億萬、千億萬的業？我們的業只會越來越多，而且大都與煩惱相應。所以業繩真的是緊緊繫縛著我們，如何能掙脫呢？過去的業還沒消受完，又再造新業，真是太恐怖了。四大瀑流就是這樣一直逼迫我們，牽引著我們，我們隨著瀑流無有自主地漂流。","涵蓋":[0,17],"校":"系縛→繫縛"},{"類":"整段","文":"「既入我執堅鐵網」、「復被無明大暗蔽」，而且我們又被投入無明我執的堅鐵網當中。我們所做的事，幾乎都是隨著愛我執和真實執著，也就是在心胸非常狹小的觀念下及顛倒認知實相的情況下去做事。如此，想要從生、老、病、死當中脫離，真是太難了。如果眼睛可以看得到，至少內心還可以安穩一點，可是卻又被無明的黑暗給蒙住，根本無法看到實際的狀況。在煩惱等內外因緣聚集下，如何才能看到正法等善因緣呢？所以《入行論》中說到：善法好比是我們長久居住在黑暗當中一刹那的閃電一樣，是如此地短促，如此地微弱。","涵蓋":[0,17],"校":"複被→復被"},{"類":"整段","文":"「無邊生死生復生，三苦逼害恒相續。」痛苦源源不斷，一定是我們在離苦得樂的方法上有了錯誤。如果方法沒有錯，無始以來到現在，我們都致力於離苦得樂，今天應該是很快樂才對，可是卻沒有。我們要仔細思考這個問題。","涵蓋":[0,17],"校":"生複生→生復生"}],"時":"68A 05:45","頁":154,"af":"68a","st":345,"et":396,"消文":[{"文":"啟發的方法分兩部分：一由集諦門思惟，二由十二緣起門思惟。"},{"文":"兩者任意了解一個、把握住一個，問題就可以解決。"}],"延伸":[],"逐字稿":[{"t":"68A 05:45","b":[["q","希求解脫方便分二："],["s","這個啟發的方法分兩部分，第一個由集諦門思惟，第二個由十二緣起門思惟。"]]},{"t":"68A 05:54","b":[["q","一由於苦集門中思惟，二由於十二緣起思惟。"],["s","這兩者當中你任意能夠了解一個，把握住一個，問題就可以解決了。你要想兩個都認識的話，那彼此之間為什麼要這樣開合，如果你弄得很清楚的話，那這個問題真是易如反掌。你去到 ……在任何情況之下，你可以處處體會，可以處處體會，所有的眼前這種障礙，都消除掉了。現在我們分那個兩部分看下去：初就是由苦集門中，分二。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/001.mp3"},{"文":"初中分二：一思惟苦諦生死過患，二思惟集諦流轉次第。初中分二：一顯示四諦先說苦諦之意趣，二正修苦諦。今初","口譯":"第一又分二：一、思惟苦諦──生死的過患，二、思惟集諦──流轉的次第。第一又分二：一、顯示四諦中先說苦諦的意趣，二、正修苦諦。以下說第一。","四家合註":null,"覺燈日光":null,"時":"68A 06:36","頁":154,"af":"68a","st":396,"et":486,"消文":[{"文":"先認識、觀察、思惟：生死的特質是苦，確確實實是苦。"},{"文":"再問：為什麼會在生死當中流轉？"},{"文":"先說明四諦為什麼先講苦諦，然後正講苦諦。"},{"文":"平常覺得「告訴我們就好」，找不到必須這樣說的理由；實際上有絕大的原因。"}],"延伸":[],"逐字稿":[{"t":"68A 06:36","b":[["q","一初中分二：思惟苦諦生死過患，"],["s","第一個先要了解、認識、觀察、思惟，這個生死的特質是什麼？苦，是苦。確確實實這一個是苦的。第二個呢，"]]},{"t":"68A 06:55","b":[["q","二思惟集諦流轉次第。"],["s","那麼為什麼會在生死當中流轉呢？為什麼呢？這樣。這個兩部分，又一一各別分開來講。"]]},{"t":"68A 07:11","b":[["q","初中分二：一顯示四諦先說苦諦之意趣，二正修苦諦。　今初"],["s","先說明四諦，說苦集滅道，為什麼先要講苦諦的原因，然後正講苦諦，現在說下去。要平常在我們一般狀態學的時候，我們就說：「經上面嘛告訴我們苦集滅道，你就告訴我們算囉！他為什麼要講，哦，『先說苦諦』啊、為什麼啊，這個次第為什麼要這講啊？」這樣。平常我們說：「啊！你趕快告訴我，告訴我們曉得嘛就好啦！」好像那個道理表面上面，我們找不到必須要說的理由，通常我們這種狀態。實際上呢，這個有他的絕大的原因在，絕大的原因在，現在我們把這個文看下去。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/002.mp3"},{"文":"集諦為因，苦諦是彼之果，故集是先，果應是後。","口譯":"集諦是因，苦諦是它的果，所以集應在先，果應在後。","四家合註":null,"覺燈日光":[{"類":"確定","文":"以四聖諦的生起次第來說，污染的因果二諦是先有集諦後有苦諦，清淨的因果二諦是先有道諦才有滅諦。先以見道無間道現證空性的智慧正對治煩惱，見道無間道時現證空性的智慧就是道諦，由此在見道解脫道時才會獲得斷除見道所斷之滅諦，所以先有道諦才能證得滅諦。既然集諦先有，苦諦後有，為何世尊不按照這種次第而說，卻先說苦諦，後說集諦呢？宗喀巴大師說，導師釋迦牟尼佛沒有按照因果次第宣說四聖諦，而以現觀次第宣說，有極大意義、具極大的修持扼要。為什麼呢？如果有情不想獲得解脫，再怎麼跟他說解脫之道，他也不會去追求。雖然道諦先有，滅諦後有，可是如果他不想追求滅諦，縱使跟他說道諦，他也不會想要去獲得。為了對滅諦生起希求心，我們必須先看到滅諦的功德。在看到滅諦的殊勝之前，必須瞭解為什麼要尋求滅諦、為什麼要解脫。我們現在所擁有的輪迴的安樂只是短暫的，我們被欺騙、迷惑，以為這是真正的安樂，由此感到心滿意足。實際上，我們不能滿足於短暫的安樂，因為有更長久的安樂值得去追求。透過這種方式引導，才是非常有智慧的引導方式：首先使有情瞭解，只要被業和煩惱所轉，就沒有任何的安樂。認知此苦相，深深感覺痛苦，才會想要厭離，才會去尋求苦因。否則，想從痛苦當中解脫，只是一種想法、一種祈求而已，並不實際。如果真的想從痛苦當中獲得脫離，就不應該只是發願、祈求，而應該去尋找痛苦之因來自於哪裡，那就是集諦。","涵蓋":[2,6],"校":"輪回→輪迴、滿足于→滿足於"}],"時":"68A 08:06","頁":154,"af":"68a","st":486,"et":533,"消文":[{"文":"流轉生死的因是集，感得的果是苦。"},{"文":"照先後次第，應該集在先、苦在後。"}],"延伸":[],"逐字稿":[{"t":"68A 08:06","b":[["q","集諦為因，苦諦是彼之果，故集是先，果應是後。"],["s","集就是因。由於造了這個因，聚集了這個因，那麼感得的這個因的果。流轉生死的因是集，然後呢感得流轉生死的果是苦，所以照這個先後的次第，應該是集在先而苦在後。結果呢，世尊卻先講苦，後講集，所以說：為什麼原因世尊不順那個次第？"]]}],"口譯音":"口譯音檔/siwei-kudi-01/003.mp3"},{"文":"何故世尊不順彼義之次第而作是說，諸苾芻此是苦聖諦，此是集聖諦耶？","口譯":"為什麼世尊不依照這個義理的次第，卻這樣說：「諸比丘，這是苦聖諦，這是集聖諦」呢？","四家合註":null,"覺燈日光":null,"時":"68A 08:53","頁":154,"af":"68a","st":533,"et":559,"消文":[{"文":"世尊正講時先說「這是苦」，再說「這是集」，次第恰恰相反，什麼原因？"}],"延伸":[],"逐字稿":[{"t":"68A 08:53","b":[["q","何故世尊不順彼義之次第而作是說，諸苾芻此是苦聖諦，此是集聖諦耶？"],["s","世尊正講的時候先告訴我們：這個是苦啊，你應該知道，這是集啊！他那個次第卻先講苦然後講集，恰恰相反，什麼原因呢？下面就說："]]}],"口譯音":"口譯音檔/siwei-kudi-01/004.mp3"},{"文":"大師於此違因果次第而宣說者，以«有至大修持扼要»，故無過失。","口譯":"大師在這裡違反因果次第來宣說，是因為其中有極重大的修持扼要，所以沒有過失。","四家合註":null,"覺燈日光":null,"時":"68A 09:19","頁":154,"af":"68a","st":559,"et":750,"消文":[{"文":"佛把因果次第顛倒來說，有特別的原因：修行的綱要在這裡。"},{"文":"學了要去修，修的次第就是這樣，所以沒有任何過錯。"}],"延伸":[{"題":"修持扼要","組":[{"題":"缺少推動修行的力量","說":[{"類":"立","文":"我們不能修行，是缺少推動修行的力量：曉得要修，就是提不起來。"},{"類":"例","文":"故事中看見地獄、天堂的情況這麼嚴重，不管年輕年老都拼命了。"}]},{"題":"身病求醫，心苦求脫","說":[{"類":"喻","文":"生了病，該做的事都不願做，急著找醫生；病只是小小的苦。"},{"類":"立","文":"心理上也感受到苦切的力量，就坐立不安，一心求解脫。"},{"類":"回扣","文":"所以先說苦諦，這是修行的次第，這是正確的。"}]}],"說":[{"類":"立","文":"我們不能修行，是缺少推動修行的力量：曉得要修，就是提不起來。"},{"類":"例","文":"故事中看見地獄、天堂的情況這麼嚴重，不管年輕年老都拼命了。"},{"類":"喻","文":"生了病，該做的事都不願做，急著找醫生；病只是小小的苦。"},{"類":"立","文":"心理上也感受到苦切的力量，就坐立不安，一心求解脫。"},{"類":"回扣","文":"所以先說苦諦，這是修行的次第，這是正確的。"}],"af":"68a","st":559}],"逐字稿":[{"t":"68A 09:19","b":[["q","大師於此違因果次第而宣說者，以有至大修持扼要，故無過失。"],["s","第一個告訴我們，說佛對於這一件事情，把那個因果次第顛倒違反而說，他有他的特別的原因的。什麼原因？修行的綱要在這裡。你為什麼要學？你要學了去修行，結果你要修行的，那個次第就是這樣的，所以沒有任何過錯，沒有任何過錯。反過來說，他就是絕對正確地要這樣講，世尊之所以為世尊，原因就在這個地方。關於這一點，對於我們有一個非常重要的啟示。我們平常所以不能修行的原因，就是缺少了推動我們修行的力量，曉得這個要修行，要好，但是就提不起來。那麼我們以前聽過那個各式各樣的故事，那個故事都是這樣的：哎呀，他去了，出了家也不行。結果跑到地獄裡一看，跑到天堂上一看，哎呀！那個時候不管他年輕也好、年老也好，大家都拼命了。為什麼？啊！原來看見這個情況是這麼個嚴重。"]]},{"t":"68A 10:50","b":[["s","那麼同樣地，對我們也是一樣。我們雖然沒有這個福德因緣，感得佛菩薩帶我們到天堂地獄去看看，但是我們眼前都遭受到了。哦，一生了病，哎唷，生了病趕快去找醫生啊，這個事情，要該做的事情都不願意。你就急著、忙著，病是件小小的苦，你就拼命去找醫生。所以現在這個地方也指出來，說喏、喏、喏，這一個東西本身哪，是在大病、大苦當中啊！那麼他指出來了以後，如果說你能夠如理照他指出來的方法，一步一步地深入，那個時候你內心上面就產生一種狀態，什麼？覺得這個痛苦的逼迫性，就在這裡啊！那是無法忍受，你就拼命要去求解脫了。所以他為什麼要先說的次第。"]]},{"t":"68A 11:56","b":[["s","從剛才這個說的譬喻當中，我們也可感受得到，假定我們在生理上面遭到了病，我們會求醫。現在呢，照著這個方法，在心理上面，如果你也感受得到苦切的這種力量的話，你那時候就會坐立不安。坐立不安幹什麼？一心求解脫。你能夠這樣去，哪有不解脫的道理？所以這個是修行的次第，這個是正確的，這是正確的。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/005.mp3"},{"文":"此復云何，謂諸所化，若於生死自先未發無倒希求解脫之心，«根本斷絕»，彼於解脫云何能導。","口譯":"這是怎麼說呢？就是說：所化的眾生，如果對於生死，自己先沒有生起無顛倒的希求解脫之心，根本就斷絕了，那要怎麼引導他趣向解脫呢？","四家合註":null,"覺燈日光":null,"時":"68A 12:30","頁":154,"af":"68a","st":750,"et":1069,"消文":[{"文":"所化：世尊要化度的眾生。"},{"文":"對生死的本質不了解，貪著難捨，根本不想求解脫。"},{"文":"修是修解脫，根本不想解脫還教他修，那不是顛倒嗎？所以根本已經斷絕。"},{"類":"例","文":"彼於解脫云何能導：教他不要貪著，他覺得「這是我要的」，聽了生煩惱，越弄越遠。"}],"延伸":[{"題":"根本斷絕","組":[{"題":"先問來此的目的","說":[{"類":"下手","文":"不要說我在修行，先問問：你跑到這裡來，目的幹什麼？要很清楚。"}]},{"題":"宿生善根引入佛門","說":[{"類":"立","文":"今天有機會接觸佛法，都是宿生有善根。"},{"類":"因","文":"異熟、等流、士用：裡邊的因碰見外面的緣，看見出家就歡喜。"}]},{"題":"求解脫的根本因未立","說":[{"類":"因","文":"經過生死流轉迷糊掉了，又與世間染污、無始無明習氣相應。"},{"類":"例","文":"一心嚮往出家、求善知識、念佛，推動的因卻根本沒找到。"},{"類":"立","文":"作主的是無始生死的染心，求解脫的根本還沒建立，這叫根本斷絕。"}]},{"題":"以正知見破染污現行","說":[{"類":"下手","文":"先要有正確知見的認識，經過懺悔，把世俗染污的現行破壞、克服。"},{"類":"回扣","文":"大師外支已成，真正的問題都在自己的障礙當中。"}]}],"說":[{"類":"下手","文":"不要說我在修行，先問問：你跑到這裡來，目的幹什麼？要很清楚。"},{"類":"立","文":"今天有機會接觸佛法，都是宿生有善根。"},{"類":"因","文":"異熟、等流、士用：裡邊的因碰見外面的緣，看見出家就歡喜。"},{"類":"因","文":"經過生死流轉迷糊掉了，又與世間染污、無始無明習氣相應。"},{"類":"例","文":"一心嚮往出家、求善知識、念佛，推動的因卻根本沒找到。"},{"類":"立","文":"作主的是無始生死的染心，求解脫的根本還沒建立，這叫根本斷絕。"},{"類":"下手","文":"先要有正確知見的認識，經過懺悔，把世俗染污的現行破壞、克服。"},{"類":"回扣","文":"大師外支已成，真正的問題都在自己的障礙當中。"}],"af":"68a","st":750}],"逐字稿":[{"t":"68A 12:30","b":[["q","此復云何，謂諸所化，若於生死自先未發無倒希求解脫之心，根本斷絕，彼於解脫云何能導。"],["s","那就是這樣。對於所化的，就世尊要化度的那些眾生，他假定對於這個生死的本質並不了解，貪著難捨，根本不想求解脫，根本不想求解脫，那個時候你教他修，修什麼啊？修是修解脫，現在我根本不想修解脫，你修，那不是顛倒嗎？所以這根本已經斷絕了。諸位啊，這個地方好好地想一想，不要說我在那兒修行，我跑到那兒修行，你先問問：你跑到這裡來目的幹什麼啊？要很清楚、很明白。有一點我們必定要了解的，所有在座的各位，乃至於儘管不出家，今天跟佛法有機會接觸，都是宿生有善根。從前面我們講的業果的道理當中，曉得這個異熟同時有個等流，然後呢還有士用。士用就是外面的客觀的環境，異熟就是我們現在的這個身心的果報，然後呢等流就是心理，心生起的狀態。這個是宿生的善根所集，所以這一世，裡邊的因碰見外面的緣，你看見了出家你就歡喜，就會走上去。"]]},{"t":"68A 14:25","b":[["s","但是他為什麼要這樣走的這個根本的因，經過了這樣的生死的流轉以後，迷糊掉了。再加上出世了以後，前面所接觸的，都是世間染污，而這個染污呢，又是跟我們無始以來所種的這個無明習氣相應。所以以前一直都引發這個東西，所以在非常強有力的，世俗的這種貪染的現行當中，那個時候，對於求解脫這個心一點都沒有。當你接觸了以後，雖然啟發了好樂之心，跑到佛門當中來，但是那個根本本身有沒有？還沒有。這是所以一定第一件事情，要有正確的知見上的認識，經過懺悔，把前面跟世俗染污的這個現行，要把它破壞，還要把它克服。那個時候，他內心當中，引發出來這個認識，那個時候，你會心裡說：啊，要求解脫！"]]},{"t":"68A 15:47","b":[["s","我自己的經驗，以及我遇見很多同修，他就是一心一意，啊！對於出家的嚮往，然後呢要求善知識。儘管出家，儘管求善知識，但是呢，根本因真正找到的非常少。他也想去念佛，覺得念佛好，但是呢他這個推動的因始終不強；實際上與其說始終不強，這個推動的因根本都沒找到，就是這種狀態。就是宿生的這個善業，加上這一生的一個雜染，你糊裡糊塗有這種力量在這個裡頭的，但是呢他抉擇不出來。所謂抉擇不出來的話就是，不是以這個力量為主的，不是以這個力量主的。那麼是哪一個力量主的呢？就是 ─喏，無始生死的染心。現在我們雖然來了以後，對不起，眼睛所看，耳朵所聽，都是世俗上的那種，哎呀，知見上面、習性上面，種種的這些事情。所以說這個，他真正求解脫的根本，對不起，還沒有建立起來，這地方叫「根本斷絕」。"]]},{"t":"68A 17:06","b":[["s","「彼於解脫云何能導」，到那個時候你就引導教他解脫，你怎麼引導他呢？你教他說：「哎呀，不要貪著啊！」他覺得：「這是我要的東西，你教我這個不做、那個不做！」他儘管坐在那裡，心裡聽起來真是生煩惱。啊，你教他這樣做，他就覺得：「哎呀，最好我多睡一會兒覺，最好多做那個 ……。」教他這個不行、那個不行，那是越弄越遠哪，越弄越遠哪！這是我們要正確了解。所以說大師外支已成，真正的問題都在自己這個障礙當中，自己那個障礙當中啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-01/006.mp3"},{"文":"以諸所化無明闇覆，於諸苦性生死圓滿，執為安樂，«顛倒所誑»。","口譯":"因為所化的眾生被無明黑暗所覆蓋，對於本性是苦的生死圓滿（三有盛事），執著為安樂，被顛倒所欺誑。","四家合註":null,"覺燈日光":null,"時":"68A 17:49","頁":154,"af":"68a","st":1069,"et":1235,"消文":[{"文":"被無明癡闇覆障著，看不見事實的真相。"},{"文":"生死輪迴種種都是苦，被它現出的虛誑相所騙，覺得是安樂。"},{"文":"儘管宿生善根讓他跑來，他還是不行，根本原因在這裡。"}],"延伸":[{"題":"顛倒所誑","組":[{"題":"了解此理，一門深入","說":[{"類":"立","文":"正確了解這個，拿到哪一個法門都一心深入，就不起是非諍論。"},{"類":"例","文":"正法時「解脫堅固」，聽見「掃帚」兩個字，就把心裡的煩惱掃乾淨。"}]},{"題":"世智聰辯不相應","說":[{"類":"破","文":"聽了這麼多法，這也不對、那也不對，辨別一大堆，叫世智聰辯。"},{"類":"立","文":"真實淨化了，聰辯是絕端重要的工具。"},{"類":"回扣","文":"差就差在是否為顛倒所誑、無明所覆；第一件事要轉為正知見。"}]}],"說":[{"類":"立","文":"正確了解這個，拿到哪一個法門都一心深入，就不起是非諍論。"},{"類":"例","文":"正法時「解脫堅固」，聽見「掃帚」兩個字，就把心裡的煩惱掃乾淨。"},{"類":"破","文":"聽了這麼多法，這也不對、那也不對，辨別一大堆，叫世智聰辯。"},{"類":"立","文":"真實淨化了，聰辯是絕端重要的工具。"},{"類":"回扣","文":"差就差在是否為顛倒所誑、無明所覆；第一件事要轉為正知見。"}],"af":"68a","st":1142}],"逐字稿":[{"t":"68A 17:49","b":[["q","以諸所化無明闇覆，於諸苦性生死圓滿，執為安樂，顛倒所誑。"],["s","而這一個所化度之機 ─就是我們，這一個狀態當中，仍舊被這個無明癡闇覆障著，看不見事實的真相，看不見事實的真相。明明在生死輪迴當中，種種的這一種事情都是苦的，都是苦的。他把這一個苦的這個特質，現出來這個，在生死輪迴當中虛誑這些相，他被它所騙，覺得這是安樂的，這是安樂的。所以說「執為安樂，顛倒所誑。」你要教他這地方不要這樣，他還覺得：嗯，這個正是我所需要的，你教我不要，那怎麼可能？儘管他宿生的善根，讓他跑到這地方來，他還是不行，這根本原因在這裡。"]]},{"t":"68A 19:02","b":[["s","所以真正修學佛法，第一點你務必要了解這個。當你正確地了解這個，不管你拿到了哪一個法門，你就一心一意地從這個法門當中去深入，就不會大家起是非諍論。所以正法的時候叫作「解脫堅固」，他聽見了一個法，啊！他全部的精神貫注在這裡，乃至於聽見了「掃帚」兩個字，他掃掃、掃掃，然後呢把心裡的煩惱掃乾淨了。現在我們聽見了這麼多的法，哎呀，他偏偏還是說：「唉，這個也不對，那個也不對！」辨別得一大堆，啊，那個時候實在不相應啊！所以這種情況之下，叫作什麼？不幸地，這種叫世智聰辯，這個是我在這個地方，我們特別應該了解的。反過來，如果說你能夠真實地淨化了，這個對我們是絕端重要的一個工具，絕端重要的一個工具。差就差在什麼？喏，一點點 ─是不是為顛倒所誑？是不是為無明所覆？所以第一件事，要把這個不正確的認識轉變為正知見。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/007.mp3"},{"文":"如《四百論》云：「此大苦海中，悉無諸邊岸，愚人沉此中，云何不生畏。」","口譯":"如《四百論》說：「這個大苦海中，完全沒有邊際與岸，愚人沈溺在其中，怎麼不生起怖畏呢？」","四家合註":null,"覺燈日光":[{"類":"確定","文":"光是認識痛苦，想從痛苦中脫離是不夠的，必須要尋找苦因才是。這也是為什麼佛在宣說四聖諦的時候，不是以四聖諦的生起次第而說，而是以思惟四聖諦的模式，以現觀生起次第而說，即先說苦後說集，次說滅再說道。尚未生起脫離生死的希求心，對滅諦沒有希求，怎麼可能走上道諦？這是不可能的。所以雖然以因果生起次第來講，先有道諦，後有滅諦，可是以思惟模式來講，佛陀先說了滅諦，對滅諦生起了歡喜心，才會想要去學道。如果對現有的輪迴安樂深感喜足，怎麼會想要獲得解脫？那是不可能的。如《四百論》所說：「此大苦海中，悉無諸邊岸，愚人沉此中，云何不生畏？」所以必須先說凡是被業和煩惱所轉的一切都是苦性，沒有真正的安樂。透過苦諦的解說，真正認識痛苦，才會產生厭離，這就是為何先說苦諦的原因。看到痛苦才會產生厭離心，才會去尋求苦因。","涵蓋":[7,10],"校":"輪回→輪迴、雲何→云何"}],"時":"68A 20:35","頁":154,"af":"68a","st":1235,"et":1264,"消文":[{"文":"生死輪迴的大苦海，沒有邊、沒有底。"},{"文":"愚癡的人在裡邊一點都不怕，何等愚癡。"}],"延伸":[],"逐字稿":[{"t":"68A 20:35","b":[["q","如《四百論》云：「此大苦海中，悉無諸邊岸，愚人沉此中，云何不生畏。」"],["s","這一個生死輪迴的大苦海，既沒有邊、又沒有底啊，愚癡的人在這個裡邊哪，一點都不怕。哎呀，怎麼不怕，這個人是何等地愚癡呀！所以"]]}],"口譯音":"口譯音檔/siwei-kudi-01/008.mp3"},{"文":"先須為說«此實是苦»，非有安樂，","口譯":"所以先必須為他說明：這實在是苦，並沒有安樂，","四家合註":null,"覺燈日光":null,"時":"68A 21:04","頁":154,"af":"68a","st":1264,"et":1372,"消文":[{"文":"先必定要告訴他：這是苦，不是安樂。"}],"延伸":[{"題":"此實是苦","組":[{"題":"戒的根本由此建立","說":[{"類":"立","文":"先有苦集滅道的次第，修道時第一步才是持戒，戒的根本從這上面建立。"},{"類":"破","文":"這個把握不住，請問你持的戒持些什麼？為什麼跑到這裡來？"}]},{"題":"觀身不淨，觀受是苦","說":[{"類":"立","文":"三十七道品第一的四念處，也是講這個。"},{"類":"喻","文":"身體不淨，像大便一樣臭，你一看見就厭惡。"},{"類":"立","文":"種種快樂告訴你是苦，必然如此，沒有一處不是。"}]}],"說":[{"類":"立","文":"先有苦集滅道的次第，修道時第一步才是持戒，戒的根本從這上面建立。"},{"類":"破","文":"這個把握不住，請問你持的戒持些什麼？為什麼跑到這裡來？"},{"類":"立","文":"三十七道品第一的四念處，也是講這個。"},{"類":"喻","文":"身體不淨，像大便一樣臭，你一看見就厭惡。"},{"類":"立","文":"種種快樂告訴你是苦，必然如此，沒有一處不是。"}],"af":"68a","st":1264}],"逐字稿":[{"t":"68A 21:04","b":[["q","先須為說此實是苦，非有安樂，"],["s","所以先必定要告訴他：這個是苦啊，這不是安樂啊！佛拿這個告訴我們。那麼這個時候，我們應該第一個了解是了解這一點，所以不管我們現在學什麼，這是真正重要的，真正重要的啊！就是說，雖然說出家，大家說：「哎呀，出家五年哪，先要依止阿闍黎，知道開、遮、持、犯。」要曉得為什麼立這個戒，為什麼守那個戒，這你必定要知道。佛一定說苦、集、滅、道，因為你有這個次第，然後你去修道，修道的時候第一步才是持戒。所以這個戒的根本，還在從這個上面建立起來，必然我們要知道的。如果你這個把握不住的，請問你持的戒，你持些什麼？你為什麼跑到這裡來？這不是很明白的一個事情。"]]},{"t":"68A 22:08","b":[["s","所以三十七道品當中，第一個四念處，也是講這個。「觀身不淨、觀受是苦」，這第一個。平常我們最難放得下的就是這個身體，就難放得下的就是眼前的種種的貪著。所以告訴你：這個身體，不像你想像真實啊！不淨，像大便一樣地臭，你會愛護嗎？啊，你一看見你就厭惡！然後你種種的快樂，說告訴你這是苦啊！是必然如此的，沒有一個地方不是如此的，這是我們應該了解的。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/009.mp3"},{"文":"說多苦相令起厭離，是故於初先說苦諦。","口譯":"從多方面說明苦的行相，令他生起厭離，所以最初先說苦諦。","四家合註":null,"覺燈日光":null,"時":"68A 22:52","頁":154,"af":"68a","st":1372,"et":1415,"消文":[{"文":"多方面、種種善巧說明，目的只有一個：引起厭離心。"},{"文":"苦諦正確認識了，下面都有了，這是根本；沒有的話，都在走遠路。"}],"延伸":[],"逐字稿":[{"t":"68A 22:52","b":[["q","說多苦相令起厭離，是故於初先說苦諦。"],["s","不但一方面，多方面的、種種方面地善巧說明，目的一個 ─引起厭離心，所以先說苦諦。現在我們真正修行沒有別的，也必定要從這個上面，你把苦諦如果正確地認識，下面都有了，這是根本。如果這個沒有的話，那對不起，下面都在這兒走遠路，都在走遠路啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-01/010.mp3"},{"文":"此後自見墮於苦海，則於苦海欲求脫離，便見其苦必須滅除。","口譯":"這之後，他自己看見墮在苦海中，就會想從苦海中脫離，便看到這個苦必須要滅除。","四家合註":null,"覺燈日光":null,"時":"68A 23:35","頁":154,"af":"68a","st":1415,"et":1432,"消文":[{"文":"了解了苦，就要求解脫，生起滅苦之心。"}],"延伸":[],"逐字稿":[{"t":"68A 23:35","b":[["q","此後自見墮於苦海，則於苦海欲求脫離，便見其苦必須滅除。"],["s","因為你了解了這個苦，所以你要求解脫，所以這個時候，你要求滅苦之心。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/011.mp3"},{"文":"此復了知，未止其因苦終不滅，便念其因復為何等，由此始能了知集諦，是故«集諦於苦後說»。","口譯":"接著又了解：不止息苦的因，苦終究不會滅，便想苦的因又是什麼，由此才能了知集諦，所以集諦在苦諦之後說。","四家合註":null,"覺燈日光":[{"類":"確定","文":"在瞭解集諦的時候，要瞭解一切的痛苦是由業和煩惱所生。煩惱和業二者，真正讓我們造業的是煩惱。墮入輪迴的業是來自煩惱。煩惱的根本來自於哪裡？仔細地去尋找才會知道：原來一切都是由自性執著所產生，把所見的一切都執取為如同所見到般地真實，覺得一切都是從它那邊而有。產生貪、瞋的原因是，我們看到悅意境時，會覺得悅意境是從它那邊而有，是以自力形成了悅意的作用，我們會如此地看到，並且如此地執著。由對悅意境的真實執著產生了對悅意境的貪，由對不悅意境的真實執著產生了對不悅意境的瞋。當我們尋找煩惱來源，思考煩惱的根本是否可以斷除，就會從實際的情況去尋找，即悅意境與不悅意境是否有自性？是否真實存在？當透過法義深入地瞭解到諸法究竟的存在並非如所見般地真實，我們才相信，原來讓我痛苦的真正原因是，無始以來到現在，我都未了知空性、沒有看清實相，於是就會深信透過現證空性能斷除一切煩惱的根本，之後才會相信滅諦的功德，並誓願去證得。所以在集諦之後宣說滅諦。","涵蓋":[11,13],"校":"輪回→輪迴"}],"時":"68A 23:52","頁":154,"af":"68a","st":1432,"et":1584,"消文":[{"文":"苦是果，要消除果，必定要從因地上解決。"},{"文":"進一步找苦的因，就是集諦。"},{"文":"找到集諦就努力克服這個因，滅、道二諦跟著來，戒定慧三學自然如法修持。"}],"延伸":[{"題":"集諦於苦後說","組":[{"題":"學問再大也無用","說":[{"類":"破","文":"講戒頭頭是道，四分、五分、十誦律樣樣弄通，做大學問家，流轉生死一點用場都沒有。"}]},{"題":"把握根本，一句佛號亦足","說":[{"類":"例","文":"周利槃陀伽只懂得兩個字，都可以解決這個問題。"},{"類":"立","文":"只有一句阿彌陀佛，照樣可以了脫生死。"},{"類":"回扣","文":"這個根本第一要把握住，所以集諦在後說。"}]}],"說":[{"類":"破","文":"講戒頭頭是道，四分、五分、十誦律樣樣弄通，做大學問家，流轉生死一點用場都沒有。"},{"類":"例","文":"周利槃陀伽只懂得兩個字，都可以解決這個問題。"},{"類":"立","文":"只有一句阿彌陀佛，照樣可以了脫生死。"},{"類":"回扣","文":"這個根本第一要把握住，所以集諦在後說。"}],"af":"68a","st":1518}],"逐字稿":[{"t":"68A 23:52","b":[["q","此復了知，未止其因苦終不滅，便念其因復為何等，由此始能了知集諦，是故集諦於苦後說。"],["s","喏，這個來了！哦，因為你要想除掉那個苦，除掉那個苦，那麼這個苦怎麼來的呢？你了解這個苦是果，真正要把那個果消除掉了，必定要從因地上面解決。那麼這個現在的苦果的因在哪裡呢？那個時候你進一步找那個苦的因，這個集諦。所以由於苦的認識，然後呢策發我們求解脫的心，從苦當中解脫出來。因為要求這個心，所以一發了這個心，所以找：苦從哪裡來的呀？那個時候，你就會努力去找，那麼然後去找。當你這個時候你找到了集諦的話，你就努力會克服這個因，那個時候，它滅、道二諦就跟著來了。由於這樣，所以戒定慧的三學自然你如法修持。"]]},{"t":"68A 25:18","b":[["s","否則的話，儘管你說講戒，講得這麼頭頭是道，哎呀，不要說單單我們中國的四分律，五分律、十誦律，你樣樣弄通，你做個大學問家，說不定你戴各式各樣的博士的方帽，一點用場都沒有！流轉生死當中，弄得不好還說不定還要墮落，這個是我們必定要知道的，必定要知道的。反之，你就算這些東西，不要說每一個部都通，像周利槃陀伽一樣，只懂得兩個字，你都可以解決這個問題。現在有更巧妙的方法，他周利槃陀伽還要證了羅漢果了，現在也不要，羅漢果都不要，你就想到什麼都不知道，我只有一句阿彌陀佛了，欸，你照樣可以了脫生死，這個是我們必定要了解的。這個根本，現在第一要把握得住啊！所以他是為什麼集諦在後說。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/012.mp3"},{"文":"次知生死眾苦，皆由有漏業生，其業復由煩惱發起，煩惱根本是為我執，便知集諦。","口譯":"接著了知生死的眾苦，都是由有漏業所生，業又是由煩惱所發起，煩惱的根本是我執，這樣便了知了集諦。","四家合註":null,"覺燈日光":null,"時":"68A 26:24","頁":154,"af":"68a","st":1584,"et":1615,"消文":[{"文":"一步一步追根究底：生死的苦是有漏業，業是煩惱所起，煩惱的根本是我執。"},{"文":"這時就了解了集諦真正的行相。"}],"延伸":[],"逐字稿":[{"t":"68A 26:24","b":[["q","次知生死眾苦，皆由有漏業生，其業復由煩惱發起，煩惱根本是為我執，便知集諦。"],["s","一步一步地，從這個上頭追根究底地找到：哎呀，生死的苦是有漏的業，業又是煩惱所起，那麼煩惱的根本是我執，那個時候你把集諦的真正的行相了解了。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/013.mp3"},{"文":"若見我執亦能止滅，«誓願»現證滅苦之滅，故於集後宣說滅諦。","口譯":"如果看見我執也能夠止滅，就會誓願現證滅除苦的滅，所以在集諦之後宣說滅諦。","四家合註":null,"覺燈日光":null,"時":"68A 26:55","頁":154,"af":"68a","st":1615,"et":1694,"消文":[{"文":"我執不是天生的，是虛妄顛倒的，可以淨化、消滅。"},{"文":"原來一切痛苦的根本在這裡，一定要想辦法去掉它。"}],"延伸":[{"題":"誓願","組":[{"題":"誓是必定要達到的願","說":[{"類":"立","文":"不但願，「誓」是必定要達到的願。"},{"類":"破","文":"浮浮泛泛「我也想啊」，想了半天還坐在這裡。"}]},{"題":"打起全部精神修行","說":[{"類":"立","文":"修行不是有氣無力，是打起全部精神，心裡是這樣的狀態。"},{"類":"例","文":"那些大祖師們就是這個樣子。"},{"類":"回扣","文":"所以集諦後面宣說滅諦。"}]}],"說":[{"類":"立","文":"不但願，「誓」是必定要達到的願。"},{"類":"破","文":"浮浮泛泛「我也想啊」，想了半天還坐在這裡。"},{"類":"立","文":"修行不是有氣無力，是打起全部精神，心裡是這樣的狀態。"},{"類":"例","文":"那些大祖師們就是這個樣子。"},{"類":"回扣","文":"所以集諦後面宣說滅諦。"}],"af":"68a","st":1615}],"逐字稿":[{"t":"68A 26:55","b":[["q","若見我執亦能止滅，誓願現證滅苦之滅，故於集後宣說滅諦。"],["s","你了解了這個，緊跟著見到：噢！原來這個我執這個東西，不是天生的，而卻是虛妄顛倒的，這個東西，你可以把它淨化、消滅。所以那個時候你想：啊，原來一切痛苦的根本在這裡啊！那那個時候你一定要想辦法，去把它去掉它，所以是「誓願」，不但願，「誓」是什麼？就是你必定要達到的這個願。不是我們浮浮泛泛：哎呀，我也想啊！雖然你也想，你還是弄得想了半天，坐在這個地方。他那個誓不是 ─我一定要做到它！你站起來全部精神去幹，當然，這個是指我們的心裡的這種狀態。所以這個修行不是什麼浮浮泛泛、有氣無力，不是的！修行是打起全部精神來，就這樣，心裡是這樣狀態。因為有這種心理，所以做任何事情的時候，那必然如此。你看那些大祖師們，他就是這樣，就是這個樣。所以那個時候，他集諦後面宣說滅諦。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/014.mp3"},{"文":"若爾開示苦諦之後，即於解脫發生希求，苦諦之後應說滅諦。","口譯":"（問：）如果這樣，開示苦諦之後，就已經對解脫生起希求，那麼苦諦之後應該接著說滅諦才對。","四家合註":null,"覺燈日光":[{"類":"確定","文":"有人說：開示了苦諦之後，因為對苦諦發起厭離心、對解脫產生希求心，所以應該在苦諦之後說滅諦。宗喀巴大師答：雖然看到痛苦，想從痛苦當中獲得脫離，可是如果不知道痛苦的原因，那麼想要脫離痛苦的心是不切實際的。先看到痛苦，接著尋求苦因，再去確認這個苦因是不是可以斷除，應如此思惟才有邏輯。而不是一看到痛苦就說：「哇！好苦！我想要脫離。」這樣的厭離苦、希求解脫的心是無法堅定的，只是一種發願、一種祈求而已。當我們深信解脫、深信滅諦時，絕對會想透過某種方法獲得解脫，於是趨向道諦，是故道諦最後宣說。如《相續本母》所說，一個病人首先要知道自己有病，才會去找醫生，希望醫生幫他找病因，如果他自己都覺得沒有病，他也不會去找醫生。若要從病苦中脫離，必須先知道自己真的罹患某種疾病，之後才去斷病因，追求遠離疾病的安樂。為了得到遠離疾病的安樂，必須透過藥物消除自己的疾病。知道苦諦如同知病，斷除集諦如同斷除病因，所以說知苦斷集。如同想要得到遠離疾病的安樂，所以佛說了證滅；如同療病須依於藥，所以佛說了修道。","涵蓋":[14,17]}],"時":"68A 28:14","頁":154,"af":"68a","st":1694,"et":1709,"消文":[{"文":"照這樣說，說了苦諦就要求解脫，應該講滅諦，為什麼又說集諦？"}],"延伸":[],"逐字稿":[{"t":"68A 28:14","b":[["q","若爾開示苦諦之後，即於解脫發生希求，苦諦之後應說滅諦。"],["s","照你這樣說的話，那麼說了苦諦以後應該 ……你要求解脫嘛，就講滅諦啊，為什麼又說集諦呢？"]]}],"口譯音":"口譯音檔/siwei-kudi-01/015.mp3"},{"文":"答云，無過，爾時雖有欲解脫心，欣得寂滅眾苦之滅，然猶未明眾苦之因，未見其因定能遮止，故於解脫，不能定執為所應得，定當證滅。","口譯":"答：沒有過失。那時雖然有想解脫的心，欣求得到寂滅眾苦的滅，但還不明白眾苦的因，沒看到那個因一定能被遮止，所以對於解脫，還不能確定地執持為自己所應得、一定能證得的滅。","四家合註":null,"覺燈日光":null,"時":"68A 28:29","頁":154,"af":"68a","st":1709,"et":null,"消文":[{"文":"答：沒有錯。"},{"文":"滅就是息滅一切痛苦；那時雖想求解脫，但不了解苦的因。"},{"文":"不曉得這個因是不是一定能去掉，就不能確定做不做得到，所以不先講滅。"}],"延伸":[],"逐字稿":[{"t":"68A 28:29","b":[["q","答云，無過，"],["s","他說：沒有錯的。為什麼呀？"]]},{"t":"68A 28:33","b":[["q","爾時雖有欲解脫心，欣得寂滅眾苦之滅，然猶未明眾苦之因，未見其因定能遮止，故於解脫，不能定執為所應得，定當證滅。"],["s","是的，那個時候，雖然你要想求解脫，希望把一切的苦得到靜息 ─所以這滅就是息滅一切的痛苦 ─但是你並不了解那個苦的因，不曉得這個因是不是一定能夠遮止，換句話說，一定能夠去掉。所以這個時候你不能確定，是不是能夠做得到，是不是能夠達到你息滅一切痛苦的這一個狀態，所以說這個時候不先講滅。"]]},{"t":"68A 29:36","b":[["q","如是若執定當證滅，定當解脫，便念何為趣解脫道，趣向道諦，是故道諦最後宣說。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/016.mp3"},{"文":"如是若執定當證滅，定當解脫，便念何為趣解脫道，趣向道諦，«是故道諦最後宣說»。","口譯":"像這樣，若確定一定能證得滅、一定能解脫，便會想：什麼是趣向解脫的道？於是趣向道諦，所以道諦最後宣說。","四家合註":null,"覺燈日光":null,"時":"68B 00:03","頁":155,"af":"68b","st":3,"et":106,"消文":[{"文":"找到苦的因原來可以止息，就一心要止息。"},{"文":"止息有一定的方法，叫作「道」。"},{"文":"修道時才講戒定慧三學，不是世間五花八門、理工醫農那一套。"}],"延伸":[{"題":"道諦最後宣說","組":[{"題":"依次第學，學到哪受用到哪","說":[{"類":"立","文":"照這個次第來，心就跟它相應，步步深入，學到哪裡受用到哪裡。"},{"類":"破","文":"否則一直在煩惱中轉；修一點善法也被雜染所染，永遠流轉生死。"}]}],"說":[{"類":"立","文":"照這個次第來，心就跟它相應，步步深入，學到哪裡受用到哪裡。"},{"類":"破","文":"否則一直在煩惱中轉；修一點善法也被雜染所染，永遠流轉生死。"}],"af":"68b","st":56}],"逐字稿":[{"t":"68B 00:03","b":[["q","如是若執定當證滅，定當解脫，便念何為趣解脫道，趣向道諦，是故道諦最後宣說。"],["s","現在照著次第，說首先了解了苦，那麼由於苦了找到了苦的因，而找到苦的因在這地方，原來可以止息的，那個時候你就想：啊！那我一心也要止息。但是你要止息怎麼做法呢？原來有它止息的一定的方法，那個叫作「道」。由於這樣地追求到道，那麼講道，就修道的時候，那個時候才講戒定慧三學。而不是世間的五花八門，而不是世間的小學、中學、大學，而不是世間的所謂理工醫農、士農工商，這套東西就完全用不上。有它這樣的必然的次第。"]]},{"t":"68B 00:56","b":[["s","所以你照著這個次第來的話，自然你的心裡面就跟它相應，然後就步步深入，你學到哪裡受用到哪裡。要不然你學到哪裡，自己一直在煩惱當中轉，所以這個都是雜染之法。儘管你修一點善法，是難免為雜染所染，所以始終啊 ……。現在我們就是這個狀態，因為你修了一點法，所以它有一點跟法相應的這個善報，但是這個東西雜染的，始終這個善，唉呀，跟著很多煩惱、痛苦，而結果永遠流轉生死，它基本原因就在這裡。所以在這裡，我們一定第一個要把握得住。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/017.mp3"},{"文":"如是亦如《相續本母》云：「如病應知斷病因，當得樂住應依藥，苦因彼滅如是道，«應知應斷應證修»。」","口譯":"這也如《相續本母》所說：「如同生病，應知病、應斷病因，要得到安樂住應依藥；苦、苦因、苦滅以及道也是這樣，應知、應斷、應證、應修。」","四家合註":null,"覺燈日光":null,"時":"68B 01:46","頁":155,"af":"68b","st":106,"et":250,"消文":[{"文":"生了病，要感受病苦，要曉得病因、斷除病因，再找藥、依藥。"},{"文":"苦而找到苦因是集諦，見到因可以消滅是滅諦，如何滅是道諦。"},{"文":"苦應知，集應斷，滅應證，道應修。"}],"延伸":[{"題":"應知應斷應證修","組":[{"題":"三轉四諦十二法輪","說":[{"類":"立","文":"苦應知，集應斷，滅應證，道應修，就是世尊三轉四諦十二法輪。"}]},{"題":"大小乘不離四諦","說":[{"類":"立","文":"所有大小乘的基本內容就是這個，佛法離開四諦就沒有了。"},{"類":"立","文":"只管自己是小乘，了解透徹是緣覺，推廣到一切有情是佛菩薩。"}]}],"說":[{"類":"立","文":"苦應知，集應斷，滅應證，道應修，就是世尊三轉四諦十二法輪。"},{"類":"立","文":"所有大小乘的基本內容就是這個，佛法離開四諦就沒有了。"},{"類":"立","文":"只管自己是小乘，了解透徹是緣覺，推廣到一切有情是佛菩薩。"}],"af":"68b","st":189}],"逐字稿":[{"t":"68B 01:46","b":[["q","如是亦如《相續本母》云：「如病應知斷病因，當得樂住應依藥，苦因彼滅如是道，應知應斷應證修。」"],["s","現在就比喻，就像生了病，那麼要感受到這個病的痛苦，那麼要曉得你這個病原因從哪裡啊？要曉得斷除病的因，那麼要求這個斷病，那麼那個時候要找藥，那個時候才依這個藥。這個同樣地，所以這個苦，由於苦而跟著找到苦的因 ─集諦；然後呢是從因上面，見到這個因可以消滅 ─滅諦；然後呢，如何滅是道諦。這個是我們真正「此苦汝應知」啊，然後呢應斷、應修，這個。這個是集，是你應斷哪！然後呢這個是滅，你應證哪！要想證那個滅諦，該怎麼辦呢？要修這個道啊！"]]},{"t":"68B 03:09","b":[["s","所以世尊三轉四諦十二法輪，就是這個樣。第一：這個苦，你應該知道啊！為什麼苦？有它的原因，這個原因你應該斷。然後呢斷了就證得這個滅諦，這個才是你真正需要的。要想證得滅諦怎麼辦呢？修這個道，就這樣。這個就是世尊所以說這個次第，所有的大小乘基本的內容，就是這個！就這個，沒有、再也沒有別的了！佛法離開了四諦就沒有了，只是把四諦的層次深廣不同 ─只管你自己，那就是小乘；如果說你把這個道理，深刻一點地了解透徹一點是緣覺；推廣到一切有情，就是佛菩薩，如此！"]]}],"口譯音":"口譯音檔/siwei-kudi-01/018.mp3"},{"文":"如是四諦，大小乘中皆數宣說，是為善逝總攝生死流轉，生死還滅諸扼要處。","口譯":"像這樣的四諦，大乘小乘中都一再宣說，這是善逝總攝生死流轉、生死還滅的種種扼要之處。","四家合註":null,"覺燈日光":[{"類":"確定","文":"佛說四聖諦的時候，不只說了「此是苦諦，此是集諦，此是滅諦，此是道諦」。佛也說了「知苦、斷集、證滅、修道」。四聖諦的內容非常重要，是佛教的精神所在。《現觀莊嚴論》的第二品和第四品多次說到四聖諦的內涵。","涵蓋":[18,19]},{"類":"整段","文":"下部論師認為，煩惱的根本是補特伽羅獨立之實體有的我執。但中觀應成派認為，煩惱的根本來自於自性我執。若以下部的說法去修學，只能壓伏粗分的煩惱，細微的煩惱仍然存在。為什麼能壓伏粗分煩惱呢？因為由補特伽羅獨立之實體有的執著所產生的煩惱，可以透過補特伽羅獨立之實體空的認知來壓伏。然而補特伽羅獨立之實體空的認知無法損害細微的自性執著所產生的煩惱，因為透過補特伽羅獨立之實體空的認知並不能認知自性空，所以自性執著仍然存在。因為由自性執著所帶來的煩惱仍然存在，所以還是沒有辦法獲得解脫。","涵蓋":[18,22]}],"時":"68B 04:10","頁":155,"af":"68b","st":250,"et":300,"消文":[{"文":"「數」是到處，整個大小乘佛法所說的就是這個。"},{"文":"生死流轉還滅的最綱要都在這裡，一切經典都依這個綱要深細說明。"}],"延伸":[],"逐字稿":[{"t":"68B 04:10","b":[["q","如是四諦，大小乘中皆數宣說，是為善逝總攝生死流轉，生死還滅諸扼要處。"],["s","所以說，這個四諦，大乘小乘當中都要數數 ─這個「數」是到處，整個的大小乘佛法所說的，就是這個。所以佛把生死流轉還滅的最綱要，都在這個地方，所有的一切經典都是根據這個綱要，深細地來說明。有很多呢把整個的四個都說，有很多呢偏重於某一方面，乃至於越深越細。佛經沒有一個例外，都是這樣。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/019.mp3"},{"文":"故修解脫極為切要，亦是修行大嗢柁南，故須如是次第引導學者。","口譯":"所以對修解脫而言極為切要，也是修行的大嗢柁南（總綱要），所以必須依這樣的次第引導學者。","四家合註":null,"覺燈日光":null,"時":"68B 05:00","頁":155,"af":"68b","st":300,"et":401,"消文":[{"文":"對真正修解脫的，這是最最重要的。"},{"文":"嗢柁南是綱宗扼要，通常譯為偈；四聖諦也叫四法嗢柁南。"},{"文":"整個修行的綱要就是這個，所以用這個次第引導；本論的美也在這裡。"}],"延伸":[],"逐字稿":[{"t":"68B 05:00","b":[["q","故修解脫極為切要，亦是修行大嗢柁南，故須如是次第引導學者。"],["s","所以，對於真正修解脫的，這個是最最重要的，這個真的最重要的。也是修行的 ─「嗢柁南」這個地方是指綱要，綱宗扼要。通常嗢陀南我們可以翻成功一個「偈」，偈子，所以前面說完了，那個偈子總結起來。換句話說，整個修行的綱要，就是這個！整個修行的綱要，就是這個。平常我們除了這個嗢柁南說這個偈子以外，就是四聖諦也叫四法嗢柁南，哪個四法？那就是苦、集、滅、道，就是這樣。乃至於三法印，它也叫三個 ─哦，不是，不是苦、集、滅、道，這個「諸行無常」，這個「諸法無我」 ……就是四法印，就是這個四法印，換句話說那是綱要，整個佛法的。所以這個修行的整個的綱要，所以用這個次第引導。也可以說完整的佛法就是這樣，所以本論的美也在這個地方。那麼下面呢，再把這個話說一下，這個是策勵我們的。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/020.mp3"},{"文":"若未真實思惟苦諦，厭捨生死，則求解脫亦唯虛言，«隨其所作悉成集諦»。","口譯":"如果沒有真實思惟苦諦而厭捨生死，那麼求解脫也只是空話，所做的一切都成為集諦。","四家合註":null,"覺燈日光":[{"類":"確定","文":"不認識苦諦，卻說要追求解脫，那只是口頭上說說而已，並不是真正知道解脫是什麼。如果沒有思惟集諦，善加瞭解業和煩惱、生死根本等，那簡直如同沒有看清目標就亂發箭。這樣會有什麼危險？就是真正修行的根本被斷截了。有人說：要毫無作意，一切的作意都是煩惱、都是無明，一切的痛苦是來自於執著，所以所有的執著都必須斷除。如此，善惡都不分了，這種情況就是「斷截正道扼要」。四聖諦就是針對善惡兩者而說了染汙的因果二諦及清淨的因果二諦，善惡、染汙清淨都不分，就沒有四聖諦可言。若對集諦認知不夠，修行就會勞而無果，再怎麼努力修學都無用。","涵蓋":[20,21],"校":"亂髮箭→亂發箭"}],"時":"68B 06:41","頁":155,"af":"68b","st":401,"et":658,"消文":[{"文":"對苦諦沒有正確認識，或認識了沒有如理思惟、生起相應的量，內心還在世間雜染中現行。"},{"文":"那時貪著生死，不是厭捨生死，求解脫都是空話。"},{"文":"不管做什麼還是集諦，集諦就是流轉生死。"}],"延伸":[{"題":"隨其所作悉成集諦","組":[{"題":"忘失菩提心，是名魔業","說":[{"類":"立","文":"更深一層說：「忘失菩提心，修諸善法，是名魔業。」也就是這個。"},{"類":"因","文":"修學的根本目的一旦忘失，做什麼都是集諦，把你拖在生死當中。"}]},{"題":"道理要在內心找到相應","說":[{"類":"立","文":"用功不只是追求學問、文字，要在內心找到相應的意義，策發對生死的恐怖厭患。"},{"類":"破","文":"一類人只在文字上推敲。"},{"類":"破","文":"一類人覺得這裡生活滿好，吃好睡好，講起來頭頭是道，總不相應。"}]},{"題":"思惟以破現法雜染","說":[{"類":"下手","文":"不但知道，還要去思惟，把跟現法雜染相應的現行破壞，如法的心就生起來。"},{"類":"回扣","文":"若未真實思惟苦諦，就不能厭捨生死，做什麼都是集諦。"}]}],"說":[{"類":"立","文":"更深一層說：「忘失菩提心，修諸善法，是名魔業。」也就是這個。"},{"類":"因","文":"修學的根本目的一旦忘失，做什麼都是集諦，把你拖在生死當中。"},{"類":"立","文":"用功不只是追求學問、文字，要在內心找到相應的意義，策發對生死的恐怖厭患。"},{"類":"破","文":"一類人只在文字上推敲。"},{"類":"破","文":"一類人覺得這裡生活滿好，吃好睡好，講起來頭頭是道，總不相應。"},{"類":"下手","文":"不但知道，還要去思惟，把跟現法雜染相應的現行破壞，如法的心就生起來。"},{"類":"回扣","文":"若未真實思惟苦諦，就不能厭捨生死，做什麼都是集諦。"}],"af":"68b","st":401}],"逐字稿":[{"t":"68B 06:41","b":[["q","若未真實思惟苦諦，厭捨生死，則求解脫亦唯虛言，隨其所作悉成集諦。"],["s","所以假定你對苦諦沒有正確的認識，以及認識雖然認識了，沒有如理思惟，生起相應的量，那個時候我們的內心還是在現法，世間的一切上面這種雜染當中現行。那個時候貪著生死，不是厭捨生死，這個時候，所謂求解脫都是空話，都是虛話。在家人固然談不到，出家啦，更在這個地方浪費自己啊！更是浪費自己啊！所以它「隨其所作」，不管你做什麼，你還是集諦，集諦是什麼？流轉生死。在小乘這樣說 ─不是，不是說小乘，在基本上面這樣說。如果我們更深一層、更圓滿一點說的話，另外一句話說：「忘失菩提心，修諸善法，是名魔業。」也就是這個。你修學的根本目的何在？這個菩提心。這個地方就是什麼？求解脫這個心。如果你一旦忘失掉了，那你做什麼事情都是集諦，集諦是什麼？魔是什麼？就是專門把你拖在生死當中的。所以現在這個地方呢，不管我們做什麼學問，這個一定要了解的。"]]},{"t":"68B 08:34","b":[["s","最近在座大部分同學，我看了非常歡喜，非常讚歎，為什麼？大家很用功。但是注意哦！這個用功不僅僅是追求一點學問，也不是追求文字，說：啊，現在了解了！你必定要把了解的道理，要在內心上面找到相應的意義；換句話說，這個道理所指的是什麼。那個時候策發我們對眼前生死的恐怖厭患，由於這個而推動我們努力如理去追求。否則的話呢，你一定會在這個文字上面推敲，文字上面推敲，這是一類。另外一類呢，儘管在這裡，哎呀！覺得這個地方的生活真是滿好，也不要跑得去忙，反正早晨稍微早一點起來，上一個殿，到那個時候吃起來，哎唷，人家樣樣送得來的。啊，那是講究口味，真是！吃完了以後一個大覺睡得個好，什麼都不要做。那個時候，講起來，喔唷，等下還要頭頭是道，意見很多，總不相應啊！總不相應，原因在這個地方，這一點是我們必定要知道的啊！"]]},{"t":"68B 10:00","b":[["s","所以這句話，好好地再讓我們自己提醒我們一下：「若未真實思惟苦諦」，你沒有真實地思惟的話，就不能「厭捨生死」。不但知道，知道了還要去思惟，這個情況就是，把跟現法雜染相應的現行破壞了，那個時候如法的心生起來，那一定會對於我們眼前那個會產生厭惡。那個時候你一心求解脫，那個時候對了，你做的事情都為求解脫而忙。否則的話，你心裡面不管做些什麼、想些什麼，都是集諦。進一步："]]}],"口譯音":"口譯音檔/siwei-kudi-01/021.mp3"},{"文":"若未思集，善知惑業生死根本，«猶如射箭未見鵠的»，是即斷截正道扼要，遂於非脫三有之道妄執為是，勞而無果。","口譯":"如果沒有思惟集諦，善巧了知惑與業是生死的根本，就好像射箭沒看見箭靶，這就斷截了正道的扼要，於是把不能脫離三有的道錯執為是，徒勞而沒有結果。","四家合註":null,"覺燈日光":null,"時":"68B 10:58","頁":155,"af":"68b","st":658,"et":867,"消文":[{"文":"苦的根本是惑、業兩樣：無明與行，是生死的根本。"},{"文":"善知：不是講時懂、講完糊塗，也不是寫成論文只在書本上。"},{"文":"斷截正道扼要：道路本身已經斷掉了。"},{"文":"妄執為是、勞而無果：以為在修道，其實修錯了，忙了半天沒有果。"}],"延伸":[{"題":"猶如射箭未見鵠的","組":[{"題":"無的放矢","說":[{"類":"喻","文":"射箭沒看見靶子，無的放矢，你射些什麼？"}]},{"題":"自問為何而修","說":[{"類":"例","文":"拜佛、念經、早晚課、研究學問、寫文章、學戒、學定，你為什麼？"},{"類":"破","文":"學定為了身體好，看人持戒覺得好看，完全不相應。"},{"類":"下手","文":"最好自己問問自己：為什麼要做？"},{"類":"回扣","文":"「勞而無果」，論上都給了最佳指導。"}]}],"說":[{"類":"喻","文":"射箭沒看見靶子，無的放矢，你射些什麼？"},{"類":"例","文":"拜佛、念經、早晚課、研究學問、寫文章、學戒、學定，你為什麼？"},{"類":"破","文":"學定為了身體好，看人持戒覺得好看，完全不相應。"},{"類":"下手","文":"最好自己問問自己：為什麼要做？"},{"類":"回扣","文":"「勞而無果」，論上都給了最佳指導。"}],"af":"68b","st":725}],"逐字稿":[{"t":"68B 10:58","b":[["q","若未思集，善知惑業生死根本，猶如射箭未見鵠的，是即斷截正道扼要，遂於非脫三有之道妄執為是，勞而無果。"],["s","更進一步，那麼說你現在了解了這個苦的特質，所以進一步要脫苦。那麼苦的根本在哪裡呢？原來是兩個東西：惑、業，就是無明、行兩樣東西，那個是生死的根本。假定你這個生死的根本不知道，或者雖然知道了又不善巧，說並不是馬馬虎虎知道，講的時候懂，等到講完了，自己腦筋裡糊塗一片，這個沒有用。或者你雖然能夠講給別人聽，講完了這個道理所指的，指的什麼？在書本上面。「我的論文得到了一個大博士！」但是它所指的內心的心理行相是什麼？兩回事情，那個沒有用。"]]},{"t":"68B 12:05","b":[["s","這個像什麼？射箭一樣，你射箭的靶子在哪裡你沒看見。請問你射箭，靶子沒看見，你無的放矢，人家說。什麼叫「無的放矢」？你沒目的，那個射箭，你射些什麼啊？就是這樣。我們現在修道，你修些什麼啊？這個就很清楚了。你拜佛，你為什麼要拜佛？你念經，你為什麼要念經？你作早課、作晚課，然後你研究學問，然後你寫文章，然後你學戒律，然後你學定，你為什麼啊？現在有很多人，「哎呀，我要學學定。」你為什麼學定？說實在他也不知道！覺得學定滿好，啊！修了定身體好的，學了什麼的 ……那完全不相應，這完全不相應啊！然後學戒，「喔唷，人家這個戒，你看這樣！」是，它對我們有引發的功效，這是我們宿生善根相應，但是他為什麼要這樣做？這個都是射箭哪，他沒有找到那目的啊！"]]},{"t":"68B 13:17","b":[["s","所以那個時候，正道的扼要切斷掉了，換句話說，你這個道路本身已經斷掉了。這個時候你忙的是什麼？「遂於非脫三有之道妄執為是，勞而無果。」那時候你修的道也不對，你修錯了，你忙了個半天，你以為在修道呀，但是，因為你修道的目的像射箭一樣，射箭要射到那個紅心、那個靶子，你這個靶子也沒有看見，你射了個半天，沒有果啊！修道的目的是要解脫生死的根本，生死的根本在哪裡你不知道，你修了半天。所以現在很多人哪，喔唷，天天去拜佛，忙著去拜佛，有很多人天天要念多少佛，有很多人讀多少經，還要寫論文，還要記這個、又要記那個，你為什麼要做呀？最好自己問問自己。這個地方都給了我們最佳指導啊！「勞而無果」，告訴我們。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/022.mp3"},{"文":"若未能知應斷之苦集，則亦不明靜苦之解脫，故欲求解脫，«亦唯增上慢»耳。","口譯":"如果不能了知應斷的苦與集，也就不明白息滅苦的解脫，所以想求解脫，也只是增上慢而已。","四家合註":null,"覺燈日光":[{"類":"確定","文":"「若未能知應斷之苦集，則亦不明靜苦之解脫」，對苦諦、集諦的認識不足，所獲得的果當然也有限，它只能暫時壓伏煩惱，無法傷害煩惱的根本。所以不瞭解苦諦、集諦，卻說追求解脫，其實都是我慢在作祟。因為認識苦諦、集諦很重要的緣故，接下來就詳細解說苦諦、集諦。"}],"時":"68B 14:27","頁":155,"af":"68b","st":867,"et":1051,"消文":[{"文":"應斷的苦、集沒有把握清楚，下面都沒有用。"},{"文":"從苦、集追根究底，才找到脫苦集的方法，就是解脫之道。"},{"文":"不了解之前，所謂修行最多只是增上慢；慢已經不好，還要增上。"}],"延伸":[{"題":"亦唯增上慢","組":[{"題":"看不見值得學習的","說":[{"類":"破","文":"這也瞧不起、那也瞧不起，看不到一個值得學習的。"}]},{"題":"懂了則處處感激","說":[{"類":"例","文":"聽見「阿彌陀佛」四個字已經夠了，牢牢抱著，感激得不得了。"},{"類":"立","文":"解脫的煩惱越多，功德越多，越感激人家，沒有是非之心。"}]},{"題":"弄清次第，所作皆淨","說":[{"類":"下手","文":"先把為什麼這樣建立的次第弄清楚，照著做，每一步會推動你上去。"},{"類":"立","文":"一心擺在這裡，造的業都是淨業，不是集諦所攝。"},{"類":"回扣","文":"先說苦諦的理由在此；下面接著「正修苦」。"}]}],"說":[{"類":"破","文":"這也瞧不起、那也瞧不起，看不到一個值得學習的。"},{"類":"例","文":"聽見「阿彌陀佛」四個字已經夠了，牢牢抱著，感激得不得了。"},{"類":"立","文":"解脫的煩惱越多，功德越多，越感激人家，沒有是非之心。"},{"類":"下手","文":"先把為什麼這樣建立的次第弄清楚，照著做，每一步會推動你上去。"},{"類":"立","文":"一心擺在這裡，造的業都是淨業，不是集諦所攝。"},{"類":"回扣","文":"先說苦諦的理由在此；下面接著「正修苦」。"}],"af":"68b","st":867}],"逐字稿":[{"t":"68B 14:27","b":[["q","若未能知應斷之苦集，則亦不明靜苦之解脫，故欲求解脫，亦唯增上慢耳。"],["s","所以如果一開始的時候，「應斷的苦集」兩樣東西，你沒有把握得清楚的話，對不起，下面都沒有用，「則亦不明靜苦之解脫」啊！這個必定是從苦、集兩樣東西上面，追根究底才找到正脫苦集的這個方法，然後這個就是解脫之道。所以不了解之前，我們所謂的修行，最多也只是「增上慢」哪！增上慢，慢已經不好還要增上。這是為什麼我們現在修學佛法很容易：唉，這個也瞧不起，那個也瞧不起，看不見、看不到一個可以值得學習的。假定真正懂了以後，聽見「阿彌陀佛」四個字已經夠了，牢牢地抱著它，自己拼命都來不及，不管任何人，「阿彌陀佛，他提供了這個四個字讓我念佛，我感激得不得了啊！」他是與非，你管他幹什麼？這不是很簡單的道理！當然你更進一步的話，你更進一步解脫的煩惱越多，增長的功德是越多。所以自然而然，你越會感激人家都來不及，你哪裡有一點對這種是非之心。"]]},{"t":"68B 16:20","b":[["s","所以在這個地方先告訴我們，說：哦，佛原來一定有這樣的重要的關鍵問題啊！所以說這個地方先說苦諦的理由在此，在這地方我們現在可以了解了。所以大家不要忙著說，哎呀，你要去修行啊！你一定要把它為什麼這樣建立的次第，你弄得很清楚，了解了然後照著去做，那個時候你很清楚、很明白，每一步一點不錯，它會推動你上去。因為這個力量，所以找到了你修行的方法的話，你一心一意全部擺在這個地方去做，不管你做什麼，那個不是集諦所攝，你造的任何業都是淨業。既然你造的業都是淨業，哪有不透脫生死輪迴的道理。由於這樣的次第認識了，下面就告訴我們「正修苦」，那個時候正式地修行那個苦諦了。"]]}],"口譯音":"口譯音檔/siwei-kudi-01/023.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-01/001.webp","n":1},{"img":"投影片/siwei-kudi-01/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/siwei-kudi-01/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/siwei-kudi-01/004.webp","n":4},{"img":"投影片/siwei-kudi-01/005.webp","n":5},{"img":"投影片/siwei-kudi-01/006.webp","n":6},{"img":"投影片/siwei-kudi-01/007.webp","n":7},{"img":"投影片/siwei-kudi-01/008.webp","n":8,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=68a&st1=345&et1=750","box":[0.128625,0.3002222222222222,0.1315,0.06622222222222222]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-01/009.webp","n":9},{"img":"投影片/siwei-kudi-01/010.webp","n":10},{"img":"投影片/siwei-kudi-01/011.webp","n":11,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=68a&st1=750&et1=1069","box":[0.519875,0.25577777777777777,0.10900000000000001,0.064]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/siwei-kudi-01/012.webp","n":12},{"img":"投影片/siwei-kudi-01/013.webp","n":13},{"img":"投影片/siwei-kudi-01/014.webp","n":14,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=68a&st1=1069&et1=1372","box":[0.123625,0.3591111111111111,0.1265,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-01/015.webp","n":15},{"img":"投影片/siwei-kudi-01/016.webp","n":16},{"img":"投影片/siwei-kudi-01/017.webp","n":17,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=68a&st1=1372&et1=1584","box":[0.521125,0.3124444444444444,0.10775000000000001,0.05511111111111111]}],"photo":[0.05,0.16666666666666666,0.365625,0.78333
