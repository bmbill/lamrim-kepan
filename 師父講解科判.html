n sj-ba\">往昔<\/span>無始所作諸不善業，多起追悔，","覺燈日光":null,"時":"62B 28:19","頁":145,"af":"62b","st":1699,"et":null,"消文":[{"文":"時間是無始的，作的惡業不曉得多多少少，對這個要多起追悔，就是懊悔。"},{"類":"回扣","文":"前面講不增長業：作已追悔，悔所損惱、對治所損；不但眼前不增長，還能淨除以前的。"},{"文":"這就是破壞現行：唉，我怎麼作這個，怎麼作這樣不理想的！"}],"延伸":[{"題":"多起追悔","組":[{"題":"自認最極下愚才肯改","說":[{"類":"回扣","文":"為什麼前面告訴我們「最極下愚」？學法的人千萬不要覺得自己是智慧的人。"},{"類":"立","文":"第一件事情就是：哎呀，我怎麼這麼差呀！你覺得這麼差，你才肯改。"},{"類":"破","文":"處處覺得我對、我有道理，還要改嗎？道理是見煩惱、習氣是思煩惱，這麼粗猛的都順著它，還談其他嗎？"}]}],"說":[{"類":"回扣","文":"為什麼前面告訴我們「最極下愚」？學法的人千萬不要覺得自己是智慧的人。"},{"類":"立","文":"第一件事情就是：哎呀，我怎麼這麼差呀！你覺得這麼差，你才肯改。"},{"類":"破","文":"處處覺得我對、我有道理，還要改嗎？道理是見煩惱、習氣是思煩惱，這麼粗猛的都順著它，還談其他嗎？"}],"af":"63a","st":2}],"逐字稿":[{"t":"62B 28:19","b":[["q","此中初力者，謂於往昔無始所作諸不善業，多起追悔。"],["s","就這一句話。這個破壞，怎麼破壞法呢？對於你以前所作的，這個以前，我們現在了解，從無始以來，既然時間是無始的話，這個作的惡業是不曉得多多少少，不曉得多多少少。對這個，要「多起追悔」，就是懊悔。我們前面已經說過了，什麼是不增長業？就是作已追悔的，悔所損惱、亦對治所損，對不對？就這個。所以它不但眼前不增長，而且能夠把以前的還能夠淨除掉。這個地方呢，就是破壞現行，我們現在正在進行當中。那麼要破壞它，靠什麼呢？靠這個，對於不善業追悔：唉，我怎麼作這個，怎麼作這個！怎麼作這樣不理想的！"]]},{"t":"63A 00:02","b":[["s","這個話，注意哦！它有一個很特別的地方，覺得什麼 ─我怎麼做得不對！你了解了這裡，你就感覺到了，為什麼前面告訴我們哪，「最極下愚」，你真正學法的人，你最愚癡的人，千萬不要覺得自己是智慧的人。喏！第一件事情就告訴我們：哎呀，我怎麼這麼差呀！你覺得這麼差，你才肯改。你現在覺得處處地方覺得我對，我有道理；既然你有道理，你還要改嗎？你就能破壞現行了嗎？你一天到晚在這個現行當中，你這個道理就是見煩惱，然後你的習氣就是你的思煩惱，這麼粗猛的煩惱都沒辦法破，順著它，還談其他嗎？這句話。那怎麼樣才能生起來？這個道理我們懂了，怎麼樣生起來？下面："]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/001.mp3"},{"文":"欲生此者，須多修習«感異熟等三果道理»。","口譯":"要生起這種追悔，必須多多修習感得異熟果等三種果的道理。","四家合註":"欲生此者，須多修習感<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">不善之<\/span>異熟<span class=\"sjan sj-ba\">、<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">等流、增上<\/span>等三果道理。","覺燈日光":null,"時":"63A 01:01","頁":145,"af":"63a","st":61,"et":231,"消文":[{"文":"前面說的道理一路過來，有了這個基礎，現在修追悔就很容易。"}],"延伸":[{"題":"感異熟等三果道理","組":[{"題":"懺悔要有對錯標準","說":[{"類":"破","文":"說我懺悔呀，你懺些什麼？不知道！跑到佛前念四句，你真的懺了嗎？"},{"類":"立","文":"懺悔是對以前所做的覺得不對；要有一個對的擺在那裡衡量，才衡量得出對跟不對。"}]},{"題":"拔草拔掉了菜","說":[{"類":"喻","文":"叫他去拔草，菜長得高、草小小的，他拼命拔，菜統統拔掉了，草還在那裡。"},{"類":"例","文":"覺得我好用功、出了家這也放下那也放下，然後怪人家不供養我、不跟我磕頭，這個不對那個也不對。"},{"類":"立","文":"這就是把菜都拔掉了，草都留在這裡，絕對不是笑話，仔細檢查看看。"}]},{"題":"有人逼你要感謝","說":[{"類":"例","文":"師父看見同學做很多善業就隨喜沾光；看見同修不理想，心裡直痛心，唯一的辦法是多逼逼他。"},{"類":"下手","文":"條件不夠的話，有人來逼你，你應該感謝他。"}]}],"說":[{"類":"破","文":"說我懺悔呀，你懺些什麼？不知道！跑到佛前念四句，你真的懺了嗎？"},{"類":"立","文":"懺悔是對以前所做的覺得不對；要有一個對的擺在那裡衡量，才衡量得出對跟不對。"},{"類":"喻","文":"叫他去拔草，菜長得高、草小小的，他拼命拔，菜統統拔掉了，草還在那裡。"},{"類":"例","文":"覺得我好用功、出了家這也放下那也放下，然後怪人家不供養我、不跟我磕頭，這個不對那個也不對。"},{"類":"立","文":"這就是把菜都拔掉了，草都留在這裡，絕對不是笑話，仔細檢查看看。"},{"類":"例","文":"師父看見同學做很多善業就隨喜沾光；看見同修不理想，心裡直痛心，唯一的辦法是多逼逼他。"},{"類":"下手","文":"條件不夠的話，有人來逼你，你應該感謝他。"}],"af":"63a","st":61}],"逐字稿":[{"t":"63A 01:01","b":[["q","欲生此者，須多修習感異熟等三果道理。"],["s","你要修這個的話，應該怎麼辦呢？就是，哪！前面說的，前面說的道理，那一路上面都過來。所以說前面這個道理說過來了以後，有了這個基礎現在修這個，那很容易，這樣。所以平常我們說：「哎呀，我懺悔呀、懺悔呀！」你懺些什麼？不知道！你跑到佛前面說我念它個四句，你真的懺了嗎？這個很簡單哪，所謂懺悔的話，對你以前所做的覺得不對。你怎麼曉得它不對？有一個對的東西擺在那裡衡量，你一定是對跟不對衡量出來了以後，那個時候你才衡量出來對跟不對。現在你根本不曉得哪一個是對，哪一個是不對，你說的懺悔，懺些什麼？你能懺，這連它懺些什麼都不知道，就能懺得乾淨了嗎？"]]},{"t":"63A 02:00","b":[["s","就像我們就說，哎，你去拔拔草 ─什麼是草不知道！所以人家說那個笑話：叫他去拔草，結果拔了半天，那個菜都拔掉了，草還在那裡。為什麼？菜長得高嘛，那個草小小的在那裡，他就拼命去拔，拔了半天。他自己覺得：喔唷！他就用功了，用了半天。結果啊，糟了！菜 ─要種的東西統統被他弄掉了，然後呢那個東西沒有。這不是一個笑話哦！如果我們仔細檢查一下，我們現在往往覺得：我現在好用功修行喔，你看我又出了家，這個也放下，那個也放下，然後呢，這個那一些人怎麼不供養我，跑得來也不跟我磕頭；又是個出家人。然後呢這一個人不對，那個人也不對。你做些什麼啊？你做這個就是你把菜都拔掉了，然後呢這個草都在留在這個地方。這個我絕對不是說的笑話，你仔細檢查、檢查看。"]]},{"t":"63A 03:00","b":[["s","所以這是為什麼我在這地方，我覺得自己一方面很不忍心，一方面看見在座的有幾位同學好了，是讚歎、歡喜啊！我都是靠了他，他做了很多善業，我沾了光，隨喜功德。但是另外一方面，有很多同修，偶然有幾位同修不理想，啊，我心裡直痛心，我呀真是不曉得怎麼幫忙他，唯一的辦法總希望多逼逼他，就是這個道理。所以如果大家條件不夠的話，你們記住：有人來逼你，你應該感謝他；否則的話，趁早回家去，那還少造一點罪惡，至少將來不會墮地獄裡面受苦哦！這一直是千真萬確的事實。那麼下面呢，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/002.mp3"},{"文":"修持之時，應由《勝金光明懺》及《三十五佛懺》«二種悔除»。","口譯":"實際修持的時候，應當依《勝金光明懺》和《三十五佛懺》這兩種來悔除。","四家合註":"修持之時，應由《勝金光明懺》<span class=\"sjan sj-ba\">，<\/span><i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">此亦有宗喀巴大師所編著本，<\/span>及《三十五佛懺》二種悔除。","覺燈日光":null,"時":"63A 03:51","頁":145,"af":"63a","st":231,"et":915,"消文":[{"文":"《勝金光明懺》依《金光明經》：北涼曇無讖譯本有智者大師著疏；唐朝義淨三藏譯十卷本最完整，能淨除一切業障。"},{"文":"《三十五佛懺》是早晚課八十八佛的後三十五佛；五十三佛出《觀藥王藥上菩薩經》，三十五佛出《決定毘尼母經》。"}],"延伸":[{"題":"二種悔除","組":[{"題":"對過去錯誤驚心動魄","說":[{"類":"下手","文":"把《了凡四訓》、《俞淨意公遇竈神記》好好看兩遍。"},{"類":"立","文":"看了會覺得：哎呀，我怎麼以前這麼錯呀！對以前的錯誤產生驚心動魄之感，那時候就有機會把罪惡懺乾淨，五無間罪都可以懺乾淨。"}]},{"題":"儀軌完整才開得動","說":[{"類":"例","文":"宗喀巴大師修行第一步就懺悔，親見三十五佛卻沒有頭，本尊告訴他儀軌不完整，補足了就對。"},{"類":"喻","文":"儀軌像汽車，沒有門、沒有車身、沒有輪胎開不動；只有引擎、駕駛，也不能載東西載客。"},{"類":"立","文":"跟早晚課的三十五佛內容大致相同，差在觀行的方法，那是懺悔最重要的地方；照這樣做，草拔掉了，菜留下來。"}]},{"題":"現行就是當下心態","說":[{"類":"立","文":"什麼是現行？現在的心理狀態就是現行，由這個心理狀態而有的身心狀態就是現行。"},{"類":"例","文":"上課法相應的聽得來勁；不相應的直望手錶，怎麼還不下課？這就是你的現行。"},{"類":"破","文":"「寬大」，浮浮泛泛、馬馬虎虎，就是墮落的根；坐著滿好、聊天高興、上街起勁，就是現在的現行。"}]},{"題":"認得染污相應的行相","說":[{"類":"例","文":"拜佛別人拜三拜我拜一拜，唱念覺得傷氣讓別人念；這是跟染污相應。"},{"類":"例","文":"有人打齋，事先就相應了，吃的時候越吃越起勁，全部精神貫注，這是惡法相應的現行。"},{"類":"立","文":"一碰到就全部精神貫注進去，那就是跟法相應；要了解它所指的行相是什麼。"}]},{"題":"不破現行懺悔無用","說":[{"類":"立","文":"沒有破現行，所謂懺悔眼前一點用場都沒有，只是種下一個種子。"},{"類":"例","文":"老和尚念佛的時候，全部精神貫注在上頭，儘管不講道理，現行一定破的。"},{"類":"立","文":"破現行力，是一種心力，就是業力。"}]}],"說":[{"類":"下手","文":"把《了凡四訓》、《俞淨意公遇竈神記》好好看兩遍。"},{"類":"立","文":"看了會覺得：哎呀，我怎麼以前這麼錯呀！對以前的錯誤產生驚心動魄之感，那時候就有機會把罪惡懺乾淨，五無間罪都可以懺乾淨。"},{"類":"例","文":"宗喀巴大師修行第一步就懺悔，親見三十五佛卻沒有頭，本尊告訴他儀軌不完整，補足了就對。"},{"類":"喻","文":"儀軌像汽車，沒有門、沒有車身、沒有輪胎開不動；只有引擎、駕駛，也不能載東西載客。"},{"類":"立","文":"跟早晚課的三十五佛內容大致相同，差在觀行的方法，那是懺悔最重要的地方；照這樣做，草拔掉了，菜留下來。"},{"類":"立","文":"什麼是現行？現在的心理狀態就是現行，由這個心理狀態而有的身心狀態就是現行。"},{"類":"例","文":"上課法相應的聽得來勁；不相應的直望手錶，怎麼還不下課？這就是你的現行。"},{"類":"破","文":"「寬大」，浮浮泛泛、馬馬虎虎，就是墮落的根；坐著滿好、聊天高興、上街起勁，就是現在的現行。"},{"類":"例","文":"拜佛別人拜三拜我拜一拜，唱念覺得傷氣讓別人念；這是跟染污相應。"},{"類":"例","文":"有人打齋，事先就相應了，吃的時候越吃越起勁，全部精神貫注，這是惡法相應的現行。"},{"類":"立","文":"一碰到就全部精神貫注進去，那就是跟法相應；要了解它所指的行相是什麼。"},{"類":"立","文":"沒有破現行，所謂懺悔眼前一點用場都沒有，只是種下一個種子。"},{"類":"例","文":"老和尚念佛的時候，全部精神貫注在上頭，儘管不講道理，現行一定破的。"},{"類":"立","文":"破現行力，是一種心力，就是業力。"}],"af":"63a","st":303}],"逐字稿":[{"t":"63A 03:51","b":[["q","修持之時，"],["s","我們正修的時候怎麼辦哪？"]]},{"t":"63A 03:55","b":[["q","應由《勝金光明懺》及《三十五佛懺》二種悔除。"],["s","有非常正確的教誡，告訴我們這個道理。《勝金光明懺》是有一本經，就是《金光明經》。《金光明經》一共有好幾個翻譯本，第一個是北涼曇無讖翻譯的，根據這個翻譯本，智者大師曾經著過疏，很多祖師們。那麼還有《金光明懺》，這個主要的因為智者大師著了疏以後，根據這個。這個另外一個譯本，那個是唐朝義淨三藏譯的《金光明經》十卷。如果你們真正看的話，你們應該看那個十卷那個，後來寫得非常完整。啊！那是真正好極、好極了！我這地方它有一個拷貝，實際上那個藏經裡面也有，它那地方能夠淨除我們所有一切的業障。"]]},{"t":"63A 05:03","b":[["s","關於這個道理，現在我實在沒精神，有精神的時候，我晚上要跟你們講的。可是晚上，現在講起來，因為我接了這麼太多的東西，我只能這樣說了，但願你們把《了凡四訓》、《俞淨意公遇竈神記》這一種好好地看兩遍。然後呢看兩遍，我告訴你們的書多看，看了以後，然後你到那時一看的話，你到那時候心裡面會馬上產生正確的覺受。至少你會很認真地覺得：哎呀，我怎麼以前這麼錯呀！乃至於你會有自己感覺得，對以前的錯誤產生驚心動魄之感。對了！那個時候你就對了，你就有機會把你以前的罪惡統統懺乾淨了。還有呢，它告訴我們的好處，這個好處是不得了的好處，你只要肯這樣去做的話，的的確確地，哪怕五無間罪，都可以懺得乾乾淨淨的。那麼這是第一個是《金光明懺》。"]]},{"t":"63A 06:02","b":[["s","還有呢，《三十五佛懺》。《三十五佛懺》就是我們現在的早、晚課誦當中，那個八十八佛當中的後面三十五佛。八十八佛分成功兩部分，一個前面的五十三佛，一個是後面的三十五佛；它各有根據的，五十三佛出在《觀藥王藥上菩薩經》上面，然後三十五佛出在《決定毘尼母經》上頭。這兩個經裡邊，那麼現在它們傳的，這個宗喀巴大師傳的這個傳承當中，這兩個都有完整的方法，所以我現在不用那個八十八佛，本來這個八十八佛那個儀軌，還是密教的大師做的，你仔細一看的話，你就了解。那麼現在我們發給你的這個儀軌，它有它的一個特別的一個意義，我順便跟你們說一下。"]]},{"t":"63A 07:03","b":[["s","宗喀巴大師當年他也是，修學都是這樣，以他這樣的老人家，這麼了不起，他修行第一步就懺悔。那麼懺悔乾淨了以後呢有淨罪相，到那時種種感應，欸，他親見那個三十五佛。結果見了三十五佛的時候，那三十五佛沒頭，欸，奇怪！怎麼沒頭？那麼他就問，因為見到了，然後呢就告訴他，說你那個儀軌不完整，有一部分缺少。後來他去請教，然後呢那個本尊告訴他，現在還有什麼地方你不夠，補足了就對。"]]},{"t":"63A 07:38","b":[["s","所謂儀軌，平常我們看起來，就像那個說一遍。實際上那個儀軌就是什麼？說，拿我們普通一點話來講的話，譬如那個汽車，汽車的什麼叫儀軌？這個輪胎是這樣子的，那個車身這個樣，門是這個樣……。請問：如果那個汽車沒有門、沒有車身、沒有輪胎，你能開得動嗎？你不能開，哪一部分少了就不行。所以它儀軌不完整，那個內容是有的，就像那汽車子是一樣，它那個引擎是有的，那個駕駛的人坐在上面，可是對不起，不能載東西，也不能載客呀！那麼經過宗喀巴大師這麼一改革，那麼這個就完整了，所以我所以採用這個法本的原因。"]]},{"t":"63A 08:20","b":[["s","其實這個內容，跟我們現在的早晚課誦上面所用的那個三十五佛，內容大致相同，只有一點點，就是那個觀行的方法。實際上觀行的方法，主要的就是懺悔的最重要的地方。剛才說的，平常我們說懺悔、懺悔，那嘴巴上面講，從哪裡懺呀？不知道。結果弄了半天，像那個笑話當中一樣，把菜拔掉了，草留在那裡；它現在你了解了這樣子的內容去做的話，你做對了，草都拔掉了，菜留下來了，這是我順便一提。那麼以後呢我這個《金光明懺》那一部分，我不講，只是它宗要的地方，我還是會給大家提一下。那麼主要的用的就是用那個《三十五佛懺》，現在你們已經每個人都有了，在沒有講的之前，各位好好地把它看一下，好好地看一下，以後我們每天功課當中，一樣主要的就是學修這個法。這個是破壞現行，把現行破壞。"]]},{"t":"63A 09:42","b":[["s","在說下去之前，有一點我要跟大家說一下的。到現在為止，你們曉得不曉得什麼是現行？大部分人大家都知道，容或還有一、兩個人不知道，那我要告訴你們，什麼是現行？就是你現在的心理狀態就是現行；由於這個心理狀態，你身心狀態就是現行，就這麼簡單。你現在的現行是什麼？我們在上課你一心一意在聽這個東西，法相應的，聽得個來勁；法不相應的，聽得不曉得在那個地方怎麼辦是好，但是也無法可想，直望手錶，「怎麼還不下課？」這就是你的現行，就是這樣。"]]},{"t":"63A 10:27","b":[["s","那麼現在我們懂得了這個佛法以後的話呢，曉得原來這是什麼？如果跟法不相應的話，那就是不符、不順。如果是「符」是什麼？跟空相應了，見道以後。「順」是什麼？現在就是我們前面這種狀態，順於這個道相應的，一步一步覺得，啊，心心念念覺得：我這個錯的要拿掉它，對的要上去，就是這個。所以說假定我們現在的心理就這樣的，所以前面說「寬大」，浮浮泛泛，馬馬虎虎，這個心裡面就是墮落的根。真正修行就從這地方要破掉它，如果你這地方不破的話，沒辦法！為什麼我們現在不能用功，請問？為什麼？你覺得要想用功啊就提不起來。提不起來的狀態是什麼？就坐在這裡滿好嘛，欸，坐在這裡；然後呢有人跑得來聊聊天滿高興，就是這樣然後；要上街去尤其起勁。這個什麼？就是現在的現行，這麼簡單。你一旦破掉了，什麼呢？就是這心裡面沒有了嘛，所以破現行就這麼簡單！"]]},{"t":"63A 11:40","b":[["s","但是呢，這一個東西就這麼實在，就這麼實在！你真的破掉了，你就會很清楚的，到那時候你如果是拜佛的話 ……。現在你們拜佛什麼現象，我不敢說，但是以往我的經驗以往的話，去拜佛，「是啊，出了家嘛，當然要去做這種事情啊！」可是拜是在那兒拜，拜了半天是沒味道，就這麼所以叫「追上下」，就這個樣。心裡面看看大家都拜我不拜，我也不好意思，最好少拜幾拜；然後呢一拜拜下去，拜了個半天，然後站起來；別人拜三拜，我只拜一拜，反正我總歸在那兒拜了。就是這個現行，就是這樣，你心裡面不大相應的，這就是我們現在跟染污相應的。然後呢，你在那兒唱念的時候的話呢，「唉呀，儘量的話那最好啊 ……那個唱起來啊很傷氣，反正別人，有別人念，我也去不去管它了。」就這種，處處地方，這就是我們的現行，你了解了一下。"]]},{"t":"63A 12:47","b":[["s","什麼樣對了呢？就是你一碰到，你全部精神就貫注進去了，就這個樣，那就是跟法相應了。或者你會感到歡喜，或者你自己不覺得歡喜，但是全部精神呢就覺得跟它相應，就這樣。那麼跟善法相應的心情，我們不大多，可是跟惡法相應的事情，說起來處處皆是。譬如今天有人打齋：啊，今天要打齋！喔，這個打齋，不但打齋還有什麼，找那些東西來得個配胃口。你事先，嗯，嗯！現在心裡這個相應了，然後你吃的時候，越吃越起勁，那時你不覺得歡喜，但是心裡面，全部精神貫注在裡邊。對不對？這個什麼？惡法相應的現行。我們現在要破什麼？就破這個，就破這個！所以這個道理說起來很容易喔，你一定要了解它所指的行相是什麼，這樣。如果是將來你真的一旦破了以後，你會感覺到內心當中立刻有不同的感受，這個下面一個個講下去。"]]},{"t":"63A 14:00","b":[["s","所以如果這個沒有的話，所謂的懺悔一點用場都沒有！我說的一點用場，就是眼前結果的用場；那個種子有的哦，我已經說過很多次了，注意！只是一個種子，只是如此而已，只是個種子如此而已。那我們這裡老和尚他為什麼能夠這樣的功效，你們有機會去問問他。那肯定地，他念佛的時候，一定到那時候全部精神貫注在上頭，儘管他不講那個道理，現行一定破的。那個時候的現行是什麼？一定跟法相應的，就這麼清楚。所以你真正懂了以後要去修行的話，你們會內心當中非常清楚、非常明白，現在你這個一念是什麼！如果你跟染污相應的，就是這樣。然後呢在這裡告訴你要破，就是破這個，了解了嗎？這個叫破現行「力」，這是種力量，這是種力量。什麼力量？心力，就是業力啊，業力啊，就是這個。第一個。第二，第二什麼？對治。對治當中分六："]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/003.mp3"},{"文":"第二力中分六，依止甚深經者，謂«受持讀誦»《般若波羅蜜多》等契經文句。","口譯":"第二力（對治現行力）中分六種。一、依止甚深經：就是受持讀誦《般若波羅蜜多經》等契經的文句。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、<\/span><span>第二<\/span><span class=\"sjan sj-miao\">遍行對治<\/span><span>力中，分六：<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第一、<\/span><span>依止甚深經者：<\/span>謂於《般若波羅蜜多》等契經文句，受<span>取、執<\/span>持<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">義理<\/span>、讀誦<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">經卷，通利一切文義二者<\/span>等。<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">或云：「經說吉祥施比丘於托缽時，因其顏貌端正，又復愛戀一商主女，遂與共住，而殺商主。後起憂悔，文殊引之至於佛前淨除罪惡，佛令觀察造作墮罪之心，見心真實，而淨墮罪，得無生法忍。」<\/span>","覺燈日光":null,"時":"63A 15:15","頁":145,"af":"63a","st":915,"et":1138,"消文":[{"文":"對治就是對症下藥，治療無始以來煩惱相應的現行留下的習氣、種子。"}],"延伸":[{"題":"受持讀誦","組":[{"題":"沒有初力就沒有對治","說":[{"類":"立","文":"沒有第一個，絕不可能有第二個；現行還在增長，你對治什麼？"},{"類":"立","文":"破掉了現行，無始習氣的力量還在，那時候才談得到對治。第一個力量沒有，說懺悔都是開玩笑。"}]},{"題":"讀經兩種方式不矛盾","說":[{"類":"立","文":"讀經有兩種：如理思惟觀察經中意義；或者不去分別，一心至誠恭敬地念。"},{"類":"立","文":"現行破了，不管哪一種，薰習進去的都是清淨之法，兩個絕不矛盾；必要條件是破現行。"}]},{"題":"煩惱現行中念誦無用","說":[{"類":"破","文":"嘴巴唱得有勁，腦筋胡思亂想，還在煩惱現行當中，產生的是煩惱的力量。"},{"類":"喻","文":"藥是要對治細菌的，現在吃進去的都是細菌，能治得好病嗎？"},{"類":"立","文":"懂得這個，持戒、念佛、參禪、學教都有了。"}]}],"說":[{"類":"立","文":"沒有第一個，絕不可能有第二個；現行還在增長，你對治什麼？"},{"類":"立","文":"破掉了現行，無始習氣的力量還在，那時候才談得到對治。第一個力量沒有，說懺悔都是開玩笑。"},{"類":"立","文":"讀經有兩種：如理思惟觀察經中意義；或者不去分別，一心至誠恭敬地念。"},{"類":"立","文":"現行破了，不管哪一種，薰習進去的都是清淨之法，兩個絕不矛盾；必要條件是破現行。"},{"類":"破","文":"嘴巴唱得有勁，腦筋胡思亂想，還在煩惱現行當中，產生的是煩惱的力量。"},{"類":"喻","文":"藥是要對治細菌的，現在吃進去的都是細菌，能治得好病嗎？"},{"類":"立","文":"懂得這個，持戒、念佛、參禪、學教都有了。"}],"af":"63a","st":921}],"逐字稿":[{"t":"63A 15:15","b":[["q","第二力中分六，依止甚深經者，"],["s","那個六樣東西，一樣一樣東西說一下。"]]},{"t":"63A 15:21","b":[["q","謂受持讀誦《般若波羅蜜多》等契經文句。"],["s","這個第二個是對治力，什麼叫對治呢？就是對症下藥，治療以前那個老毛病，這個力量。以前什麼老毛病啊？就是無始以來的這個積習。換句話說無始以來，我們一直在什麼？喏，煩惱相應的現行當中。因為你有這樣的個現行，唯識上面所謂的種子，換句話說 ─習氣，這個習氣的力量很深很重，現在你要把那個習氣，要把它拿掉，那麼這個要靠第二個力量，要靠第二個力量。但是這個第二個力量，跟第一個有沒有關係？絕對有關係！沒有第一個，絕不可能有第二個。為什麼呀？因為你現在第一個都在現行當中，你還在增長，你對治什麼！就是你破掉了現行了，眼前雖然破掉了，可是它無始以來，這個習氣的力量還在，那個時候你一定要把它拿掉它，所以那個時候才談得到對治。所以假定我們第一個力量沒有的話，說懺悔，什麼東西都是開玩笑！"]]},{"t":"63A 16:47","b":[["s","那麼現在你看哪！第一個「依止甚深經典」與「讀誦」這些。所以祖師們都告訴我們，讀經有沒有用？有用啊！讀經有兩種：有一種，你如理思惟觀察，了解經當中什麼意義；還有一種，祖師告訴我們，你不要去分別，一心至誠恭敬地去念，也有道理。現在這個地方懂了沒有？喏，說得很清楚，就是這個。因為以前你的現行是什麼？跟煩惱雜染相應的。現在你第一個把它現行破除，然後那個時候，或者你提起至誠恭敬地只要去念。那個時候，什麼？你薰習進去的是清淨之法；或者你是如理思惟觀察，不管是你用哪一種方式 ─對治。你懂得了這個，那就了解了祖師告訴你說：「你不要去分別思惟，你只要一心恭敬念。」對！然後呢說：「如果說你要去念這個，你要如理思惟了解了，照它行持。」對！兩個絕不矛盾。但是有一個必要的條件是什麼？你要破現行。"]]},{"t":"63A 18:07","b":[["s","假定你現在嘴巴上面嘰哩呱啦唱得個有勁，腦筋裡面胡思亂想，請問有沒有用？你現在還在煩惱現行當中。它對治的是什麼？就是產生的力量。現在你在煩惱現行當中，你產生了什麼力量？煩惱力量！這個本來說治病，是藥要對治那個細菌的，現在你吃進去了都是細菌，能治得好病嗎？懂不懂？所以這個地方我們要注意喔！所以我這一地方是講得比較詳細一點，你們了解了，自然而然你們這麼了解的話，不管你持戒、念佛、參禪、學教，都有了。這第一個，我們就說你讀經。第二個呢，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/004.mp3"},{"文":"«勝解空性»者，謂趣入無我光明法性，深極忍可本來清淨。","口譯":"二、勝解空性：是趣入無我的光明法性，深深地忍可（一切法）本來清淨。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、<\/span><span>勝解空性者：<\/span>謂<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">以聞思修三<\/span>趣入<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">人法<\/span>無我<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">自性<\/span>光明法性<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">空性<\/span>，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">如云：「心自性光明，諸垢為客塵。」<\/span>信解本來<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">自性<\/span>清淨。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">證達罪惡三輪無自性者，是為最勝淨罪，如云：「薄福於此法，猶豫且不生，縱唯起猶豫，亦能壞三有。」<\/span>","覺燈日光":null,"時":"63A 18:58","頁":145,"af":"63a","st":1138,"et":1284,"消文":[{"文":"這是大徹大悟了；現行破了以後，跟聞、思、修相應的智慧裡，跟空性相應是修慧，最高的。"}],"延伸":[{"題":"勝解空性","組":[{"題":"被經轉與轉經","說":[{"類":"例","文":"法達念了三千部《法華經》，拜六祖頭不著地；六祖說你不是轉經，是被經轉，講幾句話他就開悟了。"},{"類":"例","文":"開悟後他說以後不要念經了，六祖說：以前被經轉，現在你真正轉經、真正念經。"}]},{"題":"拔根之後習氣還在","說":[{"類":"立","文":"單單誦經可能是聞思修三種，空性相應一定是修慧，從根拔掉，所以更高明，這是正對治。"},{"類":"立","文":"根拔掉了，種子習氣還在；初地菩薩已經不在生死流轉，是願力還在這裡。"}]}],"說":[{"類":"例","文":"法達念了三千部《法華經》，拜六祖頭不著地；六祖說你不是轉經，是被經轉，講幾句話他就開悟了。"},{"類":"例","文":"開悟後他說以後不要念經了，六祖說：以前被經轉，現在你真正轉經、真正念經。"},{"類":"立","文":"單單誦經可能是聞思修三種，空性相應一定是修慧，從根拔掉，所以更高明，這是正對治。"},{"類":"立","文":"根拔掉了，種子習氣還在；初地菩薩已經不在生死流轉，是願力還在這裡。"}],"af":"63a","st":1138}],"逐字稿":[{"t":"63A 18:58","b":[["q","勝解空性者，謂趣入無我光明法性，深極忍可本來清淨。"],["s","這是什麼？大徹大悟了，對呀！就這樣。而那個時候心裡什麼狀態？不但現行破 ─現行破了以後，那個時候的心理什麼？是跟聞、思、修三種狀態相應的智慧，一定跟法相應。跟空性相應是什麼程度呢？跟修慧相應的，那最高的。前面我們去念的時候，當然你可能已經跟修慧相應，譬如說六祖大師的有一個學生，這個念《法華經》三千部的這個達法，他以前，法達還是達法我忘記掉了。然後他念了三千部，自己還覺得大我慢，跑得去拜六祖大師頭不著地，六祖大師說：「這個大我慢，你磕頭頭不著地，你心裡有什麼？」自己被這個祖師一說，他心裡面覺得：嗯，祖師倒有一點名堂，我一生念了三千部 ……。「那你何嘗念經啊！你不是在轉經，你被經轉哪！」然後給他講了幾句話，開悟了，啊，大徹大悟！然後呢大徹大悟了以後，他說：「那我以後不要念經了。」六祖大師怎麼說？「以前你根本是被經轉哪，現在你真正轉經啊，現在你真正念經啊！」說不是說大徹大悟以後不要啊！就這樣。"]]},{"t":"63A 20:36","b":[["s","所以前面這個單單誦，可能是聞、思、修三種，說空性相應是一定最後那一種，所以更高明。當然嘛！你能夠把這個裡邊從根把它拔掉，那更高明的一種。第二個，這對治。這個所謂根拔掉，那個種子習氣還在，那個種子習氣還在哦！所以初地菩薩達到這個境界，他雖然種子習氣還在，他已經不在生死當中流轉，他是他的願力在，他是他願力還要在這個地方，這是我們要了解的。這是正對治，就是真正地破壞了它這個種子了。第三，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/005.mp3"},{"文":"依念誦者，謂如儀軌念誦百字咒等，諸殊勝陀羅尼。","口譯":"三、依念誦：就是如儀軌念誦百字咒等種種殊勝的陀羅尼。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第三、<\/span><span>依念誦<\/span><span class=\"sjan sj-miao\">，分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">乃至出淨罪相之間應當行之，以及清淨之喻；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">相徵。初<\/span><span>者：<\/span>謂如<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">各自典籍中所出<\/span>儀軌念誦《百字咒》等諸殊勝陀羅尼。","覺燈日光":null,"時":"63A 21:24","頁":145,"af":"63a","st":1284,"et":1338,"消文":[{"文":"這是我們現在用得上最好的辦法。百字咒在放焰口當中有，印度、西藏很盛傳。"},{"文":"「等」是其他殊勝陀羅尼，像準提咒、大悲咒、往生咒，乃至滅罪真言。"}],"延伸":[],"逐字稿":[{"t":"63A 21:24","b":[["q","依念誦者，"],["s","這個下面這個，就是我們現在用得上的最好的辦法。"]]},{"t":"63A 21:29","b":[["q","謂如儀軌念誦百字咒等，諸殊勝陀羅尼。"],["s","依這個方法照著儀軌去念，那個「百字咒」，在我們那個放焰口當中有一個百字咒，不曉得你們會不會？這個當年印度跟現在西藏這個很盛傳，在我們中國只有焰口當中，就是那個，就是那個。那麼這個什麼？這個不一定是這個，「等」，其他的「殊勝陀羅尼」。譬如我們現在或者念準提咒、或者念大悲咒、或者念往生咒，乃至於譬如說滅罪真言，都是這些。那麼下面引經。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/006.mp3"},{"文":"《妙臂請問經》云：「如春林火猛燄熾，無勵徧燒諸草木，«戒風»吹燃念誦火，«大精進燄»燒諸惡。","口譯":"《妙臂請問經》說：「如同春天林中的火，猛烈的火燄熾盛，不必費力就遍燒一切草木；以戒的風吹燃念誦的火，用大精進的火燄燒盡諸惡。","四家合註":"《妙臂請問經》云：「<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">譬<\/span>如春<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">時<\/span>林<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">間<\/span>火猛燄熾，無<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">刻意<\/span>勵遍燒諸<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">草木等<\/span>蔥鬱，戒<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">之<\/span>風吹燃念誦<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">甚深陀羅尼咒等<\/span>火，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">以<\/span>大精進<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">猛動<\/span><span>之<\/span>燄燒諸惡。<span class=\"sjan sj-ba\">」<\/span>","覺燈日光":null,"時":"63A 22:18","頁":145,"af":"63a","st":1338,"et":1655,"消文":[{"文":"春天草木都枯掉了，猛火一來，一下燒得光光的；荒地點一把火，風一大，幾分鐘統統燒光。"},{"文":"積的罪只要如法正對治，很快！"}],"延伸":[{"題":"如春林火猛燄熾","組":[{"題":"懺悔的力量太值得","說":[{"類":"喻","文":"房子黑暗一千年，點一盞燈一點就亮；積了一千年的枯草木，一把火幾分鐘燒光。"},{"類":"立","文":"花小小的氣力，把以前這麼大的惡一下弄乾淨；貪小小便宜，將來受苦無量無邊。真懂了，不修行都做不到。"}]}],"說":[{"類":"喻","文":"房子黑暗一千年，點一盞燈一點就亮；積了一千年的枯草木，一把火幾分鐘燒光。"},{"類":"立","文":"花小小的氣力，把以前這麼大的惡一下弄乾淨；貪小小便宜，將來受苦無量無邊。真懂了，不修行都做不到。"}],"af":"63a","st":1420},{"題":"戒風","組":[{"題":"修學佛法第一是戒","說":[{"類":"立","文":"要燒光還要條件：沒有風不行，什麼風？戒！持戒沒有，談不到。"}]},{"題":"受戒如同訂契約","說":[{"類":"破","文":"受了戒又說現在時代這個不行那個不行。"},{"類":"喻","文":"像契約，你可以不訂，沒人逼你；既然訂了，當然應該守。"},{"類":"下手","文":"我真愚癡，感得這個末法；我真愚癡，不了解制戒原因，只有老老實實，佛怎麼說就怎麼做。"}]}],"說":[{"類":"立","文":"要燒光還要條件：沒有風不行，什麼風？戒！持戒沒有，談不到。"},{"類":"破","文":"受了戒又說現在時代這個不行那個不行。"},{"類":"喻","文":"像契約，你可以不訂，沒人逼你；既然訂了，當然應該守。"},{"類":"下手","文":"我真愚癡，感得這個末法；我真愚癡，不了解制戒原因，只有老老實實，佛怎麼說就怎麼做。"}],"af":"63a","st":1485},{"題":"大精進燄","組":[{"題":"精進是善法相應","說":[{"類":"立","文":"念不是嘴巴唱，是心跟它相應；心跟法相應，一定破掉不相應的現行，所以叫大精進。"},{"類":"破","文":"一口氣雙盤兩個鐘頭、拜五百拜，心裡胡思亂想，那是懈怠，沒有用。"},{"類":"立","文":"精進不是拼命出力，是善法相應的努力：持戒嚴，心裡把握住去做。"}]}],"說":[{"類":"立","文":"念不是嘴巴唱，是心跟它相應；心跟法相應，一定破掉不相應的現行，所以叫大精進。"},{"類":"破","文":"一口氣雙盤兩個鐘頭、拜五百拜，心裡胡思亂想，那是懈怠，沒有用。"},{"類":"立","文":"精進不是拼命出力，是善法相應的努力：持戒嚴，心裡把握住去做。"}],"af":"63a","st":1597}],"逐字稿":[{"t":"63A 22:18","b":[["q","《妙臂請問經》云：「如春林火猛燄熾，無勵徧燒諸草木，戒風吹燃念誦火，大精進燄燒諸惡。"],["s","啊，妙不可言！就像春天樹林當中的火，那個火非常地猛烈。春天怎麼狀態啊？每年到了春天，所有的樹木都枯掉了。我們當然這地方熱帶、亞熱帶，那常綠的，他們那個地方是哪裡？在西藏，那個夏天的山頂上面，凍得你要命，到了冬天的山頂上面，一樣東西都沒有了，所有的樹葉掉得光光的，所有的草都枯掉了。在這種草枯的情況之下，碰見那個猛火一來的話，一下燒得光光的，燒得一樣都沒有。你不要說像西藏，那我覺得我們那地方，上海一帶，那是這個溫帶。到了春天，他們這個荒野當中，有一個辦法就是，譬如我們現在看見那個後面荒地，那不是長的荒草很多嗎？他們點一把火，一把火一點，要不了幾分鐘，「嘎！」那個風又大，一下統統燒得光光的。"]]},{"t":"63A 23:40","b":[["s","那麼說明了什麼？說明了就是我們積那個罪，你只要如法地去正對治，很快！所以經上面它有一個比喻：有人害怕，說我這個無始以來的罪過這麼重，怎麼辦哪？佛就告訴你：欸，我告訴你，假定是這個房子裡邊，黑暗一千年了，然後呢你點一盞燈的話，是不是點了要一千年，慢慢、慢慢把它趕走啊？不是。什麼時候亮？你一點就亮，對不對？對呀！儘管黑了一千年了，不要說一千年，一萬年再長，你一盞燈一點，馬上就亮。還有呢，你積那個草、那個木頭，積在那裡積一千年了，你要去燒，要不要燒一千年哪？也不要，那倒沒有什麼燈那麼快，但是只要這個積的真正枯掉了，你一把火點上去，沒幾分鐘「刮！」統統燒光。那這個就是我們懺悔的力量，注意哦！太值得了，太值得了！"]]},{"t":"63A 24:45","b":[["s","所以你真正懂得了，沒有一個人例外的，它絕對會教你不修行都做不到。你會了解：我只要花這麼小小的氣力，把以前這麼大的惡，一下就弄乾淨掉了；反過來呢，你貪小小的一點點便宜，將來受的苦是無量無邊哪！嗯，就這個。可是這個裡邊有一個問題哦！它雖然這個春天，這個懺罪的時候你不要努力，一下就可以把它雜草都燒光，還要什麼條件？「戒風吹燃念誦火，大精進燄燒諸惡」，要靠一樣東西，沒有風不行，什麼風啊？戒！所以告訴我們，你持戒沒有的話，談不到。所以這個修學佛法，第一件事情是戒！"]]},{"t":"63A 25:41","b":[["s","現在我們有太多的人，碰到這種情況說，哎呀，現在這個時候啦 ……總覺得好像這個不行、那個不行啊！這倒是沒有錯，持起戒來是比較難，所以你大可不必受這個戒。既然你受了戒，這很簡單嘛，這個不是別人逼著你耶，你自己願意受，願意受的話，你為什麼還要說這個話？你要說這個話，就不要受，不很簡單嘛！對吧？這個像契約一樣，我訂了契約，你可以不訂嘛，沒有人逼著你，既然你訂了，那當然應該守那個戒，就這樣。所以在我的感覺，我只是覺得我真愚癡，我怎麼感得這個末法呢？這第一個。第二個我真愚癡，我不了解這個制戒的真實原因，我只有老老實實，佛怎麼說我就照這麼做。那個時候就對了！"]]},{"t":"63A 26:37","b":[["s","「戒風」，然後呢吹這個念誦的火，這個念誦的時候是「大精進燄」，這個念不是嘴巴裡唱哦 ─心，現在的心跟它相應的。所以現在的心既然跟法相應了，一定破掉不相應的現行，這個了解不了解？所以叫大精進。什麼叫「精進」？精進的定義不是說你在那裡拼命地出力哦！就是說善法相應的努力，這個才叫精進。如果說你在念，在那兒磕頭，「哎呀，我可以一口氣坐兩個鐘頭雙盤，然後今天拜個五百拜！」但是你心裡面胡思亂想，對不起，懈怠，沒有用，沒有用！所以真正地精進的話，就是一定是這樣：持戒持得很嚴，然後呢心裡面把握住地這樣地去做，第一個。第二個，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/007.mp3"},{"文":"猶如日光炙雪山，不耐赫熾而消溶，若以«戒日»念誦光，炙照惡雪亦當盡。","口譯":"猶如日光炙曬雪山，雪耐不住熾熱而消融；若以戒為日、以念誦為光，炙照罪惡之雪，也將消盡。","四家合註":"<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">又云：「復次，<\/span>猶如日光炙冰雪，不耐赫熾而消溶，若以戒日<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">為依本之<\/span>念誦光，炙照惡雪亦當<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">速<\/span>盡。<span class=\"sjan sj-ba\">」<\/span>","覺燈日光":null,"時":"63A 27:35","頁":145,"af":"63a","st":1655,"et":null,"消文":[{"文":"太陽光一照，雪耐不住都溶掉了；現在用戒日來照。"}],"延伸":[{"題":"戒日","組":[{"題":"佛制戒是無明的對治","說":[{"類":"立","文":"要去苦得樂就要造善業，但業因我們不了解；業感緣起只有佛徹底了解，所以他制的戒才完整。"},{"類":"喻","文":"一心恭敬照著做就是正見，是無明的對治：像光一點黑暗就去，像熱一來寒就消。"}]},{"題":"五年不離依止","說":[{"類":"立","文":"剛開始頭上五年不可離依止；五年了開遮持犯還不行，就盡壽依止。"},{"類":"立","文":"唯有這個是光明的；不了解一定要依止。戒日不但有熱而且有光，光熱同炙，惡習統統盡。"}]}],"說":[{"類":"立","文":"要去苦得樂就要造善業，但業因我們不了解；業感緣起只有佛徹底了解，所以他制的戒才完整。"},{"類":"喻","文":"一心恭敬照著做就是正見，是無明的對治：像光一點黑暗就去，像熱一來寒就消。"},{"類":"立","文":"剛開始頭上五年不可離依止；五年了開遮持犯還不行，就盡壽依止。"},{"類":"立","文":"唯有這個是光明的；不了解一定要依止。戒日不但有熱而且有光，光熱同炙，惡習統統盡。"}],"af":"63a","st":1655}],"逐字稿":[{"t":"63A 27:35","b":[["q","猶如日光炙雪山，不耐赫熾而消溶，若以戒日念誦光，炙照惡雪亦當盡。"],["s","一段一段的譬喻。第二個就像這個太陽光，然後呢照這個雪山一樣。那個太陽光一照，啊！那個雪就耐不住都溶掉了。現在呢什麼東西來照？「戒日」。這個戒像日一樣，為什麼戒像日一樣？為什麼？我們要懂得它。我們所以要修學佛法，所以要懺悔業障的原因是什麼？要去苦、要得樂。為什麼有苦？你造了惡業。現在你懂得了，哦，原來這樣，那麼你怎麼辦呢？欸，要造善業。但是業因你了解嗎？不了解。所以我們到現在為止了解我們在愚癡、無明當中，對於這個業感緣起，只有佛才徹底了解，所以只有他制的戒法，才是完整的。所以你一心恭敬、一心照著去做的話，這個完全正見。這個正見是真正什麼？無明的對治，就像光一樣，點一點哪，黑暗就去掉了；像熱一樣，一來，就寒就消掉了。懂嗎？"]]},{"t":"63A 29:10","b":[["s","所以這個每一個地方有它特別的意義哦！是為什麼我們剛開始的時候，頭上五年是不可離依止。不是單單依了五年就行了，如果說你依止了五年，開、遮、持、犯不行，那盡壽依止，為什麼？因為唯有這個是光明的，既然你要學這光明的法的話，你離開了這個，請問你怎麼辦？你了解了沒問題，你不了解一定要依止。所以這地方叫「戒日」，這個不但有熱而且有光，光熱同炙，惡習統統盡。"]]},{"t":"63A 29:52","b":[["q","如黑暗中燃燈光，能遣黑闇罄無餘，千生增長諸惡闇，以念誦燈能速除。」"]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/008.mp3"},{"文":"如黑暗中燃燈光，能遣黑闇罄無餘，千生增長諸惡闇，以念誦燈能速除。」","口譯":"如同在黑暗中點燃燈光，能把黑暗驅除得一點不剩；千生以來增長的種種罪惡黑暗，用念誦之燈能迅速除去。」","四家合註":"<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">又云：「復次，譬<\/span>如黑暗中燃燈光，能遣黑闇罄無餘，千生增長諸惡闇，以念誦燈能速除。」<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">數數宣說此等定需戒律，於之引生定解，至為切要。<\/span>","覺燈日光":null,"時":"63B 00:02","頁":145,"af":"63b","st":2,"et":53,"消文":[{"文":"增長一千年，一下就消失；我們是無量劫來的，短短就能除，這個大便宜任何生意都找不到。"},{"類":"下手","文":"要這樣自慶自幸，打這個硬仗越打越起勁；打仗辛苦，但戰利品不得了。"}],"延伸":[],"逐字稿":[{"t":"63B 00:02","b":[["q","如黑暗中燃燈光，能遣黑闇罄無餘，千生增長諸惡闇，以念誦燈能速除。」"],["s","增長一千年，一下就消失掉。現在不是一千年喔，我們是無量劫來，我們就能夠短短的，哎呀，這個大便宜實在是沒有啊！所以反過來說，這個比生意的這個賺錢的，那實在是在任何情況之下找不到啊！我是感覺得越想越高興，那世間人這麼辛辛苦苦賺一點點，我稍微努力點賺不曉得多多少少啊！諸位，要這樣地去自慶自幸啊！到那個時候你會打這個硬仗，越打越起勁。打起仗來當然辛苦嘛，嘿，但是這個戰利品是不得了！"]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/009.mp3"},{"文":"此復乃至«見淨罪相»，應當念誦。","口譯":"而且要一直念誦，直到見到罪業清淨的徵相為止。","四家合註":"此復乃至見淨罪相應當念誦。","覺燈日光":null,"時":"63B 00:53","頁":145,"af":"63b","st":53,"et":87,"消文":[{"文":"真正淨除，要得淨罪相；究竟積了多少不知道，在還沒懺乾淨之前一直要努力。"}],"延伸":[{"題":"見淨罪相","組":[{"題":"淨罪如還清債據","說":[{"類":"喻","文":"欠人家多少債不知道，就一直還；還到某人說現在還清了，把債據交還給你，問題解決了。"}]},{"題":"見相不執繼續努力","說":[{"類":"立","文":"淨相不是偶然一趟好夢，糊裡糊塗的夢不算；夢的時間、境相、內容都有相關。"},{"類":"下手","文":"生起這個現象不要執著，歡喜只鼓勵我們繼續努力；說我好了停在那裡，無始積習一不小心又來了。"}]},{"題":"持戒要三業並增","說":[{"類":"回扣","文":"念誦有兩樣很重要：「戒風吹燃念誦火，大精進燄燒諸惡」，一定要持戒。"},{"類":"立","文":"持戒要三業並增，單單身口現行沒破，不能脫煩惱；淨除煩惱主要靠自淨其意，還要精進的力量。"}]}],"說":[{"類":"喻","文":"欠人家多少債不知道，就一直還；還到某人說現在還清了，把債據交還給你，問題解決了。"},{"類":"立","文":"淨相不是偶然一趟好夢，糊裡糊塗的夢不算；夢的時間、境相、內容都有相關。"},{"類":"下手","文":"生起這個現象不要執著，歡喜只鼓勵我們繼續努力；說我好了停在那裡，無始積習一不小心又來了。"},{"類":"回扣","文":"念誦有兩樣很重要：「戒風吹燃念誦火，大精進燄燒諸惡」，一定要持戒。"},{"類":"立","文":"持戒要三業並增，單單身口現行沒破，不能脫煩惱；淨除煩惱主要靠自淨其意，還要精進的力量。"}],"af":"63b","st":53}],"逐字稿":[{"t":"63B 00:53","b":[["q","此復乃至見淨罪相，應當念誦。"],["s","對了！然後你真正要淨除它的時候，要到什麼？要得淨罪相。為什麼要這樣子？因為你究竟積多少，你不知道，換句話說，欠人家多少債你不知道 ─我還哪！還到那個時候，某人說：「欸，現在還清了。好！然後呢這個債據交還給你。」問題解決了，就這樣。那個時候你才不欠，那時你才真是。現在我們懺悔也是這樣，懺悔也是這樣，那在還沒有懺乾淨之前，一直要努力，一直要努力。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/010.mp3"},{"文":"相者，《準提陀羅尼》說：「若於夢中夢吐惡食，飲酪乳等，及吐酪等，見出日月，遊行虛空，見火熾然，及諸水牛，制伏黑人，見苾芻僧苾芻尼僧，見出乳樹象及牛王山獅子座及微妙宮，聽聞說法。」","口譯":"淨罪的徵相，《準提陀羅尼》說：「如果在夢中夢見吐出惡食、飲用酪乳等、以及吐出酪等，見到日月升起，在虛空中遊行，見到火燄熾燃，以及水牛，制伏黑人，見到比丘僧、比丘尼僧，見到出乳汁的樹、大象及牛王、山、獅子座及微妙宮殿，聽聞說法。」","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二、<\/span><span>相者：<\/span>《準提陀羅尼》說：若於夢中夢吐惡食、飲酪乳等及吐酪等<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">二者<\/span>，見<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">現<\/span>出日月、遊行虛空，見<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">身或衣<\/span>火熾然、制伏水牛以及黑人，見比丘僧、比丘尼僧，昇<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">紅白旃檀、龍腦樹、結實蓮莖、<\/span>出乳樹、象及牛王、山、獅子座及微妙宮，聽聞說法。<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">師云：主要當以煩惱轉微，增長信與信解上師三寶正法，心愈趣於正法，是真實相。若以夢等，則有欺誑之虞，貝哈爾王亦有廣大神變。<\/span>","覺燈日光":null,"時":"63B 01:27","頁":145,"af":"63b","st":87,"et":319,"消文":[{"文":"淨罪相就是夢中吐惡食、吐髒東西。"},{"類":"例","文":"有同修修這個法沒多久，夢中吐大便；另一位夢見喝牛奶；有人經常夢中在飛，有人看見特別的宮殿。"},{"類":"例","文":"物以類聚：一開口張三長李四短的人聚在一起；古來祖師一碰見就談生死問題，你真用功一定碰得到這種人。"}],"延伸":[],"逐字稿":[{"t":"63B 01:27","b":[["q","相者，《準提陀羅尼》說："],["s","那個淨罪相，那個經上面告訴我們。"]]},{"t":"63B 01:33","b":[["q","「若於夢中夢吐惡食，飲酪乳等，及吐酪等，見出日月，遊行虛空，見火熾然，及諸水牛，制伏黑人，見苾芻僧苾芻尼僧，見出乳樹象及牛王山獅子座及微妙宮，聽聞說法。」"],["s","就這個。什麼是淨罪相？欸，你夢當中吐惡食、吐髒東西，就這樣。我曾經有一個同修，他就修這個法，修了沒多久，他就告訴我：「哎呀，夢當中吐大便。」「啊，恭喜恭喜。」你們有沒有夢當中吐大便？大便怎麼會吐出來呢？嗯，就這樣。另外一個同修，他覺得喝牛奶，這都是千真萬確的，你們只要真正去做，下面這個。而且這種人絕對不是歷史上的人物，這種人都是眼前，你們如果說好好地去，將來你們會碰得見。這個問題其實很簡單哪！現在我們碰見了人家，一開口就張三長、李四短。對不起，人就是這個樣，這物以類聚，那麼自然專門談那些人跟你在一起。如果你真正修行的話，你一聽這個話你就聽不進，不願意。古來祖師不是這樣的，古來祖師一碰見，大家就談生死問題，「你修行怎麼樣啊？」你現在你只要去 ……喏，現在這個時代還是有這種人，你只要真的用功，你到時一定碰得到，任何的，你親眼會碰見這種人的。"]]},{"t":"63B 03:17","b":[["s","所以下面好幾種現象。我有不同的同學，有的人夢見這個，有的人經常在夢當中總歸在飛，下面就這個樣；有的人看見特別的宮殿，這個是什麼？就是他的淨罪相。然後完了以後，以後你經常會有這種好夢出現，然後這個好夢不是說偶然一趟，偶然一趟不算的。還有這個夢來的時候，這個淨相這我們今天簡單地說一下：這個夢不是糊裡糊塗的夢，糊裡糊塗的夢不算，這個夢的時間、夢的境相，以及夢的內容，都有相關的，這個現在我們不必深談。萬一，如果說 ─不要說萬一，如果說我們真正懺了以後，將來生起這個現象，我們不要執著。歡喜是歡喜的，這是個好現象，這個歡喜只鼓勵我們繼續地努力，不要說：「哎呀，我現在好了。」停在那裡。那對不起，無始以來的積習，一個不小心，它又來了。趁這個機會正好可以努力，這是我們應該了解的。這是第二點念誦，第二點念誦，這個有非常殊勝的功效。"]]},{"t":"63B 04:31","b":[["s","這個念誦當中再說一遍，有兩樣事情很重要！「戒風吹燃念誦火，大精進燄燒諸惡」，你一定要持戒，這第一個。然後呢，這個時候的持戒的話要什麼？要三業並增，不單單是身口，因為你單單身口的話，對不起，你那個現行都沒破，沒有用。我說這個沒有用，注意哦！每次都講到沒有用，這個道理前面已經說過很多遍了，不是說沒有用生天，說沒有用脫煩惱。淨除煩惱這一點，主要的靠自淨其意，然後呢，還要精進的力量，這是第三。第四"]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/011.mp3"},{"文":"依形象者，謂於佛所«獲得信心»，造立形像。","口譯":"四、依形像：就是對佛獲得信心，而造立佛的形像。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第四、<\/span><span>依形象者：<\/span>謂<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">非貪求現世之心，而<\/span>於佛所獲得信心，造立形像。<i class=\"sjlab\" style=\"background:#007f3c;color:#ffffff\">語<\/i><span class=\"sjan sj-yu\">《妙臂請問經》云：「為淨罪惡故，恆於淨僻處，造沙泥佛塔，舍利為心藏。」<\/span>","覺燈日光":null,"時":"63B 05:19","頁":145,"af":"63b","st":319,"et":462,"消文":[{"文":"塑造佛像功德很大，但有一個條件：獲得信心，這兩個字很重要。"}],"延伸":[{"題":"獲得信心","組":[{"題":"房間佛像與大殿","說":[{"類":"例","文":"房間供的佛像掃得乾乾淨淨，跑過大殿不去理它。"},{"類":"破","文":"這個信心是騙自己的，是「我相」在作祟，「我的」。既然信佛，大殿更重要。"}]},{"題":"見袈裟即僧寶想","說":[{"類":"立","文":"真有信心，看見人披了這件衣服，不管內容怎樣，這是十方三世的清淨幢相。"},{"類":"立","文":"這是真實的標準，不是故意提高，讓我們認識自己的條件，好努力向上。"}]},{"題":"拿法照自己","說":[{"類":"下手","文":"一提法馬上校對自己：哎呀，我差得十萬八千里！那時才算有信心。"},{"類":"破","文":"懂得一點法就拿照妖鏡到處照別人，完全錯了，完全世智聰辯。"}]}],"說":[{"類":"例","文":"房間供的佛像掃得乾乾淨淨，跑過大殿不去理它。"},{"類":"破","文":"這個信心是騙自己的，是「我相」在作祟，「我的」。既然信佛，大殿更重要。"},{"類":"立","文":"真有信心，看見人披了這件衣服，不管內容怎樣，這是十方三世的清淨幢相。"},{"類":"立","文":"這是真實的標準，不是故意提高，讓我們認識自己的條件，好努力向上。"},{"類":"下手","文":"一提法馬上校對自己：哎呀，我差得十萬八千里！那時才算有信心。"},{"類":"破","文":"懂得一點法就拿照妖鏡到處照別人，完全錯了，完全世智聰辯。"}],"af":"63b","st":319}],"逐字稿":[{"t":"63B 05:19","b":[["q","依形象者，謂於佛所獲得信心，造立形像。"],["s","就這個。喔唷，這個有很殊勝的功德！所以塑造這個佛像功德很大，但是有一個條件 ─獲得信心，這個信心兩個字很重要喔！我們大家覺得我們有信心，我不敢說你們有沒有，不過我有一個衡量的標準，衡量的標準是什麼呢？你們不妨試試看：說我房間供了一個佛像，供得非常好，掃得乾乾淨淨，跑過大殿，你不去理它，對不起，你這個信心是騙你自己的。你懂不懂這個意思，懂不懂這個意思？你這個時候什麼？是「我相」在作祟，「我的！」所以我的房間弄得乾乾淨淨，這個大殿的。你既然是信佛的話，大殿更重要啊！你看見任何一樣東西，那是這樣。所以前面還記得不記得這個祖師那些公案？所以這個「信心」兩個字我們要體會得到。"]]},{"t":"63B 06:32","b":[["s","如果你真的有信心，對佛是這樣，然後你看見人，他只要這件衣服一被，不管他，他的內容什麼樣，喔，這個僧寶！哪怕他造五逆十惡，那沒關係，那他造的事情，這個形象可是十方三世的清淨幢相。那時候你有信心了，對！不過這種淨信心很高喔！我拿這個做為標準策勵我們，我所以提這樣的話，我們動不動就犯了這個我慢心，自己覺得對了。我現在所以要把那個真正的 ─不是故意提高，這是真實的標準，讓我們認識我們的條件，好讓我們努力向上，這是我們要了解的。「法」，什麼是法？前面剛說過了，你一提，馬上校對自己，「哎呀，我差得十萬八千里！」那個時候才算是有信心。不是說我懂得一點法，然後拿照妖鏡到處照別人，那時你完全錯了，完全錯了，你完全世智聰辯哪！這個是「獲得信心」，到那時候你「造立形象」，對！第四個。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/012.mp3"},{"文":"依供養者，謂於佛所及佛塔廟，供養種種«微妙供養»。","口譯":"五、依供養：就是對佛及佛的塔廟，供養種種微妙的供品。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第五、<\/span><span>依供養者：<\/span>謂於佛所及佛塔廟，供養種種微妙供養。","覺燈日光":null,"時":"63B 07:42","頁":145,"af":"63b","st":462,"et":582,"消文":[{"文":"供養前面講皈依時講過，最容易，任何情況下一口淨水都可以。"},{"文":"佛塔廟是佛藏形象之所，法身、生身都藏在這裡，所以寺院這些地方都是。"}],"延伸":[{"題":"微妙供養","組":[{"題":"掃廁所也是供常住","說":[{"類":"例","文":"掃地不一定跑到大殿，掃廁所也是，這個地方是十方常住。"},{"類":"立","文":"做什麼事做到這一點，就一點都不會偷懶，好努力去做，這就是供養。"}]},{"題":"意樂決定供養大小","說":[{"類":"回扣","文":"微妙供養意念最重要；拿六種意樂去供養，小小的供養產生很大的功德。"},{"類":"回扣","文":"現前供養固然大，不現前功德更大；佛不在，如法供養功德更大。"},{"類":"立","文":"前面基本好好學，到後面馬上現起功效，哪有修不成功的道理？"}]}],"說":[{"類":"例","文":"掃地不一定跑到大殿，掃廁所也是，這個地方是十方常住。"},{"類":"立","文":"做什麼事做到這一點，就一點都不會偷懶，好努力去做，這就是供養。"},{"類":"回扣","文":"微妙供養意念最重要；拿六種意樂去供養，小小的供養產生很大的功德。"},{"類":"回扣","文":"現前供養固然大，不現前功德更大；佛不在，如法供養功德更大。"},{"類":"立","文":"前面基本好好學，到後面馬上現起功效，哪有修不成功的道理？"}],"af":"63b","st":462}],"逐字稿":[{"t":"63B 07:42","b":[["q","依供養者，謂於佛所及佛塔廟，供養種種微妙供養。"],["s","第五個，那是供養，種種的微妙供養，這個前面我們講歸依的時候已經講過了。這一點對我們修行是最容易、最容易，乃至於隨便任何情況之下，一口淨水 ─注意哦！那個「淨」字上一次講過，在任何情況之下，你有任一樣好東西，你那個時候去做。今天我掃一個地，不要是說跑到大殿，我在這地方的掃，我掃廁所，為什麼？這個地方是常住啊！十方常住。不管你做什麼事情，如果你做到這一個地方的話，你就一點都不會偷懶了。哎呀，你好努力去做，這個就是供養，所以說告訴我們佛的塔廟。這個「佛塔廟」是什麼？就是佛藏形象之所，這個法身以及生身都藏在這個地方，所以這個寺院的這些地方，供養種種微妙供養。"]]},{"t":"63B 08:52","b":[["s","那麼這個微妙供養當中，大家還記得吧？這個「意念」最重要，對吧？大家還記得吧？如果你能夠拿六種意樂去供養的話，那你小小的供養，就產生很大的功德。所以前面這個都是最重要的基本，你前面不好好學，到後面這些東西就派不上用場，大家了解嗎？如果你前面學得很好的，到那時候馬上現起功效來，所以哪有修不成功的道理？然後呢我們說佛不在，他前面告訴我們清楚的、非常清楚嘛！現前供養固然大，不現前功德更大啊！現在是不現前，說不是因為佛不在，佛不在你真正地如法供養的功德更大！這個是供養。最後"]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/013.mp3"},{"文":"依名號者，謂聽聞受持諸佛名號，諸大佛子所有名號。","口譯":"六、依名號：就是聽聞、受持諸佛的名號，以及諸大菩薩的名號。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第六、<\/span><span>依名號者：<\/span>謂聽聞、受持諸佛名號、諸大佛子所有名號。","覺燈日光":null,"時":"63B 09:42","頁":145,"af":"63b","st":582,"et":610,"消文":[{"文":"念佛就是這個；念觀世音菩薩、念地藏菩薩，不管哪一個大佛子，就是這個。"}],"延伸":[],"逐字稿":[{"t":"63B 09:42","b":[["q","依名號者，謂聽聞受持諸佛名號，諸大佛子所有名號。"],["s","欸，就是最後一個就是「名號」，現在我們念佛就是這個。然後呢念觀世音菩薩就是這個，念地藏菩薩就是這個，念「嗡嘛呢叭咪吽」就是這個 ─嗡嘛呢叭咪吽應該是念那個咒，前面那個咒。不管是哪一個大佛子，就這個。這個是六個，這個"]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/014.mp3"},{"文":"此等唯是《集學論》中已宣說者，餘尚眾多。","口譯":"以上這些只是《集學論》中已經宣說的，其餘還有很多。","四家合註":"此等唯是《集學論》中正宣說者，餘尚眾多。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">竊謂諸凡緣為罪惡對治而修善根者，一切皆是也。<\/span>","覺燈日光":null,"時":"63B 10:10","頁":145,"af":"63b","st":610,"et":672,"消文":[{"文":"其他還有，這裡舉其綱要。"},{"類":"回扣","文":"初力沒有的話，後面根本沒有；一定要認得現在的現行跟煩惱相應還是雜染相應，一定要得正知見。"}],"延伸":[],"逐字稿":[{"t":"63B 10:10","b":[["q","此等唯是《集學論》中已宣說者，餘尚眾多。"],["s","其他還有，不過呢舉其綱要，在這個裡邊如此，這個是我們要了解的。現在關於這個四力對治當中，今天就把那個初、二兩個力，這個地方說清楚，大家清楚不清楚？那麼最後再說一下，這個初力沒有的話，後面這個根本沒有。所以為了這樣的話，你一定要了解，說我現在的現行是什麼，這個現行跟煩惱相應的，還是跟雜染相應的，你要認得這個，一定要得正知見。所以你到那個時候，你就了解了，為什麼佛法不管說你講什麼，戒定慧任何一樣東西，這個是真正中心、真正根本。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-19/015.mp3"}],"投影片":[{"img":"投影片/shenxin-yeguo-19/001.webp","n":1},{"img":"投影片/shenxin-yeguo-19/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/shenxin-yeguo-19/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/shenxin-yeguo-19/004.webp","n":4},{"img":"投影片/shenxin-yeguo-19/005.webp","n":5},{"img":"投影片/shenxin-yeguo-19/006.webp","n":6},{"img":"投影片/shenxin-yeguo-19/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=63a&st1=0&et1=231","box":[0.133625,0.3091111111111111,0.13775,0.07733333333333334]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-19/008.webp","n":8},{"img":"投影片/shenxin-yeguo-19/009.webp","n":9},{"img":"投影片/shenxin-yeguo-19/010.webp","n":10,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=63a&st1=303&et1=582","box":[0.546125,0.29466666666666663,0.1365,0.06844444444444445]}],"photo":[0.05,0.16666666666666666,0.365625,0.78333333333 見作隨喜的殺生等種種門類的三門業障、各種煩惱障，以及障礙正法的罪障。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第三者、<\/span><span>第三<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">遮止罪惡<\/span><span>力<\/span><span class=\"sjan sj-miao\">，<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">正說此力及其勝利；<\/span><span class=\"sjan sj-miao\">二、<\/span><span class=\"sjan sj-miao\">須當誠心防護。初<\/span><span>者：<\/span>謂<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">從今<\/span>正靜息十種不善，《日藏經》說：由此能摧盡昔所作一切自作、教他、見作隨喜殺生等門三門業障、諸煩惱障及正法障。","覺燈日光":null,"時":"63B 13:27","頁":145,"af":"63b","st":807,"et":904,"消文":[{"文":"遮止就是如法地靜息，不再造以前種種不善。"},{"文":"由此自作、教他、見作隨喜，意業或由意業起的身口，煩惱障、正法障，一切罪障都能摧壞。"}],"延伸":[{"題":"第三力","組":[{"題":"四力彼此分不開","說":[{"類":"回扣","文":"昨天講了初力跟第二力；四力與遮罪、性罪同時懺，再嚴重的罪一下就可以懺乾淨。"},{"類":"立","文":"第一個力量沒有的話，下面的都是空話；四力彼此間真正說起來分不開。"},{"類":"喻","文":"像一部車子，輪子、引擎、車身、架子講的時候分開，開的時候少掉一個輪子、少掉引擎都不行。"}]},{"題":"認得每一力的心理行相","說":[{"類":"立","文":"每一個力的特點在哪裡、與這個力相應時心理狀態如何，就是它的行相。"},{"類":"下手","文":"認得行相，一定要同時認得以前錯誤的行相是什麼、現在對的是什麼，了解了然後淨除。"}]}],"說":[{"類":"回扣","文":"昨天講了初力跟第二力；四力與遮罪、性罪同時懺，再嚴重的罪一下就可以懺乾淨。"},{"類":"立","文":"第一個力量沒有的話，下面的都是空話；四力彼此間真正說起來分不開。"},{"類":"喻","文":"像一部車子，輪子、引擎、車身、架子講的時候分開，開的時候少掉一個輪子、少掉引擎都不行。"},{"類":"立","文":"每一個力的特點在哪裡、與這個力相應時心理狀態如何，就是它的行相。"},{"類":"下手","文":"認得行相，一定要同時認得以前錯誤的行相是什麼、現在對的是什麼，了解了然後淨除。"}],"複習":true,"af":"63b","st":672}],"逐字稿":[{"t":"63B 13:27","b":[["q","第三力者，"],["s","第三是什麼？遮止罪惡的力量。"]]},{"t":"63B 13:34","b":[["q","謂正靜息十種不善。《日藏經》說，由此能摧所作一切自作，教他，見作隨喜，殺生等門，三門業障，諸煩惱障及正法障。"],["s","喏！這個就是遮止，遮止這個一切的罪惡，遮止意思就是現在呢如法地靜息，不再造以前種種不善了。那麼上面說道理，這個原則，下面呢，引那個經上面來證成這件事情。這個經上面告訴我們，你由於這樣能夠遮止的話，所有一切不管自作、教他、見作隨喜，那包括了所有的罪惡，統統都能夠消除，「摧」就是摧毀、摧壞。所有自作、教他是怎麼作的呢？或者單單起的意業，或者由意業而起的身、口；煩惱障、正法障，所有的一切的罪障，徹底都能解決。下面："]]}],"口譯音":"口譯音檔/shenxin-yeguo-20/001.mp3"},{"文":"《毘奈耶廣釋》中說：「若無誠意防護之心，所行悔罪，唯有空言。」《阿笈摩》中是故於此密意問云：「後防護否？」","口譯":"《毘奈耶廣釋》中說：「如果沒有真誠防護（不再犯）的心，所做的悔罪，只是空話。」因此《阿笈摩》中對此以密意問道：「以後能防護嗎？」","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二者：<\/span>《毘奈耶廣釋》中說，若無誠意防護之心，所行悔罪，唯有空言，《阿笈摩》中是故於此密意問云：「後防護否？」","覺燈日光":null,"時":"63B 15:04","頁":146,"af":"63b","st":904,"et":1031,"消文":[{"文":"遮止一定還要誠意防護以後不再犯；遮止了後面還再犯，那你遮止了嗎？"},{"文":"《阿笈摩》就是《阿含》；懺悔時問「你見罪嗎？後防護否？」一定回答「能見」。"},{"文":"見到罪過就是具足正知見，了解錯跟對；現行破壞、已造對治，策勵自己不可再造，這叫防護。"}],"延伸":[],"逐字稿":[{"t":"63B 15:04","b":[["q","《毘奈耶廣釋》中說：「若無誠意防護之心，所行悔罪，唯有空言。」《阿笈摩》中是故於此密意問云：「後防護否？」"],["s","那麼這個一點在律藏裡邊、戒經裡邊，再特別說明，遮止了這個東西一定還需要什麼？誠意防治以後不要再犯。如果說沒有這一點的話，那麼你所謂的懺悔，所謂的遮止都是空話。既然你要遮止，遮止了後面還可以再犯嗎？如果後面再犯，那你遮止了嗎？所以我們要了解這一點。因為這樣的關係，所以這《阿笈摩》，《阿笈摩》就是通常我們說就是《阿含》，實際上就是最基本的教典當中，基本的教典當中，這也是戒經裡面。「密意問云」 ─實際上我們懺悔的時候的確有，「你啊見罪嗎？你後面曉得防護嗎？」他一定回答說：「能見。」那很重要！你必定要見到你的罪過。見到罪過，換句話說，一定具足什麼？一定具足正知見，你如法地了解這個錯，這個對，然後呢也了解這個道理。那個時候你曉得它的不好，也現行破壞，已造的對治，然後呢千萬自己策勵自己不可以再造，這個叫作防護。所以假如說你這個心沒有的話，你所謂的懺悔，懺些什麼？所以這一點下面說："]]}],"口譯音":"口譯音檔/shenxin-yeguo-20/002.mp3"},{"文":"故防護心後不更作，至為切要。","口譯":"所以以防護之心，以後不再造作，是最為切要的。","四家合註":"故防護心，後不更作，至為切要。","覺燈日光":null,"時":"63B 17:11","頁":146,"af":"63b","st":1031,"et":1041,"消文":[{"文":"這一點非常重要。"}],"延伸":[],"逐字稿":[{"t":"63B 17:11","b":[["q","故防護心後不更作，至為切要。"],["s","這一點非常重要，非常重要！而所以能這樣的話，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-20/003.mp3"},{"文":"能生此心，復賴初力。","口譯":"要能生起這種（防護）心，又要依賴第一力。","四家合註":"能生此心，<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">先時若有如毒入腹之悔心，今後不復更作之心自然即至，而此<\/span>復賴初力<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">破壞力<\/span>。<span class=\"sjan sj-ba\">是故懺罪不容或缺翻悔前過及於後防護二心，此為大小二乘一切所共，此復即是初力及第三力二者，故當殷重為之。<\/span>","覺燈日光":null,"時":"63B 17:21","頁":146,"af":"63b","st":1041,"et":1074,"消文":[{"文":"眼前當下一念叫破壞現行，以後的破壞叫防治；同樣一件事情，只是時間上的差別，這個概念必須弄清楚。"}],"延伸":[],"逐字稿":[{"t":"63B 17:21","b":[["q","能生此心，復賴初力。"],["s","那一定還要靠現在。所以你現在的現行能夠破壞，眼前當下一念是叫破壞現行，以後破壞叫什麼？防治嘛！同樣的一件事情，只是時間上頭，時間上頭的差別而已。這個概念大家弄得很清楚，必須要弄清楚。第四呢，依止力，"]]}],"口譯音":"口譯音檔/shenxin-yeguo-20/004.mp3"},{"文":"第四力者，謂修«歸依»及菩提心。","口譯":"第四力（依止力），是修習歸依和菩提心。","四家合註":"<span>第四力<\/span><span class=\"sjan sj-miao\">，<\/span><i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">分二：<\/span><span class=\"sjan sj-miao\">一、<\/span><span class=\"sjan sj-miao\">正說；<\/span><span class=\"sjan sj-miao\">二<\/span><span class=\"sjan sj-miao\">、<\/span><span class=\"sjan sj-miao\">四力完具罪惡對治之理。初<\/span><span>者：<\/span>謂修皈依及菩提心。","覺燈日光":null,"時":"63B 17:54","頁":null,"af":"63b","st":1074,"et":1445,"消文":[{"文":"非常簡單兩句話，整個佛法的內涵完完全全在這兩句話當中。"},{"類":"回扣","文":"前面沒聽沒懂的趕快回頭了解；對皈依的概念不認識，修學佛法都只是一點善根而已。"}],"延伸":[{"題":"歸依","組":[{"題":"心依靠塵境即無明","說":[{"類":"喻","文":"身體坐在椅子上，椅子在地板上，地板在大地上，這是依靠。"},{"類":"立","文":"心依靠什麼？眼睛看見跟著跑，耳朵聽見跟著跑，閉眼塞耳就緣著法塵胡思亂想，這個依靠就叫無明。"},{"類":"立","文":"跟著塵境轉，身也跟著轉，造業感苦報。"}]},{"題":"唯一皈依之處","說":[{"類":"立","文":"要找的對象：自己能徹底解決、懂得怎麼幫你、有大慈悲，還有願力；條件不具足求他沒用。"},{"類":"立","文":"我們知見不正、一點力量都沒有，所以一心皈投依靠三寶：正覺、正遍知、大慈悲、大威神力的佛。"},{"類":"立","文":"懺悔必然的結果：感受到苦，找到苦因，從根拔起，絕對不再犯；以前依無明，現在依三寶。"}]},{"題":"皈依圓滿在菩提心","說":[{"類":"立","文":"正皈依的是法寶；因位皈依一步步上去，完全如法相應，所感的果就是成佛。"},{"類":"立","文":"三乘差別在菩提心；從皈依更深一層、圓滿的皈依境，就是發大菩提心。"}]}],"說":[{"類":"喻","文":"身體坐在椅子上，椅子在地板上，地板在大地上，這是依靠。"},{"類":"立","文":"心依靠什麼？眼睛看見跟著跑，耳朵聽見跟著跑，閉眼塞耳就緣著法塵胡思亂想，這個依靠就叫無明。"},{"類":"立","文":"跟著塵境轉，身也跟著轉，造業感苦報。"},{"類":"立","文":"要找的對象：自己能徹底解決、懂得怎麼幫你、有大慈悲，還有願力；條件不具足求他沒用。"},{"類":"立","文":"我們知見不正、一點力量都沒有，所以一心皈投依靠三寶：正覺、正遍知、大慈悲、大威神力的佛。"},{"類":"立","文":"懺悔必然的結果：感受到苦，找到苦因，從根拔起，絕對不再犯；以前依無明，現在依三寶。"},{"類":"立","文":"正皈依的是法寶；因位皈依一步步上去，完全如法相應，所感的果就是成佛。"},{"類":"立","文":"三乘差別在菩提心；從皈依更深一層、圓滿的皈依境，就是發大菩提心。"}],"af":"63b","st":1118}],"逐字稿":[{"t":"63B 17:54","b":[["q","第四力者，謂修歸依及菩提心。"],["s","這個話，非常簡單的兩句話，實際上這個整個佛法的內涵，就在這兩句話當中，整個佛法的內涵，完完全全在這個兩句話當中。所以如果說你前面沒有聽，或者沒有懂的話，趕快回過頭去好好地來了解一下。如果說對於這皈依的概念根本不認識的話，那個所謂修學佛法的話，那都只是一點善根而已，善根而已。"]]},{"t":"63B 18:38","b":[["s","這個地方我們不妨重新再提一下：所謂依止，我們現在這裡就是說皈依，皈投依靠。那「依靠」本身呢就是平常我們的，我們身體所依靠的，坐在椅子上面，而椅子擺在地板上面，地板擺在大地上面，這是依靠著這個。我們心依靠什麼？大家想想看我們心依靠什麼？我們想了半天，不曉得依靠什麼。然後你眼睛看見哪，跟著東西跑掉了；耳朵聽見哪，跟著東西跑掉了；結果你閉上眼睛、塞著耳朵，腦筋裡胡思亂想，緣著這個法塵而去了！這個就是我們所依靠的呀，這個叫作無明，所以叫作無明哪！"]]},{"t":"63B 19:36","b":[["s","然後呢一天到晚跟著這個塵境而轉，因為你這樣，所以你身也跟著它頭頭直轉。這個因就造了業，感得苦報。因為現在你感受到那個眼前苦報的痛苦，所以要想找脫苦之道，然後在這個裡邊，透過我們如理理智觀察抉擇，最後找到我們要想脫苦，必須要找到什麼樣的對象呢？他一定要自己能解決，否則的話，他自己都不能解決，他能幫忙你嗎？第一個。第二呢，他不但是已經脫了苦，而且了解怎麼幫忙你。所以他自己能徹底圓滿解決一切，而且懂得幫忙你，幫忙任何一個人，解決任何問題。這兩個條件不具足，你求他也沒有用。還要呢，不但如此，他雖然有了這個條件，你求他，他說：「對不起，今天我要度一個假，今天我可沒有空，今天我不想做。」你也沒辦法他，他還要一個大慈悲。然後呢還要第四個條件，這個前面說得很清楚，我們這裡再回憶一下。所以，這個是真實皈依的必然理由。"]]},{"t":"63B 21:23","b":[["s","既然你現在了解了，知道了苦，去懺悔，必然會產生的一個什麼的結果？說這個痛苦是不得了啊！因為你感受到了痛苦，所以你進一步找到痛苦的原因，於是你從根拔起，所以在這種情況你呀絕對不會再犯。那麼犯的因在哪裡？這個是這個因，以前依無明，現在你必定會一心皈投依靠。依靠什麼？三寶，喏，就這個。那麼為什麼要依靠三寶呢？曉得我們在無明當中，第一個我們是知見不正，一無所知，第二個我們一點力量都沒有。所以一定要在這種狀態當中，才要找到一個在知見上面，徹底完整的正覺者；然後呢在行持上面，是徹底圓滿的一切智智，正遍知者；然後他在心情上面，是徹底圓滿是大慈悲者；所有這些事情，他的願力是已經究竟圓滿的，是具有大威神力者 ─佛呀！那麼因為這樣的關係，你就是說世間的一切六道當中，找到這是我們唯一皈依之處，這普通一般的皈依。"]]},{"t":"63B 23:06","b":[["s","然後你真實皈依了，進一步而去努力的時候發現，你要正皈依的這個三寶當中，正皈依的什麼？法寶，在這個地方。所以這一步一步有它的特質在，這是因位皈依。如果說你能夠如此上去，到最後走到你完全如法相應的話，那個就是皈依所感的果。皈依所感的果是什麼？你就是佛，就這樣，你就是佛。那麼雖然說佛法，佛法確實有它的三乘的差別，三乘的差別在哪裡？菩提心。所以從皈依上面更深一層的，圓滿的皈依的境，這個是什麼？發的大菩提心。就這個，所以要具足這個。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-20/005.mp3"},{"文":"此中總之，勝者為初發業，雖說種種淨惡之門，然具四力，即是«圓滿一切對治»。","口譯":"總而言之，勝者（佛）為初發業的人，雖然宣說了種種淨除罪惡的法門，但只要具足四力，就是圓滿了一切對治。","四家合註":"<i class=\"sjlab\" style=\"background:#00639e;color:#ffffff\">妙<\/i><span class=\"sjan sj-miao\">第二者：<\/span>此中總之，勝者為初發業雖說種種淨惡之門，然圓滿對治者，謂具四力也。<i class=\"sjlab\" style=\"background:#950d43;color:#ffffff\">巴<\/i><span class=\"sjan sj-ba\">密咒之中有將果位轉為道用之甚深特法，謂修金剛薩埵等本尊身、面、手之形相，及修所淨罪惡為煙汁炭汁等相，亦修能淨佛意無二智為甘露水流等相而洗滌等，除是些許之外，體性皆不出完具四力對治。<\/span>","覺燈日光":null,"時":"63B 24:05","頁":146,"af":"63b","st":1445,"et":1688,"消文":[{"文":"勝者是佛陀，初發業是初修的人，佛說了很多淨除罪障的道理。"},{"類":"回扣","文":"天台、賢首各有懺罪的順逆十法：先找造業的原因，懺悔也從原因上；這裡講四法，開合不同，究竟圓滿的內涵一點無差。"}],"延伸":[{"題":"圓滿一切對治","組":[{"題":"認清病相才能淨除","說":[{"類":"回扣","文":"以前講依止六想，第一個說自己是病人，當時只是信得過，怎麼病法糊裡糊塗。"},{"類":"立","文":"現在漸漸了解：原來這種心理行相就是；後面共中士、共上士越了解越清楚，淨罪越徹底，積聚功德亦復如是。"},{"類":"下手","文":"了解意趣和心理行相，認得以後去懺悔，力量大得不得了，當下認識，當下見功效。"},{"類":"下手","文":"今天下午每個人仔細好好地看一遍懺法；它的次序跟書本不太一樣，晚上會詳細說明原因。"}]}],"說":[{"類":"回扣","文":"以前講依止六想，第一個說自己是病人，當時只是信得過，怎麼病法糊裡糊塗。"},{"類":"立","文":"現在漸漸了解：原來這種心理行相就是；後面共中士、共上士越了解越清楚，淨罪越徹底，積聚功德亦復如是。"},{"類":"下手","文":"了解意趣和心理行相，認得以後去懺悔，力量大得不得了，當下認識，當下見功效。"},{"類":"下手","文":"今天下午每個人仔細好好地看一遍懺法；它的次序跟書本不太一樣，晚上會詳細說明原因。"}],"af":"63b","st":1566}],"逐字稿":[{"t":"63B 24:05","b":[["q","此中總之，勝者為初發業，雖說種種淨惡之門，然具四力，即是圓滿一切對治。"],["s","現在我們再把它整個地統攝起來，概括地了解一下：說這個「勝者」就是佛陀，佛陀對於剛剛初修的人 「初發業」就是我們初修的人 他說了很多淨除罪障的道理。譬如說天台，天台的懺悔有順逆十法，我寫在黑板上面，賢首也有。為什麼講順逆十法？你為什麼會造的？唔，原因，先找到造業的原因，然後你懺悔的時候，也是從原因上面。由於這個原因，然後呢你產生這樣的結果，所以它同樣的。所以平常天台在這個《小止觀》上面也有，在這個《淨土十要》上面，所以說這個淨土懺上面也有。那麼這個是天台的，賢首也有，它各有所謂懺罪的順逆十法。那麼現在我們這裡講四法，儘管開合的內容是不同，可是它所要達到的究竟圓滿的內涵，確是一點無差，一點無差。這個是把懺悔的這個每一個內容，跟它所指的特別的心理的行相，讓我們認識，從理論上面，讓我們了解了這個實際上的心理狀態。"]]},{"t":"63B 26:06","b":[["s","所以我們不妨把昨天所說的，昨天特別強調說：每一樣東西的心理狀態是什麼。那時候我們可以回憶一下，當你回想這個的時候，一定要把前面那些東西，這個是必然的。告訴我們，那我們以前說改自己的過，認識自己是什麼條件，要依止六想，第一個說自己的病。當時只是信得過說自己的病，究竟怎麼個病法自己也糊裡糊塗，現在漸漸了解了，哦！原來這種心理行相就是。現在已經有個初步的認識了，你要更深切地認識，那麼後面共中士、共上士，越到後來你了解得越清楚。那個時候你能夠修持的方法、內容更深廣，然後呢淨除的罪障，更徹底、更圓滿，積聚功德，亦復如是，亦復如是。"]]},{"t":"63B 27:16","b":[["s","這個因為今天晚上要講，所以你們今天下午每個人仔細好好地看一遍，仔細好好地看一遍。它這個懺法，那個上面所講的次序，跟現在書本上面，它有一點不太一樣的，那麼為什麼原因，到那個時候我會詳細地說明。總之你了解這個意趣，以及這個心理的行相，然後你認得了以後，你這樣情況之下跑得去懺悔的話，那個力量大得不得了！而且非常快速，當下認識，當下見功效，這樣地好法，這樣地好法！現在我們繼續下去。"]]}],"口譯音":"口譯音檔/shenxin-yeguo-20/006.mp3"}],"投影片":[{"img":"投影片/shenxin-yeguo-20/001.webp","n":1},{"img":"投影片/shenxin-yeguo-20/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/shenxin-yeguo-20/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/shenxin-yeguo-20/004.webp","n":4},{"img":"投影片/shenxin-yeguo-20/005.webp","n":5},{"img":"投影片/shenxin-yeguo-20/006.webp","n":6,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=63b&st1=672&et1=807","box":[0.133625,0.3091111111111111,0.13775,0.07733333333333334]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/shenxin-yeguo-20/007.webp","n":7},{"img":"投影片/shenxin-yeguo-20/008.webp","n":8},{"img":"投影片/shenxin-yeguo-20/
