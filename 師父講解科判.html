,"url":"https://lamrim.xyz/player2/?&tch=gl1&af1=69b&st1=937&et1=1252","box":[0.546125,0.29466666666666663,0.1365,0.06844444444444445]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/siwei-kudi-03/031.webp","n":31},{"img":"投影片/siwei-kudi-03/032.webp","n":32},{"img":"投影片/siwei-kudi-03/033.webp","n":33},{"img":"投影片/siwei-kudi-03/034.webp","n":34},{"img":"投影片/siwei-kudi-03/035.webp","n":35},{"img":"投影片/siwei-kudi-03/036.webp","n":36},{"img":"投影片/siwei-kudi-03/037.webp","n":37},{"img":"投影片/siwei-kudi-03/038.webp","n":38,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=69b&st1=1252&et1=1612","box":[0.133625,0.3091111111111111,0.13775,0.07733333333333334]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-03/039.webp","n":39},{"img":"投影片/siwei-kudi-03/040.webp","n":40},{"img":"投影片/siwei-kudi-03/041.webp","n":41},{"img":"投影片/siwei-kudi-03/042.webp","n":44,"yt":"E1qFpq1i0fY"},{"img":"投影片/siwei-kudi-03/043.webp","n":45}],"投影片PDF":"投影片/siwei-kudi-03/slides.pdf","音檔範圍":"69A 26:41～69B 26:52"},"siwei-kudi-04":{"id":"siwei-kudi-04","標題":"思惟苦諦(4)","根":"思惟八苦","科判焦點":"丑一 思惟八苦","課本範圍":"P161 L1 ~ P162 L4","堂數":88,"日期":"2026/11/24","分圖":[{"名":"怨憎會至五取蘊","原文":[0,6]},{"名":"取蘊為根本・厭離大悲","原文":[7,10]},{"名":"無垢聖語・猛利變動","原文":[11,15]}],"跨科判":null,"週":113,"班級":"24秋007","音檔":{"69b":{"local":"音檔/gl1/069B.mp3","remote":"https://lamrim.xyz/player/media/gl1/069B.mp3"},"70a":{"local":"音檔/gl1/070A.mp3","remote":"https://lamrim.xyz/player/media/gl1/070A.mp3"},"70b":{"local":"音檔/gl1/070B.mp3","remote":"https://lamrim.xyz/player/media/gl1/070B.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=69b&st1=1612&af2=70a&af3=70b&et3=705","段":[{"文":"思惟怨憎會苦分五。謂如遇怨敵，便生憂苦。畏其制罰。怖畏惡名，遭非讚頌。畏苦惱死。違正法故，畏懼死後，墮諸惡趣。當思此等。","口譯":"思惟怨憎會苦，分為五種：就是遇到怨敵時，便生起憂苦；畏懼他的制裁懲罰；怖畏惡名，遭受非議而得不到讚頌；畏懼苦惱至死；又因為違背正法，畏懼死後墮落各種惡趣。應當思惟這些。","四家合註":null,"覺燈日光":null,"時":"69B 26:52","頁":161,"af":"69b","st":1612,"et":1768,"消文":[{"文":"世間理想的偏偏不容易找到，不希望的偏偏排遣不開；眼前想想，隨時隨地沒有一樣東西稱我們的心。"},{"文":"遇到怨敵就生憂苦：心裡憂愁，互相傷害身上苦惱；憂苦可分身心，也可總合身心而言。"},{"文":"畏其制罰：怕他傷害你。"},{"文":"怖畏惡名、遭非讚頌：你說我不對、我說你不對，種種誹謗；希望的讚頌得不到，反而受傷害。"},{"文":"畏苦惱死：乃至因此送掉性命；違正法故，還怕死後墮落惡趣。"},{"文":"怨的偏偏碰到，反過來你希望的，偏偏要別離。"}],"延伸":[],"逐字稿":[{"t":"69B 26:52","b":[["q","思惟怨憎會苦分五。"],["s","也分五樣。"]]},{"t":"69B 27:00","b":[["q","謂如遇怨敵，便生憂苦。畏其制罰。怖畏惡名，遭非讚頌。畏苦惱死。違正法故，畏懼死後，墮諸惡趣。當思此等。"],["s","世間理想的事情，偏偏不容易找到。那麼不理想的呢，我們不希望的呢，偏偏排遣不開。怨的冤家，瞋的，你所討厭的，偏偏要讓你碰到。我們眼前想想看，的確隨時隨地沒有一樣東西稱我們心。那麼這個裡邊分五個項目。遇到怨敵，就生憂、苦─心裡面憂愁，然後呢，怨敵互相傷害，身上面苦惱。這憂苦也可以分身心、兩方面，也可以總和身心而言。"]]},{"t":"69B 28:20","b":[["s","那麼又怕他，這總的，怕他傷害你，怕他傷害你，這第二個。由於這樣，同時呢「怖畏惡名」，這個怨家，大家都 ─你說我不對，我說你不對，那麼種種的對我們的誹謗。然後呢，「遭非讚頌」，讚跟頌是我們希望的，在這種情況之下，他偏偏不但得不到，而且傷害你。還有呢，怖畏惱死，不但是眼前實際上的名譽，實質上的傷害，而且乃至於因此而送掉性命。送掉了性命呢，「違正法故」，還要怕死後墮落惡趣，這樣。這個五個方面。怨的呢偏偏碰到，反過來你希望的嘛，偏偏要別離！"]]}],"口譯音":"口譯音檔/siwei-kudi-04/001.mp3"},{"文":"思惟愛別離苦分五。謂若捨離最愛親等，由此令心發生憂慼。語生愁歎。身生擾惱。念彼功德，思戀因緣令意熱惱。應受用等有所缺乏。當思此等。","口譯":"思惟愛別離苦，分為五種：就是如果與最親愛的人等分離，由此令內心生起憂愁悲慼；言語發出愁歎；身體生起擾惱；想念對方的好處，因思戀而令心意熱惱；應有的受用等也有所缺乏。應當思惟這些。","四家合註":null,"覺燈日光":null,"時":"69B 29:28","頁":161,"af":"69b","st":1768,"et":null,"消文":[{"文":"令心發生憂慼：第一個是心裡憂愁。"},{"文":"語生愁歎：心裡憂慼，開起口來「唉呀，真不曉得什麼是好！」"},{"文":"身生擾惱：師父併在下一句講，沒有另外解。"},{"文":"念彼功德：想起這個恩愛的人種種好處，捨不得，心裡放不下。"},{"文":"應受用等有所缺乏：種種受用也缺乏；這五項都容易懂。"}],"延伸":[],"逐字稿":[{"t":"69B 29:28","b":[["q","思惟愛別離苦分五。謂若捨離最愛親等，由此令心發生憂慼。"],["s","第一個憂愁，心裡邊真是 ……。"]]},{"t":"69B 29:41","b":[["q","語生愁歎。"],["s","心裡面嘛，憂慼；開起口來嘛，唉呀，真不曉得什麼是好！"]]},{"t":"69B 29:50","b":[]},{"t":"70A 00:02","b":[["q","身生擾惱。念彼功德，思戀因緣令意熱惱。"],["s","因為想起來這個恩愛的人有種種好處，捨不得啊！心裡面就放不下。"]]},{"t":"70A 00:15","b":[["q","應受用等有所缺乏。當思此等。"],["s","因此我種種的受用也缺乏，也分五項，這都容易懂。"]]}],"口譯音":"口譯音檔/siwei-kudi-04/002.mp3"},{"文":"思惟所欲求不得苦分五。如愛別離。求不得者，謂務農業秋實不成，及營商賈未獲利等，由於所欲«勵力追求而未得»故，灰心憂苦。","口譯":"思惟所欲求不得苦，分為五種，與愛別離相同。所謂求不得，就是從事農業而秋天收成不好，以及經營商業而沒有獲利等，由於對所希求的事努力追求卻得不到，因此灰心憂苦。","四家合註":null,"覺燈日光":null,"時":"70A 00:27","頁":161,"af":"70a","st":27,"et":121,"消文":[{"文":"第七個是你要求的求不到，就像愛別離一樣。"},{"文":"求不得，就是你所忙的事情：種田人忙了半天收成不好，作生意人得不到利益。"},{"文":"由於所欲勵力追求而未得，灰心憂苦：這個文都容易懂。"}],"延伸":[{"題":"勵力追求而未得","組":[{"題":"把文義擺進生活體會","說":[{"類":"下手","文":"這意義要隨時隨地、多方面，擺在我們現實生活狀態當中去體會。"}]},{"題":"修學路上也求不得","說":[{"類":"例","文":"出家修學佛法也是：想像中一番熱誠，跑到哪裡大失所望。"},{"類":"例","文":"偏偏碰見的不如想像；覺得真正有成就的，偏偏又沒辦法跟著他。"},{"類":"立","文":"不管世間、出世間，在在都是這種現況。"}]}],"說":[{"類":"下手","文":"這意義要隨時隨地、多方面，擺在我們現實生活狀態當中去體會。"},{"類":"例","文":"出家修學佛法也是：想像中一番熱誠，跑到哪裡大失所望。"},{"類":"例","文":"偏偏碰見的不如想像；覺得真正有成就的，偏偏又沒辦法跟著他。"},{"類":"立","文":"不管世間、出世間，在在都是這種現況。"}],"af":"70a","st":54}],"逐字稿":[{"t":"70A 00:27","b":[["q","思惟所欲求不得苦分五。如愛別離。"],["s","這第七個，你要求的呢求不到，就像愛別離一樣，就像愛別離一樣。愛別離是你親愛的，說"]]},{"t":"70A 00:39","b":[["q","求不得者，"],["s","就是你所忙的事情，"]]},{"t":"70A 00:42","b":[["q","謂務農業秋實不成，"],["s","種田人呢忙了半天，收成不好。及營商賈未獲利等，"]]},{"t":"70A 00:51","b":[["s","作生意人呢，得不到利益。"]]},{"t":"70A 00:54","b":[["q","由於所欲勵力追求而未得故，灰心憂苦。"],["s","這個文都容易懂。那麼我們這是把這個所說的意義，隨時隨地多方面，擺在我們現實生活狀態當中去體會。譬如說，乃至於我們出家了，修學佛法了也是，唉呀，想像當中一番熱誠，可是跑到哪裡呀大失所望！那就是什麼？求不得。求不得的另外一面呢，偏偏碰見的，那還不如我們想像。萬一你覺得滿好的話呢，也不一定能夠好 ─覺得現在，喔唷，許多真正有成就的等等，偏偏你又沒辦法跟著他，就是諸如此類。不管是世間、出世間，在在都是這種現況。最後："]]}],"口譯音":"口譯音檔/siwei-kudi-04/003.mp3"},{"文":"思惟宣說五種取蘊總為苦義分五。","口譯":"思惟佛所宣說「五種取蘊總的來說就是苦」的道理，分為五種。","四家合註":null,"覺燈日光":null,"時":"70A 02:01","頁":161,"af":"70a","st":121,"et":157,"消文":[{"文":"平常常說「五陰熾盛」，到底怎麼個熾盛法，這裡說一下。"},{"文":"八苦歸結起來最重要的，就是最後五種取蘊的苦。"},{"文":"修中士道的重點就在這個地方，要好好地學。"}],"延伸":[],"逐字稿":[{"t":"70A 02:01","b":[["q","思惟宣說五種取蘊總為苦義分五。"],["s","平常我們常說「五陰熾盛」、五陰熾盛，到底怎麼個熾盛法呢？那麼這一個地方說一下。實際上呢真正這個思惟這八苦當中，真正最重要的歸結起來，就是這個最後那個五種取蘊當中的這個苦。我們修中士道的重點，重點就在這個地方，現在把這個我們好好地學一下。"]]}],"口譯音":"口譯音檔/siwei-kudi-04/004.mp3"},{"文":"謂是當成眾苦之器，及依已成«眾苦之器»，是苦苦器，是壞苦器，是行苦器。於此諸苦當數思惟。","口譯":"就是說：五取蘊是將成為眾苦的容器；以及依於已經形成的取蘊而成為眾苦的容器；是苦苦的容器；是壞苦的容器；是行苦的容器。對於這些苦應當反覆思惟。","四家合註":null,"覺燈日光":null,"時":"70A 02:37","頁":161,"af":"70a","st":157,"et":442,"消文":[{"文":"五取蘊就是五蘊：色是現在的色身；受、想、行、識是心蘊。"},{"文":"五大類合成身心相續，在五趣中不斷輪轉，所以叫「數取趣」；平常說的「人」，擺在自己身上叫「我」。"},{"文":"當成眾苦之器：將來一旦得到，對未來是一切痛苦的根本；「器」像茶杯裝水，五取蘊是盛苦的。"},{"文":"依已成眾苦之器：已經成就了，一切痛苦依這上面而來，除了苦沒有別的。"},{"文":"苦苦器：本身就是苦苦，在身心上感受的苦。"},{"文":"壞苦器：快樂是壞苦，它壞的時候痛苦得受不了。"},{"文":"行苦器：平常不覺苦樂，但停不住，諸行無常永遠向前推衍，總在苦當中轉；應該數數思惟。"}],"延伸":[{"題":"眾苦之器","組":[{"題":"苦諦從取蘊認識","說":[{"類":"立","文":"真正應該認識的苦諦，特別要從這個地方，這是根本。"}]},{"題":"先把握根本","說":[{"類":"破","文":"學了很多東西，也許很有道理，總在枝末上轉，把握不住根本，越走越遠。"},{"類":"立","文":"修學佛法最重要的，首先要把住根本在什麼地方；要除苦，先認識苦的根本。"},{"類":"例","文":"佛法浩如煙海，下腳第一步的戒又這麼多，各部各派，不曉得從哪裡下手。"},{"類":"下手","文":"找到最主要的根本，從根本把握住，再慢慢接到枝葉，問題才能解決。"}]}],"說":[{"類":"立","文":"真正應該認識的苦諦，特別要從這個地方，這是根本。"},{"類":"破","文":"學了很多東西，也許很有道理，總在枝末上轉，把握不住根本，越走越遠。"},{"類":"立","文":"修學佛法最重要的，首先要把住根本在什麼地方；要除苦，先認識苦的根本。"},{"類":"例","文":"佛法浩如煙海，下腳第一步的戒又這麼多，各部各派，不曉得從哪裡下手。"},{"類":"下手","文":"找到最主要的根本，從根本把握住，再慢慢接到枝葉，問題才能解決。"}],"af":"70a","st":341}],"逐字稿":[{"t":"70A 02:37","b":[["q","謂是當成眾苦之器，及依已成眾苦之器，是苦苦器，是壞苦器，是行苦器。於此諸苦當數思惟。"],["s","這五個取蘊是什麼呢？就是我們所謂的五蘊。「色」，就是我們現在的色身，有色身，形色所成的，然後呢「受、想、行、識」，那是心蘊。「識」，最後那個識是識體，它識的心所法，它識的功效 ─受、想、行三樣東西。那麼總合起來呢，有這個五個大類的東西，合成功一種身心相續，這個身心相續在五趣當中是不斷地輪轉，所以叫「數取趣」，不斷地在這個輪迴當中輾轉，這個東西 ─五蘊、五取蘊，平常我們說的「人」。這個人擺在自己身上那就叫「我」，一切問題無不都從這個上頭出來的，這個是整個的一切問題的根本。現在我們看看，這個東西是什麼？我們平常所要求的一切一切，無非都在忙這個，無非都在忙這個，現在看看這個是什麼？"]]},{"t":"70A 04:13","b":[["s","說這個東西，「當成」，將來還沒有成之前，那所以說將來會得到。當你得到的時候 ─眾苦之器，對於未來來說，是一切痛苦的根本。「器」就是個器皿，譬如說我們這個茶杯裝水的，現在這個五取蘊呢是盛苦的。這個東西將來一旦成就了，幹什麼？喏，就是裝一點苦，沒有別的，它這東西就是這樣。「及依已成眾苦之器」，已經成就了呢，一切的痛苦是依這個上面而來的，這個東西有這樣的不理想，除了苦沒有別的。然後呢本身就是「苦苦器」，它本身就是苦苦，對於苦的東西當然是苦！這個苦，哪裡？就在身心上感受的。那麼還有快樂呢？對不起，快樂是「壞苦器」！它快樂是壞的，它壞的時候，你也痛苦得受不了。還有呢，「行苦器」，平常的是雖然並沒有感受到苦樂，對不起，它停不住的，諸行無常，永遠向前推衍。推衍的結果呢，你總還在這個苦當中轉，對於這個應該數數思惟。"]]},{"t":"70A 05:41","b":[["s","我們真正應該認識的，指的苦諦，特別從這個地方，這是根本。這個各式各樣的因很多，平常我們討論問題這裡要注意喲！就是我們必定要把握住根本何在。平常我們往往學了很多東西，你所看見的也許你很有道理，可是總在枝末上面轉，結果看了半天把握不住這個根本，走遠路，乃至於越走越遠，這是我們需要了解的。同樣地，修學佛法最重要的，你必定首先要把住根本在什麼地方。平常我們真正講的苦，各式各樣的，歸納起來無非要找到：欸，是苦！那麼你要除掉苦，根本在哪裡呢？這個你必定要首先認識它。"]]},{"t":"70A 06:36","b":[["s","同樣地，就是我們修學佛法，現在這個佛法是浩如煙海；不要說佛法浩如煙海，三藏當中我們說，唉呀，我們下腳第一步 ─戒，戒又這麼多。啊！然後這個東一部、西一部，大眾部、上座部、一切有部，乃至於你的的確確不曉得從哪裡下手！是在任何一方面，你要找到它的最主要的根本，從這個地方，那麼然後呢從根本上面把握住了，慢慢接到枝葉。這樣我們才有機會，也唯有這樣才能夠解決，要不然這個問題總歸不能解決。那麼現在我們這裡看下去："]]}],"口譯音":"口譯音檔/siwei-kudi-04/005.mp3"},{"文":"其中初者，謂依受此取蘊，能引來生以後眾苦。第二謂依已成之蘊，為老病等之所依止。","口譯":"其中第一個，是說依著受取這個取蘊，能引生來生以後的眾苦。第二個，是說依著已經形成的取蘊，成為老、病等苦的依止處。","四家合註":null,"覺燈日光":null,"時":"70A 07:22","頁":161,"af":"70a","st":442,"et":508,"消文":[{"文":"當成：一受了取蘊，造種種業，將來一切的苦都是現在造、引來以後的；以後現起又再引發以後，永遠增長。"},{"文":"已成：生、老、病、死、愛別離、怨憎會、求不得，都從這上面來，根本就在這裡。"}],"延伸":[],"逐字稿":[{"t":"70A 07:22","b":[["q","其中初者，"],["s","這第一個。"]]},{"t":"70A 07:24","b":[["q","謂依受此取蘊，能引來生以後眾苦。第二謂依已成之蘊，"],["s","這只是當成的，一受了這個取蘊以後，受了這個取蘊，就因為 ……譬如說我們現在有了這個五蘊以後，我們造種種的業，將來一切的以後的苦都是現在造，然後呢引來以後的，引來以後的。然後同時對現在來說呢，一切的苦也依於現在，所以它現在固然是苦，同樣也引發以後。當你引發以後，以後這個現起的時候，它又再引發以後，永遠這樣地增長。現在的苦是什麼？"]]},{"t":"70A 08:15","b":[["q","為老病等之所依止。"],["s","前面說的生、老、病、死，然後呢愛別離、怨憎會、求不得，都從這個上面，所以它那個根本就在這裡。"]]}],"口譯音":"口譯音檔/siwei-kudi-04/006.mp3"},{"文":"第三第四，謂彼二苦粗重隨逐能生彼二。","口譯":"第三、第四，是說這兩種苦（苦苦、壞苦）的粗重隨逐於取蘊，能生出這兩種苦。","四家合註":null,"覺燈日光":null,"時":"70A 08:28","頁":161,"af":"70a","st":508,"et":573,"消文":[{"文":"第三、第四就是苦苦跟壞苦。"},{"文":"當成、已成的五取蘊上「粗重隨逐」：身心是煩惱雜染所感得，異熟、等流、增上輾轉相應，在「種、現」輾轉流轉，這叫粗重。"},{"文":"由於這樣輾轉引生，無非是苦苦、壞苦。"}],"延伸":[],"逐字稿":[{"t":"70A 08:28","b":[["q","第三第四，謂彼二苦粗重隨逐能生彼二。"],["s","那麼第三、第四呢，就是苦苦跟壞苦，這個兩樣東西是為什麼呀？因為由於這個當成的五取蘊，以及已成的五取蘊，這個兩個上頭「粗重隨逐」。就是這個我們的身心，是煩惱雜染所感得的，這個煩惱雜染所感得的內容，無非是異熟、等流、增上輾轉相應，一直在這個「種、現」輾轉地流轉當中，所以這個叫「粗重」，一直不斷地在這個上面。由於這個輾轉地引生，所以無非是苦苦、壞苦。那麼最後一個行苦呢，"]]}],"口譯音":"口譯音檔/siwei-kudi-04/007.mp3"},{"文":"第五謂初成取蘊，即便生為行苦自性，以一切行為宿惑業他自在轉，是行苦故。於三苦時«此當詳說»。","口譯":"第五，是說取蘊一形成，就生為行苦的自性，因為一切諸行都受往昔的惑業所支配而轉，所以是行苦。這在講三苦時將會詳細說明。","四家合註":null,"覺燈日光":null,"時":"70A 09:33","頁":161,"af":"70a","st":573,"et":916,"消文":[{"文":"一開始就一直在行當中；行蘊從無始以來沒有停過，這真是問題的中心。"},{"文":"現在的一切諸行，是往昔無明所造雜染之業所感得，必定按照惑業的行相來轉，你一點辦法都沒有，這是行苦。"},{"文":"苦苦、壞苦、行苦，下面會詳細告訴我們。"}],"延伸":[{"題":"此當詳說","組":[{"題":"取蘊是生死根本怨家","說":[{"類":"因","文":"為什麼下面還要詳細說？因為這是最主要的根本。"},{"類":"立","文":"認得取蘊的特質，才會產生大厭離；這才是生死根本怨家，一無是處。"},{"類":"立","文":"唯一好處是湊著它能修行；所以只求塞飽肚子去討飯，樹下一宿就得。"}]},{"題":"不識根本，講究衣食","說":[{"類":"破","文":"我們不認識，一天到晚講究這個東西，一切煩惱由此而生。"},{"類":"例","文":"在家人忙的兩大主題：生命的保持、生命的延續。"},{"類":"破","文":"出了家照理要解脫這個，卻還忙著它，嘴巴一到，問題都來了。"}]},{"題":"拔除根本，諸苦俱除","說":[{"類":"立","文":"前面講那麼多苦，是策勵你感受到絕大的不如意，追根究底找到根本。"},{"類":"立","文":"前面的苦都由五取蘊產生；五取蘊連根拔除了，上面的都沒有了。"}]},{"題":"精力集中於根本","說":[{"類":"破","文":"有人說「最好我去修行」，修些什麼他也不知道，修了半天是空忙。"},{"類":"破","文":"另一種要懂道理，文字上越扯越遠，扯不清。"},{"類":"下手","文":"把有限的精力集中在這裡，中堅問題解決了，下面自然跟著解決。"}]}],"說":[{"類":"因","文":"為什麼下面還要詳細說？因為這是最主要的根本。"},{"類":"立","文":"認得取蘊的特質，才會產生大厭離；這才是生死根本怨家，一無是處。"},{"類":"立","文":"唯一好處是湊著它能修行；所以只求塞飽肚子去討飯，樹下一宿就得。"},{"類":"破","文":"我們不認識，一天到晚講究這個東西，一切煩惱由此而生。"},{"類":"例","文":"在家人忙的兩大主題：生命的保持、生命的延續。"},{"類":"破","文":"出了家照理要解脫這個，卻還忙著它，嘴巴一到，問題都來了。"},{"類":"立","文":"前面講那麼多苦，是策勵你感受到絕大的不如意，追根究底找到根本。"},{"類":"立","文":"前面的苦都由五取蘊產生；五取蘊連根拔除了，上面的都沒有了。"},{"類":"破","文":"有人說「最好我去修行」，修些什麼他也不知道，修了半天是空忙。"},{"類":"破","文":"另一種要懂道理，文字上越扯越遠，扯不清。"},{"類":"下手","文":"把有限的精力集中在這裡，中堅問題解決了，下面自然跟著解決。"}],"af":"70a","st":653}],"逐字稿":[{"t":"70A 09:33","b":[["q","第五謂初成取蘊，即便生為行苦自性，"],["s","一開始那就一直在行當中，實際上所以說一開始的時候，就是在我們感受得到的這個情況之下。那以前有沒有？有，只是我們感受不到的。實際上這個行蘊，從無始以來，一直從來沒有停過地一直在進行當中，這個真是問題的中心。"]]},{"t":"70A 10:06","b":[["q","以一切行為宿惑業他自在轉，是行苦故。"],["s","因為我們現在的一切諸行是什麼？以前往昔的無明，由無明所造的種種雜染之業所感得的，所以必定還是按照這個惑業的行相來轉，一切都是惑業來決定的，你一點辦法都沒有，一點辦法都沒有。所以必然之間，會隨著這個因行而向前流轉，這個是行苦。那麼關於這個，"]]},{"t":"70A 10:53","b":[["q","於三苦時此當詳說。"],["s","苦苦、壞苦、行苦，這個下面會詳細告訴我們。為什麼他下面還要詳細告訴我們呢？因為這個是根本，最主要的根本。你認得了這個取蘊的特質以後，那個時候你才會產生大厭離，要不然我們一天到晚就忙什麼？忙這個東西。實際上呢這個才是我們的生死根本怨家，生死根本怨家！所以佛一再告訴我們，這個東西是一無是處，一無是處啊！這唯一的好處是什麼？湊現在這個東西能夠修行。因為這樣的關係，所以你為了修行，你還逼不得已地要吃的、要住的。那吃怎麼辦？去討飯，討到什麼只要塞飽肚子就行；住呢，唉呀，你哪裡都可以，樹下一宿就得。現在我們呢遠不止此，因為我們不認識，所以一天到晚就講究這個東西，一天到晚講究這個。因為講究這個呢，一切的煩惱是由此而生，一切煩惱由此而生！"]]},{"t":"70A 12:12","b":[["s","實際上我們也可以感受得到，在家人忙些什麼？說到最究竟的，這個是兩大主題之一，兩大主題之一：一個是生命的保持，一個是生命的延續。生命的保持就是為這張嘴巴，就是這樣。然後呢我們出了家以後，照理說要解脫這個東西，實際上呢因為這個根本問題沒有認識，所以一天到晚是還忙著它。那個嘴巴是啊，那真是，說起來，不管你怎麼說得頭頭是道，一跑到那地方問題都來了，問題都來了，還有種種的藉口。這個原因為什麼？就是我們對這個基本的概念不認識。"]]},{"t":"70A 13:07","b":[["s","前面儘管講很多苦，是的，可是他找不到根本。現在這個地方，把那個根本找出來了以後，到那個時候，你把這個根本問題解決了。當這個根本問題解決了，前面所有的苦，都是由於五取蘊而產生的，當那個五取蘊的問題解決了，連根拔除了，上面的都沒有了。所以要說前面那些問題的，為什麼？就是策勵你對現在的這種狀態，感受到絕大的不如意，然後呢那個時候你努力地，去要找解決這個問題。要去找解決，然後呢你追根究底找到根本，於是就拔除了。"]]},{"t":"70A 13:53","b":[["s","這個概念為什麼一再強調？為什麼佛在前面的時候告訴我們？這是我們現在處處地方，為什麼必須要知道？說你要講修行，是的，那麼你從哪裡修行起？如果你不了解這個，你修了半天，那不是空忙嗎？因為你摸到的只是邊邊的一部分，說要修行、要修行，有很多人就是這樣：唉呀，最好我去修行，你忙這個幹什麼！你為什麼要修，修些什麼啊？他也不知道！那既然不知道你怎麼修？另外一種呢，說那我要懂道理的，忙了半天越走越遠，文字上面越扯越不曉得扯不清去了。所以在這個地方再強調一下，強調一下，你必須要把握住這一些問題，把我們有限的精力集中在這個地方！然後你把那個中堅問題解決了，好！下面自然就跟著也都解決。"]]},{"t":"70A 15:03","b":[["s","下面再說，說現在我們了解了，原來這個問題在這裡。反過來，假定你對這個問題不了解，那什麼現象呢？"]]}],"口譯音":"口譯音檔/siwei-kudi-04/008.mp3"},{"文":"若於生死取蘊自性，未能發起真實厭離，則其真實«求解脫心»，無發生處。","口譯":"如果對於生死取蘊的自性，不能生起真實的厭離，那麼真實的求解脫心，就無從發生。","四家合註":null,"覺燈日光":null,"時":"70A 15:16","頁":161,"af":"70a","st":916,"et":1327,"消文":[{"文":"不認識五取蘊本質是苦，還覺得這是我，快樂得很，要營養、要舒服，一切問題都來了，哪可能發生真實厭離。"},{"文":"解脫就是從縛著當中解開；縛著是惑跟業，綁著的就是五取蘊。"},{"文":"要在五取蘊上產生絕大的厭惡、求解脫的心，才進一步去找它為什麼被綁，這是修行佛法的根本。"}],"延伸":[{"題":"求解脫心","組":[{"題":"無的放矢","說":[{"類":"立","文":"不能發起真實厭離心，求解脫的心從哪裡發生？"},{"類":"立","文":"要解脫，才會求方便、修道，覺得持戒是必須的；念佛、參禪、學教都在這基礎上。"},{"類":"喻","文":"靶在哪裡不知道，拿槍朝天亂放；我們亂放打死很多人，還要賠命。"}]},{"題":"先問為何修行","說":[{"類":"下手","文":"不必忙著去修行，先忙「我為什麼要修行」；再找配胃口、適根性的方法，全部精神投入。"},{"類":"例","文":"曉得只有念佛，就牢牢抱著一句佛號，天塌下來是人家的事。"}]},{"題":"乘急戒緩之真意","說":[{"類":"立","文":"古人說「乘急」，是從根本急起：全部精神解決根本問題，所以也可以解脫。"},{"類":"破","文":"現在講乘急戒緩，乘急不急，戒又緩掉，不墮落到哪裡去。"},{"類":"立","文":"戒教你急，也是告訴你這是生死根本，不可以做，要在這裡擋住。"}]},{"題":"因地把握根本","說":[{"類":"例","文":"一位同修說：真正弄戒律要到羅漢，那時才能客觀見到問題。"},{"類":"立","文":"做不到不怕，因地上把握住根本，從這裡下去，問題一定解決。"},{"類":"破","文":"否則在戒行、戒相上這個、那個弄了半天，越走越遠。"},{"類":"回扣","文":"對生死取蘊自性不真實了解，求解脫心無發生處；出家不只為作羅漢。"}]}],"說":[{"類":"立","文":"不能發起真實厭離心，求解脫的心從哪裡發生？"},{"類":"立","文":"要解脫，才會求方便、修道，覺得持戒是必須的；念佛、參禪、學教都在這基礎上。"},{"類":"喻","文":"靶在哪裡不知道，拿槍朝天亂放；我們亂放打死很多人，還要賠命。"},{"類":"下手","文":"不必忙著去修行，先忙「我為什麼要修行」；再找配胃口、適根性的方法，全部精神投入。"},{"類":"例","文":"曉得只有念佛，就牢牢抱著一句佛號，天塌下來是人家的事。"},{"類":"立","文":"古人說「乘急」，是從根本急起：全部精神解決根本問題，所以也可以解脫。"},{"類":"破","文":"現在講乘急戒緩，乘急不急，戒又緩掉，不墮落到哪裡去。"},{"類":"立","文":"戒教你急，也是告訴你這是生死根本，不可以做，要在這裡擋住。"},{"類":"例","文":"一位同修說：真正弄戒律要到羅漢，那時才能客觀見到問題。"},{"類":"立","文":"做不到不怕，因地上把握住根本，從這裡下去，問題一定解決。"},{"類":"破","文":"否則在戒行、戒相上這個、那個弄了半天，越走越遠。"},{"類":"回扣","文":"對生死取蘊自性不真實了解，求解脫心無發生處；出家不只為作羅漢。"}],"af":"70a","st":998}],"逐字稿":[{"t":"70A 15:16","b":[["q","若於生死取蘊自性，未能發起真實厭離，則其真實求解脫心，無發生處。"],["s","假定關於這個問題，換句話說，五取蘊的本質是什麼東西，你根本不認識。因為它本質是苦的，你不認識是苦，既然不認識苦的話，我們還直覺得這是我，快樂得很啊！要營養，要長得胖胖，要長得肥肥，然後呢要求它舒服，在這種情況之下一切問題都來了，當然，哪可能發生真實厭離！現在前面已經了解了，所謂解脫是什麼？就是從縛著當中解開來。什麼是縛著？惑跟業。這個惑跟業綁著什麼？就是綁著我們這個五取蘊。所以你必要在這個五取蘊上面，產生絕大的厭惡，求解脫的心。那個時候才進一步去找，它什麼原因而綁著的等等，整個的修行佛法的根本從這裡。"]]},{"t":"70A 16:38","b":[["s","現在既然你不了解，於是就不能發起真實的厭離心；既然不能發起真實厭離心，你求解脫的心請問從哪裡發生起？因為你要解脫，所以那個時候你要去求種種解脫的方便，修那個道。那個時候才會有：啊，持戒是必須的！在這個基礎上面，念佛也好、參禪也好、學教也好。現在關於這個問題你找不到，沒有把握住，然後你說念佛、持戒，然後你說參禪、打坐，你坐，幹什麼啊？你幹什麼啊？你作了很多學問，你為什麼？我們不是在無的放矢嗎？所以前面說這個問題你沒解決，就像射箭，就像我們打靶一樣，靶在哪裡不知道，拿了槍朝天亂放。朝天亂放那最多浪費你子彈，我們現在是亂放的話打死了很多人，然後呢你就賠這個命欸！我們就是做這個事情。"]]},{"t":"70A 17:46","b":[["s","所以這一點大家不必忙著去修行，你必須忙著 ─我為什麼要修行！然後你有了這個，然後再找你修行的方法，那個時候你覺得：啊！這個方法配我的胃口，適我的根性。然後你全部精神，你自然解決嘛！哦，曉得現在這只有念佛，於是你聽見了牢牢抱著一句佛號，不管人家天塌下來，那是人家的事情。如果你發大心，「等到我去了，然後回過頭來幫助別人」，問題就解決了。如果你持戒，你只要把握住一個，哦，那戒上面告訴你，你能夠這樣清淨的話，小則生人天，大則得解脫，你全部精神貫注在這個裡頭。乃至於，所以為什麼人家說「乘急戒緩」，它的目的在什麼？在這裡，你把握住這點的話，你乘急戒緩也可以解脫。否則的話，對不起，那一定出毛病的，因為戒是根本嘛！"]]},{"t":"70A 18:56","b":[["s","為什麼講乘急戒緩也可以解脫呢？他到那個時候來講，「喔，這個是根本啊！」他一定要全部精神把那個根本問題解決。所以他把那個根本的，持這個戒本來要三具，身、口行持一點都不能錯，那時候他發現：只要把他的意把握住了，其他枝葉慢慢地再來，這樣。所以如果是念佛的話，他腦筋裡除了一句佛號什麼都沒有了，當然解脫！然後參禪的，他一天看著是「念佛的是誰？」、「拖著這個死屍的誰？」一定要找到它。欸，結果找到它了，跟空性相應了，那當然問題解決了。所以人家古人所以說「乘急」，是從這個地方急起啊！我們現在講乘急戒緩，緩了半天，乘急不急，戒又緩掉了，不墮落，到哪裡去！反過來說，那好，我們戒急了，它戒為什麼教你急呀？它目的還是這個，告訴你這個是生死的根本，不可以做啊！要在這個地方擋住！啊！於是你內心當中戰戰兢兢，因為了解：我們對事情的真相，凡夫畢竟是凡夫，不可能了解！"]]},{"t":"70A 20:14","b":[["s","所以有一天一位同修來跟我談，他是一個非常精采的人，哎呀，曾經弄過那個戒律。他當時告訴我：真正我們弄這個東西要到羅漢。我非常讚歎，一點都沒錯，為什麼？我們到了那個時候，心裡才不會被現行煩惱所轉，那時候你能客觀地見到這個問題。這個話是對的，可是我們現在做得到嗎？這個我們不談，真正的問題是什麼？我們雖然做不到，可是我們要問現在我們因地上面忙些什麼？哪！就在忙這個。你把握住這個了，在這種情況之下，儘管我們不可能把這個東西的問題，能夠圓滿地把握住，不怕！根本在哪裡你把握住了，你只要在這個地方下去，那一定問題解決！而這個戒的真正的目的在哪裡？就是這個。否則的話你如果弄不到的，然後戒行、戒相上面，喔唷，這個、這個，這個、那個，弄了個半天還是越走越遠了，這個我們必須要了解的。"]]},{"t":"70A 21:23","b":[["s","所以在這個地方他告訴我們：假定你對這個的生死取蘊的自性，沒有真實地了解的話，你求解脫的心無發生處。現在出家修行的目的幹什麼？前面告訴我們不但是單單作一個羅漢，作羅漢你八關齋戒也可以解決，你何必這麼行？沙彌也可以解決，像均提沙彌等等，你何必弄個兩百五十條這麼難行，得到一點的義利啊？這個我們必定要了解啊！所以這個是它的根本哪！"]]}],"口譯音":"口譯音檔/siwei-kudi-04/009.mp3"},{"文":"於諸有情流轉生死，亦無方便«能起大悲»，","口譯":"對於諸有情在生死中流轉，也就沒有方法能生起大悲，","四家合註":null,"覺燈日光":null,"時":"70A 22:07","頁":161,"af":"70a","st":1327,"et":1670,"消文":[{"文":"對自己發厭離心；了解這東西這麼可怕，推己及人，那時發大悲。"}],"延伸":[{"題":"能起大悲","組":[{"題":"推己及人起大悲","說":[{"類":"立","文":"大悲必定是自己深深見到取蘊的可怕，然後憐憫別人。"},{"類":"破","文":"自己對這東西貪著難捨，憐憫些什麼？完全顛倒。"},{"類":"立","文":"沒有厭離心絕不可能有大悲心，所謂大悲只是騙騙人。"}]},{"題":"理路清楚，步步上升","說":[{"類":"下手","文":"凡夫做不到厭離，正因做不到所以策發；目的是成佛，時時提醒發大悲心，這絕對正確。"},{"類":"立","文":"一開頭正確認識，步步上升，不走冤枉路；弄錯了拉回來，師友之間互相助力。"}]},{"題":"出離心大小乘共","說":[{"類":"破","文":"有人說「我是大乘菩薩，出離心是小乘行者做的」。"},{"類":"立","文":"龍樹、無著，任何完整的傳承都說得清楚：大悲從這上面發生。"},{"類":"立","文":"形象上有差別，內涵一模一樣：深深了解取蘊本身是苦，絕無例外。"}]},{"題":"又拉又推，一路向上","說":[{"類":"例","文":"做不到常覺得難過；了解了無比歡喜，末法時代碰到最完整根本的教法，感到慶幸。"},{"類":"因","文":"業感緣起，沒有宿生善根絕對碰不到。"},{"類":"喻","文":"一個拉、一個推：歡喜跑偏了，就想自己還有那麼多錯；推得太緊，又換成歡喜。方向總是一路向上。"}]}],"說":[{"類":"立","文":"大悲必定是自己深深見到取蘊的可怕，然後憐憫別人。"},{"類":"破","文":"自己對這東西貪著難捨，憐憫些什麼？完全顛倒。"},{"類":"立","文":"沒有厭離心絕不可能有大悲心，所謂大悲只是騙騙人。"},{"類":"下手","文":"凡夫做不到厭離，正因做不到所以策發；目的是成佛，時時提醒發大悲心，這絕對正確。"},{"類":"立","文":"一開頭正確認識，步步上升，不走冤枉路；弄錯了拉回來，師友之間互相助力。"},{"類":"破","文":"有人說「我是大乘菩薩，出離心是小乘行者做的」。"},{"類":"立","文":"龍樹、無著，任何完整的傳承都說得清楚：大悲從這上面發生。"},{"類":"立","文":"形象上有差別，內涵一模一樣：深深了解取蘊本身是苦，絕無例外。"},{"類":"例","文":"做不到常覺得難過；了解了無比歡喜，末法時代碰到最完整根本的教法，感到慶幸。"},{"類":"因","文":"業感緣起，沒有宿生善根絕對碰不到。"},{"類":"喻","文":"一個拉、一個推：歡喜跑偏了，就想自己還有那麼多錯；推得太緊，又換成歡喜。方向總是一路向上。"}],"af":"70a","st":1327}],"逐字稿":[{"t":"70A 22:07","b":[["q","於諸有情流轉生死，亦無方便能起大悲，"],["s","對自己呢，發厭離心；然後因為自己了解，原來這個東西這麼個可怕法，這個問題都在這個地方，由此而推己及人，那麼那個時候發大悲。所以大悲，必定自己深深見到這個東西的可怕，然後你憐憫別人。現在你對這個東西都貪著難捨，你憐憫，你憐憫些什麼啊？那不是完全顛倒了嗎，完全顛倒了嗎？所以這地方很明白的，是沒有厭離心絕不可能有大悲心，所謂大悲心那只是騙騙人。不過在這個地方我們有一點要注意哦！這是理路是我們清楚，然後呢行持上去的時候，必然地先了解了理路慢慢上升。所以我們是一個凡夫，你問我：你有沒有厭離心？我懂得厭離心，有的時候碰巧，碰到一點點，經常狀態只是策發自己 ─就因為自己不能厭離所以策發！但是我雖然現在連厭離心做不到，可是我的目的是要成佛，所以我時時提醒我要發大悲、大菩提心，這個絕對正確的，絕對沒有錯。就是你了解了這個理路，然後一步一步策勵自己上去，這個是正確的路子。"]]},{"t":"70A 23:41","b":[["s","所以剛才講那個道理，一開頭你一定要圓滿地認識，不是圓滿 ─正確地認識，然後呢步步上升，你就不會走冤枉路，這個是它最主要的，最主要的。那隨時弄錯了，欸，弄錯了，拉回來；弄錯了，拉回來，那麼那個時候大家師友之間啊，就產生了最好的互相的助力，這個根本的問題。所以現在人家說：「哎呀，我是個大乘菩薩，這個出離心這個都小乘行者做的。」我也不曉得他這個佛法是哪裡學起？至少在我是不懂的。我看見龍樹菩薩，人家都說這個是「八宗共祖」，最了不起的，無著菩薩，不管是哪一個完整的傳承當中，說得清清楚楚，他那個大悲心一定從這個上面發生的。是，等到他啟發了大悲，他主要的一天到晚，那個時候忘我而忙別人了。所以他那個形象上面，的的確確是跟那個全部精神貫注在只解決自己問題的形式，有一點差別。但是你根本地深入去探索的話，這個內涵本質是完全一模一樣。內涵是什麼？喏！這些數取趣在生死當中痛苦，他要把他從生死當中透脫出來。他深深地了解這個取蘊的本身是苦，這一點絕對共同，絕沒有例外！這一點沒有，沒有佛法！所以這一點我們必定要了解的。"]]},{"t":"70A 25:35","b":[["s","所以現在第一個概念從這地方，我就非常歡喜，從做不到這一點來說，我常常覺得難過；從了解這一點來說，我無比地歡喜。唉呀，我覺得在今天這個末法時代，大家這麼你說你的、我說我的，不曉得什麼是好，居然最完整、根本的教法在這裡，啊，感到無比地慶幸！如果我們不是宿生有相當的善根，碰不到。為什麼？業感緣起，就是這樣簡單。你沒有積這個善根絕對碰不到，想到高興啊，想到高興啊！然後推動著自己，趕快努力。既然前面告訴我們有這麼事情做不到，現在又了解了怎麼去做，這個力量就來啦！一個是拉你的，一個是推你的，又拉又推那當然上得去。"]]},{"t":"70A 26:38","b":[["s","所以當你感著得拉了歡喜的時候，一個不小心歡喜到別的地方去了，趕快想想：唉呀，我還有這麼多錯！所以那個拉到別地方歡喜心，就被這個苦切的心情把它對治掉了，變成功推的力量。結果那推、推、推、推，推得太緊了，到那個時候心裡面又換一個想法，變成拉的力量，啊，心裡又歡喜！這樣狀態當中，不管你是歡喜也好，不管你是悲切也好，方向總歸是一路向上，這個是我們這個地方應該了解的，應該了解的。"]]},{"t":"70A 27:17","b":[["s","然後呢方法上面，同樣地我們要認真探討，儘管，是！無不是走這個出離的路，不管是自利利他，但是那個方法萬一弄得不對的話，我們以為做對了，結果走、走、走、走，走到邊路上面去了。就像剛才說的，喔，又講修行，結果呢他自己不懂得道理；然後呢要講道理，又把握不住這個中心，諸如此類。"]]}],"口譯音":"口譯音檔/siwei-kudi-04/010.mp3"},{"文":"故隨轉趣大小何乘，然此意樂極為切要。","口譯":"所以，無論轉趣大乘或小乘，這個意樂（求解脫心）都極為重要。","四家合註":null,"覺燈日光":null,"時":"70A 27:50","頁":161,"af":"70a","st":1670,"et":1719,"消文":[{"文":"不管大乘小乘，這個認識最最重要，是問題的中心。"},{"文":"這就是為什麼要學很多東西，卻以本論為先。"},{"文":"把握住這根本，才曉得學戒、念佛的目的在這裡；把這個概念把握住，學什麼就成什麼。"}],"延伸":[],"逐字稿":[{"t":"70A 27:50","b":[["q","故隨轉趣大小何乘，然此意樂極為切要。"],["s","所以不管你大乘小乘，這個概念、這個認識最最重要的，這個是問題的中心。到了這裡我們大家曉得：為什麼現在我們好像要學很多東西，卻以本論為先，大家了解了，喏，就這個。你把握住這個根本，然後你才曉得：啊！那個時候我要學什麼？要學戒。戒的目的什麼？在這裡啊！嗯，那就對了。然後你曉得要念佛，哦，為什麼要念佛？原來這樣啊！那持戒等等無不在這個上頭。所以你把這個概念把握得住，學什麼就成什麼！"]]}],"口譯音":"口譯音檔/siwei-kudi-04/011.mp3"},{"文":"發生此者，亦隨當從«無垢»聖語，如量解釋，先正尋求清淨了解。","口譯":"要生起這個意樂，也應當依從無垢的聖言，以及如量的解釋，先正確地尋求清淨的了解。","四家合註":null,"覺燈日光":null,"時":"70A 28:39","頁":161,"af":"70a","st":1719,"et":null,"消文":[{"文":"這個聖道的命根怎麼發生？必須隨「無垢」聖語。"},{"文":"聖語的特質是針對問題來解決；書很多，要如理抉擇，質本身不能錯。"},{"文":"如量解釋：根據相應的，解釋得清清楚楚；先正尋求清淨了解，這裡面已包括次第。"}],"延伸":[{"題":"無垢","組":[{"題":"無垢與正確","說":[{"類":"立","文":"他不說正確而講無垢：正確的很多，有的是枝末、有的是根本，會轉圈子。"},{"類":"立","文":"正面提示有時有漏洞；反面反顯，把錯誤的地方整個擋住。"},{"類":"例","文":"同修用功太緊聽輕音樂，有正面效果，但不是無垢，像電視裡插的廣告。"}]},{"題":"學得圓滿才安全","說":[{"類":"下手","文":"念本論辛苦不要怕；前面辛苦一點，學得圓滿沒漏洞，修起來百分之百安全。"},{"類":"喻","文":"造船圖省事漏洞很多，開出海到處漏水，那時只有一條路：死。"}]}],"說":[{"類":"立","文":"他不說正確而講無垢：正確的很多，有的是枝末、有的是根本，會轉圈子。"},{"類":"立","文":"正面提示有時有漏洞；反面反顯，把錯誤的地方整個擋住。"},{"類":"例","文":"同修用功太緊聽輕音樂，有正面效果，但不是無垢，像電視裡插的廣告。"},{"類":"下手","文":"念本論辛苦不要怕；前面辛苦一點，學得圓滿沒漏洞，修起來百分之百安全。"},{"類":"喻","文":"造船圖省事漏洞很多，開出海到處漏水，那時只有一條路：死。"}],"af":"70a","st":1719}],"逐字稿":[{"t":"70A 28:39","b":[["q","發生此者，亦隨當從無垢聖語，如量解釋，先正尋求清淨了解。"],["s","欸，曉得了，那麼又告訴我們學的次第呢？那麼這樣的一個重要的真正聖道的命根，它這個根本怎麼發生的呢？唔，必須要隨「無垢」。他不說正確而講無垢，妙了！有的時候我們正確，這個對了，但是對不起，你這個對、他那個也對、他那個也對，這個這麼多「對」當中，這一個地方也許有的是枝末，有的是根本，你要轉圈子。他反過來 ─無垢，就是說他這個絕對沒有錯的，都是正確的、正面的。所以這個用反面的反顯，跟正面的提示，兩個的差別我要說一下：正面的提示提出來了以後，有的時候有漏洞的；如果反面反顯的話，換句話說，他把錯誤的地方整個地擋住了。"]]},{"t":"70B 00:09","b":[["s","譬如說我昨天講的，一個同修講的這個經驗。他說他到那時候用功，哎呀，用得心裡很緊，然後因為他是一個在家居士，那當然了，可以有的時候聽聽那個輕音樂之類。嗯，這有它的功德的，有它正面效果的，但是它不是「無垢」。昨天我就解釋了，你們了解了沒有？就像我這講那個關於這個電視當中，插一個廣告進去的道理。所以這個真正的嚴密的，凡是遵循法相上頭的，它為什麼這麼個好法。同時這地方也說，念本論就算很辛苦啊，你不要怕辛苦，它正因為你前面稍微辛苦一點，所以它學得圓滿一點漏洞都沒有。到那時候你修起來，一點漏洞都沒有的話，百分之百地安全。"]]},{"t":"70B 01:06","b":[["s","現在前面你要圖一點省事，我舉個比喻吧，比如你造個船，前面造個船，圖一點省事，結果漏洞很多。你以為造好了開出海去，這個地方漏水，那個地方漏水，到那時來不及了，一條路 ─死。所以現在我們這個地方，真正的這個原因告訴我們，這無垢的，絕對不會有漏洞的。這個聖語聖者，這個「聖語」的特質是什麼？針對著問題來解決的，所以無垢的聖語。儘管現在的書好多，各式各樣的書，但是這些書當中，我們一定要選擇，要如理地抉擇，這個才對，所以這個質本身不能錯。還有呢，「如量解釋」，根據相應的，解釋得清清楚楚。對這個道理「正尋求清淨了解」，這裡面次第已經包括：你先了解，了解了對了，"]]}],"口譯音":"口譯音檔/siwei-kudi-04/012.mp3"},{"文":"次須長時觀擇修習，引發其心«猛利變動»。","口譯":"其次必須長時間地觀察抉擇、修習，引發內心猛利地轉變。","四家合註":null,"覺燈日光":null,"時":"70B 02:20","頁":161,"af":"70b","st":140,"et":482,"消文":[{"文":"懂了以後要長時觀察、修習，修改這個心，一定要令心意轉變過來。"},{"文":"做到了就行，做不到趕快猛利懺悔。"}],"延伸":[{"題":"猛利變動","組":[{"題":"懂了為何做不到","說":[{"類":"因","文":"懂了做不到，通常實際上是沒有真的懂。"},{"類":"因","文":"真的懂了，無始雜染習氣還在現行，所做還是生死染污之業，怎麼解脫。"}]},{"題":"皈依時的身心相續","說":[{"類":"回扣","文":"回想正修時一心皈依，要身心相續和合：了解以前一無可取，這是唯一可以皈投的。"},{"類":"立","文":"那時心裡的現行是隨順正法，不是煩惱。"},{"類":"例","文":"念佛的念累了腦中還是佛號，作夢也念；持戒的自然自淨其意，不管人家怎麼說。"}]},{"題":"見惑思惑仍在","說":[{"類":"破","文":"資糧未具、障礙未除：見惑上轉的，腦筋聰明，文字通達。"},{"類":"破","文":"思惑上轉的，曉得發脾氣不好，碰到還是發；看見東西就食指大動。"}]},{"題":"法樂在淨化煩惱","說":[{"類":"下手","文":"要懺悔，先破現行；長時觀察、思惟、修習，引發其心猛利變動。"},{"類":"立","文":"貪放下了滿心清涼，瞋放掉了安樂無比，知見稠林放下了：因地上就感受到法樂。"},{"類":"破","文":"文字聽得美不是法樂；那說相聲的，遠比我們精采。"},{"類":"立","文":"法樂跟法相應，法的特質是淨化煩惱；因地降伏煩惱，感得不輪轉生死的清淨之果。"}]}],"說":[{"類":"因","文":"懂了做不到，通常實際上是沒有真的懂。"},{"類":"因","文":"真的懂了，無始雜染習氣還在現行，所做還是生死染污之業，怎麼解脫。"},{"類":"回扣","文":"回想正修時一心皈依，要身心相續和合：了解以前一無可取，這是唯一可以皈投的。"},{"類":"立","文":"那時心裡的現行是隨順正法，不是煩惱。"},{"類":"例","文":"念佛的念累了腦中還是佛號，作夢也念；持戒的自然自淨其意，不管人家怎麼說。"},{"類":"破","文":"資糧未具、障礙未除：見惑上轉的，腦筋聰明，文字通達。"},{"類":"破","文":"思惑上轉的，曉得發脾氣不好，碰到還是發；看見東西就食指大動。"},{"類":"下手","文":"要懺悔，先破現行；長時觀察、思惟、修習，引發其心猛利變動。"},{"類":"立","文":"貪放下了滿心清涼，瞋放掉了安樂無比，知見稠林放下了：因地上就感受到法樂。"},{"類":"破","文":"文字聽得美不是法樂；那說相聲的，遠比我們精采。"},{"類":"立","文":"法樂跟法相應，法的特質是淨化煩惱；因地降伏煩惱，感得不輪轉生死的清淨之果。"}],"af":"70b","st":140}],"逐字稿":[{"t":"70B 02:20","b":[["q","次須長時觀擇修習，引發其心猛利變動。"],["s","這是平常我們真正修行的重要的關鍵哦！所以為什麼我們懂了做不到？通常實際上，我們沒有真的懂，這是第一個。現在在這裡我們了解了：啊！關鍵在這裡。懂是真的懂了，但是雖然真的懂了，因為無始以來習氣還在，在無始的習氣的現行當中。這個無始的習氣是什麼？雜染的。既然在雜染的習氣當中現行，你所做到的還是生死染污之業，還是感得這個苦惱的苦報，你怎麼可能解脫呢！所以這個地方，進一步告訴我們：你要長時地觀察，然後修習，就修改那個心，一定要令我們的心意轉變過來。如果做到了就行，做不到了，是趕快猛利懺悔。"]]},{"t":"70B 03:33","b":[["s","所以我們現在馬上就回想一下，對！當初在前面告訴我們正修的時候怎麼修啊？說先把佛像安置，然後呢我們一心皈依，這皈依這個意都在裡頭。萬一你資糧未具，業障未除，到那時你皈依是皈依不起來。他告訴我們的皈依有個特定的特質，一定要使身心相續和合，這幾句話。現在我們了解了，什麼叫「相續和合」？就是問你為什麼皈依的？啊，原因了解以前的苦，所以要找快樂，這個快樂所依靠的地方是這個。所以那個時侯，你一心皈投依靠他，那個時候心裡面什麼個現行？以前是一無可取，是唯一可以皈投啊！請問這種狀態的心裡的現行是煩惱還是隨順正法？是隨順正法嘛！一點都沒錯嘛！"]]},{"t":"70B 04:45","b":[["s","所以那個時候假定你念佛的話，阿彌陀佛、阿彌陀佛、阿彌陀佛 ……念累了嘴巴儘管不想，腦筋裡面還阿彌陀佛，等到你睡覺了作夢你也在阿彌陀佛。如果你參禪的話，一天到晚就看著這個；如果你持戒的話，自然必然會自淨其意。啊，人家各宗各派的，他怎麼說、他怎麼說，那我不去管他，那我不去管他，這各人的根性不一樣，我曉得這個針對我的毛病，我就照著這個自淨其意，哪裡還有什麼質疑的問題？沒有啦！結果呢，對不起，嘿，我們資糧未具，我們的障礙未除，或者在思惑上轉，或者在見惑上轉。見惑上轉那些人，腦筋很聰明哦！這個見解文字很通達。思惑上轉的人，那個習性很強，叫他不要發脾氣，他也曉得發脾氣不好，碰見這種情況，就是要發脾氣，看那個人也看不慣，看那個人看不慣；貪心不好嘛，講的時候滿好，等一下看見了東西，唉呀，食指大動。原因是什麼？就是這個。"]]},{"t":"70B 06:00","b":[["s","那麼怎麼辦呢？要懺悔。那麼懺悔的時候第一個就「破現行」，啊！現在我們心裡曉得了，原來這問題是這樣。那要怎麼辦？要長時候地觀察、思惟、修習，然後呢「引發其心，猛利變動」。怎麼變動啊？以前哪，心一天到晚在煩惱上面轉，現在整個地改過來了，啊，原來這個樣的！很清楚、很明白地變掉了，這第一個。還有呢變掉了以後，因為是煩惱，煩惱的行相是什麼？煩煩惱惱嘛，很簡單嘛！等到你變過來了以後，當下 ─平常你一直，你這個貪心放不下，到那放下了，哎呀，你那時覺得：啊！滿心清涼。本來你看見這種地方看不順眼的話，你瞋心放掉了，啊，你只覺得安樂無比。平常你在知見上面老轉的，現在發現原來是知見稠林，一點用場都沒有，那時放下了。"]]},{"t":"70B 07:02","b":[["s","所以不是說等到果位上面，因地上面你已經是感受得到這個法樂，這個才是真正的法樂。不是說：唉呀，那個講的個文字聽得很美。如果說講的文字聽得很美的話，你跑到說書場裡面，唱相聲的，說實在那個唱相聲的，遠比我們精采，我怎麼比得過一個唱相聲的人！這個概念你們務必要知道，務必要知道。所以法樂是跟法相應，法的特質是淨化煩惱，那個時候你因地上面很清楚、很明白地降伏了。有這個因，將來感得的果是什麼？清淨之果。清淨之果就是不輪轉生死的，兩個的根本差別。所以說："]]}],"口譯音":"口譯音檔/siwei-kudi-04/013.mp3"},{"文":"故薄伽梵令知苦諦生死過患，宣說八苦，所有密意，如聖無著極善決擇而為宣釋。","口譯":"所以，薄伽梵為了令我們了知苦諦——生死的過患，宣說了八苦；其中的所有密意，如聖者無著菩薩極善巧地抉擇而為解釋的那樣。","四家合註":null,"覺燈日光":null,"時":"70B 08:02","頁":162,"af":"70b","st":482,"et":536,"消文":[{"文":"佛陀為了讓我們了解苦諦的特質說八苦，真正重要的密意就是這樣。"},{"文":"佛所說比較深奧，無著菩薩非常善巧地解釋了。"}],"延伸":[],"逐字稿":[{"t":"70B 08:02","b":[["q","故薄伽梵令知苦諦生死過患，宣說八苦，所有密意，如聖無著極善決擇而為宣釋。"],["s","所以佛陀為了要讓我們了解這個苦諦的特質，喏，就是這樣，所以說這幾樣東西。他這個真正重要的密意、內涵就是這樣的。那麼這個聖者，佛所說的是比較深奧，現在經過無著菩薩，非常善巧地把它解釋了，哪！就這個道理。啊！現在我們懂了。"]]}],"口譯音":"口譯音檔/siwei-kudi-04/014.mp3"},{"文":"如博朵瓦云：「於六趣中，隨生何趣，其後發生病痛死等，眾苦惱者，是病者病，是死者死，非彼不應，忽爾而起。是生死相，或生死性，住生死時，必不能越。我等於此，若起厭離，須斷其生，«此須斷因»。」","口譯":"如博朵瓦說：「在六趣之中，無論生在哪一趣，之後發生病痛、死亡等眾多苦惱，病的就是病，死的就是死，並不是不應該發生而忽然生起的。這是生死的相狀，或說是生死的本性，住在生死中時，必定無法超越。我們對此如果生起厭離，就必須斷除受生；而要斷除受生，就必須斷除它的因。」","四家合註":null,"覺燈日光":null,"時":"70B 08:56","頁":162,"af":"70b","st":536,"et":665,"消文":[{"文":"六道之中，不管生在哪裡，病、死等身心苦惱，不是沒有理由突然跑來的。"},{"文":"在雜染中感得生死輪迴，性是生死性，相是生死相，只要在輪迴中決定沒有辦法超越跳出。"},{"文":"認識了要發起厭離；真要斷除，要找它為什麼來的，斷其因。"}],"延伸":[{"題":"此須斷因","組":[{"題":"從苦諦推到集諦","說":[{"類":"立","文":"既然是這個原因產生這個結果，就要斷其因，所以從苦諦推到集諦。"}]},{"題":"未見過患，外面空轉","說":[{"類":"破","文":"這一點沒有的話，儘管講三毒，看起來卻不是毒，像最寶貝的東西。"},{"類":"例","文":"看見好東西唯恐少；教你修行一點事情，就苦得受不了。"},{"類":"立","文":"問題沒有找到，總歸在外面空轉。"}]}],"說":[{"類":"立","文":"既然是這個原因產生這個結果，就要斷其因，所以從苦諦推到集諦。"},{"類":"破","文":"這一點沒有的話，儘管講三毒，看起來卻不是毒，像最寶貝的東西。"},{"類":"例","文":"看見好東西唯恐少；教你修行一點事情，就苦得受不了。"},{"類":"立","文":"問題沒有找到，總歸在外面空轉。"}],"af":"70b","st":539}],"逐字稿":[{"t":"70B 08:56","b":[["q","如博朵瓦云："],["s","那麼這個祖師也告訴我們："]]},{"t":"70B 08:59","b":[["q","「於六趣中，隨生何趣，其後發生病痛死等，眾苦惱者，是病者病，是死者死，非彼不應，忽爾而起。是生死相，或生死性，住生死時，必不能越。我等於此，若起厭離，須斷其生，此須斷因。」"],["s","下面告訴我們，這個祖師說：在我們這個六道當中，不管三界、四生、六道，不管你在哪一個地方，所有的這些東西，種種的痛苦啊！然後這個種種的身心的苦惱，不管是病、死等等，它這個東西，不是說沒有理由地突然之間跑得來，不是的！它總是在這個地方，你在雜染的情況，感得生死的輪迴以後，它那個性就是「生死性」，相就是「生死相」。你只要在這個生死輪迴當中，你決定沒有辦法超越跳出。對於這一點我們要認識，認識了以後要發起厭離。你真正要厭離、要斷除的時候，要怎麼辦哪？那時候進一步要找它，它為什麼來的？哦！有這個原因。既然是這原因而產生這個結果的話，那個時候你要斷其因，所以從苦諦而推到集諦。如果你這一點沒有的話，的的確確地，儘管我們講：唉呀，這個三毒啊！但是你看起來這個不是毒，喔唷，這個三種什麼最寶貝的東西哦！看見那好東西，哎喲，唯恐少，這樣。教你修行一點事情的話，唉呀，這個東西苦得受不了，偷懶，不要說偷，這個話不必這麼說啦，總之就是問題沒有找到的話，你總歸在外面空轉。"]]}],"口譯音":"口譯音檔/siwei-kudi-04/015.mp3"},{"文":"當於前說，生老病死等已生眾苦，如是思惟。","口譯":"應當對於前面所說的生、老、病、死等已經生起的眾苦，像這樣思惟。","四家合註":null,"覺燈日光":null,"時":"70B 11:05","頁":162,"af":"70b","st":665,"et":705,"消文":[{"文":"照著前面這樣來思惟，這是正說八苦的根本原因，重點我們現在認得了。"},{"文":"五蘊中三苦的特質，最後還要講；這是分八類來講，下面第二思惟六苦。"}],"延伸":[],"逐字稿":[{"t":"70B 11:05","b":[["q","當於前說，生老病死等已生眾苦，如是思惟。"],["s","就要照著前面這個這樣來，這個是正說八苦的根本原因，所以它的重點現在我們認得了。那麼至於這個五蘊，他是說出重點來，五蘊當中最特別的，所謂三苦─苦苦、壞苦、行苦的特質，在最後那地方還要講。這是分八類來講。第二思惟六苦，思惟六苦。那麼這個方面我們也把它看一看："]]}],"口譯音":"口譯音檔/siwei-kudi-04/016.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-04/001.webp","n":1},{"img":"投影片/siwei-kudi-04/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/siwei-kudi-04/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/siwei-kudi-04/004.webp","n":4},{"img":"投影片/siwei-kudi-04/005.webp","n":5},{"img":"投影片/siwei-kudi-04/006.webp","n":6},{"img":"投影片/siwei-kudi-04/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=69b&st1=1612&et1=1790","box":[0.123625,0.3591111111111111,0.1265,0.07066666666666667]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-04/008.webp","n":8},{"img":"投影片/siwei-kudi-04/009.webp","n":9},{"img":"投影片/siwei-kudi-04/010.webp","n":10,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=70a&st1=0&et1=121","box":[0.544875,0.29466666666666663,0.13775,0.06844444444444445]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/siwei-kudi-04/011.webp","n":11},{"img":"投影片/siwei-kudi-04/012.webp","n":12},{"img":"投影片/siwei-kudi-04/013.webp","n":13,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=70a&st1=121&et1=442","box":[0.133625,0.3091111111111111,0.13775,0.07733333333333334]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.807611548556430 ","堂數":89,"日期":"2026/12/1","分圖":[{"名":"師承・無定過患","原文":[0,4]},{"名":"無飽足過患","原文":[5,11]},{"名":"策勵恆修・捨身結生","原文":[12,25]}],"跨科判":null,"週":114,"班級":"24秋007","音檔":{"70b":{"local":"音檔/gl1/070B.mp3","remote":"https://lamrim.xyz/player/media/gl1/070B.mp3"},"71a":{"local":"音檔/gl1/071A.mp3","remote":"https://lamrim.xyz/player/media/gl1/071A.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=70b&st1=705&af2=71a&et2=1444","段":[{"文":"第二思惟六苦者。«親友書釋»宣說七苦，其最後者是別過患，故於此中當思六種。","口譯":"第二，思惟六苦。《親友書釋》宣說了七種苦，其中最後一種是個別的過患，所以在這裡應當思惟六種。","四家合註":null,"覺燈日光":null,"時":"70B 11:45","頁":162,"af":"70b","st":705,"et":834,"消文":[{"文":"這裡說明六苦的來源，處處地方說明師承。"},{"文":"「其最後」是各別的，所以這裡不談；現在是總思的時候，只說總的六種。"}],"延伸":[{"題":"親友書釋","組":[{"題":"處處說明師承","說":[{"類":"立","文":"古人著述立說，一字之差，明明曉得這個字錯了也不改，一定要找到原因；找不到根本不會改。"}]},{"題":"學佛菩薩，不是教佛菩薩","說":[{"類":"破","文":"我們動不動亂改，不但改字，還拿我們的想法去想概念。"},{"類":"立","文":"我們是百分之一百的凡夫，如果我們的概念正確，佛菩薩一點用場都沒有；我們變成教佛菩薩了。"}]},{"題":"圓滿師承，親自驗證","說":[{"類":"立","文":"聖者的著述一定有圓滿的師承，而且不只是聽見就對，一定要自己親自驗證。"},{"類":"例","文":"阿底峽尊者、宗喀巴大師都是三事具足，說出來的量百分之百正確。"}]}],"說":[{"類":"立","文":"古人著述立說，一字之差，明明曉得這個字錯了也不改，一定要找到原因；找不到根本不會改。"},{"類":"破","文":"我們動不動亂改，不但改字，還拿我們的想法去想概念。"},{"類":"立","文":"我們是百分之一百的凡夫，如果我們的概念正確，佛菩薩一點用場都沒有；我們變成教佛菩薩了。"},{"類":"立","文":"聖者的著述一定有圓滿的師承，而且不只是聽見就對，一定要自己親自驗證。"},{"類":"例","文":"阿底峽尊者、宗喀巴大師都是三事具足，說出來的量百分之百正確。"}],"af":"70b","st":705}],"逐字稿":[{"t":"70B 11:45","b":[["q","第二思惟六苦者。《親友書釋》宣說七苦，其最後者是別過患，故於此中當思六種。"],["s","這個六苦的來源，他，換句話說這個地方，處處地方說明這個師承，這點我前面說過很多次了。我覺得古人著述立說，他一字之差，明明曉得這個字錯了，他不改，一定要找到原因。然後呢他有說明的，這個是他想當中可能什麼，找不到根本不會改。我們現在動不動就是亂改，然後呢不但一個字改，然後概念拿我們的想法去想。我們實在是生死當中，百分之一百的凡夫，如果我們這種概念正確的話，那佛菩薩是一點用場都沒有。我們不是學佛菩薩，我們變成功教佛菩薩了，這一點大家要了解啊！"]]},{"t":"70B 12:45","b":[["s","雖然這個小地方，他處處地方說明了真正的聖者，他們的著述的立說，一定有他的圓滿的師承。而且這個師承不僅僅是說聽見就對哦，他一定要自己親自驗證。像本論的根本 ─阿底峽尊者，以及根據阿底峽尊者的藍圖造本論的宗喀巴大師，他都是三事具足哦！這個都是三樣東西都具足的。換句話說，他們說出來這個量本身的話，百分之百地正確。所以這一點他有這樣的說明，這個意義在這裡。「其最後」是各別的，所以這裡不談。那麼現在我們是總思的時候，所以這個裡邊只說它的總的六種。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/001.mp3"},{"文":"其中無定過患者。謂於生死流轉之時，父母等親，於他生中轉為怨敵，諸怨敵等轉成親屬，如是父轉為子，子轉為父。母轉為妻，妻轉為母等。唯是次第展轉流轉，是故全無可憑信處。","口譯":"其中無定的過患：就是在生死流轉的時候，父母等親人，在別的生中轉為怨敵；各個怨敵等轉成親屬。像這樣，父親轉為兒子，兒子轉為父親；母親轉為妻子，妻子轉為母親等。只是這樣次第輾轉地流轉，所以完全沒有可以憑信的地方。","四家合註":null,"覺燈日光":null,"時":"70B 13:54","頁":162,"af":"70b","st":834,"et":914,"消文":[{"文":"無定：沒有一定的。本來很親愛的，到下一生變成怨敵；本來怨敵，又變成親愛的。"},{"文":"「父轉為子」是顛倒，顛倒還是親；可是有很多怨家仇敵也轉過來了。"},{"文":"我們一天到晚「你跟我好、我跟你怨」，毫無意思；短短幾十年，下一次誰曉得誰是誰。"},{"文":"這都不是我們應該忙的事情；了解了，現在世間的親愛一切無可憑信。"}],"延伸":[],"逐字稿":[{"t":"70B 13:54","b":[["q","其中無定過患者。"],["s","是第一個，說這個沒有定，看看那個內容什麼叫無定呀？"]]},{"t":"70B 14:01","b":[["q","謂於生死流轉之時，父母等親，於他生中轉為怨敵，諸怨敵等轉成親屬，如是父轉為子，子轉為父。母轉為妻，妻轉為母等。唯是次第展轉流轉，是故全無可憑信處。"],["s","嗯，就是這個，沒有一定的。這個本來很親愛的，到下一生變成怨敵，本來怨敵又變成功親愛的。上面說「父轉為子」是顛倒，這個顛倒還是親，可是有很多怨家仇敵轉過來了。那我們是不是也一天到晚，唉呀，你跟我好，我跟你怨，是毫無意思、毫無意思。短短的幾十年完了以後，到下一次誰曉得誰是誰？這個時候都不是我們應該忙的事情，不是我們應該忙的事情。我們如果了解了這個，那一無可憑。所以我們第一了解，現在世間的親愛，一切無可憑信處啊！所以這些東西，「是故全無可憑信處」。《親友書》上面怎麼說呢？"]]}],"口譯音":"口譯音檔/siwei-kudi-05/002.mp3"},{"文":"《親友書》云：「父轉為子母為妻，怨仇眾生轉為親，及其返此而死歿，故於生死全無定。」即現法中亦復展轉，互為親怨。","口譯":"《親友書》說：「父親轉為兒子，母親轉為妻子，怨仇的眾生轉為親人，以及與此相反的情形，就這樣死去，所以在生死中完全沒有定準。」即使在現生之中，也同樣輾轉互為親人與怨敵。","四家合註":null,"覺燈日光":null,"時":"70B 15:14","頁":162,"af":"70b","st":914,"et":945,"消文":[{"文":"不但在輪迴當中轉，現在也是一樣，這個千真萬確。"},{"類":"例","文":"以前的好朋友，到那時候反面成仇；以前兩個人不好，到那時候也有好得很的。"}],"延伸":[],"逐字稿":[{"t":"70B 15:14","b":[["q","《親友書》云：「父轉為子母為妻，怨仇眾生轉為親，及其返此而死歿，故於生死全無定。」即現法中亦復展轉，互為親怨。"],["s","不但在輪迴當中轉，那現在也是一樣的，這個千真萬確。欸，以前的好朋友，到那時候反面成仇；以前說不定兩個人不好，到那個時候，大家也有的好得很欸！處處地方都是這種。經上面："]]}],"口譯音":"口譯音檔/siwei-kudi-05/003.mp3"},{"文":"如《妙臂經》云：「有時怨敵轉為親，親愛如是亦為怨，如是一類為中庸，即諸中庸復為怨。如是亦復為親愛，具慧了知終莫貪，«於親當止愛分別»，於心善法安樂住。」","口譯":"如《妙臂經》說：「有時怨敵轉為親人，親愛的人也同樣會成為怨敵；像這樣，有一類會成為中庸（不親不怨）的人，而這些中庸的人又會成為怨敵，也會再成為親愛的人。有智慧的人了知這個道理，終究不會貪著；對於親人應當止息愛著的分別，令心安樂地住於善法。」","四家合註":null,"覺燈日光":null,"時":"70B 15:45","頁":162,"af":"70b","st":945,"et":1018,"消文":[{"文":"實際上一直在轉，真正有智慧的人對這個一無可貪。"},{"文":"平常最難捨的就是這個；了解了還有什麼好貪？應該停止貪愛的心，在法上面善安住，這是基本的。"}],"延伸":[{"題":"於親當止愛分別","組":[{"題":"淨化愛染，昇華為悲","說":[{"類":"立","文":"更進一步把這個東西昇華，變成大乘的。"},{"類":"破","文":"真正要寶愛，不是像現在世間的染污，這個沒有用。"},{"類":"立","文":"進一步幫人家去解決，就變成大乘：把愛的染污部分淨化了，好的部分昇華了，就變成悲。"}]}],"說":[{"類":"立","文":"更進一步把這個東西昇華，變成大乘的。"},{"類":"破","文":"真正要寶愛，不是像現在世間的染污，這個沒有用。"},{"類":"立","文":"進一步幫人家去解決，就變成大乘：把愛的染污部分淨化了，好的部分昇華了，就變成悲。"}],"af":"70b","st":990}],"逐字稿":[{"t":"70B 15:45","b":[["q","如《妙臂經》云：「有時怨敵轉為親，親愛如是亦為怨，如是一類為中庸，即諸中庸復為怨。如是亦復為親愛，具慧了知終莫貪，於親當止愛分別，於心善法安樂住。」"],["s","就是這樣，實際上一直在轉哪！真正地這樣轉來轉去，真正有智慧的人，所以對這個是一無可貪。因為平常我們最難捨的這個事情就是這樣，你了解了，還有什麼好貪？應該停止，停止啊！那麼停止了這個貪愛的心，怎麼辦呢？在法上面善安住，這個是基本的。實際上呢，他更進一步分進昇華這個東西，把它變成功大乘的。你既然是寶愛的話，真正要寶愛，不是像現在世間的染污，這個沒有用。你要進一步地幫忙人家去解決，那就變成功大乘。所以那個大乘的心的的確確，就把那愛的染污部分淨化了，把它好的那部分昇華了，就變成功悲呀！"]]}],"口譯音":"口譯音檔/siwei-kudi-05/004.mp3"},{"文":"如是修習，破於親怨分別黨類而起貪瞋，觀生死法，任何全無安心之處，應起厭離。","口譯":"像這樣修習，破除對於親、怨分別黨類而生起的貪與瞋；觀察生死之法，任何一處都完全沒有可以安心的地方，應當生起厭離。","四家合註":null,"覺燈日光":null,"時":"70B 16:58","頁":162,"af":"70b","st":1018,"et":1046,"消文":[{"文":"這就是第一個：觀生死流轉當中，「全無」，一點點沒有憑信的。"}],"延伸":[],"逐字稿":[{"t":"70B 16:58","b":[["q","如是修習，破於親怨分別黨類而起貪瞋，觀生死法，任何全無安心之處，應起厭離。"],["s","這一點就是第一個，我們觀生死流轉當中，啊！「全無」，一點點沒有憑信的，沒有憑信的。第二，"]]}],"口譯音":"口譯音檔/siwei-kudi-05/005.mp3"},{"文":"無飽足過患者。","口譯":"無飽足的過患。","四家合註":null,"覺燈日光":null,"時":"70B 17:26","頁":162,"af":"70b","st":1046,"et":1100,"消文":[{"文":"生死當中最大的行相是貪；貪而遇不到或者違背的時候，那是瞋。"},{"文":"無飽足：做任何事情永遠沒有飽足，不但沒有飽足，越做越厲害。"},{"類":"喻","文":"貪心重的人，像滾雪球一樣越滾越大；不管你怎麼樣，沒辦法飽滿它。"}],"延伸":[],"逐字稿":[{"t":"70B 17:26","b":[["q","無飽足過患者。"],["s","然後呢生死當中，最大的行相就是貪，當你貪而遇不到，或者違背的時候那是瞋。這一個情況叫「無飽足」，做任何事情永遠沒有飽足的，不但沒有飽足，越做越厲害，越做越厲害！這東西真是可怕極了，真是可怕極了！我想這個我們人人有經驗，有的人很多，也就是貪心比較淺的人，不一定感覺到；貪心重的人的確，你不管怎麼樣，啊！他在任何情況之下，這個東西的可怕，像滾雪球一樣越滾越大。一看見了，唉呀，到那時候只有除了這個以外就沒有了。但是不管你怎麼樣，你沒辦法飽滿它，它這個過患就是這樣。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/006.mp3"},{"文":"如云：「一一曾飲諸乳汁，過於四海於今後，隨異生性流轉者，尚須多飲過於彼。」謂當思惟一一有情，飲母乳酪昔飲幾許，今後若不學解脫道，當飲幾何。此是略喻，更當思惟生死之中，盛事苦事，無所未經，令心厭離。","口譯":"如說：「每一位有情曾經飲過的乳汁，超過四大海；從今以後，隨著凡夫的本性繼續流轉的人，還須再飲比那更多的乳汁。」就是應當思惟：每一位有情，過去飲過多少母親的乳汁；今後如果不修學解脫道，還要飲多少。這只是略舉的譬喻，更應當思惟在生死之中，興盛的事、痛苦的事，沒有一樣沒經歷過，令心生起厭離。","四家合註":null,"覺燈日光":null,"時":"70B 18:20","頁":162,"af":"70b","st":1100,"et":1191,"消文":[{"文":"任何一個人單單吃母親的奶，比四大海水還要多；只要還在生死輪迴，向後去吃的還遠超過這個。"},{"文":"生死當中，苦事、壞事沒有不經過的；所有經過的，永遠沒有夠的時候、停止的時候。"},{"文":"沒有停止的內容是一點點虛假的小快樂，帶來無比的痛苦；想到這裡要厭離。"}],"延伸":[],"逐字稿":[{"t":"70B 18:20","b":[["q","如云：「一一曾飲諸乳汁，過於四海於今後，隨異生性流轉者，尚須多飲過於彼。」"],["s","我們任何一個人，就是單單吃母親的奶，比四大海水還要多，不曉得多多少。而且向後去，你只要還在生死輪迴當中，你吃的還遠超過這個。"]]},{"t":"70B 18:46","b":[["q","謂當思惟一一有情，飲母乳酪昔飲幾許，今後若不學解脫道，當飲幾何。此是略喻，更當思惟生死之中，盛事苦事，無所未經，令心厭離。"],["s","那告訴我們，任何一個人，我們所飲的奶汁不曉得多少，如果說我們不求解脫的話，以後還遠超過這個。除了這個以外，還有在生死當中，不管任何一件事情，苦事、壞事沒有不經過的。而所有經過的事情，沒有一個例外，永遠就是這個行相，永遠沒有夠的時候，永遠沒停止的時候。結果呢實際上狀態，沒有停止的內容是什麼？唉！一點點小小的快樂，這個是虛假的，帶來是無比的痛苦，帶來無比的痛苦。所以想到這裡，要厭離啊，要厭離啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-05/007.mp3"},{"文":"若謂受樂令意滿足，然三有樂，任受幾多，非但無飽，後後轉復增長貪愛，由此長夜馳騁生死，經無量劫，受諸至極難忍大苦，然其安樂不及一分。","口譯":"如果認為受樂能令心意滿足，然而三有的快樂，不論受用多少，不但不會飽足，反而後後更增長貪愛；由此在長夜中奔馳於生死，經過無量劫，承受各種極其難忍的大苦，然而所得的安樂連一分都比不上。","四家合註":null,"覺燈日光":null,"時":"70B 19:51","頁":163,"af":"70b","st":1191,"et":1254,"消文":[{"文":"假定受了快樂可以使我們滿足，那倒好；但三有當中不管受多少，永遠沒有滿足的時候，而且越來越厲害。"},{"類":"例","文":"現在貪小小的一口之食，將來烊銅熱鐵丸，實在不值得。"},{"文":"那個痛苦是無量無邊，所受的快樂是一點點。"}],"延伸":[],"逐字稿":[{"t":"70B 19:51","b":[["q","若謂受樂令意滿足，然三有樂，任受幾多，非但無飽，後後轉復增長貪愛，"],["s","假定說，你受了快樂可以使得我們滿足的話，真的能滿足那倒好呀！但是三有當中，不管哪一個，不管你受多少，你永遠沒有滿足的時候，不但沒滿足，而且越來越厲害，越來越厲害！"]]},{"t":"70B 20:18","b":[["q","由此長夜馳騁生死，經無量劫，受諸至極難忍大苦，"],["s","就因為這個，然後無量無邊劫受無邊大苦。現在我們貪小小的一口之食，將來烊銅熱鐵丸，到那時候好可怕，好可怕！唉呀，所以想到那個，實在是不值得，實在不值得啊！"]]},{"t":"70B 20:47","b":[["q","然其安樂不及一分。"],["s","那個痛苦是無量無邊，所受的快樂是一點點。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/008.mp3"},{"文":"如《親友書》云：「如諸癩人為蟲癢，為安樂故雖近火，然不能息應了知，«貪著諸欲亦如是»。」","口譯":"如《親友書》說：「就像患癩病的人被蟲咬得發癢，為了求得安樂而去靠近火，然而並不能止息痛苦；應當了知，貪著諸欲也是這樣。」","四家合註":null,"覺燈日光":null,"時":"70B 20:54","頁":163,"af":"70b","st":1254,"et":1362,"消文":[{"文":"「癩」就是痲瘋病。"}],"延伸":[{"題":"貪著諸欲亦如是","組":[{"題":"癩人近火，越烤越癢","說":[{"類":"例","文":"新莊樂生痲瘋院，聽他們敘述：寧願拿火來烤，肉都燒焦了，外面痛得要命，裡面還在癢。"},{"類":"喻","文":"自己身上癢了去抓，那真是越抓越癢；我們的貪心就是這麼嚴重法。"},{"類":"立","文":"這個東西比起地獄的猛火來，還不曉得差多少。"}]},{"題":"貪瞋心相感餓鬼苦","說":[{"類":"因","文":"平常心裡貪、瞋的心相，就是將來到地獄裡去感得餓鬼的；猛利的貪生起，永遠不得滿足。"},{"類":"例","文":"貪心的人好東西樣樣顧自己，完全顧不到人家，沒有積一點福報，所以將來吃的時候找不到東西吃。"}]},{"題":"多思惟觀察，靜息轉變","說":[{"類":"下手","文":"眼前了解了因果關係，就明白將來果性的狀態；現在多思惟、多觀察，是唯一的方法來靜息、轉變它。"}]}],"說":[{"類":"例","文":"新莊樂生痲瘋院，聽他們敘述：寧願拿火來烤，肉都燒焦了，外面痛得要命，裡面還在癢。"},{"類":"喻","文":"自己身上癢了去抓，那真是越抓越癢；我們的貪心就是這麼嚴重法。"},{"類":"立","文":"這個東西比起地獄的猛火來，還不曉得差多少。"},{"類":"因","文":"平常心裡貪、瞋的心相，就是將來到地獄裡去感得餓鬼的；猛利的貪生起，永遠不得滿足。"},{"類":"例","文":"貪心的人好東西樣樣顧自己，完全顧不到人家，沒有積一點福報，所以將來吃的時候找不到東西吃。"},{"類":"下手","文":"眼前了解了因果關係，就明白將來果性的狀態；現在多思惟、多觀察，是唯一的方法來靜息、轉變它。"}],"af":"70b","st":1260}],"逐字稿":[{"t":"70B 20:54","b":[["q","如《親友書》云：「如諸癩人為蟲癢，為安樂故雖近火，然不能息應了知，貪著諸欲亦如是。」"],["s","就像那個生癩，「癩」就是痲瘋病，啊！這個痲瘋病的可怕，不曉得你們去過沒有？這新莊有個樂生痲瘋院，我去過一次，我聽他們敘述說這個事情，當時沒有什麼感覺。有的時候自己身上癢了以後，你去抓抓，啊，那真是越抓越癢。但是比起那個痲瘋病，那個痲瘋病的痛苦，他實在是受不了，受不了到什麼程度？他寧願拿那個火來烤。對不起，烤得那個肉都燒焦了，他那個外面是痛得要命，裡面還在癢。啊！這個東西，那我們這個貪心就是這麼嚴重法，這個這麼嚴重法。可是這個東西比起地獄的猛火來，那還不曉得多少。"]]},{"t":"70B 21:46","b":[["s","所以平常我們的心裡邊，這種貪、瞋的心相，那個就是將來到地獄裡面去感得餓鬼的，所以你長劫受苦的就是這樣。眼前哪，我們到那時候，一到那時候猛利的貪生起來了，你永遠不得滿足的，就是這個心。將來為什麼會感得那餓鬼，就是這樣，你就永遠不能滿足。那麼偏偏貪心的人也就是這樣，哎喲，好東西樣樣顧自己，完全顧不到人家，所以沒有積一點福報。所以那個心裡面永遠不得滿足，偏偏又造了這個業，所以他吃的時候，對不起！又找不到東西吃，這個。所以眼前你了解了這個因果關係的話，你很明白就了解將來這果性的狀態。所以我們現在多思惟、多觀察，那唯一的方法，來靜息、轉變它。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/009.mp3"},{"文":"《弟子書》亦云：「豈有百返未經趣，豈有昔未多受樂，未得吉祥如白拂，豈有是事反增貪。豈有昔未多經苦，眾生無欲能飽滿，無有情腹未曾臥，然何生死不離貪。」應如是思。","口譯":"《弟子書》也說：「哪有哪一趣是我們沒有百次往返經歷過的？哪有過去沒有多次受過的快樂？哪有沒有得過、如白拂般的吉祥？有了這些，反而增長貪欲。哪有過去沒有多次經歷過的苦？眾生的欲望沒有能夠飽滿的時候；沒有哪一位有情的腹中，是我們不曾臥過的；然而為什麼在生死中還不離貪？」應當這樣思惟。","四家合註":null,"覺燈日光":null,"時":"70B 22:42","頁":163,"af":"70b","st":1362,"et":1463,"消文":[{"文":"「百」不是說一百趟，是「泛百」：任何一趣都經過無量無邊，任何快樂都受過，任何好事情都有過。"},{"文":"有了以後，我們的貪心滿足了嗎？沒有，反而增長；苦也是如此，就因為不能滿足所以受苦。"},{"文":"「無有情腹未曾臥」：互為母子；找不到一個有情例外，都曾經互為母子過，還是不能滿足、不能離開。"},{"文":"應如是思：我們應該這樣去思惟、觀察。"}],"延伸":[],"逐字稿":[{"t":"70B 22:42","b":[["q","《弟子書》亦云：「豈有百返未經趣，豈有昔未多受樂，未得吉祥如白拂，豈有是事反增貪。豈有昔未多經苦，眾生無欲能飽滿，無有情腹未曾臥，然何生死不離貪。」"],["s","那這上面又告訴我們，這個「百」，並不是說一百趟，實際上是「泛百」。就是我們任何一趣當中，任何一趣，都是經過無量無邊，任何一個快樂都受過，任何一個好事情都有過。結果有了以後，對不起，我們的貪心滿足了嗎？對不起，沒有耶，反而增長。唉，還有呢苦也是如此，也是如此啊！正因為你受那個貪，所以受那個苦，就因為我們不能滿足所以受那個苦。然後呢受這個生死的輪迴當中，「無有情腹未曾臥」，這個話什麼意思？就是互為母子，世間的有情是無量無邊找不到邊際，可是又因為我們的生死是無量的，所以人家互為母子。找不到一個人，絕找不到一個有情例外的，所有的有情都曾經做過，互為母子過，這麼多！結果呢，對不起，還是不能滿足，我們也不能離開。"]]},{"t":"70B 24:18","b":[["q","應如是思。"],["s","我們應該這樣去思惟、觀察啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-05/010.mp3"},{"文":"又如《除憂經》說而思«極能厭離»，","口譯":"又如《除憂經》所說的去思惟，最能生起厭離。","四家合註":null,"覺燈日光":null,"時":"70B 24:23","頁":163,"af":"70b","st":1463,"et":1577,"消文":[{"文":"照著除憂苦的經上面這樣思惟的話，你就很容易了。"}],"延伸":[{"題":"極能厭離","組":[{"題":"怕而不敢聽聞","說":[{"類":"例","文":"有人告訴我：「法師啊！聽了這個，我就不敢聽、不敢看了，看看都好怕，做也做不到。」"},{"類":"回扣","文":"以前我也這樣想，後來不。"}]},{"題":"退下來死路一條","說":[{"類":"因","文":"做不到退下來，退下來安樂嗎？假如退下來安樂，誰也不願意做，我是第一個不願意做。"},{"類":"立","文":"退下來只有一條路：死路一條，永遠受無邊的大苦。"}]},{"題":"咬緊牙關，向前衝","說":[{"類":"下手","文":"眼前雖然做不到，只要咬緊牙關慢慢地做，做到了，問題都解決。"},{"類":"立","文":"那一點做不到並沒有苦，只是心裡一點恐怖；這一點恐怖擋不住，將來大苦怎麼擋得住？想到這裡，一定向前衝。"}]},{"題":"主要的是正知見","說":[{"類":"立","文":"說來說去主要的是正知見：把事情的問題看得、認得很正確了，問題都會解決。"},{"類":"回扣","文":"照著經上面這樣去做，一定能夠產生厭離。"}]}],"說":[{"類":"例","文":"有人告訴我：「法師啊！聽了這個，我就不敢聽、不敢看了，看看都好怕，做也做不到。」"},{"類":"回扣","文":"以前我也這樣想，後來不。"},{"類":"因","文":"做不到退下來，退下來安樂嗎？假如退下來安樂，誰也不願意做，我是第一個不願意做。"},{"類":"立","文":"退下來只有一條路：死路一條，永遠受無邊的大苦。"},{"類":"下手","文":"眼前雖然做不到，只要咬緊牙關慢慢地做，做到了，問題都解決。"},{"類":"立","文":"那一點做不到並沒有苦，只是心裡一點恐怖；這一點恐怖擋不住，將來大苦怎麼擋得住？想到這裡，一定向前衝。"},{"類":"立","文":"說來說去主要的是正知見：把事情的問題看得、認得很正確了，問題都會解決。"},{"類":"回扣","文":"照著經上面這樣去做，一定能夠產生厭離。"}],"af":"70b","st":1470}],"逐字稿":[{"t":"70B 24:23","b":[["q","又如《除憂經》說而思極能厭離，"],["s","照著除憂苦的經上面這樣思惟的話，你就很容易了，很容易了。說實在，有的人讀那個經，有的人曾經告訴我：「唉呀，法師啊！聽了這個，我就不敢聽、不敢看了。」我說：「為什麼？」「唉呀，看看那個都好怕哦，就是這樣，做也做不到。」如果是你們碰到這種情況，你們怎麼說？以前我也這樣想，後來不，後來不！因為你做不到的結果你退下來，退下來安樂嗎？假如退下來安樂的話，誰也不願意做，我是第一個絕對不願意做，喔唷，做這個苦事情幹什麼！因為你退下來，是只有一條路 ─死路一條，永遠受無邊的大苦。你現在這樣做地做下去的話，欸，你眼前雖然做不到，你只要咬緊牙關慢慢地做的話，做到；做到了以後，問題都解決。這眼前雖然你心裡面覺得：啊，有一點做不到。那一點做不到，實際上並沒有苦欸，只是心裡面一點恐怖，對不對？你這一點心裡的恐怖擋不住，將來這個大苦你怎麼擋得住啊！所以你想到這裡的話，你一定向前衝。"]]},{"t":"70B 25:41","b":[["s","所以說來說去，主要的是什麼 ─正知見。你就把那事情的問題看得、認得得很正確了以後，這問題都會解決的。你如果仔細想想：啊，發現了！努力地一心只有向上。所以這一點是告訴我們：所以我們要照著這個經上面，能夠這樣去做的話，那一定能夠產生厭離，一定能夠產生厭離。現在我們繼續下去："]]}],"口譯音":"口譯音檔/siwei-kudi-05/011.mp3"},{"文":"如云：「數於地獄中，«所飲諸烊銅»，雖大海中水，非有爾許量。生諸犬豕中，所食諸不淨，其量極超過，須彌山王量。又於生死中，由離諸親友，所泣諸淚滴，非海能為器。由互相鬥諍，積所截頭首，如是高聳量，出過梵世間。為蟲極飢虛，所噉諸土糞，於大乳海中，充滿極高盛。」","口譯":"如說：「屢次在地獄中，所飲下的烊銅，即使是大海中的水，也沒有那麼多。生在狗、豬之中，所吃的各種不淨物，數量遠遠超過須彌山王。又在生死之中，因為與親友別離，所哭泣的淚滴，大海也裝不下。因為互相鬥爭，所積下被砍斷的頭，高聳的程度超過梵天世間。成為蟲時極其飢餓，所吃的泥土糞便，即使放在大乳海中，也會充滿得極高。」","四家合註":null,"覺燈日光":null,"時":"70B 26:17","頁":163,"af":"70b","st":1577,"et":null,"消文":[{"文":"在地獄當中所飲的烊銅，超過大海水。"},{"文":"犬豕當中所吃的不淨，高過須彌山：這是對貪飲食的人。"},{"文":"別離了以後流的眼淚：對親友難分別、難捨的人；想到這一點，沒有一點捨不掉的。"},{"文":"鬥爭乃至送掉性命，那個頭積起來高過梵世：對瞋心大的人。"},{"文":"墮落小蟲當中，吃大糞、土也這麼多。"}],"延伸":[{"題":"所飲諸烊銅","組":[{"題":"想到烊銅，貪心不起","說":[{"類":"立","文":"想到這一點，那個貪心實在一點都生不起來。"}]},{"題":"鋁錠一摸，手整個爛","說":[{"類":"例","文":"不要說熱鐵丸，鐵在火裡燒五分鐘，還是黑黑的看不出來，你摸它一下看。"},{"類":"例","文":"同班同學參觀高雄鋁廠，鋁錠拿出來看起來好好的，他好玩一摸，當時沒感覺，打開手整個地爛了。"}]},{"題":"受小苦，免大苦","說":[{"類":"破","文":"這種地方不要單單聽聽、結結緣，覺得滿好玩的。"},{"類":"下手","文":"真的希望感受得到，最好自己試一試：開水燒到一百度，用左手的手指伸下去；不要用做事的手指。"},{"類":"下手","文":"嘴饞又來了，就再燙一下，割開放一點鹽、你歡喜吃的醬油上去試試看。"},{"類":"立","文":"現在受一點小小的痛苦，將來可以免除極大的痛苦；方法笨一點，卻收效最快。"}]},{"題":"以自己的量去想","說":[{"類":"下手","文":"這個方法並不善巧，可是不妨以你們自己的量去想一下。"}]}],"說":[{"類":"立","文":"想到這一點，那個貪心實在一點都生不起來。"},{"類":"例","文":"不要說熱鐵丸，鐵在火裡燒五分鐘，還是黑黑的看不出來，你摸它一下看。"},{"類":"例","文":"同班同學參觀高雄鋁廠，鋁錠拿出來看起來好好的，他好玩一摸，當時沒感覺，打開手整個地爛了。"},{"類":"破","文":"這種地方不要單單聽聽、結結緣，覺得滿好玩的。"},{"類":"下手","文":"真的希望感受得到，最好自己試一試：開水燒到一百度，用左手的手指伸下去；不要用做事的手指。"},{"類":"下手","文":"嘴饞又來了，就再燙一下，割開放一點鹽、你歡喜吃的醬油上去試試看。"},{"類":"立","文":"現在受一點小小的痛苦，將來可以免除極大的痛苦；方法笨一點，卻收效最快。"},{"類":"下手","文":"這個方法並不善巧，可是不妨以你們自己的量去想一下。"}],"af":"70b","st":1620}],"逐字稿":[{"t":"70B 26:17","b":[["q","如云：「數於地獄中，所飲諸烊銅，雖大海中水，非有爾許量。生諸犬豕中，所食諸不淨，其量極超過，須彌山王量。又於生死中，由離諸親友，所泣諸淚滴，非海能為器。由互相鬥諍，積所截頭首，如是高聳量，出過梵世間。為蟲極飢虛，所噉諸土糞，於大乳海中，充滿極高盛。」"],["s","你看看，經上面告訴我們：啊！我們在地獄當中所飲的烊銅，超過大海水。唉呀！想到這一點，想到這一點哪，那個貪心實在一點都生不起來，想到這一點，那貪心實在一點生不起來！我們不要說飲大海水的烊銅，不要說熱鐵丸，你們試試看，把那個鐵燒得啊，不要說燒紅哦！把那個鐵擺在火裡面燒它五分鐘，還是黑黑的一點看不見，你們摸它一下看，你們不妨摸它一下看。我有一個同學，我們同班的，有一次我們一起去參觀高雄那個鋁廠，那個鋁錠拿出來，就是這個從原料當中拿出來以後，放在邊上，放在邊上。那時候已經完全變成鋁錠，一點看不見，像好好的。嘿！他老兄好玩地跑得去一摸，這就這樣。這一摸，旁邊人告訴他：「欸，這個不能摸的！」把那手馬上就一下打開，打開當時感覺不到。打開完了以後，發現那個手整個地爛了，整個地爛了，這個就這麼厲害哦，這樣啊！"]]},{"t":"70B 28:19","b":[["s","所以，這種地方我們不要單單，如果想真正聽聽、結結緣，那也就罷了。啊，反正覺得滿好玩的，倒真是滿好玩的。你覺得滿好玩，願意看看也有好處哦！如果你要真的希望，這個心情能夠感受得到的話，你最好自己試一試。可是不要吞下去，吞下這個受不了哦，你手上面去試一下。那個開水燒了一百度，把那手指伸下去，不要用那個手指，用那個手指，為什麼原因？因為那個手指要做事情的。或者用左手的手指，然後你弄，萬一到那時候你又來了，放那邊又燙它一下。如果你覺得燙的太不行的話，你割開來放一點鹽上去。然後呢你歡喜吃醬油嘛，你歡喜吃那些嘛，你要歡喜吃的東西，你放上去試試看。你來了幾趟以後，大概我想可以稍微對我們有一點幫助。現在受一點小小的痛苦，將來可以免除極大的痛苦哦！所以說如果自己想有心痛改的話，這個自然 ……也許這個方法太笨了一點，但是卻它收效最快。"]]},{"t":"71A 00:05","b":[["s","所以我告訴你們，你們要燙手指，不要燙這個，燙這個的原因在這個地方。這是隨便啊 ……雖然這個是並不善巧，可是卻是不妨以你們自己的量去想一下。然後呢在這個犬豕當中所吃的不淨，高過於須彌山。這個是對貪的人，對貪什麼？飲食等等。還有呢，對親友難分別的人，「又於生死中」別離，別離了以後，我們流的眼淚已經高過這樣，你想到了這一點，哎呀，難捨的這種事情，沒有一點捨不掉的，沒有一點捨不掉。還有呢如果瞋心大的話，你看看哪，是為了大家一點鬥爭 ─這個平常我們鬥爭總不至於送掉性命吧！鬥爭乃至於把命送掉，那個頭積起來高過於梵世。唉，那個是不得了啊！然後呢，我們墮落小蟲當中吃這個大糞、土，也這麼多啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-05/012.mp3"},{"文":"«如是又如»《華嚴經》云：","口譯":"像這樣，又如《華嚴經》說：","四家合註":null,"覺燈日光":null,"時":"71A 01:20","頁":163,"af":"71a","st":80,"et":126,"消文":[{"文":"他不斷地用經上面的證。"}],"延伸":[{"題":"如是又如","組":[{"題":"種種引證，觸到我心","說":[{"類":"立","文":"不斷引經，無非是用種種方式，引得越多，總有一個地方能夠觸到我們的心。"}]},{"題":"觸到了停下來加深","說":[{"類":"下手","文":"觸到的時候不要輕輕放過，想辦法加深這個相應的感觸，力量就從這個地方產生。"},{"類":"下手","文":"平常儘量多去研閱；一下觸到了，停在那個地方：「唉呀，對呀！」使心量慢慢加強堅固。"},{"類":"立","文":"這樣三番五次努力，以後就容易慢慢產生對治的效應。"}]}],"說":[{"類":"立","文":"不斷引經，無非是用種種方式，引得越多，總有一個地方能夠觸到我們的心。"},{"類":"下手","文":"觸到的時候不要輕輕放過，想辦法加深這個相應的感觸，力量就從這個地方產生。"},{"類":"下手","文":"平常儘量多去研閱；一下觸到了，停在那個地方：「唉呀，對呀！」使心量慢慢加強堅固。"},{"類":"立","文":"這樣三番五次努力，以後就容易慢慢產生對治的效應。"}],"af":"71a","st":80}],"逐字稿":[{"t":"71A 01:20","b":[["q","如是又如《華嚴經》云："],["s","他不斷地用那個經上面的證，無非是用種種方式，總是我們越多，總有一個地方能夠觸到我們的心，那個時候不要輕輕放過哦！當你觸到了這個心上面的時候，你要想辦法把你這個相應的感觸，那個時候加深它，那個力量就從這個地方產生的，那個地方產生的。所以你平常的時候儘量地多去研閱，當一下觸到了，你停在那個地方。唉呀，對呀！使得這個心量慢慢地加強堅固、加強堅固。你這樣地經過三番五次努力，以後就容易慢慢、慢慢地產生對治這種效應。那麼《華嚴》怎樣說呢？"]]}],"口譯音":"口譯音檔/siwei-kudi-05/013.mp3"},{"文":"「汝應憶念為諸欲，徒耗諸身前邊際，今求菩提具禁戒，«由禁於此摧諸欲»。汝應憶念為諸欲，徒耗諸身前邊際，未能承事恆沙佛，未從佛聞如是語。」","口譯":"「你應當憶念：為了諸欲，白白耗費了無數的身體，前際沒有邊際；如今求菩提、具足禁戒，就要藉著禁戒在此摧毀諸欲。你應當憶念：為了諸欲，白白耗費了無數的身體，前際沒有邊際；卻沒能承事如恆河沙數的佛，也沒有從佛那裡聽聞這樣的教言。」","四家合註":null,"覺燈日光":null,"時":"71A 02:06","頁":163,"af":"71a","st":126,"et":243,"消文":[{"文":"前面單單從苦那一方面，這裡正面告訴我們：為了無理的貪欲，虛耗的生命不曉得無量無邊。"},{"文":"現在為了解決這個無義的痛苦，一心努力如法行持，依戒定慧，趁這個機會把欲摧毀。"}],"延伸":[{"題":"由禁於此摧諸欲","組":[{"題":"到這裡來為什麼","說":[{"類":"立","文":"跑到這地方來，正應該努力的就在這地方，這是最重要的。"},{"類":"破","文":"跑到這裡來還嘻哈放不下，千真萬確的，脫下衣服回家去；先懺悔，等到有了力量再來。"},{"類":"下手","文":"出家人要問：「我跑到這個地方來，為什麼要做這個的！」"}]},{"題":"做不到寧可捨戒","說":[{"類":"例","文":"有一位同修，持了戒做不到就捨戒，必要時連沙彌都不要，做淨人伺候大家，必要時回家吃盡苦頭再來。"},{"類":"立","文":"這個才是有志氣！每一樣事情，我們應該了解這一點。"}]}],"說":[{"類":"立","文":"跑到這地方來，正應該努力的就在這地方，這是最重要的。"},{"類":"破","文":"跑到這裡來還嘻哈放不下，千真萬確的，脫下衣服回家去；先懺悔，等到有了力量再來。"},{"類":"下手","文":"出家人要問：「我跑到這個地方來，為什麼要做這個的！」"},{"類":"例","文":"有一位同修，持了戒做不到就捨戒，必要時連沙彌都不要，做淨人伺候大家，必要時回家吃盡苦頭再來。"},{"類":"立","文":"這個才是有志氣！每一樣事情，我們應該了解這一點。"}],"af":"71a","st":170}],"逐字稿":[{"t":"71A 02:06","b":[["q","「汝應憶念為諸欲，徒耗諸身前邊際，今求菩提具禁戒，由禁於此摧諸欲。汝應憶念為諸欲，徒耗諸身前邊際，未能承事恆沙佛，未從佛聞如是語。」"],["s","它經上面，前面是單單從苦的那一方面，這個方面又正面地告訴我們：你想想看呀，我們為了前面這種無理的貪欲，然後呢虛耗的這個生命，不曉得無量無邊哪！現在是為了解決這個無義的痛苦，然後一心努力地如法行持，然後呢依戒定慧這樣，應該努力趁這個機會，把這個欲摧毀呀！在我們這裡，的的確確正應該努力的。所以跑到這地方來，我們正應該努力的在這地方，這一點這是最重要。如果跑到這個地方來，這個地方還是嘻哈放不下，這個千真萬確的，脫下衣服回家去；先懺悔，等到有了力量再來。嘻嘻哈哈那在家人的事情，出家人做的事情是這個，說：「我跑到這個地方來，為什麼要做這個的！」嗯，那麼這樣。所以我們這裡有一位同修我非常讚歎他，他覺得：我持了戒做不到，捨戒。乃至於必要的時候，連它沙彌都不要，然後做淨人伺候你們，必要的時候回家去，然後吃盡了苦頭再來。這個才是有志氣！這個每一樣事情，應該我們要了解這一點哪！"]]}],"口譯音":"口譯音檔/siwei-kudi-05/014.mp3"},{"文":"謂盡所得三有盛事，悉皆欺誑，領受無量無義大苦。","口譯":"就是說，所得到的一切三有的興盛之事，全都是欺誑，因而領受無量的、毫無意義的大苦。","四家合註":null,"覺燈日光":null,"時":"71A 04:03","頁":163,"af":"71a","st":243,"et":286,"消文":[{"文":"三有之間一切好事都是「欺誑」：一點點地騙了你，結果受無量無邊大苦，這大苦還是無義的。"},{"文":"修行不是快樂的事，修行是苦事，但修行是小苦而有大義；現在是大苦而又無義，這要萬萬分別清楚。"}],"延伸":[],"逐字稿":[{"t":"71A 04:03","b":[["q","謂盡所得三有盛事，悉皆欺誑，領受無量無義大苦。"],["s","不管你得到的三有之間一切好事，那個都是什麼？「欺誑」兩個字。它騙了你，一點點地騙了你，結果呢受無量無邊大苦，這個大苦還是無義的。為什麼說「無義大苦」？我們修行不是一件快樂的哦，修行是一件苦事哦！欸，但是修行 ─這個小苦而有大義！它現在呢大苦而又無義，這個我們要分別得清楚哦！欸，這個要萬萬地要分別得清楚。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/015.mp3"},{"文":"如前唐捐無量色身，皆當憶念，若後仍不策勵勤修，更當如是，思惟此理，令起厭離。","口譯":"像以前那樣白白耗費了無量的色身，都應當憶念；如果以後仍然不策勵勤修，還會再像這樣，思惟這個道理，令心生起厭離。","四家合註":null,"覺燈日光":null,"時":"71A 04:46","頁":163,"af":"71a","st":286,"et":333,"消文":[{"文":"以前不曉得白白消耗掉了多少，應該好好地思惟。"},{"文":"以後還不努力，還是這樣；不要讓難得的暇滿人身空空浪費，何況還去非理作意，把自己送到惡道。"}],"延伸":[],"逐字稿":[{"t":"71A 04:46","b":[["q","如前唐捐無量色身，皆當憶念，"],["s","以前已經不曉得白白地消耗掉了，這個東西應該好好地思惟啊！"]]},{"t":"71A 04:57","b":[["q","若後仍不策勵勤修，更當如是，思惟此理，令起厭離。"],["s","如果以後我們還不努力的話，以後還是這樣啊，這個是我們應該如法去思惟的，不要讓我們難得的暇滿的人身空空浪費掉。空空浪費都不可以，何況還要去思惟非理作意，把自己送到惡道當中去啊！所以這一點一定要生起這個厭離心啊！那個祖師怎麼說啊？"]]}],"口譯音":"口譯音檔/siwei-kudi-05/016.mp3"},{"文":"慬哦瓦云：「覺𡁮敦巴從無始來，曾受何身，然皆未修大乘正法，猶如今日，«故須策勵»。」","口譯":"慬哦瓦說：「覺𡁮敦巴！從無始以來，曾經受過什麼樣的身體？然而都沒有像今天這樣修習大乘正法，所以必須策勵。」","四家合註":null,"覺燈日光":null,"時":"71A 05:33","頁":163,"af":"71a","st":333,"et":476,"消文":[{"文":"無始以來受各式各樣的身，沒有修正法，尤其是大乘正法；像今天這樣認真從來沒有過，所以趕快努力。"}],"延伸":[{"題":"故須策勵","組":[{"題":"一心仰望祖師","說":[{"類":"例","文":"人家勸祖師休息一下，他說：「照理應該休息，但一想到生死痛苦、暇滿人身，我就停不住了。」"},{"類":"下手","文":"真正講修行要把這個作為榜樣：把古德的傳記擺在腦筋裡面，一心仰望，我要學他。"}]},{"題":"貪著丟到東洋大海","說":[{"類":"破","文":"不要說這個人難捨、這個東西難捨，這也不行、那也不行。"},{"類":"下手","文":"腦筋裡放不下的貪著，要丟到東洋大海。"}]},{"題":"好吃趕快送掉","說":[{"類":"例","文":"居士送來很多梅乾菜，說好吃就留著，結果放到生蟲；我的話，好吃趕快送掉。"},{"類":"立","文":"祖師公案說增長貪心；我只要把肚子塞飽就好，人家弄很多好吃的，我眉頭皺皺、心裡害怕，因為貪心還是很重。"},{"類":"回扣","文":"要看祖師怎麼做，這個才是我們到這裡來的目標。"}]}],"說":[{"類":"例","文":"人家勸祖師休息一下，他說：「照理應該休息，但一想到生死痛苦、暇滿人身，我就停不住了。」"},{"類":"下手","文":"真正講修行要把這個作為榜樣：把古德的傳記擺在腦筋裡面，一心仰望，我要學他。"},{"類":"破","文":"不要說這個人難捨、這個東西難捨，這也不行、那也不行。"},{"類":"下手","文":"腦筋裡放不下的貪著，要丟到東洋大海。"},{"類":"例","文":"居士送來很多梅乾菜，說好吃就留著，結果放到生蟲；我的話，好吃趕快送掉。"},{"類":"立","文":"祖師公案說增長貪心；我只要把肚子塞飽就好，人家弄很多好吃的，我眉頭皺皺、心裡害怕，因為貪心還是很重。"},{"類":"回扣","文":"要看祖師怎麼做，這個才是我們到這裡來的目標。"}],"af":"71a","st":355}],"逐字稿":[{"t":"71A 05:33","b":[["q","慬哦瓦云：「覺𡁮敦巴從無始來，曾受何身，然皆未修大乘正法，猶如今日，故須策勵。」"],["s","啊！說從無始以來，這個受各式各樣的身，但是沒有修正法，尤其是「大乘正法」，像今天這樣認真從來沒有過，所以今天居然做了，趕快努力啊！記得那個祖師前面有一段話吧？人家看見他用功得不得了，就說：「某人哪，你這麼用功你休息一下呀！」他說：「對呀，照理應該休息一下，但是我一想到這個生死痛苦、暇滿人身，我就停不住了。」嗯，這樣，那祖師的典型的公案，我們真正講修行，要把這個作為榜樣。所以他又說，我是仰望於 ……是怎麼講？「一心仰望這個，把古德的傳記擺在腦筋裡面，一心仰望，我要學他、我要學他啊！」我們千萬把腦筋裡面放不下的這種貪著，要丟到東洋大海。不要說這個人難捨，這個東西難捨，這樣。這個也不行，那個也不行，所以這些東西千萬要捨掉啊！"]]},{"t":"71A 07:01","b":[["s","我想到了這個，最近哪，早一陣子我剛來的時候，看見我們這裡有很多這個梅乾菜，那個的確是非常好的東西。我說：「唉呀，我們這麼多，就送掉一點啊！」就有一個人說：「噢，這個東西很好吃呀！」「哦，這樣。那吃不完嘛，就送掉。」結果大家也是放那裡，最近我聽說生蟲了。你看，人家居士一番好心送到這個地方來。唉！這種地方 ……。這要我的話，好吃，好吃趕快送掉。我看見很多祖師這種公案，那增長貪心，就增長貪心啊，我只要把肚子塞飽了那個是最好。所以人家弄很多好吃東西，我看見了就眉頭皺皺，心裡就害怕，就因為我的貪心還是很重呀！這個地方要看看那個祖師，祖師怎麼做的，這個才是我們到這裡來的目標。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/017.mp3"},{"文":"又如桑樸瓦云：「此生死中須多仰覆，此於心中實覺不安。」","口譯":"又如桑樸瓦說：「在這生死之中，必須多次反覆思惟，這在心中確實會覺得不安。」","四家合註":null,"覺燈日光":null,"時":"71A 07:56","頁":164,"af":"71a","st":476,"et":518,"消文":[{"文":"「仰覆」：反覆地多多思惟；這樣心裡就不會像現在「快樂得很」，就不安了。"},{"文":"前面說思惟這個「坐起慞慌，腦漿炎熱」：坐立不安，心裡像火燒，害怕得要命，一心求脫，那就對了。"}],"延伸":[],"逐字稿":[{"t":"71A 07:56","b":[["q","又如桑樸瓦云：「此生死中須多仰覆，此於心中實覺不安。」"],["s","這個在現在生死輪迴當中，我們都要 ……什麼叫「仰覆」？反覆地多多思惟。你能夠反覆地多多思惟，你心裡面就不會像現在這樣 ─哎呀，快樂得很啊！就不安了。於是你說怎麼辦哪？啊！他前面告訴我們思惟這個東西，「坐起慞慌，腦漿炎熱」。啊，你坐立不安！唉呀，那個時候那個心裡面就是，就像火燒一樣的話，你實在是害怕得要命，一心求脫，那就對了。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/018.mp3"},{"文":"乃至未能起心如此，須勤思惟，縱起亦當«恆常修習»。","口譯":"乃至還沒能生起這樣的心以前，必須勤加思惟；縱然生起了，也應當恆常修習。","四家合註":null,"覺燈日光":null,"時":"71A 08:38","頁":164,"af":"71a","st":518,"et":950,"消文":[{"文":"心裡還沒生起要努力，縱然生起了還要繼續不斷。"}],"延伸":[{"題":"恆常修習","組":[{"題":"每段必勸，修行即此","說":[{"類":"立","文":"每一段講完了，一定告訴我們這幾句話；我們修行的時候，沒有別的就是這個。"}]},{"題":"莫求高高大法","說":[{"類":"破","文":"不必好高騖遠：「哪一個大法，哪一個大師呀！」有人聽說大上師要來灌頂，又想辦法要去灌頂。"},{"類":"立","文":"佛早就說得清清楚楚，從那個根本上面去做就行了。"}]},{"題":"低處修時高處到","說":[{"類":"例","文":"白教真正的祖師：馬爾巴、密勒日巴、岡波巴；密勒日巴尊者千古奇人。"},{"類":"立","文":"「低處修時高處到，慢慢修時是快快到，一人修時是兩人到」：你不必忙著幫一切人，先把自己弄好。"}]},{"題":"密勒日巴蕁麻苦行","說":[{"類":"例","文":"肉乾生了蟲，他想：「牠也吃，我也吃，怎麼可以搶牠？」寧可餓肚子讓蟲吃。"},{"類":"例","文":"發誓此生不證道不為八風所動；餓了幾天想到餓死不能修行，才出去討吃的，看見蕁麻，一直吃到身上長出綠毛。"},{"類":"例","文":"我到印度一碰蕁麻，手癢了兩天；想想古人，我哭了好幾次：人家吃這個，我還要醬油、麻油一大堆。"}]},{"題":"自看如兔，所以成就","說":[{"類":"例","文":"妹妹勸他學那位很神氣、弟子很多、吃得很好的大喇嘛，他說：「獅子跳的路，兔子我不敢跳啊！」"},{"類":"立","文":"他一生這麼高的成就，就靠這個：自己曉得我條件差。"},{"類":"破","文":"我們還看得自己很高：這個不行、那個瞧不起、這也不要那也不要，所以我們不成就。"}]},{"題":"基礎要堅穩","說":[{"類":"立","文":"我們真正要思惟觀察的，不是高高大法，而是這個地方的基本。"},{"類":"回扣","文":"死念生起來了，眼前還放不下嗎？對苦了解了，還會去找那些事情嗎？這是共下士道。"},{"類":"下手","文":"不要急著忙這個忙那個，「慢慢修時是快快到」，欲速不達，基礎要堅穩。"}]}],"說":[{"類":"立","文":"每一段講完了，一定告訴我們這幾句話；我們修行的時候，沒有別的就是這個。"},{"類":"破","文":"不必好高騖遠：「哪一個大法，哪一個大師呀！」有人聽說大上師要來灌頂，又想辦法要去灌頂。"},{"類":"立","文":"佛早就說得清清楚楚，從那個根本上面去做就行了。"},{"類":"例","文":"白教真正的祖師：馬爾巴、密勒日巴、岡波巴；密勒日巴尊者千古奇人。"},{"類":"立","文":"「低處修時高處到，慢慢修時是快快到，一人修時是兩人到」：你不必忙著幫一切人，先把自己弄好。"},{"類":"例","文":"肉乾生了蟲，他想：「牠也吃，我也吃，怎麼可以搶牠？」寧可餓肚子讓蟲吃。"},{"類":"例","文":"發誓此生不證道不為八風所動；餓了幾天想到餓死不能修行，才出去討吃的，看見蕁麻，一直吃到身上長出綠毛。"},{"類":"例","文":"我到印度一碰蕁麻，手癢了兩天；想想古人，我哭了好幾次：人家吃這個，我還要醬油、麻油一大堆。"},{"類":"例","文":"妹妹勸他學那位很神氣、弟子很多、吃得很好的大喇嘛，他說：「獅子跳的路，兔子我不敢跳啊！」"},{"類":"立","文":"他一生這麼高的成就，就靠這個：自己曉得我條件差。"},{"類":"破","文":"我們還看得自己很高：這個不行、那個瞧不起、這也不要那也不要，所以我們不成就。"},{"類":"立","文":"我們真正要思惟觀察的，不是高高大法，而是這個地方的基本。"},{"類":"回扣","文":"死念生起來了，眼前還放不下嗎？對苦了解了，還會去找那些事情嗎？這是共下士道。"},{"類":"下手","文":"不要急著忙這個忙那個，「慢慢修時是快快到」，欲速不達，基礎要堅穩。"}],"af":"71a","st":530}],"逐字稿":[{"t":"71A 08:38","b":[["q","乃至未能起心如此，須勤思惟，縱起亦當恆常修習。"],["s","說乃至於這個心裡面還沒有生起，要努力，縱然生起了還要繼續不斷。每一段前面講完了，一定告訴我們這幾句話，每一段講完了，一定告訴我們這幾句話。實際上呢，我們修行的時候也就是，沒有別的就是這個。所以我們不必好高騖遠，說：「唉呀，哪一個大法，哪一個大師呀！」佛早就說得清清楚楚了，就是這個樣，你從那個根本上面去做，那就行了。尤其是最近又有人說：「哎喲，最近有一個大上師要來灌頂了。」喔唷，他又想辦法要去灌頂。我就想起來了，據說來那個大上師白教的，這個錫杜佛爺，他的確白教的錫杜佛爺，那是非常精采的，非常了不起的。大寶法王走了以後，他現在認證的工作落在他身上，也可以說那他是第二把交椅。當然白教當中坐第二把交椅有四個上座，他就這個第二把交椅當中的一人，這個倒也是事實。"]]},{"t":"71A 09:57","b":[["s","但是我們不妨說，同樣的白教的真正祖師是哪一個？馬爾巴祖師，然後呢密勒日巴尊者，然後到岡波巴大師再發展開來。而其中尤其是密勒日巴尊者，那真是千古奇人。他說了兩句名言，他怎麼講？叫「低處修時高處到，慢慢修時是快快到，一人修時是兩人到。」你修的時候你慢一點，結果你到得快；你低的地方去修的話，你可以爬到高的地方；你不必忙要幫一切人，你先把你自己弄好。這是千真萬確的事實，千真 ……他真正的成就，就在這個地方，他真正的成就就在這個地方。"]]},{"t":"71A 10:51","b":[["s","所以你們看過他的傳記的人曉得，沒有看過他傳記，我也把它說一下。他那時候修苦行，不得了！人家送給他一點東西，然後呢他是個在家人，尤其是西藏他們那個地方，就是不是像我們，一定要吃葷的 ─送他一點糌粑，送他一點點起士，還有送他一點肉乾。到後來那個肉乾上面生了蟲了，他把那個蟲拿掉，他後來想：「不對呀！牠也吃，我也吃，你怎麼可以搶牠呢？好、好、好！我餓肚子，那個蟲就讓牠吃。」結果他先頭發誓了，說：「如果這一生不證道的話，我絕不為八風所動，絕不為這個生命而跑做任何。如果這樣的話，寧願讓那個護法神把我一下弄死，下一世投胎我再來修！」結果到了眼前，眼看著沒吃東西，餓了幾天，他也不管。後來想：「對呀，我所以發那個是為修行，現在餓死了還是不能修行啊！所以這個並沒有違背我的誓願，那好、好、好，我討一點東西去吃吧！」結果他就跑出去，一跑跑出去，欸，看見了那個綠的蕁麻。"]]},{"t":"71A 12:04","b":[["s","你們不曉得那個蕁麻什麼東西，我這次到印度去才看見。哎呀，那個東西上頭滿身都是草，這個草上綠綠的，那個上面有刺，那個刺有毒的，這個毒不是中的毒哦！那時候我不知道，我就一碰，唉呀，一碰那個手整整癢了兩天，唉，癢得你簡直是不曉得怎麼好！這麼個東西！他居然拿這個東西，它那個嫩頭就把它拿下來，他也不知道怎麼弄的。他們說：「喏喏喏喏！當年密勒日巴吃這個東西。」我當時第一次聽聽也沒有什麼心裡上印象，後來我刺到了，自己去想啦，哎喲！這個東西我哭了好幾次。唉呀，想想古人這樣，我自己實在是好差呀！人家還燒了這個東西，我還嫌這個不對、那個不對。哎呀，還要醬油、麻油一大堆。他那個東西，就吃蕁麻，獵人不是跑得去找他嗎？跟他要一點東西說：「我在打獵半天，我找不到東西吃，你的東西先分我一點，然後我找到了給你。」密勒日巴尊者怎麼說？「哎，我吃的就是那個蕁麻。」「哦，那好好，你總給我一點鹽！」「鹽！有鹽就好了，我吃的就是那個蕁麻。」然後呢，跟他要了幾樣東西，他就說：「我吃的就是這個。」結果因為一直吃那個蕁麻，弄到後來，那個身上面都長出綠的毛來了。"]]},{"t":"71A 13:28","b":[["s","以後他的妹妹不是來找到他了嗎？他的妹妹找到他的時候，那時經過一個地方，一個大喇嘛，哎喲，那個大喇嘛很神氣，然後呢那個弟子很多。他的妹妹就跟他說：「唉呀，哥哥我找了你多少年找得好苦，居然最後找到你了。你在這裡幹什麼？」「修行！」「那你怎麼這麼修行呢！我看見這個修行的大喇嘛，這麼多人擁護，吃得這麼好，他同樣地修行，你為什麼不這樣修行？」密勒日巴尊者怎麼說啊？「獅子跳的路，兔子我不敢跳啊！」他這麼了不起的人，他把他看成是兔子，密勒日巴尊者真正了不起的地方！所以藏傳不管哪一系、哪一派尊重他，他一生有這麼高成就，就靠這個 ─他自己曉得我條件差。其實他條件真的差嗎？如果我們比比，我們絕對沒有一個人比得上他，乃至於百分之一、千分之一，他自己看「我是一個兔子」。哎喲，我們現在還看得自己很高咧，覺得：哎喲！這個不行、那個不行；看看那個瞧不起，那個瞧不起；這個也不要，那個也不要。那所以我們不成就的原因。"]]},{"t":"71A 14:38","b":[["s","所以在這個地方，我們要了解：這種情形我們真正要思惟觀察的，不是它高高大法，而這個地方的基本。所以說「低處修時是高處到」，你把基礎做好了。其實學到現在還是很清楚，一旦你對這個死念生起來了，你現在的眼前的難道還放不下嗎？一旦你對於苦的了解了，你還會去找那些事情嗎？這個死、這個苦什麼？共下士道啊，「阿彌陀佛」啊！所以千真萬確是低處修時，高處是無有不到的！然後呢你不要急，要忙這個、要忙那個，是「慢慢修時是快快到」，所以我們中國人說「欲速不達」，基礎要堅穩哪！繼續下去，第三個，"]]}],"口譯音":"口譯音檔/siwei-kudi-05/019.mp3"},{"文":"數數捨身過患者。如云：「一一身體諸骨聚，超過幾多須彌峰。」謂一一有情受身之骨，若不爛壞，«多於須彌»。","口譯":"數數捨身的過患：如說：「每一位有情的身體，所積聚的骨頭，超過好多座須彌山峰。」就是說，每一位有情受身所留下的骨頭，如果不爛壞，比須彌山還多。","四家合註":null,"覺燈日光":null,"時":"71A 15:50","頁":164,"af":"71a","st":950,"et":1028,"消文":[{"文":"捨身、受身，捨下來的骨聚，不要說骨聚，燒成的灰都超過須彌山，不曉得受了多少。"}],"延伸":[{"題":"多於須彌","組":[{"題":"心硬如金剛","說":[{"類":"破","文":"弄了這麼多次，還在那個地方不停止；我們的心真像金剛，佛告訴我們這麼厲害，我們居然動都不動。"}]},{"題":"良馬見鞭影即奔","說":[{"類":"喻","文":"反過來要軟得像豆腐、軟得像棉絮，一點小小的事情就心動。"},{"類":"喻","文":"好的馬看見鞭的影子就奔了。"},{"類":"下手","文":"一點點小小的，馬上就策勵，那這一生就有希望。"}]}],"說":[{"類":"破","文":"弄了這麼多次，還在那個地方不停止；我們的心真像金剛，佛告訴我們這麼厲害，我們居然動都不動。"},{"類":"喻","文":"反過來要軟得像豆腐、軟得像棉絮，一點小小的事情就心動。"},{"類":"喻","文":"好的馬看見鞭的影子就奔了。"},{"類":"下手","文":"一點點小小的，馬上就策勵，那這一生就有希望。"}],"af":"71a","st":980}],"逐字稿":[{"t":"71A 15:50","b":[["q","數數捨身過患者。如云：「一一身體諸骨聚，超過幾多須彌峰。」謂一一有情受身之骨，若不爛壞，多於須彌。"],["s","然後我們捨身的過患。捨身、受身，我們捨下來的身、骨聚，不要說骨聚，燒成功的灰超過須彌山，唉！不曉得受了多少。那就是，想想我們實在是，弄了這麼多次，結果呢？咳！繼續還在那個地方，繼續還在那個地方，還不停止。所以前面說我們真的，我們的心真像金剛，什麼東西都動不了，佛告訴這麼厲害的，我們居然在那個地方動都不動。唉！我們要反過來，最好的我們哪，後面告訴我們的：我們軟得像豆腐，軟得像棉絮；那就差不多了。一點小小的事情，哦！心動。所以這個經上面告訴我們，真正好的良馬見鞭影 ─那個好的馬看見那個鞭的影子就奔了，我們也應該這樣，一點點的小小的馬上就策勵，那這一生就有希望。下面："]]}],"口譯音":"口譯音檔/siwei-kudi-05/020.mp3"},{"文":"數數結生過患者。如云：「雖將地丸如柏子，數母邊際未能盡。」","口譯":"數數結生的過患：如說：「即使把大地的泥土做成像柏子大小的丸子，用來計數母親，也數不盡母親的邊際。」","四家合註":null,"覺燈日光":null,"時":"71A 17:08","頁":164,"af":"71a","st":1028,"et":1059,"消文":[{"文":"生死流轉當中捨身以後結生，不斷地結生。"},{"文":"把大地做成柏子那麼大的丸子來數母親，要找到母親的邊找不到。"}],"延伸":[],"逐字稿":[{"t":"71A 17:08","b":[["q","數數結生過患者。如云：「雖將地丸如柏子，數母邊際未能盡。」"],["s","這個不斷地結生，然後生死流轉當中捨身，捨身以後呢？結生，就是生死流轉當中。如果我們把大地做成丸，丸子像柏子那麼一點點大，然後呢我們數這個母親，說我們的母親，要找到那母親的邊找不到。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/021.mp3"},{"文":"昔諸先覺解釋此義，謂一有情為母之量，此非正義。即此釋中引經文云：","口譯":"從前各位先覺解釋這個意義，說是一位有情曾經作為自己母親的次數；這不是正確的意義。就在這部釋論中引用經文說：","四家合註":null,"覺燈日光":null,"時":"71A 17:39","頁":164,"af":"71a","st":1059,"et":1090,"消文":[{"文":"平常我們總覺得：每一次結生有一個母親，要找那個母親找不到邊。大師告訴我們：不！意思不在這裡。"},{"文":"解釋當中引經文說。"}],"延伸":[],"逐字稿":[{"t":"71A 17:39","b":[["q","昔諸先覺解釋此義，謂一有情為母之量，此非正義。"],["s","平常我們去看這個問題，總覺得：我們因為是不斷地結生，所以每一次結生有一個母親，要找那個母親，這個找不到邊。他大師告訴我們：不！這個意思不是這裡。下面："]]},{"t":"71A 18:01","b":[["q","即此釋中引經文云："],["s","他說它下面，就是《親友書》上面的，《弟子書》還是《親友書》上面說的，解釋當中引經文說："]]}],"口譯音":"口譯音檔/siwei-kudi-05/022.mp3"},{"文":"「諸苾芻，譬如有人，從此大地執取諸丸，量如柏子，作是數云：『此是我母，此是我母之母。』而下其丸。諸苾芻，此大地泥速可窮盡，然諸人母展轉非爾。」是顯自母及彼母等母輾轉次第，此論亦說母邊際故。","口譯":"「諸位比丘，譬如有人，從這大地取泥做成許多丸子，大小如柏子，一邊數一邊說：『這是我的母親，這是我母親的母親』，每數一個就放下一顆丸子。諸位比丘，這大地的泥很快就會用盡，然而人的母親輾轉相承，卻數不盡。」這是顯示自己的母親，以及她的母親等，母親輾轉相承的次第；這部論說的也是母親的邊際。","四家合註":null,"覺燈日光":null,"時":"71A 18:10","頁":164,"af":"71a","st":1090,"et":1185,"消文":[{"文":"凡是菩薩造論，不是憑空的，一定有憑有據根據經論，貫徹諸經義來解釋道理。"},{"文":"數：這是我的母親，這是我母親的母親……每數一個下一粒；大地做的丸很快數完，輾轉為母找不到。"},{"文":"不是說我每生結生的母親，而是我現在的母親哪來的？母親還有母親生，母親還有母親生。"},{"文":"我們想：他為什麼要說這個？好像前者對我們感受比較有影響；不是！他下面有道理的。"}],"延伸":[],"逐字稿":[{"t":"71A 18:10","b":[["q","「諸苾芻，譬如有人，從此大地執取諸丸，量如柏子，作是數云：『此是我母，此是我母之母。』而下其丸。諸苾芻，此大地泥速可窮盡，然諸人母展轉非爾。」"],["s","因為它那個經文上，在那釋論上引經上的文 ─凡是菩薩造論，他都不是憑空的，一定是有憑有據根據經論，然後呢貫徹諸經義來解釋這個道理。所以他引那個經論上面說：前面這個不是正理，那麼經怎麼說呢？就是就這一點事情來說，「諸苾芻」 ─就是告訴這比丘，佛告訴他譬如有人把那個大地那個土就做為丸，像柏樹子那樣，然後數：這是我的母親，這是我母親的母親，母親的母親的母親，母親的母親的母 ……這樣。然後「下其丸」，每數一個下一粒，說這個大地所做成功的丸，很快就數完了，但是要找到那個輾轉為母，找不到。這個什麼意思？不是說我每生結生的這個母親，就是說我現在生我是母親，母親哪來的？母親還有母親生，母親還有母親生 ……。"]]},{"t":"71A 19:27","b":[["q","是顯自母及彼母等母輾轉次第，此論亦說母邊際故。"],["s","我們在這裡想：嗯？他為什麼要說這個，這個有什麼道理？好像在我們感受上面，前者比較對我們有影響 ─不是！他下面有道理的。"]]}],"口譯音":"口譯音檔/siwei-kudi-05/023.mp3"},{"文":"«此成厭患因之理»者，如《四百論》云：","口譯":"這能成為厭患之因的道理，如《四百論》說：","四家合註":null,"覺燈日光":null,"時":"71A 19:45","頁":164,"af":"71a","st":1185,"et":1238,"消文":[{"文":"每一個地方都引經據典的；在下面進一步說之前，這裡先說一點。"}],"延伸":[{"題":"此成厭患因之理","組":[{"題":"莫憑自己的想像","說":[{"類":"破","文":"我們平常都是憑想像；想像是什麼？兩個字：無明。不但無明，還執著，還偏偏自己覺得對，毛病全在這裡。"},{"類":"破","文":"不要說「這個解釋對了嘛，你何必這麼囉嗦呢」，這個心理是煩惱，是你的習氣。"}]},{"題":"經論每說必有深意","說":[{"類":"下手","文":"看看經論上面為什麼這麼說，它每說一個總有它特殊的意義在；認得這一點，我們就有希望了。"}]}],"說":[{"類":"破","文":"我們平常都是憑想像；想像是什麼？兩個字：無明。不但無明，還執著，還偏偏自己覺得對，毛病全在這裡。"},{"類":"破","文":"不要說「這個解釋對了嘛，你何必這麼囉嗦呢」，這個心理是煩惱，是你的習氣。"},{"類":"下手","文":"看看經論上面為什麼這麼說，它每說一個總有它特殊的意義在；認得這一點，我們就有希望了。"}],"af":"71a","st":1190}],"逐字稿":[{"t":"71A 19:45","b":[["q","此成厭患因之理者，如《四百論》云："],["s","他每一個地方都引經據典的，在下面進一步說之前，這裡先說一點。我們平常都是憑我們的想像的，這個地方告訴我們，不要憑我們的想像哦！我們的想像是什麼？兩個字 ─無明。而且不但無明而且還執著，還偏偏自己覺得對，毛病全在這裡。所以凡是這個經論上面處處地方它告訴我們，我們要認得這一點，我們就有希望了，有希望了。所以任何一個地方，不要說這個解釋對了嘛，你何必這麼囉嗦呢！這個心理是什麼？煩惱，就是你的習氣。看看經論上面為什麼這麼說，它每說一個，總有它的特殊的意義在。那個論上面怎麼說？"]]}],"口譯音":"口譯音檔/siwei-kudi-05/024.mp3"},{"文":"「若時雖一果，«初因非可見»，見一亦增多，爾時何不畏。」","口譯":"「當即使只是一個果，它最初的因都無法見到；見到一個果，又看到因不斷增多，那時怎能不畏懼？」","四家合註":null,"覺燈日光":null,"時":"71A 20:38","頁":164,"af":"71a","st":1238,"et":1383,"消文":[{"文":"隨便一個結果，就是我們隨便一個一生，現在「我」存在了；找它的因，最初的因哪裡來？找不到。"},{"文":"因緣無盡；一個簡單的事情找最初因都找不到，可想而知何等複雜，何等可怕。"}],"延伸":[{"題":"初因非可見","組":[{"題":"一口之食，還不盡","說":[{"類":"例","文":"做一點小小的事情，貪也好、瞋也好，吃一口東西，找它的最初因找不到；將來要還，是還不盡的。"},{"類":"因","文":"因為最初因找不到、還不盡，所以永遠在這個地方結生，這是真正的困擾。"}]},{"題":"受施不得解脫，要還人家","說":[{"類":"破","文":"不要隨隨便便，人家送來的好東西，儘量吃、玩、用、樂，不可以呀！"},{"類":"立","文":"拿這東西自求解脫了，讓人家在福田中種福；現在不得解脫，人家白白浪費，你要還人家，怎麼還得乾淨。"}]},{"題":"當下起大警惕","說":[{"類":"下手","文":"任何一件事情，當下就策勵起我們大警惕來。"}]}],"說":[{"類":"例","文":"做一點小小的事情，貪也好、瞋也好，吃一口東西，找它的最初因找不到；將來要還，是還不盡的。"},{"類":"因","文":"因為最初因找不到、還不盡，所以永遠在這個地方結生，這是真正的困擾。"},{"類":"破","文":"不要隨隨便便，人家送來的好東西，儘量吃、玩、用、樂，不可以呀！"},{"類":"立","文":"拿這東西自求解脫了，讓人家在福田中種福；現在不得解脫，人家白白浪費，你要還人家，怎麼還得乾淨。"},{"類":"下手","文":"任何一件事情，當下就策勵起我們大警惕來。"}],"af":"71a","st":1280}],"逐字稿":[{"t":"71A 20:38","b":[["q","「若時雖一果，初因非可見，見一亦增多，爾時何不畏。」"],["s","說隨便一個結果，就是我們隨便一個一生，這個說我們現在 ─「我」存在了，那麼你找它的這個一個結果，你找它的因，找它的因，「初因」，最初的原因哪裡來？你找不到，隨便這個一果都找不到哦！啊！所以這一個因緣無盡啊！你總得想這個上面，既然一切都是因緣，你要解決這個果，必定要從因上面；結果一個簡單的事情，你找最初因找不到的話，可想而知這個事情是何等地複雜。既然這麼複雜的，是何等地可怕。那這一下就找到更可怕的理由，懂不懂？所以我們現在隨便說，唉呀，做一點小小的事情，不管你貪也好、瞋也好，你以為吃一口東西，那一口東西的吃下去的東西，找它的最初因找不到。如果你要將來把那一口東西吃下去要還的話，你要還盡是還不盡，意思就是這個說。然後呢不管你做任何一件事情，這個它根本的原因就在這個地方，因為你這個最初因找不到、還不盡，所以你永遠在這個地方結生，永遠要解決這個問題，它這個真正的困擾在這裡。所以我們任何一件事情，當下就策勵起我們大警惕來，這個懂不懂？"]]},{"t":"71A 22:11","b":[["s","這個要再說一遍，「若時雖一果」，就是說任何一個果，你要找那個果的最初的因，找不到，找不到！那個時候你怎麼不怕呀，怎麼不怕呀！所以由此我們眼前隨便、隨便一樣東西，所以為什麼我們現在不要說，哎呀，隨隨便便，好像尤其是現在出家人，反正人家送得來的，反正你儘量地好的吃，去玩哪、用哪、樂啊，啊，不可以呀！你拿這個東西自求解脫了，那的確因為你解脫了可以得到，讓人家在這個福田當中種福；現在你不得解脫的話，人家也白白地浪費，你要還人家啊！既然這個因，頭找不到的話，你還人家，你怎麼還得乾淨哪！你怎麼還得清楚啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-05/025.mp3"},{"文":"其釋亦云：「此顯由諸難可度量稠林相續，令極難行生死大野，常應厭患，隨順於此，當如理修。」如此當知。","口譯":"它的釋論也說：「這是顯示，由於難以度量的稠林般的相續，使生死大荒野極為難行；應當常常厭患，隨順於此，如理修習。」應當這樣了知。","四家合註":null,"覺燈日光":null,"時":"71A 23:03","頁":164,"af":"71a","st":1383,"et":1444,"消文":[{"文":"生死當中的雜染這樣地複雜，這個是真難行；這個道理應該好好地修。"},{"文":"平常講業果，是最簡單的基本業因；要找到基本因輾轉推行，只有佛才能夠窮盡。"},{"文":"所以我們必定要下足第一步，趕快努力。"}],"延伸":[],"逐字稿":[{"t":"71A 23:03","b":[["q","其釋亦云：「此顯由諸難可度量稠林相續，令極難行生死大野，"],["s","喏，就是這個樣。啊！所以生死當中那個雜染，這樣地、這樣地複雜，這個是真難行啊！"]]},{"t":"71A 23:29","b":[["q","常應厭患，隨順於此，當如理修。」"],["s","所以這個道理，你應該好好地修啊！"]]},{"t":"71A 23:37","b":[["q","如此當知。"],["s","這是我們應該的。所以我們平常講的業，好像業果 ─那是它最簡單的基本業因，如果說你要找到那個基本因的輾轉地推行的時候，只有佛才能夠窮盡，只有佛才能夠窮盡。所以我們必定要下足第一步趕快努力，趕快努力啊！這個就是它的道理。再下面："]]}],"口譯音":"口譯音檔/siwei-kudi-05/026.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-05/001.webp","n":1},{"img":"投影片/siwei-kudi-05/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/siwei-kudi-05/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/siwei-kudi-05/004.webp","n":4},{"img":"投影片/siwei-kudi-05/005.webp","n":5},{"img":"投影片/siwei-kudi-05/006.webp","n":6},{"img":"投影片/siwei-kudi-05/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=70b&st1=705&et1=834","box":[0.128625,0.3002222222222222,0.1315,0.06622222222222222]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-05/008.webp","n":8},{"img":"投影片/siwei-kudi-05/009.webp","n":9},{"i
