/siwei-kudi-05/045.webp","n":45},{"img":"投影片/siwei-kudi-05/046.webp","n":46},{"img":"投影片/siwei-kudi-05/047.webp","n":47,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=71a&st1=1185&et1=1444","box":[0.133625,0.3091111111111111,0.13775,0.07733333333333334]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-05/048.webp","n":48},{"img":"投影片/siwei-kudi-05/049.webp","n":49},{"img":"投影片/siwei-kudi-05/050.webp","n":50},{"img":"投影片/siwei-kudi-05/051.webp","n":51,"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-05/052.webp","n":54,"yt":"E1qFpq1i0fY"},{"img":"投影片/siwei-kudi-05/053.webp","n":55}],"投影片PDF":"投影片/siwei-kudi-05/slides.pdf","音檔範圍":"70B 11:45～71A 24:04"},"siwei-kudi-06":{"id":"siwei-kudi-06","標題":"思惟苦諦(6)","根":"思惟六苦","科判焦點":"丑二 思惟六苦","課本範圍":"P164 L11 ~ P167 L1","堂數":90,"日期":"2026/12/8","分圖":[{"名":"數數高下・無伴","原文":[0,5]},{"名":"六苦總攝為三","原文":[6,10]},{"名":"思惟三苦","根":"思惟三苦","原文":[11,22]}],"跨科判":[{"科判":"丑三 思惟三苦","起":11}],"週":115,"班級":"24秋007","音檔":{"71a":{"local":"音檔/gl1/071A.mp3","remote":"https://lamrim.xyz/player/media/gl1/071A.mp3"},"71b":{"local":"音檔/gl1/071B.mp3","remote":"https://lamrim.xyz/player/media/gl1/071B.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=71a&st1=1444&af2=71b&et2=1722","段":[{"文":"«數數高下»過患者。如云：「既成百施世應供，業增上故復墮地，既滿轉輪聖王已，復於生死為奴婢。天趣天女乳腰柔，長受安樂妙觸已，後墮地獄鐵輪中，當受粗磨割裂觸。長時安住須彌頂，安足陷下受安樂，後遊煻煨屍泥中，當念眾苦極難忍。天女隨逐受歡喜，遊戲端妙歡喜園，後當住止劍葉林，獲割耳鼻刖手足。天女殊妙如金蓮，共同游泳徐流池，後墮地獄當趣入，難忍灰水無極河。雖得天界大欲樂，及諸梵天離欲樂，後墮無間為火薪，忍受眾苦無間絕。得為日月自身光，照曜一切諸世間，後往極黑陰闇處，自手伸舒亦莫覩。」","口譯":"數數高下的過患：如說：「既已成為百施（帝釋），受世間供養，又由於業力的緣故再墮落到地上；既已成為圓滿的轉輪聖王，又在生死中成為奴婢。在天趣中，長時受用天女柔軟胸腰的安樂妙觸之後，又墮入地獄的鐵輪之中，承受粗磨割裂的觸受。長時安住在須彌山頂，踩下去柔軟下陷而受安樂，之後卻行走在熱灰與屍泥之中，應當想到這些眾苦極為難忍。在天女隨侍之下受用歡喜，遊戲於端妙的歡喜園，之後卻要住在劍葉林中，被割耳鼻、斷手足。與殊妙如金蓮的天女，一同在徐徐流動的池中游泳，之後卻墮入地獄，進入難忍的灰水無極河。即使得到天界的大欲樂，以及梵天離欲的安樂，之後墮入無間地獄成為火的薪柴，忍受眾苦，無間斷絕。得為日月，自身的光明照耀一切世間，之後卻前往極黑暗的地方，連自己伸出手來都看不見。」","四家合註":null,"覺燈日光":null,"時":"71A 24:04","頁":164,"af":"71a","st":1444,"et":1693,"消文":[{"文":"上升了又要跌下去，這是受不了；先上，上去了以後下來。"},{"文":"「既成百施世應供」：做了種種布施，受到世間好的供養，帝王等等；造了業以後又墮落。"},{"類":"例","文":"前天講的故事，一個國王還做好事，吃醉了酒殺了一個人，結果墮落了。"},{"文":"轉輪聖王是世間最高的，奴婢是最差的；本來做老闆忽然去做夥計我們就受不了，何況轉輪聖王；一下做總統，忽然做階下囚。"},{"文":"升天，天完了以後到地獄，種種地方都受這個事情。"}],"延伸":[{"題":"數數高下","組":[{"題":"認真思惟就感受得到","說":[{"類":"立","文":"這個事情我們好像不大容易感受得到；如果認真思惟一下，還是很容易感受得到的。"}]},{"題":"熱望之物忽然失去","說":[{"類":"例","文":"男女之間好得要命，忽然一方移情別戀，看見你白眼相向，那時內心的痛苦。"},{"類":"例","文":"做生意本來很得意，人家來求你；忽然欠一屁股債，到處避債、不敢見人。"}]},{"題":"天上墮地獄，更甚於此","說":[{"類":"立","文":"那只是失去了，你可沒有受地獄；他是本來在天堂上好成那樣，一下跑到地獄裡去，這樣的高下法。"}]}],"說":[{"類":"立","文":"這個事情我們好像不大容易感受得到；如果認真思惟一下，還是很容易感受得到的。"},{"類":"例","文":"男女之間好得要命，忽然一方移情別戀，看見你白眼相向，那時內心的痛苦。"},{"類":"例","文":"做生意本來很得意，人家來求你；忽然欠一屁股債，到處避債、不敢見人。"},{"類":"立","文":"那只是失去了，你可沒有受地獄；他是本來在天堂上好成那樣，一下跑到地獄裡去，這樣的高下法。"}],"af":"71a","st":1604}],"逐字稿":[{"t":"71A 24:04","b":[["q","數數高下過患者。"],["s","第五，上升了又要跌下去，這個是受不了。下去了你覺得上升，對不起，上升了還要跌下來。"]]},{"t":"71A 24:15","b":[["q","如云：「既成百施世應供，業增上故復墮地，既滿轉輪聖王已，復於生死為奴婢。天趣天女乳腰柔，長受安樂妙觸已，後墮地獄鐵輪中，當受粗磨割裂觸。長時安住須彌頂，安足陷下受安樂，後遊煻煨屍泥中，當念眾苦極難忍。天女隨逐受歡喜，遊戲端妙歡喜園，後當住止劍葉林，獲割耳鼻刖手足。天女殊妙如金蓮，共同游泳徐流池，後墮地獄當趣入，難忍灰水無極河。雖得天界大欲樂，及諸梵天離欲樂，後墮無間為火薪，忍受眾苦無間絕。得為日月自身光，照曜一切諸世間，後往極黑陰闇處，自手伸舒亦莫覩。」"],["s","這個是高下。他講高下的話，就是你先上，上去了以後下來，就這樣。「既成百施世應供」，換句話說，你做了種種的布施，然後受到世間的種種的好的供養，那帝王啊什麼等等。對不起，造了業以後你又墮落了，又墮落了。前天我們講的那個故事當中就有這個，一個國王，他還做好事哦！吃醉了酒了，殺了一個人，結果墮落了。那現在這個時候，那我們看看，那不得了！所以世間是一無可取，一旦墮落了以後，對不起！「既滿轉輪聖王已」，那個是更好，一下在生死當中做奴婢，轉輪聖王是我們世間最高的，奴婢是最差的。我們現在不要說轉輪聖王，本來做個老闆，忽然跑得去做一個夥計，我們就受不了，何況是轉輪聖王！一下做個總統，忽然之間做個階下囚。唉！然後呢升天，天完了以後到地獄，這個種種地方，它下面這個裡邊都受這個事情。"]]},{"t":"71A 26:44","b":[["s","通常像這個事情，我們好像不大容易感受得到，如果你認真思惟一下的話，我們還是很容易感受得到的。怎麼思惟呢？譬如說，你們以前曾經有過很好的，譬如說很熱望的一樣東西，很熱望的東西，忽然之間熱望的東西失去了，失去了。通常一般來說的話，男女之間，哎喲，大家好得要命，忽然之間其中的一方移情別戀，然後看見你了，跟你白眼相向。唉呀，你那個時候內心的痛苦，那個比起前面這個裡邊說的話，那還不曉得差多少 ─那它只是失去了，你可沒有受地獄唷！他不是喔，本來在天堂上面好成這個樣的，忽然之間一下跑到地獄裡面去。啊！這樣的高下法，這個是我們應該體會到的。這個世間哪！然後你做生意，本來一向做得很得意，忽然之間做個階下囚，欠了一屁股債。那本來你得意的，人家跑得來求你，忽然之間到了那個時候你又要避債，到處都不敢見人。那個比起這個上面說的話，那已經好得不曉得好多少哦！所以，數數高下的過患。下面說："]]}],"口譯音":"口譯音檔/siwei-kudi-06/001.mp3"},{"文":"磨等三鐵輪者，如其次第，謂於眾合、黑繩、燒熱三中而有。","口譯":"「磨」等三種鐵輪，依照次第，是說在眾合、黑繩、燒熱三種地獄中所有的。","四家合註":null,"覺燈日光":null,"時":"71A 28:13","頁":165,"af":"71a","st":1693,"et":1724,"消文":[{"文":"指上面說的那幾樣：本來在天上，一下到眾合地獄、黑繩地獄，然後到燒熱，三個地獄當中去。"}],"延伸":[],"逐字稿":[{"t":"71A 28:13","b":[["q","磨等三鐵輪者，如其次第，謂於眾合、黑繩、燒熱三中而有。"],["s","就是指前面，上面他說的那個幾樣東西，那是指什麼呢？本來在天上面，然後一下到眾合地獄，到黑繩地獄，然後到燒熱，三個地獄當中去。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/002.mp3"},{"文":"天女隨逐者，謂為天女之所依附。天界欲樂者，謂忉利以上欲天所有。日月光者，是如世間共許而說，未分能依及所依處，若分別說，乃是彼二宮殿之光。此等為喻，當思一切從高墮下所有道理，«厭患三有»，以其三有一切盛事，最後邊際，衰所攝故。","口譯":"「天女隨逐」，是說被天女所依附。「天界欲樂」，是說忉利天以上的欲界天所有的欲樂。「日月光」，是依照世間共許的說法而說，沒有區分能依（日月天子）與所依處（宮殿）；如果分別來說，那是日月二宮殿的光明。這些都是比喻，應當思惟一切從高處墮下的道理，厭患三有，因為三有的一切盛事，最後的邊際都為衰敗所攝。","四家合註":null,"覺燈日光":null,"時":"71A 28:44","頁":165,"af":"71a","st":1724,"et":null,"消文":[{"文":"這是解釋偈子裡說的那些，不必一一細說。"},{"文":"總之一句話：再好的東西，最後墮落；只要還在三有當中，任何好事最後一句話：墮落。"}],"延伸":[{"題":"厭患三有","組":[{"題":"難陀見地獄，天堂也不要","說":[{"類":"例","文":"難陀尊者先不肯努力，一看天堂就努力了；再到地獄一看，發現天堂受完了還要回來，拼命連天堂也不要了。"}]},{"題":"幸聞圓滿教法，趕快跳出","說":[{"類":"因","文":"我們宿生沒有積這樣的福德，不能感得這樣的大聖者來引導。"},{"類":"下手","文":"所幸還積了少分福德，聽見這個圓滿的教法，趕快如理努力，有份跳出來。"},{"類":"立","文":"一旦失去這個機會，以後連聽都聽不到；那時吞烊銅、在油鍋裡煎，才可怕。"}]}],"說":[{"類":"例","文":"難陀尊者先不肯努力，一看天堂就努力了；再到地獄一看，發現天堂受完了還要回來，拼命連天堂也不要了。"},{"類":"因","文":"我們宿生沒有積這樣的福德，不能感得這樣的大聖者來引導。"},{"類":"下手","文":"所幸還積了少分福德，聽見這個圓滿的教法，趕快如理努力，有份跳出來。"},{"類":"立","文":"一旦失去這個機會，以後連聽都聽不到；那時吞烊銅、在油鍋裡煎，才可怕。"}],"af":"71a","st":1760}],"逐字稿":[{"t":"71A 28:44","b":[["q","天女隨逐者，謂為天女之所依附。天界欲樂者，謂忉利以上欲天所有。日月光者，是如世間共許而說，未分能依及所依處，若分別說，乃是彼二宮殿之光。此等為喻，當思一切從高墮下所有道理，厭患三有，以其三有一切盛事，最後邊際，衰所攝故。"],["s","他上面就是解釋那個裡面說的那些，那這個地方我們也不必一一細說。總之一句話：你再好的東西，最後─墮落。在任何情況之下，你只要還在三有當中，三有當中任何的好事，它最後的話呢，一句話─墮落，最後一句話─墮落。所以你想到這裡，唉呀，「厭患三有」啊！所以這個難陀尊者，先不肯努力，結果一看地獄就努力了；喔唷，這樣一看天堂就努力了。結果再到地獄裡面一看哪，發現：唉呀，天堂受完了，還要回來，那是這拼命這個天堂也不要了。"]]},{"t":"71B 00:10","b":[["s","我們不幸啊，因為我們宿生沒有積這樣的福德，所以不能感得這樣的這個大聖者來引導我們。所幸的我們多多少少，還積了一點少分的福德，聽見這個圓滿的教法，我們趕快如理努力，我們有份跳出來，有份跳出來。所以想到這裡，眼前我們應該更加努力，更加努力，這樣才對呀！要不然一旦失去了這個機會，那完了，以後連聽都聽不到了。那只有一件事情，到那個時候吞烊銅，在油鍋裡煎，那才可怕呀！"]]}],"口譯音":"口譯音檔/siwei-kudi-06/003.mp3"},{"文":"此如《調伏阿笈摩》云：「«積集皆銷散»，崇高必墮落，合會終別離，有命咸歸死。」","口譯":"這就如《調伏阿笈摩》所說：「積集的終將銷散，崇高的必定墮落，聚合的終將別離，有生命的都歸於死亡。」","四家合註":null,"覺燈日光":null,"時":"71B 00:51","頁":165,"af":"71b","st":51,"et":150,"消文":[{"文":"不管你有多少財產，最後銷散；爬得多高，墮落；大家親親愛愛，別離；有命咸歸死。"}],"延伸":[{"題":"積集皆銷散","組":[{"題":"真正要忙的是出離","說":[{"類":"立","文":"想到這裡，這些東西都沒有意思，忙它幹什麼？真正要忙的一件事情：趕快出離。"},{"類":"回扣","文":"所以「火燒頭燃尚可暫置」。"}]},{"題":"為萬年計，一堆灰","說":[{"類":"破","文":"忙股票、存銀行，不曉得作什麼千秋大夢。"},{"類":"破","文":"積了一個月還要一年，積了一年還要一百年、一千年；沒有一個人活到一百年，卻都為萬年計。"},{"類":"立","文":"忙了半天一堆灰，然後到地獄裡受苦，真划不來。"}]},{"題":"祖師今日送盡","說":[{"類":"例","文":"有位祖師今天吃完，就把東西送給別人：「我明天有沒有都不知道，你留在那個地方，人家施主一番好心，你留在那裡幹什麼！」"},{"類":"例","文":"天天送，徒弟苦不堪言，後來徒弟也成就了；古來人的修行是這個樣。"}]}],"說":[{"類":"立","文":"想到這裡，這些東西都沒有意思，忙它幹什麼？真正要忙的一件事情：趕快出離。"},{"類":"回扣","文":"所以「火燒頭燃尚可暫置」。"},{"類":"破","文":"忙股票、存銀行，不曉得作什麼千秋大夢。"},{"類":"破","文":"積了一個月還要一年，積了一年還要一百年、一千年；沒有一個人活到一百年，卻都為萬年計。"},{"類":"立","文":"忙了半天一堆灰，然後到地獄裡受苦，真划不來。"},{"類":"例","文":"有位祖師今天吃完，就把東西送給別人：「我明天有沒有都不知道，你留在那個地方，人家施主一番好心，你留在那裡幹什麼！」"},{"類":"例","文":"天天送，徒弟苦不堪言，後來徒弟也成就了；古來人的修行是這個樣。"}],"af":"71b","st":80}],"逐字稿":[{"t":"71B 00:51","b":[["q","此如《調伏阿笈摩》云：「積集皆銷散，崇高必墮落，合會終別離，有命咸歸死。」"],["s","經上面就告訴我們，「積聚」，不管你有多少財產，最後呢「銷散」；爬得多高 墮落；大家親親愛愛 別離；「有命咸歸死」。你想到這裡，這些東西都沒有意思，忙它幹什麼啊？真正要忙的一件事情 ─趕快出離啊！所以「火燒頭燃尚可暫置」。我看現在人家要忙這個股票，喔唷，存那個銀行，不曉得做些什麼呀，不曉得作什麼千秋大夢啊！所以我看見一個祖師，他今天吃完了，把那些東西送給別人，為什麼？「我明天有沒有都不知道，你留在那個地方，人家施主一番好心，你留在那裡幹什麼！」結果他天天人家送，天天送，那個徒弟苦不堪言。欸，結果你不要看徒弟苦不堪言，那個徒弟也後來也成就了，那真正古來人的修行是這個樣。唉呀！現在我們積了一個月還要一年，積了一年還要積一百年，積了一百年還要積一千年。實在我們能吃多少啊？那人沒有一個人能活到一百年，可是我們都是為萬年計，不曉得忙些什麼！結果忙了半天一堆灰，然後到地獄裡受苦，真划不來！再下面，這個是六苦當中的最後一個。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/004.mp3"},{"文":"無伴過患者。如云：「若能了知如是過，願取三福燈光明，獨自當趣雖日月，難破無邊黑闇中。」了知過者，謂當了知如前所說，須如是死，願取福光。三種福者，謂三門善事，或施所生等三種善事。無邊黑闇者，謂無明黑闇。無伴而趣者，","口譯":"無伴的過患：如說：「如果能了知像這樣的過患，願你取得三種福德之燈的光明；因為必須獨自前往那即使有日月也難以照破的無邊黑闇之中。」「了知過」，是說應當了知如前所說，必須像那樣死去，所以願取福德的光明。「三種福」，是說身語意三門的善事，或布施所生等三種善事。「無邊黑闇」，是說無明的黑闇。「無伴而趣」，","四家合註":null,"覺燈日光":null,"時":"71B 02:30","頁":165,"af":"71b","st":150,"et":263,"消文":[{"文":"了解了上面這樣的過失，一無可貪；那時怎麼辦？不要貪著，去修行，修「三福」。"},{"文":"三門善事：身、口、意努力去做；這個是「福光明」，燈是照明的，平常我們在無明黑暗當中。"},{"文":"不在這上面努力，到「難破無邊黑闇」，沒有日月的惡道，「獨自當趣」。"},{"文":"眼前忙的東西一樣帶不走，一個人也不陪你；你營養了半天這個身體，就送你到這個地方去，不值得。"}],"延伸":[],"逐字稿":[{"t":"71B 02:30","b":[["q","無伴過患者。如云：「若能了知如是過，願取三福燈光明，獨自當趣雖日月，難破無邊黑闇中。」了知過者，謂當了知如前所說，須如是死，願取福光。三種福者，謂三門善事，或施所生等三種善事。無邊黑闇者，謂無明黑闇。無伴而趣者，（如下面等等。）"],["s","現在到這個地方，我先解釋一下。假定我們能夠了解了像上面這樣的過失的話，唉呀，這一無可貪、一無可貪哪！那時候怎麼辦哪？不要貪著，去修行，修什麼？修「三福」，三福下面說「三門善事」，就是身、口、意努力去做這個。這個是什麼？「福光明」，這個才是。燈是照明的，平常我們在無明黑暗當中，那這樣，這個才是我們應該取的，不是要在生死輪迴當中，這樣。如果說你不在這個上面努力的話，那麼對不起，那個時候你到哪裡去啊？「難破無邊黑闇」，而且這個地方是沒有日月的，這個是惡道，這個是到那時候「獨自當趣」呀！你眼前忙的東西，一樣帶不走，一個人也不陪你。你忙這個身體，營養了半天，就送你到這個地方去，不值得啊！至於說「無伴」，什麼呢？下面說，論上面告訴我們："]]}],"口譯音":"口譯音檔/siwei-kudi-06/005.mp3"},{"文":"如《入行論》云：「獨生此一身，俱生諸骨肉，壞時尚各散，何況餘親友。生時獨自生，死時還獨死，他不取苦分，«何須作障親»。」","口譯":"如《入行論》說：「獨自生出這一個身體，與身俱生的骨肉，壞滅時尚且各自離散，何況其餘的親友？出生時獨自出生，死去時也獨自死去；別人無法分擔我的苦，何必去作障礙修行的親友？」","四家合註":null,"覺燈日光":null,"時":"71B 04:23","頁":165,"af":"71b","st":263,"et":340,"消文":[{"文":"獨生此一身；自己覺得這總是「我」吧，壞的時候這個東西也壞掉了。"},{"文":"眼前親友沒有一個人跟你，帶不走；生的時候自己生，死的時候自己死，他不能替代我們。"}],"延伸":[{"題":"何須作障親","組":[{"題":"互相幫助，莫相障礙","說":[{"類":"立","文":"何必互相障礙？在這個地方互相幫助，難得趁這個機會互相幫助，這個才是我們真正需要的。"},{"類":"立","文":"互相幫助有大利益，互相障礙毫無意思。"}]},{"題":"可靠唯法與僧","說":[{"類":"立","文":"真正可靠的：靠法、靠僧，這個才對；除此以外其他的沒有。"},{"類":"回扣","文":"「無伴」，記牢這個！"}]}],"說":[{"類":"立","文":"何必互相障礙？在這個地方互相幫助，難得趁這個機會互相幫助，這個才是我們真正需要的。"},{"類":"立","文":"互相幫助有大利益，互相障礙毫無意思。"},{"類":"立","文":"真正可靠的：靠法、靠僧，這個才對；除此以外其他的沒有。"},{"類":"回扣","文":"「無伴」，記牢這個！"}],"af":"71b","st":305}],"逐字稿":[{"t":"71B 04:23","b":[["q","如《入行論》云：「獨生此一身，俱生諸骨肉，壞時尚各散，何況餘親友。生時獨自生，死時還獨死，他不取苦分，何須作障親。」"],["s","這個身體，生─獨生此一身，這個身體生來嘛也就是。然後呢這個自己覺得：唉呀，這個總是「我」吧！對不起，壞的時候，對不起，這個東西也是壞掉了，壞掉了。眼前的親友等等沒有一個人跟你，沒有一個人，這個東西帶不走，這樣的情況。所以沒有什麼好伴，生的時候自己生，死的時候還自己死，他不能替代我們，何必互相障礙？所以我們現在在這個地方互相幫助，這是真正的，難得趁著這個機會互相幫助，這個才是我們真正需要的。互相幫助有大利益，互相障礙毫無意思。真正可靠的 ─靠法、靠僧，這個才對。除此以外其他的沒有，「無伴」，記牢這個！"]]}],"口譯音":"口譯音檔/siwei-kudi-06/006.mp3"},{"文":"如是六苦總攝為三。謂於生死中，«無保信處»。","口譯":"這六苦總攝為三種：就是在生死之中，沒有可以保信的地方。","四家合註":null,"覺燈日光":null,"時":"71B 05:40","頁":165,"af":"71b","st":340,"et":427,"消文":[{"文":"前面六樣東西總集起來，分三個大項目。"},{"文":"第一個，在整個生死當中，沒有可以信賴的，也沒有可以保證的。"}],"延伸":[{"題":"無保信處","組":[{"題":"先積資財再修行，完全錯了","說":[{"類":"破","文":"有人說：「我要修行了，先積幾個錢存在銀行裡，先買一點股票。」完全錯了！"},{"類":"破","文":"「我先去造一個房子，造好了在底下閉關。」不要這樣！"}]},{"題":"趕快找法照著做","說":[{"類":"下手","文":"要修行了，趕快找修行的佛法是什麼，照著去做，這個才對。"},{"類":"立","文":"佛告訴我們清清楚楚，這種東西一點都沒辦法保證你、可以信賴；修行必定要認識：這些東西不要忙。"}]},{"題":"發心莊嚴，目的仍是出離","說":[{"類":"立","文":"如果發了大心，為了別人莊嚴，這了不起；但目的還是見到生死可怕，要幫助別人、引發別人。"},{"類":"回扣","文":"這地方是根本在此：「無保信處」，生死輪迴當中沒有一樣東西可靠。"}]}],"說":[{"類":"破","文":"有人說：「我要修行了，先積幾個錢存在銀行裡，先買一點股票。」完全錯了！"},{"類":"破","文":"「我先去造一個房子，造好了在底下閉關。」不要這樣！"},{"類":"下手","文":"要修行了，趕快找修行的佛法是什麼，照著去做，這個才對。"},{"類":"立","文":"佛告訴我們清清楚楚，這種東西一點都沒辦法保證你、可以信賴；修行必定要認識：這些東西不要忙。"},{"類":"立","文":"如果發了大心，為了別人莊嚴，這了不起；但目的還是見到生死可怕，要幫助別人、引發別人。"},{"類":"回扣","文":"這地方是根本在此：「無保信處」，生死輪迴當中沒有一樣東西可靠。"}],"af":"71b","st":360}],"逐字稿":[{"t":"71B 05:40","b":[["q","如是六苦總攝為三。"],["s","把前面這個，「如是六苦」，六樣東西總集起來，分三個大項目。第一個，"]]},{"t":"71B 05:49","b":[["q","謂於生死中，無保信處。"],["s","第一個，在整個的生死當中，沒有可以信賴的，也沒有可以保證的。所以從這一點上面來，所以有人說：「唉呀，我要修行了，先啊積幾個錢存在銀行裡，然後先買一點股票。」完全錯了！「我先去造一個房子，然後造好了，在那個底下要去閉關了。」不要這樣，不要！我要去修行了，趕快找修行的佛法是什麼，然後照著去做，這個才對的。佛也告訴我們清清楚楚，這種東西一點都沒辦法保證你，一點都沒辦法可以信賴的。所以第一個，我們修行必定要認識的：這些東西不要忙。如果說你發了大心，為了別人 ─莊嚴，這個了不起！但是你這個目的幹什麼？還是見到了這個生死可怕，你要幫助別人、引發別人，目的仍舊是這個，這一點千萬注意，這千萬注意！總之這個地方這是根本在此，所以「無保信處」，在生死輪迴當中沒有一樣東西，這樣。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/007.mp3"},{"文":"受彼安樂，«終無飽期»。","口譯":"受用那些安樂，終究沒有飽足的時候。","四家合註":null,"覺燈日光":null,"時":"71B 07:07","頁":165,"af":"71b","st":427,"et":581,"消文":[{"文":"雖然要找到快樂，在任何情況之下沒辦法飽滿；不但沒辦法飽滿，越弄越糟。"},{"類":"例","文":"眼前貪一點小便宜，然後烊銅熱鐵灌口，受盡了痛苦。"}],"延伸":[{"題":"終無飽期","組":[{"題":"等流相續，又來了","說":[{"類":"因","文":"從地獄逃出來以後，等流因果還在那裡，又來了；難得跑到人身短短幾十年，等流就這麼厲害。"},{"類":"例","文":"貪心重成餓鬼，吃到的是烊銅熱鐵；惡業完了作畜生還；還清了跑到人間，那個嘴巴又來了。"},{"類":"立","文":"眼前為什麼會現起？就是等流，宿生的習氣在。"}]},{"題":"從等流上切斷","說":[{"類":"下手","文":"你不從這個上面切斷，永遠沒機會；真正修行，大家注意，所謂等流。"}]},{"題":"懺悔要認得心隨煩惱","說":[{"類":"回扣","文":"懺悔文「從無始時來，十惡五無間，心隨煩惱故，諸罪皆懺悔」：無始以來心隨著煩惱，就在等流心識。"},{"類":"立","文":"任何境界現起，不修對治、不照這個辦法思惟觀察，老脾氣又來了，一定跟著它去；修行修的就是這個。"},{"類":"破","文":"說「我業障很重啊」，說了半天業障在哪裡自己也不知道，你懺什麼悔！"}]}],"說":[{"類":"因","文":"從地獄逃出來以後，等流因果還在那裡，又來了；難得跑到人身短短幾十年，等流就這麼厲害。"},{"類":"例","文":"貪心重成餓鬼，吃到的是烊銅熱鐵；惡業完了作畜生還；還清了跑到人間，那個嘴巴又來了。"},{"類":"立","文":"眼前為什麼會現起？就是等流，宿生的習氣在。"},{"類":"下手","文":"你不從這個上面切斷，永遠沒機會；真正修行，大家注意，所謂等流。"},{"類":"回扣","文":"懺悔文「從無始時來，十惡五無間，心隨煩惱故，諸罪皆懺悔」：無始以來心隨著煩惱，就在等流心識。"},{"類":"立","文":"任何境界現起，不修對治、不照這個辦法思惟觀察，老脾氣又來了，一定跟著它去；修行修的就是這個。"},{"類":"破","文":"說「我業障很重啊」，說了半天業障在哪裡自己也不知道，你懺什麼悔！"}],"af":"71b","st":450}],"逐字稿":[{"t":"71B 07:07","b":[["q","受彼安樂，終無飽期。"],["s","然後呢，第二個，你雖然要找到快樂，但是在任何情況之下，你沒辦法飽滿的。不但沒辦法飽滿，正因為如此，是越弄越糟、越弄越糟。現在眼前貪一點小便宜，然後烊銅熱鐵灌口，唉呀！受盡了苦痛、苦痛、痛苦。然後等到你出來的時候，欸，對不起，逃出來了以後那個等流因果還在那裡，又來啦！然後呢難得的跑到人身當中，短短的幾十年，對不起那個等流就這麼厲害。所以我前面告訴你們：你不從這個上面切斷，你永遠沒機會。眼前為什麼我們會這個現起呢？簡單嘛！就是等流，就是說明就是宿生的習氣在。眼前做了墮落，然後到那個時候，因為你呀貪心重，所以餓鬼，如果還再造一點業的話，那個吃的不是吃不到，吃得到的，吃什麼？烊銅熱鐵。啊！這麼可怕。然後等到把惡業弄完了以後，然後作畜生還。還，統統還清了又跑到人間來；跑到人間來，對不起，那個嘴巴又來了、又來了。啊！這麼個可怕法，它永遠沒有飽足的。"]]},{"t":"71B 08:31","b":[["q","所以懂得了這一點，就要曉得：哦，真正修行，大家注意哦，所謂等流。所以我們懺悔的當中，「從無始時來，十惡五無間，心隨煩惱故」，記得這句話吧？「諸罪」應該如何啊？「皆懺悔」。啊！原來我無始以來心隨著煩惱，什麼地方"],["s","隨起？就在那地方 ─等流心識。任何一個境界現起的時候，如果說你不修對治，不照這個辦法思惟觀察的話，欸，你這個老脾氣又來了，看見了又來了。那個時候是什麼？煩惱，你一定跟著它去，一定跟著它去。修行修什麼？就是這個。所以這個懺悔真正的用意，你必定要懂得；否則的話，你說我懺悔啊，哎喲，我慚愧呀，我業障很重啊！說了半天你的業障在哪裡呀？自己也不曉得，自己也根本不知道，你懺什麼悔！這一點概念我們現在清楚啦，非常好！最後第三點是："]]}],"口譯音":"口譯音檔/siwei-kudi-06/008.mp3"},{"文":"無始而轉。","口譯":"無始以來不斷流轉。","四家合註":null,"覺燈日光":null,"時":"71B 09:41","頁":165,"af":"71b","st":581,"et":600,"消文":[{"文":"沒有保證、沒有信賴；得到好的永遠沒有飽足，反而受大苦；這狀態就永遠在那裡轉，沒頭沒腦。"}],"延伸":[],"逐字稿":[{"t":"71B 09:41","b":[["q","無始而轉。"],["s","就像前面這個東西，第一個沒有保證、沒有信賴；而且呢，得到了好的是永遠沒有飽足，反而受了大苦。這個狀態呢，就永遠在那裡轉，沒頭沒腦。唉！這麼嚴重法。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/009.mp3"},{"文":"初中有四，一於所得身不可保信者，謂身數數捨。二作諸前益不可保信者，謂無決定。三於得盛事不可保信者，謂高下變易。四於諸共住不可保信者，謂無伴而往。","口譯":"第一項（無保信處）中有四點：一、對所得的身體不可保信，就是身體數數捨棄。二、對過去所作的利益不可保信，就是無定。三、對所得的盛事不可保信，就是高下變易。四、對共同住在一起的人不可保信，就是無伴而往。","四家合註":null,"覺燈日光":null,"時":"71B 10:00","頁":166,"af":"71b","st":600,"et":681,"消文":[{"文":"第一個無保信，有四個。"},{"類":"例","文":"身不可保：準備營養，偏偏吃出毛病；出去找快樂出了車禍；安穩坐在屋裡房子塌下來；一點傳染病也弄死了。"},{"類":"例","文":"前益不可保：賺了錢擺銀行，銀行倒閉；強盜知道你有錢把你抓去；股票跌了虧了本。"},{"文":"得盛事不可保：做了種種很好的，一下跌下來了；共住不可保：就是無伴。"}],"延伸":[],"逐字稿":[{"t":"71B 10:00","b":[["q","初中有四，"],["s","這個第一個就是無保信，有四個。"]]},{"t":"71B 10:08","b":[["q","一於所得身不可保信者，謂身數數捨。二作諸前益不可保信者，謂無決定。"],["s","這個身體的確的確、的確地你能信任嗎？你覺得那個身體弄得好，你準備一點營養，欸，結果偏偏吃下去的出了毛病。啊！你覺得這個好，跑出去為了要找一點快樂，跑出去出了車禍了。乃至於你安安穩穩坐在這個屋子裡面，叭！房子塌下來了。你沒有什麼事情，自己也看不見，對不起，一點傳染病，你也弄死掉了。那你就這樣啊！身不可保。還有呢前面作的「諸益」，哎唷，我覺得賺了一點錢，擺在銀行裡邊，結果銀行倒閉了；欸，結果人家曉得，強盜曉得你有了錢了，把你抓得去了，種種這些問題。唉呀，你忙那個股票，「叭！」一下，股票跌掉了、虧了本了。啊，一點意思都沒有啊！所以前面作的益不可保信。"]]},{"t":"71B 11:08","b":[["q","三於得盛事不可保信者，謂高下變易。"],["s","啊！你做了種種很好的，「叭嗒！」一下，跌下來了。"]]},{"t":"71B 11:16","b":[["q","四於諸共住不可保信者，謂無伴而往。"],["s","那就是這個。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/010.mp3"},{"文":"第三者謂數數結生，展轉受生不見邊際，«如是總攝亦當思惟»。","口譯":"第三項（無始而轉），就是數數結生，輾轉受生，看不見邊際。像這樣總攝起來，也應當思惟。","四家合註":null,"覺燈日光":null,"時":"71B 11:21","頁":166,"af":"71b","st":681,"et":767,"消文":[{"文":"第三就是「無始而轉」，不斷地在那個地方轉。"},{"文":"八苦我們常常聽見，六苦一般不大多，在這裡又多了一個思惟的苦。"}],"延伸":[{"題":"如是總攝亦當思惟","組":[{"題":"從項目中找相應感觸","說":[{"類":"立","文":"思八苦、六苦沒什麼太大關係；真正重要的是從這幾個項目當中，找到跟你相應的，忽然之間有深的感觸。"}]},{"題":"轉變錯誤概念，修行第一步","說":[{"類":"下手","文":"把當下的感觸不斷思惟觀察，讓認識的量產生強有的力量，把以前錯誤的概念轉變過來；修行第一步就是這個工作。"}]},{"題":"轉過來，一心念佛","說":[{"類":"例","文":"轉過來了，一心一意忙你要做的：念佛的，把嘴巴封起來心裡還在拼命念；生了病也不怕，正好到極樂世界去。"},{"類":"回扣","文":"所以說，低處修時，是高處到！"}]}],"說":[{"類":"立","文":"思八苦、六苦沒什麼太大關係；真正重要的是從這幾個項目當中，找到跟你相應的，忽然之間有深的感觸。"},{"類":"下手","文":"把當下的感觸不斷思惟觀察，讓認識的量產生強有的力量，把以前錯誤的概念轉變過來；修行第一步就是這個工作。"},{"類":"例","文":"轉過來了，一心一意忙你要做的：念佛的，把嘴巴封起來心裡還在拼命念；生了病也不怕，正好到極樂世界去。"},{"類":"回扣","文":"所以說，低處修時，是高處到！"}],"af":"71b","st":695}],"逐字稿":[{"t":"71B 11:21","b":[["q","第三者謂數數結生，展轉受生不見邊際，如是總攝亦當思惟。"],["s","就是這個道理。前面所謂這個第三的話，就是「無始而轉」，不斷地在那個地方去轉，這幾個道理。那麼這個是前面六苦，八苦我們常常聽見的，六苦我們一般不大多，所以在這個地方，我們又多了一個思惟的苦。其實思八苦、六苦沒什麼太大關係，真正重要的就是怎麼樣從這個幾個項目當中，能夠找到跟你相應的 ─欸，忽然之間你有深的感觸。然後呢把這個感觸，就是你當下的認識，然後呢不斷地去思惟觀察，把這個認識的量，產生強有的力量，把你以前錯誤的概念轉變過來，所以修行第一步就是這個工作。等到轉變過來了，那個時候，你一心一意地就忙你要做的事情。如果你念佛，叫你不念佛也談不到，把你嘴巴封起來，你心裡還在拼命念，生了病我也不怕，正好到極樂世界去，這樣好法呀！所以說，低處修時，是高處到！那麼下面："]]}],"口譯音":"口譯音檔/siwei-kudi-06/011.mp3"},{"文":"第三修三苦者。謂譬如極熱或瘡或癰，若於其上灑以冷水，似為安樂，於生死中所有樂受，若壞滅時，還起眾苦，«故名壞苦»。","口譯":"第三，修習三苦：譬如極熱的瘡或癰，如果在上面灑冷水，似乎覺得安樂；生死中所有的樂受，在它壞滅的時候，還會生起眾苦，所以名為壞苦。","四家合註":null,"覺燈日光":null,"時":"71B 12:47","頁":166,"af":"71b","st":767,"et":901,"消文":[{"文":"三苦：苦苦、樂苦以及行苦；第一個是樂苦。"},{"類":"喻","文":"生的瘡燙得要命、難受得要命，上面弄一點水涼一下，就好像是安樂。"},{"文":"生死當中所受的快樂也就是這個，本身並不是快樂；瘡破的時候是絕大的痛苦，所以快樂是一無可取。"}],"延伸":[{"題":"故名壞苦","組":[{"題":"可怕的不是苦，是樂","說":[{"類":"立","文":"真正可怕的不是苦，苦的事情還用佛來講嗎？真正我們要了解的是快樂。"},{"類":"因","文":"明明是苦的，我們看不見；不但看不見，上了它的當還要受種種大苦惱。"}]},{"題":"從此不再受騙","說":[{"類":"立","文":"一定要經過佛菩薩告訴我們，從此不再受你騙。"},{"類":"下手","文":"以前做的非法的事情、積聚，趕快丟掉；捨掉以後供養三寶、迴向。"}]},{"題":"以不可靠換堅實","說":[{"類":"下手","文":"趁有暇之身，以不可靠的換得堅實的法財。"},{"類":"下手","文":"這個身體也是如此，不要貪眼前一點點樂受；現在就努力懺悔、認真修習，可以得到堅實金剛不壞之身。"}]}],"說":[{"類":"立","文":"真正可怕的不是苦，苦的事情還用佛來講嗎？真正我們要了解的是快樂。"},{"類":"因","文":"明明是苦的，我們看不見；不但看不見，上了它的當還要受種種大苦惱。"},{"類":"立","文":"一定要經過佛菩薩告訴我們，從此不再受你騙。"},{"類":"下手","文":"以前做的非法的事情、積聚，趕快丟掉；捨掉以後供養三寶、迴向。"},{"類":"下手","文":"趁有暇之身，以不可靠的換得堅實的法財。"},{"類":"下手","文":"這個身體也是如此，不要貪眼前一點點樂受；現在就努力懺悔、認真修習，可以得到堅實金剛不壞之身。"}],"af":"71b","st":845}],"逐字稿":[{"t":"71B 12:47","b":[["q","第三修三苦者。謂譬如極熱或瘡或癰，若於其上灑以冷水，似為安樂，於生死中所有樂受，若壞滅時，還起眾苦，故名壞苦。"],["s","「三苦」是什麼呢？就是苦苦、樂苦以及行苦，這麼一個一樣。第一個是樂苦，樂苦他舉一個譬喻，就像「極熱或瘡或癰」，那個生的瘡，唉呀，那個地方燙得要命啊，難受得要命啊！然後呢上面弄一點水，哎呀，涼一下，就好像是安樂。我們生死當中所受的這個所謂快樂，也就是這個，也就是這個。其實這個本身並不是快樂，壞滅的時候呢，還要這種種的痛苦。這個癰跟瘡灑一點涼水覺得安樂，然後呢這個瘡破的時候，唉呀，那是絕大的痛苦啊！所以這個兩個是壞苦，快樂是一無可取。"]]},{"t":"71B 14:05","b":[["s","真正可怕的不是苦欸！苦的事情還用佛來講嗎？真正我們要了解的是快樂。我們明明是苦的，我們看不見；不但看不見，上了它當還要種種受大苦惱，所以一定要經過佛菩薩告訴我們，那從此不再受你騙啦！所以趕快以前做的那個非法的事情，積聚那個事情趕快丟掉，趕快捨掉了以後供養三寶、迴向。那自己趁有暇之身，不可靠的可以得到堅實的法財，這個是我們要了解的道理。至於這個身體亦是如此，不要貪眼前的一點點這種壞苦，這個樂受，趕快現在就努力去懺悔，認真修習，那可以得到堅實金剛不壞之身。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/012.mp3"},{"文":"此復非唯其受，即此相應，餘心心所及為所緣諸有漏境，皆是壞苦。","口譯":"而且不只是那個受，與它相應的其餘心、心所，以及作為所緣的各種有漏境界，都是壞苦。","四家合註":null,"覺燈日光":null,"時":"71B 15:01","頁":166,"af":"71b","st":901,"et":970,"消文":[{"文":"不但這個感受，跟它相應的其他心、心所，得到快樂的東西時心裡相應的念頭，凡是有漏境界都是壞苦。"},{"文":"為了一點享受的快樂，積聚財物、朋友、事業，種種無非從這上面牽牽連連牽出去。"},{"文":"了解了這一點，牽牽連連的事情都一刀切斷，根本都從這上頭來的。"}],"延伸":[],"逐字稿":[{"t":"71B 15:01","b":[["q","此復非唯其受，即此相應，餘心心所及為所緣諸有漏境，皆是壞苦。"],["s","通常我們講這個樂就是一種感受，要曉得不但這個感受，就是這個感受相應的其他的心、心所，譬如說你得到了一個快樂的東西，然後你心裡面跟它相應的這種念頭，都是屬於這一方面的。凡是有漏的這種境界都是壞苦，都是壞苦，這一點我們要了解。換句話，它從這個樂的感受上面，所產生的種種的境界，我們都應該知道，都應該知道。所以因為要一點享受的快樂，所以積聚了財物，所有的朋友，所有的事業，種種的無非從這個上面牽牽連連牽出去的。你了解了這一點，那牽牽連連的事情都一刀切斷，這根本都從這個上頭，都從這個上頭來的。下面："]]}],"口譯音":"口譯音檔/siwei-kudi-06/013.mp3"},{"文":"又如熱癰逼切，觸熱水等變異觸時，起極楚痛。如是當知苦受，隨纔生起，便能觸惱或身或心，故名苦苦。","口譯":"又如熱癰正在逼迫，再接觸熱水等變異的觸時，就生起極大的楚痛。像這樣，應當了知苦受，隨著它才一生起，就能觸惱身或心，所以名為苦苦。","四家合註":null,"覺燈日光":null,"時":"71B 16:10","頁":166,"af":"71b","st":970,"et":1019,"消文":[{"文":"苦苦還是講熱癰：身上生了大瘡，本身已經痛苦極了，碰到一下更痛，破了以後絕端地痛苦。"},{"文":"這個苦受才一生起，你就受不了，身上、心上這個就是苦。"}],"延伸":[],"逐字稿":[{"t":"71B 16:10","b":[["q","又如熱癰逼切，觸熱水等變異觸時，起極楚痛。如是當知苦受，隨纔生起，便能觸惱或身或心，故名苦苦。"],["s","這樣。那麼進一步講「苦苦」，苦苦是什麼呢？還是講這個熱的這個癰 ─癰就是身上生了個大瘡，生了個大瘡，這個非常厲害的。唉呀，這個瘡本身是痛苦極了！然後呢或者「觸惱」，本來已經痛苦了，你碰到一下，唉呀！這樣痛苦。然後破了以後更是絕端地痛苦，這個苦受本身就是這樣，這個苦受才一生起你就受不了，啊，身上、心上這個就是苦。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/014.mp3"},{"文":"«譬如腎痛»。此復如前，非唯其受。","口譯":"譬如腎痛。這也和前面一樣，不只是那個受（相應的心、心所及所緣境也都是苦苦）。","四家合註":null,"覺燈日光":null,"時":"71B 16:59","頁":166,"af":"71b","st":1019,"et":1233,"消文":[{"文":"腎痛，就是肚子裡面痛，像結石那個痛苦。"},{"文":"同樣地，不但是受，其他相應的心、心所等等，也應該了解。"}],"延伸":[{"題":"譬如腎痛","組":[{"題":"親見結石之苦","說":[{"類":"例","文":"我一位老師有結石；洛杉磯蓮社一位朋友，平常不痛，一痛痛了一個鐘頭，在地上直滾、滿頭是汗，旁邊一點辦法都沒有，送醫院也沒用。"},{"類":"例","文":"有一次我緊急送到急診室，旁邊一個女的喊得之悽慘，醫生病根沒找到，一點辦法都沒有。"}]},{"題":"說不怕是沒看見","說":[{"類":"破","文":"我們說不怕，實在是愚癡沒看見；看見了沒有一個人不怕的。"},{"類":"例","文":"我這兩天腳底按摩，算不了什麼，痛的時候實在難受；你們最好自己試試，就曉得怕不怕。"},{"類":"喻","文":"真正看到苦的形相，就像一根繩子一放手，癱下來了，塌在地上爬都爬不起來。"}]},{"題":"趁腦筋好時忙這些","說":[{"類":"立","文":"經上說，比起地獄來，地獄如果只感得這樣，遠比天堂還要好。"},{"類":"下手","文":"不要說不怕，要多去思惟；趁現在腦筋好好的時候，該忙的是忙這些事情。"}]},{"題":"樂不受騙，苦推向上","說":[{"類":"立","文":"想到這些，會策發大厭離，拼命努力。"},{"類":"立","文":"樂受來了不再被它騙；想到痛苦，拼命推你上去，那時當然只有一條修行的路。"}]}],"說":[{"類":"例","文":"我一位老師有結石；洛杉磯蓮社一位朋友，平常不痛，一痛痛了一個鐘頭，在地上直滾、滿頭是汗，旁邊一點辦法都沒有，送醫院也沒用。"},{"類":"例","文":"有一次我緊急送到急診室，旁邊一個女的喊得之悽慘，醫生病根沒找到，一點辦法都沒有。"},{"類":"破","文":"我們說不怕，實在是愚癡沒看見；看見了沒有一個人不怕的。"},{"類":"例","文":"我這兩天腳底按摩，算不了什麼，痛的時候實在難受；你們最好自己試試，就曉得怕不怕。"},{"類":"喻","文":"真正看到苦的形相，就像一根繩子一放手，癱下來了，塌在地上爬都爬不起來。"},{"類":"立","文":"經上說，比起地獄來，地獄如果只感得這樣，遠比天堂還要好。"},{"類":"下手","文":"不要說不怕，要多去思惟；趁現在腦筋好好的時候，該忙的是忙這些事情。"},{"類":"立","文":"想到這些，會策發大厭離，拼命努力。"},{"類":"立","文":"樂受來了不再被它騙；想到痛苦，拼命推你上去，那時當然只有一條修行的路。"}],"af":"71b","st":1030}],"逐字稿":[{"t":"71B 16:59","b":[["q","譬如腎痛。此復如前，非唯其受。"],["s","那麼，這個同樣地，就是我們裡邊的腎痛，就是肚子痛。或者是通常情況之下，我們 ……不曉得你們有沒有結石那個痛苦？我曾經以前看見過一個，我一個老師，他有那個結石，到後來，唉呀，據說那個痛苦得 ……。我還有一個朋友，還有一個朋友，哎喲！我看見了，他平常的時候不痛，一旦痛起來的話，那簡直是，一個好好的人，忽然之間痛了，忽然之間痛了，那就是我洛杉磯蓮社的那個朋友。他那一天痛，痛得啊，一痛痛了一個鐘頭。那個頭上的汗，那我們旁邊是一點辦法都沒有，他太太、他女兒、他的親戚朋友，我們說：「趕快送到醫院。」他們說：「沒有用，前面已經在台灣的時候送過幾次醫院，看了醫生，一點用場都沒有。」就是硬是就是在那個地上直滾、直弄，滿頭是汗，旁邊是一點辦法都沒有！"]]},{"t":"71B 18:02","b":[["s","所以我們現在說不怕、不怕呀，我說實在是，我們愚癡沒看見，看見了沒有一個人不怕的。我這兩天腳底按摩，那個說實在是算不了什麼，可是到那個時候痛的時候，實在是難受啊！我們不要說不怕，所以我一直建議你們不要說不怕，你們最好自己試試，你們就曉得自己怕不怕。佛看得最清楚，所以你們眾生愚癡啊！如果你們像我這樣看見那個真正痛苦的話，沒有一個人例外，都像葦蘆一樣，就像什麼？就像一根繩子一樣，你一放手就 ─癱下來了。假定你們真正看到那個苦的形相的話，沒有一個人例外的，塌在地上爬都爬不起來了，這麼個嚴重法，那個痛苦的事情啊！所以他說「譬如腎痛」，這個的確我所看見的最痛的事情。"]]},{"t":"71B 18:58","b":[["s","我看見過好幾次，啊！這個痛苦的事情，有一次在醫院裡也是一樣。我有一次緊急地送到那個急診室，結果旁邊後來來了一個人，一個女的就喊，喊那個聲音之悽慘哪！那個醫生在旁邊，那個醫生就拿她一點辦法都沒有，欸，那個病根沒找到，就是沒辦法。唉！所以這個世間，後來我看看經，說這種痛苦在比起地獄裡面來啊，那地獄裡如果感得這樣，遠比天堂還要好。這種事情都是千真萬確的事實，所以我們不要說不怕，我們要多去思惟，趁現在我們的那個腦筋好好的時候，我們該忙的是忙這些事情啊！"]]},{"t":"71B 19:46","b":[["s","那麼這個同樣地不但是受，還有其他的相應的心、心所等等，我們也應該了解，應該了解。為什麼呀？當你想到這些的話，啊！你會策發大厭離，拼命努力。關於那個樂受呢，你一想到這個苦，你就不再它受騙，當快樂的事情你不再它受騙，然後呢你不被騙了，第一個。第二個你想到痛苦的時候，拼命推你上去，那個時候當然只有一條修行的路。欸，下面還有一個，但是有的時候既不快樂也不苦，怎麼辦？還有一個辦法，說"]]}],"口譯音":"口譯音檔/siwei-kudi-06/015.mp3"},{"文":"又如熱癰，俱未觸會二觸之時，有漏捨受，為諸粗重之所隨逐，故名行苦。此亦如前，非唯其受，","口譯":"又如熱癰，在還沒有接觸前面兩種觸（冷水與熱水）的時候，有漏的捨受，被各種粗重所隨逐，所以名為行苦。這也和前面一樣，不只是那個受，","四家合註":null,"覺燈日光":null,"時":"71B 20:33","頁":166,"af":"71b","st":1233,"et":1280,"消文":[{"文":"像那個瘡，雖然沒碰到前面兩樣東西，這是有漏的；它繼續向前，眼前暫時碰不到，這兩樣都跟著來了，所以叫行苦。"},{"文":"不管眼前受的是苦、樂或不苦不樂，最後的根結就是這個；心、心所法都是這個樣。"}],"延伸":[],"逐字稿":[{"t":"71B 20:33","b":[["q","又如熱癰，俱未觸會二觸之時，有漏捨受，為諸粗重之所隨逐，故名行苦。"],["s","同樣地，就像那個瘡一樣，那個時候雖然沒有碰到前面兩樣東西，對不起，這是有漏的，這是有漏的呀！它繼續地向前，眼前暫時碰不到，一塊兒這兩樣東西都跟著來了，所以叫「行苦」。所以總之一句話，不管眼前受的是苦、樂，或者不苦不樂，最後的根結就是這個樣啊！"]]},{"t":"71B 21:13","b":[["q","此亦如前，非唯其受，"],["s","同樣地，是它心、心所法都是這個樣啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-06/016.mp3"},{"文":"此由先業煩惱«自在而轉»，故名為苦，","口譯":"這是由先前的業與煩惱所支配而轉，所以名為苦，","四家合註":null,"覺燈日光":null,"時":"71B 21:20","頁":166,"af":"71b","st":1280,"et":1405,"消文":[{"文":"一切都是宿生以前的煩惱跟業兩樣東西，輾轉引生推衍；除了修有力的對治現在擋住以外，它永遠這樣。"}],"延伸":[{"題":"自在而轉","組":[{"題":"認得沒辦法，已經好了","說":[{"類":"立","文":"說到這裡，立刻可以體會等流的狀態：境界現起的時候，的的確確我們沒有辦法。"},{"類":"立","文":"當你認得沒有辦法，那已經好了，已經認得它了。"},{"類":"破","文":"真正可憐的是不認識它，總覺得：「自己好像很有道理喔！」"}]},{"題":"聽經木然，不識無明","說":[{"類":"因","文":"為什麼聽了經心裡木然沒有感受？就是根本不認識我們的真實狀態在無明當中，聽了模模糊糊。"},{"類":"立","文":"一旦聽懂了，碰到哪裡自然會有驚心動魄之感：真的這個心就是跟法不相應，就在煩惱當中。"}]},{"題":"業熟作不得主","說":[{"類":"立","文":"一切時處都在煩惱當中：前面是煩惱而來，後面又跟煩惱而去。"},{"類":"例","文":"聽經聽完覺得「滿好」，聽完了也就這麼跟著去了；聽經尚且如此，其他能作得了主嗎？"},{"類":"回扣","文":"業成熟的時候一點辦法都沒有；沒有修對治超出來之前，永遠脫不出這個狀態，「故名為苦」。"}]}],"說":[{"類":"立","文":"說到這裡，立刻可以體會等流的狀態：境界現起的時候，的的確確我們沒有辦法。"},{"類":"立","文":"當你認得沒有辦法，那已經好了，已經認得它了。"},{"類":"破","文":"真正可憐的是不認識它，總覺得：「自己好像很有道理喔！」"},{"類":"因","文":"為什麼聽了經心裡木然沒有感受？就是根本不認識我們的真實狀態在無明當中，聽了模模糊糊。"},{"類":"立","文":"一旦聽懂了，碰到哪裡自然會有驚心動魄之感：真的這個心就是跟法不相應，就在煩惱當中。"},{"類":"立","文":"一切時處都在煩惱當中：前面是煩惱而來，後面又跟煩惱而去。"},{"類":"例","文":"聽經聽完覺得「滿好」，聽完了也就這麼跟著去了；聽經尚且如此，其他能作得了主嗎？"},{"類":"回扣","文":"業成熟的時候一點辦法都沒有；沒有修對治超出來之前，永遠脫不出這個狀態，「故名為苦」。"}],"af":"71b","st":1305}],"逐字稿":[{"t":"71B 21:20","b":[["q","此由先業煩惱自在而轉，故名為苦，"],["s","為什麼呀？因為這個東西是一切都是我們宿生以前，現在、以前的煩惱跟業兩樣東西，輾轉引生推衍。既然是由這個東西輾轉引生推衍，一直有這個東西，所以除了你修有力的對治，現在擋住以外，它永遠這樣。說到這裡，我們立刻可以體會一下等流的狀態：就是當這個境界現起的時候，的的確確我們沒有辦法。當你認得沒有辦法，那已經好的，你已經曉得沒有辦法，就是已經認得它了；真正可憐的我們不認識它，我們總覺得：「啊，自己好像很有道理喔！」"]]},{"t":"71B 22:16","b":[["s","平常為什麼我們聽了這個經了以後，心裡面木然沒有感受？就是我們根本就不認識我們的真實狀態在無明當中，所以聽了模模糊糊的，這個是我們必定要了解的一個現象。等到你一旦聽懂了，你凡是碰到哪裡，你自然而然會有驚心動魄之感─唉呀，真的你這個心就是這個樣，跟法不相應！跟法不相應是什麼呢？就是在煩惱當中。所以我們現在一切時處，都在這個煩惱當中，前面是煩惱而來，後面又跟煩惱而去。儘管我們在那兒聽經，你聽經了以後，覺得：「欸，是滿好。」聽完了以後呢，它也就是這麼跟著去了。你聽經尚且是如此，還有其他的，你能作得了主嗎？所以這個業成熟的時候是一點用場都沒有，一點辦法都沒有，這是我們要了解的。所以這個苦的特質就在這裡，注定你，你沒有修對治超出來之前，永遠脫不出這個狀態。「故名為苦」。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/017.mp3"},{"文":"及為能發後煩惱種，所隨逐故，名為徧行粗重所隨。","口譯":"並且因為被能引發後來煩惱的種子所隨逐，所以名為「徧行粗重所隨」。","四家合註":null,"覺燈日光":null,"時":"71B 23:25","頁":166,"af":"71b","st":1405,"et":1457,"消文":[{"文":"不但眼前這樣，還會引發後面的煩惱種；「種」就是繼續不斷地增長，一直跟著你，所以叫「徧行」。"},{"文":"一切時、一切處、一切地，三界之內沒有例外：醒著、睡覺，糊塗的、聰明的都如此；念書念得好也沒有用。"}],"延伸":[],"逐字稿":[{"t":"71B 23:25","b":[["q","及為能發後煩惱種，所隨逐故，名為徧行粗重所隨。"],["s","不但眼前是這樣，而且呢它還會引發後面的「煩惱種」，「種」就是它繼續不斷地增長，一直跟著你，所以叫「徧行」。這個徧行，在任何一切時、一切處、一切地，只要三界之內，沒有一個例外。醒著也是如此，睡覺也是如此；你糊塗的是如此，你聰明的也是如此。啊呀，我念書可以念得很好，對不起，沒有用！我就不管它，不管它也沒有用！睡著了，睡著了也沒有用。它在任何情況之下，這個東西一直跟著你，只要它跟著你，哪！後面這些都會來了。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/018.mp3"},{"文":"如是若起樂受，貪欲增長。若起苦受，瞋恚增長。苦樂俱非隨粗重身，則於無常執為常等，愚癡增長。","口譯":"像這樣，如果生起樂受，貪欲就增長；如果生起苦受，瞋恚就增長；不苦不樂、隨逐粗重的身，就會把無常執為常等，愚癡增長。","四家合註":null,"覺燈日光":null,"時":"71B 24:17","頁":166,"af":"71b","st":1457,"et":1519,"消文":[{"文":"快樂的，增長你的貪；苦的，瞋恚增長，你不願意。"},{"文":"不苦不樂還覺得無所謂、滿安樂而過；不僅執無常為常，下面所有的顛倒都跟著來，愚癡增長。"},{"文":"只要你不認識，乃至認識了又不對治，永遠增長三毒；懂得了還不夠，要用對治去思惟。"}],"延伸":[],"逐字稿":[{"t":"71B 24:17","b":[["q","如是若起樂受，貪欲增長。"],["s","快樂的，增長你的貪。"]]},{"t":"71B 24:23","b":[["q","若起苦受，瞋恚增長。"],["s","苦的，瞋恚增長。唉呀，你不願意啊！"]]},{"t":"71B 24:30","b":[["q","苦樂俱非隨粗重身，則於無常執為常等，愚癡增長。"],["s","假定說既不苦又不樂，你還覺得無所謂，於是你心裡面覺得：「啊！這樣滿安樂而過。」「於無常執為常等」，不僅僅是單單執無常執常哦，下面的所有的顛倒都跟著來了，「愚癡增長」。所以只要你不認識，乃至於認識了又不對治，永遠增長了三毒，就是這樣。所以這個真正的道理我們要懂得，當你真正懂得了這個以後，然後還不夠，要用對治去思惟呀！"]]}],"口譯音":"口譯音檔/siwei-kudi-06/019.mp3"},{"文":"其中貪欲能感當來於五趣中生等眾苦。瞋於現法起憂慼等，於後法中感惡趣苦。癡於前二所感二苦隨逐不捨。","口譯":"其中，貪欲能感得未來在五趣中受生等眾苦；瞋恚在現生中生起憂慼等，在後世感得惡趣之苦；愚癡則使前面二者所感的兩種苦，隨逐不捨。","四家合註":null,"覺燈日光":null,"時":"71B 25:19","頁":166,"af":"71b","st":1519,"et":1556,"消文":[{"文":"貪：所有結生最主要的就是貪，然後眾苦。"},{"文":"瞋：不但將來苦，眼前就苦；眼前苦，將來還一定感到惡趣苦。"},{"文":"癡：因為癡，前面的貪、瞋永遠跟著它。"}],"延伸":[],"逐字稿":[{"t":"71B 25:19","b":[["q","其中貪欲能感當來於五趣中生等眾苦。瞋於現法起憂慼等，於後法中感惡趣苦。"],["s","貪，因為你貪著，所有的結生最主要的，主要的就是這個 ─貪，然後呢眾苦。瞋，不但是將來苦，眼前就苦；眼前苦，將來還要一定感到惡趣苦。"]]},{"t":"71B 25:45","b":[["q","癡於前二所感二苦隨逐不捨。"],["s","癡，因為癡，所以前面這個貪、瞋永遠跟著它。唉！從這個地方我們就應該："]]}],"口譯音":"口譯音檔/siwei-kudi-06/020.mp3"},{"文":"故於樂受，應觀為苦滅除貪欲。","口譯":"所以對於樂受，應當觀察它是苦，以滅除貪欲。","四家合註":null,"覺燈日光":null,"時":"71B 25:56","頁":166,"af":"71b","st":1556,"et":1571,"消文":[{"文":"這是根本：快樂的事情起來了，趕快說：「大騙子！趕快不要上它當，趕快停止！」"}],"延伸":[],"逐字稿":[{"t":"71B 25:56","b":[["q","故於樂受，應觀為苦滅除貪欲。"],["s","這個是我們的根本，當快樂的事情起來了，趕快說：「啊！大騙子，你趕快不要上它當，趕快停止啊！」"]]}],"口譯音":"口譯音檔/siwei-kudi-06/021.mp3"},{"文":"於諸苦受，應作是思，«此蘊即是眾苦因緣»，","口譯":"對於各種苦受，應當這樣思惟：這個蘊就是眾苦的因緣，","四家合註":null,"覺燈日光":null,"時":"71B 26:11","頁":166,"af":"71b","st":1571,"et":1690,"消文":[{"文":"對苦受要曉得：這個蘊本身就是眾苦的因緣。"}],"延伸":[{"題":"此蘊即是眾苦因緣","組":[{"題":"五蘊熾盛的根本","說":[{"類":"立","文":"為什麼特別說這一點？真正最重要推動我們的是苦諦：本來這個身體、整個五蘊，就是眾苦因緣。"},{"類":"破","文":"平常常說「五蘊熾盛」，道理說了半天，根本都沒把握住。"},{"類":"立","文":"只要這個心念、這個身體存在，永遠在生死當中、痛苦當中。"}]},{"題":"火燒頭燃尚可暫置","說":[{"類":"回扣","文":"所以才會產生「火燒頭燃尚可暫置，無常盛火應速除滅」。"},{"類":"立","文":"有了這個認識以後，什麼事情都可以放得下，趕快要解決它。"}]},{"題":"生死心切","說":[{"類":"例","文":"佛世的羅漢沒有一個例外；禪宗大德「生死心切」，要找到根本，哪有一分鐘可以放下來。"}]},{"題":"戒淨禪教從此建立","說":[{"類":"立","文":"這是現在修行的根本：戒從這裡持起，佛從這裡念起，禪從這裡參起，教也是告訴你認得這個；建立起來才談得到學密。"},{"類":"下手","文":"先看看這個認得與否？不認得，停在這個地方，不必忙；做好了，下面自然有。"}]}],"說":[{"類":"立","文":"為什麼特別說這一點？真正最重要推動我們的是苦諦：本來這個身體、整個五蘊，就是眾苦因緣。"},{"類":"破","文":"平常常說「五蘊熾盛」，道理說了半天，根本都沒把握住。"},{"類":"立","文":"只要這個心念、這個身體存在，永遠在生死當中、痛苦當中。"},{"類":"回扣","文":"所以才會產生「火燒頭燃尚可暫置，無常盛火應速除滅」。"},{"類":"立","文":"有了這個認識以後，什麼事情都可以放得下，趕快要解決它。"},{"類":"例","文":"佛世的羅漢沒有一個例外；禪宗大德「生死心切」，要找到根本，哪有一分鐘可以放下來。"},{"類":"立","文":"這是現在修行的根本：戒從這裡持起，佛從這裡念起，禪從這裡參起，教也是告訴你認得這個；建立起來才談得到學密。"},{"類":"下手","文":"先看看這個認得與否？不認得，停在這個地方，不必忙；做好了，下面自然有。"}],"af":"71b","st":1580}],"逐字稿":[{"t":"71B 26:11","b":[["q","於諸苦受，應作是思，此蘊即是眾苦因緣，"],["s","那麼對於這個苦受要曉得：啊！這個蘊本身哪，就是眾苦的因緣。為什麼這地方特別說這一點？就是說它真正最重要推動我們的 ─苦諦。所以從這個苦諦上面想到：我們本來這個身體，我們整個的這個東西，就是眾苦的因緣。所以它這個，我們平常常常說「五蘊熾盛、五蘊熾盛」，說了半天，道理說了半天，根本都沒把握住。它這個五蘊熾盛的根本，就從這個地方你認得，你只要這個東西存在，只要那個心念存在，只要這個身體存在，對不起，永遠都在生死當中，永遠痛苦當中。所以你才會產生什麼？說「火燒頭燃尚可暫置，無常盛火應速除滅」。你一旦有了這個認識以後，什麼事情都可以放得下的，唉呀！不去管它，你趕快這個，要解決它！"]]},{"t":"71B 27:19","b":[["s","佛世的那些羅漢，沒有一個例外的！所以以後的大德們，你看禪宗的這個大德：啊！什麼時候死不知道，「生死心切」，要找到根本，他哪有一分鐘可以放下來！所以這是才我深深覺得我們現在修行的根本哪！你有了這個，戒從這個地方持起，佛從這個地方念起，禪從這個地方參起，教也是告訴你認得這個東西，沒有一個 ……。你把這個建立起來了，那個時候你才進一步談得到學密。所以現在我們不必談其他的，先看看這個認得與否？不認得，停在這個地方，不必忙，做好了下面自然有。所以說："]]}],"口譯音":"口譯音檔/siwei-kudi-06/022.mp3"},{"文":"苦從此生，猶如毒箭，滅除瞋恚。於諸捨受，應觀無常銷滅為性，滅除愚癡。不於三受為三毒因，此如《瑜伽師地》及〈攝決擇〉意趣而說。","口譯":"苦從這裡生起，猶如毒箭，以此滅除瞋恚。對於各種捨受，應當觀察它以無常銷滅為本性，以此滅除愚癡。不讓三受成為三毒之因，這是依照《瑜伽師地論》及〈攝決擇分〉的意趣而說的。","四家合註":null,"覺燈日光":null,"時":"71B 28:10","頁":166,"af":"71b","st":1690,"et":1722,"消文":[{"文":"苦從此生，不要對他瞋惱。"},{"文":"任何一個境界現起的時候，不要引生三毒。"},{"文":"這一點停在這個地方，一段還有深刻的意義。"}],"延伸":[],"逐字稿":[{"t":"71B 28:10","b":[["q","苦從此生，猶如毒箭，滅除瞋恚。"],["s","不要對他瞋惱。"]]},{"t":"71B 28:16","b":[["q","於諸捨受，應觀無常銷滅為性，滅除愚癡。不於三受為三毒因，"],["s","當任何一個境界現起的時候，你不要引生三毒。"]]},{"t":"71B 28:27","b":[["q","此如《瑜伽師地》及〈攝決擇〉意趣而說。"],["s","他這個告訴我們這樣，這告訴我們這樣！這一點我停在這個地方，一段還有深刻的意義。"]]}],"口譯音":"口譯音檔/siwei-kudi-06/023.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-06/001.webp","n":1},{"img":"投影片/siwei-kudi-06/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/siwei-kudi-06/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/siwei-kudi-06/004.webp","n":4},{"img":"投影片/siwei-kudi-06/005.webp","n":5},{"img":"投影片/siwei-kudi-06/006.webp","n":6},{"img":"投影片/siwei-kudi-06/007.webp","n":7},{"img":"投影片/siwei-kudi-06/008.webp","n":8,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=71a&st1=1444&et1=1693","box":[0.133625,0.3091111111111111,0.13775,0.07733333333333334]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-06/009.webp","n":9},{"img":"投影片/siwei-kudi-06/010.webp","n":10},{"img":"投影片/siwei-kudi-06/011.webp","n":11},{"img":"投影片/siwei-kudi-06/012.webp","n":12,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=71a&st1=1693&et1=1802","box":[0.546125,0.29688888888888887,0.1365,0.06622222222222222]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/siwei-kudi-06/013.webp","n":13},{"img":"投影片/siwei-kudi-06/014.webp","n":14},{"img":"投影片/siwei-kudi-06/015.webp","n":15,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=71b&st1=0&et1=150","box":[0.123625,0.358,0.1265,0.07288888888888889]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-06/016.webp","n":16},{"img":"投影片/siwei-kudi-06/017.webp","n":17},{"img":"投影片/siwei-kudi-06/018.webp","n":18},{"img":"投影片/siwei-kudi-06/019.webp","n":19,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch= 66666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-06/055.webp","n":57,"yt":"E1qFpq1i0fY"},{"img":"投影片/siwei-kudi-06/056.webp","n":58}],"投影片PDF":"投影片/siwei-kudi-06/slides.pdf","音檔範圍":"71A 24:04～71B 28:42"},"siwei-kudi-07":{"id":"siwei-kudi-07","標題":"思惟苦諦(7)","根":"思惟三苦","科判焦點":"丑三 思惟三苦","課本範圍":"P167 L1 ~ P169 L6","堂數":91,"日期":"2026/12/15","分圖":[{"名":"取蘊重擔・行苦根本","原文":[0,4]},{"名":"樂是苦漸息滅位","原文":[5,10]},{"名":"人苦・非天苦","原文":[11,18],"根":"思惟別苦"},{"名":"欲天三苦","原文":[19,27],"根":"思惟別苦"}],"跨科判":[{"科判":"子二 思惟別苦","起":11}],"週":116,"班級":"24秋007","音檔":{"72a":{"local":"音檔/gl1/072A.mp3","remote":"https://lamrim.xyz/player/media/gl1/072A.mp3"},"72b":{"local":"音檔/gl1/072B.mp3","remote":"https://lamrim.xyz/player/media/gl1/072B.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=72a&st1=73&af2=72b&et2=809","段":[{"文":"如負重擔，隨其重擔當負幾久，便有爾許不樂，取蘊重擔亦爾，","口譯":"如同背負重擔，隨著那重擔要背負多久，就有多久的不樂；取蘊的重擔也是這樣，","四家合註":null,"覺燈日光":null,"時":"72A 01:13","頁":167,"af":"72a","st":73,"et":130,"消文":[{"文":"苦諦的根本就在五取蘊，就是我們的身心；簡單說就是平常講的「我」，每個人自己的主體。"},{"類":"喻","文":"像挑了幾百斤的重擔，只要擔子還在身上沒卸下來，痛苦一直在，快樂永遠沒辦法解決。"},{"文":"「取蘊重擔亦爾」，這一句話我們要著眼。"}],"延伸":[],"逐字稿":[{"t":"72A 01:13","b":[["q","如負重擔，隨其重擔當負幾久，便有爾許不樂，取蘊重擔亦爾，"],["s","它真正的這個苦諦的根本在哪裡？就在那個五取蘊，換句話說，哪！就是我們的身心。簡單來說，就是說平常我們講的這個我，任何一個人，他那個人他自己的主體。就像挑了一個幾百斤的重擔一樣，只要他那個擔子還在身上沒有卸下來，對不起，那個痛苦一直在，那個快樂永遠沒有辦法解決。所以說「取蘊重擔亦爾」，這一句話我們要著眼。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/001.mp3"},{"文":"乃至«執持»爾時受苦，","口譯":"只要還執持著，那時就會受苦，","四家合註":null,"覺燈日光":null,"時":"72A 02:10","頁":167,"af":"72a","st":130,"et":214,"消文":[{"文":"只要沒有對治把它徹底解決，那時就是「執持」；只要它還在執著，那時一定受苦。"}],"延伸":[{"題":"執持","組":[{"題":"執持即我執法執","說":[{"類":"立","文":"執持是心裡無始以來的習氣，不知不覺一直在這個上頭，所以叫我執、法執。"}]},{"題":"從名詞找到內涵","說":[{"類":"破","文":"平常都這麼說，可是我執是什麼？法執是什麼？不知道；認得兩個名字，對解決真實問題眼前沒有用場。"},{"類":"下手","文":"必定要從這兩個名詞上，找到名詞所指的內涵；找到了內涵，那時才可以把它拿掉。"}]}],"說":[{"類":"立","文":"執持是心裡無始以來的習氣，不知不覺一直在這個上頭，所以叫我執、法執。"},{"類":"破","文":"平常都這麼說，可是我執是什麼？法執是什麼？不知道；認得兩個名字，對解決真實問題眼前沒有用場。"},{"類":"下手","文":"必定要從這兩個名詞上，找到名詞所指的內涵；找到了內涵，那時才可以把它拿掉。"}],"af":"72a","st":140}],"逐字稿":[{"t":"72A 02:10","b":[["q","乃至執持爾時受苦，"],["s","只要你沒有對治把它徹底地解決，那個時候就是「執持」。這個執持是心裡面無始以來的習氣，不知不覺當中一直在這個上頭，所以叫我執、法執。平常我們都這麼說，可是我執是什麼？不知道。法執是什麼？不知道。那這種狀態當中，你認得兩個名字，對於我們解決這個真實問題，眼前並沒有用場，而這個苦惱卻是眼前逼在這個地方。所以你必定要從這兩個名詞上面，找到名詞所指的內涵何在，找到了這個內涵，那個時候你才可以把它拿掉。所以說這個「執持」，那就是，喏！這兩個名詞所代表的實際的意義，只要它還在執著著，那時候一定受苦。那麼，為什麼呀？"]]}],"口譯音":"口譯音檔/siwei-kudi-07/002.mp3"},{"文":"以此蘊中有苦煩惱粗重安住，故為行苦。","口譯":"因為這個蘊中，有苦與煩惱的粗重安住，所以是行苦。","四家合註":null,"覺燈日光":null,"時":"72A 03:34","頁":167,"af":"72a","st":214,"et":297,"消文":[{"文":"這個蘊當中，苦的根本「煩惱粗重」就在裡頭，所以叫行苦。"},{"文":"眼前雖然沒現出來，它一直向前不停；不是真的不苦，只是好像沒受大苦，隨時遇到緣，苦性就顯發出來。"},{"文":"這個緣是無量劫以來集的；這是我們生死大痛苦的重擔，要對治的就在這裡。"},{"文":"這一點不認識，所有的佛法無根本，沒有建立處。"}],"延伸":[],"逐字稿":[{"t":"72A 03:34","b":[["q","以此蘊中有苦煩惱粗重安住，故為行苦。"],["s","在這個蘊當中，就是這個苦的根本是「煩惱粗重」，就在這個裡頭，就在這個裡頭，所以這個叫作「行苦」。眼前雖然沒現出來，但是它隨時一直在向前不停的；既然不停的話，並不安住在眼前好像不苦那個階段。不是真的不苦哦，只是好像沒有受大苦，但是一直推動的話，它隨時遇到緣，哪！那個苦性就馬上顯發出來。而這個緣也就是我們無量劫以來集的，不曉得多多少少，這個是我們要了解的。所以真正講的這個苦的種種，最後我們要認識的，就是認識說：哦！原來就在這個上頭，這個是我們生死大痛苦的重擔，所以要對治的就在這個地方。所以關於這一點你不認識的話，那所有的佛法無根本，沒有建立處。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/003.mp3"},{"文":"既有此已，雖於現在苦受未生，然其無間由種種門能起眾苦，","口譯":"既然有了這個（取蘊），雖然現在苦受尚未生起，然而它無間斷地由種種門能生起眾苦，","四家合註":null,"覺燈日光":null,"時":"72A 04:57","頁":167,"af":"72a","st":297,"et":328,"消文":[{"文":"只要這個蘊在，煩惱的粗重就安住在上頭；現在雖然沒有生苦，「無間」不停地，遇到內外種種的緣，苦就起來了。"}],"延伸":[],"逐字稿":[{"t":"72A 04:57","b":[["q","既有此已，雖於現在苦受未生，然其無間由種種門能起眾苦，"],["s","這只要一旦這個蘊在，因為蘊在，所以煩惱的粗重就安住在這個上頭。在這種狀態，現在雖然沒有生苦，但是「無間」 ─不停地，讓那個不同的門，遇種種的緣，內、外的等等，那苦就起來了。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/004.mp3"},{"文":"故此行苦，徧一切苦及是所餘二苦根本，故應於此«多修厭離»。","口譯":"所以這個行苦，遍於一切苦，並且是其餘二苦（苦苦、壞苦）的根本，所以應當對此多修厭離。","四家合註":null,"覺燈日光":null,"時":"72A 05:28","頁":167,"af":"72a","st":328,"et":599,"消文":[{"文":"最後歸結到應該了解的：這個苦是徧一切處的，在我們感受上卻偏偏感受不到。"},{"文":"平常一直講苦，從來不注意佛告訴我們苦諦的苦，要找的根本卻在這個地方。"}],"延伸":[{"題":"多修厭離","組":[{"題":"感受不到，只是人天乘","說":[{"類":"破","文":"這個如果感受不到，所謂佛法最多只是人天乘；人天乘另一個名字叫「三世怨」，你願意做三世怨的事嗎？"},{"類":"破","文":"太多人修學佛法，說佛法好，好在哪裡不一定知道；從什麼地方開始修也不知道。"}]},{"題":"生老病死，不待人教","說":[{"類":"喻","文":"說世間苦，就說生老病死；這種事還要人家告訴，我們實在太笨，動物碰見痛苦也曉得避免。"},{"類":"回扣","文":"這是根本所在，務必在這個地方注意。"}]},{"題":"多思惟修習，生起相應量","說":[{"類":"立","文":"了解不是就行：理論上雖然如此，眼前感受上很難體會。"},{"類":"下手","文":"必定要多思惟、多修習，一直到內心生起相應的量，那時會生起大厭離；修學佛法第一個根本厭離心，必定從這裡出來。"},{"類":"破","文":"沒辦法真正感受到，單單了解，又是三世怨，變成世間很聰明的那些人。"}]},{"題":"智者視善趣如那洛迦","說":[{"類":"立","文":"厭離心生起來以後，哪怕生到天上，深深了解行苦自性還沒有解脫，所以「智者視善趣等同那洛迦」。"},{"類":"因","文":"只要那個取蘊還在，問題沒有解決。"}]},{"題":"如理去做，便有感受","說":[{"類":"例","文":"最近開始說懺悔等等，就有同學產生不同的感受；產生感受的，都是能如理去做的人。"},{"類":"立","文":"懂得很多卻放逸而轉，不相應，沒有用；知道得少，做了馬上得到好處。"},{"類":"破","文":"不要誤解成「那就不要懂得很多」：如法懂得一點就得一點好處，懂得更多好處更多。"}]}],"說":[{"類":"破","文":"這個如果感受不到，所謂佛法最多只是人天乘；人天乘另一個名字叫「三世怨」，你願意做三世怨的事嗎？"},{"類":"破","文":"太多人修學佛法，說佛法好，好在哪裡不一定知道；從什麼地方開始修也不知道。"},{"類":"喻","文":"說世間苦，就說生老病死；這種事還要人家告訴，我們實在太笨，動物碰見痛苦也曉得避免。"},{"類":"回扣","文":"這是根本所在，務必在這個地方注意。"},{"類":"立","文":"了解不是就行：理論上雖然如此，眼前感受上很難體會。"},{"類":"下手","文":"必定要多思惟、多修習，一直到內心生起相應的量，那時會生起大厭離；修學佛法第一個根本厭離心，必定從這裡出來。"},{"類":"破","文":"沒辦法真正感受到，單單了解，又是三世怨，變成世間很聰明的那些人。"},{"類":"立","文":"厭離心生起來以後，哪怕生到天上，深深了解行苦自性還沒有解脫，所以「智者視善趣等同那洛迦」。"},{"類":"因","文":"只要那個取蘊還在，問題沒有解決。"},{"類":"例","文":"最近開始說懺悔等等，就有同學產生不同的感受；產生感受的，都是能如理去做的人。"},{"類":"立","文":"懂得很多卻放逸而轉，不相應，沒有用；知道得少，做了馬上得到好處。"},{"類":"破","文":"不要誤解成「那就不要懂得很多」：如法懂得一點就得一點好處，懂得更多好處更多。"}],"af":"72a","st":350}],"逐字稿":[{"t":"72A 05:28","b":[["q","故此行苦，徧一切苦及是所餘二苦根本，故應於此多修厭離。"],["s","這就是我們最後歸結到應該了解的，這個苦是徧一切處的。實際上在我們感受，卻偏偏感受不到。我們平常一直講苦，從來不注意佛告訴我們真正的苦諦的苦，要找到根本，卻是在這個地方，這個就是我們平常感受不到的。所以說這個如果你感受不到的，所謂佛法始終最多只是人天乘，而人天乘我們另外一個名字來說它叫作「三世怨」，你願意做那個三世怨的事情嗎？這一點我們特別了解、特別注意！尤其是平常，我們太多人修學佛法，說是佛法好的，好在哪裡？不一定知道。要修行，如何修行啊？從什麼地方開始啊？啊，說世間是苦，苦在哪裡呀？唉呀，說這個生、老、病、死，是，如果說這種事情還要人家來告訴你的話，我們實在太笨！不要說個動物牠碰見這種痛苦，牠也曉得避免，而我們作為一個人，難道要懂得的就懂得這一些嗎？這個是它根本所在，我們務必在這個地方應該注意！"]]},{"t":"72A 06:59","b":[["s","那麼現在呢，了解到了，不是了解就行啊，前面一再說、一再說：這個認識，理論上雖然如此，但是呢眼前的感受上面，是你很難體會到的。所以你必定要思惟、多思惟，修習、多修習，一直等到內心生起相應的量，那時候你會生起大厭離，那就對了！所以修學佛法它第一個根本 ─厭離心，必定從這裡出來。等到你一旦這個厭離心生起來了以後，那個時候哪怕生到天上，因為你深深地了解這個行苦的自性，還沒有解脫，所以說智者視善趣等同那洛迦。真正有智慧，能夠如理了解世間真相，這真相是苦諦的，這種人把天上面的這種快樂，看得像地獄一樣，原因就在這裡。因為這是行蘊自性，只要那個取蘊還在，問題沒有解決。最後再說一遍，這問題的關鍵不但是了解，而要怎麼樣去內心感受到，這是個大學問。如果你沒有辦法真正感受到，單單了解的話，那又是個三世怨，就變成世間很聰明的那些人。"]]},{"t":"72A 08:35","b":[["s","所以最近漸漸地、慢慢地我們開始說懺悔或者什麼等等，就有不同的同學就產生不同的感受。而這種產生感受的，實際上都是什麼？那都是他能夠如理去做的人，如理去做的人。所以經上面一再告訴我們，雖然你懂得很多，但是你放逸而轉，不相應，沒有用；反過來你雖然知道的很少，你做了，馬上就會得到好處。不過這地方我們不要誤解：那既然如此，我們不要懂得很多了。不是！你如法地懂得一點馬上得到好處，你能夠懂得更多，好處更多。這個地方就告訴我們，你把了解的如法行持，跟它相應，體會到它真正的好處。那麼這個是大概我們已經有一個認識了。下面又特別地說明，關於壞苦 ─樂受這件事情，因為這是我們最難破的，假定這個破掉了，下面的問題就比較容易。看文："]]}],"口譯音":"口譯音檔/siwei-kudi-07/005.mp3"},{"文":"又能增貪現前樂受，多是於苦，漸息滅位妄起樂覺，全無不待除苦所顯自性之樂。","口譯":"又，那能增長貪欲的現前樂受，大多是在苦漸漸息滅的階段，虛妄地生起樂的感覺；完全沒有不依待苦的除去而顯現的、自性的快樂。","四家合註":null,"覺燈日光":null,"時":"72A 09:59","頁":167,"af":"72a","st":599,"et":713,"消文":[{"文":"眼前很多快樂的事情，都是不認識、誤解、顛倒的妄見；它能增長貪毒，而貪毒是引發生死最主要的主因。"},{"文":"這都是苦的「漸息滅位」：苦慢慢減輕，對前面大苦來說減輕一點，好像是樂，「妄」就是錯誤的感覺。"},{"文":"「全無不待除苦所顯」：是苦除的時候顯出來的，本性絕對沒有快樂，本質上絕對是苦。"}],"延伸":[],"逐字稿":[{"t":"72A 09:59","b":[["q","又能增貪現前樂受，多是於苦，漸息滅位妄起樂覺，全無不待除苦所顯自性之樂。"],["s","說眼前很多快樂的事情，這個都是不認識，誤解、顛倒的一種妄見，這個東西有它的絕大缺點，能夠增長我們的貪毒，而貪毒是引發生死的最主要的一個主因。實際上這個真的樂嗎？不是的呀！這都是苦的「漸息滅位」 ─它是苦，可是這個苦慢慢地、慢慢地在減輕當中。當在漸漸減輕當中的，欸，你覺得在輕了、輕了，於是對前面這個大苦來說，既然減輕了一點，好像這是樂，所以你「妄」，就是錯誤的感覺，以為它是樂。它並沒有實質上面本來應該樂的，本性是樂的這個實質沒有，實質沒有。所以「全無不待除苦所顯」，因為這是苦漸漸減少，所以當苦除的時候顯出來的，不是它本性，本性絕對沒有快樂的，本質上面絕對是苦的。馬上用一個事實來說明：譬如說你呀一直走，走得很長，走得很多的路，下面說，以為苦。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/006.mp3"},{"文":"譬如太走為苦，略為住息遂生樂覺，現見此是先生大苦，漸息滅時樂漸次起，故非性樂。若太久坐，仍復如前，生眾苦故。","口譯":"譬如走得太久成為苦，稍微停下休息，就生起樂的感覺；可以現見這是先生起了大苦，在苦漸漸息滅時，樂才漸次生起，所以不是自性的樂。如果坐得太久，又會像前面一樣，生起眾苦的緣故。","四家合註":null,"覺燈日光":null,"時":"72A 11:53","頁":167,"af":"72a","st":713,"et":819,"消文":[{"文":"跑了很久，暫時停一下、坐一下，覺得好舒服、好快樂。"},{"文":"事實是當下有很大的苦惱，停一下大苦漸漸減少消失；減輕的感覺妄起樂想，不是本質快樂。"},{"類":"喻","文":"假定坐下是快樂的，應該越坐越快樂；就像賺錢，賺得越多越好。"},{"文":"結果叫你老坐在那裡，不但不快樂，又苦得要命，要站起來走一走；睡、吃也一樣，沒有一個例外。"}],"延伸":[],"逐字稿":[{"t":"72A 11:53","b":[["q","譬如太走為苦，略為住息遂生樂覺。"],["s","跑了很久以後，暫時叫你停一下、坐一下，唉呀，覺得那時候好舒服、好快樂！那是什麼？那個是因為啊 ─"]]},{"t":"72A 12:11","b":[["q","現見此是先生大苦，漸息滅時樂漸次起，故非性樂。"],["s","這事實是當下就有很大的苦惱，那麼你停一下呢，那個大的苦惱漸漸地減少，漸漸地消失，所以你這個減輕的感覺，妄起樂想，而不是這件事情本身、本質快樂，它本質不快樂。所以他下面緊跟著這個問題，假定說坐下來是快樂的話，那應該越坐越快樂，因為它本來是快樂的嘛。就像賺錢一樣，賺一塊錢固然賺，越賺是賺得越多是越好，應該這個樣啊！同樣的道理，如果是這個坐下來是快樂的話，坐得越久是越快樂呀！所以下面說，"]]},{"t":"72A 13:12","b":[["q","若太久坐，仍復如前，生眾苦故。"],["s","結果叫你老坐在那裡呀，欸，它不但不快樂，你又苦得要命。所以叫你老坐在那裡，你坐了多久啊，你要站起來去走一走。為什麼？又苦得苦不堪言。苦，就是這樣，坐；然後呢叫你睡，又是這樣；叫你吃，沒有一個例外的。所以他下面說："]]}],"口譯音":"口譯音檔/siwei-kudi-07/007.mp3"},{"文":"若是性樂之因者，應如苦因，隨其習近，其苦漸增，如是習近行住坐臥，飲食日陰等，亦應隨其幾久習近，便有爾許安樂漸起，現見太久唯生苦故。","口譯":"如果是自性之樂的因，就應當像苦因一樣：隨著習近它，苦就漸漸增加；同樣地，習近行住坐臥、飲食、日曬、陰涼等，也應當隨著習近多久，就有多少安樂漸漸生起。然而現見習近太久，唯有生苦的緣故。","四家合註":null,"覺燈日光":null,"時":"72A 13:39","頁":167,"af":"72a","st":819,"et":1004,"消文":[{"文":"假定本質是快樂，就像苦一樣，坐得越久快樂越多；苦本來就是苦，時間越久越難受。"},{"文":"快樂的事情卻不是：剛換一換覺得快樂，過一下快樂消失，再下去苦得受不了；說明本性不是快樂而是苦。"},{"文":"行住坐臥沒有例外：走了想坐，坐了要睡，叫你老躺在床上也躺不住；是大苦漸漸息滅所生的相對感覺，這就是無明。"},{"類":"例","文":"飲食日陰：渴了飲、餓了食、寒了曬太陽、熱了找陰涼；太陽越曬越大又受不了，吃到後來胃口也沒有了。"},{"文":"樂的本質是虛妄的，只是苦的漸息滅位，這一點非常重要；弄久了，結果總是苦。"}],"延伸":[],"逐字稿":[{"t":"72A 13:39","b":[["q","若是性樂之因者，應如苦因，隨其習近，其苦漸增，如是習近行住坐臥，飲食日陰等，亦應隨其幾久習近，便有爾許安樂漸起，"],["s","喏！假定這個快樂本性、本質是快樂的話，就像苦一樣的話，應該怎麼樣呢？你坐得越久，那麼這個快樂越多。天下的苦本來就是苦的，這個苦的時間越久，痛苦越難受、越厲害。為什麼呀？因為它本性就是苦的。這快樂的事情卻不是，剛開始的時候，你換一換覺得快樂了，過了一下快樂慢慢地消失掉了，再繼續下去那個快樂就沒有，苦了，再下去就苦得受不了了！這個說明什麼？說明它本性不是真正的快樂，而是苦！所以這個我們要自己如理認識，如果你們聽懂了，就應該沒問題，不聽懂回去仔細想一想，這個概念非常重要！"]]},{"t":"72A 14:55","b":[["s","就像同樣的道理，你走久了以後坐，坐久了以後又要換一個，「如是習近行住坐臥」，沒有一個例外的。啊！你說走了半天又想坐一下，坐了半天又不行，要睡一下，睡了一下又要站起來，叫你老躺在床上你也躺不住。為什麼？它始終是同一個道理，這是大苦的漸漸息滅所生起的，相對的這種感覺，只是減少一點，它本質還是苦，就是我們這個妄想顛倒，所以叫無明嘛！"]]},{"t":"72A 15:36","b":[["s","除了這個以外，「飲食日陰」，當你渴的時候 ─飲；餓的時候是食；寒的時候是日；日的時候是陰，都是這個樣。啊！說今天冷了，曬曬太陽，然後呢太陽越來越大，你又受不了了。假定曬太陽是快樂的，應該越曬越快樂啊！又不是，沒有一個例外的。乃至於飲食，你倒吃吃看！唉呀，吃到後來，吃得難受得不得了，到後來不但是肚子吃壞了，你胃口也沒有了，沒有一樣不是這樣的！所以所有的這些事情都是什麼？都是苦的漸息滅位。從這個上面我們就認得，哦，原來這個樂的本質是虛妄的，只是苦的漸息滅位，這一點非常重要、非常重要！非常重要、非常重要！所以在這一種狀態啊，"]]},{"t":"72A 16:36","b":[["q","現見太久唯生苦故。"],["s","你只要弄久了，結果總是苦，總是苦。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/008.mp3"},{"文":"如是亦如《入胎經》云：「難陀，行住坐臥諸威儀中，應當了知別別是苦。諸靜慮師應觀彼彼威儀自性，若行度日不住不坐不臥，彼則於行唯別受苦，別別領受猛性，粗性，難可忍性，非悅意性，非於其行，起安樂想。」餘三威儀亦如是說。","口譯":"又如《入胎經》說：「難陀，在行住坐臥各種威儀中，應當了知各個都是苦。各位修靜慮的人應當觀察各種威儀的自性：如果整天只是行走，不住、不坐、不臥，那麼他在行走中就唯獨承受苦，各別領受猛烈的、粗重的、難以忍受的、不悅意的感受，而不會對行走生起安樂想。」其餘三種威儀也是這樣說。","四家合註":null,"覺燈日光":null,"時":"72A 16:44","頁":167,"af":"72a","st":1004,"et":1070,"消文":[{"文":"說明了道理，馬上告訴我們經上也是這樣說。"},{"文":"每一件事情，個別個別沒有一個例外，都是苦；真正是粗、猛而難以忍受的痛苦。"},{"文":"「諸靜慮師應觀彼彼威儀自性，若行度日不住不坐不臥，彼則於行唯別受苦」：師父沒有唸，直接接下句。"},{"文":"絕對不能從這上面妄想以為快樂；不但行住坐臥，前面說的飲食日陰，世間沒有一個例外。"}],"延伸":[],"逐字稿":[{"t":"72A 16:44","b":[["q","如是亦如《入胎經》云："],["s","那麼說明了這個道理，馬上告訴我們，經上面的就是這樣說的。說："]]},{"t":"72A 16:53","b":[["q","「難陀，行住坐臥諸威儀中，應當了知別別是苦。"],["s","這個每一件事情，個別個別沒有一個例外，都是苦。所以："]]},{"t":"72A 17:10","b":[["q","別別領受猛性，粗性，難可忍性，非悅意性。"],["s","每一件事情，它真正的是粗、猛而難以忍受的這種痛苦啊！"]]},{"t":"72A 17:26","b":[["q","非於其行，起安樂想。」"],["s","絕對不能從這個上面妄想以為快樂。行是如此，「餘三威儀亦如是說」，不但是行住坐臥，其他的所有的，前面說飲食日陰，世間沒有一個例外的呀！繼續又說："]]}],"口譯音":"口譯音檔/siwei-kudi-07/009.mp3"},{"文":"「難陀，然由彼彼威儀之苦，暫間斷故，遂於餘餘新生眾苦，妄起樂想。難陀，生唯苦生，滅唯苦滅，生唯行生，滅唯行滅。」","口譯":"「難陀，然而由於各個威儀的苦暫時間斷，於是就對其餘新生起的眾苦，虛妄地生起樂想。難陀，生起的唯是苦的生起，滅去的唯是苦的滅去；生起的唯是行的生起，滅去的唯是行的滅去。」","四家合註":null,"覺燈日光":null,"時":"72A 17:50","頁":167,"af":"72a","st":1070,"et":1107,"消文":[{"文":"這一段就是前面說明的道理。"},{"文":"世間一切法，現起是苦，滅也是苦；所以要努力找「滅」的辦法，把一切消除掉，那時得到寂滅之樂。"}],"延伸":[],"逐字稿":[{"t":"72A 17:50","b":[["q","「難陀，然由彼彼威儀之苦，暫間斷故，遂於餘餘新生眾苦，妄起樂想。"],["s","那這一段就是前面的，說明這個道理。"]]},{"t":"72A 18:01","b":[["q","難陀，生唯苦生，滅唯苦滅，生唯行生，滅唯行滅。」"],["s","世間一切法，現起是苦，然後呢滅也是苦，所以我們要努力找「滅」這個辦法，就把一切消除掉，那個時候得到寂滅之樂。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/010.mp3"},{"文":"《四百論》亦云：「如安樂增長，現見反成苦，如是苦增長，然非可轉樂。」","口譯":"《四百論》也說：「如同安樂增長，現見反而成為苦；像這樣苦增長，卻不能轉成樂。」","四家合註":null,"覺燈日光":null,"時":"72A 18:27","頁":167,"af":"72a","st":1107,"et":1287,"消文":[{"文":"第一個說道理，馬上用經證，經證以後祖師再加說明；大師又把經論的道理抉擇出來，宗要讓我們認得清清楚楚。"},{"文":"安樂增長，時間增久必反變成苦；苦增長不會轉成樂，因為苦本身就是苦。"},{"文":"世間最難認識、放不下的樂原來是苦，還有什麼好貪？行苦的自性不斷推衍，世間沒有一點地方不是苦。"},{"文":"苦的根本因就在五蘊身心：取蘊的重擔一天在，問題一直在，真正應該厭離的就是這個。"},{"文":"處處忙著修飾它、營養它、保護它，完全走上錯誤之路：概念是邪知見，行為是染污業，造成惡習，把你綁得死死的，越找越痛苦。"},{"文":"這把苦的特別行相告訴我們，這個叫總苦。"}],"延伸":[],"逐字稿":[{"t":"72A 18:27","b":[["q","《四百論》亦云：「如安樂增長，現見反成苦，如是苦增長，然非可轉樂。」"],["s","第一個是說道理，馬上用經證，經證了以後，祖師再加說明。祖師論上面怎麼說啊？說，就像我們妄見的，像安樂覺得增長，增長的結果，慢慢地增長，時間增久的時候必反變成功苦；但是呢，苦這個東西如果增長的話不會轉成樂。為什麼？苦本身就是苦，它的特質就是苦，你時間越長苦越多；可是樂卻不是，所以時間一增長的話，對不起，啊，苦又來了！所以若經、若論都是這個，那麼然後呢，大師又把這個經論的道理抉擇出來，把這個宗要讓我們認得地清清楚楚。現在到這裡我們了解了：哦！的的確確的，我們世間最難以認識的，而放不下的樂，原來這個不是真的，是苦！那麼既然樂都是苦，還有什麼一切好貪的呢？行呢？連它樂都沒有，雖然眼前一下感受不到，可是行苦的自性不斷地推衍哪，所以它結果又是苦，總結起來世間是沒有一點地方不是苦。"]]},{"t":"72A 20:11","b":[["s","而那個苦的根本因在哪裡呢？沒有別的，就是在我們五蘊身心上面，這是它真正我們應該認識的這個。所以告訴我們，這個取蘊的重擔只要一天在，一天沒有解決，問題一直在，我們真正應該厭離的就是厭離這個。現在我們處處地方忙這個，要修飾、修飾它；要營養、營養它；要保護、保護它，那完全走上錯誤之路。你這個概念就是邪知見，你這個行為就是染污之業，然後造成功這個惡習，到那個時候你不知不覺當中，這個東西又要來了。就把你綁得死死的，永遠在這個裡邊，你還覺得是找快樂，結果是越找越痛苦啊！那麼這個把苦的特別的行相告訴我們，這個叫總苦，把那個苦的特質。下面呢，"]]}],"口譯音":"口譯音檔/siwei-kudi-07/011.mp3"},{"文":"第二思惟別苦有六，三惡趣苦已如前說。","口譯":"第二，思惟別苦有六種；三惡趣的苦已經如前面所說。","四家合註":null,"覺燈日光":null,"時":"72A 21:27","頁":167,"af":"72a","st":1287,"et":1337,"消文":[{"文":"一切有情在三界當中有不同的位次：天、修羅、人三個善道；地獄、餓鬼、畜生。換一個角度看，也無不是苦。"},{"文":"共下士已經把三惡趣苦說明了，痛苦的厲害我們一點都無法忍受；人是善道，結果呢？"}],"延伸":[],"逐字稿":[{"t":"72A 21:27","b":[["q","第二思惟別苦有六，"],["s","那個，因為一切的有情在三界當中，有不同的幾個位次，我們所謂六趣或者六道 ─天、修羅、人是三個善道；地獄、餓鬼、畜生。現在我們看看，用另外這樣的一個角度去看，這個內容是什麼？啊，它也無不是苦！"]]},{"t":"72A 21:58","b":[["q","三惡趣苦已如前說。"],["s","在前面共下士當中，已經把三惡趣苦說明了。唉呀，這個痛苦的厲害，我們現在一點都無法忍受呀！那麼人呢？說是善道，應該呀！結果，"]]}],"口譯音":"口譯音檔/siwei-kudi-07/012.mp3"},{"文":"人苦者，謂飢渴寒熱，不可意觸，追求勞苦，復有生老病死等七，如前當知。","口譯":"人的苦：就是飢、渴、寒、熱，不可意的觸，追求的勞苦；又有生、老、病、死等七苦，應當如前面所說的來了知。","四家合註":null,"覺燈日光":null,"時":"72A 22:17","頁":167,"af":"72a","st":1337,"et":1389,"消文":[{"文":"這是人人感受得到的：飢渴、寒熱、不可意觸；不可意觸通常指外面，實際上心裡也如此，一天到晚煩煩惱惱，被它牽著鼻子走。"},{"文":"為了要求妄樂去追求，得到了怕失去，失去了又拼命追求，人實在是顛倒。"},{"文":"生老病死等七，前面已經說過了。"}],"延伸":[],"逐字稿":[{"t":"72A 22:17","b":[["q","人苦者，謂飢渴寒熱，不可意觸，追求勞苦，"],["s","喏！這個是我們人人感受得到的。唉！又「飢渴」、又「寒熱」，又「不可意觸」。這個不可意觸通常是指外面，實際上心裡也是如此，我們一天到晚煩煩惱惱，一天到晚沒有一個例外的，都是為了這個問題、這個麻煩，被它牽著鼻子走。還有呢，去為了追求，為了要求這個妄樂去追求，得到了就怕失去，失去了又要拼命追求，人實在是顛倒啊！"]]},{"t":"72A 23:03","b":[["q","復有生老病死等七，如前當知。"],["s","那前面已經說過了。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/013.mp3"},{"文":"又如《資糧論》云：「惡趣苦無餘，人中亦現有，苦逼等地獄，貧如琰魔世。此中旁生苦，強力於羸弱，制罰及損害，相續如暴流。","口譯":"又如《資糧論》說：「惡趣的苦無一遺漏，在人中也現前都有：苦的逼迫等同地獄，貧窮如同琰魔世界（餓鬼）。這當中旁生的苦，是強者對弱者的制罰及損害，相續不斷如同暴流。","四家合註":null,"覺燈日光":null,"時":"72A 23:09","頁":168,"af":"72a","st":1389,"et":1462,"消文":[{"文":"儘管人道是善趣，三惡道的苦人當中也有。"},{"文":"身心種種逼惱相當於地獄，地獄的特質就是一天到晚在寒熱的逼惱當中。"},{"文":"「貧如琰魔世」：鬼道是閻羅王所管轄，貧窮，這個也沒有、那個也沒有。"},{"文":"畜生是被驅馳、恐怖、被傷害；人中體弱的被強力所使，制罰、損害，像瀑布一樣不斷。"}],"延伸":[],"逐字稿":[{"t":"72A 23:09","b":[["q","又如《資糧論》云：「惡趣苦無餘，人中亦現有，苦逼等地獄，貧如琰魔世。此中旁生苦，強力於羸弱，制罰及損害，相續如暴流。"],["s","儘管人道是善趣，但是對不起，三惡道的這個苦，我們人當中也有。我們人當中有種種的身心的逼惱，這個就相當於地獄一樣，地獄的特質就是一天到晚在寒熱兩樣東西的逼惱當中。那麼「貧如琰魔世」，那麼餓鬼呢？這個是鬼道，鬼道是閻羅王所管轄的，那是貧窮啊，這個也沒有，那個也沒有。畜生呢？是種種被驅馳、恐怖、被傷害，就像這個比較體弱差的人被強力所使，以及制罰、損害，這種苦繼續不斷地像瀑布一樣，非常厲害！"]]}],"口譯音":"口譯音檔/siwei-kudi-07/014.mp3"},{"文":"有因貧乏起，«餘從不足生»，追求難忍苦，一切謀略殺。」","口譯":"（人的苦）有的因貧乏而生起，其餘的從不知足而生；追求的苦難以忍受，一切的謀略與殺害（都由此而來）。」","四家合註":null,"覺燈日光":null,"時":"72A 24:22","頁":168,"af":"72a","st":1462,"et":1550,"消文":[{"文":"有很多苦由貧；有很多人很富有了又不足。"},{"文":"追求的話，現在士農工商有種種苦惱；為了這個，心裡謀計、略取、傷殺，都從這上來。"}],"延伸":[{"題":"餘從不足生","組":[{"題":"滿足兩字真難","說":[{"類":"立","文":"這個滿足兩個字真難哪！越是豪富越是忙得起勁，為什麼？不足嘛。"}]},{"題":"所需無幾，偏要更多","說":[{"類":"立","文":"我們人真正需要的，一天三餐，兩餐就夠了，夜圖一宿，要這麼多錢幹什麼？"},{"類":"例","文":"有了百萬還要千萬，有了千萬要億，有了億還要萬億，有了錢還要地位；秦始皇併吞六國，還要長生不老。"}]},{"題":"善惡道一樣是苦","說":[{"類":"立","文":"貧固然不好，不貧也不行；世間的真相，是善惡道一樣。"}]}],"說":[{"類":"立","文":"這個滿足兩個字真難哪！越是豪富越是忙得起勁，為什麼？不足嘛。"},{"類":"立","文":"我們人真正需要的，一天三餐，兩餐就夠了，夜圖一宿，要這麼多錢幹什麼？"},{"類":"例","文":"有了百萬還要千萬，有了千萬要億，有了億還要萬億，有了錢還要地位；秦始皇併吞六國，還要長生不老。"},{"類":"立","文":"貧固然不好，不貧也不行；世間的真相，是善惡道一樣。"}],"af":"72a","st":1475}],"逐字稿":[{"t":"72A 24:22","b":[["q","有因貧乏起，餘從不足生，追求難忍苦，一切謀略殺。」"],["s","有很多苦由貧，有很多人呢，雖然你滿有，很富有了又不足。這個滿足兩個字真難哪！我們看那個很多豪富，越是豪富越是忙得起勁，為什麼？不足嘛！說起來真簡單！我們人真正需要的，一天三餐，就是兩餐就夠了，夜圖一宿，要這麼多錢幹什麼？偏偏有些世間人，有了百萬還要千萬，有了千萬要億，有了億還要萬億，有了錢還要地位。唉呀，不曉得要多少！那秦始皇併吞了六國，還要長生不老，就這樣，世間沒有一個例外的，就是這樣，就是這樣。所以貧固然不好，不貧也不行哪！那麼然後呢，你追求的話，種種，像我們曉得的，我們現在一切的士農工商，有種種的苦惱。然後呢，你為了這個事情，你生其他的，心裡邊謀計略、傷殺，都從這個上來。世間的真相，是善惡道一樣呀！"]]}],"口譯音":"口譯音檔/siwei-kudi-07/015.mp3"},{"文":"《四百論》云：「«勝者為意苦»，庸流從身生，二苦日日中，能壞此世間。」","口譯":"《四百論》說：「優勝的人是心意的苦，平庸的人是從身體生起的苦；這兩種苦天天都在，能毀壞這個世間。」","四家合註":null,"覺燈日光":null,"時":"72A 25:50","頁":168,"af":"72a","st":1550,"et":1770,"消文":[{"文":"差的人身苦，是窮人；好的人意苦。"},{"文":"被這樣的二苦，不斷地「日日中」，壞了；我們一天到晚就忙這個事情，這是人。"}],"延伸":[{"題":"勝者為意苦","組":[{"題":"董事長不如司機","說":[{"類":"例","文":"一位大公司董事長嘆氣說：「我還不如我的司機。」司機叫他向東就向東，心安理得；我又要想支票到期、應酬、打高爾夫、請客，睡眠的時間都剝奪掉。"},{"類":"例","文":"司機車子一放，回去呼呼睡大覺；千真萬確，你們想想是不是？"}]},{"題":"世人忙追，人世顛倒","說":[{"類":"破","文":"所有世間人一天到晚忙追這個，這叫顛倒，人世真正的顛倒；我是越想越對。"}]},{"題":"一件破衣，一點不操心","說":[{"類":"例","文":"以前在家是白領，衣服很講究，出去要體面、西裝革履。"},{"類":"例","文":"出家後到師父那裡撿幾件破衣服，洗乾淨穿上，小偷都不要；髒了洗、破了補，白天晚上都它，一點都不要操心，這麼舒服法。"}]},{"題":"原則用在任何地方","說":[{"類":"下手","文":"不一定從這上面去體會，要把這個原則用在任何一個地方，深深領會真正重要的事情是什麼。"},{"類":"因","文":"因為這個妄見，形成現在這個東西，輾轉相應，真是苦惱。"}]}],"說":[{"類":"例","文":"一位大公司董事長嘆氣說：「我還不如我的司機。」司機叫他向東就向東，心安理得；我又要想支票到期、應酬、打高爾夫、請客，睡眠的時間都剝奪掉。"},{"類":"例","文":"司機車子一放，回去呼呼睡大覺；千真萬確，你們想想是不是？"},{"類":"破","文":"所有世間人一天到晚忙追這個，這叫顛倒，人世真正的顛倒；我是越想越對。"},{"類":"例","文":"以前在家是白領，衣服很講究，出去要體面、西裝革履。"},{"類":"例","文":"出家後到師父那裡撿幾件破衣服，洗乾淨穿上，小偷都不要；髒了洗、破了補，白天晚上都它，一點都不要操心，這麼舒服法。"},{"類":"下手","文":"不一定從這上面去體會，要把這個原則用在任何一個地方，深深領會真正重要的事情是什麼。"},{"類":"因","文":"因為這個妄見，形成現在這個東西，輾轉相應，真是苦惱。"}],"af":"72a","st":1560}],"逐字稿":[{"t":"72A 25:50","b":[["q","《四百論》云：「勝者為意苦，庸流從身生，二苦日日中，能壞此世間。」"],["s","差的人呢，身苦，是嘛，窮人；好的人呢，意苦。說到這意苦，我也想起來了，現在那位已經死掉了，他本來不曉得是什麼大公司，我忘記掉了，那個大公司的董事長。有一天，他就隨便不曉得 ……說笑話，幾個老朋友，「唉！」他嘆了一個長氣，有人說：「像你這樣你還有什麼不如意呀？」他就說：「唉！不要去談了，我自己算算，我還不如我的司機。」喔！要是我做大老闆的話，同樣的兩個人，當然願意做大老闆。那個大老闆好舒服坐在那個地方，那個司機前面就開它，那個大老闆就說向東他就向東，向西他就向西，好像是那個大老闆那麼舒服！結果呢大老闆怎麼說？他說：「那個司機，我只要告訴他你向東他就向東，要叫他向西他就向西，他心裡面真是心安理得。我在那裡又要想這個，又要想那個，又要想那個 ……唉呀！這張支票要什麼時候到期了；這個禮拜六還要一個什麼應酬；還要跟誰一個人打一個高爾夫球；還要請一個客；政府某一個大官，還要這個應酬、這個應酬 ……。那晚上睡眠的時間都剝奪掉了。」他那個司機開到那個地方，他車子一放，回去呀呼呼睡大覺。千真萬確喔！你們想想看是不是？唉，之顛倒啊！"]]},{"t":"72A 27:34","b":[["s","但是我們偏偏所有世間人，都一天到晚要忙什麼？忙追這個，所以這個叫顛倒，人世的真正的顛倒！我們想想看對不對？我覺得現在是越想越對，以前我想我們諸位都是從在家人過來的，我也是，現在後來變成出家人了。以前在家，這個衣服，所謂白領階級，那個很講究哦！出去的時候要體面，當初是念書，然後跑出去西裝革履 ─通常人家說。到後來出家了以後，跑到我師父那裡撿幾件破衣服，就洗洗乾淨穿在身上，不要說小偷強盜你送給他，他都不要。我跑到哪裡要坐下，坐下就坐下了，站起來拍拍屁股就好了嘛，那麼簡單！髒，髒一點有什麼關係？太髒嘛洗洗就好了；破，破了嘛就補，就這樣。白天也是它，晚上也是它，睡覺了，棉被一蓋就好了。用不著說一下嘛睡衣，一下嘛這個，白天要白天的，晚上要晚禮服，今天參加這個又要那個 ……。啊！一點都不要操心，這麼個舒服法。結果人就是這麼顛倒。"]]},{"t":"72A 28:50","b":[["s","所以，我所以說這樣的一件事情，它不一定從這個上面去體會，我們應該把這個原則，用在任何一個地方，用在任何一個地方。讓我們深深領會到，真正裡面重要的事情是什麼？我們因為這個妄見，形成了現在這個東西，然後呢輾轉相應，真是苦惱啊！就被這樣的二苦，不斷地「日日中」，壞了！我們一天到晚就忙這個事情，這是人。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/016.mp3"},{"文":"非天苦者。如《親友書》云：「諸非天中意苦重，由其性瞋天德故，此等由其趣性障，具慧不能見聖諦。」","口譯":"非天（阿修羅）的苦：如《親友書》說：「諸非天之中，心意的苦很重，因為他們本性就瞋恨天人的福德；這些非天由於所生之趣的本性障礙，雖具智慧也不能見到聖諦。」","四家合註":null,"覺燈日光":null,"時":"72A 29:30","頁":168,"af":"72a","st":1770,"et":null,"消文":[{"文":"非天就是修羅道。"},{"文":"非天當中意最苦；本性瞋心非常大，福德可以跟天相比，但瞋心太大。"},{"文":"「趣性障」：那一道的特質就是瞋心特別重；雖然有智慧，沒辦法「見聖諦」。"},{"文":"一到這一道只有造惡，絕沒有機會透脫；這裡先不談，談這一道特別的痛苦。"}],"延伸":[],"逐字稿":[{"t":"72A 29:30","b":[["q","非天苦者。"],["s","非天就是，我們說魔，修羅道是魔，修羅道。"]]},{"t":"72A 29:39","b":[["q","如《親友書》云：「諸非天中意苦重，由其性瞋天德故，此等由其趣性障，具慧不能見聖諦。」"]]},{"t":"72B 00:03","b":[["s","那麼這個修 羅道，我們另外一個名字叫「非天」，他這個非天當中啊意最苦，這個心最苦。為什麼？他那個本性，他這種人的心裡瞋心非常大，他的福德可以跟天互相比，但是他那個瞋心太大，就是這樣。雖然他也有天上面種種的好的條件，但是那個「趣性障」，就是那一趣，就是那一道，就是修羅道那個特質就是瞋心特別重。那時候雖然也有智慧，但是這一道的眾生沒有辦法「見聖諦」 ─真正見到聖者之教。所以一到這一道的話，只有造惡，啊，那非常糟糕！不但絕沒有機會透脫，這個地方就先不談，談這一道特別的痛苦。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/017.mp3"},{"文":"此由不忍，嫉天富樂，令意熱惱，由此因緣，與天鬥諍，受割裂等傷身眾苦。此等雖具智慧，然由異熟障故，於彼身中不堪見諦。","口譯":"這是由於不能忍受、嫉妒天人的富樂，令心意熱惱；由此因緣與天人鬥爭，承受割裂等傷害身體的眾苦。他們雖然具有智慧，然而由於異熟的障礙，在那樣的身中不堪見諦。","四家合註":null,"覺燈日光":null,"時":"72B 01:02","頁":168,"af":"72b","st":62,"et":153,"消文":[{"文":"瞋心大、嫉妒心強，不能忍受人家的好，看見別人比他強就受不了。"},{"類":"例","文":"天人長得美不可言，修羅福雖大卻個個醜陋；修羅的女兒嫁給帝釋；帝釋天吃的果，樹根長在修羅宮，果子卻掉在帝釋的園子裡。"},{"文":"所以一天到晚要跟天打；一打就受割裂。"},{"文":"雖然有智慧，由於所感得的非天這一趣的異熟障礙，沒有辦法見諦。"}],"延伸":[],"逐字稿":[{"t":"72B 01:02","b":[["q","此由不忍，嫉天富樂，令意熱惱，"],["s","因為他瞋心大，嫉妒心強，不能忍受人家的好，他意裡面特別地強，啊，看見別人比他強就受不了。別人就偏偏比他強，那個天人都長得美不可言，修羅的福雖然大，長得個個醜陋。啊，妙不可言！還有呢，這個帝釋的這個太太，就是修羅的女兒，她長得，女的很漂亮，結果呢就嫁給那個天。啊！就這樣，種種不理想的。還有那個帝釋天吃的那種天上的果，那個樹那個根呢，就長在那個修羅宮當中，根長在那裡，長出來的果，可掉在帝釋天的園子裡邊。唉，這實在是難受啊！實在是難受。他本性本來就是瞋心很大，嫉妒心很強，所以他一天到晚要跟那個天打。所以："]]},{"t":"72B 02:06","b":[["q","由此因緣，與天鬥諍，"],["s","然後一打呢？"]]},{"t":"72B 02:10","b":[["q","受割裂等傷身眾苦。此等雖具智慧，然由異熟障故，於彼身中不堪見諦。"],["s","他雖然有智慧，但是由於這個異熟，他所感得的這個非天這一趣，這個障礙存在，他沒有辦法見諦，沒有辦法見諦的。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/018.mp3"},{"文":"《念住經》說此為旁生，《瑜伽師地論》«說為天趣»。","口譯":"《念住經》說非天屬於旁生，《瑜伽師地論》說屬於天趣。","四家合註":null,"覺燈日光":null,"時":"72B 02:33","頁":168,"af":"72b","st":153,"et":250,"消文":[{"文":"有經說他是旁生，畜生道，他愚癡；《瑜伽師地論》說天趣。"},{"文":"所以有的列成五趣，有的列為專門一類，成為六趣。"}],"延伸":[{"題":"說為天趣","組":[{"題":"人間也有修羅","說":[{"類":"例","文":"這種狀態我們人間也有：人間修福報修得很大，但是瞋心。"},{"類":"例","文":"看見人家布施：「這有什麼了不起，他布施一千，我布施一萬！」人家造大廟：「我造得比他更大！」"}]},{"題":"修福而意地不淨","說":[{"類":"因","文":"造了以後，沒有造大惡業，大概可能進入修羅道；造大惡業的更不談。"},{"類":"立","文":"造了福報尚且如此；只要意地不清淨，到那時苦不堪言，這個必定要注意。"}]},{"題":"上界尚且如此","說":[{"類":"回扣","文":"人間也是：司機開完回家就好了；老闆一天到晚躺在枕頭上睡不著，吃安眠藥，明天還頭痛，真划不來。"},{"類":"立","文":"上界尚且如此，何況其他！"}]}],"說":[{"類":"例","文":"這種狀態我們人間也有：人間修福報修得很大，但是瞋心。"},{"類":"例","文":"看見人家布施：「這有什麼了不起，他布施一千，我布施一萬！」人家造大廟：「我造得比他更大！」"},{"類":"因","文":"造了以後，沒有造大惡業，大概可能進入修羅道；造大惡業的更不談。"},{"類":"立","文":"造了福報尚且如此；只要意地不清淨，到那時苦不堪言，這個必定要注意。"},{"類":"回扣","文":"人間也是：司機開完回家就好了；老闆一天到晚躺在枕頭上睡不著，吃安眠藥，明天還頭痛，真划不來。"},{"類":"立","文":"上界尚且如此，何況其他！"}],"af":"72b","st":175}],"逐字稿":[{"t":"72B 02:33","b":[["q","《念住經》說此為旁生，《瑜伽師地論》說為天趣。"],["s","有一個經說他這個是旁生，所以畜生道 ─他愚癡；那麼《瑜伽師地論》上說天趣。所以有的人列入這個變成五趣，有的人列為專門一類，列入六趣。就這種狀態呢我們人間也有，實際上這種人，就是人間修福報，修得很大，但是瞋心。往往有的時候布施，我也曾經看見過的，人家去布施，他看見他布施：「這有什麼了不起，他布施一千，我布施一萬！」就是這樣。人家造一個大廟，造這麼多 ─「我造得比他更大！」對不起，你造了以後，如果你沒有造大的大惡業的話，那麼你大概是可能進入修羅道；如果你造大惡業的話，那更不談。所以這個我們必定要注意啊！造了福報尚且如此啊！你只要意地不清淨的話，到那個時候苦不堪言。人間也是這樣欸，剛才說的這個司機真痛快，開完了以後回家去那好了，剩下來事情反正不管；這個老闆一天到晚躺在這個枕頭上，睡不著還要吃安眠藥，吃了安眠藥，明天還要頭痛。所以這一件事情是真划不來呀！那麼上界尚且如此，何況其他呀！那麼最後看看天："]]}],"口譯音":"口譯音檔/siwei-kudi-07/019.mp3"},{"文":"思惟天苦分二：一欲天三苦，二上二界粗重苦。今初　初死墮苦中有二，","口譯":"思惟天的苦分為二：一、欲界天的三種苦，二、上二界（色界、無色界）的粗重苦。現在說第一。第一種死墮苦之中有二，","四家合註":null,"覺燈日光":null,"時":"72B 04:10","頁":168,"af":"72b","st":250,"et":271,"消文":[{"文":"天分成兩種：欲界，還有上面色、無色界；欲天有三種苦。"},{"文":"欲界在生的時候很好，到墮落的時候苦不堪言。"}],"延伸":[],"逐字稿":[{"t":"72B 04:10","b":[["q","思惟天苦分二：一欲天三苦，二上二界粗重苦。　今初"],["s","天分成功兩種，一種欲界，還有呢上面 ─色、無色界。欲天有三種苦："]]},{"t":"72B 04:22","b":[["q","初死墮苦中有二，"],["s","欲界，在生的時候很好，到墮落的時候，那苦不堪言。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/020.mp3"},{"文":"死歿苦者，如云：「諸天趣樂雖極大，然其死苦大於彼，如是思已諸智者，莫愛有盡天趣樂。」","口譯":"死歿的苦：如說：「諸天趣的快樂雖然極大，然而他們死時的苦比那還大；像這樣思惟以後，諸位智者，不要貪愛有窮盡的天趣之樂。」","四家合註":null,"覺燈日光":null,"時":"72B 04:31","頁":168,"af":"72b","st":271,"et":358,"消文":[{"文":"天上很快樂，但死的時候是絕大的痛苦。"},{"類":"例","文":"沒有什麼也就算了；一旦有了錢就怕失掉；政治上爬上去的怕掉下來，他是在人家頭上踩上去的，當然不願被人家踩。"},{"類":"例","文":"享受富貴慣了，忽然衣食不繼，還要看人家臉色，這個痛苦之難受。"},{"文":"了解了，真正有智慧的人絕對不會貪；何況時間一下就過去，像前面無常當中說的。"}],"延伸":[],"逐字稿":[{"t":"72B 04:31","b":[["q","死歿苦者，如云：「諸天趣樂雖極大，然其死苦大於彼，如是思已諸智者，莫愛有盡天趣樂。」"],["s","天上很快樂，但是死的時候，唉，那絕大的痛苦，絕大的痛苦！就像我們現在，你沒有什麼，反正沒有什麼，也就算了；你一旦有了錢哪，哎呀，那個就要怕什麼？失掉。所以凡是有地位的人，我們看，尤其是現在這種政治上面，這個鬥爭得厲害呀，他爬上去了就怕掉下來。他所以爬上去，為什麼？他是拼命在人家的頭上踩上去的，他既然在人家頭上踩上去，當然不願意被人家來踩，這個很明白。同樣的道理，所以上面固然好，跌下來的痛苦啊，就是痛苦極了。他平常習慣上面享受慣了，平常我們人家說，習慣了大，享受富貴的，忽然之間跑得去，你畏畏縮縮，唉呀！衣食不繼，還要看人家的臉色，這個痛苦之難受啊！了解了這個，啊！那真正有智慧的人絕對不會貪。何況這個時間一下就過去掉了，像前面無常當中，切切要記住！"]]}],"口譯音":"口譯音檔/siwei-kudi-07/021.mp3"},{"文":"謂較昔受天欲生樂，將臨歿時，五死相現，所起痛苦，極重於彼。五死相者，即如彼云：「身色變為不可愛，不樂本座，華鬘萎，衣服垢染，身出汗，是於先時所不出。天趣報死五死相，起於住天界諸天，等同地上諸人中，傳報當死諸死相。」","口譯":"就是說，比起過去所受的天界欲樂，在將要死歿時，五種死相出現，所生起的痛苦，比那欲樂還重。五種死相，就如那部論說：「身色變為不可愛，不喜歡自己本來的座位，花鬘枯萎，衣服垢染，身體出汗，這是以前不曾出的。天趣中預報死亡的五種死相，生起於住在天界的諸天身上，就等同地上人們之中，預報將死的各種死相。」","四家合註":null,"覺燈日光":null,"時":"72B 05:58","頁":168,"af":"72b","st":358,"et":450,"消文":[{"文":"在天享樂時不知不覺過去，快死時「五死相」現起，痛苦的心情是不得了。"},{"文":"本來可愛的變掉了；本來坐的帝座、天子座坐不住了；花鬘萎了，衣服髒垢了，身上出汗了，這些先時不出的，臨死來了。"},{"文":"就像我們人病了；人病了不一定死，醫得好；天上五衰相一現就非死不可，真可怕。"}],"延伸":[],"逐字稿":[{"t":"72B 05:58","b":[["q","謂較昔受天欲生樂，將臨歿時，五死相現，所起痛苦，極重於彼。"],["s","就是說，在天享樂的時候，不知不覺當中過去掉了，等到你快死的時候，這五衰相，「五死相」現起的時候，那個痛苦的心情是不得了啊！"]]},{"t":"72B 06:19","b":[["q","五死相者，即如彼云：「身色變為不可愛，"],["s","本來可愛的，變掉了。"]]},{"t":"72B 06:25","b":[["q","不樂本座，"],["s","本來坐的地方，這個帝座、天子座，那個時候坐在那裡坐不住了。華鬘萎，衣服垢染，身出汗，是於先時所不出。"]]},{"t":"72B 06:34","b":[["s","身上的花鬘萎了，衣服是髒垢了，身上出汗了。這個五樣東西，先時不出的，到臨死的時候，欸！來了。所以："]]},{"t":"72B 06:45","b":[["q","天趣報死五死相，起於住天界諸天，等同地上諸人中，傳報當死諸死相。」"],["s","那個就是欲界天的，欲界天的這種五死相。他「諸天」，那就是欲界天的諸天，就像地上的一樣，欸，這個東西有這個形相生起，就像我們病了，那個他也就是這個狀態。我們人病了以後不一定死，醫得好的，那個天上面的五衰相一現的話，那就死了，非死不可。真可怕！那麼這個「死歿苦」。第二呢，"]]}],"口譯音":"口譯音檔/siwei-kudi-07/022.mp3"},{"文":"墮下處苦者，如云：「從天世間死歿已，設若全無少餘善，彼無自在往旁生，餓鬼地獄隨一處。」","口譯":"墮下處的苦：如說：「從天的世間死歿以後，如果完全沒有少許剩餘的善業，他就不由自主地前往旁生、餓鬼、地獄中的任何一處。」","四家合註":null,"覺燈日光":null,"時":"72B 07:30","頁":168,"af":"72b","st":450,"et":516,"消文":[{"文":"死了以後還要墮落；沒有善，自己沒有力量，隨業而轉。"},{"類":"例","文":"皈依當中說過羯摩那法天子五衰相現，天人有神通看到死後要墮落。"},{"文":"上升的機會少之又少，墮落的極大部分；不是百分之九十九比一，經上說是大地土跟爪上土；天上一無是處。"}],"延伸":[],"逐字稿":[{"t":"72B 07:30","b":[["q","墮下處苦者，"],["s","死了以後呢，糟了，還要墮落！"]]},{"t":"72B 07:34","b":[["q","如云：「從天世間死歿已，設若全無少餘善，彼無自在往旁生，餓鬼地獄隨一處。」"],["s","從天上死了，如果沒有善的話，他自己沒有力量的，沒有力量，還是隨業而轉，到那時候墮落到畜生當中。上面我們曾經說過的，皈依當中那個羯摩那法天子他五衰相現，天人有這個神通的，死了以後可以看看到哪裡去，一看，要墮落。啊！這個一般來說，上升的機會少之又少，墮落的情況極大部分、極大部分。這個比數不是說百分之九十九跟百分之一的比哦，經上說得很清楚，說大地土跟爪上土這樣，這樣的可怕法呀！所以那個天上是一無是處呀！"]]}],"口譯音":"口譯音檔/siwei-kudi-07/023.mp3"},{"文":"悚慄苦者，謂由有成就廣大福聚及上妙五欲天子生時，諸薄福天子，見已惶怖，由此因緣受大憂苦。","口譯":"悚慄的苦：就是說，當成就廣大福聚及上妙五欲的天子出生時，那些福薄的天子看見了就惶恐畏懼，由此因緣而受大憂苦。","四家合註":null,"覺燈日光":null,"時":"72B 08:36","頁":169,"af":"72b","st":516,"et":587,"消文":[{"文":"這一種是害怕：更大福德的天子生起時，薄福的天子看見就受大苦惱；大力天子一犯瞋心，差一點的就被欺凌。"},{"類":"喻","文":"像世間大魚吞小魚，天上亦復如是；越是爬得高，被吞、被壓迫的時候痛苦越大。"}],"延伸":[],"逐字稿":[{"t":"72B 08:36","b":[["q","悚慄苦者，謂由有成就廣大福聚及上妙五欲天子生時，諸薄福天子，見已惶怖，由此因緣受大憂苦。"],["s","那麼還有一種呢，這一種就是他害怕。說另外有更大福德的這一種天子，生起的時候，那個薄福的天子看見了，就要受大苦惱，受大苦惱。這個一旦那個大力的天子一犯瞋心的話，哇！那個差一點的就被他欺凌了。就像我們現在世間也是一樣，其實一樣，任何到處都是一樣的，大魚吞小魚這個情況，天上亦復如是。他雖然不是把你吞掉了，但是呢你遭到的痛苦啊，我們現在眼前看看哪到處都是，天上亦復如是。而更是，越是爬得高，那個時候被吞、被壓迫的時候這個痛苦是越大。還有呢，"]]}],"口譯音":"口譯音檔/siwei-kudi-07/024.mp3"},{"文":"斫裂殺害苦者，謂天與非天鬥諍之時，受斷支節，破裂其身及殺害苦，若斷其頭，即便殞歿，傷身斷節，續還如故。","口譯":"斫裂殺害的苦：就是天人與非天鬥爭的時候，承受斷截肢節、破裂身體以及被殺害的苦；如果被斷頭就會死亡，傷了身體、斷了肢節，還能接續恢復如故。","四家合註":null,"覺燈日光":null,"時":"72B 09:47","頁":169,"af":"72b","st":587,"et":639,"消文":[{"文":"或者被傷，或者被殺；非天經常跟天鬥，被傷害只是當時刀砍上去痛，完了身體又恢復。"},{"文":"頭一斷掉，命就送掉了。"}],"延伸":[],"逐字稿":[{"t":"72B 09:47","b":[["q","斫裂殺害苦者，謂天與非天鬥諍之時，受斷支節，破裂其身及殺害苦，若斷其頭，即便殞歿，傷身斷節，續還如故。"],["s","還有呢，這個或者被傷，或者被殺。那個非天經常要跟天上面鬥，那麼如果鬥了以後呢，如果說被傷害的話，那只是傷害的當時，刀砍上去痛苦的，完了以後他那個身體又恢復了，這個還可以。但是那個頭一斷掉了，對不起，那個命就送掉了，哦，這個頭很重要。那麼，"]]}],"口譯音":"口譯音檔/siwei-kudi-07/025.mp3"},{"文":"驅擯者，謂諸具足強力諸天，纔一發憤，諸劣天子，便被驅擯出其自宮。","口譯":"驅擯：就是具足強大力量的諸天才一發怒，那些劣弱的天子，就被驅逐出自己的宮殿。","四家合註":null,"覺燈日光":null,"時":"72B 10:39","頁":169,"af":"72b","st":639,"et":668,"消文":[{"文":"這是為什麼前面心裡恐怖：力量強的一發脾氣，比較差的就被從自己的地方趕出去，本來好好享受，當然痛苦。"}],"延伸":[],"逐字稿":[{"t":"72B 10:39","b":[["q","驅擯者，謂諸具足強力諸天，纔一發憤，諸劣天子，便被驅擯出其自宮。"],["s","這是為什麼前面心裡恐怖的，那個力量強的人哪，一旦發起脾氣來，那個比較差的人，就被從他自己的地方就趕出去。那麼本來這地方好好地享受，你被趕出去，當然痛苦啦！"]]}],"口譯音":"口譯音檔/siwei-kudi-07/026.mp3"},{"文":"又如《資糧論》云：「所有受欲天，彼亦無樂心，遭欲貪熾然，內火而燒煮。若諸心散亂，彼豈有安樂，非於無散心，剎那能自在。散逸擾亂性，終不能寂滅，等同有薪火，徧受大風吹。」","口譯":"又如《資糧論》說：「所有受用欲樂的天人，他們也沒有安樂的心；遭受欲貪熾燃，被內心的火所燒煮。如果心散亂，他們哪裡會有安樂？沒有不散亂的心，連一剎那也不能自在。散逸擾亂的本性，終究不能寂滅，就如同有薪柴的火，遍受大風吹動。」","四家合註":null,"覺燈日光":null,"時":"72B 11:08","頁":169,"af":"72b","st":668,"et":774,"消文":[{"文":"欲界天受欲，並沒有真正的快樂；貪欲還在，內心貪欲之火熾然，一直在煩惱當中。"},{"文":"心散亂煩惱絕不可能安樂，一剎那也不能自在；心的自在一定要自己把持得住自己。"},{"文":"平常的快樂還是隨著外境在轉，看見好看的心就跟著跑掉，被人家牽著鼻子走，有什麼快樂。"},{"文":"散亂放逸本質是「擾亂」，不是寂滅；像有火的柴，在散亂的風當中燒，是沒有證得寂滅的必然狀態。"}],"延伸":[],"逐字稿":[{"t":"72B 11:08","b":[["q","又如《資糧論》云：「所有受欲天，彼亦無樂心，遭欲貪熾然，內火而燒煮。若諸心散亂，彼豈有安樂，非於無散心，剎那能自在。散逸擾亂性，終不能寂滅，等同有薪火，徧受大風吹。」"],["s","那麼這個論上面告訴我們，所有欲界天，受欲的，實際上他並沒有真正的快樂，沒有真正的快樂。為什麼呀？因為這個貪欲還在，既然這個貪欲，內心這個貪欲之火熾然的話，那心裡面一直在這個煩惱當中。凡是這心散亂煩惱的話，絕不可能得到安樂，這個在這種狀態當中，一剎那也不能自在。所以心的自在一定要什麼？自己把持得住自己，這個才是。平常的時候我們的快樂，實際上還是隨著外境在轉，啊，你看見好看的，你跟著心跟它去跑掉了，心跟它去跑掉了，被人家牽著鼻子走，這有什麼快樂好言呢？就是這樣的狀態呀！所以這樣，這種狀態叫散亂放逸，那個本質是「擾亂」。擾亂就是混雜的，這個不是寂滅。就像有火的那個柴一樣，它一定在這個散亂的風當中燒。燒，那就是熾烈的狀態，就是我們沒有證得寂滅的必然狀態。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/027.mp3"},{"文":"又云：「如病愈未久，食所不宜食。」","口譯":"又說：「如同病剛痊癒不久，就吃了不適宜吃的食物。」","四家合註":null,"覺燈日光":null,"時":"72B 12:54","頁":169,"af":"72b","st":774,"et":809,"消文":[{"文":"病剛好再吃不適宜的，病又發了；天上的快樂亦是如此。"},{"文":"由於布施等生到天上，欲樂很大，福不能積，貪心又增長，再墮落；這是欲界。"}],"延伸":[],"逐字稿":[{"t":"72B 12:54","b":[["q","又云：「如病愈未久，食所不宜食。」"],["s","病剛剛好，你還再吃不適宜的，對不起，它病又發了。那個天上的快樂亦是如此！世間由於布施，或者修種種的，然後呢生到天上。那個時候啊生到了天上，那個欲樂很大，它又來了，福不能積啊，貪心又增長了，再墮落。那個是欲界。"]]}],"口譯音":"口譯音檔/siwei-kudi-07/028.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-07/001.webp","n":1},{"img":"投影片/siwei-kudi-07/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/siwei-kudi-07/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/siwei-kudi-07/004.webp","n":4},{"img":"投影片/siwei-kudi-07/005.webp","n":5},{"img":"投影片/siwei-kudi-07/006.webp","n":6},{"img":"投影片/siwei-kudi-07/007.webp","n":7,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=72a&st1=73&et1=214","box":[0.133625,0.3091111111111111,0.13775,0.07733333333333334]}],"photo":[0.5375,0.06666666666666667,0.432191744586
