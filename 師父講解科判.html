player2/?&tch=gl1&af1=72b&st1=668&et1=809","box":[0.544875,0.29466666666666663,0.13775,0.06844444444444445]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/siwei-kudi-07/046.webp","n":46},{"img":"投影片/siwei-kudi-07/047.webp","n":47},{"img":"投影片/siwei-kudi-07/048.webp","n":48},{"img":"投影片/siwei-kudi-07/049.webp","n":49,"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-07/050.webp","n":52,"yt":"E1qFpq1i0fY"},{"img":"投影片/siwei-kudi-07/051.webp","n":53}],"投影片PDF":"投影片/siwei-kudi-07/slides.pdf","音檔範圍":"72A 01:13～72B 13:29"},"siwei-kudi-08":{"id":"siwei-kudi-08","標題":"思惟苦諦(8)","根":"思惟別苦","科判焦點":"子二 思惟別苦","課本範圍":"P169 L7 ~ P171 L2","堂數":92,"日期":"2026/12/22","分圖":[{"名":"上界粗重苦・觀察其因","原文":[0,3]},{"名":"煩惱為生死上首","原文":[4,12],"根":"煩惱發生之理"},{"名":"正明煩惱・總相與前六","原文":[13,21],"根":"煩惱發生之理"}],"跨科判":[{"科判":"癸一 煩惱發生之理","起":4}],"週":117,"班級":"24秋007","音檔":{"72b":{"local":"音檔/gl1/072B.mp3","remote":"https://lamrim.xyz/player/media/gl1/072B.mp3"},"73a":{"local":"音檔/gl1/073A.mp3","remote":"https://lamrim.xyz/player/media/gl1/073A.mp3"}},"tch":"gl1","音檔網址":"https://lamrim.xyz/player2/?&tch=gl1&af1=72b&st1=809&af2=73a&et2=1105","段":[{"文":"色及無色上界諸天，雖無此諸苦，然煩惱隨逐，有諸障礙，於死於住悉無自在，故彼亦由粗重為苦。","口譯":"色界及無色界的上界諸天，雖然沒有這些苦，然而有煩惱隨逐、有種種障礙，對於死亡與安住都沒有自在，所以他們也由於粗重而是苦。","四家合註":null,"覺燈日光":null,"時":"72B 13:29","頁":169,"af":"72b","st":809,"et":859,"消文":[{"文":"再上面比較好，沒有欲界天這些苦，但煩惱還在，生死痛苦的根本還在，障礙並沒除掉。"},{"文":"對於死生沒辦法自己把握：不是說我想不死就做得了，要死的時候一點辦法都沒有；還是在煩惱當中。"}],"延伸":[],"逐字稿":[{"t":"72B 13:29","b":[["q","色及無色上界諸天，雖無此諸苦，然煩惱隨逐，有諸障礙，於死於住悉無自在，"],["s","那麼再上面呢，比較好，沒有像欲界天，這個苦是沒有的，但是啊這個煩惱還在那裡。這個痛苦生死的根本還在那裡，所以這個障礙也並沒除掉。所以對於這個死生，還是沒辦法自己把握得住 ─無自在。不是說我要想不死就做得了，要死的時候，他也一點辦法都沒有。"]]},{"t":"72B 14:13","b":[["q","故彼亦由粗重為苦。"],["s","還是在煩惱當中。就像那個論上說："]]}],"口譯音":"口譯音檔/siwei-kudi-08/001.mp3"},{"文":"又如《資糧論》云：「色無色諸天，超越於苦苦，以定樂為性，住劫不傾動。然非畢竟脫，從彼仍當墮，似已得超越，惡趣苦暴流，雖勵不久住，等同空飛鳥，如童力射箭，墮落為邊際。如久然諸燈，剎那剎那壞，諸行變壞苦，仍當極侵惱。」","口譯":"又如《資糧論》說：「色界、無色界諸天，超越了苦苦，以禪定之樂為本性，住於劫中不傾動。然而並非究竟解脫，從那裡仍然會墮落；看似已經超越了惡趣之苦的暴流，雖然努力，也不能久住；如同飛在空中的鳥，如同孩童用力射出的箭，最終以墮落為邊際。如同點燃很久的燈，剎那剎那地壞滅；諸行變壞的苦，仍然會極度侵惱。」","四家合註":null,"覺燈日光":null,"時":"72B 14:19","頁":169,"af":"72b","st":859,"et":993,"消文":[{"文":"苦苦是沒有了；在定樂當中很長的時候，看定的深淺時間有長短，最高非想非非想天住八萬大劫，到了還是要墮落。"},{"類":"例","文":"鬱頭藍弗修成非想非非想天，死了以後墮落到畜生道；定好難修，完了還要墮落。"},{"文":"看起來好像超越了惡趣大苦，但行苦自性還在，沒辦法停得住。"},{"類":"喻","文":"像鳥飛在空中，飛一飛要停下來；像射箭，射上去力盡了又墮落。"},{"類":"喻","文":"像燈，現在是亮，可是一刻都不停地慢慢消失，最後仍舊為苦所侵；惡道是苦，善道結果也如此。"}],"延伸":[],"逐字稿":[{"t":"72B 14:19","b":[["q","又如《資糧論》云：「色無色諸天，超越於苦苦，"],["s","是，苦苦是沒有了。"]]},{"t":"72B 14:23","b":[["q","以定樂為性，住劫不傾動。然非畢竟脫，"],["s","他在定樂當中，他那個定樂，很長的時候。看他定的深淺而時間有長短，最高的非想非非想天，住八萬大劫，對不起，到了以後你還是要墮落。鬱頭藍弗就是那個典型的公案，他修非想非非想天修成功了，最後死了以後呢，墮落到畜生道當中。你看！啊，這個定是好難修，結果他完了以後還是要墮落。最高的非想非非想天尚且如此，何況 ……不談了。"]]},{"t":"72B 15:15","b":[["q","從彼仍當墮，似已得超越，惡趣苦暴流，雖勵不久住，等同空飛鳥，如童力射箭，墮落為邊際。"],["s","他到了最後一定要墮落的，所以當時看起來好像已經超越了，因為他苦苦沒有了嘛，已經超越了這個惡趣的種種大苦，但是對不起，他的行苦自性還在，他沒有辦法停得住的。就像鳥飛在空當中，暫時雖然飛一下，對不起牠飛一飛要停下來；又像人家射箭一樣，射上去呀到那時候力盡了，它又墮落了。他最後的，最後的邊際是就，跑到最後他還是墮落。"]]},{"t":"72B 16:06","b":[["q","如久然諸燈，剎那剎那壞，諸行變壞苦，仍當極侵惱。」"],["s","像燈一樣，現在是亮，可是它無時無刻，一刻都不停住地，正在慢慢、慢慢、慢慢地消失當中，最後仍舊為苦所侵。惡道是苦，善道結果也是如此。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/002.mp3"},{"文":"如是思惟五趣六趣，總別諸苦，厭患生死意欲出離，«便當觀察其因»，","口譯":"像這樣思惟五趣、六趣總的與別的諸苦，厭患生死而想要出離，就應當觀察它的因，","四家合註":null,"覺燈日光":null,"時":"72B 16:33","頁":169,"af":"72b","st":993,"et":1155,"消文":[{"文":"不管總的思惟、別的思惟，任何角度、任何狀態，觀察思惟的結果沒有一點例外是苦；了解以後產生的結果：厭患。"}],"延伸":[{"題":"便當觀察其因","組":[{"題":"換個地方，求不到樂","說":[{"類":"破","文":"總覺得「求快樂啊」，錯了！找不到快樂，這個世間的特質就是這樣。"},{"類":"破","文":"對眼前不滿意，「這裡不好，換一個地方，那個地方可以快樂」，世間人這樣想，完全錯了。"}]},{"題":"佛法指出樂的特質","說":[{"類":"立","文":"佛法難道不是找快樂？是；差別在世間人找快樂是頭痛醫頭、腳痛醫腳。"},{"類":"立","文":"佛法指出快樂的特質是什麼：根本你的認識就錯了，要從這上面轉一個方法。"}]},{"題":"逃得了環境，逃不了自己","說":[{"類":"破","文":"不要說這裡不理想、那裡不理想，然後要換、要找。"},{"類":"立","文":"你可以逃得了環境，逃不了自己；自己就是身心五蘊、煩惱，真正要透脫的是煩惱，所以必定要認得煩惱。"}]},{"題":"有因就能解決","說":[{"類":"破","文":"找不到因，說「反正沒辦法了」，那張開眼睛就去享樂，什麼壞事都去做好了。"},{"類":"立","文":"現在好，有原因的，可以解決；所以進一步了解了苦，就找它的原因。"}]}],"說":[{"類":"破","文":"總覺得「求快樂啊」，錯了！找不到快樂，這個世間的特質就是這樣。"},{"類":"破","文":"對眼前不滿意，「這裡不好，換一個地方，那個地方可以快樂」，世間人這樣想，完全錯了。"},{"類":"立","文":"佛法難道不是找快樂？是；差別在世間人找快樂是頭痛醫頭、腳痛醫腳。"},{"類":"立","文":"佛法指出快樂的特質是什麼：根本你的認識就錯了，要從這上面轉一個方法。"},{"類":"破","文":"不要說這裡不理想、那裡不理想，然後要換、要找。"},{"類":"立","文":"你可以逃得了環境，逃不了自己；自己就是身心五蘊、煩惱，真正要透脫的是煩惱，所以必定要認得煩惱。"},{"類":"破","文":"找不到因，說「反正沒辦法了」，那張開眼睛就去享樂，什麼壞事都去做好了。"},{"類":"立","文":"現在好，有原因的，可以解決；所以進一步了解了苦，就找它的原因。"}],"af":"72b","st":1020}],"逐字稿":[{"t":"72B 16:33","b":[["q","如是思惟五趣六趣，總別諸苦，厭患生死意欲出離，便當觀察其因，"],["s","那麼經過了上面，不管是你總的思惟，不管是別的思惟，就是說，在任何一個角度，任何一個狀態，你觀察、思惟的結果，沒有一點點例外 ─是苦，是苦！那個時候你了解了以後啊，產生一個什麼結果？厭患。所以我們現在總覺得：「唉呀，求快樂啊！」錯了！錯了！錯了！找不到快樂的，這個世間的特質就是這樣，這一點我們必定要知道。所以平常我們眼前哪，一定要把這個道理仔細地觀察一下：我們眼前到底忙些什麼？如果我們是對眼前不滿意，說「這裡不好啊，換一個地方去啊！那個地方可以快樂呀！」錯了，完全錯了。世間的人這樣想的，佛法不是。那難道不是找快樂嗎？是。差別在哪裡呢？就是世間一般人找的快樂，是頭痛醫頭、腳痛醫腳，只是如此。佛法裡面說，是的，你找快樂，結果呢你跑到我這裡來，說我可以告訴你，我這裡有快樂的，指出來 ─快樂的特質是什麼，根本你的認識就錯了，你要從這個上面去轉一個方法。"]]},{"t":"72B 18:07","b":[["s","所以對我們修學佛法的人來說，我們必定要了解。不要說：哎喲，這裡不理想啊，那裡不理想啊！然後要換哪、要找啊！不是，你可以逃得了環境，是逃不了自己。自己是什麼？喏，身心五蘊、煩惱。我們真正要透脫是透脫這個煩惱，所以必定要認得煩惱。把這個解決了，問題就解決了，因為這個是痛苦的因，所以說「厭患生死意欲出離，便當觀察其因」。那麼你整個的生死的內容無非是痛苦，沒有一個地方可以逃的，沒有一個地方有安樂的，那找到它的因。如果找不到它的因的話，說反正沒辦法了！那好了，我們現在只要有一天哪，張開眼睛來就去享樂，然後你什麼事情都去做好了嘛，反正壞事 ……只要快樂。欸，現在好，有原因的，那可以解決！所以進一步了解了這個苦，就找它的痛苦的原因。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/003.mp3"},{"文":"念云如是生死«以何為因»。","口譯":"心想：像這樣的生死，是以什麼為因？","四家合註":null,"覺燈日光":null,"時":"72B 19:15","頁":169,"af":"72b","st":1155,"et":1353,"消文":[{"文":"三界之內無不是苦，原因在哪裡？因為感受苦的逼切，所以找苦的原因，找到的這個叫集諦。"},{"文":"集是「招感」：由此可以感得痛苦的果報，就是痛苦的原因所在；把原因拿掉，痛苦就消失。"}],"延伸":[{"題":"以何為因","組":[{"題":"為苦而忙，就要找因","說":[{"類":"立","文":"既然我們為痛苦而忙，真正要找的是這個，這才是修學佛法的特質；大家務必在這裡認真把握住。"}]},{"題":"碰到一點修一點，漏洞百出","說":[{"類":"破","文":"不要碰到一點去修一點，那時並不圓滿，乃至並不是根本；以為碰到了，結果漏洞百出，忙了半天痛苦仍在。"}]},{"題":"先堵漏洞，再清髒水","說":[{"類":"喻","文":"房間裡有水，沒找到漏洞就拼命擦，擦了半天那地方又來了，自己疲憊不堪，屋裡照樣是髒水。"},{"類":"下手","文":"必定要找到根本，其他暫時不管，先把漏洞堵死，再慢慢把髒水清乾淨，問題解決。"}]},{"題":"莫隨人轉，根本未找到","說":[{"類":"破","文":"人家告訴你參禪、念佛，哪個密宗好，你就跟著去修；根本的問題在哪裡沒找到。"},{"類":"喻","文":"像拿濕布擦地，那塊地乾了，濕布拿掉回頭一看又來了。"},{"類":"破","文":"太多人修行忙這些，自己還不懂，還要去幫別人，越幫越忙。"},{"類":"回扣","文":"這裡告訴我們根本在哪裡，由此而講集諦門。"}]}],"說":[{"類":"立","文":"既然我們為痛苦而忙，真正要找的是這個，這才是修學佛法的特質；大家務必在這裡認真把握住。"},{"類":"破","文":"不要碰到一點去修一點，那時並不圓滿，乃至並不是根本；以為碰到了，結果漏洞百出，忙了半天痛苦仍在。"},{"類":"喻","文":"房間裡有水，沒找到漏洞就拼命擦，擦了半天那地方又來了，自己疲憊不堪，屋裡照樣是髒水。"},{"類":"下手","文":"必定要找到根本，其他暫時不管，先把漏洞堵死，再慢慢把髒水清乾淨，問題解決。"},{"類":"破","文":"人家告訴你參禪、念佛，哪個密宗好，你就跟著去修；根本的問題在哪裡沒找到。"},{"類":"喻","文":"像拿濕布擦地，那塊地乾了，濕布拿掉回頭一看又來了。"},{"類":"破","文":"太多人修行忙這些，自己還不懂，還要去幫別人，越幫越忙。"},{"類":"回扣","文":"這裡告訴我們根本在哪裡，由此而講集諦門。"}],"af":"72b","st":1200}],"逐字稿":[{"t":"72B 19:15","b":[["q","念云如是生死以何為因。"],["s","說進一步我們要觀察，這樣的三界之內無不是苦，原因在哪裡呀？那麼進一步中，因為感受苦的逼切，所以我們找苦的原因，這個時候找到，啊！原來這個地方。那麼這個叫什麼？集諦。所以現在我們哪，從了解了苦，要求脫苦而找到這個苦的原因是集諦。集，什麼呢？它的所謂「招感」，由於這樣的可以感得痛苦的果報，換句話說，這就是痛苦的原因所在。你只要把這個痛苦的原因拿掉了，痛苦就消失。所以既然是我們為痛苦而忙，那麼真正要找的，這個才是，這個才是我們修學佛法的特質。所以大家注意啊，大家修學佛法，務必要在這個地方認真把握住。前面不同的地方，常常說明、歸類等等，它原因無非是要說明這個 ─你要修不要說碰到一點去修，碰到一點去修，那個時候並不圓滿，乃至於並不是根本，你以為碰到了，結果漏洞百出。因為漏洞百出，所以忙了半天痛苦仍舊在，你沒摸到根本，沒摸到根本。"]]},{"t":"72B 20:55","b":[["s","比如說我們現在說，哎呀，我們房間裡面有水呀，你把它擦掉。結果你沒找到漏洞，沒有找到水哪裡來的，你拼命去擦，擦了半天，那個地方又來了；擦了半天，那個地方又來了，越弄越糟。結果嘛自己忙得疲憊不堪哪，屋裡面照樣都是髒水，有用嗎？修行也是如此。你必定要找到根本，暫時其他地方先不管它，把那個漏洞堵死了，堵死了它沒有再來了，然後你慢慢地把裡面的髒水清乾淨。好囉，問題解決！"]]},{"t":"72B 21:32","b":[["s","所以我們修行哪，在這個地方，特別 ─這個概念要一而再、再而三地擺在腦筋裡面。不要說：哎呀，我現在要去修行去啦！人家告訴你怎麼修啊？參禪，人家告訴你念佛，人家告訴你 ……不管是哪一個法門，哦，這個密宗好，你只要去修修就行，然後你就跟著去修。實際上，根本的問題在哪裡你沒找到。有沒有一點樣子？有一點樣子的。當然就像那擦地一樣嘛，你拿著濕布一擦，那塊地就乾了，等到你濕布拿掉了，回過頭來看看，那個地方又來了。那有什麼用啊？所以我們現在太多的人修行都是忙這些，然後呢自己還不懂，還要去幫別人去，是越幫越忙啊！現在這個地方告訴我們，哦，這個情況這樣的，根本在哪裡呀？由此而講集諦門，那麼就找。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/004.mp3"},{"文":"第二，由集諦門思惟流轉生死次第分三：一煩惱發生之理，二彼集業之理，三死沒及結生之理。","口譯":"第二，從集諦方面思惟流轉生死的次第，分三：一、煩惱發生的道理，二、由煩惱集業的道理，三、死沒以及結生的道理。","四家合註":null,"覺燈日光":null,"時":"72B 22:33","頁":169,"af":"72b","st":1353,"et":1419,"消文":[{"文":"為什麼會生死？由於這個因。因是什麼？惑跟業。"},{"文":"先了解煩惱怎麼發生；再了解惑業為什麼會招感生死、為什麼會集業；最後是怎麼死、又怎麼結生。"},{"類":"回扣","文":"從這裡我們就把因找到了，然後從因上面看怎麼樣把它清除。"}],"延伸":[],"逐字稿":[{"t":"72B 22:33","b":[["q","第二，由集諦門思惟流轉生死次第分三："],["s","說為什麼會流轉生死，這個原因呢？分三部分："]]},{"t":"72B 22:43","b":[["q","一煩惱發生之理，二彼集業之理，三死沒及結生之理。"],["s","這個為什麼會生死呀？由於這個因。因是什麼？煩惱跟業，惑、業，就是這樣。那麼這個煩惱怎麼發生的呢？先了解。為什麼發生了這個惑跟業會招感到生死呢？所以他就講，這個為什麼會集業。那麼招感生死又是怎麼樣的招感法呢？所以怎麼死，又怎麼會結呢，這個道理下面就了解一下。從這個地方，我們就把因找到了，然後從因上面看看，怎麼樣把它清除。翻過來。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/005.mp3"},{"文":"今初　成辦生死之因，雖俱須惑業，然以煩惱而為上首。","口譯":"現在講第一。成辦生死的因，雖然惑與業兩者都需要，但是以煩惱為首要。","四家合註":null,"覺燈日光":null,"時":"72B 23:39","頁":170,"af":"72b","st":1419,"et":1470,"消文":[{"文":"痛苦的真正根本在惑跟業：惑或叫無明、煩惱；業或叫行，名字各式各樣，總之這兩樣東西。"},{"類":"例","文":"十二因緣當中的無明、行，就是這兩個；或者愛、取、有：愛、取是惑，有是業。"},{"文":"雖然要這兩樣東西，裡面主要的卻是惑，是煩惱。"}],"延伸":[],"逐字稿":[{"t":"72B 23:39","b":[["q","今初　成辦生死之因，雖俱須惑業，然以煩惱而為上首。"],["s","現在了解了，說這個痛苦的真正的根本，在這個惑跟業。「惑」，或者叫無明，或者叫煩惱；「業」，或者叫行，或者叫什麼其他的種種的名字，有各式各樣的不同的名字。總之一句話，這兩樣東西。十二因緣當中說無明、行這兩個，就是這樣；或者是愛、取、有，愛、取是惑，有是業，這樣。那麼，但是雖然要這兩樣東西呀，這個裡面主要的卻是惑，卻是煩惱。下面看，"]]}],"口譯音":"口譯音檔/siwei-kudi-08/006.mp3"},{"文":"若無煩惱，雖有宿業超諸量數，然如種子，若無潤澤及其土等，定不發芽。","口譯":"如果沒有煩惱，雖然有超過計量之數的宿業，然而就像種子，如果沒有水分滋潤以及土壤等，決定不會發芽。","四家合註":null,"覺燈日光":null,"時":"72B 24:30","頁":170,"af":"72b","st":1470,"et":1508,"消文":[{"文":"假定煩惱斷掉了，雖然有無量無邊、數都不能數的宿業，也不會感果。"},{"類":"喻","文":"像種子，沒有土、水、太陽這些因緣，長不出來。"}],"延伸":[],"逐字稿":[{"t":"72B 24:30","b":[["q","若無煩惱，雖有宿業超諸量數，然如種子，若無潤澤及其土等，定不發芽。"],["s","為什麼這煩惱為主要呢？就是說假定你的煩惱沒有了，斷掉了，雖然你有無量無邊的宿業，數都不能數，但是就像「種子」一樣，那個種子如果說沒有其他的因緣─土呀、水呀、太陽呀！對不起，它長不出來，長不出來，這個不會感果的。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/007.mp3"},{"文":"如是諸業缺«俱有緣»，亦定不能發苦芽故。","口譯":"同樣地，諸業如果缺少俱有緣，也決定不能生出苦芽。","四家合註":null,"覺燈日光":null,"時":"72B 25:08","頁":170,"af":"72b","st":1508,"et":1586,"消文":[{"文":"業之所以能感果，一定還要一個「俱有緣」，或者叫俱有因，這個就是惑，就是煩惱。"}],"延伸":[{"題":"俱有緣","組":[{"題":"彼此撐持，缺一不成","說":[{"類":"喻","文":"布是經線跟緯線織的：經是緯的俱有緣，緯是經的俱有緣。"},{"類":"喻","文":"三腳架，這一根撐得起來，靠另外那幾根；少掉了，撐不起來。"}]},{"題":"無惑則業不結果","說":[{"類":"回扣","文":"沒有惑，雖然有業，不可能成功，不能結果。"}]}],"說":[{"類":"喻","文":"布是經線跟緯線織的：經是緯的俱有緣，緯是經的俱有緣。"},{"類":"喻","文":"三腳架，這一根撐得起來，靠另外那幾根；少掉了，撐不起來。"},{"類":"回扣","文":"沒有惑，雖然有業，不可能成功，不能結果。"}],"af":"72b","st":1530}],"逐字稿":[{"t":"72B 25:08","b":[["q","如是諸業缺俱有緣，亦定不能發苦芽故。"],["s","所以這個業之所以能夠感果，一定還要一個什麼？「俱有緣」，或者俱有因，這個就是惑，就是煩惱。有這個俱有緣才能夠感果，什麼叫俱有緣呢？或者叫俱有因？現在我們隨便說，現在我們每個人身上穿的衣服，我這件衣服，這個衣服是布做的對不對？這個布怎麼做的？經線跟緯線。這個經就是緯線的俱有緣、俱有因；這個緯就是經的俱有緣，這樣的。平常我們說架一個架子，三腳架，用三根架撐在一塊兒，那個你之這一根所以撐起來，就靠另外那個撐起來的，這個就是你的俱有緣。少掉了這個，對不起，你撐不起來的，懂不懂？就是這樣的。所以呀，如果沒有這個惑的話，這個雖然有業，對不起，它不可能成功，不能結果。反過來呢，"]]}],"口譯音":"口譯音檔/siwei-kudi-08/008.mp3"},{"文":"又若有煩惱，縱無宿業，無間新集，取後有故。","口譯":"又如果有煩惱，縱然沒有宿業，也會立即新造集業，而取得後有。","四家合註":null,"覺燈日光":null,"時":"72B 26:26","頁":170,"af":"72b","st":1586,"et":1626,"消文":[{"文":"就算沒有宿業，有煩惱，煩惱為緣，會使你生長這個業；一跟著造，惑業具足，馬上又生了。"},{"類":"回扣","文":"從生死的因當中，找到最主要的主腦是惑，是煩惱。"}],"延伸":[],"逐字稿":[{"t":"72B 26:26","b":[["q","又若有煩惱，縱無宿業，無間新集，取後有故。"],["s","就算是你沒有宿業，但是你有煩惱，因為你有煩惱，這個煩惱呀，它會煩惱為緣哪，會使你生長這個業。欸！因為有煩惱在，這個業就跟著來造了，一跟著造，惑、業具足啊，它馬上又生了。所以在這個地方，我們又從這個惑、業，生死的因當中，找到最主要的主腦是惑，是煩惱。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/009.mp3"},{"文":"如是亦如《釋量論》云：「超度諸有愛，非餘業能引，滅盡俱有故。」","口譯":"就如《釋量論》所說：「超越了對三有的貪愛，其餘的業就不能牽引後有，因為俱有緣已經滅盡了。」","四家合註":null,"覺燈日光":null,"時":"72B 27:06","頁":170,"af":"72b","st":1626,"et":1738,"消文":[{"文":"諸有就是三有：欲有、色有、無色有；「有」是業，它一定會感得下面新生命結生的力量，十二因緣會詳細說明。"},{"文":"把對諸有的愛（就是惑）超脫了，其他的業就不會再引發你的生死，因為俱有緣統統弄乾淨了。"},{"類":"喻","文":"電燈樣樣弄好了，沒有電，沒用；有了電，沒有燈，也不會亮。兩個人才吵得起架，一個人吵不起來。"},{"類":"立","文":"天底下的事情就是這個樣，少掉一樣東西就不成。"}],"延伸":[],"逐字稿":[{"t":"72B 27:06","b":[["q","如是亦如《釋量論》云："],["s","下面引那個經論："]]},{"t":"72B 27:11","b":[["q","「超度諸有愛，非餘業能引，滅盡俱有故。」"],["s","我們要想超出諸有，諸有就是三有，三有是什麼？欲有、色有、無色有。「有」啊是業，為什麼叫作「有」，不講業呢？就是說，它一定會感得下面這個新生命的結生的這個力量，這個業力在十二因緣當中會詳細說明它，說明它。就是說你要想超越這個生死輪迴，當一切的諸有的這個愛，愛就是惑，你能夠把這個能夠超脫了，超脫出來的話，那麼其他的所有東西，就不會再引發你的業，說「非餘業能引」，它就不會再引發你的生死。為什麼呀？「滅盡俱有故」，就是那個俱有緣，上面說那個俱有緣哪，統統弄乾淨了，統統弄乾淨了。就像你要做一個布一樣，經線雖然擺在這裡，緯線沒有了，對不起，那個就是經線，就不成其為布。你做任何一件事情，少掉一樣東西 ─你那個電燈，樣樣弄好了，電沒有，沒有用；再不然你雖然有了電了，燈沒有，它也不會亮，就是這樣。所有的事情，兩個人吵架，它一定是兩個人才吵得起來，一個人吵不起架來。這個天底下的事情，就是這個樣，所以像這一類事情，我們要了解。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/010.mp3"},{"文":"又云：「若有愛，仍當出生故。」","口譯":"又說：「如果還有愛，仍然會出生。」","四家合註":null,"覺燈日光":null,"時":"72B 28:58","頁":170,"af":"72b","st":1738,"et":1755,"消文":[{"文":"愛就是煩惱；愛在，馬上跟著造業，煩惱跟業具足，就繼續生死。"}],"延伸":[],"逐字稿":[{"t":"72B 28:58","b":[["q","又云：「若有愛，仍當出生故。」"],["s","反過來呢，如果你這個愛，愛就是煩惱，如果你這個愛在的話，對不起，由於煩惱，馬上跟著這個煩惱就造了業。一造了業的話，煩惱跟業具足，他就繼續地生死。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/011.mp3"},{"文":"是故開示«煩惱對治極為重要»。","口譯":"所以，開示煩惱的對治極為重要。","四家合註":null,"覺燈日光":null,"時":"72B 29:15","頁":170,"af":"72b","st":1755,"et":null,"消文":[{"文":"生死的因在這裡，因當中主要的是煩惱。煩惱是什麼？如何對治？要對治它，一定要認得它的本質，這是最重要的。"}],"延伸":[{"題":"煩惱對治極為重要","組":[{"題":"修行從哪裡修起","說":[{"類":"立","文":"到這裡停一下：大家都修行了，請問你修什麼？從哪裡修起？在這裡！"}]},{"題":"莫修我，越修越大","說":[{"類":"破","文":"記著以前說過的：不要修「我」！修我越修越大，跳不出生死輪迴，還覺得很得意，一生空空白費。"},{"類":"下手","文":"前面沒有聽的趕快補聽，否則跑到這裡來是白上了這個課。"}]},{"題":"依佛如理如量解決","說":[{"類":"立","文":"只有佛是如理如量地解決一切問題；現在告訴我們問題在這裡：要對治生死的根本，最後找到要對治煩惱。"}]}],"說":[{"類":"立","文":"到這裡停一下：大家都修行了，請問你修什麼？從哪裡修起？在這裡！"},{"類":"破","文":"記著以前說過的：不要修「我」！修我越修越大，跳不出生死輪迴，還覺得很得意，一生空空白費。"},{"類":"下手","文":"前面沒有聽的趕快補聽，否則跑到這裡來是白上了這個課。"},{"類":"立","文":"只有佛是如理如量地解決一切問題；現在告訴我們問題在這裡：要對治生死的根本，最後找到要對治煩惱。"}],"af":"73a","st":3}],"逐字稿":[{"t":"72B 29:15","b":[["q","是故開示煩惱對治極為重要。"],["s","那麼既然我們了解了生死的因在這裡，那麼更進一步就了解了，這個因當中主要的是煩惱。那麼煩惱是什麼呢？如何去對治呢？你要對治它，一定要認得它本質是什麼呢，這個是最重要的。"]]},{"t":"73A 00:03","b":[["s","所以到這個地方，我們停一下，我們現在大家都修行了，請問你修什麼啊？你從哪裡修起啊？在這裡，在這裡。所以我們應該想一想，說我們要修行啦，記著我以前說過的話：不要修「我」！修「我」是修我越修越大，跳不出生死輪迴啊！這一點諸位以前前面沒有聽的人趕快補聽，否則的話你跑到這裡來是白上了這個課了。我們都在這兒修我，不知道，還覺得很得意，結果修了我越修越大，只見我大。我既然大，在生死輪迴當中轉，一生空空白費。我們要學佛，因為只有佛是如理如量地解決一切問題，他曉得這個什麼辦法，所以第一件事情現在要認真了解。現在他這裡告訴我們了，原來這個問題在這裡啊！說你要對治這個生死的根本嘛，最後找到了要對治這個煩惱；那麼你要曉得煩惱的道理，要如何對治的話，怎麼辦呢？"]]}],"口譯音":"口譯音檔/siwei-kudi-08/012.mp3"},{"文":"此復賴於先知煩惱，故於煩惱，«應當善巧»。","口譯":"而這又依賴於先了知煩惱，所以對於煩惱，應當善巧了解。","四家合註":null,"覺燈日光":null,"時":"73A 01:15","頁":170,"af":"73a","st":75,"et":156,"消文":[{"文":"你先必定要曉得什麼是煩惱。"}],"延伸":[{"題":"應當善巧","組":[{"題":"先認清所對治","說":[{"類":"喻","文":"叫你掃地，本來是掃地上的垃圾，你卻把桌上的書本統統掃掉了，那不是開玩笑嗎？"},{"類":"立","文":"必定要把所對治的內容認得清清楚楚。"}]},{"題":"能治方法的質量次第","說":[{"類":"立","文":"進一步還要認得拿什麼來對治它，對治的方法以及正確與否，每一個地方的質、量、次第。"}]},{"題":"層層深入找到根本","說":[{"類":"回扣","文":"現在層層深入，找到生死的根本原因在煩惱；找到了以後，進一步了解煩惱是什麼。"}]}],"說":[{"類":"喻","文":"叫你掃地，本來是掃地上的垃圾，你卻把桌上的書本統統掃掉了，那不是開玩笑嗎？"},{"類":"立","文":"必定要把所對治的內容認得清清楚楚。"},{"類":"立","文":"進一步還要認得拿什麼來對治它，對治的方法以及正確與否，每一個地方的質、量、次第。"},{"類":"回扣","文":"現在層層深入，找到生死的根本原因在煩惱；找到了以後，進一步了解煩惱是什麼。"}],"af":"73a","st":80}],"逐字稿":[{"t":"73A 01:15","b":[["q","此復賴於先知煩惱，"],["s","你先必定要曉得什麼是煩惱。"]]},{"t":"73A 01:20","b":[["q","故於煩惱，應當善巧。"],["s","你要善巧地了知，你才可以對治它呀！否則的話你做任何事情，叫你拔草固然如此，叫你掃地如此，叫你做任何事情 ……今天跑得來叫你打掃這個房間，掃一下，你到底要掃掉什麼你不知道，本來叫你掃掉地上的垃圾，你卻把桌子上面的那些書本統統掃掉了，那你算什麼呀？那不是開玩笑嗎？這樣。所以必定要把你所對治的內容，要認得得清清楚楚。進一步還要認得，所對治的內容知道了，拿什麼東西來對治它，對治的方法以及這個正確與否，每一個地方它的質、量、次第。"]]},{"t":"73A 02:12","b":[["s","現在我們又進一步層層深入，找到生死的根本原因，原來在煩惱。找到了以後，所以我們進一步去了解一下煩惱是什麼？下面看："]]}],"口譯音":"口譯音檔/siwei-kudi-08/013.mp3"},{"文":"此中分四：一正明煩惱，二如何生起之次第，三煩惱之因，四煩惱過患。今初","口譯":"這當中分四：一、正明煩惱，二、煩惱如何生起的次第，三、煩惱的因，四、煩惱的過患。現在講第一。","四家合註":null,"覺燈日光":null,"時":"73A 02:36","頁":170,"af":"73a","st":156,"et":247,"消文":[{"文":"第一先如法如理地了解什麼是煩惱。"},{"文":"從生起的次第上可以找到它的根源；了解了禍患準備消滅它，就找它的原因、根本、行相，每一處清楚了，就容易下手對治。"},{"類":"立","文":"煩惱對治了，一切痛苦都解決；自己的問題解決了，才能幫助別人。"},{"類":"回扣","文":"不管大乘小乘，自利利人的根本在此，所以這裡叫「共中士」：學大乘也從這裡開始。"}],"延伸":[],"逐字稿":[{"t":"73A 02:36","b":[["q","此中分四：一正明煩惱，"],["s","第一個先說煩惱是什麼，對這個我們必定要先了解它，如法如理地了解什麼是煩惱。第二呢，"]]},{"t":"73A 02:52","b":[["q","二如何生起之次第，三煩惱之因，四煩惱過患。　今初"],["s","為什麼要找那個生起的次第？你從那個生起的次第上面你可以找到它 ─哦！它的根源在哪裡。然後呢生起的原因是什麼，最後它有什麼禍害。你這個了解了以後，它這個禍患了解了，你準備要消滅它；要去消滅它，你就找到它的什麼原因，然後它的根本在哪裡，就這樣，都找到了，以及它煩惱的行相，你每一個地方清楚了，那個時候你就容易下手對治。這個煩惱對治了，一切痛苦都解決，你能夠自己有問題解決了，那個時候你才能夠幫助別人哪！所以歸根結底，不管是大乘小乘、自利利人的根本在此，所以這個地方叫「共中士」 ─只管你自己的就你學這個，如果你要學大乘的也從這裡開始。看文："]]}],"口譯音":"口譯音檔/siwei-kudi-08/014.mp3"},{"文":"煩惱總相者。如《集論》云：「若有法生，即便生起極不靜相。由彼生故令心相續，極不靜起，是煩惱相。」謂若何生，令心相續，«極不寂靜»。","口譯":"煩惱的總相，如《集論》說：「如果有某法生起，當下就生起極不寂靜之相；由於它生起，令心相續極不寂靜地生起，這就是煩惱的相。」意思是：凡是某法生起時，令心相續極不寂靜，就是煩惱。","四家合註":null,"覺燈日光":null,"時":"73A 04:07","頁":170,"af":"73a","st":247,"et":399,"消文":[{"文":"「法」指一切色法、心法；任何一樣東西生起，就生起不寂靜、不安靜的相，令身心相續不寂靜繼續不斷，這叫煩惱相。"}],"延伸":[{"題":"極不寂靜","組":[{"題":"粗猛的容易認得","說":[{"類":"例","文":"發脾氣的時候坐立不安，青筋直爆，心裡直跳，什麼事情都幹得出來；貪心來時也是很強烈的狀態。"}]},{"題":"學靜才顯出不靜","說":[{"類":"立","文":"細微的狀態平常難感覺；當你學定坐下來，才覺得「哎呀，這個不行啊」。"},{"類":"下手","文":"一定要相對地去學一個寧靜的狀態，才顯得出不寂靜，也才了解行的自相。"}]},{"題":"眼前都在煩惱當中","說":[{"類":"破","文":"凡夫以為發了脾氣才叫煩惱，不是的。"},{"類":"立","文":"有了這個經驗，任何時候心裡生起來就認得它：眼前任何狀態都在煩惱當中，只是比較細，或在癡性當中。"}]}],"說":[{"類":"例","文":"發脾氣的時候坐立不安，青筋直爆，心裡直跳，什麼事情都幹得出來；貪心來時也是很強烈的狀態。"},{"類":"立","文":"細微的狀態平常難感覺；當你學定坐下來，才覺得「哎呀，這個不行啊」。"},{"類":"下手","文":"一定要相對地去學一個寧靜的狀態，才顯得出不寂靜，也才了解行的自相。"},{"類":"破","文":"凡夫以為發了脾氣才叫煩惱，不是的。"},{"類":"立","文":"有了這個經驗，任何時候心裡生起來就認得它：眼前任何狀態都在煩惱當中，只是比較細，或在癡性當中。"}],"af":"73a","st":285}],"逐字稿":[{"t":"73A 04:07","b":[["q","煩惱總相者。如《集論》云：「若有法生，即便生起極不靜相。由彼生故令心相續，極不靜起，是煩惱相。」謂若何生，令心相續，極不寂靜。"],["s","說任何一個法 這個「法」指一切色法、心法，所有的任何一樣東西 如果這個生起的時候，就生起一個不寂靜、不安靜的相。因為這個生了以後，令我們身心相續不寂靜繼續不斷地生起，這個叫煩惱相，這個叫煩惱相。所以現在我們因為沒有體會到這個「靜」這個狀態，所以這個煩惱相不明顯，但是呢粗猛的卻是很容易。譬如說你發脾氣了，我自己覺得：唉呀！那個時候人就坐立不安，然後呢就是面孔上青筋直爆，心裡面就直跳。啊！這個樣子，就什麼事情都幹得出來，跟著來了。貪心來的時候也是一樣，那個時候心裡面是很強烈的狀態，可是沒有這種強烈的這種啊，細微的這個狀態平常就難感覺得出來了。只有當你要學定，坐下來的話，你就自己覺得心裡邊：「哎呀，這個不行啊！」所以你一定要相對地去學一個寧靜的狀態，那個時候你就顯得出來不寂靜的狀態，那個時候你也才了解所謂行的自相，這一點在這個地方特別說明一下。"]]},{"t":"73A 05:53","b":[["s","反過來，你有了這個經驗，就很容易感受到：哦，這個煩惱生起來了！就在任何那個時候心裡面生起來，你就認得它。通常我們的凡夫剛才開始覺得什麼叫煩惱，好像等到你發了脾氣了這個才叫煩惱，不是的，不是的。就是你眼前在任何狀態都是，這是都在煩惱當中，不過這種煩惱比較細，或在癡性當中，這個是我們必定應該了解的，這個是它的總體整相。各別地說來，那麼十種，十種，就是屬於我們平常說的五鈍、五利。貪，第一個。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/015.mp3"},{"文":"各別相中有十煩惱。貪者，謂緣內外可意淨境，隨逐躭著，如油著布難以洗除。此亦«耽戀自所緣境»，與彼所緣難以分離。","口譯":"各別相中有十種煩惱。貪，是緣內、外可意的淨妙境界，隨逐耽著，如同油沾在布上難以洗除。這也是耽戀自己所緣的境界，與那所緣難以分離。","四家合註":null,"覺燈日光":null,"時":"73A 06:39","頁":170,"af":"73a","st":399,"et":510,"消文":[{"文":"十種就是平常說的五鈍、五利。"},{"文":"不管所緣的是內或外：外是一切境界，內是自己身心，乃至意地當中的見解，我的地位、我的名譽；跟著它一直不放失，著在上頭。"},{"類":"喻","文":"油碰在布裡還可以洗乾淨；祖師說「如油入麵」，油放在麵粉糰裡，一點辦法都沒有。"}],"延伸":[{"題":"耽戀自所緣境","組":[{"題":"難分難解的行相","說":[{"類":"立","文":"對自己所緣的歡喜它，不忍分離、難分難解，心裡就是這樣；貪心生起來，簡直一點辦法都沒有。"}]},{"題":"看不見，卻隨時都在","說":[{"類":"例","文":"不但好看、好吃、好玩、有錢；眼前有東西總歸選好的，累了就要去躺，碰見一點小不如意就想……"}]},{"題":"對我的耽著","說":[{"類":"回扣","文":"總歸對這個「我」產生種種耽著，就是貪的行相。"}]}],"說":[{"類":"立","文":"對自己所緣的歡喜它，不忍分離、難分難解，心裡就是這樣；貪心生起來，簡直一點辦法都沒有。"},{"類":"例","文":"不但好看、好吃、好玩、有錢；眼前有東西總歸選好的，累了就要去躺，碰見一點小不如意就想……"},{"類":"回扣","文":"總歸對這個「我」產生種種耽著，就是貪的行相。"}],"af":"73a","st":457}],"逐字稿":[{"t":"73A 06:39","b":[["q","各別相中有十煩惱。貪者，謂緣內外可意淨境，隨逐躭著，如油著布難以洗除。此亦耽戀自所緣境，與彼所緣難以分離。"],["s","這個就是貪的行相。不管你這個心所緣的、所對的是內或者是外，外是外面的一切境界，內是你自己的身心，乃至你意地當中的見解，覺得我這個地位、我這個名譽、我這個什麼，這些。對這些東西跟著它，一直不放失，著在這個上頭。這個東西叫油碰在布裡邊，我們祖師更有一句話：如油入麵 ─碰到布裡邊還可以洗得乾淨，如果這個油啊放在麵粉糰裡面，你拿它一點辦法都沒有，這個貪就這麼個難弄法。"]]},{"t":"73A 07:37","b":[["s","就是他又進一步說，「耽著自所緣境」，這個貪的行相就是對你自己所緣的歡喜它，不忍分離、難分難解的狀態，心裡邊就是這樣！這個就是貪的行相。所以平常當我們貪心生起來，你簡直一點辦法都沒有。而且這個貪心的行相啊，你真正看好像看不見，但是隨時隨地都在。哦，這樣，不但是我們經常說外面好看的、好吃的、好玩的、有錢什麼等等，眼前一切的東西，你自然而然覺得眼前有個東西總歸選好的；唉呀，累了就要去躺；碰見一點小的不如意呀就想 ……總歸對這個「我」產生種種的耽著，這就是這個行相。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/016.mp3"},{"文":"瞋者，謂緣諸有情及苦，苦具，謂刀杖荊刺等，發恚惱心，發粗猛心，於彼諸境思作無義。","口譯":"瞋，是緣諸有情以及苦、苦具（也就是刀杖、荊棘等），生起恚惱之心、粗猛之心，對那些境界想要做無義的損害。","四家合註":null,"覺燈日光":null,"時":"73A 08:30","頁":170,"af":"73a","st":510,"et":569,"消文":[{"文":"對有情（對方）、苦的本身，或傷害我們的東西，發不能忍耐、粗猛的瞋恚心，要對所瞋的境界做無理的傷害。"},{"類":"例","文":"一個東西撞你一下，你一定把它拿掉，那就是對苦具。"}],"延伸":[],"逐字稿":[{"t":"73A 08:30","b":[["q","瞋者，"],["s","那麼第二個。"]]},{"t":"73A 08:33","b":[["q","謂緣諸有情及苦，苦具，謂刀杖荊刺等，發恚惱心，發粗猛心，於彼諸境思作無義。"],["s","瞋就是這樣。對於或者是「有情」 ─對方嘛！「苦、苦具」，這個苦就是苦的、痛苦的本身，或者是傷害我們的那些東西。傷害我們的東西，那些刀啊、杖啊、什麼東西啊，如果這些傷了你，你就對它：「好，這個傢伙，你！」譬如說你跑過去，一個東西撞你一下，這個東西你一定把它拿掉它，就是這個，那是苦具。發那個不能忍耐、粗猛地對它這種心，瞋恚的心情，要想對所緣的、所瞋的這個境界，做無理的要傷害它的。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/017.mp3"},{"文":"慢者，謂依止薩迦耶見，緣內外之高下好惡，令心高舉，高相隨轉。","口譯":"慢，是依止薩迦耶見，緣內、外的高下好惡，令心高舉，高傲之相隨之而轉。","四家合註":null,"覺燈日光":null,"時":"73A 09:29","頁":170,"af":"73a","st":569,"et":613,"消文":[{"文":"慢依薩迦耶見；薩迦耶見通常說「我見」，正翻叫「壞聚見」，下面再講。"},{"文":"慢就是依我，覺得我比他高、我不如他；不管內外，總使自己要想高過對方、高過別人。"}],"延伸":[],"逐字稿":[{"t":"73A 09:29","b":[["q","慢者，謂依止薩迦耶見，緣內外之高下好惡，令心高舉，高相隨轉。"],["s","慢，怎麼來的呢？它有依一個薩迦耶見，薩迦耶見通常我們就說「我見」，但是呢正翻的時候不叫我見，叫「壞聚見」，等到下面講那個薩迦耶見的再講。通常就說我，慢就是依我，然後呢我比他高、我不如他，由於這樣，不管是內、是外，現出來這個，總是使得自己要想高過對方、高過別人。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/018.mp3"},{"文":"無明者，謂於四諦，業果，三寶自性，«心不明了»，染污無知。","口譯":"無明，是對於四諦、業果、三寶的自性，心不明了，是染污的無知。","四家合註":null,"覺燈日光":null,"時":"73A 10:13","頁":170,"af":"73a","st":613,"et":710,"消文":[{"文":"對真實的內容不了解叫作無明；四諦是世間真實的行相。"}],"延伸":[{"題":"心不明了","組":[{"題":"不知苦、不知苦因","說":[{"類":"立","文":"世間一切是苦，偏偏不了解；苦有原因，又找錯了非苦之因。"},{"類":"例","文":"假定知道苦的原因，人家罵你一下，一定忍受：他所以罵我，總是以前欠了他，還了就好了；實際上我們不會。"}]},{"題":"更不知滅道","說":[{"類":"立","文":"流轉不知道；能徹底淨除的辦法，滅諦、道諦，更不知道。"}]},{"題":"自作聰明說迷信","說":[{"類":"破","文":"講這個道理的人，我們還自作聰明說是迷信，世間真顛倒！"},{"類":"回扣","文":"業果、三寶自性不明了，是染污的無知，就是愚癡，生死的根本。"}]}],"說":[{"類":"立","文":"世間一切是苦，偏偏不了解；苦有原因，又找錯了非苦之因。"},{"類":"例","文":"假定知道苦的原因，人家罵你一下，一定忍受：他所以罵我，總是以前欠了他，還了就好了；實際上我們不會。"},{"類":"立","文":"流轉不知道；能徹底淨除的辦法，滅諦、道諦，更不知道。"},{"類":"破","文":"講這個道理的人，我們還自作聰明說是迷信，世間真顛倒！"},{"類":"回扣","文":"業果、三寶自性不明了，是染污的無知，就是愚癡，生死的根本。"}],"af":"73a","st":640}],"逐字稿":[{"t":"73A 10:13","b":[["q","無明者，謂於四諦，業果，三寶自性，心不明了，染污無知。"],["s","這叫作無明 ─對於真實的內容不了解。這個四樣東西（四諦）是世間真實的行相，世間一切真實的行相是苦的，你就偏偏不了解，覺得這是苦。那個苦呢是有它原因的，你又不了解，以為呀 ……找錯了非苦之因。譬如說，我們現在有苦了，應該了解這個苦的原因，從根本上面下手，但是我們平常都不知道的，平常都不知道的。假定我們知道苦的原因，人家來罵你一下的話，你一定忍受。為什麼？欸，他所以罵我，我總是以前欠了他，還了就好了嘛！但是實際上呢，我們不會。為什麼？因為我們不知道苦的原因，所以第二個，對這個事情的真相的因也不知道。同時呢，這流轉固然不知道啊，說它的的確確苦，也像你所希望的把它徹底地淨除，徹底地淨除有它徹底淨除的辦法，這個叫滅諦、道諦，這是我們更不知道！這個就是我們世間，偏偏講這個道理的人，我們還自作聰明，說這是迷信，世間真顛倒啊！「業果」那是由業感果，「三寶的自性」等等，這個不明了，這是種無知，這是錯誤的、染污的無知，就是愚癡。這個愚癡啊，染污、雜染的，所以啊生死的根本。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/019.mp3"},{"文":"疑者，謂緣諦等三法，«念其有耶無耶？是耶非耶？»","口譯":"疑，是緣四諦等三種法，心想：它是有呢、還是沒有？是對呢、還是不對？","四家合註":null,"覺燈日光":null,"時":"73A 11:50","頁":170,"af":"73a","st":710,"et":800,"消文":[{"文":"這是懷疑；疑的反面是信。"},{"類":"回扣","文":"貪、瞋、無明、疑、慢是五鈍使，下面是五利使；一個行相非常猛利，一個不猛利但深厚，這裡沒提先不談。"}],"延伸":[{"題":"念其有耶無耶","組":[{"題":"只是啟發了信的種子","說":[{"類":"破","文":"不要以為我們現在信了，信談不到；只是啟發了信的種子，正在這條路上走。"}]},{"題":"預流聖者不壞信","說":[{"類":"例","文":"證得預流果的聖者得不壞信，寧願餓死也不會造惡，因為曉得一定有因果關係，沒有一點懷疑。"}]},{"題":"講時有，做時忘","說":[{"類":"破","文":"我們儘管曉得因果，講的時候有，做的時候忘得乾乾淨淨；曉得不可以做，做的時候照做不誤。"},{"類":"回扣","文":"這都是信心未淨，疑在這裡。"}]}],"說":[{"類":"破","文":"不要以為我們現在信了，信談不到；只是啟發了信的種子，正在這條路上走。"},{"類":"例","文":"證得預流果的聖者得不壞信，寧願餓死也不會造惡，因為曉得一定有因果關係，沒有一點懷疑。"},{"類":"破","文":"我們儘管曉得因果，講的時候有，做的時候忘得乾乾淨淨；曉得不可以做，做的時候照做不誤。"},{"類":"回扣","文":"這都是信心未淨，疑在這裡。"}],"af":"73a","st":725}],"逐字稿":[{"t":"73A 11:50","b":[["q","疑者，謂緣諦等三法，念其有耶無耶？是耶非耶？"],["s","這個是懷疑，這個是懷疑。這個疑的反面是信，我們不要以為我們現在信了，我們信談不到哦！我們只是已經啟發了信的種子，正在這條路上去走。真正得到了淨信心的，譬如說：證得預流果的聖者叫不壞信，他那個信心就清淨了。他到那個時候一定寧願餓死，他不會造惡。他因為曉得這個一定有它的因果關係，他不會在那個果相上面，沒有一點懷疑。我們儘管曉得因果，講的時候有，做的時候忘得乾乾淨淨；曉得這個不可以做，做的時候又照做不誤，就是這樣。所以這種狀態啊，那都是什麼？這個信心未淨，這個疑在這裡。"]]},{"t":"73A 12:51","b":[["s","那麼這個就是通常我們所謂的五鈍使 ─貪、瞋、無明、疑、慢；下面叫五利使，通常我們說。為什麼叫鈍的、利的呢？因為這個行相非常地猛利；一個呢前面並不是很猛利，但是呢它很深厚，這個既然這裡沒提，我們先不去談它。那麼下面就是"]]}],"口譯音":"口譯音檔/siwei-kudi-08/020.mp3"},{"文":"壞聚見者，謂緣取蘊，計我我所，染慧為性，我我所見。","口譯":"壞聚見，是緣五取蘊，計執為我、我所，以染污慧為體性，就是我見、我所見。","四家合註":null,"覺燈日光":null,"時":"73A 13:20","頁":171,"af":"73a","st":800,"et":883,"消文":[{"文":"平常就說我見。實際上真的有我、我所嗎？沒有；原來只是取蘊：色受想行識五樣東西聚在一塊。"},{"文":"它在無常變壞當中，是虛假的；染慧是染污的認識，觀照的力量透過雜染看錯了，以為上頭有我、我所。"},{"類":"立","文":"平常一天到晚忙這個我，原來是壞聚；真正騙你的根本就在這裡。"}],"延伸":[],"逐字稿":[{"t":"73A 13:20","b":[["q","壞聚見者，"],["s","平常就說我見。"]]},{"t":"73A 13:24","b":[["q","謂緣取蘊，計我我所，染慧為性，我我所見。"],["s","那就是說，見到了「我」跟「我所」這個東西。那為什麼叫它「壞聚見」呢？實際上真的有我嗎？真的有我所嗎？沒有。原來這是什麼？這是聚、聚，「取蘊」或者是；這個蘊就是歸類，這個五樣東西聚在一塊，哪五樣東西啊？色、受、想、行、識。而這個東西在無常的變壞當中，它是虛假的，是一無可取的，結果因為我們「染慧」 ─染污的認識，慧是一種觀照的力量，這個觀照的力量透過了染污、雜染了，你看不清楚，看錯了，以為在這個上頭有一個我或者我所。所以我們另外的名字叫我、我所見，這個地方叫壞聚見。當你認識了這個東西以後，你就對這個東西，平常我們一天到晚忙這個我，原來這個是什麼 ─壞聚，真正騙你的根本就在這裡啊！"]]}],"口譯音":"口譯音檔/siwei-kudi-08/021.mp3"},{"文":"其中壞是無常，聚是眾多，為欲顯此所見之事，唯是無常，非一之法，«全無常一補特伽羅»，故為立名曰壞聚見。","口譯":"其中「壞」是無常，「聚」是眾多；為了顯示這所見的事，只是無常、非一的法，完全沒有常一的補特伽羅，所以立名為壞聚見。","四家合註":null,"覺燈日光":null,"時":"73A 14:43","頁":171,"af":"73a","st":883,"et":1105,"消文":[{"文":"壞是無常，聚是幾樣東西合起來；補特伽羅以前稱人、有情，在自己身上叫作我。"},{"類":"立","文":"一切的根本都從這個上頭來；無常早就了解，任何情況之下停不住它一剎那。"}],"延伸":[{"題":"全無常一補特伽羅","組":[{"題":"身心非一，手不是我","說":[{"類":"例","文":"手切斷了，你還是你，只少了一個手；「我的手」屬於你，不是你。"},{"類":"例","文":"腳、心臟如此；「我的心」，心也不是我，一樣的道理。"}]},{"題":"說作得了主，仍是被動","說":[{"類":"例","文":"我說你作不了主，你回答「我作得了」，這是被動的；主是主動，你完全在被動。"},{"類":"破","文":"在相對範圍之內有似是而非的作主，就像前面似是而非的安樂，這就是顛倒。"}]},{"題":"染慧如戴有色眼鏡","說":[{"類":"喻","文":"戴了黃顏色眼鏡，白的看成黃的；戴了紅的看成紅的。染慧所見就是這樣。"}]}],"說":[{"類":"例","文":"手切斷了，你還是你，只少了一個手；「我的手」屬於你，不是你。"},{"類":"例","文":"腳、心臟如此；「我的心」，心也不是我，一樣的道理。"},{"類":"例","文":"我說你作不了主，你回答「我作得了」，這是被動的；主是主動，你完全在被動。"},{"類":"破","文":"在相對範圍之內有似是而非的作主，就像前面似是而非的安樂，這就是顛倒。"},{"類":"喻","文":"戴了黃顏色眼鏡，白的看成黃的；戴了紅的看成紅的。染慧所見就是這樣。"}],"af":"73a","st":958}],"逐字稿":[{"t":"73A 14:43","b":[["q","其中壞是無常，聚是眾多，為欲顯此所見之事，唯是無常，非一之法，全無常一補特伽羅，故為立名曰壞聚見。"],["s","那麼就解釋一下。為什麼是「壞」呢？無常呀！「聚」是幾樣東西合起來。就是我們這個染慧所見的東西，它是「無常」的，是「非一」的，全沒有常一的補特伽羅。「補特伽羅」我們以前稱為人、有情，就這樣。這個人跟有情在自己身上叫作我，就這個地方立為壞聚見，一切的根本都從這個上頭來的，一切的根本都從這個上頭來的。它既無常，也非一，所謂「一」的話，什麼？我們總覺得好像「我」這個東西就是我，天生來如此，獨立的，就是，實際上不是。而且我還有一個特質是可以主宰的，這種東西全沒有，我們以前都討論過。無常，早就了解，在任何情況之下，你沒有辦法停住它一分、一秒、一剎那。"]]},{"t":"73A 15:58","b":[["s","至於這「一」，就是一跟異是相對的，實際上你真正是一嗎？不是！身、心兩個很明白。如果是一的話，說你那個手，這個手算是你，還是不是你啊？如果說是一的話，那的的確確這個手，你跟手分不開；如果那個手切斷掉了，對不起！你還是你，好好的，只是你少掉了一個手，可想而知這個不是，實際上狀態。同樣理論上面，如果「你的手」或者「我的手」，不要說「我的」、「你的」，屬於你的，那不是你，不是很明白嗎？所以這也不是一。那麼手是如此，腳也是如此，乃至於心臟也可以如此，就是這個樣子。那我的心呢，應該是我吧？同樣的說「我的心」，那是「我的心」哦，心不是我耶，一樣的道理，這個很清楚、很明白。"]]},{"t":"73A 16:56","b":[["s","然後你能作得了主嗎？那我們已經討論過了，現在談到這問題，又再說一下。我說我啊，不妨我們對白，譬如我們兩人談論，我說：「你作不了主。」你想了半天：「對呀！我是作不了主。」那當然作不了主。也許有人不服氣，說：「不！我作得了主。」當你說你作得了主的時候，你是什麼啊？因為我說你作不了，所以你回答我，說你能作得了主，你這是被動的，對不對？我說你這樣，「欸，我說我這樣。」這你被動的，請問你被動的，這是算「主」嗎？主是什麼啊？主是主動耶，你完全在被動耶！所以你說：「我是作不了。」那麼當然已經作不了。結果你說：「我作得了。」你還是作不了。人就是這麼顛倒啊！這樣。但是呢他的的確確在他相對的範圍之內，是有他似是而非的這種作主，就好像前面說似是而非的那個安樂在，這個就叫作顛倒啊！所以叫染慧。所以他那個觀照的能力，由染污所看見的，所以戴了個有色眼鏡，明明是白的，他看起來戴了個黃顏色就看成黃的，戴了紅顏色就看成紅的，就這樣。這個就是壞聚見。"]]}],"口譯音":"口譯音檔/siwei-kudi-08/022.mp3"}],"投影片":[{"img":"投影片/siwei-kudi-08/001.webp","n":1},{"img":"投影片/siwei-kudi-08/002.webp","n":2,"yt":"oVynEvkuj4M"},{"img":"投影片/siwei-kudi-08/003.webp","n":3,"yt":"9hFq1l8RoUM"},{"img":"投影片/siwei-kudi-08/004.webp","n":4},{"img":"投影片/siwei-kudi-08/005.webp","n":5},{"img":"投影片/siwei-kudi-08/006.webp","n":6},{"img":"投影片/siwei-kudi-08/007.webp","n":7},{"img":"投影片/siwei-kudi-08/008.webp","n":8,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=72b&st1=809&et1=993","box":[0.133625,0.3091111111111111,0.13775,0.07733333333333334]}],"photo":[0.5375,0.06666666666666667,0.4321917445866142,0.8076115485564305]},{"img":"投影片/siwei-kudi-08/009.webp","n":9},{"img":"投影片/siwei-kudi-08/010.webp","n":10},{"img":"投影片/siwei-kudi-08/011.webp","n":11,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=gl1&af1=72b&st1=993&et1=1155","box":[0.534875,0.2791111111111111,0.1265,0.064]}],"photo":[0.05,0.16666666666666666,0.365625,0.7833333333333333]},{"img":"投影片/siwei-kudi-08/012.webp","n":12},{"img":"投影片/siwei-kudi-08/013.webp","n":13,"links":[{"t":"音檔連結","url":"https://lamrim.xyz/player2/?&tch=g const LOOP_GAP=5;
function loopAgain(){
  const aud=$("#aud");if(P.waiting)return;
  aud.pause();aud.currentTime=P.st;P.waiting=true;
  let g=$("#gapaud");if(!g){g=document.createElement("audio");g.id="gapaud";g.preload="auto";g.src="音檔/silence-5s.mp3";document.body.appendChild(g);
    g.addEventListener("ended",()=>{if(!P.waiting)return;P.waiting=false;clearInterval(P.waitT);if(P.loop)$("#aud").play().catch(()=>{})})}
  g.currentTime=0;
  g.play().then(()=>{const tm=$("#plTime");clearInterval(P.waitT);P.waitT=setInterval(()=>{if(!P.waiting){clearInterval(P.waitT);return}
      if(tm)tm.textContent=`${Math.max(1,Math.ceil(LOOP_GAP-g.currentTime))} 秒後重播`},250)})
   .catch(()=>{P.waiting=false;if(P.loop)setTimeout(()=>aud.play().catch(()=>{}),LOOP_GAP*1000)});   // 無聲檔播不了就退回計時
}
function cancelLoopWait(){if(P.waiting){P.waiting=false;clearInterval(P.waitT);const g=$("#gapaud");if(g)g.pause()}}
function playPrevSeg(){
  const L=S.lesson;if(P.lid!==L.id||P.seg==null||P.seg<=0)return false;
  const i=P.seg-1,s=L.段[i];P.seg=i;P.switching=true;setTimeout(()=>P.switching=false,800);

}
function mediaMeta(title,album){

  try{navigator.mediaSession.metadata=new MediaMetadata({...base,artwork:[{src:new URL("icons/icon-192.png",location.href).href,sizes:"192x192",type:"image/png"},{src:new URL("icons/icon-512.png",location.href).href,sizes:"512x512",type:"image/png"}]})}
  catch(e){try{navigator.mediaSession.metadata=new MediaMetadata(base)}catch(_){}}   // 單機開檔時圖示網址不合法，就不帶圖
}
// 鎖定畫面的按鈕要控制「正在播的那一個」：師父音檔或口譯朗讀
function bindMediaSession(){

  const ms=navigator.mediaSession,act=()=>{const k=$("#kyaud");return k&&!k.paused||(k&&K.playing)?"ky":"main"};
  const h=(name,fn)=>{try{ms.setActionHandler(name,fn)}catch(e){}};
  h("play",()=>{(act()==="ky"?$("#kyaud"):$("#aud")).play().catch(()=>{})});
  h("pause",()=>{$("#aud").pause();const k=$("#kyaud");if(k)k.pause()});
  h("nexttrack",()=>{if(act()==="ky")kyNext();else playNextSeg()});
  h("previoustrack",()=>{if(act()==="ky"){if(K.i>0)kyStart(K.i-1)}else playPrevSeg()});
  h("seekto",d=>{const a=act()==="ky"?$("#kyaud"):$("#aud");if(d&&d.seekTime!=null)a.currentTime=d.seekTime});
}
function playNextSeg(){
  const L=S.lesson;if(P.lid!==L.id||P.seg==null)return false;
  const i=P.seg+1;if(i>=L.段.length){toast("這堂課的音檔播完了");return false}

// 投影片上的迷你播放鈕：跟著師父音檔的狀態
function pvAudUI(){

function bindPlayer(){

    if(!P.usingRemote&&P.af){P.usingRemote=true;const st=P.st;aud.src=audioSrc(P.af,true);aud.onloadedmetadata=()=>{aud.onloadedmetadata=null;aud.currentTime=st;aud.play().catch(()=>{})};aud.load();toast("本機沒有音檔，改從網路播放")}

  $("#plCont").onclick=()=>{P.cont=!P.cont;if(P.cont)P.loop=false;syncPM();toast(P.cont?"連續播放：播完接下一段":"連續播放：關")};
  $("#ppBtn").onclick=()=>{if(P.waiting){cancelLoopWait();$("#aud").play().catch(()=>{});return}if(aud.paused){if(P.et!=null&&aud.currentTime>=P.et-0.3)aud.currentTime=P.st;aud.play().catch(()=>{})}else aud.pause()};
  $("#plClose").onclick=()=>{cancelLoopWait();aud.pause();$("#player").hidden=true};
  $("#plBar").onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),end=P.et??aud.duration;if(!end)return;aud.currentTime=P.st+(e.clientX-r.left)/r.width*(end-P.st);if(aud.paused)aud.play().catch(()=>{})};
  document.addEventListener("click",e=>{const t=e.target.closest("button.play-ts");if(t){P.seg=S.seg;P.lid=S.lesson.id;playSeg(t.dataset.af,+t.dataset.st,t.dataset.et,"逐字稿");return}const b=e.target.closest("button.play");if(!b)return;e.stopPropagation();P.seg=b.dataset.seg!=null?+b.dataset.seg:S.seg;P.lid=S.lesson.id;playSeg(b.dataset.af,+b.dataset.st,b.dataset.et,b.dataset.t)});
}
const durTxt=(st,et)=>{if(et==null||et==="")return"";const d=Math.max(0,(+et)-st);return d>=60?`${Math.floor(d/60)}分${String(d%60).padStart(2,"0")}秒`:`${d}秒`};
const rangeTxt=(af,st,et)=>`${af.toUpperCase()} ${mmss(st)}`+(et!=null&&et!==""?`～${mmss(+et)}・${durTxt(st,et)}`:" 起・播到卷尾");
const segRange = s=>`${s.af.toUpperCase()} ${mmss(s.st)}`+(s.et!=null?`～${mmss(s.et)}`:" 起");

// ───────── 科判樹 ─────────
const groupsOf=y=>y.組&&y.組.length?y.組:[{題:null,說:y.說||[]}];
function chars(text){const out=[];let red=false;for(const ch of text){if(ch==="«")red=true;else if(ch==="»")red=false;else out.push([ch,red])}return out}
function cols(cs,cap){const out=[];let i=0;while(i<cs.length){let j=Math.min(i+cap,cs.length);while(j<cs.length&&NO_HEAD.has(cs[j][0]))j++;out.push(cs.slice(i,j));i=j}return out}
function Node(lv,text,o={}){
  const c=LV[lv],n={lv,kids:[],...o};
  n.size=c.size;n.pitch=c.size*c.pitch;n.cols=cols(chars(text),c.cap);
  n.tagS=lv===3?Math.round(n.size*.7):n.size-2;
  n.tagH=n.tag?n.tag.length*n.tagS+14:0;
  n.bw=n.cols.length*n.pitch;n.bh=n.tagH+Math.max(...n.cols.map(c=>c.length))*n.size;
  return n;
}
function width(n){if(!n.kids.length)return n.bw;const g=LV[n.kids[0].lv].gap;
  return Math.max(n.bw,n.kids.reduce((a,k)=>a+width(k),0)+g*(n.kids.length-1))}
function buildTree(L,{xw,from=0,to=L.段.length-1}){
  const root=Node(1,L.根);
  L.段.forEach((s,i)=>{
    if(i<from||i>to)return;
    const n2=Node(2,s.文,{s:i,time:s.時});
    if(xw&&s.消文.length){const n3=Node(3,"消文",{kind:"xw",s:i});
      s.消文.forEach((x,k)=>n3.kids.push(Node(5,x.文,{tag:x.類,s:i,xi:k})));n2.kids.push(n3)}
    s.延伸.forEach((y,yi)=>{const n3=Node(3,"«"+y.題+"»",{tag:y.複習?"複習":"延伸",kind:"ys",s:i,yv:yi});
      groupsOf(y).forEach(g=>{let host=n3;
        if(g.題){host=Node(4,g.題,{kind:"grp",s:i,yv:yi});n3.kids.push(host)}
        g.說.forEach((x,k)=>host.kids.push(Node(5,x.文,{tag:x.類,s:i,yv:yi,k})))});
      n2.kids.push(n3)});
    root.kids.push(n2);
  });
  return root;
}
function layout(root){
  const h={};(function w(n){h[n.lv]=Math.max(h[n.lv]||0,n.bh);n.kids.forEach(w)})(root);
  const tops={};let y=MARGIN;Object.keys(h).sort().forEach(lv=>{tops[lv]=y;y+=h[lv]+ROW_GAP});
  const W=width(root)+MARGIN*2+40,H=y-ROW_GAP+MARGIN;
  (function place(n,right){n.x1=right;n.y=tops[n.lv];n.ax=right-n.pitch/2;
    if(n.kids.length){const g=LV[n.kids[0].lv].gap;
      // 最右邊的子節點對齊父節點的接線點，直線才不會拐一下
      let r=n.ax+n.kids[0].pitch/2;for(const k of n.kids){place(k,r);r-=width(k)+g}}})(root,W-MARGIN);
  return {root,W,H,tops};
}
function walk(n,f){f(n);n.kids.forEach(k=>walk(k,f))}
function glyphs(n,f){n.cols.forEach((col,ci)=>{const cx=n.x1-n.pitch*(ci+.5);col.forEach(([ch,red],i)=>f(VERT[ch]||ch,cx,n.y+n.tagH+(i+.5)*n.size,red))})}
function lines(lay,f){
  (function go(n){if(!n.kids.length)return;const bar=lay.tops[n.kids[0].lv]-BAR_DROP,xs=n.kids.map(k=>k.ax).concat(n.ax);
    const fc=n.tagH+n.cols[0].length*n.size, sg=n.lv===1?null:n.s;
    f(n.ax,n.y+fc+6,n.ax,bar,sg,n);f(Math.min(...xs),bar,Math.max(...xs),bar,sg,n);
    n.kids.forEach(k=>{f(k.ax,bar,k.ax,k.y-6,k.lv===2?k.s:sg,k);go(k)})})(lay.root);
}
// 整節時：每堂第一段的右側畫分隔，回傳 (x, 上緣, 下緣, 標籤, 是否第一堂)
function lessonMarks(lay,f){
  const L=S.lesson;if(!L||!L.isNode)return;
  walk(lay.root,n=>{if(n.lv!==2)return;const sg=L.段[n.s];if(!sg||sg.ls!==0)return;
    const first=n.s===lay.root.kids[0].s;
    f(n.x1+(first?0:LV[2].gap/2),lay.tops[2]-BAR_DROP-34,lay.H-20,`第${sg.堂}堂`,first)});
}
function tagColor(t){return t==="延伸"?"zhu":t==="複習"?"t-rev":"t-"+(TAGKEY[t]||"hui")}

// SVG：畫面版用 CSS 變數（跟著深淺色），匯出版寫死淺色
function svgOf(lay,{exp=false,caption=""}={}){
  const C=k=>exp?LIGHT[k]:`var(--${k})`;const o=[];
  const H=lay.H+(caption?40:0);
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" ${exp?"":'id="tree" '}width="${lay.W}" height="${H}" viewBox="0 0 ${lay.W} ${H}">`);
  if(exp)o.push(`<rect width="100%" height="100%" fill="${LIGHT.paper}"/>`);
  o.push(`<g id="treeg" font-family='${KAI}'>`);
  lessonMarks(lay,(x,y1,y2,label,first)=>{
    if(!first)o.push(`<line x1="${x.toFixed(1)}" y1="${y1}" x2="${x.toFixed(1)}" y2="${y2}" style="stroke:${C("zhu")};stroke-width:1.4;stroke-dasharray:7 6;opacity:.55"/>`);
    o.push(`<text x="${(x-8).toFixed(1)}" y="${y1+16}" font-size="17" text-anchor="end" style="fill:${C("zhu")}" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">${esc(label)}</text>`)});
  lines(lay,(x1,y1,x2,y2,sg)=>o.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"`+
    (exp?` stroke="${LIGHT.line}" stroke-width="1.5"`:(sg!=null?` data-s="${sg}"`:""))+`/>`));
  walk(lay.root,n=>{
    const cls=["n","lv"+n.lv];if(n.lv===5)cls.push("t-"+(TAGKEY[n.tag]||"none"));
    o.push(exp?"<g>":`<g class="${cls.join(" ")}"${n.s!=null?` data-s="${n.s}"`:""}${n.yv!=null?` data-y="${n.yv}"`:""}>`);
    if(!exp&&n.lv>1)o.push(`<rect class="hit" x="${(n.x1-n.bw-6).toFixed(1)}" y="${(n.y-8).toFixed(1)}" width="${(n.bw+12).toFixed(1)}" height="${(n.bh+16).toFixed(1)}" rx="6"/>`);
    if(n.kind==="xw"){const w=n.size+14;o.push(`<rect x="${(n.ax-w/2).toFixed(1)}" y="${n.y-8}" width="${w}" height="${n.bh+16}" rx="4" fill="none" stroke="${C("gold")}" stroke-width="1.6"/>`)}
    if(n.tag){const t=n.tagS,w=t+6,h=n.tag.length*t+8;
      o.push(`<rect x="${(n.ax-w/2).toFixed(1)}" y="${n.y}" width="${w}" height="${h}" rx="4" style="fill:${C(tagColor(n.tag))}"/>`);
      [...n.tag].forEach((ch,i)=>o.push(`<text x="${n.ax.toFixed(1)}" y="${(n.y+4+t*(i+.5)).toFixed(1)}" font-size="${t}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="${exp?"Noto Sans TC, Microsoft JhengHei, sans-serif":"var(--f-ui)"}">${esc(ch)}</text>`))}
    if(n.kind==="grp")o.push(`<line x1="${(n.ax-n.size*.45).toFixed(1)}" y1="${n.y-6}" x2="${(n.ax+n.size*.45).toFixed(1)}" y2="${n.y-6}" style="stroke:${C("zhu")};stroke-width:2"/>`);
    const base=n.kind==="xw"?C("gold"):n.kind==="grp"?C("ink-2"):C("ink");
    o.push(`<text font-size="${n.size}" text-anchor="middle" dominant-baseline="central"${n.lv===1?' font-weight="700"':""} style="fill:${base}">`);
    glyphs(n,(ch,x,y,red)=>o.push(`<tspan x="${x.toFixed(1)}" y="${y.toFixed(1)}"${red?` style="fill:${C("zhu")}"`:""}>${esc(ch)}</tspan>`));
    o.push(`</text>`);
    if(n.time&&!exp){const sg=S.lesson.段[n.s];o.push(`<title>${segName(S.lesson,n.s)}・${esc(segRange(sg))}${sg.頁?"・課本 p"+sg.頁:""}</title>`)}
    o.push("</g>");
  });
  o.push("</g>");
  if(caption)o.push(`<text x="${MARGIN}" y="${H-28}" font-size="18" fill="${LIGHT["ink-3"]}" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">${esc(caption)}</text>`);
  o.push("</svg>");return o.join("");
}

// ───────── 畫主圖 ─────────
function renderTree(keepScroll){
  const L=S.lesson,wrap=$("#treewrap");
  const prevRight=keepScroll?wrap.scrollWidth-wrap.scrollLeft:null;
  const root=buildTree(L,{xw:S.xw});
  const lay=layout(root);S.laid=lay;
  wrap.innerHTML=svgOf(lay);
  applyScale();
  // 縮圖：只畫方塊（原文灰、延伸朱、引導淡），不畫字
  const mb=[];walk(lay.root,n=>{if(n.lv<2)return;const f=n.kind==="ys"?"var(--zhu)":n.kind==="xw"?"var(--gold)":n.lv===2?"var(--ink-3)":"var(--rule)";

}
function applyScale(){

  $("#zFit").textContent=Math.round(S.scale*100)+"%";
}
function paintState(){
  const svg=$("#tree");if(!svg)return;
  svg.querySelectorAll(".n").forEach(g=>{
    const s=+g.dataset.s,isL2=g.classList.contains("lv2");
    g.classList.toggle("sel",isL2&&s===S.seg);

  });

function scrollToSeg(i,smooth=true){
  const wrap=$("#treewrap"),lay=S.laid;if(!lay||!wrap.clientWidth)return;
  let n=null;walk(lay.root,x=>{if(x.lv===2&&x.s===i)n=x});if(!n)return;

function yGroups(y){

async function toPng(lay,cap){
  const sc=2,H=lay.H+40,cv=document.createElement("canvas");cv.width=lay.W*sc;cv.height=H*sc;
  const ctx=cv.getContext("2d");ctx.scale(sc,sc);
  let all="";walk(lay.root,n=>n.cols.forEach(c=>c.forEach(([ch])=>all+=VERT[ch]||ch)));
  try{await Promise.all([26,21,30,46].map(z=>document.fonts.load(`${z}px "LXGW WenKai TC"`,all)))}catch(e){}
  ctx.fillStyle=LIGHT.paper;ctx.fillRect(0,0,lay.W,H);
  ctx.strokeStyle=LIGHT.line;ctx.lineWidth=1.5;
  lines(lay,(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()});
  lessonMarks(lay,(x,y1,y2,label,first)=>{ctx.save();ctx.strokeStyle=LIGHT.zhu;ctx.globalAlpha=.55;ctx.setLineDash([7,6]);
    if(!first){ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke()}ctx.restore();
    ctx.save();ctx.fillStyle=LIGHT.zhu;ctx.font='17px "Noto Sans TC",sans-serif';ctx.textAlign="right";ctx.textBaseline="alphabetic";ctx.fillText(label,x-8,y1+16);ctx.restore()});
  ctx.textAlign="center";ctx.textBaseline="middle";
  walk(lay.root,n=>{
    if(n.kind==="xw"){const w=n.size+14;ctx.strokeStyle=LIGHT.gold;ctx.lineWidth=1.6;rr(ctx,n.ax-w/2,n.y-8,w,n.bh+16,4);ctx.stroke()}
    if(n.tag){const t=n.tagS,w=t+6,h=n.tag.length*t+8;ctx.fillStyle=LIGHT[tagColor(n.tag)];rr(ctx,n.ax-w/2,n.y,w,h,4);ctx.fill();
      ctx.fillStyle="#fff";ctx.font=`500 ${t}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;[...n.tag].forEach((ch,i)=>ctx.fillText(ch,n.ax,n.y+4+t*(i+.5)))}
    if(n.kind==="grp"){ctx.strokeStyle=LIGHT.zhu;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(n.ax-n.size*.45,n.y-6);ctx.lineTo(n.ax+n.size*.45,n.y-6);ctx.stroke();ctx.strokeStyle=LIGHT.line;ctx.lineWidth=1.5}
    ctx.font=`${n.lv===1?"700 ":""}${n.size}px ${KAI}`;
    glyphs(n,(ch,x,y,red)=>{ctx.fillStyle=red?LIGHT.zhu:(n.kind==="xw"?LIGHT.gold:n.kind==="grp"?LIGHT["ink-2"]:LIGHT.ink);ctx.fillText(ch,x,y)});

  });
  ctx.textAlign="left";ctx.font='18px "Noto Sans TC","Microsoft JhengHei",sans-serif';ctx.fillStyle=LIGHT["ink-3"];ctx.fillText(cap,MARGIN,H-34);
  return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("圖太大，請改選較小的區段")),"image/png"));
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

  if(id&&id.startsWith("n-")){const b=S.lessons[id.slice(2)];return b?buildNode(b.科判焦點):null}return S.lessons[id]||null}
// 段的稱呼：整節時加上堂數
function segName(L,i){const s=L.段[i];return L.isNode?`第${s.堂}堂・第 ${s.ls+1} 段`:`第 ${i+1} 段`}
function lessonInfoTxt(L){return L.isNode?`${L.根}・整節・第${L.堂數}堂・${L.課本範圍.replace(" ~ ","～")}`:`${L.標題}・第${L.堂數}堂（第${L.週}週）・${L.課本範圍.replace(" ~ ","～")}・${L.日期}`}
function parseHash(){const m=location.hash.match(/^#([a-z0-9-]+?)-s(\d+)$/);return m&&getLesson(m[1])?{id:m[1],seg:+m[2]-1}:null}
function fromHash(){const h=parseHash();if(!h)return;if(h.id!==S.lesson.id)loadLesson(h.id,h.seg);else if(h.seg!==S.seg)selectSeg(h.seg)}
function loadLesson(id,seg=0,yan=null){
  const L=getLesson(id);if(!L)return;
  S.lesson=L;S.seg=Math.min(L.段.length-1,Math.max(0,seg));S.yan=yan;S.range=null;
  $("#lessonInfo").textContent=lessonInfoTxt(L);
  document.title=`${L.標題}・步步依師`;
  renderMap();renderTree();renderDetail();renderOutline();
  requestAnimationFrame(()=>{const w=$("#treewrap");w.scrollLeft=w.scrollWidth;scrollToSeg(S.seg,false);updateMini()});
  try{history.replaceState(null,"","#"+L.id+"-s"+(S.seg+1))}catch(e){}
  store("kp.last",L.id);
}

// ───────── 啟動 ─────────
async function start(){
  bind();bindPlayer();bindSplit();bindMediaSession();
  try{
    const emb=document.getElementById("kpdata");
    if(emb){const D=JSON.parse(emb.textContent);S.kepan=D.kepan;S.index=D.index;S.lessons=D.lessons;S.課表=D.課表||{}}
    else{
      const [kp,idx]=await Promise.all([fetch("data/kepan.json").then(r=>r.json()),fetch("data/index.json").then(r=>r.json())]);
      S.kepan=kp;S.index=idx;
      S.lessons={};for(const x of idx)S.lessons[x.id]=await fetch(`data/lessons/${x.id}.json`).then(r=>r.json());
    }
  }catch(e){$("#side").innerHTML=`<p>資料載入失敗：${esc(e.message)}。重新整理一次試試。</p>`;return}
  const hh=parseHash(),last=store("kp.last");
  S.lesson=getLesson(hh?hh.id:(last&&getLesson(last)?last:S.index.at(-1).id));
  const L=S.lesson;document.title=`${L.標題}・步步依師`;
  $("#lessonInfo").textContent=lessonInfoTxt(L);
  S.mapAll=store("kp.mapAll")==="1";S.kyOrig=store("kp.kyOrig")==="1";K.rate=+(store("kp.kyRate")||1)||1;
  const sx=store("kp.xw");if(sx!=null)S.xw=sx==="1";syncLayer();
  const m=hh;if(hh)S.seg=Math.min(L.段.length-1,Math.max(0,hh.seg));else S.seg=0;
  renderMap();renderTree();renderDetail();renderOutline();
  const firstScroll=()=>{const w=$("#treewrap");w.scrollLeft=w.scrollWidth;scrollToSeg(S.seg,false);updateMini()};
  requestAnimationFrame(firstScroll);setTimeout(firstScroll,250);setTimeout(firstScroll,800);
  try{document.fonts.ready.then(()=>setTimeout(firstScroll,50))}catch(e){}
  if(m&&isMobile()){setM("outline");setTimeout(()=>$("#oc"+S.seg)?.scrollIntoView({block:"start"}),120)}
  try{downloads=window.claude?.use?await window.claude.use("downloads"):null}catch(e){downloads=null}
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&!window.claude){
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!S.reloaded){S.reloaded=true;location.reload()}});   // 新版接手就換成新版
  }
}
start();
</script>
